<script>
"use strict";
/* ============ 音效 ============ */
const Sound = (() => {
  let ctx=null,on=true;
  const ensure=()=>{if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ctx};
  const beep=(f=440,d=.08,t="sine",v=.06)=>{if(!on)return;const c=ensure();if(!c)return;
    if(c.state==="suspended")c.resume();
    const o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.value=f;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(v,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02)};
  return{
    click(){beep(520,.05,"triangle",.05)},
    dice(){beep(300,.06,"square",.04);setTimeout(()=>beep(400,.06,"square",.04),70)},
    ok(){beep(660,.1,"sine",.07);setTimeout(()=>beep(880,.14,"sine",.07),90)},
    bad(){beep(180,.16,"sawtooth",.07);setTimeout(()=>beep(120,.22,"sawtooth",.07),100)},
    secret(){beep(880,.08,"sine",.05);setTimeout(()=>beep(1100,.08,"sine",.05),80);setTimeout(()=>beep(1320,.14,"sine",.05),160)},
    toggle(){on=!on;if(on){ensure();beep(700,.08,"sine",.06)}return on},
	resume(){const c=ensure();if(c&&c.state==="suspended")c.resume();}
  }
})();

/* ============ 章節資料（1~300） ============ */
const C={
1:{t:`維爾瑪餐廳是阿卡姆鎮頗受歡迎的聚集地。透過窗戶，餐廳外的世界裡，太陽正緩緩沉向阿卡姆西邊杉樹成林的群山。是時候離開了。

一聲抬高的嗓音吸引了你的注意，你的目光落在卡座裡的一對老年男女身上。男人留著花白的鬍子，女人身形瘦削，頭髮尖刺豎起。兩人激烈爭執。一隻蒼蠅在桌上爬來爬去，女人突然一巴掌拍在蒼蠅身上。男人低聲回了句什麼，女人抽回手，眨眼間將手指湊到唇邊——彷彿將什麼東西送進了嘴裡。但當你再看向桌子時，那隻蒼蠅已經消失了。

女人突然站起身，怒氣沖沖地走出餐廳。男人將一張揉皺的美元放在桌上，也跟了出去。

直到這對男女離開，你才注意到，他們坐的卡座旁的地上，掉著一個筆記本。你蹲下身子，撿起了【布萊恩博士的筆記本】。快速翻了翻，書頁上寫滿了手寫的筆記，所用的文字你完全不認識。`,
o:[["若你想花點時間仔細研究這個筆記本，翻到第45章",45],
   ["若你想離開餐廳，追上那兩位學者，將筆記本物歸原主，翻到第75章",75]],
give:["NOTEBOOK"]},

2:{t:`哎呀，看來你闖入了不該去的地方。這本書的正確玩法，是根據你的選擇和書中的指引，在不同章節間跳轉。

不過，還是獎勵你兩個秘密線索吧。`,
sec:["迷失阿卡姆","古神的秘密"],
o:[["返回第1章",1]]},

3:{t:`你似乎走進了死胡同。你完全不知道該去哪裡尋找更多線索，布萊恩博士的命運之謎，將永遠成為一個謎。

你內心惴惴不安，因為你從心底裡知道，一片巨大的黑暗正籠罩著阿卡姆，無人能逃脫它的陰影。`,
sec:["黑暗預兆"],end:{stars:0,title:"無盡的陰影"}},

4:{t:`你朝護士喊道，問她能否幫忙。「我能為你做些什麼？」她問道。

「我想知道布萊恩博士是不是已經被送過來了。」

「應該是來了。」女人說，「他就在裡面。」她朝你身後的門點了點頭。

她猶豫了一下，答道：「露絲·特納。」

她回到擔架旁，繼續往前走，轉過一個拐角便消失了。

就在這時，你注意到地上掉著一個【腳牌】。撿起來一看，上面寫著「無名氏」。`,
sec:["殯葬師"],give:["TOE_TAG"],
o:[["將腳牌記錄在角色表，翻到第36章",36]]},

5:{t:`你和警察交談時，警長下達了指令。你壯著膽子問警長發生了什麼。

「很遺憾地告訴你，三樓的一間辦公室裡發現了一具屍體，這起案件現已定性為凶殺案。」

果然如你所料。筆記本的主人布萊恩博士，被你之前對抗的那個怪物殺害了。

看著口袋裡的筆記本，你不禁懷疑，布萊恩博士是不是因為這本筆記才被殺的。`,
o:[["若你想去上城的魔法老店，翻到第171章",171],
   ["若你想在遠處觀察密斯卡托尼克大學這邊的事態發展，翻到第41章",41]]},

6:{t:`你再次思索這段預言的含義。「當月亮在黑暗中消逝」——「一位新神即將崛起」——「三者擇一，終獲至寶」。

你不禁懷疑，是否有三個派系在推動這段預言成真。

既然布萊恩博士已經遇害，若想查清他的真正死因，你需要調查他的兩位對手：尼德斯教授和沃醫生。`,
sec:["隱藏的肆象"],
o:[["若你想調查尼德斯教授，翻到第125章",125],
   ["若你想了解更多關於沃醫生的信息，翻到第155章",155]]},

7:{t:`你仔細查看了日期列表，還有一本攤開的書，書頁上滿是關於月球運行軌道的圖表。你很快意識到，這些文件的主人計算出，今晚將出現月食。`,
fx:{c:1},o:[["翻到第170章",170]]},

8:{t:`你更加用力地搖晃門把手，看到裡面卡著一根圓柱形的木頭。看起來有人用掃帚桿穿過門把手和牆對面的掛鉤，把門反鎖了。`,
o:[["若你擁有【骨鋸】，翻到第295章",295,{has:"BONESAW"}],
   ["若沒有，翻到第270章",270]]},

9:{t:`你回過神時，震驚地猛地合上書。你聽到了蟋蟀的鳴叫聲——聲音竟來自你身後牆上的展示櫃裡。

一隻巨大的玫瑰金龜子展開的翅膀微微顫動。餘光中，另一隻翠綠色麗蠅也做出了同樣的動作。

當恐懼壓過懷疑，好奇便轉化為了驚駭。`,
test:{n:"恐慌測試",s:"wp",d:1,p:{HAUNTED:-1},c:"res",need:9,ok:43,ng:22}},

10:{t:`你小心翼翼地走近屍體，男人一動不動。你鼓起勇氣，將指尖按在他的脖子上。皮膚冰冷而黏膩，你感受不到絲毫不脈搏。

你覺得自己或許已經幫不了這個男人了，但或許可以去尋求幫助。`,
o:[["若你想去尋求幫助，翻到第28章",28],
   ["若你想走到敞開的窗邊看看，翻到第52章",52]]},

11:{t:`閃爍的街燈指引著你，來到一座殖民風格的巨大宅邸前。門口的牌匾上寫著「阿巴頓府」。宅邸坐落在一片廣闊的土地上，一道濃密的紫杉樹籬將其與道路隔開。`,
sec:["玖號地點"],
o:[["若你想走近正門，翻到第18章",18],
   ["若你想悄悄繞到房子側面，翻到第120章",120]]},

12:{t:`你將建築藍圖鋪在園丁的平面圖上，發現一條表面通往冰庫的隧道，實則還連接著房子下方的酒窖。

你們穿過房子後方的果園，走進冰庫隧道的磚砌入口。隧道很窄，僅容一人單行。若你有弱點{幽閉恐懼症}，意志力-1。

通道盡頭被一道生鏽的鐵門擋住。布萊恩博士按住你的肩膀：「你必須打破保護這裡的超自然屏障。拿出那把刀。」

你們終於進入了酒窖，穿過一扇木門，便來到了食品儲藏室。`,
sec:["隱藏的柒號"],
o:[["若你想仔細查看食品儲藏室裡的東西，翻到第35章",35],
   ["若你想繼續前行，翻到第54章",54]]},

13:{t:`一聲尖叫從站在石質高台上的女人口中傳出。透過溫室的玻璃屋頂，夜空萬里無雲，圓月高懸。但地球的陰影正緩緩爬上月球表面。

有什麼東西正穿過夜色，朝阿巴頓府逼近。從最基本的外形來看，牠像一隻鳥，翅膀巨大無比，嘴則是一張巨大的血盆大口。

「是沃醫生，」布萊恩博士嘶聲說道，「他也沒閒著。」

當地球完全擋住太陽光，天空變成了一個真正的黑洞——一道巨大的傳送門。大門內，一隻長著利爪、有著無數腫脹巨口和數不清眼睛的存在，正從星際迷霧中緩緩浮現。`,
test:{n:"自控測試",s:"wp+san",d:1,c:"res",need:10,ok:292,ng:37}},

14:{t:`沃醫生的辦公室裡空無一人，你能想到的，唯一能找到他的地方，就是天文台本身，但你已經去過那裡了。`,
o:[["若你想穿過大樓，回到發現鑰匙的地方，翻到第170章",170],
   ["若你想離開沃倫天文台，翻到第140章",140]]},

15:{t:`你們繞到房子側面，砸碎窗戶爬進屋。突然，一陣憤怒的嗡嗡聲讓你察覺到了牠們的存在。兩隻巨大而醜陋的昆蟲朝你俯衝而來，門楣上爬滿了夢魘般的甲蟲狀胡蜂。

「三顎蜂。」布萊恩博士低聲說道。「我們必須從這裡進去，但我們免不了一場惡戰。」`,
combat:{res:true,onlyCostRound:2,
 prep:"三輪皆為 2d6 + 戰鬥值。每輪若你有{恐蟲症}，點數-2。只有第三輪開始前，你可以消耗1點資源，為本輪總點數+2。",
 rounds:[
  {d:2,s:"com",p:{FEAR_INSECTS:-2},need:15,label:"第一輪"},
  {d:2,s:"com",p:{FEAR_INSECTS:-2},prev:2,need:15,label:"第二輪"},
  {d:2,s:"com",p:{FEAR_INSECTS:-2},prev:2,need:13,label:"第三輪"}
 ],
 resolve:"last",win:74,lose:20}},

16:{t:`你用盡全身力氣，猛地撞向房門，木門鎖周圍的木頭發出碎裂的聲響。門應聲而開，你踉蹌著衝進走廊。`,
fx:{h:-1},o:[["翻到第151章",151]]},

17:{t:`那些詭異的空靈存在被擊退了，你急忙衝向天文台的大門，卻發現門被鎖上了。`,
o:[["消耗1點線索或1點資源，或獲得+1厄運值，然後翻到第140章",140,{cost:["c","r"],orDoom:1}]]},

18:{t:`你鼓起勇氣走上台階，來到正門跟前。眼前的大門由純黑的木頭製成，木紋中浮現出虛幻的影子。`,
o:[["若你想敲門，翻到第58章",58],
   ["若你想先試試門，翻到第34章",34]]},

19:{t:`警方提取了你的指紋，很快你就被關進了東鎮警察局深處的拘留室。

令人不安的是，旁邊的老婦人正在喃喃自語。

「他不信任那個尼德斯教授，你知道嗎？」她突然看向你，「就是生命科學系的那個女人。」

她突然抓住你的手：「我看到你的未來一片黑暗！」`,
wk:["INKY_FINGERS"],
o:[["若你想抽回手，翻到第99章",99],
   ["若你想讓她握著你的手，翻到第159章",159]]},

20:{t:`儘管你拼盡全力抵禦三顎蜂的攻擊，但牠們的數量實在太多了。十幾根帶著毒液的尖刺刺進你的身體，注入致命的毒素。劇痛難忍，但並未持續太久，很快，毒素便將你吞噬。`,
end:{stars:0,title:"毒針之下"}},

21:{t:`當你抵達密斯卡托尼克大學時，夜色已籠罩阿卡姆。科學樓外停著幾輛警車，入口周圍拉起了警戒線。`,
o:[["若你擁有{警察}或{偵探}能力，翻到第297章",297,{abil:["POLICE","DETECTIVE"]}],
   ["試圖偷偷穿過警戒線，翻到第61章",61],
   ["和警察交談，翻到第81章",81]]},

22:{t:`越來越多的昆蟲，在鋼針的穿刺下，以一種詭異的方式「活」了過來。你再也無法忍受待在這裡，倉皇逃離了這個房間。`,
fx:{s:-1},o:[["翻到第151章",151]]},

23:{t:`你開始翻找工作站上的地圖和文件。`,
test:{n:"調查測試",s:"int",d:1,c:"clue",need:7,ok:180,ng:7}},

24:{t:`你無法再等布萊恩博士的計畫實施了。`,
o:[["看看自己身上有沒有能用來對抗同化教派的東西，翻到第48章",48],
   ["攻擊教徒，翻到第221章",221],
   ["想出其他策略，翻到第109章",109]]},

25:{t:`門把手轉動，門開了，你走進一間地圖室。世界地圖的上方，刻著一句文學名言：「霍拉旭，人世間的事，比你想像的要複雜得多。」——《哈姆雷特》第一幕第五場`,
o:[["仔細查看墨卡托投影世界地圖，翻到第86章",86],
   ["仔細查看地球儀，翻到第44章",44],
   ["仔細查看天球儀，翻到第70章",70],
   ["離開房間，翻到第151章",151]]},

26:{t:`今晚的種種遭遇，對你的考驗遠超你的想像。你筋疲力盡，最終在逃出溫室前，轟然倒地。`,
end:{stars:0,title:"力竭而亡"}},

27:{t:`「尼德斯教授的辦公室在二樓，卡夫卡藏品館那邊。」克里斯托弗博士對你說，「現在，恕我失陪。」`,
o:[["若你想去尼德斯教授的辦公室，翻到第298章",298],
   ["若你想離開科學樓，翻到第140章",140]]},

28:{t:`你立刻離開書房，卻迎面遇上四名朝你走來的警察。「站住！」領頭的魁梧警長大喊道，「我們接到報案，這裡有騷亂發生。你看到什麼了嗎？」`,
o:[["翻到第262章",262]]},

29:{t:`你握住門把手，用身體猛地撞向房門，門紋絲不動。`,
fx:{h:-1,co:-1},
o:[["「我們在浪費時間。」布萊恩博士冷冷地說。翻到第15章",15]]},

30:{t:`你在儲物櫃旁找到了一些紗布和繃帶，塞進口袋。`,
fx:{r:1},sec:["隱藏的貳號"],
o:[["在推車上的屍體中尋找布萊恩博士的遺體，翻到第186章",186],
   ["在冷藏隔間裡尋找這位學者，翻到第226章",226],
   ["不再打擾逝者，離開停屍房，翻到第246章",246]]},

31:{t:`沒用的，無論你如何用力撞門、拉門把手，門都紋絲不動。牆壁內部，傳來一陣憤怒的嗡嗡聲。當你的囚禁者最終放你出去時，你已經精神錯亂，無法反抗。`,
end:{stars:0,title:"嗡鳴的牢籠"}},

32:{t:`你無法接受眼前的景象，你逃離了沃倫天文台，沿著克蘭山往回跑。`,
fx:{wp:-1,s:-1},o:[["翻到第140章",140]]},

33:{t:`這間書房裡，堆滿了各式各樣的學術資料。你的目光被一排裝裱好的照片吸引，其中一張華麗的金框學術證書，上面寫著：德夫林·布萊恩獲得了動物學哲學博士學位。`,
fx:{c:1},
o:[["布告板，翻到第114章",114],
   ["大書架，翻到第94章",94],
   ["書桌，翻到第63章",63]]},

34:{t:`宏偉的正門應聲開啟，門後是一間富麗堂皇的門廳。從宏偉的門廳出發，兩道弧形樓梯蜿蜒向上通往宅邸二層，而你面前的寬闊拱門下，是一條鋪著地毯的走廊。`,
o:[["若你想拾級而上前往二樓，翻至第151章",151],
   ["若你想穿過拱門繼續前行，翻至第84章",84]]},

35:{t:`你找到一塊乾酪和半條酸麵包吃了起来，還喝了半瓶波爾多紅酒。你還發現了一把大號的【麵包刀】和一瓶上好的【白蘭地】。`,
fx:{h:1,wp:1,r:2},give:["BREADKNIFE","BRANDY"],
o:[["翻至第54章",54]]},

36:{t:`停屍房門外的推車上擺著各式各樣的醫療用品。`,
o:[["若你想檢查推車上的物品，翻至第66章",66],
   ["若你只想徑直走進停屍房內部，翻至第156章",156]]},

37:{t:`你的目光無法從那潛藏在天空裂隙後的虛空巨獸身上移開。`,
fx:{s:-1},
o:[["若你持有【阿奇博爾德的記錄】，翻至第68章",68,{has:"ARCHIBALDS_ACCOUNT"}],

fx:{wp:1,c:1},o:[["翻至第170章",170]]},

o:[["若你擁有{警察}或{偵探}能力，翻至第297章",297,{abil:["POLICE","DETECTIVE"]}],
   ["試圖偷偷穿過警方警戒線進入大樓，翻至第61章",61],

test:{n:"扭打測試",s:"com",d:1,b:{agile:1},c:"res",need:8,ok:138,ng:108}},

43:{t:`你幾乎無法相信自己親眼所見的一切。你一刻也不想多待，生怕自己的心智就此崩塌。`,
fx:{wp:1},
o:[["若你想嘗試另一扇門，翻至第25章",25],
   ["若你想返回主走廊，翻至第247章",247]]},

44:{t:`這台地球儀顯然年代久遠，卻被精心保存著。你忍不住輕輕轉動它，卻只聽到了一聲輕微的咔嗒聲。`,
o:[["仔細查看墨卡托投影世界地圖，翻至第86章",86],

256:{t:`你沒有採取任何行動擾亂儀式，只是冷眼旁觀，靜靜等待。尼德斯教授將雙手高高舉起，無數巨大的黑色昆蟲，從陶罐的口中湧了出來。

片刻之間，數百隻、數千隻、數萬隻昆蟲接連湧出。緊接著，尖叫聲開始響起。`,
end:{stars:0,title:"旁觀者的下場"}},

257:{t:`教徒的數量實在太多，你和布萊恩博士被徹底壓制。局勢逆轉，你被教徒俘虜。`,
o:[["進行一次命運測試：1d6，若{被詛咒}點數+1。≤厄運值→232章；>厄運值→177章",0,{fate:{232:177}}]]},

258:{t:`你終於將目光從那可怖怪物身上移開。但沃醫生已經察覺。他決意要除掉你。`,

  {d:2,s:"com+wp",b:{secretRites:1},prev:2,need:20,label:"第三輪"}
 ],
 resolve:"last",win:146,lose:284}},

259:{t:`你的調查似乎走進了死胡同。你完全不知下一步該何去何從，只能選擇回家。

但當你獨自走在阿卡姆漆黑的街道上時，心中那股末日將至的預感始終揮之不去，如影隨形。`,
sec:["窮途末路"],end:{stars:0,title:"窮途末路"}},

260:{t:`面對這般瘋狂的景象，除了逃離，一個心智正常的人還能作何反應？`,
o:[["擲1d6，若{敏捷}點數+1。≤生命值→100章；>生命值→26章",0,{escapeRoll:{100:26}}]]},

261:{t:`哈登警探認真傾聽著你所掌握的一切線索。他伸手從大衣口袋裡掏出一把【彈簧刀】，「小心點用。」`,
give:["FLICK_KNIFE"],fx:{r:1},sec:["守護與服務"],
o:[["消耗1點線索或1點資源，或厄運值+1，翻至第140章",140,{cost:["c","r"],orDoom:1}]]},

262:{t:`那位神情粗獷的警長開始宣讀你被指控的罪名。你成了布萊恩博士謀殺案的頭號嫌疑人。`,
o:[["若你選擇束手就擒，翻至第282章",282],
   ["若你選擇反抗逮捕，翻至第299章",299]]},

263:{t:`你從桌下拖出一個盒子，打開後發現，盒內鋪著深藍色的絲絨，一件精緻的【黃銅望遠鏡】靜靜躺在其中。`,
give:["BRASS_TELESCOPE"],fx:{r:1},sec:["小望遠鏡"],o:[["翻至第14章",14]]},

264:{t:`你需要一點時間梳理思緒，最終又回到了維爾瑪餐廳門口。

你絲毫沒有注意到對面的卡座多了一個人，直到他在你面前坐下。

「想必，你就是布萊恩博士吧。」`,
fx:{h:1,wp:1},
o:[["若你持有【手帕】，翻至第244章",244,{has:"HANDKERCHIEF"}],
   ["若未持有，但有【哈登警探的名片】，翻至第198章",198,{has:"HARDEN_CARD"}],
   ["若未持有，但有弱點{墨漬手指}，翻至第230章",230,{wk:["INKY_FINGERS"]}],

   ["若以上物品均未持有，翻至第182章",182]]},

o:[["若你有線索，輸入四數字之和→對應章節；若無，翻至第259章",0,{sumPuzzle:259}]]},

267:{t:`你躡手躡腳地走向那扇門，遠處傳來的低語聲漸漸清晰。`,
o:[["若你選擇打開房門，翻至第151章",151],
   ["若你選擇先將耳朵貼在門上聽片刻，翻至第287章",287]]},

268:{t:`這隻可怖的生物躲開了你慌亂的防禦，用致命的尾刺狠狠蟄向你。「吃我一擊，惡魔！」克里斯托弗博士高呼道。

你看到這位昆蟲學家一手高舉著一尊貴族石像，將那隻生物砸在桌上、碾成肉泥。

辦公室的一面牆上，顯眼地掛著一張照片。照片的底片上刻著：阿巴頓府。`,
fx:{h:-1,c:1},sec:["家族合影"],o:[["翻至第140章",140]]},

fx:{co:1},
o:[["繼續殺出一條血路，翻至第294章",294],

271:{t:`「我有個主意，」魔法老店的店主開口道，「把筆記本留在我這兒，我試試看能不能破譯上面的內容。」`,
o:[["若你選擇同意她的提議，翻至第291章",291],
   ["若你不願交出【布萊恩博士的筆記本】，翻至第141章",141]]},

272:{t:`你拼盡全力想要衝出蟲群的包圍，可這些昆蟲的數量實在太多。你艱難地爬到石質高台腳下，看到尼德斯教授站在高台上，面露勝利的笑容。`,
sec:["埃澤爾-森-雷茲的崛起"],end:{stars:0,title:"蟲群之神的崛起"}},

273:{t:`你擰開酒瓶，喝了一大口酒，卻沒有嚥下，而是含在嘴裡。你彈開打火機，將口中高度易燃的酒精噴成霧狀，徑直噴向迎面而來的蟲群。

你自製的火焰噴射器讓數隻昆蟲瞬間起火。但還沒等你再次噴射，打火機的火焰便熄滅了。`,
take:["LIGHTER","WHISKEY","SWABBING_ALCOHOL"],fx:{it:1},
o:[["輸入四數字之和→對應章節；若無頭緒，翻至第259章",0,{sumPuzzle:259}]]},

fx:{h:-2},
o:[["輸入四數字之和→對應章節；若無頭緒，翻至第259章",0,{sumPuzzle:259}]]},

276:{t:`自從布萊恩博士的辦公室裡發現那具可怖的屍體後，這裡的局勢總算漸漸平復。`,
sec:["叄號地點"],fx:{d:2},
o:[["鎖定一個具體的調查地點，翻至第140章（可消耗2線索/資源免厄運）",140,{doomFix:2}]]},

277:{t:`你回到書房，看著桌上雜亂的書籍、文件，還有玻璃櫃裡的動物標本。`,
o:[["查看布告板，翻至第195章",195],
   ["查看巨大書架，翻至第175章",175],
   ["搜查書桌，翻至第154章",154],
   ["立刻離開房間，翻至第215章",215]]},

278:{t:`西勒諾斯的追隨者所陷入的瘋狂，具有極強的傳染性。你心想，既然宇宙最終的歸宿都是熱寂，所有生命都會走向終結，那麼繼續掙扎又有什麼意義？

就在這時，那個女人突然朝你襲來，給了你一道致命的傷口。`,
fx:{s:-1,h:-1},o:[["翻至第181章",181]]},

279:{t:`聖瑪麗醫院那座哥德式的建築，矗立在上城周邊。你不小心踩進了路面坑窪裡的一灘髒水。`,
wk:["WET_SHOES"],
o:[["若你選擇出聲求助，翻至第4章",4],
   ["若你選擇低調行事，翻至第36章",36]]},

280:{t:`那位漂浮在空中的巫師身上散發出的恐怖力量，清晰可感。`,
o:[["擲1d6，若{被詛咒}或{鬧鬼}點數-1。≤理智值→260章；>理智值→206章",0,{sanityRoll:{260:206}}]]},

281:{t:`你來到這裡的目的，就是阻止尼德斯教授，以及她所領導的同化教派。`,
combat:{res:true,prep:"每輪戰鬥開始前，你可以消耗1點資源，為本輪總點數+2。",
 rounds:[
  {d:2,s:"com",minusDoom:true,b:{agile:1},need:16,label:"第一輪"},
  {d:2,s:"com",b:{agile:1},prev:2,need:16,label:"第二輪"}
 ],
 resolve:"last",win:181,lose:92}},

282:{t:`當警察已經將你團團圍住時，逃跑根本毫無意義。你選擇束手就擒。`,
wk:["CRIMINAL"],o:[["翻至第59章",59]]},

283:{t:`你推開門，在房間裡亮堂堂的白光下開始搜查。尼德斯教授顯然不在這裡，但離開前，你發現了兩件值得仔細查看的東西。

一件是一張照片，照片中是一座宏偉的殖民風格宅邸，底片上刻著：阿巴頓府。另一件是一個造型奇特的人類頭骨面具。`,
sec:["家族合影"],give:["SKULL_MASK"],fx:{r:1},o:[["翻至第140章",140]]},

284:{t:`當這隻怪物用佈滿利齒的喙咬住你，將你癱軟的身體拋向空中，再一口吞下時，你才意識到，牠的喙是如此真實可觸。`,
end:{stars:0,title:"葬身鳥腹"}},

285:{t:`你意識到，布萊恩博士在扉頁筆記下寫下的那些符號，正是破解密碼的關鍵：每個符號都對應著英文信息中同一位置的字母。`,
fx:{c:-1},
o:[["若不能，翻至第271章",271]]},

286:{t:`你伸手推了推門，門只動了一點點，就被什麼東西擋住了。身後傳來一陣嗡嗡聲，一群黑色的昆蟲從冷藏格縫隙中蜂擁而出。`,
o:[["若你選擇強行打開停屍房的門，翻至第8章",8],
   ["若你選擇準備迎戰蟲群，翻至第270章",270]]},

287:{t:`你小心翼翼地將耳朵貼在溫熱的木門上。你聽到的，無疑是人們吟唱的聲音。可當你更加仔細地傾聽時，這悠揚的吟唱聲中，卻多了一絲嗡嗡的雜音，讓你心生不安。`,
fx:{s:-1},o:[["翻至第151章",151]]},

288:{t:`這隻可怖的生物試圖用細長的尾刺蟄你，卻被你一次次躲開。終於，你將牠狠狠砸在辦公室的地板上，一疊厚重的書籍砸在牠身上，將牠碾得粉碎。

「幹得漂亮！」克里斯托弗博士說道。

你還在房間裡發現了一個造型奇特的人類【頭骨面具】。以及一張照片，底片上刻著：阿巴頓府。

「那是尼德斯教授的祖宅，」克里斯托弗博士說，「她現在很可能就在那裡。」`,
fx:{co:1,c:2},give:["SKULL_MASK"],sec:["家族合影"],o:[["翻至第140章",140]]},

289:{t:`布萊恩博士彷彿早已察覺你的意圖，轉過頭注視著你。

「卑賤的蠕蟲，」他啐道，「你竟敢挑戰我？你已經完成了你的使命，現在的你，毫無用處。我不再需要你了。」

他指向你，一道扭曲的陰影觸鬚朝你伸來。最終，你在劇痛中失去了意識。`,
end:{stars:0,title:"卑賤的蠕蟲"}},

290:{t:`你隨手抓起身邊的東西，將一托盤手術刀和其他消過毒的工具掃落在地，拼命拍打那些鼓脹的昆蟲。最終，剩下的昆蟲終於不再攻擊你。

你再次將注意力轉向房門，拼命搖晃門把手，終於打開門逃了出去。`,
fx:{co:1},
o:[["輸入四數字之和→對應章節；若無頭緒，翻至第259章",0,{sumPuzzle:259}]]},

291:{t:`你將筆記本遞給米里亞姆·比徹。她讓你明天再來，說完便將你送出了店門。`,
take:["NOTEBOOK"],fx:{r:-1,c:-1},sec:["巫術魔法"],o:[["翻至第141章",141]]},

292:{t:`究竟發生了什麼？整個世界都陷入了瘋狂嗎？

「那些是空天教派的信徒，」布萊恩博士彷彿看穿了你的心思，「他們信奉空天之神西勒諾斯，是一群虛無主義者。」`,
o:[["繼續猛攻蟲群之主的追隨者，翻至第281章",281],
   ["向空天之神西勒諾斯的信徒宣戰，翻至第201章",201],
   ["要求布萊恩博士說出真相，翻至第178章",178]]},

293:{t:`模型中的許多建築，只是用零碎的木頭粗略拼接而成。你找來一張紙和一支鉛筆，將這份城鎮平面圖，還有上面標註的地點都臨摹了下來。`,
give:["TOWN_MAP"],fx:{c:1},o:[["翻至第14章",14]]},

294:{t:`挑戰如此多的敵人，看似瘋狂，但你如今所處的境遇，本就與理智無關。`,
combat:{res:true,prep:"每輪戰鬥開始前，你可以消耗1點資源，為本輪總點數+2。",
 rounds:[
  {d:2,s:"com",b:{agile:1},need:14,label:"第一輪"},
  {d:2,s:"com",prev:2,need:15,label:"第二輪",loseHp:1},
  {d:2,s:"com",prev:1,need:14,label:"第三輪"}
 ],
 resolve:"last",win:13,lose:106}},

295:{t:`你將【骨鋸】的刀刃插進房門和門框之間的縫隙，拼命鋸起來。

可就在這時，你突然被一群面目可憎的昆蟲團團圍住。就在你猛地撞開停屍房的門逃出去時，數隻昆蟲還是狠狠蟄中了你。`,
fx:{h:-1,s:-1},wk:["FEAR_INSECTS"],
o:[["輸入四數字之和→對應章節；若無頭緒，翻至第259章",0,{sumPuzzle:259}]]},

296:{t:`你身上有什麼東西，你認為能對布萊恩博士產生克制作用？`,
o:[["若你想使用{巫術}能力，翻至第229章",229,{abil:["SORCERY"]}],
   ["若你想使用【黑爪匕首】，翻至第163章",163,{has:"BLACK_TALON"}],
   ["若你想將阿卡姆之刃對準他，翻至第105章",105,{has:"CEREMONIAL_DAGGER"}]]},

297:{t:`這些人和你是同一類人，於是你走上前與他們交談。

「疑似謀殺案，」負責此案的哈登警探答道，「受害者是布萊恩博士。」

他遞給你一張小小的硬紙片。「如果你有任何線索，可以打這個電話聯繫我。」`,
give:["HARDEN_CARD"],
o:[["若你持有【黑爪匕首】，翻至第121章",121,{has:"BLACK_TALON"}],
   ["若未持有，翻至第140章",140]]},

298:{t:`你穿過科學樓，走上樓梯，沿著走廊前行，終於找到了目的地。「尼德斯教授？」你輕聲呼喚，可黑暗的房間裡，沒有任何回應。`,
o:[["擅自進入尼德斯教授的辦公室，翻至第283章",283],
   ["去找米蘭·克里斯托弗博士，翻至第168章",168]]},

299:{t:`你掙脫年輕警察的束縛，拔腿就跑。警長伸出一腳，將你絆倒在地。`,
fx:{h:-1},wk:["CRIMINAL"],o:[["翻至第59章",59]]},

300:{t:`儘管今夜的種種考驗讓你身心俱疲，但急需的腎上腺素還是為你疲憊的身體注入了力量，你逃離了阿巴頓府。

月食漸漸結束，你抬頭望向天空，看到月亮重新出現，而天空中的裂隙，還有裂隙後潛藏的那個存在，都消失得無影無蹤。

宅邸的消失，是否意味著兩個敵對教派同歸於盡？一個無可辯駁的事實擺在眼前：那些瘋狂的神明和牠們的追隨者都消失了，而你，成功阻止了一股更危險的力量在阿卡姆崛起。`,
sec:["阿卡姆之影"],end:{stars:4,title:"阿卡姆之影"}}

const d6=()=>Math.floor(Math.random()*6)+1;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function toast(msg,dur=2200){
  const t=$("#toast");t.textContent=msg;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),dur);
}
function effective(p){
  let com=p.com,wp=p.wp,int=p.int;
  if(p.hp<0)com+=p.hp;
  if(p.san<=-1)wp-=1;
  if(p.san<=-2)int-=2;
  return{com,wp,int};
}
function testMod(test,p){
  let bonus=0,pen=0;
  if(test.b){
    for(const[k,v]of Object.entries(test.b)){
      if(k==="sorcery"&&p.otherAbilities.includes("SORCERY"))bonus+=v;
      else if(k==="secretRites"&&p.otherAbilities.includes("SECRET_RITES"))bonus+=v;
      else if(k==="arcaneStudies"&&p.otherAbilities.includes("ARCANE_STUDIES"))bonus+=v;
      else if(k==="agile"&&p.otherAbilities.includes("AGILE"))bonus+=v;
      else if(k==="studious"&&p.otherAbilities.includes("STUDIOUS"))bonus+=v;
      else if(k==="quickwitted"&&p.otherAbilities.includes("QUICKWITTED"))bonus+=v;
    }
  }
  if(test.p){
    for(const[k,v]of Object.entries(test.p)){
      if(p.otherWeak.includes(k))pen+=v;
    }
  }
  return{bonus,pen};
}
function sumStats(s,p){
  const eff=effective(p);
  const map={wp:eff.wp,int:eff.int,com:eff.com,san:p.san};
  return s.split("+").reduce((a,k)=>a+(map[k.trim()]||0),0);
}

/* ============ 章節渲染 ============ */
function goChapter(n){
  if(!n||!C[n]){
    toast(`⚠️ 找不到第 ${n} 章。`);
    return;
  }
  S.chapter=n;S.chapterData=C[n];S.phase="idle";S.combat=null;S.test=null;
  applyEffects(C[n]);
  S.history.push({ch:n,t:Date.now()});
  autoSave();
  renderChapter();
}
function applyEffects(d){
  const p=S.player;if(!p)return;
  if(d.fx){
    for(const[k,v]of Object.entries(d.fx)){
      if(k==="c")p.clues+=v;
      else if(k==="r")p.res+=v;
      else if(k==="h")p.hp+=v;
      else if(k==="s")p.san+=v;
      else if(k==="d")p.doom+=v;
      else if(k==="wp")p.wp+=v;
      else if(k==="it")p.int+=v;
      else if(k==="co")p.com+=v;
    }
  }
  if(d.give)d.give.forEach(it=>{if(!p.items.includes(it))p.items.push(it)});
  if(d.take)d.take.forEach(it=>{p.items=p.items.filter(x=>x!==it)});
  if(d.ab)d.ab.forEach(a=>{if(!p.otherAbilities.includes(a))p.otherAbilities.push(a)});
  if(d.wk)d.wk.forEach(w=>{if(!p.otherWeak.includes(w))p.otherWeak.push(w)});
  if(d.sec)d.sec.forEach(s=>{if(!S.secrets.has(s)){S.secrets.add(s);Sound.secret()}});
  if(d.end&&d.end.secret&&!S.secrets.has(d.end.secret)){S.secrets.add(d.end.secret);Sound.secret()}
  renderHUD();
}
function renderChapter(){
  const d=S.chapterData;
  $("#main").innerHTML=`
    <div class="scene">
      <div class="chapter-tag">第 ${S.chapter} 章</div>
      <div class="story" id="storyBox"></div>
      <div id="actionArea"></div>
    </div>
  `;
  S.phase="typing";
  typeText(d.t,()=>{S.phase="idle";renderActions();});
}
function typeText(text,done){
  const box=$("#storyBox");if(!box)return;
  const total=text.length;let idx=0,skipped=false;
  const step=()=>{
    if(skipped)return;
    if(idx>=total){
      box.innerHTML=formatStory(text);
      box._typing=false;done&&done();
      return;
    }
    idx+=2;if(idx>total)idx=total;
    box.innerHTML=formatStory(text.slice(0,idx))+'<span class="cursor"></span>';
    setTimeout(()=>{if(!skipped)step()},14);
  };
  box._skip=()=>{skipped=true;box.innerHTML=formatStory(text);box._typing=false;done&&done()};
  box.addEventListener("click",()=>{if(box._skip)box._skip()},{once:true});
  step();
}
function formatStory(t){
  return esc(t)
    .replace(/【([^】]+)】/g,'<span class="kw">【$1】</span>')
    .replace(/\{([^}]+)\}/g,'<span class="kw2">{$1}</span>')
    .replace(/\n/g,"<br>");
}
function renderActions(){
  const d=S.chapterData;
  const area=$("#actionArea");if(!area)return;
  area.innerHTML="";
  if(d.end){S.phase="end";renderEnding();return;}
  if(d.puzzle){S.phase="puzzle";renderPuzzle(d.puzzle);}
  if(d.test){S.phase="test";renderTest(d.test);return;}
  if(d.combat){S.phase="combat";renderCombatStart(d.combat);return;}
  if(d.o&&d.o.length){
    S.phase="idle";
    const wrap=document.createElement("div");
    wrap.className="choices";
    d.o.forEach(opt=>{
      const[label,target,cond]=opt;
      const btn=document.createElement("button");
      btn.className="btn";
      btn.innerHTML=label;
      const check=canChoose(cond);
      if(!check.ok){
        btn.title=check.msg||"";
        btn.addEventListener("click",()=>{Sound.bad();toast(check.msg||"你無法選擇此選項。")});
      }else{
        btn.addEventListener("click",()=>{Sound.click();handleChoice(target,cond)});
      }
      wrap.appendChild(btn);
    });
    area.appendChild(wrap);
  }
}
function canChoose(cond){
  if(!cond)return{ok:true};
  const p=S.player;
  if(cond.has){
    const need=Array.isArray(cond.has)?cond.has:[cond.has];
    for(const it of need)if(!p.items.includes(it))
      return{ok:false,msg:`🔒 你需要持有【${ITEM_DEF[it]?.n||it}】才能選擇此項。`};
  }
  if(cond.hasAny){
    if(!cond.hasAny.some(it=>p.items.includes(it)))
      return{ok:false,msg:`🔒 你需要持有【${cond.hasAny.map(i=>ITEM_DEF[i]?.n||i).join(" 或 ")}】其中之一。`};
  }
  if(cond.abil){
    const need=Array.isArray(cond.abil)?cond.abil:[cond.abil];
    if(!need.some(a=>p.otherAbilities.includes(a)))
      return{ok:false,msg:`🔒 你需要 {${need.map(a=>ABILITY_DEF[a]?.n||a).join(" 或 ")}} 能力。`};
  }
  if(cond.wk){
    const need=Array.isArray(cond.wk)?cond.wk:[cond.wk];
    if(!need.some(w=>p.otherWeak.includes(w)))
      return{ok:false,msg:`🔒 你需要弱點 {${need.map(w=>WEAK_DEF[w]?.n||w).join(" 或 ")}}。`};
  }
  return{ok:true};
}
function handleChoice(target,cond){
  const p=S.player;
  if(cond){
    if(cond.cost){
      const costs=Array.isArray(cond.cost)?cond.cost:[cond.cost];
      const c=costs[0];
      if(c==="c"){
        if(p.clues>=1){p.clues-=1;toast("🔍 消耗 1 點線索。");}
        else if(cond.orDoom){p.doom+=1;toast("☠️ 線索不足，厄運+1。");}
        else if(costs.includes("r")&&p.res>=1){p.res-=1;toast("💎 線索不足，改消耗 1 資源。");}
        else{toast("⚠️ 你沒有足夠的線索或資源。");return;}
      }else if(c==="r"){
        if(p.res>=1){p.res-=1;toast("💎 消耗 1 點資源。");}
        else if(cond.orDoom){p.doom+=1;toast("☠️ 資源不足，厄運+1。");}
        else{toast("⚠️ 你沒有足夠的資源。");return;}
      }
    }
    if(cond.elseSan){p.san-=cond.elseSan;}
    if(cond.doomFix){showDoomFixDialog(cond.doomFix,()=>proceed());renderHUD();return;}
  }
  function proceed(){
    if(target===0&&cond){
      if(cond.doomCheck)return handleDoomCheck(cond.doomCheck);
      if(cond.fate)return handleFate(cond.fate);
      if(cond.escapeRoll)return handleEscapeRoll(cond.escapeRoll);
      if(cond.sanityRoll)return handleSanityRoll(cond.sanityRoll);
      if(cond.sumPuzzle)return renderSumPuzzle(cond.sumPuzzle);
      if(cond.goto)return goChapter(cond.goto);
      if(cond.autoTest)return renderTest(cond.autoTest);
    }
    if(target===0)return;
    goChapter(target);
  }
  proceed();
}
function showDoomFixDialog(n,done){
  const p=S.player;
  const opts=[];
  if(p.clues>=n)opts.push(["clue",n]);
  if(p.res>=n)opts.push(["res",n]);
  const ov=$("#overlay"),md=$("#modal");
  md.innerHTML=`
    <button class="close-x" data-close="1">✕</button>
    <h2>減少厄運值</h2>
    <p class="lead">你被額外施加了 <b>+${n} 點厄運值</b>。</p>
    <div class="foot">
      ${opts.map(([k,v])=>`<button class="btn" data-opt="${k}">消耗 ${v} 點${k==="clue"?"線索":"資源"}（抵消 ${v} 厄運）</button>`).join("")}
      <button class="btn primary" data-opt="none">不消耗（接受厄運）</button>
    </div>
  `;
  ov.classList.add("on");
  md.querySelectorAll("[data-opt]").forEach(b=>{
    b.addEventListener("click",()=>{
      const o=b.dataset.opt;
      if(o==="clue"){p.clues-=n;p.doom-=n;toast("🔍 消耗線索，厄運抵消。");}
      else if(o==="res"){p.res-=n;p.doom-=n;toast("💎 消耗資源，厄運抵消。");}
      ov.classList.remove("on");Sound.click();done();
    });
  });
  md.querySelector("[data-close]").addEventListener("click",()=>{ov.classList.remove("on");done()});
}
function handleDoomCheck(map){
  const p=S.player;

function handleEscapeRoll(map){

function handleSanityRoll(map){

/* ============ 測試 ============ */
function renderTest(test){
  S.test=test;
  const area=$("#actionArea");
  const p=S.player;
  const mod=testMod(test,p);
  const hasCostOption=!!test.c;
  const costKey=test.c==="clue"?"clues":"res";
  const costType=test.c==="clue"?"線索":"資源";
  const canCost=hasCostOption&&p[costKey]>=1;
  const base=sumStats(test.s,p);
  const diceCount=test.d||1;
  area.innerHTML=`
    <div class="panel" id="testPanel">
      <h3>🎲 ${test.n||"測試"}</h3>
      <div class="formula">
        擲 ${diceCount} 顆骰子 + <b>${statLabel(test.s)}</b>（${base}）
        ${mod.bonus?` + 能力加值 <b style="color:#7fe07f">+${mod.bonus}</b>`:""}
        ${mod.pen?` - 弱點減值 <b style="color:#ff7a7a">${mod.pen}</b>`:""}
        <br>目標：<b>${test.need} 及以上</b>
        <br>成功 → 第 ${test.ok} 章；失敗 → 第 ${test.ng} 章
      </div>
      <div class="dice-area" id="diceArea"></div>
      <div class="result-big" id="testResult"></div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="rollBtn">🎲 擲骰</button>
        ${hasCostOption?`<button class="btn" id="costBtn" ${canCost?"":"disabled"}>
          消耗 1 點${costType}，改擲 2 骰取高<br>
          <span class="sub">目前${costType}：${p[costKey]}</span>
        </button>`:""}
      </div>
    </div>
  `;
  let usedCost=false;
  const doRoll=(withCost)=>{
    if(S.phase==="testResult")return;
    S.phase="testResult";
    usedCost=withCost;
    if(withCost){p[costKey]-=1;renderHUD();}
    const area2=$("#diceArea");area2.innerHTML="";
    const n=withCost?2:diceCount;
    const results=[];
    for(let i=0;i<n;i++){
      const die=document.createElement("div");
      die.className="die rolling";die.textContent="?";
      area2.appendChild(die);
      results.push({el:die,val:d6()});
    }
    Sound.dice();
    setTimeout(()=>{
      results.forEach((r,i)=>{
        setTimeout(()=>{
          r.el.classList.remove("rolling");r.el.classList.add("show");
          r.el.textContent=r.val;Sound.dice();
        },i*220);
      });
      setTimeout(()=>{
        const sum=results.map(r=>r.val).reduce((a,b)=>a+b,0);
        const final=sum+base+mod.bonus+mod.pen;
        const ok=final>=test.need;
        const rb=$("#testResult");
        rb.className="result-big "+(ok?"ok":"bad");
        rb.textContent=`${ok?"✅ 成功":"❌ 失敗"}　總點數 ${final}`;
        if(ok)Sound.ok();else Sound.bad();
        const panel=$("#testPanel");
        if(panel&&panel.parentNode){
          const wrap=document.createElement("div");wrap.className="choices";
          const btn=document.createElement("button");
          btn.className="btn gold";
          btn.textContent=`繼續 → 第 ${ok?test.ok:test.ng} 章`;
          btn.addEventListener("click",()=>goChapter(ok?test.ok:test.ng));
          wrap.appendChild(btn);panel.appendChild(wrap);
        }
        const rollBtn=$("#rollBtn"),costBtn=$("#costBtn");
        if(rollBtn)rollBtn.disabled=true;
        if(costBtn)costBtn.disabled=true;
      },n*220+300);
    },300);
  };
  $("#rollBtn").addEventListener("click",()=>{
    if(usedCost){toast("⚠️ 你已使用消耗選項。");return;}
    const cb=$("#costBtn");if(cb)cb.disabled=true;
    doRoll(false);
  });
  if(hasCostOption){
    $("#costBtn").addEventListener("click",()=>{
      if(!canCost){toast(`⚠️ 你的${costType}不足。`);return;}
      $("#rollBtn").disabled=true;
      doRoll(true);
    });
  }
}
function statLabel(s){
  return s.split("+").map(k=>{
    const m={wp:"意志力",int:"智力",com:"戰鬥",san:"理智值"};
    return m[k.trim()]||k;
  }).join(" + ");
}

/* ============ 戰鬥 ============ */
function renderCombatStart(combat){
  S.combat={round:0,wins:0,losses:0,cfg:combat,lastWin:false};
  const area=$("#actionArea");
  area.innerHTML=`
    <div class="panel" id="combatPanel">
      <h3>⚔️ 戰鬥開始</h3>
      <div class="formula">${combat.prep||"每輪開始前，你可以消耗 1 點資源，為本輪總點數 +2。"}</div>
      <div class="choices">
        <button class="btn primary" id="combatNext">⚔️ 開始第一輪</button>
      </div>
    </div>
  `;
  $("#combatNext").addEventListener("click",()=>combatNextRound());
}
function combatNextRound(){
  const c=S.combat;const cfg=c.cfg;
  if(c.round>=cfg.rounds.length)return combatResolve();
  const r=cfg.rounds[c.round];
  const p=S.player;
  const area=$("#actionArea");
  const prevWon=c.round>0&&c.lastWin;
  const prevBonus=(r.prev&&prevWon)?r.prev:0;
  const base=sumStats(r.s,p);
  const mod=testMod(r,p);
  const allowCost=(cfg.onlyCostRound===undefined||cfg.onlyCostRound===c.round);
  const canCost=allowCost&&p.res>=1;
  area.innerHTML=`
    <div class="panel" id="combatRoundPanel">
      <h3>⚔️ ${r.label||("第 "+(c.round+1)+" 輪")}</h3>
      <div class="formula">
        擲 ${r.d||2} 顆骰子 + <b>${statLabel(r.s)}</b>（${base}）
        ${prevBonus?` + 上輪勝利 <b style="color:#7fe07f">+${prevBonus}</b>`:""}
        ${r.b?Object.entries(r.b).filter(([k])=>{
          if(k==="sorcery")return p.otherAbilities.includes("SORCERY");
          if(k==="secretRites")return p.otherAbilities.includes("SECRET_RITES");
          if(k==="agile")return p.otherAbilities.includes("AGILE");
          if(k==="studious")return p.otherAbilities.includes("STUDIOUS");
          return false;
        }).map(([k,v])=>` + <b style="color:#7fe07f">${v}</b>`).join(""):""}
        ${r.p?Object.entries(r.p).filter(([k])=>p.otherWeak.includes(k)).map(([k,v])=>` <b style="color:#ff7a7a">${v}</b>`).join(""):""}
        ${r.minusDoom?` - 厄運 <b style="color:#ff7a7a">${p.doom}</b>`:""}
        <br>目標：<b>${r.need} 及以上</b>
      </div>
      <div class="dice-area" id="diceArea"></div>
      <div class="result-big" id="combatResult"></div>
      <div class="row" style="justify-content:center">
        <button class="btn primary" id="rollBtn">🎲 擲骰</button>
        ${allowCost?`<button class="btn" id="costBtn" ${canCost?"":"disabled"}>
          消耗 1 資源，本輪 +2<br>
          <span class="sub">目前資源：${p.res}</span>
        </button>`:""}
      </div>
    </div>
  `;
  let usedCost=false;
  const doRoll=()=>{
    S.phase="combatRound";
    if(usedCost){p.res-=1;renderHUD();}
    const n=r.d||2;
    const results=[];
    const area2=$("#diceArea");area2.innerHTML="";
    for(let i=0;i<n;i++){
      const die=document.createElement("div");
      die.className="die rolling";die.textContent="?";
      area2.appendChild(die);
      results.push({el:die,val:d6()});
    }
    Sound.dice();
    setTimeout(()=>{
      results.forEach((rr,i)=>{
        setTimeout(()=>{
          rr.el.classList.remove("rolling");rr.el.classList.add("show");
          rr.el.textContent=rr.val;Sound.dice();
        },i*200);
      });
      setTimeout(()=>{
        const sum=results.map(rr=>rr.val).reduce((a,b)=>a+b,0);
        const bonus=prevBonus+mod.bonus+mod.pen+(r.minusDoom?-p.doom:0)+(usedCost?2:0);
        const total=sum+base+bonus;
        const ok=total>=r.need;
        const rb=$("#combatResult");
        rb.className="result-big "+(ok?"ok":"bad");
        rb.textContent=`${ok?"✅ 勝利":"❌ 失敗"}　總點數 ${total}`;
        if(!ok&&r.loseHp){p.hp-=r.loseHp;toast(`💔 生命值 -${r.loseHp}`);renderHUD();}
        if(ok)Sound.ok();else Sound.bad();
        c.lastWin=ok;
        if(ok)c.wins++;else c.losses++;
        c.round++;
        const panel=$("#combatRoundPanel");
        if(panel&&panel.parentNode){
          const wrap=document.createElement("div");wrap.className="choices";
          const btn=document.createElement("button");
          btn.className="btn gold";
          const isLast=c.round>=cfg.rounds.length;
          btn.textContent=isLast?"結算戰鬥":`繼續 → ${cfg.rounds[c.round].label||("第 "+(c.round+1)+" 輪")}`;
          btn.addEventListener("click",()=>{
            if(isLast)combatResolve();
            else combatNextRound();
          });
          wrap.appendChild(btn);panel.appendChild(wrap);
        }
        const rollBtn=$("#rollBtn"),costBtn=$("#costBtn");
        if(rollBtn)rollBtn.disabled=true;
        if(costBtn)costBtn.disabled=true;
      },n*200+250);
    },300);
  };
  $("#rollBtn").addEventListener("click",()=>{
    if(usedCost){toast("⚠️ 你已使用消耗選項。");return;}
    const cb=$("#costBtn");if(cb)cb.disabled=true;
    doRoll();
  });
  if(allowCost){
    $("#costBtn").addEventListener("click",()=>{
      if(!canCost){toast("⚠️ 資源不足。");return;}
      usedCost=true;
      $("#rollBtn").disabled=true;
      doRoll();
    });
  }
}
function combatResolve(){
  const c=S.combat,cfg=c.cfg;
  let win;
  if(cfg.resolve==="majority")win=c.wins>c.losses;
  else if(cfg.resolve==="last")win=c.lastWin;
  else win=c.wins>=c.losses;
  const area=$("#actionArea");
  area.innerHTML=`
    <div class="panel">
      <h3>⚔️ 戰鬥結束</h3>
      <div class="result-big ${win?"ok":"bad"}">${win?"✅ 你贏得了戰鬥！":"❌ 你被擊敗了..."}</div>
      <div class="choices">
        <button class="btn gold" id="afterCombat">繼續 → 第 ${win?cfg.win:cfg.lose} 章</button>
      </div>
    </div>
  `;
  if(win)Sound.ok();else Sound.bad();
  $("#afterCombat").addEventListener("click",()=>goChapter(win?cfg.win:cfg.lose));
}

/* ============ 結局 ============ */
function renderEnding(){
  const d=S.chapterData,p=S.player;
  const end=d.end;
  const stars=end.stars||0;
  S.endings[S.chapter]={stars,title:end.title||"結局",ts:Date.now()};
  saveMeta();
  $("#actionArea").innerHTML=`
    <div class="ending">
      <div style="font-size:40px">${stars>=4?"🌕":stars>=3?"🌖":stars>=2?"🌗":stars>=1?"🌘":"🌑"}</div>
      <h2>${end.title||"結局"}</h2>
      <div class="stars">${"★".repeat(stars)}${"☆".repeat(4-stars)}</div>
      <p style="color:#b8a074;font-size:13px">最終評分：${stars} 星</p>
      <p style="color:#8a7a5a;font-size:12px;margin-top:12px">
        已解鎖秘密線索：${S.secrets.size} / ${SECRET_SET.length}<br>
        生命值：${p.hp}　理智值：${p.san}　線索：${p.clues}　資源：${p.res}　厄運：${p.doom}
      </p>
      <div class="choices" style="max-width:340px;margin:20px auto 0">
        <button class="btn primary" id="restartGame">🔁 重新開始</button>
        <button class="btn" id="openSecretsFromEnd">🔮 查看秘密線索</button>
      </div>
    </div>
  `;
  $("#restartGame").addEventListener("click",()=>{Sound.click();clearSave();showSplash()});
  $("#openSecretsFromEnd").addEventListener("click",()=>{Sound.click();openSecrets()});
}

/* ============ 存檔 ============ */
function serialize(){
  return{v:2,player:S.player,chapter:S.chapter,history:S.history,
    secrets:[...S.secrets],ts:Date.now()};
}
function autoSave(){
  if(S.screen!=="game")return;
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()))}catch(e){}
}
function saveManual(){
  if(S.screen!=="game"){toast("⚠️ 遊戲尚未開始。");return;}
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()));toast("💾 已存檔。")}
  catch(e){toast("⚠️ 存檔失敗。")}
}
function loadManual(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw){toast("📂 沒有可用的存檔。");return;}
  try{
    const data=JSON.parse(raw);
    if(!data.player){toast("⚠️ 存檔損壞。");return;}
    S.player=data.player;
    S.chapter=data.chapter;
    S.history=data.history||[];
    S.secrets=new Set(data.secrets||[]);
    S.screen="game";
    $("#splash").style.display="none";
    $("#nav").style.display="flex";
    $("#main").innerHTML="";
    goChapter(S.chapter);
    toast("📂 讀檔成功。");
  }catch(e){toast("⚠️ 讀檔失敗。")}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function saveMeta(){
  try{
    const meta=JSON.parse(localStorage.getItem(META_KEY)||"{}");
    meta.endings=Object.assign(meta.endings||{},S.endings);
    meta.secrets=[...new Set([...(meta.secrets||[]),...S.secrets])];
    localStorage.setItem(META_KEY,JSON.stringify(meta));
  }catch(e){}
}

/* ============ 彈窗 ============ */
function openModal(html){
  const ov=$("#overlay"),md=$("#modal");
  md.innerHTML=html;ov.classList.add("on");
}
function closeModal(){$("#overlay").classList.remove("on")}
function openHelp(){
  Sound.click();
  openModal(`
    <button class="close-x" data-close="1">✕</button>
    <h2>📖 遊戲說明</h2>
    <p class="lead">改編自《詭鎮奇談：調查員冒險書 — 阿卡姆之影》。</p>
    <h3>🎯 遊戲目標</h3>
    <p>扮演三名調查員之一，在阿卡姆展開調查。你的<b class="hl">選擇</b>與<b class="hl">骰子測試</b>會決定你走向哪個章節，最終迎向不同的結局（0～4 星）。</p>
    <h3>🖥️ 看懂畫面</h3>
    <ul>
      <li>頂部 <b>🧠 意志 / 📘 智力 / ⚔️ 戰鬥</b>：測試時的加值。</li>
      <li>❤️ <b>生命值</b>、👁️ <b>理智值</b>：降到負值會削弱對應技能。</li>
      <li>🔍 <b>線索</b>、💎 <b>資源</b>：可在測試前消耗，換取「2 骰取高」或「+2 加成」。</li>
      <li>☠️ <b>厄運值</b>：累積越多，世界越危險；部分命運測試依此判定。</li>
      <li>中央 <b>打字機故事區</b>：點擊可立即顯示全文。</li>
      <li>下方 <b>按鈕</b>：你的選項。點擊灰暗的按鈕會提示缺少什麼。</li>
    </ul>
    <h3>🎲 操作流程</h3>
    <ul>
      <li>1️⃣ 選調查員 → 2️⃣ 閱讀章節 → 3️⃣ 點選項 / 擲骰 → 4️⃣ 前往新章節。</li>
      <li>測試時：按 <b>🎲 擲骰</b> 直接擲；或按「消耗線索/資源」改擲 2 骰取高。</li>
      <li>戰鬥時：逐輪擲骰。**注意：有些戰鬥只有特定輪次可消耗資源 +2**（例如三顎蜂戰只有第三輪）。</li>
    </ul>
    <h3>✨ 特殊機制</h3>
    <ul>
      <li><b>祕密線索</b>：某些章節會解鎖，收集越多越完整（共 48 條）。</li>
      <li><b>能力與弱點</b>：例如 {巫術} 或 {鬧鬼}，只在特定章節觸發加減值。</li>
      <li><b>字母謎題</b>：把地點英文名 A=1、B=2…相加，翻到該章節。</li>
      <li><b>四數字謎題</b>：把四個數字相加，翻到總和章節。</li>
    </ul>
    <div class="foot">
      <button class="btn gold" id="helpOk">✅ 我準備好了，開始遊戲</button>
    </div>
  `);
  $("#helpOk").addEventListener("click",()=>{closeModal();Sound.click()});
  $$("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal()));
}
function openLog(){
  Sound.click();
  if(S.screen!=="game"){toast("⚠️ 遊戲尚未開始。");return;}
  const rows=S.history.slice().reverse().map(h=>{
    const d=C[h.ch];
    const title=d?(d.t||"").slice(0,40).replace(/\n/g," "):"";
    return `<div class="log-item"><div class="ch">第 ${h.ch} 章</div>${esc(title)}…</div>`;
  }).join("")||`<p style="color:#8a7a5a">尚無紀錄。</p>`;
  openModal(`
    <button class="close-x" data-close="1">✕</button>
    <h2>🗺️ 冒險歷程</h2>
    <p class="lead">共 ${S.history.length} 個章節。最近的在最上面。</p>
    <div style="max-height:60vh;overflow-y:auto">${rows}</div>
    <div class="foot"><button class="btn" data-close="2">關閉</button></div>
  `);
  $$("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
}
function openSecrets(){
  Sound.click();
  const meta=(()=>{try{return JSON.parse(localStorage.getItem(META_KEY)||"{}")}catch(e){return{}}})();
  const allGot=new Set([...(meta.secrets||[]),...S.secrets]);
  const items=SECRET_SET.map(s=>{
    const got=allGot.has(s);
    return `<div class="secret-item ${got?"got":""}"><span class="dot"></span>${esc(s)}</div>`;
  }).join("");
  const endings=Object.entries(meta.endings||{}).map(([ch,e])=>{
    const stars=e.stars||0;
    return `<div class="log-item"><span class="ch">${e.title||"結局"}</span>　${"★".repeat(stars)}${"☆".repeat(4-stars)}</div>`;
  }).join("")||`<p style="color:#8a7a5a">尚未達成任何結局。</p>`;
  openModal(`
    <button class="close-x" data-close="1">✕</button>
    <h2>🔮 祕密線索 & 結局</h2>
    <p class="lead">已收集 ${allGot.size} / ${SECRET_SET.length} 條秘密線索</p>
    <div class="secret-grid">${items}</div>
    <h3>🏆 已解鎖結局</h3>
    <div>${endings}</div>
    <div class="foot"><button class="btn" data-close="2">關閉</button></div>
  `);
  $$("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
}
function openSaveLoad(){
  if(S.screen!=="game"){toast("⚠️ 遊戲尚未開始。");return;}
  Sound.click();
  openModal(`
    <button class="close-x" data-close="1">✕</button>
    <h2>💾 存檔 / 讀檔</h2>
    <p class="lead">存檔會記錄你當前的調查員、章節、屬性、物品與秘密線索。</p>
    <div class="foot">
      <button class="btn gold" id="doSave">💾 立即存檔</button>
      <button class="btn primary" id="doLoad">📂 讀取存檔</button>
      <button class="btn" id="doDel">🗑️ 刪除存檔</button>
      <button class="btn" data-close="2">取消</button>
    </div>
  `);
  $("#doSave").addEventListener("click",()=>{saveManual();closeModal()});
  $("#doLoad").addEventListener("click",()=>{loadManual();closeModal()});
  $("#doDel").addEventListener("click",()=>{clearSave();toast("🗑️ 已刪除存檔。");closeModal()});
  $$("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
}

/* ============ 事件綁定 ============ */
$("#startBtn").addEventListener("click",()=>{Sound.click();showInvestigatorSelect()});
$("#splashHelp").addEventListener("click",()=>openHelp());
$("#nav").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-act]");
  if(!btn)return;
  const act=btn.dataset.act;
  if(act==="help")openHelp();
  else if(act==="save"||act==="load")openSaveLoad();
  else if(act==="log")openLog();
  else if(act==="secrets")openSecrets();
  else if(act==="sound"){
    const on=Sound.toggle();
    $("#snd-ico").textContent=on?"🔊":"🔇";
    toast(on?"🔊 音效開啟":"🔇 音效關閉");
  }
});
document.addEventListener("pointerdown",()=>Sound.resume(),{once:true});
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});

/* ============ 初始化 ============ */
showSplash();
(function(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){
    try{
      const d=JSON.parse(raw);
      const b=document.createElement("button");
      b.className="btn";
      b.textContent=`📂 繼續存檔（第 ${d.chapter} 章 · ${d.player?.name||""}）`;
      b.style.marginTop="4px";
      b.addEventListener("click",()=>{Sound.click();loadManual()});
      const btns=document.querySelector("#splash .btns");
      if(btns)btns.appendChild(b);
    }catch(e){}
  }
})();
</script>
</body>
</html>
