`「普瓦捷，辛苦你跑一趟了。」

「哦，我的朋友，什麼時候發生的？」

「一個小時前吧，大概一點鐘的時候。我們沒動現場的任何東西，都保持著原樣。當時宅子裡還有廚師兼管家的本森太太，還有她的年輕親戚賈妮絲。本森太太一上午都跟卡森在廚房忙活，賈妮絲就在客廳聽收音機。另外還有個博格斯，一上午都在車庫那邊修汽車。」

「那阿瑟爵士的家人呢？」

「阿瑟爵士的兒子托尼在，也算是個戰爭英雄。托尼早上開車出去兜風，大概一點半才回來。聽說他們父子倆關係一直不太好，挺僵的。還有阿瑟爵士的女兒阿德萊德·哈馬克斯，她一上午大部分時間都在跟奧克斯牧師打網球。這位牧師是來做客的，原本還打算留下來吃午飯。另外還有位住客，是從溫尼伯來的斯特森·穆爾先生，我聽說他跟阿瑟爵士有生意上的往來。」

「就這些人了嗎？」

「差不多就這些了。你也瞧見了，這莊園不小。宅子裡有書房、圖書館、檯球室、廚房，另外還有個客廳，平時也當餐廳用。樓上是家人和客人的臥室。宅子東邊是網球場和槌球草坪，南邊能看見車庫，有條路從車庫通到大門口，博格斯住的門房就在大門邊上。大門外是片樹林，繞著宅子的東邊和北邊，西北那頭還有個觀賞湖。」

「我的天！蓋特探長，這麼大的地方，搜查起來可夠費勁的！」`;

「哎喲！放開我！」蒂米說，「我什麼都沒做！我發誓！」

「我們抓到他偷偷溜進莊園！」蓋特探長說，「你想審問他嗎？」

「警員們從村裡借了塊磁鐵，從湖裡撈上來這個！」他說。

/* ---------- 小工具 ---------- */
const $ = id => document.getElementById(id);

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1900);
}

function updateHeader(){
  const p = $('points');
  p.textContent = state.points;
  p.classList.toggle('low', state.points <= 1);
}

/* ---------- 側邊欄 ---------- */
function makeCard(item){
  const b = document.createElement('button');
  const isActive = currentView.type === 'entry' && currentView.id === item.id;
  b.className = 'scard'
    + (state.visited[item.id] ? ' done' : '')
    + (isActive ? ' active' : '');
  const img = IMAGES[item.id];
  b.innerHTML = `
    <div class="thumb" style="${img ? `background-image:url('${img}')` : ''}">
      ${img ? '' : `<span>${item.icon}</span>`}
      <span class="tag">${item.name}</span>
    </div>
    <div class="cinfo">
      <div class="cname">${item.name}</div>
      <div class="cmeta">${state.visited[item.id] ? '已勘查' : '未勘查'} · ${item.cost} 時間單位</div>
    </div>
    <div class="cost">${item.cost}⏳</div>
  `;
  b.onclick = () => showItem(item.id);
  return b;
}

function renderSidebar(){
  const sb = $('sidebar');
  const st = sb.scrollTop;

  const locList = $('locList');
  const susList = $('susList');
  const actList = $('actList');
  locList.innerHTML = '';
  susList.innerHTML = '';
  actList.innerHTML = '';

  LOCATIONS.forEach(it => locList.appendChild(makeCard(it)));
  SUSPECTS.forEach(it => susList.appendChild(makeCard(it)));
  if (state.phase >= 1) susList.appendChild(makeCard(S11));
  ACTIONS.forEach(it => actList.appendChild(makeCard(it)));

  sb.scrollTop = st;
}

        html += `<label><input type="radio" name="q${i}" value="${j}">${o}</label>`;
      });
      html += `</div>`;
    });
    html += `</form>
        <div style="text-align:center;margin-top:8px">
          <button class="btn" id="btnSubmit" style="padding:12px 34px;font-size:15px">宣 佈 推 理</button>
        </div>
      </div>`;
    main.innerHTML = html;
    $('btnSubmit').onclick = submitQuiz;
    return;
  }

  if (currentView.type === 'ending'){
    let body = '';
    ENDING.forEach(p => { body += `<p>${p}</p>`; });
    main.innerHTML = `
      <div class="hero">
        <div class="sub">THE REVEAL</div>
        <h2>結局揭曉</h2>
        <div class="scorebar">你的得分：${currentView.score} / 40</div>
        <div class="entry-body">${body}</div>
      </div>`;
    return;
  }
}

/* ---------- 調查行動 ---------- */
function showItem(id){
  if (state.finished) { toast('案件已結束，請重新開始'); return; }
  const item = ALL_DATA.concat([S11]).find(d => d.id === id);
  if (!item) return;

  if (!state.visited[id]){
    if (state.points < item.cost){
      toast('行動點不足，無法進行此調查');
      return;
    }
    state.points -= item.cost;
    state.visited[id] = true;
    updateHeader();
  }
  currentView = { type:'entry', id };
  renderMain();
  renderSidebar();
  $('main').scrollTop = 0;
  checkEvent();
}

/* ---------- 事件推進 ---------- */
function showEvent(title, text, note){
  currentView = { type:'event', title, text, note };
  renderMain();
  $('main').scrollTop = 0;
}

function checkEvent(){
  if (state.finished) return;
  if (state.points > 0) return;

  if (state.phase === 0){
    state.phase = 1;
    state.points = 3;
    updateHeader();
    renderSidebar();
    showEvent('事件 E1', E1_TEXT, '你獲得了 3 個新的時間單位。蒂米·詹金斯已被帶到宅子裡，可以審問他了。');
  } else if (state.phase === 1){
    state.phase = 2;
    state.points = 1;
    updateHeader();
    renderSidebar();
    showEvent('事件 E2', E2_TEXT, '你獲得了 1 個新的時間單位。');
  } else {
    state.phase = 3;
    state.finished = true;
    currentView = { type:'quiz' };
    renderMain();
    $('main').scrollTop = 0;
    toast('時間用盡 — 進入終局');
  }
}

/* ---------- 終局計分 ---------- */
function submitQuiz(){
  const form = $('quizForm');
  const data = new FormData(form);
  let score = 0;
  let answeredAll = true;

  QUIZ.forEach((q, i) => {
    const v = data.get('q' + i);
    if (v === null) { answeredAll = false; return; }
    if (parseInt(v, 10) === q.ans) score += q.pts;
  });

  if (!answeredAll){
    toast('請回答所有問題後再宣佈推理');
    return;
  }

  currentView = { type:'ending', score };
  renderMain();
  $('main').scrollTop = 0;
}

/* ---------- 重新開始 ---------- */
function resetGame(){
  state.points = 8;
  state.phase = 0;
  state.visited = {};
  state.finished = false;
  currentView = { type:'intro' };
  updateHeader();
  renderSidebar();
  renderMain();
  $('main').scrollTop = 0;
  toast('案件已重新開始');
}

/* ---------- 綁定與啟動 ---------- */
$('btnIntro').onclick = () => {
  currentView = { type:'intro' };
  renderMain(); renderSidebar();
  $('main').scrollTop = 0;
};
$('btnReset').onclick = resetGame;

updateHeader();
renderSidebar();
renderMain();
</script>
</body>
</html>
