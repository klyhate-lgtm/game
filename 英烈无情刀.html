<style>
:root{--bg:#120e0a;--panel:#241b13;--paper:#f2e6d0;--ink:#2b2118;--gold:#c9a24b;--red:#8b2c2c;--line:#4d3a28;--muted:#a89276}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#2a1d12,#0c0906 75%);color:#eadcc4;font-family:"Noto Serif TC","PMingLiU","MingLiU",serif;min-height:100vh}
header{padding:14px 18px;text-align:center;border-bottom:2px solid var(--gold);background:linear-gradient(180deg,#1b130d,#120d09)}
header h1{margin:0;font-size:26px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 12px rgba(201,162,75,.35)}
header p{margin:4px 0 0;color:var(--muted);font-size:12px}
main{max-width:1000px;margin:0 auto;padding:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.panel h2{margin:0 0 10px;font-size:20px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px}
.panel h3{margin:12px 0 6px;font-size:16px;color:#e0c98e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font-family:inherit;background:#f7edda;color:var(--ink);border:1px solid #8d7352;border-radius:4px;padding:7px;font-size:14px;width:100%}
button{font-family:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);padding:8px 13px;background:#2f241a;color:#eadcc4;font-size:14px}
button:hover{background:#3d2e20}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button.gold{background:#5a451f;border-color:var(--gold);color:#f4e2b8}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.status{font-size:13px;color:var(--muted)}
.warn{color:#e08a7a}.ok{color:#9ed49b}
.story{background:#f2e6d0;color:#2b2118;border-radius:6px;padding:16px 18px;line-height:1.85;font-size:15px;white-space:pre-wrap;min-height:120px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;background:#2f241a;color:#eadcc4;border:1px solid var(--line);padding:10px 12px;line-height:1.5}
.choice:hover{background:#40301f;border-color:var(--gold)}
.log{background:#0f0b08;border:1px solid #3a2c1e;border-radius:6px;padding:10px;height:220px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;color:#cfc0a6}
.log .hit{color:#9ed49b}.log .miss{color:#d98a7a}.log .crit{color:#ffd76a;font-weight:bold}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.stat{background:#1d1610;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.stat b{display:block;color:var(--muted);font-size:11px;font-weight:normal;margin-bottom:2px}
.stat span{font-size:16px;color:#f0dfbd}
.tag{display:inline-block;background:#35281b;border:1px solid #5a4329;border-radius:3px;padding:1px 6px;font-size:12px;color:#d8c6a6;margin:2px 3px 2px 0}
.skill-group{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:#1d1610}
.skill-group h4{margin:0 0 8px;color:#d9b96e;font-size:14px}
.skill-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skill-item{display:flex;align-items:center;gap:6px;font-size:13px}
.skill-item input{width:52px;padding:4px;text-align:center}
.skill-item label{flex:1;color:#cdbb9e}
.remain{font-size:12px;color:#d9b96e;margin-left:6px}
.remain.bad{color:#e08a7a}
.hidden{display:none!important}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

<header>
  <h1>英烈無情刀</h1>

</header>
<main>

<section id="screen-title">
  <div class="panel">
    <h2>江湖無常</h2>
    <div class="story">沒有 GM，也沒有固定劇本。

你每走一步，江湖都會自行長出新的遭遇、新的恩怨、新的線索。有人會找你麻煩，有人會向你求助，有人只是路過，卻改變了你的一生。

你要做的，是活下去，並在這個江湖裡留下自己的名字。</div>
    <div class="choices">
      <button class="choice" id="btn-newgame">踏入江湖</button>
      <button class="choice" id="btn-continue">繼續上次江湖</button>
    </div>
    <p class="status" id="titleMsg"></p>
  </div>
</section>

<section id="screen-create" class="hidden">

      <label class="field">招牌絕技<select id="c_ability"></select></label>
      <label class="field">拆招<select id="c_counter"></select></label>
      <label class="field">怪癖<select id="c_ecc"></select></label>
      <label class="field">起始地點<select id="c_place"></select></label>
    </div>
    <p class="small" id="occHint"></p>
  </div>
  <div class="panel">
    <h2>技能分配</h2>
    <p class="small">防禦 5 點（單項上限 3）；武功 4 點（單項上限 3）；其他 6 點（單項上限 3）。</p>
    <div id="skillForm"></div>
    <div class="row">
      <button class="primary" id="btn-start">踏入江湖</button>
      <span id="createMsg" class="status"></span>
    </div>
  </div>
</section>

<section id="screen-game" class="hidden">
  <div class="panel">
    <div class="hud" id="gameHud"></div>
    <div class="story" id="gameStory"></div>
    <div class="choices" id="gameChoices"></div>
  </div>
  <div class="panel">
    <h3>江湖記錄</h3>
    <div class="log" id="gameLog"></div>
    <div class="row">
      <button id="btn-save">保存江湖</button>
      <button id="btn-title">回到標題</button>
    </div>
  </div>
</section>

<section id="screen-battle" class="hidden">
  <div class="panel">
    <h2 id="battleTitle">戰鬥</h2>
    <div class="hud" id="battleHud"></div>
    <div class="story" id="battleStory"></div>
    <div class="choices" id="battleChoices"></div>
  </div>
  <div class="panel">
    <h3>交手記錄</h3>

  </div>
</section>

</main>

function pool(n){
  if(n<=0){ const a=d10(),b=d10(); return {rolls:[a,b],result:Math.min(a,b),tens:(a===10?1:0)+(b===10?1:0)}; }

  c.wits = 5 + (c.skills.wits||0);
  c.atkSkill = Math.max(c.skills.external||0, c.skills.internal||0);
  c.atkName = (c.skills.external||0) >= (c.skills.internal||0) ? "外功" : "內功";
  c.muscle = c.skills.muscle||0;
  c.maxWounds = 3;
  c.wounds = 0;
  c.killingAura = 1;
  c.killingAuraDarkness = 0;
  c.drinkingLimit = 1;
  const occ = OCCS.find(o=>o.name===c.occ) || OCCS[0];
  c.weapon = occ.weapon;
  c.wpnDmg = occ.wpnDmg;
  return c;
}

/* ================== 敵人 ================== */
function makeEnemy(npc){
  const d = npc.danger || 3;
  const base = {
    name:npc.name,
    evade: clamp(5 + Math.floor(d/3), 6, 9),
    hardiness: clamp(5 + Math.floor(d/3), 6, 9),
    wits: clamp(4 + Math.floor(d/2), 5, 9),
    atk: clamp(1 + Math.floor(d/3), 2, 4),
    dmg: clamp(1 + Math.floor(d/4), 2, 4),
    maxWounds: clamp(2 + Math.floor(d/4), 3, 5),
    desc:npc.desc
  };
  return base;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ================== 敘事生成 ================== */
function pickNPC(exclude){
  let n;
  do { n = rand(NPCS); } while(exclude && n.name === exclude && NPCS.length > 1);
  return n;
}
function pickPlace(current){
  let p;
  do { p = rand(PLACES); } while(p === current && PLACES.length > 1);
  return p;
}

function generateEncounter(){
  const types = ["stranger","inn","grudge","challenger","mystery","treasure","ally","twist"];
  let weights = [2,2,1,2,1,1,1,1];
  if(G.grudges.length > 0) weights[2] += 3;
  if(G.clues.length > 0) weights[7] += 1;
  if(G.allies.length > 0) weights[6] += 1;
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total, idx=0;
  for(let i=0;i<types.length;i++){ r-=weights[i]; if(r<=0){ idx=i; break; } }
  const type = types[idx];
  switch(type){
    case "stranger": return encounterStranger();
    case "inn": return encounterInn();
    case "grudge": return encounterGrudge();
    case "challenger": return encounterChallenger();
    case "mystery": return encounterMystery();
    case "treasure": return encounterTreasure();
    case "ally": return encounterAlly();
    case "twist": return encounterTwist();
    default: return encounterStranger();
  }
}

function addClue(text){

}
function addGrudge(name, reason){
  if(!G.grudges.some(g=>g.name===name)){

function addAlly(name, reason){
  if(!G.allies.some(a=>a.name===name)){

    log(`結交盟友：${name}`,"hit");

function log(html,cls){

/* ================== 選擇處理 ================== */
function chooseOption(ch){
  if(ch.direct){
    if(ch.direct.effect) ch.direct.effect();
    afterChoice(ch.direct, ch);
    return;
  }
  if(ch.battle){
    startBattle(ch.battle);
    return;
  }
  if(ch.check){
    const c=G.char;
    const rank = c.skills[ch.check.skill] || 0;
    const r = pool(rank);
    const success = r.result >= ch.check.tn || r.result===10;
    log(`檢定【${ch.check.desc}】${rank}d10 → [${r.rolls.join(", ")}] = ${r.result} vs TN ${ch.check.tn}｜${success?"成功":"失敗"}`, success?"hit":"miss");
    const res = success ? ch.success : ch.fail;
    if(res && res.effect) res.effect();
    if(pending && pending.enemy){
      const e = pending.enemy; pending = null;
      startBattle({enemy:e});
      return;
    }
    afterChoice(res, ch);
    return;
  }
}

function afterChoice(res, ch){
  if(!res){ res = {text:"你繼續前行。",effect:()=>{}}; }
  renderResult(res, ch);
}

/* ================== 戰鬥 ================== */

  const enemy = Object.assign({}, cfg.enemy);
  G.battle = {

    enemyWounds:0,
    playerWounds:G.char.wounds,
    round:1,
    defending:false,
    abilityUsed:false,
    winText: cfg.winText || `你擊敗了${enemy.name}。\n\n對方倒下，戰鬥結束。`,
    winEffect: cfg.winEffect || null
  };
  show("screen-battle");
  $("battleTitle").textContent = "戰鬥 · " + enemy.name;
  $("battleLog").innerHTML = "";
  blog(`遭遇 ${esc(enemy.name)}：${esc(enemy.desc)}`);
  renderBattle();
}

  };
  add(`攻擊（${c.atkName} ${c.atkSkill}d10）`, ()=>playerAttack());
  if(!b.abilityUsed) add(`使用招牌絕技：${c.ability}`, ()=>playerAbility());
  else add(`招牌絕技（本場已用）`, ()=>{}, true);
  add(`拆招防禦：${c.counter}`, ()=>playerDefend());
  add(`逃跑（輕功檢定）`, ()=>playerFlee());
}

function playerAttack(){
  const b=G.battle, c=G.char, e=b.enemy;
  const atk=pool(c.atkSkill);
  blog(`你以${c.atkName}出手：${c.atkSkill}d10 → [${atk.rolls.join(", ")}] = ${atk.result} vs 閃避 ${e.evade}`, atk.result>=e.evade?"hit":"miss");
  if(atk.result < e.evade){
    blog(`你的攻擊落空。`,"miss");
    enemyTurn();
    return;
  }
  const dmgPool = c.muscle + c.wpnDmg + (atk.result===10?1:0);
  const dmg=pool(dmgPool);
  let wounds=0;
  if(dmg.result>=e.hardiness) wounds+=1;
  if(dmg.tens>0) wounds += 1 + (dmg.tens-1);
  blog(`傷害：${dmgPool}d10 → [${dmg.rolls.join(", ")}] = ${dmg.result} vs 體魄 ${e.hardiness}｜造成 ${wounds} 點傷勢`, wounds>0?"crit":"miss");
  b.enemyWounds += wounds;
  if(b.enemyWounds >= e.maxWounds){
    blog(`${e.name}倒下了。`,"crit");
    endBattle("win");
    return;
  }
  enemyTurn();
}

function playerAbility(){
  const b=G.battle, c=G.char, e=b.enemy;
  b.abilityUsed=true;
  blog(`你施展【${c.ability}】。`);
  let bonus=2, extraDmg=1;
  if(c.ability.indexOf("影鞭")>=0){ bonus=1; extraDmg=1; }
  if(c.ability.indexOf("酒仙")>=0){ b.playerWounds=Math.max(0,b.playerWounds-1); blog(`酒意上湧，你回復 1 點傷勢。`,"hit"); }
  const atk=pool(c.atkSkill+bonus);
  blog(`絕技攻擊：${c.atkSkill+bonus}d10 → [${atk.rolls.join(", ")}] = ${atk.result} vs 閃避 ${e.evade}`, atk.result>=e.evade?"hit":"miss");
  if(atk.result < e.evade){ blog(`絕技落空。`,"miss"); enemyTurn(); return; }
  const dmgPool=c.muscle+c.wpnDmg+extraDmg;
  const dmg=pool(dmgPool);
  let wounds=0;
  if(dmg.result>=e.hardiness) wounds+=1;
  if(dmg.tens>0) wounds += 1+(dmg.tens-1);
  if(c.ability.indexOf("影鞭")>=0) wounds+=1;
  blog(`傷害：${dmgPool}d10 → [${dmg.rolls.join(", ")}] = ${dmg.result} vs 體魄 ${e.hardiness}｜造成 ${wounds} 點傷勢`, wounds>0?"crit":"miss");
  b.enemyWounds+=wounds;
  if(b.enemyWounds>=e.maxWounds){ blog(`${e.name}倒下了。`,"crit"); endBattle("win"); return; }
  enemyTurn();
}

function playerDefend(){
  const b=G.battle;
  b.defending=true;
  blog(`你擺出【${G.char.counter}】的守勢。`);
  enemyTurn();
}

function playerFlee(){
  const b=G.battle, c=G.char;
  const r=pool(c.skills.lightness||0);
  const success = r.result>=6 || r.result===10;
  blog(`逃跑檢定：${c.skills.lightness||0}d10 → [${r.rolls.join(", ")}] = ${r.result} vs TN 6｜${success?"成功":"失敗"}`, success?"hit":"miss");
  if(success){ endBattle("flee"); return; }
  blog(`你沒能擺脫對手。`,"miss");
  enemyTurn();
}

function enemyTurn(){
  const b=G.battle, c=G.char, e=b.enemy;
  if(b.defending){
    const ctrRank = c.skills.external || c.skills.lightness || 1;
    const ctr=pool(ctrRank);
    const atk=pool(e.atk);
    blog(`${e.name}以${e.name}攻來：${e.atk}d10 → [${atk.rolls.join(", ")}] = ${atk.result}；你以拆招應對：${ctrRank}d10 → [${ctr.rolls.join(", ")}] = ${ctr.result}`, ctr.result>=atk.result?"hit":"miss");
    if(ctr.result>=atk.result){
      blog(`拆招成功，攻擊被化解。`,"hit");
      b.defending=false;
      nextRound();
      return;
    }
    blog(`拆招失敗。`,"miss");
    b.defending=false;
  }
  const atk=pool(e.atk);
  blog(`${e.name}攻擊：${e.atk}d10 → [${atk.rolls.join(", ")}] = ${atk.result} vs 你的閃避 ${c.evade}`, atk.result>=c.evade?"miss":"hit");
  if(atk.result < c.evade){ blog(`你避開了。`,"hit"); nextRound(); return; }
  const dmg=pool(e.dmg);
  let wounds=0;
  if(dmg.result>=c.hardiness) wounds+=1;
  if(dmg.tens>0) wounds+=1+(dmg.tens-1);
  blog(`傷害：${e.dmg}d10 → [${dmg.rolls.join(", ")}] = ${dmg.result} vs 你的體魄 ${c.hardiness}｜你受到 ${wounds} 點傷勢`, wounds>0?"crit":"miss");
  b.playerWounds+=wounds;
  if(b.playerWounds>=c.maxWounds){
    blog(`你倒下了。`,"crit");
    endBattle("lose");
    return;
  }
  nextRound();
}

function nextRound(){
  G.battle.round++;
  renderBattle();
}

function endBattle(result){
  const b=G.battle;
  G.char.wounds = b.playerWounds;
  saveGame(false);
  if(result==="win"){
    log(`你擊敗了${b.enemy.name}。`,"hit");
    if(G.char.wounds>0){ G.char.wounds=Math.max(1,G.char.wounds-1); log(`戰鬥後你簡單包紮，回復 1 點傷勢。`,"hit"); }
    if(b.winEffect) b.winEffect();
    G.reputation += 1;
    renderResult({text:b.winText,effect:null}, null);
  }else if(result==="flee"){
    log(`你逃離了戰鬥。`,"miss");
    G.reputation -= 1;
    renderResult({text:`你趁隙脫身，頭也不回地跑了。\n\n${b.enemy.name}沒有追來，或者追不上。\n\n無論如何，你活下來了。`,effect:null}, null);
  }else{
    log(`你敗了。`,"miss");
    G.char.wounds = G.char.maxWounds;
    renderResult({text:`你倒在地上。\n\n意識模糊之前，你看見${b.enemy.name}走近。\n\n「這次留你一命。」\n\n你醒來時，身上多了幾道傷，懷裡的東西也少了幾樣。\n\n江湖還在繼續。`,effect:()=>{ G.reputation -= 2; }}, null);
  }
}

/* ================== 存讀檔 ================== */
function saveGame(showMsg){
  if(!G) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
    if(showMsg) log("江湖已保存。","hit");
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(!data || !data.char) return false;
    G=data;
    if(G.battle) G.battle=null;
    log(`讀取江湖：${G.char.name}，地點 ${G.location}。`);
    const next = generateEncounter();
    renderEncounter(next);
    return true;
  }catch(e){ return false; }
}

/* ================== 創建角色 ================== */
function initCreate(){
  $("c_occ").innerHTML = OCCS.map(o=>`<option value="${esc(o.name)}">${esc(o.name)}</option>`).join("");
  $("c_ability").innerHTML = ABILITIES.map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("");
  $("c_counter").innerHTML = COUNTERS.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("");
  $("c_ecc").innerHTML = ECCS.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("");
  $("c_place").innerHTML = PLACES.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
  $("c_occ").addEventListener("change", updateOccHint);
  updateOccHint();
  buildSkillForm();
}
function updateOccHint(){
  const occ=OCCS.find(o=>o.name===$("c_occ").value)||OCCS[0];
  $("occHint").textContent = `職業加成：${occ.bonus}｜武器：${occ.weapon}`;
}
function buildSkillForm(){
  const box=$("skillForm"); box.innerHTML="";
  Object.keys(SKILL_CATS).forEach(k=>{
    const cat=SKILL_CATS[k];
    const g=document.createElement("div"); g.className="skill-group";
    g.innerHTML=`<h4>${esc(cat.name)} <span class="remain" id="rem_${k}">剩餘 ${cat.points} 點</span></h4>`;
    const list=document.createElement("div"); list.className="skill-list";
    cat.skills.forEach(([key,label])=>{
      const item=document.createElement("div"); item.className="skill-item";
      item.innerHTML=`<label>${esc(label)}</label><input type="number" id="sk_${key}" value="0" min="0" max="${cat.max}">`;
      list.appendChild(item);
    });
    g.appendChild(list); box.appendChild(g);
  });
  box.addEventListener("input", updateRemain);
  updateRemain();
}
function updateRemain(){
  Object.keys(SKILL_CATS).forEach(k=>{
    const cat=SKILL_CATS[k]; let used=0;
    cat.skills.forEach(([key])=>{
      const el=$("sk_"+key); if(el) used+=Math.max(0,parseInt(el.value||"0",10)||0);
    });
    const el=$("rem_"+k);
    if(el){ el.textContent=`剩餘 ${cat.points-used} 點`; el.classList.toggle("bad", used>cat.points); }
  });
}
function getSkillVals(){
  const v={};
  document.querySelectorAll("#skillForm input[type=number]").forEach(inp=>{
    v[inp.id.replace("sk_","")]=Math.max(0,parseInt(inp.value||"0",10)||0);
  });
  return v;
}
function validateCreate(){
  for(const k in SKILL_CATS){
    const cat=SKILL_CATS[k]; let used=0;
    for(const [key,label] of cat.skills){
      const el=$("sk_"+key);
      const v=Math.max(0,parseInt(el.value||"0",10)||0);
      if(v>cat.max) return `${cat.name}的「${label}」超過上限 ${cat.max}。`;
      used+=v;
    }
    if(used>cat.points) return `${cat.name}分配過多：已用 ${used}，上限 ${cat.points}。`;
  }
  return null;
}

$("btn-start").addEventListener("click", ()=>{
  const err=validateCreate();
  if(err){ $("createMsg").textContent=err; $("createMsg").className="status warn"; return; }
  const c={
    name:$("c_name").value.trim()||"無名俠客",
    occ:$("c_occ").value,
    ability:$("c_ability").value,
    counter:$("c_counter").value,
    ecc:$("c_ecc").value,
    place:$("c_place").value,
    skills:getSkillVals()
  };
  derive(c);
  G={
    char:c,
    location:c.place,
    turn:1,
    grudges:[],
    allies:[],
    clues:[],
    reputation:0,
    battle:null
  };
  log(`【${c.name}】踏入江湖。職業：${c.occ}；絕技：${c.ability}；拆招：${c.counter}。`);
  const first = generateEncounter();
  renderEncounter(first);
});

/* ================== 標題 ================== */
function refreshTitle(){
  const raw=localStorage.getItem(SAVE_KEY);
  $("btn-continue").disabled = !raw;
  $("titleMsg").textContent = raw ? "已有保存的江湖。" : "尚無保存的江湖。";
}
$("btn-newgame").addEventListener("click", ()=>{
  show("screen-create");
  $("createMsg").textContent="";
  $("c_name").value="";
  document.querySelectorAll("#skillForm input[type=number]").forEach(i=>i.value="0");
  updateRemain();
});
$("btn-continue").addEventListener("click", ()=>{
  if(!loadGame()){ $("titleMsg").textContent="讀取失敗，請重新開始。"; }
});
$("btn-save").addEventListener("click", ()=>saveGame(true));
$("btn-title").addEventListener("click", ()=>{ show("screen-title"); refreshTitle(); });

/* ================== 啟動 ================== */
initCreate();
refreshTitle();
show("screen-title");
</script>
</body>
