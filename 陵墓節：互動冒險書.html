<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>陵墓節：互動冒險書</title>
<style>
:root{--parch:#e8d9b5;--parch2:#d8c18d;--ink:#2b2115;--gold:#b8862e;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1b140d;color:var(--ink);font-family:"Georgia","Noto Serif TC",serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(255,230,160,.18),transparent 30%),radial-gradient(circle at 80% 80%,rgba(120,70,30,.22),transparent 35%),repeating-linear-gradient(0deg,rgba(80,50,20,.05) 0 2px,transparent 2px 5px),#2a1d12;padding-bottom:86px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.75)}
#app{max-width:1180px;margin:0 auto;min-height:100vh;background:linear-gradient(135deg,var(--parch),var(--parch2));border-left:1px solid #8b6c3d;border-right:1px solid #8b6c3d}
#topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:linear-gradient(#3a2818,#24170e);color:#f6e7c1;border-bottom:2px solid var(--gold);box-shadow:0 3px 14px rgba(0,0,0,.45)}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,220,150,.25);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
#main{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:14px}
@media(max-width:860px){#main{grid-template-columns:1fr}}
#scene{grid-column:1/-1;height:190px;border:2px solid #8b6c3d;border-radius:10px;overflow:hidden;background:#0d141c;position:relative;box-shadow:inset 0 0 40px #000}
#svgScene{width:100%;height:100%;display:block}
#storyPanel{background:rgba(255,250,235,.72);border:2px solid #8b6c3d;border-radius:10px;padding:14px;min-height:300px;box-shadow:0 6px 20px rgba(60,35,10,.25)}
#story{white-space:pre-wrap;line-height:1.75;font-size:17px;color:#21170d;min-height:180px;cursor:pointer}
#choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
button{font-family:inherit;cursor:pointer}
.choice,.navbtn,.modal button{border:1px solid #6e4c24;background:linear-gradient(#f7e8c4,#dcc18b);color:#24170d;border-radius:8px;padding:11px 13px;font-size:15px;text-align:left;box-shadow:0 2px 0 #8b6c3d;transition:.15s}
.choice:hover,.navbtn:hover,.modal button:hover{filter:brightness(1.07);transform:translateY(-1px)}
.choice:active,.navbtn:active,.modal button:active{transform:translateY(1px);box-shadow:0 0 0 #8b6c3d}
#sidePanel{display:flex;flex-direction:column;gap:10px}
.panel{background:rgba(255,248,230,.72);border:2px solid #8b6c3d;border-radius:10px;padding:10px}
.panel h3{margin:0 0 8px;font-size:15px;color:#4a2e14;border-bottom:1px solid #b99a64;padding-bottom:5px}
.chipRow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 7px;border-radius:999px;background:#3a2818;color:#ffe2a1;font-size:12px;border:1px solid var(--gold)}
.muted{color:#7b6748;font-size:13px}
ul.clean{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;font-size:13px}
ul.clean li{padding:3px 0;border-bottom:1px dotted #c6ad80}
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:linear-gradient(#2a1b10,#120c07);border-top:2px solid var(--gold)}
.navbtn{font-size:12px;padding:8px 9px;text-align:center;border-radius:8px;min-width:52px}
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px}
#modal.hidden{display:none}
.modal-content{max-width:800px;width:100%;max-height:86vh;overflow:auto;background:linear-gradient(135deg,#f4e6c3,#dcc18b);border:3px double #6e4c24;border-radius:12px;padding:18px;box-shadow:0 20px 80px #000;color:#22160c}
.modal h2{margin:0 0 10px;font-size:22px;color:#4a2e14;border-bottom:2px solid var(--gold);padding-bottom:8px}
.modalBody{font-size:15px;line-height:1.7}
.modalBody h3{color:#5b3516;margin:14px 0 6px}
.modalBody h4{color:#6e4c24;margin:10px 0 4px;font-size:14px}
.modalBody table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.modalBody th,.modalBody td{border:1px solid #b99a64;padding:4px 6px;text-align:left}
.modalBody th{background:rgba(139,108,61,.15)}
.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1d130b;color:#ffe4a6;border:1px solid var(--gold);padding:10px 16px;border-radius:999px;z-index:200;transition:.25s;max-width:90vw;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){#topbar{font-size:12px;gap:5px;padding:6px}.stat{font-size:12px;padding:3px 7px}#story{font-size:16px}#scene{height:150px}.navbtn{font-size:11px;padding:7px 5px;min-width:46px}}
.twinkle{animation:tw 2.6s infinite alternate}@keyframes tw{from{opacity:.25}to{opacity:1}}
.mist{animation:mist 9s linear infinite}@keyframes mist{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.flag{animation:flag 3s ease-in-out infinite alternate}@keyframes flag{from{transform:skewY(-2deg)}to{transform:skewY(2deg)}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="stat">❤️ <span id="hp">11</span>/<span id="maxHp">11</span></div>
    <div class="stat">🪙 <span id="gold">0</span></div>
    <div class="stat">📅 第<span id="day">1</span>天</div>
    <div class="stat">⏳ <span id="time">0</span>/5</div>
    <div class="stat">🎒 <span id="invCount">0</span></div>
    <div class="stat">🔖 <span id="eventCount">0</span></div>
    <div class="stat" id="modeStat" style="display:none">👥 雙人</div>
  </header>
  <main id="main">
    <section id="scene"><svg id="svgScene" viewBox="0 0 900 190" preserveAspectRatio="xMidYMid slice"></svg></section>
    <section id="storyPanel"><div id="story">正在準備冒險書……</div><div id="choices"></div></section>
    <aside id="sidePanel">
      <div class="panel"><h3>🔖 事件追蹤</h3><div id="eventsList" class="chipRow"><span class="muted">尚無</span></div></div>
      <div class="panel"><h3>🎒 物品欄</h3><ul id="inventoryList" class="clean"><li class="muted">尚無</li></ul></div>
      <div class="panel"><h3>🧭 歷史紀錄</h3><ul id="historyList" class="clean"><li class="muted">尚無</li></ul></div>
      <div class="panel"><h3>🏆 成就</h3><ul id="achievementList" class="clean"><li class="muted">尚無</li></ul></div>
    </aside>
  </main>
  <nav id="bottomNav">
    <button class="navbtn" onclick="Game.openManual()">說明</button>
    <button class="navbtn" onclick="Game.openAppendix()">附錄</button>
    <button class="navbtn" onclick="Game.saveGame()">存檔</button>
    <button class="navbtn" onclick="Game.loadGame()">讀檔</button>
    <button class="navbtn" onclick="Game.openHistory()">歷史</button>
    <button class="navbtn" onclick="Game.openAchievements()">成就</button>
    <button class="navbtn" id="soundBtn" onclick="Game.toggleSound()">音效：開</button>
    <button class="navbtn" onclick="Game.resetGame()">重置</button>
  </nav>
</div>
<div id="modal" class="hidden"><div class="modal-content"><h2 id="modalTitle"></h2><div id="modalBody" class="modalBody"></div><div id="modalActions" class="modalActions"></div></div></div>
<div id="toast"></div>

<script>
/* 建立全域錯誤捕捉，若有錯誤直接顯示在畫面上 */
window.onerror = function(msg, url, line) {
  var el = document.getElementById('story');
  if (el) el.innerHTML = '<span style="color:red;font-weight:bold;">⚠️ 系統錯誤：' + msg + '<br>行號：' + line + '</span>';
  return false;
};

(function() {
  const SAVE_KEY='festivalTombs_final_v3', ACH_KEY='festivalTombsAch_final_v3';
  const ACH_NAMES={success:'序章破案',wrong:'錯誤指控',partial:'部分真相',death:'死亡',fullClues:'全線索調查員',mainStart:'抵達切斯特拉爾',pirate:'海盜倖存',ghost:'幽靈船長',level2:'晉升 2 級',cityStart:'城市探索',bounty:'完成懸賞',seance:'成功通靈',watergate:'修復水閘',randomEnc:'擊敗隨機遭遇',paperwork:'完成官僚手續',boneQueen:'晉見骨后',enara:'揭發埃納拉',jotham:'揭露約坦',excavator:'揭發挖掘者',pandjed:'發現潘傑德',chiefReport:'向首席法師報告',trueEnding:'真結局：陵墓節英雄',boneQueenSlain:'擊敗骨后',fourThreats:'四線終結',allFiveThreats:'五線全通',duoMode:'雙人模式',appendixOpened:'查閱附錄'};

  const $ = function(id) { return document.getElementById(id); };

  function fresh(){
    return {phase:'manual',entry:'0000',hp:11,maxHp:11,gold:0,day:1,time:0,events:[],inventory:[],history:[],achievements:[],sound:true,clues:{},mission:null,companion:null,season:null,combat:null,level:1,bounties:[],threats:{},duo:false};
  }

  let state = fresh();
  try {
    let ach = JSON.parse(localStorage.getItem(ACH_KEY)||'[]');
    if(Array.isArray(ach)) state.achievements = ach;
  } catch(e) {}

  function d20(m=0){return Math.floor(Math.random()*20)+1+m;}
  function rnd(n){return Math.floor(Math.random()*n)+1;}
  function has(id){return state.events.indexOf(String(id)) > -1;}
  
  function mark(id){
    id=String(id);
    if(!has(id)) state.events.push(id);
  }
  
  function item(n){
    if(state.inventory.indexOf(n) === -1) state.inventory.push(n);
  }
  
  function drop(n){
    let i = state.inventory.indexOf(n);
    if(i>=0) state.inventory.splice(i,1);
  }
  
  function hist(t){
    state.history.push('['+state.day+'天·'+state.time+'時] '+t);
    if(state.history.length>350) state.history.shift();
  }
  
  function adv(n=1){
    state.time=Math.min(5,state.time+n);
    if(state.time>=5) toast('時段已滿 5，建議回長羽旅館長休息。');
  }
  
  function toast(m){
    let t=$('toast');
    if(!t) return;
    t.textContent=m;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm=setTimeout(function(){t.classList.remove('show');},2400);
  }
  
  function sfx(t){
    t = t || 'click';
    if(!state.sound) return;
    try{
      let c = window._ac || (window._ac = new (window.AudioContext || window.webkitAudioContext)());
      let o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine';
      let f = {click:440,hit:160,win:660,lose:110,dice:300}[t] || 440;
      o.frequency.value=f;
      g.gain.setValueAtTime(.045,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);
      o.start(); o.stop(c.currentTime+.13);
    }catch(e){}
  }

  function unlock(a){
    if(state.achievements.indexOf(a) === -1){
      state.achievements.push(a);
      try{ localStorage.setItem(ACH_KEY,JSON.stringify(state.achievements)); }catch(e){}
      side();
      toast('🏆 '+(ACH_NAMES[a]||a));
    }
  }
  
  function countThreats(){return Object.keys(state.threats).filter(k=>state.threats[k]).length;}

  let tmr=null, full='';
  function story(t){
    full=t||'';
    let el=$('story');
    if(!el) return;
    el.textContent='';
    clearInterval(tmr);
    let i=0;
    el.onclick=function(){clearInterval(tmr);el.textContent=full;};
    tmr=setInterval(function(){
      if(i>=full.length){clearInterval(tmr);return;}
      el.textContent+=full[i++];
    },14);
  }

  function stats(){
    if(!$('hp')) return;
    $('hp').textContent=Math.max(0,state.hp);
    $('maxHp').textContent=state.maxHp;
    $('gold').textContent=state.gold;
    $('day').textContent=state.day;
    $('time').textContent=state.time;
    $('invCount').textContent=state.inventory.length;
    $('eventCount').textContent=state.events.length;
    $('soundBtn').textContent='音效：'+(state.sound?'開':'關');
    $('modeStat').style.display=state.duo?'inline-block':'none';
  }
  
  function side(){
    if(!$('eventsList')) return;
    $('eventsList').innerHTML=state.events.length?state.events.map(e=>'<span class="chip">#'+e+'</span>').join(''):'<span class="muted">尚無</span>';
    $('inventoryList').innerHTML=state.inventory.length?state.inventory.map(i=>'<li>'+i+'</li>').join(''):'<li class="muted">尚無</li>';
    $('historyList').innerHTML=state.history.length?state.history.slice(-30).reverse().map(h=>'<li>'+h+'</li>').join(''):'<li class="muted">尚無</li>';
    $('achievementList').innerHTML=state.achievements.length?state.achievements.map(a=>'<li>🏆 '+(ACH_NAMES[a]||a)+'</li>').join(''):'<li class="muted">尚無</li>';
  }

  function getSceneSVG(type){
    type = type || 'ship';
    let stars = '';
    for(let i=0; i<26; i++){
      let x = (i*67)%900;
      let y = (i*31)%108;
      let r = i%3===0 ? 1.6 : 1;
      let d = (i%7)*0.3;
      stars += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#ffe9a8" class="twinkle" style="animation-delay:'+d+'s"/>';
    }
    let base = '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#1d3147"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16364a"/><stop offset="1" stop-color="#071018"/></linearGradient></defs><rect width="900" height="190" fill="url(#sky)"/>'+stars+'<rect y="128" width="900" height="62" fill="url(#water)"/><path d="M0 130 Q80 122 160 130 T320 130 T480 130 T640 130 T800 130 T900 128 V190 H0Z" fill="#0b1d28" opacity="0.8"/>';
    
    if(type==='combat') return base+'<rect y="145" width="900" height="45" fill="#1b120b"/><path d="M0 150 Q120 138 240 150 T480 150 T720 150 T900 148 V190 H0Z" fill="#382313"/><g class="mist"><ellipse cx="450" cy="165" rx="260" ry="18" fill="#7ea88c" opacity="0.18"/></g><text x="640" y="40" fill="#ffd27a" font-size="16" font-family="serif">戰鬥</text>';
    
    if(type==='city') {
      let rects = '';
      let xs = [80,170,280,390,520,650,780];
      for(let i=0; i<xs.length; i++){
        let x = xs[i];
        let h = 92 - (i%3)*14;
        let y = 58 + (i%3)*14;
        rects += '<rect x="'+x+'" y="'+y+'" width="'+(70+i*4)+'" height="'+h+'" fill="#3b2a1b" stroke="#7d5b31"/><rect x="'+(x+10)+'" y="'+(y+16)+'" width="12" height="16" fill="#ffd27a" class="twinkle"/><rect x="'+(x+30)+'" y="'+(y+16)+'" width="12" height="16" fill="#ffd27a" class="twinkle" style="animation-delay:0.4s"/>';
      }
      return base+'<rect y="118" width="900" height="72" fill="#24170e"/>'+rects+'<text x="620" y="36" fill="#ffe1a0" font-size="16" font-family="serif">切斯特拉爾</text>';
    }
    if(type==='temple') return base+'<rect y="118" width="900" height="72" fill="#24170e"/><path d="M350 190 V90 Q450 40 550 90 V190Z" fill="#6e4a25" stroke="#c99a4a" stroke-width="3"/><text x="380" y="40" fill="#ffe1a0" font-size="16" font-family="serif">安伯林神廟</text>';
    
    if(type==='seance') {
      let rects = '';
      let xs = [180,320,460,600,740];
      for(let i=0; i<xs.length; i++){
        let x = xs[i];
        rects += '<rect x="'+x+'" y="70" width="60" height="60" fill="#4a2a2a" stroke="#b8862e"/><circle cx="'+(x+30)+'" cy="88" r="6" fill="#a0d0e0" class="twinkle"/>';
      }
      return base+'<rect y="118" width="900" height="72" fill="#1a0f10"/>'+rects+'<text x="600" y="36" fill="#ffe1a0" font-size="16" font-family="serif">降神會街</text>';
    }
    if(type==='watermill') return base+'<rect y="118" width="900" height="72" fill="#24170e"/><circle cx="450" cy="120" r="50" fill="none" stroke="#8b6c3d" stroke-width="4"/><circle cx="450" cy="120" r="30" fill="none" stroke="#8b6c3d" stroke-width="2"/><text x="560" y="40" fill="#ffe1a0" font-size="16" font-family="serif">水磨·水門</text>';
    
    if(type==='sewer') {
      let rects = '';
      let xs = [160,290,420,550,680];
      for(let i=0; i<xs.length; i++){
        let x = xs[i];
        let y = 100 - (i%3)*8;
        rects += '<rect x="'+x+'" y="'+y+'" width="60" height="60" fill="#1d2d1d" stroke="#3f5b3f"/><circle cx="'+(x+30)+'" cy="'+(y+20)+'" r="4" fill="#6fb86f" class="twinkle"/>';
      }
      return base+'<rect y="118" width="900" height="72" fill="#0d1a0d"/>'+rects+'<g class="mist"><ellipse cx="450" cy="150" rx="300" ry="14" fill="#5b8a5b" opacity="0.22"/></g><text x="600" y="36" fill="#b8e0b8" font-size="16" font-family="serif">下水道</text>';
    }
    
    if(type==='canal') {
      let paths = '';
      let xs = [220,380,540,700];
      for(let i=0; i<xs.length; i++){
        let x = xs[i];
        paths += '<path d="M'+x+' 145 Q'+(x+40)+' 135 '+(x+80)+' 145 L'+(x+70)+' 165 L'+(x+10)+' 165Z" fill="#5c3a1d" stroke="#c99a4a"/>';
      }
      return base+'<rect y="118" width="900" height="72" fill="#1a2a3a"/>'+paths+'<text x="600" y="36" fill="#a8d4e8" font-size="16" font-family="serif">運河</text>';
    }
    if(type==='bonequeen') return base+'<rect y="118" width="900" height="72" fill="#1a0d16"/><rect x="380" y="50" width="140" height="140" fill="#3b2a1b" stroke="#8b6c3d"/><circle cx="450" cy="100" r="20" fill="#6e4a25" stroke="#c99a4a" stroke-width="2"/><text x="550" y="40" fill="#ffe1a0" font-size="16" font-family="serif">骨后·廢墟</text>';
    if(type==='boat') return base+'<path d="M200 135 L700 135 L640 170 L260 170Z" fill="#5c3a1d" stroke="#c99a4a"/><text x="600" y="40" fill="#ffd27a" font-size="16" font-family="serif">救生艇</text>';
    if(type==='ghost') return base+'<rect y="145" width="900" height="45" fill="#101420"/><g class="mist"><ellipse cx="450" cy="150" rx="300" ry="20" fill="#a0d0e0" opacity="0.22"/></g><path d="M400 50 Q430 20 470 50 Q500 30 500 80 L480 140 L440 140 L420 90 Q400 70 400 50Z" fill="#a0d0e0" opacity="0.5"/><text x="560" y="40" fill="#ffd27a" font-size="16" font-family="serif">幽靈船長</text>';
    if(type==='chief') return base+'<rect y="118" width="900" height="72" fill="#2a1d12"/><rect x="330" y="60" width="240" height="130" fill="#3b2a1b" stroke="#b8862e" stroke-width="2"/><rect x="360" y="80" width="60" height="60" fill="#ffd27a" opacity="0.5"/><rect x="480" y="80" width="60" height="60" fill="#a0d0e0" opacity="0.5"/><text x="560" y="36" fill="#ffe1a0" font-size="16" font-family="serif">首席法師</text>';
    
    if(type==='festival') {
      let paths = '';
      let xs = [120,240,360,480,600,720];
      for(let i=0; i<xs.length; i++){
        let x = xs[i];
        let d = i * 0.3;
        paths += '<path d="M'+x+' 190 L'+x+' 80 L'+(x+40)+' 80 L'+(x+40)+' 190Z" fill="#4a2a1a" stroke="#c99a4a"/><circle cx="'+(x+20)+'" cy="60" r="10" fill="#ffd27a" class="twinkle" style="animation-delay:'+d+'s"/>';
      }
      return base+'<rect y="118" width="900" height="72" fill="#24170e"/>'+paths+'<path d="M100 100 Q450 50 800 100" fill="none" stroke="#c99a4a" stroke-width="2"/><text x="600" y="36" fill="#ffe1a0" font-size="16" font-family="serif">陵墓節·週末慶典</text>';
    }

  function startCombat(cfg){
    state.combat = {
      round:1,
      enemies: cfg.enemies.map(k => {
        let m = Object.assign({}, MONSTERS[k]);
        m.key = k;
        return m;
      }),
      victory: cfg.victory,
      defeat: cfg.defeat || 'death_end',
      flee: cfg.flee,
      fleeDC: cfg.fleeDC || 10,
      intro: cfg.intro || '',
      bonus: cfg.bonus || ''
    };
    renderCombat();
  }

  function renderCombat(){
    let c = state.combat;
    if(!c){ go(state.entry); return; }
    state.phase='combat';
    $('svgScene').innerHTML = getSceneSVG('combat');
    let enemy = c.enemies[0];
    let bonusInfo = c.bonus==='fog' ? '\n【魔法迷霧】骨后可看穿迷霧，你看不清她——攻擊 -2 懲罰（本版簡化為 AC +2）。\n' : '';
    story('【戰鬥：'+(c.intro||enemy.name)+'】\n'+enemy.desc+bonusInfo+'\n'+enemy.name+' HP：'+Math.max(0,enemy.hp)+'/'+MONSTERS[enemy.key].hp+'　AC：'+(enemy.ac+(c.bonus==='fog'?2:0))+'\n你的 HP：'+Math.max(0,state.hp)+'/'+state.maxHp+'\n回合：'+c.round+'\n\n▶ 選擇行動。');
    
    let atkBonus = state.duo ? 5 : 4;
    let list = [{
      label:'攻擊 '+enemy.name+'（d20+'+atkBonus+'，1d8+2）',
      do:function(){
        sfx('dice');
        let h = d20(atkBonus);
        if(h >= enemy.ac + (c.bonus==='fog'?2:0)){
          let d = 3 + rnd(8);
          enemy.hp -= d;
          sfx('hit');
          toast('命中！'+d+' 點傷害。');
        } else {
          toast('未命中（'+h+'）。');
        }
        afterPlayerTurn();
      }
    }];

    if(c.flee){
      list.push({
        label:'逃跑（DC '+c.fleeDC+' 敏捷）',
        do:function(){
          sfx('dice');
          let r = d20(2);
          toast('敏捷：'+r);
          if(r >= c.fleeDC){
            state.combat = null;
            go(c.flee);
          } else {
            toast('逃跑失敗！');
            enemyTurn();
          }
        }
      });
    }

    if(state.inventory.indexOf('治療藥水') > -1){
      list.push({
        label:'使用治療藥水',
        do:function(){
          drop('治療藥水');
          let h = 2 + rnd(4) + rnd(4);
          state.hp = Math.min(state.maxHp, state.hp + h);
          toast('恢復 '+h+' 點。');
          stats();
          renderCombat();
        }
      });
    }
    choices(list);
    stats();
  }

  function afterPlayerTurn(){
    let c = state.combat;
    if(!c) return;
    if(c.enemies[0].hp <= 0){
      state.combat = null;
      hist('戰鬥勝利');
      go(c.victory);
      return;
    }
    enemyTurn();
  }

  function enemyTurn(){
    let c = state.combat;
    if(!c) return;
    let e = c.enemies[0];
    let h = d20(e.atk);
    if(h >= 12){
      let d = 1 + rnd(6) + (e.atk>=5 ? 2 : 0);
      state.hp -= d;
      sfx('hit');
      toast(e.name+'命中你，'+d+' 點傷害。');
      if(e.drain){
        let s = rnd(4);
        state.maxHp = Math.max(5, state.maxHp - s);
        toast('暗影汲取！最大 HP -'+s+'。');
      }
      if(e.special==='ghast' && Math.random()<0.3){
        let extra = rnd(4); state.hp -= extra;
        toast('惡臭令你噁心，額外 '+extra+' 點傷害。');
      }
      if(e.special==='fire' && Math.random()<0.4){
        let extra = rnd(4); state.hp -= extra;
        toast('胸甲灼燒你，額外 '+extra+' 點火焰傷害。');
      }
      if(e.special==='enara' && Math.random()<0.3){
        let extra = rnd(4); state.hp -= extra;
        toast('巨劍橫掃，額外 '+extra+' 點傷害。');
      }
    } else {
      toast(e.name+'撲空（'+h+'）。');
    }
    if(state.hp <= 0){
      state.combat = null;
      go(c.defeat);
      return;
    }
    c.round++;
    stats();
    renderCombat();
  }

  E['epilogue_start']={scene:'festival',onEnter:function(){if(countThreats()>=4)unlock('fourThreats');if(countThreats()>=5)unlock('allFiveThreats');mark('249');hist('進入尾聲');},text:function(){return '1225\n覺醒節的最後一天黎明降臨。今天是陵墓節——本週第三場，也是最後一場慶典。\n\n你發現公共休息室已經擠滿了人，氣氛略帶肅穆——這週有人失去了生命——但你仍能感受到這場年度活動的興奮。\n\n陵墓節不僅僅是一個節日，它慶祝著生者與死者之間的重要契約。\n\n▶ 聽多里安致辭。';},choices:[{label:'聽多里安致辭',goto:'epilogue_dorian'}]};
  E['epilogue_dorian']={scene:'festival',text:'1225\n酒館老闆多里安站在吧台上：\n\n「我在切斯特拉爾住了十八年，除了親友，最美好的部分就是覺醒節。今年情況有些不同。悲劇壓在我們心頭，我們擔憂儀式的未來，也擔憂城市的未來。但今天，我們要將這一切拋在腦後，盡情享用美食！」\n\n觀眾高呼「萬歲！」。\n\n「現在我有一個重要公告——」',choices:[{label:'繼續聽',goto:'epilogue_dorian_2'}]};
  E['epilogue_dorian_2']={scene:'festival',text:function(){return '多里安繼續說：\n\n「我原本計劃今年退休，這將是我最後一次慶祝陵墓節。但'+(countThreats()>=4?'多虧了這些冒險者，城市安然度過了危機':'今年城市經歷了太多，我決定再留一年')+'——」\n\n'+(countThreats()>=4?'「這些冒險者不僅保住了慶典，更保住了我們與死者之間的契約。讓我們為他們歡呼！」':'「但無論如何，我感謝所有留下來的人。」')+'\n\n人群爆發出熱烈掌聲。';},choices:[{label:'🎉 繼續慶典',goto:'epilogue_parade'}]};
  E['epilogue_parade']={scene:'festival',text:function(){return '尾聲·遊行\n\n遊行隊伍穿過沃克斯區，裝飾華麗的馬車、穿著戲服的遊行者，以及城市官員的隊伍。\n\n你坐在遊行馬車上，看著街道兩旁的市民歡呼。\n\n'+(countThreats()>=5?'幾乎所有認識你的人都向你致意——這座城市記得你的名字。':countThreats()>=3?'幾位市民向你點頭致意，感謝你的付出。':'人群中有幾張熟悉的臉，但多數人並不知道你做了什麼。')+'\n\n▶ 繼續前往盛宴。';},choices:[{label:'前往盛宴',goto:'epilogue_feast'}]};
  E['epilogue_feast']={scene:'festival',text:'尾聲·盛宴\n\n傍晚時分，遊行隊伍抵達神廟區和碼頭之間的空曠田野。幾十張桌子準備就緒，擺滿了豐盛的食物。\n\n賈拉尼跑過來，她的姐妹們跟在身後：\n\n「斯坦尼爾說他會留我在身邊工作！等我處理完自己的事務，就會回到切斯特拉爾，擔任他的本地代理人！」\n\n阿貝拉爾德舉起酒杯：「為這座城市！」\n\n▶ 舉杯。',choices:[{label:'舉杯',goto:'epilogue_final'}]};
  E['epilogue_final']={scene:'festival',text:function(){
    var t = '1235\n宴會持續到深夜。\n\n';
    if(countThreats()>=4){
      t += '你環顧四周。斯圖弗頓勳爵、賈拉尼、市長、首席法師……這座城市的所有人都記得你。\n\n阿貝拉爾德拍了拍你的肩膀：「我們做到了，朋友。不僅僅是序章的石碑——我們拯救了整座城市。」\n\n';
    } else {
      t += '你環顧四周，看到城市的居民們正享受這難得的平靜。\n\n阿貝拉爾德遞給你一杯酒：「今年雖然不完美，但我們盡力了。」\n\n';
    }
    t += '夜空中升起燈籠，寫著逝者名字。你想起這週經歷的一切——\n\n';
    if(Object.keys(state.threats).length){
      t += Object.keys(state.threats).map(function(k){return {enara:'腐敗的行政官埃納拉',jotham:'亡靈法師約坦',excavator:'任性幽靈挖掘者',pandjed:'龍裔食屍鬼潘傑德',boneQueen:'廢墟死靈女王骨后'}[k];}).filter(function(k){return k;}).join('\n') + '\n\n';
    } else {
      t += '還有許多未解之謎，但你已盡力。\n\n';
    }
    t += '黎明時分，陵墓節落幕。\n\n▶ 查看結局。';
    return t;
  },choices:[{label:'查看最終結局',do:function(){triggerTrueEnding();}}]};

  function triggerTrueEnding(){
    var n = countThreats();
    if(n >= 5){
      unlock('trueEnding');
      state.gold += 200;
      item('陵墓節英雄金牌');
      endG('trueEnding','【真結局：陵墓節英雄】\n\n你揭露了全部 5 條威脅線，並在首席法師面前指認了每一位罪魁禍首。\n\n斯圖弗頓勳爵在眾人面前授予你「陵墓節英雄」金牌，市議會決議以你的名字命名一條街道。\n\n阿貝拉爾德與你一起接受這份榮耀。賈拉尼成為斯圖弗頓勳爵在切斯特拉爾的本地代理人。\n\n你獲得了 200 金幣與「陵墓節英雄金牌」。\n\n冒險在此圓滿結束。\n\n✦ 感謝遊玩 ✦');
    } else if(n >= 4){
      state.gold += 100;
      endG('trueEnding','【真結局：城市守護者】\n\n你揭露了 '+n+' 條威脅線。雖然沒有發現全部陰謀，但城市已經足夠安全。\n\n斯圖弗頓勳爵感謝你的貢獻，授予你 100 金幣與一枚銀質徽章。\n\n阿貝拉爾德與你一同離開慶典，踏上歸途。\n\n冒險在此結束。\n\n（提示：嘗試揭露全部 5 條威脅線可解鎖真結局。）');

    var b = document.createElement('button');
    b.textContent='關閉';
    b.onclick=closeModal;
    $('modalActions').appendChild(b);
    $('modal').classList.remove('hidden');
  }
  function openAchievements(){
    var h = state.achievements.length ? '<ul>' + state.achievements.map(function(a){return '<li>🏆 '+(ACH_NAMES[a]||a)+'</li>';}).join('') + '</ul>' : '<p>尚未解鎖成就。</p>';
    $('modalTitle').textContent='🏆 成就';
    $('modalBody').innerHTML=h;
    $('modalActions').innerHTML='';
    var b = document.createElement('button');
    b.textContent='關閉';
    b.onclick=closeModal;
    $('modalActions').appendChild(b);
    $('modal').classList.remove('hidden');
  }
  function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); toast('已存檔。'); }catch(e){ toast('存檔失敗，您的瀏覽器可能不支援本地儲存。'); } }
  function loadGame(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if(!raw){ toast('沒有存檔。'); return; }
      var o = JSON.parse(raw);
      state = Object.assign(fresh(), o);
      state.events = o.events || [];
      state.inventory = o.inventory || [];
      state.history = o.history || [];
      state.achievements = o.achievements || [];
      state.clues = o.clues || {};
      state.bounties = o.bounties || [];
      state.threats = o.threats || {};
      state.duo = o.duo || false;
      state.phase = o.phase === 'ended' ? 'ended' : 'playing';
      closeModal();
      if(state.phase === 'ended'){
        story('已讀取結局存檔。');
        choices([{label:'🔄 重新開始',do:resetGame}]);
      } else {
        go(state.entry);
      }
      toast('已讀取存檔。');
    }catch(e){ toast('讀檔失敗。'); }
  }
  function resetGame(){
    if(!confirm('確定重置？成就會保留。')) return;
    var a = state.achievements.slice();
    state = fresh();
    state.achievements = a;
    closeModal();
    stats();
    side();
    hist('重置遊戲');
    openManual();
  }
  function toggleSound(){
    state.sound = !state.sound;
    $('soundBtn').textContent='音效：'+(state.sound?'開':'關');
    if(state.sound) sfx('click');
  }

  // 將函數暴露給全域 onclick
  window.Game = {
    openManual: openManual,
    openAppendix: openAppendix,
    saveGame: saveGame,
    loadGame: loadGame,
    openHistory: openHistory,
    openAchievements: openAchievements,
    toggleSound: toggleSound,
    resetGame: resetGame
  };
  
  // 暴露給內部 HTML 使用的函數
  window.closeModal = closeModal;
  window._appTab = function(){};

  /* ============ 初始化 ============ */
  window.onload = function() {
    try {
      stats();
      side();
      $('svgScene').innerHTML = getSceneSVG('ship');
      story('正在準備冒險書……');
      openManual();
    } catch(e) {
      var el = document.getElementById('story');
      if (el) el.innerHTML = '<span style="color:red;font-weight:bold;">⚠️ 初始化失敗：' + e.message + '</span>';
    }
  };

})();
</script>
</body>
</html>
