<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>陵墓節：互動冒險書</title>
<style>
:root{--parch:#e8d9b5;--parch2:#d8c18d;--ink:#2b2115;--gold:#b8862e;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#1b140d;color:var(--ink);font-family:"Georgia","Noto Serif TC",serif}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(255,230,160,.18),transparent 30%),radial-gradient(circle at 80% 80%,rgba(120,70,30,.22),transparent 35%),repeating-linear-gradient(0deg,rgba(80,50,20,.05) 0 2px,transparent 2px 5px),#2a1d12;padding-bottom:86px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;box-shadow:inset 0 0 180px 60px rgba(0,0,0,.75)}
#app{max-width:1180px;margin:0 auto;min-height:100vh;background:linear-gradient(135deg,var(--parch),var(--parch2));border-left:1px solid #8b6c3d;border-right:1px solid #8b6c3d}
#topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:linear-gradient(#3a2818,#24170e);color:#f6e7c1;border-bottom:2px solid var(--gold);box-shadow:0 3px 14px rgba(0,0,0,.45)}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,220,150,.25);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
#main{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:14px}
@media(max-width:860px){#main{grid-template-columns:1fr}}
#scene{grid-column:1/-1;height:190px;border:2px solid #8b6c3d;border-radius:10px;overflow:hidden;background:#0d141c;position:relative;box-shadow:inset 0 0 40px #000}
#svgScene{width:100%;height:100%;display:block}
#storyPanel{background:rgba(255,250,235,.72);border:2px solid #8b6c3d;border-radius:10px;padding:14px;min-height:300px;box-shadow:0 6px 20px rgba(60,35,10,.25)}
#story{white-space:pre-wrap;line-height:1.75;font-size:17px;color:#21170d;min-height:180px;cursor:pointer}
#choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
button{font-family:inherit;cursor:pointer}
.choice,.navbtn,.modal button{border:1px solid #6e4c24;background:linear-gradient(#f7e8c4,#dcc18b);color:#24170d;border-radius:8px;padding:11px 13px;font-size:15px;text-align:left;box-shadow:0 2px 0 #8b6c3d;transition:.15s}
.choice:hover,.navbtn:hover,.modal button:hover{filter:brightness(1.07);transform:translateY(-1px)}
.choice:active,.navbtn:active,.modal button:active{transform:translateY(1px);box-shadow:0 0 0 #8b6c3d}
#sidePanel{display:flex;flex-direction:column;gap:10px}
.panel{background:rgba(255,248,230,.72);border:2px solid #8b6c3d;border-radius:10px;padding:10px}
.panel h3{margin:0 0 8px;font-size:15px;color:#4a2e14;border-bottom:1px solid #b99a64;padding-bottom:5px}
.chipRow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 7px;border-radius:999px;background:#3a2818;color:#ffe2a1;font-size:12px;border:1px solid var(--gold)}
.muted{color:#7b6748;font-size:13px}
ul.clean{list-style:none;margin:0;padding:0;max-height:150px;overflow:auto;font-size:13px}
ul.clean li{padding:3px 0;border-bottom:1px dotted #c6ad80}
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:linear-gradient(#2a1b10,#120c07);border-top:2px solid var(--gold)}
.navbtn{font-size:12px;padding:8px 9px;text-align:center;border-radius:8px;min-width:52px}
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px}
#modal.hidden{display:none}
.modal-content{max-width:760px;width:100%;max-height:86vh;overflow:auto;background:linear-gradient(135deg,#f4e6c3,#dcc18b);border:3px double #6e4c24;border-radius:12px;padding:18px;box-shadow:0 20px 80px #000;color:#22160c}
.modal h2{margin:0 0 10px;font-size:22px;color:#4a2e14;border-bottom:2px solid var(--gold);padding-bottom:8px}
.modalBody{font-size:15px;line-height:1.7}
.modalBody h3{color:#5b3516;margin:14px 0 6px}
.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1d130b;color:#ffe4a6;border:1px solid var(--gold);padding:10px 16px;border-radius:999px;z-index:200;transition:.25s;max-width:90vw;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:520px){#topbar{font-size:12px;gap:5px;padding:6px}.stat{font-size:12px;padding:3px 7px}#story{font-size:16px}#scene{height:150px}.navbtn{font-size:11px;padding:7px 5px;min-width:46px}}
.twinkle{animation:tw 2.6s infinite alternate}@keyframes tw{from{opacity:.25}to{opacity:1}}
.mist{animation:mist 9s linear infinite}@keyframes mist{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.flag{animation:flag 3s ease-in-out infinite alternate}@keyframes flag{from{transform:skewY(-2deg)}to{transform:skewY(2deg)}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="stat">❤️ <span id="hp">11</span>/<span id="maxHp">11</span></div>
    <div class="stat">🪙 <span id="gold">0</span></div>
    <div class="stat">📅 第<span id="day">1</span>天</div>
    <div class="stat">⏳ <span id="time">0</span>/5</div>
    <div class="stat">🎒 <span id="invCount">0</span></div>
    <div class="stat">🔖 <span id="eventCount">0</span></div>
  </header>
  <main id="main">
    <section id="scene"><svg id="svgScene" viewBox="0 0 900 190" preserveAspectRatio="xMidYMid slice"></svg></section>
    <section id="storyPanel"><div id="story">準備冒險書……</div><div id="choices"></div></section>
    <aside id="sidePanel">
      <div class="panel"><h3>🔖 事件追蹤</h3><div id="eventsList" class="chipRow"><span class="muted">尚無</span></div></div>
      <div class="panel"><h3>🎒 物品欄</h3><ul id="inventoryList" class="clean"><li class="muted">尚無</li></ul></div>
      <div class="panel"><h3>🧭 歷史紀錄</h3><ul id="historyList" class="clean"><li class="muted">尚無</li></ul></div>
      <div class="panel"><h3>🏆 成就</h3><ul id="achievementList" class="clean"><li class="muted">尚無</li></ul></div>
    </aside>
  </main>
  <nav id="bottomNav">
    <button class="navbtn" onclick="openManual()">說明</button>
    <button class="navbtn" onclick="saveGame()">存檔</button>
    <button class="navbtn" onclick="loadGame()">讀檔</button>
    <button class="navbtn" onclick="openHistory()">歷史</button>
    <button class="navbtn" onclick="openAchievements()">成就</button>
    <button class="navbtn" id="soundBtn" onclick="toggleSound()">音效：開</button>
    <button class="navbtn" onclick="resetGame()">重置</button>
  </nav>
</div>
<div id="modal" class="hidden"><div class="modal-content"><h2 id="modalTitle"></h2><div id="modalBody" class="modalBody"></div><div id="modalActions" class="modalActions"></div></div></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const SAVE_KEY='festivalTombs_v7', ACH_KEY='festivalTombsAch_v7';
const ACH_NAMES={success:'序章破案：正確指控提亞',wrong:'錯誤指控：真相未明',partial:'部分真相：只有搬運工',death:'序章死亡',fullClues:'全線索調查員',mainStart:'抵達切斯特拉爾',pirate:'夜間海盜倖存',ghost:'目擊幽靈船長',level2:'晉升 2 級',cityStart:'城市探索開始'};
function fresh(){return{phase:'manual',entry:'0000',hp:11,maxHp:11,gold:0,day:1,time:0,events:[],inventory:[],history:[],achievements:[],sound:true,clues:{},mission:null,companion:null,season:null,combat:null,level:1};}
let state=fresh();
state.achievements=JSON.parse(localStorage.getItem(ACH_KEY)||'[]');

function d20(m=0){return Math.floor(Math.random()*20)+1+m;}
function rnd(n){return Math.floor(Math.random()*n)+1;}
function has(id){return state.events.includes(String(id));}
function mark(id){id=String(id);if(!has(id))state.events.push(id);}
function item(n){if(!state.inventory.includes(n))state.inventory.push(n);}
function drop(n){const i=state.inventory.indexOf(n);if(i>=0)state.inventory.splice(i,1);}
function hist(t){state.history.push(`[第${state.day}天·${state.time}時] ${t}`);if(state.history.length>200)state.history.shift();}
function adv(n=1){state.time=Math.min(5,state.time+n);if(state.time>=5)toast('時段已滿 5，建議回長羽旅館長休息。');}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400);}
function sfx(t='click'){if(!state.sound)return;try{const c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value={click:440,hit:160,win:660,lose:110,dice:300}[t]||440;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.start();o.stop(c.currentTime+.13);}catch(e){}}
function unlock(a){if(!state.achievements.includes(a)){state.achievements.push(a);localStorage.setItem(ACH_KEY,JSON.stringify(state.achievements));side();toast('🏆 '+(ACH_NAMES[a]||a));}}

let tmr=null,full='';
function story(t){full=t||'';const el=$('story');el.textContent='';clearInterval(tmr);let i=0;el.onclick=()=>{clearInterval(tmr);el.textContent=full;};tmr=setInterval(()=>{if(i>=full.length){clearInterval(tmr);return;}el.textContent+=full[i++];},14);}

function stats(){$('hp').textContent=Math.max(0,state.hp);$('maxHp').textContent=state.maxHp;$('gold').textContent=state.gold;$('day').textContent=state.day;$('time').textContent=state.time;$('invCount').textContent=state.inventory.length;$('eventCount').textContent=state.events.length;$('soundBtn').textContent='音效：'+(state.sound?'開':'關');}
function side(){
  $('eventsList').innerHTML=state.events.length?state.events.map(e=>`<span class="chip">#${e}</span>`).join(''):'<span class="muted">尚無</span>';
  $('inventoryList').innerHTML=state.inventory.length?state.inventory.map(i=>`<li>${i}</li>`).join(''):'<li class="muted">尚無</li>';
  $('historyList').innerHTML=state.history.length?state.history.slice(-30).reverse().map(h=>`<li>${h}</li>`).join(''):'<li class="muted">尚無</li>';
  $('achievementList').innerHTML=state.achievements.length?state.achievements.map(a=>`<li>🏆 ${ACH_NAMES[a]||a}</li>`).join(''):'<li class="muted">尚無</li>';
}

function svg(type='ship'){
  const stars=Array.from({length:26},(_,i)=>{const x=(i*67)%900,y=(i*31)%108,r=i%3===0?1.6:1;return`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffe9a8" class="twinkle" style="animation-delay:${(i%7)*.3}s"/>`;}).join('');
  const base=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07111d"/><stop offset="1" stop-color="#1d3147"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16364a"/><stop offset="1" stop-color="#071018"/></linearGradient></defs><rect width="900" height="190" fill="url(#sky)"/>${stars}<rect y="128" width="900" height="62" fill="url(#water)"/><path d="M0 130 Q80 122 160 130 T320 130 T480 130 T640 130 T800 130 T900 128 V190 H0Z" fill="#0b1d28" opacity=".8"/>`;
  if(type==='combat')return base+`<rect y="145" width="900" height="45" fill="#1b120b"/><path d="M0 150 Q120 138 240 150 T480 150 T720 150 T900 148 V190 H0Z" fill="#382313"/><g class="mist"><ellipse cx="450" cy="165" rx="260" ry="18" fill="#7ea88c" opacity=".18"/></g><text x="640" y="40" fill="#ffd27a" font-size="16" font-family="serif">戰鬥</text>`;
  if(type==='city')return base+`<rect y="118" width="900" height="72" fill="#24170e"/>${[80,170,280,390,520,650,780].map((x,i)=>`<rect x="${x}" y="${58+(i%3)*14}" width="${70+i*4}" height="${92-(i%3)*14}" fill="#3b2a1b" stroke="#7d5b31"/><rect x="${x+10}" y="${74+(i%3)*14}" width="12" height="16" fill="#ffd27a" class="twinkle"/><rect x="${x+30}" y="${74+(i%3)*14}" width="12" height="16" fill="#ffd27a" class="twinkle" style="animation-delay:.4s"/>`).join('')}<text x="620" y="36" fill="#ffe1a0" font-size="16" font-family="serif">切斯特拉爾</text>`;
  if(type==='boat')return base+`<path d="M200 135 L700 135 L640 170 L260 170Z" fill="#5c3a1d" stroke="#c99a4a"/><rect x="340" y="95" width="220" height="40" fill="#6e4a25" stroke="#c99a4a"/><text x="600" y="40" fill="#ffd27a" font-size="16" font-family="serif">救生艇</text>`;
  if(type==='ghost')return base+`<rect y="145" width="900" height="45" fill="#101420"/><g class="mist"><ellipse cx="450" cy="150" rx="300" ry="20" fill="#a0d0e0" opacity=".22"/></g><path d="M400 50 Q430 20 470 50 Q500 30 500 80 L480 140 L440 140 L420 90 Q400 70 400 50Z" fill="#a0d0e0" opacity=".5"/><text x="560" y="40" fill="#ffd27a" font-size="16" font-family="serif">幽靈船長</text>`;
  if(type==='temple')return base+`<rect y="118" width="900" height="72" fill="#24170e"/><path d="M350 190 V90 Q450 40 550 90 V190Z" fill="#6e4a25" stroke="#c99a4a" stroke-width="3"/><rect x="430" y="130" width="40" height="60" fill="#ffd27a" opacity=".7"/><text x="380" y="40" fill="#ffe1a0" font-size="16" font-family="serif">安伯林神廟</text>`;
  return base+`<path d="M170 132 L730 132 L660 172 L240 172Z" fill="#5c3a1d" stroke="#c99a4a"/><rect x="310" y="88" width="280" height="44" fill="#6e4a25" stroke="#c99a4a"/><rect x="350" y="96" width="30" height="22" fill="#ffd27a" class="twinkle"/><rect x="400" y="96" width="30" height="22" fill="#ffd27a" class="twinkle" style="animation-delay:.5s"/><rect x="450" y="96" width="30" height="22" fill="#ffd27a" class="twinkle" style="animation-delay:.9s"/><path d="M280 80 L450 45 L620 80" fill="none" stroke="#c99a4a" stroke-width="4"/><path class="flag" d="M450 45 L450 15 L500 28 L450 40" fill="#7a2e22"/><g class="mist"><ellipse cx="450" cy="150" rx="280" ry="16" fill="#8fb7c9" opacity=".18"/></g><text x="580" y="36" fill="#ffe1a0" font-size="16" font-family="serif">壯麗號</text>`;
}

function choices(list){const b=$('choices');b.innerHTML='';list.forEach(o=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=o.label;btn.onclick=()=>{sfx('click');if(o.check&&!o.check()){toast(o.hint||'條件不足');return;}if(o.do)o.do();if(o.goto)go(o.goto);};b.appendChild(btn);});}

const E={};
function go(id){state.entry=id;const e=E[id];if(!e){story('缺少條目 '+id);choices([{label:'重新開始',do:resetGame}]);return;}if(e.onEnter)e.onEnter();$('svgScene').innerHTML=svg(e.scene||'ship');story(typeof e.text==='function'?e.text():e.text||'');choices((typeof e.choices==='function'?e.choices():e.choices)||[]);stats();side();}

/* ============ 通用戰鬥系統 ============ */
const MONSTERS={
  rats:{name:'紅眼鼠群',hp:24,ac:10,atk:3,dmg:'1d6',desc:'一群紅眼老鼠'},
  pirate:{name:'海盜',hp:11,ac:11,atk:3,dmg:'1d6+1',desc:'一名海盜'},
  ghost:{name:'幽靈船長',hp:22,ac:12,atk:5,dmg:'2d4',desc:'阿曼德·萊赫·克雷斯的幽靈'}
};

function startCombat(cfg){
  state.combat={
    round:1,
    enemies:cfg.enemies.map(k=>({key:k,...MONSTERS[k]})),
    victory:cfg.victory,
    defeat:cfg.defeat||'death_end',
    flee:cfg.flee,
    fleeDC:cfg.fleeDC||10,
    intro:cfg.intro||''
  };
  renderCombat();
}

function renderCombat(){
  const c=state.combat;if(!c){go(state.entry);return;}
  state.phase='combat';
  $('svgScene').innerHTML=svg('combat');
  const enemy=c.enemies[0];
  story(`【戰鬥：${c.intro||enemy.name}】\n${enemy.name} HP：${Math.max(0,enemy.hp)}/${MONSTERS[enemy.key].hp}\n你的 HP：${Math.max(0,state.hp)}/${state.maxHp}\n回合：${c.round}\n\n▶ 選擇行動。`);
  const list=[
    {label:`攻擊 ${enemy.name}（d20+4，命中 1d8+2）`,do:()=>{sfx('dice');const h=d20(4);if(h>=enemy.ac){const d=3+rnd(8);enemy.hp-=d;sfx('hit');toast(`命中！造成 ${d} 點傷害。`);}else toast(`未命中（${h} vs AC ${enemy.ac}）。`);afterPlayerTurn();}}
  ];
  if(c.flee)list.push({label:`逃跑（DC ${c.fleeDC} 敏捷）`,do:()=>{sfx('dice');const r=d20(2);toast(`敏捷：${r}（DC ${c.fleeDC}）`);if(r>=c.fleeDC){state.combat=null;go(c.flee);}else{toast('逃跑失敗！');enemyTurn();}}});
  if(state.inventory.includes('治療藥水'))list.push({label:'使用治療藥水',do:()=>{drop('治療藥水');const h=2+rnd(4)+rnd(4);state.hp=Math.min(state.maxHp,state.hp+h);toast('恢復 '+h+' 點。');stats();renderCombat();}});
  choices(list);stats();
}
function afterPlayerTurn(){
  const c=state.combat;if(!c)return;
  if(c.enemies[0].hp<=0){state.combat=null;hist('戰鬥勝利');go(c.victory);return;}
  enemyTurn();
}
function enemyTurn(){
  const c=state.combat;if(!c)return;
  const e=c.enemies[0];
  const h=d20(e.atk);
  if(h>=12){const d=1+rnd(6);state.hp-=d;sfx('hit');toast(`${e.name}命中你，受到 ${d} 點傷害。`);}
  else toast(`${e.name}撲空（${h}）。`);
  if(state.hp<=0){state.combat=null;go(c.defeat);return;}
  c.round++;stats();renderCombat();
}

/* ============ 結局 ============ */
function endG(tag,text){state.phase='ended';unlock(tag);stats();side();story(text);choices([{label:'🔄 重新開始',do:resetGame},{label:'🏆 成就',do:openAchievements},{label:'🧭 歷史',do:openHistory}]);hist('結局：'+tag);}
function win(){state.gold+=50;item('納明丁榮譽項鍊');item('貝殼護身符');mark('034');hist('正確指控提亞');endG('success',`你指出提亞利用搬運工從保險箱偷出石碑，並在船底艙殺人滅口。弗娜典獄長派甲板水手搜查提亞艙室，果然找回石碑。\n\n【序章成功結局】\n獲得 50 金幣、納明丁榮譽項鍊、貝殼護身符。\n\n▶ 進入 2 級：繼續主冒險。`);}
function wrong(t){endG('wrong',t+`\n\n【錯誤指控結局】\n弗娜典獄長失望。真正的犯人有了警覺。你仍抵達切斯特拉爾，但留下遺憾。`);}
function partial(){state.gold+=10;endG('partial',`你報告搬運工下落。弗娜封鎖現場，但石碑未找回。\n\n【部分真相結局】\n獲得 10 金幣。`);}

/* ============ 條目庫 ============ */
const M={duel:['130','決鬥審判',`0162\n一年前，你同意在檔案管理員廣場進行決鬥。津·塔戈這個龍裔必須死。其中一位致殘後被拋棄的人，是你的叔叔。\n\n如今尋求正義的唯一希望，是這座城市古老的決鬥審判法。`],medicine:['137','拉本靈藥',`0023\n你的目的地是安伯林神廟，廟裡的牧師掌握著製作拉本靈藥的秘密，這種靈藥能治癒正在威脅你家鄉的疾病。`],brooch:['142','光明希望之星',`0039\n「光明希望之星」曾屬於你的家族，十年前被盜。最近有傳言說福斯科拉夫人佩戴過它。`],lover:['126','舊情人羅賓',`0056\n你依然愛著羅賓·馮特茲。你不知道再次見到羅賓會發生什麼——或許這份思念是相互的。`]};
const C={warrior:['150','戰士',`0003\n阿貝拉爾德從你童年起就是你最可靠的夥伴。`],priest:['160','牧師',`0024\n阿貝拉爾德是個老練的人，幽默感很文雅。`],rogue:['166','盜賊',`0057\n阿貝拉爾德成了一名神祕的企業家。`],mage:['174','法師',`0065\n你覺得有必要保護阿貝拉爾德，避免他惹上麻煩。`]};
const S={winter:['190','冬至'],autumn:['204','秋分'],summer:['218','夏至'],spring:['237','春分']};

E['0000']={scene:'ship',text:`0000\n渡輪的隊伍排得很長。\n\n「快到了，」你身後的半獸人賈拉尼說，「你今年去切斯特拉爾是為了什麼？」\n\n▶ 選擇主要任務。`,choices:[{label:'▶ 0162 決鬥',do:()=>pickM('duel')},{label:'▶ 0023 藥物',do:()=>pickM('medicine')},{label:'▶ 0039 胸針',do:()=>pickM('brooch')},{label:'▶ 0056 舊情人',do:()=>pickM('lover')}]};

E['priest_abelard']={scene:'ship',onEnter:()=>mark('005'),text:`阿貝拉爾德質問牧師。\n\n牧師承認：「我確實看到了一些情況——擦鞋的男孩是同謀。」\n\n（事件 #005）`,choices:[{label:'返回',goto:'0180'}]};

E['0091']={scene:'ship',onEnter:()=>{mark('027');state.clues.guard=true;adv();},text:`弗娜典獄長說有新船員在明輪罩看到幽靈之光。\n\n（事件 #027·線索）`,choices:[{label:'向弗娜報告（至少 2 條線索）',check:()=>clueCount()>=2,hint:'需至少 2 條線索。',goto:'report'},{label:'0136 舉報可疑人員',goto:'report',check:()=>clueCount()>=2,hint:'需至少 2 條線索。'},{label:'返回',goto:'0010'}]};

E['0052']={scene:'ship',text:`0052\n老奶奶們教你玩「喘息石」。`,choices:[{label:'下注 1 枚金幣',check:()=>state.gold>=1,hint:'需 1 金幣。',do:()=>playDice(1)},{label:'下注 5 枚金幣',check:()=>state.gold>=5,hint:'需 5 金幣。',do:()=>playDice(5)},{label:'返回',goto:'0010'}]};
function playDice(bet){state.gold-=bet;sfx('dice');const r=d20(2);toast(`敏捷：${r}`);if(r>=10){state.gold+=bet*2;toast(`你贏了 ${bet*2} 枚金幣！`);}else{toast(`你輸掉 ${bet} 枚金幣。`);}stats();go('0010');}

E['0007']={scene:'ship',onEnter:()=>{if(!has('003'))mark('003');},text:`0007\n阿貝拉爾德告訴你他父親去世了。`,choices:[{label:'短休息（恢復 HP·1 時段）',do:()=>{state.hp=state.maxHp;adv();go('0010');}},{label:'0117 查看新艙室',goto:'0117',check:()=>has('003')},{label:'返回',goto:'0010'}]};
E['0117']={scene:'ship',onEnter:()=>{state.hp=state.maxHp;adv();},text:`0117\n新艙室。\n\n▶ 短休息完成。`,choices:[{label:'返回',goto:'0172'}]};

E['0027']={scene:'ship',text:`統艙甲板。`,choices:[{label:'審問守衛',goto:'guard_talk'},{label:'0161 請求進入',goto:'guard_search'},{label:'下到船底艙（戰鬥）',do:()=>{startCombat({enemies:['rats'],victory:'0123',defeat:'0118',flee:'0034_flee',intro:'船底艙·紅眼鼠群'});}},{label:'0085 搜查斯圖弗頓勳爵行李',goto:'0085',check:()=>has('020')||has('026'),hint:'需先從賈拉尼接到任務（#026）或發現綠色箱子線索。'},{label:'0097 進入明輪罩',goto:'0097'},{label:'返回',goto:'0172'}]};
E['guard_talk']={scene:'ship',onEnter:()=>mark('027'),text:`西爾維斯特倫說他大部分時間在門後吊床上。`,choices:[{label:'返回',goto:'0027'}]};
E['guard_search']={scene:'ship',text:`西爾維斯特倫帶你來到活板門前。`,choices:[{label:'下到船底艙（戰鬥）',do:()=>{startCombat({enemies:['rats'],victory:'0123',defeat:'0118',flee:'0034_flee',intro:'船底艙·紅眼鼠群'});}},{label:'返回',goto:'0027'}]};
E['0085']={scene:'ship',text:`0085\n你打開斯圖弗頓勳爵的箱子，發現一個綠色漆盒，裡面有十幾個空錢包。\n\n守衛說：「那是事務長的個人儲物。」\n\n（事件 #020 已標記）`,choices:[{label:'0064 質問事務長',goto:'0006'},{label:'返回',goto:'0027'}]};

/* ============ 船底艙完整戰鬥（0034 地圖細節） ============ */
E['0034']={scene:'combat',text:`0034\n一群紅眼老鼠朝你游來。阿貝拉爾德開始揮舞斧頭。\n\n【戰鬥地圖 14：船底艙】\n- 你與阿貝拉爾德在（1）（2）位置\n- 鼠群在（3）\n- 西爾維斯特倫在（4），從活板門往下看\n\n【地形】\n- 傾斜甲板覆蓋油膩浮渣：每位成員每回合第一次移動需 DC 10 敏捷豁免，失敗則倒地\n- 中央 20 英尺寬水域：及腰深，無游泳速度者為困難地形\n\n【戰術】\n- 西爾維斯特倫用手弩向鼠群射擊：+3 命中，1d6+1 穿刺\n\n▶ 進入戰鬥。`,choices:[{label:'開始戰鬥',do:()=>startCombat({enemies:['rats'],victory:'0123',defeat:'0118',flee:'0034_flee',intro:'船底艙·紅眼鼠群'})}]};

E['0034_flee']={scene:'combat',text:`你成功逃回甲板。鼠群沒有追來，但搬運工的屍體仍留在下面。`,choices:[{label:'繼續調查',goto:'0027'}]};

E['0118']={scene:'combat',onEnter:()=>{state.phase='ended';unlock('death');},text:`0118\n你或你們兩人在「壯麗號」上死亡。\n\n這艘內河渡輪短暫停靠，安排了一輛馬車，將你們逆流送回哈利茲堡——在那裡或許能復活。\n\n【死亡結局】\n你的冒險在此結束。`,choices:[{label:'🔄 重新開始',do:resetGame},{label:'🏆 成就',do:openAchievements}]};

E['0123']={scene:'combat',onEnter:()=>{mark('008');state.clues.body=true;item('紅木魔杖');item('一包信件');item('帶鞘匕首');adv();hist('擊敗鼠群');},text:`0123\n鼠群被擊敗。你搜查搬運工的屍體：腰帶上掛著帶鞘匕首；束腰外衣裡有一包斯圖弗頓勳爵的通信；他緊握的手中還有一根紅木巫師魔杖。\n\n（事件 #008·線索）`,choices:[{label:'向弗娜報告',check:()=>clueCount()>=2,hint:'需至少 2 條線索。',goto:'report'},{label:'返回統艙甲板',goto:'0027'}]};

/* ============ 明輪罩幽靈（0097） ============ */
E['0097']={scene:'ghost',text:`0097\n你爬進統艙甲板後的明輪罩。\n\n一股縹緲的霧氣從布滿刻度盤和靛藍寶石的機器中升起，化作一個面容憔悴、戴著船長帽、前額下方有「X」形傷疤的男人。\n\n「交出你的金子，」他咆哮著拔出一把幽靈彎刀朝你揮來。\n\n▶ DC 10 魅力豁免。`,choices:[{label:'魅力豁免 DC 10',do:()=>{sfx('dice');const r=d20(0);toast(`魅力：${r}（DC 10）`);if(r>=10){mark('012');mark('013');unlock('ghost');toast('你抵抗住了幽靈的力量（#012·#013）。');}else{const dmg=rnd(4)+rnd(4);state.hp-=dmg;toast(`受到 ${dmg} 點死靈傷害。`);if(state.hp<=0){go('death_end');return;}mark('012');mark('013');unlock('ghost');}go('ghost_after');}},{label:'拔腿就跑',do:()=>{mark('012');mark('013');go('ghost_after');}}]};
E['ghost_after']={scene:'ghost',text:`你無法自衛，只能向後爬行，卻遇到了同樣驚慌失措的阿貝拉爾德。\n\n（事件 #012·#013 已標記。）`,choices:[{label:'離開統艙甲板',goto:'0027'}]};

/* ============ 0097 保險箱殘留物、證據 ============ */
E['0054']={scene:'ship',text:`0054\n弗娜典獄長帶你進入貴族艙室。\n\n保險箱前地板上有三個綠色螢光點，彷彿有發光液體濺落在那裡。\n\n「斯圖弗頓勳爵認為是鬼魂來過這裡。我覺得可能是某種法術留下的。」\n\n（事件 #019 已標記：保險箱殘留物）`,choices:[{label:'繼續',goto:'0010'}]};

/* ============ 指控、報告 ============ */
E['report']={scene:'ship',text:()=>`你把線索整理給弗娜典獄長。\n\n目前線索：\n${Object.keys(state.clues).filter(k=>state.clues[k]).map(k=>({shoe:'擦鞋匠（#005）',wizard:'提亞·燒毀漁船（#028）',priest:'西姆斯·海盜血緣（#017）',guard:'明輪罩鬧鬼（#027）',body:'船底艙屍體（#008）',purser:'事務長可疑（#033）'})[k]).join('\n')||'尚無'}`,choices:[{label:'指控精靈巫師提亞（需 #008 與 #029）',do:()=>{if(state.clues.body&&state.clues.wizard)win();else toast('缺少證據。');}},{label:'指控事務長托門茨',do:()=>{if(state.clues.purser)wrong('你指控事務長。弗娜發現他與扒手集團有關，但石碑並非他所為。');else toast('證據不足。');}},{label:'報告失蹤搬運工',do:()=>{if(state.clues.body)partial();else toast('尚未找到搬運工。');}},{label:'返回調查',goto:'0027'}]};
E['0136']={scene:'ship',text:`0136\n▶ 選擇指控對象。`,choices:[{label:'0159 指控提亞',goto:'report'},{label:'0050 報告搬運工',goto:'report'},{label:'0087 指控事務長',goto:'report'},{label:'0107 指控哈維恩',goto:'report'},{label:'0113 指控賈拉尼',goto:'report'},{label:'0146 指控西姆斯',goto:'report'},{label:'0181 指控西爾維斯特倫',goto:'report'},{label:'0164 不指控',goto:'0164'}]};
function clueCount(){return Object.keys(state.clues).filter(k=>state.clues[k]).length;}

E['death_end']={scene:'combat',onEnter:()=>{state.phase='ended';unlock('death');},text:`你倒下了。\n\n【死亡結局】\n冒險在此結束。`,choices:[{label:'🔄 重新開始',do:resetGame},{label:'🏆 成就',do:openAchievements}]};

/* ============ 夜間海盜（0200 前） ============ */
E['0021']={scene:'ship',text:`0021\n凌晨時分，你聽到一聲尖叫，接著是遠處的打鬥聲。阿貝拉爾德立刻從床上滾下來，抓起斧頭。\n\n更新角色表，體現完成長休息後的增益。將日期推進至第 2 天。`,choices:[{label:'0109 前往露天甲板',do:()=>{state.day=2;state.time=0;go('0109');}}]};
E['0109']={scene:'combat',text:`0109\n你走上露天甲板，發現渡輪正在夜間補給。成群的海盜從樹林裡蜂擁而出。\n\n阿貝拉爾德大喊：「那邊！」他指著欄杆旁的賈拉尼——她和斯圖弗頓勳爵正登上救生艇。`,choices:[{label:'0002 跳進救生艇',goto:'0002'},{label:'0147 與海盜戰鬥',do:()=>{startCombat({enemies:['pirate'],victory:'0137',defeat:'0118',flee:'0185',fleeDC:10,intro:'露天甲板·海盜'});}},{label:'0185 投降',goto:'0185'}]};
E['0002']={scene:'boat',text:`0002\n救生艇開始下降。一名海盜朝你的方向投擲了一支標槍。\n\n救生艇傾斜得十分危險。\n\n▶ 進行 DC 12 力量（運動）檢定，累計 3 次成功或 3 次失敗。`,choices:[{label:'力量（運動）檢定',do:()=>{sfx('dice');let s=0,f=0;for(let i=0;i<6&&s<3&&f<3;i++){const r=d20(2);if(r>=12)s++;else f++;}toast(`成功 ${s} / 失敗 ${f}`);if(s>=3){mark('031');go('0137');}else{go('0185');}}}]};
E['0137']={scene:'boat',onEnter:()=>mark('031'),text:`0137\n救生艇平穩下降並安全抵達水面。\n\n早上，你返回岸邊。「壯麗號」早已不見蹤影，但其他乘客都已安全上岸。`,choices:[{label:'0012 繼續',goto:'0012'}]};
E['0012']={scene:'boat',text:`0012\n乘客們被迫上岸，財物丟失，還要步行兩天才能抵達切斯特拉爾。`,choices:[{label:'0018 繼續',goto:'0018'}]};
E['0185']={scene:'boat',text:`0185\n大批海盜湧入船內，你別無選擇只能投降。\n\n幸運的是，海盜不打算殺人。你和其他乘客被送上岸。`,choices:[{label:'0012 繼續',goto:'0012'}]};
E['0147']={scene:'combat',text:`0147\n三名海盜正在逼近。你必須阻止他們。\n\n▶ 戰鬥。`,choices:[{label:'開始戰鬥',do:()=>startCombat({enemies:['pirate'],victory:'0137',defeat:'0118',flee:'0185',fleeDC:10,intro:'露天甲板·海盜'})}]};

/* ============ 抵達城市 → 2 級 ============ */
E['0018']={scene:'city',text:`0018\n你在天黑前進入了城市。切斯特拉爾擠滿了遊客，所有旅館房間都已客滿。\n\n幸運的是，斯圖弗頓勳爵將你的隊伍納入他的隨從，你得以在長羽旅館獲得食宿。\n\n「你明天打算做什麼？」賈拉尼問。\n\n▶ 序章結束。`,choices:[{label:'🎉 序章完成，進入 2 級',do:()=>{state.level=2;state.maxHp=16;state.hp=16;unlock('level2');mark('035');unlock('mainStart');go('0200');}}]};

/* ============ 0200 主冒險開場 ============ */
E['0200']={scene:'city',text:()=>`0200\n一陣敲門聲傳來。阿貝拉爾德從床上坐起。「是賈拉尼嗎？我跟她說過我們今早要見斯圖弗頓勳爵。」\n\n幾分鐘後，你來到走廊盡頭斯圖弗頓勳爵的連通套房。一張中央餐桌上擺滿了豐盛的早餐。阿貝拉爾德開始往兩個盤子裡裝食物——兩個都是他自己的——而賈拉尼則告訴你四位訪客的身份，他們都是市議會成員。其中一位是奧爾德羅斯市長，斯圖弗頓勳爵的老朋友。\n\n「斯坦尼爾，那場景我從未見過，」奧爾德羅斯市長說，「鬼魂！就出現在我的客廳裡。我是說，鬼魂一直都在，但它們從未那樣顯現過。我們毫無準備，一片混亂！其他『起始週』派對上也發生了同樣的事。我看過報告了。市民們感到緊張也是理所當然的。」\n\n「那麼，這對『覺醒節』的後續活動意味著什麼？」斯圖弗頓勳爵問道。\n\n「既然你來了，一切都會好起來的。我已經告訴市議會，你會處理好所有事情。」\n\n所有市議員都微笑著點頭。\n\n（完成長休息。你的私人任務：${state.mission?state.mission.name:'未定'}。）\n\n▶ 決定今日行程。`,choices:[{label:'👉 前往城市探索',goto:'city_hub'}]};

/* ============ 城市樞紐（city_hub） ============ */
function locList(){
  const base=[
    {id:'loc_inn',name:'🏨 長羽旅館（安全長休息）'},
    {id:'loc_temple',name:'⛪ 安伯林神廟'},
    {id:'loc_seance',name:'🔮 降神會街'},
    {id:'loc_market',name:'🛒 城市集市'},
    {id:'loc_archivists',name:'🏛️ 檔案員廣場'},
    {id:'loc_park',name:'🌳 中央公園'},
    {id:'loc_observatory',name:'🔭 天文台'},
    {id:'loc_boathouse',name:'⛵ 船屋'},
    {id:'loc_cemetery',name:'⚰️ 墓地'},
    {id:'loc_ruins',name:'🏚️ 老城廢墟'}
  ];
  return base;
}
function renderHub(){
  const list=locList().map(l=>({label:l.name,goto:l.id}));
  list.push({label:'🌙 結束今日（回旅館長休息）',goto:'loc_inn'});
  return list;
}
E['city_hub']={scene:'city',text:()=>`【切斯特拉爾城市導航】\n\n📅 第 ${state.day} 天 ⏳ 時段 ${state.time}/5\n🪙 金幣：${state.gold}｜❤️ HP：${state.hp}/${state.maxHp}\n\n私人任務：${state.mission?state.mission.name:'未定'}\n\n▶ 選擇前往地點。`,choices:()=>renderHub()};

/* ============ 地點：長羽旅館 ============ */
E['loc_inn']={scene:'city',text:`🏨 長羽旅館\n\n這裡是切斯特拉爾最古老的建築之一，旅館老闆多里安日夜都忙著招呼客人。\n\n▶ 選擇行動。`,choices:[
  {label:'🌙 長休息（恢復全部 HP，日期 +1，時段歸零）',do:()=>{state.hp=state.maxHp;state.day++;state.time=0;hist('長休息，進入第'+state.day+'天');toast(`長休息完成。第 ${state.day} 天開始。`);go('loc_inn');}},
  {label:'🍺 在公共休息室聽謠言',do:()=>{adv(1);toast('你聽到最近城裡出現各種怪事：鬧鬼的燈籠、超自然騷動……');hist('旅館聽謠言');go('loc_inn');}},
  {label:'🍽️ 免費早餐（推進 1 時段，恢復 1d4 HP）',do:()=>{adv(1);const h=rnd(4);state.hp=Math.min(state.maxHp,state.hp+h);toast(`恢復 ${h} 點 HP。`);go('loc_inn');}},
  {label:'返回城市導航',goto:'city_hub'}
]};

/* ============ 地點：安伯林神廟 ============ */
E['loc_temple']={scene:'temple',text:`⛪ 安伯林神廟\n\n這座神廟供奉多位治癒之神。祈求者排著隊，有的尋求治療，有的買賣靈藥。\n\n▶ 選擇行動。`,choices:[
  {label:'💊 購買治療藥水（50 金幣）',check:()=>state.gold>=50,hint:'需要 50 金幣。',do:()=>{state.gold-=50;item('治療藥水');hist('購買治療藥水');go('loc_temple');}},
  {label:'🔍 詢問拉本靈藥',goto:'temple_panacea'},
  {label:'💬 與牧師閒聊',do:()=>{adv(1);toast('牧師提到最近墓地有些異狀。');hist('神廟閒聊');go('loc_temple');}},
  {label:'返回城市導航',goto:'city_hub'}
]};
E['temple_panacea']={scene:'temple',text:`你詢問拉本靈藥。\n\n「我們已不再釀造萬靈藥，」海倫斯抄寫員說，「原料太過稀有。首先你需要取得出口許可，否則討論毫無意義。」\n\n（事件 #138 已標記：拉本靈藥任務。）`,choices:[{label:'返回神廟',goto:'loc_temple'}]};

/* ============ 地點：降神會街 ============ */
E['loc_seance']={scene:'city',text:`🔮 降神會街\n\n這條街上的房子都被改建為降神會客廳。人群四處遊蕩，討論著透過靈媒與死者交流的經歷。\n\n▶ 選擇行動。`,choices:[
  {label:'🕯️ 僱傭靈媒通靈（2 金幣，推進 1 時段）',check:()=>state.gold>=2,hint:'需 2 金幣。',do:()=>{state.gold-=2;adv(1);hist('降神會通靈');toast('靈媒進入恍惚狀態……她低聲說出幾句模糊的話。');go('loc_seance');}},
  {label:'👂 聽人群討論',do:()=>{adv(1);toast('你聽說最近燈籠會莫名其妙熄滅，水閘也出了問題。');hist('聽降神會街人群');go('loc_seance');}},
  {label:'返回城市導航',goto:'city_hub'}
]};

/* ============ 地點：城市集市 ============ */
E['loc_market']={scene:'city',text:`🛒 城市集市\n\n外圍有多家常設商店，中心區域擠滿了小商販。\n\n▶ 選擇行動。`,choices:[
  {label:'🛡️ 瀏覽裝備商（購買治療藥水 50 金）',check:()=>state.gold>=50,hint:'需 50 金幣。',do:()=>{state.gold-=50;item('治療藥水');hist('市場買藥水');go('loc_market');}},

/* ============ 說明 / 歷史 / 成就 / 存讀檔 ============ */
function openManual(){state.phase='manual';stats();$('modalTitle').textContent='📖 陵墓節：新手說明';$('modalBody').innerHTML=`<h3>🎯 遊戲目標</h3><p>你是前往切斯特拉爾參加「覺醒節」的冒險者。序章中要調查「壯麗號」渡輪上失竊的納明丁石碑。收集至少 2 條線索後，向 <b>弗娜典獄長</b> 報告並選出正確犯人。序章完成後進入 2 級，可自由探索切斯特拉爾。</p><h3>👀 看懂畫面</h3><p>頂部：❤️生命、🪙金幣、📅天、⏳時段0/5、🎒物品、🔖事件。中間是故事文字（點擊立即顯示），下方是選項。右側：事件追蹤、物品欄、歷史、成就。</p><h3>🕹️ 操作步驟</h3><p>1. 0000 選任務 → 2. 選季節 → 3. 選夥伴 → 4. 登船 → 5. 調查證人 → 6. 可下船底艙戰鬥、可查明輪罩鬼魂 → 7. 向弗娜報告 → 8. 序章完成後在城市導航選擇地點。</p><h3>⚙️ 特殊機制</h3><p>事件追蹤自動標記；某些結局需特定事件組合。長休息恢復生命、時段歸零、日期+1。城市導航推進天數與時段。存檔／讀檔在底部導航列。</p><h3>💡 小訣竅</h3><p>按鈕變淡仍可點；系統會用提示告訴你缺少什麼，不會鎖死按鈕。</p>`;$('modalActions').innerHTML='';const b=document.createElement('button');b.textContent='我準備好了，開始遊戲';b.onclick=()=>{sfx('click');closeModal();state.phase='playing';hist('開始遊戲');go('0000');};$('modalActions').appendChild(b);$('modal').classList.remove('hidden');}
function closeModal(){$('modal').classList.add('hidden');}
function openHistory(){const h=state.history.length?'<ol>'+state.history.slice().reverse().map(x=>`<li>${x}</li>`).join('')+'</ol>':'<p>尚無紀錄。</p>';$('modalTitle').textContent='🧭 歷史紀錄';$('modalBody').innerHTML=h;$('modalActions').innerHTML='';const b=document.createElement('button');b.textContent='關閉';b.onclick=closeModal;$('modalActions').appendChild(b);$('modal').classList.remove('hidden');}
function openAchievements(){const h=state.achievements.length?'<ul>'+state.achievements.map(a=>`<li>🏆 ${ACH_NAMES[a]||a}</li>`).join('')+'</ul>':'<p>尚未解鎖成就。</p>';$('modalTitle').textContent='🏆 成就';$('modalBody').innerHTML=h;$('modalActions').innerHTML='';const b=document.createElement('button');b.textContent='關閉';b.onclick=closeModal;$('modalActions').appendChild(b);$('modal').classList.remove('hidden');}
function saveGame(){localStorage.setItem(SAVE_KEY,JSON.stringify(state));toast('已存檔。');}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw){toast('沒有存檔。');return;}const o=JSON.parse(raw);state={...fresh(),...o};state.events=o.events||[];state.inventory=o.inventory||[];state.history=o.history||[];state.achievements=o.achievements||[];state.clues=o.clues||{};state.phase=o.phase==='ended'?'ended':'playing';closeModal();if(state.phase==='ended'){story('已讀取結局存檔。');choices([{label:'🔄 重新開始',do:resetGame}]);}else go(state.entry);toast('已讀取存檔。');}catch(e){toast('讀檔失敗。');}}
function resetGame(){if(!confirm('確定重置？成就會保留。'))return;const a=state.achievements.slice();state=fresh();state.achievements=a;closeModal();stats();side();hist('重置遊戲');openManual();}
function toggleSound(){state.sound=!state.sound;$('soundBtn').textContent='音效：'+(state.sound?'開':'關');if(state.sound)sfx('click');}

/* ============ 初始化 ============ */
stats();side();$('svgScene').innerHTML=svg('ship');story('正在翻開古老的冒險書……');openManual();
</script>
