<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>菜園 Gardeno - 單人桌遊</title>
    <style>
        :root {
            --bg-color: #f4e8d1;
            --text-color: #4a3b2c;
            --btn-bg: #8c6b4a;
            --btn-hover: #a07c57;
            --btn-disabled: #b0a090;
            --highlight: #f2c94c;
            --font-main: 'Georgia', 'Times New Roman', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #2c261f;
            background-image: radial-gradient(circle, #3a332b 0%, #1a1612 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        #game-container {
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 20px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 4px solid #5a4b3c;
            height: 95vh;
        }

        #top-bar {
            background: linear-gradient(to bottom, #d4c3a3, #b8a382);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #5a4b3c;
            font-weight: bold;
            font-size: 16px;
            color: #2c261f;
            flex-shrink: 0;
        }

        #top-bar span { display: flex; align-items: center; gap: 5px; }
        #score-display { font-size: 18px; color: #8b4513; }

        #board-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            overflow-y: auto;
            overflow-x: auto;
        }

        #game-board {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 100px;
            grid-template-rows: auto auto;
            gap: 10px;
            min-width: 600px;
        }

        .zone {
            background-color: #d9c7a8;
            border: 2px dashed #8c6b4a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            position: relative;
            transition: all 0.2s;
            padding: 5px;
        }
        .zone.active { border-color: var(--highlight); box-shadow: 0 0 10px var(--highlight); cursor: pointer; background-color: #e8dcc8; }
        .zone.occupied { border-style: solid; background-color: #e0d1b5; }
        .zone.target { border: 2px solid #4caf50; background-color: #c8e6c9; cursor: pointer; }
        .zone-title { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #5a4b3c; text-align: center; }
        .zone-range { font-size: 10px; background: #fff; padding: 2px 6px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 5px; }
        
        .dice {
            width: 44px;
            height: 44px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
            color: #333;
        }
        .dice.empty { background-color: transparent; border: 2px dashed #aaa; box-shadow: none; font-size: 12px; color: #aaa; }
        .dice.highlight { transform: scale(1.1); box-shadow: 0 0 15px var(--highlight); border-color: var(--highlight); cursor: pointer; }
        .dice.selected { border-color: #4caf50; box-shadow: 0 0 15px #4caf50; }
        .dice.used { opacity: 0.4; pointer-events: none; filter: grayscale(1); }

        #storage-area, #season-area {
            background-color: #a8b5a1;
            border: 2px solid #5a4b3c;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        #storage-area { grid-column: 4; grid-row: 1; min-height: 80px; }
        #season-area { grid-column: 4; grid-row: 2; min-height: 80px; background-color: #c97b7b; }

        #action-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 10px;
            background-color: #b8a382;
            border-radius: 10px;
            border: 2px solid #5a4b3c;
            flex-shrink: 0;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #d4c3a3);
            border: 3px solid #5a4b3c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #5a4b3c;
            transition: all 0.1s;
            position: relative;
        }
        .action-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #5a4b3c; }
        .action-btn.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
        .action-btn.blocked::after {
            content: '🚫';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0.8;
            pointer-events: none;
        }
        .action-btn .label { font-size: 11px; margin-top: 2px; font-weight: bold; color: #333; }
        .action-btn.selected { border-color: var(--highlight); box-shadow: 0 0 15px var(--highlight); }

        #controls {
            display: flex;
            gap: 10px;
            padding: 10px;
            background-color: #e6d5b8;
            border-top: 2px solid #5a4b3c;
            flex-shrink: 0;
        }
        .btn {
            flex: 1;
            padding: 12px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-family: var(--font-main);
            box-shadow: 0 4px 0 #4a3b2c;
        }
        .btn:hover:not(:disabled) { background-color: var(--btn-hover); }
        .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #4a3b2c; }
        .btn:disabled { background-color: var(--btn-disabled); cursor: not-allowed; box-shadow: 0 4px 0 #888; }

        #message {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #8b4513;
            min-height: 40px;
            flex-shrink: 0;
        }

        #bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: #5a4b3c;
            padding: 5px;
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #d4c3a3;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-btn span { font-size: 10px; margin-top: 2px; }
        .nav-btn:hover { color: white; background-color: rgba(255,255,255,0.1); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background-color: var(--bg-color);
            border: 4px solid #5a4b3c;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; color: #8b4513; border-bottom: 2px solid #8c6b4a; padding-bottom: 5px; }
        .modal-body { font-size: 14px; line-height: 1.6; color: #333; margin-bottom: 20px; }
        .modal-body h3 { font-size: 16px; color: #5a4b3c; margin-top: 15px; margin-bottom: 5px; }
        .modal-body ul, .modal-body ol { padding-left: 20px; margin-bottom: 10px; }
        .modal-body li { margin-bottom: 5px; }
        .modal-close-btn { display: block; width: 100%; padding: 10px; margin-top: 10px; }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background-color: rgba(0,0,0,0.85);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            transition: transform 0.3s;
            z-index: 200;
            pointer-events: none;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            #game-container { height: 100vh; border-radius: 0; border: none; }
            #game-board { grid-template-columns: 1fr 1fr 1fr 80px; gap: 5px; }
            .action-btn { width: 60px; height: 60px; font-size: 20px; }
            .dice { width: 36px; height: 36px; font-size: 20px; }
            .zone-title { font-size: 10px; }
            .zone-range { font-size: 8px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="top-bar">
        <span><span id="season-icon">🌸</span> <span id="season-name">春季</span> | 回合 <span id="turn-display">1</span>/6</span>
        <span>總分: <span id="score-display">0</span></span>
    </div>

    <div id="board-wrapper">
        <div id="game-board">
            <div class="zone" id="zone-broccoli" data-zone="broccoli">
                <div class="zone-title">🥦 花椰菜</div>
                <div class="zone-range">1-6</div>
                <div class="dice empty" id="dice-broccoli">空</div>
            </div>
            <div class="zone" id="zone-pepper" data-zone="pepper">
                <div class="zone-title">🌶️ 辣椒</div>
                <div class="zone-range">1-6</div>
                <div class="dice empty" id="dice-pepper">空</div>
            </div>
            <div class="zone" id="zone-tomato" data-zone="tomato">
                <div class="zone-title">🍅 番茄</div>
                <div class="zone-range">1-6</div>
                <div class="dice empty" id="dice-tomato">空</div>
            </div>
            <div id="storage-area">
                <div style="font-size:12px;">儲存區</div>
                <div id="storage-dice-container" style="display:flex; gap:5px; margin-top:5px; flex-wrap:wrap; justify-content:center;"></div>
            </div>

            <div class="zone" id="zone-seedling" data-zone="seedling">
                <div class="zone-title">🌱 秧苗</div>
                <div class="zone-range">1-6</div>
                <div class="dice empty" id="dice-seedling">空</div>
            </div>
            <div class="zone" id="zone-labor" data-zone="labor">
                <div class="zone-title">🛠️ 勞動力</div>
                <div class="zone-range">1-6</div>
                <div class="dice empty" id="dice-labor">空</div>
            </div>
            <div style="grid-column: 3; grid-row: 2;"></div>
            <div id="season-area">
                <div style="font-size:12px;">季節骰</div>
                <div class="dice" id="season-dice" style="margin-top:5px; border-color: #fff;">1</div>
            </div>
        </div>

        <div id="action-area">
            <div class="action-btn" id="action-reroll" data-action="1">
                🎲<div class="label">重擲</div>
            </div>
            <div class="action-btn" id="action-move" data-action="2">
                ➡️<div class="label">移動</div>
            </div>
            <div class="action-btn" id="action-upgrade" data-action="3">
                ⬆️<div class="label">提升</div>
            </div>
            <div class="action-btn" id="action-swap" data-action="4">
                🔄<div class="label">交換</div>
            </div>
        </div>

        <div id="message">歡迎來到菜園！請點擊「開始回合」擲骰。</div>
    </div>

    <div id="controls">
        <button class="btn" id="btn-start" onclick="game.startTurn()">開始回合</button>
        <button class="btn" id="btn-end-turn" onclick="game.endTurn()" disabled>結束回合</button>
    </div>

    <!-- 修正：將 onclick 的 ui 改為大寫 UI -->
    <div id="bottom-nav">
        <button class="nav-btn" onclick="UI.showRules()">📖<span>規則</span></button>
        <button class="nav-btn" onclick="game.saveGame()">💾<span>存檔</span></button>
        <button class="nav-btn" onclick="game.loadGame()">📂<span>讀檔</span></button>
        <button class="nav-btn" onclick="UI.showHistory()">📜<span>紀錄</span></button>
        <button class="nav-btn" onclick="UI.toggleSound()">🔊<span>音效</span></button>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
        <div class="modal-title" id="modal-title">標題</div>
        <div class="modal-body" id="modal-body">內容</div>
        <!-- 修正：將 onclick 的 ui 改為大寫 UI -->
        <button class="btn modal-close-btn" id="modal-close-btn" onclick="UI.closeModal()">我準備好了，開始遊戲</button>
    </div>
</div>

<div id="toast"></div>

<script>
    const AudioManager = {
        enabled: true,
        ctx: null,
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // 【修正】確保在使用者互動時解鎖 AudioContext
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },
        playClick() {
            if (!this.enabled) return;
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        },
        playDice() {
            if (!this.enabled) return;
            this.init();
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        },
        playScore() {
            if (!this.enabled) return;
            this.init();
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + i * 0.1);
                osc.stop(this.ctx.currentTime + i * 0.1 + 0.3);
            });
        },
        toggle() {
            this.enabled = !this.enabled;
            document.querySelector('.nav-btn:last-child').innerHTML = (this.enabled ? '🔊' : '🔇') + '<span>音效</span>';
            return this.enabled;
        }
    };

    const UI = {
        elements: {
            seasonIcon: document.getElementById('season-icon'),
            seasonName: document.getElementById('season-name'),
            turnDisplay: document.getElementById('turn-display'),
            scoreDisplay: document.getElementById('score-display'),
            seasonDice: document.getElementById('season-dice'),
            message: document.getElementById('message'),
            btnStart: document.getElementById('btn-start'),
            btnEndTurn: document.getElementById('btn-end-turn'),
            actionBtns: document.querySelectorAll('.action-btn'),
            zones: document.querySelectorAll('.zone'),
            storageContainer: document.getElementById('storage-dice-container'),
            modalOverlay: document.getElementById('modal-overlay'),
            modalTitle: document.getElementById('modal-title'),
            modalBody: document.getElementById('modal-body'),
            modalCloseBtn: document.getElementById('modal-close-btn'),
            toast: document.getElementById('toast')
        },
        setMessage(msg) { this.elements.message.textContent = msg; },
        updateTopBar(state) {
            const seasons = ['春季', '夏季', '秋季'];
            const icons = ['🌸', '☀️', '🍂'];
            this.elements.seasonName.textContent = seasons[state.season - 1];
            this.elements.seasonIcon.textContent = icons[state.season - 1];
            this.elements.turnDisplay.textContent = state.turn;
            this.elements.scoreDisplay.textContent = state.totalScore;
            this.elements.seasonDice.textContent = state.seasonDiceValue;
            this.elements.seasonDice.style.backgroundColor = state.seasonDiceValue >= 7 ? '#f2c94c' : '#fff';
        },
        renderBoard(state) {
            const zones = ['broccoli', 'pepper', 'tomato', 'seedling', 'labor'];
            zones.forEach(zone => {
                const diceEl = document.getElementById(`dice-${zone}`);
                const zoneEl = document.getElementById(`zone-${zone}`);
                const dice = state.dice.find(d => d.location === zone);
                
                zoneEl.classList.remove('active', 'occupied', 'target');
                diceEl.classList.remove('empty', 'highlight', 'selected', 'used');

                if (dice) {
                    diceEl.textContent = dice.value;
                    zoneEl.classList.add('occupied');
                    if (state.phase === 'ACTION_EXECUTE' && state.actedDiceIds.includes(dice.id)) {
                        diceEl.classList.add('used');
                    }
                } else {
                    diceEl.textContent = '空';
                    diceEl.classList.add('empty');
                }
            });

            this.elements.storageContainer.innerHTML = '';
            const storageDice = state.dice.filter(d => d.location === 'storage');
            storageDice.forEach(d => {
                const el = document.createElement('div');
                el.className = 'dice';
                el.style.width = '30px'; el.style.height = '30px'; el.style.fontSize = '16px';
                el.textContent = d.value;
                this.elements.storageContainer.appendChild(el);
            });
        },
        updateActions(state) {
            this.elements.actionBtns.forEach((btn, index) => {
                btn.classList.remove('disabled', 'blocked', 'selected');
                const actionIndex = index + 1;
                
                if (state.phase === 'ACTION_SELECT') {
                    if (state.blockedAction === actionIndex) btn.classList.add('blocked', 'disabled');
                } else if (state.phase === 'ACTION_EXECUTE' && state.selectedAction === actionIndex) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.add('disabled');
                }
            });
        },
        showModal(title, body, btnText = '確定') {
            this.elements.modalTitle.textContent = title;
            this.elements.modalBody.innerHTML = body;
            this.elements.modalCloseBtn.textContent = btnText;
            this.elements.modalOverlay.classList.add('active');
            AudioManager.playClick();
        },
        closeModal() {
            this.elements.modalOverlay.classList.remove('active');
            AudioManager.playClick();
            if (game.state.phase === 'SETUP') game.startTurn();
        },
        showToast(msg) {
            this.elements.toast.textContent = msg;
            this.elements.toast.classList.add('show');
            setTimeout(() => this.elements.toast.classList.remove('show'), 2500);
        },
        showRules() {
            this.elements.modalTitle.textContent = '📖 遊戲規則說明';
            this.elements.modalBody.innerHTML = `
                <h3>🎯 遊戲目標</h3>
                <p>在三個季節（春、夏、秋）中種植蔬菜，透過控制成本並獲取季節獎勵，達到最高分！</p>
                <h3>🖥️ 看懂畫面</h3>
                <ul>
                    <li><strong>頂部狀態列</strong>：顯示當前季節、回合數（1-6）以及你的總分。</li>
                    <li><strong>蔬菜田（上方）</strong>：🥦花椰菜、🌶️辣椒、🍅番茄。</li>
                    <li><strong>成本區（下方）</strong>：🌱秧苗、🛠️勞動力。</li>
                    <li><strong>儲存區（右上）</strong>：無法放置的骰子暫時放這，回合結束時移除。</li>
                    <li><strong>季節骰（右下）</strong>：達 7 時結算季節。</li>
                    <li><strong>行動區</strong>：每回合可選一個行動。被 🚫 阻擋的無法使用。</li>
                </ul>
                <h3>🕹️ 操作步驟</h3>
                <ol>
                    <li><strong>擲骰與放置</strong>：點擊「開始回合」，骰子會自動擲出。點擊閃爍的空位放置骰子（數值需符合 1-6）。若無空位會自動放儲存區。</li>
                    <li><strong>選擇行動</strong>：選擇未被阻擋的行動。系統會根據版圖上（含儲存區與季節區）相同數值骰子的最高數量，要求你執行該次數。</li>
                    <li><strong>執行動作</strong>：<strong>每顆骰子在該行動中只能被操作一次！</strong>已被操作的骰子會變灰。若合法目標數量不足，系統會自動提前結束該行動。</li>
                    <li><strong>結束回合</strong>：執行完畢後，點擊「結束回合」，季節骰 +1。</li>
                </ol>
                <h3>⚙️ 特殊機制</h3>
                <ul>
                    <li><strong>季節結算</strong>：季節骰達 7 時，計算（蔬菜骰 - 相連成本骰）的總和。若符合季節獎勵且蔬菜骰大於成本骰，額外加分（春：🥦+3、夏：🌶️+5、秋：🍅+7）。</li>
                    <li><strong>保留最低骰</strong>：結算後，只保留「數值最低」的骰子到下個季節。</li>
                    <li><strong>相連限制</strong>：交換行動只能在相連區域間進行（🥦-🌱、🌶️-🛠️、🍅-🌱/🛠️）。</li>
                </ul>
            `;
            this.elements.modalCloseBtn.textContent = '我準備好了，繼續遊戲';
            this.elements.modalOverlay.classList.add('active');
        },
        showHistory() {
            this.elements.modalTitle.textContent = '📜 歷史紀錄';
            let html = '<ul>';
            if (game.state.history.length === 0) html += '<li>暫無紀錄</li>';
            game.state.history.forEach(h => html += `<li>${h}</li>`);
            html += '</ul>';
            this.elements.modalBody.innerHTML = html;
            this.elements.modalCloseBtn.textContent = '關閉';
            this.elements.modalOverlay.classList.add('active');
        },
        toggleSound() {
            const enabled = AudioManager.toggle();
            this.showToast(enabled ? '音效已開啟' : '音效已關閉');
        }
    };

    const game = {
        state: {
            phase: 'SETUP',
            season: 1,
            turn: 1,
            seasonDiceValue: 1,
            totalScore: 0,
            currentDiceValue: 0,
            dice: [],
            blockedAction: 0,
            selectedAction: 0,
            actionRemaining: 0,
            history: [],
            swapSource: null,
            moveSource: null,
            actedDiceIds: []
        },

        connections: {
            'broccoli': ['seedling'],
            'pepper': ['labor'],
            'tomato': ['seedling', 'labor']
        },

        init() {
            this.resetGame();
            UI.showRules();
        },

        resetGame() {
            this.state = {
                phase: 'SETUP',
                season: 1,
                turn: 1,
                seasonDiceValue: 1,
                totalScore: 0,
                currentDiceValue: 0,
                dice: Array.from({ length: 5 }, (_, i) => ({ id: i, value: 0, location: 'pool' })),
                blockedAction: 0,
                selectedAction: 0,
                actionRemaining: 0,
                history: [],
                swapSource: null,
                moveSource: null,
                actedDiceIds: []
            };
            this.updateUI();
            UI.setMessage('歡迎來到菜園！請點擊「開始回合」擲骰。');
            UI.elements.btnStart.disabled = false;
            UI.elements.btnEndTurn.disabled = true;
        },

        startTurn() {
            if (this.state.phase !== 'SETUP' && this.state.phase !== 'ROLL') return;
            if (this.state.phase === 'SEASON_END' || this.state.phase === 'GAME_OVER') return;

            AudioManager.playDice();
            this.state.phase = 'ROLL';
            UI.elements.btnStart.disabled = true;
            
            const poolDice = this.state.dice.find(d => d.location === 'pool');
            
            if (!poolDice) {
                UI.setMessage('沒有未使用的骰子，直接進入行動選擇。');
                this.state.phase = 'ACTION_SELECT';
                this.rollActionToken();
                this.updateUI();
                return;
            }

            UI.setMessage('正在擲骰...');
            
            setTimeout(() => {
                const value = Math.floor(Math.random() * 6) + 1;
                poolDice.value = value;
                this.state.currentDiceValue = value;
                this.state.phase = 'PLACE';
                
                UI.setMessage(`擲出了 ${value} 點！請點擊合適的區域放置。`);
                this.updateUI();
                this.highlightValidZones();
            }, 500);
        },

        highlightValidZones() {
            const zones = ['broccoli', 'pepper', 'tomato', 'seedling', 'labor'];
            let hasEmpty = false;
            zones.forEach(zone => {
                const zoneEl = document.getElementById(`zone-${zone}`);
                const isOccupied = this.state.dice.some(d => d.location === zone);
                if (!isOccupied) {
                    zoneEl.classList.add('active');
                    hasEmpty = true;
                }
            });
            
            if (!hasEmpty) {
                UI.setMessage('沒有空位了，骰子將放入儲存區。');
                this.placeDice('storage');
            }
        },

        placeDice(location) {
            if (this.state.phase !== 'PLACE') return;
            
            if (location !== 'storage') {
                const isOccupied = this.state.dice.some(d => d.location === location);
                if (isOccupied) return;
            }

            const poolDice = this.state.dice.find(d => d.location === 'pool');
            if (!poolDice) return;

            poolDice.location = location;
            AudioManager.playClick();
            
            this.state.phase = 'ACTION_SELECT';
            this.rollActionToken();
            this.updateUI();
        },

        rollActionToken() {
            this.state.blockedAction = Math.floor(Math.random() * 4) + 1;
            this.state.selectedAction = 0;
            UI.setMessage(`行動指示物阻擋了行動 ${this.state.blockedAction}。請選擇剩下的行動。`);
            UI.updateActions(this.state);
        },

        selectAction(actionId) {
            if (this.state.phase !== 'ACTION_SELECT') return;
            if (actionId === this.state.blockedAction) {
                UI.showToast('這個行動被指示物阻擋了！');
                return;
            }

            this.state.selectedAction = actionId;
            this.state.phase = 'ACTION_EXECUTE';
            this.state.actedDiceIds = [];
            
            const counts = {};
            this.state.dice.forEach(d => {
                if (d.value > 0) counts[d.value] = (counts[d.value] || 0) + 1;
            });
            counts[this.state.seasonDiceValue] = (counts[this.state.seasonDiceValue] || 0) + 1;
            
            const maxCount = Math.max(...Object.values(counts), 0);
            this.state.actionRemaining = maxCount > 0 ? maxCount : 1;
            
            UI.setMessage(`已選擇行動，需執行 ${this.state.actionRemaining} 次。`);
            UI.updateActions(this.state);
            UI.elements.btnEndTurn.disabled = true;
            
            this.executeActionLogic(actionId);
        },

        hasValidTargets(actionId) {
            const zones = ['broccoli', 'pepper', 'tomato', 'seedling', 'labor'];
            const activeDice = this.state.dice.filter(d => zones.includes(d.location) && !this.state.actedDiceIds.includes(d.id));

            if (actionId === 1 || actionId === 3) {
                return activeDice.length > 0;
            }
            if (actionId === 2) {
                const emptyZones = zones.filter(z => !this.state.dice.some(d => d.location === z));
                return activeDice.length > 0 && emptyZones.length > 0;
            }
            if (actionId === 4) {
                for (let [veg, costs] of Object.entries(this.connections)) {
                    const vegDice = this.state.dice.find(d => d.location === veg && !this.state.actedDiceIds.includes(d.id));
                    if (vegDice) {
                        for (let cost of costs) {
                            const costDice = this.state.dice.find(d => d.location === cost && !this.state.actedDiceIds.includes(d.id));
                            if (costDice) return true;
                        }
                    }
                }
                return false;
            }
            return false;
        },

        executeActionLogic(actionId) {
            if (this.state.actionRemaining <= 0) {
                this.finishAction();
                return;
            }

            if (!this.hasValidTargets(actionId)) {
                UI.showToast('已無可操作的合法目標，提前結束行動。');
                this.finishAction();
                return;
            }

            const zones = ['broccoli', 'pepper', 'tomato', 'seedling', 'labor'];
            UI.elements.zones.forEach(z => z.classList.remove('active', 'target'));
            UI.renderBoard(this.state);

            if (actionId === 1) {
                zones.forEach(z => {
                    const diceEl = document.getElementById(`dice-${z}`);
                    if (!diceEl.classList.contains('empty') && !diceEl.classList.contains('used')) {
                        diceEl.classList.add('highlight');
                    }
                });
                UI.setMessage(`重擲：請點擊要重擲的骰子 (剩餘 ${this.state.actionRemaining} 次)`);
            } else if (actionId === 2) {
                zones.forEach(z => {
                    const diceEl = document.getElementById(`dice-${z}`);
                    if (!diceEl.classList.contains('empty') && !diceEl.classList.contains('used')) {
                        diceEl.classList.add('highlight');
                    }
                });
                UI.setMessage(`移動：請點擊要移動的骰子 (剩餘 ${this.state.actionRemaining} 次)`);
            } else if (actionId === 3) {
                zones.forEach(z => {
                    const diceEl = document.getElementById(`dice-${z}`);
                    if (!diceEl.classList.contains('empty') && !diceEl.classList.contains('used')) {
                        diceEl.classList.add('highlight');
                    }
                });
                UI.setMessage(`提升：請點擊要 +1 的骰子 (剩餘 ${this.state.actionRemaining} 次)`);
            } else if (actionId === 4) {
                UI.setMessage(`交換：請點擊蔬菜區的骰子，再點擊相連的成本區 (剩餘 ${this.state.actionRemaining} 次)`);
            }
        },

        handleDiceClick(zone) {
            if (this.state.phase !== 'ACTION_EXECUTE' && this.state.phase !== 'MOVE_TARGET') return;
            const dice = this.state.dice.find(d => d.location === zone);
            
            if (this.state.phase === 'MOVE_TARGET') {
                if (zone === this.state.moveSource) {
                    this.state.phase = 'ACTION_EXECUTE';
                    this.state.moveSource = null;
                    this.executeActionLogic(this.state.selectedAction);
                    UI.showToast('已取消移動。');
                    return;
                }

                const targetDice = this.state.dice.find(d => d.location === zone);
                if (targetDice) return;

                const moveDice = this.state.dice.find(d => d.id === this.state.moveSourceId);
                moveDice.location = zone;
                this.state.actionRemaining--;
                this.state.actedDiceIds.push(moveDice.id);
                AudioManager.playClick();
                
                this.state.phase = 'ACTION_EXECUTE';
                this.state.moveSource = null;
                this.updateUI();
                
                UI.setMessage(`移動成功！(剩餘 ${this.state.actionRemaining} 次)`);
                if (this.state.actionRemaining <= 0) this.finishAction();
                else this.executeActionLogic(this.state.selectedAction);
                return;
            }

            if (!dice) return;

            if (this.state.actedDiceIds.includes(dice.id)) {
                UI.showToast('每顆骰子在同一行動中只能操作一次！');
                return;
            }

            const actionId = this.state.selectedAction;

            if (actionId === 1) {
                AudioManager.playDice();
                dice.value = Math.floor(Math.random() * 6) + 1;
                this.state.actionRemaining--;
                this.state.actedDiceIds.push(dice.id);
                UI.setMessage(`重擲結果為 ${dice.value}！(剩餘 ${this.state.actionRemaining} 次)`);
                this.updateUI();
                if (this.state.actionRemaining <= 0) this.finishAction();
                else this.executeActionLogic(actionId);

            } else if (actionId === 2) {
                const emptyZones = ['broccoli', 'pepper', 'tomato', 'seedling', 'labor'].filter(z => !this.state.dice.some(d => d.location === z));
                if (emptyZones.length === 0) {
                    UI.showToast('沒有空位可以移動了！');
                    this.finishAction();
                    return;
                }

                this.state.moveSource = zone;
                this.state.moveSourceId = dice.id;
                this.state.phase = 'MOVE_TARGET';
                
                UI.renderBoard(this.state);
                emptyZones.forEach(z => {
                    document.getElementById(`zone-${z}`).classList.add('target');
                });
                document.getElementById(`dice-${zone}`).classList.add('selected');
                UI.setMessage('請點擊一個綠色的目標空位來移動骰子（再次點擊原骰子可取消）。');

            } else if (actionId === 3) {
                dice.value++;
                this.state.actionRemaining--;
                this.state.actedDiceIds.push(dice.id);
                AudioManager.playClick();
                
                if (dice.value >= 7) {
                    dice.location = 'pool';
                    dice.value = 0;
                    UI.setMessage(`骰子數值達到 7，被移除了！(剩餘 ${this.state.actionRemaining} 次)`);
                } else {
                    UI.setMessage(`骰子數值提升至 ${dice.value}！(剩餘 ${this.state.actionRemaining} 次)`);
                }
                
                this.updateUI();
                if (this.state.actionRemaining <= 0) this.finishAction();
                else this.executeActionLogic(actionId);

            } else if (actionId === 4) {
                if (!this.state.swapSource) {
                    if (zone === 'seedling' || zone === 'labor') {
                        UI.showToast('請先點擊上方蔬菜田的骰子！');
                        return;
                    }
                    this.state.swapSource = zone;
                    document.getElementById(`dice-${zone}`).classList.add('selected');
                    
                    const validCosts = this.connections[zone] || [];
                    validCosts.forEach(costZone => {
                        const costDice = this.state.dice.find(d => d.location === costZone);
                        if (costDice && !this.state.actedDiceIds.includes(costDice.id)) {
                            document.getElementById(`dice-${costZone}`).classList.add('highlight');
                        }
                    });
                    UI.setMessage('已選擇蔬菜骰，請點擊閃爍的相連成本區進行交換。');
                } else {
                    if (zone !== 'seedling' && zone !== 'labor') {
                        UI.showToast('請點擊成本區的骰子！');
                        return;
                    }
                    
                    const validCosts = this.connections[this.state.swapSource] || [];
                    if (!validCosts.includes(zone)) {
                        UI.showToast('這兩個區域沒有相連，無法交換！');
                        return;
                    }

                    const targetDice = this.state.dice.find(d => d.location === zone);
                    if (!targetDice || this.state.actedDiceIds.includes(targetDice.id)) {
                        UI.showToast('該骰子已被操作過或為空！');
                        return;
                    }

                    const sourceDice = this.state.dice.find(d => d.location === this.state.swapSource);
                    
                    const tempLoc = sourceDice.location;
                    sourceDice.location = targetDice.location;
                    targetDice.location = tempLoc;
                    
                    this.state.actedDiceIds.push(sourceDice.id);
                    this.state.actedDiceIds.push(targetDice.id);
                    
                    this.state.actionRemaining--;
                    AudioManager.playClick();
                    UI.setMessage(`交換成功！(剩餘 ${this.state.actionRemaining} 次)`);
                    
                    this.state.swapSource = null;
                    this.updateUI();
                    
                    if (this.state.actionRemaining <= 0) this.finishAction();
                    else this.executeActionLogic(actionId);
                }
            }
        },

        finishAction() {
            this.state.phase = 'END_TURN_READY';
            this.state.swapSource = null;
            this.state.moveSource = null;
            this.state.actedDiceIds = [];
            
            UI.setMessage('行動執行完畢，請點擊「結束回合」。');
            UI.updateActions(this.state);
            UI.renderBoard(this.state);
            
            UI.elements.btnEndTurn.disabled = false;
        },

        endTurn() {
            if (this.state.phase !== 'END_TURN_READY' && this.state.phase !== 'ACTION_SELECT') return;
            
            AudioManager.playClick();
            this.state.phase = 'ROLL';
            this.state.turn++;
            this.state.seasonDiceValue++;
            
            this.state.dice.forEach(d => {
                if (d.location === 'storage') {
                    d.location = 'pool';
                    d.value = 0;
                }
            });

            this.state.history.push(`第 ${this.state.season} 季，回合 ${this.state.turn - 1} 結束。`);
            this.updateUI();

            if (this.state.seasonDiceValue >= 7) {
                this.checkSeasonEnd();
            } else {
                this.startTurn();
            }
        },

        checkSeasonEnd() {
            this.state.phase = 'SEASON_END';
            UI.setMessage(`第 ${this.state.season} 季結束！正在結算分數...`);
            setTimeout(() => this.calculateSeasonScore(), 800);
        },

        calculateSeasonScore() {
            let seasonScore = 0;
            let scoreDetails = [];

            const connections = {
                'broccoli': ['seedling'],
                'pepper': ['labor'],
                'tomato': ['seedling', 'labor']
            };

            Object.keys(connections).forEach(vegZone => {
                const vegDice = this.state.dice.find(d => d.location === vegZone);
                if (vegDice) {
                    const vegVal = vegDice.value;
                    let connectedCosts = connections[vegZone];
                    let subScore = 0;
                    let costTexts = [];
                    
                    connectedCosts.forEach(costZone => {
                        const costDice = this.state.dice.find(d => d.location === costZone);
                        if (costDice) {
                            subScore += (vegVal - costDice.value);
                            costTexts.push(`${costDice.value}`);
                        } else {
                            subScore += vegVal; // 成本為 0，直接加蔬菜值
                        }
                    });

                    let bonusText = '';
                    if (
                        (this.state.season === 1 && vegZone === 'broccoli') ||
                        (this.state.season === 2 && vegZone === 'pepper') ||
                        (this.state.season === 3 && vegZone === 'tomato')
                    ) {
                        let bonusCondition = true;
                        connectedCosts.forEach(costZone => {
                            const costDice = this.state.dice.find(d => d.location === costZone);
                            if (costDice && vegVal <= costDice.value) bonusCondition = false;
                        });

                        if (bonusCondition) {
                            const bonus = this.state.season === 1 ? 3 : (this.state.season === 2 ? 5 : 7);
                            subScore += bonus;
                            bonusText = ` (含季節獎勵+${bonus})`;
                        }
                    }
                    
                    seasonScore += subScore;
                    scoreDetails.push(`${vegZone === 'broccoli' ? '🥦' : vegZone === 'pepper' ? '🌶️' : '🍅'} 蔬菜${vegVal} - 成本(${costTexts.join(',')}) = ${subScore}${bonusText}`);
                }
            });

            this.state.totalScore += seasonScore;
            UI.updateTopBar(this.state);
            AudioManager.playScore();

            let html = `<p>本季得分：<strong>${seasonScore}</strong> 分</p>`;
            html += `<ul>${scoreDetails.map(d => `<li>${d}</li>`).join('')}</ul>`;
            html += `<p>目前總分：<strong>${this.state.totalScore}</strong> 分</p>`;

            if (this.state.season < 3) {
                html += `<p>即將進入下一個季節...</p>`;
                UI.showModal(`第 ${this.state.season} 季結算`, html, '進入下一季');
                UI.elements.modalCloseBtn.onclick = () => {
                    UI.closeModal();
                    this.nextSeason();
                };
            } else {
                this.endGame(html);
            }
        },

        nextSeason() {
            this.state.season++;
            this.state.seasonDiceValue = 1;
            this.state.turn = 1;
            this.state.phase = 'SETUP';

            let minVal = 99;
            this.state.dice.forEach(d => {
                if (d.location !== 'pool' && d.location !== 'storage' && d.value < minVal) {
                    minVal = d.value;
                }
            });

            this.state.dice.forEach(d => {
                if (d.location !== 'pool' && d.location !== 'storage' && d.value !== minVal) {
                    d.location = 'pool';
                    d.value = 0;
                }
            });

            this.updateUI();
            UI.setMessage(`第 ${this.state.season} 季開始！請點擊「開始回合」。`);
            UI.elements.btnStart.disabled = false;
            UI.elements.btnEndTurn.disabled = true;
            UI.updateTopBar(this.state);
        },

        endGame(detailsHtml) {
            this.state.phase = 'GAME_OVER';
            let rating = '';
            if (this.state.totalScore < 30) rating = '😢 新手農夫';
            else if (this.state.totalScore < 40) rating = '🙁 見習農夫';
            else if (this.state.totalScore < 50) rating = '😐 熟練農夫';
            else if (this.state.totalScore < 60) rating = '🙂 優秀農夫';
            else rating = '😄 傳奇農業大師！';

            let html = `<h3>遊戲結束！</h3>`;
            html += detailsHtml;
            html += `<p style="font-size:20px; text-align:center; margin-top:20px;">最終評價：<br><strong>${rating}</strong></p>`;
            
            UI.showModal('🏆 最終結算', html, '再玩一次');
            UI.elements.modalCloseBtn.onclick = () => {
                UI.closeModal();
                this.resetGame();
                UI.elements.modalCloseBtn.onclick = UI.closeModal;
            };
            UI.elements.btnStart.disabled = true;
            UI.elements.btnEndTurn.disabled = true;
        },

        saveGame() {
            if (this.state.phase === 'SETUP' || this.state.phase === 'GAME_OVER' || this.state.phase === 'MOVE_TARGET') {
                UI.showToast('現在無法存檔');
                return;
            }
            localStorage.setItem('gardenoSave', JSON.stringify(this.state));
            UI.showToast('遊戲已存檔！');
            AudioManager.playClick();
        },

        loadGame() {
            const saved = localStorage.getItem('gardenoSave');
            if (!saved) {
                UI.showToast('沒有找到存檔！');
                return;
            }
            this.state = JSON.parse(saved);
            this.updateUI();
            UI.showToast('讀檔成功！');
            AudioManager.playClick();
            
            if (this.state.phase === 'PLACE') {
                UI.elements.btnStart.disabled = true;
                UI.elements.btnEndTurn.disabled = true;
                this.highlightValidZones();
            } else if (this.state.phase === 'ACTION_SELECT' || this.state.phase === 'ACTION_EXECUTE') {
                UI.elements.btnStart.disabled = true;
                UI.elements.btnEndTurn.disabled = true; 
                UI.updateActions(this.state);
                if (this.state.phase === 'ACTION_EXECUTE') {
                    this.executeActionLogic(this.state.selectedAction);
                }
            } else if (this.state.phase === 'END_TURN_READY') {
                UI.elements.btnStart.disabled = true;
                UI.elements.btnEndTurn.disabled = false;
                UI.updateActions(this.state);
            } else {
                UI.elements.btnStart.disabled = false;
                UI.elements.btnEndTurn.disabled = true;
            }
        },

        updateUI() {
            UI.updateTopBar(this.state);
            UI.renderBoard(this.state);
            UI.updateActions(this.state);
            
            UI.elements.zones.forEach(zone => {
                zone.onclick = (e) => {
                    if (this.state.phase === 'PLACE') {
                        this.placeDice(zone.dataset.zone);
                    } else if (this.state.phase === 'ACTION_EXECUTE' || this.state.phase === 'MOVE_TARGET') {
                        this.handleDiceClick(zone.dataset.zone);
                    }
                };
                const diceEl = zone.querySelector('.dice');
                if (diceEl) {
                    diceEl.onclick = (e) => {
                        e.stopPropagation();
                        zone.onclick();
                    };
                }
            });

            UI.elements.actionBtns.forEach((btn, index) => {
                btn.onclick = () => {
                    if (this.state.phase === 'ACTION_SELECT') {
                        this.selectAction(index + 1);
                    }
                };
            });
        }
    };

    window.onload = () => game.init();

</script>
</body>
</html>
