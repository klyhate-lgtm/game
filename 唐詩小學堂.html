<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>唐詩小學堂 🌸</title>
<style>
:root{--fs-base:1;}
html[data-font="small"]{--fs-base:.9;}
html[data-font="large"]{--fs-base:1.14;}
html[data-font="xlarge"]{--fs-base:1.28;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"jf open 粉圓","Yuanti TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(circle at 12% 8%,#fff2cc 0,transparent 38%),
             radial-gradient(circle at 88% 12%,#ffe0ef 0,transparent 40%),
             radial-gradient(circle at 50% 100%,#e2f2ff 0,transparent 55%),#fffaf3;
  min-height:100vh;color:#5a4632;padding-bottom:40px;overflow-x:hidden;
}
/* 頂欄 */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:2px solid #ffe6f0;
}
.topbar h1{flex:1;margin:0;font-size:19px;text-align:center;color:#e26a8d;letter-spacing:2px;font-weight:800;}
.icon-btn{
  width:46px;height:46px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 3px 0 #f3dfe8;font-size:21px;cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex:0 0 auto;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #f3dfe8;}
#homeBtn{visibility:hidden;}
/* 容器 */
.view{max-width:780px;margin:0 auto;padding:0 0 20px;}
/* 首頁 */
.hero{text-align:center;padding:20px 20px 6px;}
.hero .hero-emoji{font-size:52px;line-height:1;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h2{margin:10px 0 4px;font-size:24px;color:#e26a8d;letter-spacing:1px;}
.hero p{margin:0;color:#a08b7a;font-size:14px;}
/* 快捷卡片 */
.quick-row{display:flex;gap:12px;padding:14px 16px 4px;}
.quick-card{
  flex:1;border:none;border-radius:22px;padding:14px 12px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:10px;transition:.15s;
}
.quick-card:active{transform:translateY(3px);}
.q-review{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a;}
.q-sticker{background:linear-gradient(135deg,#c6b7ff,#a18aff);color:#fff;box-shadow:0 5px 0 #7d63e0;}
.q-icon{font-size:34px;line-height:1;flex:0 0 auto;}
.q-text{flex:1;text-align:left;}
.q-text b{display:block;font-size:17px;letter-spacing:1px;}
.q-text small{display:block;font-size:11.5px;opacity:.82;margin-top:2px;letter-spacing:.5px;}
/* 章節 */
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:14px 16px;}
.chapter{
  border:none;cursor:pointer;text-align:center;background:#fff;border-radius:24px;padding:10px 10px 14px;
  box-shadow:0 6px 0 rgba(232,190,210,.45),0 12px 22px rgba(200,160,180,.15);
  transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;position:relative;
}
.chapter:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(232,190,210,.45);}
.ch-art{width:100%;border-radius:16px;overflow:hidden;line-height:0;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.ch-art svg{width:100%;height:auto;display:block;}
.ch-num{font-size:11px;color:#b9a696;letter-spacing:1px;margin-top:6px;}
.ch-title{font-size:19px;font-weight:800;color:#5a4632;letter-spacing:2px;}
.ch-author{font-size:12px;color:#a89684;}
.ch-stars{font-size:12px;letter-spacing:1px;}
.chapter.custom{border:2px dashed #ffd0e2;box-shadow:0 6px 0 rgba(255,200,225,.35);}
.ch-badge{
  position:absolute;top:8px;right:8px;background:#fff0f6;color:#e26a8d;
  font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;
}
.add-chapter{
  border:3px dashed #ffd0e2!important;background:linear-gradient(135deg,#fffdfe,#fff5fa)!important;
  box-shadow:none!important;justify-content:center;min-height:170px;
}
.add-chapter:active{transform:translateY(4px);}
.add-icon{font-size:44px;color:#ff9ec4;line-height:1;margin-bottom:6px;}
.add-chapter .ch-title{color:#e26a8d;font-size:17px;}
.add-chapter .ch-author{color:#c9a8b8;}
.art-emoji{
  display:grid;place-items:center;min-height:86px;font-size:52px;
  background:linear-gradient(135deg,#fff6fb,#ffeaf3);
}
/* 家長入口 */
.parent-link{
  text-align:center;padding:22px 20px 8px;
}
.parent-link button{
  background:none;border:none;color:#c9b8aa;font-family:inherit;
  font-size:12.5px;letter-spacing:1px;cursor:pointer;padding:6px 12px;
}
.parent-link button:active{color:#a89684;}
/* 詩頁 */
.poem-view{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.poem-tools{display:flex;align-items:center;gap:8px;padding:12px 16px 0;}
.custom-badge{
  background:#fff0f6;color:#e26a8d;font-size:12px;font-weight:800;
  border-radius:12px;padding:5px 12px;letter-spacing:1px;
}
.del-btn{
  margin-left:auto;border:none;background:#fff0f0;color:#e06060;
  border-radius:12px;padding:6px 14px;font-size:13px;font-weight:800;
  font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffd6d6;transition:.15s;
}
.del-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ffd6d6;}
.poem-card{
  margin:14px 16px;border-radius:26px;overflow:hidden;background:#fff;
  box-shadow:0 8px 0 rgba(232,190,210,.35),0 14px 26px rgba(200,160,180,.16);
  display:flex;align-items:center;
}
.poem-art{width:46%;line-height:0;flex:0 0 auto;}
.poem-art svg{width:100%;height:auto;display:block;}
.poem-meta{padding:12px 16px;flex:1;}
.poem-meta h2{margin:0 0 6px;font-size:26px;letter-spacing:4px;color:#e26a8d;}
.poem-meta p{margin:0;font-size:14px;color:#a08b7a;letter-spacing:2px;}
.steps{display:flex;gap:8px;padding:0 16px;margin-bottom:14px;}
.step{
  flex:1;border:none;border-radius:18px;padding:13px 2px;background:#fff;color:#b3a091;
  font-size:14px;font-weight:800;box-shadow:0 3px 0 #f0e2d8;cursor:pointer;transition:.15s;
  font-family:inherit;letter-spacing:.5px;
}
.step.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 3px 0 #e09a2a;transform:translateY(-1px);}
.step:active{transform:translateY(2px);box-shadow:0 1px 0 #f0e2d8;}
.stage{padding:0 16px 30px;}
/* 讀一讀 */
.lines{display:flex;flex-direction:column;gap:12px;}
.line{
  display:block;width:100%;border:3px solid #ffe6f0;background:#fff;border-radius:20px;
  padding:14px 8px 16px;font-size:calc(clamp(20px,5.6vw,30px)*var(--fs-base));
  cursor:pointer;transition:.15s;font-family:inherit;color:#4a3b2a;
  box-shadow:0 4px 0 rgba(255,190,215,.5);line-height:1.2;
}
.line.active{border-color:#ffb347;background:#fffbf0;box-shadow:0 4px 0 rgba(255,180,70,.55);}
.line:active{transform:scale(.99);}
ruby{ruby-position:over;padding:0 2px;transition:background .15s,transform .15s;border-radius:6px;}
ruby.lit{background:#ffe88a;transform:scale(1.12);}
rt{font-size:.42em;color:#ea85a4;letter-spacing:0;font-weight:700;line-height:1.05;font-family:inherit;}
.punct{color:#c9b8aa;margin-left:1px;}
.story-box{
  background:linear-gradient(135deg,#fffbe6,#fff5d6);border:3px solid #ffe6a8;
  border-radius:20px;padding:16px;margin-top:14px;
  display:none;animation:fadeIn .3s ease;
}
.story-box.show{display:block;}
.story-box p{margin:0 0 10px;font-size:calc(15.5px*var(--fs-base));line-height:1.85;color:#8a6a3a;letter-spacing:.5px;}
.story-speaker{
  display:inline-flex;align-items:center;gap:8px;border:none;background:#fff;
  border-radius:14px;padding:10px 16px;font-size:14px;font-weight:800;color:#c98a00;
  font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffe6a8;transition:.15s;
}
.story-speaker:active{transform:translateY(2px);box-shadow:0 1px 0 #ffe6a8;}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{
  flex:1;min-width:130px;border:none;border-radius:20px;padding:16px 16px;
  font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:1px;
}
.btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 5px 0 #3d8fd0;}
.btn.next{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a;}
.btn.ghost{background:#fff;color:#a08b7a;box-shadow:0 5px 0 #f0e2d8;border:2px solid #f4ead9;}
.btn:active{transform:translateY(3px);box-shadow:none;}
/* 填一填 */
.game-title{text-align:center;font-size:17px;font-weight:800;color:#e26a8d;letter-spacing:1px;margin:4px 0 16px;}
.big-speaker{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 20px;}
.speaker-btn{
  width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;font-size:38px;
  box-shadow:0 6px 0 #3d8fd0;display:grid;place-items:center;transition:.15s;
}
.speaker-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3d8fd0;}
.speaker-btn.playing{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.speaker-label{font-size:14px;color:#8a7a6a;font-weight:700;letter-spacing:1px;}
.fill-line{
  background:#fff;border:3px dashed #ffd0e2;border-radius:22px;padding:20px 10px;text-align:center;
  font-size:calc(clamp(26px,7.5vw,40px)*var(--fs-base));
  letter-spacing:6px;margin-bottom:22px;transition:.25s;
}
.fill-line.solved{border-style:solid;border-color:#a8e6c4;background:#f2fff8;}
.blank{
  display:inline-block;min-width:1em;color:#ff8fab;border-bottom:5px solid #ff8fab;
  animation:blink .9s infinite;padding:0 4px;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fill-line.solved .blank{border-bottom-color:#4fc98b;color:#4fc98b;animation:none;}
.options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.opt{
  width:92px;height:92px;border-radius:26px;border:4px solid #ffe0ec;background:#fff;
  cursor:pointer;transition:.15s;font-family:inherit;
  box-shadow:0 6px 0 rgba(255,190,215,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.opt-char{font-size:calc(42px*var(--fs-base));font-weight:800;color:#5a4632;line-height:1;}
.opt-zhuyin{font-size:14px;color:#ea85a4;font-weight:700;margin-top:3px;letter-spacing:1px;line-height:1;}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(255,190,215,.55);}
.opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;animation:pop .35s ease;}
.opt.correct .opt-char{color:#137a4c;}
.opt.correct .opt-zhuyin{color:#137a4c;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;}
.opt.wrong .opt-char{color:#e06060;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.opt:disabled{cursor:default;}
.hint-btn{
  display:block;margin:0 auto;border:none;background:#fff8e6;color:#c98a00;
  border-radius:18px;padding:13px 26px;font-size:15px;font-weight:800;
  font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #ffe6a8;transition:.15s;
}
.hint-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #ffe6a8;}
.feedback{text-align:center;font-size:18px;font-weight:800;color:#4fc98b;min-height:34px;margin-top:16px;letter-spacing:1px;}
/* 排排看 */
.order-hint{
  background:linear-gradient(135deg,#fff8e6,#ffeec9);border-radius:20px;padding:16px;
  text-align:center;margin-bottom:18px;border:3px solid #ffe6a8;
}
.order-hint .hint-text{font-size:16px;font-weight:800;color:#8a5200;letter-spacing:1px;margin-bottom:10px;}
.order-hint .speaker-btn{width:64px;height:64px;font-size:30px;margin:0 auto;display:grid;}
.slots{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.slot{
  min-height:58px;border:3px dashed #d8d8d8;border-radius:20px;background:#fbfbfb;
  display:flex;align-items:center;padding:10px 16px;font-size:16px;letter-spacing:2px;
  color:#b3a091;transition:.25s;
}
.slot.filled{
  border-style:solid;border-color:#a8d4ff;background:#fff;
  box-shadow:0 4px 0 rgba(160,200,255,.4);animation:pop .35s ease;
  color:#4a3b2a;font-size:17px;
}
.slot .num{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;background:#f0f0f0;
  font-weight:800;font-size:16px;margin-right:12px;color:#a8a8a8;flex:0 0 auto;
}
.slot.filled .num{background:#a8d4ff;color:#fff;}
.pool{display:flex;flex-direction:column;gap:10px;}
.chip{
  border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:14px 16px;
  font-size:17px;letter-spacing:2px;color:#4a3b2a;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 rgba(255,190,215,.5);transition:.15s;text-align:left;
  display:flex;align-items:center;gap:10px;
}
.chip .chip-sound{
  width:38px;height:38px;border-radius:50%;background:#fff0f6;
  display:grid;place-items:center;font-size:18px;flex:0 0 auto;
}
.chip .chip-text{flex:1;}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,190,215,.5);}
.chip.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;}
.chip.hint-glow{animation:glow 1s ease-in-out 2;}
@keyframes glow{0%,100%{box-shadow:0 4px 0 rgba(255,190,215,.5)}50%{box-shadow:0 4px 0 #ffb347,0 0 20px #ffb347;}}
/* 慶祝 */
.celebrate{
  position:fixed;inset:0;z-index:100;background:rgba(60,40,60,.45);
  backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:fadeIn .3s ease;
}
.celebration-box{
  background:#fff;border-radius:30px;padding:30px 26px;text-align:center;
  max-width:320px;width:100%;box-shadow:0 20px 50px rgba(120,80,110,.3);
  animation:pop .45s cubic-bezier(.2,1.4,.5,1);
}
.celebration-box .big{font-size:64px;animation:float 1.4s ease-in-out infinite;}
.celebration-box h3{margin:6px 0;font-size:24px;color:#e26a8d;letter-spacing:2px;}
.celebration-box p{margin:0 0 20px;color:#a08b7a;font-size:15px;letter-spacing:1px;}
.confetti{position:fixed;top:-20px;font-size:20px;z-index:99;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2;}}
/* 彈窗通用 */
.modal{
  position:fixed;inset:0;z-index:150;background:rgba(60,40,60,.5);
  backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.show{display:flex;animation:fadeIn .25s ease;}
.modal-box{
  background:#fff;border-radius:26px;padding:20px;width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(120,80,110,.35);
  animation:pop .35s cubic-bezier(.2,1.3,.5,1);
}
.modal-box h3{margin:0 0 4px;font-size:19px;color:#e26a8d;letter-spacing:2px;text-align:center;}
.modal-tip{font-size:12.5px;color:#a08b7a;text-align:center;margin:0 0 12px;line-height:1.7;}
.modal-tip b{color:#e26a8d;}
.add-input{
  width:100%;min-height:180px;border:3px solid #ffe6f0;border-radius:16px;padding:12px;
  font-size:15.5px;line-height:1.85;resize:vertical;font-family:inherit;color:#4a3b2a;
  outline:none;background:#fffdfe;
}
.add-input:focus{border-color:#ffc9dd;}
.add-preview{margin-top:12px;}
.preview-title{font-size:14px;font-weight:800;color:#4fc98b;margin-bottom:8px;letter-spacing:1px;}
.preview-item{
  background:#f7fffb;border:2px solid #d6f5e6;border-radius:14px;padding:10px 12px;
  margin-bottom:7px;font-size:13.5px;line-height:1.6;
}
.preview-item b{color:#e26a8d;font-size:15px;letter-spacing:1px;}
.preview-item span{color:#a08b7a;font-size:12px;margin-left:6px;}
.preview-warn{
  background:#fff8e6;border:2px solid #ffe6a8;border-radius:12px;padding:9px 12px;
  font-size:12.5px;color:#9a7a1a;margin-bottom:7px;line-height:1.7;
}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.m-btn{
  flex:1;border:none;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:1px;
}
.m-btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 4px 0 #3d8fd0;}
.m-btn.ghost{background:#f4f0f2;color:#a08b7a;box-shadow:0 4px 0 #e6dfe3;}
.m-btn.danger{background:linear-gradient(135deg,#ff8f8f,#ff6b6b);color:#fff;box-shadow:0 4px 0 #d95050;}
.m-btn:active{transform:translateY(2px);box-shadow:none;}
/* 複習視圖 */
.review-overlay{
  position:fixed;inset:0;z-index:180;background:#fffaf3;
  overflow-y:auto;display:none;animation:fadeIn .3s ease;
}
.review-overlay.show{display:block;}
.review-header{
  position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);padding:12px 16px;
  display:flex;align-items:center;gap:12px;border-bottom:2px solid #ffe6f0;
}
.review-progress{flex:1;}
.review-progress .bar{
  height:10px;background:#f0e2d8;border-radius:5px;overflow:hidden;
}
.review-progress .bar-fill{
  height:100%;background:linear-gradient(90deg,#ffd86b,#ffb347);
  border-radius:5px;width:0;transition:width .35s ease;
}
.review-progress .bar-label{
  font-size:12.5px;color:#a08b7a;font-weight:700;margin-top:5px;letter-spacing:.5px;
}
.review-body{max-width:600px;margin:0 auto;padding:20px 16px 40px;}
.review-from{
  text-align:center;font-size:13px;color:#a08b7a;letter-spacing:1px;margin-bottom:14px;
}
.review-from b{color:#e26a8d;}
.review-summary{max-width:440px;margin:30px auto;padding:0 20px;text-align:center;}
.review-summary .big-emoji{font-size:72px;line-height:1;animation:float 1.6s ease-in-out infinite;margin-bottom:10px;}
.review-summary h3{margin:0 0 8px;font-size:24px;color:#e26a8d;letter-spacing:2px;}
.review-summary p{margin:0 0 8px;font-size:15px;color:#8a7a6a;line-height:1.7;}
.review-summary .stars-earned{font-size:32px;letter-spacing:4px;margin:12px 0 22px;}
/* 貼紙冊 */
.sticker-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:14px;padding:6px 0;
}
.sticker-card{
  border-radius:20px;padding:14px 8px;text-align:center;
  background:linear-gradient(135deg,#fff6fb,#ffeaf3);
  border:3px solid #ffe0ec;transition:.2s;
}
.sticker-card.locked{
  background:#f7f4f5;border-color:#e8e2e6;
  filter:grayscale(1);opacity:.55;
}
.sticker-card .sticker-emoji{font-size:44px;line-height:1;margin-bottom:6px;}
.sticker-card.locked .sticker-emoji{filter:blur(1px);}
.sticker-card .sticker-title{
  font-size:12.5px;font-weight:800;color:#5a4632;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sticker-card.locked .sticker-title{color:#b3a091;}
.sticker-total{
  text-align:center;font-size:14px;color:#a08b7a;margin-bottom:12px;letter-spacing:1px;
}
.sticker-total b{color:#e26a8d;font-size:18px;}
/* 家長頁 */
.parent-section{margin-bottom:20px;}
.parent-section h4{
  margin:0 0 10px;font-size:15px;color:#e26a8d;letter-spacing:1.5px;

<script>
/* =========================================================
   一、注音引擎
   ========================================================= */
const SM={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
const YM={a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',i:'ㄧ',ia:'ㄧㄚ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',ong:'ㄨㄥ',v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
const FULL={zhi:'ㄓ',chi:'ㄔ',shi:'ㄕ',ri:'ㄖ',zi:'ㄗ',ci:'ㄘ',si:'ㄙ',yi:'ㄧ',ya:'ㄧㄚ',ye:'ㄧㄝ',yao:'ㄧㄠ',you:'ㄧㄡ',yan:'ㄧㄢ',yin:'ㄧㄣ',yang:'ㄧㄤ',ying:'ㄧㄥ',yong:'ㄩㄥ',yu:'ㄩ',yue:'ㄩㄝ',yuan:'ㄩㄢ',yun:'ㄩㄣ',wu:'ㄨ',wa:'ㄨㄚ',wo:'ㄨㄛ',wai:'ㄨㄞ',wei:'ㄨㄟ',wan:'ㄨㄢ',wen:'ㄨㄣ',wang:'ㄨㄤ',weng:'ㄨㄥ',er:'ㄦ',a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ'};
const TONE={'1':'','2':'ˊ','3':'ˇ','4':'ˋ','5':'˙','0':'˙'};
function toZhuyin(syllable){
  if(!syllable) return '';
  const m=String(syllable).toLowerCase().match(/^([a-züêv]+)([0-5])?$/);
  if(!m) return '';
  let s=m[1].replace(/ü/g,'v');
  const tone=m[2]||'5';
  if(FULL[s]) return FULL[s]+(TONE[tone]||'');
  let sm='',ym=s;
  if(s.startsWith('zh')||s.startsWith('ch')||s.startsWith('sh')){sm=s.slice(0,2);ym=s.slice(2);}
  else if('bpmfdtnlgkhjqxrzcs'.includes(s[0])){sm=s[0];ym=s.slice(1);}
  if(sm==='j'||sm==='q'||sm==='x'){
    if(ym==='u') ym='v';else if(ym==='ue') ym='ve';
    else if(ym==='uan') ym='van';else if(ym==='un') ym='vn';
  }
  const a=SM[sm]||'',b=YM[ym]||'';
  if(!a&&!b) return '';
  return a+b+(TONE[tone]||'');
}
function zhuyinOf(text,warnSet,title){
  if(!text) return '';
  if(typeof pinyinPro==='undefined'){warnSet.add('注音引擎未載入（請檢查網路）');return '';}
  const out=[];
  for(const ch of [...text]){
    if(!/[\u3400-\u4dbf\u4e00-\u9fff]/.test(ch)) continue;
    let py='';
    try{py=pinyinPro.pinyin(ch,{toneType:'num',v:true,type:'array'})[0]||'';}catch(e){py='';}
    const z=toZhuyin(py);
    if(!z) warnSet.add(`「${ch}」查不到讀音（出自《${title||'未命名'}》）`);
    out.push(z||'？');
  }
  return out.join(' ');
}

/* =========================================================
   二、文字 → 詩 解析器
   ========================================================= */
const hasPunct=s=>/[，。！？、；：,.!?;:]/.test(s);
function parseBlock(lines){
  let title='',author='',start=0;
  if(lines.length){
    const first=lines[0];
    if(!hasPunct(first)&&first.length<=16){
      const parts=first.split(/[\s　｜|·・]+/).filter(Boolean);
      if(parts.length>=2){title=parts[0];author=parts.slice(1).join('');}
      else{title=first;}
      start=1;
      if(!author&&lines[1]){
        let cand=lines[1].replace(/[〔\[（(【〕\]）)】]/g,'').trim();
        cand=cand.replace(/^(唐|宋|元|明|清|近代|現代|當代)[\s·・]?/,'').replace(/^[·・]/,'').trim();
        if(cand&&cand.length<=4&&!hasPunct(cand)){author=cand;start=2;}
      }
    }
  }
  return {title,author,body:lines.slice(start).join('')};
}
function splitSentences(body){
  const clean=body.replace(/\s/g,'');
  let out=[];
  const re=/[^，。！？；：,.!?;:]+[，。！？；：,.!?;:]*/g;
  let m;
  while((m=re.exec(clean))){const s=m[0].trim();if(s) out.push(s);}
  if(out.length===1&&out[0].replace(/[，。！？；：,.!?;:]/g,'').length>=10){
    const raw=out[0].replace(/[，。！？；：,.!?;:]/g,'');
    for(const len of [5,7]){
      if(raw.length%len===0&&raw.length>=len*2){
        const parts=[];
        for(let i=0;i<raw.length;i+=len) parts.push(raw.slice(i,i+len));
        out=parts.map((p,idx)=>p+(idx%2===0?'，':'。'));
        break;
      }
    }
  }
  return out;
}
function splitTextPunct(s){
  const m=s.match(/^([\s\S]*?)([，。！？；：,.!?;:…—]*)$/);
  return {t:(m[1]||'').trim(),p:m[2]||''};
}
function parsePoemsText(raw){
  const blocks=raw.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  const warns=new Set();
  const poems=[];
  const stamp=Date.now();
  blocks.forEach((block,bi)=>{
    const lines=block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return;
    const {title,author,body}=parseBlock(lines);
    const sents=splitSentences(body);
    if(!sents.length) return;
    const poemLines=[];
    sents.forEach(s=>{
      const {t,p}=splitTextPunct(s);
      if(!t) return;
      const z=zhuyinOf(t,warns,title||`第${bi+1}首`);
      poemLines.push({t,z,p});
    });
    if(!poemLines.length) return;
    poems.push({
      id:'custom_'+stamp+'_'+(bi+1),
      title:title||('未命名'+(bi+1)),
      author:author||'',
      art:'📜',sticker:'📜',story:'',
      custom:true,lines:poemLines
    });
  });
  return {poems,warns};
}

/* 進度 API */
function getProg(id){
  const p=progress[id];
  if(!p||typeof p!=='object') return {learn:false,fill:false,order:false,wrongChars:{}};
  return p;
}
function setProg(id,patch){
  progress[id]=Object.assign({},getProg(id),patch);
  saveProgress();
}
function markDone(id,key){
  const p=getProg(id);
  p[key]=true;
  // 三關全過 → 記錄掌握時間、初始化複習
  if(p.learn&&p.fill&&p.order&&!p.masteredAt){
    p.masteredAt=Date.now();
    p.reviewLevel=0;
    p.nextReview=Date.now()+1*24*3600*1000; // 1 天後
  }
  progress[id]=p;
  saveProgress();
}
function addWrongChar(ch){
  if(!ch) return;
  const w=progress.__wrongChars__||{};
  w[ch]=(w[ch]||0)+1;
  progress.__wrongChars__=w;
  saveProgress();
}
function addRightChar(ch){
  if(!ch) return;
  const w=progress.__wrongChars__||{};
  if(w[ch]&&w[ch]>0){
    w[ch]=w[ch]-1;
    if(w[ch]<=0) delete w[ch];
    progress.__wrongChars__=w;
    saveProgress();
  }
}
function getWrongChars(){
  const w=progress.__wrongChars__||{};
  return Object.entries(w).sort((a,b)=>b[1]-a[1]);
}

/* =========================================================
   六、語音
   ========================================================= */
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices();
  if(!vs.length) return null;
  const tw=vs.filter(v=>/zh[-_]TW|zh[-_]Hant/i.test(v.lang||''));
  const zh=vs.filter(v=>/^zh/i.test(v.lang||''));
  const female=tw.find(v=>/Mei|Xiao|Yu|Han|女|Female/i.test(v.name||''));
  return female||tw[0]||zh[0]||null;
}
if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged',()=>pickVoice());

function speakAsync(text,{rate=0.82,pitch=1.42}={}){
  return new Promise(resolve=>{
    if(!state.soundOn||!('speechSynthesis' in window)||!text){resolve();return;}
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-TW';u.rate=rate;u.pitch=pitch;u.volume=1;
    const v=pickVoice();
    if(v) u.voice=v;
    let done=false;
    const finish=()=>{if(!done){done=true;resolve();}};
    u.onend=finish;u.onerror=finish;
    setTimeout(finish,10000);
    try{speechSynthesis.speak(u);}catch(e){finish();}
  });
}
const speak=text=>speakAsync(text);

soundBtn.addEventListener('click',()=>{
  state.soundOn=!state.soundOn;

});

function artHTML(p){
  const raw=String(p.svg||p.art||'').trim();
  if(raw.startsWith('<svg')) return raw;
  if(/^(https?:|data:)/.test(raw)) return `<img src="${raw}" alt="" style="width:100%;display:block">`;
  if(raw) return `<div class="art-emoji">${raw}</div>`;
  return `<div class="art-emoji">📜</div>`;
}
function rubyHTML(ln,blankIdx=-1,reveal=null,clickable=false){
  const chars=ln.t.split('');
  const zs=ln.z.split(' ');
  let html=chars.map((c,i)=>{
    if(i===blankIdx&&!reveal) return `<span class="blank">？</span>`;
    const ch=(i===blankIdx&&reveal)?reveal:c;
    const cls=clickable?'ch':'';
    return `<ruby class="${cls}" data-ch="${ch}" data-zy="${zs[i]||''}">${ch}<rt>${zs[i]||''}</rt></ruby>`;
  }).join('');
  if(ln.p) html+=`<span class="punct">${ln.p}</span>`;
  return html;
}
function isPoemMastered(id){
  const p=getProg(id);
  return !!(p.learn&&p.fill&&p.order);
}

  stage.innerHTML=`

    <div class="actions">
      ${hasStory?`<button class="btn ghost" id="storyToggle">💡 詩在說什麼</button>`:''}
      <button class="btn primary" id="readAll">🔊 朗讀全詩</button>
    </div>

      <button class="btn next" id="nextBtn" style="flex:1;">下一關 →</button>
    </div>
  `;

  if(hasStory){
    stage.querySelector('#storyToggle').addEventListener('click',()=>{
      const box=stage.querySelector('#storyBox');
      box.classList.toggle('show');
      if(box.classList.contains('show')){
        speakAsync(p.story,{rate:0.75,pitch:1.45});
      }
    });
    stage.querySelector('#storySpeak').addEventListener('click',()=>{
      speakAsync(p.story,{rate:0.75,pitch:1.45});
    });
  }

  stage.querySelectorAll('.line').forEach(lineEl=>{
    lineEl.addEventListener('click',async e=>{
      const ruby=e.target.closest('ruby');
      if(ruby){
        const ch=ruby.dataset.ch;
        const zy=ruby.dataset.zy;
        ruby.classList.add('lit');
        await speakAsync(ch,{rate:0.75,pitch:1.5});
        if(zy) await speakAsync(zy,{rate:0.7,pitch:1.4});
        setTimeout(()=>ruby.classList.remove('lit'),300);
        return;
      }
      const i=+lineEl.dataset.i;
      highlightLine(stage,i);
      await speakLineWithHighlight(lineEl,p.lines[i]);
    });
  });

  stage.querySelector('#readAll').addEventListener('click',()=>readWhole(stage));
  stage.querySelector('#nextBtn').addEventListener('click',()=>{
    markDone(p.id,'learn');state.step='fill';renderPoem();
  });

function highlightLine(stage,idx){
  stage.querySelectorAll('.line').forEach((el,i)=>el.classList.toggle('active',i===idx));
}

async function speakLineWithHighlight(lineEl,line){
  if(state.reading) return;
  state.reading=true;
  const rubies=[...lineEl.querySelectorAll('ruby')];
  rubies.forEach(r=>r.classList.remove('lit'));
  const speakP=speakAsync(lineText(line),{rate:0.7,pitch:1.45});
  const perChar=Math.max(380,Math.min(700,5200/Math.max(1,rubies.length)));
  for(const r of rubies){r.classList.add('lit');await sleep(perChar);}
  await speakP;
  await sleep(500);
  rubies.forEach(r=>r.classList.remove('lit'));
  state.reading=false;
}

async function readWhole(stage){
  if(state.reading) return;
  const p=POEMS[state.poemIndex];
  state.reading=true;
  for(let i=0;i<p.lines.length;i++){
    if(state.step!=='learn') break;
    highlightLine(stage,i);
    const lineEl=stage.querySelector(`.line[data-i="${i}"]`);
    if(!lineEl) break;
    const rubies=[...lineEl.querySelectorAll('ruby')];
    rubies.forEach(r=>r.classList.remove('lit'));
    await speakAsync(lineText(p.lines[i]),{rate:0.7,pitch:1.45});
    for(const r of rubies){r.classList.add('lit');await sleep(90);}
    await sleep(700);
    rubies.forEach(r=>r.classList.remove('lit'));
    await sleep(200);
  }
  highlightLine(stage,-1);
  state.reading=false;
}

/* =========================================================
   十一、填一填
   ========================================================= */
function newFillRound(li){
  const p=POEMS[state.poemIndex];
  const ln=p.lines[li];
  const chars=ln.t.split('');
  const ci=Math.floor(Math.random()*chars.length);
  const answer=chars[ci];
  const answerZ=(ln.z.split(' ')[ci])||'';
  const allChars=[...new Set(p.lines.map(l=>l.t).join('').split(''))].filter(c=>c!==answer);
  shuffle(allChars);
  const opts=shuffle([answer,...allChars.slice(0,2)]);
  return {li,ci,answer,answerZ,opts,solved:false,played:false};
}

function renderFill(stage){
  const p=POEMS[state.poemIndex];
  if(!state.fillQueue){
    state.fillQueue=shuffle([...p.lines.keys()]).slice(0,3);
    state.fillIdx=0;state.fill=null;
  }
  if(state.fillIdx>=state.fillQueue.length){
    markDone(p.id,'fill');state.fillQueue=null;state.step='order';renderPoem();return;
  }
  if(!state.fill) state.fill=newFillRound(state.fillQueue[state.fillIdx]);

  const f=state.fill;
  const ln=p.lines[f.li];

  stage.innerHTML=`
    <div class="game-title">✦ 聽一聽，少了哪一個字？ ✦</div>
    <div class="big-speaker">
      <button class="speaker-btn" id="playLine">🔊</button>
      <div class="speaker-label">點我聽整句</div>
    </div>
    <div class="fill-line" id="fillLine">${rubyHTML(ln,f.ci)}</div>
    <div class="options" id="opts">
      ${f.opts.map(o=>{
        const zy=(ln.z.split(' ')[ln.t.indexOf(o)])||'';
        return `<button class="opt" data-c="${o}">
          <span class="opt-char">${o}</span>
          <span class="opt-zhuyin">${zy}</span>
        </button>`;
      }).join('')}
    </div>
    <button class="hint-btn" id="hintBtn">💡 提示：聽聽看這個字</button>
    <div class="feedback" id="fb"></div>
  `;

  stage.querySelector('#playLine').addEventListener('click',async e=>{
    const btn=e.currentTarget;
    btn.classList.add('playing');
    await speakAsync(lineText(ln),{rate:0.68,pitch:1.45});
    btn.classList.remove('playing');
  });

  stage.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const c=btn.dataset.c;
      await speakAsync(c,{rate:0.72,pitch:1.5});
      if(c===f.answer&&!f.solved) onPickCorrect(btn,stage);
      else if(!f.solved){
        btn.classList.add('wrong');
        addWrongChar(c);
        setTimeout(()=>btn.classList.remove('wrong'),500);
        speakAsync('再聽一次喔',{rate:0.85,pitch:1.4});
      }
    });
  });

  stage.querySelector('#hintBtn').addEventListener('click',async()=>{
    if(f.solved) return;
    await speakAsync(`這個字念 ${f.answerZ}`,{rate:0.7,pitch:1.45});
  });

  setTimeout(()=>{
    if(state.step==='fill'&&state.fill===f&&!f.played){
      f.played=true;
      speakAsync(lineText(ln),{rate:0.68,pitch:1.45});
    }
  },400);
}

   十二、排排看

function renderOrder(stage){
  const p=POEMS[state.poemIndex];
  if(!state.order){
    state.order={pool:shuffle([...p.lines.keys()]),placed:[],wrongCount:0};
  }
  drawOrder(stage,p,state.order);
}

function drawOrder(stage,p,o){
  const finished=o.placed.length===p.lines.length;
  const nextIdx=o.placed.length;
  const targetLine=p.lines[nextIdx];

  stage.innerHTML=`
    <div class="game-title">✦ 聽一聽，找出正確的句子 ✦</div>
    ${finished?'':`
    <div class="order-hint">
      <div class="hint-text">請找出第 ${nextIdx+1} 句</div>
      <button class="speaker-btn" id="playTarget">🔊</button>
    </div>`}
    <div class="slots">
      ${p.lines.map((_,i)=>{
        const li=o.placed[i];
        return `<div class="slot ${li!==undefined?'filled':''}">
          <span class="num">${i+1}</span>
          ${li!==undefined?linePlain(p.lines[li]):''}
        </div>`;
      }).join('')}
    </div>
    <div class="pool">
      ${o.pool.map(li=>`
        <button class="chip" data-li="${li}">
          <span class="chip-sound">🔊</span>
          <span class="chip-text">${linePlain(p.lines[li])}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback" id="fb">${finished?'🎉 全部完成！':''}</div>
  `;

  if(finished) return;

  setTimeout(()=>{
    if(state.step==='order'&&state.order===o&&!o.placed.includes(nextIdx)){
      speakAsync(lineText(targetLine),{rate:0.68,pitch:1.45});
    }
  },400);

  const playTarget=stage.querySelector('#playTarget');
  if(playTarget){
    playTarget.addEventListener('click',()=>{
      speakAsync(lineText(targetLine),{rate:0.68,pitch:1.45});
    });
  }

  stage.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const li=+btn.dataset.li;
      const curIdx=o.placed.length;
      await speakAsync(lineText(p.lines[li]),{rate:0.68,pitch:1.45});
      if(li===curIdx){
        o.placed.push(li);
        o.pool=o.pool.filter(x=>x!==li);
        o.wrongCount=0;
        drawOrder(stage,p,o);
        if(o.placed.length===p.lines.length){
          markDone(p.id,'order');
          setTimeout(()=>{launchConfetti();showCelebration(p);},700);
        }
      } else {
        o.wrongCount++;
        btn.classList.add('wrong');
        setTimeout(()=>btn.classList.remove('wrong'),500);
        await speakAsync('再聽一次喔',{rate:0.85,pitch:1.4});
        if(o.wrongCount>=2){
          o.wrongCount=0;
          const targetChip=stage.querySelector(`.chip[data-li="${curIdx}"]`);
          if(targetChip){
            targetChip.classList.add('hint-glow');
            setTimeout(()=>targetChip.classList.remove('hint-glow'),2200);
          }
        }
        speakAsync(lineText(p.lines[curIdx]),{rate:0.68,pitch:1.45});
      }
    });
  });
}

function buildReviewQuestions(maxQty=5){
  const now=Date.now();
  // 優先抽有錯字的詩
  const wrongChars=progress.__wrongChars__||{};
  const candidates=[];
  for(const p of POEMS){
    const pr=getProg(p.id);
    if(!(pr.learn&&pr.fill&&pr.order)) continue;
    // 計算加權
    let weight=1;
    // 到期的詩優先
    if(!pr.nextReview||pr.nextReview<=now) weight+=3;
    // 錯誤字多優先
    for(const ln of p.lines){
      for(const ch of ln.t){
        if(wrongChars[ch]) weight+=wrongChars[ch];
      }
    }
    candidates.push({poem:p,weight});
  }
  if(!candidates.length) return [];

  // 加權洗牌
  const expanded=[];
  for(const c of candidates){
    for(let i=0;i<c.weight;i++) expanded.push(c.poem);
  }
  const pickedPoems=[];
  const seen=new Set();
  for(const p of shuffle(expanded.slice())){
    if(seen.has(p.id)) continue;
    seen.add(p.id);
    pickedPoems.push(p);
    if(pickedPoems.length>=3) break;
  }

  const questions=[];
  for(const p of pickedPoems){
    if(questions.length>=maxQty) break;
    const need=Math.min(2,maxQty-questions.length);
    const usedLineIdx=new Set();
    let added=0;
    let tries=0;
    while(added<need&&tries<10){
      tries++;
      const li=Math.floor(Math.random()*p.lines.length);
      if(usedLineIdx.has(li)) continue;
      usedLineIdx.add(li);
      const ln=p.lines[li];
      const ci=Math.floor(Math.random()*ln.t.length);
      const answer=ln.t[ci];
      const answerZ=(ln.z.split(' ')[ci])||'';
      const allChars=[...new Set(p.lines.map(l=>l.t).join('').split(''))].filter(c=>c!==answer);
      shuffle(allChars);
      const opts=shuffle([answer,...allChars.slice(0,2)]);
      questions.push({
        poemTitle:p.title,poemId:p.id,li,ci,answer,answerZ,opts
      });
      added++;
    }
  }
  return shuffle(questions);
}

function startReview(){
  const questions=buildReviewQuestions(5);
  if(!questions.length){
    toast('先去把一首詩的三關都過完，就能複習囉！');
    return;
  }
  state.review={
    questions,qIdx:0,correct:0,wrong:0,
    answered:false
  };
  reviewOverlay.classList.add('show');
  document.body.style.overflow='hidden';
  renderReviewQuestion();
}

function updateReviewHeader(){
  const r=state.review;
  if(!r) return;
  const total=r.questions.length;
  const done=r.qIdx;
  reviewBar.style.width=Math.min(100,(done/total)*100)+'%';
  reviewLabel.textContent=`第 ${Math.min(done+1,total)} 題 / 共 ${total} 題`;
}

function renderReviewQuestion(){
  const r=state.review;
  if(!r) return;

  if(r.qIdx>=r.questions.length){
    renderReviewSummary();
    return;
  }

  r.answered=false;
  const q=r.questions[r.qIdx];
  updateReviewHeader();

  reviewContent.innerHTML=`
    <div class="review-body">
      <div class="review-from">出自《<b>${q.poemTitle}</b>》</div>
      <div class="big-speaker">
        <button class="speaker-btn" id="reviewPlay">🔊</button>
        <div class="speaker-label">點我聽句子</div>
      </div>
      <div class="fill-line" id="reviewFill">
        ${makeReviewLineHTML(q)}
      </div>
      <div class="options" id="reviewOpts">
        ${q.opts.map(o=>{
          // 從原詩找 o 的注音
          const p=POEMS.find(x=>x.id===q.poemId);
          let zy='';
          if(p){
            for(const ln of p.lines){
              const idx=ln.t.indexOf(o);
              if(idx>=0){zy=(ln.z.split(' ')[idx])||'';break;}
            }
          }
          return `<button class="opt" data-c="${o}">
            <span class="opt-char">${o}</span>
            <span class="opt-zhuyin">${zy}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="feedback" id="reviewFb"></div>
    </div>
  `;

  // 自動播放整句
  const p=POEMS.find(x=>x.id===q.poemId);
  if(p){
    const fullLine=p.lines[q.li];
    setTimeout(()=>{
      if(state.review===r&&!r.answered){
        speakAsync(lineText(fullLine),{rate:0.68,pitch:1.45});
      }
    },300);
  }

  const playBtn=document.getElementById('reviewPlay');
  playBtn.addEventListener('click',()=>{
    if(!p) return;
    const fullLine=p.lines[q.li];
    playBtn.classList.add('playing');
    speakAsync(lineText(fullLine),{rate:0.68,pitch:1.45}).then(()=>{
      playBtn.classList.remove('playing');
    });
  });

  reviewContent.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      if(r.answered) return;
      const c=btn.dataset.c;
      await speakAsync(c,{rate:0.72,pitch:1.5});
      if(c===q.answer) reviewCorrect(btn,p);
      else reviewWrong(btn,c);
    });
  });
}

function makeReviewLineHTML(q){
  const p=POEMS.find(x=>x.id===q.poemId);
  if(!p) return '';
  const ln=p.lines[q.li];
  return rubyHTML(ln,q.ci);
}

async function reviewCorrect(btn,p){
  const r=state.review;
  if(!r||r.answered) return;
  r.answered=true;r.correct++;
  btn.classList.add('correct');
  reviewContent.querySelectorAll('.opt').forEach(b=>b.disabled=true);

  const fl=reviewContent.querySelector('#reviewFill');
  const q=r.questions[r.qIdx];
  fl.innerHTML=rubyHTML(p.lines[q.li],q.ci,q.answer);
  fl.classList.add('solved');
  addRightChar(q.answer);

  reviewContent.querySelector('#reviewFb').textContent='🎉 太棒了！';
  const fullLine=p.lines[q.li];
  await speakAsync(lineText(fullLine),{rate:0.7,pitch:1.45});

  setTimeout(()=>{
    r.qIdx++;
    renderReviewQuestion();
  },1300);
}

function reviewWrong(btn,ch){
  const r=state.review;
  if(!r||r.answered) return;
  r.answered=true;r.wrong++;
  addWrongChar(ch);
  btn.classList.add('wrong');
  reviewContent.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.dataset.c===r.questions[r.qIdx].answer) b.classList.add('correct');
  });

  const q=r.questions[r.qIdx];
  const p=POEMS.find(x=>x.id===q.poemId);
  const fl=reviewContent.querySelector('#reviewFill');
  fl.innerHTML=rubyHTML(p.lines[q.li],q.ci,q.answer);
  fl.classList.add('solved');

  reviewContent.querySelector('#reviewFb').textContent='💡 記住這個字喔！';
  speakAsync('記住這個字喔',{rate:0.85,pitch:1.4});

  setTimeout(()=>{
    r.qIdx++;
    renderReviewQuestion();
  },1700);
}

function renderReviewSummary(){
  const r=state.review;
  const total=r.questions.length;
  const pct=r.correct/total;
  const perfect=pct===1;

  // 更新複習等級
  const updatedPoems=new Set();
  for(const q of r.questions){
    if(updatedPoems.has(q.poemId)) continue;
    updatedPoems.add(q.poemId);
    const pr=getProg(q.poemId);
    if(typeof pr.reviewLevel!=='number') pr.reviewLevel=0;
    if(perfect){
      pr.reviewLevel=Math.min(4,pr.reviewLevel+1);
    }
    const intervals=[1,3,7,14,30];
    const days=intervals[pr.reviewLevel]||30;
    pr.nextReview=Date.now()+days*24*3600*1000;
    progress[q.poemId]=pr;
  }
  saveProgress();

  reviewBar.style.width='100%';
  reviewLabel.textContent=`完成！${r.correct} / ${total} 題答對`;

  let stars='';
  if(perfect) stars='⭐⭐⭐';
  else if(pct>=0.6) stars='⭐⭐☆';
  else stars='⭐☆☆';

  reviewContent.innerHTML=`
    <div class="review-summary">
      <div class="big-emoji">${perfect?'🏆':'🌱'}</div>
      <h3>${perfect?'全部答對！':'繼續加油！'}</h3>
      <p>你答對了 <b>${r.correct}</b> / ${total} 題</p>
      <div class="stars-earned">${stars}</div>
      <button class="btn primary" id="reviewDone" style="width:100%;">回到目錄 🏠</button>
    </div>
  `;
  speakAsync(perfect?'太厲害了，全部答對！':'不錯喔，繼續練習！',{rate:0.8,pitch:1.5});

  document.getElementById('reviewDone').addEventListener('click',()=>{
    closeReview();
  });
}

document.getElementById('exportBtn').addEventListener('click',()=>{

document.getElementById('importBtn').addEventListener('click',()=>{
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    const list=Array.isArray(data)?data:(data.poems||[]);
    if(!Array.isArray(list)||!list.length) throw new Error('沒有可用的詩');
    let added=0;
    const stamp=Date.now();
    for(const p of list){
      if(!p.title||!Array.isArray(p.lines)||!p.lines.length) continue;
      // 重新產生 ID 避免衝突
      const newPoem={
        id:'import_'+stamp+'_'+(++added),
        title:p.title,
        author:p.author||'',
        art:p.art||'📜',
        sticker:p.sticker||'📜',
        story:p.story||'',
        custom:true,
        lines:p.lines.map(ln=>({
          t:ln.t||'',
          z:ln.z||'',
          p:ln.p||''
        }))
      };
      customPoems.push(newPoem);
    }
    saveCustomPoems();
    rebuildPoems();
    renderParentStats();
    renderPoemStatus();
    toast(`已匯入 ${added} 首詩`);
  }catch(err){
    console.error(err);
    alert('檔案格式錯誤，無法匯入。請確認是從本程式匯出的 JSON 檔。');
  }finally{
    e.target.value='';
  }
});

function closeAddModal(){addModal.classList.remove('show');pendingPoems=null;}
addCancel.addEventListener('click',closeAddModal);
addModal.addEventListener('click',e=>{if(e.target===addModal) closeAddModal();});

addParse.addEventListener('click',()=>{
  const raw=addInput.value.trim();
  if(!raw){toast('請先貼上詩詞內容');return;}
  const {poems,warns}=parsePoemsText(raw);
  if(!poems.length){
    addPreview.innerHTML=`<div class="preview-warn">⚠️ 沒有解析到詩句，請確認格式（第一行寫詩名，每首之間空一行）</div>`;
    confirmRow.style.display='none';return;
  }
  pendingPoems=poems;
  let html=`<div class="preview-title">✅ 解析到 ${poems.length} 首詩</div>`;
  poems.forEach(p=>{
    html+=`<div class="preview-item"><b>${p.title}</b>${p.author?` <span>${p.author}</span>`:''}<span>${p.lines.length} 句</span><br><span style="color:#8a7a6a;font-size:12.5px;">${p.lines.map(l=>l.t+l.p).join(' ')}</span></div>`;
  });
  if(warns.size){
    html+=`<div class="preview-warn">⚠️ <b>請確認以下讀音：</b><br>${[...warns].slice(0,10).join('<br>')}${warns.size>10?'<br>…':''}</div>`;
  } else {
    html+=`<div class="preview-warn" style="background:#f2fff8;border-color:#a8e6c4;color:#2e8a5f;">✅ 全部字都有讀音。多音字（如「看」「過」「望」）建議仍人工核對一次。</div>`;
  }
  addPreview.innerHTML=html;
  confirmRow.style.display='flex';
  addParse.textContent='🔄 重新解析';
});

addConfirm.addEventListener('click',()=>{
  if(!pendingPoems||!pendingPoems.length) return;
  customPoems=customPoems.concat(pendingPoems);
  saveCustomPoems();rebuildPoems();
  const n=pendingPoems.length;
  closeAddModal();
  toast(`🎉 已加入 ${n} 首新詩！`);
  renderHome();
});

/* =========================================================
   十八、初始化
   ========================================================= */
homeBtn.addEventListener('click',()=>{
  if('speechSynthesis' in window) speechSynthesis.cancel();
  state.reading=false;
  if(reviewOverlay.classList.contains('show')){
    if(!confirm('要結束複習並回到目錄嗎？')) return;
    closeReview();
    return;
  }
  renderHome();
});
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  setTimeout(()=>speechSynthesis.getVoices(),300);
}
renderHome();
</script>
