function filterFriendsByEra(era){if(era==='all') return FRIENDS.slice();return FRIENDS.filter(f=>{const a=ALL_POETS[f.a],b=ALL_POETS[f.b];return a&&b&&a.era===era&&b.era===era;});}

function buildFriendQuestions(era,count){
  const pool=filterFriendsByEra(era);if(!pool.length) return [];
  const fmap={};pool.forEach(f=>{if(!fmap[f.a]) fmap[f.a]=[];if(!fmap[f.b]) fmap[f.b]=[];fmap[f.a].push(f.b);fmap[f.b].push(f.a);});
  const poetFriends={};Object.keys(fmap).forEach(k=>{poetFriends[k]=fmap[k];});
  const shuffled=shuffle(pool.slice());const questions=[];const usedPairs=new Set();
  for(const f of shuffled){
    if(questions.length>=count) break;
    const pairKey=[f.a,f.b].sort().join('-');if(usedPairs.has(pairKey)) continue;usedPairs.add(pairKey);
    const useA=Math.random()<0.5;const from=useA?f.a:f.b;const primaryCorrect=useA?f.b:f.a;
    const allFriends=poetFriends[from]||[];
    const validFriends=allFriends.filter(fid=>{const p=ALL_POETS[fid];return p&&(era==='all'||p.era===era);});
    let correctIds=[];
    if(validFriends.length>=2){const fc=shuffle(validFriends.slice());correctIds=fc.slice(0,2);}else{correctIds=[primaryCorrect];}
    const allInEra=Object.keys(ALL_POETS).filter(id=>{const p=ALL_POETS[id];if(!p) return false;if(era!=='all'&&p.era!==era) return false;if(id===from) return false;if(correctIds.includes(id)) return false;return true;});
    if(allInEra.length<2) continue;
    shuffle(allInEra);
    const wrongIds=allInEra.slice(0,2);
    const opts=shuffle([...correctIds,...wrongIds]);
    const notes=correctIds.map(id=>{const fr=pool.find(fr=>(fr.a===from&&fr.b===id)||(fr.b===from&&fr.a===id));return fr?fr.note:`${ALL_POETS[from].name}和${ALL_POETS[id].name}是好朋友。`;});
    questions.push({from,correctIds,wrongIds,opts,notes,era:era==='all'?'全部':era});
  }
  return questions.slice(0,count);
}

function startFriendGame(era,mode){
  const count=mode==='timed'?99:5;const qs=buildFriendQuestions(era,count);
  if(qs.length===0){toast('這個朝代沒有足夠題目\n試試別的朝代吧！');openFriendMenu();return;}
  if(!progress.__friendErasPlayed__) progress.__friendErasPlayed__={};
  if(era!=='all'){progress.__friendErasPlayed__[era]=true;saveProgress();checkAchievements();}
  state.friend={era,mode,questions:qs,qIdx:0,correctQ:0,answered:false,currentQ:null,foundCorrect:[],timeLeft:mode==='timed'?60:0,timerId:null};
  if(mode==='timed'){
    state.friend.timerId=setInterval(()=>{
      if(!state.friend) return;
      state.friend.timeLeft--;updateFriendTimer();
      if(state.friend.timeLeft<=5&&state.friend.timeLeft>0) soundEngine.tick();
      if(state.friend.timeLeft<=0){clearInterval(state.friend.timerId);state.friend.timerId=null;renderFriendSummary();}
    },1000);
  }
  renderFriendQuestion();
}

function updateFriendTimer(){
  const s=state.friend;if(!s||s.mode!=='timed') return;
  const numEl=document.getElementById('friendTimerNum'),fillEl=document.getElementById('friendTimerFill');
  if(!numEl||!fillEl) return;
  const tl=Math.max(0,s.timeLeft);
  numEl.textContent=tl+'s';fillEl.style.width=Math.min(100,(tl/60)*100)+'%';
  if(tl<=10){numEl.classList.add('warn');fillEl.classList.add('warn');}else{numEl.classList.remove('warn');fillEl.classList.remove('warn');}
}

function renderFriendQuestion(){
  const s=state.friend;if(!s) return;
  if(s.qIdx>=s.questions.length){renderFriendSummary();return;}
  s.answered=false;s.foundCorrect=[];
  const q=s.questions[s.qIdx];s.currentQ=q;
  const from=ALL_POETS[q.from];const isMulti=q.correctIds.length>1;
  const totalDisplay=s.mode==='timed'?`答對 ${s.correctQ} 題`:`第 ${s.qIdx+1}/${s.questions.length} 題`;
  friendBar.style.width=s.mode==='normal'?((s.qIdx/s.questions.length)*100)+'%':Math.min(100,(s.timeLeft/60)*100)+'%';
  friendLabel.textContent=totalDisplay;
  const timerHTML=s.mode==='timed'?`<div class="friend-timer-wrap"><div class="friend-timer"><div class="friend-timer-fill" id="friendTimerFill"></div></div><div class="friend-timer-num" id="friendTimerNum">${s.timeLeft}s</div></div>`:'';
  const scoreHTML=s.mode==='timed'?`<div class="friend-score"><div class="score-pill">🎯 ${s.correctQ} 題</div></div>`:'';
  friendContent.innerHTML=`
    ${timerHTML}${scoreHTML}
    <div class="friend-body">
      <div class="friend-question">
        <div class="q-text">${isMulti?`找出${from.name}的<b>所有</b>好朋友`:`誰是${from.name}的好朋友？`}</div>
        ${isMulti?'<div class="q-hint">👆 點出所有好朋友（不只一個）</div>':''}
        <div class="friend-card">
          <div class="f-emoji">${from.emoji}</div>
          <div class="f-name">${escapeHtml(from.name)}</div>
          <div class="f-era">${escapeHtml(from.era)}</div>
        </div>
      </div>
      <div class="friend-options" id="friendOpts">
        ${q.opts.map(id=>{const p=ALL_POETS[id];return `<button class="friend-opt" data-id="${id}"><span class="o-emoji">${p.emoji}</span><span class="o-name">${escapeHtml(p.name)}</span><span class="o-check">✓</span></button>`;}).join('')}
      </div>
      <div class="friend-feedback" id="friendFb"></div>
    </div>
  `;
  if(s.mode==='timed') updateFriendTimer();
  setTimeout(()=>{if(state.friend===s&&!s.answered) speakAsync(isMulti?`找出${from.name}的所有好朋友`:`誰是${from.name}的好朋友？`,{rate:getSpeechRate(),pitch:1.42});},300);
  friendContent.querySelectorAll('.friend-opt').forEach(btn=>{btn.addEventListener('click',()=>handleFriendClick(btn,q,s));});
}

function handleFriendClick(btn,q,s){
  if(s.answered) return;
  const id=btn.dataset.id;const p=ALL_POETS[id];
  if(q.correctIds.includes(id)){
    if(s.foundCorrect.includes(id)) return;
    s.foundCorrect.push(id);
    btn.classList.add('correct');btn.disabled=true;
    soundEngine.correct();vibrate(40);
    if(s.mode==='timed'){s.timeLeft=Math.min(99,s.timeLeft+3);updateFriendTimer();}
    if(s.foundCorrect.length===q.correctIds.length){
      s.answered=true;s.correctQ++;
      const notes=q.notes.join(' ');
      friendContent.querySelector('#friendFb').innerHTML=`<div class="fb-text">🎉 太棒了！</div><div class="fb-note">💡 ${escapeHtml(notes)}</div>`;
      speakAsync(`答對了！${notes}`,{rate:getSpeechRate()*0.95,pitch:1.45});
      setTimeout(()=>{s.qIdx++;renderFriendQuestion();},2400);
    }
  } else {
    s.answered=true;btn.classList.add('wrong');
    soundEngine.wrong();vibrate([30,50,30]);
    if(s.mode==='timed'){s.timeLeft=Math.max(0,s.timeLeft-5);updateFriendTimer();if(s.timeLeft<=0){clearInterval(s.timerId);s.timerId=null;setTimeout(()=>renderFriendSummary(),800);return;}}
    friendContent.querySelectorAll('.friend-opt').forEach(b=>{b.disabled=true;if(q.correctIds.includes(b.dataset.id)) b.classList.add('correct');});
    const correctNames=q.correctIds.map(id=>ALL_POETS[id].name).join('、');
    const from=ALL_POETS[q.from];const notes=q.notes.join(' ');
    friendContent.querySelector('#friendFb').innerHTML=`<div class="fb-text wrong">💡 記住喔～</div><div class="fb-note">${escapeHtml(from.name)}的好朋友是 <b>${escapeHtml(correctNames)}</b>。<br>${escapeHtml(notes)}</div>`;
    speakAsync(`${from.name}的好朋友是${correctNames}`,{rate:getSpeechRate()*0.95,pitch:1.42});
    setTimeout(()=>{s.qIdx++;renderFriendQuestion();},2800);
  }
}

function renderFriendSummary(){
  const s=state.friend;if(!s) return;
  if(s.timerId){clearInterval(s.timerId);s.timerId=null;}
  const isTimed=s.mode==='timed';const total=s.questions.length;

  if(isTimed){const best=progress.__friendBestTimed__||0;if(s.correctQ>best){progress.__friendBestTimed__=s.correctQ;saveProgress();}if(s.correctQ>=5){progress.__friendPerfect__=progress.__friendPerfect__||true;saveProgress();}}
  else if(perfect){progress.__friendPerfect__=true;saveProgress();}
  checkAchievements();

  if(perfect){soundEngine.win();vibrate([100,50,100,50,200]);launchConfetti();}else{soundEngine.correct();vibrate(50);}
  let stars='';if(perfect) stars='⭐⭐⭐';else if(!isTimed&&s.correctQ>=Math.ceil(total*0.6)) stars='⭐⭐☆';else if(isTimed&&s.correctQ>=5) stars='⭐⭐☆';else stars='⭐☆☆';
  const eraName=s.era==='all'?'全部':s.era;const bestTimed=progress.__friendBestTimed__||0;
  friendContent.innerHTML=`

      <p>${isTimed?`答對 <b>${s.correctQ}</b> 題`:`答對 <b>${s.correctQ}</b> / ${total} 題`}</p>
      <p style="font-size:12.5px;color:#a08b7a;">朝代：${eraName} · ${isTimed?'限時':'普通'}</p>
      <div class="stars-earned">${stars}</div>
      ${isTimed?`<div class="best-score">🏆 最高：${bestTimed} 題</div>`:''}
      <div class="btn-row">
        <button class="btn primary" id="friendAgain">再玩一次</button>
        <button class="btn ghost" id="friendDone">回到目錄 🏠</button>
      </div>
      <div class="friend-network-wrap">
        <div class="friend-network-title">👀 大家的關係網</div>

  speakAsync(perfect?'太厲害了，全部答對！':(isTimed?'時間到，繼續練習':'不錯喔！'),{rate:0.8,pitch:1.5});
  setTimeout(()=>drawFriendNetwork(),50);
  document.getElementById('friendAgain').addEventListener('click',()=>{soundEngine.click();openFriendMenu();});
  document.getElementById('friendDone').addEventListener('click',()=>{soundEngine.click();closeFriendGame();});
}

function drawFriendNetwork(){
  const svg=document.getElementById('friendNetSvg');if(!svg) return;
  const poetsInGraph=new Set();FRIENDS.forEach(f=>{poetsInGraph.add(f.a);poetsInGraph.add(f.b);});
  const poetsArr=[...poetsInGraph];const W=600,H=400;const cx=W/2,cy=H/2;const R=Math.min(W,H)*0.38;const n=poetsArr.length;
  const positions={};poetsArr.forEach((id,i)=>{const a=(i/n)*Math.PI*2-Math.PI/2;positions[id]={x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R*0.85,id};});
  const eraColors={'初唐':'#ffd86b','盛唐':'#ff9ec4','中唐':'#a8e6a3','晚唐':'#c6b7ff'};
  let html=`<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  FRIENDS.forEach(f=>{const a=positions[f.a],b=positions[f.b];if(!a||!b) return;html+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ffb8d8" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>`;});
  poetsArr.forEach(id=>{const p=ALL_POETS[id];const pos=positions[id];const color=eraColors[p.era]||'#ffd0e2';const isMain=p.era==='盛唐';const r=isMain?26:22;html+=`<g class="net-node" data-poet="${id}" style="cursor:pointer;"><circle cx="${pos.x}" cy="${pos.y}" r="${r+4}" fill="${color}" opacity=".25"/><circle cx="${pos.x}" cy="${pos.y}" r="${r}" fill="${color}" stroke="#fff" stroke-width="2.5" filter="url(#glow)"/><text x="${pos.x}" y="${pos.y+6}" text-anchor="middle" font-size="${isMain?22:18}">${p.emoji}</text><text x="${pos.x}" y="${pos.y+r+16}" text-anchor="middle" font-size="11" font-weight="800" fill="#5a4632">${p.name}</text></g>`;});
  svg.innerHTML=html;
  svg.querySelectorAll('.net-node').forEach(node=>{node.addEventListener('click',()=>{const id=node.dataset.poet;const p=ALL_POETS[id];if(!p) return;soundEngine.click();const friends=FRIEND_MAP[id]||[];const names=friends.map(fid=>ALL_POETS[fid]?.name).filter(Boolean);const msg=`${p.name}（${p.era}）。${names.length?`好朋友有：${names.join('、')}。`:'沒有記錄好朋友。'}`;speakAsync(msg,{rate:getSpeechRate(),pitch:1.42});toast(`${p.emoji} ${p.name}\n${names.length?'好友：'+names.join('、'):'（沒有好友）'}`);});});
}

function closeFriendGame(){
  const s=state.friend;if(s&&s.timerId){clearInterval(s.timerId);s.timerId=null;}
  friendOverlay.classList.remove('show');state.friend=null;document.body.style.overflow='';
  if('speechSynthesis' in window) speechSynthesis.cancel();
  renderHome();
}

/* 家長中心 */
const parentModal=document.getElementById('parentModal');
function openParentModal(){renderTimeStats();renderParentStats();renderPoemStatus();renderWrongChars();renderFontSeg();renderRateSeg();parentModal.classList.add('show');}
document.getElementById('parentClose').addEventListener('click',()=>parentModal.classList.remove('show'));
parentModal.addEventListener('click',e=>{if(e.target===parentModal) parentModal.classList.remove('show');});
function renderTimeStats(){document.getElementById('timeStats').innerHTML=`<div class="time-box"><div class="num">${fmtTime(getTodayTime())}</div><div class="lbl">今日</div></div><div class="time-box"><div class="num">${fmtTime(getTotalTime())}</div><div class="lbl">累計</div></div>`;}
function renderParentStats(){
  const total=POEMS.length,m=countMastered();let rc=0;
  for(const p of POEMS){const pr=getProg(p.id);if(pr.reviewLevel) rc+=pr.reviewLevel;}
  document.getElementById('parentStats').innerHTML=`<div class="stat-box"><div class="num">${m}</div><div class="lbl">已學完</div></div><div class="stat-box"><div class="num">${total}</div><div class="lbl">總詩數</div></div><div class="stat-box"><div class="num">${rc}</div><div class="lbl">複習星等</div></div>`;
}
function renderPoemStatus(){
  const li=l=>['⭐','⭐⭐','⭐⭐⭐','⭐⭐⭐⭐','⭐⭐⭐⭐⭐'][Math.min(4,l||0)]||'☆☆☆';
  document.getElementById('poemStatusList').innerHTML=POEMS.map(p=>{
    const pr=getProg(p.id);const done=[pr.learn,pr.fill,pr.order].filter(Boolean).length;const mastered=done===3;
    let nr='';if(mastered&&pr.nextReview){const d=Math.ceil((pr.nextReview-Date.now())/86400000);nr=d>0?`${d}天後復習`:'待復習';}
    const sb=p.custom?`<button class="story-edit" data-story-id="${escapeHtml(p.id)}">📝 ${p.story?'改':'加'}故事</button>`:'';
    return `<div class="poem-status"><div class="row1"><div class="title">${p.sticker||'📜'} ${escapeHtml(p.title)}</div><div class="level">${mastered?li(pr.reviewLevel||0):'⋯'}</div></div><div class="row2"><span>讀 ${pr.learn?'✅':'⬜'} · 填 ${pr.fill?'✅':'⬜'} · 排 ${pr.order?'✅':'⬜'} ${nr?' · '+nr:''}</span>${sb}</div></div>`;
  }).join('');
  document.getElementById('poemStatusList').querySelectorAll('.story-edit').forEach(btn=>{btn.addEventListener('click',()=>{const id=btn.dataset.storyId;const p=customPoems.find(x=>x.id===id);if(p) openStoryModal(id,p.story||'');});});
}
function renderWrongChars(){
  const list=getWrongChars().slice(0,15);
  if(!list.length){document.getElementById('wrongChars').innerHTML='<span style="color:#a08b7a;font-size:13px;">沒有錯字記錄</span>';return;}
  document.getElementById('wrongChars').innerHTML=list.map(([ch,n])=>`<div class="wrong-char">${ch} <small>×${n}</small></div>`).join('');
}
function renderFontSeg(){document.querySelectorAll('#fontSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===(settings.font||'medium')));}
document.querySelectorAll('#fontSeg button').forEach(b=>{b.addEventListener('click',()=>{settings.font=b.dataset.v;saveSettings();applyFont();renderFontSeg();});});
function renderRateSeg(){document.querySelectorAll('#rateSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===(settings.speechRate||'normal')));}
document.querySelectorAll('#rateSeg button').forEach(b=>{b.addEventListener('click',()=>{settings.speechRate=b.dataset.v;saveSettings();renderRateSeg();speakAsync('這是新的語速',{rate:getSpeechRate(),pitch:1.42});});});
document.getElementById('exportBtn').addEventListener('click',()=>{
  if(!customPoems.length){toast('沒有自訂詩');return;}
  const data={version:2,poems:customPoems};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='唐詩題庫_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
  toast('已匯出');
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file) return;
  try{
    const text=await file.text();const data=JSON.parse(text);const list=Array.isArray(data)?data:(data.poems||[]);
    if(!Array.isArray(list)||!list.length) throw new Error('沒有詩');
    let added=0;const stamp=Date.now();
    for(const p of list){
      if(!p.title||!Array.isArray(p.lines)||!p.lines.length) continue;
      customPoems.push({id:'import_'+stamp+'_'+(++added),title:p.title,author:p.author||'',art:p.art||'📜',sticker:p.sticker||'📜',story:p.story||'',poetInfo:p.poetInfo||null,words:Array.isArray(p.words)?p.words:[],custom:true,lines:p.lines.map(ln=>({t:ln.t||'',z:ln.z||'',p:ln.p||''}))});
    }
    saveCustomPoems();rebuildPoems();renderParentStats();renderPoemStatus();checkAchievements();
    toast(`已匯入 ${added} 首`);
  }catch(err){alert('格式錯誤');}finally{e.target.value='';}
});
document.getElementById('clearBtn').addEventListener('click',()=>{
  if(!confirm('確定清除所有資料？')) return;
  if(!confirm('真的要清除？')) return;
  localStorage.removeItem(LS_CUSTOM);localStorage.removeItem(LS_PROGRESS);
  customPoems=[];progress={};rebuildPoems();parentModal.classList.remove('show');toast('已清除');renderHome();
});

/* 故事 */
const storyModal=document.getElementById('storyModal');
let storyTargetId=null;
function openStoryModal(id,current){storyTargetId=id;document.getElementById('storyInput').value=current||'';storyModal.classList.add('show');}
function closeStoryModal(){storyModal.classList.remove('show');storyTargetId=null;}
document.getElementById('storyCancel').addEventListener('click',()=>{soundEngine.click();closeStoryModal();});
storyModal.addEventListener('click',e=>{if(e.target===storyModal) closeStoryModal();});
document.getElementById('storySave').addEventListener('click',()=>{
  if(!storyTargetId) return;
  const story=document.getElementById('storyInput').value.trim();
  const idx=customPoems.findIndex(p=>p.id===storyTargetId);if(idx<0){toast('找不到');return;}
  customPoems[idx].story=story;saveCustomPoems();rebuildPoems();
  soundEngine.click();toast(story?'已保存':'已清空');closeStoryModal();
  if(topTitle.textContent!=='唐詩小學堂'){const i=POEMS.findIndex(p=>p.id===storyTargetId);if(i>=0&&state.poemIndex===i) renderPoem();}
  if(parentModal.classList.contains('show')) renderPoemStatus();
});

/* 加入新詩 */
const addModal=document.getElementById('addModal');
let pendingPoems=null;
function openAddModal(){document.getElementById('addInput').value='';document.getElementById('addPreview').innerHTML='';document.getElementById('confirmRow').style.display='none';document.getElementById('addParse').textContent='✨ 解析預覽';pendingPoems=null;addModal.classList.add('show');}
function closeAddModal(){addModal.classList.remove('show');pendingPoems=null;}
document.getElementById('addCancel').addEventListener('click',()=>{soundEngine.click();closeAddModal();});
addModal.addEventListener('click',e=>{if(e.target===addModal) closeAddModal();});
document.getElementById('addParse').addEventListener('click',()=>{
  soundEngine.click();
  const raw=document.getElementById('addInput').value.trim();
  if(!raw){toast('請貼上詩詞');return;}
  const {poems,warns}=parsePoemsText(raw);
  if(!poems.length){document.getElementById('addPreview').innerHTML=`<div class="preview-warn">⚠️ 沒有解析到</div>`;document.getElementById('confirmRow').style.display='none';return;}
  pendingPoems=poems;
  let html=`<div class="preview-title">✅ 解析到 ${poems.length} 首</div>`;
  poems.forEach((p,idx)=>{html+=`<div class="preview-item"><b>${escapeHtml(p.title)}</b>${p.author?` <span>${escapeHtml(p.author)}</span>`:''}<span>${p.lines.length} 句</span><div class="preview-lines">${escapeHtml(p.lines.map(l=>l.t+l.p).join(' '))}</div><textarea class="preview-story" data-idx="${idx}" placeholder="📝 故事（選填）">${escapeHtml(p.story||'')}</textarea></div>`;});
  if(warns.size){html+=`<div class="preview-warn">⚠️ <b>請確認讀音：</b><br>${[...warns].slice(0,10).map(escapeHtml).join('<br>')}</div>`;}
  else{html+=`<div class="preview-warn" style="background:#f2fff8;border-color:#a8e6c4;color:#2e8a5f;">✅ 全部字都有讀音</div>`;}
  document.getElementById('addPreview').innerHTML=html;
  document.getElementById('confirmRow').style.display='flex';
  document.getElementById('addParse').textContent='🔄 重新解析';
});
document.getElementById('addConfirm').addEventListener('click',()=>{
  if(!pendingPoems||!pendingPoems.length) return;
  soundEngine.win();
  document.querySelectorAll('.preview-story').forEach(ta=>{const idx=+ta.dataset.idx;if(pendingPoems[idx]) pendingPoems[idx].story=ta.value.trim();});
  customPoems=customPoems.concat(pendingPoems);saveCustomPoems();rebuildPoems();
  const n=pendingPoems.length;closeAddModal();toast(`已加入 ${n} 首`);checkAchievements();renderHome();
});

/* 初始化 */
document.getElementById('homeBtn').addEventListener('click',()=>{
  soundEngine.click();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  state.reading=false;
  if(reviewOverlay.classList.contains('show')){if(!confirm('要結束複習嗎？')) return;closeReview();return;}
  if(friendOverlay.classList.contains('show')){if(!confirm('要結束挑戰嗎？')) return;closeFriendGame();return;}
  if(readOverlay.classList.contains('show')){if(!confirm('要結束朗讀嗎？')) return;closeReadTest();return;}
  if(writeModal.classList.contains('show')) closeWriteModal();
  renderHome();
});
document.body.addEventListener('click',()=>{trackActivity();soundEngine.init();},{capture:true});
document.body.addEventListener('touchstart',()=>{trackActivity();soundEngine.init();},{capture:true,passive:true});
document.body.addEventListener('keydown',()=>trackActivity(),{capture:true});
startTimeTracker();
if('speechSynthesis' in window){speechSynthesis.getVoices();setTimeout(()=>speechSynthesis.getVoices(),300);}
renderHome();
</script>
