<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>唐詩小學堂 🌸</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"jf open 粉圓","Yuanti TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #fff2cc 0%, transparent 38%),
    radial-gradient(circle at 88% 12%, #ffe0ef 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, #e2f2ff 0%, transparent 55%),
    #fffaf3;
  min-height:100vh;color:#5a4632;padding-bottom:40px;overflow-x:hidden;
}

/* ============ 頂欄 ============ */
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:2px solid #ffe6f0;
}
.topbar h1{flex:1;margin:0;font-size:19px;text-align:center;color:#e26a8d;letter-spacing:2px;font-weight:800;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 3px 0 #f3dfe8;font-size:20px;cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex:0 0 auto;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #f3dfe8;}
#homeBtn{visibility:hidden;}

/* ============ 容器 ============ */
.view{max-width:780px;margin:0 auto;padding:0 0 20px;}

/* ============ 首頁 ============ */
.hero{text-align:center;padding:22px 20px 8px;}
.hero .hero-emoji{font-size:52px;line-height:1;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h2{margin:10px 0 4px;font-size:24px;color:#e26a8d;letter-spacing:1px;}
.hero p{margin:0;color:#a08b7a;font-size:14px;}

.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:18px 16px;}
.chapter{
  border:none;cursor:pointer;text-align:center;background:#fff;border-radius:24px;padding:10px 10px 14px;
  box-shadow:0 6px 0 rgba(232,190,210,.45), 0 12px 22px rgba(200,160,180,.15);
  transition:transform .15s, box-shadow .15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;position:relative;
}
.chapter:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(232,190,210,.45);}
.ch-art{width:100%;border-radius:16px;overflow:hidden;line-height:0;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.ch-art svg{width:100%;height:auto;display:block;}
.ch-num{font-size:11px;color:#b9a696;letter-spacing:1px;margin-top:6px;}
.ch-title{font-size:19px;font-weight:800;color:#5a4632;letter-spacing:2px;}
.ch-author{font-size:12px;color:#a89684;}
.ch-stars{font-size:12px;letter-spacing:1px;}

/* 自訂詩卡片 */
.chapter.custom{border:2px dashed #ffd0e2;box-shadow:0 6px 0 rgba(255,200,225,.35);}
.ch-badge{
  position:absolute;top:8px;right:8px;background:#fff0f6;color:#e26a8d;
  font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;letter-spacing:.5px;
}

/* 加詩按鈕卡片 */
.add-chapter{
  border:3px dashed #ffd0e2 !important;
  background:linear-gradient(135deg,#fffdfe,#fff5fa) !important;
  box-shadow:none !important;justify-content:center;min-height:170px;
}
.add-chapter:active{transform:translateY(4px);}
.add-icon{font-size:44px;color:#ff9ec4;line-height:1;margin-bottom:6px;}
.add-chapter .ch-title{color:#e26a8d;font-size:17px;}
.add-chapter .ch-author{color:#c9a8b8;}

/* Emoji 配圖 */
.art-emoji{
  display:grid;place-items:center;min-height:86px;font-size:52px;
  background:linear-gradient(135deg,#fff6fb,#ffeaf3);
}

/* ============ 詩頁 ============ */
.poem-view{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.poem-tools{
  display:flex;align-items:center;gap:8px;padding:12px 16px 0;
}
.custom-badge{
  background:#fff0f6;color:#e26a8d;font-size:12px;font-weight:800;
  border-radius:12px;padding:5px 12px;letter-spacing:1px;
}
.del-btn{
  margin-left:auto;border:none;background:#fff0f0;color:#e06060;
  border-radius:12px;padding:6px 14px;font-size:13px;font-weight:800;
  font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffd6d6;transition:.15s;
}
.del-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ffd6d6;}

.poem-card{
  margin:14px 16px;border-radius:26px;overflow:hidden;background:#fff;
  box-shadow:0 8px 0 rgba(232,190,210,.35), 0 14px 26px rgba(200,160,180,.16);
  display:flex;align-items:center;gap:0;
}
.poem-art{width:46%;line-height:0;flex:0 0 auto;}
.poem-art svg{width:100%;height:auto;display:block;}
.poem-meta{padding:12px 16px;flex:1;}
.poem-meta h2{margin:0 0 6px;font-size:26px;letter-spacing:4px;color:#e26a8d;}
.poem-meta p{margin:0;font-size:14px;color:#a08b7a;letter-spacing:2px;}

.steps{display:flex;gap:8px;padding:0 16px;margin-bottom:14px;}
.step{
  flex:1;border:none;border-radius:18px;padding:11px 2px;background:#fff;color:#b3a091;
  font-size:13.5px;font-weight:800;box-shadow:0 3px 0 #f0e2d8;cursor:pointer;transition:.15s;
  font-family:inherit;letter-spacing:.5px;
}
.step.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 3px 0 #e09a2a;transform:translateY(-1px);}
.step:active{transform:translateY(2px);box-shadow:0 1px 0 #f0e2d8;}

.stage{padding:0 16px 30px;}

/* ============ 讀一讀 ============ */
.lines{display:flex;flex-direction:column;gap:11px;}
.line{
  display:block;width:100%;border:3px solid #ffe6f0;background:#fff;border-radius:20px;
  padding:12px 8px 14px;font-size:clamp(19px,5.4vw,29px);cursor:pointer;transition:.15s;
  font-family:inherit;color:#4a3b2a;box-shadow:0 4px 0 rgba(255,190,215,.5);line-height:1.15;
}
.line.active{border-color:#ffb347;background:#fffbf0;transform:scale(1.015);box-shadow:0 4px 0 rgba(255,180,70,.55);}
.line:active{transform:scale(.99);}

ruby{ruby-position:over;padding:0 1.5px;}
rt{font-size:.42em;color:#ea85a4;letter-spacing:0;font-weight:700;line-height:1.05;font-family:inherit;}
.punct{color:#c9b8aa;margin-left:1px;}

.blank{
  display:inline-block;min-width:.9em;border-bottom:4px solid #ff8fab;color:#ff8fab;
  animation:blink .9s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.fill-line.solved .blank{border-bottom-color:#4fc98b;color:#4fc98b;animation:none;}

/* ============ 按鈕 ============ */
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{
  flex:1;min-width:130px;border:none;border-radius:20px;padding:14px 16px;
  font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:1px;
}
.btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 5px 0 #3d8fd0;}
.btn.next{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a;}
.btn:active{transform:translateY(3px);box-shadow:none;}

/* ============ 填空遊戲 ============ */
.game-title{text-align:center;font-size:16px;font-weight:800;color:#e26a8d;letter-spacing:1px;margin:4px 0 16px;}
.fill-line{
  background:#fff;border:3px dashed #ffd0e2;border-radius:22px;padding:18px 10px;text-align:center;
  font-size:clamp(24px,7vw,36px);letter-spacing:6px;margin-bottom:20px;transition:.25s;
}
.fill-line.solved{border-style:solid;border-color:#a8e6c4;background:#f2fff8;}

.options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.opt{
  width:82px;height:82px;border-radius:24px;border:4px solid #ffe0ec;background:#fff;
  font-size:36px;font-weight:800;color:#5a4632;cursor:pointer;transition:.15s;font-family:inherit;
  box-shadow:0 6px 0 rgba(255,190,215,.55);display:grid;place-items:center;
}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(255,190,215,.55);}
.opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;color:#137a4c;animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;color:#e06060;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.opt:disabled{cursor:default;}

.feedback{text-align:center;font-size:18px;font-weight:800;color:#4fc98b;min-height:30px;margin-top:18px;letter-spacing:1px;}

/* ============ 排排看 ============ */
.slots{display:flex;flex-direction:column;gap:9px;margin-bottom:18px;}
.slot{
  min-height:52px;border:3px dashed #d8e8ff;border-radius:18px;background:#fbfdff;
  display:flex;align-items:center;padding:8px 14px;font-size:19px;letter-spacing:3px;
  color:#4a3b2a;transition:.2s;
}
.slot.filled{
  border-style:solid;border-color:#a8d4ff;background:#fff;
  box-shadow:0 4px 0 rgba(160,200,255,.4);animation:pop .3s ease;
}
.slot .num{color:#b9cbe0;font-weight:800;font-size:15px;}

.pool{display:flex;flex-direction:column;gap:9px;}
.chip{
  border:3px solid #ffe6f0;background:#fff;border-radius:18px;padding:12px 14px;
  font-size:19px;letter-spacing:3px;color:#4a3b2a;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 0 rgba(255,190,215,.5);transition:.15s;text-align:left;
}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(255,190,215,.5);}
.chip.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;}

/* ============ 慶祝 ============ */
.celebrate{
  position:fixed;inset:0;z-index:100;background:rgba(60,40,60,.45);
  backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:fadeIn .3s ease;
}
.celebration-box{
  background:#fff;border-radius:30px;padding:30px 26px;text-align:center;
  max-width:320px;width:100%;box-shadow:0 20px 50px rgba(120,80,110,.3);
  animation:pop .45s cubic-bezier(.2,1.4,.5,1);
}
.celebration-box .big{font-size:64px;animation:float 1.4s ease-in-out infinite;}
.celebration-box h3{margin:6px 0;font-size:24px;color:#e26a8d;letter-spacing:2px;}
.celebration-box p{margin:0 0 20px;color:#a08b7a;font-size:15px;letter-spacing:1px;}

.confetti{position:fixed;top:-20px;font-size:20px;z-index:99;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2;}}

/* ============ 彈窗 ============ */
.modal{
  position:fixed;inset:0;z-index:150;background:rgba(60,40,60,.5);
  backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;
  padding:16px;
}
.modal.show{display:flex;animation:fadeIn .25s ease;}
.modal-box{
  background:#fff;border-radius:26px;padding:20px;width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(120,80,110,.35);
  animation:pop .35s cubic-bezier(.2,1.3,.5,1);
}
.modal-box h3{margin:0 0 4px;font-size:19px;color:#e26a8d;letter-spacing:2px;text-align:center;}
.modal-tip{font-size:12.5px;color:#a08b7a;text-align:center;margin:0 0 12px;line-height:1.7;}
.modal-tip b{color:#e26a8d;}

.add-input{
  width:100%;min-height:180px;border:3px solid #ffe6f0;border-radius:16px;padding:12px;
  font-size:15.5px;line-height:1.85;resize:vertical;font-family:inherit;color:#4a3b2a;
  outline:none;background:#fffdfe;
}
.add-input:focus{border-color:#ffc9dd;}

.add-preview{margin-top:12px;}
.preview-title{font-size:14px;font-weight:800;color:#4fc98b;margin-bottom:8px;letter-spacing:1px;}
.preview-item{
  background:#f7fffb;border:2px solid #d6f5e6;border-radius:14px;padding:10px 12px;
  margin-bottom:7px;font-size:13.5px;line-height:1.6;
}
.preview-item b{color:#e26a8d;font-size:15px;letter-spacing:1px;}
.preview-item span{color:#a08b7a;font-size:12px;margin-left:6px;}
.preview-warn{
  background:#fff8e6;border:2px solid #ffe6a8;border-radius:12px;padding:9px 12px;
  font-size:12.5px;color:#9a7a1a;margin-bottom:7px;line-height:1.7;
}
.preview-warn b{color:#c98a00;}

.modal-actions{display:flex;gap:10px;margin-top:14px;}
.m-btn{
  flex:1;border:none;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:1px;
}
.m-btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 4px 0 #3d8fd0;}
.m-btn.ghost{background:#f4f0f2;color:#a08b7a;box-shadow:0 4px 0 #e6dfe3;}
.m-btn:active{transform:translateY(2px);box-shadow:none;}
.m-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #d8d0d4;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
  background:rgba(90,70,50,.94);color:#fff;padding:12px 22px;border-radius:20px;
  font-size:14px;font-weight:700;letter-spacing:1px;z-index:200;
  opacity:0;transition:.3s;pointer-events:none;white-space:pre-line;text-align:center;
  max-width:80vw;line-height:1.6;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media(max-width:380px){
  .poem-meta h2{font-size:22px;}
  .opt{width:70px;height:70px;font-size:30px;}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="homeBtn" aria-label="回首頁">🏠</button>
  <h1 id="topTitle">唐詩小學堂</h1>
  <button class="icon-btn" id="soundToggle" aria-label="音效開關">🔊</button>
</header>

<main class="view" id="view"></main>

<!-- 加詩彈窗 -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <h3>➕ 加入新唐詩</h3>
    <p class="modal-tip">貼上詩詞，<b>每首之間空一行</b>。第一行寫詩名，可加作者。</p>
    <textarea class="add-input" id="addInput" placeholder="靜夜思 李白
床前明月光，疑是地上霜。
舉頭望明月，低頭思故鄉。

江雪
柳宗元
千山鳥飛絕，萬徑人蹤滅。
孤舟蓑笠翁，獨釣寒江雪。"></textarea>
    <div class="add-preview" id="addPreview"></div>
    <div class="modal-actions">
      <button class="m-btn ghost" id="addCancel">取消</button>
      <button class="m-btn primary" id="addParse">✨ 解析預覽</button>
    </div>
    <div class="modal-actions" id="confirmRow" style="display:none;margin-top:10px;">
      <button class="m-btn primary" id="addConfirm" style="flex:1;">✅ 確認加入題庫</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js"></script>
<script>
/* =========================================================
   一、注音引擎（拼音 → 注音）
   ========================================================= */
const SM = {
  b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',
  g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',
  zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'
};
const YM = {
  a:'ㄚ',o:'ㄛ',e:'ㄜ',
  ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',
  an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
  i:'ㄧ',ia:'ㄧㄚ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',
  ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
  u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',
  uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',ong:'ㄨㄥ',
  v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'
};
const FULL = {
  zhi:'ㄓ',chi:'ㄔ',shi:'ㄕ',ri:'ㄖ',zi:'ㄗ',ci:'ㄘ',si:'ㄙ',
  yi:'ㄧ',ya:'ㄧㄚ',ye:'ㄧㄝ',yao:'ㄧㄠ',you:'ㄧㄡ',yan:'ㄧㄢ',
  yin:'ㄧㄣ',yang:'ㄧㄤ',ying:'ㄧㄥ',yong:'ㄩㄥ',
  yu:'ㄩ',yue:'ㄩㄝ',yuan:'ㄩㄢ',yun:'ㄩㄣ',
  wu:'ㄨ',wa:'ㄨㄚ',wo:'ㄨㄛ',wai:'ㄨㄞ',wei:'ㄨㄟ',wan:'ㄨㄢ',
  wen:'ㄨㄣ',wang:'ㄨㄤ',weng:'ㄨㄥ',
  er:'ㄦ',a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',
  an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ'
};
const TONE = {'1':'','2':'ˊ','3':'ˇ','4':'ˋ','5':'˙','0':'˙'};

function toZhuyin(syllable){
  if(!syllable) return '';
  const m = String(syllable).toLowerCase().match(/^([a-züêv]+)([0-5])?$/);
  if(!m) return '';
  let s = m[1].replace(/ü/g,'v');
  const tone = m[2] || '5';

  if(FULL[s]) return FULL[s] + (TONE[tone] || '');

  let sm = '', ym = s;
  if(s.startsWith('zh') || s.startsWith('ch') || s.startsWith('sh')){
    sm = s.slice(0,2); ym = s.slice(2);
  } else if('bpmfdtnlgkhjqxrzcs'.includes(s[0])){
    sm = s[0]; ym = s.slice(1);
  }

  if(sm === 'j' || sm === 'q' || sm === 'x'){
    if(ym === 'u') ym = 'v';
    else if(ym === 'ue') ym = 've';
    else if(ym === 'uan') ym = 'van';
    else if(ym === 'un') ym = 'vn';
  }

  const a = SM[sm] || '';
  const b = YM[ym] || '';
  if(!a && !b) return '';
  return a + b + (TONE[tone] || '');
}

function zhuyinOf(text, warnSet, title){
  if(!text) return '';
  if(typeof pinyinPro === 'undefined'){
    warnSet.add('注音引擎未載入（請檢查網路）');
    return '';
  }
  const out = [];
  for(const ch of [...text]){
    if(!/[\u3400-\u4dbf\u4e00-\u9fff]/.test(ch)) continue;
    let py = '';
    try{
      py = pinyinPro.pinyin(ch, { toneType:'num', v:true, type:'array' })[0] || '';
    }catch(e){ py = ''; }
    const z = toZhuyin(py);
    if(!z) warnSet.add(`「${ch}」查不到讀音（出自《${title || '未命名'}》）`);
    out.push(z || '？');
  }
  return out.join(' ');
}

/* =========================================================
   二、文字 → 詩物件 解析器
   ========================================================= */
const hasPunct = s => /[，。！？、；：,.!?;:]/.test(s);

function parseBlock(lines){
  let title = '', author = '', start = 0;

  if(lines.length){
    const first = lines[0];
    if(!hasPunct(first) && first.length <= 16){
      const parts = first.split(/[\s　｜|·・]+/).filter(Boolean);
      if(parts.length >= 2){
        title  = parts[0];
        author = parts.slice(1).join('');
      } else {
        title = first;
      }
      start = 1;

      if(!author && lines[1]){
        let cand = lines[1].replace(/[〔\[（(【〕\]）)】]/g,'').trim();
        cand = cand.replace(/^(唐|宋|元|明|清|近代|現代|當代)[\s·・]?/,'').replace(/^[·・]/,'').trim();
        if(cand && cand.length <= 4 && !hasPunct(cand)){
          author = cand;
          start = 2;
        }
      }
    }
  }
  return { title, author, body: lines.slice(start).join('') };
}

function splitSentences(body){
  const clean = body.replace(/\s/g,'');
  let out = [];
  const re = /[^，。！？；：,.!?;:]+[，。！？；：,.!?;:]*/g;
  let m;
  while((m = re.exec(clean))){
    const s = m[0].trim();
    if(s) out.push(s);
  }
  if(out.length === 1 && out[0].replace(/[，。！？；：,.!?;:]/g,'').length >= 10){
    const raw = out[0].replace(/[，。！？；：,.!?;:]/g,'');
    for(const len of [5,7]){
      if(raw.length % len === 0 && raw.length >= len*2){
        const parts = [];
        for(let i=0;i<raw.length;i+=len) parts.push(raw.slice(i,i+len));
        out = parts.map((p,idx)=> p + (idx % 2 === 0 ? '，' : '。'));
        break;
      }
    }
  }
  return out;
}

function splitTextPunct(s){
  const m = s.match(/^([\s\S]*?)([，。！？；：,.!?;:…—]*)$/);
  return { t: (m[1]||'').trim(), p: m[2] || '' };
}

/* 回傳 {poems, warns}，不寫入任何狀態 */
function parsePoemsText(raw){
  const blocks = raw.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  const warns = new Set();
  const poems = [];
  const stamp = Date.now();

  blocks.forEach((block, bi) => {
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return;

    const { title, author, body } = parseBlock(lines);
    const sents = splitSentences(body);
    if(!sents.length) return;

    const poemLines = [];
    sents.forEach(s => {
      const { t, p } = splitTextPunct(s);
      if(!t) return;
      const z = zhuyinOf(t, warns, title || `第${bi+1}首`);
      poemLines.push({ t, z, p });
    });
    if(!poemLines.length) return;

    poems.push({
      id: 'custom_' + stamp + '_' + (bi + 1),
      title: title || ('未命名' + (bi + 1)),
      author: author || '',
      art: '📜',
      custom: true,
      lines: poemLines
    });
  });

  return { poems, warns };
}

const LS_KEY = 'ts_custom_poems';

function loadCustomPoems(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return [];
    return arr.filter(p =>
      p && typeof p === 'object' && p.id && p.title &&
      Array.isArray(p.lines) && p.lines.length
    ).map(p => ({
      id: p.id,
      title: p.title,
      author: p.author || '',
      art: p.art || '📜',
      custom: true,
      lines: p.lines.map(ln => ({
        t: ln.t || '',
        z: ln.z || '',
        p: ln.p || ''
      }))
    }));
  }catch(e){
    console.warn('讀取自訂詩失敗', e);
    return [];
  }
}

function saveCustomPoems(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(customPoems)); }catch(e){}
}

/* =========================================================

   ========================================================= */
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return null;
  const tw = vs.filter(v => /zh[-_]TW|zh[-_]Hant/i.test(v.lang || ''));
  const zh = vs.filter(v => /^zh/i.test(v.lang || ''));
  const female = tw.find(v => /Mei|Xiao|Yu|Han|女|Female/i.test(v.name || ''));
  return female || tw[0] || zh[0] || null;
}
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged', () => { pickVoice(); });
}

function speakAsync(text, {rate=0.82, pitch=1.42} = {}){
  return new Promise(resolve => {
    if(!state.soundOn || !('speechSynthesis' in window)){ resolve(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    u.rate = rate; u.pitch = pitch; u.volume = 1;
    const v = pickVoice();
    if(v) u.voice = v;
    let done = false;
    const finish = () => { if(!done){ done = true; resolve(); } };
    u.onend = finish; u.onerror = finish;
    setTimeout(finish, 9000);
    try{ speechSynthesis.speak(u); }catch(e){ finish(); }
  });
}
function speak(text){ speakAsync(text); }

soundBtn.addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  soundBtn.textContent = state.soundOn ? '🔊' : '🔇';

});

   ========================================================= */
function rubyHTML(ln, blankIdx = -1, reveal = null){
  const chars = ln.t.split('');
  const zs = ln.z.split(' ');
  let html = chars.map((c, i) => {
    if(i === blankIdx && !reveal) return `<span class="blank">？</span>`;
    const ch = (i === blankIdx && reveal) ? reveal : c;
    return `<ruby>${ch}<rt>${zs[i] || ''}</rt></ruby>`;
  }).join('');
  if(ln.p) html += `<span class="punct">${ln.p}</span>`;
  return html;
}

    <div class="lines">
      ${p.lines.map((ln, i) => `
        <button class="line" data-i="${i}">${rubyHTML(ln)}</button>
      `).join('')}
    </div>
    <div class="actions">
      <button class="btn primary" id="readAll">🔊 朗讀全詩</button>
      <button class="btn next" id="nextBtn">下一關 →</button>
    </div>
  `;

  stage.querySelectorAll('.line').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      highlightLine(stage, i);
      speak(lineText(p.lines[i]));
    });
  });

  stage.querySelector('#readAll').addEventListener('click', () => readWhole(stage));

  stage.querySelector('#nextBtn').addEventListener('click', () => {
    markDone(p.id, 'learn');
    state.step = 'fill';
    renderPoem();
  });
}

function highlightLine(stage, idx){
  stage.querySelectorAll('.line').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}

async function readWhole(stage){
  if(state.reading) return;
  const p = POEMS[state.poemIndex];
  state.reading = true;
  for(let i = 0; i < p.lines.length; i++){
    if(state.step !== 'learn') break;
    highlightLine(stage, i);
    await speakAsync(lineText(p.lines[i]), {rate:0.7, pitch:1.45});
    await sleep(280);
  }
  highlightLine(stage, -1);
  state.reading = false;
}

/* =========================================================
   十一、關卡二：填一填
   ========================================================= */
function newFillRound(li){
  const p = POEMS[state.poemIndex];
  const ln = p.lines[li];
  const chars = ln.t.split('');
  const ci = Math.floor(Math.random() * chars.length);
  const answer = chars[ci];

  const allChars = [...new Set(p.lines.map(l => l.t).join('').split(''))]
                     .filter(c => c !== answer);
  shuffle(allChars);
  const opts = shuffle([answer, ...allChars.slice(0, 2)]);

  return {li, ci, answer, opts, solved:false};
}

function renderFill(stage){
  const p = POEMS[state.poemIndex];

  if(!state.fillQueue){
    state.fillQueue = shuffle([...p.lines.keys()]).slice(0, 3);
    state.fillIdx = 0;
    state.fill = null;
  }

  if(state.fillIdx >= state.fillQueue.length){
    markDone(p.id, 'fill');
    state.fillQueue = null;
    state.step = 'order';
    renderPoem();
    return;
  }

  if(!state.fill){
    state.fill = newFillRound(state.fillQueue[state.fillIdx]);
  }

  const f = state.fill;
  const ln = p.lines[f.li];

  stage.innerHTML = `
    <div class="game-title">✦ 這一句少了哪一個字呢？ ✦</div>
    <div class="fill-line" id="fillLine">${rubyHTML(ln, f.ci)}</div>
    <div class="options" id="opts">
      ${f.opts.map(o => `<button class="opt" data-c="${o}">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
  `;

  stage.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => onPickOption(btn, stage));
  });
}

function onPickOption(btn, stage){
  const p = POEMS[state.poemIndex];
  const f = state.fill;
  if(!f || f.solved) return;

  if(btn.dataset.c === f.answer){
    f.solved = true;
    btn.classList.add('correct');
    stage.querySelectorAll('.opt').forEach(b => b.disabled = true);

    const fl = stage.querySelector('#fillLine');
    fl.innerHTML = rubyHTML(p.lines[f.li], f.ci, f.answer);
    fl.classList.add('solved');

    stage.querySelector('#fb').textContent = '🎉 答對了！你好棒！';
    speak(lineText(p.lines[f.li]));

    setTimeout(() => {
      state.fillIdx++;
      state.fill = null;
      renderStage();
    }, 1700);
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    setTimeout(() => btn.classList.remove('wrong'), 500);
    speak('再想想看');
  }
}

/* =========================================================
   十二、關卡三：排排看
   ========================================================= */
function renderOrder(stage){
  const p = POEMS[state.poemIndex];

  if(!state.order){
    state.order = {
      pool: shuffle([...p.lines.keys()]),
      placed: []
    };
  }
  drawOrder(stage, p, state.order);
}

function drawOrder(stage, p, o){
  const finished = o.placed.length === p.lines.length;

  stage.innerHTML = `
    <div class="game-title">✦ 把詩句排成正確的順序吧 ✦</div>
    <div class="slots">
      ${p.lines.map((_, i) => {
        const li = o.placed[i];
        return `<div class="slot ${li !== undefined ? 'filled' : ''}">
          ${li !== undefined ? linePlain(p.lines[li]) : `<span class="num">第 ${i + 1} 句</span>`}
        </div>`;
      }).join('')}
    </div>
    <div class="pool">
      ${o.pool.map(li => `
        <button class="chip" data-li="${li}">${linePlain(p.lines[li])}</button>
      `).join('')}
    </div>
    <div class="feedback" id="fb">${finished ? '🎉 全部完成！' : ''}</div>
  `;

  stage.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const li = +btn.dataset.li;
      const nextIdx = o.placed.length;

      if(li === nextIdx){
        o.placed.push(li);
        o.pool = o.pool.filter(x => x !== li);
        speak(lineText(p.lines[li]));
        drawOrder(stage, p, o);

        if(o.placed.length === p.lines.length){
          markDone(p.id, 'order');
          setTimeout(() => {
            launchConfetti();
            showCelebration(p);
          }, 700);
        }
      } else {
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 500);
        speak('再試一次');
      }
    });
  });
}

/* =========================================================
   十三、慶祝
   ========================================================= */
function launchConfetti(){
  const emojis = ['🌸','⭐','🎉','💖','✨','🌟','🍡','🎈'];
  for(let i = 0; i < 26; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    el.style.animationDelay = (Math.random() * 0.7) + 's';
    el.style.fontSize = (16 + Math.random() * 16) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

function showCelebration(p){
  const wrap = document.createElement('div');
  wrap.className = 'celebrate';
  wrap.innerHTML = `
    <div class="celebration-box">
      <div class="big">🎉</div>
      <h3>太棒了！</h3>
      <p>你學會了《${p.title}》</p>
      <button class="btn primary" id="backHome">回到目錄 🏠</button>
    </div>
  `;
  document.body.appendChild(wrap);
  speak('太棒了，你學會了' + p.title);

  wrap.querySelector('#backHome').addEventListener('click', () => {
    wrap.remove();
    renderHome();
  });
}

/* =========================================================
   十四、加詩彈窗
   ========================================================= */
const addModal    = document.getElementById('addModal');
const addInput    = document.getElementById('addInput');
const addPreview  = document.getElementById('addPreview');
const addParse    = document.getElementById('addParse');
const addConfirm  = document.getElementById('addConfirm');
const addCancel   = document.getElementById('addCancel');
const confirmRow  = document.getElementById('confirmRow');

let pendingPoems = null;

function openAddModal(){
  addInput.value = '';
  addPreview.innerHTML = '';
  confirmRow.style.display = 'none';
  addParse.textContent = '✨ 解析預覽';
  pendingPoems = null;
  addModal.classList.add('show');
  setTimeout(()=> addInput.focus(), 150);
}

function closeAddModal(){
  addModal.classList.remove('show');
  pendingPoems = null;
}

addCancel.addEventListener('click', closeAddModal);
addModal.addEventListener('click', (e) => {
  if(e.target === addModal) closeAddModal();
});

addParse.addEventListener('click', () => {
  const raw = addInput.value.trim();
  if(!raw){
    toast('請先貼上詩詞內容');
    return;
  }

  const { poems, warns } = parsePoemsText(raw);

  if(!poems.length){
    addPreview.innerHTML = `<div class="preview-warn">⚠️ 沒有解析到詩句，請確認格式（第一行寫詩名，每首之間空一行）</div>`;
    confirmRow.style.display = 'none';
    return;
  }

  pendingPoems = poems;

  let html = `<div class="preview-title">✅ 解析到 ${poems.length} 首詩</div>`;
  poems.forEach(p => {
    html += `<div class="preview-item">
      <b>${p.title}</b>${p.author ? ` <span>${p.author}</span>` : ''}
      <span>${p.lines.length} 句</span><br>
      <span style="color:#8a7a6a;font-size:12.5px;">${p.lines.map(l => l.t + l.p).join(' ')}</span>
    </div>`;
  });

  if(warns.size){
    html += `<div class="preview-warn">
      ⚠️ <b>請確認以下讀音：</b><br>${[...warns].slice(0,10).join('<br>')}
      ${warns.size > 10 ? '<br>…' : ''}
    </div>`;
  } else {
    html += `<div class="preview-warn" style="background:#f2fff8;border-color:#a8e6c4;color:#2e8a5f;">
      ✅ 全部字都有讀音。多音字（如「看」「過」「望」）建議仍人工核對一次。
    </div>`;
  }

  addPreview.innerHTML = html;
  confirmRow.style.display = 'flex';
  addParse.textContent = '🔄 重新解析';
});

addConfirm.addEventListener('click', () => {
  if(!pendingPoems || !pendingPoems.length) return;

  customPoems = customPoems.concat(pendingPoems);
  saveCustomPoems();
  rebuildPoems();

  const n = pendingPoems.length;
  closeAddModal();
  toast(`🎉 已加入 ${n} 首新詩！`);
  renderHome();
});

/* =========================================================
   十五、初始化
   ========================================================= */
homeBtn.addEventListener('click', () => {
  if('speechSynthesis' in window) speechSynthesis.cancel();
  state.reading = false;
  renderHome();
});

if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  setTimeout(() => speechSynthesis.getVoices(), 300);
}

renderHome();
</script>
