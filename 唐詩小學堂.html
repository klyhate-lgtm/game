<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>唐詩小學堂 🌸</title>
<style>
:root{--fs:1}
html[data-font=small]{--fs:.9}html[data-font=large]{--fs:1.14}html[data-font=xlarge]{--fs:1.28}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"jf open 粉圓","Yuanti TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 12% 8%,#fff2cc 0,transparent 38%),radial-gradient(circle at 88% 12%,#ffe0ef 0,transparent 40%),radial-gradient(circle at 50% 100%,#e2f2ff 0,transparent 55%),#fffaf3;min-height:100vh;color:#5a4632;padding-bottom:40px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid #ffe6f0}
.topbar h1{flex:1;margin:0;font-size:19px;text-align:center;color:#e26a8d;letter-spacing:2px;font-weight:800}
.icon-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 #f3dfe8;font-size:21px;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:0 0 auto}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #f3dfe8}
#homeBtn{visibility:hidden}
.view{max-width:780px;margin:0 auto;padding:0 0 20px}
.hero{text-align:center;padding:20px 20px 6px}
.hero .hero-emoji{font-size:52px;line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h2{margin:10px 0 4px;font-size:24px;color:#e26a8d;letter-spacing:1px}
.hero p{margin:0;color:#a08b7a;font-size:14px}
.streak-bar{display:flex;justify-content:center;margin:10px 20px 0}
.streak-pill{background:linear-gradient(135deg,#ffe8f0,#ffd6e6);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:800;color:#e26a8d;box-shadow:0 3px 0 #ffc9dd;display:flex;align-items:center;gap:6px}
.streak-pill .num{font-size:16px;color:#d94a75}
.quick-row,.quick-row-2,.quick-row-3{display:flex;gap:10px;padding:12px 14px 4px}
.quick-row-2,.quick-row-3{padding-top:6px}
.quick-card{flex:1;border:none;border-radius:20px;padding:12px 10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;transition:.15s}
.quick-card:active{transform:translateY(3px)}
.q-review{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a}
.q-sticker{background:linear-gradient(135deg,#c6b7ff,#a18aff);color:#fff;box-shadow:0 5px 0 #7d63e0}
.q-achievement{background:linear-gradient(135deg,#b8f0e0,#5ed4b5);color:#fff;box-shadow:0 5px 0 #3aab8e}
.q-award{background:linear-gradient(135deg,#ffb8d8,#ff8ab8);color:#fff;box-shadow:0 5px 0 #e0629a}
.q-poetmap{background:linear-gradient(135deg,#ffd4a8,#ffb070);color:#fff;box-shadow:0 5px 0 #e08948}
.q-friend{background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;box-shadow:0 5px 0 #d94a75}
.q-read{background:linear-gradient(135deg,#a8e6ff,#5eb8f0);color:#fff;box-shadow:0 5px 0 #3d8fd0}
.q-chain{background:linear-gradient(135deg,#c8e8a8,#8fce5e);color:#fff;box-shadow:0 5px 0 #5fa834}
.q-daily{background:linear-gradient(135deg,#ffd4e8,#ff9ec4);color:#fff;box-shadow:0 5px 0 #e26a8d}
.q-family{background:linear-gradient(135deg,#d4c6ff,#a08ae8);color:#fff;box-shadow:0 5px 0 #7d63c8}
.q-icon{font-size:32px;line-height:1;flex:0 0 auto}
.q-text{flex:1;text-align:left}
.q-text b{display:block;font-size:15.5px;letter-spacing:1px}
.q-text small{display:block;font-size:11px;opacity:.85;margin-top:2px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:14px 16px}
.chapter{border:none;cursor:pointer;text-align:center;background:#fff;border-radius:24px;padding:10px 10px 14px;box-shadow:0 6px 0 rgba(232,190,210,.45),0 12px 22px rgba(200,160,180,.15);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;position:relative}
.chapter:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(232,190,210,.45)}
.ch-art{width:100%;border-radius:16px;overflow:hidden;line-height:0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ch-art svg{width:100%;height:auto;display:block}
.ch-num{font-size:11px;color:#b9a696;letter-spacing:1px;margin-top:6px}
.ch-title{font-size:19px;font-weight:800;color:#5a4632;letter-spacing:2px}
.ch-author{font-size:12px;color:#a89684}
.ch-stars{font-size:12px;letter-spacing:1px}
.chapter.custom{border:2px dashed #ffd0e2}
.ch-badge{position:absolute;top:8px;right:8px;background:#fff0f6;color:#e26a8d;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px}
.add-chapter{border:3px dashed #ffd0e2!important;background:linear-gradient(135deg,#fffdfe,#fff5fa)!important;box-shadow:none!important;justify-content:center;min-height:170px}
.add-icon{font-size:44px;color:#ff9ec4;line-height:1;margin-bottom:6px}
.add-chapter .ch-title{color:#e26a8d;font-size:17px}
.add-chapter .ch-author{color:#c9a8b8}
.art-emoji{display:grid;place-items:center;min-height:86px;font-size:52px;background:linear-gradient(135deg,#fff6fb,#ffeaf3)}
.parent-link{text-align:center;padding:22px 20px 8px}
.parent-link button{background:none;border:none;color:#c9b8aa;font-family:inherit;font-size:12.5px;letter-spacing:1px;cursor:pointer;padding:6px 12px}
.poem-view{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.poem-tools{display:flex;align-items:center;gap:8px;padding:12px 16px 0}
.custom-badge{background:#fff0f6;color:#e26a8d;font-size:12px;font-weight:800;border-radius:12px;padding:5px 12px}
.del-btn{margin-left:auto;border:none;background:#fff0f0;color:#e06060;border-radius:12px;padding:6px 14px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffd6d6}
.poem-card{margin:14px 16px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 8px 0 rgba(232,190,210,.35),0 14px 26px rgba(200,160,180,.16);display:flex;align-items:center}
.poem-art{width:46%;line-height:0;flex:0 0 auto}
.poem-art svg{width:100%;height:auto;display:block}
.poem-meta{padding:12px 16px;flex:1}
.poem-meta h2{margin:0 0 6px;font-size:26px;letter-spacing:4px;color:#e26a8d}
.poem-meta .author-line{margin:0;font-size:14px;color:#a08b7a;letter-spacing:2px;display:flex;align-items:center;gap:6px}
.poet-chip{border:none;background:#fff0f6;color:#e26a8d;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer}
.steps{display:flex;gap:8px;padding:0 16px;margin-bottom:14px}
.step{flex:1;border:none;border-radius:18px;padding:13px 2px;background:#fff;color:#b3a091;font-size:14px;font-weight:800;box-shadow:0 3px 0 #f0e2d8;cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.5px}
.step.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 3px 0 #e09a2a;transform:translateY(-1px)}
.stage{padding:0 16px 30px}
.lines{display:flex;flex-direction:column;gap:12px}
.line{display:block;width:100%;border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:14px 8px 16px;font-size:calc(clamp(20px,5.6vw,30px)*var(--fs));cursor:pointer;transition:.15s;font-family:inherit;color:#4a3b2a;box-shadow:0 4px 0 rgba(255,190,215,.5);line-height:1.2}
.line.active{border-color:#ffb347;background:#fffbf0;box-shadow:0 4px 0 rgba(255,180,70,.55)}
ruby{ruby-position:over;padding:0 2px;transition:background .15s,transform .15s;border-radius:6px}
ruby.lit{background:#ffe88a;transform:scale(1.12)}
rt{font-size:.42em;color:#ea85a4;letter-spacing:0;font-weight:700;line-height:1.05;font-family:inherit}
.punct{color:#c9b8aa;margin-left:1px}
.story-box{background:linear-gradient(135deg,#fffbe6,#fff5d6);border:3px solid #ffe6a8;border-radius:20px;padding:16px;margin-top:14px;display:none}
.story-box.show{display:block}
.story-box p{margin:0 0 10px;font-size:calc(15.5px*var(--fs));line-height:1.85;color:#8a6a3a}
.story-speaker{display:inline-flex;align-items:center;gap:8px;border:none;background:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:800;color:#c98a00;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffe6a8}
.add-story-btn{display:inline-flex;align-items:center;gap:6px;border:2px dashed #ffd0e2;background:#fffafc;color:#e26a8d;border-radius:14px;padding:10px 16px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:14px}
.words-box{background:linear-gradient(135deg,#eaf6ff,#dbeeff);border:3px solid #b8ddff;border-radius:20px;padding:14px 16px;margin-top:14px;display:none}
.words-box.show{display:block}
.words-title{font-size:14px;font-weight:800;color:#3d8fd0;letter-spacing:1px;margin-bottom:10px}
.words-grid{display:flex;flex-wrap:wrap;gap:8px}
.word-chip{border:2px solid #b8ddff;background:#fff;border-radius:14px;padding:8px 14px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.word-chip .w-char{font-size:20px;font-weight:800;color:#3d8fd0}
.word-chip .w-py{font-size:10.5px;color:#8ab8e0;font-weight:700}
.word-detail{background:#fff;border-radius:14px;padding:12px;margin-top:10px;display:none}
.word-detail.show{display:block}
.word-detail .wd-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.word-detail .wd-head .wd-char{font-size:32px;font-weight:800;color:#3d8fd0}
.word-detail .wd-head .wd-py{font-size:14px;color:#8ab8e0;font-weight:700}
.word-detail .wd-mean{font-size:15px;color:#4a3b2a;line-height:1.7;margin-bottom:6px}
.word-detail .wd-ex{font-size:13px;color:#6a5a4a;line-height:1.7;background:#f0f8ff;border-radius:10px;padding:8px 10px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;border:none;border-radius:20px;padding:16px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:1px}
.btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 5px 0 #3d8fd0}
.btn.next{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a}
.btn.ghost{background:#fff;color:#a08b7a;box-shadow:0 5px 0 #f0e2d8;border:2px solid #f4ead9}
.btn.write{background:linear-gradient(135deg,#b6e8ff,#7ed4ff);color:#fff;box-shadow:0 5px 0 #4fa8f0}
.btn.read{background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;box-shadow:0 5px 0 #d94a75}
.game-title{text-align:center;font-size:17px;font-weight:800;color:#e26a8d;letter-spacing:1px;margin:4px 0 16px}
.big-speaker{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 20px}
.speaker-btn{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;font-size:38px;box-shadow:0 6px 0 #3d8fd0;display:grid;place-items:center}
.speaker-btn.playing{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.speaker-label{font-size:14px;color:#8a7a6a;font-weight:700;letter-spacing:1px}
.fill-line{background:#fff;border:3px dashed #ffd0e2;border-radius:22px;padding:20px 10px;text-align:center;font-size:calc(clamp(26px,7.5vw,40px)*var(--fs));letter-spacing:6px;margin-bottom:22px}
.fill-line.solved{border-style:solid;border-color:#a8e6c4;background:#f2fff8}
.blank{display:inline-block;min-width:1em;color:#ff8fab;border-bottom:5px solid #ff8fab;animation:blink .9s infinite;padding:0 4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fill-line.solved .blank{border-bottom-color:#4fc98b;color:#4fc98b;animation:none}
.options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.opt{width:92px;height:92px;border-radius:26px;border:4px solid #ffe0ec;background:#fff;cursor:pointer;transition:.15s;font-family:inherit;box-shadow:0 6px 0 rgba(255,190,215,.55);display:flex;flex-direction:column;align-items:center;justify-content:center}
.opt-char{font-size:calc(42px*var(--fs));font-weight:800;color:#5a4632;line-height:1}
.opt-zhuyin{font-size:14px;color:#ea85a4;font-weight:700;margin-top:3px;letter-spacing:1px}
.opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;animation:pop .35s ease}
.opt.correct .opt-char,.opt.correct .opt-zhuyin{color:#137a4c}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sentence-opt{width:100%;border:3px solid #ffe6f0;background:#fff;border-radius:18px;padding:14px 16px;font-size:calc(18px*var(--fs));cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 4px 0 rgba(255,190,215,.5);display:flex;align-items:center;gap:10px}
.sentence-opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b}
.sentence-opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3}
.hint-btn{display:block;margin:0 auto;border:none;background:#fff8e6;color:#c98a00;border-radius:18px;padding:13px 26px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #ffe6a8}
.feedback{text-align:center;font-size:18px;font-weight:800;color:#4fc98b;min-height:34px;margin-top:16px;letter-spacing:1px}
.diff-row{display:flex;gap:8px;margin:0 0 18px}
.diff-btn{flex:1;border:3px solid #f0e2d8;background:#fff;border-radius:16px;padding:12px 8px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #f0e2d8}
.diff-btn .d-emoji{font-size:22px;line-height:1}
.diff-btn .d-name{font-size:12.5px;font-weight:800;color:#8a7a6a}
.diff-btn .d-desc{font-size:10px;color:#b3a091}
.diff-btn.on.easy{border-color:#4fc98b;background:linear-gradient(135deg,#e8fff2,#c6f5d8);box-shadow:0 3px 0 #4fc98b}
.diff-btn.on.easy .d-name{color:#137a4c}
.diff-btn.on.medium{border-color:#ffb347;background:linear-gradient(135deg,#fff5e0,#ffe8b8);box-shadow:0 3px 0 #ffb347}
.diff-btn.on.medium .d-name{color:#8a5200}
.diff-btn.on.hard{border-color:#e06060;background:linear-gradient(135deg,#ffeaea,#ffd6d6);box-shadow:0 3px 0 #e06060}
.diff-btn.on.hard .d-name{color:#a03030}
.order-hint{background:linear-gradient(135deg,#fff8e6,#ffeec9);border-radius:20px;padding:16px;text-align:center;margin-bottom:18px;border:3px solid #ffe6a8}
.order-hint .hint-text{font-size:16px;font-weight:800;color:#8a5200;letter-spacing:1px;margin-bottom:10px}
.order-hint .speaker-btn{width:64px;height:64px;font-size:30px;margin:0 auto;display:grid}
.slots{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.slot{min-height:58px;border:3px dashed #d8d8d8;border-radius:20px;background:#fbfbfb;display:flex;align-items:center;padding:10px 16px;font-size:16px;letter-spacing:2px;color:#b3a091}
.slot.filled{border-style:solid;border-color:#a8d4ff;background:#fff;box-shadow:0 4px 0 rgba(160,200,255,.4);animation:pop .35s ease;color:#4a3b2a;font-size:17px}
.slot .num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#f0f0f0;font-weight:800;font-size:16px;margin-right:12px;color:#a8a8a8;flex:0 0 auto}
.slot.filled .num{background:#a8d4ff;color:#fff}
.pool{display:flex;flex-direction:column;gap:10px}
.chip{border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:14px 16px;font-size:17px;letter-spacing:2px;color:#4a3b2a;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(255,190,215,.5);text-align:left;display:flex;align-items:center;gap:10px}
.chip .chip-sound{width:38px;height:38px;border-radius:50%;background:#fff0f6;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.chip .chip-text{flex:1}
.chip.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3}
.chip.hint-glow{animation:glow 1s ease-in-out 2}
@keyframes glow{0%,100%{box-shadow:0 4px 0 rgba(255,190,215,.5)}50%{box-shadow:0 4px 0 #ffb347,0 0 20px #ffb347}}
.celebrate{position:fixed;inset:0;z-index:100;background:rgba(60,40,60,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px}
.celebration-box{background:#fff;border-radius:30px;padding:30px 26px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(120,80,110,.3);animation:pop .45s cubic-bezier(.2,1.4,.5,1)}
.celebration-box .big{font-size:64px;animation:float 1.4s ease-in-out infinite}
.celebration-box h3{margin:6px 0;font-size:24px;color:#e26a8d;letter-spacing:2px}
.celebration-box p{margin:0 0 20px;color:#a08b7a;font-size:15px;letter-spacing:1px}
.confetti{position:fixed;top:-20px;font-size:20px;z-index:99;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.modal{position:fixed;inset:0;z-index:150;background:rgba(60,40,60,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex;animation:fadeIn .25s ease}
.modal-box{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(120,80,110,.35);animation:pop .35s cubic-bezier(.2,1.3,.5,1)}
.modal-box h3{margin:0 0 4px;font-size:19px;color:#e26a8d;letter-spacing:2px;text-align:center}
.modal-tip{font-size:12.5px;color:#a08b7a;text-align:center;margin:0 0 12px;line-height:1.7}
.add-input{width:100%;min-height:180px;border:3px solid #ffe6f0;border-radius:16px;padding:12px;font-size:15.5px;line-height:1.85;resize:vertical;font-family:inherit;color:#4a3b2a;outline:none;background:#fffdfe}
.add-preview{margin-top:12px}
.preview-title{font-size:14px;font-weight:800;color:#4fc98b;margin-bottom:8px}
.preview-item{background:#f7fffb;border:2px solid #d6f5e6;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.6}
.preview-item b{color:#e26a8d;font-size:15px}
.preview-item span{color:#a08b7a;font-size:12px;margin-left:6px}
.preview-lines{color:#8a7a6a;font-size:12.5px;margin-top:4px}
.preview-story{width:100%;margin-top:8px;border:2px solid #e0f0e6;border-radius:12px;padding:9px 11px;font-size:13px;resize:vertical;min-height:52px;font-family:inherit;color:#4a3b2a;outline:none;background:#f8fff9}
.preview-warn{background:#fff8e6;border:2px solid #ffe6a8;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#9a7a1a;margin-bottom:7px;line-height:1.7}
.modal-actions{display:flex;gap:10px;margin-top:14px}
.m-btn{flex:1;border:none;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:1px}
.m-btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 4px 0 #3d8fd0}
.m-btn.ghost{background:#f4f0f2;color:#a08b7a;box-shadow:0 4px 0 #e6dfe3}
.m-btn.danger{background:linear-gradient(135deg,#ff8f8f,#ff6b6b);color:#fff;box-shadow:0 4px 0 #d95050}
.overlay-base{position:fixed;inset:0;z-index:180;overflow-y:auto;display:none;animation:fadeIn .3s ease}
.overlay-base.show{display:block}
.review-overlay{background:#fffaf3}
.friend-overlay{background:linear-gradient(135deg,#fff5fa,#ffe8f0,#fff5fa);z-index:190}
.read-overlay{background:linear-gradient(135deg,#eaf6ff,#d6efff,#eaf6ff);z-index:195}
.chain-overlay{background:linear-gradient(135deg,#f0fae0,#e0f5c8,#f0fae0);z-index:192}
.daily-overlay{background:linear-gradient(135deg,#fff0f8,#ffe0ef,#fff0f8);z-index:193}
.family-overlay{background:linear-gradient(135deg,#f0ebff,#e0d6ff,#f0ebff);z-index:194}
.overlay-header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #ffe6f0}
.overlay-progress{flex:1}
.overlay-progress .bar{height:10px;background:#f0e2d8;border-radius:5px;overflow:hidden}
.overlay-progress .bar-fill{height:100%;background:linear-gradient(90deg,#ffd86b,#ffb347);border-radius:5px;width:0;transition:width .35s ease}
.overlay-progress .bar-label{font-size:12.5px;color:#a08b7a;font-weight:700;margin-top:5px}
.review-body{max-width:600px;margin:0 auto;padding:20px 16px 40px}
.review-from{text-align:center;font-size:13px;color:#a08b7a;letter-spacing:1px;margin-bottom:14px}
.review-from b{color:#e26a8d}
.review-summary,.friend-summary,.chain-summary,.daily-summary,.family-summary{max-width:440px;margin:30px auto;padding:0 20px;text-align:center}
.review-summary .big-emoji,.friend-summary .big-emoji,.chain-summary .big-emoji,.daily-summary .big-emoji,.family-summary .big-emoji{font-size:72px;line-height:1;animation:float 1.6s ease-in-out infinite;margin-bottom:10px}
.review-summary h3,.friend-summary h3,.chain-summary h3,.daily-summary h3,.family-summary h3{margin:0 0 8px;font-size:24px;color:#e26a8d;letter-spacing:2px}
.review-summary p,.friend-summary p,.chain-summary p,.daily-summary p,.family-summary p{margin:0 0 8px;font-size:15px;color:#8a7a6a;line-height:1.7}
.review-summary .stars-earned,.friend-summary .stars-earned,.chain-summary .stars-earned,.daily-summary .stars-earned,.family-summary .stars-earned{font-size:32px;letter-spacing:4px;margin:12px 0 22px}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;padding:6px 0}
.sticker-card{border-radius:20px;padding:14px 8px;text-align:center;background:linear-gradient(135deg,#fff6fb,#ffeaf3);border:3px solid #ffe0ec}
.sticker-card.locked{background:#f7f4f5;border-color:#e8e2e6;filter:grayscale(1);opacity:.55}
.sticker-card .sticker-emoji{font-size:44px;line-height:1;margin-bottom:6px}
.sticker-card.locked .sticker-emoji{filter:blur(1px)}
.sticker-card .sticker-title{font-size:12.5px;font-weight:800;color:#5a4632;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker-card.locked .sticker-title{color:#b3a091}
.sticker-total{text-align:center;font-size:14px;color:#a08b7a;margin-bottom:12px}
.sticker-total b{color:#e26a8d;font-size:18px}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:6px 0}
.achievement-card{border-radius:20px;padding:14px 10px;text-align:center;background:linear-gradient(135deg,#eefbf6,#d8f5ea);border:3px solid #b8f0e0}
.achievement-card.locked{background:#f7f4f5;border-color:#e8e2e6;filter:grayscale(1);opacity:.5}
.achievement-card .ach-emoji{font-size:42px;line-height:1;margin-bottom:6px}
.achievement-card.locked .ach-emoji{filter:blur(1px)}
.achievement-card .ach-name{font-size:13.5px;font-weight:800;color:#3aab8e;margin-bottom:2px}
.achievement-card.locked .ach-name{color:#b3a091}
.achievement-card .ach-desc{font-size:11px;color:#6aa89c;line-height:1.4}
.achievement-card.locked .ach-desc{color:#b3a091}
.achievement-total{text-align:center;font-size:14px;color:#a08b7a;margin-bottom:12px}
.achievement-total b{color:#3aab8e;font-size:18px}
.certificate-card{background:linear-gradient(135deg,#fffbe6,#fff5d6,#fffbe6);border:8px double #ffd86b;border-radius:20px;padding:26px 22px;text-align:center;box-shadow:inset 0 0 30px rgba(255,200,100,.15);position:relative}
.certificate-card::before,.certificate-card::after{content:'🏆';position:absolute;font-size:32px;opacity:.7}
.certificate-card::before{top:10px;left:16px;transform:rotate(-15deg)}
.certificate-card::after{bottom:10px;right:16px;transform:rotate(15deg)}
.cert-title{font-size:30px;font-weight:900;color:#e26a8d;letter-spacing:6px;margin:8px 0}
.cert-subtitle{font-size:14px;color:#c98a00;letter-spacing:3px;margin-bottom:18px}
.cert-line{height:2px;background:linear-gradient(90deg,transparent,#ffd86b,transparent);margin:14px 0}
.cert-body{font-size:15px;color:#5a4632;line-height:2;letter-spacing:1px}
.cert-body .name{font-size:22px;font-weight:900;color:#e26a8d;letter-spacing:3px;border-bottom:2px dashed #ffd86b;padding:0 12px 2px;display:inline-block;margin:0 4px}
.cert-date{font-size:12.5px;color:#a08b7a;margin-top:18px}
.cert-seal{display:inline-block;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#ff8fab,#e26a8d);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;border:3px solid #fff;box-shadow:0 3px 8px rgba(226,106,141,.4);margin-top:12px}
.parent-section{margin-bottom:20px}
.parent-section h4{margin:0 0 10px;font-size:15px;color:#e26a8d;letter-spacing:1.5px}
.parent-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box,.time-box{background:#fff8f0;border-radius:16px;padding:12px 8px;text-align:center;border:2px solid #ffe6cc}
.stat-box .num,.time-box .num{font-size:26px;font-weight:900;color:#e26a8d;line-height:1.1}
.time-box .num{font-size:22px}
.stat-box .lbl,.time-box .lbl{font-size:11.5px;color:#a08b7a;margin-top:3px}
.time-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.poem-status-list{display:flex;flex-direction:column;gap:8px}
.poem-status{background:#f9f7ff;border-radius:14px;padding:10px 12px;border:2px solid #e8e0ff}
.poem-status .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.poem-status .title{flex:1;font-size:14px;font-weight:800;color:#5a4632}
.poem-status .level{font-size:12px}
.poem-status .row2{font-size:11.5px;color:#a08b7a;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.poem-status .story-edit{border:none;background:#fff0f6;color:#e26a8d;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer}
.wrong-chars{display:flex;flex-wrap:wrap;gap:6px}
.wrong-char{background:#fff0f0;border:2px solid #ffd6d6;border-radius:12px;padding:6px 10px;font-size:14px;color:#e06060;font-weight:800;display:flex;align-items:center;gap:5px}
.wrong-char small{font-size:10.5px;color:#c9a0a0}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.setting-label{font-size:13.5px;color:#5a4632;font-weight:700;flex:0 0 60px}
.seg{display:flex;flex:1;gap:5px}
.seg button{flex:1;border:2px solid #ffe6f0;background:#fff;border-radius:12px;padding:9px 4px;font-size:13px;font-weight:800;font-family:inherit;color:#a08b7a;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;border-color:#e09a2a;box-shadow:0 3px 0 #e09a2a}
.data-btn-row{display:flex;flex-direction:column;gap:8px}
.data-btn{border:none;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left}
.data-btn .ic{font-size:20px;flex:0 0 auto}
.data-btn.export{background:#f2f8ff;color:#3d8fd0;box-shadow:0 3px 0 #d0e6ff}
.data-btn.import{background:#f0fff5;color:#2e8a5f;box-shadow:0 3px 0 #c6e8d6}
.data-btn.danger{background:#fff0f0;color:#e06060;box-shadow:0 3px 0 #ffd6d6}
.poet-card{text-align:center;padding:10px 6px}
.poet-card .poet-emoji{font-size:64px;line-height:1;margin-bottom:8px}
.poet-card h4{margin:0 0 6px;font-size:22px;color:#e26a8d;letter-spacing:2px}
.poet-card .poet-years{font-size:13px;color:#a08b7a;margin-bottom:14px}
.poet-card .poet-bio{font-size:15px;color:#6a5a4a;line-height:1.9;text-align:left;background:#fff8f0;border-radius:14px;padding:14px;border:2px solid #ffe6cc}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:rgba(90,70,50,.94);color:#fff;padding:12px 22px;border-radius:20px;font-size:14px;font-weight:700;letter-spacing:1px;z-index:300;opacity:0;transition:.3s;pointer-events:none;white-space:pre-line;text-align:center;max-width:80vw;line-height:1.6}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ach-toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-60px);background:linear-gradient(135deg,#3aab8e,#5ed4b5);color:#fff;padding:14px 24px;border-radius:20px;font-size:14px;font-weight:800;z-index:400;opacity:0;transition:.4s;pointer-events:none;letter-spacing:1px;box-shadow:0 10px 30px rgba(58,171,142,.4);text-align:center;max-width:80vw;line-height:1.5}
.ach-toast.show{opacity:1;transform:translate(-50%,0)}
.ach-toast .toast-emoji{font-size:32px;display:block;margin-bottom:4px}
.write-modal{position:fixed;inset:0;z-index:170;background:rgba(60,40,60,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:12px}
.write-modal.show{display:flex}
.write-box{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(120,80,110,.4);display:flex;flex-direction:column;max-height:96vh}
.write-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.write-char-info{flex:1;text-align:center}
.write-char-info .wc-char{font-size:26px;font-weight:900;color:#e26a8d;letter-spacing:2px}
.write-char-info .wc-py{font-size:13px;color:#ea85a4;font-weight:700}
.write-close{border:none;background:#f4f0f2;color:#a08b7a;border-radius:12px;padding:8px 12px;font-family:inherit;font-weight:800;cursor:pointer;font-size:14px}
.canvas-stack{position:relative;width:100%;aspect-ratio:1;background:#fffafc;border-radius:16px;overflow:hidden;border:3px solid #ffe6f0;touch-action:none}
.canvas-stack canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.canvas-stack #bgCanvas{opacity:.35}
.write-actions{display:flex;gap:8px;margin-top:12px}
.write-actions button{flex:1;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}
.w-clear{background:#fff0f0;color:#e06060;box-shadow:0 3px 0 #ffd6d6}
.w-done{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 3px 0 #3d8fd0}
.write-char-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:8px}
.wc-pick{border:3px solid #ffe6f0;background:#fff;border-radius:14px;padding:10px 4px;font-size:24px;font-weight:800;color:#5a4632;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(255,190,215,.5);position:relative}
.wc-pick.done{border-color:#4fc98b;background:#f2fff8}
.wc-pick.done::after{content:'✓';position:absolute;top:2px;right:4px;font-size:11px;color:#4fc98b;font-weight:900}
.poetmap-wrap{overflow-x:auto;padding:6px 0 12px}
.poetmap-svg{min-width:600px;width:100%;height:auto;display:block}
.poetmap-hint{text-align:center;font-size:12.5px;color:#a08b7a;margin:8px 0 4px}
.friend-body{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.friend-timer-wrap{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,.7)}
.friend-timer{flex:1;height:14px;background:#ffe6f0;border-radius:7px;overflow:hidden}
.friend-timer-fill{height:100%;background:linear-gradient(90deg,#7ed4ff,#4fa8f0);border-radius:7px;width:100%;transition:width .3s linear}
.friend-timer-fill.warn{background:linear-gradient(90deg,#ffb347,#e06060);animation:pulseWarn .6s ease-in-out infinite}
@keyframes pulseWarn{0%,100%{opacity:1}50%{opacity:.65}}
.friend-timer-num{font-size:16px;font-weight:900;color:#e26a8d;min-width:44px;text-align:right}
.friend-timer-num.warn{color:#e06060;animation:pulseWarn .6s ease-in-out infinite}
.friend-score{display:flex;justify-content:center;padding:6px 16px}
.friend-score .score-pill{background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;font-size:13px;font-weight:800;padding:5px 14px;border-radius:14px;box-shadow:0 3px 0 #d94a75}
.friend-question{text-align:center;margin-bottom:20px}
.friend-question .q-text{font-size:18px;font-weight:800;color:#e26a8d;margin-bottom:14px}
.friend-question .q-hint{font-size:12px;color:#a08b7a;margin-top:-8px;margin-bottom:12px}
.friend-card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(255,150,190,.3),0 12px 24px rgba(200,100,150,.15);display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid #ffd6e6}
.friend-card .f-emoji{font-size:64px;animation:float 2.5s ease-in-out infinite}
.friend-card .f-name{font-size:26px;font-weight:900;color:#e26a8d;letter-spacing:3px}
.friend-card .f-era{font-size:12px;color:#a08b7a;letter-spacing:2px}
.friend-options{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.friend-opt{border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:16px 20px;font-size:18px;font-weight:800;color:#5a4632;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(255,190,215,.5);display:flex;align-items:center;gap:14px}
.friend-opt .o-emoji{font-size:30px;flex:0 0 auto}
.friend-opt .o-name{flex:1;text-align:left;letter-spacing:2px}
.friend-opt .o-check{font-size:22px;flex:0 0 auto;color:#4fc98b;opacity:0;transition:.2s}
.friend-opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;color:#137a4c}
.friend-opt.correct .o-check{opacity:1}
.friend-opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;color:#e06060}
.friend-feedback{text-align:center;margin-top:20px;min-height:60px}
.friend-feedback .fb-text{font-size:18px;font-weight:800;color:#4fc98b;margin-bottom:6px}
.friend-feedback .fb-text.wrong{color:#e06060}
.friend-feedback .fb-note{font-size:13.5px;color:#8a7a6a;line-height:1.7;background:#fff8f0;border-radius:14px;padding:10px 14px;text-align:left}
.friend-summary .best-score{background:#fff8e6;border-radius:14px;padding:10px 16px;margin:0 0 18px;font-size:14px;color:#8a5200;font-weight:800;display:inline-block}
.friend-summary .btn-row,.chain-summary .btn-row,.daily-summary .btn-row,.family-summary .btn-row{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.friend-menu{max-width:560px;margin:0 auto;padding:24px 20px 40px}
.friend-menu h2{text-align:center;font-size:24px;color:#e26a8d;letter-spacing:2px;margin:8px 0 4px}
.friend-menu .menu-sub{text-align:center;font-size:13px;color:#a08b7a;margin-bottom:24px}
.menu-section{margin-bottom:20px}
.menu-section h3{font-size:14px;color:#e26a8d;margin:0 0 10px;text-align:center;font-weight:800}
.menu-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.menu-btn{border:3px solid #ffe6f0;background:#fff;border-radius:18px;padding:12px 18px;font-size:14px;font-weight:800;color:#8a7a6a;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #f0e2d8;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px}
.menu-btn .mb-emoji{font-size:24px;line-height:1}
.menu-btn.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;border-color:#e09a2a;box-shadow:0 3px 0 #e09a2a}
.friend-start-btn{width:100%;border:none;border-radius:22px;padding:18px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:2px;background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;box-shadow:0 6px 0 #d94a75;margin-top:10px}
.friend-network-wrap{margin:20px auto 0;background:#fff;border-radius:24px;box-shadow:0 8px 0 rgba(255,150,190,.2);border:3px solid #ffd6e6;overflow:hidden}
.friend-network-title{background:linear-gradient(135deg,#ffe8f0,#ffd6e6);padding:12px 16px;font-size:14px;font-weight:800;color:#e26a8d;text-align:center}
.friend-network-svg{width:100%;height:auto;display:block}
.friend-network-hint{text-align:center;font-size:12px;color:#a08b7a;padding:8px 12px 12px}
.read-body{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.read-intro{text-align:center;padding:20px 16px}
.read-intro .big-emoji{font-size:64px;animation:float 2s ease-in-out infinite}
.read-intro h3{margin:8px 0 6px;font-size:22px;color:#3d8fd0;letter-spacing:2px}
.read-intro p{margin:0 0 20px;font-size:13px;color:#6a8aa8;line-height:1.8}
.read-start-btn{width:100%;max-width:320px;border:none;border-radius:22px;padding:18px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:2px;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 6px 0 #3d8fd0;margin:0 auto;display:block}
.read-warn{background:#fff8e6;border:2px solid #ffe6a8;border-radius:14px;padding:10px 14px;margin-top:16px;font-size:12.5px;color:#9a7a1a;line-height:1.7;text-align:left}
.read-line-box{background:#fff;border-radius:24px;padding:20px 16px;box-shadow:0 8px 0 rgba(126,212,255,.25);border:3px solid #b8ddff;text-align:center;margin-bottom:20px}
.read-line-box .rl-num{font-size:12px;color:#8ab8e0;font-weight:800;letter-spacing:2px;margin-bottom:8px}
.read-line-box .rl-text{font-size:calc(clamp(28px,8vw,42px)*var(--fs));letter-spacing:8px;color:#3d8fd0;font-weight:900;line-height:1.3;margin-bottom:10px}
.read-line-box .rl-zhuyin{font-size:15px;color:#7ba8d0;letter-spacing:2px;line-height:1.6;font-weight:700}
.read-toolbar{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.read-tool-btn{flex:1;max-width:140px;border:none;border-radius:16px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.read-tool-btn .ic{font-size:22px}
.read-tool-listen{background:#fff8e6;color:#c98a00;box-shadow:0 3px 0 #ffe6a8}
.read-tool-skip{background:#f4f0f2;color:#a08b7a;box-shadow:0 3px 0 #e0d8de}
.read-mic-wrap{text-align:center;margin-bottom:14px}
.read-mic-btn{width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;font-size:56px;box-shadow:0 8px 0 #3d8fd0;display:grid;place-items:center;margin:0 auto;touch-action:none}
.read-mic-btn.recording{transform:translateY(4px);box-shadow:0 4px 0 #3d8fd0;background:linear-gradient(135deg,#ff8fab,#e26a8d);animation:micPulse 1s ease-in-out infinite}
@keyframes micPulse{0%,100%{transform:translateY(4px) scale(1)}50%{transform:translateY(4px) scale(1.05)}}
.read-mic-hint{font-size:14px;color:#6a8aa8;font-weight:700;margin-top:14px}
.read-mic-hint.recording{color:#e26a8d}
.read-result{margin-top:16px;padding:14px 16px;border-radius:18px;text-align:center;animation:fadeIn .3s ease}
.read-result.good{background:linear-gradient(135deg,#e8fff2,#c6f5d8);border:3px solid #4fc98b}
.read-result.mid{background:linear-gradient(135deg,#fff8e6,#ffeec9);border:3px solid #ffb347}
.read-result.low{background:linear-gradient(135deg,#ffeaea,#ffd6d6);border:3px solid #ff8fab}
.read-result .rr-stars{font-size:30px;letter-spacing:4px;margin-bottom:6px}
.read-result .rr-text{font-size:16px;font-weight:800;color:#137a4c;margin-bottom:6px}
.read-result.mid .rr-text{color:#8a5200}
.read-result.low .rr-text{color:#a03030}
.read-result .rr-recognized{font-size:12.5px;color:#6a8aa8;line-height:1.6;margin-top:8px}
.read-result .rr-recognized b{color:#3d8fd0}
.read-result .rr-next{margin-top:12px;border:none;border-radius:14px;padding:11px 26px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 3px 0 #3d8fd0}

<script>
/* ============ 狀態 ============ */
const state = {
  step: 'learn', poemIndex: 0, fillQueue: null, fillIdx: 0, fill: null, order: null,
  reading: false, soundOn: true, review: null, difficulty: 'easy',
  friend: null, friendMenu: { era: 'all', mode: 'normal' },
  read: null, chain: null, daily: null, family: null
};

/* ============ 音效 ============ */
const SE = {
  ctx: null,
  init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ctx && this.ctx.state === 'suspended') try { this.ctx.resume(); } catch (e) { } },
  t(f, d, t = 'sine', v = .12, dl = 0) { if (!this.ctx || !state.soundOn) return; try { const c = this.ctx.currentTime + dl, o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = t; o.frequency.value = f; g.gain.setValueAtTime(0, c); g.gain.linearRampToValueAtTime(v, c + .012); g.gain.exponentialRampToValueAtTime(.001, c + d); o.connect(g); g.connect(this.ctx.destination); o.start(c); o.stop(c + d + .05); } catch (e) { } },
  click() { this.init(); this.t(880, .05, 'sine', .06); },
  ok() { this.init(); this.t(523, .12, 'sine', .1, 0); this.t(659, .12, 'sine', .1, .1); this.t(784, .22, 'sine', .12, .2); },
  no() { this.init(); this.t(392, .14, 'triangle', .09, 0); this.t(311, .2, 'triangle', .09, .12); },
  win() { this.init(); [523, 659, 784, 1046].forEach((n, i) => this.t(n, .28, 'sine', .1, i * .12)); },
  ach() { this.init(); [659, 784, 988, 1318].forEach((n, i) => this.t(n, .22, 'triangle', .08, i * .09)); },
  stroke() { this.init(); this.t(1200 + Math.random() * 200, .03, 'sine', .03); },
  recStart() { this.init(); this.t(440, .1, 'sine', .08); this.t(660, .15, 'sine', .08, .08); },
  recStop() { this.init(); this.t(660, .1, 'sine', .08); this.t(440, .15, 'sine', .08, .08); },
  tick() { this.init(); this.t(800, .05, 'square', .04); }
};

const vib = p => { if (navigator.vibrate && state.soundOn) try { navigator.vibrate(p); } catch (e) { } };

/* ============ 注音 ============ */
const SM = { b: 'ㄅ', p: 'ㄆ', m: 'ㄇ', f: 'ㄈ', d: 'ㄉ', t: 'ㄊ', n: 'ㄋ', l: 'ㄌ', g: 'ㄍ', k: 'ㄎ', h: 'ㄏ', j: 'ㄐ', q: 'ㄑ', x: 'ㄒ', zh: 'ㄓ', ch: 'ㄔ', sh: 'ㄕ', r: 'ㄖ', z: 'ㄗ', c: 'ㄘ', s: 'ㄙ' };
const YM = { a: 'ㄚ', o: 'ㄛ', e: 'ㄜ', ai: 'ㄞ', ei: 'ㄟ', ao: 'ㄠ', ou: 'ㄡ', an: 'ㄢ', en: 'ㄣ', ang: 'ㄤ', eng: 'ㄥ', er: 'ㄦ', i: 'ㄧ', ia: 'ㄧㄚ', ie: 'ㄧㄝ', iao: 'ㄧㄠ', iu: 'ㄧㄡ', iou: 'ㄧㄡ', ian: 'ㄧㄢ', in: 'ㄧㄣ', iang: 'ㄧㄤ', ing: 'ㄧㄥ', iong: 'ㄩㄥ', u: 'ㄨ', ua: 'ㄨㄚ', uo: 'ㄨㄛ', uai: 'ㄨㄞ', ui: 'ㄨㄟ', uei: 'ㄨㄟ', uan: 'ㄨㄢ', un: 'ㄨㄣ', uen: 'ㄨㄣ', uang: 'ㄨㄤ', ueng: 'ㄨㄥ', ong: 'ㄨㄥ', v: 'ㄩ', ve: 'ㄩㄝ', van: 'ㄩㄢ', vn: 'ㄩㄣ' };
const FULL = { zhi: 'ㄓ', chi: 'ㄔ', shi: 'ㄕ', ri: 'ㄖ', zi: 'ㄗ', ci: 'ㄘ', si: 'ㄙ', yi: 'ㄧ', ya: 'ㄧㄚ', ye: 'ㄧㄝ', yao: 'ㄧㄠ', you: 'ㄧㄡ', yan: 'ㄧㄢ', yin: 'ㄧㄣ', yang: 'ㄧㄤ', ying: 'ㄧㄥ', yong: 'ㄩㄥ', yu: 'ㄩ', yue: 'ㄩㄝ', yuan: 'ㄩㄢ', yun: 'ㄩㄣ', wu: 'ㄨ', wa: 'ㄨㄚ', wo: 'ㄨㄛ', wai: 'ㄨㄞ', wei: 'ㄨㄟ', wan: 'ㄨㄢ', wen: 'ㄨㄣ', wang: 'ㄨㄤ', weng: 'ㄨㄥ', er: 'ㄦ', a: 'ㄚ', o: 'ㄛ', e: 'ㄜ', ai: 'ㄞ', ei: 'ㄟ', ao: 'ㄠ', ou: 'ㄡ', an: 'ㄢ', en: 'ㄣ', ang: 'ㄤ', eng: 'ㄥ' };
const TN = { '1': '', '2': 'ˊ', '3': 'ˇ', '4': 'ˋ', '5': '˙', '0': '˙' };
function toZ(s) { if (!s) return ''; const m = String(s).toLowerCase().match(/^([a-züêv]+)([0-5])?$/); if (!m) return ''; let r = m[1].replace(/ü/g, 'v'); const t = m[2] || '5'; if (FULL[r]) return FULL[r] + (TN[t] || ''); let sm = '', ym = r; if (r.startsWith('zh') || r.startsWith('ch') || r.startsWith('sh')) { sm = r.slice(0, 2); ym = r.slice(2); } else if ('bpmfdtnlgkhjqxrzcs'.includes(r[0])) { sm = r[0]; ym = r.slice(1); } if (sm === 'j' || sm === 'q' || sm === 'x') { if (ym === 'u') ym = 'v'; else if (ym === 'ue') ym = 've'; else if (ym === 'uan') ym = 'van'; else if (ym === 'un') ym = 'vn'; } const a = SM[sm] || '', b = YM[ym] || ''; if (!a && !b) return ''; return a + b + (TN[t] || ''); }
function zhuyinOf(text, warns, title) { if (!text) return ''; if (typeof pinyinPro === 'undefined') { warns.add('注音未載入'); return ''; } const out = []; for (const ch of [...text]) { if (!/[\u3400-\u4dbf\u4e00-\u9fff]/.test(ch)) continue; let py = ''; try { py = pinyinPro.pinyin(ch, { toneType: 'num', v: true, type: 'array' })[0] || ''; } catch (e) { } const z = toZ(py); if (!z) warns.add(`「${ch}」查不到`); out.push(z || '？'); } return out.join(' '); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ============ 解析 ============ */
const hasP = s => /[，。！？、；：,.!?;:]/.test(s);
function parseBlock(lines) { let title = '', author = '', start = 0; if (lines.length) { const first = lines[0]; if (!hasP(first) && first.length <= 16) { const parts = first.split(/[\s　｜|·・]+/).filter(Boolean); if (parts.length >= 2) { title = parts[0]; author = parts.slice(1).join(''); } else { title = first; } start = 1; if (!author && lines[1]) { let cand = lines[1].replace(/[〔\[（(【〕\]）)】]/g, '').trim(); cand = cand.replace(/^(唐|宋|元|明|清|近代|現代)[\s·・]?/, '').trim(); if (cand && cand.length <= 4 && !hasP(cand)) { author = cand; start = 2; } } } } return { title, author, body: lines.slice(start).join('') }; }

function loadCP() { try { const r = localStorage.getItem(LS_P); if (!r) return []; const a = JSON.parse(r); if (!Array.isArray(a)) return []; return a.filter(p => p && p.id && p.title && Array.isArray(p.lines) && p.lines.length).map(p => ({ id: p.id, title: p.title, author: p.author || '', art: p.art || '📜', sticker: p.sticker || '📜', story: p.story || '', poetInfo: p.poetInfo || null, words: Array.isArray(p.words) ? p.words : [], custom: true, lines: p.lines.map(ln => ({ t: ln.t || '', z: ln.z || '', p: ln.p || '' })) })); } catch (e) { return []; } }

function getP(id) { const p = progress[id]; if (!p || typeof p !== 'object') return { learn: false, fill: false, order: false }; return p; }
function markDone(id, key) { const p = getP(id); p[key] = true; if (p.learn && p.fill && p.order && !p.masteredAt) { p.masteredAt = Date.now(); p.reviewLevel = 0; p.nextReview = Date.now() + 86400000; } progress[id] = p; saveP(); checkAchs(); checkCert(); }
function addWrong(ch) { if (!ch) return; if (!progress.__wrongChars__) progress.__wrongChars__ = {}; progress.__wrongChars__[ch] = (progress.__wrongChars__[ch] || 0) + 1; saveP(); }
function addRight(ch) { if (!ch || !progress.__wrongChars__) return; const w = progress.__wrongChars__; if (w[ch] && w[ch] > 0) { w[ch] = w[ch] - 1; if (w[ch] <= 0) delete w[ch]; saveP(); } }
function getWrong() { const w = progress.__wrongChars__ || {}; return Object.entries(w).sort((a, b) => b[1] - a[1]); }

function dailyVisit() { const t = new Date().toDateString(); if (settings.lastVisitDate === t) return; const y = new Date(Date.now() - 86400000).toDateString(); if (settings.lastVisitDate === y) settings.continuousDays = (settings.continuousDays || 0) + 1; else settings.continuousDays = 1; settings.lastVisitDate = t; saveS(); checkAchs(); }
let lastAct = Date.now();

function pickVoice() { if (!('speechSynthesis' in window)) return null; const vs = speechSynthesis.getVoices(); if (!vs.length) return null; const tw = vs.filter(v => /zh[-_]TW|zh[-_]Hant/i.test(v.lang || '')); const zh = vs.filter(v => /^zh/i.test(v.lang || '')); const f = tw.find(v => /Mei|Xiao|Yu|Han|女|Female/i.test(v.name || '')); return f || tw[0] || zh[0] || null; }
if ('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', () => pickVoice());
function speakAsync(text, opts) { opts = opts || {}; return new Promise(r => { if (!state.soundOn || !('speechSynthesis' in window) || !text) { r(); return; } try { speechSynthesis.cancel(); } catch (e) { } const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = opts.rate !== undefined ? opts.rate : getRate(); u.pitch = opts.pitch !== undefined ? opts.pitch : 1.42; u.volume = 1; const v = pickVoice(); if (v) u.voice = v; let done = false; const fin = () => { if (!done) { done = true; r(); } }; u.onend = fin; u.onerror = fin; setTimeout(fin, 12000); try { speechSynthesis.speak(u); } catch (e) { fin(); } }); }

  } catch (err) { alert('格式錯誤'); } finally { e.target.value = ''; }
});
document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('確定清除所有資料？')) return;
  if (!confirm('真的要清除？')) return;
  localStorage.removeItem(LS_P); localStorage.removeItem(LS_PG);
  customPoems = []; progress = {}; rebuildP(); parentModal.classList.remove('show'); toast('已清除'); renderHome();
});

/* ============ 故事 ============ */
const storyModal = document.getElementById('storyModal');
let storyTid = null;
function openStoryModal(id, current) { storyTid = id; document.getElementById('storyInput').value = current || ''; storyModal.classList.add('show'); }
function closeStoryModal() { storyModal.classList.remove('show'); storyTid = null; }
document.getElementById('storyCancel').addEventListener('click', () => { SE.click(); closeStoryModal(); });
storyModal.addEventListener('click', e => { if (e.target === storyModal) closeStoryModal(); });
document.getElementById('storySave').addEventListener('click', () => {
  if (!storyTid) return;
  const story = document.getElementById('storyInput').value.trim();
  const idx = customPoems.findIndex(p => p.id === storyTid);
  if (idx < 0) { toast('找不到'); return; }
  customPoems[idx].story = story; saveCP(); rebuildP();
  SE.click(); toast(story ? '已保存' : '已清空'); closeStoryModal();
  if (topTitle.textContent !== '唐詩小學堂') { const i = POEMS.findIndex(p => p.id === storyTid); if (i >= 0 && state.poemIndex === i) renderPoem(); }
  if (parentModal.classList.contains('show')) renderPoemStatus();
});

/* ============ 加入新詩 ============ */
const addModal = document.getElementById('addModal');
let pendingPoems = null;
function openAddModal() { document.getElementById('addInput').value = ''; document.getElementById('addPreview').innerHTML = ''; document.getElementById('confirmRow').style.display = 'none'; document.getElementById('addParse').textContent = '✨ 解析預覽'; pendingPoems = null; addModal.classList.add('show'); }
function closeAddModal() { addModal.classList.remove('show'); pendingPoems = null; }
document.getElementById('addCancel').addEventListener('click', () => { SE.click(); closeAddModal(); });
addModal.addEventListener('click', e => { if (e.target === addModal) closeAddModal(); });
document.getElementById('addParse').addEventListener('click', () => {
  SE.click();
  const raw = document.getElementById('addInput').value.trim();
  if (!raw) { toast('請貼上詩詞'); return; }
  const { poems, warns } = parsePoems(raw);
  if (!poems.length) { document.getElementById('addPreview').innerHTML = `<div class="preview-warn">⚠️ 沒有解析到</div>`; document.getElementById('confirmRow').style.display = 'none'; return; }
  pendingPoems = poems;
  let html = `<div class="preview-title">✅ 解析到 ${poems.length} 首</div>`;
  poems.forEach((p, idx) => { html += `<div class="preview-item"><b>${esc(p.title)}</b>${p.author ? ` <span>${esc(p.author)}</span>` : ''}<span>${p.lines.length} 句</span><div class="preview-lines">${esc(p.lines.map(l => l.t + l.p).join(' '))}</div><textarea class="preview-story" data-idx="${idx}" placeholder="📝 故事（選填）">${esc(p.story || '')}</textarea></div>`; });
  if (warns.size) { html += `<div class="preview-warn">⚠️ <b>請確認讀音：</b><br>${[...warns].slice(0, 10).map(esc).join('<br>')}</div>`; } else { html += `<div class="preview-warn" style="background:#f2fff8;border-color:#a8e6c4;color:#2e8a5f">✅ 全部字都有讀音</div>`; }
  document.getElementById('addPreview').innerHTML = html;
  document.getElementById('confirmRow').style.display = 'flex';
  document.getElementById('addParse').textContent = '🔄 重新解析';
});
document.getElementById('addConfirm').addEventListener('click', () => {
  if (!pendingPoems || !pendingPoems.length) return;
  SE.win();
  document.querySelectorAll('.preview-story').forEach(ta => { const idx = +ta.dataset.idx; if (pendingPoems[idx]) pendingPoems[idx].story = ta.value.trim(); });
  customPoems = customPoems.concat(pendingPoems); saveCP(); rebuildP();
  const n = pendingPoems.length; closeAddModal(); toast(`已加入 ${n} 首`); checkAchs(); renderHome();
});

/* ============ 初始化 ============ */
document.getElementById('homeBtn').addEventListener('click', () => {
  SE.click();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  state.reading = false;
  if (reviewOverlay.classList.contains('show')) { if (!confirm('要結束複習嗎？')) return; closeReview(); return; }
  if (friendOverlay.classList.contains('show')) { if (!confirm('要結束嗎？')) return; closeFriend(); return; }
  if (readOverlay.classList.contains('show')) { if (!confirm('要結束朗讀嗎？')) return; closeRead(); return; }
  if (chainOverlay.classList.contains('show')) { if (!confirm('要結束接龍嗎？')) return; closeChain(); return; }
  if (dailyOverlay.classList.contains('show')) { if (!confirm('要結束嗎？')) return; closeDaily(); return; }
  if (familyOverlay.classList.contains('show')) { if (!confirm('要結束嗎？')) return; closeFamily(); return; }
  if (writeModal.classList.contains('show')) closeWrite();
  renderHome();
});
document.body.addEventListener('click', () => { trackAct(); SE.init(); }, { capture: true });
document.body.addEventListener('touchstart', () => { trackAct(); SE.init(); }, { capture: true, passive: true });
document.body.addEventListener('keydown', () => trackAct(), { capture: true });
startTimeTrack();
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); setTimeout(() => speechSynthesis.getVoices(), 300); }

// 延遲執行確保 DOM 準備好
setTimeout(renderHome, 0);
</script>
</body>
