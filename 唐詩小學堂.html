<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>唐詩小學堂 🌸</title>
<style>
:root{--fs-base:1;}
html[data-font="small"]{--fs-base:.9;}
html[data-font="large"]{--fs-base:1.14;}
html[data-font="xlarge"]{--fs-base:1.28;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:"jf open 粉圓","Yuanti TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 12% 8%,#fff2cc 0,transparent 38%),radial-gradient(circle at 88% 12%,#ffe0ef 0,transparent 40%),radial-gradient(circle at 50% 100%,#e2f2ff 0,transparent 55%),#fffaf3;min-height:100vh;color:#5a4632;padding-bottom:40px;overflow-x:hidden;}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px solid #ffe6f0;}
.topbar h1{flex:1;margin:0;font-size:19px;text-align:center;color:#e26a8d;letter-spacing:2px;font-weight:800;}
.icon-btn{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 #f3dfe8;font-size:21px;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:0 0 auto;}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #f3dfe8;}
#homeBtn{visibility:hidden;}
.view{max-width:780px;margin:0 auto;padding:0 0 20px;}
.hero{text-align:center;padding:20px 20px 6px;}
.hero .hero-emoji{font-size:52px;line-height:1;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero h2{margin:10px 0 4px;font-size:24px;color:#e26a8d;letter-spacing:1px;}
.hero p{margin:0;color:#a08b7a;font-size:14px;}
.streak-bar{display:flex;justify-content:center;margin:10px 20px 0;}
.streak-pill{background:linear-gradient(135deg,#ffe8f0,#ffd6e6);border-radius:20px;padding:7px 16px;font-size:13px;font-weight:800;color:#e26a8d;letter-spacing:.5px;box-shadow:0 3px 0 #ffc9dd;display:flex;align-items:center;gap:6px;}
.streak-pill .num{font-size:16px;color:#d94a75;}
.quick-row,.quick-row-2,.quick-row-3{display:flex;gap:12px;padding:14px 16px 4px;}
.quick-row-2,.quick-row-3{padding-top:8px;}
.quick-card{flex:1;border:none;border-radius:22px;padding:14px 12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:10px;transition:.15s;}
.quick-card:active{transform:translateY(3px);}
.q-review{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a;}
.q-sticker{background:linear-gradient(135deg,#c6b7ff,#a18aff);color:#fff;box-shadow:0 5px 0 #7d63e0;}
.q-achievement{background:linear-gradient(135deg,#b8f0e0,#5ed4b5);color:#fff;box-shadow:0 5px 0 #3aab8e;}
.q-award{background:linear-gradient(135deg,#ffb8d8,#ff8ab8);color:#fff;box-shadow:0 5px 0 #e0629a;}
.q-poetmap{background:linear-gradient(135deg,#ffd4a8,#ffb070);color:#fff;box-shadow:0 5px 0 #e08948;}
.q-friend{background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;box-shadow:0 5px 0 #d94a75;}
.q-read{background:linear-gradient(135deg,#a8e6ff,#5eb8f0);color:#fff;box-shadow:0 5px 0 #3d8fd0;}
.q-icon{font-size:34px;line-height:1;flex:0 0 auto;}
.q-text{flex:1;text-align:left;}
.q-text b{display:block;font-size:17px;letter-spacing:1px;}
.q-text small{display:block;font-size:11.5px;opacity:.82;margin-top:2px;letter-spacing:.5px;}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;padding:14px 16px;}
.chapter{border:none;cursor:pointer;text-align:center;background:#fff;border-radius:24px;padding:10px 10px 14px;box-shadow:0 6px 0 rgba(232,190,210,.45),0 12px 22px rgba(200,160,180,.15);transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;position:relative;}
.chapter:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(232,190,210,.45);}
.ch-art{width:100%;border-radius:16px;overflow:hidden;line-height:0;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.ch-art svg{width:100%;height:auto;display:block;}
.ch-num{font-size:11px;color:#b9a696;letter-spacing:1px;margin-top:6px;}
.ch-title{font-size:19px;font-weight:800;color:#5a4632;letter-spacing:2px;}
.ch-author{font-size:12px;color:#a89684;}
.ch-stars{font-size:12px;letter-spacing:1px;}
.chapter.custom{border:2px dashed #ffd0e2;}
.ch-badge{position:absolute;top:8px;right:8px;background:#fff0f6;color:#e26a8d;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;}
.add-chapter{border:3px dashed #ffd0e2!important;background:linear-gradient(135deg,#fffdfe,#fff5fa)!important;box-shadow:none!important;justify-content:center;min-height:170px;}
.add-icon{font-size:44px;color:#ff9ec4;line-height:1;margin-bottom:6px;}
.add-chapter .ch-title{color:#e26a8d;font-size:17px;}
.add-chapter .ch-author{color:#c9a8b8;}
.art-emoji{display:grid;place-items:center;min-height:86px;font-size:52px;background:linear-gradient(135deg,#fff6fb,#ffeaf3);}
.parent-link{text-align:center;padding:22px 20px 8px;}
.parent-link button{background:none;border:none;color:#c9b8aa;font-family:inherit;font-size:12.5px;letter-spacing:1px;cursor:pointer;padding:6px 12px;}
.poem-view{animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.poem-tools{display:flex;align-items:center;gap:8px;padding:12px 16px 0;}
.custom-badge{background:#fff0f6;color:#e26a8d;font-size:12px;font-weight:800;border-radius:12px;padding:5px 12px;}
.del-btn{margin-left:auto;border:none;background:#fff0f0;color:#e06060;border-radius:12px;padding:6px 14px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffd6d6;}
.poem-card{margin:14px 16px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 8px 0 rgba(232,190,210,.35),0 14px 26px rgba(200,160,180,.16);display:flex;align-items:center;}
.poem-art{width:46%;line-height:0;flex:0 0 auto;}
.poem-art svg{width:100%;height:auto;display:block;}
.poem-meta{padding:12px 16px;flex:1;}
.poem-meta h2{margin:0 0 6px;font-size:26px;letter-spacing:4px;color:#e26a8d;}
.poem-meta .author-line{margin:0;font-size:14px;color:#a08b7a;letter-spacing:2px;display:flex;align-items:center;gap:6px;}
.poet-chip{border:none;background:#fff0f6;color:#e26a8d;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;}
.steps{display:flex;gap:8px;padding:0 16px;margin-bottom:14px;}
.step{flex:1;border:none;border-radius:18px;padding:13px 2px;background:#fff;color:#b3a091;font-size:14px;font-weight:800;box-shadow:0 3px 0 #f0e2d8;cursor:pointer;transition:.15s;font-family:inherit;letter-spacing:.5px;}
.step.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 3px 0 #e09a2a;transform:translateY(-1px);}
.stage{padding:0 16px 30px;}
.lines{display:flex;flex-direction:column;gap:12px;}
.line{display:block;width:100%;border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:14px 8px 16px;font-size:calc(clamp(20px,5.6vw,30px)*var(--fs-base));cursor:pointer;transition:.15s;font-family:inherit;color:#4a3b2a;box-shadow:0 4px 0 rgba(255,190,215,.5);line-height:1.2;}
.line.active{border-color:#ffb347;background:#fffbf0;box-shadow:0 4px 0 rgba(255,180,70,.55);}
ruby{ruby-position:over;padding:0 2px;transition:background .15s,transform .15s;border-radius:6px;}
ruby.lit{background:#ffe88a;transform:scale(1.12);}
rt{font-size:.42em;color:#ea85a4;letter-spacing:0;font-weight:700;line-height:1.05;font-family:inherit;}
.punct{color:#c9b8aa;margin-left:1px;}
.story-box{background:linear-gradient(135deg,#fffbe6,#fff5d6);border:3px solid #ffe6a8;border-radius:20px;padding:16px;margin-top:14px;display:none;}
.story-box.show{display:block;}
.story-box p{margin:0 0 10px;font-size:calc(15.5px*var(--fs-base));line-height:1.85;color:#8a6a3a;}
.story-speaker{display:inline-flex;align-items:center;gap:8px;border:none;background:#fff;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:800;color:#c98a00;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #ffe6a8;}
.add-story-btn{display:inline-flex;align-items:center;gap:6px;border:2px dashed #ffd0e2;background:#fffafc;color:#e26a8d;border-radius:14px;padding:10px 16px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:14px;}
.words-box{background:linear-gradient(135deg,#eaf6ff,#dbeeff);border:3px solid #b8ddff;border-radius:20px;padding:14px 16px;margin-top:14px;display:none;}
.words-box.show{display:block;}
.words-title{font-size:14px;font-weight:800;color:#3d8fd0;letter-spacing:1px;margin-bottom:10px;}
.words-grid{display:flex;flex-wrap:wrap;gap:8px;}
.word-chip{border:2px solid #b8ddff;background:#fff;border-radius:14px;padding:8px 14px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;}
.word-chip .w-char{font-size:20px;font-weight:800;color:#3d8fd0;}
.word-chip .w-py{font-size:10.5px;color:#8ab8e0;font-weight:700;}
.word-detail{background:#fff;border-radius:14px;padding:12px;margin-top:10px;display:none;}
.word-detail.show{display:block;}
.word-detail .wd-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.word-detail .wd-head .wd-char{font-size:32px;font-weight:800;color:#3d8fd0;}
.word-detail .wd-head .wd-py{font-size:14px;color:#8ab8e0;font-weight:700;}
.word-detail .wd-mean{font-size:15px;color:#4a3b2a;line-height:1.7;margin-bottom:6px;}
.word-detail .wd-ex{font-size:13px;color:#6a5a4a;line-height:1.7;background:#f0f8ff;border-radius:10px;padding:8px 10px;}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{flex:1;min-width:130px;border:none;border-radius:20px;padding:16px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:.15s;letter-spacing:1px;}
.btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 5px 0 #3d8fd0;}
.btn.next{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;box-shadow:0 5px 0 #e09a2a;}
.btn.ghost{background:#fff;color:#a08b7a;box-shadow:0 5px 0 #f0e2d8;border:2px solid #f4ead9;}
.btn.write{background:linear-gradient(135deg,#b6e8ff,#7ed4ff);color:#fff;box-shadow:0 5px 0 #4fa8f0;}
.btn.read{background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;box-shadow:0 5px 0 #d94a75;}
.game-title{text-align:center;font-size:17px;font-weight:800;color:#e26a8d;letter-spacing:1px;margin:4px 0 16px;}
.big-speaker{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 20px;}
.speaker-btn{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;font-size:38px;box-shadow:0 6px 0 #3d8fd0;display:grid;place-items:center;}
.speaker-btn.playing{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.speaker-label{font-size:14px;color:#8a7a6a;font-weight:700;letter-spacing:1px;}
.fill-line{background:#fff;border:3px dashed #ffd0e2;border-radius:22px;padding:20px 10px;text-align:center;font-size:calc(clamp(26px,7.5vw,40px)*var(--fs-base));letter-spacing:6px;margin-bottom:22px;}
.fill-line.solved{border-style:solid;border-color:#a8e6c4;background:#f2fff8;}
.blank{display:inline-block;min-width:1em;color:#ff8fab;border-bottom:5px solid #ff8fab;animation:blink .9s infinite;padding:0 4px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.fill-line.solved .blank{border-bottom-color:#4fc98b;color:#4fc98b;animation:none;}
.options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.opt{width:92px;height:92px;border-radius:26px;border:4px solid #ffe0ec;background:#fff;cursor:pointer;transition:.15s;font-family:inherit;box-shadow:0 6px 0 rgba(255,190,215,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.opt-char{font-size:calc(42px*var(--fs-base));font-weight:800;color:#5a4632;line-height:1;}
.opt-zhuyin{font-size:14px;color:#ea85a4;font-weight:700;margin-top:3px;letter-spacing:1px;}
.opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;animation:pop .35s ease;}
.opt.correct .opt-char,.opt.correct .opt-zhuyin{color:#137a4c;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sentence-opt{width:100%;border:3px solid #ffe6f0;background:#fff;border-radius:18px;padding:14px 16px;font-size:calc(18px*var(--fs-base));cursor:pointer;font-family:inherit;text-align:left;box-shadow:0 4px 0 rgba(255,190,215,.5);display:flex;align-items:center;gap:10px;}
.sentence-opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;}
.sentence-opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;}
.hint-btn{display:block;margin:0 auto;border:none;background:#fff8e6;color:#c98a00;border-radius:18px;padding:13px 26px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #ffe6a8;}
.feedback{text-align:center;font-size:18px;font-weight:800;color:#4fc98b;min-height:34px;margin-top:16px;letter-spacing:1px;}
.diff-row{display:flex;gap:8px;margin:0 0 18px;}
.diff-btn{flex:1;border:3px solid #f0e2d8;background:#fff;border-radius:16px;padding:12px 8px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #f0e2d8;}
.diff-btn .d-emoji{font-size:22px;line-height:1;}
.diff-btn .d-name{font-size:12.5px;font-weight:800;color:#8a7a6a;}
.diff-btn .d-desc{font-size:10px;color:#b3a091;}
.diff-btn.on.easy{border-color:#4fc98b;background:linear-gradient(135deg,#e8fff2,#c6f5d8);box-shadow:0 3px 0 #4fc98b;}
.diff-btn.on.easy .d-name{color:#137a4c;}
.diff-btn.on.medium{border-color:#ffb347;background:linear-gradient(135deg,#fff5e0,#ffe8b8);box-shadow:0 3px 0 #ffb347;}
.diff-btn.on.medium .d-name{color:#8a5200;}
.diff-btn.on.hard{border-color:#e06060;background:linear-gradient(135deg,#ffeaea,#ffd6d6);box-shadow:0 3px 0 #e06060;}
.diff-btn.on.hard .d-name{color:#a03030;}
.order-hint{background:linear-gradient(135deg,#fff8e6,#ffeec9);border-radius:20px;padding:16px;text-align:center;margin-bottom:18px;border:3px solid #ffe6a8;}
.order-hint .hint-text{font-size:16px;font-weight:800;color:#8a5200;letter-spacing:1px;margin-bottom:10px;}
.order-hint .speaker-btn{width:64px;height:64px;font-size:30px;margin:0 auto;display:grid;}
.slots{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.slot{min-height:58px;border:3px dashed #d8d8d8;border-radius:20px;background:#fbfbfb;display:flex;align-items:center;padding:10px 16px;font-size:16px;letter-spacing:2px;color:#b3a091;}
.slot.filled{border-style:solid;border-color:#a8d4ff;background:#fff;box-shadow:0 4px 0 rgba(160,200,255,.4);animation:pop .35s ease;color:#4a3b2a;font-size:17px;}
.slot .num{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#f0f0f0;font-weight:800;font-size:16px;margin-right:12px;color:#a8a8a8;flex:0 0 auto;}
.slot.filled .num{background:#a8d4ff;color:#fff;}
.pool{display:flex;flex-direction:column;gap:10px;}
.chip{border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:14px 16px;font-size:17px;letter-spacing:2px;color:#4a3b2a;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(255,190,215,.5);text-align:left;display:flex;align-items:center;gap:10px;}
.chip .chip-sound{width:38px;height:38px;border-radius:50%;background:#fff0f6;display:grid;place-items:center;font-size:18px;flex:0 0 auto;}
.chip .chip-text{flex:1;}
.chip.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;}
.chip.hint-glow{animation:glow 1s ease-in-out 2;}
@keyframes glow{0%,100%{box-shadow:0 4px 0 rgba(255,190,215,.5)}50%{box-shadow:0 4px 0 #ffb347,0 0 20px #ffb347;}}
.celebrate{position:fixed;inset:0;z-index:100;background:rgba(60,40,60,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;}
.celebration-box{background:#fff;border-radius:30px;padding:30px 26px;text-align:center;max-width:320px;width:100%;box-shadow:0 20px 50px rgba(120,80,110,.3);animation:pop .45s cubic-bezier(.2,1.4,.5,1);}
.celebration-box .big{font-size:64px;animation:float 1.4s ease-in-out infinite;}
.celebration-box h3{margin:6px 0;font-size:24px;color:#e26a8d;letter-spacing:2px;}
.celebration-box p{margin:0 0 20px;color:#a08b7a;font-size:15px;letter-spacing:1px;}
.confetti{position:fixed;top:-20px;font-size:20px;z-index:99;animation:fall linear forwards;pointer-events:none;}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2;}}
.modal{position:fixed;inset:0;z-index:150;background:rgba(60,40,60,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;}
.modal.show{display:flex;animation:fadeIn .25s ease;}
.modal-box{background:#fff;border-radius:26px;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(120,80,110,.35);animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
.modal-box h3{margin:0 0 4px;font-size:19px;color:#e26a8d;letter-spacing:2px;text-align:center;}
.modal-tip{font-size:12.5px;color:#a08b7a;text-align:center;margin:0 0 12px;line-height:1.7;}
.add-input{width:100%;min-height:180px;border:3px solid #ffe6f0;border-radius:16px;padding:12px;font-size:15.5px;line-height:1.85;resize:vertical;font-family:inherit;color:#4a3b2a;outline:none;background:#fffdfe;}
.add-preview{margin-top:12px;}
.preview-title{font-size:14px;font-weight:800;color:#4fc98b;margin-bottom:8px;}
.preview-item{background:#f7fffb;border:2px solid #d6f5e6;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.6;}
.preview-item b{color:#e26a8d;font-size:15px;}
.preview-item span{color:#a08b7a;font-size:12px;margin-left:6px;}
.preview-lines{color:#8a7a6a;font-size:12.5px;margin-top:4px;}
.preview-story{width:100%;margin-top:8px;border:2px solid #e0f0e6;border-radius:12px;padding:9px 11px;font-size:13px;resize:vertical;min-height:52px;font-family:inherit;color:#4a3b2a;outline:none;background:#f8fff9;}
.preview-warn{background:#fff8e6;border:2px solid #ffe6a8;border-radius:12px;padding:9px 12px;font-size:12.5px;color:#9a7a1a;margin-bottom:7px;line-height:1.7;}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.m-btn{flex:1;border:none;border-radius:16px;padding:14px 10px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:1px;}
.m-btn.primary{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 4px 0 #3d8fd0;}
.m-btn.ghost{background:#f4f0f2;color:#a08b7a;box-shadow:0 4px 0 #e6dfe3;}
.overlay-base{position:fixed;inset:0;z-index:180;overflow-y:auto;display:none;animation:fadeIn .3s ease;}
.overlay-base.show{display:block;}
.review-overlay{background:#fffaf3;}
.friend-overlay{background:linear-gradient(135deg,#fff5fa,#ffe8f0,#fff5fa);z-index:190;}
.read-overlay{background:linear-gradient(135deg,#eaf6ff,#d6efff,#eaf6ff);z-index:195;}
.overlay-header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #ffe6f0;}
.overlay-progress{flex:1;}
.overlay-progress .bar{height:10px;background:#f0e2d8;border-radius:5px;overflow:hidden;}
.overlay-progress .bar-fill{height:100%;background:linear-gradient(90deg,#ffd86b,#ffb347);border-radius:5px;width:0;transition:width .35s ease;}
.overlay-progress .bar-label{font-size:12.5px;color:#a08b7a;font-weight:700;margin-top:5px;}
.review-body{max-width:600px;margin:0 auto;padding:20px 16px 40px;}
.review-from{text-align:center;font-size:13px;color:#a08b7a;letter-spacing:1px;margin-bottom:14px;}
.review-from b{color:#e26a8d;}
.review-summary,.friend-summary{max-width:440px;margin:30px auto;padding:0 20px;text-align:center;}
.review-summary .big-emoji,.friend-summary .big-emoji{font-size:72px;line-height:1;animation:float 1.6s ease-in-out infinite;margin-bottom:10px;}
.review-summary h3,.friend-summary h3{margin:0 0 8px;font-size:24px;color:#e26a8d;letter-spacing:2px;}
.review-summary p,.friend-summary p{margin:0 0 8px;font-size:15px;color:#8a7a6a;line-height:1.7;}
.review-summary .stars-earned,.friend-summary .stars-earned{font-size:32px;letter-spacing:4px;margin:12px 0 22px;}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;padding:6px 0;}
.sticker-card{border-radius:20px;padding:14px 8px;text-align:center;background:linear-gradient(135deg,#fff6fb,#ffeaf3);border:3px solid #ffe0ec;}
.sticker-card.locked{background:#f7f4f5;border-color:#e8e2e6;filter:grayscale(1);opacity:.55;}
.sticker-card .sticker-emoji{font-size:44px;line-height:1;margin-bottom:6px;}
.sticker-card.locked .sticker-emoji{filter:blur(1px);}
.sticker-card .sticker-title{font-size:12.5px;font-weight:800;color:#5a4632;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sticker-card.locked .sticker-title{color:#b3a091;}
.sticker-total{text-align:center;font-size:14px;color:#a08b7a;margin-bottom:12px;}
.sticker-total b{color:#e26a8d;font-size:18px;}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:6px 0;}
.achievement-card{border-radius:20px;padding:14px 10px;text-align:center;background:linear-gradient(135deg,#eefbf6,#d8f5ea);border:3px solid #b8f0e0;}
.achievement-card.locked{background:#f7f4f5;border-color:#e8e2e6;filter:grayscale(1);opacity:.5;}
.achievement-card .ach-emoji{font-size:42px;line-height:1;margin-bottom:6px;}
.achievement-card.locked .ach-emoji{filter:blur(1px);}
.achievement-card .ach-name{font-size:13.5px;font-weight:800;color:#3aab8e;margin-bottom:2px;}
.achievement-card.locked .ach-name{color:#b3a091;}
.achievement-card .ach-desc{font-size:11px;color:#6aa89c;line-height:1.4;}
.achievement-card.locked .ach-desc{color:#b3a091;}
.achievement-total{text-align:center;font-size:14px;color:#a08b7a;margin-bottom:12px;}
.achievement-total b{color:#3aab8e;font-size:18px;}
.certificate-card{background:linear-gradient(135deg,#fffbe6,#fff5d6,#fffbe6);border:8px double #ffd86b;border-radius:20px;padding:26px 22px;text-align:center;box-shadow:inset 0 0 30px rgba(255,200,100,.15);position:relative;}
.certificate-card::before,.certificate-card::after{content:'🏆';position:absolute;font-size:32px;opacity:.7;}
.certificate-card::before{top:10px;left:16px;transform:rotate(-15deg);}
.certificate-card::after{bottom:10px;right:16px;transform:rotate(15deg);}
.cert-title{font-size:30px;font-weight:900;color:#e26a8d;letter-spacing:6px;margin:8px 0;}
.cert-subtitle{font-size:14px;color:#c98a00;letter-spacing:3px;margin-bottom:18px;}
.cert-line{height:2px;background:linear-gradient(90deg,transparent,#ffd86b,transparent);margin:14px 0;}
.cert-body{font-size:15px;color:#5a4632;line-height:2;letter-spacing:1px;}
.cert-body .name{font-size:22px;font-weight:900;color:#e26a8d;letter-spacing:3px;border-bottom:2px dashed #ffd86b;padding:0 12px 2px;display:inline-block;margin:0 4px;}
.cert-date{font-size:12.5px;color:#a08b7a;margin-top:18px;letter-spacing:1px;}
.cert-seal{display:inline-block;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#ff8fab,#e26a8d);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;border:3px solid #fff;box-shadow:0 3px 8px rgba(226,106,141,.4);margin-top:12px;}
.parent-section{margin-bottom:20px;}
.parent-section h4{margin:0 0 10px;font-size:15px;color:#e26a8d;letter-spacing:1.5px;}
.parent-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat-box,.time-box{background:#fff8f0;border-radius:16px;padding:12px 8px;text-align:center;border:2px solid #ffe6cc;}
.stat-box .num,.time-box .num{font-size:26px;font-weight:900;color:#e26a8d;line-height:1.1;}
.time-box .num{font-size:22px;}
.stat-box .lbl,.time-box .lbl{font-size:11.5px;color:#a08b7a;margin-top:3px;}
.time-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.poem-status-list{display:flex;flex-direction:column;gap:8px;}
.poem-status{background:#f9f7ff;border-radius:14px;padding:10px 12px;border:2px solid #e8e0ff;}
.poem-status .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.poem-status .title{flex:1;font-size:14px;font-weight:800;color:#5a4632;}
.poem-status .level{font-size:12px;}
.poem-status .row2{font-size:11.5px;color:#a08b7a;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.poem-status .story-edit{border:none;background:#fff0f6;color:#e26a8d;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;}
.wrong-chars{display:flex;flex-wrap:wrap;gap:6px;}
.wrong-char{background:#fff0f0;border:2px solid #ffd6d6;border-radius:12px;padding:6px 10px;font-size:14px;color:#e06060;font-weight:800;display:flex;align-items:center;gap:5px;}
.wrong-char small{font-size:10.5px;color:#c9a0a0;}
.setting-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.setting-label{font-size:13.5px;color:#5a4632;font-weight:700;flex:0 0 60px;}
.seg{display:flex;flex:1;gap:5px;}
.seg button{flex:1;border:2px solid #ffe6f0;background:#fff;border-radius:12px;padding:9px 4px;font-size:13px;font-weight:800;font-family:inherit;color:#a08b7a;cursor:pointer;}
.seg button.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;border-color:#e09a2a;box-shadow:0 3px 0 #e09a2a;}
.data-btn-row{display:flex;flex-direction:column;gap:8px;}
.data-btn{border:none;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;}
.data-btn .ic{font-size:20px;flex:0 0 auto;}
.data-btn.export{background:#f2f8ff;color:#3d8fd0;box-shadow:0 3px 0 #d0e6ff;}
.data-btn.import{background:#f0fff5;color:#2e8a5f;box-shadow:0 3px 0 #c6e8d6;}
.data-btn.danger{background:#fff0f0;color:#e06060;box-shadow:0 3px 0 #ffd6d6;}
.poet-card{text-align:center;padding:10px 6px;}
.poet-card .poet-emoji{font-size:64px;line-height:1;margin-bottom:8px;}
.poet-card h4{margin:0 0 6px;font-size:22px;color:#e26a8d;letter-spacing:2px;}
.poet-card .poet-years{font-size:13px;color:#a08b7a;margin-bottom:14px;}
.poet-card .poet-bio{font-size:15px;color:#6a5a4a;line-height:1.9;text-align:left;background:#fff8f0;border-radius:14px;padding:14px;border:2px solid #ffe6cc;}
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:rgba(90,70,50,.94);color:#fff;padding:12px 22px;border-radius:20px;font-size:14px;font-weight:700;z-index:300;opacity:0;transition:.3s;pointer-events:none;white-space:pre-line;text-align:center;max-width:80vw;line-height:1.6;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.ach-toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-60px);background:linear-gradient(135deg,#3aab8e,#5ed4b5);color:#fff;padding:14px 24px;border-radius:20px;font-size:14px;font-weight:800;z-index:400;opacity:0;transition:.4s;pointer-events:none;letter-spacing:1px;box-shadow:0 10px 30px rgba(58,171,142,.4);text-align:center;max-width:80vw;line-height:1.5;}
.ach-toast.show{opacity:1;transform:translate(-50%,0);}
.ach-toast .toast-emoji{font-size:32px;display:block;margin-bottom:4px;}
.write-modal{position:fixed;inset:0;z-index:170;background:rgba(60,40,60,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:12px;}
.write-modal.show{display:flex;}
.write-box{background:#fff;border-radius:24px;padding:16px;width:100%;max-width:480px;box-shadow:0 24px 60px rgba(120,80,110,.4);display:flex;flex-direction:column;max-height:96vh;}
.write-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.write-char-info{flex:1;text-align:center;}
.write-char-info .wc-char{font-size:26px;font-weight:900;color:#e26a8d;letter-spacing:2px;}
.write-char-info .wc-py{font-size:13px;color:#ea85a4;font-weight:700;}
.write-close{border:none;background:#f4f0f2;color:#a08b7a;border-radius:12px;padding:8px 12px;font-family:inherit;font-weight:800;cursor:pointer;font-size:14px;}
.canvas-stack{position:relative;width:100%;aspect-ratio:1;background:#fffafc;border-radius:16px;overflow:hidden;border:3px solid #ffe6f0;touch-action:none;}
.canvas-stack canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.canvas-stack #bgCanvas{opacity:.35;}
.write-actions{display:flex;gap:8px;margin-top:12px;}
.write-actions button{flex:1;border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;}
.w-clear{background:#fff0f0;color:#e06060;box-shadow:0 3px 0 #ffd6d6;}
.w-done{background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 3px 0 #3d8fd0;}
.write-char-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:8px;}
.wc-pick{border:3px solid #ffe6f0;background:#fff;border-radius:14px;padding:10px 4px;font-size:24px;font-weight:800;color:#5a4632;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(255,190,215,.5);position:relative;}
.wc-pick.done{border-color:#4fc98b;background:#f2fff8;}
.wc-pick.done::after{content:'✓';position:absolute;top:2px;right:4px;font-size:11px;color:#4fc98b;font-weight:900;}
.poetmap-wrap{overflow-x:auto;padding:6px 0 12px;}
.poetmap-svg{min-width:600px;width:100%;height:auto;display:block;}
.poetmap-hint{text-align:center;font-size:12.5px;color:#a08b7a;margin:8px 0 4px;}
/* 好朋友遊戲 */
.friend-body{max-width:560px;margin:0 auto;padding:20px 16px 40px;}
.friend-timer-wrap{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(255,255,255,.7);}
.friend-timer{flex:1;height:14px;background:#ffe6f0;border-radius:7px;overflow:hidden;}
.friend-timer-fill{height:100%;background:linear-gradient(90deg,#7ed4ff,#4fa8f0);border-radius:7px;width:100%;transition:width .3s linear,background .3s;}
.friend-timer-fill.warn{background:linear-gradient(90deg,#ffb347,#e06060);animation:pulseWarn .6s ease-in-out infinite;}
@keyframes pulseWarn{0%,100%{opacity:1}50%{opacity:.65}}
.friend-timer-num{font-size:16px;font-weight:900;color:#e26a8d;min-width:44px;text-align:right;}
.friend-timer-num.warn{color:#e06060;animation:pulseWarn .6s ease-in-out infinite;}
.friend-score{display:flex;justify-content:center;padding:6px 16px;}
.friend-score .score-pill{background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;font-size:13px;font-weight:800;padding:5px 14px;border-radius:14px;box-shadow:0 3px 0 #d94a75;}
.friend-question{text-align:center;margin-bottom:20px;}
.friend-question .q-text{font-size:18px;font-weight:800;color:#e26a8d;margin-bottom:14px;}
.friend-question .q-hint{font-size:12px;color:#a08b7a;margin-top:-8px;margin-bottom:12px;}
.friend-card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 0 rgba(255,150,190,.3),0 12px 24px rgba(200,100,150,.15);display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid #ffd6e6;}
.friend-card .f-emoji{font-size:64px;animation:float 2.5s ease-in-out infinite;}
.friend-card .f-name{font-size:26px;font-weight:900;color:#e26a8d;letter-spacing:3px;}
.friend-card .f-era{font-size:12px;color:#a08b7a;letter-spacing:2px;}
.friend-options{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
.friend-opt{border:3px solid #ffe6f0;background:#fff;border-radius:20px;padding:16px 20px;font-size:18px;font-weight:800;color:#5a4632;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(255,190,215,.5);display:flex;align-items:center;gap:14px;}
.friend-opt .o-emoji{font-size:30px;flex:0 0 auto;}
.friend-opt .o-name{flex:1;text-align:left;letter-spacing:2px;}
.friend-opt .o-check{font-size:22px;flex:0 0 auto;color:#4fc98b;opacity:0;transition:.2s;}
.friend-opt.correct{background:linear-gradient(135deg,#b6f5d4,#6fe0a8);border-color:#4fc98b;color:#137a4c;}
.friend-opt.correct .o-check{opacity:1;}
.friend-opt.wrong{animation:shake .4s ease;background:#ffe8e8;border-color:#ffb3b3;color:#e06060;}
.friend-feedback{text-align:center;margin-top:20px;min-height:60px;}
.friend-feedback .fb-text{font-size:18px;font-weight:800;color:#4fc98b;margin-bottom:6px;}
.friend-feedback .fb-text.wrong{color:#e06060;}
.friend-feedback .fb-note{font-size:13.5px;color:#8a7a6a;line-height:1.7;background:#fff8f0;border-radius:14px;padding:10px 14px;text-align:left;}
.friend-summary .best-score{background:#fff8e6;border-radius:14px;padding:10px 16px;margin:0 0 18px;font-size:14px;color:#8a5200;font-weight:800;display:inline-block;}
.friend-summary .btn-row{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
.friend-menu{max-width:560px;margin:0 auto;padding:24px 20px 40px;}
.friend-menu h2{text-align:center;font-size:24px;color:#e26a8d;letter-spacing:2px;margin:8px 0 4px;}
.friend-menu .menu-sub{text-align:center;font-size:13px;color:#a08b7a;margin-bottom:24px;}
.menu-section{margin-bottom:20px;}
.menu-section h3{font-size:14px;color:#e26a8d;margin:0 0 10px;text-align:center;font-weight:800;}
.menu-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.menu-btn{border:3px solid #ffe6f0;background:#fff;border-radius:18px;padding:12px 18px;font-size:14px;font-weight:800;color:#8a7a6a;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #f0e2d8;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px;}
.menu-btn .mb-emoji{font-size:24px;line-height:1;}
.menu-btn.on{background:linear-gradient(135deg,#ffd86b,#ffb347);color:#8a5200;border-color:#e09a2a;box-shadow:0 3px 0 #e09a2a;}
.friend-start-btn{width:100%;border:none;border-radius:22px;padding:18px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:2px;background:linear-gradient(135deg,#ff9ec4,#ff6ba0);color:#fff;box-shadow:0 6px 0 #d94a75;margin-top:10px;}
.friend-network-wrap{margin:20px auto 0;background:#fff;border-radius:24px;box-shadow:0 8px 0 rgba(255,150,190,.2),0 12px 24px rgba(200,100,150,.12);border:3px solid #ffd6e6;overflow:hidden;}
.friend-network-title{background:linear-gradient(135deg,#ffe8f0,#ffd6e6);padding:12px 16px;font-size:14px;font-weight:800;color:#e26a8d;text-align:center;}
.friend-network-svg{width:100%;height:auto;display:block;}
.friend-network-hint{text-align:center;font-size:12px;color:#a08b7a;padding:8px 12px 12px;}
/* ========== 🎤 朗讀測驗 ========== */
.read-body{max-width:560px;margin:0 auto;padding:20px 16px 40px;}
.read-intro{text-align:center;padding:20px 16px;}
.read-intro .big-emoji{font-size:64px;animation:float 2s ease-in-out infinite;}
.read-intro h3{margin:8px 0 6px;font-size:22px;color:#3d8fd0;letter-spacing:2px;}
.read-intro p{margin:0 0 20px;font-size:13px;color:#6a8aa8;line-height:1.8;}
.read-start-btn{width:100%;max-width:320px;border:none;border-radius:22px;padding:18px;font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:2px;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 6px 0 #3d8fd0;margin:0 auto;display:block;}
.read-start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #3d8fd0;}
.read-start-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 6px 0 #3d8fd0;}
.read-warn{background:#fff8e6;border:2px solid #ffe6a8;border-radius:14px;padding:10px 14px;margin-top:16px;font-size:12.5px;color:#9a7a1a;line-height:1.7;text-align:left;}
.read-warn b{color:#c98a00;}
.read-line-box{background:#fff;border-radius:24px;padding:20px 16px;box-shadow:0 8px 0 rgba(126,212,255,.25),0 12px 24px rgba(80,160,210,.12);border:3px solid #b8ddff;text-align:center;margin-bottom:20px;}
.read-line-box .rl-num{font-size:12px;color:#8ab8e0;font-weight:800;letter-spacing:2px;margin-bottom:8px;}
.read-line-box .rl-text{font-size:calc(clamp(28px,8vw,42px)*var(--fs-base));letter-spacing:8px;color:#3d8fd0;font-weight:900;line-height:1.3;margin-bottom:10px;}
.read-line-box .rl-zhuyin{font-size:15px;color:#7ba8d0;letter-spacing:2px;line-height:1.6;font-weight:700;}
.read-toolbar{display:flex;gap:10px;justify-content:center;margin-bottom:18px;}
.read-tool-btn{flex:1;max-width:140px;border:none;border-radius:16px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:.5px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.read-tool-btn .ic{font-size:22px;}
.read-tool-listen{background:#fff8e6;color:#c98a00;box-shadow:0 3px 0 #ffe6a8;}
.read-tool-skip{background:#f4f0f2;color:#a08b7a;box-shadow:0 3px 0 #e0d8de;}
.read-mic-wrap{text-align:center;margin-bottom:14px;}
.read-mic-btn{width:140px;height:140px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;font-size:56px;box-shadow:0 8px 0 #3d8fd0;display:grid;place-items:center;margin:0 auto;transition:.15s;touch-action:none;}
.read-mic-btn:active,.read-mic-btn.recording{transform:translateY(4px);box-shadow:0 4px 0 #3d8fd0;background:linear-gradient(135deg,#ff8fab,#e26a8d);}
.read-mic-btn.recording{animation:micPulse 1s ease-in-out infinite;}
@keyframes micPulse{0%,100%{transform:translateY(4px) scale(1)}50%{transform:translateY(4px) scale(1.05)}}
.read-mic-btn:disabled{opacity:.4;cursor:not-allowed;}
.read-mic-hint{font-size:14px;color:#6a8aa8;font-weight:700;letter-spacing:1px;margin-top:14px;}
.read-mic-hint.recording{color:#e26a8d;}
.read-result{margin-top:16px;padding:14px 16px;border-radius:18px;text-align:center;animation:fadeIn .3s ease;}
.read-result.good{background:linear-gradient(135deg,#e8fff2,#c6f5d8);border:3px solid #4fc98b;}
.read-result.mid{background:linear-gradient(135deg,#fff8e6,#ffeec9);border:3px solid #ffb347;}
.read-result.low{background:linear-gradient(135deg,#ffeaea,#ffd6d6);border:3px solid #ff8fab;}
.read-result .rr-stars{font-size:30px;letter-spacing:4px;margin-bottom:6px;}
.read-result .rr-text{font-size:16px;font-weight:800;color:#137a4c;margin-bottom:6px;}
.read-result.mid .rr-text{color:#8a5200;}
.read-result.low .rr-text{color:#a03030;}
.read-result .rr-recognized{font-size:12.5px;color:#6a8aa8;line-height:1.6;margin-top:8px;letter-spacing:.5px;}
.read-result .rr-recognized b{color:#3d8fd0;}
.read-result .rr-next{margin-top:12px;border:none;border-radius:14px;padding:11px 26px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#7ed4ff,#4fa8f0);color:#fff;box-shadow:0 3px 0 #3d8fd0;letter-spacing:1px;}
.read-summary{max-width:440px;margin:30px auto;padding:0 20px;text-align:center;}

<script>
/* 音效 */
const soundEngine={ctx:null,init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}},tone(f,d,t='sine',v=0.12,dl=0){if(!this.ctx||!state.soundOn) return;try{const c=this.ctx.currentTime+dl;const o=this.ctx.createOscillator();const g=this.ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,c);g.gain.linearRampToValueAtTime(v,c+0.012);g.gain.exponentialRampToValueAtTime(0.001,c+d);o.connect(g);g.connect(this.ctx.destination);o.start(c);o.stop(c+d+0.05);}catch(e){}},click(){this.init();this.tone(880,0.05,'sine',0.06);},correct(){this.init();this.tone(523.25,0.12,'sine',0.1,0);this.tone(659.25,0.12,'sine',0.1,0.1);this.tone(783.99,0.22,'sine',0.12,0.2);},wrong(){this.init();this.tone(392,0.14,'triangle',0.09,0);this.tone(311.13,0.2,'triangle',0.09,0.12);},win(){this.init();[523.25,659.25,783.99,1046.5].forEach((n,i)=>this.tone(n,0.28,'sine',0.1,i*0.12));},ach(){this.init();[659.25,783.99,987.77,1318.5].forEach((n,i)=>this.tone(n,0.22,'triangle',0.08,i*0.09));},stroke(){this.init();this.tone(1200+Math.random()*200,0.03,'sine',0.03);},recStart(){this.init();this.tone(440,0.1,'sine',0.08);this.tone(660,0.15,'sine',0.08,0.08);},recStop(){this.init();this.tone(660,0.1,'sine',0.08);this.tone(440,0.15,'sine',0.08,0.08);},tick(){this.init();this.tone(800,0.05,'square',0.04);}};

const FULL={zhi:'ㄓ',chi:'ㄔ',shi:'ㄕ',ri:'ㄖ',zi:'ㄗ',ci:'ㄘ',si:'ㄙ',yi:'ㄧ',ya:'ㄧㄚ',ye:'ㄧㄝ',yao:'ㄧㄠ',you:'ㄧㄡ',yan:'ㄧㄢ',yin:'ㄧㄣ',yang:'ㄧㄤ',ying:'ㄧㄥ',yong:'ㄩㄥ',yu:'ㄩ',yue:'ㄩㄝ',yuan:'ㄩㄢ',yun:'ㄩㄣ',wu:'ㄨ',wa:'ㄨㄚ',wo:'ㄨㄛ',wai:'ㄨㄞ',wei:'ㄨㄟ',wan:'ㄨㄢ',wen:'ㄨㄣ',wang:'ㄨㄤ',weng:'ㄨㄥ',er:'ㄦ',a:'ㄚ',o:'ㄛ',e:'ㄜ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ'};

function toZhuyin(syl){if(!syl) return '';const m=String(syl).toLowerCase().match(/^([a-züêv]+)([0-5])?$/);if(!m) return '';let s=m[1].replace(/ü/g,'v');const t=m[2]||'5';if(FULL[s]) return FULL[s]+(TONE[t]||'');let sm='',ym=s;if(s.startsWith('zh')||s.startsWith('ch')||s.startsWith('sh')){sm=s.slice(0,2);ym=s.slice(2);}else if('bpmfdtnlgkhjqxrzcs'.includes(s[0])){sm=s[0];ym=s.slice(1);}if(sm==='j'||sm==='q'||sm==='x'){if(ym==='u') ym='v';else if(ym==='ue') ym='ve';else if(ym==='uan') ym='van';else if(ym==='un') ym='vn';}const a=SM[sm]||'',b=YM[ym]||'';if(!a&&!b) return '';return a+b+(TONE[t]||'');}
function zhuyinOf(text,warns,title){if(!text) return '';if(typeof pinyinPro==='undefined'){warns.add('注音未載入');return '';}const out=[];for(const ch of [...text]){if(!/[\u3400-\u4dbf\u4e00-\u9fff]/.test(ch)) continue;let py='';try{py=pinyinPro.pinyin(ch,{toneType:'num',v:true,type:'array'})[0]||'';}catch(e){}const z=toZhuyin(py);if(!z) warns.add(`「${ch}」查不到讀音`);out.push(z||'？');}return out.join(' ');}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* 文字解析 */
const hasPunct=s=>/[，。！？、；：,.!?;:]/.test(s);
function parseBlock(lines){let title='',author='',start=0;if(lines.length){const first=lines[0];if(!hasPunct(first)&&first.length<=16){const parts=first.split(/[\s　｜|·・]+/).filter(Boolean);if(parts.length>=2){title=parts[0];author=parts.slice(1).join('');}else{title=first;}start=1;if(!author&&lines[1]){let cand=lines[1].replace(/[〔\[（(【〕\]）)】]/g,'').trim();cand=cand.replace(/^(唐|宋|元|明|清|近代|現代)[\s·・]?/,'').trim();if(cand&&cand.length<=4&&!hasPunct(cand)){author=cand;start=2;}}}}return {title,author,body:lines.slice(start).join('')};}
function splitSentences(body){const clean=body.replace(/\s/g,'');let out=[];const re=/[^，。！？；：,.!?;:]+[，。！？；：,.!?;:]*/g;let m;while((m=re.exec(clean))){const s=m[0].trim();if(s) out.push(s);}if(out.length===1&&out[0].replace(/[，。！？；：,.!?;:]/g,'').length>=10){const raw=out[0].replace(/[，。！？；：,.!?;:]/g,'');for(const len of [5,7]){if(raw.length%len===0&&raw.length>=len*2){const parts=[];for(let i=0;i<raw.length;i+=len) parts.push(raw.slice(i,i+len));out=parts.map((p,idx)=>p+(idx%2===0?'，':'。'));break;}}}return out;}

function parsePoemsText(raw){const blocks=raw.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);const warns=new Set();const poems=[];const stamp=Date.now();blocks.forEach((block,bi)=>{const lines=block.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length) return;const {title,author,body}=parseBlock(lines);const sents=splitSentences(body);if(!sents.length) return;const poemLines=[];sents.forEach(s=>{const {t,p}=splitTextPunct(s);if(!t) return;poemLines.push({t,z:zhuyinOf(t,warns,title||`第${bi+1}首`),p});});if(!poemLines.length) return;poems.push({id:'custom_'+stamp+'_'+(bi+1),title:title||('未命名'+(bi+1)),author:author||'',art:'📜',sticker:'📜',story:'',poetInfo:null,words:[],custom:true,lines:poemLines});});return {poems,warns};}

  {id:'friend_all_eras',emoji:'🏛️',name:'三朝通',desc:'三朝代都玩',check:()=>{const e=progress.__friendErasPlayed__||{};return e['初唐']&&e['盛唐']&&e['中唐'];}},
  {id:'reader',emoji:'🎤',name:'朗讀小將',desc:'讀好一整首詩',check:()=>!!progress.__readPerfect__},
  {id:'reader_5',emoji:'🎙️',name:'小小播音員',desc:'讀好 5 首詩',check:()=>Object.keys(progress.__readGoodPoems__||{}).length>=5},

function hasAch(id){return !!(progress.__achievements__&&progress.__achievements__[id]);}
function grantAch(id){if(hasAch(id)) return false;if(!progress.__achievements__) progress.__achievements__={};progress.__achievements__[id]=Date.now();saveProgress();const a=ACHIEVEMENTS.find(x=>x.id===id);if(a){setTimeout(()=>{soundEngine.ach();vibrate([50,30,50,30,100]);showAchToast(a);},400);}return true;}
function checkAchievements(){ACHIEVEMENTS.forEach(a=>{if(!hasAch(a.id)&&a.check()) grantAch(a.id);});}
function showAchToast(a){let el=document.querySelector('.ach-toast');if(!el){el=document.createElement('div');el.className='ach-toast';document.body.appendChild(el);}el.innerHTML=`<span class="toast-emoji">${a.emoji}</span>解鎖成就：${escapeHtml(a.name)}<br><small style="font-size:11.5px;opacity:.9;">${escapeHtml(a.desc)}</small>`;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3200);speakAsync('太棒了，解鎖成就'+a.name,{rate:0.85,pitch:1.5});}

/* 持久化 */
const LS_CUSTOM='ts_custom_poems',LS_PROGRESS='ts_progress',LS_SETTINGS='ts_settings';
function loadCustomPoems(){try{const raw=localStorage.getItem(LS_CUSTOM);if(!raw) return [];const arr=JSON.parse(raw);if(!Array.isArray(arr)) return [];return arr.filter(p=>p&&p.id&&p.title&&Array.isArray(p.lines)&&p.lines.length).map(p=>({id:p.id,title:p.title,author:p.author||'',art:p.art||'📜',sticker:p.sticker||'📜',story:p.story||'',poetInfo:p.poetInfo||null,words:Array.isArray(p.words)?p.words:[],custom:true,lines:p.lines.map(ln=>({t:ln.t||'',z:ln.z||'',p:ln.p||''}))}));}catch(e){return [];}}
function saveCustomPoems(){try{localStorage.setItem(LS_CUSTOM,JSON.stringify(customPoems));}catch(e){}}
function loadProgress(){try{const raw=localStorage.getItem(LS_PROGRESS);const obj=raw?JSON.parse(raw):{};return (obj&&typeof obj==='object')?obj:{};}catch(e){return {};}}
function saveProgress(){try{localStorage.setItem(LS_PROGRESS,JSON.stringify(progress));}catch(e){}}
function loadSettings(){try{const raw=localStorage.getItem(LS_SETTINGS);const obj=raw?JSON.parse(raw):{};return Object.assign({font:'medium',speechRate:'normal',continuousDays:0,lastVisitDate:''},obj||{});}catch(e){return {font:'medium',speechRate:'normal',continuousDays:0,lastVisitDate:''};}}
function saveSettings(){try{localStorage.setItem(LS_SETTINGS,JSON.stringify(settings));}catch(e){}}

function getProg(id){const p=progress[id];if(!p||typeof p!=='object') return {learn:false,fill:false,order:false};return p;}
function markDone(id,key){const p=getProg(id);p[key]=true;if(p.learn&&p.fill&&p.order&&!p.masteredAt){p.masteredAt=Date.now();p.reviewLevel=0;p.nextReview=Date.now()+86400000;}progress[id]=p;saveProgress();checkAchievements();checkCertificate();}
function addWrongChar(ch){if(!ch) return;if(!progress.__wrongChars__) progress.__wrongChars__={};progress.__wrongChars__[ch]=(progress.__wrongChars__[ch]||0)+1;saveProgress();}
function addRightChar(ch){if(!ch||!progress.__wrongChars__) return;const w=progress.__wrongChars__;if(w[ch]&&w[ch]>0){w[ch]=w[ch]-1;if(w[ch]<=0) delete w[ch];saveProgress();}}
function getWrongChars(){const w=progress.__wrongChars__||{};return Object.entries(w).sort((a,b)=>b[1]-a[1]);}
function recordWrittenChar(ch){if(!progress.__writtenChars__) progress.__writtenChars__={};progress.__writtenChars__[ch]=Date.now();saveProgress();checkAchievements();}
function recordDailyVisit(){const today=new Date().toDateString();if(settings.lastVisitDate===today) return;const y=new Date(Date.now()-86400000).toDateString();if(settings.lastVisitDate===y) settings.continuousDays=(settings.continuousDays||0)+1;else settings.continuousDays=1;settings.lastVisitDate=today;saveSettings();checkAchievements();}
let lastActivity=Date.now();
function trackActivity(){lastActivity=Date.now();}
function startTimeTracker(){setInterval(()=>{if(document.visibilityState!=='visible') return;if(Date.now()-lastActivity>60000) return;const today=new Date().toDateString();if(!progress.__timeLog__) progress.__timeLog__={};progress.__timeLog__[today]=(progress.__timeLog__[today]||0)+15;saveProgress();},15000);}
function getTodayTime(){const t=new Date().toDateString();return (progress.__timeLog__&&progress.__timeLog__[t])||0;}
function getTotalTime(){const log=progress.__timeLog__||{};return Object.values(log).reduce((a,b)=>a+b,0);}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;if(m<1) return s+' 秒';if(m<60) return m+' 分鐘';const h=Math.floor(m/60);return h+' 小時 '+(m%60)+' 分';}
function isAllMastered(){return POEMS.length>0&&countMastered()===POEMS.length;}

function getSpeechRate(){return RATE_MAP[settings.speechRate]||0.82;}

let toastTimer=null;
function toast(msg){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=msg;requestAnimationFrame(()=>el.classList.add('show'));clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}

/* 語音 */
function pickVoice(){if(!('speechSynthesis' in window)) return null;const vs=speechSynthesis.getVoices();if(!vs.length) return null;const tw=vs.filter(v=>/zh[-_]TW|zh[-_]Hant/i.test(v.lang||''));const zh=vs.filter(v=>/^zh/i.test(v.lang||''));const f=tw.find(v=>/Mei|Xiao|Yu|Han|女|Female/i.test(v.name||''));return f||tw[0]||zh[0]||null;}
if('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged',()=>pickVoice());
function speakAsync(text,opts){opts=opts||{};return new Promise(resolve=>{if(!state.soundOn||!('speechSynthesis' in window)||!text){resolve();return;}try{speechSynthesis.cancel();}catch(e){}const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=opts.rate!==undefined?opts.rate:getSpeechRate();u.pitch=opts.pitch!==undefined?opts.pitch:1.42;u.volume=1;const v=pickVoice();if(v) u.voice=v;let done=false;const finish=()=>{if(!done){done=true;resolve();}};u.onend=finish;u.onerror=finish;setTimeout(finish,12000);try{speechSynthesis.speak(u);}catch(e){finish();}});}
soundBtn.addEventListener('click',()=>{state.soundOn=!state.soundOn;soundBtn.textContent=state.soundOn?'🔊':'🔇';if(!state.soundOn&&'speechSynthesis' in window) speechSynthesis.cancel();});

/* 輔助 */
function artHTML(p){const raw=String(p.svg||p.art||'').trim();if(raw.startsWith('<svg')) return raw;if(/^(https?:|data:)/.test(raw)) return `<img src="${raw}" alt="" style="width:100%;display:block">`;if(raw) return `<div class="art-emoji">${raw}</div>`;return `<div class="art-emoji">📜</div>`;}
function rubyHTML(ln,blankIdx,reveal,clickable){if(blankIdx===undefined) blankIdx=-1;if(reveal===undefined) reveal=null;const chars=ln.t.split('');const zs=ln.z.split(' ');let html=chars.map((c,i)=>{if(i===blankIdx&&!reveal) return `<span class="blank">？</span>`;const ch=(i===blankIdx&&reveal)?reveal:c;return `<ruby class="${clickable?'ch':''}" data-ch="${ch}" data-zy="${zs[i]||''}">${ch}<rt>${zs[i]||''}</rt></ruby>`;}).join('');if(ln.p) html+=`<span class="punct">${ln.p}</span>`;return html;}
function isPoemMastered(id){const p=getProg(id);return !!(p.learn&&p.fill&&p.order);}

      ${POEMS.map((p,i)=>{const pr=getProg(p.id);const done=[pr.learn,pr.fill,pr.order].filter(Boolean).length;const mastered=done===3;return `<button class="chapter ${p.custom?'custom':''}" data-i="${i}">${p.custom?'<span class="ch-badge">自訂</span>':''}<div class="ch-art">${artHTML(p)}</div><div class="ch-num">第 ${i+1} 章 ${mastered?'· 已掌握 🎉':''}</div><div class="ch-title">${escapeHtml(p.title)}</div><div class="ch-author">${escapeHtml(p.author||'　')}</div><div class="ch-stars">${'⭐'.repeat(done)}${'☆'.repeat(3-done)}</div></button>`;}).join('')}
      <button class="chapter add-chapter" id="addPoemBtn"><div class="add-icon">＋</div><div class="ch-title">加入新詩</div><div class="ch-author">貼上詩詞自動生成</div></button>
    </div>
    <div class="parent-link"><button id="parentBtn">👨‍👩‍👧 家長中心</button></div>
  `;
  view.querySelectorAll('.chapter[data-i]').forEach(btn=>{btn.addEventListener('click',()=>{soundEngine.click();openPoem(+btn.dataset.i);});});
  document.getElementById('addPoemBtn').addEventListener('click',()=>{soundEngine.click();openAddModal();});
  document.getElementById('reviewBtn').addEventListener('click',()=>{soundEngine.click();startReview();});
  document.getElementById('stickerBtn').addEventListener('click',()=>{soundEngine.click();openStickerModal();});
  document.getElementById('achBtn').addEventListener('click',()=>{soundEngine.click();openAchievementModal();});

  document.getElementById('friendBtn').addEventListener('click',()=>{soundEngine.click();openFriendMenu();});
  document.getElementById('readBtn').addEventListener('click',()=>{soundEngine.click();openReadMenu();});
  document.getElementById('parentBtn').addEventListener('click',openParentModal);
}

/* 詩頁 */
function openPoem(i){state.poemIndex=i;state.step='learn';state.fillQueue=null;state.fill=null;state.order=null;renderPoem();}
function renderPoem(){
  const p=POEMS[state.poemIndex];
  homeBtn.style.visibility='visible';
  topTitle.textContent=p.title;
  const steps=[{k:'learn',icon:'📖',label:'讀一讀'},{k:'fill',icon:'✏️',label:'填一填'},{k:'order',icon:'🧩',label:'排排看'}];
  view.innerHTML=`
    <div class="poem-view">
      ${p.custom?`<div class="poem-tools"><span class="custom-badge">✨ 自訂詩</span><button class="del-btn" id="delPoemBtn">🗑️ 刪除</button></div>`:''}
      <div class="poem-card"><div class="poem-art">${artHTML(p)}</div><div class="poem-meta"><h2>${escapeHtml(p.title)}</h2><div class="author-line">${escapeHtml(p.author||'　')}${p.poetInfo?'<button class="poet-chip" id="poetBtn">📖 認識詩人</button>':''}</div></div></div>
      <div class="steps">${steps.map(s=>`<button class="step ${state.step===s.k?'on':''}" data-step="${s.k}">${s.icon} ${s.label}</button>`).join('')}</div>
      <div id="stage" class="stage"></div>
    </div>
  `;
  if(p.custom) document.getElementById('delPoemBtn').addEventListener('click',()=>deleteCustomPoem(p.id));
  if(p.poetInfo) document.getElementById('poetBtn').addEventListener('click',()=>{soundEngine.click();openPoetModal(p);});
  view.querySelectorAll('.step').forEach(btn=>{btn.addEventListener('click',()=>{soundEngine.click();if('speechSynthesis' in window) speechSynthesis.cancel();const k=btn.dataset.step;if(k!==state.step){state.fillQueue=null;state.fill=null;state.order=null;}state.step=k;renderPoem();});});
  renderStage();
}
function deleteCustomPoem(id){if(!confirm('確定要刪除？')) return;customPoems=customPoems.filter(p=>p.id!==id);saveCustomPoems();delete progress[id];saveProgress();rebuildPoems();toast('已刪除');renderHome();}
function renderStage(){const stage=document.getElementById('stage');if(!stage) return;if(state.step==='learn') renderLearn(stage);else if(state.step==='fill') renderFill(stage);else renderOrder(stage);}

/* 讀一讀 */
function renderLearn(stage){
  const p=POEMS[state.poemIndex];
  const hasStory=!!p.story;const hasWords=Array.isArray(p.words)&&p.words.length>0;
  stage.innerHTML=`
    <div class="game-title">✦ 點句子聽整句，點字聽單字 ✦</div>
    <div class="lines">${p.lines.map((ln,i)=>`<button class="line" data-i="${i}">${rubyHTML(ln,-1,null,true)}</button>`).join('')}</div>
    ${hasStory?`<div class="story-box" id="storyBox"><p>💡 ${escapeHtml(p.story)}</p><button class="story-speaker" id="storySpeak">🔊 聽故事</button></div>`:`${p.custom?`<button class="add-story-btn" id="editStoryBtn">📝 加故事</button>`:''}`}
    ${hasWords?`<div class="words-box" id="wordsBox"><div class="words-title">📚 難詞小辭典</div><div class="words-grid">${p.words.map((w,i)=>`<button class="word-chip" data-widx="${i}"><span class="w-char">${escapeHtml(w.w)}</span><span class="w-py">${escapeHtml(w.py||'')}</span></button>`).join('')}</div><div class="word-detail" id="wordDetail"></div></div>`:''}
    <div class="actions"><button class="btn write" id="writeBtn">✍️ 練習寫字</button><button class="btn read" id="readPoemBtn">🎤 朗讀這首</button></div>
    <div class="actions">${hasStory?`<button class="btn ghost" id="storyToggle">💡 詩在說什麼</button>`:''}${hasWords?`<button class="btn ghost" id="wordsToggle">📚 難詞小辭典</button>`:''}<button class="btn primary" id="readAll">🔊 朗讀全詩</button></div>
    <div class="actions"><button class="btn next" id="nextBtn" style="flex:1;">下一關 →</button></div>
  `;
  if(hasStory){
    stage.querySelector('#storyToggle').addEventListener('click',()=>{soundEngine.click();const b=stage.querySelector('#storyBox');b.classList.toggle('show');if(b.classList.contains('show')) speakAsync(p.story,{rate:getSpeechRate(),pitch:1.42});});
    stage.querySelector('#storySpeak').addEventListener('click',()=>{soundEngine.click();speakAsync(p.story,{rate:getSpeechRate(),pitch:1.42});});
  } else if(p.custom){stage.querySelector('#editStoryBtn').addEventListener('click',()=>{soundEngine.click();openStoryModal(p.id,p.story||'');});}
  if(hasWords){
    stage.querySelector('#wordsToggle').addEventListener('click',()=>{soundEngine.click();stage.querySelector('#wordsBox').classList.toggle('show');});
    stage.querySelectorAll('.word-chip').forEach(btn=>{btn.addEventListener('click',()=>{soundEngine.click();const idx=+btn.dataset.widx;const w=p.words[idx];const d=stage.querySelector('#wordDetail');d.innerHTML=`<div class="wd-head"><span class="wd-char">${escapeHtml(w.w)}</span><span class="wd-py">${escapeHtml(w.py||'')}</span><button class="story-speaker" id="spkW" style="margin-left:auto;padding:6px 12px;font-size:12px;">🔊</button></div><div class="wd-mean"><b>意思：</b>${escapeHtml(w.mean||'')}</div>${w.ex?`<div class="wd-ex"><b>例：</b>${escapeHtml(w.ex)}</div>`:''}`;d.classList.add('show');setTimeout(()=>{const s=d.querySelector('#spkW');if(s) s.addEventListener('click',()=>speakAsync(w.w,{rate:0.7,pitch:1.45}));},20);speakAsync(`${w.w}，${w.mean||''}`,{rate:getSpeechRate()*0.95,pitch:1.42});});});
  }
  stage.querySelectorAll('.line').forEach(lineEl=>{lineEl.addEventListener('click',async e=>{const ruby=e.target.closest('ruby');if(ruby){const ch=ruby.dataset.ch;const zy=ruby.dataset.zy;ruby.classList.add('lit');await speakAsync(ch,{rate:0.72,pitch:1.5});if(zy) await speakAsync(zy,{rate:0.68,pitch:1.4});setTimeout(()=>ruby.classList.remove('lit'),300);return;}const i=+lineEl.dataset.i;soundEngine.click();highlightLine(stage,i);await speakLineWithHighlight(lineEl,p.lines[i]);});});
  stage.querySelector('#writeBtn').addEventListener('click',()=>{soundEngine.click();openCharPicker(p);});
  stage.querySelector('#readPoemBtn').addEventListener('click',()=>{soundEngine.click();startReadTest(p);});
  stage.querySelector('#readAll').addEventListener('click',()=>{soundEngine.click();readWhole(stage);});
  stage.querySelector('#nextBtn').addEventListener('click',()=>{soundEngine.click();markDone(p.id,'learn');state.step='fill';renderPoem();});
}
function highlightLine(stage,idx){stage.querySelectorAll('.line').forEach((el,i)=>el.classList.toggle('active',i===idx));}
async function speakLineWithHighlight(lineEl,line){if(state.reading) return;state.reading=true;const rubies=[...lineEl.querySelectorAll('ruby')];rubies.forEach(r=>r.classList.remove('lit'));const speakP=speakAsync(lineText(line),{rate:getSpeechRate()*0.92,pitch:1.45});const perChar=Math.max(380,Math.min(700,5200/Math.max(1,rubies.length)));for(const r of rubies){r.classList.add('lit');await sleep(perChar);}await speakP;await sleep(500);rubies.forEach(r=>r.classList.remove('lit'));state.reading=false;}
async function readWhole(stage){if(state.reading) return;const p=POEMS[state.poemIndex];state.reading=true;for(let i=0;i<p.lines.length;i++){if(state.step!=='learn') break;highlightLine(stage,i);const lineEl=stage.querySelector(`.line[data-i="${i}"]`);if(!lineEl) break;const rubies=[...lineEl.querySelectorAll('ruby')];rubies.forEach(r=>r.classList.remove('lit'));await speakAsync(lineText(p.lines[i]),{rate:getSpeechRate()*0.92,pitch:1.45});for(const r of rubies){r.classList.add('lit');await sleep(90);}await sleep(700);rubies.forEach(r=>r.classList.remove('lit'));await sleep(200);}highlightLine(stage,-1);state.reading=false;}

/* 寫字 */
const writeModal=document.getElementById('writeModal');
const writeBox=document.getElementById('writeBox');
let writeState=null;
function openCharPicker(p){
  const chars=[];p.lines.forEach((ln,li)=>{ln.t.split('').forEach((ch,ci)=>{if(!chars.find(x=>x.ch===ch)) chars.push({ch,zy:ln.z.split(' ')[ci]||''});});});
  if(!chars.length){toast('沒有可寫的字');return;}
  writeBox.innerHTML=`<div class="write-header"><div class="write-char-info"><div class="wc-char">✍️ 選一個字</div><div class="wc-py">寫過會打勾 ✓</div></div><button class="write-close" id="writeClose">關閉</button></div><div class="write-char-picker">${chars.map(c=>{const w=progress.__writtenChars__&&progress.__writtenChars__[c.ch];return `<button class="wc-pick ${w?'done':''}" data-ch="${escapeHtml(c.ch)}" data-zy="${escapeHtml(c.zy)}">${escapeHtml(c.ch)}</button>`;}).join('')}</div>`;
  writeBox.querySelector('#writeClose').addEventListener('click',closeWriteModal);
  writeBox.querySelectorAll('.wc-pick').forEach(btn=>{btn.addEventListener('click',()=>{soundEngine.click();openWritingPad(btn.dataset.ch,btn.dataset.zy);});});
  writeModal.classList.add('show');
}
function openWritingPad(ch,zy){
  writeState={char:ch,drawn:false};
  writeBox.innerHTML=`<div class="write-header"><button class="write-close" id="writeBack" style="background:#fff8e6;color:#c98a00;">← 換字</button><div class="write-char-info"><div class="wc-char">${escapeHtml(ch)}</div><div class="wc-py">${escapeHtml(zy||'')}</div></div><button class="write-close" id="writeClose">關閉</button></div><div class="canvas-stack" id="canvasStack"><canvas id="bgCanvas"></canvas><canvas id="fgCanvas"></canvas></div><div class="write-actions"><button class="w-clear" id="wClear">🧹 清除</button><button class="w-done" id="wDone">✅ 我寫好了</button></div>`;
  writeBox.querySelector('#writeClose').addEventListener('click',closeWriteModal);
  writeBox.querySelector('#writeBack').addEventListener('click',()=>openCharPicker(POEMS[state.poemIndex]));
  speakAsync(`請寫${ch}`,{rate:getSpeechRate(),pitch:1.42});
  setTimeout(()=>setupCanvas(ch),50);
}
function setupCanvas(ch){
  const stack=document.getElementById('canvasStack'),bg=document.getElementById('bgCanvas'),fg=document.getElementById('fgCanvas');
  if(!stack||!bg||!fg) return;
  const rect=stack.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=rect.width,h=rect.height;
  [bg,fg].forEach(c=>{c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';});
  const bctx=bg.getContext('2d'),fctx=fg.getContext('2d');
  bctx.scale(dpr,dpr);fctx.scale(dpr,dpr);
  bctx.fillStyle='#ffe6f0';bctx.font=`bold ${w*0.7}px "Noto Sans TC",sans-serif`;bctx.textAlign='center';bctx.textBaseline='middle';bctx.fillText(ch,w/2,h/2);
  bctx.strokeStyle='#ffe0ec';bctx.lineWidth=1.5;bctx.beginPath();bctx.moveTo(w/2,0);bctx.lineTo(w/2,h);bctx.moveTo(0,h/2);bctx.lineTo(w,h/2);bctx.stroke();
  fctx.strokeStyle='#e26a8d';fctx.lineWidth=Math.max(8,w*0.05);fctx.lineCap='round';fctx.lineJoin='round';
  let drawing=false,lastX=0,lastY=0;
  const start=e=>{e.preventDefault();drawing=true;writeState.drawn=true;const p=getPos(e,fg);lastX=p.x;lastY=p.y;};
  const move=e=>{if(!drawing) return;e.preventDefault();const p=getPos(e,fg);fctx.beginPath();fctx.moveTo(lastX,lastY);fctx.lineTo(p.x,p.y);fctx.stroke();lastX=p.x;lastY=p.y;};
  const end=()=>{if(drawing){drawing=false;soundEngine.stroke();}};
  fg.addEventListener('mousedown',start);fg.addEventListener('mousemove',move);fg.addEventListener('mouseup',end);fg.addEventListener('mouseleave',end);
  fg.addEventListener('touchstart',start,{passive:false});fg.addEventListener('touchmove',move,{passive:false});fg.addEventListener('touchend',end);
  document.getElementById('wClear').addEventListener('click',()=>{soundEngine.click();fctx.clearRect(0,0,w,h);writeState.drawn=false;});
  document.getElementById('wDone').addEventListener('click',()=>{
    if(!writeState.drawn){toast('先描描看吧～');return;}
    soundEngine.correct();vibrate(50);recordWrittenChar(ch);
    speakAsync(`${ch}，寫得真好！`,{rate:getSpeechRate(),pitch:1.5});
    toast('🎉 寫得真好！');
    setTimeout(()=>openCharPicker(POEMS[state.poemIndex]),1200);
  });
}
function getPos(e,canvas){const rect=canvas.getBoundingClientRect();const t=e.touches&&e.touches[0]?e.touches[0]:e;return {x:t.clientX-rect.left,y:t.clientY-rect.top};}
function closeWriteModal(){writeModal.classList.remove('show');writeState=null;}
writeModal.addEventListener('click',e=>{if(e.target===writeModal) closeWriteModal();});

/* 填一填 */
function renderFill(stage){
  const p=POEMS[state.poemIndex];
  if(!state.fillQueue){state.fillQueue=shuffle([...p.lines.keys()]).slice(0,3);state.fillIdx=0;state.fill=null;}
  if(state.fillIdx>=state.fillQueue.length){markDone(p.id,'fill');state.fillQueue=null;state.step='order';renderPoem();return;}
  if(!state.fill) state.fill=newFillRound(state.fillQueue[state.fillIdx],state.difficulty);
  const f=state.fill;const ln=p.lines[f.li];const isS=f.mode==='hard';
  stage.innerHTML=`
    <div class="game-title">✦ ${isS?'這一句是哪一句呢？':'少了哪一個字呢？'} ✦</div>
    <div class="diff-row">
      <button class="diff-btn ${state.difficulty==='easy'?'on easy':''}" data-d="easy"><span class="d-emoji">🍎</span><span class="d-name">簡單</span><span class="d-desc">3 選項</span></button>
      <button class="diff-btn ${state.difficulty==='medium'?'on medium':''}" data-d="medium"><span class="d-emoji">🍊</span><span class="d-name">中等</span><span class="d-desc">5 選項</span></button>
      <button class="diff-btn ${state.difficulty==='hard'?'on hard':''}" data-d="hard"><span class="d-emoji">🍇</span><span class="d-name">困難</span><span class="d-desc">選句子</span></button>
    </div>
    <div class="big-speaker"><button class="speaker-btn" id="playLine">🔊</button><div class="speaker-label">點我聽整句</div></div>
    <div class="fill-line" id="fillLine">${isS?`<span class="blank" style="font-size:1em;min-width:auto;">？？？？？</span>`:rubyHTML(ln,f.ci)}</div>
    <div class="options" id="opts">${isS?makeSOpts(f):makeCOpts(f,ln)}</div>
    ${isS?'':'<button class="hint-btn" id="hintBtn">💡 提示</button>'}
    <div class="feedback" id="fb"></div>
  `;
  stage.querySelectorAll('.diff-btn').forEach(btn=>{btn.addEventListener('click',()=>{if(btn.dataset.d===state.difficulty) return;soundEngine.click();state.difficulty=btn.dataset.d;state.fillQueue=shuffle([...p.lines.keys()]).slice(0,3);state.fillIdx=0;state.fill=null;renderStage();});});
  stage.querySelector('#playLine').addEventListener('click',async e=>{soundEngine.click();const b=e.currentTarget;b.classList.add('playing');await speakAsync(lineText(ln),{rate:getSpeechRate()*0.9,pitch:1.45});b.classList.remove('playing');});
  if(isS){
    stage.querySelectorAll('.sentence-opt').forEach(btn=>{btn.addEventListener('click',async()=>{if(f.solved) return;const s=btn.dataset.s;await speakAsync(s,{rate:getSpeechRate()*0.9,pitch:1.45});if(s===lineText(ln)) onCorrect(btn,stage,true);else{btn.classList.add('wrong');soundEngine.wrong();vibrate([30,50,30]);setTimeout(()=>btn.classList.remove('wrong'),500);speakAsync('再聽一次喔',{rate:0.85,pitch:1.4});}});});
  } else {
    stage.querySelectorAll('.opt').forEach(btn=>{btn.addEventListener('click',async()=>{const c=btn.dataset.c;await speakAsync(c,{rate:0.72,pitch:1.5});if(c===f.answer&&!f.solved) onCorrect(btn,stage,false);else if(!f.solved){btn.classList.add('wrong');addWrongChar(c);soundEngine.wrong();vibrate([30,50,30]);setTimeout(()=>btn.classList.remove('wrong'),500);speakAsync('再聽一次喔',{rate:0.85,pitch:1.4});}});});
    const hb=stage.querySelector('#hintBtn');if(hb) hb.addEventListener('click',async()=>{soundEngine.click();if(f.solved) return;await speakAsync(`這個字念 ${f.answerZ}`,{rate:0.7,pitch:1.45});});
  }
  setTimeout(()=>{if(state.step==='fill'&&state.fill===f&&!f.played){f.played=true;speakAsync(lineText(ln),{rate:getSpeechRate()*0.9,pitch:1.45});}},400);
}
function makeCOpts(f,ln){return f.opts.map(o=>{const zy=(ln.z.split(' ')[ln.t.indexOf(o)])||'';return `<button class="opt" data-c="${o}"><span class="opt-char">${o}</span><span class="opt-zhuyin">${zy}</span></button>`;}).join('');}
function makeSOpts(f){return f.sentenceOpts.map(s=>`<button class="sentence-opt" data-s="${escapeHtml(s)}"><span class="s-sound">🔊</span><span class="s-text">${escapeHtml(s)}</span></button>`).join('');}
function newFillRound(li,difficulty){
  const p=POEMS[state.poemIndex];const ln=p.lines[li];
  if(difficulty==='hard'){
    const correct=lineText(ln);const others=p.lines.map(l=>lineText(l)).filter(t=>t!==correct);shuffle(others);
    return {li,mode:'hard',sentenceOpts:shuffle([correct,...others.slice(0,3)]),solved:false,played:false};
  }
  const chars=ln.t.split('');const ci=Math.floor(Math.random()*chars.length);const answer=chars[ci];const answerZ=(ln.z.split(' ')[ci])||'';
  const allChars=[...new Set(p.lines.map(l=>l.t).join('').split(''))].filter(c=>c!==answer);shuffle(allChars);
  const cnt=difficulty==='medium'?5:3;
  return {li,ci,answer,answerZ,opts:shuffle([answer,...allChars.slice(0,cnt-1)]),solved:false,played:false,mode:difficulty};
}
async function onCorrect(btn,stage,isS){
  const p=POEMS[state.poemIndex];const f=state.fill;if(!f||f.solved) return;
  f.solved=true;btn.classList.add('correct');
  if(isS){stage.querySelectorAll('.sentence-opt').forEach(b=>b.disabled=true);const fl=stage.querySelector('#fillLine');fl.innerHTML=rubyHTML(p.lines[f.li]);fl.classList.add('solved');}
  else{stage.querySelectorAll('.opt').forEach(b=>b.disabled=true);const hb=stage.querySelector('#hintBtn');if(hb) hb.style.display='none';const fl=stage.querySelector('#fillLine');fl.innerHTML=rubyHTML(p.lines[f.li],f.ci,f.answer);fl.classList.add('solved');addRightChar(f.answer);}
  soundEngine.correct();vibrate(50);
  stage.querySelector('#fb').textContent='🎉 答對了！';
  await speakAsync(lineText(p.lines[f.li]),{rate:getSpeechRate(),pitch:1.45});
  setTimeout(()=>{state.fillIdx++;state.fill=null;renderStage();},1600);
}

/* 排排看 */
function renderOrder(stage){const p=POEMS[state.poemIndex];if(!state.order) state.order={pool:shuffle([...p.lines.keys()]),placed:[],wrongCount:0};drawOrder(stage,p,state.order);}
function drawOrder(stage,p,o){
  const finished=o.placed.length===p.lines.length;const nextIdx=o.placed.length;const targetLine=p.lines[nextIdx];
  stage.innerHTML=`
    <div class="game-title">✦ 聽一聽，找出正確的句子 ✦</div>
    ${finished?'':`<div class="order-hint"><div class="hint-text">請找出第 ${nextIdx+1} 句</div><button class="speaker-btn" id="playTarget">🔊</button></div>`}
    <div class="slots">${p.lines.map((_,i)=>{const li=o.placed[i];return `<div class="slot ${li!==undefined?'filled':''}"><span class="num">${i+1}</span>${li!==undefined?linePlain(p.lines[li]):''}</div>`;}).join('')}</div>
    <div class="pool">${o.pool.map(li=>`<button class="chip" data-li="${li}"><span class="chip-sound">🔊</span><span class="chip-text">${linePlain(p.lines[li])}</span></button>`).join('')}</div>
    <div class="feedback" id="fb">${finished?'🎉 全部完成！':''}</div>
  `;
  if(finished) return;
  setTimeout(()=>{if(state.step==='order'&&state.order===o&&!o.placed.includes(nextIdx)) speakAsync(lineText(targetLine),{rate:getSpeechRate()*0.9,pitch:1.45});},400);
  const pt=stage.querySelector('#playTarget');if(pt) pt.addEventListener('click',()=>{soundEngine.click();speakAsync(lineText(targetLine),{rate:getSpeechRate()*0.9,pitch:1.45});});

function toggleRecording(poem,line,micBtn,micHint){
  const r=state.read;
  if(!r) return;

  if(r.recording&&r.recognition){
    try{r.recognition.stop();}catch(e){}
    return;
  }

  if(!SPEECH_SUPPORTED){
    toast('此瀏覽器不支援語音辨識');
    return;
  }

  let rec;
  try{rec=new SpeechRecognition();}catch(e){toast('無法啟動麥克風');return;}
  rec.lang='zh-TW';
  rec.continuous=false;
  rec.interimResults=false;
  rec.maxAlternatives=3;

  r.recognition=rec;
  r.recording=true;
  micBtn.classList.add('recording');
  micHint.classList.add('recording');
  micHint.textContent='🎙️ 正在聽…請大聲讀';
  soundEngine.recStart();
  vibrate(30);

  let recognized='';
  let hasResult=false;
  let speechError=null;

  rec.onresult=(event)=>{
    hasResult=true;
    // 取最佳結果
    let best='';
    let bestConf=0;
    for(let i=0;i<event.results.length;i++){
      const res=event.results[i];
      for(let j=0;j<res.length;j++){
        if(res[j].confidence>=bestConf){
          bestConf=res[j].confidence;
          best=res[j].transcript;
        }
      }
    }
    recognized=best||'';
  };

  rec.onerror=(event)=>{
    speechError=event.error;
  };

  rec.onend=()=>{
    r.recording=false;
    r.recognition=null;
    micBtn.classList.remove('recording');
    micHint.classList.remove('recording');
    micHint.textContent='按住麥克風讀出這句';
    soundEngine.recStop();

    if(speechError){
      const msg={'not-allowed':'請允許麥克風權限','no-speech':'沒有聽到聲音，再試一次','audio-capture':'找不到麥克風','network':'網路問題','service-not-allowed':'此瀏覽器不允許使用'}[speechError]||speechError;
      micHint.textContent='❌ '+msg;
      return;
    }

    if(!hasResult||!recognized){
      micHint.textContent='沒有聽清楚，再讀一次吧';
      return;
    }

    // 計算分數
    const score=computeScore(line.text,recognized);
    r.scores.push({score,text:line.text,recognized});
    showReadResult(line,recognized,score);
  };

  try{rec.start();}catch(e){toast('麥克風啟動失敗');r.recording=false;micBtn.classList.remove('recording');micHint.classList.remove('recording');}
}

/* LCS 演算法打分 */
function computeScore(target,recognized){
  // 只保留中文字
  const clean=t=>t.replace(/[^\u4e00-\u9fff]/g,'');
  const t=clean(target);
  const r=clean(recognized);
  if(!t||!r) return 0;

  // 最長公共子序列
  const m=t.length,n=r.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(t[i-1]===r[j-1]) dp[i][j]=dp[i-1][j-1]+1;
      else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);
    }
  }
  const lcs=dp[m][n];
  // 分數 = 匹配字數 / 目標字數，最多 1
  return Math.min(1, lcs/t.length);
}

const reviewOverlay=document.getElementById('reviewOverlay'),reviewContent=document.getElementById('reviewContent'),reviewBar=document.getElementById('reviewBar'),reviewLabel=document.getElementById('reviewLabel');
document.getElementById('reviewClose').addEventListener('click',()=>{if(state.review&&state.review.qIdx>0&&state.review.qIdx<state.review.questions.length){if(!confirm('要結束複習嗎？')) return;}closeReview();});
function closeReview(){reviewOverlay.classList.remove('show');state.review=null;if('speechSynthesis' in window) speechSynthesis.cancel();renderHome();}
function buildReviewQuestions(maxQty){
  const now=Date.now();const wc=progress.__wrongChars__||{};const cand=[];
  for(const p of POEMS){const pr=getProg(p.id);if(!(pr.learn&&pr.fill&&pr.order)) continue;let weight=1;if(!pr.nextReview||pr.nextReview<=now) weight+=3;for(const ln of p.lines){for(const ch of ln.t){if(wc[ch]) weight+=wc[ch];}}cand.push({poem:p,weight});}
  if(!cand.length) return [];
  const exp=[];for(const c of cand){for(let i=0;i<c.weight;i++) exp.push(c.poem);}
  const picked=[];const seen=new Set();for(const p of shuffle(exp.slice())){if(seen.has(p.id)) continue;seen.add(p.id);picked.push(p);}
  const qs=[];
  while(qs.length<maxQty){
    let added=false;
    for(const p of picked){
      if(qs.length>=maxQty) break;
      const li=Math.floor(Math.random()*p.lines.length);const ln=p.lines[li];const ci=Math.floor(Math.random()*ln.t.length);const ans=ln.t[ci];const ansZ=(ln.z.split(' ')[ci])||'';
      const others=[...new Set(p.lines.map(l=>l.t).join('').split(''))].filter(c=>c!==ans);shuffle(others);
      qs.push({poemTitle:p.title,poemId:p.id,li,ci,answer:ans,answerZ:ansZ,opts:shuffle([ans,...others.slice(0,2)])});
      added=true;
    }
    if(!added) break;
  }
  return shuffle(qs).slice(0,maxQty);
}
function startReview(){
  const m=countMastered();if(m===0){toast('先去把一首詩的三關過完');return;}
  const all=confirm(`複習全部 ${Math.min(m*2,12)} 題嗎？\n取消可選 5 題。`);
  const qty=all?Math.min(m*2,12):5;
  const qs=buildReviewQuestions(qty);if(!qs.length){toast('沒有可複習的題目');return;}
  state.review={questions:qs,qIdx:0,correct:0,wrong:0,answered:false};
  reviewOverlay.classList.add('show');document.body.style.overflow='hidden';renderReviewQuestion();
}
function updateReviewHeader(){const r=state.review;if(!r) return;const t=r.questions.length;reviewBar.style.width=Math.min(100,(r.qIdx/t)*100)+'%';reviewLabel.textContent=`第 ${Math.min(r.qIdx+1,t)} 題 / 共 ${t} 題`;}
function renderReviewQuestion(){
  const r=state.review;if(!r) return;if(r.qIdx>=r.questions.length){renderReviewSummary();return;}
  r.answered=false;const q=r.questions[r.qIdx];updateReviewHeader();
  reviewContent.innerHTML=`<div class="review-body"><div class="review-from">出自《<b>${escapeHtml(q.poemTitle)}</b>》</div><div class="big-speaker"><button class="speaker-btn" id="reviewPlay">🔊</button><div class="speaker-label">點我聽句子</div></div><div class="fill-line" id="reviewFill">${makeReviewLineHTML(q)}</div><div class="options" id="reviewOpts">${q.opts.map(o=>{const p=POEMS.find(x=>x.id===q.poemId);let zy='';if(p){for(const ln of p.lines){const idx=ln.t.indexOf(o);if(idx>=0){zy=(ln.z.split(' ')[idx])||'';break;}}}return `<button class="opt" data-c="${o}"><span class="opt-char">${o}</span><span class="opt-zhuyin">${zy}</span></button>`;}).join('')}</div><div class="feedback" id="reviewFb"></div></div>`;
  const p=POEMS.find(x=>x.id===q.poemId);
  if(p){setTimeout(()=>{if(state.review===r&&!r.answered) speakAsync(lineText(p.lines[q.li]),{rate:getSpeechRate()*0.9,pitch:1.45});},300);}
  const pb=document.getElementById('reviewPlay');pb.addEventListener('click',()=>{soundEngine.click();if(!p) return;pb.classList.add('playing');speakAsync(lineText(p.lines[q.li]),{rate:getSpeechRate()*0.9,pitch:1.45}).then(()=>pb.classList.remove('playing'));});
  reviewContent.querySelectorAll('.opt').forEach(btn=>{btn.addEventListener('click',async()=>{if(r.answered) return;const c=btn.dataset.c;await speakAsync(c,{rate:0.72,pitch:1.5});if(c===q.answer) reviewCorrect(btn,p);else reviewWrong(btn,c);});});

function makeReviewLineHTML(q){const p=POEMS.find(x=>x.id===q.poemId);if(!p) return '';return rubyHTML(p.lines[q.li],q.ci);}
async function reviewCorrect(btn,p){
  const r=state.review;if(!r||r.answered) return;r.answered=true;r.correct++;
  btn.classList.add('correct');reviewContent.querySelectorAll('.opt').forEach(b=>b.disabled=true);

function reviewWrong(btn,ch){
  const r=state.review;if(!r||r.answered) return;r.answered=true;r.wrong++;addWrongChar(ch);
  btn.classList.add('wrong');soundEngine.wrong();vibrate([30,50,30]);
  reviewContent.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.c===r.questions[r.qIdx].answer) b.classList.add('correct');});
  const q=r.questions[r.qIdx];const p=POEMS.find(x=>x.id===q.poemId);
  const fl=reviewContent.querySelector('#reviewFill');fl.innerHTML=rubyHTML(p.lines[q.li],q.ci,q.answer);fl.classList.add('solved');
  reviewContent.querySelector('#reviewFb').textContent='💡 記住這個字喔！';
  speakAsync('記住這個字喔',{rate:0.85,pitch:1.4});
  setTimeout(()=>{r.qIdx++;renderReviewQuestion();},1700);
}
function renderReviewSummary(){
  const r=state.review;const total=r.questions.length;const pct=r.correct/total;const perfect=pct===1;
  if(perfect) progress.__hadPerfectReview__=true;
  const updated=new Set();
  for(const q of r.questions){
    if(updated.has(q.poemId)) continue;updated.add(q.poemId);
    const pr=getProg(q.poemId);if(typeof pr.reviewLevel!=='number') pr.reviewLevel=0;
    if(perfect) pr.reviewLevel=Math.min(4,pr.reviewLevel+1);
    const intervals=[1,3,7,14,30];
    pr.nextReview=Date.now()+(intervals[pr.reviewLevel]||30)*86400000;
    progress[q.poemId]=pr;
  }
