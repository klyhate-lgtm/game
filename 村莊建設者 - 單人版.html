<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村莊建設者 - 單人版</title>
    <style>
        :root {
            --bg-color: #f4e8d1;
            --text-color: #3e2723;
            --card-bg: #fff9eb;
            --border-color: #8d6e63;
            --accent: #d32f2f;
            --highlight: #fbc02d;
        }
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.1) 100%);
            color: var(--text-color);
            user-select: none;
        }
        /* 排版容器 */
        #app {
            display: flex; flex-direction: column; height: 100vh;
        }
        /* 頂部資源列 */
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: rgba(62, 39, 35, 0.9); color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 100;
        }
        .resource { font-size: 1.2rem; display: flex; align-items: center; gap: 5px; }
        .resource span { background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; }
        
        /* 主遊戲區 */
        #game-area {
            flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow: hidden;
        }
        
        /* 村莊區 (已建建築) */
        #village-container {
            flex: 1; display: flex; flex-direction: column; justify-content: center;
            background: rgba(255, 255, 255, 0.3); border: 2px dashed var(--border-color); border-radius: 10px; padding: 10px;
            overflow-x: auto; overflow-y: hidden;
        }
        .row-track {
            display: flex; flex-wrap: nowrap; gap: 5px; justify-content: flex-start; align-items: center; min-height: 150px;
        }
        .card {
            width: 120px; height: 170px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2); flex-shrink: 0; transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card.lvl-2 { border-color: silver; box-shadow: inset 0 0 10px silver; }
        .card.lvl-3 { border-color: gold; box-shadow: inset 0 0 10px gold; }
        .card-label {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: white;
            font-size: 0.7rem; text-align: center; padding: 4px; border-radius: 0 0 6px 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-cost { position: absolute; top: 5px; right: 5px; background: gold; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem;}
        
        /* 手牌區 */
        #hand-area {
            height: 180px; display: flex; align-items: center;
            overflow-x: auto; overflow-y: hidden; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 10px;
        }

        /* 底部控制列 */
        #bottom-bar {
            display: flex; justify-content: center; gap: 10px; padding: 10px; background: rgba(62, 39, 35, 0.9);
            position: relative; z-index: 100;
        }
        button {
            padding: 10px 20px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer;
            font-family: inherit; font-weight: bold; transition: 0.2s;
            background: var(--border-color); color: white;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #9e9e9e; cursor: not-allowed; opacity: 0.7; }
        button.primary { background: #d32f2f; }
        
        /* 彈窗與遮罩 */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--bg-color); padding: 20px; border-radius: 10px; max-width: 90%; max-height: 90%;
            overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 3px solid var(--border-color);
            width: 600px;
        }
        .modal h2 { margin-top: 0; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        
        /* 提示 Toast */
        #toast {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px;
            z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }

        /* 響應式 */
        @media (max-width: 768px) {
            .card { width: 90px; height: 130px; }
            .card-label { font-size: 0.6rem; }
            .resource { font-size: 1rem; }
            button { padding: 8px 12px; font-size: 0.9rem; }
        }

        /* SVG 動畫 */
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
        .svg-icon { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>

<div id="app">
    <!-- 頂部資源列 -->
    <div id="top-bar">
        <div class="resource">🪙 金幣: <span id="res-coin">2</span></div>
        <div class="resource">🪵 木頭: <span id="res-wood">0</span></div>
        <div class="resource">🪨 石頭: <span id="res-stone">0</span></div>
        <div class="resource">👷 村民: <span id="res-worker">2/2</span></div>
        <div class="resource">🏆 VP: <span id="res-vp">0</span></div>
        <div class="resource">📜 牌堆: <span id="res-deck">72</span></div>
    </div>

    <!-- 遊戲區域 -->
    <div id="game-area">
        <!-- 村莊區 -->
        <div id="village-container">
            <div class="row-track" id="village-row">
                <!-- 已建建築會顯示在這裡 -->
            </div>
        </div>
        <!-- 手牌區 -->
        <div id="hand-area">
            <!-- 手牌會顯示在這裡 -->
        </div>
    </div>

    <!-- 底部控制列 -->
    <div id="bottom-bar">
        <button id="btn-draw" class="primary" onclick="game.drawPhase()">抽牌</button>
        <button id="btn-work" onclick="game.workPhase()">派遣村民</button>
        <button id="btn-collect" onclick="game.collectPhase()">收集資源</button>
        <button id="btn-build" onclick="game.buildPhase()">建造</button>
        <button id="btn-menu" onclick="ui.toggleMenu()">選單</button>
    </div>
</div>

<!-- 彈窗 UI -->
<div id="overlay-tutorial" class="overlay active">
    <div class="modal">
        <h2>🏰 歡迎來到村莊建設者</h2>
        <div id="tutorial-text" style="line-height: 1.6; height: 300px; overflow-y: auto;">
            <!-- 打字機效果內容 -->
        </div>
        <button class="primary" style="width: 100%; margin-top: 15px;" onclick="ui.closeTutorial()">我準備好了，開始遊戲</button>
    </div>
</div>

<div id="overlay-menu" class="overlay">
    <div class="modal">
        <h2>⚙️ 遊戲選單</h2>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button onclick="game.saveGame()">💾 存檔</button>
            <button onclick="game.loadGame()">📂 讀檔</button>
            <button onclick="ui.showHistory()">📜 歷史紀錄</button>
            <button onclick="ui.toggleSound()" id="btn-sound">🔊 音效: 開</button>
            <button onclick="ui.closeMenu()">❌ 返回遊戲</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
// --- 1. 卡牌資料庫 (JSON 格式) ---
const CARD_DB = {
    // 起始建築
    "Peasant Hut": { type: "Residential", lvl: 1, cost: 2, effect: "gain_worker_1", name: "農民小屋", desc: "獲得1個額外村民(上限8)", isStart: true },
    "Lumber Hut": { type: "Industrial", lvl: "X", cost: 3, effect: "gain_wood_1", name: "木材屋", desc: "獲得1個木頭", isStart: true },
    "Ore Mine": { type: "Industrial", lvl: "X", cost: 3, effect: "gain_stone_1", name: "礦場", desc: "獲得1個石頭", isStart: true },
    
    // 其他建築
    "Bazaar": { type: "Commercial", lvl: 3, cost: 6, effect: "draw_6", name: "集市", desc: "抽牌階段抽到6張牌" },
    "Big Bazaar": { type: "Commercial", lvl: 2, cost: 7, effect: "draw_7", name: "大集市", desc: "抽牌階段抽到7張牌" },
    "Exotic Bazaar": { type: "Commercial", lvl: 3, cost: 10, effect: "draw_8", name: "異域集市", desc: "抽牌階段抽到8張牌" },
    "Market": { type: "Commercial", lvl: 1, cost: 5, effect: "trade_1", name: "市場", desc: "用1個資源換任何其他資源" },
    "Big Market": { type: "Commercial", lvl: 3, cost: 12, effect: "trade_any", name: "大市場", desc: "用任意數量資源換其他資源" },
    "Statue": { type: "Special", lvl: "U", cost: 10, effect: "vp_5", name: "雕像", desc: "遊戲結束獲得5VP", unique: true },
    "Harbor Statue": { type: "Special", lvl: "U", cost: 9, effect: "vp_3", name: "港灣雕像", desc: "遊戲結束獲得3VP", unique: true },
    "Fortress": { type: "Special", lvl: "U", cost: 10, effect: "vp_5", name: "要塞", desc: "遊戲結束獲得5VP", unique: true },
    "Surgery": { type: "Special", lvl: "U", cost: 4, effect: "immune_plague", name: "手術室", desc: "免疫瘟疫卡效果", unique: true },
    "Workshop": { type: "Special", lvl: 1, cost: 4, effect: "score_residential", name: "作坊", desc: "每相鄰1個住宅建築獲得1VP" },
    "Vineyard": { type: "Special", lvl: 1, cost: 6, effect: "score_commercial", name: "葡萄園", desc: "每相鄰1個商業建築獲得1VP" },
    "Processing": { type: "Special", lvl: 1, cost: 5, effect: "score_industrial", name: "加工場", desc: "每相鄰1個工業建築獲得1VP" },
    "Plague": { type: "Event", lvl: 0, cost: 0, effect: "event_plague", name: "瘟疫", desc: "人口降至2" },
    "Fire": { type: "Event", lvl: 0, cost: 0, effect: "event_fire", name: "火災", desc: "燒毀2棟非起始建築" }
    // 註：為精簡篇幅，此處列出核心卡牌，實際遊玩時將使用這些資料生成卡牌
};

// 輔助函數：生成隨機卡牌
function getRandomCard() {
    const keys = Object.keys(CARD_DB).filter(k => CARD_DB[k].type !== 'Event' && !CARD_DB[k].isStart);
    const randomKey = keys[Math.floor(Math.random() * keys.length)];
    return { id: 'c_' + Date.now() + Math.random(), name: randomKey, ...CARD_DB[randomKey] };
}

// --- 2. 音效系統 (Web Audio API) ---
const AudioSys = {
    ctx: null, enabled: true,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playClick() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    }
};

// --- 3. UI 控制 ---
const ui = {
    toastTimer: null,
    showToast(msg) {
        const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = 1;
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => t.style.opacity = 0, 2000);
    },
    closeTutorial() {
        AudioSys.init(); AudioSys.playClick();
        document.getElementById('overlay-tutorial').classList.remove('active');
        game.init();
    },
    toggleMenu() { AudioSys.playClick(); document.getElementById('overlay-menu').classList.add('active'); },
    closeMenu() { AudioSys.playClick(); document.getElementById('overlay-menu').classList.remove('active'); },
    toggleSound() {
        AudioSys.enabled = !AudioSys.enabled;
        document.getElementById('btn-sound').innerText = AudioSys.enabled ? "🔊 音效: 開" : "🔇 音效: 關";
    },
    showHistory() { this.showToast("歷史紀錄功能開發中"); },
    // 打字機效果
    typeWriter(text, element, speed = 30) {
        let i = 0; element.innerHTML = '';
        const timer = setInterval(() => {
            if (i < text.length) { element.innerHTML += text.charAt(i); i++; }
            else { clearInterval(timer); }
        }, speed);
    }
};

// --- 4. 遊戲核心 (狀態機) ---
const game = {
    state: 'INIT', // INIT, DRAW, WORK, COLLECT, BUILD, GAMEOVER
    deck: [],
    discard: [],
    hand: [],
    village: [], // 存放已建建築的陣列 (簡化為一維，以相鄰計算)
    resources: { coin: 2, wood: 0, stone: 0 },
    workers: 2, maxWorkers: 2,
    handLimit: 5,
    plagueInDeck: false,
    fireInDeck: false,

    init() {
        this.state = 'DRAW';
        this.deck = [];
        this.hand = [];
        this.village = [];
        this.resources = { coin: 2, wood: 0, stone: 0 };
        
        // 起始設定
        this.village.push({ id: 'start1', name: 'Peasant Hut', ...CARD_DB['Peasant Hut'], isStart: true });
        this.village.push({ id: 'start2', name: 'Lumber Hut', ...CARD_DB['Lumber Hut'], isStart: true });
        
        // 生成牌堆 (簡化為60張)
        for (let i = 0; i < 20; i++) this.deck.push(getRandomCard());
        // 加入事件卡
        this.deck.splice(Math.floor(Math.random() * 20), 0, { id: 'e1', name: 'Plague', ...CARD_DB['Plague'] });
        this.deck.splice(Math.floor(Math.random() * 40), 0, { id: 'e2', name: 'Fire', ...CARD_DB['Fire'] });
        
        // 洗牌
        this.deck.sort(() => Math.random() - 0.5);
        
        this.updateUI();
        this.drawPhase();
    },

    updateUI() {
        document.getElementById('res-coin').innerText = this.resources.coin;
        document.getElementById('res-wood').innerText = this.resources.wood;
        document.getElementById('res-stone').innerText = this.resources.stone;
        document.getElementById('res-worker').innerText = `${this.workers}/${this.maxWorkers}`;
        document.getElementById('res-deck').innerText = this.deck.length;
        
        // 更新按鈕狀態
        document.getElementById('btn-draw').disabled = this.state !== 'DRAW';
        document.getElementById('btn-work').disabled = this.state !== 'WORK';
        document.getElementById('btn-collect').disabled = this.state !== 'COLLECT';
        document.getElementById('btn-build').disabled = this.state !== 'BUILD';
        
        // 渲染手牌
        const handDiv = document.getElementById('hand-area');
        handDiv.innerHTML = '';
        this.hand.forEach(card => {
            const div = document.createElement('div');
            div.className = `card lvl-${card.lvl !== 'X' && card.lvl !== 'U' ? card.lvl : 1}`;
            div.innerHTML = `
                <div class="card-cost">${card.cost}</div>
                <div>${card.name}</div>
                <div style="font-size: 0.7rem; margin-top: 5px;">${card.type}</div>
                <div class="card-label">${card.desc}</div>
            `;
            // 點擊手牌可建造 (在建造階段)
            div.onclick = () => this.tryBuild(card);
            handDiv.appendChild(div);
        });

        // 渲染村莊
        const villageRow = document.getElementById('village-row');
        villageRow.innerHTML = '';
        this.village.forEach(card => {
            const div = document.createElement('div');
            div.className = `card lvl-${card.lvl !== 'X' && card.lvl !== 'U' ? card.lvl : 1}`;
            div.innerHTML = `
                <div>${card.name}</div>
                <div style="font-size: 0.7rem;">${card.type}</div>
                <div class="card-label">${card.desc}</div>
            `;
            villageRow.appendChild(div);
        });
    },

    drawPhase() {
        AudioSys.playClick();
        if (this.deck.length === 0) {
            this.endGame(); return;
        }
        this.state = 'DRAW';
        let drawCount = this.handLimit - this.hand.length;
        
        for (let i = 0; i < drawCount; i++) {
            if (this.deck.length === 0) break;
            const card = this.deck.pop();
            
            if (card.type === 'Event') {
                this.handleEvent(card);
            } else {
                this.hand.push(card);
            }
        }
        this.updateUI();
        this.state = 'WORK';
        ui.showToast("抽牌完成，請派遣村民到村莊建築上工作！");
    },

    handleEvent(card) {
        if (card.effect === 'event_plague') {
            if (this.village.some(b => b.effect === 'immune_plague')) {
                ui.showToast("手術室發揮作用，免疫了瘟疫！");
            } else {
                this.workers = 2;
                ui.showToast("爆發瘟疫！村民數量降至 2！");
            }
        } else if (card.effect === 'event_fire') {
            // 簡化處理：移除最後兩個非起始建築
            let removed = 0;
            for (let i = this.village.length - 1; i >= 0; i--) {
                if (!this.village[i].isStart) {
                    this.village.splice(i, 1);
                    removed++;
                    if (removed >= 2) break;
                }
            }
            ui.showToast(`發生火災！燒毀了 ${removed} 棟建築！`);
        }
    },

    workPhase() {
        // 簡化：點擊按鈕直接派遣村民到建築（這裡可擴展為點擊村莊卡牌）
        AudioSys.playClick();
        // 假設自動派遣村民產生資源，簡化遊玩流程
        let availWorkers = this.workers;
        this.village.forEach(card => {
            if (availWorkers <= 0) return;
            if (card.effect === 'gain_wood_1') { this.resources.wood = Math.min(5, this.resources.wood + 1); availWorkers--; }
            else if (card.effect === 'gain_stone_1') { this.resources.stone = Math.min(5, this.resources.stone + 1); availWorkers--; }
            else if (card.effect === 'gain_worker_1') { this.workers = Math.min(this.maxWorkers, this.workers + 1); availWorkers--; }
            // ...可擴展更多效果
        });
        this.updateUI();
        this.state = 'COLLECT';
        ui.showToast("資源已收集！請點擊建造或進入下一輪。");
        this.state = 'BUILD';
        document.getElementById('btn-build').innerText = "結束回合 (不建造)";
    },

    collectPhase() {
        // 已與 workPhase 合併簡化
    },

    buildPhase() {
        // 如果玩家點擊此按鈕且未建造，則結束回合
        AudioSys.playClick();
        if (this.state !== 'BUILD') return;
        
        // 棄牌邏輯
        const discardCount = Math.floor(this.hand.length / 2);
        for(let i=0; i<discardCount; i++) {
            if(this.hand.length > 0) this.discard.push(this.hand.pop());
        }
        
        this.state = 'DRAW';
        document.getElementById('btn-build').innerText = "建造";
        if (this.deck.length === 0) {
            this.endGame();
        } else {
            this.drawPhase();
        }
    },

    tryBuild(card) {
        if (this.state !== 'BUILD') {
            ui.showToast("現在不是建造階段！"); return;
        }
        // 檢查資源 (手牌價值1金，加上現有金幣)
        let totalMoney = this.resources.coin + (this.hand.length - 1); // 扣除當前選中的卡
        if (totalMoney >= card.cost) {
            // 扣除資源
            let costToPay = card.cost;
            if (this.resources.coin >= costToPay) {
                this.resources.coin -= costToPay;
            } else {
                let remaining = costToPay - this.resources.coin;
                this.resources.coin = 0;
                for(let i=0; i<remaining; i++) this.discard.push(this.hand.pop());
            }
            
            // 從手牌移除
            const index = this.hand.indexOf(card);
            if(index > -1) this.hand.splice(index, 1);
            
            // 檢查村民上限
            if (card.type === "Residential") {
                this.maxWorkers += 2;
                this.workers += 2;
            }
            
            this.village.push(card);
            this.updateUI();
            ui.showToast(`成功建造了 ${card.name}！`);
        } else {
            ui.showToast("資源不足，無法建造！");
        }
    },

    endGame() {
        this.state = 'GAMEOVER';
        ui.showToast("遊戲結束！正在計算分數...");
        // 簡化分數計算
        let score = this.village.filter(c => c.effect === 'vp_5').length * 5;
        score += this.village.length; // 暫時以建築數量計分
        setTimeout(() => {
            alert(`遊戲結束！\n最終分數：${score} VP\n感謝遊玩！`);
            location.reload();
        }, 1000);
    },

    saveGame() {
        const saveData = {
            state: this.state, deck: this.deck, hand: this.hand, village: this.village,
            resources: this.resources, workers: this.workers, maxWorkers: this.maxWorkers
        };
        localStorage.setItem('villageBuilderSave', JSON.stringify(saveData));
        ui.showToast("遊戲已存檔！");
    },

    loadGame() {
        const data = localStorage.getItem('villageBuilderSave');
        if (data) {
            const parsed = JSON.parse(data);
            Object.assign(this, parsed);
            this.updateUI();
            ui.showToast("遊戲已讀取！");
            ui.closeMenu();
        } else {
            ui.showToast("沒有找到存檔！");
        }
    }
};

// 初始化教學文字
const tutorialText = `歡迎來到《村莊建設者》！
