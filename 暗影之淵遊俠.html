<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>暗影深淵遊俠：燃燒之光</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;background:#0a0505;background-image:radial-gradient(ellipse at top,#2a1510 0%,#0a0505 70%);color:#e0d0b0;min-height:100vh;font-size:14px;line-height:1.5}
#app{display:flex;flex-direction:column;min-height:100vh}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(10,5,5,.95);border-bottom:2px solid #6b5030;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
#main{flex:1;padding:16px;max-width:1400px;margin:0 auto;width:100%}
#log-area{height:120px;overflow-y:auto;background:rgba(0,0,0,.7);border-top:1px solid #4a3a2a;padding:8px 16px;font-size:12px;font-family:monospace}
.log-entry{padding:2px 0;border-bottom:1px dotted rgba(107,80,48,.3)}
.log-info{color:#a0d0a0}.log-combat{color:#f0c060}.log-danger{color:#ff7070}.log-reward{color:#60d0ff}.log-roll{color:#c0a0ff}.log-system{color:#a0a0a0}
h1,h2,h3{color:#f0c060;margin-bottom:10px}
h1{font-size:22px;text-align:center;text-shadow:0 0 10px rgba(240,192,96,.5)}
h2{font-size:18px;border-bottom:1px solid #4a3a2a;padding-bottom:6px;margin:14px 0 10px}
h3{font-size:14px;color:#e0c080}
button{background:linear-gradient(180deg,#6b5030,#3a2a1a);color:#f0d090;border:2px solid #8b6f47;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s;margin:3px}
button:hover:not(:disabled){background:linear-gradient(180deg,#8b6f47,#5a4030);transform:translateY(-1px);box-shadow:0 2px 8px rgba(240,192,96,.3)}
button:disabled{opacity:.35;cursor:not-allowed;transform:none}
button.primary{border-color:#f0c060;color:#ffe0a0;background:linear-gradient(180deg,#7a5a20,#4a3010)}
button.danger{border-color:#c04040;color:#ff9090;background:linear-gradient(180deg,#5a2020,#301010)}
button.small{padding:4px 8px;font-size:11px}
button.active{border-color:#f0f060;box-shadow:0 0 12px rgba(240,240,96,.6)}
.panel{background:rgba(30,20,15,.9);border:1px solid #6b5030;border-radius:8px;padding:14px;margin-bottom:12px}
.panel-title{color:#f0c060;font-size:15px;font-weight:bold;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(107,80,48,.5)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:10px 4px;align-items:stretch}
.h-scroll::-webkit-scrollbar{height:8px}
.h-scroll::-webkit-scrollbar-thumb{background:#6b5030;border-radius:4px}
.h-scroll::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
.stat-chip{display:inline-block;background:rgba(60,40,20,.8);border:1px solid #6b5030;border-radius:4px;padding:2px 8px;font-size:12px;margin:2px}
.stat-chip.hi{border-color:#60d060;color:#a0f0a0}
.stat-chip.lo{border-color:#c04040;color:#ff9090}
.card{background:linear-gradient(180deg,#3a2a1a,#1a1510);border:2px solid #6b5030;border-radius:8px;padding:10px;min-width:160px;max-width:200px;flex-shrink:0;position:relative;display:flex;flex-direction:column}
.card.selectable{cursor:pointer}
.card.selectable:hover{border-color:#f0c060;box-shadow:0 0 15px rgba(240,192,96,.4);transform:translateY(-2px)}
.card.selected{border-color:#f0f060;box-shadow:0 0 20px rgba(240,240,96,.6)}
.card.disabled{opacity:.4;cursor:not-allowed}
.card.hero{border-color:#60a0f0;background:linear-gradient(180deg,#1a2a3a,#0a1015)}
.card.enemy{border-color:#c04040;background:linear-gradient(180deg,#3a1a1a,#150808)}
.card.poi{border-color:#c0a040;background:linear-gradient(180deg,#3a3010,#151005)}
.card-title{font-size:13px;font-weight:bold;color:#f0c060;margin-bottom:6px}
.card.hero .card-title{color:#80c0ff}.card.enemy .card-title{color:#ff8080}.card.poi .card-title{color:#ffd060}
.card-body{font-size:11px;color:#c0b090;flex:1;line-height:1.4}
.card-footer{font-size:10px;color:#a09070;margin-top:6px;padding-top:6px;border-top:1px solid rgba(107,80,48,.4)}
.hp-bar{height:6px;background:#301010;border-radius:3px;margin:4px 0;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,#c03030,#f06060);transition:width .3s}
.hp-fill.hero{background:linear-gradient(90deg,#3060c0,#60a0f0)}
.map{position:relative;height:520px;background:radial-gradient(circle,#2a1a0a,#0a0505);border:2px solid #4a3a2a;border-radius:8px;overflow:hidden}
.map svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.map-node{position:absolute;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#4a3a2a,#1a1005);border:2px solid #8b6f47;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:12px;text-align:center;transform:translate(-50%,-50%);z-index:10;user-select:none}
.map-node:hover:not(.disabled){transform:translate(-50%,-50%) scale(1.1);border-color:#f0c060;box-shadow:0 0 20px rgba(240,192,96,.5)}
.map-node.visited{background:radial-gradient(circle,#1a3a1a,#0a1a05);border-color:#60c060}
.map-node.current{border-color:#f0f060;box-shadow:0 0 25px rgba(240,240,96,.7);animation:pulse 1.5s infinite}
.map-node.disabled{opacity:.3;cursor:not-allowed}
.map-node .node-letter{font-size:20px;font-weight:bold;color:#f0c060}
.map-node .node-name{font-size:10px;margin-top:2px}
@keyframes pulse{0%,100%{box-shadow:0 0 25px rgba(240,240,96,.7)}50%{box-shadow:0 0 35px rgba(240,240,96,1)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(3px)}
.modal{background:linear-gradient(180deg,#2a1a10,#0a0505);border:2px solid #8b6f47;border-radius:12px;padding:22px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 0 60px rgba(240,192,96,.2)}
.modal h2{color:#f0c060;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid #4a3a2a;flex-wrap:wrap}
.note-card{background:linear-gradient(180deg,#3a2a1a,#1a1510);border:2px solid #a08050;border-radius:8px;padding:16px;margin:10px 0}
.note-num{color:#f0c060;font-size:12px;margin-bottom:8px;font-weight:bold}
.dice-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0;padding:10px;background:rgba(0,0,0,.4);border-radius:6px}
.dice{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;background:linear-gradient(180deg,#3a2a1a,#1a1005);border:2px solid #f0c060;border-radius:8px;font-size:20px;font-weight:bold;color:#f0c060}
.dice.crit{border-color:#60f060;color:#60f060;box-shadow:0 0 15px rgba(96,240,96,.7);animation:pulse 1s}
.dice.fail{border-color:#c04040;color:#c04040}
.dice-vs{color:#a09070;font-size:14px}
.formula{color:#a0a0a0;font-size:12px;font-family:monospace}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid #4a3a2a;flex-wrap:wrap}
.tab{padding:8px 14px;background:rgba(0,0,0,.4);border:1px solid #4a3a2a;border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;color:#a09070}
.tab.active{background:linear-gradient(180deg,#6b5030,#3a2a1a);color:#f0c060;border-color:#8b6f47}
.tab-content{display:none}.tab-content.active{display:block}
.skill-row{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px dotted rgba(107,80,48,.3);align-items:center}
.skill-row .name{color:#c0b090}.skill-row .val{color:#f0c060;font-weight:bold}
.equip-item{background:rgba(40,30,20,.8);border:1px solid #6b5030;border-radius:4px;padding:6px 10px;margin:4px 0;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.equip-item .remove{color:#ff6060;cursor:pointer;font-weight:bold;padding:0 6px}
.badge{display:inline-block;background:#4a2a10;border:1px solid #8b6f47;border-radius:10px;padding:1px 8px;font-size:10px;color:#e0c080;margin-left:4px}
.turn-indicator{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:rgba(0,0,0,.5);border-radius:6px;margin-bottom:12px;border:1px solid #4a3a2a}
.phase-chip{padding:3px 10px;border-radius:12px;font-size:12px;background:rgba(60,40,20,.6);color:#a09070;border:1px solid transparent}
.phase-chip.active{background:linear-gradient(90deg,#8b6f47,#6b5030);color:#ffe0a0;border-color:#f0c060;box-shadow:0 0 10px rgba(240,192,96,.5)}
.action-counter{font-size:12px;color:#f0c060}
.tooltip{position:relative;cursor:help;border-bottom:1px dotted #8b6f47}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#1a1005;border:1px solid #8b6f47;border-radius:4px;padding:6px 10px;font-size:11px;color:#e0c080;white-space:pre-wrap;max-width:300px;z-index:200;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.8)}
.empty-msg{text-align:center;color:#807060;padding:20px;font-style:italic}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(60,40,20,.8);border:1px solid #6b5030;color:#c0b090;margin:2px}
.tag.green{border-color:#40a040;color:#80f080;background:rgba(20,60,20,.8)}
.tag.red{border-color:#a04040;color:#f08080;background:rgba(60,20,20,.8)}
.tag.blue{border-color:#4060a0;color:#80a0f0;background:rgba(20,30,60,.8)}
.info-box{background:rgba(20,30,50,.6);border:1px solid #4060a0;border-radius:6px;padding:10px;margin:8px 0;font-size:12px;color:#a0c0f0}
.warn-box{background:rgba(50,20,20,.6);border:1px solid #a04040;border-radius:6px;padding:10px;margin:8px 0;font-size:12px;color:#f0a0a0}
.success-box{background:rgba(20,50,20,.6);border:1px solid #40a040;border-radius:6px;padding:10px;margin:8px 0;font-size:12px;color:#a0f0a0}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.map{height:400px}#main{padding:10px}h1{font-size:18px}button{padding:6px 10px;font-size:12px}}
</style>
</head>

// ============================== 工具函式 ==============================
const $ = id => document.getElementById(id);
const d20 = () => Math.floor(Math.random()*20)+1;
const rand = n => Math.floor(Math.random()*n);
const pick = arr => arr[rand(arr.length)];
const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

function log(msg, type='info') {
  S.log.push({msg, type, t:Date.now()});
  renderLog();
}

function renderLog() {
  const el = $('log-area');
  el.innerHTML = S.log.slice(-100).map(l=>`<div class="log-entry log-${l.type}">${l.msg}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function saveGame() {
  try {
    localStorage.setItem('shadowdeep_save', JSON.stringify(S));
    log('💾 遊戲已存檔','system');
  } catch(e) { log('存檔失敗：'+e.message,'danger'); }
}

function loadGame() {
  try {
    const raw = localStorage.getItem('shadowdeep_save');
    if(!raw) { log('沒有存檔','danger'); return false; }
    S = JSON.parse(raw);
    log('📂 讀檔成功','system');
    render();
    return true;
  } catch(e) { log('讀檔失敗：'+e.message,'danger'); return false; }
}

function showModal(title, content, actions) {
  const root = $('modal-root');
  root.innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this){}">
      <div class="modal">
        <h2>${title}</h2>
        <div>${content}</div>
        <div class="modal-actions">${actions||'<button onclick="closeModal()">關閉</button>'}</div>
      </div>
    </div>`;
}
function closeModal(){ $('modal-root').innerHTML=''; }

// 通用 d20 判定
function rollCheck(mod, tn, label) {
  const r = d20();
  const total = r + mod;
  let success;
  if(r===20) success=true;
  else if(r===1) success=false;
  else success = total >= tn;
  return {roll:r, mod, total, tn, success, label};
}

// 戰鬥計算（返回詳細）
function resolveCombat(attacker, defender) {
  // attacker: {name,F,armor(用於被反擊),dmgBonus,crit:boolean,isHero,abilities:[...]}
  // defender: {name,F,armor,dmgBonus,isHero,crit:boolean}
  const aR = d20(), dR = d20();
  const aScore = aR + attacker.F;
  const dScore = dR + defender.F;
  let winner='tie', dmg=0, crit=false;
  // 天然20 暴擊
  if(attacker.crit && aR===20) {
    crit=true;
    dmg = Math.max(0, aScore + 5 - defender.armor + (attacker.dmgBonus||0));
    winner='attacker';
  } else if(defender.crit && dR===20) {
    dmg = Math.max(0, dScore + 5 - attacker.armor + (defender.dmgBonus||0));
    winner='defender';
  } else if(aR===1) {
    winner='defender';
    dmg = Math.max(0, dScore - attacker.armor + (defender.dmgBonus||0));
  } else if(dR===1) {
    winner='attacker';
    dmg = Math.max(0, aScore - defender.armor + (attacker.dmgBonus||0));
  } else if(aScore > dScore) {
    winner='attacker';
    dmg = Math.max(0, aScore - defender.armor + (attacker.dmgBonus||0));
  } else if(dScore > aScore) {
    winner='defender';
    dmg = Math.max(0, dScore - attacker.armor + (defender.dmgBonus||0));
  } else {
    winner='tie';
    dmg = Math.max(0, aScore - defender.armor);
  }
  return {aR,dR,aScore,dScore,winner,dmg,crit};
}

// 用遊俠的屬性（可能因永久傷害拆分為有效值）
function effStat(ranger, stat) {
  // 若永久傷害影響該屬性，這裡簡化：直接返回實際值
  return ranger[stat];
}

  const phaseText = {

  tb.innerHTML = `

      <div style="color:#a09070">${phaseText}</div>
      ${S.phase==='SCENE'?`<div class="stat-chip">回合 ${S.round}/9</div>`:''}
      <button class="small" onclick="saveGame()">💾 存檔</button>
      <button class="small" onclick="showHelp()">❓ 說明</button>
    </div>`;
}

// ============================== 渲染主路由 ==============================
function render() {
  renderTopbar();
  const m = $('main');
  switch(S.phase) {
    case 'SETUP': m.innerHTML = renderSetup(); break;
    case 'MAP': m.innerHTML = renderMap(); break;
    case 'SCENE': m.innerHTML = renderScene(); break;
    case 'SCENE_END': m.innerHTML = renderSceneEnd(); break;
    case 'FINAL': m.innerHTML = renderFinal(); break;
    case 'GAME_OVER': m.innerHTML = renderGameOver(); break;
    default: m.innerHTML = '<div class="empty-msg">未知狀態</div>';
  }
  renderLog();
}

// ============================== 角色創建 ==============================
let setupState = null;

function initSetup() {
  setupState = {
    tab:'basic',
    name:'無名遊俠',
    // 屬性提升（每項最多+1，總共最多3點）
    statUps:{M:0,F:0,S:0,W:0,H:0},
    // 英雄能力（最多5點）
    abilities:[],
    // 法術（可重複）
    spells:[],
    // 技能（每點提升8項技能各+1）
    skills:Object.fromEntries(SKILLS.map(s=>[s,0])),
    skillPointsSpent:0,
    // 招募點數投入（最多3點）
    rpInvest:0,
    // 裝備（最多5件，從基礎列表選）

function renderSetup() {

function renderSetupDetail(){ render(); }

function toggleAbility(name) {
  const sp = setupState;
  if(sp.abilities.includes(name)) {
    sp.abilities = sp.abilities.filter(a=>a!==name);
  } else {
    const used = sp.abilities.length + sp.spells.length;
    if(used < 5) sp.abilities.push(name);
  }
  render();
}
function removeSpell(name) {
  const idx = setupState.spells.indexOf(name);
  if(idx>=0) setupState.spells.splice(idx,1);
  render();
}
function incSkill(sk) {
  const sp = setupState;
  if(sp.skillPointsSpent>=5) return;
  // 一次點擊代表花 1 點技能點，但規則說 1 點=8 項技能各+1。這裡簡化為單項點擊+1，但需扣 8 分之 1... 不行
  // 更好的做法：一次點擊讓該技能+1，且「本次」還要再選另外 7 項才能完成 1 點。
  // 簡化：每次點擊只加 1 項技能 +1，但需消耗「整點」1 點，剩餘可再點 7 項不消耗點數
  // 這裡進一步簡化：1 點技能點 -> 直接讓 8 項技能各+1，玩家按鈕時一次全加（需自行分配）
  // 最終簡化：單擊 = 花 1 點，該技能 +1，其他 7 項隨機+1。這樣太怪。
  // 妥協方案：保留每項可點，每次點擊消耗「1/8 點」-> 用整數計數器
  // 這裡採用：sp.skillPointsSpent 是「已花整點」，另用 sp.skillFills 累計 0-8 的填充。
  // 為避免重構，簡單點：每次點擊該技能+1，同時 skillPointsSpent 用 1/8 增量記錄。
  // 但 skillPointsSpent 是整數比較難看。
  // 改為：直接花 1 點技能點讓「所有技能點數」+1，即每次點擊消耗 1 點，該技能 +1（其他 7 項自動 +1 到隨機其他技能）。這樣會誤導。
  // 最終決定：簡化為「技能點」花 1 點 = 該技能 +1，並在 UI 說明中說明每點技能只能提升該技能一次。這樣雖然與規則不完全一致，但玩家更容易理解。
  // 為符合規則，改為：UI 提供「批量選擇 8 項技能」對話框
  // 重新設計：
  showSkillPicker();
}

function showSkillPicker() {
  const sp = setupState;
  if(sp.skillPointsSpent>=5) return;
  const remain = 5 - sp.skillPointsSpent;
  let html = `<p>每 1 點技能點：選擇 8 項不同技能各 +1。剩餘點數：${remain}</p>
    <p style="font-size:12px;color:#a09070">點擊下方技能以選擇（需選 8 項）</p>
    <div class="grid-2" style="margin-top:10px">`;
  for(const sk of SKILLS) {
    const cur = sp.skills[sk];
    html += `<div class="skill-row"><span>${sk} (目前+${cur})</span>
      <button class="small" onclick="skillPickerToggle('${sk}')" id="sk-${sk}">選擇</button></div>`;
  }
  html += `</div><div style="margin-top:14px;text-align:right">
    <button onclick="confirmSkillPicker()">確認（花1點）</button>
    <button onclick="closeModal()">取消</button></div>`;
  window._skillPick = [];
  showModal('技能分配', html, '');
}

function skillPickerToggle(sk) {
  if(!window._skillPick) window._skillPick=[];
  const idx = window._skillPick.indexOf(sk);
  if(idx>=0) {
    window._skillPick.splice(idx,1);
    $('sk-'+sk).classList.remove('active');
  } else {
    if(window._skillPick.length>=8) return;
    window._skillPick.push(sk);
    $('sk-'+sk).classList.add('active');
  }
}

function confirmSkillPicker() {
  if(!window._skillPick || window._skillPick.length!==8) {
    alert('請選擇剛好 8 項技能');
    return;
  }
  for(const sk of window._skillPick) setupState.skills[sk]++;
  setupState.skillPointsSpent++;
  closeModal();
  render();
}

function toggleEquip(name) {
  const sp = setupState;
  const idx = sp.equipment.indexOf(name);
  if(idx>=0) {
    sp.equipment.splice(idx,1);
  } else {
    if(sp.equipment.length>=5) return;
    // 護甲衝突
    if(name==='輕甲'||name==='重甲') {
      if(sp.equipment.includes('輕甲')||sp.equipment.includes('重甲')) {
        alert('只能穿一種護甲');
        return;
      }
    }
    // 雙手/法杖 vs 盾牌
    if(name==='盾牌') {
      if(sp.equipment.includes('雙手武器')||sp.equipment.includes('法杖')) {
        alert('攜帶雙手武器或法杖時不能攜帶盾牌');
        return;
      }
    }
    if(name==='雙手武器'||name==='法杖') {
      if(sp.equipment.includes('盾牌')) {
        alert('攜帶盾牌時不能攜帶雙手武器或法杖');
        return;
      }
    }
    sp.equipment.push(name);
  }
  render();
}

function startGame() {
  const sp = setupState;
  const baseRP = 100 + sp.rpInvest*10;
  // 建立遊俠
  const r = {
    name: sp.name || '無名遊俠',
    level:0,xp:0,
    M: 6 + sp.statUps.M,
    F: 2 + sp.statUps.F,
    S: 1 + sp.statUps.S,
    A: 10, // 護甲不能提升
    W: 4 + sp.statUps.W,
    H: 18 + sp.statUps.H,
    curH: 18 + sp.statUps.H,
    skills: {...sp.skills},
    abilities: [...sp.abilities],
    spells: [...sp.spells],
    equipment: [...sp.equipment],
    rp: baseRP,
    usedAbilities:[],
    status:{poisoned:false,disease:false,permanent:[],hunger:0}
  };
  // 同伴
  const comps = [];
  for(const [name,cnt] of Object.entries(sp.companionCounts)) {
    for(let i=0;i<cnt;i++) {
      const base = COMPANIONS[name];
      // 技能：首次+3（套用至最高優先技能）
      const skills = {...(base.skills||{})};
      const skillKeys = Object.keys(skills);
      if(skillKeys.length>0) {
        skills[skillKeys[0]] += 3;
      } else {
        skills['雜技'] = 3;
      }
      comps.push({
        id: 'c'+comps.length,
        name: name + (cnt>1?' #'+(i+1):''),
        type: name,
        M:base.M,F:base.F,S:base.S,A:base.A,W:base.W,H:base.H,curH:base.H,
        skills, items:[...(base.items||[])],
        animal:!!base.animal,
        ap:0,
        isTemp:false
      });
    }
  }

  S = createInitialState();
  S.ranger = r;
  S.companions = comps;
  S.phase = 'MAP';
  log(`🎉 ${r.name} 的冒險開始！帶上 ${comps.length} 名同伴踏入暗影深淵。`, 'system');
  render();
}

// ============================== 地圖 ==============================
function renderMap() {
  const positions = {
    A:{x:12,y:20}, B:{x:40,y:15}, C:{x:30,y:42},
    D:{x:62,y:38}, E:{x:15,y:68}, F:{x:48,y:68},
    G:{x:35,y:90}, H:{x:62,y:90}
  };
  const edges = [['A','B'],['A','C'],['B','C'],['C','D'],['C','E'],['C','F'],['F','G'],['F','H']];
  const canEnter = l => {
    if(S.visited.includes(l)) return false;
    if(S.visited.length===0) return ['A','B','C'].includes(l);
    // 鄰接已探索
    return LOCATIONS[l].adj.some(a=>S.visited.includes(a));
  };
  let svgLines = '';
  for(const [a,b] of edges) {
    const pa = positions[a], pb = positions[b];
    const known = S.visited.includes(a)||S.visited.includes(b);
    svgLines += `<line x1="${pa.x}%" y1="${pa.y}%" x2="${pb.x}%" y2="${pb.y}%" stroke="${known?'#8b6f47':'#3a2a1a'}" stroke-width="${known?3:1.5}" stroke-dasharray="${known?'':'6,4'}"/>`;
  }
  let nodes = '';
  for(const [loc,pos] of Object.entries(positions)) {
    const vis = S.visited.includes(loc);
    const can = canEnter(loc);
    const cls = vis?'visited':(can?'':(S.visited.length>0?'disabled':''));
    nodes += `<div class="map-node ${cls}" style="left:${pos.x}%;top:${pos.y}%"
      ${can?`onclick="startScene('${loc}')"`:''}>
      <div class="node-letter">${loc}</div>
      <div class="node-name">${vis?'✓':LOCATIONS[loc].name}</div>
    </div>`;
  }
  const visitedCount = S.visited.length;
  const allVisited = visitedCount>=8;

  return `
    <h1>🗺 聖埃米莉亞女修道院廢墟</h1>
    <div class="panel">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px">
        <div>已探索：<b style="color:#f0c060">${visitedCount}/8</b></div>
        <div>暗影深淵卡進度：<b style="color:#f0c060">${S.shadowDeckIdx}/16</b></div>
        <div>${S.decanter?'<span class="tag green">已取得魔瓶</span>':'<span class="tag">尚未取得魔瓶</span>'}</div>
      </div>
      <div class="warn-box">
        ⚠ 每探索一個場景，暗影深淵的覺察會加深。若你確定魔瓶在某處，可隨時點擊該地點進行「最終搜索」；但只有一次機會！
      </div>
    </div>
    <div class="map">
      <svg>${svgLines}</svg>
      ${nodes}
    </div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      ${allVisited?'<div class="warn-box" style="flex:1">已探索全部地點，請立即進行最終搜索。</div>':''}
      ${S.visited.length>0?`<button class="primary" onclick="showFinalSearchMenu()">🔍 進行最終搜索</button>`:''}
      <button onclick="showStatusPanel()">📋 查看遊俠狀態</button>
      <button onclick="showCompanionsPanel()">👥 查看同伴</button>
    </div>
  `;
}

function showFinalSearchMenu() {
  let html = `<p>你已探索的地點：</p><div class="grid-2">`;
  for(const loc of S.visited) {
    html += `<div class="equip-item">
      <span><b style="color:#f0c060">${loc}. ${LOCATIONS[loc].name}</b></span>
      <button onclick="attemptFinalSearch('${loc}')">在此搜尋</button>
    </div>`;
  }
  html += `</div><div class="warn-box" style="margin-top:14px">⚠ 只有一次最終搜索機會！選擇錯誤將無法挽回。</div>`;
  showModal('選擇最終搜索地點', html, '<button onclick="closeModal()">取消</button>');
}

function attemptFinalSearch(loc) {
  closeModal();
  S.finalSearch = loc;
  const commentId = FINAL_SEARCH[loc];
  // 檢查是否為正確地點（草藥店 E）
  if(loc === DECANTER_LOCATION) {
    // 找到魔瓶！
    showComment(commentId);
  } else {
    // 搜尋失敗
    showComment(commentId);
  }
}

// ============================== 場景 ==============================
function startScene(loc) {
  const L = LOCATIONS[loc];
  S.currentLoc = loc;
  S.round = 1;
  // 建立事件牌組
  const shadowStart = S.shadowDeckIdx;
  const shadowCards = SHADOW_DECK.slice(shadowStart, shadowStart+2);
  S.shadowDeckIdx += 2;
  // 洗牌
  const deck = [...L.events.map(e=>({...e,isShadow:false})), ...shadowCards.map(e=>({...e,isShadow:true}))];
  // 隨機排序
  for(let i=deck.length-1;i>0;i--){const j=rand(i+1);[deck[i],deck[j]]=[deck[j],deck[i]];}
  S.eventDeck = deck;
  S.eventUsed = [];
  // 建立場景狀態
  S.scene = {
    loc: loc,
    enemies: L.initialEnemies.map(e=>({...createEnemy(e), id:'e'+Math.random().toString(36).slice(2,8)})),
    poi: L.poi.map(p=>({...p, triggered:false})),
    turnPhase:'player', // player / companion / enemy / event
    actionsLeft: 2,
    enemiesActed:0,
    companionsActed:0,
    tempBuffs:{},
    enemyF:0,
    enemyF_turns:0,
    shadowFog:0,
    heroWillPenalty:0,
    message:''
  };
  S.phase = 'SCENE';
  log(`⚔ 進入場景 ${loc}：${L.name}`, 'system');
  log(`敵人：${S.scene.enemies.map(e=>e.name).join('、')}`, 'danger');
  render();
}

function createEnemy(name) {
  const base = ENEMY_DB[name];
  if(!base) return {name, F:0, A:10, H:5, curH:5, xp:1, tags:[]};
  return {
    name, F:base.F, S:base.S, A:base.A, W:base.W,
    H:base.H, curH:base.H, xp:base.xp, tags:[...(base.tags||[])],
    isEnemy:true
  };
}

function renderScene() {
  const sc = S.scene;
  const L = LOCATIONS[sc.loc];
  const phaseChips = `
    <div class="turn-indicator">
      <div class="phase-chip ${sc.turnPhase==='player'?'active':''}">① 遊俠階段</div>
      <div class="phase-chip ${sc.turnPhase==='companion'?'active':''}">② 同伴階段</div>
      <div class="phase-chip ${sc.turnPhase==='enemy'?'active':''}">③ 敵人階段</div>
      <div class="phase-chip ${sc.turnPhase==='event'?'active':''}">④ 事件階段</div>
      <div class="action-counter">${sc.turnPhase==='player'?`剩餘行動：${sc.actionsLeft}`:''}</div>
    </div>`;

  // 英雄卡片
  let heroCards = '';
  // 遊俠
  const r = S.ranger;
  heroCards += `<div class="card hero ${sc.turnPhase==='player'?'selected':''}">
    <div class="card-title">🛡 ${r.name}</div>
    <div class="card-body">
      ❤ ${r.curH}/${r.H}<div class="hp-bar"><div class="hp-fill hero" style="width:${100*r.curH/r.H}%"></div></div>
      F+${r.F} S+${r.S} A${r.A} W+${r.W}<br>
      ${r.status.poisoned?'<span class="tag red">中毒</span>':''}
      ${r.status.disease?'<span class="tag red">疾病</span>':''}
    </div>
  </div>`;
  // 同伴
  for(const c of S.companions) {
    if(c.curH<=0) continue;
    heroCards += `<div class="card hero">
      <div class="card-title">👤 ${c.name}</div>
      <div class="card-body">
        ❤ ${c.curH}/${c.H}<div class="hp-bar"><div class="hp-fill hero" style="width:${100*c.curH/c.H}%"></div></div>
        F${c.F>=0?'+':''}${c.F} A${c.A}
      </div>
    </div>`;
  }

  // 敵人卡片
  let enemyCards = '';
  if(sc.enemies.length===0) {
    enemyCards = '<div class="empty-msg">場景中已無敵人</div>';
  } else {
    for(const e of sc.enemies) {
      enemyCards += `<div class="card enemy">
        <div class="card-title">☠ ${e.name}</div>
        <div class="card-body">
          ❤ ${e.curH}/${e.H}<div class="hp-bar"><div class="hp-fill" style="width:${100*e.curH/e.H}%"></div></div>
          F+${e.F} A${e.A}
          ${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
        ${sc.turnPhase==='player'&&sc.actionsLeft>0?`<div class="card-footer">
          <button class="small" onclick="heroAttack('${e.id}')">⚔ 攻擊</button>
        </div>`:''}
      </div>`;
    }
  }

  // 興趣點
  let poiCards = '';
  for(const p of sc.poi) {
    const done = p.triggered;
    poiCards += `<div class="card poi ${done?'disabled':''}">
      <div class="card-title">🔍 ${p.id}. ${p.name} ${done?'✓':''}</div>
      <div class="card-body" style="font-size:11px">
        ${p.skill?`判定：${p.skill} TN${p.tn}`:'直接觸發'}
        ${p.altSkill?`<br>或 ${p.altSkill} TN${p.altTn}`:''}
        ${p.tiered?'<br><span class="tag blue">分級判定</span>':''}
      </div>
      ${!done&&sc.turnPhase==='player'&&sc.actionsLeft>0?`<div class="card-footer">
        <button class="small" onclick="heroInteract('${p.id}')">🔎 檢視</button>
      </div>`:''}
    </div>`;
  }

  // 動作按鈕
  let actionBtns = '';
  if(sc.turnPhase==='player') {
    actionBtns = `
      <button onclick="heroCastSpell()" ${sc.actionsLeft<=0?'disabled':''}>✨ 施法</button>
      <button onclick="heroRest()" ${sc.actionsLeft<=0?'disabled':''}>💤 休息（結束回合）</button>
      <button class="primary" onclick="endPlayerPhase()">⏭ 結束遊俠階段</button>
    `;
  } else if(sc.turnPhase==='companion') {
    actionBtns = `<button class="primary" onclick="runCompanionPhase()">▶ 執行同伴行動</button>`;
  } else if(sc.turnPhase==='enemy') {
    actionBtns = `<button class="primary" onclick="runEnemyPhase()">▶ 執行敵人行動</button>`;
  } else if(sc.turnPhase==='event') {
    actionBtns = `<button class="primary" onclick="drawEventCard()">🃏 抽取事件卡</button>`;
  }

  return `
    <h1>⚔ ${L.name}</h1>
    <p style="color:#a09070;font-size:13px;margin-bottom:12px">${L.desc}</p>
    ${phaseChips}
    <div class="panel">
      <div class="panel-title">🛡 英雄</div>
      <div class="h-scroll">${heroCards}</div>
    </div>
    <div class="panel">
      <div class="panel-title">☠ 敵人</div>
      <div class="h-scroll">${enemyCards}</div>
    </div>
    <div class="panel">
      <div class="panel-title">🔍 興趣點</div>
      <div class="h-scroll">${poiCards}</div>
    </div>
    <div class="panel" style="text-align:center">
      ${actionBtns}
      <button onclick="attemptFlee()" style="margin-left:8px">🏃 撤退（離開場景）</button>
    </div>
  `;
}

// ============================== 場景內：玩家行動 ==============================
function heroAttack(enemyId) {
  const sc = S.scene;
  if(sc.actionsLeft<=0) return;
  const e = sc.enemies.find(x=>x.id===enemyId);
  if(!e) return;
  const r = S.ranger;
  // 使用最強近戰武器
  let dmgBonus = 0;
  for(const eq of r.equipment) {
    const info = EQUIP_DB[eq];
    if(info && info.type==='melee' && info.dmg>dmgBonus) dmgBonus = info.dmg;
  }
  const result = resolveCombat(
    {name:r.name, F:r.F, armor:r.A, dmgBonus, crit:true},
    {name:e.name, F:e.F, armor:e.A, dmgBonus:0, crit:false}
  );
  sc.actionsLeft--;
  // 顯示
  let logMsg = `⚔ ${r.name} 攻擊 ${e.name}：d20(${result.aR})+${r.F} = ${result.aScore} vs d20(${result.dR})+${e.F} = ${result.dScore}`;
  if(result.crit) logMsg += ' 【暴擊！】';
  if(result.winner==='attacker') {
    e.curH -= result.dmg;
    logMsg += ` → 命中，造成 ${result.dmg} 傷害（剩 ${Math.max(0,e.curH)}）`;
    log(logMsg, 'combat');
    if(e.curH<=0) {
      log(`💀 ${e.name} 被擊殺！獲得 ${e.xp} XP`, 'reward');
      r.xp += e.xp;
      S.scene.enemies = sc.enemies.filter(x=>x.id!==e.id);
      checkLevelUp();
    }
  } else if(result.winner==='defender') {
    r.curH -= result.dmg;
    logMsg += ` → 反被擊中，受到 ${result.dmg} 傷害（剩 ${Math.max(0,r.curH)}）`;
    log(logMsg, 'danger');
    if(r.curH<=0) { handleHeroDeath(); return; }
  } else {
    logMsg += ` → 平手，雙方各受 ${result.dmg} 傷害`;
    log(logMsg, 'combat');
    e.curH -= result.dmg;
    r.curH -= result.dmg;
    if(e.curH<=0) {
      r.xp += e.xp;
      S.scene.enemies = sc.enemies.filter(x=>x.id!==e.id);
      checkLevelUp();
    }
    if(r.curH<=0) { handleHeroDeath(); return; }
  }
  render();
  // 若沒敵人了，檢查是否可結束場景
  checkSceneComplete();
}

function heroInteract(poiId) {
  const sc = S.scene;
  if(sc.actionsLeft<=0) return;
  const p = sc.poi.find(x=>x.id===poiId);
  if(!p || p.triggered) return;
  sc.actionsLeft--;
  p.triggered = true;
  log(`🔍 ${S.ranger.name} 檢視「${p.name}」`, 'info');
  // 判定
  if(!p.skill) {
    // 直接觸發
    if(p.comment) {
      showComment(p.comment, ()=>{ render(); checkSceneComplete(); });
    } else if(p.reward==='treasure') {
      S.treasureCount++;
      log('📦 找到寶藏標記物！', 'reward');
      render();
    }
  } else {
    doSkillCheck(p);
  }
}

function doSkillCheck(p) {
  const r = S.ranger;
  const skillVal = r.skills[p.skill]||0;
  let res = rollCheck(skillVal, p.tn, p.skill);
  // 若有替換技能
  let usedSkill = p.skill, usedTN = p.tn;
  if(p.altSkill && !res.success) {
    const altVal = r.skills[p.altSkill]||0;
    const altRes = rollCheck(altVal, p.altTn, p.altSkill);
    if(altRes.success) { res = altRes; usedSkill = p.altSkill; usedTN = p.altTn; }
  }
  const logMsg = `🎲 ${usedSkill} 判定：d20(${res.roll}) + ${res.mod} = ${res.total} vs TN${usedTN} → ${res.success?'✅ 成功':'❌ 失敗'}`;
  log(logMsg, res.success?'info':'danger');

  // 分級判定
  if(p.tiered) {
    // 找出符合的最高 tier
    let chosen = null;
    if(p.tiers) {
      for(const t of p.tiers) {
        if(res.total >= t.tn) chosen = t;
      }
    }
    if(res.success || (chosen && !p.successRequired)) {
      if(chosen) {
        showComment(chosen.c, ()=>{ render(); checkSceneComplete(); });
        return;
      } else if(p.comment) {
        showComment(p.comment, ()=>{ render(); checkSceneComplete(); });
        return;
      }
    }
    render();
    checkSceneComplete();
    return;
  }

  if(res.success) {
    if(p.comment) {
      showComment(p.comment, ()=>{ render(); checkSceneComplete(); });
    } else if(p.reward==='treasure') {
      S.treasureCount++;
      log('📦 找到寶藏標記物！', 'reward');
      render();
    }
  } else {
    if(p.failComment) {
      showComment(p.failComment, ()=>{ render(); checkSceneComplete(); });
    } else {
      render();
      checkSceneComplete();
    }
  }
}

function heroCastSpell() {
  const sc = S.scene;
  const r = S.ranger;
  if(sc.actionsLeft<=0) return;
  if(r.spells.length===0) {
    alert('你沒有學習任何法術');
    return;
  }
  // 顯示選擇法術
  let html = `<p>選擇要施放的法術（消耗 1 次行動）：</p><div class="grid-2">`;
  for(const spell of r.spells) {
    const info = SPELLS[spell];
    html += `<div class="equip-item" style="flex-direction:column;align-items:flex-start">
      <div style="display:flex;justify-content:space-between;width:100%">
        <b style="color:#f0c060">${spell}</b>
        <button class="small" onclick="executeSpell('${spell}')">施放</button>
      </div>
      <div style="font-size:11px;color:#a09070;margin-top:4px">${info.desc}</div>
    </div>`;
  }
  html += `</div>`;
  showModal('施放法術', html, '<button onclick="closeModal()">取消</button>');
}

function executeSpell(spell) {
  closeModal();
  const sc = S.scene;
  const r = S.ranger;
  const info = SPELLS[spell];
  sc.actionsLeft--;
  log(`✨ ${r.name} 施放「${spell}」`, 'info');

  if(spell==='治癒') {
    // 治療自己或同伴
    let html = `<p>選擇治癒目標（恢復5點生命值）：</p>`;
    html += `<button onclick="doHeal('${r.name}')">${r.name} (${r.curH}/${r.H})</button>`;
    for(const c of S.companions) {
      if(c.curH>0) html += `<button onclick="doHeal('${c.name}')">${c.name} (${c.curH}/${c.H})</button>`;
    }
    showModal('治癒', html, '');
    return;
  }
  if(spell==='魔法飛彈'||spell==='燃燒之光') {
    // 攻擊敵人
    if(sc.enemies.length===0) { log('沒有敵人','info'); render(); return; }
    const e = pick(sc.enemies);
    const atkVal = info.bonus;
    const dR = d20();
    const total = dR + e.F;
    if(atkVal + d20() > e.F + 10) {
      // 簡化：用 +bonus 攻擊，對抗 e.F
      const atkRoll = d20();
      const atkTotal = atkRoll + atkVal;
      const defTotal = d20() + e.F;
      if(atkTotal > defTotal) {
        const dmg = Math.max(0, atkTotal - e.A);
        e.curH -= dmg;
        log(`✨ 對 ${e.name} 造成 ${dmg} 傷害（剩 ${Math.max(0,e.curH)}）`, 'combat');
        if(e.curH<=0) {
          r.xp += e.xp;
          log(`💀 ${e.name} 被擊殺！+${e.xp} XP`, 'reward');
          S.scene.enemies = sc.enemies.filter(x=>x.id!==e.id);
          checkLevelUp();
        }
      } else {
        log(`✨ 法術被 ${e.name} 閃避`, 'info');
      }
    }
    render();
    checkSceneComplete();
    return;
  }
  // 其他法術簡化處理
  log(`✨ ${spell} 效果已生效`, 'info');
  render();
}

function doHeal(targetName) {
  closeModal();
  const amount = 5;
  if(targetName === S.ranger.name) {
    S.ranger.curH = Math.min(S.ranger.H, S.ranger.curH + amount);
    log(`💚 ${S.ranger.name} 恢復 ${amount} 點生命值`, 'info');
  } else {
    const c = S.companions.find(c=>c.name===targetName);
    if(c) {
      c.curH = Math.min(c.H, c.curH + amount);
      log(`💚 ${c.name} 恢復 ${amount} 點生命值`, 'info');
    }
  }
  render();
}

function heroRest() {
  S.scene.actionsLeft = 0;
  log('💤 遊俠結束本回合行動', 'info');
  render();
}

function endPlayerPhase() {
  S.scene.turnPhase = 'companion';
  S.scene.companionsActed = 0;
  render();
}

function runCompanionPhase() {
  const sc = S.scene;
  const aliveComps = S.companions.filter(c=>c.curH>0);
  if(sc.companionsActed >= aliveComps.length) {
    sc.turnPhase = 'enemy';
    render();
    return;
  }
  // 同伴自動攻擊隨機敵人
  if(sc.enemies.length>0) {
    const c = aliveComps[sc.companionsActed];
    const e = pick(sc.enemies);
    const result = resolveCombat(
      {name:c.name, F:c.F, armor:c.A, dmgBonus:0, crit:false},
      {name:e.name, F:e.F, armor:e.A, dmgBonus:0, crit:false}
    );
    let msg = `👤 ${c.name} 攻擊 ${e.name}：${result.aScore} vs ${result.dScore}`;
    if(result.winner==='attacker' && result.dmg>0) {
      e.curH -= result.dmg;
      msg += ` → 造成 ${result.dmg} 傷害`;
      if(e.curH<=0) {
        msg += ` → 💀 擊殺！+${e.xp} XP`;
        S.ranger.xp += e.xp;
        S.scene.enemies = sc.enemies.filter(x=>x.id!==e.id);
        checkLevelUp();
      }
    } else if(result.winner==='defender' && result.dmg>0) {
      c.curH -= result.dmg;
      msg += ` → 反被擊中，受到 ${result.dmg} 傷害`;
    } else {
      msg += ' → 未造成傷害';
    }
    log(msg, 'combat');
  }
  sc.companionsActed++;
  render();
  checkSceneComplete();
}

function runEnemyPhase() {
  const sc = S.scene;
  if(sc.enemiesActed >= sc.enemies.length) {
    sc.turnPhase = 'event';
    render();
    return;
  }
  const e = sc.enemies[sc.enemiesActed];
  // 選目標：隨機英雄（遊俠或同伴）
  const targets = [];
  if(S.ranger.curH>0) targets.push({type:'ranger',name:S.ranger.name});
  for(const c of S.companions) if(c.curH>0) targets.push({type:'comp',name:c.name,comp:c});
  if(targets.length===0) { render(); return; }
  const target = pick(targets);
  // 攻擊
  let attF = e.F;
  if(S.scene.enemyF) attF += S.scene.enemyF;
  let targetF, targetA, targetName;
  if(target.type==='ranger') {
    targetF = S.ranger.F; targetA = S.ranger.A; targetName = S.ranger.name;
  } else {
    targetF = target.comp.F; targetA = target.comp.A; targetName = target.comp.name;
  }
  const result = resolveCombat(
    {name:e.name, F:attF, armor:e.A, dmgBonus:0, crit:false},
    {name:targetName, F:targetF, armor:targetA, dmgBonus:0, crit:false}
  );
  let msg = `☠ ${e.name} 攻擊 ${targetName}：${result.aScore} vs ${result.dScore}`;
  if(result.winner==='attacker' && result.dmg>0) {
    if(target.type==='ranger') { S.ranger.curH -= result.dmg; }
    else { target.comp.curH -= result.dmg; }
    msg += ` → 造成 ${result.dmg} 傷害（${targetName} 剩 ${target.type==='ranger'?Math.max(0,S.ranger.curH):Math.max(0,target.comp.curH)}）`;
  } else if(result.winner==='defender' && result.dmg>0) {
    e.curH -= result.dmg;
    msg += ` → 反被擊中，受到 ${result.dmg} 傷害`;
    if(e.curH<=0) {
      S.ranger.xp += e.xp;
      sc.enemies = sc.enemies.filter(x=>x.id!==e.id);
      msg += ` → 擊殺！+${e.xp} XP`;
      checkLevelUp();
    }
  } else {
    msg += ' → 未造成傷害';
  }
  log(msg, 'danger');
  sc.enemiesActed++;
  if(S.ranger.curH<=0) { handleHeroDeath(); return; }
  render();
  checkSceneComplete();
}

function drawEventCard() {
  const sc = S.scene;
  if(S.eventDeck.length===0) {
    log('📜 事件牌組已空，場景結束', 'system');
    endScene();
    return;
  }
  const card = S.eventDeck.pop();
  S.eventUsed.push(card);
  log(`🃏 事件卡【${card.card}】${card.isShadow?'（暗影深淵）':''}：${card.text}`, card.isShadow?'danger':'info');
  applyEventEffect(card.effect, card);
  // 回合結束
  S.round++;
  if(S.round > 9) {
    log('📜 已達 9 回合，場景結束', 'system');
    endScene();
    return;
  }
  // 重置階段
  sc.turnPhase = 'player';
  sc.actionsLeft = 2;
  sc.enemiesActed = 0;
  sc.companionsActed = 0;
  render();
  checkSceneComplete();
}

function applyEventEffect(effect) {
  if(!effect) return;
  const sc = S.scene;
  const [cmd, ...args] = effect.split(':');
  const arg = args.join(':');
  switch(cmd) {
    case 'addEnemy': {
      // 可能 arg 是 'name1+name2' 形式
      const names = arg.split('+');
      for(const n of names) {
        const e = createEnemy(n);
        e.id = 'e'+Math.random().toString(36).slice(2,8);
        sc.enemies.push(e);
        log(`➕ ${n} 出現！`, 'danger');
      }
      break;
    }
    case 'allWill12': {
      for(const c of S.companions) if(c.curH>0) {
        if(!rollCheck(c.W||0, 12).success) { log(`${c.name} 意志失敗，下回合無法激活`,'danger'); }
      }
      if(!rollCheck(S.ranger.W, 12).success) { log(`${S.ranger.name} 意志失敗，下回合無法激活`,'danger'); }
      break;
    }
    case 'allWill10': {
      if(!rollCheck(S.ranger.W, 10).success) { sc.tempBuffs.skipRanger = true; log('遊俠下回合最多1次行動','danger'); }
      break;
    }
    case 'allMove16': {
      if(!rollCheck(S.ranger.M||6, 16).success) { log('遊俠移動失敗，下回合無法激活','danger'); }
      break;
    }
    case 'allStr12': {
      if(!rollCheck(S.ranger.skills['力量']||0, 12).success) { log('遊俠力量失敗，下回合無法激活','danger'); }
      break;
    }
    case 'enemyF1': sc.enemyF = 1; break;
    case 'enemyF2': sc.enemyF = 2; break;
    case 'fog8': sc.shadowFog = 2; break;
    case 'allWill-3': sc.heroWillPenalty = 3; break;
    case 'diseaseAll': {
      if(!rollCheck(S.ranger.H, 14).success) {
        S.ranger.status.disease = true;
        log('☠ 遊俠罹患疾病！','danger');
      }
      break;
    }
    case 'shoot3': {
      for(let i=0;i<3;i++){
        const target = pick([S.ranger, ...S.companions.filter(c=>c.curH>0)]);
        if(target){
          const dmg = Math.max(0, d20() - (target.A||10));
          if(target===S.ranger) S.ranger.curH -= dmg; else target.curH -= dmg;
          log(`🏹 隨機英雄受到 ${dmg} 傷害`, 'danger');
        }
      }
      break;
    }
    case 'runeTrap': {
      if(!rollCheck(S.ranger.skills['感知']||0, 14).success) {
        const dmg = Math.max(0, d20()+3 - S.ranger.A);
        S.ranger.curH -= dmg;
        log(`✨ 符文陷阱爆炸！受到 ${dmg} 傷害`, 'danger');
      }
      break;
    }
    case 'redMist': {
      if(!rollCheck(S.ranger.W, 12).success) {
        S.ranger.curH -= 3;
        log(`🌫 紅色霧氣使遊俠受到 3 傷害`, 'danger');
      }
      break;
    }
    case 'chainTrap': {
      if(!rollCheck(S.ranger.M, 20).success) {
        sc.tempBuffs.skipRanger = true;
        log(`⛓ 遊俠被鐵鏈束縛，下回合無法行動`, 'danger');
      }
      break;
    }
    case 'lightning': {
      const dmg = Math.max(0, d20()+5 - S.ranger.A);
      S.ranger.curH -= dmg;
      log(`⚡ 閃電擊中遊俠！受到 ${dmg} 傷害`, 'danger');
      break;
    }
    case 'starGaze': case 'vineTrap': case 'fountainZombies': case 'floorCollapse': case 'earthquake': case 'stairsCollapse': case 'extraAction': case 'spiderRain': case 'rottingGhoul': case 'ash': case 'shadowKnightPhantom': case 'will12or822': case 'diseaseCloud': case 'will12or822':
      log(`📜 ${effect} 效果已觸發（簡化處理）`, 'info');
      break;
    case 'addEnemy:豺狼人戰士+豺狼人戰士': case 'addEnemy:豺狼人弓箭手+豺狼人弓箭手':
      break;
    default:
      log(`📜 事件效果：${effect}`, 'info');
  }
  if(S.ranger.curH<=0) handleHeroDeath();
}

function attemptFlee() {
  if(!confirm('確定要撤退？你將離開本場景，視為未完成。')) return;
  endScene(true);
}

function checkSceneComplete() {
  const sc = S.scene;
  if(!sc) return;
  // 沒敵人了？簡化：場景內敵人清空即結束（但部分場景需觸發所有興趣點）
  // 這裡改為：不自動結束，由玩家或回合數決定
}

function endScene(fled=false) {
  S.phase = 'SCENE_END';
  S.sceneEndInfo = {
    fled,
    loc: S.scene.loc,
    foundTreasure: S.treasureCount,

  };

// ============================== 場景結算 ==============================
function renderSceneEnd() {

      <div class="panel-title">戰後恢復</div>

function applyPostScene() {
  const info = S.sceneEndInfo;
  // 恢復
  const heal = Math.max(3, Math.floor(S.ranger.H/2));
  S.ranger.curH = Math.min(S.ranger.H, S.ranger.curH + heal);
  for(const c of S.companions) {
    if(c.curH>0) {
      const h = Math.max(3, Math.floor(c.H/2));
      c.curH = Math.min(c.H, c.curH + h);
    }
  }
  // 生存判定（額外2點）
  if(rollCheck(S.ranger.skills['生存']||0, 12).success) {
    S.ranger.curH = Math.min(S.ranger.H, S.ranger.curH + 2);
    log('🌿 生存判定成功，額外恢復 2 點生命值', 'info');
  }
  // 標記完成
  if(!info.fled && !S.visited.includes(info.loc)) {
    S.visited.push(info.loc);
    log(`✅ 完成場景 ${info.loc}：${LOCATIONS[info.loc].name}`, 'system');
  }
  // 抽寶藏
  for(let i=0;i<S.treasureCount;i++){
    rollTreasure();
  }
  S.treasureCount = 0;
  // 若找到魔瓶，觸發最終場景
  if(S.decanter) {
    startFinalBattle();
    return;
  }
  // 檢查是否已探索全部
  if(S.visited.length>=8) {
    log('📜 所有地點已探索完畢，必須進行最終搜索', 'system');
  }
  S.phase = 'MAP';
  S.scene = null;
  render();
}

function rollTreasure() {
  const r = d20();
  let type;
  if(r<=6) type='gold';
  else if(r<=12) type='herb';
  else if(r<=16) type='equip';
  else type='magic';
  log(`📦 寶藏擲骰 d20(${r}) → ${type==='gold'?'黃金珠寶':type==='herb'?'草藥/藥劑':type==='equip'?'武器/護甲':'魔法物品'}`, 'reward');
  if(type==='gold') {
    S.ranger.xp += 10;
    log('💰 黃金珠寶：+10 XP', 'reward');
  } else if(type==='herb') {
    const h = d20();
    log(`🌿 獲得草藥（滾出 ${h}）— 已加入背包`, 'reward');
  } else if(type==='equip') {
    log('⚔ 獲得武器/護甲（已加入背包）', 'reward');
  } else {
    log('✨ 獲得魔法物品（已加入背包）', 'reward');
  }
}

// ============================== 注釋 ==============================
function showComment(id, callback) {
  const c = COMMENTS[id];
  if(!c) {
    log(`⚠ 注釋 ${id} 不存在`, 'danger');
    if(callback) callback();
    return;
  }
  const r = S.ranger;
  // 處理立即效果
  if(c.xp) { r.xp += c.xp; log(`⭐ 注釋 ${id}：+${c.xp} XP`, 'reward'); }
  if(c.healAll) {
    r.curH = Math.min(r.H, r.curH + c.healAll);
    for(const comp of S.companions) if(comp.curH>0) comp.curH = Math.min(comp.H, comp.curH + c.healAll);
    log(`💚 所有英雄恢復 ${c.healAll} 點生命值`, 'info');
  }
  if(c.healSelf) {
    r.curH = r.H;
    r.status.poisoned = false; r.status.disease = false;
    log('💚 遊俠生命值回滿，中毒與疾病治癒', 'info');
  }
  if(c.foundDecanter) {
    S.decanter = true;
    log('🏆 你找到了燃燒之光魔瓶！', 'reward');
  }
  if(c.reward) {
    if(c.reward.startsWith('treasure')) { S.treasureCount++; log('📦 獲得寶藏標記物', 'reward'); }
    else if(c.reward.startsWith('item:')) { log(`🎁 獲得物品：${c.reward.slice(5)}`, 'reward'); }
    else if(c.reward.startsWith('companion:')) {
      const name = c.reward.slice(10);
      log(`👤 ${name} 加入隊伍！`, 'info');
    }
  }
  if(c.addEnemies && S.scene) {
    for(const n of c.addEnemies) {
      const e = createEnemy(n);
      e.id = 'e'+Math.random().toString(36).slice(2,8);
      S.scene.enemies.push(e);
    }
    log(`⚠ 敵人出現：${c.addEnemies.join('、')}`, 'danger');
  }
  if(c.triggerFinal) {
    closeModal();
    startFinalBattle();
    return;
  }
  if(c.isEnding) {
    closeModal();
    endGame(c.ending, c.xp);
    return;
  }
  checkLevelUp();
  // 顯示彈窗
  let extraBtns = '';
  if(c.check) {
    extraBtns = `<div class="panel" style="margin-top:12px">
      <div class="panel-title">判定：${c.check.skill} TN${c.check.tn}</div>
      <button onclick="doCommentCheck(${id}, ${c.check.tn}, '${c.check.skill}', ${c.check.success||null})">🎲 擲骰</button>
    </div>`;
  }
  if(c.triggerFinal) {
    extraBtns = `<div style="text-align:right;margin-top:12px">
      <button class="primary" onclick="closeModal();startFinalBattle()">▶ 進入最終決戰</button>
    </div>`;
  }
  showModal(`注釋 ${id}：${c.title||''}`, `
    <div class="note-card">
      <div class="note-num">📖 注釋 ${id}</div>
      <p>${c.text}</p>
    </div>
    ${extraBtns}
  `, c.triggerFinal?'':`<button onclick="closeModal();${callback?'('+callback.toString()+')()':''}">繼續</button>`);
}

function doCommentCheck(commentId, tn, skill, successComment) {
  const r = S.ranger;
  const mod = r.skills[skill]||0;
  const res = rollCheck(mod, tn, skill);
  log(`🎲 ${skill} 判定：d20(${res.roll})+${mod}=${res.total} vs TN${tn} → ${res.success?'成功':'失敗'}`, res.success?'info':'danger');
  closeModal();
  if(res.success) {
    if(successComment) {
      showComment(successComment);
    } else {
      render();
    }
  } else {
    // 失敗效果
    const c = COMMENTS[commentId];
    if(c.check && c.check.successOnFailAdd) {
      for(const n of c.check.successOnFailAdd) {
        if(S.scene) {
          const e = createEnemy(n);
          e.id = 'e'+Math.random().toString(36).slice(2,8);
          S.scene.enemies.push(e);
        }
      }
      log(`⚠ 失敗，出現額外敵人`, 'danger');
    }
    render();
  }
}

// ============================== 等級 ==============================
const LEVEL_XP = [
  {min:1,need:100},{min:6,need:150},{min:11,need:200},
  {min:16,need:250},{min:21,need:300},{min:31,need:400},
  {min:41,need:500},{min:51,need:1000}
];

function checkLevelUp() {
  const r = S.ranger;
  let leveled = false;
  while(true) {
    const bracket = LEVEL_XP.slice().reverse().find(b=>r.level+1>=b.min) || LEVEL_XP[0];
    const need = bracket.need;
    const prevNeed = r.level===0 ? 0 : (r.level<6?100:r.level<11?150:r.level<16?200:r.level<21?250:r.level<31?300:r.level<41?400:r.level<51?500:1000);
    if(r.xp >= need * (r.level+1)) {
      r.level++;
      applyLevelReward(r);
      leveled = true;
    } else break;
  }
  if(leveled) log(`🎉 升級！現在 Lv.${r.level}`, 'reward');
}

function applyLevelReward(r) {
  // 循環：技能→屬性→招募點數→能力
  const cycle = (r.level - 1) % 4;
  if(cycle===0) {
    // 技能總+5（單項≤+2）— 簡化為隨機分配
    let remaining = 5;
    const skillKeys = Object.keys(r.skills);
    while(remaining>0) {
      const sk = pick(skillKeys);
      const inc = Math.min(2, remaining);
      r.skills[sk] += inc;
      remaining -= inc;
    }
    log('📚 升級獎勵：技能總+5', 'info');
  } else if(cycle===1) {
    const opts = ['F','S','W','H'];
    const k = pick(opts);
    if(k==='H') r.H += 1;
    else r[k] += 1;
    log(`📈 升級獎勵：屬性提升（${k}）`, 'info');
  } else if(cycle===2) {
    r.rp += 10;
    log('💰 升級獎勵：招募點數+10', 'info');
  } else {
    log('✨ 升級獎勵：可學習新英雄能力或法術', 'info');
  }
}

// ============================== 死亡處理 ==============================
function handleHeroDeath() {
  if(S.ranger.curH > 0) return;
  log('💀 遊俠失去意識！', 'danger');
  // 生存判定 d20 + 1
  const r = d20();
  const total = r + 1;
  log(`🎲 生存判定：d20(${r})+1 = ${total}`, 'roll');
  if(total >= 9) {
    log('😇 完全恢復！', 'reward');
    S.ranger.curH = S.ranger.H;
  } else if(total >= 7) {
    log('😅 死裡逃生，失去所有非基礎裝備', 'info');
    S.ranger.curH = 1;
  } else if(total >= 5) {
    log('🤕 重傷：下場景生命值-5', 'danger');
    S.ranger.curH = 1;
  } else if(total >= 3) {
    log('💔 永久性傷害！', 'danger');
    S.ranger.curH = 1;
  } else {
    log('☠ 死亡！', 'danger');
    endGame('death');
    return;
  }
  render();
}

  return `
    <h1>🔥 最終對決</h1>
    <p style="color:#a09070;margin-bottom:12px">庭院中，恐懼之翼展開黑翼注視著你。帶著魔瓶逃離，或存活至第9回合！</p>
    <div class="turn-indicator">
      <div class="phase-chip ${fs.turnPhase==='player'?'active':''}">① 遊俠階段</div>
      <div class="phase-chip ${fs.turnPhase==='enemy'?'active':''}">② 敵人階段</div>
      <div class="phase-chip ${fs.turnPhase==='event'?'active':''}">③ 事件階段</div>
      <div class="stat-chip">回合 ${fs.round}/9</div>
      <div class="action-counter">${fs.turnPhase==='player'?`行動：${fs.actionsLeft}`:''}</div>
    </div>
    <div class="panel"><div class="panel-title">🛡 英雄</div><div class="h-scroll">${heroCards}</div></div>
    <div class="panel"><div class="panel-title">☠ 敵人</div><div class="h-scroll">${enemyCards}</div></div>
    <div class="panel" style="text-align:center">${actionBtns}</div>
  `;
}

function finalAttack(enemyId) {
  const fs = S.finalScene;
  if(fs.actionsLeft<=0) return;
  const e = fs.enemies.find(x=>x.id===enemyId);
  if(!e) return;
  const r = S.ranger;
  const result = resolveCombat(
    {name:r.name, F:r.F, armor:r.A, dmgBonus:0, crit:true},
    {name:e.name, F:e.F, armor:e.A, dmgBonus:0, crit:false}
  );
  fs.actionsLeft--;
  let msg = `⚔ ${r.name} 攻擊 ${e.name}：${result.aScore} vs ${result.dScore}`;
  if(result.crit) msg += '【暴擊】';
  if(result.winner==='attacker' && result.dmg>0) {
    e.curH -= result.dmg;
    msg += ` → 造成 ${result.dmg} 傷害（剩 ${Math.max(0,e.curH)}）`;
    if(e.curH<=0) {
      msg += ` → 💀 擊殺！+${e.xp} XP`;
      r.xp += e.xp;
      fs.enemies = fs.enemies.filter(x=>x.id!==e.id);
    }
  } else if(result.winner==='defender' && result.dmg>0) {
    r.curH -= result.dmg;
    msg += ` → 反被擊中，受到 ${result.dmg} 傷害`;
  } else {
    msg += ' → 未造成傷害';
  }
  log(msg, 'combat');
  if(r.curH<=0) { handleFinalDeath(); return; }
  render();
}

function finalFlee() {
  const r = S.ranger;
  // 逃離：d20 + M vs TN 14
  const res = rollCheck(r.M, 14, '逃離');
  log(`🎲 逃離判定：d20(${res.roll})+${r.M}=${res.total} vs TN14 → ${res.success?'成功':'失敗'}`, 'roll');
  if(res.success) {
    if(S.decanter) {
      endGame('victory', 150);
    } else {
      endGame('partial', 75);
    }
  } else {
    // 失敗：被攻擊
    const dmg = Math.max(0, d20()+2 - r.A);
    r.curH -= dmg;
    log(`☠ 逃離失敗，受到 ${dmg} 傷害`, 'danger');
    if(r.curH<=0) handleFinalDeath();
    else render();
  }
}

function finalEndPlayer() {
  S.finalScene.turnPhase = 'enemy';
  render();
}

function finalEnemyTurn() {
  const fs = S.finalScene;
  // 全部敵人攻擊遊俠
  for(const e of fs.enemies) {
    if(S.ranger.curH<=0) break;
    const result = resolveCombat(
      {name:e.name, F:e.F, armor:e.A, dmgBonus:0, crit:false},
      {name:S.ranger.name, F:S.ranger.F, armor:S.ranger.A, dmgBonus:0, crit:false}
    );
    let msg = `☠ ${e.name} 攻擊 ${S.ranger.name}：${result.aScore} vs ${result.dScore}`;
    if(result.winner==='attacker' && result.dmg>0) {
      S.ranger.curH -= result.dmg;
      msg += ` → 造成 ${result.dmg} 傷害（剩 ${Math.max(0,S.ranger.curH)}）`;
    } else if(result.winner==='defender' && result.dmg>0) {
      e.curH -= result.dmg;
      msg += ` → 反被擊中，受到 ${result.dmg} 傷害`;
      if(e.curH<=0) {
        S.ranger.xp += e.xp;
        fs.enemies = fs.enemies.filter(x=>x.id!==e.id);
        msg += ` → 擊殺！+${e.xp} XP`;
      }
    } else {
      msg += ' → 未造成傷害';
    }
    log(msg, 'danger');
  }
  if(S.ranger.curH<=0) { handleFinalDeath(); return; }
  fs.turnPhase = 'event';
  render();
}

function finalDrawEvent() {
  const fs = S.finalScene;
  if(fs.eventDeck.length===0 || fs.round>=9) {
    // 場景結束：若魔瓶持有 → 勝利；否則部分勝利
    if(S.decanter) endGame('victory', 150);
    else endGame('partial', 75);
    return;
  }
  const ev = fs.eventDeck.shift();
  log(`🃏 事件 ${ev.id}：${ev.text}`, 'info');
  // 簡化處理
  if(ev.effect.startsWith('addEnemy:')) {
    const names = ev.effect.slice(9).split('+');
    for(const n of names) {
      const e = createEnemy(n);
      e.id = 'e'+Math.random().toString(36).slice(2,8);
      fs.enemies.push(e);
    }
  } else if(ev.effect==='will12') {
    if(!rollCheck(S.ranger.W, 12).success) { S.ranger.curH -= 2; log('意志失敗受2傷害','danger'); }
  } else if(ev.effect==='will14') {
    if(!rollCheck(S.ranger.W, 14).success) { S.ranger.curH -= 2; log('意志失敗受2傷害','danger'); }
  } else if(ev.effect==='heal2') {
    S.ranger.curH = Math.min(S.ranger.H, S.ranger.curH + 5);
    log('💚 聖埃米莉亞幻象治癒遊俠', 'info');
  }
  fs.round++;
  if(S.ranger.curH<=0) { handleFinalDeath(); return; }
  if(fs.round > 9) {
    if(S.decanter) endGame('victory', 150);
    else endGame('partial', 75);
    return;
  }
  fs.turnPhase = 'player';
  fs.actionsLeft = 2;
  render();
}

function handleFinalDeath() {
  log('💀 遊俠在最終戰中倒下...', 'danger');
  // 生存判定減半
  const r = d20();
  const total = Math.ceil((r+1)/2);
  log(`🎲 生存判定（減半）：d20(${r})+1 → ${total}`, 'roll');
  if(total >= 9) endGame('death');
  else if(total >= 5) endGame('partial', 75);
  else endGame('death');
}

// ============================== 遊戲結束 ==============================
function endGame(ending, xpBonus) {
  S.phase = 'GAME_OVER';
  S.gameOver = true;
  S.ending = ending;
  if(xpBonus) S.ranger.xp += xpBonus;
  render();
}

function renderGameOver() {
  const r = S.ranger;
  let title, text, cls;
  if(S.ending==='victory') {
    title='🏆 勝利！'; cls='success-box';
    text='你帶著燃燒之光魔瓶成功逃離女修道院，衝破黑雲回到阿拉多爾。上交魔瓶後，營地為你舉辦慶祝。魔瓶將送往塔利斯的大型醫院，為無數患者帶來慰藉！';
  } else if(S.ending==='partial') {
    title='📜 部分勝利'; cls='info-box';
    text='你帶著沉重的心情返回阿拉多爾。任務失敗，魔瓶仍藏在女修道院某處。但你的努力獲得讚賞——能活著回來本身已是成就。';
  } else {
    title='💀 遊戲結束'; cls='warn-box';
    text='你的遊俠在暗影深淵中倒下。王國失去了一位英雄，但他們的故事將被傳頌。';
  }
  return `
    <h1>${title}</h1>
    <div class="${cls}" style="font-size:15px;line-height:1.8">${text}</div>
    <div class="panel" style="margin-top:20px">
      <div class="panel-title">最終統計</div>
      <div class="grid-2">
        <div class="equip-item"><span>遊俠名稱</span><b>${r.name}</b></div>
        <div class="equip-item"><span>等級</span><b>${r.level}</b></div>
        <div class="equip-item"><span>經驗值</span><b>${r.xp}</b></div>
        <div class="equip-item"><span>已探索地點</span><b>${S.visited.length}/8</b></div>
        <div class="equip-item"><span>是否取得魔瓶</span><b>${S.decanter?'是':'否'}</b></div>
        <div class="equip-item"><span>最終搜索地點</span><b>${S.finalSearch||'未進行'}</b></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:20px">
      <button class="primary" onclick="restart()">🔄 重新開始</button>
    </div>
  `;
}

function restart() {
  if(!confirm('確定重新開始？當前進度將遺失。')) return;
  S = null;
  setupState = null;
  localStorage.removeItem('shadowdeep_save');
  initSetup();
  S = createInitialState();
  S.phase = 'SETUP';
  render();
}

      <p>在聖埃米莉亞女修道院中找到「燃燒之光魔瓶」，帶著它逃離暗影深淵。</p>

      <h3 style="color:#f0c060">🗺 探索流程</h3>
      <ol style="margin-left:20px">
        <li>從地圖上選擇 A/B/C 之一作為起點</li>
        <li>完成場景後，可移動到相鄰地點</li>
        <li>8 個地點任意探索，直到你確定魔瓶位置</li>
        <li>當你準備好時，點擊「最終搜索」並選擇地點</li>
      </ol>

      <h3 style="color:#f0c060">🎲 核心判定</h3>
      <ul style="margin-left:20px">
        <li>屬性/技能判定：d20 + 加值 ≥ TN 即成功</li>
        <li>天然 20 必成功，天然 1 必失敗</li>
        <li>戰鬥：d20+F vs d20+F，傷害 = 勝方分 − 敗方護甲</li>
        <li>天然 20 暴擊：自動勝 + 額外 5 傷害</li>
      </ul>

      <h3 style="color:#f0c060">⚔ 回合流程</h3>
      <ol style="margin-left:20px">
        <li><b>遊俠階段</b>：2 次行動（攻擊/互動/施法）</li>
        <li><b>同伴階段</b>：每個同伴自動攻擊</li>
        <li><b>敵人階段</b>：所有敵人自動攻擊</li>
        <li><b>事件階段</b>：抽 1 張事件卡</li>
      </ol>

      <h3 style="color:#f0c060">🔍 興趣點</h3>
      <p>點擊場景中的興趣點卡片進行判定，成功可獲得線索、寶藏、隊友或 XP。部分興趣點分級，TN 越高獎勵越豐厚。</p>

      <h3 style="color:#f0c060">💀 死亡</h3>
      <p>生命值歸零需進行生存判定（遊俠 d20+1）。7+ 死裡逃生，9+ 完全恢復，3-4 永久傷害，1-2 死亡。</p>

      <h3 style="color:#f0c060">💾 存檔</h3>
      <p>點擊頂部「存檔」按鈕儲存進度。重新載入後點「讀檔」恢復（未自動讀取）。</p>

      <h3 style="color:#f0c060">🎁 寶藏</h3>
      <p>場景結束後，每收集 1 個寶藏標記擲 d20：1-6 黃金（+10XP）、7-12 草藥、13-16 裝備、17-20 魔法物品。</p>
    </div>
  `);
}

function showStatusPanel() {
  const r = S.ranger;
  let skillsHtml = SKILLS.map(s=>`<div class="skill-row"><span>${s}</span><span class="val">+${r.skills[s]||0}</span></div>`).join('');
  showModal('📋 遊俠狀態', `
    <div class="grid-2">
      <div>
        <h3>基本</h3>
        <div class="equip-item"><span>名稱</span><b>${r.name}</b></div>
        <div class="equip-item"><span>等級</span><b>${r.level}</b></div>
        <div class="equip-item"><span>經驗值</span><b>${r.xp}</b></div>
        <div class="equip-item"><span>生命值</span><b>${r.curH}/${r.H}</b></div>
        <div class="equip-item"><span>M/F/S/A/W</span><b>${r.M}/${r.F}/${r.S}/${r.A}/${r.W}</b></div>
        <h3 style="margin-top:12px">裝備</h3>
        ${r.equipment.map(e=>`<div class="equip-item">${e}</div>`).join('')}
        <h3 style="margin-top:12px">能力與法術</h3>
        ${r.abilities.map(a=>`<div class="equip-item">${a}</div>`).join('')||'<div class="empty-msg">無</div>'}
        ${r.spells.map(s=>`<div class="equip-item">✨ ${s}</div>`).join('')}
      </div>
      <div>
        <h3>技能</h3>
        ${skillsHtml}
      </div>
    </div>
  `);
}

function showCompanionsPanel() {
  let html = '';
  if(S.companions.length===0) html = '<div class="empty-msg">目前沒有同伴</div>';
  else {
    for(const c of S.companions) {
      html += `<div class="equip-item" style="flex-direction:column;align-items:flex-start">
        <div><b>${c.name}</b> ${c.curH>0?'<span class="tag green">存活</span>':'<span class="tag red">陣亡</span>'}</div>
        <div style="font-size:11px;color:#a09070">M${c.M} F${c.F} S${c.S} A${c.A} W${c.W} H${c.curH}/${c.H}</div>
      </div>`;
    }
  }
  showModal('👥 同伴', html);
}

// ============================== 初始化 ==============================
function init() {
  S = createInitialState();
  initSetup();
  render();
  // 檢查是否有存檔
  if(localStorage.getItem('shadowdeep_save')) {
    const load = confirm('發現存檔，是否載入？\n（選擇「取消」將開始新遊戲）');
    if(load) loadGame();
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
