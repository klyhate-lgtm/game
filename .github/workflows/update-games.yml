name: Auto Update Game List

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 必須保留，否則 rev-list 拿不到完整歷史

      - name: Generate games.json with version
        run: |
          python3 - <<'PY'
          import os, json, subprocess

          def git(*args):
              try:
                  return subprocess.check_output(['git', *args]).decode('utf-8').strip()
              except Exception:
                  return ''

          games = []
          for f in os.listdir('.'):
              if f.endswith('.html') and f != 'index.html':
                  title = f[:-5]

                  # 最後更新時間
                  time_str = git('log', '-1', '--format=%cd',
                                 '--date=format:%Y-%m-%d %H:%M', '--', f) or '未知時間'

                  # 該檔案被 commit 的次數 = 版本號
                  try:
                      version = int(git('rev-list', '--count', 'HEAD', '--', f)) or 1
                  except ValueError:
                      version = 1

                  # 第 1 版 = 新增；之後 = 更新
                  change_type = 'new' if version == 1 else 'update'

                  games.append({
                      'title': title,
                      'file': f,
                      'time': time_str,
                      'version': version,
                      'changeType': change_type
                  })

          games.sort(key=lambda x: x['time'], reverse=True)
          with open('games.json', 'w', encoding='utf-8') as out:
              json.dump(games, out, ensure_ascii=False, indent=2)
          PY

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add games.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update games.json" && git push)
