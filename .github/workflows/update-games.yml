name: Auto Update Game List

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必須設定為 0，才能讀取完整的 Git 歷史紀錄

      - name: Generate games.json with Real Git Time
        run: |
          python3 -c "
          import os, json, subprocess
          games = []
          for f in os.listdir('.'):
              if f.endswith('.html') and f != 'index.html':
                  title = f[:-5]
                  # 使用 git log 抓取該檔案最後一次 commit 的時間
                  try:
                      time_str = subprocess.check_output(
                          ['git', 'log', '-1', '--format=%cd', '--date=format:%Y-%m-%d %H:%M', f]
                      ).decode('utf-8').strip()
                  except Exception:
                      time_str = '未知時間'
                  
                  games.append({'title': title, 'file': f, 'time': time_str})
                  
          # 依照時間反序排列 (最新在最上面)
          games.sort(key=lambda x: x['time'], reverse=True)
          with open('games.json', 'w', encoding='utf-8') as out:
              json.dump(games, out, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add games.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update games.json" && git push)
