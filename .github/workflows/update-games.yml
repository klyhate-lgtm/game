name: Auto Update Game List

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate games.json with Time
        run: |
          python3 -c "
          import os, json, datetime
          games = []
          for f in os.listdir('.'):
              if f.endswith('.html') and f != 'index.html':
                  title = f[:-5]
                  # 取得檔案最後修改時間
                  mtime = os.path.getmtime(f)
                  time_str = datetime.datetime.fromtimestamp(mtime).strftime('%Y-%m-%d %H:%M')
                  games.append({'title': title, 'file': f, 'time': time_str})
          # 依照時間反序排列 (最新在最上面)
          games.sort(key=lambda x: x['time'], reverse=True)
          with open('games.json', 'w', encoding='utf-8') as out:
              json.dump(games, out, ensure_ascii=False, indent=2)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add games.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update games.json" && git push)
