<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌸 WEB桌遊</title>
<script async src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root {
    --bg-color: #fff5f6;
    --text-main: #5a4a42;
    --primary: #ff9a9e;
    --secondary: #fecfef;
    --card-bg: #ffffff;
    --shadow: 0 8px 20px rgba(255, 154, 158, 0.2);
  }

  body {
    background: linear-gradient(135deg, var(--bg-color) 0%, var(--secondary) 100%);
    color: var(--text-main);
    font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 30px 20px;
    background-attachment: fixed;
  }

  .container {
    width: 100%;
    max-width: 600px;
  }

  h1 {
    font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
    font-size: 2.2rem;
    text-align: center;
    color: #ff6b81;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0px #fff;
  }

  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #b08a8a;
    margin-bottom: 30px;
  }

  /* 日誌看板 */
  .log-board {
    background: rgba(255, 255, 255, 0.7);
    border-radius: 20px;
    padding: 15px 20px;
    margin-bottom: 25px;
    border: 2px dashed #ffb6c1;
    font-size: 0.9rem;
    box-shadow: 0 4px 10px rgba(0,0,0,0.02);
  }
  .log-board h3 {
    margin: 0 0 10px 0;
    color: #ff6b81;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .log-list {
    margin: 0;
    padding-left: 20px;
    color: #7a6b63;
    line-height: 1.6;
  }

  /* 🔍 搜尋框 */
  .search-wrapper {
    margin-bottom: 20px;
  }
  .search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 20px;
    border-radius: 999px;
    border: 2px solid #ffd0d6;
    background: rgba(255, 255, 255, 0.85);
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text-main);
    outline: none;
    transition: all 0.25s;
    box-shadow: 0 4px 10px rgba(255, 154, 158, 0.12);
  }
  .search-input:focus {
    border-color: #ff9a9e;
    background: #fff;
    box-shadow: 0 6px 18px rgba(255, 154, 158, 0.28);
  }
  .search-input::placeholder {
    color: #c9a8a8;
  }

  /* 遊戲選單 */
  #menu {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .game-card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 2px solid transparent;
  }

  .game-card:hover {
    transform: translateY(-5px) scale(1.02);
    border-color: #ffb6c1;
    box-shadow: 0 12px 25px rgba(255, 154, 158, 0.3);
  }

  .game-info {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .game-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #ff6b81;
  }

  .game-time {
    font-size: 0.8rem;
    color: #b08a8a;
  }

  .badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: #ffe0e6;
    color: #ff6b81;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge.new {
    background: #ff6b81;
    color: #fff;
  }

  /* 點擊率標籤 */
  .game-views {
    background: #f0f8ff;
    color: #7cb3d9;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  #loading {
    color: #ff9a9e;
    text-align: center;
    font-size: 1.2rem;
    animation: pulse 1.5s infinite;
  }

  .empty {
    text-align: center;
    color: #b08a8a;
    padding: 25px 0;
    font-size: 0.95rem;
  }

  @keyframes pulse {
    0% { opacity: 0.6; transform: scale(0.98); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.6; transform: scale(0.98); }
  }
</style>
</head>
<body>

<div class="container">
  <h1>🌸 時空旅行者檔案庫</h1>
  <div class="subtitle">✦ 點擊卡片開始你的冒險 ✦</div>

  <!-- 更新日誌區塊 -->
  <div class="log-board" id="logBoard" style="display: none;">
    <h3>📜 冒險者手札（最近更新）</h3>
    <ul class="log-list" id="logList"></ul>
  </div>

  <!-- 🔍 搜尋框 -->
  <div class="search-wrapper">
    <input id="searchInput" class="search-input" type="text"
           placeholder="🔍 搜尋遊戲名稱…" autocomplete="off">
  </div>

  <!-- 遊戲列表區塊 -->
  <div id="menu">
    <div id="loading">正在施展讀取魔法... 🪄</div>
  </div>
  <div id="empty" class="empty" style="display:none;">找不到符合的遊戲 🥺</div>
</div>

<script>
  /* ============ 點擊計數設定 ============ */
  const NS = 'klyhate-lgtm-games';

  const APIS = [
    {
      name: 'abacus',
      get: k => `https://abacus.jasoncameron.dev/get/${NS}/${k}`,
      hit: k => `https://abacus.jasoncameron.dev/hit/${NS}/${k}`,
      read: d => Number(d && (d.value !== undefined ? d.value : d.count))
    },
    {
      name: 'counterapi',
      get: k => `https://api.counterapi.dev/v1/${NS}/${k}`,
      hit: k => `https://api.counterapi.dev/v1/${NS}/${k}/up`,
      read: d => Number(d && (d.count !== undefined ? d.count : d.value))
    }
  ];

  let lockedApi = null;

  /* ============ 簡繁轉換 ============ */
  const openccReady = new Promise(resolve => {
    if (window.OpenCC) return resolve(window.OpenCC);
    const timer = setInterval(() => {
      if (window.OpenCC) { clearInterval(timer); resolve(window.OpenCC); }
    }, 100);
    setTimeout(() => { clearInterval(timer); resolve(window.OpenCC || null); }, 5000);
  });

  let toTW = null;   // 簡 → 繁
  let toCN = null;   // 繁 → 簡

  async function initOpenCC() {
    const OpenCC = await openccReady;
    if (!OpenCC) return;
    try {
      toTW = OpenCC.Converter({ from: 'cn', to: 'tw' });
      toCN = OpenCC.Converter({ from: 'tw', to: 'cn' });
    } catch (e) {
      console.warn('OpenCC 初始化失敗', e);
    }
  }

  // 回傳一個字串的「原文 / 繁體 / 簡體」變體（去重、小寫）
  function variants(str) {
    const lower = String(str).toLowerCase();
    const arr = [lower];
    if (toTW) arr.push(toTW(lower));
    if (toCN) arr.push(toCN(lower));
    return [...new Set(arr)];
  }

  /* ============ 工具 ============ */
  function hashKey(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
    return 'g' + h.toString(36);
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  async function fetchJSON(url, ms = 3000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  /* ============ 計數 ============ */
  async function readCount(key) {
    const list = lockedApi ? [lockedApi] : APIS;
    for (const api of list) {
      try {
        const data = await fetchJSON(api.get(key));
        const v = api.read(data);
        if (Number.isFinite(v)) {
          if (!lockedApi) lockedApi = api;
          return v;
        }
      } catch (e) { /* 換下一套 API */ }
    }
    return null;
  }

  async function bumpCount(key) {
    const list = lockedApi ? [lockedApi] : APIS;
    for (const api of list) {
      try {
        const res = await fetch(api.hit(key), { keepalive: true });
        if (!res.ok) throw new Error();
        if (!lockedApi) lockedApi = api;
        return;
      } catch (e) { /* 換下一套 API */ }
    }
  }

  /* ============ 遊戲列表 ============ */
  let cardEls = [];
  let gamesLoaded = false;

  function applyFilter() {
    const raw = document.getElementById('searchInput').value.trim().toLowerCase();
    const qList = raw ? variants(raw) : [];
    let visible = 0;
    cardEls.forEach(el => {
      const match = !raw || qList.some(q => el.dataset.search.includes(q));
      el.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    document.getElementById('empty').style.display =
      (gamesLoaded && visible === 0) ? 'block' : 'none';
  }

  function renderGames(games) {
    const menu = document.getElementById('menu');
    menu.innerHTML = '';
    cardEls = [];

    games.forEach(game => {
      const key = hashKey(game.file);
      const isNew = game.changeType === 'new';
      const badge = isNew
        ? '<span class="badge new">NEW</span>'
        : (game.version ? `<span class="badge">v${game.version}</span>` : '');

      const a = document.createElement('a');
      a.href = encodeURI(game.file);
      a.className = 'game-card';

      // 🔑 搜尋索引：標題 + 檔名，各自展開成原文 / 繁體 / 簡體
      a.dataset.search = variants(`${game.title} ${game.file}`).join(' ');

      a.innerHTML = `
        <div class="game-info">
          <div class="game-title">🎮 ${escapeHTML(game.title)}${badge}</div>
          <div class="game-time">🕒 ${escapeHTML(game.time || '')}</div>
        </div>
        <div class="game-views">
          <span class="views-count" id="views-${key}">👁️ …</span>
          <span>➤ 開始</span>
        </div>
      `;

      a.addEventListener('click', () => {
        bumpCount(key);
        const el = document.getElementById(`views-${key}`);
        if (el && el.dataset.count !== undefined) {
          const n = Number(el.dataset.count) + 1;
          el.dataset.count = n;
          el.textContent = `👁️ ${n}`;
        }
      });

      menu.appendChild(a);
      cardEls.push(a);

      readCount(key).then(v => {
        const el = document.getElementById(`views-${key}`);
        if (!el) return;
        if (v === null) {
          el.textContent = '👁️ –';
        } else {
          el.dataset.count = v;
          el.textContent = `👁️ ${v}`;
        }
      });
    });

    gamesLoaded = true;
    applyFilter();
  }

  async function loadGames() {
    const menu = document.getElementById('menu');
    const logBoard = document.getElementById('logBoard');
    const logList = document.getElementById('logList');

    // 先等 OpenCC 就緒（最多等 5 秒，失敗就退回原文比對）
    await initOpenCC();

    try {
      const response = await fetch('games.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('找不到 games.json');

      const games = await response.json();
      logList.innerHTML = '';

      games.slice(0, 3).forEach(game => {
        const li = document.createElement('li');
        if (game.changeType === 'new') {
          li.textContent = `${game.time} 新增了《${game.title}》`;
        } else {
          li.textContent = `${game.time} 更新了《${game.title}》（第 ${game.version || 1} 版）`;
        }
        logList.appendChild(li);
      });
      if (games.length > 0) logBoard.style.display = 'block';

      renderGames(games);

    } catch (error) {
      gamesLoaded = true;
      menu.innerHTML = `<div style="color:#ff6b81;text-align:center;">讀取失敗 🥺<br><small>${escapeHTML(error.message)}</small></div>`;
    }
  }

  document.getElementById('searchInput').addEventListener('input', applyFilter);

  loadGames();
</script>
</body>
</html>
