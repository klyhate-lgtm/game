<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雜種精靈之劍 · 無限地牢</title>
<style>
  :root{
    --bg:#0e0b08; --panel:#1a1410; --panel2:#221a13; --line:#3d3020;
    --gold:#c9a227; --gold-dim:#7a6220; --text:#e6dcc8; --muted:#8a7c66;
    --red:#b8453a; --green:#5f8a4a; --blue:#4a7a9a; --purple:#7a4a8a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:radial-gradient(ellipse at 50% 0%,#1a120b 0%,#0e0b08 70%);
    color:var(--text); font-family:"Noto Serif TC","Songti TC","PingFang TC",serif;
    min-height:100vh; padding:12px; line-height:1.7; font-size:15px;
  }
  .app{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start;}
  @media(max-width:840px){.app{grid-template-columns:1fr;}}
  .side{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:12px;}
  .brand{font-size:12px;letter-spacing:3px;color:var(--gold-dim);font-weight:700;text-align:center;margin-bottom:10px;}
  .brand b{display:block;font-size:17px;color:var(--gold);letter-spacing:2px;margin-top:2px;}
  .stat{margin-bottom:10px;}
  .stat .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px;}
  .stat .lbl b{color:var(--gold);font-size:13px;}
  .bar{height:9px;border-radius:99px;background:#0a0806;overflow:hidden;border:1px solid var(--line);}
  .bar > i{display:block;height:100%;transition:width .3s;}
  .bar.elan > i{background:linear-gradient(90deg,#8a4a3a,#c96a4a);}
  .bar.effort > i{background:linear-gradient(90deg,#3a6a4a,#6a9a5a);}
  .fists-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .fists-row b{color:var(--gold);font-size:15px;}
  .floor-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .floor-row b{color:var(--gold);font-size:15px;}
  .sec-title{font-size:11px;letter-spacing:2px;color:var(--gold-dim);margin:14px 0 6px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px;}
  .inv{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;}
  .inv::-webkit-scrollbar{width:4px;}
  .inv::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  .inv-item{display:flex;align-items:center;gap:6px;font-size:12.5px;background:#140f0b;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--text);position:relative;}
  .inv-item:hover{border-color:var(--gold-dim);}
  .inv-item.eq{border-color:var(--gold-dim);background:#1e1810;}
  .inv-item .ico{font-size:14px;}
  .inv-item .slot{font-size:10px;color:var(--muted);margin-left:auto;}
  .money{display:flex;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .money span{background:#140f0b;border:1px solid var(--line);border-radius:6px;padding:3px 8px;}
  .money b{color:var(--gold);}
  .main{background:linear-gradient(180deg,#1c1610,#141008);border:1px solid var(--line);border-radius:12px;padding:20px;min-height:70vh;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .sec-num{font-size:12px;color:var(--gold-dim);letter-spacing:2px;margin-bottom:10px;font-weight:700;}
  .sec-text p{margin-bottom:12px;}
  .sec-text b{color:var(--gold);}
  .sec-text em{color:var(--muted);font-style:normal;}
  .choices{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
  .choice{background:linear-gradient(180deg,#241a10,#1a120a);border:1px solid var(--line);border-radius:9px;padding:11px 16px;color:var(--gold);font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;font-size:14.5px;text-align:left;}
  .choice:hover{background:linear-gradient(180deg,#332416,#241a10);border-color:var(--gold);}
  .choice:active{transform:scale(.99);}
  .choice:disabled{opacity:.4;cursor:not-allowed;}
  .item-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:14px 0;}
  .pick{background:#140f0b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12.5px;transition:.15s;user-select:none;}
  .pick:hover{border-color:var(--gold-dim);}
  .pick.on{border-color:var(--gold);background:#2a2010;box-shadow:0 0 10px rgba(201,162,39,.25);}
  .pick .n{font-weight:700;color:var(--text);}
  .pick .t{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;backdrop-filter:blur(3px);}
  .modal.on{display:flex;}
  .dialog{background:linear-gradient(180deg,#221a12,#140f0a);border:2px solid var(--gold-dim);border-radius:14px;padding:22px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto;}
  .dialog h3{color:var(--gold);font-size:18px;margin-bottom:4px;letter-spacing:1px;}
  .dialog .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .dice-area{background:#0a0806;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;min-height:70px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;}
  .d6{width:44px;height:44px;background:#f0e6d0;border-radius:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:6px;box-shadow:0 3px 8px rgba(0,0,0,.5);animation:rollIn .4s ease-out;}
  @keyframes rollIn{from{transform:rotate(-180deg) scale(.4);opacity:0;}to{transform:none;opacity:1;}}
  .d6 .dot{background:#2a1a0a;border-radius:50%;transform:scale(.6);}
  .d6.enemy{background:#d8b0a0;}
  .d6.enemy .dot{background:#5a1a0a;}
  .hassle-info{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;}
  .hassle-info span{background:#140f0b;border:1px solid var(--line);border-radius:6px;padding:3px 9px;}
  .hassle-info b{color:var(--gold);}
  .effort-slider{margin:12px 0;}
  .effort-slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .effort-slider label b{color:var(--gold);font-size:15px;}
  input[type=range]{width:100%;-webkit-appearance:none;height:8px;border-radius:99px;background:linear-gradient(90deg,#3a6a4a,#8a4a3a);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid #5a4010;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.6);}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid #5a4010;cursor:pointer;}
  .roll-result{text-align:center;font-size:14px;margin:10px 0;min-height:24px;}
  .roll-result.good{color:#8ac97a;font-weight:700;font-size:16px;}
  .roll-result.bad{color:#e08a7a;font-weight:700;font-size:16px;}
  .btn{background:linear-gradient(180deg,#3a2c18,#2a2010);border:1px solid var(--gold-dim);color:var(--gold);padding:10px 20px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;width:100%;}
  .btn:hover{background:#4a3820;border-color:var(--gold);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .log{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--muted);max-height:140px;overflow-y:auto;}
  .log div{padding:2px 0;}
  .log .g{color:#8ac97a;} .log .r{color:#e08a7a;} .log .y{color:var(--gold);}
  .end-screen{text-align:center;padding:30px 10px;}
  .end-screen h2{color:var(--gold);font-size:24px;margin-bottom:12px;letter-spacing:3px;}
  .end-screen p{color:var(--muted);max-width:480px;margin:0 auto 20px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(20,15,10,.96);border:1px solid var(--gold-dim);color:var(--gold);padding:9px 22px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;font-weight:600;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .side-btn{display:block;width:100%;margin-top:6px;background:#140f0b;border:1px solid var(--line);color:var(--muted);padding:6px;border-radius:6px;font-family:inherit;font-size:12px;cursor:pointer;}
  .side-btn:hover{color:var(--gold);border-color:var(--gold-dim);}
  .recipe-row{display:flex;justify-content:space-between;align-items:center;background:#140f0b;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;margin-bottom:6px;}
  .recipe-row button{width:auto;padding:4px 12px;font-size:12px;}
  .insanity{font-size:11px;color:#b8453a;margin-top:6px;}
  .stat-note{font-size:11px;color:var(--muted);margin-top:2px;}
  textarea{width:100%;background:#0a0806;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font-family:inherit;font-size:13px;min-height:90px;outline:none;resize:vertical;}
  textarea:focus{border-color:var(--gold-dim);}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">THE SWORD OF THE<b>雜種精靈之劍</b></div>

    <div class="stat">
      <div class="lbl">銳氣 ÉLAN <b><span id="s-elan">-</span>/<span id="s-elanmax">-</span></b></div>
      <div class="bar elan"><i id="b-elan" style="width:100%"></i></div>
    </div>
    <div class="stat">
      <div class="lbl">毅力 EFFORT <b><span id="s-effort">-</span>/<span id="s-effortmax">-</span></b></div>
      <div class="bar effort"><i id="b-effort" style="width:100%"></i></div>
    </div>
    <div class="fists-row"><span>鐵拳 FISTS</span><b id="s-fist">-</b></div>
    <div class="floor-row"><span>地牢深度</span><b id="s-floor">1</b></div>
    <div class="fists-row" style="margin-bottom:4px"><span>經驗 / 等級</span><b><span id="s-exp">0</span> / <span id="s-lv">1</span></b></div>
    <div class="fists-row" style="margin-bottom:4px"><span>醉酒</span><b id="s-drunk">清醒</b></div>
    <div class="fists-row" style="margin-bottom:10px"><span>精神錯亂</span><b id="s-insane">無</b></div>

    <div class="sec-title">金錢</div>
    <div class="money">
      <span>🪙 金吉爾德 <b id="s-gold">0</b></span>
      <span>🥉 銅格羅特 <b id="s-groat">0</b></span>
    </div>

    <div class="sec-title">物品欄</div>
    <div class="inv" id="inv-box"></div>

    <div class="sec-title">製作</div>
    <div id="craft-box" style="font-size:12px;color:var(--muted);">暫無可合成配方</div>

    <div class="sec-title">冒險日誌</div>
    <div class="log" id="log-box"></div>

    <button class="side-btn" id="btn-scroll">📜 真言之力 / 備註</button>
    <button class="side-btn" id="btn-restart">↺ 重新開始</button>
  </aside>

  <main class="main">
    <div class="sec-num" id="sec-num"></div>
    <div class="sec-text" id="sec-text"></div>
    <div id="extra"></div>
    <div class="choices" id="choices"></div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="dialog" id="dialog"></div>
</div>

<div class="toast" id="toast"></div>

<script>

const START_ITEMS = ['pole','burg','buckles','sword','bow','rope','hat','diploma','cloak','pcs','map','orb','poultice','purse','key','dagger','buckler','gambeson','rations','torch','sleeping','potion'];

/* ============================================================
   製作配方
============================================================ */
const RECIPES = [

   怪物庫
============================================================ */

/* ============================================================
   精神錯亂 / 歲月摧頹
============================================================ */
const INSANITIES = [
  '嗜酒如命','妄想症','抑鬱消沉','幻覺纏身','盜竊癖','偏執多疑','老年痴呆'
];

/* ============================================================
   狀態
============================================================ */
let S = null;
let H = null;

function defaultState(){
  return {
    elan: 8, elanMax: 8,
    effort: 80, effortMax: 80,
    fist: 2,
    gold: 0, groat: 0,
    exp: 0, level: 1,
    drunk: 0,              // 0 清醒 / 1 微醺 / 2 酩酊 / 3 爛醉
    insanity: [],
    inv: [],
    floor: 1,
    room: 0,
    phase: 'roll',         // roll | pick | room | done
    log: [],
    picked: [],
    currentEvent: null,
    done: false,
    rolled: null,
    words: '',             // 真言之力
    notes: '',             // 備註
    restCount: 0,
    olderCount: 0
  };
}

/* ============================================================
   工具
============================================================ */
const $ = s => document.querySelector(s);
const d6 = () => Math.floor(Math.random()*6)+1;
const pick = a => a[Math.floor(Math.random()*a.length)];

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('on'), 1600);
}
function log(msg, cls=''){
  S.log.push({msg, cls});
  if (S.log.length > 80) S.log.shift();
  renderLog();
}
function renderLog(){
  const el = $('#log-box');
  el.innerHTML = S.log.map(l=>`<div class="${l.cls}">${l.msg}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

const SAVE_KEY = 'bastard_elf_infinite_v2';
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || typeof d.floor !== 'number') return false;
    S = Object.assign(defaultState(), d);
    if (!Array.isArray(S.inv)) S.inv = [];
    if (!Array.isArray(S.log)) S.log = [];
    if (!Array.isArray(S.picked)) S.picked = [];
    if (!Array.isArray(S.insanity)) S.insanity = [];
    return true;
  }catch(e){ return false; }
}

/* ============================================================
   有效屬性（含裝備、醉酒、精神錯亂修正）
============================================================ */
function effectiveFist(){
  let f = S.fist + equipBonus('fist');
  if (S.drunk >= 1) f += 1;      // 微醺 +1
  if (S.drunk >= 3) f -= 2;      // 爛醉 -2（合計 -1）
  if (S.insanity.includes('抑鬱消沉')) f = Math.max(1, f); // 不直接加，後面消耗額外
  return Math.max(1, f);
}
function effectiveElan(){
  let e = S.elan + equipBonus('elan');
  if (S.drunk >= 1) e -= 2;      // 醉酒 -2
  if (S.insanity.includes('偏執多疑')) e = Math.max(1, e);
  return Math.max(1, e);
}
function equipBonus(type){
  let b = 0;
  S.inv.forEach(it=>{
    if (!it.equipped) return;
    const d = ITEMS[it.id];
    if (d && d.bonus && d.bonus[type]) b += d.bonus[type];
  });
  return b;
}
function hasItem(id){
  return S.inv.some(it=>it.id === id);
}
function addItem(id, equipped=false){
  if (!ITEMS[id]) return;
  S.inv.push({id, equipped});
}
function removeItem(id){
  const i = S.inv.findIndex(it=>it.id === id);
  if (i >= 0) S.inv.splice(i,1);
}

/* ============================================================
   渲染
============================================================ */
function render(){
  const elanMax = S.elanMax + equipBonus('elan');
  const fist = effectiveFist();

  $('#s-elan').textContent = S.elan;
  $('#s-elanmax').textContent = elanMax;
  $('#b-elan').style.width = Math.max(0, Math.min(100, S.elan/elanMax*100)) + '%';

  $('#s-effort').textContent = S.effort;
  $('#s-effortmax').textContent = S.effortMax;
  $('#b-effort').style.width = Math.max(0, Math.min(100, S.effort/S.effortMax*100)) + '%';

  $('#s-fist').textContent = fist;
  $('#s-floor').textContent = S.floor;
  $('#s-gold').textContent = S.gold;
  $('#s-groat').textContent = S.groat;
  $('#s-exp').textContent = S.exp;
  $('#s-lv').textContent = S.level;

  const drunkNames = ['清醒','微醺','酩酊','爛醉'];
  $('#s-drunk').textContent = drunkNames[Math.min(3, S.drunk)];

  $('#s-insane').textContent = S.insanity.length ? S.insanity.join('、') : '無';

  /* 物品欄 */
  const inv = $('#inv-box');
  if (!S.inv.length){
    inv.innerHTML = '<span style="color:var(--muted);font-size:12px;">空空如也</span>';
  } else {
    inv.innerHTML = S.inv.map((it,i)=>{
      const d = ITEMS[it.id] || {name:it.id, ico:'❓', type:'junk', desc:''};
      const slot = d.type === 'equip' && d.slot ? `<span class="slot">${SLOT_NAMES[d.slot]||''}</span>` : '';
      return `<div class="inv-item ${it.equipped?'eq':''}" title="${d.desc}" data-i="${i}">
        <span class="ico">${d.ico}</span><span>${d.name}</span>${slot}
      </div>`;
    }).join('');
  }

  /* 製作 */
  renderCraft();

  renderMain();
  save();
}

function renderCraft(){
  const box = $('#craft-box');
  const avail = [];
  RECIPES.forEach(r=>{
    const can = r.need.every(n=>S.inv.filter(it=>it.id===n).length >= 1);
    if (can) avail.push(r);
  });
  if (!avail.length){
    box.innerHTML = '<span style="color:var(--muted);font-size:12px;">暫無可合成配方</span>';
    return;
  }
  box.innerHTML = avail.map(r=>`
    <div class="recipe-row">
      <span>${r.desc}</span>
      <button class="btn" data-recipe="${r.id}">合成</button>
    </div>`).join('');
  box.querySelectorAll('[data-recipe]').forEach(btn=>{
    btn.onclick = ()=>{
      const r = RECIPES.find(x=>x.id===btn.dataset.recipe);
      if (!r) return;
      // 消耗材料
      r.need.forEach(n=>{
        const i = S.inv.findIndex(it=>it.id===n);
        if (i>=0) S.inv.splice(i,1);
      });
      addItem(r.result);
      log(`合成了 ${ITEMS[r.result].name}。`, 'g');
      toast(`合成：${ITEMS[r.result].name}`);
      render();
    };
  });
}

function renderMain(){
  const num = $('#sec-num');
  const text = $('#sec-text');
  const extra = $('#extra');
  const choices = $('#choices');
  extra.innerHTML = ''; choices.innerHTML = '';

  if (S.done){ renderEnd(); return; }

  /* 擲骰建角 */
  if (S.phase === 'roll'){
    num.textContent = '✦ 啟程';
    text.innerHTML = `
      <p>私生精靈的世界充滿隨機性，而你的精靈大半輩子都游手好閒、一無是處——
      因此，比起精心準備，運氣在初始屬性的設定中扮演著更重要的角色。</p>
      <p><em>換句話說，我們要靠擲骰子來決定一切。</em></p>`;
    if (!S.rolled){
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = '🎲 擲骰決定屬性';
      b.onclick = ()=>{
        const r1 = d6();
        const elan = Math.ceil(r1/2) + 6;
        const r2a = d6(), r2b = d6();
        const effort = (r2a+r2b)*10;
        S.rolled = {elan, effort, r1, r2a, r2b};
        render();
      };
      choices.appendChild(b);
      return;
    }
    const r = S.rolled;
    text.innerHTML = `
      <p><b>銳氣 ÉLAN</b>：1 顆骰子擲出 ${r.r1} → ÷2 向上取整 = ${Math.ceil(r.r1/2)} → +6 = <b>${r.elan}</b></p>
      <p><b>毅力 EFFORT</b>：2 顆骰子擲出 ${r.r2a} + ${r.r2b} = ${r.r2a+r.r2b} → ×10 = <b>${r.effort}</b></p>
      <p><b>鐵拳 FISTS</b>：直接填入 <b>2</b></p>
      <p><em>銳氣與毅力的初始數值即為最大值。若三項屬性中的任意一項降至 0，冒險之旅便會宣告終結。</em></p>`;
    const b1 = document.createElement('button');
    b1.className = 'btn';
    b1.textContent = '✔ 確認屬性，收拾行囊';
    b1.onclick = ()=>{
      S.elan = S.elanMax = r.elan;
      S.effort = S.effortMax = r.effort;
      S.fist = 2;
      S.phase = 'pick';
      render();
    };
    choices.appendChild(b1);
    const b2 = document.createElement('button');
    b2.className = 'choice';
    b2.textContent = '🎲 重擲一次';
    b2.onclick = ()=>{ S.rolled = null; render(); };
    choices.appendChild(b2);
    return;
  }

  /* 選初始物品 */
  if (S.phase === 'pick'){
    num.textContent = '✦ 收拾行囊';
    text.innerHTML = `<p>傑夫在外面砰砰砸門。你手忙腳亂地把身邊能塞的東西全掃進背包——<b>選三件帶上。</b></p>`;
    const picker = document.createElement('div');
    picker.className = 'item-picker';
    START_ITEMS.forEach(id=>{
      const d = ITEMS[id];
      if (!d) return;
      const on = S.picked.includes(id);
      const el = document.createElement('div');
      el.className = 'pick' + (on?' on':'');
      el.innerHTML = `<div class="n">${d.ico} ${d.name}</div><div class="t">${d.desc}</div>`;
      el.onclick = ()=>{
        if (on) S.picked = S.picked.filter(x=>x!==id);
        else {
          if (S.picked.length >= 3){ toast('最多選 3 件'); return; }
          S.picked.push(id);
        }
        renderMain();
      };
      picker.appendChild(el);
    });
    extra.appendChild(picker);
    const done = document.createElement('button');
    done.className = 'btn';
    done.textContent = `確認（已選 ${S.picked.length}/3）`;
    done.disabled = S.picked.length !== 3;
    done.onclick = ()=>{
      S.picked.forEach(id=>addItem(id));
      S.picked = [];
      S.phase = 'room';
      S.currentEvent = null;
      log('你背起行囊，踏出了家門。', 'y');
      toast('行囊已備好，出發！');
      render();
    };
    extra.appendChild(done);
    return;
  }

  /* 房間 */
  if (S.phase === 'room'){
    if (!S.currentEvent){
      S.currentEvent = generateRoom();
      S.room++;
    }
    renderRoom(num, text, choices);
    return;
  }
}

function renderEnd(){
  $('#sec-num').textContent = '✦ 終章';
  $('#sec-text').innerHTML = '';
  $('#extra').innerHTML = '';
  $('#choices').innerHTML = `
    <div class="end-screen">
      <h2>冒險結束</h2>
      <p>${S.endText || '你的故事，到此畫上了句號。'}</p>
      <button class="btn" onclick="restart()">↺ 重新開始</button>
    </div>`;
}

/* ============================================================
   生成房間
============================================================ */
function generateRoom(){
  const r = Math.random();
  if (S.room < 2 && r < 0.4) return {type:'empty'};
  if (r < 0.42) return {type:'monster', data: pick(MONSTERS)};
  if (r < 0.58) return {type:'npc', data: pick(NPCS)};
  if (r < 0.72) return {type:'trap', data: pick(TRAPS)};
  if (r < 0.90) return {type:'event', data: pick(EVENTS)};
  return {type:'empty'};
}

/* ============================================================
   房間渲染
============================================================ */
function renderRoom(num, text, choices){
  const ev = S.currentEvent;

  if (ev.type === 'monster'){
    const m = ev.data;
    num.textContent = `§ 第 ${S.floor} 層 · 房間 ${S.room}`;
    text.innerHTML = `
      <p>你推開門，一股腥臭味撲面而來。</p>
      <p>一隻<b>${m.name}</b>站在房間中央，正低頭啃著什麼。它抬起頭，看見了你。</p>
      <p><em>（難度 ${m.dif}，韌性 ${m.tough}，鐵拳 ${m.fist}）</em></p>`;
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = `⚔ 迎戰 ${m.name}`;
    b.onclick = ()=> startHassle({
      name: m.name, difficulty: m.dif, toughness: m.tough, fist: m.fist,
      win: ()=> monsterWin(m),
      lose: ()=> monsterLose(m)
    });
    choices.appendChild(b);
    const flee = document.createElement('button');
    flee.className = 'choice';
    flee.textContent = '🏃 轉身就跑（不戰而退）';
    flee.onclick = ()=> fleeRoom();
    choices.appendChild(flee);
    return;
  }

  if (ev.type === 'npc'){
    const n = ev.data;
    num.textContent = `§ 第 ${S.floor} 層 · 房間 ${S.room}`;
    text.innerHTML = `<p>${n.text}</p>`;
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = '🗣 上前搭話';
    b.onclick = ()=> npcInteract(n);
    choices.appendChild(b);
    const c = document.createElement('button');
    c.className = 'choice';
    c.textContent = '🚶 不理會，繼續前進';
    c.onclick = ()=> nextRoom();
    choices.appendChild(c);
    return;
  }

  if (ev.type === 'trap'){
    const t = ev.data;
    num.textContent = `§ 第 ${S.floor} 層 · 房間 ${S.room}`;
    text.innerHTML = `
      <p>你剛踏進門，腳下就傳來一聲輕微的「咔嗒」。</p>
      <p>牆上的縫隙透出一絲不對勁——<b>${t.name}</b>！</p>`;
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = '🔍 小心檢查並拆除';
    b.onclick = ()=>{
      // 若持有長杆，可跳過
      if (hasItem('pole')){
        const use = confirm('你帶著十尺探險長杆，要用它跳過這次陷阱判定嗎？');
        if (use){
          removeItem('pole');
          log('你用長杆觸發了陷阱，安全通過。', 'g');
          toast('長杆已消耗');
          nextRoom();
          return;
        }
      }
      startHassle({
        name: t.name, difficulty: t.dif, toughness: 1, fist: 0,
        win: ()=>{ log(`你成功拆除了 ${t.name}。`, 'g'); gainEffort(3); nextRoom(); },
        lose: ()=> trapHit(t)
      });
    };
    choices.appendChild(b);
    const c = document.createElement('button');
    c.className = 'choice';
    c.textContent = '💨 硬著頭皮衝過去';
    c.onclick = ()=> trapHit(t);
    choices.appendChild(c);
    return;
  }

  if (ev.type === 'event'){
    const e = ev.data;
    num.textContent = `§ 第 ${S.floor} 層 · 房間 ${S.room}`;
    text.innerHTML = `<p>${e.ico} ${e.text}</p>`;
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = '👀 上前查看';
    b.onclick = ()=> resolveEvent(e);
    choices.appendChild(b);
    const c = document.createElement('button');
    c.className = 'choice';
    c.textContent = '🚶 不感興趣，繼續前進';
    c.onclick = ()=> nextRoom();
    choices.appendChild(c);
    return;
  }

  /* empty */
  num.textContent = `§ 第 ${S.floor} 層 · 房間 ${S.room}`;
  const flavor = [
    '一間空蕩的石室，牆上掛著熄滅的火把。',
    '地上散落著幾根骨頭和破布，看起來很久沒人來過了。',
    '房間中央有一張倒塌的木桌，桌腳已經腐爛。',
    '牆角有一攤積水，倒映著你疲憊的臉。',
    '空氣裡有一股霉味，但沒有別的東西。'
  ];
  text.innerHTML = `<p>${pick(flavor)}</p>`;
  const b = document.createElement('button');
  b.className = 'btn';
  b.textContent = '➡ 繼續前進';
  b.onclick = ()=> nextRoom();
  choices.appendChild(b);
  const c = document.createElement('button');
  c.className = 'choice';
  c.textContent = '😴 原地休息（恢復毅力）';
  c.onclick = ()=> rest();
  choices.appendChild(c);
}

/* ============================================================
   事件結算
============================================================ */
function monsterWin(m){
  const gold = m.gold + Math.floor(Math.random()*5);
  S.gold += gold;
  gainEffort(5);
  gainExp(m.exp);
  log(`擊敗 ${m.name}，獲得 ${gold} 金幣、${m.exp} 經驗。`, 'g');
  toast(`+${gold} 金幣`);
  nextRoom();
}
function monsterLose(m){
  let dmg = 8 + Math.floor(Math.random()*8);
  if (S.insanity.includes('抑鬱消沉')) dmg += 1;
  loseEffort(dmg);
  log(`${m.name} 擊中了你，損失 ${dmg} 毅力。`, 'r');
  if (S.effort <= 0) return die('你被 ' + m.name + ' 擊倒，再也沒能站起來。');
  if (dmg >= 20) rollOlder();
  toast('你狼狽逃出了房間');
  nextRoom();
}
function trapHit(t){
  const dmg = t.dmg + Math.floor(Math.random()*3);
  loseEffort(dmg);
  log(`${t.name} 觸發，損失 ${dmg} 毅力。`, 'r');
  if (S.effort <= 0) return die('陷阱奪走了你最後一點力氣。');
  nextRoom();
}
function npcInteract(n){
  if (n.reward === 'heal'){
    S.elan = Math.min(S.elanMax, S.elan + 1);
    gainEffort(10);
    log(`你幫助了 ${n.name}，恢復 1 銳氣和 10 毅力。`, 'g');
    toast('+1 銳氣，+10 毅力');
  } else if (n.reward === 'gold'){
    const g = n.gold + Math.floor(Math.random()*5);
    S.gold += g;
    log(`${n.name} 給了你 ${g} 金幣。`, 'g');
    toast(`+${g} 金幣`);
  } else if (n.reward === 'trade'){
    addItem('potion');
    log(`${n.name} 賣給你一瓶藥劑。`, 'g');
    toast('獲得藥劑');
  } else if (n.reward === 'potion'){
    addItem('potion');
    log(`${n.name} 塞給你一瓶藥劑。`, 'g');
    toast('獲得藥劑');
  }
  render();
  nextRoom();
}
function resolveEvent(e){
  if (e.reward === 'gold'){
    const g = e.gold + Math.floor(Math.random()*10);
    S.gold += g;
    log(`你在${e.name}裡找到 ${g} 金幣。`, 'g');
    toast(`+${g} 金幣`);
  } else if (e.reward === 'heal'){
    S.elan = Math.min(S.elanMax, S.elan + 1);
    gainEffort(15);
    log(`${e.name}恢復了你的傷勢。`, 'g');
    toast('+1 銳氣，+15 毅力');
  } else if (e.reward === 'item'){
    addItem(e.item);
    log(`你獲得了 ${ITEMS[e.item].name}。`, 'g');
    toast(`獲得 ${ITEMS[e.item].name}`);
  }
  nextRoom();
}
function fleeRoom(){
  loseEffort(5);
  log('你選擇了撤退。', 'y');
  if (S.effort <= 0) return die('逃跑也耗盡了你最後的力氣。');
  nextRoom();
}
function rest(){
  if (S.effort >= S.effortMax && S.elan >= S.elanMax){
    toast('狀態已滿');
    return;
  }
  let heal = 15;
  if (hasItem('sleeping')) heal += 10;
  gainEffort(heal);
  if (hasItem('diploma') && S.elan < S.elanMax){
    S.elan += 1;
    log('行醫執照讓你恢復了 1 銳氣。', 'g');
  }
  S.restCount++;
  // 醉酒消退
  if (S.drunk > 0){ S.drunk--; log('醉酒等級降低。', 'y'); }

  if (Math.random() < 0.3){
    log('休息時有東西靠近……', 'y');
    const m = pick(MONSTERS);
    toast('遭遇伏擊！');
    startHassle({
      name: m.name, difficulty: m.dif, toughness: m.tough, fist: m.fist,
      win: ()=> monsterWin(m),
      lose: ()=> monsterLose(m)
    });
  } else {
    log(`你休息了一會兒，恢復了一些毅力。`, 'g');
    toast(`+${heal} 毅力`);
    render();
  }
}
function nextRoom(){
  S.currentEvent = null;
  S.room++;
  if (S.room > 5){
    S.room = 1;
    S.floor++;
    log(`你走下更深的階梯，來到地牢第 ${S.floor} 層。`, 'y');
    toast(`深入第 ${S.floor} 層`);
    gainEffort(10);
  }
  if (S.floor >= 10){
    return finalRoom();
  }
  render();
}

function finalRoom(){
  if (S.floor >= 10 && S.room === 1){
    S.done = true;
    S.endText = '你終於找到了那扇門。門後是一間堆滿破舊家具的房間，牆上掛著一張畫著送奶工的海報。沙發就在角落，上面落滿了灰塵。你走過去，躺下，閉上眼。這趟該死的冒險，總算結束了。';
    log('你找到了父親的沙發。', 'y');
    render();
    return;
  }
  render();
}

/* ============================================================
   資源變動
============================================================ */
function gainEffort(n){
  S.effort = Math.min(S.effortMax, S.effort + n);
  render();
}
function loseEffort(n){
  S.effort = Math.max(0, S.effort - n);
  render();
}
function gainExp(n){
  S.exp += n;
  while (S.exp >= 5){
    S.exp -= 5;
    S.level++;
    S.effortMax += 5;
    S.effort = Math.min(S.effortMax, S.effort + 5);
    log(`★ 升級！等級 ${S.level}，最大毅力 +5。`, 'y');
    toast(`升級！Lv.${S.level}`);
  }
}
function die(text){
  S.done = true;
  S.endText = text;
  log(text, 'r');
  render();
}

/* ============================================================
   歲月摧頹
============================================================ */
function rollOlder(){
  S.olderCount++;
  const roll = d6() + d6() + (S.olderCount - 1);
  log(`歲月摧頹表：2d6 = ${roll}`, 'y');
  if (roll <= 2){
    log('你依舊身強體健，寶刀未老。', 'g');
  } else if (roll <= 4){
    S.effortMax = Math.max(1, S.effortMax - 5);
    S.effort = Math.min(S.effort, S.effortMax);
    log('歲月的重量：毅力最大值 −5。', 'r');
  } else if (roll === 5){
    log('你忘了不少年輕時的本事……（簡化：無實質效果）', 'y');
  } else if (roll === 6){
    S.elanMax = Math.max(1, S.elanMax - 1);
    S.elan = Math.min(S.elan, S.elanMax);
    log('視力模糊：銳氣 −1。', 'r');
  } else if (roll === 7){
    addInsanity();
  } else if (roll === 8){
    S.effortMax = Math.max(1, S.effortMax - 10);
    S.effort = Math.min(S.effort, S.effortMax);
    log('劇烈咳嗽：毅力最大值 −10，罹患 1 級疾病。', 'r');
  } else if (roll === 9){
    S.fist = Math.max(1, S.fist - 1);
    addInsanity();
    log('老糊塗：鐵拳 −1，新增精神錯亂。', 'r');
  } else {
    S.elanMax = Math.max(1, S.elanMax - 1);
    S.elan = Math.min(S.elan, S.elanMax);
    S.effortMax = Math.max(1, S.effortMax - 20);
    S.effort = Math.min(S.effort, S.effortMax);
    log('死亡的手指攫取你的靈魂：銳氣 −1，毅力最大值 −20。下一次冒險將是你的絕唱。', 'r');
  }
  render();
}
function addInsanity(){
  const avail = INSANITIES.filter(x=>!S.insanity.includes(x));
  if (!avail.length) return;
  const ins = pick(avail);
  S.insanity.push(ins);
  log(`你獲得了精神錯亂：${ins}`, 'r');
  toast(`精神錯亂：${ins}`);
}

/* ============================================================
   藥劑（依書中 2d6 表）
============================================================ */
function drinkPotion(idx){
  // 先扣 1 銳氣
  S.elan = Math.max(0, S.elan - 1);
  const a = d6(), b = d6();
  const total = a + b;
  let msg = `飲用藥劑：2d6 = ${a}+${b} = ${total}。`;
  msg += `\n廉價烈酒：銳氣 −1。`;

  if (total <= 3){
    S.elanMax = Math.max(1, S.elanMax - 2);
    S.effortMax = Math.max(1, S.effortMax - 20);
    S.elan = Math.min(S.elan, S.elanMax);
    S.effort = Math.min(S.effort, S.effortMax);
    msg += `\n藥劑變質！銳氣最大值 −2，毅力最大值 −20。`;
    log(msg, 'r');
  } else if (total <= 5){
    msg += `\n幻覺：祖母叼著刀爬上來，難度 12 的戰鬥！`;
    log(msg, 'r');
    // 移除藥劑
    S.inv.splice(idx,1);
    render();
    startHassle({
      name:'祖母（幻影）', difficulty:12, toughness:1, fist:0,
      win: ()=>{ log('你擊退了祖母的幻影。', 'g'); nextRoom(); },
      lose: ()=>{
        addItem('charm');
        log('你無法擊退祖母，她加入了你的物品欄（怪物部件）。', 'r');
        nextRoom();
      }
    });
    return;
  } else if (total === 6){
    S.fist += 1;
    msg += `\n腸胃絞痛：本段冒險鐵拳 +1。`;
    log(msg, 'g');
  } else if (total <= 9){
    // 恢復選擇：簡化為恢復 10 毅力
    gainEffort(10);
    msg += `\n提神療傷：恢復 10 毅力。`;
    log(msg, 'g');
  } else if (total === 10){
    S.elan += 1; S.elanMax += 1;
    msg += `\n力量藥劑：銳氣當前值與最大值各 +1。`;
    log(msg, 'g');
  } else if (total === 11){
    S.effort += 20; S.effortMax += 20;
    msg += `\n情感藥劑：毅力當前值與最大值各 +20。`;
    log(msg, 'g');
  } else {
    S.fist += 1;
    msg += `\n魔物變異湯劑：鐵拳 +1！`;
    log(msg, 'g');
  }
  // 醉酒 +1
  S.drunk = Math.min(3, S.drunk + 1);
  // 移除藥劑
  S.inv.splice(idx,1);
  render();
}

/* ============================================================
   麻煩事件（含多重）
============================================================ */
function startHassle(config){
  H = {
    name: config.name,
    difficulty: config.difficulty,
    toughness: config.toughness,
    fist: config.fist || 0,
    multiple: config.multiple || false,
    others: config.others || [],
    win: config.win,
    lose: config.lose,
    invested: 0
  };
  renderHassle();
  $('#modal').classList.add('on');
}

function renderHassle(){
  const dlg = $('#dialog');
  const fist = effectiveFist();
  const maxInvest = Math.min(effectiveElan(), S.effort);

  if (maxInvest <= 0){
    S.effort = 0;
    $('#modal').classList.remove('on');
    die('毅力耗盡，你倒在了黑暗中。');
    return;
  }

  if (H.invested === 0) H.invested = Math.min(8, maxInvest);

  dlg.innerHTML = `
    <h3>⚔ ${H.name}</h3>
    <div class="sub">一場麻煩事件</div>
    <div class="hassle-info">
      <span>難度 <b>${H.difficulty}</b></span>
      <span>韌性 <b>${H.toughness}</b></span>
      <span>敵鐵拳 <b>${H.fist}</b></span>
      <span>我鐵拳 <b>${fist}</b></span>
    </div>
    <div class="effort-slider">
      <label>投入毅力 <b id="h-inv">${H.invested}</b></label>
      <input type="range" id="h-slider" min="1" max="${maxInvest}" value="${H.invested}">
    </div>
    <div class="roll-result" id="h-result"></div>
    <button class="btn" id="h-go">擲骰！</button>
    <button class="btn" id="h-run" style="margin-top:8px;background:#2a1a14;border-color:#7a3a2a;color:#e08a7a;">🏃 溜之大吉</button>
  `;

  const slider = $('#h-slider');
  const invEl = $('#h-inv');
  slider.oninput = ()=>{ H.invested = +slider.value; invEl.textContent = H.invested; };
  $('#h-go').onclick = ()=> doRoll();
  $('#h-run').onclick = ()=>{
    $('#modal').classList.remove('on');
    log('你選擇溜之大吉。', 'y');
    loseEffort(3);
    if (S.effort <= 0) return die('逃跑也救不了你。');
    nextRoom();
  };
}

function doRoll(){
  const fist = effectiveFist();
  const inv = H.invested;

  if (S.effort < inv){ toast('毅力不足'); return; }
  let cost = inv;
  if (S.insanity.includes('抑鬱消沉')) cost += 1;
  S.effort -= cost;

  /* 我方擲骰 */
  let pDice = [];
  for (let i=0;i<fist;i++) pDice.push(d6());
  let pBest = Math.max(...pDice);
  let multiNote = '';

  if (H.multiple && pBest >= 4){
    const reroll = d6();
    multiNote = `（多重麻煩：${pBest} ≥4，重擲 → ${reroll}）`;
    pBest = reroll;
  }

  /* 敵方鐵拳 */
  const eDice = [];
  for (let i=0;i<H.fist;i++) eDice.push(d6());
  const eBest = eDice.length ? Math.max(...eDice) : 0;

  const finalDiff = H.difficulty + eBest;
  const total = inv + pBest;
  const success = total > finalDiff;

  const dlg = $('#dialog');
  const diceHtml = `<div class="dice-area">
    ${pDice.map(v=>dieHtml(v)).join('')}
    ${eDice.map(v=>dieHtml(v,true)).join('')}
  </div>`;

  if (success){
    H.toughness--;
    log(`${H.name}：${inv}+${pBest}=${total} 對 ${finalDiff} → 成功${multiNote}`, 'g');
    if (H.toughness <= 0){
      dlg.innerHTML = `<h3>✦ 勝利</h3><div class="sub">你擊敗了 ${H.name}！</div>${diceHtml}
        <div class="roll-result good">總計 ${total} 對 ${finalDiff} — 成功！</div>
        <button class="btn" id="h-done">繼續</button>`;
      $('#h-done').onclick = ()=>{ $('#modal').classList.remove('on'); H.win(); };
      render();
      return;
    }
    dlg.innerHTML = `<h3>⚔ ${H.name}</h3><div class="sub">一輪結束</div>${diceHtml}
      <div class="roll-result good">${total} 對 ${finalDiff} — 成功！剩餘韌性 ${H.toughness}${multiNote}</div>
      <div class="effort-slider">
        <label>再投入毅力 <b>${Math.min(inv, S.effort)}</b></label>
        <input type="range" id="h-slider2" min="1" max="${Math.min(effectiveElan(), S.effort)}" value="${Math.min(inv, S.effort)}">
      </div>
      <button class="btn" id="h-go2">繼續擲骰</button>
      <button class="btn" id="h-run2" style="margin-top:8px;background:#2a1a14;border-color:#7a3a2a;color:#e08a7a;">🏃 溜之大吉</button>`;
    const s2 = $('#h-slider2'), i2 = dlg.querySelector('.effort-slider b');
    s2.oninput = ()=>{ H.invested = +s2.value; i2.textContent = H.invested; };
    $('#h-go2').onclick = ()=> doRoll();
    $('#h-run2').onclick = ()=>{ $('#modal').classList.remove('on'); log('你選擇溜之大吉。', 'y'); loseEffort(3); if (S.effort<=0) return die('逃跑也救不了你。'); nextRoom(); };
  } else {
    const penalty = Math.min(6, S.effort);
    S.effort -= penalty;
    log(`${H.name}：${inv}+${pBest}=${total} 對 ${finalDiff} → 失敗${multiNote}`, 'r');
    if (S.effort <= 0){
      S.effort = 0;
      dlg.innerHTML = `<h3>💀 敗北</h3><div class="sub">${H.name} 擊倒了你</div>${diceHtml}
        <div class="roll-result bad">${total} 對 ${finalDiff} — 失敗</div>
        <p style="color:var(--muted);font-size:13px;margin:10px 0;">你的毅力耗盡……</p>
        <button class="btn" id="h-dead">結束</button>`;
      $('#h-dead').onclick = ()=>{ $('#modal').classList.remove('on'); die('你倒在了 ' + H.name + ' 的手下，這場冒險到此為止。'); };
      render();
      return;
    }
    dlg.innerHTML = `<h3>⚔ ${H.name}</h3><div class="sub">一輪結束</div>${diceHtml}
      <div class="roll-result bad">${total} 對 ${finalDiff} — 失敗！損失 ${penalty} 毅力${multiNote}</div>
      <div class="effort-slider">
        <label>再投入毅力 <b>${Math.min(inv, S.effort)}</b></label>
        <input type="range" id="h-slider3" min="1" max="${Math.min(effectiveElan(), S.effort)}" value="${Math.min(inv, S.effort)}">
      </div>
      <button class="btn" id="h-go3">繼續擲骰</button>
      <button class="btn" id="h-run3" style="margin-top:8px;background:#2a1a14;border-color:#7a3a2a;color:#e08a7a;">🏃 溜之大吉</button>`;
    const s3 = $('#h-slider3'), i3 = dlg.querySelector('.effort-slider b');
    s3.oninput = ()=>{ H.invested = +s3.value; i3.textContent = H.invested; };
    $('#h-go3').onclick = ()=> doRoll();
    $('#h-run3').onclick = ()=>{ $('#modal').classList.remove('on'); log('你選擇溜之大吉。', 'y'); loseEffort(3); if (S.effort<=0) return die('逃跑也救不了你。'); nextRoom(); };
  }
  render();
}

function dieHtml(v, enemy=false){
  const layouts = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const dots = layouts[v] || [];
  let cells = '';
  for (let i=0;i<9;i++) cells += dots.includes(i) ? '<div class="dot"></div>' : '<div></div>';
  return `<div class="d6 ${enemy?'enemy':''}">${cells}</div>`;
}

/* ============================================================
   真言之力 / 備註卷軸
============================================================ */
function openScroll(){
  $('#dialog').innerHTML = `
    <h3>📜 冒險卷軸</h3>
    <div class="sub">真言之力必須用鋼筆填寫——這些記錄會伴隨你的精靈開啟新的冒險。</div>
    <label style="font-size:13px;color:var(--gold);">真言之力 WORDS OF POWER</label>
    <textarea id="scroll-words" style="margin:6px 0 14px;">${escapeHtml(S.words)}</textarea>
    <label style="font-size:13px;color:var(--gold);">備註 NOTES</label>
    <textarea id="scroll-notes" style="margin:6px 0 14px;">${escapeHtml(S.notes)}</textarea>
    <button class="btn" id="scroll-save">保存</button>
    <button class="btn" id="scroll-close" style="margin-top:8px;background:#2a1a14;border-color:#7a3a2a;color:#e08a7a;">關閉</button>
  `;
  $('#modal').classList.add('on');
  $('#scroll-save').onclick = ()=>{
    S.words = $('#scroll-words').value;
    S.notes = $('#scroll-notes').value;
    save();
    toast('卷軸已保存');
    $('#modal').classList.remove('on');
  };
  $('#scroll-close').onclick = ()=> $('#modal').classList.remove('on');
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   啟動
============================================================ */
function restart(){
  if (!confirm('確定要重新開始嗎？當前進度會丟失。')) return;
  S = defaultState();
  render();
}
window.restart = restart;

if (!load()){
  S = defaultState();
}
render();

/* 物品欄點擊 */
$('#inv-box').addEventListener('click', e=>{
  const el = e.target.closest('[data-i]');
  if (!el) return;
  const i = +el.dataset.i;
  const it = S.inv[i];
  if (!it) return;
  const d = ITEMS[it.id];
  if (!d) return;

  if (d.type === 'equip'){
    // 同槽位只能一件
    if (!it.equipped){
      S.inv.forEach((other,j)=>{
        if (j !== i && other.equipped && ITEMS[other.id] && ITEMS[other.id].slot === d.slot){
          other.equipped = false;
        }
      });
      // 武器一次只能一把；盾牌規則：背盾時可持武器，但這裡簡化為同槽限制
      it.equipped = true;
    } else {
      it.equipped = false;
    }
    render();
    toast(it.equipped ? `已裝備 ${d.name}` : `已卸下 ${d.name}`);
    return;
  }

  // 雜物：使用
  switch(d.effect){
    case 'effort10':
      gainEffort(10);
      log(`你吃掉了 ${d.name}，恢復 10 毅力。`, 'g');
      S.inv.splice(i,1);
      break;
    case 'elan1':
      S.elan = Math.min(S.elanMax, S.elan + 1);
      log(`你塗抹了 ${d.name}，恢復 1 銳氣。`, 'g');
      S.inv.splice(i,1);
      render();
      break;
    case 'burger':
      gainEffort(10);
      S.drunk = 0;
      log('你吃下漢堡，恢復 10 毅力並解除醉酒。', 'g');
      S.inv.splice(i,1);
      render();
      break;
    case 'gold5':
      S.gold += 5;
      log('割錢包裡有 5 金吉爾德。', 'g');
      S.inv.splice(i,1);
      render();
      break;
    case 'potion':
      drinkPotion(i);
      return;
    case 'skipTrap':
      toast('長杆會在陷阱房自動觸發');
      break;
    case 'restBonus':
    case 'restElan':
      toast('休息時自動生效');
      break;
    case 'map':
      toast(`下一層：第 ${S.floor+1} 層`);
      break;
    case 'gem':
      S.gold += 20;
      log('你賣掉了寶石，獲得 20 金吉爾德。', 'g');
      S.inv.splice(i,1);
      render();
      break;
    default:
      toast(d.desc || '無特殊效果');
  }
});

$('#btn-scroll').onclick = openScroll;
$('#btn-restart').onclick = restart;
</script>
</body>
