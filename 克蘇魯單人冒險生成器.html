<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Songti SC","Noto Serif TC","Source Han Serif TC",Georgia,"Times New Roman",serif;
  background:#080605;color:#e8dcc0;
}
#app{
  height:100dvh;display:flex;flex-direction:column;max-width:860px;margin:0 auto;position:relative;
  background:radial-gradient(ellipse at 50% -10%,#2c2218 0%,#15100b 55%,#080605 100%);
}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:20;
  box-shadow:inset 0 0 140px 40px rgba(0,0,0,.9);}

/* ---------- HUD ---------- */
#hud{display:flex;gap:5px;padding:7px 8px;flex-wrap:wrap;justify-content:center;
  background:linear-gradient(#20180f,#130e09);border-bottom:1px solid #3d2f1f;z-index:22;position:relative}
.hud-item{display:flex;align-items:center;gap:4px;font-size:12.5px;
  background:#251c12;border:1px solid #4d3c27;border-radius:6px;padding:3px 8px;color:#d8c9a8;
  white-space:nowrap;transition:.2s}
.hud-item.warn{border-color:#c9a227;color:#ffe9b0;box-shadow:0 0 8px rgba(201,162,39,.4)}
.hud-item.danger{border-color:#a02020;color:#ff9a9a;box-shadow:0 0 8px rgba(200,40,40,.5)}

/* ---------- STAGE ---------- */

#stage::-webkit-scrollbar{width:6px}
#stage::-webkit-scrollbar-thumb{background:#4a3a26;border-radius:3px}

#scene{width:100%;height:150px;border-radius:10px;overflow:hidden;border:1px solid #4a3a26;
  background:#0d0a07;flex-shrink:0;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#scene svg{width:100%;height:100%;display:block}
#sceneLabel{position:absolute;bottom:6px;right:9px;font-size:10.5px;letter-spacing:2px;
  color:#8a7857;text-transform:uppercase}

.card{background:linear-gradient(160deg,#ece0c4,#dccfb0 55%,#d2c4a2);color:#251c12;
  border-radius:10px;padding:14px 15px;border:2px solid #8a6d3f;

.card::before{content:'';position:absolute;inset:5px;border:1px solid rgba(120,95,55,.35);

#eventTitle{font-size:12px;letter-spacing:3px;color:#7a5c2e;margin-bottom:7px;

#eventText .hl{color:#8b1a1a;font-weight:bold}

#actions{display:flex;flex-direction:column;gap:8px;margin-top:2px}

  border-radius:9px;cursor:pointer;transition:.15s;text-align:center;letter-spacing:.5px;

.btn.primary{background:linear-gradient(#7d2121,#4a1010);border-color:#c9a227;color:#ffe9b0}

<script>
/* =========================================================
   1. 基礎工具
   ========================================================= */
const $  = s => document.querySelector(s);
const d  = n => Math.floor(Math.random()*n)+1;
const d100 = () => d(100);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function rollExpr(expr){
  if(expr==null) return 0;
  if(typeof expr === 'number') return expr;
  const m = String(expr).trim().match(/^([+-]?)\s*(\d*)D(\d+)$/i);
  if(m){
    const sign = m[1]==='-'?-1:1;
    const cnt = parseInt(m[2]||'1',10);
    const face = parseInt(m[3],10);
    let sum=0; for(let i=0;i<cnt;i++) sum+=d(face);
    return sign*sum;
  }
  const n = parseInt(expr,10);
  return isNaN(n)?0:n;
}

/* ---------- 音效 ---------- */
let AC=null, soundOn=true;
function beep(freq=440,dur=.07,type='sine',vol=.05){
  if(!soundOn) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const SFX = {
  click:()=>beep(520,.05,'square',.035),
  good:()=>{beep(660,.08,'sine',.05);setTimeout(()=>beep(880,.1,'sine',.05),80);},
  bad:()=>{beep(180,.16,'sawtooth',.05);setTimeout(()=>beep(120,.2,'sawtooth',.04),120);},
  dice:()=>beep(300,.04,'triangle',.03),
  fight:()=>{beep(140,.1,'square',.06);setTimeout(()=>beep(90,.14,'square',.05),100);},
  san:()=>{beep(220,.2,'sine',.05);setTimeout(()=>beep(160,.3,'sine',.04),160);}
};

function rollStat(){
  const rolls=[d(6),d(6),d(6),d(6)].sort((a,b)=>b-a);
  return rolls[0]+rolls[1]+rolls[2];
}

const NAMES_M=['亞瑟·布萊克','亨利·華德','賽勒斯·葛林','愛德華·摩爾','法蘭克·道爾'];
const NAMES_F=['艾格妮絲·懷特','瑪格麗特·費雪','蘿絲瑪麗·凱恩','薇薇安·霍華','伊迪絲·葛雷'];

function createPC(archKey){
  const A = ARCHETYPES[archKey];
  const stats = {
    STR: rollStat(), CON: rollStat(), DEX: rollStat(),
    INT: rollStat(), POW: rollStat(), CHA: rollStat()
  };
  const skills = {};
  for(const k in BASE_SKILLS) skills[k]=BASE_SKILLS[k];
  for(const k in A.core) skills[k]=A.core[k];
  // 額外 10 點：隨機挑 3 個可選技能各 +20
  const alts = A.alt.slice();
  for(let i=0;i<3 && alts.length;i++){
    const idx = Math.floor(Math.random()*alts.length);
    const sk = alts.splice(idx,1)[0];
    skills[sk] = (skills[sk]||0) + 20;
  }
  const hpMax = Math.ceil((stats.STR+stats.CON)/2);
  const sanMax = stats.POW*5;
  const bp = stats.POW*4;
  const db = stats.STR<=4?-2 : stats.STR<=8?-1 : stats.STR<=12?0 : stats.STR<=16?1 : 2;

  const gender = Math.random()<.5?'男':'女';
  const name = pick(gender==='男'?NAMES_M:NAMES_F);

  // 羈絆
  const bondsP = [{name: pick(['摯友 湯瑪斯','伴侶 伊蓮','兄長 羅伯特','摯友 露西','妹妹 安娜']), val: stats.CHA}];
  while(bondsP.length < Math.min(2, A.bonds)) {
    bondsP.push({name: pick(['鄰居 老威爾','同行 凱薩琳','表親 艾德蒙']), val: stats.CHA});
  }
  const cbondVal = Math.ceil(A.res/2);
  const bondsC = [{name: pick(['警察局','《每日公報》','地方圖書館','共濟會分會','運動俱樂部']), val: cbondVal}];

  const weapons = [];
  if(archKey==='detective'){ weapons.push({name:'警棍',skill:'近戰武器',dmg:'1D8+DB'},{name:'手槍',skill:'槍械',dmg:'1D10'}); }
  else if(archKey==='criminal'){ weapons.push({name:'彈簧刀',skill:'近戰武器',dmg:'1D6+DB'},{name:'手槍',skill:'槍械',dmg:'1D10'}); }
  else if(archKey==='doctor'){ weapons.push({name:'手術刀',skill:'近戰武器',dmg:'1D4+DB'}); }
  else { weapons.push({name:'手槍',skill:'槍械',dmg:'1D10'}); }

  return {
    name, gender, arch:archKey, archName:A.name,
    age: 25+Math.floor(Math.random()*20),
    home:'阿卡姆', birth:'阿卡姆',
    stats, skills,
    hp:hpMax, hpMax,
    san:sanMax, sanMax, bp,
    res:A.res, db,
    bondsP, bondsC,
    weapons,
    disorders:[],
    usedSkills: []
  };
}

/* =========================================================
   8. 畫面渲染 —— HUD
   ========================================================= */
function renderHUD(){
  const hud = $('#hud');
  if(!G.pc){ hud.innerHTML = ''; return; }
  const p = G.pc;
  const sanPct = Math.round(p.san / p.sanMax * 100);
  const hpPct  = Math.round(p.hp / p.hpMax * 100);
  const sanCls = p.san <= p.bp ? 'danger' : (sanPct < 50 ? 'warn' : '');
  const hpCls  = p.hp <= 3 ? 'danger' : (hpPct < 40 ? 'warn' : '');
  let phaseTxt = '冒險';
  if(G.phase==='downtime') phaseTxt='休整';
  else if(G.phase==='ending') phaseTxt='結局';
  else if(G.phase==='combat') phaseTxt='戰鬥';
  else if(G.phase==='gameover') phaseTxt='終局';

  hud.innerHTML = `
    <div class="hud-item ${sanCls}" title="理智值 / 崩潰點">🧠 ${p.san}/${p.sanMax}<small style="opacity:.6"> ·BP${p.bp}</small></div>
    <div class="hud-item ${hpCls}" title="生命值">❤️ ${p.hp}/${p.hpMax}</div>
    <div class="hud-item" title="資源評級">💰 ${p.res}</div>
    <div class="hud-item" title="持有線索">🔍 ${G.clues ? G.clues.length : 0}</div>
    <div class="hud-item" title="當前階段">📖 ${phaseTxt}</div>
  `;
}

/* 線索存放於 pc.clues */
function ensurePCArrays(){ if(G.pc){ G.pc.clues = G.pc.clues || []; } }

function flashHUD(){ 
  document.querySelectorAll('.hud-item').forEach(e=>{
    e.classList.add('pop'); setTimeout(()=>e.classList.remove('pop'),200);
  });
}

function sceneFor(text){
  if(/海|水|船|浪|岸|碼頭|漁村/.test(text)) return 'sea';
  if(/圖書館|書|典籍|日記|筆記|文獻|檔案/.test(text)) return 'book';
  if(/森林|樹林|野外|營地|山|荒野/.test(text)) return 'forest';
  if(/墓|教堂|神殿|石圈|地窖|古廟/.test(text)) return 'temple';
  if(/家|屋內|房間|客廳|窗|門|旅館|公寓/.test(text)) return 'home';
  return 'city';
}

/* =========================================================
   10. 畫面骨架
   ========================================================= */
function setStage(html){
  const stage = $('#stage');
  stage.innerHTML = html;
  stage.scrollTop = 0;
}

let typingTimer = null;
function typeText(el, text, cb){
  clearInterval(typingTimer);
  el.textContent = '';
  el.dataset.full = text;
  let i = 0;
  const speed = 16;
  let done = false;
  const finish = ()=>{
    if(done) return; done = true;
    clearInterval(typingTimer);
    el.textContent = text;
    if(cb) cb();
  };
  el.onclick = finish;
  typingTimer = setInterval(()=>{
    i++;
    el.textContent = text.slice(0,i);
    if(i >= text.length) finish();
  }, speed);
}

/* =========================================================
   11. 冒險主流程
   ========================================================= */
function startAdventure(){
  ensurePCArrays();
  G.phase = 'adventure';
  G.adventureCount++;
  G.pc.usedSkills = [];
  addHistory('冒險開始', `第 ${G.adventureCount} 次冒險`);
  const ev = pick(POOL_B);
  showEvent(ev, '起始');
}

function addHistory(title, text){
  G.history.unshift({t: new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}), title, text});
  if(G.history.length > 200) G.history.pop();
}

function addClues(list){
  if(!list || !list.length) return;
  ensurePCArrays();
  list.forEach(c=>{
    if(!G.pc.clues.includes(c)) G.pc.clues.push(c);
  });
}

function showEvent(ev, stageName){
  G.cur = ev;
  G.curStage = stageName;
  G.sub = 'event';

  const kind = sceneFor(ev.t);
  const stageEl = $('#stage');
  stageEl.innerHTML = `
    <div id="scene">${sceneSVG(kind)}<div id="sceneLabel">${stageName}</div></div>
    <div class="card">
      <div id="eventTitle">${stageName} · 事件</div>
      <div id="eventText"></div>
      <div id="clueTags"></div>
    </div>
    <div id="actions"></div>
    <div id="resultBox" class="hide"></div>
  `;

  const txtEl = $('#eventText');
  typeText(txtEl, ev.t, ()=>{
    renderEventActions();
  });

  if(ev.c && ev.c.length){
    addClues(ev.c);
    const ct = $('#clueTags');
    ev.c.forEach(c=>{
      const s = document.createElement('span');
      s.className='clue'; s.textContent = c;
      ct.appendChild(s);
    });
    SFX.good();
  }
  renderHUD();
  addHistory(stageName, ev.t.slice(0,60)+'…');
}

function renderEventActions(){
  const ev = G.cur;
  const box = $('#actions');
  if(!box) return;
  box.innerHTML = '';

  // 戰鬥事件先處理理智
  if(ev.combat){
    const btn = document.createElement('button');
    btn.className='btn primary';
    btn.textContent = `⚔️ 進入戰鬥`;
    btn.onclick = ()=>{ SFX.fight(); startCombat(ev.combat, ()=>afterEventResolution(ev)); };
    box.appendChild(btn);
    // 若有理智檢定需求（combat 事件通常已含於 check）
    return;
  }

  if(ev.check && !ev._checked){
    const sk = ev.check.skill;
    let target = 0;
    if(ev.check.stat){
      target = G.pc.stats[ev.check.stat]*5;
    } else {
      target = G.pc.skills[sk] || 0;
    }
    const btn = document.createElement('button');
    btn.className='btn primary';
    btn.textContent = `🎲 進行【${ev.check.stat?statName(ev.check.stat):sk}】檢定（目標 ${Math.min(99,target)}%）`;
    btn.onclick = ()=>doCheck(ev.check, btn);
    box.appendChild(btn);

    if(G.pc.clues.length>0){
      const b2 = document.createElement('button');
      b2.className='btn gold small';
      b2.textContent = `ʘ 消耗線索 +30%（剩餘 ${G.pc.clues.length}）`;
      b2.onclick = ()=>{
        consumeClue();
        ev._bonus = (ev._bonus||0)+30;
        toast('已消耗 1 個線索，本次檢定 +30%');
        renderEventActions();
      };
      box.appendChild(b2);
    }
    return;
  }

  if(ev.check && ev._checked){
    const btn = document.createElement('button');
    btn.className='btn';
    btn.textContent = '繼續 ▸';
    btn.onclick = ()=>afterEventResolution(ev);
    box.appendChild(btn);
    return;
  }

  if(ev.opts && !ev._chosen){
    ev.opts.forEach((o,i)=>{
      const b = document.createElement('button');
      b.className='btn';
      b.textContent = o.label;
      b.onclick = ()=>{
        SFX.click();
        ev._chosen = i;
        applyFx(o.fx);
        addHistory('抉擇', o.label);
        afterEventResolution(o);
      };
      box.appendChild(b);
    });
    return;
  }

  // 普通繼續
  const b = document.createElement('button');
  b.className='btn';
  b.textContent = '繼續調查 ▸';
  b.onclick = ()=>afterEventResolution(ev);
  box.appendChild(b);
}

function statName(s){
  return {STR:'力量',CON:'體質',DEX:'敏捷',INT:'智力',POW:'意志',CHA:'魅力'}[s]||s;
}

function consumeClue(){
  if(G.pc.clues && G.pc.clues.length){
    G.pc.clues.splice(0,1);
    renderHUD();
    return true;
  }
  return false;
}

function afterEventResolution(evOrOpt){
  const next = evOrOpt && evOrOpt.next ? evOrOpt.next : (ev.next || 'I');
  advance(next);
}

function advance(next){
  // 清空暫存標記
  if(next === 'E'){ startEnding(); return; }
  if(next === 'DOWNTIME'){ startDowntime(); return; }
  const pools = {M:POOL_M, I:POOL_I, T:POOL_T, B:POOL_B};
  const pool = pools[next] || POOL_I;
  const ev = pick(pool);
  const labels = {M:'謎團', I:'調查', T:'轉折點', B:'起始'};
  showEvent(ev, labels[next] || '調查');
}

/* --------- 技能檢定 --------- */
function doCheck(check, btn){
  const ev = G.cur;
  let target = 0;
  if(check.stat) target = G.pc.stats[check.stat]*5;
  else target = G.pc.skills[check.skill]||0;
  target = clamp(target + (ev._bonus||0), 1, 99);

  const roll = d100();
  SFX.dice();
  const success = (roll <= target) || roll === 1;

  // 記錄技能使用（用於冒險後成長）
  const skillKey = check.stat ? statName(check.stat) : check.skill;
  if(!check.stat) G.pc.usedSkills.push(check.skill);

  ev._checked = true;
  ev._success = success;

  const box = $('#resultBox');
  box.classList.remove('hide','ok','bad','neutral');
  box.classList.add(success?'ok':'bad');
  box.innerHTML = `<b>${success?'✔ 成功':'✘ 失敗'}</b>　（擲出 ${roll}，目標 ${target}%）<br>${success?check.succ:check.fail}`;

  if(success){ SFX.good(); if(check.fxS) applyFx(check.fxS); }
  else { SFX.bad(); if(check.fxF) applyFx(check.fxF); }

  // 更新按鈕
  const acts = $('#actions');
  acts.innerHTML = '';
  // 若失敗觸發戰鬥
  if(!success && check.fxF && check.fxF.combat){
    const b = document.createElement('button');
    b.className='btn primary';
    b.textContent='⚔️ 進入戰鬥';
    b.onclick=()=>{ SFX.fight(); startCombat(check.fxF.combat, ()=>afterEventResolution(G.cur)); };
    acts.appendChild(b);
    return;
  }
  const b = document.createElement('button');
  b.className='btn';
  b.textContent = '繼續 ▸';
  b.onclick = ()=>afterEventResolution(G.cur);
  acts.appendChild(b);
  renderHUD();
  addHistory('檢定', `${skillKey} ${success?'成功':'失敗'}（${roll}/${target}）`);
}

/* --------- 效果套用 --------- */
function applyFx(fx){
  if(!fx || !G.pc) return;
  const p = G.pc;
  if(fx.clue) addClues(fx.clue);
  if(fx.res){ p.res = clamp(p.res + fx.res, 0, 20); }
  if(fx.hp){
    const v = rollExpr(fx.hp);
    p.hp = clamp(p.hp + v, 0, p.hpMax);
    if(v<0) toast(`你失去了 ${-v} 點生命值`);
    if(p.hp<=0) handleDown();
  }
  if(fx.san){
    const v = rollExpr(fx.san);
    p.san = clamp(p.san + v, 0, p.sanMax);
    if(v<0){ toast(`你失去了 ${-v} 點理智值`); SFX.san(); checkBreak(v); }
    else if(v>0) toast(`你恢復了 ${v} 點理智值`);
    if(p.san<=0) handleInsane();
  }
  if(fx.sanCheck){
    const roll = d100();
    if(roll > p.san){
      const v = rollExpr(fx.sanCheck);
      p.san = clamp(p.san - v, 0, p.sanMax);
      toast(`理智檢定失敗，失去 ${v} 點理智值`);
      SFX.san();
      checkBreak(v);
      if(p.san<=0) handleInsane();
    } else {
      toast('理智檢定成功，你穩住了心神');
    }
  }
  if(fx.combat){
    // 由調用方處理
  }
  renderHUD();
}

function checkBreak(lost){
  const p = G.pc;
  if(lost >= 5 || p.san <= p.bp){
    // 暫時瘋狂
    const gain = p.disorders.length? 1 : 5;
    p.skills['超自然'] = clamp((p.skills['超自然']||0) + gain, 0, 99);
    p.disorders.push(pick(['恐高症','急性憂鬱症','成癮','偏執症','黑暗恐懼症','彈震症','強迫症','精神分裂型人格障礙']));
    toast('⚠️ 你陷入了暫時瘋狂……');
    SFX.bad();
    // 重新計算崩潰點
    const nb = Math.max(0, p.san - p.stats.POW);
    p.bp = Math.max(0, Math.min(p.bp, nb));
    renderHUD();
  }
}

function handleDown(){
  toast('你倒下了……');
  SFX.bad();
  G.pc.hp = 0;
}

function handleInsane(){
  G.phase = 'gameover';
  G.ended = true;
  unlockAchievement('永恆瘋狂', '理智值歸零，你永遠迷失在宇宙的真相之中。');
  renderGameOver('你的理智徹底崩解。宇宙的真相再也無法承受，你成為了永遠遊蕩在意識邊緣的存在。', '瘋狂');
}

/* =========================================================
   12. 戰鬥
   ========================================================= */
function startCombat(enemyKey, onEnd){
  const proto = ENEMIES[enemyKey];
  if(!proto){ if(onEnd) onEnd(); return; }
  const e = {
    key:enemyKey, name:proto.name, hp:proto.hp, hpMax:proto.hp,
    prot:proto.prot, atk:proto.atk, dmg:proto.dmg, san:proto.san, desc:proto.desc
  };
  // 戰鬥前理智檢定
  if(e.san){
    const p=G.pc;
    const roll = d100();
    let loss = 0;
    if(roll <= p.san){
      loss = rollExpr(e.san.s);
    } else {
      loss = rollExpr(e.san.f);
    }
    if(loss>0){
      p.san = clamp(p.san-loss,0,p.sanMax);
      toast(`目睹【${e.name}】，失去 ${loss} 點理智值`);
      SFX.san();
      checkBreak(loss);
      if(p.san<=0){ handleInsane(); return; }
    }
  }

  G.combat = { enemy:e, round:1, log:[], onEnd };
  G.phase = 'combat';
  renderCombat();
}

function renderCombat(){
  const c = G.combat;
  const p = G.pc;
  if(!c) return;
  setStage(`
    <div class="card">
      <div id="eventTitle">戰鬥遭遇 · 第 ${c.round} 回合 / 10</div>
      <div style="font-size:14.5px;line-height:1.7;margin-bottom:10px">
        ${c.enemy.desc}
      </div>
      <div class="cmb-head">
        <div class="cmb-stat">
          <div class="cmb-name">你 · ${p.name}</div>
          <div style="font-size:12px;color:#6b3a10">生命 ${p.hp}/${p.hpMax}</div>
          <div class="bar hp"><i style="width:${(p.hp/p.hpMax*100)}%"></i></div>
        </div>
        <div class="cmb-stat">
          <div class="cmb-name">${c.enemy.name}</div>
          <div style="font-size:12px;color:#6b3a10">生命 ${c.enemy.hp}/${c.enemy.hpMax} · 防禦 ${c.enemy.prot}</div>
          <div class="bar hp"><i style="width:${(c.enemy.hp/c.enemy.hpMax*100)}%;background:linear-gradient(90deg,#8b1a1a,#d33)"></i></div>
        </div>
      </div>
      <div class="cmb-log" id="cmbLog">${c.log.map(l=>`<div>${l}</div>`).join('') || '<div>戰鬥一觸即發……</div>'}</div>
    </div>
    <div id="actions"></div>
  `);
  const acts = $('#actions');

  if(c.round > 10 || c.enemy.hp<=0 || p.hp<=0){
    // 戰鬥已結束
    return;
  }

  // 攻擊（選擇武器）
  p.weapons.forEach(w=>{
    const sk = p.skills[w.skill]||0;
    const b = document.createElement('button');
    b.className='btn primary';
    b.textContent = `⚔️ 使用【${w.name}】攻擊（${w.skill} ${sk}%）`;
    b.onclick = ()=>combatRound(w);
    acts.appendChild(b);
  });

  const b2 = document.createElement('button');
  b2.className='btn dim small';
  b2.textContent = '🏃 嘗試脫離戰鬥（判定為逃跑，直接結束遭遇）';
  b2.onclick = ()=>{ c.log.push('你成功脫離了戰鬥。'); endCombat(false, true); };
  acts.appendChild(b2);
}

function combatRound(weapon){
  const c = G.combat, p = G.pc;
  if(!c) return;
  const e = c.enemy;
  const sk = p.skills[weapon.skill]||0;
  const roll = d100();
  SFX.dice();
  const hit = (roll <= sk) || roll===1;

  if(hit){
    let dmg = rollExpr(weapon.dmg.replace(/\+DB/i, p.db>=0? '+'+p.db : String(p.db)));
    if(/\+DB/i.test(weapon.dmg)){
      // 已在上面處理
    }
    dmg = Math.max(1, dmg - e.prot);
    e.hp = Math.max(0, e.hp - dmg);
    c.log.push(`你以${weapon.name}命中（擲 ${roll}/${sk}），造成 ${dmg} 點傷害。`);
    SFX.good();
  } else {
    c.log.push(`你以${weapon.name}揮空（擲 ${roll}/${sk}）。`);
    SFX.bad();
  }

  if(e.hp<=0){
    c.log.push(`【${e.name}】倒下了！`);
    endCombat(true, false);
    return;
  }

  // 敵人反擊
  const eroll = d100();
  const ehit = (eroll <= e.atk) || eroll===1;
  if(ehit){
    let edmg = Math.max(1, rollExpr(e.dmg) - 0);
    p.hp = Math.max(0, p.hp - edmg);
    c.log.push(`【${e.name}】反擊命中（擲 ${eroll}/${e.atk}），你受到 ${edmg} 點傷害。`);
    SFX.bad();
  } else {
    c.log.push(`【${e.name}】反擊落空（擲 ${eroll}/${e.atk}）。`);
  }

  if(p.hp<=0){
    c.log.push('你倒下了……');
    endCombat(false,false,true);
    return;
  }

  c.round++;
  if(c.round > 10){
    c.log.push('十個回合過去，你成功脫離了戰鬥。');
    endCombat(false,true);
    return;
  }
  renderHUD();
  renderCombat();
}

function endCombat(win, fled, down){
  const c = G.combat;
  if(!c) return;
  const cb = c.onEnd;

  if(win){
    // 擊敗怪物恢復理智
    if(c.enemy.san){
      const rec = rollExpr(c.enemy.san.s);
      if(rec>0){
        G.pc.san = clamp(G.pc.san + rec, 0, G.pc.sanMax);
        toast(`擊敗【${c.enemy.name}】，恢復 ${rec} 點理智值`);
      }
    }
    addHistory('戰鬥', `擊敗了 ${c.enemy.name}`);
  }

  if(down){
    // 住院
    G.pc.hp = 1;
    const rec = d(12);
    G.pc.hp = clamp(rec, 1, G.pc.hpMax);
    toast('你在醫院醒來，醫護人員說你能活下來是奇蹟。');
    addHistory('重傷', '你在戰鬥中倒下，被送進了醫院。');
    G.combat = null;
    G.phase='adventure';
    renderHUD();
    setStage(`
      <div class="card">
        <div id="eventTitle">醫院</div>
        <div style="line-height:1.9">
          你在陌生的病床上醒來。消毒水的氣味刺鼻，窗外陽光刺眼。<br><br>
          護士告訴你，是路人把你送來的。你記不清自己昏迷了多久，只知道全身每一處都在疼。<br><br>
          出院時，醫生叮囑你「好好照顧自己」。
        </div>
      </div>
      <div id="actions"></div>
    `);
    const b=document.createElement('button');
    b.className='btn'; b.textContent='繼續 ▸';
    b.onclick=()=>{ if(cb) cb(); };
    $('#actions').appendChild(b);
    return;
  }

  G.combat = null;
  G.phase = 'adventure';
  renderHUD();
  if(cb) cb();
}

function renderEnding(){

    </div>
    <div class="hscroll" id="stepScroll">

          <div class="lbl" style="background:rgba(0,0,0,.6)">${done?(win?'已達成':'未達成'):'尚未嘗試'}</div>
        </div>`;
      }).join('')}
    </div>

  `);

    const b = document.createElement('button');
    b.className='btn primary';
    b.textContent = `🎲 步驟 ${idx+1}：${s.label}（${s.skill} ${target}%）`;
    b.onclick = ()=>endStepRoll(s);
    acts.appendChild(b);
  } else {
    resolveEnding();
  }
}

function endStepRoll(step){
  const skill = G.pc.skills[step.skill]||0;
  const roll = d100();
  SFX.dice();
  const ok = (roll <= skill) || roll===1;
  G.endResults[G.endStep] = ok;
  if(ok) G.endWins++;
  G.endStep++;

  const box = $('#resultBox');
  box.classList.remove('hide','ok','bad','neutral');
  box.classList.add(ok?'ok':'bad');
  box.innerHTML = `<b>${ok?'✔':'✘'} ${step.label}</b>　（擲出 ${roll}，目標 ${skill}%）`;
  if(ok) SFX.good(); else SFX.bad();

  addHistory('最終檢定', `${step.label}：${ok?'成功':'失敗'}`);

  // 重新渲染剩餘步驟
  setTimeout(()=>{
    renderEnding();
    const rb = $('#resultBox');
    if(rb){ rb.classList.remove('hide','ok','bad'); rb.classList.add(ok?'ok':'bad'); rb.innerHTML = `<b>${ok?'✔':'✘'} ${step.label}</b>　（擲出 ${roll}，目標 ${skill}%）`; }
  }, 260);
}

function resolveEnding(){
  const ev = G.cur;
  const win = G.endWins >= 2;
  const sanMod = win ? ev.win.san : ev.lose.san;
  const v = rollExpr(sanMod);
  G.pc.san = clamp(G.pc.san + v, 0, G.pc.sanMax);

  const text = win ? ev.win.text : ev.lose.text;
  addHistory(win?'結局·勝利':'結局·失敗', text);

  if(win){
    unlockAchievement('守護者', '成功阻止了一次宇宙級災難。');
  }

  setStage(`
    <div id="scene">${sceneSVG(win?'temple':'sea')}<div id="sceneLabel">${win?'勝利':'失敗'}</div></div>
    <div class="card">
      <div id="eventTitle">${win?'結局 · 成功':'結局 · 失敗'}</div>
      <div style="line-height:1.9">${text}</div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px dashed #a08a5e;font-size:13.5px">
        成功步驟：${G.endWins} / 3　·　理智值變動：${v>0?'+':''}${v}
      </div>
    </div>
    <div id="actions"></div>
  `);
  renderHUD();

  const acts = $('#actions');
  if(G.pc.san<=0){
    const b=document.createElement('button');
    b.className='btn primary'; b.textContent='……';
    b.onclick=()=>handleInsane();
    acts.appendChild(b);
    return;
  }

  const b = document.createElement('button');
  b.className='btn primary';
  b.textContent='結束冒險，進入休整期 ▸';
  b.onclick = ()=>startDowntime();
  acts.appendChild(b);
}

function startDowntime(){
  G.phase='downtime';

function skillGrowth(){
  if(!G.pc) return;
  const used = [...new Set(G.pc.usedSkills||[])];
  const grown = [];
  used.forEach(sk=>{
    if(sk==='超自然') return;
    const cur = G.pc.skills[sk]||0;
    const roll = d100();
    if(roll > cur){
      const inc = d(6);
      G.pc.skills[sk] = clamp(cur+inc, 0, 99);
      grown.push(`${sk} +${inc}%`);
    }
  });
  G.pc.usedSkills = [];
  if(grown.length){
    toast('技能成長：'+grown.join('、'));
    addHistory('技能成長', grown.join('、'));
  }
}

function renderDowntime(){
  const p = G.pc;
  setStage(`
    <div id="scene">${sceneSVG('home')}<div id="sceneLabel">休整期</div></div>
    <div class="card">
      <div id="eventTitle">休整期 · 剩餘 ${G.dp} DP</div>
      <div style="line-height:1.8">
        冒險結束了。現在是屬於你自己的時間。<br>

      </div>

        生命 ${p.hp}/${p.hpMax}　·　理智 ${p.san}/${p.sanMax}　·　資源 ${p.res}
      </div>
      <div class="bar dp" style="margin-top:8px"><i style="width:${Math.min(100,G.dp/18*100)}%"></i></div>
    </div>
    <div class="card" id="dtLog" style="font-size:13px;line-height:1.7">
      ${(G.downtimeLog||[]).length? (G.downtimeLog||[]).map(l=>`<div>· ${l}</div>`).join('') : '<i style="color:#7a5c2e">尚未進行任何活動。</i>'}
    </div>
    <div id="actions"></div>
  `);

  const acts = $('#actions');
  DOWNTIME_ACTS.forEach(a=>{
    let cost = a.cost;
    if(a.key==='heal'){
      cost = Math.max(1, p.hpMax - p.hp);
      if(p.hp >= p.hpMax){ return; }
    }
    if(G.dp < cost) return;

    const b = document.createElement('button');
    b.className='btn';
    b.textContent = `${a.name}　（${cost} DP）`;
    b.onclick = ()=>doDowntime(a, cost);
    acts.appendChild(b);
  });

  const b2 = document.createElement('button');
  b2.className='btn primary';
  b2.textContent = G.dp>0 ? '結束休整，展開新冒險 ▸' : '展開新冒險 ▸';
  b2.onclick = ()=>{ SFX.click(); startAdventure(); };
  acts.appendChild(b2);

  if(G.dp<=0){
    const note = document.createElement('div');
    note.style.cssText='text-align:center;font-size:12px;color:#8a7857;padding:4px';
    note.textContent='休整點數已耗盡。';
    acts.appendChild(note);
  }
  renderHUD();
}

function doDowntime(act, cost){
  const p = G.pc;
  if(G.dp < cost){ toast('休整點數不足'); return; }
  G.dp -= cost;
  SFX.click();
  let msg='';

  switch(act.key){
    case 'heal': {
      const before=p.hp;
      p.hp = Math.min(p.hpMax, p.hp + cost);
      msg=`治療與康復：生命值 ${before} → ${p.hp}`;
      break;
    }
    case 'mind': {
      const roll=d100();
      if(roll <= 70){
        const inc=d(6);
        p.san=clamp(p.san+inc,0,p.sanMax);
        msg=`改善心理健康：恢復 ${inc} 點理智值（${p.san}/${p.sanMax}）`;
      } else {
        p.san=clamp(p.san-1,0,p.sanMax);
        msg='改善心理健康：療程並不順利，反而讓你更加不安（-1 理智）。';
      }
      break;
    }
    case 'skill': {
      const sk=pick(SKILL_NAMES.filter(s=>s!=='超自然'));
      const cur=p.skills[sk]||0;
      const roll=d100();
      if(roll > cur){
        const inc=d(6)+d(6)+d(6);
        p.skills[sk]=clamp(cur+inc,0,99);
        msg=`提升技能：${sk} ${cur}% → ${p.skills[sk]}%`;
      } else {
        msg=`提升技能：練習【${sk}】沒有明顯進展。`;
      }
      break;
    }
    case 'stat': {
      const st=pick(['STR','CON','DEX','INT','POW','CHA']);
      const cur=p.stats[st];
      const roll=d100();
      if(roll > cur*5 && cur<18){
        p.stats[st]++;
        msg=`提升屬性：${statName(st)} ${cur} → ${p.stats[st]}`;
        if(st==='CON'||st==='STR'){ p.hpMax=Math.ceil((p.stats.STR+p.stats.CON)/2); p.hp=Math.min(p.hp,p.hpMax); }
        if(st==='POW'){ p.sanMax=p.stats.POW*5; p.bp=p.stats.POW*4; }
      } else {
        msg=`提升屬性：鍛鍊${statName(st)}沒有明顯成果。`;
      }
      break;
    }
    case 'money': {
      const roll=d100();
      const skills=pick(['行政管理','說服','社交禮儀','研究']);
      const tgt=p.skills[skills]||10;
      if(roll <= tgt){
        p.res=clamp(p.res+1,0,20);
        msg=`改善經濟狀況：資源評級 → ${p.res}`;
      } else {
        msg='改善經濟狀況：這次投資血本無歸。';
      }
      break;
    }
    case 'bond': {
      if(!p.bondsP.length){ msg='你沒有可以經營的個人羈絆。'; break; }
      const b=pick(p.bondsP);
      const roll=d100();
      if(roll <= p.stats.CHA*5){
        const inc=d(3);
        b.val=clamp(b.val+inc,0,20);
        msg=`提升個人羈絆：${b.name} → ${b.val}`;
      } else {
        msg=`提升個人羈絆：與${b.name}的相處並不愉快。`;
      }
      break;
    }
    case 'cbond': {
      if(!p.bondsC.length){ msg='你沒有可以經營的社群羈絆。'; break; }
      const b=pick(p.bondsC);
      const roll=d100();
      if(roll > b.val*5){
        b.val=clamp(b.val+1,0,20);
        msg=`提升社群羈絆：${b.name} → ${b.val}`;
      } else {
        msg=`提升社群羈絆：你在${b.name}中的表現沒有引起注意。`;
      }
      break;
    }
    case 'meet': {
      const roll=d100();
      if(roll <= p.stats.CHA*5){
        const nm=pick(['酒保 老傑克','鄰居 米莉','報童 湯米','書店老闆 哈里斯','同事 艾倫']);
        const val=Math.ceil(p.stats.CHA/2);
        p.bondsP.push({name:nm, val});
        msg=`結識新朋友：${nm}（羈絆 ${val}）`;
      } else {
        msg='結識新朋友：這次沒能建立起友誼。';
      }
      break;
    }
    case 'join': {
      const roll=d100();
      if(roll <= p.stats.CHA*5){
        const nm=pick(['業餘天文學會','慈善互助會','退伍軍人協會','讀書沙龍','地方商會']);
        const val=Math.ceil(p.res/2);
        p.bondsC.push({name:nm, val});
        msg=`加入新團體：${nm}（羈絆 ${val}）`;
      } else {
        msg='加入新團體：申請沒有通過。';
      }
      break;
    }
  }

  G.downtimeLog = G.downtimeLog||[];
  G.downtimeLog.unshift(msg);
  addHistory('休整活動', msg);
  if(/→/.test(msg)) SFX.good(); else SFX.click();
  renderDowntime();
}

      <div id="eventTitle">你的調查員</div>
      <div style="font-size:19px;letter-spacing:2px;color:#6b1a1a;margin-bottom:6px">${p.name}</div>
      <div style="font-size:13.5px;line-height:1.9">
        ${p.gender} · ${p.age} 歲 · ${p.archName}<br>
        出生地：${p.birth}　現居：${p.home}
      </div>
      <div class="grid2" style="margin-top:12px">
        ${Object.entries(p.stats).map(([k,v])=>`
          <div class="mini-card"><div class="k">${statName(k)}</div><div class="v">${v}（${v*5}%）</div></div>
        `).join('')}
      </div>
      <div class="grid2" style="margin-top:8px">
        <div class="mini-card"><div class="k">生命值</div><div class="v">${p.hp}/${p.hpMax}</div></div>
        <div class="mini-card"><div class="k">理智值</div><div class="v">${p.san}/${p.sanMax}</div></div>
        <div class="mini-card"><div class="k">崩潰點</div><div class="v">${p.bp}</div></div>
        <div class="mini-card"><div class="k">傷害加成</div><div class="v">${p.db>=0?'+':''}${p.db}</div></div>
        <div class="mini-card"><div class="k">資源評級</div><div class="v">${p.res}</div></div>
        <div class="mini-card"><div class="k">武器</div><div class="v" style="font-size:12.5px">${p.weapons.map(w=>w.name).join('、')}</div></div>
      </div>
      <div style="margin-top:12px;font-size:13px;line-height:1.8">
        <b>個人羈絆：</b>${p.bondsP.map(b=>`${b.name}（${b.val}）`).join('、')}<br>
        <b>社群羈絆：</b>${p.bondsC.map(b=>`${b.name}（${b.val}）`).join('、')}
      </div>
    </div>
    <div id="actions"></div>
  `);
  const acts=$('#actions');
  const b=document.createElement('button');
  b.className='btn primary'; b.textContent='踏上第一次冒險 ▸';
  b.onclick=()=>{ SFX.click(); startAdventure(); };
  acts.appendChild(b);
  const b2=document.createElement('button');
  b2.className='btn'; b2.textContent='查看完整角色表';
  b2.onclick=()=>openSheet();
  acts.appendChild(b2);
}

/* =========================================================
   17. 彈窗：說明 / 角色 / 紀錄
   ========================================================= */
const modal = $('#modal');
const modalBox = $('#modalBox');

function openModal(html, closable=true){
  modalBox.innerHTML = html;
  modal.classList.add('show');
  // 阻止背景滾動
  document.body.style.overflow='hidden';
}

function closeModal(){
  modal.classList.remove('show');
  document.body.style.overflow='';
}

function openHelp(firstTime=false){
  const html = `
    <h2>📖 玩法說明</h2>
    <p>這是一款<b>單人跑團遊戲</b>。你同時扮演「調查員」與「故事主持人」，透過表格與骰子，一步步揭開隱藏在日常之下的宇宙恐怖。</p>

    <h3>🎯 遊戲目標</h3>
    <p>你扮演一名 1920 年代的調查員，一次又一次地捲入詭異事件。<b>你不需要「贏」</b>——你要做的，是讓你的角色盡可能活久一點、知道少一點、保持理智多一點。當理智值降到 0，這個角色就永久退場了。</p>

    <h3>👀 看懂畫面</h3>
    <ul>
      <li><b>最上方那一排</b>是你的狀態列：</li>
      <li>🧠 <b>理智值</b>：例如 <code>55/55</code>，斜線右邊是上限。<code>·BP44</code> 是「崩潰點」，理智掉到這個數字以下會觸發瘋狂。</li>
      <li>❤️ <b>生命值</b>：歸零你就會昏迷送醫。</li>
      <li>💰 <b>資源評級</b>：0～20，代表你的財力與社會地位。</li>
      <li>🔍 <b>線索</b>：你手上握有幾條線索。可以在技能檢定前消耗 1 條，換取 <b>+30%</b> 的成功率。</li>
      <li>📖 <b>階段</b>：目前處於「起始／謎團／調查／轉折點／結局／戰鬥／休整」哪個階段。</li>
    </ul>

    <h3>▶️ 操作流程</h3>
    <ul>
      <li><b>1. 選擇原型</b>：開場時選擇你的職業，系統會自動幫你配好屬性、技能與羈絆。</li>
      <li><b>2. 閱讀事件</b>：中間的羊皮紙卡片會以打字機效果顯示事件文字。<b>點一下文字區域</b>可以立刻跳過動畫。</li>
      <li><b>3. 進行檢定</b>：如果事件需要檢定，下方會出現 <code>🎲 進行【技能】檢定</code> 按鈕。系統會擲 1D100，<b>擲出小於等於技能值就成功</b>。</li>
      <li><b>4. 使用線索</b>：檢定前可點 <code>ʘ 消耗線索 +30%</code>，讓這次檢定更容易成功。線索用掉就沒了。</li>
      <li><b>5. 繼續調查</b>：事件結算後，點「繼續調查」推進到下一個表格。</li>
      <li><b>6. 遭遇戰鬥</b>：若進入戰鬥，你會看到雙方的生命條。選擇武器攻擊，敵人會反擊。撐過 10 回合或擊倒敵人就算脫身。</li>
      <li><b>7. 進入結局</b>：冒險最後會進入「最終對決」，需要連續進行 3 項技能檢定，<b>成功 2 項以上</b>才算勝利。</li>
      <li><b>8. 休整期</b>：冒險結束後會擲 3D6 得到休整點數（DP），用來療傷、恢復理智、提升技能或經營羈絆。</li>
    </ul>

    <h3>⚙️ 特殊機制</h3>
    <ul>
      <li><b>理智與瘋狂</b>：單次失去 5 點以上理智，或理智降到崩潰點以下，就會陷入「暫時瘋狂」，你會學到一些不該知道的事（超自然技能提升），但也會留下永久的精神障礙。</li>
      <li><b>線索就是籌碼</b>：線索可以在任何技能檢定前使用，連 0% 的技能也能靠線索硬闖。</li>
      <li><b>技能會成長</b>：冒險中成功使用過的技能，在冒險結束時會進行「成長檢定」——擲出高於技能值就 +1D6%。</li>
      <li><b>羈絆會斷</b>：羈絆歸零會觸發理智檢定，而且會痛。</li>
      <li><b>戰鬥不一定要打完</b>：撐滿 10 回合也算脫身，只是拿不到擊敗敵人的理智獎勵。</li>
    </ul>

    <h3>💡 小訣竅</h3>
    <ul>
      <li>線索別亂花——留給「結局三步驟」或「戰鬥前的關鍵檢定」。</li>
      <li>理智低於崩潰點時，任何一次理智損失都可能讓你直接送進精神病院。</li>
      <li>休整期是補血的黃金時段，別讓生命值一直卡在低檔。</li>
      <li>存檔隨時可按，不用怕玩到一半斷線。</li>
    </ul>

    <button class="btn primary modal-close" id="helpClose">
      ${firstTime?'我準備好了，開始遊戲':'關閉說明'}
    </button>
  `;
  openModal(html);
  $('#helpClose').onclick = ()=>{
    SFX.click();
    closeModal();
    if(firstTime){ showCreate(); }
  };
}

/* =========================================================
   18. 存檔 / 讀檔
   ========================================================= */
const SAVE_KEY = 'cthulhu_solo_save_v1';

function saveGame(){
  if(!G.pc){ toast('還沒有可以儲存的進度'); return; }
  try{
    const snapshot = {
      phase:G.phase, sub:G.sub, pc:G.pc, cur:G.cur, curStage:G.curStage,
      dp:G.dp, adventureCount:G.adventureCount, history:G.history,
      achievements:G.achievements, soundOn:G.soundOn, downtimeLog:G.downtimeLog,
      endStep:G.endStep, endWins:G.endWins, endResults:G.endResults
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot));
    toast('💾 已儲存進度');
    SFX.good();
  }catch(e){ toast('儲存失敗：'+e.message); }
}

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ toast('沒有找到存檔'); return; }
    const s = JSON.parse(raw);
    G = freshState();
    Object.assign(G, s);
    G.pc.clues = G.pc.clues || [];
    G.soundOn = soundOn;
    renderHUD();
    toast('📂 已讀取進度');
    SFX.good();
    resumeFromState();
  }catch(e){ toast('讀取失敗：'+e.message); }
}

function resumeFromState(){
  if(G.phase==='combat' && G.combat){
    G.phase='combat';
    renderCombat();
    return;
  }
  if(G.phase==='ending' && G.cur){
    renderEnding();
    return;
  }
  if(G.phase==='downtime'){
    renderDowntime();
    return;
  }
  if(G.phase==='gameover'){
    renderGameOver('冒險已經結束。', '終局');
    return;
  }
  if(G.pc && G.cur){
    // 重新顯示當前事件
    const ev = G.cur;
    const kind = sceneFor(ev.t);
    setStage(`
      <div id="scene">${sceneSVG(kind)}<div id="sceneLabel">${G.curStage||'冒險'}</div></div>
      <div class="card">
        <div id="eventTitle">${G.curStage||'冒險'} · 事件</div>
        <div id="eventText">${ev.t}</div>
        <div id="clueTags"></div>
      </div>
      <div id="actions"></div>
      <div id="resultBox" class="hide"></div>
    `);
    renderEventActions();
    renderHUD();
    return;
  }
  showCharacterReveal();
}

/* =========================================================
   19. 底部導覽事件
   ========================================================= */
$('#nav').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const act = btn.dataset.act;
  SFX.click();
  switch(act){
    case 'help': openHelp(false); break;
    case 'sheet': openSheet(); break;
    case 'log': openLog(); break;
    case 'save': saveGame(); break;
    case 'load': loadGame(); break;
    case 'mute':
      soundOn = !soundOn;
      G.soundOn = soundOn;
      $('#muteIco').textContent = soundOn?'🔊':'🔇';
      toast(soundOn?'音效已開啟':'音效已關閉');
      break;
  }
});

/* 點擊遮罩關閉彈窗 */
modal.addEventListener('click', e=>{
  if(e.target === modal){
    // 說明首次彈窗不允許點遮罩關閉
    const closeBtn = modalBox.querySelector('#helpClose');
    if(closeBtn && G.phase==='intro' && !G.pc) return;
    closeModal();
  }
});

/* 全域函式供 inline onclick 使用 */
window.closeModal = closeModal;

/* =========================================================
   20. 啟動
   ========================================================= */
(function init(){
  showIntro();
  // 首次進入提示
  setTimeout(()=>{
    if(G.phase==='intro' && !G.pc){
      // 不強制彈出，讓玩家自己點
    }
  }, 300);
})();
</script>
