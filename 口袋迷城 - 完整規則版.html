<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>口袋迷城 - 終極戰役版</title>
    <style>
        :root {
            --bg-color: #2c1e16;
            --paper-color: #f4e8c1;
            --text-dark: #3e2723;
            --text-light: #d7ccc8;
            --accent-red: #8b0000;
            --accent-green: #2e7d32;
            --accent-blue: #1565c0;
            --gold: #ffb300;
            --card-bg: #4e342e;
            --border-color: #8d6e63;
            --shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #3e2723 0%, #1a0f0a 100%);
        }

        /* 頂部狀態列 */
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 10px; background: rgba(0,0,0,0.9);
            border-bottom: 2px solid var(--border-color); font-size: 0.85em; z-index: 10;
            flex-wrap: wrap;
        }
        .stat { display: flex; align-items: center; gap: 3px; font-weight: bold; margin-right: 8px; }
        .gold-text { color: var(--gold); }
        .hp-text { color: #ff5252; }
        .xp-text { color: #64b5f6; }

        /* 地圖與戰場 */
        #map-container {
            flex: 1; position: relative; background: #1a0f0a; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #hex-svg { width: 100%; height: 100%; }
        
        /* 元素條 */
        #elements-bar {
            position: absolute; top: 10px; left: 10px;
            display: flex; gap: 5px; background: rgba(0,0,0,0.7); padding: 5px; border-radius: 5px;
        }
        .element { width: 25px; height: 25px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; opacity: 0.3; transition: opacity 0.3s, box-shadow 0.3s; }
        .element.active { opacity: 1; box-shadow: 0 0 10px currentColor; }
        .el-fire { color: #ff5722; background: #3e2723; border: 1px solid #ff5722; }
        .el-ice { color: #03a9f4; background: #1a237e; border: 1px solid #03a9f4; }
        .el-air { color: #e0e0e0; background: #212121; border: 1px solid #e0e0e0; }
        .el-earth { color: #8bc34a; background: #1b5e20; border: 1px solid #8bc34a; }
        .el-light { color: #ffeb3b; background: #f57f17; border: 1px solid #ffeb3b; }
        .el-dark { color: #9c27b0; background: #311b92; border: 1px solid #9c27b0; }

        /* 六角格樣式 */
        .hex-bg { fill: #3e2723; stroke: #5d4037; stroke-width: 1; }
        .hex-move { fill: #2e7d32; opacity: 0.6; cursor: pointer; }
        .hex-move:hover { opacity: 1; }
        
        /* 單位 */
        .unit-player { fill: #1565c0; stroke: #fff; stroke-width: 2; }
        .unit-enemy { fill: #b71c1c; stroke: #fff; stroke-width: 2; cursor: crosshair; }
        .unit-text { fill: white; font-size: 12px; text-anchor: middle; dominant-baseline: central; pointer-events: none; font-weight: bold; }
        
        /* 狀態圖示 */
        .status-icon { font-size: 10px; }

        /* 控制面板 */
        #control-panel {
            background: rgba(0,0,0,0.95); border-top: 2px solid var(--border-color);
            padding: 8px; display: flex; flex-direction: column; height: 240px;
        }
        #combat-log {
            height: 50px; overflow-y: auto; font-size: 0.75em; color: #b0bec5;
            margin-bottom: 5px; border: 1px solid #333; padding: 4px; border-radius: 4px;
        }
        .log-entry { margin-bottom: 2px; }

        /* 卡牌區 */
        .card-row {
            display: flex; gap: 8px; overflow-x: auto; padding: 5px 0;
            width: 100%; align-items: center; flex-wrap: nowrap; height: 110px;
        }
        .card {
            flex: 0 0 90px; height: 100px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 6px; padding: 4px;
            display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; font-size: 0.7em;
        }
        .card.selected { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); transform: translateY(-5px); }
        .card.disabled { opacity: 0.4; pointer-events: none; }
        .card-name { font-weight: bold; color: #fff; text-align: center; border-bottom: 1px solid #555; }
        .card-init { color: var(--gold); text-align: center; }
        .card-action { background: rgba(0,0,0,0.3); margin-bottom: 2px; padding: 2px; border-radius: 2px; }

        /* 按鈕 */
        .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: auto; }
        .btn {
            background: var(--accent-red); color: white; border: none;
            padding: 8px 12px; font-size: 0.9em; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-green { background: var(--accent-green); }
        .btn-blue { background: var(--accent-blue); }
        .btn-gold { background: var(--gold); color: #333; }

        /* 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
        .modal.show { display: flex; }
        .modal-content { background: var(--paper-color); color: var(--text-dark); padding: 20px; border-radius: 8px; max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; border: 2px solid var(--border-color); }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #ccc; }
        .shop-item button { padding: 5px 10px; background: var(--accent-green); color: white; border: none; border-radius: 3px; cursor: pointer; }
        .shop-item button:disabled { background: #ccc; }
        
        #toast { visibility: hidden; background-color: #333; color: #fff; text-align: center; border-radius: 5px; padding: 10px; position: fixed; z-index: 200; left: 50%; bottom: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; border: 1px solid var(--gold); }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="stat">❤️ <span id="hp-val" class="hp-text">10/10</span></div>
        <div class="stat">🪙 <span id="gold-val" class="gold-text">0</span></div>
        <div class="stat">✨ <span id="xp-val" class="xp-text">0</span></div>
        <div class="stat" id="phase-display" style="color:#ffb300; margin-left:auto;">準備階段</div>
    </header>

    <div id="map-container">
        <div id="elements-bar">
            <div class="element el-fire" id="el-fire">🔥</div>
            <div class="element el-ice" id="el-ice">❄️</div>
            <div class="element el-air" id="el-air">💨</div>
            <div class="element el-earth" id="el-earth">🌿</div>
            <div class="element el-light" id="el-light">☀️</div>
            <div class="element el-dark" id="el-dark">🌙</div>
        </div>
        <svg id="hex-svg"></svg>
    </div>

    <div id="control-panel">
        <div id="combat-log"></div>
        <div class="card-row" id="hand-container"></div>
        <div class="btn-group">
            <button class="btn btn-green" id="btn-confirm-cards" onclick="Game.confirmCards()">確認選牌</button>
            <button class="btn btn-blue" id="btn-end-move" onclick="Game.endMovePhase()" style="display:none">結束移動</button>
            <button class="btn" id="btn-end-turn" onclick="Game.endPlayerTurn()" style="display:none">結束回合</button>
            <button class="btn btn-gold" id="btn-shop" onclick="Game.openShop()" style="display:none">進入商店</button>
            <button class="btn btn-green" id="btn-next-scenario" onclick="Game.nextScenario()" style="display:none">繼續冒險</button>
        </div>
    </div>

    <!-- 說明與商店彈窗 -->
    <div id="modal-instructions" class="modal">
        <div class="modal-content">
            <h2>📜 終極戰役規則</h2>
            <p><strong>【城鎮階段】</strong>：在冒險前，你可以使用金幣在商店購買裝備（上限2件）。</p>
            <p><strong>【戰鬥階段】</strong>：每回合選兩張牌。地圖上的元素（🔥❄️💨🌿☀️🌙）可以被卡牌生成或消耗，帶來額外加成。</p>
            <p><strong>【狀態異常】</strong>：怪物與玩家會受到中毒（每回合扣血）、暈眩（跳過回合）、護盾（抵擋傷害）影響。</p>
            <button class="btn btn-gold" style="width:100%; margin-top:15px;" onclick="Game.startCampaign()">開始戰役</button>
        </div>
    </div>

    <div id="modal-shop" class="modal">
        <div class="modal-content">
            <h2>🏪 黑衛客棧 - 裝備商店</h2>
            <p>你的金幣：<span id="shop-gold">0</span> 🪙 | 裝備上限：<span id="shop-inv">0/2</span></p>
            <div id="shop-list"></div>
            <button class="btn btn-gold" style="width:100%; margin-top:15px;" onclick="Game.closeShop()">離開商店</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ==========================================
        // 1. 豐富的 JSON 資料庫
        // ==========================================
        const GAME_DATA = {
            items: {
                '飛鷹頭盔': { price: 20, desc: '攻擊範圍 +1', type: 'head' },
                '塔盾': { price: 40, desc: '受到攻擊時，獲得 1 點護盾', type: 'hand' },
                '夜刃': { price: 25, desc: '近戰攻擊時，若在黑暗中 +2 傷害', type: 'hand' },
                '治癒藥水': { price: 15, desc: '戰鬥中可使用一次，恢復 3 生命', type: 'potion' }
            },
            cards: {
                '干擾': { init: 23, xp: 0, top: { move: 3, atk: 3, range: 1, el: 'air' }, bottom: { move: 2, atk: 2, range: 1 } },
                '自製葡萄酒': { init: 35, xp: 1, top: { heal: 3, move: 5 }, bottom: { atk: 4, range: 1, el: 'fire' } },
                '優質本能': { init: 17, xp: 0, top: { atk: 4, range: 3 }, bottom: { move: 2, atk: 2, range: 1, el: 'earth' } },
                '失效打擊': { init: 22, xp: 1, top: { atk: 4, range: 1, pierce: true }, bottom: { move: 2, atk: 2, range: 1 } },
                '治愈之水': { init: 28, xp: 0, top: { heal: 4, move: 2, el: 'ice' }, bottom: { atk: 3, range: 2 } },
                '游動攻擊': { init: 12, xp: 0, top: { move: 4, atk: 2, range: 1 }, bottom: { atk: 3, range: 2, el: 'dark' } },
                '隱身術': { init: 12, xp: 1, top: { move: 2, invis: true }, bottom: { atk: 2, range: 3, el: 'light' } }
            },
            monsters: {
                '狼': { hp: 4, atk: 2, move: 3, init: 20, icon: '🐺', range: 1, status: [] },
                '盜賊衛兵': { hp: 5, atk: 2, move: 3, init: 17, icon: '🗡️', range: 1, status: [] },
                '冰霜惡魔': { hp: 6, atk: 3, move: 2, init: 18, icon: '❄️', range: 2, status: ['shield'] },
                '瓦爾': { hp: 20, atk: 4, move: 2, init: 11, icon: '🧙', range: 3, status: [] }
            },
            modifiers: [
                { val: 0, text: '落空' }, { val: -2, text: '-2' }, { val: -1, text: '-1' },
                { val: 0, text: '0' }, { val: 1, text: '+1' }, { val: 2, text: '+2' }, { val: 2, text: 'x2', isDouble: true }
            ],
            scenarios: [
                { id: 1, title: "口袋幽港的大門", text: "狼群從黑暗中出現。", enemies: ['狼', '狼'], reward: { gold: 15, xp: 2 } },
                { id: 2, title: "通往北境的道路", text: "你在路上遇到了盜賊。", enemies: ['盜賊衛兵', '狼'], reward: { gold: 10, xp: 3 } },
                { id: 3, title: "凜冬大道", text: "冰霜惡魔擋住了去路。", enemies: ['冰霜惡魔', '狼'], reward: { gold: 20, xp: 5 } }
            ]
        };

        // ==========================================
        // 2. 六角格工具
        // ==========================================
        const Hex = {
            size: 28,
            toPixel(q, r) {
                return { x: 300 + this.size * Math.sqrt(3) * (q + r / 2), y: 150 + this.size * 1.5 * r };
            },
            distance(q1, r1, q2, r2) {
                return (Math.abs(q1 - q2) + Math.abs(q1 + r1 - q2 - r2) + Math.abs(r1 - r2)) / 2;
            },
            directions: [[1,0], [1,-1], [0,-1], [-1,0], [-1,1], [0,1]]
        };

        // ==========================================
        // 3. 遊戲核心與狀態機
        // ==========================================
        const Game = {
            state: 'TITLE', // TITLE, TOWN, SCENARIO_INTRO, SELECT_CARDS, PLAYER_MOVE, PLAYER_ATTACK, MONSTER_TURN, WIN
            player: { hp: 10, maxHp: 10, gold: 30, xp: 0, hand: [], discard: [], q: 2, r: 4, inventory: [], maxInv: 2, status: [] },
            combat: { enemies: [], selectedCards: [], movePoints: 0, attackActions: [], log: [], elements: { fire: false, ice: false, air: false, earth: false, light: false, dark: false } },
            currentScenario: 0,
            map: [],

            init() {
                for(let q = 0; q <= 5; q++) {
                    for(let r = 0; r <= 5; r++) {
                        if (q + r > 2 && q + r < 9) this.map.push({ q, r });
                    }
                }
                document.getElementById('modal-instructions').classList.add('show');
            },

            startCampaign() {
                document.getElementById('modal-instructions').classList.remove('show');
                this.state = 'TOWN';
                this.currentScenario = 1;
                this.player.gold = 30; // 初始資金
                this.updateUI();
                this.openShop();
            },

            // --- 商店系統 ---
            openShop() {
                document.getElementById('modal-shop').classList.add('show');
                this.renderShop();
            },
            closeShop() {
                document.getElementById('modal-shop').classList.remove('show');
                if (this.state === 'TOWN') {
                    this.state = 'SCENARIO_INTRO';
                    this.renderScenarioIntro();
                }
            },
            renderShop() {
                document.getElementById('shop-gold').innerText = this.player.gold;
                document.getElementById('shop-inv').innerText = `${this.player.inventory.length}/${this.player.maxInv}`;
                const list = document.getElementById('shop-list');
                list.innerHTML = '';
                for (let [name, data] of Object.entries(GAME_DATA.items)) {
                    const isOwned = this.player.inventory.some(i => i.name === name);
                    const canAfford = this.player.gold >= data.price;
                    const hasSpace = this.player.inventory.length < this.player.maxInv;
                    
                    list.innerHTML += `
                        <div class="shop-item">
                            <div><strong>${name}</strong> (${data.price}🪙)<br><small>${data.desc}</small></div>
                            <button onclick="Game.buyItem('${name}')" ${(!canAfford || !hasSpace || isOwned) ? 'disabled' : ''}>
                                ${isOwned ? '已擁有' : '購買'}
                            </button>
                        </div>
                    `;
                }
            },
            buyItem(name) {
                const item = GAME_DATA.items[name];
                if (this.player.gold >= item.price && this.player.inventory.length < this.player.maxInv) {
                    this.player.gold -= item.price;
                    this.player.inventory.push({ name, ...item });
                    this.showToast(`購買了 ${name}`);
                    this.renderShop();
                }
            },

            // --- 劇本介紹 ---
            renderScenarioIntro() {
                const s = GAME_DATA.scenarios.find(x => x.id === this.currentScenario);
                document.getElementById('map-container').innerHTML = `
                    <div style="padding: 20px; color: var(--paper-color); text-align: center; width: 100%;">
                        <h2>#${s.id} ${s.title}</h2>
                        <p style="margin-top: 20px; line-height: 1.6;">${s.text}</p>
                    </div>
                `;
                document.getElementById('btn-shop').style.display = 'none';
                document.getElementById('btn-next-scenario').style.display = 'block';
                document.getElementById('btn-next-scenario').innerText = '進入戰鬥';
                document.getElementById('btn-next-scenario').onclick = () => this.startCombat();
                this.updateUI();
            },

            // --- 戰鬥初始化 ---
            startCombat() {
                const s = GAME_DATA.scenarios.find(x => x.id === this.currentScenario);
                document.getElementById('map-container').innerHTML = `<div id="elements-bar">...</div><svg id="hex-svg"></svg>`;
                // 重新綁定元素條
                this.renderElementsBar();
                
                this.player.q = 2; this.player.r = 4;
                this.player.hand = ['干擾', '自製葡萄酒', '優質本能', '失效打擊', '治愈之水', '游動攻擊', '隱身術'];
                this.player.discard = [];
                this.player.status = [];
                
                this.combat.enemies = s.enemies.map((eName, i) => {
                    const m = GAME_DATA.monsters[eName];
                    return { id: i, name: eName, hp: m.hp, maxHp: m.hp, atk: m.atk, move: m.move, init: m.init, icon: m.icon, range: m.range, q: 1 + i, r: 1, status: [...m.status] };
                });
                this.combat.log = ["戰鬥開始！"];
                this.combat.elements = { fire: false, ice: false, air: false, earth: false, light: false, dark: false };
                
                this.state = 'SELECT_CARDS';
                this.render();
            },

            // --- 渲染核心 ---
            render() {
                this.renderMap();
                this.renderElementsBar();
                this.updateUI();
                this.renderHand();
                this.renderLog();
            },

            renderElementsBar() {
                const bar = document.getElementById('elements-bar');
                if(!bar) return;
                for (let el in this.combat.elements) {
                    const elDiv = document.getElementById(`el-${el}`);
                    if (elDiv) {
                        if (this.combat.elements[el]) elDiv.classList.add('active');
                        else elDiv.classList.remove('active');
                    }
                }
            },

            renderMap() {
                const svg = document.getElementById('hex-svg');
                if (!svg) return;
                svg.innerHTML = '';

                this.map.forEach(cell => {
                    const pos = Hex.toPixel(cell.q, cell.r);
                    let points = [];
                    for (let i = 0; i < 6; i++) {
                        const angle = 2 * Math.PI / 6 * i;
                        points.push(`${pos.x + Hex.size * Math.cos(angle)},${pos.y + Hex.size * Math.sin(angle)}`);
                    }
                    
                    let className = 'hex-bg';
                    if (this.state === 'PLAYER_MOVE' && this.validMoves?.some(m => m.q === cell.q && m.r === cell.r)) {
                        className = 'hex-move';
                    }
                    
                    const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                    polygon.setAttribute('points', points.join(' '));
                    polygon.setAttribute('class', className);
                    if (this.state === 'PLAYER_MOVE') polygon.onclick = () => this.movePlayer(cell.q, cell.r);
                    svg.appendChild(polygon);
                });

                // 玩家
                const pPos = Hex.toPixel(this.player.q, this.player.r);
                svg.innerHTML += `<circle cx="${pPos.x}" cy="${pPos.y}" r="14" class="unit-player"/><text x="${pPos.x}" y="${pPos.y}" class="unit-text">你</text>`;
                // 玩家狀態
                if(this.player.status.includes('poison')) svg.innerHTML += `<text x="${pPos.x+10}" y="${pPos.y-10}" class="status-icon">🧪</text>`;

                // 敵人
                this.combat.enemies.forEach(enemy => {
                    if (enemy.hp <= 0) return;
                    const ePos = Hex.toPixel(enemy.q, enemy.r);
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    if (this.state === 'PLAYER_ATTACK') {
                        g.style.cursor = 'crosshair';
                        g.onclick = () => this.attackEnemy(enemy);
                    }
                    g.innerHTML = `
                        <circle cx="${ePos.x}" cy="${ePos.y}" r="14" class="unit-enemy"/>
                        <text x="${ePos.x}" y="${ePos.y}" class="unit-text">${enemy.icon}</text>
                        <rect x="${ePos.x-15}" y="${ePos.y+18}" width="30" height="4" fill="#000"/>
                        <rect x="${ePos.x-15}" y="${ePos.y+18}" width="${30*(enemy.hp/enemy.maxHp)}" height="4" fill="#4caf50"/>
                    `;
                    // 敵人狀態
                    if(enemy.status.includes('poison')) g.innerHTML += `<text x="${ePos.x+10}" y="${ePos.y-10}" class="status-icon">🧪</text>`;
                    if(enemy.status.includes('stun')) g.innerHTML += `<text x="${ePos.x-15}" y="${ePos.y-10}" class="status-icon">💫</text>`;
                    if(enemy.status.includes('shield')) g.innerHTML += `<text x="${ePos.x}" y="${ePos.y-15}" class="status-icon">🛡️</text>`;
                    
                    svg.appendChild(g);
                });
            },

            updateUI() {
                document.getElementById('hp-val').innerText = `${this.player.hp}/${this.player.maxHp}`;
                document.getElementById('gold-val').innerText = this.player.gold;
                document.getElementById('xp-val').innerText = this.player.xp;
                
                const phase = document.getElementById('phase-display');
                if (this.state === 'SELECT_CARDS') phase.innerText = '選擇卡牌';
                if (this.state === 'PLAYER_MOVE') phase.innerText = `移動 (剩 ${this.combat.movePoints})`;
                if (this.state === 'PLAYER_ATTACK') phase.innerText = '攻擊';
                if (this.state === 'MONSTER_TURN') phase.innerText = '怪物回合';
                
                document.getElementById('btn-confirm-cards').style.display = this.state === 'SELECT_CARDS' ? 'block' : 'none';
                document.getElementById('btn-confirm-cards').disabled = this.combat.selectedCards.length !== 2;
                document.getElementById('btn-end-move').style.display = this.state === 'PLAYER_MOVE' ? 'block' : 'none';
                document.getElementById('btn-end-turn').style.display = this.state === 'PLAYER_ATTACK' ? 'block' : 'none';
            },

            renderHand() {
                const handDiv = document.getElementById('hand-container');
                handDiv.innerHTML = '';
                this.player.hand.forEach(cName => {
                    const card = GAME_DATA.cards[cName];
                    const isSelected = this.combat.selectedCards.includes(cName);
                    handDiv.innerHTML += `
                        <div class="card ${isSelected ? 'selected' : ''} ${this.state !== 'SELECT_CARDS' ? 'disabled' : ''}" onclick="Game.toggleCard('${cName}')">
                            <div class="card-name">${cName}</div>
                            <div class="card-init">先攻: ${card.init}</div>
                            <div class="card-action"><strong>上</strong> ${card.top.move?`移${card.top.move}`:''} ${card.top.atk?`攻${card.top.atk}`:''} ${card.top.el?`[${card.top.el}]`:''}</div>
                            <div class="card-action"><strong>下</strong> ${card.bottom.move?`移${card.bottom.move}`:''} ${card.bottom.atk?`攻${card.bottom.atk}`:''} ${card.bottom.el?`[${card.bottom.el}]`:''}</div>
                        </div>
                    `;
                });
            },

            renderLog() {
                const logDiv = document.getElementById('combat-log');
                logDiv.innerHTML = this.combat.log.map(l => `<div class="log-entry">${l}</div>`).join('');
                logDiv.scrollTop = logDiv.scrollHeight;
            },

            // --- 回合邏輯 ---
            toggleCard(cName) {
                if (this.state !== 'SELECT_CARDS') return;
                const idx = this.combat.selectedCards.indexOf(cName);
                if (idx > -1) this.combat.selectedCards.splice(idx, 1);
                else if (this.combat.selectedCards.length < 2) this.combat.selectedCards.push(cName);
                this.updateUI();
                this.renderHand();
            },

            confirmCards() {
                const c1 = GAME_DATA.cards[this.combat.selectedCards[0]];
                const c2 = GAME_DATA.cards[this.combat.selectedCards[1]];
                
                // 元素生成
                if (c1.top.el) { this.combat.elements[c1.top.el] = true; this.combat.log.push(`生成元素：${c1.top.el}`); }
                if (c2.bottom.el) { this.combat.elements[c2.bottom.el] = true; this.combat.log.push(`生成元素：${c2.bottom.el}`); }

                this.combat.movePoints = (c1.top.move || 0) + (c2.bottom.move || 0);
                this.combat.attackActions = [];
                if (c1.top.atk) this.combat.attackActions.push({ atk: c1.top.atk, range: c1.top.range || 1, pierce: c1.top.pierce, name: this.combat.selectedCards[0] });
                if (c2.bottom.atk) this.combat.attackActions.push({ atk: c2.bottom.atk, range: c2.bottom.range || 1, pierce: c2.bottom.pierce, name: this.combat.selectedCards[1] });

                this.state = 'PLAYER_MOVE';
                this.calculateValidMoves();
                this.render();
            },

            calculateValidMoves() {
                this.validMoves = [];
                const queue = [{ q: this.player.q, r: this.player.r, cost: 0 }];
                const visited = new Set([`${this.player.q},${this.player.r}`]);
                
                while (queue.length > 0) {
                    const curr = queue.shift();
                    if (curr.cost > 0) this.validMoves.push(curr);
                    if (curr.cost < this.combat.movePoints) {
                        for (let d of Hex.directions) {
                            const nq = curr.q + d[0], nr = curr.r + d[1];
                            const key = `${nq},${nr}`;
                            if (this.map.some(m => m.q === nq && m.r === nr) && !visited.has(key)) {
                                if (!this.combat.enemies.some(e => e.q === nq && e.r === nr && e.hp > 0)) {
                                    visited.add(key);
                                    queue.push({ q: nq, r: nr, cost: curr.cost + 1 });
                                }
                            }
                        }
                    }
                }
            },

            movePlayer(q, r) {
                const cost = Hex.distance(this.player.q, this.player.r, q, r);
                this.player.q = q; this.player.r = r;
                this.combat.movePoints -= cost;
                if (this.combat.movePoints <= 0) this.endMovePhase();
                else { this.calculateValidMoves(); this.render(); }
            },

            endMovePhase() {
                this.state = 'PLAYER_ATTACK';
                this.render();
            },

            attackEnemy(enemy) {
                if (this.combat.attackActions.length === 0) return this.showToast('沒有可用攻擊');
                const dist = Hex.distance(this.player.q, this.player.r, enemy.q, enemy.r);
                const action = this.combat.attackActions[0];
                if (dist > action.range) return this.showToast('距離太遠！');

                // 抽修正
                const mod = GAME_DATA.modifiers[Math.floor(Math.random() * GAME_DATA.modifiers.length)];
                let dmg = action.atk + mod.val;
                if (mod.isDouble) dmg = action.atk * 2;
                
                // 計算護盾
                if (!action.pierce && enemy.status.includes('shield')) {
                    dmg = Math.max(0, dmg - 1);
                    this.combat.log.push(`${enemy.name} 的護盾抵擋了 1 點傷害。`);
                }

                enemy.hp -= dmg;
                this.combat.log.push(`攻擊 ${enemy.name}，抽到 ${mod.text}，造成 ${dmg} 傷害！`);
                
                // 消耗元素附加效果 (例如火元素增加傷害)
                if (this.combat.elements.fire) {
                    enemy.hp -= 1;
                    this.combat.elements.fire = false;
                    this.combat.log.push(`消耗 🔥 火元素，額外造成 1 點傷害！`);
                }

                this.combat.attackActions.shift();
                
                if (enemy.hp <= 0) {
                    this.combat.log.push(`${enemy.name} 被擊敗了！`);
                    this.player.xp += 1;
                }
                if (this.combat.enemies.every(e => e.hp <= 0)) return this.winCombat();
                
                this.render();
            },

            endPlayerTurn() {
                this.combat.selectedCards.forEach(c => {
                    this.player.discard.push(c);
                    this.player.hand = this.player.hand.filter(h => h !== c);
                });
                this.combat.selectedCards = [];
                this.state = 'MONSTER_TURN';
                this.render();
                setTimeout(() => this.runMonsterTurn(), 800);
            },

            runMonsterTurn() {
                this.combat.enemies.forEach(enemy => {
                    if (enemy.hp <= 0 || enemy.status.includes('stun')) {
                        enemy.status = enemy.status.filter(s => s !== 'stun'); // 解除暈眩
                        if(enemy.hp > 0) this.combat.log.push(`${enemy.name} 處於暈眩，跳過回合。`);
                        return;
                    }

                    // 毒發作
                    if (enemy.status.includes('poison')) {
                        enemy.hp -= 1;
                        this.combat.log.push(`${enemy.name} 受到中毒傷害 1 點。`);
                    }

                    let dist = Hex.distance(enemy.q, enemy.r, this.player.q, this.player.r);
                    if (dist > enemy.range) {
                        // 尋路
                        let minDist = dist, bestMove = null;
                        for (let d of Hex.directions) {
                            const nq = enemy.q + d[0], nr = enemy.r + d[1];
                            if (this.map.some(m => m.q === nq && m.r === nr) && 
                                !this.combat.enemies.some(e => e.q === nq && e.r === nr && e.hp > 0) &&
                                !(this.player.q === nq && this.player.r === nr)) {
                                const nd = Hex.distance(nq, nr, this.player.q, this.player.r);
                                if (nd < minDist) { minDist = nd; bestMove = {q: nq, r: nr}; }
                            }
                        }
                        if (bestMove) { enemy.q = bestMove.q; enemy.r = bestMove.r; dist = minDist; }
                    }

                    if (dist <= enemy.range) {
                        let dmg = enemy.atk;
                        // 玩家裝備減傷
                        if (this.player.inventory.some(i => i.name === '塔盾')) {
                            dmg = Math.max(0, dmg - 1);
                            this.combat.log.push(`你的塔盾抵擋了 1 點傷害。`);
                        }
                        this.player.hp -= dmg;
                        this.combat.log.push(`${enemy.name} 攻擊你，造成 ${dmg} 傷害！`);
                    }
                });

                // 玩家毒發作
                if (this.player.status.includes('poison')) {
                    this.player.hp -= 1;
                    this.combat.log.push(`你受到中毒傷害 1 點。`);
                }

                if (this.player.hp <= 0) return this.loseCombat();
                
                // 手牌耗盡
                if (this.player.hand.length < 2) {
                    this.combat.log.push(`⚠️ 短休：失去 1 生命，洗回棄牌堆。`);
                    this.player.hp -= 1;
                    this.player.discard.forEach(c => this.player.hand.push(c));
                    this.player.discard = [];
                }

                this.state = 'SELECT_CARDS';
                this.combat.log.push(`--- 新回合 ---`);
                this.render();
            },

            winCombat() {
                this.state = 'WIN';
                const s = GAME_DATA.scenarios.find(x => x.id === this.currentScenario);
                this.player.gold += s.reward.gold;
                this.player.xp += s.reward.xp;
                
                // 檢查升級
                if (this.player.xp >= 10) {
                    this.player.xp -= 10;
                    this.player.maxHp += 2;
                    this.player.hp = this.player.maxHp;
                    this.showToast('🎉 升級！生命上限增加！');
                }

                document.getElementById('map-container').innerHTML = `
                    <div style="text-align:center; color:white; padding:20px;">
                        <h2 style="color:var(--gold)">戰鬥勝利！</h2>
                        <p>獲得 ${s.reward.gold} 金幣與 ${s.reward.xp} XP。</p>
                    </div>
                `;
                
                // 切換按鈕
                document.getElementById('btn-end-turn').style.display = 'none';
                document.getElementById('btn-shop').style.display = 'block';
                document.getElementById('btn-shop').innerText = '前往下一場景';
                document.getElementById('btn-shop').onclick = () => {
                    this.currentScenario++;
                    if (this.currentScenario > GAME_DATA.scenarios.length) {
                        alert("恭喜通關全部測試劇本！");
                        location.reload();
                    } else {
                        this.state = 'TOWN';
                        this.renderScenarioIntro();
                    }
                };
                this.updateUI();
            },

            loseCombat() {
                this.state = 'TITLE';
                document.getElementById('map-container').innerHTML = `<h2 style="color:red; text-align:center; margin-top:100px;">你被擊敗了...</h2>`;
                setTimeout(() => location.reload(), 3000);
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.className = 'show';
                setTimeout(() => t.className = '', 2000);
            }
        };

        window.onload = () => Game.init();
    </script>
</body>
