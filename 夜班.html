<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜班 Night Shift ─ 互動小說</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141b24; --panel2:#1b2430; --panel3:#101720;
    --text:#d9e0e8; --muted:#8a97a8; --accent:#c0392b; --accent2:#e0b25a;
    --border:#2a3646; --ok:#3fa66b; --danger:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:radial-gradient(circle at 50% -10%, #1b2635 0%, #080b10 60%, #05070a 100%);
    color:var(--text);
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 18px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(20,27,36,.95),rgba(11,15,20,.85));
    position:sticky;top:0;z-index:50;backdrop-filter:blur(6px);
  }
  header h1{
    font-size:18px;margin:0;letter-spacing:2px;color:#e8eef6;
    display:flex;align-items:center;gap:10px;
  }
  header h1 span.badge{
    font-size:10px;letter-spacing:1px;color:#0b0f14;background:var(--accent2);
    padding:2px 6px;border-radius:4px;font-weight:700;
  }
  header .tools{display:flex;gap:8px;flex-wrap:wrap}
  button.tool{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    padding:7px 11px;border-radius:7px;font-size:13px;cursor:pointer;
    transition:.15s;font-family:inherit;
  }
  button.tool:hover{border-color:var(--accent2);color:#fff}
  button.tool:disabled{opacity:.4;cursor:not-allowed}
  main{
    display:flex;gap:16px;padding:16px;max-width:1400px;margin:0 auto;
    align-items:flex-start;
  }
  #storyPanel{
    flex:2 1 0;min-width:0;background:linear-gradient(180deg,var(--panel),var(--panel3));
    border:1px solid var(--border);border-radius:14px;padding:22px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  #sidePanel{flex:1 1 300px;min-width:280px;display:flex;flex-direction:column;gap:12px}
  @media(max-width:880px){
    main{flex-direction:column}
    #sidePanel{width:100%}
  }
  .passageNum{
    font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:10px;
    text-transform:uppercase;
  }
  .storyText p{
    margin:0 0 12px;line-height:1.85;font-size:15.5px;color:#cfd8e3;
  }
  .storyText p:last-child{margin-bottom:0}
  .choices{margin-top:20px;display:flex;flex-direction:column;gap:9px}
  .choiceBtn{
    display:block;width:100%;text-align:left;padding:13px 16px;
    background:linear-gradient(90deg,#1e2a3a,#161e28);
    border:1px solid #33425a;color:var(--text);border-radius:9px;
    cursor:pointer;font-size:15px;line-height:1.4;transition:.16s;
    font-family:inherit;position:relative;
  }
  .choiceBtn:hover:not(:disabled){
    border-color:var(--accent2);transform:translateX(3px);
    background:linear-gradient(90deg,#243347,#1a2330);
  }
  .choiceBtn:disabled{opacity:.35;cursor:not-allowed}
  .choiceBtn .req{font-size:11px;color:var(--accent2);display:block;margin-top:3px}
  .puzzleBox{
    margin-top:18px;padding:16px;background:#0d141c;border:1px dashed #3a4a60;
    border-radius:10px;
  }
  .puzzleBox .pTitle{font-size:14px;color:var(--accent2);margin-bottom:8px}
  .puzzleBox .pHint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
  .puzzleRow{display:flex;gap:8px;flex-wrap:wrap}
  .puzzleRow input{
    flex:1 1 180px;min-width:0;background:#080d12;border:1px solid #33425a;
    color:#fff;padding:11px 13px;border-radius:8px;font-size:15px;font-family:inherit;
    letter-spacing:1px;
  }
  .puzzleRow input:focus{outline:none;border-color:var(--accent2)}
  .puzzleRow button{
    background:var(--accent);color:#fff;border:none;padding:11px 20px;
    border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;font-weight:600;
  }
  .puzzleRow button:hover{background:#d64534}
  .puzzleRow button:disabled{opacity:.4;cursor:not-allowed}
  .endCard{
    margin-top:18px;padding:18px;border-radius:10px;text-align:center;
    border:1px solid var(--border);
  }
  .endCard.dead{background:rgba(192,57,43,.12);border-color:#7a2a22}
  .endCard.win{background:rgba(63,166,107,.12);border-color:#2c6b47}
  .endCard h2{margin:0 0 8px;font-size:20px}
  .endCard p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .sideCard{
    background:linear-gradient(180deg,var(--panel),var(--panel3));
    border:1px solid var(--border);border-radius:12px;padding:12px;
  }
  .sideCard h3{
    margin:0 0 10px;font-size:13px;letter-spacing:1px;color:var(--accent2);
    display:flex;align-items:center;justify-content:space-between;
  }
  .sideCard h3 .count{color:var(--muted);font-size:11px;letter-spacing:0}
  .cardRow{
    display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;
    padding:4px 2px 8px;align-items:stretch;
    scrollbar-width:thin;scrollbar-color:#33425a transparent;
  }
  .cardRow::-webkit-scrollbar{height:7px}
  .cardRow::-webkit-scrollbar-thumb{background:#33425a;border-radius:4px}
  .card{
    flex:0 0 86px;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,#1d2735,#121a24);
    border:1px solid #2e3b4d;border-radius:9px;padding:7px 5px 5px;
    transition:.15s;
  }
  .card:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .card svg{width:42px;height:42px;display:block}
  .card .label{
    margin-top:5px;background:rgba(0,0,0,.6);color:#e8eef6;font-size:10.5px;
    padding:3px 4px;border-radius:4px;text-align:center;line-height:1.25;
    width:100%;min-height:26px;display:flex;align-items:center;justify-content:center;
    word-break:break-all;
  }
  .emptyNote{font-size:12px;color:var(--muted);padding:6px 2px}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1e2a3a;border:1px solid var(--accent2);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;
    pointer-events:none;transition:.3s;z-index:200;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:18px;
  }
  .modal.hidden{display:none}
  .modalBox{
    background:#111922;border:1px solid var(--border);border-radius:14px;
    max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .modalBox h2{margin:0 0 14px;font-size:20px;color:var(--accent2)}
  .modalBox h3{margin:18px 0 8px;font-size:15px;color:#e8eef6}
  .modalBox p,.modalBox li{line-height:1.75;font-size:14px;color:#c3cdd9}
  .modalBox ul{padding-left:20px;margin:6px 0}
  .modalBox .closeRow{display:flex;justify-content:flex-end;margin-top:18px;gap:8px}
  .modalBox button{
    background:var(--accent);color:#fff;border:none;padding:9px 18px;
    border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;
  }
  .modalBox button.ghost{background:var(--panel2);border:1px solid var(--border)}
  table.mini{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
  table.mini th,table.mini td{border:1px solid var(--border);padding:6px 8px;text-align:left}
  table.mini th{background:#1b2430;color:var(--accent2)}
  .colorDot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>

<header>
  <h1>夜班 <span class="badge">NIGHT SHIFT</span></h1>
  <div class="tools">
    <button class="tool" id="btnHelp">遊戲說明</button>
    <button class="tool" id="btnBook">顏色力量</button>
    <button class="tool" id="btnSave">存檔</button>
    <button class="tool" id="btnLoad">讀檔</button>
    <button class="tool" id="btnRestart">重新開始</button>
  </div>
</header>

<main>
  <section id="storyPanel">
    <div class="passageNum" id="passageNum"></div>
    <div class="storyText" id="storyText"></div>
    <div id="choicesArea"></div>
    <div id="endArea"></div>
  </section>

  <aside id="sidePanel">
    <div class="sideCard">
      <h3>背包 <span class="count" id="invCount">0</span></h3>
      <div class="cardRow" id="invRow"></div>
      <div class="emptyNote" id="invEmpty">尚未取得任何物品。</div>
    </div>
    <div class="sideCard">
      <h3>線索 <span class="count" id="clueCount">0</span></h3>
      <div class="cardRow" id="clueRow"></div>
      <div class="emptyNote" id="clueEmpty">尚未記錄任何線索。</div>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<div class="modal hidden" id="modal">
  <div class="modalBox" id="modalBox"></div>
</div>

<script>
/* ============================================================
   夜班 ─ 單人互動小說（精簡可通關版）
   狀態機：story / dead / win / missing
   ============================================================ */

const S = {
  cur: null,
  inv: [],
  clues: [],
  flags: {},
  visited: [],
  history: [],
  mode: 'story',
  missingId: null
};

const SAVE_KEY = 'nightshift_save_v1';

/* ---------- SVG 圖示產生器 ---------- */
function svgIcon(name){
  const common = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"';
  switch(name){
    case '青金石護身符': return `<svg ${common}><polygon points="32,4 56,32 32,60 8,32" fill="#1f4fa8" stroke="#e0b25a" stroke-width="3"/><polygon points="32,16 44,32 32,48 20,32" fill="#3a7bd5"/><circle cx="32" cy="32" r="4" fill="#e0b25a"/></svg>`;
    case '黑曜石護身符': return `<svg ${common}><polygon points="32,4 56,32 32,60 8,32" fill="#111" stroke="#555" stroke-width="3"/><polygon points="32,16 44,32 32,48 20,32" fill="#222"/><circle cx="32" cy="32" r="4" fill="#666"/></svg>`;
    case '阿薩邁刀': return `<svg ${common}><rect x="30" y="26" width="6" height="26" fill="#222"/><polygon points="32,4 40,30 24,30" fill="#c9d4e0"/><rect x="22" y="30" width="20" height="4" fill="#8a6b2f"/></svg>`;
    case '白柄刀': return `<svg ${common}><rect x="30" y="26" width="6" height="26" fill="#eee"/><polygon points="32,4 40,30 24,30" fill="#c9d4e0"/><rect x="22" y="30" width="20" height="4" fill="#bbb"/></svg>`;
    case '銀聖杯': return `<svg ${common}><path d="M18 12 h28 v12 a14 14 0 0 1 -28 0z" fill="#cdd7e2" stroke="#8a97a8" stroke-width="2"/><rect x="29" y="38" width="6" height="12" fill="#aab6c4"/><rect x="20" y="50" width="24" height="5" rx="2" fill="#8a97a8"/></svg>`;
    case '金酒杯': return `<svg ${common}><path d="M18 12 h28 v12 a14 14 0 0 1 -28 0z" fill="#e0b25a" stroke="#9a7220" stroke-width="2"/><rect x="29" y="38" width="6" height="12" fill="#c99a3a"/><rect x="20" y="50" width="24" height="5" rx="2" fill="#9a7220"/></svg>`;
    case '木碗': return `<svg ${common}><path d="M8 26 h48 a24 18 0 0 1 -48 0z" fill="#8a5a2b" stroke="#5c3a18" stroke-width="2"/><ellipse cx="32" cy="26" rx="24" ry="6" fill="#a06c38"/></svg>`;
    case '錫鈴': return `<svg ${common}><path d="M32 8 a14 14 0 0 0 -14 14 v14 l-6 6 h40 l-6 -6 v-14 a14 14 0 0 0 -14 -14z" fill="#d8c27a" stroke="#9a8240" stroke-width="2"/><circle cx="32" cy="48" r="5" fill="#9a8240"/></svg>`;
    case '黃銅鑰匙21': return `<svg ${common}><circle cx="20" cy="20" r="10" fill="none" stroke="#c9a24a" stroke-width="6"/><rect x="26" y="26" width="28" height="6" fill="#c9a24a" transform="rotate(45 26 26)"/><rect x="44" y="44" width="8" height="6" fill="#c9a24a"/></svg>`;
    case '銅製坩堝': return `<svg ${common}><path d="M12 28 h40 a20 16 0 0 1 -40 0z" fill="#b06a3a" stroke="#6b3d1f" stroke-width="2"/><ellipse cx="32" cy="28" rx="20" ry="5" fill="#d08a4a"/><rect x="28" y="48" width="8" height="6" fill="#6b3d1f"/></svg>`;
    case '海綠花': return `<svg ${common}><circle cx="32" cy="32" r="6" fill="#e0b25a"/><circle cx="32" cy="14" r="7" fill="#c0392b"/><circle cx="48" cy="24" r="7" fill="#c0392b"/><circle cx="43" cy="44" r="7" fill="#c0392b"/><circle cx="21" cy="44" r="7" fill="#c0392b"/><circle cx="16" cy="24" r="7" fill="#c0392b"/></svg>`;
    case '影之書': return `<svg ${common}><rect x="12" y="8" width="40" height="48" rx="4" fill="#6b1f1f" stroke="#3a0f0f" stroke-width="2"/><rect x="20" y="14" width="24" height="4" fill="#e0b25a"/><rect x="20" y="24" width="24" height="3" fill="#a06c38"/><rect x="20" y="32" width="18" height="3" fill="#a06c38"/></svg>`;
    case '月長石戒指': return `<svg ${common}><circle cx="32" cy="38" r="16" fill="none" stroke="#cdd7e2" stroke-width="5"/><circle cx="32" cy="20" r="9" fill="#bcd4e6" stroke="#8aa8c0" stroke-width="2"/></svg>`;
    case '蛇皮手鐲': return `<svg ${common}><path d="M12 36 q10 -16 20 0 q10 16 20 0" fill="none" stroke="#4a8a5a" stroke-width="6"/><circle cx="50" cy="36" r="4" fill="#2e5c3a"/></svg>`;
    case '蠟燭': return `<svg ${common}><rect x="24" y="20" width="16" height="34" rx="3" fill="#eee8d8"/><path d="M32 6 q6 8 0 14 q-6 -6 0 -14z" fill="#e0b25a"/></svg>`;
    case '烏頭粉末': return `<svg ${common}><path d="M14 24 h36 v26 a4 4 0 0 1 -4 4 h-28 a4 4 0 0 1 -4 -4z" fill="#d8d0bc" stroke="#8a8068" stroke-width="2"/><path d="M14 24 l18 -12 l18 12z" fill="#b8ae98"/><circle cx="32" cy="40" r="6" fill="#7a5aa0"/></svg>`;
    case '聽診器': return `<svg ${common}><path d="M18 8 v16 a14 14 0 0 0 28 0 v-16" fill="none" stroke="#8a97a8" stroke-width="4"/><circle cx="32" cy="46" r="8" fill="none" stroke="#cdd7e2" stroke-width="4"/></svg>`;
    case '手術刀': return `<svg ${common}><rect x="30" y="24" width="5" height="30" fill="#888"/><polygon points="32,4 38,26 27,26" fill="#dfe7ef"/></svg>`;
    case '銀項鍊玉墜': return `<svg ${common}><path d="M14 12 q18 20 36 0" fill="none" stroke="#cdd7e2" stroke-width="3"/><ellipse cx="32" cy="36" rx="10" ry="13" fill="#4a8a5a" stroke="#2e5c3a" stroke-width="2"/></svg>`;
    case '海鸚喙': return `<svg ${common}><path d="M8 32 q20 -18 48 -8 q-8 18 -32 18 q-12 0 -16 -10z" fill="#e07030" stroke="#a04a18" stroke-width="2"/><path d="M40 28 q8 2 12 6" stroke="#222" stroke-width="2" fill="none"/></svg>`;
    case '風鈴草': return `<svg ${common}><path d="M32 8 v20" stroke="#4a8a5a" stroke-width="4"/><path d="M22 28 q10 24 20 0z" fill="#6a8ad0" stroke="#3a5a9a" stroke-width="2"/><circle cx="32" cy="52" r="4" fill="#6a8ad0"/></svg>`;
    case '顏色力量': return `<svg ${common}><circle cx="20" cy="20" r="10" fill="#c0392b"/><circle cx="44" cy="20" r="10" fill="#e0b25a"/><circle cx="20" cy="44" r="10" fill="#3a7bd5"/><circle cx="44" cy="44" r="10" fill="#3fa66b"/></svg>`;
    default: return `<svg ${common}><circle cx="32" cy="32" r="22" fill="#1e2a3a" stroke="#e0b25a" stroke-width="3"/><text x="32" y="40" text-anchor="middle" font-size="22" fill="#e0b25a">?</text></svg>`;
  }
}

/* ---------- 段落資料 ---------- */
/* text: 段落文字（陣列）
   choices: [{label, to, cond?, reqText?}]
   puzzle: {prompt, hint, answer:[...], success, fail}
   onEnter: {addItem:[], addClue:[], flag:{}}
   dead: true / win: true
*/
const P = {};

P["1"] = {
  text: [
    "你猛地驚醒，起初被黑暗弄得暈頭轉向。你在哪兒？心跳得飛快，你漫無目的地摸索著，試圖弄清自己的位置。你正躺在幾張實用卻略帶黏膩的人造皮革椅子上。",
    "手術室的這個夜班格外忙碌。你一到崗就投入緊急主動脈瘤手術，病人還是死在了手術台上。隨後又是緊急神經科病例——血栓被成功取出，但腦損傷程度未知。那時是凌晨 3:30。你和南希拖著疲憊的腳步來到休息室，南希打開網飛，你去補眠。",
    "你察覺到周圍的寂靜。走廊一片漆黑——醫院的燈從來不會關。接著，你聽到了聲音：一陣緩慢而沉重的「滴答——滴答」聲。",
    "你走向門口，開門的瞬間便意識到情況絕對不對勁。你看到黑暗中閃爍著一點微光，是螢幕照亮了眼前的景象。你倒吸一口涼氣——南希側身癱在地上，喉嚨被從左耳到右耳劃開一道大口子，身上布滿刺傷。帶血的腳印從屍體旁延伸到走廊。",
    "他還在這裡，兇手還沒走。你脫下木屐，光著腳幾乎無聲地穿過小走廊，溜進手術室主通道，朝著走廊盡頭那扇鎖著的門跑去——那扇門連接手術室和 ICU。你躲進壁龕，胃裡一陣翻江倒海。現在，你只需要輸入密碼打開這扇門。",
    "就在這時，你聽到了一聲清晰的咳嗽，接著是開門聲。沉重的腳步聲傳來，從容不迫……而且正朝著你這邊走來。你只有一次機會。"
  ],
  puzzle: {
    prompt: "鍵盤鎖：密碼是「前 4 個質數」組成的四位數。",
    hint: "質數是只能被 1 和自己整除的數。從 2 開始：2、3、5、7……",
    answer: ["2357"],
    success: "230",
    fail: "97"
  }
};

P["97"] = {
  text: [
    "你用力下拉門把手，拼命拉門，但門被鎖得死死的。他的影子籠罩在你身上，你轉過身，尖叫起來。",
    "你舉起雙手防禦，但他太強壯了，刀也太鋒利了。幸運的是，黑暗很快吞噬了你，你的痛苦很快就結束了。"
  ],
  dead: true,
  deadTitle: "你輸入錯了密碼。"
};

P["230"] = {
  text: [
    "你用力拉開門，從縫隙裡滑進去，急切地轉身想關門。他的影子越來越近，門慢慢關上——太慢了，太慢了。你感覺喉嚨裡像有什麼東西要炸開，在心裡吶喊：快點！",
    "終於，門「咔嗒」一聲關上了，就在這時，門把手傳來「咔嗒咔嗒」的搖晃聲。你的心臟停跳了一秒，隨後聽到一聲咒罵和拳頭砸在門上的聲音。你沿著牆滑坐在地上，雙腿發軟。",
    "你慢慢恢復呼吸，然後環顧四周。你在一個熟悉的走廊裡，但這裡卻變得陌生——夜晚微弱的光線也無法掩蓋它的破敗和廢棄。牆上滿是霉斑和霉點，油漆剝落。你扶著牆站起來，卻立刻縮回手——一隻蜘蛛從手上爬了過去。",
    "你背靠著剛剛逃進來的門，左手邊的走廊通向重症監護室，直走則通向醫院主通道。"
  ],
  choices: [
    { label: "左轉，走向重症監護室（ICU）", to: "127" },
    { label: "直走，前往醫院主通道", to: "276" }
  ]

/* ---------- 遊戲邏輯 ---------- */

const $ = id => document.getElementById(id);

function normalize(str){
  return String(str).toUpperCase().replace(/[^A-Z0-9]/g,'');
}

function hasItem(name){ return S.inv.includes(name); }
function hasClue(name){ return S.clues.includes(name); }

function condOk(cond){
  if(!cond) return true;
  if(cond.item && !hasItem(cond.item)) return false;
  if(cond.noItem && hasItem(cond.noItem)) return false;
  if(cond.clue && !hasClue(cond.clue)) return false;
  if(cond.flag && !S.flags[cond.flag]) return false;
  if(cond.noFlag && S.flags[cond.noFlag]) return false;
  return true;
}

function reqText(cond){
  if(!cond) return '';
  if(cond.item) return '需要：' + cond.item;
  if(cond.noItem) return '需要：沒有' + cond.noItem;
  if(cond.clue) return '需要線索：' + cond.clue;
  if(cond.flag) return '需要狀態：' + cond.flag;
  return '';
}

function applyOnEnter(p){
  if(!p || !p.onEnter) return;
  const e = p.onEnter;
  if(e.addItem){
    e.addItem.forEach(it=>{
      if(!S.inv.includes(it)){ S.inv.push(it); toast('獲得物品：' + it); }
    });
  }
  if(e.addClue){
    e.addClue.forEach(c=>{
      if(!S.clues.includes(c)){ S.clues.push(c); toast('記錄線索：' + c); }
    });
  }
  if(e.flag){
    Object.keys(e.flag).forEach(k=>{ S.flags[k] = e.flag[k]; });
  }
}

function goTo(id){
  id = String(id);
  if(!P[id]){
    S.missingId = id;
    S.mode = 'missing';
    render();
    return;
  }
  S.history.push(S.cur);
  if(S.history.length > 200) S.history.shift();
  S.cur = id;
  if(!S.visited.includes(id)) S.visited.push(id);
  const p = P[id];
  applyOnEnter(p);
  if(p.dead) S.mode = 'dead';
  else if(p.win) S.mode = 'win';
  else S.mode = 'story';
  render();
  autoSave();
}

function restart(){
  S.cur = '1';
  S.inv = [];
  S.clues = [];
  S.flags = {};
  S.visited = ['1'];
  S.history = [];
  S.mode = 'story';
  applyOnEnter(P['1']);
  render();
  autoSave();
}

function render(){
  const p = S.cur ? P[S.cur] : null;
  $('passageNum').textContent = S.cur ? ('段落 ' + S.cur) : '';
  const storyEl = $('storyText');
  const choicesEl = $('choicesArea');
  const endEl = $('endArea');
  storyEl.innerHTML = '';
  choicesEl.innerHTML = '';
  endEl.innerHTML = '';

  renderSide();

  if(S.mode === 'missing'){
    storyEl.innerHTML = `<p>此分支（第 ${S.missingId} 段）在精簡版中未收錄。</p>
      <p style="color:#8a97a8;font-size:13px">你可以返回上一段繼續冒險。</p>`;
    const btn = document.createElement('button');
    btn.className = 'choiceBtn';
    btn.textContent = '返回上一段';
    btn.onclick = () => {
      const prev = S.history.pop();
      if(prev){ S.cur = prev; S.mode = P[prev].dead ? 'dead' : (P[prev].win ? 'win' : 'story'); render(); }
      else restart();
    };
    choicesEl.appendChild(btn);
    return;
  }

  if(!p) return;

  // 文字
  (p.text || []).forEach(t=>{
    const el = document.createElement('p');
    el.textContent = t;
    storyEl.appendChild(el);
  });

  // 死亡 / 勝利
  if(p.dead){
    const card = document.createElement('div');
    card.className = 'endCard dead';
    card.innerHTML = `<h2>☠ 你死了</h2><p>${p.deadTitle || '你的夜班到此結束。'}</p>`;
    const btn = document.createElement('button');
    btn.className = 'choiceBtn';
    btn.textContent = '從頭開始';
    btn.onclick = restart;
    card.appendChild(btn);
    endEl.appendChild(card);
    return;
  }
  if(p.win){
    const card = document.createElement('div');
    card.className = 'endCard win';
    card.innerHTML = `<h2>✔ 你逃出生天</h2><p>${p.winTitle || '你活了下來。'}</p>`;
    const btn = document.createElement('button');
    btn.className = 'choiceBtn';
    btn.textContent = '再玩一次';
    btn.onclick = restart;
    card.appendChild(btn);
    endEl.appendChild(card);
    return;
  }

  // 謎題
  if(p.puzzle){
    const box = document.createElement('div');
    box.className = 'puzzleBox';
    const title = document.createElement('div');
    title.className = 'pTitle';
    title.textContent = p.puzzle.prompt;
    box.appendChild(title);

    const row = document.createElement('div');
    row.className = 'puzzleRow';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = '輸入答案…';
    input.autocomplete = 'off';
    const submit = document.createElement('button');
    submit.textContent = '確認';
    submit.disabled = true;
    input.addEventListener('input', ()=>{ submit.disabled = input.value.trim().length === 0; });
    input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' && !submit.disabled) submit.click(); });
    submit.onclick = ()=>{
      const val = normalize(input.value);
      const ok = (p.puzzle.answer || []).some(a => normalize(a) === val);
      if(ok) goTo(p.puzzle.success);
      else goTo(p.puzzle.fail);
    };
    row.appendChild(input);
    row.appendChild(submit);
    box.appendChild(row);

    if(p.puzzle.hint){
      const hint = document.createElement('div');
      hint.className = 'pHint';
      hint.textContent = '提示：' + p.puzzle.hint;
      box.appendChild(hint);
    }
    choicesEl.appendChild(box);
    setTimeout(()=>input.focus(), 50);
    return;
  }

  // 選項
  if(p.choices && p.choices.length){
    const list = p.choices.filter(c => condOk(c.cond));
    if(list.length === 0){
      const btn = document.createElement('button');
      btn.className = 'choiceBtn';
      btn.textContent = '返回上一段';
      btn.onclick = ()=>{
        const prev = S.history.pop();
        if(prev){ S.cur = prev; S.mode = P[prev].dead ? 'dead' : (P[prev].win ? 'win' : 'story'); render(); }
      };
      choicesEl.appendChild(btn);
      return;
    }
    list.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'choiceBtn';
      btn.textContent = c.label;
      const req = reqText(c.cond);
      if(req){
        const span = document.createElement('span');
        span.className = 'req';
        span.textContent = req;
        btn.appendChild(span);
      }
      btn.onclick = ()=> goTo(c.to);
      choicesEl.appendChild(btn);
    });
  }
}

function renderSide(){
  // 背包
  const invRow = $('invRow');
  invRow.innerHTML = '';
  $('invCount').textContent = S.inv.length;
  $('invEmpty').style.display = S.inv.length ? 'none' : 'block';
  S.inv.forEach(name=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = svgIcon(name) + `<div class="label">${name}</div>`;
    card.title = name;
    invRow.appendChild(card);
  });
  // 線索
  const clueRow = $('clueRow');
  clueRow.innerHTML = '';
  $('clueCount').textContent = S.clues.length;
  $('clueEmpty').style.display = S.clues.length ? 'none' : 'block';
  S.clues.forEach(name=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = svgIcon('顏色力量') + `<div class="label">${name}</div>`;
    card.title = name;
    clueRow.appendChild(card);
  });
}

/* ---------- 存讀檔 ---------- */
function autoSave(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function saveGame(){
  autoSave();
  toast('已存檔');
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ toast('沒有找到存檔'); return; }
    const data = JSON.parse(raw);
    Object.assign(S, data);
    if(!S.cur) S.cur = '1';
    const p = P[S.cur];
    S.mode = p ? (p.dead ? 'dead' : (p.win ? 'win' : 'story')) : 'story';
    render();
    toast('已讀取存檔');
  }catch(e){ toast('讀檔失敗'); }
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ---------- 初始化 ---------- */
(function init(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){
    try{
      const data = JSON.parse(raw);
      if(data && data.cur && P[data.cur]){
        Object.assign(S, data);
        const p = P[S.cur];
        S.mode = p.dead ? 'dead' : (p.win ? 'win' : 'story');
        render();
        toast('已載入上次進度');
        return;
      }
    }catch(e){}
  }
  restart();
})();
</script>
