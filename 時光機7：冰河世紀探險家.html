<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時光機7：冰河世紀探險家</title>
    <style>
        :root {
            --bg-color: #1a1e24;
            --panel-bg: #2a2f38;
            --text-color: #e0e0e0;
            --accent-color: #4a90e2;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --label-bg: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 頂部導航 */
        header {
            background-color: #111;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .header-btns button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid #555;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 10px;
            transition: 0.2s;
        }

        .header-btns button:hover {
            background: #333;
            border-color: var(--accent-color);
        }

        /* 主遊戲區 */
        main {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* 圖片與文字區 */
        .game-area {
            flex: 3;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .image-container {
            flex: 1;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            overflow: hidden;
        }

        .image-container svg {
            width: 100%;
            height: 100%;
            max-height: 400px;
        }

        .image-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--label-bg);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #444;
            white-space: nowrap;
        }

        .text-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 1.1rem;
            line-height: 1.6;
            border-top: 2px solid #333;
        }

        /* 選項區 */
        .choices-container {
            padding: 15px 20px;
            background-color: #1e2229;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            padding: 12px 20px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .choice-btn:hover:not(:disabled) {
            background-color: var(--accent-color);
            border-color: #fff;
            transform: translateX(5px);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .choice-btn.hint {
            border-color: var(--success-color);
        }

        /* 側邊進度面板 */
        .sidebar {
            flex: 1;
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            min-width: 250px;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .discoveries-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .discoveries-list li {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            border-left: 3px solid var(--accent-color);
        }

        /* 彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-content h2 {
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .modal-content p {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        /* 橫向捲動安全區 */
        .scroll-x {
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 10px;
            padding-bottom: 5px;
        }

        @media (max-width: 768px) {
            main {
                flex-direction: column;
                padding: 10px;
            }
            .sidebar {
                flex: none;
                max-height: 200px;
            }
        }
    </style>
</head>

            <p><strong>目標：</strong>解開壁畫之謎，並盡可能收集所有動物與時代的圖鑑。遊戲只有一個真正的結局。</p>
            <button class="close-btn" onclick="closeModal('help-modal')">開始探險</button>

            sloth: `<svg viewBox="0 0 400 200"><rect width="400" height="200" fill="#4caf50"/><circle cx="200" cy="100" r="40" fill="#8d6e63"/><text x="200" y="180" fill="#fff" text-anchor="middle" font-size="14">🦥 大地懶</text></svg>`,
            kangaroo: `<svg viewBox="0 0 400 200"><rect width="400" height="200" fill="#ffb74d"/><path d="M 150 150 Q 180 80 220 100 L 240 150 Z" fill="#795548"/><text x="200" y="180" fill="#fff" text-anchor="middle" font-size="14">🦘 巨型袋鼠</text></svg>`,
            mask: `<svg viewBox="0 0 400 200"><rect width="400" height="200" fill="#ffcc80"/><circle cx="200" cy="100" r="40" fill="#fff"/><circle cx="185" cy="90" r="5" fill="#000"/><circle cx="215" cy="90" r="5" fill="#000"/><text x="200" y="180" fill="#fff" text-anchor="middle" font-size="14">🎭 薩滿面具</text></svg>`,
            end: `<svg viewBox="0 0 400 200"><rect width="400" height="200" fill="#1a1e24"/><text x="200" y="110" fill="#2ecc71" text-anchor="middle" font-size="24" font-weight="bold">MISSION COMPLETED</text></svg>`
        };

        // --- DOM 元素 ---
        const textContainer = document.getElementById('text-container');
        const choicesContainer = document.getElementById('choices-container');
        const imageContainer = document.getElementById('image-container');
        const imageLabel = document.getElementById('image-label');
        const discoveriesList = document.getElementById('discoveries-list');

        // --- 遊戲邏輯 ---
        function renderState(stateId) {
            const state = gameData[stateId];
            if (!state) return;

            currentState = stateId;

            // 更新文字
            textContainer.innerHTML = `<h3>${state.title}</h3><p>${state.text}</p>`;

            // 更新圖片 (使用 SVG)
            if (svgGen[state.image]) {
                // 保留 label
                const labelText = state.image === 'mask' ? '薩滿儀式' : state.title;
                imageContainer.innerHTML = svgGen[state.image] + `<div class="image-label">${labelText}</div>`;
            } else {
                imageContainer.innerHTML = `<div class="image-label">暫無圖像</div>`;
            }

            // 更新發現
            if (state.discoveries) {
                state.discoveries.forEach(d => {
                    if (!discoveries.includes(d)) {
                        discoveries.push(d);
                    }
                });
                updateDiscoveriesUI();
            }

            // 更新選項
            choicesContainer.innerHTML = '';
            if (state.isEnd) {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = '重新開始遊戲';
                btn.onclick = () => { resetGame(); };
                choicesContainer.appendChild(btn);
                return;
            }

            if (state.choices && state.choices.length > 0) {
                state.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    if (choice.isDanger) btn.classList.add('danger');
                    btn.innerHTML = `<span>${choice.text}</span>`;
                    btn.onclick = () => {
                        if (choice.next) {
                            renderState(choice.next);
                        }
                    };
                    choicesContainer.appendChild(btn);
                });
            }
        }

        function updateDiscoveriesUI() {
            discoveriesList.innerHTML = '';
            if (discoveries.length === 0) {
                discoveriesList.innerHTML = '<li>尚未發現任何線索</li>';
                return;
            }
            discoveries.forEach(d => {
                const li = document.createElement('li');
                li.textContent = `✅ ${d}`;
                discoveriesList.appendChild(li);
            });
        }

        // --- 存讀檔功能 ---
        function saveGame() {
            const saveData = {
                state: currentState,
                discoveries: discoveries
            };
            localStorage.setItem('iceAgeExplorerSave', JSON.stringify(saveData));
            alert('遊戲已儲存！');
        }

        function loadGame() {
            const saveData = localStorage.getItem('iceAgeExplorerSave');
            if (saveData) {
                const data = JSON.parse(saveData);
                currentState = data.state;
                discoveries = data.discoveries;
                updateDiscoveriesUI();
                renderState(currentState);
                alert('遊戲已載入！');
            } else {
                alert('沒有找到存檔！');
            }
        }

        function resetGame() {
            if (confirm('確定要重新開始嗎？目前進度將不會保留。')) {
                currentState = 'start';
                discoveries = [];
                updateDiscoveriesUI();
                renderState('start');
            }
        }

        // --- 初始化 ---
        function init() {
            renderState('start');
            
            document.getElementById('btn-save').onclick = saveGame;
            document.getElementById('btn-load').onclick = loadGame;
            document.getElementById('btn-restart').onclick = resetGame;
            
            document.getElementById('btn-help').onclick = () => {
                document.getElementById('help-modal').classList.add('active');
            };
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // 啟動遊戲
        window.onload = init;

    </script>
</body>
</html>
