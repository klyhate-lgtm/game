<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>詭鎮奇談：金斯波特蛻變記</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#e8dcc3;--ink-dim:#b6a888;--gold:#c9a227;--blood:#8b1e1e;--panel:#1b1611;--line:#4a3c2a;--ok:#6aa84f;--bad:#a83232}
html,body{height:100%}
body{background:#0d0a07;font-family:"Songti SC","Noto Serif TC","Times New Roman",serif;color:var(--ink);overflow:hidden}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:60;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:.06;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#start{align-items:center;justify-content:flex-start;overflow-y:auto;padding:18px 14px 110px;background:radial-gradient(circle at 50% 0%,#241a12 0%,#0d0a07 70%)}
#start h1{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:.16em;color:var(--gold);text-shadow:0 0 22px rgba(201,162,39,.45);margin:16px 0 4px;text-align:center}
#start .sub{color:var(--ink-dim);letter-spacing:.4em;font-size:.72rem;margin-bottom:14px}
#start .book{width:min(640px,100%);border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#1d1710,#14100b);padding:16px;margin-bottom:16px;box-shadow:0 8px 40px rgba(0,0,0,.7)}
#start .book p{font-size:.9rem;line-height:1.85;color:var(--ink-dim);margin-bottom:.6em}
#start .book p b{color:var(--gold)}
.inv-wrap{width:min(900px,100%)}
.inv-grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:stretch}
.inv-card{flex:0 0 232px;background:linear-gradient(170deg,#241d16,#171210);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.inv-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.inv-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.35),0 0 26px rgba(201,162,39,.22)}
.inv-card .nm{font-size:1.12rem;color:var(--gold);letter-spacing:.06em}
.inv-card .rl{font-size:.7rem;color:var(--ink-dim);letter-spacing:.3em;margin:2px 0 10px}
.stat-row{display:flex;justify-content:space-between;font-size:.78rem;padding:2px 0;border-bottom:1px dotted #3a2f22}
.stat-row span:last-child{color:var(--gold)}
.inv-card .ab{font-size:.7rem;color:#9fb98a;margin-top:8px;line-height:1.6}
.inv-card .wk{font-size:.7rem;color:#c98a8a;line-height:1.6}
#game{background:#0d0a07}
#topbar{flex:0 0 auto;background:linear-gradient(180deg,#201a12,#15100b);border-bottom:1px solid var(--line);padding:8px 10px;z-index:20}
#topbar .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#invName{font-size:.86rem;color:var(--gold);letter-spacing:.08em;white-space:nowrap}
.badge{font-size:.66rem;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim)}
.stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:.7rem;padding:3px 8px;border-radius:8px;background:#241d16;border:1px solid var(--line);white-space:nowrap}
.pill b{color:var(--gold);font-size:.78rem}
.pill.hp b{color:#d97a7a}.pill.san b{color:#7aa9d9}.pill.clue b{color:#8fd97a}.pill.res b{color:#d9c07a}.pill.doom b{color:#d96b6b}
#main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#scene{width:100%;height:clamp(130px,26vh,230px);position:relative;overflow:hidden;background:#0b0805}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,7,.15),rgba(13,10,7,.96))}
#content{padding:14px 16px 220px;max-width:820px;margin:0 auto;animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#chapNo{font-size:.68rem;letter-spacing:.3em;color:#8a7b5e;margin-bottom:8px}
#text{font-size:.98rem;line-height:2.05;letter-spacing:.02em;white-space:pre-wrap;text-shadow:0 1px 2px #000}
.cursor{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#fxline{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.fx{font-size:.74rem;padding:3px 9px;border-radius:7px;background:#2a2118;border:1px solid #4a3c2a;animation:pop .4s}
.fx.good{color:#9fe08a;border-color:#4e6b3a}.fx.bad{color:#f09a9a;border-color:#6b3a3a}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#choices{position:fixed;left:0;right:0;bottom:56px;z-index:25;background:linear-gradient(180deg,rgba(13,10,7,0),rgba(13,10,7,.97) 26%);padding:22px 12px 10px;max-height:56vh;overflow-y:auto}
#choices .inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.chbtn{width:100%;text-align:left;padding:12px 15px;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,#2a2219,#1d1710);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:.9rem;line-height:1.55;transition:.15s;position:relative}
.chbtn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#352a1e,#241d16);transform:translateX(3px)}
.chbtn:active:not(:disabled){transform:scale(.985)}
.chbtn:disabled{opacity:.42;cursor:not-allowed}
.chbtn .req{display:block;font-size:.68rem;color:#c98a8a;margin-top:3px}
#nav{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:40;display:flex;background:#15100b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:.66rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.15s}
#nav button i{font-style:normal;font-size:1.05rem;filter:grayscale(.4)}
#nav button:hover,#nav button:active{color:var(--gold);background:#1d1710}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(5,3,2,.86);padding:14px;backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fadein .25s}
.mbox{width:min(680px,100%);max-height:86vh;overflow-y:auto;background:linear-gradient(175deg,#241d16,#15100b);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.9)}
.mbox h2{color:var(--gold);font-size:1.15rem;letter-spacing:.12em;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.mbox h3{color:var(--gold);font-size:.92rem;margin:16px 0 6px}
.mbox p,.mbox li{font-size:.86rem;line-height:1.9;color:var(--ink-dim)}
.mbox li{margin-left:1.2em;margin-bottom:4px}
.mbox b{color:var(--ink)}
.mbox .em{color:var(--gold)}
.mbox .btn{display:block;width:100%;margin-top:18px;padding:13px;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,#7a5d16,#5a4210);border:1px solid var(--gold);color:#fff5d6;font-family:inherit;font-size:.95rem;letter-spacing:.14em;transition:.15s}
.mbox .btn:hover{filter:brightness(1.18)}
.mbox .btn.ghost{background:#241d16;border-color:var(--line);color:var(--ink-dim);letter-spacing:.08em;font-size:.84rem}
.sec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:8px}
.sec-item{font-size:.72rem;padding:5px 8px;border-radius:7px;background:#1a1410;border:1px solid #332a1f;color:#5d5240}
.sec-item.got{color:#9fe08a;border-color:#4e6b3a;background:#1b2416}
.hist-item{font-size:.78rem;padding:7px 10px;border-left:2px solid var(--gold);background:#1a1410;margin-bottom:6px;border-radius:0 8px 8px 0;color:var(--ink-dim);line-height:1.6}
.hist-item b{color:var(--gold)}
.drow{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.die{width:62px;height:62px;border-radius:13px;background:linear-gradient(160deg,#f3e8cf,#cbb98f);color:#241d16;font-size:1.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.6)}
.die.rolling{animation:roll .5s linear}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
.die.dim{opacity:.28}
.die.small{width:46px;height:46px;font-size:1.4rem}
.totalline{text-align:center;font-size:.95rem;color:var(--gold);letter-spacing:.08em;margin:8px 0;line-height:1.6}
.res-ok{color:#9fe08a}.res-bad{color:#f09a9a}
.tlog{font-size:.74rem;color:#9a8b6e;margin-top:6px;line-height:1.6}
#toasts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(30,22,15,.97);border:1px solid var(--gold);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.8);animation:tin .3s ease;line-height:1.5;text-align:center}
.toast.bad{border-color:#8b3a3a;color:#f0b0b0}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:520px){#content{padding:12px 13px 210px}#text{font-size:.93rem;line-height:1.95}.inv-card{flex:0 0 208px}}
</style>
</head>
<body>
<div id="grain"></div><div id="vignette"></div>

<div id="start" class="screen on">
  <h1>金斯波特蛻變記</h1>
  <div class="sub">THE KINGSPORT METAMORPHOSIS</div>
  <div class="book">
    <p>秋分之夜，一封來自陌生人 <b>伊萊賈·哈考特</b> 的信將你引向迷霧籠罩的哈考特莊園。</p>
    <p>蜘蛛在牆後爬行，夢境與現實的界線正在溶解。今晚七點整，你必須做出選擇——而你的每一個選擇，都將決定金斯波特、乃至整個世界的命運。</p>
    <p style="color:var(--gold);letter-spacing:.1em;font-size:.82rem">請先選擇一位調查員：</p>
  </div>
  <div class="inv-wrap"><div class="inv-grid" id="invGrid"></div></div>
  <button class="mbox btn" id="btnBegin" style="width:min(640px,100%);margin-top:6px" disabled>選擇調查員後開始遊戲</button>
</div>

<div id="game" class="screen">
  <div id="topbar">
    <div class="row1"><span id="invName">—</span><span class="badge" id="invRole">—</span><span class="badge" id="chapBadge">第 1 章</span></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="main"><div id="scene"></div><div id="content"><div id="chapNo">第 1 章</div><div id="text"></div><div id="fxline"></div></div></div>
  <div id="choices"><div class="inner" id="choicesInner"></div></div>
  <div id="nav">
    <button id="navHelp"><i>❔</i>說明</button>
    <button id="navSave"><i>💾</i>存檔</button>
    <button id="navLoad"><i>📂</i>讀檔</button>
    <button id="navHist"><i>📜</i>紀錄</button>
    <button id="navAch"><i>🏆</i>成就</button>
    <button id="navSound"><i>🔊</i>音效</button>
  </div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
/* ============================================================
   能力 / 弱點 加成定義（依原書各測試加成）
   ============================================================ */
const ABILITY_BONUS = {
  // 意志力相關
  wp:{plus:['神秘','堅定','勤學','秘儀','專注'],minus:['恐蛛症','夢魘纏身','謹慎','偏執']},
  // 智力相關
  int:{plus:['探索者','偵探','學者','勤學','機智'],minus:['謹慎','夢魘纏身','偏執']},
  // 戰鬥相關
  com:{plus:['戰士','敏捷','倖存者','堅定','盜賊','堅韌','守護者'],minus:['謹慎','恐蛛症']},
  // 特殊通用
  general:{plus:['堅定','守護者'],minus:['謹慎','夢魘纏身']}
};
/* 各章節測試的加成清單已直接寫在章節資料中（plus/minus） */

/* ============================================================
   調查員
   ============================================================ */
const INV = {
  jacqueline:{name:'傑奎琳·法恩',role:'靈媒',wp:5,int:3,com:2,hp:6,san:9,item:'夢境日記',ability:'千里眼',weakness:'黑暗未來',
    otherAb:['神秘','敏捷'],otherWk:['夢魘纏身','偏執'],
    prologue:'金斯波特的迷霧對你而言早已不陌生。自兒時起，你便能感受到那股令人窒息的壓抑感縈繞心頭，迷霧中還夾雜著來自無名之地的低語。\n\n有人或許會說你浮躁又異想天開，但你清楚自己聽到的真相——那些飄越夢境邊界的呢喃，那些尚未發生的未來碎片。\n\n當你的超自然感知牽引著你，手握一封詭異的信件走向被迷霧籠罩的金斯波特街道時，你知道自己別無選擇，只能循著指引前行。',
    abilityDesc:'進行智力測試時，可擲 2 顆骰子並選取任意 1 顆的點數作為結果。',
    weaknessDesc:'若測試中擲出兩個相同的點數，厄運值 +1，且本次測試判定為失敗。',
    itemDesc:'每輪冒險開始時，獲得 +1 線索、+1 資源。'},
  lucius:{name:'盧修斯·加洛韋',role:'追夢人',wp:2,int:4,com:1,hp:8,san:6,item:'詩集',ability:'詩人',weakness:'洪水之夢',
    otherAb:['探索者','學者','古語言'],otherWk:['夢魘纏身'],
    prologue:'文字於你向來信手拈來，睡眠卻並非如此——自伴侶魯迪失蹤後，安穩的睡眠便與你無緣。即便偶爾入眠，夜夜都會被同一個朦朧的水下城市幻象糾纏。\n\n出版商稱你為幻想家，批評家則罵你是瘋子，你也早已分不清哪種評價更接近真相。\n\n如今，你揣著夾在外套口袋裡的神秘信件，行走在金斯波特的小巷中。倘若你夢境的真相就藏在這裡，無論等待你的是凱旋還是毀滅，你都會直面它。',
    abilityDesc:'若消耗線索完成測試且測試成功，可獲得 +1 線索。',
    weaknessDesc:'每次獲得線索時，擲 1 顆骰子。若擲出的點數低於你當前的線索數，則無法獲得該線索。',
    itemDesc:'進行智力測試時，可將資源當作線索消耗。'},
  lola:{name:'洛拉·海耶斯',role:'演員',wp:3,int:3,com:3,hp:6,san:6,item:'名片',ability:'隨機應變',weakness:'身份危機',
    otherAb:['守護者','機智'],otherWk:['鬧鬼','被詛咒','謹慎'],
    prologue:'作為一名技藝精湛的演員，你可以化身成任何人——孝順的女兒、悲情的戀人、被背叛的女王。角色不斷變換，你臉上的面具卻從未卸下。\n\n你第一次聽到金斯波特這個名字，並非來自劇本，而是舞台上一名演員的無心低語。\n\n所以，當一封來自伊萊賈·哈考特的信件寄來，邀請你前往他在金斯波特的宅邸時，你決定暫且放下表演。',
    abilityDesc:'每輪冒險中，可將任意一項技能 +1，同時需將另一項技能 -1；首次使用後，每多使用 1 次需消耗 +1 資源。',
    weaknessDesc:'每次消耗資源時，擲 1 顆骰子。若擲出 1 點，理智值 -1。',
    itemDesc:'每輪冒險中，可選擇 1 個章節中提及的、自身未擁有的能力獲得，該能力持續至本輪冒險結束。'}
};

/* ============================================================
   章節資料（完整 300 章）
   s=場景 t=文本 f=效果 c=選項
   ============================================================ */
const D={};

/* ---------- 1-10 ---------- */
D[1]={s:'mist',t:'金斯波特鎮坐落於密斯卡托尼克河入海口，河水在此匯入大西洋，小鎮被環繞海灣的秀美懸崖簇擁，而金斯波特海岬是其中最壯觀的一處——這片巨大的岩石半島由一條長長的堤道與大陸相連。這些懸崖，還有南岸的海濱勝地、金斯波特溶洞，吸引著新英格蘭各地的遊客。但你來到這裡，並非為了欣賞風景。\n\n金斯波特還有一樣聞名的東西，那就是迷霧。崇尚邏輯與科學的人聲稱，懸崖形成了一種地質構造——一個巨大的天然窪地，困住了形成低空雲層所需的濕潤空氣。而想像力豐富的人，則認為這些迷霧有著不可思議的異界起源。但有一個事實無可辯駁：這些緩緩盤旋的海霧，總在小鎮的街道上久久不散，當地還流傳著許多與迷霧相關的傳說。但這一次，將你引向這裡的，既不是迷霧，也不是這些傳說。\n\n你從口袋裡掏出那封信，反覆讀了無數遍。信件是親筆寫給你的，字跡潦草而扭曲：\n\n「願你收到此信時身心康健，因為我要告知你的事，需要你擁有健全的心智和體魄。\n儘管我們素未謀面——我想，你也從未聽過我的名字——但我一直密切關注著你的經歷，冥冥之中，我感覺我們的命運終將交匯。\n種種離奇而緊急的狀況，迫使我懇請你前來哈考特莊園，它坐落於金斯波特南岸的懸崖之上。希望你能在秋分之日的晚上七點整抵達。\n我年近花甲，歲月雖在我身上留下了痕跡，但如今困擾我的並非衰老，而是記憶……還有那些我本以為早已深埋的事物，它們又回來了。\n那些蟄伏已久的黑暗之物正在蠢蠢欲動，我擔心它們再也不願隱藏在陰影之中。我相信，在所有人之中，唯有你擁有理解——甚至直面——那些即將重見天日的事物的能力。\n這份邀請絕非隨口提出，請獨自前來，勿帶同伴，切勿告知他人。我要揭示的秘密，絕不能讓門外漢知曉，否則他們也將淪為那些超越世界邊界之物的獵物。\n我們將在約定的時間，於我的宅邸相見。\n謹致最誠摯的信任。\n伊萊賈·哈考特」\n\n你完全不知道伊萊賈·哈考特是誰，也不明白他為何需要你的幫助，距離前往哈考特莊園的約定時間還有幾個小時，你決定好好利用這段時間，在見到他之前，先查清這個男人的底細。但你想從何處尋找線索？',
  c:[{l:'金斯波特中心山街區——眾多歷史悠久的建築，能接觸到為富豪們勞作的普通人',g:51},
     {l:'金斯波特港濱區——新英格蘭碼頭的典型代表，流言蜚語的溫床',g:131},
     {l:'金斯波特南岸社區——藝術和娛樂區，聚集著街頭靈媒與千里眼',g:211}]};

D[2]={s:'manor',t:'關於那些在金斯波特迷霧籠罩的街道中迷失的人，有許多傳聞，而這些傳聞並非都有美好的結局。你不會想成為他們中的一員，對吧？\n\n如果你是讀完上一章後直接翻到這裡，我們必須提醒你，你很快就會陷入困惑，甚至迷失方向，而這只會讓你走向瘋狂。這本書的正確玩法，是根據你的選擇和書中的指引，在不同章節間跳轉。建議你返回第 1 章，選擇其中一個選項，然後翻至對應的章節。\n\n當然，你也可能覺得，這一章是書中某個謎題的答案。很遺憾，你想錯了。誰說解開哈考特莊園中隱藏的謎團會很容易？不過，還是獎勵你一個秘密線索吧。解鎖秘密線索：求真者。\n\n或許你是特意來尋找秘密線索的，那好吧，再送你一個。解鎖秘密線索：謊言與秘密。\n\n又或許你此前玩過這類冒險遊戲書，知道翻到第 2 章總能找到一些秘密線索，這次也不例外。解鎖秘密線索：投機取巧。\n\n現在回到你之前的冒險進程，大概率是返回第 1 章。',
  f:{secret:'求真者'},c:[{l:'解鎖秘密線索：謊言與秘密',g:2},{l:'返回第 1 章',g:1}]};

D[3]={s:'manor',t:'終於，透過迷霧，宅邸窗戶裡的燈光化作清晰的光球，碎石路再次在你腳下發出嘎吱的聲響。你終於找到了一處容身之所，精疲力盡、飢腸轆轆，已然無計可施，但至少此刻你是安全的。\n\n解脫之感湧上心頭，你加快腳步，宅邸的輪廓漸漸清晰。你看到通往漆黑正門的台階，還有熟悉的窗欞和屋脊佈局。一股比黏膩的迷霧更冰冷的恐懼，揪緊了你的胃，讓你一陣絞痛。\n\n不知怎的，你竟又走回了哈考特莊園。\n\n你心灰意冷地走上台階，推開正門，踉蹌著走進客廳，癱坐在椅子上。生命值-1，厄運值+1。\n\n佩雷格林·沃德和霍勒斯·特倫霍姆正在激烈爭執，聽到伊莎貝爾·哈考特的驚呼後，兩人停了下來：「你怎麼了？」\n\n「我在迷霧裡迷路了。」你有氣無力地說。\n\n「你在說什麼？」她反駁道，「你才離開五分鐘——最多十分鐘，我猜也就夠走到車道盡頭再回來。你到底去做了什麼，才會變成這副樣子，而且才過了這麼短時間？」\n\n五分鐘？可你明明離開了好幾個小時。她是在騙你嗎？\n\n你掙扎著起身，走回前廳查看落地鐘的時間。除非她連時鐘都動了手腳，否則你顯然只離開了沒多久。那麼，你在迷霧中究竟經歷了什麼？\n\n理智值-2，解鎖秘密線索：迷霧中的陰森宅邸。',
  f:{hp:-1,doom:1,san:-2,secret:'迷霧中的陰森宅邸'},c:[{l:'繼續',g:175}]};

D[4]={s:'spider',t:'你雙膝跪地，掀開床幔的一角，窺探四柱床底的黑暗。\n\n眼睛漸漸適應了昏暗的光線，你開始看到無數閃閃發光的圓球，在透進陰影的微弱光線下，像擦亮的黑珍珠一般。這樣的圓球一定有上百個！\n\n又過了片刻，你的視力終於足夠清晰，才意識到自己看到的是上百隻眼睛，屬於幾十隻大小不一的蜘蛛。有些蜘蛛攀附在床架上，有些則蹲在滿是灰塵和頭髮的地毯上，彷彿隨時都會一躍而起。\n\n你放下床幔，迅速站起身，朝門口退去，目光緊盯著地面，生怕那些蜘蛛跟過來。\n\n理智值-1，厄運值+1，若你尚未擁有弱點{恐蛛症}，則解鎖該弱點。\n\n若你擁有物品[夾鼻眼鏡]，翻至48章。若未擁有，翻至170章。',
  f:{san:-1,doom:1,wk:'恐蛛症'},c:[{l:'（持有夾鼻眼鏡）離開',g:48,q:{item:'夾鼻眼鏡'}},{l:'離開',g:170}]};

D[5]={s:'manor',t:'你遲疑了一瞬，就在這一瞬間，佩雷格林·沃德一把奪過了你手中的信。意志力-1。\n\n「在我們試圖弄清楚發生了什麼的時候，我希望你能保持基本的禮儀。」律師對著你和特倫霍姆說道，一邊將信塞進了灰色外套的胸袋裡。\n\n「你覺得有不對勁的地方？」探險家說，「你不認為伊萊賈和科拉的遭遇只是一場意外？」\n\n「你覺得呢？」沃德反唇相譏。\n\n兩人交換了一個詭異的眼神，但這眼神背後藏著什麼？顯然，他們知道一些你不知道的事。\n\n「如果有人讀一讀這封信，或許我們就能知道真相了。」特倫霍姆說。',
  f:{wp:-1},c:[{l:'繼續',g:166}]};

D[6]={s:'spider',t:'那隻蜘蛛趁機逃走，消失在書房黑暗的角落裡，只留下一個令人不安的事實——牠還在這棟房子裡，任何人都可能成為牠的下一個獵物。\n\n你突然開始想像成群的蜘蛛爬過地板朝你湧來，不由得後退一步，而那些想像中的蜘蛛，竟開始從書房門兩側的牆上垂下來。你渾身一顫，強忍著心中的反感。理智值-1。\n\n突然有人大喊：「小心！」——你不知道是誰——眾人四散躲避。書房裡一陣騷動，隨後霍勒斯·特倫霍姆突然走出房間，手裡拿著一個玻璃罐，蓋子擰得嚴嚴實實，罐子裡困住了一隻大蜘蛛。\n\n這隻蜘蛛有著圓滾滾的黑色軀體，上面佈滿了詭異的、類似羅夏墨跡測驗的猩紅骷髏紋路，眼睛則是無數閃閃發光的黑珍珠。牠的顎部格外巨大，兩根針狀毒牙的尖端，各掛著一滴透明的液體。若是將腿展開，大小堪比你的拳頭。',
  f:{san:-1},c:[{l:'繼續',g:244}]};

D[7]={s:'manor',t:'在這棟滿是蜘蛛的可怕房子裡，你似乎每一小時都會有新的糟糕發現！\n\n現在你想去哪裡？',
  c:[{l:'調查哈考特所謂的「博物館」',g:38},
     {l:'回到書櫃暗門處，看看門後有什麼',g:188},
     {l:'下樓將發生的事告知其他人',g:233}]};

D[8]={s:'manor',t:'走進臥室，你發現裡面空無一人。四柱床上有睡過的痕跡，但伊萊賈·哈考特此刻並不在這裡。\n\n他是身體好轉，能自己走出臥室了，還是被人轉移到了別處？如果是前者，他現在在哪裡？如果是後者，是誰轉移了他，轉移到了哪裡，又為何要轉移他？厄運值+2。\n\n若你想搜查房間尋找線索，翻至28章。若你想立刻離開房間，尋找失蹤的病人，翻至48章。',
  f:{doom:2},c:[{l:'搜查房間尋找線索',g:28},{l:'立刻離開房間，尋找失蹤的病人',g:48}]};

D[9]={s:'manor',t:'你打開[手電筒]，將光束對準逼近的恐怖生物。明亮的光線掃過牠們的眼睛，那些東西發出一聲嘶鳴，向後退了幾步。其他生物依舊從黑暗中逼近，但當你將手電筒的光線對準牠們時，牠們也紛紛嘶鳴著後退。\n\n你藉著這個機會，朝宅邸退去。但與這些畸形的蜘蛛生物近距離接觸了這麼久，你感到心神俱裂。不僅如此，這次在莊園裡的遭遇，還讓你的鞋子沾滿了污泥。理智值-1，若你尚未記錄物品[髒鞋子]，則將其記錄在角色表中。\n\n你終於回到了通往正門的台階前，那些生物早已停止追蹤你。你推開門，回到了宅邸內。',
  f:{san:-1,item:'髒鞋子'},c:[{l:'繼續',g:282}]};

D[10]={s:'manor',t:'你瞥見樓上有一個身影一閃而過，於是前去查看。你從大廳抬頭望向二樓的走廊平台，看到一個女傭——她穿著黑色的裙子和白色的圍裙，紅棕色的頭髮挽成髮髻，戴著一頂軟帽，特徵十分明顯——也從欄杆後向下張望。\n\n進行一次熵值測試：擲1顆骰子，若你擁有弱點{偏執}或{夢魘纏身}，點數-1。\n\n若測試結果小於或等於當前的厄運值，翻至212章。若測試結果大於當前的厄運值，翻至202章。',
  c:[{l:'熵值測試（測試：命運）',t:{mode:'fate',d:0,p:202,f:212,minus:['偏執','夢魘纏身']}}]};

/* ---------- 11-20 ---------- */
D[11]={s:'manor',t:'讀完信後，你將信紙翻過來，看到了哈考特的鋼筆留下的模糊印痕。想必他寫這封信時，下面還墊著另一張紙，他在那張紙上給另一個人寫了信。\n\n你調整信紙的角度，讓光線恰到好處地照在上面，終於看清了另一封信的部分內容：\n\n「最後一項任務，比第一項更重要，也更具約束力。我不會在信中透露任務的具體內容，筆墨紙硯太過脆弱，無法抵擋窺探的目光。\n等我們下次見面時，你早已承擔起這份職責……」\n\n線索+1，解鎖秘密線索：隱藏的二號。\n\n翻回216章。',
  f:{clue:1,secret:'隱藏的二號'},c:[{l:'返回',g:216}]};

D[12]={s:'manor',t:'迷霧緊緊裹著宅邸，用冰冷的懷抱將其籠罩。你走下台階，小心翼翼地沿著車道前行。霧氣濃得化不開，你幾乎看不到身旁的樹木，即便你知道它們離你最多只有幾英尺遠。\n\n你轉過身，望向宅邸，卻只能看到門廊燈朦朧的光暈，還有那些窗簾或百葉窗未拉上的房間裡亮著的燈。但你確信自己不會迷路，於是再次沿著車道前行。\n\n走到大門處，你看不到任何車輛沿著道路朝宅邸駛來——更何況你根本看不到道路！你覺得離開莊園也不會有何收穫，畢竟外面的霧這麼大，於是轉身，沿著紅楓夾道的車道往回走。回到宅邸後，你走上台階，推門而入。\n\n伊莎貝爾·哈考特、佩雷格林·沃德和霍勒斯·特倫霍姆正聚在大廳中央，憂心忡忡地激烈討論著。但當你走進宅邸時，所有人的目光都落在了你身上。\n\n「你去哪裡了？」伊莎貝爾驚呼道，難掩心中的焦躁。\n\n「你什麼意思？」你問道。\n\n「你離開了快一個小時了。」\n\n「什麼？不可能，我只是走到大門又回來了，最多十分鐘。」\n\n就在這時，大廳裡的落地鐘敲響了整點，證明你撒了謊。\n\n「看看你的鞋子。」沃德指著你的腳說，「你說你只是走了趟車道，可你的鞋子看起來像是在泥地裡走過。」\n\n你低頭一看，才發現鞋子上沾滿了污泥，卻無法解釋原因。一股冰冷的震驚席捲了你的全身。\n\n理智值-1，若你尚未記錄物品[髒鞋子]，則將其記錄在角色表中。\n\n翻至162章。',
  f:{san:-1,item:'髒鞋子'},c:[{l:'繼續',g:162}]};

D[13]={s:'manor',t:'《海波里亞的異教秘典》是一本破舊的對開本，序言稱書中內容譯自史前石匾的殘片，還有穆圖蘭的瘋狂法師埃邦的失傳記錄。這本書記載了在海波里亞——那片傳說中被冰雪籠罩、早已沉入海底的大陸——盛行的秘密社團、黑暗異教和夢魘宗教。\n\n書中羅列的教派包括：崇拜慵懶之神撒托古亞的撒托古亞教派；崇拜眾蛇之父伊格的蛇崇拜者；冰原巫師，還有亞特蘭-納卡的信徒。而最後一個教派，尤其引起了你的注意。\n\n這位蜘蛛女神的信徒們相信，她居住在海波里亞深處的洞穴中，編織著一張無邊無際的巨網，這張網跨越各個現實維度，每一根新的蛛絲，都化作連接不同世界的橋樑。新入教者會被囚禁在黑暗中，一直活到被蜘蛛吞噬血肉的那一刻，而所有倖存者，都會被視為亞特蘭-納卡選中的孩子，成為她的信徒。在這個教派眼中，這張不可思議的巨網，就是命運本身，所有生命都被困在蛛絲之中。在黑暗中侍奉這位織網者，就是接受並擁抱自己在命運中的位置。\n\n線索+1，若你想帶走這本書，將物品[海波里亞的異教秘典]記錄在角色表中，並解鎖能力{神秘研究}。',
  f:{clue:1,item:'海波里亞的異教秘典',ab:'神秘研究'},c:[{l:'翻至110章',g:110}]};

D[14]={s:'manor',t:'這些書種類繁雜，有遊記、關於失傳異教習俗的論文，還有自然世界的百科全書。書名都很吸引人，充滿神秘感，比如《亞馬遜河七月行》《阿拉納斯山脈的六大教派》《婆羅洲蜘蛛博物指南》——這是一本介紹280種最常見蜘蛛的入門識別指南。\n\n翻至289章。',
  c:[{l:'繼續',g:289}]};

D[15]={s:'manor',t:'越來越多的蜘蛛從上方落到你身上，你想用什麼來對抗這群蜘蛛？\n\n從你的角色表中選擇一件物品，然後翻至138章。',
  c:[{l:'選擇物品',g:138}]};

D[16]={s:'manor',t:'一切都和你離開時一模一樣。事實上，你甚至不知道自己為什麼要回來。行軍床上空的牆上掛著一幅地圖，上面畫著奇異的圖案，還有一些聽起來像是人在神志不清時臆想出來的地名，這幅地圖讓你感到不安，彷彿是你去過的地方，卻又從未在清醒時到訪過。\n\n事實上，待在這裡讓你感到渾身不自在。理智值-1。\n\n若你想離開這個秘密房間，希望這種不安的感覺能隨之消散，翻至258章。若你想打開櫥櫃，翻至286章。',
  f:{san:-1},c:[{l:'離開這個秘密房間',g:258},{l:'打開櫥櫃',g:286}]};

D[17]={s:'manor',t:'穿過大廳，你走進書房，發現佩雷格林·沃德正蹲在壁爐前。一股燒焦的氣味鑽入你的鼻孔，讓你心頭一驚。此前這個房間裡並沒有生火，那現在燒的是什麼？\n\n你也嚇了沃德一跳，他站起身，朝門口走去，彷彿完全無視你的存在，拒絕與你對視，身體繃得像一根弦。但你站穩腳步，擋在了他的面前。\n\n眼前的情況，還有他的一舉一動，都表明他在圖謀不軌。你本能地準備阻止他，但佩雷格林·沃德不會讓任何人擋他的路。\n\n進行一次抗性測試：擲1顆骰子，加上你的戰鬥值。你可以消耗1點資源，擲2顆骰子並取點數最高的那顆。若你擁有能力{戰士}、{守護者}、{堅定}、{盜賊}或{堅韌}，點數+1。若你擁有弱點{謹慎}，點數-1。測試結果如何？\n\n總點數8及以上：翻至222章。總點數7及以下：翻至122章。',
  c:[{l:'抗性測試（戰鬥）',t:{a:'com',d:8,p:222,f:122,plus:['戰士','守護者','堅定','盜賊','堅韌'],minus:['謹慎'],c:'res'}}]};

D[18]={s:'attic',t:'你擠進蛛網構成的入口，蛛絲粗如繩索，帶著潮濕的、有生命的阻力，黏在你的皮膚上。可怕的是，這些蛛絲摸起來像肌肉纖維——溫熱、搏動，而且不知為何，彷彿擁有自我意識。空氣中瀰漫著一股甜酸的麝香味，那是古老腐朽與紡絲交織的味道。伊莎貝爾在你身後遲疑不前，但現在已經沒有回頭路了。\n\n你奮力穿過蛛網，腳下一滑，順著震顫的蛛絲斜坡摔了下去，重重地落在巨大洞穴的底部，洞穴的穹頂消失在陰影之中。蛛網縱橫交錯，閃著微光的蛛絲微微嗡鳴，彷彿在與某種聽不見的歌聲共鳴。\n\n陰影中有身影在爬動——是蜘蛛，沒錯，卻是地球上從未出現過的蜘蛛。牠們身形龐大，長著無數眼睛，軀體閃閃發光。但牠們並沒有發起攻擊，只是靜靜注視著。\n\n洞穴的另一端，一個巨大的身影動了動。你先感受到了牠的存在，而後才看到牠：那是神明的威壓，靜得不可思議，龐大得不可思議。八隻眼睛緩緩睜開，這位偉大的織網者從蛛網王座上緩緩展開身軀。\n\n你闖入了蜘蛛女王亞特蘭-納卡的巢穴，此刻的你，插翅難飛。\n\n解鎖秘密線索：蜘蛛與飛蟲。遊戲結束。',
  f:{secret:'蜘蛛與飛蟲'},c:[{l:'結束',g:'END0'}]};

D[19]={s:'manor',t:'離開神秘的地圖室，你關上身后的書櫃暗門，腦海中滿是疑問。\n\n現在你想去哪裡？',
  c:[{l:'調查哈考特所謂的「博物館」',g:38},
     {l:'去看看伊萊賈·哈考特的情況',g:88},
     {l:'下樓將發生的事告知其他人',g:233}]};

D[20]={s:'spider',t:'諾特分發完信件，手裡還剩一封。「科拉·貝爾韋瑟醫生。」他念著信封上的名字。\n\n「貝爾韋瑟醫生在哪裡？」沃德語氣煩躁地問道。\n\n就在這時，你聽到大廳對面傳來一聲尖叫，緊接著是東西摔在地上的聲音。\n\n沃德快步帶頭穿過大廳，在書房門口突然停住腳步。書房的雙開門還開著，因為貝爾韋瑟醫生還在裡面，所以之前離開的人沒有關門。而她此刻依舊在房間裡，只是倒在了地上，雙眼緊閉，痛苦地呻吟著，額頭上佈滿了汗珠。\n\n「看來她找到那隻蜘蛛了。」特倫霍姆指著她說，「看看她的手。」\n\n她的右手背呈現深紫色，並且已經開始腫脹，蜘蛛的毒液正在發作。\n\n哈羅醫生正要走進書房，瓦努姆教授伸手攔住了他。「別進去。」他嘶聲說道。\n\n「我必須進去！」哈羅反駁道。\n\n「但牠那隻蜘蛛顯然還在裡面遊蕩。」\n\n「這是我的職責，我發過誓的。」\n\n就在兩人爭執不休時，你突然迫切地想要做點什麼。但你該做什麼？',
  c:[{l:'前去救助貝爾韋瑟醫生',g:98},
     {l:'進入書房，專門尋找那隻蜘蛛',g:128},
     {l:'聽從奧托·瓦努姆的建議，留在原地',g:158}]};

D[21]={s:'manor',t:'你擔心這位絕望的醫生會用注射器刺向你或哈考特，將不知什麼東西注入你們的血管，於是衝了上去，決心在他動手前制服他。\n\n每一輪戰鬥開始前，你可以消耗1點資源，為本輪總點數+2。\n\n第一輪：擲2顆骰子，加上你的戰鬥值。若你擁有能力{敏捷}或{倖存者}，點數+1。若你擁有弱點{謹慎}，點數-1。總點數14及以上，贏得第一輪。\n第二輪：擲2顆骰子，加上你的戰鬥值和意志力值。若你擁有能力{戰士}或{堅韌}，點數+1。若你贏得第一輪，點數+2。總點數15及以上，贏得第二輪。\n\n若你贏得第二輪，翻至36章。若你輸掉第二輪，翻至56章。',
  c:[{l:'戰鬥（兩輪）',t:{battle:[{a:'com',d:14,plus:['敏捷','倖存者'],minus:['謹慎']},{a:'com',b:'wp',d:15,plus:['戰士','堅韌'],winBonus:2}],p:36,f:56,c:'res'}}]};

D[22]={s:'manor',t:'外面看不到探險家的身影——你甚至聽不到他恐懼的嚎叫，也聽不到他飛奔時腳下碎石的嘎吱聲。一切都被迷霧籠罩，變得模糊不清。\n\n若你想繼續設法追蹤特倫霍姆，翻至102章。若你想鼓起勇氣，回到宅邸查明沃德的下落，翻至288章。',
  c:[{l:'繼續追蹤特倫霍姆',g:102},{l:'回到宅邸查明沃德的下落',g:288}]};

D[23]={s:'manor',t:'你協助特倫霍姆和哈羅醫生，小心翼翼地將失去意識的男人從書房抬出來，進入大廳後左轉，抬著他上了樓。樓梯沿著大廳的西牆蜿蜒向上，通往二樓的走廊平台。哈羅醫生在前面帶路，顯然他之前曾來哈考特莊園為伊萊賈診治過，因為他清楚地知道伊萊賈的臥室在哪裡。\n\n你們繞著走廊平台走，經過了幾扇通往其他房間的門，其中一扇位於平台北側的門上，標著「博物館」的字樣。最後，你們走到了樓梯的正上方，穿過一個小小的前廳，進入了哈考特的臥室。臥室裡有一張做工堅實的桃花心木四柱床，薄紗床幔讓你想起厚厚的蜘蛛網。窗戶上拉著厚重的窗簾，但家裡的傭人已經鋪好了床，還打開了床頭燈。\n\n你和特倫霍姆將伊萊賈·哈考特放到床上後，哈羅醫生讓你們離開。「回到其他人身邊吧，我會為他做一次全面的檢查，檢查完就下樓找你們。」\n\n「真不敢相信，區區一隻蜘蛛的咬傷，竟能把人弄成這樣。」你試圖和特倫霍姆閒聊。\n\n「他還算幸運，我們是在北美，不是在南美。」探險家說，「我曾經和一個人在亞馬遜雨林，他被一隻巴西遊走蛛咬傷，半小時內就死了，但早在那之前，他就求我殺了他。你知道的，都是因為那鑽心的疼痛。」\n\n「哈考特被咬到現在還不到十五分鐘。」你指出，「你覺得他也會遭遇那樣的事嗎？」\n\n「至少這能幫助我們了解這種毒液的效果，甚至可能識別出這隻蜘蛛的種類。」特倫霍姆露出一抹冷酷的微笑，附和道，「不過，我懷疑任何來自南美的生物，都很難在金斯波特存活，尤其是在這麼冷的天氣裡。更何況，這樣的生物究竟是如何漂洋過海來到麻薩諸塞州，又如何在哈考特冰冷的書房裡存活下來的？但蜘蛛是一種生命力頑強的生物，能在我想像不到的環境中生存，而且我也不是動物學家。」\n\n探險家的話非但沒有讓你安心，反而讓你忍不住焦慮地掃視著前廳黑暗的角落，懷疑那隻襲擊哈考特的八腳恐怖生物，正藏在某個陰影裡。\n\n理智值-1，解鎖秘密線索：爬行的恐怖。\n\n翻至173章。',
  f:{san:-1,secret:'爬行的恐怖'},c:[{l:'繼續',g:173}]};

D[24]={s:'attic',t:'你趕走了蜘蛛，伊莎貝爾還在奮力抵擋蛛群的進攻，而你則再次努力喚醒那些陷入沉睡的人，打破他們與黑暗織網者的領域之間的聯繫。\n\n你抓住路德·哈羅醫生的肩膀，用力搖晃他，同時對著他的臉大喊，讓他醒過來。他的眼皮突然顫動著睜開，驚恐地盯著你，眼睛似乎要從眼眶裡凸出來。他張開嘴，發出一聲刺耳的、令人毛骨悚然的尖叫。\n\n其他沉睡的人也跟著尖叫起來，他們也醒了過來，直面自己此刻所處的可怕境地。緊接著，那隻蹲在巨大蛛網中央的蜘蛛怪也開始尖叫，你擔心自己的心智會就此崩潰。\n\n擲1顆骰子。若擲出的點數小於或等於你的理智值，翻至176章。若擲出的點數大於你的理智值，翻至159章。',
  c:[{l:'理智測試',t:{mode:'san',d:0,p:176,f:159}}]};

D[25]={s:'manor',t:'身邊擺滿了世界各地與蜘蛛教派相關的文物，這讓你感到渾身不自在，彷彿這位八腳女神的信徒們織的網，已經纏住了整個地球。\n\n理智值-1，解鎖秘密線索：天羅地網。\n\n現在你想做什麼？',
  f:{san:-1,secret:'天羅地網'},c:[{l:'查看那幅裝裱的畫',g:73},{l:'查看那組照片',g:224},{l:'離開博物館，去別處看看',g:170}]};

D[26]={s:'attic',t:'恐怖的畫面，還有各種顛覆認知、令人心智俱裂的怪事接連衝擊著你的感官，你被嚇得僵在原地，無法動彈。哈考特蜘蛛怪從蛛網上爬下來，穿過積滿灰塵的地板，朝你逼近。牠那八隻怪異的腿，看起來像關節扭曲的人類手臂，最後融合成帶著爪尖、覆著硬毛的蜘蛛腿，卻依舊能以一種詭異的姿態在閣樓上爬行。\n\n「見證鑰匙的誕生吧！」你聽到管家大喊道，「以血肉為軀，以夢境為印，在陰影中編織而成，注定要完成這偉大的使命。鑰匙是真實的。」\n\n這隻由伊萊賈·哈考特變成的怪物逼近你，人類的臉以一種令人作嘔的方式，與臃腫的蜘蛛軀體融合在一起，嘴巴大張，毒牙不停顫動。\n\n「現在，鑰匙必須轉動了！」諾特的聲音再次響起。\n\n這是您聽到的最後一句話，因為下一秒，怪物的顎部猛地咬合，骨頭碎裂的脆響和溫熱的血花一同迸發，你的頭顱被硬生生從身體上咬了下來。\n\n遊戲結束。',
  c:[{l:'結束',g:'END0'}]};

D[27]={s:'manor',t:'你衝破蜘蛛的包圍圈，朝宅邸飛奔而去，一次也不敢回頭。如果牠們追上來，想要置你於死地，你寧願自己對此一無所知。有時候，無知真的是一種幸福。\n\n但即便回到宅邸，關緊大門，抵擋住潛伏在莊園裡的恐怖生物，一想到只要有人膽敢踏出大門，就會遭遇那些可怕的東西，你就感到極度焦躁。\n\n若你尚未記錄物品[髒鞋子]，則將其記錄在角色表中；若你尚未擁有弱點{恐蛛症}和{鬧鬼}，則解鎖這兩個弱點。\n\n翻至282章。',
  f:{item:'髒鞋子',wk:'恐蛛症'},c:[{l:'繼續',g:282}]};

D[28]={s:'manor',t:'臥室的裝修風格顯得有些過時，像上一個世紀的產物。除了床，哈考特的臥室裡還有三件顯眼的家具——一張床頭櫃、一個高腳五斗櫃，還有一個三開門的法國橡木大衣櫃。\n\n至少在一開始，你想把搜索的重點放在哪裡？',
  c:[{l:'床頭櫃',g:167},{l:'高腳五斗櫃',g:187},{l:'三開門法國橡木大衣櫃',g:207},{l:'床底',g:4}]};

D[29]={s:'manor',t:'你們兩人一路飛奔下閣樓的樓梯，一步跨兩級台階。跑到二樓的走廊平台後，又朝著中央樓梯狂奔，回到前廳後，你們猛地推開大門，衝進了夜色中。\n\n但自你抵達後，便一直籠罩著哈考特莊園的致命迷霧，終於開始消散了。你和伊莎貝爾沿著車道飛奔，穿過大門，沿著道路朝山下的小鎮跑去。\n\n伊萊賈·哈考特死了，但這棟充滿夢境與蜘蛛的宅邸依然矗立。誰也不知道，你將這棟房子裡的其他客人，推向了怎樣的命運……\n\n解鎖秘密線索：錯綜複雜的網。最終評分：2星。遊戲結束。',
  f:{secret:'錯綜複雜的網'},c:[{l:'結束',g:'END2'}]};

D[30]={s:'manor',t:'這種視覺錯覺讓你開始頭痛，你有種預感，除非離開這個陰森的房間，否則這種不適感永遠不會消失。或許是因為這個狹小的空間裡，聚集了太多強大的文物，你感到自己必須離開這壓抑的博物館，否則精神將會徹底崩潰。\n\n生命值-1，意志力-1。翻至170章。',
  f:{hp:-1,wp:-1},c:[{l:'繼續',g:170}]};

/* ---------- 31-40 ---------- */
D[31]={s:'manor',t:'「可不是嘛，」這位學者答道，「好些年了。」\n「這麼說，你們倆關係很近？」你追問道。\n「以前是，現在不是了。」他眼中掠過一絲悵然。\n「能問問原因嗎？」\n教授遲疑片刻後答道：「我們起了爭執，意見不合。」\n「什麼樣的爭執？」\n瓦努姆長嘆一聲，滿是無奈：「伊萊賈想把我們共同的研究推向下一個階段，我不同意。」\n「你說的『下一個階段』是什麼意思？」你問道。\n「從理論研究走向實際實踐。他想從學術探索，跨到真正的儀式重演。」\n「所以你反對了。」\n「我當然反對。我雖對神秘學感興趣，卻從沒想過要去施展黑魔法。」\n線索+1。翻至129章。',
  f:{clue:1},c:[{l:'繼續',g:129}]};

D[32]={s:'mist',t:'金斯波特的迷霧濃得化不開，卻又輕如棉花糖，每一次呼吸，都能感受到那股冰冷的濕意漫過咽喉深處。\n\n若你持有物品[襯衫紐扣]，翻至125章。若未持有，但有[夾鼻眼鏡]，翻至102章。若未持有上述物品，但有[化石毒牙]，翻至66章。若上述物品均未持有，翻至12章。',
  c:[{l:'（持有襯衫紐扣）',g:125,q:{item:'襯衫紐扣'}},{l:'（持有夾鼻眼鏡）',g:102,q:{item:'夾鼻眼鏡'}},{l:'（持有化石毒牙）',g:66,q:{item:'化石毒牙'}},{l:'（無）',g:12}]};

D[33]={s:'manor',t:'諾特為哈考特效力三十三年，對雇主的一切，乃至他的執念，想必都瞭若指掌。想到這一點，再看他凝望蛛網時那副痴迷的模樣，你便看透了他的心智狀態，而這也在你心中燃起了一簇至關重要的希望之火。\n\n理智值+1，意志力+1，解鎖秘密線索：隱藏的五號。\n\n現在翻回92章。',
  f:{san:1,wp:1,secret:'隱藏的五號'},c:[{l:'返回',g:92}]};

D[34]={s:'manor',t:'房間裡擺著大大小小各式各樣的罐子和瓶子，裡面裝著形形色色的蜘蛛。有的蜘蛛長著像蜘蛛蟹一般修長的腿，有的則微小如爍黑的圓珠，只配著細針般的肢體，甚至還有些渾身覆著粗硬剛毛、形似捕鳥蛛的巨型蜘蛛。\n\n若你擁有弱點{恐蛛症}，意志力-1。\n\n所幸這些蜘蛛標本早已死去，被浸泡在某種防腐液中，免於腐爛。\n\n翻至289章。',
  c:[{l:'繼續',g:289}]};

D[35]={s:'spider',t:'你猛地向前一躍，將罐子狠狠扣向蜘蛛——可你的反應還是慢了一瞬，差之毫釐沒能扣中。即便如此，蜘蛛還是受驚逃竄了。戰鬥值-1，厄運值+1，解鎖秘密線索：逃之夭夭的傢伙。\n\n「把東西給我！」霍勒斯·特倫霍姆厲聲喝道，一把從你手中奪過容器。從你的角色表中划掉物品[空玻璃罐]。\n\n他片刻未停，縱身追向逃竄的蜘蛛，整個人撲趴在地上。等他再次起身時，你才看到那隻可怖的怪物已被他困在玻璃罐中，罐蓋擰得嚴嚴實實。\n\n這隻蜘蛛有著圓滾滾的黑色軀體，上面佈滿了詭異的、類似羅夏墨跡測驗的猩紅骷髏紋路，眼睛則是無數閃閃發光的黑珍珠。牠的顎部格外巨大，兩根針狀毒牙的尖端，各掛著一滴透明的液體。若是將腿展開，大小堪比你的拳頭。\n\n翻至244章。',
  f:{com:-1,doom:1,secret:'逃之夭夭的傢伙'},c:[{l:'繼續',g:244}]};

D[36]={s:'manor',t:'你奮力從醫生手中奪過注射器，他發出一聲飽含認命的長嘆，突然跌坐在床邊。\n\n「我沒想傷害伊萊賈，」他輕聲道，「這針是為我自己準備的。」\n\n「你說什麼？」你怔怔地看著醫生，又看看手中的注射器，反覆打量。\n\n緊接著，他的懺悔傾瀉而出：「我的一位病人去世了。伊萊賈察覺到了異樣，而我在一時的絕望與衝動中，把一切都告訴了他。他說會處理好這件事，讓我不必擔心。他也確實做到了，或者說，是他吩咐佩雷格林·沃德擺平了一切。那段時間，我過得安穩極了，再也沒有煩心事。可從那一刻起，我就徹底受制於伊萊賈·哈考特了。阿片類藥物能讓我忘掉自己做過的所有醜事。」\n\n線索+1，解鎖秘密線索：一日一蘋果。\n\n翻至182章。',
  f:{clue:1,secret:'一日一蘋果'},c:[{l:'繼續',g:182}]};

D[37]={s:'spider',t:'你拼命揮打著四下亂竄的蜘蛛，想盡快把牠們從身上拍掉，生怕被牠們咬上一口。\n\n第一輪：擲2顆骰子，加上你的戰鬥值。若你擁有能力{敏捷}、{堅定}或{倖存者}，點數+1。若你擁有弱點{謹慎}，點數-1。總點數14及以上，贏得第一輪。\n第二輪：擲2顆骰子，加上你的戰鬥值和意志力值。若你擁有能力{戰士}或{堅韌}，點數+1。若你贏得第一輪，點數+2。總點數15及以上，贏得第二輪。\n\n若你贏得第二輪，翻至78章。若你輸掉第二輪，翻至49章。',
  c:[{l:'戰鬥（兩輪）',t:{battle:[{a:'com',d:14,plus:['敏捷','堅定','倖存者'],minus:['謹慎']},{a:'com',b:'wp',d:15,plus:['戰士','堅韌'],winBonus:2}],p:78,f:49,c:'res'}}]};

D[38]={s:'manor',t:'你意外地在博物館裡發現了霍勒斯·特倫霍姆，他正站在一個玻璃展櫃前，展櫃裡陳列著伊萊賈·哈考特最珍稀、最奇特的藏品。窗戶拉著百葉窗，房間裡只有幾盞電燈亮著。玻璃的反光讓特倫霍姆的臉色透著一種病態的蠟黃，更凸顯出他眼窩、臉頰凹陷處的陰影，看上去活像一具骷髏。\n\n他察覺到你的到來，慌忙想把手中破舊的不鏽鋼酒壺藏起來，轉念一想又放棄了。\n\n「我就知道，」他指了指展櫃說。你看清了，展櫃裡的絲絨軟墊上，放著一根彎曲的石製尖刺，和你手裡這根一模一樣，軟墊上還有一個凹槽，顯然是另一件同款藏品的位置。「凶器就是從這兒來的。」\n\n「瓦努姆教授還活著。」你提醒道。\n\n「暫時而已。」特倫霍姆答道。\n\n「你是說，這東西曾屬於一隻蜘蛛？」你舉起手中的[化石毒牙]問道。\n\n「科拉是這麼說的。」他的聲音透著一種莫名的疏離，「你該看看他出錢讓科拉搜羅的那些東西。當然，沒有帶這種毒牙的，但個頭也大得離譜。在我看來，實在是太大了。儘管我滿心擔憂，卻沒人發現端倪。只要他繼續資助科拉的研究，科拉就會源源不斷地給他找來想要的東西。」\n\n你從他眼中看到了恐懼。\n\n見特倫霍姆此刻願意開口，你決定趁機向這位探險家打探更多信息。你想問他什麼？',
  c:[{l:'問「哈考特要這些蜘蛛做什麼？」',g:67},
     {l:'問「哈考特雇你做了什麼？」',g:97},
     {l:'問「哈考特給你的信裡寫了什麼？」',g:147},
     {l:'問「你覺得是誰襲擊了瓦努姆教授？」',g:217}]};

D[39]={s:'manor',t:'附近突然傳來一聲叫喊，你立刻快步衝出房間。你不敢確定，但那聲音聽著像瓦努姆教授。\n\n你跑到走廊平台，只看到一個黑影正從教授所在的方向離開。\n\n你正盤算著要不要追上去，卻看到哈羅醫生從右側走來。\n\n但你的注意力，被走廊平台上一處明顯被挪動過的家具吸引了。\n\n樓梯頂端對面有一個壁龕，之前你從未留意過，實在太過普通。壁龕裡擺著一個書櫃和一把閱讀椅，椅旁的窗戶朝東，正對著莊園的庭院。\n\n而此刻，你一眼就注意到了這裡——書櫃被整個推了出來，幾乎堵死了壁龕的入口。等你走近才發現，這書櫃竟是一道暗門，此刻正被一具軀體抵著，保持敞開的狀態，門後透出微弱的燈光。\n\n你快步走上前，看清了抵著暗門的人是奧托·瓦努姆，他側躺在地上，背對著你。\n\n你蹲下身，想探探他還有沒有呼吸，身後卻傳來了其他人趕來的聲響。\n\n「是你幹的？」霍勒斯·特倫霍姆在你身後質問道。\n\n「不是我，」你急忙辯解，「我聽到叫喊聲，過來一看，教授就已經這樣了！」\n\n「讓我看看。」哈羅醫生疲憊地說著，走到了你身邊。\n\n翻至85章。',
  c:[{l:'繼續',g:85}]};

D[40]={s:'manor',t:'放寬心吧，你將成為我分享「母親」饋贈的一員。\n\n這話是什麼意思？\n\n「母親」是誰？她的饋贈又是什麼？還有哪些人會和我一起分享這份饋贈？會不會是今晚受邀來到哈考特莊園的這些人？會不會也包括你？\n\n智力值+1，解鎖秘密線索：隱藏的三號。\n\n現在翻回196章。',
  f:{int:1,secret:'隱藏的三號'},c:[{l:'返回',g:196}]};

/* ---------- 41-50 ---------- */
D[41]={s:'study',t:'這棟陰森宅邸裡的一切禍事，都始於書房，所以你決定回去看看，說不定還有什麼線索被遺漏了。但你想重點搜查書房的哪個地方？',
  c:[{l:'翻看滿牆的書架',g:255},{l:'搜查哈考特的書桌桌面',g:155},{l:'仔細檢查書房的地面',g:115}]};

D[42]={s:'spider',t:'你渾身僵硬，動彈不得，像個被困在自己身體裡的囚徒，只能眼睜睜看著一切——蜘蛛們拖著拼命掙扎的律師，越爬越高。意志力-1。\n\n「天啊，不要！」特倫霍姆突然嘶吼起來，重新找回了聲音和行動的能力。他沿著大廳狂奔，一把拉開正門，一邊尖叫著「不！不！不！」，一邊消失在迷霧籠罩的夜色中。\n\n進行一次主動性測試：擲1顆骰子，加上你的意志力值。你可以消耗1點資源，擲2顆骰子並選取點數最高的那顆。測試結果如何？\n\n總點數10及以上，翻至226章。總點數9及以下，翻至246章。',
  f:{wp:-1},c:[{l:'主動性測試（意志力）',t:{a:'wp',d:10,p:226,f:246,c:'res'}}]};

D[43]={s:'study',t:'你迫切想了解伊萊賈·哈考特究竟是怎樣的人，而探查他的書房——可以說是他私人的聖地——似乎是個不錯的開始。智力值+1。\n\n貝爾韋瑟醫生在書桌附近搜尋咬傷這位富豪隱士的蜘蛛，你則選擇了自己的探查目標。',
  f:{int:1},c:[{l:'翻看滿牆的書架',g:255},{l:'搜查哈考特的書桌桌面',g:155},{l:'仔細檢查書房的地面',g:115}]};

D[44]={s:'manor',t:'你最終擊退了這些恐怖的怪物，但在此之前，牠們用堅硬帶爪的肢體，在你身上劃出了數道傷口。\n\n生命值-2。\n\n若你的生命值仍大於0，翻至27章。若生命值為0，遊戲結束。',
  f:{hp:-2},c:[{l:'（生命值>0）繼續',g:27},{l:'（生命值=0）結束',g:'END0'}]};

D[45]={s:'attic',t:'蜘蛛依舊在你身上爬來爬去，你能感受到牠們毛茸茸的腿，觸碰到你每一寸裸露的皮膚，甚至鑽進了你的耳朵、鼻孔。你拼命後退，想遠離那些被蛛網裹住的沉睡者，只想趕緊擺脫這密密麻麻的蛛群。\n\n你必須換個辦法，你打算怎麼做？',
  c:[{l:'直接攻擊哈考特蜘蛛怪',g:245},
     {l:'看看自己有沒有能用來對抗這隻非人生物的物品',g:197},
     {l:'使用魔法',g:82},
     {l:'逃離這棟宅邸',g:126},
     {l:'穿過傳送門，逃進門後的洞穴',g:18}]};

D[46]={s:'manor',t:'「瓦努姆教授遇襲時，你在哪裡？」你質問沃德。\n\n這位律師嗤笑一聲，不屑於回答你的問題：「我覺得你的問題根本不配得到回應。」\n\n「佩雷格林和我一直待在客廳裡，」年輕的伊莎貝爾說道，「從我舅舅被抬上樓後就沒離開過。」\n\n「但這話並不完全屬實，不是嗎？」你指出，「貝爾韋瑟醫生被咬中毒後，你去了大廳等醫護人員，不是嗎？」\n\n「是，但沒過多久，我就決定回客廳和佩雷格林待在一起了。」\n\n「但他完全可以趁你還在大廳時，偷偷上樓。」你推測道。\n\n「不可能，」伊莎貝爾糾正道，「我當時坐在椅子上，背對著前門，面朝落地鐘，他要是上樓，我用餘光肯定能看到。從科拉被抬走，到現在，我只看到你一個人上過樓。」\n\n「沒錯，」律師突然轉向你，反唇相譏，「那瓦努姆遇襲時，你又在哪裡？」\n\n智力值-1，解鎖秘密線索：畏懼獵鷹。\n\n翻至277章。',
  f:{int:-1,secret:'畏懼獵鷹'},c:[{l:'繼續',g:277}]};

D[47]={s:'mist',t:'沒過多久，你就站在了「繩錨酒館」門口，這是港濱區最有名的酒館。長久以來，這裡都是漂泊的水手和愛冒險的遊客的落腳之地，人們可以公然違抗禁酒令，暢飲美酒，聊聊坊間新鮮事。\n\n你走進酒館，買了一杯酒——這種放縱的感覺讓你有些飄飄然——坐在角落的卡座裡，沉浸在酒館的喧鬧中，留心聽著身邊的閒談。資源+1。\n\n你低調地坐在那裡，聽到有人說起，一位學者正在找人幫忙，尋找一艘在印斯茅斯破敗漁村附近海域沉沒的海盜船；也聽到有人談論阿卡姆商業區的幫派火併；還有人謠傳，有一個宗教團體狂熱地信奉著一位名為「蟲群之主」的存在。但你始終沒聽到有人提起哈考特莊園，或是今晚莊園裡發生的事。\n\n你決心親自找出答案，一飲而盡後便離開了酒館。\n\n翻至150章。',
  f:{res:1},c:[{l:'繼續',g:150}]};

D[48]={s:'manor',t:'你走出哈考特的臥室，突然瞥見走廊平台的另一頭有東西在動，一種不祥的預感湧上心頭——似乎有人剛躲進了通往「博物館」的前廳陰影裡。\n\n若你想追上去一探究竟，翻至287章。若你不想追，且持有物品[襯衫紐扣]，翻至282章。若你不想追，且未持有物品[襯衫紐扣]，翻至202章。',
  c:[{l:'追上去一探究竟',g:287},{l:'（持有襯衫紐扣）不追',g:282,q:{item:'襯衫紐扣'}},{l:'不追',g:202}]};

D[49]={s:'spider',t:'蜘蛛們四下亂竄、爬來爬去，鑽進你的衣袖、頭髮，甚至溜進你的嘴角。你本以為自己能撐過去，以為這只是令人不適的小麻煩，很快就會結束，可現實遠比你想像的更可怕！\n\n這不是簡單的心神不寧，而是蜘蛛對你全身的瘋狂侵襲，無數的腿和顎部如潮水般湧來，你根本分不清，爬過你肋骨的是一隻蜘蛛，還是上百隻。你拼命揮舞手臂，可牠們卻死死黏在你身上，甚至鑽進了你的衣領。你原以為自己早已見識過恐懼，可此刻，你陷入了被蛛絲包裹的極致恐慌，這種恐懼真實又濃烈，揮之不去。\n\n理智值-1，若你尚未擁有弱點{恐蛛症}，則解鎖該弱點。\n\n擲1顆骰子，將點數除以2，小數部分向上取整，用你的生命值減去這個數字。\n\n若你的生命值仍大於0，翻至100章。若生命值為0，遊戲結束。',
  f:{san:-1,wk:'恐蛛症'},c:[{l:'承受傷害',t:{mode:'halfhp',d:0,p:100,f:'END0'}}]};

D[50]={s:'study',t:'你用手摩挲著書桌表面，沒有找到開啟暗格的隱藏按鈕。但當你的手指劃過吸墨紙時，卻摸到了什麼東西。\n\n你停下動作，再次撫摸著這張吸水紙，能清晰地感受到鋼筆留下的凹痕——你猜測，這是哈考特寫信時，印在下面一張紙上的痕跡。\n\n你調整檯燈的角度，讓光線恰好照在凹痕上，字跡的輪廓漸漸清晰，你終於看清了這封「隱形信」的內容：\n\n「此事萬分棘手——要保全路德·哈羅醫生的名聲，彼時他的聲譽已岌岌可危。你處理此事乾淨俐落，我們的帳目也因此兩清。」\n\n線索+1。\n\n把這封字跡殘缺的信記下來，或許會派上用場。翻至99章。',
  f:{clue:1},c:[{l:'繼續',g:99}]};

/* ---------- 51-60 ---------- */
D[51]={s:'mist',t:'你探索著中心山街區，驚嘆於金斯波特竟有如此多裝飾華麗的宅邸。但這些漂亮的房子，並非都歸金斯波特本地人所有——有一些是阿卡姆名門望族的度假屋。每年夏天，都會有不少富豪來這裡避暑，享受海濱娛樂和奢華派對，也有人選擇永遠定居在這座小鎮。金斯波特的社交聚會遠近聞名，聚會上的八卦和醜聞，都會被《金斯波特公報》詳細記錄。\n\n在這座小鎮，社會地位往往被視作比金錢、資產更珍貴的東西。這裡的人也對神秘學格外痴迷，招魂儀式、靈魂攝影，常常是鎮上上流社會社交聚會的重要環節。\n\n你走在这片富人區寬闊的大道上，古老的榆樹投下濃蔭，大道旁的房子能俯瞰整座小鎮和熙熙攘攘的港口。這片區域透著濱海豪宅的氣派，卻又帶著一種優雅的疏離感。儘管表面寧靜，新英格蘭風格的宏偉宅邸卻被一股詭異的死寂籠罩，彷彿它們都在沉睡，而你的出現，或許會將它們喚醒。\n\n終於，你等到了一个機會——一位體態豐腴的中年婦人從一棟豪宅裡走出來。她的舉止讓你覺得，她很可能是這戶人家的傭人，或許是廚師。你揮手示意，上前搭話，問她能否給你指去哈考特莊園的路。\n\n「你來錯地方了，」她說，「哈考特莊園不在金斯波特鎮上，它坐落在懸崖頂上。據說，只要沒有霧，從莊園頂層的窗戶，能一眼望過海灣，看到北角燈塔。」\n\n「你很了解那座莊園嗎？」你問道。\n\n她聳了聳肩：「只是早有耳聞。」\n\n「它名聲怎麼樣？」\n\n她左右掃視了一眼街道，低聲道：「就是感覺那地方的氣氛，怪怪的。」\n\n「什麼樣的氣氛？」你追問。\n\n「我也說不清楚，」她答道，眼神有些飄忽，「但我見過那地方很多次了。」\n\n「你去過？」\n\n「沒有！」她突然厲聲說道，打破了方才的恍惚，「我只是說見過，在夢裡……在噩夢裡……我想去看看，可我知道，一旦去了……」\n\n她打了個寒顫，拉緊了身上的斗篷，狐疑地看了你一眼，後退了幾步：「我得走了。但如果你是我，就再好好想想，要不要去那裡。祝你好運。」說完，她便匆匆朝港濱區的方向走去。線索+1。\n\n時間緊迫，你決定動身前往哈考特莊園——但廚師的警告，讓你對前方的未知充滿了警惕。\n\n翻至150章。',
  f:{clue:1},c:[{l:'繼續',g:150}]};

D[52]={s:'manor',t:'金斯波特的迷霧，彷彿對這座小鎮和鎮上的居民施了一道神秘的魔咒，如今，這道魔咒也纏上了你。但即便如此，你依然確信，躲進宅邸，將自己與這詭異的霧氣隔絕，是最正確的選擇。\n\n意志力-1，理智值+1，解鎖秘密線索：金斯波特的迷霧。\n\n若你持有物品[襯衫紐扣]，翻至282章。若未持有，但有[夾鼻眼鏡]，翻至10章。若上述物品均未持有，翻至96章。',
  f:{wp:-1,san:1,secret:'金斯波特的迷霧'},c:[{l:'（持有襯衫紐扣）',g:282,q:{item:'襯衫紐扣'}},{l:'（持有夾鼻眼鏡）',g:10,q:{item:'夾鼻眼鏡'}},{l:'（無）',g:96}]};

D[53]={s:'attic',t:'霍勒斯·特倫霍姆離你最近。你伸手抓住他的肩膀，纖細的蛛絲黏在你的手上，你拼命搖晃他，喊著他的名字。\n\n伊莎貝爾也對著佩雷格林·沃德做著同樣的事，可沃德的臉上露出各種扭曲的表情，卻始終沒有醒來。特倫霍姆也毫無反應，你又將目光轉向科拉·貝爾韋瑟醫生，她依舊沉睡，你再去搖路德·哈羅醫生，還是徒勞。\n\n無論你怎麼努力，都無法喚醒這些沉睡者。你意識到自己在這裡無能為力，而且待得越久，活下去的希望就越渺茫。你最後一次搖晃醫生的肩膀，轉身朝樓梯跑去。\n\n擲1顆骰子，若你擁有能力{倖存者}，點數-1。\n\n若總點數小於或等於你的生命值，翻至29章。若總點數大於你的生命值，翻至86章。',
  c:[{l:'擲骰逃離',t:{a:'hp',d:'san',p:29,f:86,minus:['倖存者'],mode:'escape'}}]};

D[54]={s:'manor',t:'博物館裡擺滿了各式各樣的展櫃，裡面陳列著稀奇古怪的物件——有的只是打磨過的奇形石頭，有的是用竹子和黑曜石刀片製成的原始武器，還有用玉石、象牙、雪花石膏精心雕刻的精美手工藝品。一面牆上掛著一幅巨大的裝裱畫作，一張玻璃桌面的展示櫃裡，放著一系列黑白照片。\n\n所有窗戶都拉著百葉窗，避免白天的陽光損壞藏品，房間裡只有幾盞壁燈昏黃地亮著。\n\n若你想仔細研究展櫃裡的藏品，翻至177章。若你想看看那幅裝裱畫作，翻至73章。若你想查看那組照片，翻至224章。',
  c:[{l:'仔細研究展櫃裡的藏品',g:177},{l:'看看那幅裝裱畫作',g:73},{l:'查看那組照片',g:224}]};

D[55]={s:'study',t:'你為何會在今晚被召至哈考特莊園，這背後的真相仍是一個謎，但這座莊園裡，還藏著哪些不為人知的秘密？\n\n若你持有物品[名單]，翻至139章。若未持有，翻至119章。',
  c:[{l:'（持有名單）',g:139,q:{item:'名單'}},{l:'（無）',g:119}]};

D[56]={s:'manor',t:'爭執中，注射器不知怎的刺進了你側腰。最初的刺痛過後，一股奇異的暖意迅速蔓延全身。\n\n「對不起！」哈羅醫生驚呼，「我不是故意的……天啊，這針不是給你的，是給我自己準備的。」他的聲音裡滿是絕望。\n\n暖意漸漸消散，睡意洶湧而來，你的頭開始發暈。\n\n「你什麼意思？」你說話的聲音已經開始含糊。\n\n緊接著，他的懺悔傾瀉而出，可你在與睡神摩耳甫斯的對抗中，只聽清了隻言片語。生命值-1，戰鬥值-2。\n\n「一位病人死了……我一時衝動，把一切都告訴了他……他擺平了一切……佩雷格林·沃德解決了那個麻煩……但從那一刻起……我就徹底歸哈考特掌控了。」\n\n線索+1，解鎖秘密線索：夢之王。\n\n翻至182章。',
  f:{hp:-1,com:-2,clue:1,secret:'夢之王'},c:[{l:'繼續',g:182}]};

D[57]={s:'manor',t:'「你不會丟下我一個人吧？」伊莎貝爾幾乎要哭出來了。\n\n「就像沃德說的，待在這兒不會有事的，」你安慰她，「再說了，他說很快就回來。」\n\n那麼，你現在想去哪個房間看看？',
  c:[{l:'去書房',g:17},{l:'去圖書館',g:181},{l:'去博物館',g:142},{l:'去書櫃暗門後那間剛發現的密室',g:74},{l:'去伊萊賈·哈考特的臥室',g:62},{l:'離開宅邸，去外面看看',g:91}]};

D[58]={s:'manor',t:'你把椅子挪開，輕輕推開暗門，一眼就看到一具木乃伊站在那裡，一動不動——但也只是片刻而已。\n\n這具木乃伊突然活了過來，動作詭異而僵硬，它的衣服下似乎有什麼東西在蠕動，讓衣服不停晃動。它猛地朝你撲來。\n\n翻至141章。',
  c:[{l:'繼續',g:141}]};

D[59]={s:'manor',t:'你一邊後退，一邊奮力抵擋木乃伊的攻擊，退到了密室門口。你抓住機會，狠狠推了這具不死生物一把，讓它踉蹌著向後倒去，隨即縱身穿過暗門，重重地關上了門。\n\n你靠在書櫃上，驚魂未定，平復著呼吸，總覺得木乃伊隨時可能破門而出。可幾分鐘過去了，門後沒有傳來任何撞擊聲，也沒有感受到任何推擠的力量，你才敢慢慢挪開身體。\n\n一切風平浪靜，但你還是把壁龕裡的閱讀椅推到書櫃前，抵著門，以防萬一。\n\n你檢查了一下自己的傷勢，所幸除了袖子被扯破，以及往後一閉眼，那具乾枯的木乃伊臉就會浮現在眼前外，並無大礙。\n\n在角色表中記錄物品[扯破的袖子]，厄運值+1，解鎖秘密線索：木乃伊男孩。\n\n若你持有物品[襯衫紐扣]，翻至282章。若未持有，但有[夾鼻眼鏡]，翻至10章。若上述物品均未持有，翻至96章。',
  f:{item:'扯破的袖子',doom:1,secret:'木乃伊男孩'},c:[{l:'（持有襯衫紐扣）',g:282,q:{item:'襯衫紐扣'}},{l:'（持有夾鼻眼鏡）',g:10,q:{item:'夾鼻眼鏡'}},{l:'（無）',g:96}]};

D[60]={s:'spider',t:'「天啊，不要！」特倫霍姆突然嘶吼起來，重新找回了聲音和行動的能力。他沿著大廳狂奔，一把拉開正門，一邊尖叫著「不！不！不！」，一邊消失在迷霧籠罩的夜色中。\n\n而蜘蛛們依舊拖著佩雷格林·沃德，朝著天花板越爬越高。\n\n若你想救沃德，翻至263章。若你想追特倫霍姆，翻至22章。若你選擇什麼都不做，翻至226章。',
  c:[{l:'救沃德',g:263},{l:'追特倫霍姆',g:22},{l:'什麼都不做',g:226}]};

/* ---------- 61-70 ---------- */
D[61]={s:'attic',t:'「我要去閣樓，」你對哈羅醫生說。你轉向伊莎貝爾：「你跟我一起去，還是留下來陪他？」\n\n年輕姑娘的遲疑，已經給出了答案。你獨自動身了。\n\n在二樓通往伊萊賈·哈考特博物館的前廳外，你沿著一條昏暗的走廊，走到了傭人樓梯的頂端。諾特和女傭們平日里就是走這條樓梯，避免打擾主人和他的客人。\n\n你繼續沿著傭人通道往前走，很快就到了另一道狹窄樓梯的底端，這道樓梯，只能通向閣樓。\n\n你聽到身後傳來地板的嘎吱聲，正要轉身，一個沉重的東西突然砸在你的肩胛骨之間，緊接著，你的後腦勺又挨了一擊，巨大的力量讓你眼前一黑，失去了意識。生命值-1。\n\n翻至283章。',
  f:{hp:-1},c:[{l:'繼續',g:283}]};

D[62]={s:'manor',t:'你發現伊萊賈·哈考特的臥室門開著，床頭燈的光芒灑進房間，透著一絲暖意。\n\n若你持有物品[夾鼻眼鏡]，翻至8章。若未持有，但有[化石毒牙]，翻至88章。若上述物品均未持有，翻至148章。',
  c:[{l:'（持有夾鼻眼鏡）',g:8,q:{item:'夾鼻眼鏡'}},{l:'（持有化石毒牙）',g:88,q:{item:'化石毒牙'}},{l:'（無）',g:148}]};

D[63]={s:'study',t:'「你覺得牠可能藏在哪裡？」你蹲到書桌下，和蛛形動物學家搭話。\n\n「大多數蜘蛛都喜歡陰暗、安靜的地方，比如房間的角落，或是家具底下。」\n\n你扭著頭四處張望，生怕有蜘蛛從書桌底下掉下來，可這裡空空如也。\n\n「哈考特脖子上的咬傷看著很嚴重，」你一邊說著，一邊低頭檢查書桌下的地毯，「你知道這是什麼蜘蛛咬的嗎？」\n\n「單從咬傷很難判斷，不同的人對毒液的反應也不一樣。」\n\n「我還以為你是這方面的專家，應該能看出來。」你不死心，站起身說道。\n\n「哦，我明白你的意思。但遺憾的是，答案還是一樣的。」她的臉紅了，書桌下的你，幾乎能感受到她臉頰的灼熱，「我的意思是，這樣的咬傷，可能是多種劇毒蜘蛛造成的。」\n\n「但這種毒液，能在瞬間讓人陷入昏迷？」你問道。\n\n「漏斗網蜘蛛就可以，」她思索片刻後繼續說道，「這種蜘蛛的毒液會導致出汗、流口水、肌肉痙攣、心率加快，還有呼吸困難。眾所周知，被漏斗網蜘蛛咬傷的人，可能會陷入昏迷，甚至呼吸衰竭死亡，但這種蜘蛛是澳大利亞東部的本土物種。」\n\n「還有巴西遊走蛛，生活在中南美洲。牠的神經毒性毒液非常強烈，會引發劇烈疼痛、肌肉失控，還有呼吸麻痺。在嚴重且未得到治療的情況下，也會發展為昏迷或死亡，尤其是體弱者，但絕不會快到這種程度。」\n\n「紅背蜘蛛和各種寡婦蜘蛛的毒液也極其可怕，被牠們咬傷，很少會讓人陷入昏迷，但可能引發癲癇、休克，甚至失去意識。」\n\n線索+1。\n\n「這聽起來既有趣，又可怕。」你說。\n\n貝爾韋瑟醫生聳了聳肩：「蜘蛛的這些特性，只是為了生存而進化來的，是自然選擇的結果。相比之下，我們對牠們的恐懼，其實有些被放大了。」\n\n你點了點頭，記下了她的話：「那我去告訴其他人，我們沒找到蜘蛛。」\n\n「我留在這裡繼續找。」她說。\n\n翻至173章。',
  f:{clue:1},c:[{l:'繼續',g:173}]};

D[64]={s:'manor',t:'你輕易就被這些恐怖的怪物制服了，但你還有意識。牠們從腹部的紡績器中吐出粘稠的蛛絲，將你緊緊纏住。當蛛絲裹住你的頭時，你甚至感到一絲解脫——終於不用再看那些蜘蛛蠕動的身體了。很快，你就被纏得動彈不得。\n\n像這樣被捆成一團，你被拖到樹上，倒掛著。血液漸漸湧向頭部，你越來越喘不過氣，胸腔被沉重的內臟壓迫著，最終失去了意識。所幸，你永遠不會知道自己的命運了，這或許是最好的結果。\n\n解鎖秘密線索：蜘蛛與飛蟲。遊戲結束。',
  f:{secret:'蜘蛛與飛蟲'},c:[{l:'結束',g:'END0'}]};

D[65]={s:'manor',t:'一本友好的金斯波特介紹手冊，將這裡描述為「一座古老而迷人的小鎮，海霧掩映著過去與現在」，著重描繪了這裡「淳樸的漁民」「古老的房屋」和「清新的海風」。\n\n《老金斯波特及其奇聞——海濱小鎮遊客指南》一書附有大量註釋，記錄了金斯波特從清教徒定居點，發展為繁榮的捕鯨和海上貿易中心的簡要歷史，其中有一整章介紹了這裡的港口，列出了鎮上的教堂和集會場所，更重要的是，還記錄了鎮上的小旅館和各類酒吧。\n\n你隨手翻著書，在書的末尾看到了一章名為《老金斯波特的傳說》的內容，這本書也從一本普通的遊客指南，變成了一本記錄超自然故事的典籍。其中有一個故事，講述了一位幽靈水手會在月升時分現身碼頭；還有一個故事，說的是那些在迷霧籠罩的小巷中夢遊的人，永遠無法被喚醒；還有「金斯波特唱詩班」——一種如同遠方吟唱的聲音，只有在冬至夜才能聽到。\n\n線索+1，若你想帶走這本書，在角色表中記錄物品[老金斯波特及其奇聞]。\n\n翻至110章。',
  f:{clue:1,item:'老金斯波特及其奇聞'},c:[{l:'繼續',g:110}]};

D[66]={s:'manor',t:'「別出去，」伊莎貝爾·哈考特拉住你的胳膊，「求你了。」\n\n你望向迷霧，霧氣濃得像一堵密不透風的牆，什麼也看不見。\n\n「危險就在這棟房子裡，」你告訴她，「不在外面。」\n\n「你根本不知道，」她語氣堅定地反駁，手攥得你的胳膊更緊了。\n\n若你想遷就她，留在屋裡，翻至156章。若你想堅持自己的想法，走進迷霧，翻至186章。',
  c:[{l:'遷就她，留在屋裡',g:156},{l:'堅持己見，走進迷霧',g:186}]};

D[67]={s:'manor',t:'「我不知道，」特倫霍姆答道，「我也不想知道。但他對蜘蛛極度痴迷，或許這就是金斯波特的人都對這地方敬而遠之的原因。我真希望自己也能離這裡遠遠的。」\n\n「你說他痴迷蜘蛛，是指收藏蜘蛛標本嗎？」\n\n「只要和蜘蛛有關的，他都痴迷。我們現在站在他的私人博物館裡，這裡的每一樣東西，都和蜘蛛有關。他和奧托還一起搜集關於蜘蛛的傳說和神話，他倆在一起，簡直是互相慫恿，越陷越深。當然，直到他們鬧翻為止。」\n\n「這麼說，他們以前是好朋友？」\n\n「可以說是最好的朋友，你懂我的意思。」\n\n「他們為什麼鬧翻？」\n\n「好像是因為伊萊賈偷了奧托的研究成果。」他神色陰沉地看著你，「但我還聽到過另一個傳言。」\n\n「什麼傳言？」\n\n「和一個儀式有關。據說這個儀式，是奧托在某份文獻中發現的，或是他翻譯的，總之是這麼回事。顯然，伊萊賈想親自嘗試——說白了，就是把儀式付諸實踐，但奧托覺得這太過分了。」\n\n「太過分？為什麼？」\n\n「就兩個字：血祭。」\n\n線索+1，厄運值+1。\n\n這位探險家不願再談及這個話題，但你可以問問他別的問題。',
  f:{clue:1,doom:1},c:[{l:'問特倫霍姆為哈考特做了什麼',g:97},
     {l:'問哈考特在給特倫霍姆的信裡寫了什麼',g:147},
     {l:'問他覺得是誰襲擊了瓦努姆教授',g:217},
     {l:'不想再追問這位探險家',g:257}]};

D[68]={s:'manor',t:'「解開他的衣領，」哈羅醫生吩咐道。你手抖著解開了教授的背心紐扣。\n\n就在你照做時，瓦努姆突然深吸一口氣，眼皮顫動著睜開了。\n\n「沒事的，」你看著他攥緊你的胳膊，眼珠不停轉動，安慰道，「你會沒事的，哈羅醫生在這兒。」\n\n教授的​​目光落在你身上，嘴唇動了動，似乎想說什麼。\n\n進行一次專注力測試：擲1顆骰子，加上你的智力值和意志力值。你可以消耗1點資源，擲2顆骰子並選取點數最高的那顆。測試結果如何？\n\n總點數10及以上，翻至189章。總點數9及以下，翻至169章。',
  c:[{l:'專注力測試（智力＋意志）',t:{a:'int',b:'wp',d:10,p:189,f:169,c:'res'}}]};

D[69]={s:'attic',t:'儘管眼前的一切恐怖至極，違背常理，讓你心神俱裂，但你還是努力保持著清醒。曾經的伊萊賈·哈考特化作怪物擋在你面前，諾特在你身後，伊莎貝爾·哈考特在你身邊啜泣，若想活著離開這裡，你必須立刻想出辦法。\n\n「我猜，這一切都是你安排的吧。」你怒聲說道。\n\n「這是我的工作，」諾特答道。\n\n你轉頭看向他，只見他蠟黃的臉上，綻開一抹令人作嘔的笑容。\n\n「管理傭人，確保宅邸和莊園的一切運轉順暢。」\n\n「你是說，這一切都是管家幹的？」伊莎貝爾尖叫道。\n\n「正是，」諾特答道，「我奉行的三個信條是：服務、管理、謹慎。」\n\n解鎖秘密線索：管家是兇手。\n\n進行一次推理測試：擲1顆骰子，加上你的智力值。你可以消耗1點線索，擲2顆骰子並選取點數最高的那顆。若你擁有能力{偵探}、{警察}或{機智}，點數+1。測試結果如何？\n\n總點數10及以上，翻至92章。總點數9及以下，翻至124章。',
  f:{secret:'管家是兇手'},c:[{l:'推理測試（智力）',t:{a:'int',d:10,p:92,f:124,plus:['偵探','機智'],c:'clue'}}]};

D[70]={s:'manor',t:'你有種不祥的預感，心裡惴惴不安。\n\n你快步跑回宅邸，途中踩進了地上的水窪，鞋子沾滿了污泥。\n\n理智值-1，若你尚未在角色表中記錄物品[髒鞋子]，現在記錄。\n\n你推開門，回到了屋裡。\n\n翻至202章。',
  f:{san:-1,item:'髒鞋子'},c:[{l:'繼續',g:202}]};

/* ---------- 71-80 ---------- */
D[71]={s:'attic',t:'你使出致命一擊，將化石毒牙狠狠刺進這隻恐怖怪物的身體。哈考特僅存的人性，讓牠發出一聲悽厲的尖叫。這隻畸形的怪物腿一軟，癱倒在閣樓的地板上，令人作嘔的液體從你造成的無數傷口中滲出。\n\n異界的蜘蛛們眼看就要衝破蛛網了，儘管哈考特已經被消滅，連接現實世界與夢境之地的傳送門，卻沒有絲毫關閉的跡象。但諾特說過，開啟傳送門的不是哈考特，而是那些沉睡者。\n\n若你想嘗試喚醒被蛛絲裹住的沉睡者，翻至53章。若你覺得明智的選擇是在巨型蜘蛛衝進閣樓前逃離，翻至29章。',
  c:[{l:'嘗試喚醒沉睡者',g:53},{l:'逃離',g:29}]};

D[72]={s:'manor',t:'想到上次踏出哈考特莊園的遭遇，你還確定要再一次直面這迷霧嗎？\n\n若你確定，翻至32章。若你不確定，翻至52章。',
  c:[{l:'確定，走進迷霧',g:32},{l:'不確定，留在屋內',g:52}]};

D[73]={s:'manor',t:'你仔細研究著這幅畫和上面的註解，很快便看清，這是一幅納斯卡線條的臨摹圖——納斯卡線條是秘魯南部納斯卡沙漠中，由七百多幅地面幾何圖形組成的巨型圖案。有些圖案長達上千英尺，而這幅畫描繪的，是一隻僅154英尺長的蜘蛛圖案。\n\n這實在令人驚嘆。這隻蜘蛛有著帶毒牙的頭胸部、圓滾滾的腹部，還有八條彎折的腿。你不禁感嘆，古人究竟是如何做到的？他們站在地面上，根本無法看清圖案的全貌，卻能在沙漠中畫出如此精準的蜘蛛。\n\n翻至170章。',
  c:[{l:'繼續',g:170}]};

D[74]={s:'manor',t:'你輕輕推開書櫃暗門，合頁發出嘎吱的聲響，你走進了門後的密室。奧托·瓦努姆早已被轉移到哈考特莊園的一間客房裡了。\n\n若你持有物品[扯破的袖子]，翻至58章。若未持有，但有[銀酒壺]，翻至16章。若上述物品均未持有，翻至188章。',
  c:[{l:'（持有扯破的袖子）',g:58,q:{item:'扯破的袖子'}},{l:'（持有銀酒壺）',g:16,q:{item:'銀酒壺'}},{l:'（無）',g:188}]};

D[75]={s:'spider',t:'天花板上爬滿了蜘蛛，黑壓壓的一片，遮住了枝形吊燈的光芒，也裹住了可憐的律師。眼前的景象，讓你本就備受折磨的理智，瀕臨崩潰。\n\n擲1顆骰子，若你擁有弱點{被詛咒}或{鬧鬼}，點數+1。\n\n若總點數小於或等於你的理智值，翻至60章。若總點數大於你的理智值，翻至42章。',
  c:[{l:'承受這一切',t:{mode:'san',d:0,p:60,f:42,minus:['被詛咒','鬧鬼']}}]};

D[76]={s:'manor',t:'特倫霍姆徑直走向酒水車，給自己倒了一大杯蘇格蘭威士忌，一飲而盡後，又立刻倒了第二杯。\n\n「你今晚喝得不少啊。」佩雷格林·沃德給自己倒了一杯白蘭地，隨口說道。\n\n「你去跟那位好教授說啊。」特倫霍姆怒氣沖沖地說。\n\n「我看他的問題，不在於喝酒。」\n\n「他人呢？」特倫霍姆環顧四周，發現屋裡只有你和律師陪著他。\n\n「我好像看到他去圖書館了。」沃德答道。\n\n哈考特莊園裡還有圖書館？\n\n若你想離開客廳，去找圖書館，翻至191章。若你也覺得口渴，想倒杯酒喝，翻至106章。',
  c:[{l:'離開客廳，去找圖書館',g:191},{l:'倒杯酒喝',g:106}]};

D[77]={s:'manor',t:'一陣令人尷尬的沉默籠罩著你們，你覺得必須說點什麼，打破這壓抑的氣氛。\n\n「你和你舅舅關係近嗎？」你帶著同情的語氣問道。\n\n「你為什麼這麼問？」她突然警惕起來。\n\n「我是說，他有自己的孩子嗎？」\n\n「沒有，伊萊賈舅舅不是那種會成家的人。」她發出一聲乾澀的笑，「我曾經以為，我們的關係很近。他是我僅剩的親人了，我……一直依賴著他。」\n\n你沒有再說話，讓伊莎貝爾繼續說下去。\n\n「說實話，我惹了點麻煩。我一直很喜歡馬——不是騎馬，你懂的——但伊萊賈舅舅的錢，總能幫我擺平一切，直到有一天，他不再幫我了。或許他是為了我好，想讓我戒掉賭馬的癮，但我覺得，他的初衷並非如此善良。」\n\n「你為什麼會這麼想？」你問道。\n\n「你看，」她說著，遞給你一封舅舅寫給她的信。\n\n你不由得接了過來，一字不落地讀完了整封信。\n\n「我親愛的伊莎貝爾：\n你看到這封信，想必會嗤之以鼻，或許會像對待我的建議、我的警告，甚至我的愛一樣，看都不看就扔在一邊。但我懇求你，為了你自己，也為了我，讀下去。\n你向來天資聰穎——頭腦敏銳、生性不羈，在說服別人方面，更是天賦異稟。但未經約束的天賦，終將引火燒身。我理解冒險帶來的快感，也知道一顆聰慧的頭腦，需要不斷的刺激。但幸運女神和賽馬從未眷顧過你，伊莎貝爾，可你卻一次次執迷不悟，以為它們終會給你救贖。不會的，永遠不會。\n儘管你滿身缺點、負債纍纍，還對變幻莫測的賭馬抱有不切實際的幻想，我卻從未放棄過你。我永遠不會放棄你，因為我知道你是誰，知道你注定要成為什麼樣的人。\n你不只是我的姪女，你是「門」。未來，將通過你降臨——它帶來的是美好，還是毀滅，只取決於你的門後，藏著什麼。這個身份，不是懲罰，也不是獎賞，而是必然，是命運。你被選中，不是因為你的美德，而是因為你的能力。即便是毀滅，也能成為容器，伊莎貝爾。\n你必須做好準備，屬於你的時刻即將到來，你必須付出你的一切。\n永遠愛你的舅舅\n伊萊賈」\n\n伊莎貝爾的自我剖析，再加上這封信的內容，讓你對眼前的一切，有了新的認識。線索+2。\n\n翻至96章。',
  f:{clue:2},c:[{l:'繼續',g:96}]};

D[78]={s:'spider',t:'蜘蛛們紛紛從你身上掉落到地上，四下逃竄，鑽進欄杆的縫隙裡、家具底下，或是爬回牆上，重新融入蛛群。\n\n但在驅趕牠們的過程中，你還是被咬傷了好幾口，疼得鑽心。\n\n擲1顆骰子，將點數除以2，小數部分向上取整，用你的生命值減去這個數字。\n\n翻至100章。',
  c:[{l:'承受傷害',t:{mode:'halfhp',d:0,p:100,f:100}}]};

D[79]={s:'manor',t:'「不過是些令人不快的爭執罷了，說到底，也沒什麼大不了的。況且，那些話，他早就當面跟我說過了。」\n\n若你想問問教授，他是不是在找什麼特定的東西，翻至243章。若你想問問瓦努姆，他認識伊萊賈·哈考特有多久了，翻至31章。若你不想再追問教授，翻至219章。',
  c:[{l:'問教授是不是在找什麼特定的東西',g:243},{l:'問他認識哈考特有多久了',g:31},{l:'不想再追問',g:219}]};

D[80]={s:'manor',t:'佩雷格林·沃德怒視著你，伊莎貝爾·哈考特則難以置信地瞪著你，顯然被你的話冒犯到了。\n\n「諾特？」她驚呼道，「從我記事起，他就是我舅舅的管家了。我願意把我的性命，把我們所有人的性命託付給他！」\n\n「自從今晚的一切開始失控，諾特就一直在盡力幫忙。」律師語氣嚴肅地說，「而且，他安排女傭把被咬的科拉·貝爾韋瑟抬上樓後，就一直待在樓下。」\n\n「其實，我看到特倫霍姆下樓去了廚房，」伊莎貝爾說，「沒過多久，他就和諾特一起回來了。」\n\n「但那是在我們發現瓦努姆教授遇襲之後。」你承認道，臉頰不由得發燙。\n\n「這麼說，兇手不可能是諾特。」沃德得意地說。\n\n智力值-1，解鎖秘密線索：無可置疑。\n\n「但這並不能改變一個事實——這棟房子裡，藏著一個瘋子，就站在我們眼前！」伊莎貝爾的聲音顫抖著。\n\n「沒事兒的，親愛的，」律師說著，扶她坐到椅子上，「待在這兒，我很快就回來。」\n\n說完，他便離開了客廳。\n\n你心裡清楚，若想弄清真相，找到刺傷瓦努姆教授的兇手，最好的辦法就是繼續探索哈考特莊園。但或許佩雷格林·沃德是對的，和伊莎貝爾待在客廳裡，才是更明智的選擇，畢竟，人多安全。\n\n若你想繼續探索宅邸，翻至57章。若你想留在客廳，翻至77章。',
  f:{int:-1,secret:'無可置疑'},c:[{l:'繼續探索宅邸',g:57},{l:'留在客廳',g:77}]};

/* ---------- 81-90 ---------- */
D[81]={s:'manor',t:'你踏進房間，注意到地毯上有什麼東西被蹭過。你蹲下身仔細一看，發現是一隻被踩死的蜘蛛，和咬傷伊萊賈·哈考特、科拉·貝爾韋瑟的那隻一模一樣，身上還能看到標誌性的猩紅紋路。\n\n你環顧四周，房間裡的一切都完好無損，沒有被翻動過的痕跡。你由此推斷，奧托·瓦努姆是在走進房間時遇襲的。或許他看到了這隻蜘蛛，在牠來得及像襲擊其他人一樣襲擊自己之前，一腳把牠踩死了。既然蜘蛛的襲擊計劃失敗了，兇手便不得不拿出化石毒牙，刺傷了教授。可究竟是誰，策劃了這一切？\n\n顯然，瓦努姆教授知道這間密室的存在，也有進入這裡的理由。但他的理由是什麼？\n\n線索+1，解鎖秘密線索：書櫃之後。\n\n翻至188章。',
  f:{clue:1,secret:'書櫃之後'},c:[{l:'繼續',g:188}]};

D[82]={s:'attic',t:'今夜是秋分，陰陽兩界的隔閡變得無比稀薄，現實的脆弱屏障，會被更高維度的非歐幾何撕裂、重塑。換句話說，今夜，魔法之力無處不在！\n\n但你打算用何種魔法，來阻止哈考特和這些蜘蛛？',
  c:[{l:'（持有海波里亞的異教秘典）',g:237,q:{item:'海波里亞的異教秘典'}},
     {l:'（持有夢遊者之路）',g:254,q:{item:'夢遊者之路'}},
     {l:'（擁有能力：巫術）',g:297,q:{ab:['巫術']}},
     {l:'上述條件均不滿足',g:109}]};

D[83]={s:'manor',t:'「路德？」沃德驚呼道，顯然十分震驚，卻還是努力壓低聲音，「他可是宣過誓，要救死扶傷、絕不傷人的醫生啊！」\n\n伊莎貝爾捂住嘴，一臉驚愕：「你為什麼會這麼說？」\n\n「我趕到時，他也正好出現在現場。」你答道。\n\n「那你又是怎麼這麼快趕到的？」沃德反唇相譏。\n\n厄運值+1，解鎖秘密線索：受到懷疑。\n\n翻至277章。',
  f:{doom:1,secret:'受到懷疑'},c:[{l:'繼續',g:277}]};

D[84]={s:'attic',t:'這些女傭早已不再是純粹的人類，卻擁有超越人類的力量。她們的瘋狂攻擊，讓你節節敗退，渾身是傷，青一塊紫一塊。生命值-1。\n\n就在這時，伊莎貝爾挺身而出，加入了戰鬥。眼前的種種恐怖，讓這個年輕姑娘的內心，爆發出了鋼鐵般的意志，她誓死不屈。\n\n她不知從哪裡找來一根斷椅腿，握在手中，和你並肩作戰。你們重新鼓起勇氣，開始反擊這些非人的女傭。\n\n翻至238章。',
  f:{hp:-1},c:[{l:'繼續',g:238}]};

D[85]={s:'manor',t:'「他被刺傷了！」哈羅醫生將胖教授翻了個身，驚呼道。你能看到，教授的襯衫前襟被鮮血浸透，連粗花呢背心都染上了血漬。\n\n「用什麼刺的？」特倫霍姆氣喘吁吁地問。\n\n你環顧四周，目光落在一根彎曲的石製尖刺上，尖刺大約一英尺長，頂端還沾著血跡。\n\n「就是這個。」你撿起尖刺說道。\n\n哈羅醫生難以置信地盯著這把簡易的凶器：「這是什麼東西？」\n\n「我知道，」特倫霍姆說，「它以前一直擺在哈考特的私人博物館裡，是鎮館之寶之一。」\n\n「這到底是什麼？」你問道。\n\n「一根化石毒牙。」\n\n「什麼生物的？」\n\n「我說出來，你肯定不信。」特倫霍姆答道。\n\n「你說說看。」\n\n「一隻蜘蛛的。」\n\n「胡說八道！哪有這麼大的蜘蛛！」哈羅醫生驚呼道。\n\n你的目光從手中的化石毒牙，移到了瓦努姆教授身上。在角色表中記錄物品[化石毒牙]，資源+1。\n\n「他還活著嗎？」你問道。\n\n「活著，」醫生答道，「但我不知道他還能撐多久。我得仔細檢查一下他的傷口，你能幫我把他移開嗎？」\n\n你和哈羅醫生小心翼翼地將教授的身體，從敞開的暗門旁挪開。\n\n「我要求的醫護人員呢？怎麼還沒來？」他厲聲質問道，「快去叫諾特！」\n\n「我去！」特倫霍姆說著，朝樓下的大廳狂奔而去，一步跨兩級台階。\n\n而你，打算做什麼？',
  f:{item:'化石毒牙',res:1},c:[{l:'主動幫忙，協助哈羅醫生救治瓦努姆',g:68},
     {l:'看看書櫃暗門後藏著什麼',g:116},
     {l:'探查哈考特的私人博物館',g:142},
     {l:'下樓，把這件事告訴其他人',g:233}]};

D[86]={s:'attic',t:'就在你自顧不暇之際，洞穴裡的蜘蛛們已經衝到了蛛網傳送門前，兩隻蜘蛛從蛛絲的縫隙中擠了進來。牠們的腹部圓滾滾的，呈慘白的肉色，腿則像巨大的黑色多節荊棘。\n\n這些恐怖的怪物，在你和伊莎貝爾來得及逃跑前，就朝你們撲了過來。牠們用毒牙咬穿你們的皮膚，將毒液注入血液，制服了你們，隨後用鋒利的腿，將你們撕成了碎片。\n\n你或許阻止了諾特將你獻祭，阻止了他的主人完成蛻變，但這座蜘蛛之屋，還是又多了兩名犧牲者。\n\n解鎖秘密線索：冷原的蜘蛛。最終評分：0星。遊戲結束。',
  f:{secret:'冷原的蜘蛛'},c:[{l:'結束',g:'END0'}]};

D[87]={s:'manor',t:'你懶得走車道，徑直穿過草坪，朝宅邸狂奔而去，一次也不敢回頭。即便安全回到了莊園裡，特倫霍姆嘴裡鑽出蜘蛛的畫面，也在你腦海中揮之不去。\n\n若你尚未在角色表中記錄物品[髒鞋子]，現在記錄；若你尚未擁有弱點{鬧鬼}，則解鎖該弱點。\n\n翻至202章。',
  f:{item:'髒鞋子',wk:'鬧鬼'},c:[{l:'繼續',g:202}]};

D[88]={s:'manor',t:'你走進房間，第一眼就看到四柱床的被子下，鼓著一個巨大的包。你愣了片刻，才意識到那是伊萊賈·哈考特，他的身體已經腫得不成樣子。\n\n你小心翼翼地走近床邊，探出頭看向哈考特的臉，他的臉呈深紫色，腫得可怕，像是嚴重的過敏反應。嘴唇腫得像兩隻肥碩的黑蛞蝓，臉頰也一直鼓著，眼睛腫得睜不開，但你能確定，他還活著，只是陷入了昏迷。他的呼吸粗重而急促，好在還有呼吸。\n\n床頭燈旁的床頭櫃上，放著一個空藥瓶，你猜是哈羅醫生留下的，你肯定是剛和他擦肩而過。藥瓶裡空空如也。\n\n眼前的景象，讓你內心受到了巨大的衝擊。理智值-1，厄運值+1。\n\n你實在無法理解，情況都這麼危急了，竟然沒有傭人在房間裡照顧他。\n\n事已至此，你只有一個簡單的選擇。\n\n若你想搜查房間尋找線索，翻至28章。若你想立刻離開房間，或許是去為伊萊賈·哈考特尋求幫助，翻至7章。',
  f:{san:-1,doom:1},c:[{l:'搜查房間尋找線索',g:28},{l:'立刻離開房間，去尋求幫助',g:7}]};

D[89]={s:'manor',t:'「你覺得是瓦努姆自己刺傷了自己？」沃德驚呼道，「就算從物理角度來說有可能，他為什麼要這麼做？」\n\n「他今晚一直心神不寧的。」伊莎貝爾指出。\n\n「但他也不至於自殺啊！」沃德厲聲說道，「我們今晚誰不是壓力山大？」\n\n「但自從和我舅舅鬧翻後，他就一直鬱鬱寡歡，情緒低落到了極點。」伊莎貝爾堅持道，「他們到底為什麼鬧翻？」\n\n「我不知道。」律師慌忙答道。\n\n「如果不是他自己傷了自己，」伊莎貝爾的臉色沉了下來，「那我們就不得不面對一個事實——這棟房子裡，還有其他人想害他。」\n\n「沒事兒的，親愛的，」律師說著，扶她坐到椅子上，「待在這兒，我很快就回來。」\n\n說完，他便離開了客廳。\n\n你心裡清楚，若想弄清真相，找到刺傷瓦努姆教授的兇手，最好的辦法就是繼續探索哈考特莊園。但或許佩雷格林·沃德是對的，和伊莎貝爾待在客廳裡，才是更明智的選擇，畢竟人多安全。\n\n想繼續探索宅邸：翻至57章。想留在客廳：翻至77章。',
  c:[{l:'繼續探索宅邸',g:57},{l:'留在客廳',g:77}]};

D[90]={s:'manor',t:'《夢遊者之路》是一本淡皮面的薄冊，書中文字支離破碎，夾雜著晦澀的指令、夢境幻象的描述和哲學式的沉思。佚名作者稱，書中部分段落譯自更古老的夢境手稿。\n\n這本書提出，夢遊並非病症，而是靈魂竭力前往幻夢境的表現，而這只是踏上這條路的第一步。書中記載了呼吸練習、象徵性的手勢，還有更詭異的方式——低語召喚，據說這些能弱化肉體與入夢靈魂之間的聯結。部分段落甚至建議使用鴉片酊這類麻醉劑，以達到踏入這條路下一步所需的狀態。作者將幻夢境描繪成現實世界的倒影，而非虛幻的國度——這裡更變幻莫測、危機四伏，卻也是隱秘知識的源頭。\n\n線索+1，若你想帶走這本書，在角色表中記錄物品[夢遊者之路]。\n\n翻至110章。',
  f:{clue:1,item:'夢遊者之路'},c:[{l:'繼續',g:110}]};

/* ---------- 91-100 ---------- */
D[91]={s:'manor',t:'推開正門，你發現宅邸被濃重的迷霧籠罩，金斯波特那出了名的天氣又一次降臨。事實上，霧氣濃得讓你幾乎看不清台階下的碎石車道，連車道兩旁的紅楓林都徹底隱沒在霧中。\n\n若持有物品[髒鞋子]：翻至72章。若未持有：翻至32章。',
  c:[{l:'（持有髒鞋子）',g:72,q:{item:'髒鞋子'}},{l:'（無）',g:32}]};

D[92]={s:'attic',t:'「你的意思是，你是受他人指使行事？」你說道。\n\n「我為哈考特先生服務了三十三年，」諾特答道，「我活著就是為了侍奉他。」\n\n三十三年？比許多婚姻的時長都要久。\n\n「那你為什麼要傷害他？」伊莎貝爾質問道，眼前接連不斷的恐怖景象，讓她幾乎難以保持鎮定，心智瀕臨崩潰。\n\n「這從一開始就是哈考特的計劃，」你恍然大悟，對她說，「這就是他在這個特別的夜晚，邀請所有人來這裡的原因。」\n\n「秋分之日，」諾特說，「光明與黑暗的交界點，一個象徵轉變的時刻，此時兩界之間的帷幕會變得稀薄。」\n\n兩界帷幕漸薄，管家的話在你腦海中迴盪，你望向巨網之外那片不可思議的洞穴，開始明白眼前正在發生的一切。\n\n智力+1，線索+1，解鎖秘密線索：管家並非真兇。\n\n翻至124章。',
  f:{int:1,clue:1,secret:'管家並非真兇'},c:[{l:'繼續',g:124}]};

D[93]={s:'manor',t:'你不知道自己為何被召至哈考特莊園，也無意探尋答案。穿過大廳走向正門，你轉動把手推開門，卻被突然擋在你身前的管家諾特猛地關上。\n\n「你想去哪裡？」他低吼道。\n\n「我要離開。」你斷然說道，再次去擰門把手。\n\n「哈考特先生邀請你來是有原因的，」管家的眼神和語氣一樣冰冷，「你不想知道原因嗎？」\n\n諾特的話勾起了你天生的好奇心，這裡無疑藏著一個待解的謎團，但你很不喜歡他此刻的態度。\n\n你鬆開了門把手。\n\n「不如這樣，在哈羅醫生為哈考特先生檢查期間，你去客廳喝杯酒稍作等候？」諾特建議道，他垂眸看著地面，似乎想起了自己的身份，也記著你是客人。\n\n線索+1，意志力-1。\n\n翻至173章。',
  f:{clue:1,wp:-1},c:[{l:'繼續',g:173}]};

D[94]={s:'manor',t:'你沿著走廊平台往前走，經過一處壁龕，壁龕裡擺著一個書櫃和一把閱讀椅，椅旁的朝東窗戶正對著莊園的庭院，你的目光被天花板上懸掛的華麗枝形吊燈吸引。\n\n吊燈的燈泡散發著微弱的光芒，燈光在斑駁的天花板上投下的吊燈陰影，讓你不由得想起一隻攀附在天花板上的巨型蜘蛛。理智值-1。\n\n翻至62章。',
  f:{san:-1},c:[{l:'繼續',g:62}]};

D[95]={s:'manor',t:'這圖案讓你想到交錯的蛛網，只是每一張網都是一座迷宮，你甚至不敢想像，若順著這些詭異的迷宮走到中心，會抵達何處。理智值-1。\n\n你被地毯經緯交織出的幻象吸引，幾乎錯過了書桌旁的[空玻璃罐]。你撿起罐子，發現裡面空空如也，瓶蓋就掉在旁邊。\n\n會不會是有人故意把蜘蛛放出來的？厄運值+1。\n\n若想保留這只[空玻璃罐]，在角色表中記錄。翻至289章。',
  f:{san:-1,doom:1,item:'空玻璃罐'},c:[{l:'繼續',g:289}]};

D[96]={s:'spider',t:'一聲突如其來的叫喊傳來，你立刻行動起來，循著聲音衝向宅邸的中央樓梯，眼前的景象讓你驚恐到不敢相信——佩雷格林·沃德竟被吊在天花板最高處的枝形吊燈上。\n\n無數粘稠的蛛絲纏繞著他，這些蛛絲由覆蓋在吊燈、吊燈鏈條和斑駁天花板上的蛛群不斷吐出。你從未見過這樣的景象，蜘蛛蜂擁而至，覆蓋了一切，入目皆是一團蠕動的黑毛軀體，像起伏的地毯般移動。\n\n伊莎貝爾·哈考特、霍勒斯·特倫霍姆和哈羅醫生也先後趕來，一人啜泣，一人滿心厭惡地呻吟，一人目瞪口呆地沉默，一同看著這恐怖的一幕。\n\n你僵在原地，眼前的駭人景象讓你動彈不得。蜘蛛順著蛛絲爬下，爬滿了沃德的全身，很快，你便幾乎看不到蛛群下的他，只能聽到他愈發絕望的尖叫。理智值-1。\n\n有什麼東西突然從蛛群中掉落，砸在你腳邊——是佩雷格林·沃德的眼鏡。在角色表中記錄物品[夾鼻眼鏡]。\n\n若擁有弱點{恐蛛症}或{懼蟲症}：翻至75章。若未擁有：翻至60章。',
  f:{san:-1,item:'夾鼻眼鏡'},c:[{l:'（擁有恐蛛症或懼蟲症）',g:75,q:{wk:['恐蛛症','懼蟲症']}},{l:'（未擁有）',g:60}]};

D[97]={s:'manor',t:'「這些東西大多是我為他找來的。」特倫霍姆揮手指著玻璃展櫃說道。\n\n這裡擺滿了來自世界各地的文物——從巴西到緬甸，途經西非和希臘，遍佈各個角落。展櫃裡甚至有一件墨西哥惠喬爾人的紗線畫，旁邊還擺著一幅拉斐爾前派風格的畫作，畫中是亞瑟王傳說中聲名狼藉的女巫摩根勒菲，她的斗篷被繪成絲綢蛛網的模樣。\n\n似乎數千年來，世界上每個主要文明都以某種形式崇拜著蜘蛛。\n\n「我早就想擺脫這東西了。」他指著一根來自海地的、刻有蜘蛛神安納西的敘事手杖說道，又喝了一大口破舊酒壺裡的酒。\n\n「資助這麼多探險活動，一定花了不少錢吧。」你說。\n\n「確實，他還欠著我上一次探險的費用。」\n\n「上一次是找什麼？」你問道。\n\n「哦，那件東西沒展出，在我這兒。」他拍了拍肩上的挎包，「但他不付錢，就別想拿到。不過說實話，我現在都不確定他還能不能付錢了。我或許該再跟佩雷格林說說，雖說我壓根信不過他。」\n\n線索+1。',
  f:{clue:1},c:[{l:'問哈考特在給特倫霍姆的信中寫了什麼',g:147},
     {l:'問他覺得是誰襲擊了瓦努姆教授',g:217},
     {l:'不想再追問特倫霍姆',g:257}]};

D[98]={s:'spider',t:'你強行衝進房間，跪在貝爾韋瑟醫生身邊，擦去她額頭上的汗水，輕聲安慰她沒事的，你就在身邊，她並不孤單。\n\n她動了動，嘴唇微張，發出含糊不清的囈語。\n\n「抱歉，你說什麼？」你柔聲問道。\n\n這位蛛形動物學家的臉因疼痛皺成一團，發出一聲沮喪的嘆息，接著深吸一口氣，再次嘗試說話，可你依舊聽不清她在說什麼。\n\n那聲音聽起來有點像：「奧托在恐怖之物中見過這樣的徵兆。」但也可能是：「我們早該從霍勒斯身上看出這樣的罪孽。」又或者，只是：「我們早該從恐怖之物中看出這樣的徵兆。」\n\n無論真相如何，她想表達什麼？\n\n突然有人大喊：「小心！」所有人都四散躲避。\n\n你轉頭看去，只見一個黑影邁著八條腿朝你爬來，你幾乎來不及反應，霍勒斯·特倫霍姆就衝進了書房，手裡似乎拿著一個玻璃罐。\n\n他幾乎是撲到了你腳邊，玻璃罐撞在地上發出碎裂聲，可下一秒他站起身時，罐子裡竟困住了一隻可怖的蛛形生物，瓶蓋被擰得嚴嚴實實，這隻蜘蛛的體型至少有四英吋寬。\n\n牠圓滾滾的黑色軀體上，佈滿了詭異的、類似羅夏墨跡測驗的猩紅骷髏紋路，眼睛則是無數閃閃發光的黑珍珠，巨大的顎部上，兩根針狀毒牙的尖端各掛著一滴透明的液體。\n\n翻至244章。',
  c:[{l:'繼續',g:244}]};

D[99]={s:'study',t:'你在吸墨紙的一角下，發現了一張撕下來的碎紙，上面是伊萊賈·哈考特的筆跡，寫著七個名字，而名單上的所有人，今晚都出現在了這裡，包括你！你不知道這張紙為什麼會出現在這裡，也不清楚它的意義，但還是決定留著，以防萬一。\n\n線索+1，在角色表中記錄物品[名單]。\n\n翻至289章。',
  f:{clue:1,item:'名單'},c:[{l:'繼續',g:289}]};

D[100]={s:'spider',t:'就在你奮力擺脫身上蜘蛛的同時，其餘的蛛群已經將沃德拖到了天花板上。你束手無策地看著，這位律師漸漸沒了聲息，身體癱軟下去，最終被翻湧的黑毛軀體徹底吞噬。隨後，蛛群開始朝著昏光中可見的一個洞口移動，天花板的石膏碎裂後，能看到內部裸露的木筋。\n\n蜘蛛帶著沃德鑽進了洞口，直到樓梯間裡再也看不到一隻八腳的恐怖生物。\n\n厄運值+2，解鎖秘密線索：八腳怪物。\n\n翻至118章。',
  f:{doom:2,secret:'八腳怪物'},c:[{l:'繼續',g:118}]};

/* ---------- 101-110 ---------- */
D[101]={s:'manor',t:'你將這件文物舉在身前，看到那些恐怖的生物竟本能地後退，憤怒的嘶嘶聲在你周圍迴盪，這些怪物開始快步逃竄。\n\n你沒有停留，生怕牠們回過神來再次逼近，立刻朝宅邸飛奔而去。但與這些巨型蜘蛛怪的近距離接觸，讓你心神俱裂。不僅如此，這次莊園之行還讓你的鞋子沾滿了污泥。理智值-1，若尚未記錄物品[髒鞋子]，現在在角色表中記錄。\n\n你終於回到了正門的台階前，那些生物早已退回紅楓林中的蛛網裡。推開門，你回到了宅邸內。\n\n翻至282章。',
  f:{san:-1,item:'髒鞋子'},c:[{l:'繼續',g:282}]};

D[102]={s:'manor',t:'你沿著車道出發，遠離宅邸。\n\n是你的錯覺嗎？那無處不在的迷霧，似乎正在漸漸散去；又或許，是因為月亮已經升起來了。但無論原因是什麼，你現在能更清晰地看到紅楓林了。\n\n你還看到，楓林被厚厚的蛛網覆蓋，彷彿數千隻蜘蛛正忙著織就粘稠的羅網，設下陷阱捕捉飛蛾和其他毫無防備的昆蟲。\n\n藉著朦朧的月光，你透過蛛網看到了一個模糊的身影，眼前的景象讓你嚇得喉嚨發緊。\n\n想靠近被蛛網覆蓋的樹木：翻至229章。想返回宅邸：翻至70章。',
  c:[{l:'靠近被蛛網覆蓋的樹木',g:229},{l:'返回宅邸',g:70}]};

D[103]={s:'attic',t:'你決心完成自己開啟的戰鬥，但必須速戰速決，以防對方的援兵到來。\n\n每一輪戰鬥開始前，可消耗1點資源，為本輪總點數+2。\n\n第一輪：擲2顆骰子+戰鬥值；擁有{戰士}/{堅定}能力，點數+1；擁有{恐蛛症}/{謹慎}弱點，點數-1。總點數≥10。\n第二輪：擲2顆骰子+戰鬥值；擁有{堅韌}能力，點數+1；若贏得第一輪，點數+1；擁有{恐蛛症}弱點，點數-1。總點數≥11。\n第三輪：擲2顆骰子+戰鬥值；擁有{倖存者}能力，點數+1；若贏得第二輪，點數+2；擁有{恐蛛症}弱點，點數-1。總點數≥12。\n\n贏得兩輪及以上：翻至71章。輸掉兩輪及以上：翻至86章。',
  c:[{l:'戰鬥（三輪）',t:{battle:[{a:'com',d:10,plus:['戰士','堅定'],minus:['恐蛛症','謹慎']},{a:'com',d:11,plus:['堅韌'],minus:['恐蛛症'],winBonus:1},{a:'com',d:12,plus:['倖存者'],minus:['恐蛛症'],winBonus:2,prevBonus:2}],p:71,f:86,c:'res'}}]};

D[104]={s:'manor',t:'「瓦努姆教授遇襲時，你在哪裡？」你質問這位年輕的姑娘。\n\n她難以置信地瞪著你，還沒來得及開口表達不滿，佩雷格林·沃德就站出來為她辯解：「她一直和我待在客廳裡。」\n\n「沒錯。」伊莎貝爾的聲音幾乎要哭出來。\n\n你看看她，又看看沃德：「這麼說，你們互相為對方做不在場證明。」\n\n「是又怎樣。」沃德低吼道，「那你呢？奧托遇刺時，你在哪裡？」\n\n智力值-1，解鎖秘密線索：頭號嫌疑人。\n\n翻至277章。',
  f:{int:-1,secret:'頭號嫌疑人'},c:[{l:'繼續',g:277}]};

D[105]={s:'manor',t:'「那特倫霍姆呢？」你壓低聲音說道。\n\n「霍勒斯？」伊莎貝爾驚呼道。\n\n律師立刻示意她噤聲，轉頭問你：「你為什麼會懷疑他？」\n\n「哈羅醫生和我趕到現場時，他也很快就到了。」你解釋道。\n\n「那醫生是從哪裡冒出來的？」\n\n「我猜，他當時正在照顧哈考特先生。」\n\n「那憑什麼不能是哈羅醫生幹的？」沃德反問道，「或者是你？」\n\n「科拉被咬後，你們有人見過特倫霍姆嗎？」你問道。\n\n「見過，」律師答道，「他進來和我一起喝了一大杯蘇格蘭威士忌，沒多久，伊莎貝爾就從大廳過來和我們匯合了。」\n\n「沒錯，」伊莎貝爾附和道，「但後來他就走了，你不記得了嗎？」\n\n「確實。」\n\n「你們知道他去了哪裡嗎？」你問道。\n\n兩人交換的眼神，已經給出了答案。\n\n「這麼說，有可能是特倫霍姆！」\n\n伊莎貝爾驚恐地叫出聲，癱坐在椅子上，雙手抱頭。\n\n「沒事兒的，親愛的。」律師拍著她的肩膀安慰道，「待在這兒，我很快就回來。」\n\n說完，他便離開了客廳。\n\n你心裡清楚，若想弄清真相，找到刺傷瓦努姆教授的兇手，最好的辦法就是繼續探索哈考特莊園。但或許佩雷格林·沃德是對的，和伊莎貝爾待在客廳裡，才是更明智的選擇，畢竟人多安全。\n\n想繼續探索宅邸：翻至57章。想留在客廳：翻至77章。',
  c:[{l:'繼續探索宅邸',g:57},{l:'留在客廳',g:77}]};

D[106]={s:'manor',t:'佩雷格林·沃德為你倒了一杯酒，你接過酒杯，一飲而盡，白蘭地的灼燒感直抵胃裡。資源+1；但如果這不是你今晚喝的第一杯酒，戰鬥值-1。\n\n就在這時，你注意到了那封寫給科拉·貝爾韋瑟醫生的信，顯然是剛才所有人都衝回書房查看她的情況時，諾特慌亂中落下的。而那隻咬了她的死蜘蛛，此刻就在你口袋裡的[標本滿罐]中。\n\n特倫霍姆也注意到了這封信：「我們應該打開看看。」\n\n「不行。」沃德態度堅決，「這是寫給貝爾韋瑟醫生的私人信件，必須等她恢復意識後，由她自己打開。」\n\n「你是說，萬一她醒不過來呢？」\n\n「就是這個意思。」\n\n「那這封信可能永遠都不會被打開了。」\n\n想趁兩人爭執時搶走信件並打開：翻至136章。認為佩雷格林·沃德說得對，信件應保持密封：翻至166章。',
  f:{res:1},c:[{l:'趁兩人爭執時搶走信件並打開',g:136},{l:'認為沃德說得對，信件應保持密封',g:166}]};

D[107]={s:'manor',t:'諾特突然出現在客廳門口，朝你招手。你留下伊莎貝爾照看哈羅醫生，穿過房間，走到站在走廊裡的管家身邊。\n\n「救援人員快到了嗎？」你走近問道。\n\n「我有一個極其糟糕的消息。」他低聲說道。\n\n「有話直說！」\n\n「我剛又嘗試聯繫他們，可是……」他话音頓住，臉上露出痛苦的神情。\n\n「怎麼了？」你追問。\n\n「發生什麼事了？出什麼事了？」伊莎貝爾突然走到你身邊，「是我舅舅嗎？」\n\n「諾特正要告訴我一件重要的事。」你對她說，接著轉頭看向管家，「說啊，是什麼讓你啞口無言？」\n\n「有人把電話線從牆上扯下來了。」管家垂眸看著地面，彷彿十分羞愧。\n\n一陣推拉窗被推開的聲音傳來，你轉頭看到哈羅醫生站在敞開的窗邊，客廳裡的溫度驟然下降。\n\n「醫生，你在做什麼？」伊莎貝爾驚呼道。\n\n「我熱得難受。」哈羅沒有回頭，「我需要點新鮮空氣。」\n\n這位醫生在窗邊站了片刻，發出一聲解脫的長嘆，緊接著，一眨眼的功夫，他就消失了。\n\n你僵在原地，驚愕地盯著窗外繚繞的迷霧，一股極致的恐懼席捲全身——因為有什麼長長的、灰色的東西，纏上了醫生的軀幹，不止一個，將他捲出了窗外。\n\n伊莎貝爾到了嘴邊的尖叫嚥了回去，這讓你猛然回過神來，立刻衝過去猛地關上窗戶。關窗的瞬間，你注意到地上有一顆紐扣，便撿了起來——一定是從哈羅的襯衫上掉下來的。在角色表中記錄物品[襯衫紐扣]，厄運值+2。\n\n「你看到了嗎？」伊莎貝爾用緊繃的氣聲低語，「你看到是什麼把他抓走了嗎？我們必須救他！」\n\n「我有樣東西必須先給你看。」管家的聲音只有一絲顫抖，「而且必須讓你親眼看到，我光說是沒用的。快，跟我來。」\n\n想答應跟諾特走：翻至269章。不想跟他走：翻至235章。',
  f:{item:'襯衫紐扣',doom:2},c:[{l:'答應跟諾特走',g:269},{l:'不想跟他走',g:235}]};

D[108]={s:'manor',t:'女傭匆匆離開，你用餘光瞥見，她並非沿著走廊平台快步走，而是貼在牆上爬行，手腳向身體兩側張開，活脫脫一隻穿著衣服的巨型蜘蛛，這景象令人毛骨悚然。\n\n你震驚地猛地轉頭，卻只看到那位年輕的姑娘又恢復了正常，用兩條腿沿著走廊平台快步走著，不再攀附在牆上。\n\n理智值-1，解鎖秘密線索：蜘蛛女。\n\n翻至96章。',
  f:{san:-1,secret:'蜘蛛女'},c:[{l:'繼續',g:96}]};

D[109]={s:'attic',t:'你聽到一陣類似手杖不斷敲擊地板的聲音，那隻哈考特蜘蛛怪正穿過閣樓朝你走來。厄運值+2。\n\n想轉身逃跑：翻至126章。想正面迎戰：翻至135章。',
  f:{doom:2},c:[{l:'轉身逃跑',g:126},{l:'正面迎戰',g:135}]};

D[110]={s:'manor',t:'你突然聽到一陣令人不安的聲響，從房間的北側傳來，聽起來像是什麼東西在抓撓窗戶，彷彿想闖進來。\n\n想前去查看：翻至121章。不想查看：翻至145章。',
  c:[{l:'前去查看',g:121},{l:'不想查看',g:145}]};

D[111]={s:'study',t:'科拉·貝爾韋瑟的尖叫聲，比你在書房裡看到的景象更讓你心驚。\n\n書房裡光線昏暗，唯一的光源是一張巨大的爪足桃花心木書桌旁的鐵藝燈，書桌佔據了房間的中心位置，壁爐裡沒有生火。\n\n一名穿著酒紅色吸煙裝的男子癱倒在書桌上，鬢角的頭髮已經花白，身體以一種不自然的姿態蜷縮著。厄運值+1。\n\n「舅舅！」伊莎貝爾·哈考特大喊著衝上前，卻被律師攔住。\n\n「伊萊賈？」奧托·瓦努姆教授震驚地低語。\n\n「大家都退後。」哈羅醫生命令道，一邊將所有人擋在外面，一邊走近那具軀體。\n\n你幾乎沒注意到書房的牆上排滿了書架，也沒看到架上擺放的各類稀奇物件。但當醫生探查男子脖頸的脈搏時，你不由得注意到，鐵藝燈的光線之下，吸墨紙中央整齊地擺著一疊信，呈扇形展開，一共七封。\n\n「他還活著。」哈羅醫生宣佈道，空氣中的緊張感驟然消散。\n\n「他怎麼了？」瓦努姆教授問道，「心臟病發作？中風？」\n\n「在我做全面檢查之前，還無法確定。」哈羅答道，「我們得把他挪到別的地方，讓他躺下來。諾特？」\n\n管家立刻快步上前：「在，哈羅醫生？」\n\n「來幫我抬他一下，好嗎？」\n\n「好的，醫生，當然。」\n\n「我也來幫忙。」特倫霍姆主動說道。\n\n哈羅小心翼翼地將昏迷的伊萊賈·哈考特扶回椅子上，接著將帶滾輪的椅子從書桌旁推開。就在諾特和特倫霍姆準備一人抬腳、一人抬胳膊將他抬走時，哈羅突然說道：「等一下，這是什麼？」\n\n所有人都看到了醫生發現的東西——男子的脖頸下方、下巴處，皮膚又紅又腫。\n\n「看起來像是咬傷。」哈羅湊近查看，「有明顯的靶心狀傷痕。」\n\n「這是什麼意思？」伊莎貝爾問道。\n\n「傷口中心几乎是紫色的，周圍有一圈白色，最外層則是紅腫的紅色。」\n\n「是蜘蛛咬傷？」站在書房門口的貝爾韋瑟醫生猜測道。\n\n「有可能，」醫生沉吟道，「非常有可能。」\n\n「這能解釋他現在的狀態嗎？」沃德問道。\n\n還沒等哈羅給出醫學診斷，這位蛛形動物學家就搶先答道：「當然能。如果是蜘蛛咬傷，那蜘蛛的毒液可能讓他陷入了昏迷，但這意味著傷人的蜘蛛並非新英格蘭的本土物種。」\n\n「那我們必須立刻送他去醫院。」哈羅醫生說，「我手頭的醫療包，在這裡能做的實在有限。」\n\n「我馬上去打電話叫救護車。」管家說完，立刻匆匆離開了書房。\n\n「我們得先找個地方讓伊萊賈舒服點。」哈羅說。\n\n「去他的臥室吧？」伊莎貝爾提議道。\n\n「好，當然。」\n\n「那蜘蛛呢？」貝爾韋瑟醫生走進書房，蹲下身子查看書桌下方，你不由得後頸發麻，「咬了他的蜘蛛，肯定還在這個房間裡。」\n\n「那我可不去裡面。」瓦努姆教授站在書房外，不肯進去。\n\n你想做什麼？',
  f:{doom:1},c:[{l:'協助哈羅和特倫霍姆將伊萊賈抬去臥室',g:23},
     {l:'和瓦努姆教授一起待在書房外',g:123},

D[112]={s:'manor',t:'「不過是些令人不快的爭執罷了，說到底，也沒什麼大不了的。況且，那些話，他早就當面跟我說過了。」\n\n翻至129章。',
  c:[{l:'繼續',g:129}]};

D[113]={s:'attic',t:'變形後的哈考特，邁著半人半蛛的詭異肢體，退回到巨網中央，雖受了傷，卻並未被擊敗。這或許是你徹底解決牠的機會，也可能是你逃離的契機。\n\n透過蛛絲繩索圍成的傳送門，你能看到洞穴裡的蜘蛛黑影正朝著巨網移動，無論牠們是什麼，顯然已經察覺到了你的存在，正趕來支援牠們女王的選中者。\n\n想繼續與變形後的哈考特戰鬥：翻至103章。想看看自己是否有能快速解決牠的物品：翻至197章。想嘗試用魔法對抗這隻恐怖生物：翻至82章。想喚醒沉睡者：翻至132章。想趁機逃離宅邸：翻至176章。想穿過蛛網，逃進另一邊的異界洞穴：翻至18章。',
  c:[{l:'繼續與變形後的哈考特戰鬥',g:103},
     {l:'看看自己是否有能快速解決牠的物品',g:197},

D[114]={s:'manor',t:'你的左側，穿過一處小前廳，是一扇光亮的胡桃木門，門上標著「博物館」的字樣；正前方是閱讀角，書櫃背後藏著一道通往密室的暗門。\n\n想進入博物館：翻至142章。想進入密室：翻至74章。若兩個選項都不想選：翻至94章。',
  c:[{l:'進入博物館',g:142},{l:'進入密室',g:74},{l:'都不選',g:94}]};

D[115]={s:'study',t:'書房的地板是拋光的黑橡木，鋪著一張土耳其地毯，地毯上的複雜圖案看得你眼睛生疼、酸澀。厄運值+1。\n\n若持有物品[標本滿罐]：翻至163章。若未持有：翻至95章。',
  f:{doom:1},c:[{l:'（持有標本滿罐）',g:163,q:{item:'標本滿罐'}},{l:'（無）',g:95}]};

D[116]={s:'manor',t:'你小心翼翼地繞開教授，走進了書櫃暗門後的房間，一盞裸露的燈泡將房間籠罩在渾濁的黃色光線中。\n\n進行一次觀察測試：擲1顆骰子+智力值，可消耗1點線索，擲2顆骰子並選取點數最高的那顆；擁有{探索者}/{偵探}能力，點數+1。測試結果如何？\n\n總點數≥8：翻至81章。總點數≤7：翻至188章。',
  c:[{l:'觀察測試（智力）',t:{a:'int',d:8,p:81,f:188,plus:['探索者','偵探'],c:'clue'}}]};

D[117]={s:'manor',t:'特倫霍姆：\n\n你的無禮令人震驚。你竟敢將本應屬於我的東西據為己有，簡直是膽大妄為。別以為你這拙劣的反抗能讓你變得高尚——你不過是條在巨蛇陰影裡鼓著脖子的癩蛤蟆。\n\n你抱怨帳目未清，可你數次前往南美洲的探險，哪一次不是由我出資？比起這項偉大的事業，這些瑣事又算得了什麼？金錢和帳本，都是愚昧之徒的籌碼，而我掌控的，是命運，其中也包括你的命運。\n\n我把話說明白——欠了債的人是你，等到清算的那一天，你必須全額償還。你把我過去毫無保留的慷慨，當成了軟弱；把我的彬彬有禮，當成了縱容。但從今往後，不會了。你手裡的神像，終將歸我所有，你將它藏起來，不是守護者，而是竊賊——而你很清楚，竊賊，死無全屍。\n\n哈考特\n\n現在翻回你剛看到的章節。',
  c:[{l:'返回',g:298}]};

D[118]={s:'manor',t:'「牠們把他抓走了！」伊莎貝爾終於在劇烈的抽泣中擠出一句話，恐懼的淚水順著臉頰滑落，身體不住地顫抖，顯然已經陷入了休克狀態，「牠們就這麼把他抓走了！我們必須離開這裡，像霍勒斯那樣跑掉，永遠不要回頭！」\n\n「不行。」哈羅醫生顯然在努力保持鎮定，可他的手卻止不住地顫抖，「我們必須待在一起。」他向你和伊莎貝爾投來懇求的目光，接著突然想到一個辦法，「我們應該打電話求助。」\n\n「可諾特早就打過了啊。」她衝著他大喊，「路德，你根本沒清醒思考！」\n\n「對，我們就該這麼做。」他彷彿沒聽到她的話，重複道，「打電話求助。」\n\n還有另一個選擇，你可以嘗試找出蜘蛛把沃德帶到了哪裡。\n\n想遵從哈羅醫生的計劃：翻至152章。想提議去尋找沃德：翻至134章。想做別的事：翻至175章。',
  c:[{l:'遵從哈羅醫生的計劃',g:152},{l:'提議去尋找沃德',g:134},{l:'想做別的事',g:175}]};

D[119]={s:'study',t:'你也不確定一張空書桌能告訴你什麼，但還是仔細打量著桌面。\n\n進行一次調查測試：擲1顆骰子+智力值，可消耗1點線索，擲2顆骰子並選取點數最高的那顆；擁有{偵探}/{探索者}能力，點數+1。測試結果如何？\n\n總點數≥8：翻至50章。總點數≤7：翻至99章。',
  c:[{l:'調查測試（智力）',t:{a:'int',d:8,p:50,f:99,plus:['偵探','探索者'],c:'clue'}}]};

D[120]={s:'manor',t:'你走近房間的角落，看到伊莎貝爾·哈考特怒氣沖沖，而佩雷格林·沃德背對著你。\n\n這位年輕姑娘的目光緊緊盯著律師，你走近時，聽到她說道：「我不敢相信他竟然和我斷絕關係！我到底做了什麼，要承受這樣的結果？你必須再為我跟他說說！」\n\n她察覺到你的到來，立刻閉了嘴。沃德看到她的目光轉移，便轉過身，朝伊莎貝爾走了一步。\n\n線索+1，解鎖秘密線索：斷絕關係。\n\n「有什麼我能為你做的嗎？」律師問道。\n\n你朝沃德禮貌地笑了笑，走上前：「其實，有的，如果你不介意的話。」你的語氣十分隨意，「我一直覺得法律很有意思，雖說我對它了解甚少。你肯定要處理各種各樣的情況，我想，謹慎和縝密，一定是你一貫的行事準則。」你補充道，目光看著伊莎貝爾走向酒水車。\n\n律師打量了你片刻，隨後簡短地點了點頭：「可以這麼說。」他開始為你簡要介紹自己的工作——起草信託文件、管理財產、處理遺產糾紛，內容頗有啟發。\n\n他講述的過程中，你提出了一些有思考性的問題，引導他詳細闡述了關鍵的法律原則、先例的重要性，以及談判的微妙藝術。交談結束時，你不僅了解了法律運作的機制，也摸清了法律從業者的思維模式。\n\n獲得能力{法律知識}。\n\n你還有最後一個問題想問，翻至280章。',
  f:{clue:1,secret:'斷絕關係',ab:'法律知識'},c:[{l:'繼續',g:280}]};

/* ---------- 121-130 ---------- */
D[121]={s:'manor',t:'你走到窗邊，拉開窗簾，立刻嚇得後退一步——窗外的玻璃上，爬著好幾隻大蜘蛛，每一隻都和捕鳥蛛一般大，甚至更大，身上覆蓋著灰色的絨毛，正用硬毛密佈的腿敲打著玻璃，彷彿在測試玻璃的牢固程度，又或是在尋找入口。\n\n透過這可怖的景象，你看到一棵白蠟樹緊挨著房子生長，樹幹的樹洞裡，正爬出更多的蛛形恐怖生物！\n\n你立刻猛地拉上窗簾，恐懼地逃出了圖書館。\n\n意志力-1，解鎖秘密線索：白蠟樹。\n\n若持有物品[襯衫紐扣]：翻至282章。若未持有，但有[夾鼻眼鏡]：翻至10章。若未持有上述物品，但有[化石毒牙]：翻至96章。若上述物品均未持有：翻至162章。',
  f:{wp:-1,secret:'白蠟樹'},c:[{l:'（持有襯衫紐扣）',g:282,q:{item:'襯衫紐扣'}},{l:'（持有夾鼻眼鏡）',g:10,q:{item:'夾鼻眼鏡'}},{l:'（持有化石毒牙）',g:96,q:{item:'化石毒牙'}},{l:'（無）',g:162}]};

D[122]={s:'study',t:'這位絕望的律師一把將你推開，你失去平衡摔倒在地，肩膀撞在書桌邊緣。\n\n生命值-1，戰鬥值-1。\n\n沃德衝出房間，猛地關上門阻礙你，他在壁爐裡燒掉的文件，此刻已經變成了捲曲的、被火焰舔舐過的黑灰。\n\n想追佩雷格林·沃德：翻至96章。想搜查書房，看看能否找到他來這裡的原因：翻至41章。',
  f:{hp:-1,com:-1},c:[{l:'追佩雷格林·沃德',g:96},{l:'搜查書房，看看他來這裡的原因',g:41}]};

D[123]={s:'manor',t:'瓦努姆教授回到客廳的酒水車旁，再次給自己的酒杯斟滿酒，接著一飲而盡，吞嚥的聲音清晰可聞。\n\n佩雷格林·沃德走到他身邊：「奧托，你和伊萊賈和解了嗎？如果沒有的話，看來你們再也沒機會了。」\n\n奧托只是冷冷地瞪著律師，接著又給自己倒了一杯酒。\n\n「佩雷格林。」伊莎貝爾手裡拿著一疊信，走到客廳裡的三個人身邊，「我們應該把這些信發下去。」\n\n「我的建議是，現在我們最好什麼都別做。」律師答道。\n\n「但伊萊賈舅舅顯然打算把這些信發給大家，每個人都有一封，我們就是為此而來的，不是嗎？」\n\n「我知道我為什麼來。」霍勒斯·特倫霍姆從樓上幫忙抬哈考特下來後，走進客廳說道。\n\n「為什麼？」瓦努姆教授問道。\n\n「和其他人一樣，」他嗤笑道，「因為我們都和伊萊賈·哈考特有過節，他召喚我們來這裡，我們都知道，這或許是我們和他了斷的唯一機會。」\n\n這位探險家顯然和伊萊賈·哈考特有一段過往，在場的其他人顯然也是如此，可你直到收到他的信，邀請你來參加今晚的聚會前，甚至從未聽過這個名字。線索+1。\n\n「哈羅醫生呢？」沃德問道。\n\n「在樓上照顧病人，」特倫霍姆答道，「給他做全面檢查，很快就會下來和我們匯合。」\n\n「諾特去哪裡了？」\n\n「醫療救援很快就到。」管家的聲音從連接客廳和前廳的拱門邊傳來，嚇了沃德一跳。\n\n翻至173章。',
  f:{clue:1},c:[{l:'繼續',g:173}]};

D[124]={s:'attic',t:'「你對他們做了什麼？」你目光緊盯著其他客人的軀體，質問道。\n\n「這不是我做的，是那些入夢的人，他們的夢境撐開了通往偉大的亞特蘭-納卡領域的傳送門。」諾特平靜地說道，彷彿在說自己的早餐，而非這些令人恐懼、讓人瘋狂的話，「哈考特先生即將迎來他的蛻變，他將加入母神的行列，那位穿梭於諸界的織網者，亞特蘭-納卡。現在，只需要鑰匙打開門就夠了。」\n\n哈考特在給你的第二封信中寫道——鑰匙將通過你轉動，門將會開啟。\n\n「我就是那把鑰匙？」你茫然地說道。\n\n「沒錯！」管家激動地答道。\n\n「為什麼是我？」\n\n「因為你見證了這一切。你掌握的隱秘知識，是解鎖真相的鑰匙，而你，將解鎖那扇門，迎接他的蛻變！我在夢中預見了這一切。」\n\n你和伊莎貝爾突然被人從身後抓住，兩名女傭從陰影中現身，抓住你們的手多得超乎想像，這根本不可能。\n\n但你絕不會輕易就範。\n\n進行一次掙脫測試：擲1顆骰子+戰鬥值，可消耗1點資源，擲2顆骰子並選取點數最高的那顆；擁有{敏捷}/{戰士}/{倖存者}能力，點數+1。測試結果如何？\n\n總點數≥8：翻至149章。總點數≤7：翻至253章。',
  c:[{l:'掙脫測試（戰鬥）',t:{a:'com',d:8,p:149,f:253,plus:['敏捷','戰士','倖存者'],c:'res'}}]};

D[125]={s:'manor',t:'你一秒也不想再待在哈考特莊園裡了，你下定決心，一定要逃離這棟滿是蜘蛛的恐怖房子，哪怕為此付出一切！\n\n你快步走下台階，沿著車道小跑起來，迷霧中，紅楓林在道路兩側若隱若現，所有的樹木都被蛛網覆蓋。而且，這些樹看起來有些不對勁，變得比正常的紅楓樹怪異、虛幻得多——樹枝更粗壯，樹葉的形狀也十分詭異。\n\n你正疑惑，為何短短幾個小時內，這麼多樹不僅發生了異變，還被蛛網徹底覆蓋，一個答案突然浮現在腦海中。\n\n樹裡有東西在蠕動，一個個圓滾滾的巨大身影，透過扭曲感知的迷霧，你能看出牠們每一個都比人類大得多，邁著多節、細長的肢體，以一種違背自然的優雅姿態移動著。厄運值+1。\n\n或許，還是待在哈考特莊園裡更安全。\n\n想轉身返回宅邸：翻至137章。想繼續前進：翻至157章。',
  f:{doom:1},c:[{l:'轉身返回宅邸',g:137},{l:'繼續前進',g:157}]};

D[126]={s:'attic',t:'你朝著閣樓的樓梯飛奔而去，心臟狂跳，雙腿幾乎支撐不住身體。身後，你聽到幾丁質刮擦木頭的聲音，那隻哈考特蜘蛛怪正在追來。你縱身跳下樓梯，祈禱自己能有一絲逃脫的機會。\n\n一陣濕滑的咔嗒嘶鳴聲在黑暗中迴盪，緊接著——咻！有什麼東西重重地砸在你的背上，像一張被扔出的網。\n\n你恐懼的尖叫戛然而止，因為蛛網瞬間收緊，冰冷又黏膩，你被猛地拽離地面，狠狠摔在地上，接著被那隻怪物快速向後拖去。木屑劃破了你的衣服和皮膚，你被牠一點點拉向身邊。\n\n你最後看了一眼頭頂的屋頂木梁，隨後映入眼簾的，就只有數不清的腿，太多太多的腿。\n\n那隻由伊萊賈·哈考特變成的怪物赫然出現在你眼前，人類的臉畸形地融合在臃腫的蜘蛛軀體上，嘴巴大張，毒牙不停顫動。你最後聽到的，是牠透過扭曲顎部發出的低語：「食……物……」\n\n緊接著，骨頭被一口咬碎，溫熱的血液噴湧而出，你的頭顱被牠硬生生從身體上咬了下來。\n\n你的身體抽搐了一下，隨後，牠開始進食。\n\n解鎖秘密線索：願意走進我的客廳嗎？遊戲結束。',
  f:{secret:'願意走進我的客廳嗎？'},c:[{l:'結束',g:'END0'}]};

D[127]={s:'manor',t:'親愛的醫生：\n\n如果我告訴你，有一條路能逃離生活的一切苦難，永遠不再受病痛、折磨和成癮的困擾，你會作何感想？誠然，發現這樣的靈丹妙藥，一定是世上每一位醫生的夢想。\n\n但我無需多說，因為你很快就會親眼見證。為了你這些年來為我所做的一切，我願讓你擺脫後續的痛苦與煎熬，因為昇華的時刻已經到來。今夜，你的夢境將成就我們彼此，我們將體驗難以想像的狂喜，你從未嘗過這樣的「毒藥」！\n\n今晚，鑰匙將轉動，門將開啟，我們將一同踏入天堂，告別凡世的一切疾苦與缺憾。\n\n伊萊賈·哈考特\n\n現在翻回你閱讀這封伊萊賈·哈考特寫給哈羅醫生的信之前，被要求記下的章節編號。',
  c:[{l:'返回',g:182}]};

D[128]={s:'study',t:'「你在做什麼？」瓦努姆教授難以置信地驚呼道。\n\n「做我早該做的事。」你告訴他，「在這隻蜘蛛咬到第三個人之前，找到牠。」\n\n你仔細搜查著房間，努力思考，這隻剛咬了貝爾韋瑟醫生的蜘蛛，此刻會藏在哪裡。\n\n進行一次搜尋測試：擲1顆骰子+智力值，可消耗1點線索，擲2顆骰子並選取點數最高的那顆；擁有{探索者}能力，點數+1。測試結果如何？\n\n總點數≥7：翻至178章。總點數≤6：翻至239章。',
  c:[{l:'搜尋測試（智力）',t:{a:'int',d:7,p:178,f:239,plus:['探索者'],c:'clue'}}]};

D[129]={s:'manor',t:'門突然被推開，霍勒斯·特倫霍姆探進頭來：「啊，奧托，你在這兒。」他語氣急促，「能跟你說句話嗎？」\n\n教授撫平外套上的褶皺：「當然，霍勒斯，出什麼事了？」\n\n「沒什麼，沒什麼。」特倫霍姆用過分熱情的笑聲安慰道，可他的目光卻掃了你一眼，上下打量後又移開，接著朝走廊揚了揚下巴，「只是點小事，很快就好，最好出去說，嗯？」\n\n說完，他便退了出去，厚重的門留了一道縫，他離開後，圖書館裡的寂靜愈發濃重，讓人喘不過氣。\n\n翻至219章。',
  c:[{l:'繼續',g:219}]};

D[130]={s:'manor',t:'你盯著這些照片看的時間越長，這種虛幻的感覺就越強烈，到最後，你甚至覺得動起來的不只是照片裡的圖像，那些蜘蛛彷彿化作了實體，在展櫃的玻璃下爬行。\n\n理智值-1，解鎖秘密線索：幻視。\n\n你再也無法忍受，立刻轉身離開。\n\n翻至170章。',
  f:{san:-1,secret:'幻視'},c:[{l:'繼續',g:170}]};

/* ---------- 131-140 ---------- */
D[131]={s:'mist',t:'金斯波特港濱區是大海、不時侵襲的迷霧與小鎮主體之間的屏障，這裡矗立著紅磚倉庫，海鹽的氣息和水汽磨平了倉庫的粗糙稜角，也讓這片區域隨處可見的碼頭木柱乾裂、破損。\n\n漁船隨著潮汐起伏，漁民們在碼頭上修補漁網和龍蝦籠。你向其中一些人提起伊萊賈·哈考特的名字，得到的卻只有一張張茫然的臉。顯然，你要拜訪的這個人，和鎮上的漁民身處兩個截然不同的世界。\n\n你繼續往前走，沿著港口繞行——這裡有渡輪碼頭，也停靠著大型遠洋客輪，最終抵達了北角燈塔。這座建築高聳於小鎮之上，經過近期的翻修後，成了熱門的旅遊景點。\n\n你和一群興奮的遊客一起爬上燈塔頂端，堅固的鐵欄杆保護著所有人的安全，也讓大家能盡情欣賞美景，你沉醉在金斯波特的佈局和周邊絕美的風光中。在金斯波特海岬的懸崖上，你看到了幾棟宏偉的宅邸，宅邸旁是打理得整整齊齊的花園，這片區域彷彿是金斯波特獨立的一角，比港濱區要低調得多。\n\n一位皮膚狀態不佳的年輕男子，看起來像是燈塔的初級看守員，在塔頂陪著你和其他興奮的遊客，確保沒有人發生危險，也留意著那些可能會去試探鐵欄杆的人。他看到你目不轉睛地盯著懸崖上的宅邸，便湊上前來：「瞧瞧有錢人的生活，是吧？」\n\n「可不是嘛。」你說，「其中有哈考特莊園嗎？」\n\n這位初級看守員的神色變得有些不自在：「你用這個看，會看得更清楚。」他指著架在欄杆上的望遠鏡，「投一枚五分鎳幣就行。」\n\n有何不可呢？你心想，便投了一枚硬幣。可當你將眼睛湊到目鏡前，看到的卻只有一片詭異的紫色迷霧。移開眼睛，周圍的一切都和之前一樣，只有淡藍色的迷霧縈繞在房屋、樹林和花園上空，可再次看向望遠鏡，視野又變成了那片詭異的紫霧，什麼也看不清。\n\n「這望遠鏡壞了。」你對年輕男子說，「鏡片受損了。」\n\n「我保證它是好的。」他面露不悅，「或許是你不會用。」\n\n你正要爭辯，卻又覺得沒必要。初級看守員走到另外兩位剛爬上塔頂的年輕姑娘身邊，你看了看時間，不情願地決定走下燈塔，結束這次觀光。\n\n你不確定自己是否來對了地方，能否找到關於哈考特莊園及其主人的更多信息。但有一個地方，一定是當地流言蜚語的聚集地——即便是在禁酒令的時代。\n\n想尋找當地的酒館，希望能找到線索：翻至47章。不想尋找：翻至150章。',
  f:{clue:1},c:[{l:'尋找當地的酒館，希望能找到線索',g:47},{l:'不想尋找',g:150}]};

D[132]={s:'attic',t:'你抓住路德·哈羅醫生的肩膀，用力搖晃他，同時對著他的臉大喊，讓他醒過來。他的眼皮突然顫動著睜開，驚恐地盯著你，眼睛似乎要從眼眶裡凸出來，接著張開嘴，發出一聲令人毛骨悚然的尖叫。\n\n其他沉睡的人也跟著尖叫起來，他們也醒了過來，直面自己此刻所處的可怕境地。緊接著，那隻蹲在巨大蛛網中央的蜘蛛怪也開始尖叫，你擔心自己的心智會就此崩潰。\n\n擲1顆骰子，若點數≤理智值：翻至176章。若點數＞理智值：翻至159章。',
  c:[{l:'理智測試',t:{mode:'san',d:0,p:176,f:159}}]};

D[133]={s:'manor',t:'「我不知道是誰幹的。」你答道。\n\n「但這改變不了一個事實——這棟房子裡，有個瘋子就藏在我們眼皮底下！」伊莎貝爾哭喊道，聲音因恐懼而顫抖。\n\n「沒事兒的，親愛的。」律師說著，扶她坐到椅子上，「待在這兒，我很快就回來。」\n\n說完，他便離開了客廳。\n\n你心裡清楚，若想弄清真相，找到刺傷瓦努姆教授的兇手，最好的辦法就是繼續探索哈考特莊園。但或許佩雷格林·沃德是對的，和伊莎貝爾待在客廳裡，才是更明智的選擇，畢竟人多安全。\n\n想繼續探索宅邸：翻至57章。想留在客廳：翻至77章。',
  c:[{l:'繼續探索宅邸',g:57},{l:'留在客廳',g:77}]};

D[134]={s:'manor',t:'「這棟房子有閣樓嗎？」你問伊莎貝爾。\n\n她茫然地盯著你：「有，當然有。但這和現在的事有什麼關係？」\n\n「因為蜘蛛肯定把沃德帶到閣樓去了。」你告訴她，「我們怎麼上去？」\n\n「穿過博物館前的前廳就能上去。」她的聲音很輕。\n\n「不行。」哈羅醫生態​​度堅決，「我們不能上去，你沒看到那些東西對他做了什麼嗎？對一個成年男人！」\n\n「我們都看到了。」你反駁道。\n\n「不，我們打電話叫警察來幫忙，無論如何，我們都要待在一起！」醫生堅定地說。\n\n想遵從哈羅醫生的計劃：翻至152章。想前往閣樓：翻至61章。想去別的地方：翻至175章。',
  c:[{l:'遵從哈羅醫生的計劃',g:152},{l:'前往閣樓',g:61},{l:'去別的地方',g:175}]};

D[135]={s:'attic',t:'你此刻只有一個目標：終結伊萊賈·哈考特那褻瀆神明的野心，終結他為之奉獻生命、存在與靈魂的惡魔神祇。\n\n你和伊莎貝爾·哈考特並肩作戰，準備在這隻怪物的巢穴裡與牠展開對決。\n\n每一輪戰鬥開始前，可消耗1點資源，為本輪總點數+2。\n\n第一輪：擲2顆骰子+戰鬥值+意志力值；擁有{敏捷}/{堅定}/{倖存者}能力，點數+1；擁有{謹慎}弱點，點數-1。總點數≥14。\n第二輪：擲2顆骰子+戰鬥值+意志力值；擁有{戰士}/{堅韌}能力，點數+1；若贏得第一輪，點數+2。總點數≥15。\n\n贏得第二輪：翻至113章。輸掉第二輪：翻至153章。',
  c:[{l:'決一死戰（兩輪）',t:{battle:[{a:'com',b:'wp',d:14,plus:['敏捷','堅定','倖存者'],minus:['謹慎']},{a:'com',b:'wp',d:15,plus:['戰士','堅韌'],winBonus:2}],p:113,f:153,c:'res'}}]};

D[136]={s:'manor',t:'「你在做什麼？」沃德看到你一把抓起信封，驚恐地驚呼道。\n\n「我要讀伊萊賈·哈考特寫給貝爾韋瑟醫生的信。」你斷然說道，準備用手指挑開封蠟，撕開信封。\n\n「我命令你住手！」他怒吼道，你突然明白，在法庭上面對他是什麼感覺，也終於知道伊萊賈·哈考特為什麼會雇佩雷格林·沃德做自己的律師——這個男人身上散發出的強勢氣場，令人難以抗拒。\n\n進行一次決心測試：擲1顆骰子+意志力值，可消耗1點資源，擲2顆骰子並選取點數最高的那顆；擁有{法律知識}/{神秘}/{巫術}能力，點數+1；擁有{謹慎}弱點，點數-1。測試結果如何？\n\n總點數≥8：翻至196章。總點數≤7：翻至5章。',
  c:[{l:'決心測試（意志力）',t:{a:'wp',d:8,p:196,f:5,plus:['法律知識','神秘','巫術'],minus:['謹慎'],c:'res'}}]};

D[137]={s:'manor',t:'一股冰冷的恐懼席捲全身，你立刻轉身，拼命朝宅邸跑去，不知道還能做什麼。你感覺到頭頂的空氣一陣異動，接著一個巨大的圓球狀身影砸在身前的車道上，碎石嘎吱作響，迷霧中泛起陣陣漣漪。\n\n那東西看起來像一隻巨型蜘蛛，卻又並非蜘蛛，肢體多節、張開，軀體呈不對稱的分節狀，臃腫的腹部覆蓋著灰色的幾丁質，頭上長著數隻發光的眼睛，像一簇即將破裂的膿包。\n\n理智值-1。\n\n翻至218章。',
  f:{san:-1},c:[{l:'繼續',g:218}]};

D[138]={s:'manor',t:'你選擇用什麼物品對抗這群蜘蛛？\n\n若選擇[火柴盒]/[怪異神像]/[打火機]/[陶片]：翻至151章。若選擇其他物品：翻至49章。',
  c:[{l:'（持有火柴盒／怪異神像／打火機／陶片）',g:151,q:{item:['火柴盒','怪異神像','打火機','陶片']}},{l:'（其他物品）',g:49}]};

D[139]={s:'study',t:'你也不確定回到書房，能找到什麼線索，可翻看那張巨大的桃花心木書桌，確實沒有發現任何新信息，事實上，你覺得搜查這個房間，純粹是在浪費時間。線索-1，智力值-1。\n\n翻至289章。',
  f:{clue:-1,int:-1},c:[{l:'繼續',g:289}]};

D[140]={s:'manor',t:'哈考特莊園的圖書館，收藏著大量關於蛛形綱動物的專業知識，令人嘆為觀止。\n\n若持有物品[襯衫紐扣]：翻至282章。若未持有，但有[夾鼻眼鏡]：翻至10章。若未持有上述物品，但有[化石毒牙]：翻至96章。若上述物品均未持有：翻至162章。',
  c:[{l:'（持有襯衫紐扣）',g:282,q:{item:'襯衫紐扣'}},{l:'（持有夾鼻眼鏡）',g:10,q:{item:'夾鼻眼鏡'}},{l:'（持有化石毒牙）',g:96,q:{item:'化石毒牙'}},{l:'（無）',g:162}]};

/* ---------- 141-150 ---------- */
D[141]={s:'manor',t:'在這隻恐怖生物的持續攻擊下，你摔倒在地，這具木乃伊屍體也壓在了你的身上。牠佈滿灰塵的眼窩和齜牙咧嘴的模樣，離你的臉只有幾英吋，這隻怪物在你身上不停扭動、顫抖，最終碎裂開來，無數黑毛軀體從乾枯的骨頭和破損的羊皮紙般的皮膚中湧了出來。\n\n一隻蜘蛛的毒牙刺入你的臉頰，你疼得大叫，更多的蜘蛛接踵而至，不斷咬你，牠們的毒液疊加在一起，最終讓你失去了意識。\n\n因此，你永遠也不會知道自己的命運，或許，這反而是件好事。\n\n解鎖秘密線索：一朝被咬。遊戲結束。',
  f:{secret:'一朝被咬'},c:[{l:'結束',g:'END0'}]};

D[142]={s:'manor',t:'你轉動門把手，門鬆動地晃了晃，接著推開大門，走進了哈考特的私人博物館。\n\n若持有物品[陶片]：翻至25章。若未持有：翻至54章。',
  c:[{l:'（持有陶片）',g:25,q:{item:'陶片'}},{l:'（無）',g:54}]};

D[143]={s:'study',t:'這些信——至少你認為是信——都裝在密封的信封裡，字跡和邀請你來金斯波特的信一樣，歪歪扭扭如蜘蛛爬行，你一眼就認出，這是伊萊賈·哈考特的筆跡。\n\n「每個人都有一封。」伊莎貝爾·哈考特突然走到你身側說道。\n\n「我們應該把信發下去，」你說，「這樣或許就能知道你舅舅為什麼要在今晚召喚所有人來這裡。」\n\n「我同意。」伊莎貝爾將信封整齊地疊成一摞，拿在手裡，大步走出書房，回到客廳。\n\n你跟了上去。\n\n翻至173章。',
  c:[{l:'繼續',g:173}]};

D[144]={s:'manor',t:'你的左側，穿過一處小前廳，是一扇光亮的胡桃木門，門上標著「博物館」的字樣。\n\n想推開門進入博物館：翻至142章。不想進入：翻至94章。',
  c:[{l:'推開門進入博物館',g:142},{l:'不想進入',g:94}]};

D[145]={s:'manor',t:'圖書館裡無疑還有許多值得學習的知識，但你知道，這棟房子裡，並非只有這一個房間藏著神秘的秘密。\n\n那麼，你想做什麼？',
  c:[{l:'研讀《海波里亞的異教秘典》',g:201},{l:'翻看《老金斯波特及其奇聞》',g:232},{l:'研究《夢遊者之路》',g:180},{l:'離開圖書館，去別的地方',g:140}]};

D[146]={s:'manor',t:'醫療包裡，除了聽診器、血壓計、體溫計、耳鏡、反射錘這些常見的醫用器具，還有一支看起來剛被用過的注射器，針筒裡還殘留著少量混著血液的液體，以及一瓶只剩一半嗎啡。\n\n你拿著藥瓶轉動，注意到液體中有幾道乳白色的紋路，瓶裡裝的，真的是純嗎啡嗎？還是被摻入了其他東西，遭到了污染？\n\n線索+1，資源+2，智力值+1，在角色表中記錄物品[嗎啡注射器]。\n\n但醫療包裡的東西還不止這些，你還發現了一封伊萊賈·哈考特寫的信，收信人是路德·哈羅醫生，字跡依舊是他那標誌性的、如蜘蛛爬行般的模樣。\n\n想讀這封信：在角色表中記下數字107，然後翻至127章閱讀信件。若覺得沒時間讀信：直接翻至107章。',
  f:{clue:1,res:2,int:1,item:'嗎啡注射器'},c:[{l:'讀這封信',g:127},{l:'沒時間讀信，直接繼續',g:107}]};

D[147]={s:'manor',t:'「不過都是些洩憤的廢話、威脅之流罷了。」探險家不屑地說道，「但現在看看是誰笑到了最後。」\n\n他喝了一大口酒壺裡的酒。在你看來，特倫霍姆的心情一點也算不上愉悅。\n\n他乾笑了一聲，毫無笑意。「反正肯定不是奧托。」\n\n今晚受邀來到哈考特莊園的這些人，彼此之間難道就沒有一個合得來的嗎？你比以往更加確定，自己必須時刻保持清醒。意志力+1。\n\n若你想追問他，覺得是誰襲擊了瓦努姆教授，翻至217章。若你已盤問完這位探險家，翻至257章。',
  f:{wp:1},c:[{l:'追問他覺得是誰襲擊了瓦努姆教授',g:217},{l:'已盤問完，繼續',g:257}]};

D[148]={s:'manor',t:'伊萊賈·哈考特並非孤身一人，路德·哈羅醫生也在他身邊。醫生背對著你，似乎正在床頭櫃上的醫療包裡翻找著什麼。「很快就會好起來的。」他低聲說道。\n\n哈考特平躺在床上，你能看到他的臉上佈滿了青紫色的紋路，這些紋路都從脖子上的咬痕處蔓延開來，那處咬痕此刻已經腫成了拳頭大小的紅黃色腫塊。\n\n眼前的景象讓你忍不住倒吸一口涼氣，哈羅醫生猛地轉過身來，手中拿著一支注射器，針尖上還掛著一滴晶瑩的液體。他想做什麼？\n\n若你想立刻退出房間，翻至182章。若你想質問哈羅醫生，翻至231章。若你擔心他圖謀不軌，想在他進一步傷害伊萊賈·哈考特之前先發制人，翻至21章。',
  c:[{l:'立刻退出房間',g:182},{l:'質問哈羅醫生',g:231},{l:'先發制人',g:21}]};

D[149]={s:'attic',t:'你掙脫了年輕女傭的束縛，這讓她、另一名女傭還有諾特斯蒂爾都猝不及防，也為伊莎貝爾創造了脫身的機會。\n\n「你們竟敢違抗亞特蘭-納卡的意志？」管家大喊道，「你們儘管掙扎，主人會將你們的反抗當作盛宴！」\n\n你一言不發，此刻早已不是爭辯的時候，因為你知道，自己正在為活命而戰。\n\n你帶頭衝上前去，伊莎貝爾緊隨其後，與你並肩和這些傭人搏鬥，想要逃離哈考特莊園的恐怖之地。\n\n每一輪戰鬥開始前，你可以消耗1點資源，為本輪總點數+2。\n\n第一輪：擲2顆骰子，加上你的戰鬥值。若你擁有能力{戰士}，點數+1。若你擁有弱點{謹慎}，點數-1。總點數12及以上，贏得第一輪。\n第二輪：擲2顆骰子，加上你的戰鬥值。若你擁有能力{堅韌}，點數+1。若你贏得第一輪，點數+1。總點數16及以上，贏得第二輪。\n第三輪：擲2顆骰子，加上你的戰鬥值。若你擁有能力{倖存者}，點數+1。若你贏得第二輪，點數+2。總點數17及以上，贏得第三輪。\n\n若你贏得全部三輪戰鬥，翻至221章。若你贏得兩輪戰鬥，翻至205章。若你輸掉兩輪戰鬥，翻至185章。若你輸掉全部三輪戰鬥，翻至168章。',
  c:[{l:'戰鬥（三輪）',t:{battle:[{a:'com',d:12,plus:['戰士'],minus:['謹慎']},{a:'com',d:16,plus:['堅韌'],winBonus:1},{a:'com',d:17,plus:['倖存者'],winBonus:2}],p:221,f:168,c:'res',partial:{2:205,1:185,0:168}}}]};

D[150]={s:'manor',t:'你十分好奇，為何伊萊賈·哈考特在信中執意要求你晚上7點整抵達他的莊園。你自然不想遲到，於是開始尋找馬車前往。\n\n幸運的是，你沒找多久就遇到了一輛，很快便駛離了街區，沿著柏油馬路蜿蜒向上，朝著俯瞰金斯波特的懸崖駛去。\n\n馬車在一扇漆黑的鐵門外停下，車伕告訴你目的地到了——這裡就是哈考特莊園。你下車時，他看著這座宏偉的宅邸，眼中閃過一絲不安。「沒多少人願意來這兒，這是有原因的。」他低聲嘟囔著，「老哈考特莊園——相關的傳聞可不少，沒一個是好的。」\n\n他的話讓你心緒不寧，你點了點頭，一言不發。付完車費後，車伕猛踩油門駕車離開，甚至沒問你是否需要返程接送。\n\n你望著遠去的馬車，注意到一縷薄霧正沿著道路緩緩向莊園飄來。你打了個寒顫，推開鐵門，沿著碎石車道往前走，車道兩側整齊排列著紅楓樹，盡頭便是那座白牆宅邸。周遭的氣氛肅穆而沉靜，腳下的碎石發出嘎吱的聲響，薄霧在修剪整齊的草坪上飄蕩，彷彿擁有自主意識，一縷縷緩緩聚攏，模糊了宅邸白牆的輪廓。\n\n你走上门廊的台階，按響了門鈴。片刻後，漆黑的亮漆大門被打開，一名管家迎了出來——他身材矮壯，面色蠟黃，黑髮上抹了大量髮油，梳得一絲不苟。他將你領進屋內，就在這時，屋內某處的落地鐘敲響了七下，正好是七點。他身後的兩名女傭見狀，連忙退了下去。\n\n從寬敞的前廳穿過，這位看著約莫五十多歲的管家將你領進客廳，裡面已經聚集了另外六位客人。其中有四名男士和兩名女士，所有人都用審視且懷疑的目光看著你，唯有一位高瘦的非裔男士例外。他穿著剪裁考究的灰色西裝，舉止優雅，走上前來向你伸出手，目光透過架在鼻尖的夾鼻眼鏡看向你。\n\n「佩雷格林·沃德。」他用力握住你的手說道，「哈考特先生的私人律師。你是？」\n\n你做了自我介紹，沃德隨後便主動將你介紹給在場的其他人。\n\n第一位是二十多歲的年輕女士，伊莎貝爾·哈考特，宅邸主人的姪女。她面色蒼白，五官稜角分明，一頭黑髮梳成時髦的波波頭，身著的裙子簡約卻優雅，不過你能從她的穿著中察覺到一絲叛逆的端倪——脖子上鬆鬆地繫著一條猩紅圍巾，右手食指和中指之間還夾著一個煙嘴。\n\n接下來是奧托·瓦努姆教授，他與哈考特小姐在各方面都形成了鮮明的對比。他身材肥胖，灰白的頭髮日漸稀疏，眼窩深陷，身上穿著的粗花呢三件套早已過時，渾身還散發著灰塵和舊書的味道，一看就是學者模樣。得知他是阿卡姆密斯卡托尼克大學的歷史學講師時，你絲毫不感到意外。\n\n一名皮膚黝黑、飽經風霜的男士走上前來與你結識，略過了他身旁那位身材嬌小、戴著眼鏡的拉美裔女士。\n\n「霍勒斯·特倫霍姆。」他用粗糙的大手緊緊攥住你的手說道，「探險家兼冒險家。」他身上的磨舊皮夾克、單肩背著的鼓鼓囊囊的帆布包，還有滿臉的絡腮鬍和銳利的眼神，無一不印證著他的身份。\n\n特倫霍姆自信張揚，而那位戴眼鏡的女士則顯得十分社恐，與你對視時臉頰泛紅，始終不敢與你直視，目光總不自覺地飄向自己腳上那雙樸實的鞋子。她身材瘦小，體格精幹，圓框眼鏡架在鼻尖，身著紫色系扣開衫和灰色長裙。\n\n「科拉·貝爾韋瑟醫生。」她說道，「動物學家，主攻蛛形綱動物研究。」\n\n最後一位是四十五六歲的男士。他的一言一行都透著一種落魄感，看得出來，他曾經風光無限，只是如今時運不濟。他年輕時定然十分英俊，而現在卻面容憔悴，眼窩深陷，臉色慘白。他的西裝雖然也是剪裁精良，卻早已沒了往日的光彩。\n\n「這位是路德·哈羅醫生。」沃德介紹道，「哈考特先生的私人醫生。」\n\n「幸會。」哈羅醫生回應道。\n\n與他握手時，你是否察覺到他的手微微顫抖？你不禁好奇，一位資歷深厚的醫生，為何會在这样的場合感到緊張。他的社恐程度似乎不亞於貝爾韋瑟醫生，而且看起來早已疏於打理自己。你只希望他能好好照顧自己的病人。\n\n「我們還要等多久，諾特？」沃德向徘徊在客廳門口前廳的管家問道。\n\n「哈考特先生很快就會來見各位。」管家面色凝重地答道。\n\n沃德草草為你介紹完所有人後，便挽著伊莎貝爾·哈考特的胳膊走到客廳角落，兩人很快便低聲激烈交談起來。\n\n瓦努姆教授緩步走到酒水車旁，給自己的威士忌杯添滿了酒，哈羅醫生也走了過去，客廳中央只剩下特倫霍姆和貝爾韋瑟醫生兩人。\n\n你依舊滿心疑惑，不明白自己為何會被召集到此，也不想被孤立，於是決定主動加入其中一方的交談。你會選擇哪一方？',
  c:[{l:'走近佩雷格林·沃德和伊莎貝爾·哈考特',g:120},
     {l:'走近奧托·瓦努姆教授和路德·哈羅醫生',g:220},
     {l:'走近霍勒斯·特倫霍姆和科拉·貝爾韋瑟醫生',g:190}]};
