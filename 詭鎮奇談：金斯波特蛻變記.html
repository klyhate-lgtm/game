<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>詭鎮奇談：金斯波特蛻變記</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#e8dcc3;--ink-dim:#b6a888;--gold:#c9a227;--blood:#8b1e1e;
  --panel:#1b1611;--panel2:#241d16;--line:#4a3c2a;
  --ok:#6aa84f;--bad:#a83232;
}
html,body{height:100%}
body{
  background:#0d0a07;
  font-family:"Songti SC","Noto Serif TC","Times New Roman",serif;
  color:var(--ink);overflow:hidden;
}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%);}
#grain{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:.06;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ============ 開始畫面 ============ */
#start{
  align-items:center;justify-content:flex-start;
  overflow-y:auto;padding:18px 14px 110px;
  background:radial-gradient(circle at 50% 0%,#241a12 0%,#0d0a07 70%);
}
#start h1{
  font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:.16em;color:var(--gold);
  text-shadow:0 0 22px rgba(201,162,39,.45);margin:16px 0 4px;text-align:center;
}
#start .sub{color:var(--ink-dim);letter-spacing:.4em;font-size:.72rem;margin-bottom:14px}
#start .book{
  width:min(640px,100%);border:1px solid var(--line);border-radius:14px;
  background:linear-gradient(180deg,#1d1710,#14100b);padding:16px;
  margin-bottom:16px;box-shadow:0 8px 40px rgba(0,0,0,.7);
}
#start .book p{font-size:.9rem;line-height:1.85;color:var(--ink-dim);margin-bottom:.6em}
#start .book p b{color:var(--gold)}
.inv-wrap{width:min(900px,100%)}
.inv-title{text-align:center;color:var(--gold);letter-spacing:.25em;font-size:.8rem;margin:8px 0 12px}
.inv-grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:stretch}
.inv-card{
  flex:0 0 232px;background:linear-gradient(170deg,#241d16,#171210);
  border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden;
}
.inv-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.inv-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.35),0 0 26px rgba(201,162,39,.22)}
.inv-card .nm{font-size:1.12rem;color:var(--gold);letter-spacing:.06em}
.inv-card .rl{font-size:.7rem;color:var(--ink-dim);letter-spacing:.3em;margin:2px 0 10px}
.stat-row{display:flex;justify-content:space-between;font-size:.78rem;padding:2px 0;border-bottom:1px dotted #3a2f22}
.stat-row span:last-child{color:var(--gold)}
.inv-card .ab{font-size:.7rem;color:#9fb98a;margin-top:8px;line-height:1.6}
.inv-card .wk{font-size:.7rem;color:#c98a8a;line-height:1.6}
.inv-card .pro{font-size:.72rem;color:var(--ink-dim);line-height:1.7;margin-top:8px;max-height:104px;overflow:hidden}

/* ============ 遊戲畫面 ============ */
#game{background:#0d0a07}
#topbar{
  flex:0 0 auto;background:linear-gradient(180deg,#201a12,#15100b);
  border-bottom:1px solid var(--line);padding:8px 10px;z-index:20;
}
#topbar .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#invName{font-size:.86rem;color:var(--gold);letter-spacing:.08em;white-space:nowrap}
.badge{font-size:.66rem;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim)}
.stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pill{
  font-size:.7rem;padding:3px 8px;border-radius:8px;background:#241d16;
  border:1px solid var(--line);white-space:nowrap;
}
.pill b{color:var(--gold);font-size:.78rem}
.pill.hp b{color:#d97a7a}.pill.san b{color:#7aa9d9}
.pill.clue b{color:#8fd97a}.pill.res b{color:#d9c07a}
.pill.doom b{color:#d96b6b}

#main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#scene{width:100%;height:clamp(130px,26vh,230px);position:relative;overflow:hidden;background:#0b0805}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,7,.15),rgba(13,10,7,.96))}

#content{padding:14px 16px 220px;max-width:820px;margin:0 auto;animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#chapNo{font-size:.68rem;letter-spacing:.3em;color:#8a7b5e;margin-bottom:8px}
#text{font-size:.98rem;line-height:2.05;letter-spacing:.02em;white-space:pre-wrap;text-shadow:0 1px 2px #000}
#text::first-letter{font-size:1.5em;color:var(--gold)}
.cursor{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#fxline{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.fx{font-size:.74rem;padding:3px 9px;border-radius:7px;background:#2a2118;border:1px solid #4a3c2a;animation:pop .4s}
.fx.good{color:#9fe08a;border-color:#4e6b3a}
.fx.bad{color:#f09a9a;border-color:#6b3a3a}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

#choices{position:fixed;left:0;right:0;bottom:56px;z-index:25;
  background:linear-gradient(180deg,rgba(13,10,7,0),rgba(13,10,7,.97) 26%);
  padding:22px 12px 10px;max-height:56vh;overflow-y:auto}
#choices .inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.chbtn{
  width:100%;text-align:left;padding:12px 15px;border-radius:11px;cursor:pointer;
  background:linear-gradient(180deg,#2a2219,#1d1710);
  border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:.9rem;
  line-height:1.55;transition:.15s;position:relative;
}
.chbtn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#352a1e,#241d16);transform:translateX(3px)}
.chbtn:active:not(:disabled){transform:scale(.985)}
.chbtn:disabled{opacity:.42;cursor:not-allowed}
.chbtn .req{display:block;font-size:.68rem;color:#c98a8a;margin-top:3px}

/* ============ 底部導航 ============ */
#nav{
  position:fixed;left:0;right:0;bottom:0;height:56px;z-index:40;
  display:flex;background:#15100b;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#nav button{
  flex:1;background:none;border:none;color:var(--ink-dim);font-family:inherit;
  font-size:.66rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;transition:.15s;
}
#nav button i{font-style:normal;font-size:1.05rem;filter:grayscale(.4)}
#nav button:hover,#nav button:active{color:var(--gold);background:#1d1710}

/* ============ 彈窗 ============ */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(5,3,2,.86);padding:14px;backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fadein .25s}
.mbox{
  width:min(680px,100%);max-height:86vh;overflow-y:auto;
  background:linear-gradient(175deg,#241d16,#15100b);
  border:1px solid var(--line);border-radius:16px;padding:20px;
  box-shadow:0 20px 70px rgba(0,0,0,.9);
}
.mbox h2{color:var(--gold);font-size:1.15rem;letter-spacing:.12em;margin-bottom:14px;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.mbox h3{color:var(--gold);font-size:.92rem;margin:16px 0 6px}
.mbox p,.mbox li{font-size:.86rem;line-height:1.9;color:var(--ink-dim)}
.mbox li{margin-left:1.2em;margin-bottom:4px}
.mbox b{color:var(--ink)}
.mbox .em{color:var(--gold)}
.mbox .btn{
  display:block;width:100%;margin-top:18px;padding:13px;border-radius:11px;cursor:pointer;
  background:linear-gradient(180deg,#7a5d16,#5a4210);border:1px solid var(--gold);
  color:#fff5d6;font-family:inherit;font-size:.95rem;letter-spacing:.14em;transition:.15s;
}
.mbox .btn:hover{filter:brightness(1.18)}
.mbox .btn.ghost{background:#241d16;border-color:var(--line);color:var(--ink-dim);letter-spacing:.08em;font-size:.84rem}
.sec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:8px}
.sec-item{font-size:.72rem;padding:5px 8px;border-radius:7px;background:#1a1410;border:1px solid #332a1f;color:#5d5240}
.sec-item.got{color:#9fe08a;border-color:#4e6b3a;background:#1b2416}
.hist-item{font-size:.78rem;padding:7px 10px;border-left:2px solid var(--gold);background:#1a1410;
  margin-bottom:6px;border-radius:0 8px 8px 0;color:var(--ink-dim);line-height:1.6}
.hist-item b{color:var(--gold)}

/* ============ 擲骰彈窗 ============ */
#diceBox .drow{display:flex;gap:12px;justify-content:center;margin:18px 0}
.die{
  width:62px;height:62px;border-radius:13px;background:linear-gradient(160deg,#f3e8cf,#cbb98f);
  color:#241d16;font-size:1.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.6);
}
.die.rolling{animation:roll .5s linear}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
.die.dim{opacity:.28}
.totalline{text-align:center;font-size:1rem;color:var(--gold);letter-spacing:.1em;margin:10px 0}
.res-ok{color:#9fe08a}.res-bad{color:#f09a9a}

/* Toast */
#toasts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  background:rgba(30,22,15,.97);border:1px solid var(--gold);color:var(--ink);
  padding:9px 16px;border-radius:10px;font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.8);
  animation:tin .3s ease;line-height:1.5;text-align:center;
}
.toast.bad{border-color:#8b3a3a;color:#f0b0b0}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media(max-width:520px){
  #content{padding:12px 13px 210px}
  #text{font-size:.93rem;line-height:1.95}
  .inv-card{flex:0 0 208px}
}
</style>
</head>
<body>
<div id="grain"></div>
<div id="vignette"></div>

<!-- ================= 開始畫面 ================= -->
<div id="start" class="screen on">
  <h1>金斯波特蛻變記</h1>
  <div class="sub">THE KINGSPORT METAMORPHOSIS</div>

  <div class="book">
    <p>秋分之夜，一封來自陌生人 <b>伊萊賈·哈考特</b> 的信將你引向迷霧籠罩的哈考特莊園。</p>
    <p>蜘蛛在牆後爬行，夢境與現實的界線正在溶解。今晚七點整，你必須做出選擇——而你的每一個選擇，都將決定金斯波特、乃至整個世界的命運。</p>
    <p style="color:var(--gold);letter-spacing:.1em;font-size:.82rem">請先選擇一位調查員：</p>
  </div>

  <div class="inv-wrap">
    <div class="inv-grid" id="invGrid"></div>
  </div>

  <button class="mbox btn" id="btnBegin" style="width:min(640px,100%);margin-top:6px" disabled>選擇調查員後開始遊戲</button>
</div>

<!-- ================= 遊戲畫面 ================= -->
<div id="game" class="screen">
  <div id="topbar">
    <div class="row1">
      <span id="invName">—</span>
      <span class="badge" id="invRole">—</span>
      <span class="badge" id="chapBadge">第 1 章</span>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div id="main">
    <div id="scene"></div>
    <div id="content">
      <div id="chapNo">第 1 章</div>
      <div id="text"></div>
      <div id="fxline"></div>
    </div>
  </div>

  <div id="choices"><div class="inner" id="choicesInner"></div></div>

  <div id="nav">
    <button id="navHelp"><i>❔</i>說明</button>
    <button id="navSave"><i>💾</i>存檔</button>
    <button id="navLoad"><i>📂</i>讀檔</button>
    <button id="navHist"><i>📜</i>紀錄</button>
    <button id="navAch"><i>🏆</i>成就</button>
    <button id="navSound"><i>🔊</i>音效</button>
  </div>
</div>

<!-- ================= 彈窗容器 ================= -->
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<div id="toasts"></div>

<script>
/* =========================================================================
   1. 調查員資料
   ========================================================================= */
const INVESTIGATORS = {
  jacqueline:{
    name:'傑奎琳·法恩', role:'靈媒', wp:5, int:3, com:2, hp:6, san:9,
    item:'夢境日記', ability:'千里眼', weakness:'黑暗未來',
    prologue:'金斯波特的迷霧對你而言早已不陌生。自兒時起，你便能感受到那股令人窒息的壓抑感縈繞心頭，迷霧中還夾雜著來自無名之地的低語。當你的超自然感知牽引著你，手握一封詭異的信件走向被迷霧籠罩的金斯波特街道時，你知道自己別無選擇。',
    note:'主要能力：進行智力測試時，可擲2顆骰子並選取任意1顆的點數作為結果。'
  },
  lucius:{
    name:'盧修斯·加洛韋', role:'追夢人', wp:2, int:4, com:1, hp:8, san:6,
    item:'詩集', ability:'詩人', weakness:'洪水之夢',
    prologue:'文字於你向來信手拈來，睡眠卻並非如此——自伴侶魯迪失蹤後，安穩的睡眠便與你無緣。即便偶爾入眠，夜夜都會被同一個朦朧的水下城市幻象糾纏。如今你揣著一封神秘信件，行走在金斯波特的小巷中。',
    note:'主要能力：若消耗線索完成測試且測試成功，可獲得+1線索。'
  },
  lola:{
    name:'洛拉·海耶斯', role:'演員', wp:3, int:3, com:3, hp:6, san:6,
    item:'名片', ability:'隨機應變', weakness:'身份危機',
    prologue:'作為一名技藝精湛的演員，你可以化身成任何人。當一封來自伊萊賈·哈考特的信件寄來，邀請你前往他在金斯波特的宅邸時，你決定暫且放下表演，去這座迷霧繚繞的海濱小鎮看看。',
    note:'主要弱點：每次消耗資源時擲1顆骰子，若擲出1點，理智值-1。'
  }
};

/* =========================================================================
   2. 章節資料
   D[id] = { s:場景, t:文本, f:效果, c:選項[] }
   選項: {l:文字, g:章節, q:需求, t:測試}
   測試: {a:屬性, b:附加屬性, d:目標值, p:成功章, f:失敗章, c:'res'|'clue'}
   ========================================================================= */
const D = {

/* ---------- 序章與開場 ---------- */
1:{s:'mist',t:'金斯波特鎮坐落於密斯卡托尼克河入海口，被環繞海灣的秀美懸崖簇擁。抵達小鎮後，你望著金斯波特海岬那令人望而生畏的陡峭崖壁，望著縈繞在街巷中的繚繞迷霧，思索著自己此刻來到這裡的真正緣由。\n\n你從口袋裡掏出那封信。字跡潦草而扭曲：「種種離奇而緊急的狀況，迫使我懇請你前來哈考特莊園……請獨自前來，勿帶同伴，切勿告知他人。」\n\n距離約定的晚上七點還有幾個小時。你決定好好利用這段時間。',
  c:[{l:'前往金斯波特中心山街區——那裡住著為富豪們勞作的普通人',g:51},
     {l:'前往金斯波特港濱區——水手與碼頭工人的流言溫床',g:131},
     {l:'前往金斯波特南岸社區——街頭靈媒與千里眼的聚集地',g:211}]},

51:{s:'mist',t:'中心山街區盡是裝飾華麗的宅邸與古老的榆樹。你攔住一位從豪宅走出的中年婦人，問起哈考特莊園。\n\n「你來錯地方了，」她說，「哈考特莊園不在鎮上，它坐落在懸崖頂上。」她左右掃視一眼，壓低聲音：「那地方的氣氛，怪怪的。我見過它很多次——在夢裡，在噩夢裡。」\n\n她打了個寒顫，匆匆離去。',
  f:{clue:1},c:[{l:'動身前往哈考特莊園',g:150}]},

131:{s:'mist',t:'港濱區是大海、迷霧與小鎮之間的屏障。紅磚倉庫林立，漁船隨著潮汐起伏。你向漁民們提起伊萊賈·哈考特的名字，得到的卻只有一張張茫然的臉。\n\n你沿著港口繞行，最終抵達北角燈塔。爬上塔頂，你透過望遠鏡望向懸崖上的宅邸——卻只看到一片詭異的紫色迷霧。',
  f:{clue:1},c:[{l:'去港濱區的酒館打聽消息',g:47},{l:'動身前往哈考特莊園',g:150}]},

47:{s:'mist',t:'「繩錨酒館」是港濱區最有名的酒館。你買了一杯酒，坐在角落的卡座裡，留心聽著身邊的閒談——有人說起印斯茅斯附近沉沒的海盜船，有人談論阿卡姆的幫派火併，還有人謠傳一個信奉「蟲群之主」的宗教團體。\n\n但你始終沒聽到有人提起哈考特莊園。',
  f:{res:1},c:[{l:'動身前往哈考特莊園',g:150}]},

211:{s:'mist',t:'南岸是金斯波特的艺术和娛樂區。木板路上有電動旋轉木馬，還有各式各樣的攤位。你走進一座裝飾俗艷的帳篷——「茲維茲達夫人，神諭者」。\n\n老婦人握住你的手，久久不語。終於，她開口了：「你被召喚……前往夢之屋……前往夢魘之穴。黑暗中的織網者在等待……七人被召喚……儀式已然開始……而你的命運……我看不到！」',
  f:{clue:1},c:[{l:'去旁邊的哈哈鏡屋散散心',g:247},{l:'動身前往哈考特莊園',g:150}]},

247:{s:'mist',t:'哈哈鏡屋裡，每一面鏡子都以滑稽的方式扭曲著你的身形。然後，你站到了一面鏡子前——鏡中卻沒有你的倒影。\n\n鏡框裡根本沒有玻璃。你看不到大廳的後牆，只有一片徹頭徹尾的黑暗。黑暗中，有一個巨大而模糊的身影在蠕動。\n\n你一路狂奔，直到雙腳重新踏上木板路。',
  f:{san:-1,doom:1},c:[{l:'動身前往哈考特莊園',g:150}]},

150:{s:'manor',t:'馬車在一扇漆黑的鐵門外停下。車伕低聲嘟囔：「沒多少人願意來這兒，這是有原因的。」他收下車費後猛踩油門離去，甚至沒問你是否需要返程接送。\n\n你沿著紅楓夾道的碎石車道前行，薄霧在修剪整齊的草坪上飄蕩。門鈴響起後，一位面色蠟黃、頭髮抹滿髮油的管家打開了門。屋內的落地鐘正好敲響七下。\n\n客廳裡已聚集了六位客人。高瘦的律師佩雷格林·沃德走上前來，一一為你介紹：伊莎貝爾·哈考特、奧托·瓦努姆教授、霍勒斯·特倫霍姆、科拉·貝爾韋瑟醫生、路德·哈羅醫生。\n\n你該加入哪一方的交談？',
  c:[{l:'走近佩雷格林·沃德與伊莎貝爾·哈考特',g:120},
     {l:'走近奧托·瓦努姆教授與路德·哈羅醫生',g:220},
     {l:'走近霍勒斯·特倫霍姆與科拉·貝爾韋瑟醫生',g:190}]},

120:{s:'manor',t:'你走近角落，聽見伊莎貝爾正壓低聲音對律師說：「我不敢相信他竟然和我斷絕關係！你必須再為我跟他說說！」\n\n她察覺到你的到來，立刻閉了嘴。沃德轉過身，禮貌地問：「有什麼我能為你做的嗎？」\n\n你隨意地與他攀談起法律事務。他講述了信託文件、遺產糾紛與談判的微妙藝術。交談結束時，你摸清了法律從業者的思維模式。',
  f:{clue:1,ab:'法律知識'},c:[{l:'繼續與沃德交談',g:280}]},

220:{s:'manor',t:'「哦，又見面了。」瓦努姆教授說著，和你一起走到酒水車旁。這位學者身上透著一股緊張的氣息，手抖得厲害。\n\n「來點喝的？威士忌怎麼樣？」',
  c:[{l:'接受邀請，喝上一杯',g:250},{l:'禮貌地拒絕',g:280}]},

250:{s:'manor',t:'瓦努姆拔開酒瓶塞，給你倒了一杯，又給自己續上——威士忌都灑到了餐車上。\n\n「喝口酒就沒事兒了，」他強顏歡笑，「壯壯膽，一切都會好起來的。」\n\n「為什麼要壯膽？」\n\n「因為我想好好數落伊萊賈一頓。」他氣得鼻翼張開。',
  f:{res:1,secret:'酒後之勇'},c:[{l:'跟著管家走向書房',g:280}]},

190:{s:'manor',t:'「這麼說，你對蜘蛛的研究充滿熱情？」特倫霍姆正問貝爾韋瑟醫生。\n\n「是的，在蛛形動物學領域，我也算半個專家。」她臉頰泛紅，目光落回地上。\n\n「我有一次從巴西帶回一隻蜘蛛標本，」探險家說，「牠偷偷鑽進一箱陶片裡，在新英格蘭被開箱時，可把海關檢查員嚇了一大跳！」\n\n你插不上話，只能靜靜聽著。',
  f:{secret:'離我遠點'},c:[{l:'跟著管家走向書房',g:280}]},

280:{s:'manor',t:'一陣鈴聲打斷了交談。管家諾特走進客廳：「哈考特先生現在要見各位，請隨我去他的書房。」\n\n七個人跟在他身後穿過大廳。特倫霍姆搖了搖門把：「門打不開，鎖上了。」\n\n諾特鎮定地去開另一扇門，那副從容第一次出現了裂痕。「哈考特先生，您還好嗎？」\n\n裡面沒有回應。',
  c:[{l:'和特倫霍姆一起撞開門',g:195},
     {l:'掏出開鎖工具（需能力：盜賊或弱點：罪犯）',g:295,q:{ab:['盜賊'],wk:['罪犯']}}]},

195:{s:'manor',t:'「一起上。」你和特倫霍姆各抓住一扇門的把手。「數到三——一，二，三！」\n\n你們用盡全力撞向房門。門鎖周圍的木頭終於裂開，你們踉蹌著衝進書房。你的肩膀被撞得生疼。',
  f:{hp:-1},c:[{l:'看清書房裡的景象',g:111}]},

295:{s:'manor',t:'人生閱歷讓你掌握了不少本領，其中一項此刻恰好派上了用場。你掏出開鎖工具，很快聽到了鎖芯彈開的咔噠聲。\n\n你轉動門把手，推開了伊萊賈·哈考特的書房門。',
  f:{secret:'無鎖能擋'},c:[{l:'看清書房裡的景象',g:111}]},

111:{s:'study',t:'書房裡光線昏暗，唯一的光源是桃花心木書桌旁的鐵藝燈。一名穿著酒紅色吸煙裝、鬢角花白的男子癱倒在書桌上，身體以一種不自然的姿態蜷縮著。\n\n「舅舅！」伊莎貝爾大喊著衝上前，卻被律師攔住。\n\n「他還活著。」哈羅醫生宣佈道，空氣中的緊張感驟然消散，「看起來像是咬傷——有明顯的靶心狀傷痕。」\n\n「是蜘蛛咬傷？」門口的貝爾韋瑟醫生猜測道。\n\n書桌上，七封密封的信呈扇形整齊擺放著。',
  f:{doom:1},c:[
    {l:'協助哈羅與特倫霍姆將伊萊賈抬去臥室',g:23},
    {l:'和貝爾韋瑟醫生一起尋找那隻蜘蛛',g:63},
    {l:'趁機搜查書房',g:43},
    {l:'仔細查看書桌上那疊信',g:143},
    {l:'不想在哈考特莊園多待一秒，想離開',g:93}]},

23:{s:'manor',t:'你和特倫霍姆將伊萊賈·哈考特放上四柱床。哈羅醫生讓你們離開：「回到其他人身邊吧。」\n\n「真不敢相信，區區一隻蜘蛛的咬傷，竟能把人弄成這樣。」你說。\n\n「他還算幸運，我們是在北美，不是在南美。」探險家答道，「我見過一個人被巴西遊走蛛咬傷，半小時內就死了。」\n\n他的話非但沒讓你安心，反而讓你忍不住焦慮地掃視著黑暗的角落。',
  f:{san:-1,secret:'爬行的恐怖'},c:[{l:'下樓回到客廳',g:173}]},

63:{s:'study',t:'「大多數蜘蛛都喜歡陰暗、安靜的地方。」貝爾韋瑟醫生一邊說，一邊蹲下查看書桌底下。\n\n「哈考特脖子上的咬傷看著很嚴重，」你問，「你知道這是什麼蜘蛛咬的嗎？」\n\n「單從咬傷很難判斷。漏斗網蜘蛛的毒液會導致出汗、肌肉痙攣、昏迷甚至呼吸衰竭，但那是澳洲東部的物種。巴西遊走蛛的毒性也極強，但絕不會快到這種程度。」\n\n你點了點頭，記下了她的話。',
  f:{clue:1},c:[{l:'下樓回到客廳',g:173}]},

43:{s:'study',t:'你迫切想了解伊萊賈·哈考特究竟是怎樣的人，而探查他的書房——可以說是他私人的聖地——似乎是個不錯的開始。\n\n書房的牆上排滿了書架，書桌收拾得一塵不染。你想從哪裡開始？',
  f:{int:1},c:[{l:'翻看滿牆的書架',g:255},{l:'搜查哈考特的書桌桌面',g:155},{l:'仔細檢查書房的地面',g:115}]},

255:{s:'study',t:'有些書架被厚重的書籍壓得微微彎曲；有些則擺上了裝有蜘蛛標本的玻璃鐘罩；還有些書架上，放著各式各樣的神秘遺物：一尊用黑曜石雕刻的蜘蛛神像，長著數不清的眼睛；一面飽經風霜的絲質旗幟，上面繡著蛛網圖案。\n\n伊萊賈·哈考特顯然對蜘蛛有著一種執念。',
  f:{clue:1},c:[{l:'繼續查看書房的角落',g:289}]},

155:{s:'study',t:'書桌收拾得一塵不染，所有物品擺放得井井有條。你用手摩挲著吸墨紙，清晰地感受到鋼筆留下的凹痕——這是哈考特寫信時印在下面紙上的痕跡。\n\n你調整檯燈的角度，字跡輪廓漸漸清晰：「此事萬分棘手——要保全路德·哈羅醫生的名聲……你處理此事乾淨俐落，我們的帳目也因此兩清。」',
  f:{clue:1},c:[{l:'在吸墨紙下尋找更多線索',g:55}]},

55:{s:'study',t:'你在吸墨紙的一角下，發現了一張撕下來的碎紙，上面是哈考特的筆跡，寫著七個名字——而名單上的所有人，今晚都出現在這裡，包括你！\n\n你不知道這張紙為什麼會在這裡，但還是決定留著，以防萬一。',
  f:{clue:1,item:'名單'},c:[{l:'離開書房',g:289}]},

115:{s:'study',t:'書房的地板是拋光的黑橡木，鋪著一張土耳其地毯。地毯上複雜的圖案看得你眼睛生疼——那圖案讓你想到交錯的蛛網，每一張網都是一座迷宮。\n\n你被地毯經緯交織出的幻象吸引，幾乎錯過了書桌旁的【空玻璃罐】。',
  f:{doom:1,item:'空玻璃罐'},c:[{l:'離開書房',g:289}]},

289:{s:'study',t:'書房裡陰暗壓抑。你總覺得視野的邊緣有什麼東西在移動，但每當你轉頭去看，卻什麼都沒有——那些蠕動的陰影，又詭異地移到了你眼角的餘光裡。\n\n一聲刺耳的尖叫突然響徹整個莊園。是伊莎貝爾·哈考特！',
  f:{san:-1},c:[{l:'衝出書房查看',g:96}]},

143:{s:'study',t:'七封信都裝在密封的信封裡，字跡歪歪扭扭如蜘蛛爬行，你一眼就認出這是伊萊賈·哈考特的筆跡。\n\n「每個人都有一封。」伊莎貝爾走到你身側說道。\n\n「我們應該把信發下去，」你說，「這樣或許就能知道你舅舅為什麼要在今晚召集所有人。」\n\n她將信封疊成一摞，大步走出書房。',
  c:[{l:'跟著她回到客廳',g:173}]},

93:{s:'manor',t:'你不知道自己為何被召至哈考特莊園，也無意探尋答案。你穿過大廳走向正門，轉動把手推開門——卻被突然擋在身前的管家諾特猛地關上。\n\n「你想去哪裡？」他低吼道。\n\n「我要離開。」\n\n「哈考特先生邀請你來是有原因的，」管家的眼神和語氣一樣冰冷，「你不想知道原因嗎？」\n\n你鬆開了門把手。',
  f:{clue:1,wp:-1},c:[{l:'回到其他人身邊',g:173}]},

173:{s:'manor',t:'哈羅醫生完成檢查後，讓所有客人聚集到客廳。\n\n「依舊處於昏迷狀態，」他答道，「家裡的傭人會輪流照看他。」\n\n伊莎貝爾舉起那疊密封信封：「我們可以弄清楚，我舅舅為什麼召集我們所有人來這裡。」\n\n諾特管家開始逐一分發，念出收信人的名字。念到你時，你接過信封，走到客廳的角落。',
  c:[{l:'拆開寫給自己的那封信',g:216}]},

216:{s:'manor',t:'我的朋友：\n\n你想必會疑惑，我為何會召喚你前往哈考特莊園——我們素未謀面，而今晚齊聚於此的其他賓客，皆是我的熟人。\n\n但即便如此，你也切莫將此視為疏忽。事實上，你在今晚的儀式中扮演著至關重要的角色。其他人皆有各自的缺點和不可告人的秘密，唯有你，一身清白。\n\n因為，鑰匙將通過你轉動，門，也將通過你開啟。\n\n不要抗拒即將到來的一切。一切皆已預見，一切皆已準備就緒。',
  c:[{l:'繼續讀下去',g:20}]},

20:{s:'spider',t:'諾特分發完信件，手裡還剩一封。「科拉·貝爾韋瑟醫生。」他念著信封上的名字。\n\n「貝爾韋瑟醫生在哪裡？」沃德語氣煩躁。\n\n就在這時，大廳對面傳來一聲尖叫，緊接著是東西摔在地上的聲音。\n\n沃德快步帶頭穿過大廳，在書房門口停住。貝爾韋瑟醫生倒在地上，雙眼緊閉，痛苦地呻吟著，額頭上佈滿汗珠。她的右手背呈現深紫色，並且已經開始腫脹。\n\n「看來她找到那隻蜘蛛了。」特倫霍姆說。',
  c:[{l:'前去救助貝爾韋瑟醫生',g:98},
     {l:'進入書房，專門尋找那隻蜘蛛',g:128},
     {l:'聽從瓦努姆教授的建議，留在原地',g:158}]},

98:{s:'spider',t:'你衝進房間，跪在貝爾韋瑟醫生身邊，擦去她額頭上的汗水。\n\n她動了動，嘴唇微張，發出含糊不清的囈語。那聲音聽起來像：「奧托在恐怖之物中見過這樣的徵兆。」但也可能是別的意思。\n\n突然有人大喊：「小心！」\n\n霍勒斯·特倫霍姆衝進書房，手裡拿著一個玻璃罐，猛地撲到地上。等他站起身時，罐子裡已困住了一隻可怖的蛛形生物。',
  c:[{l:'查看那隻蜘蛛',g:244}]},

128:{s:'spider',t:'「你在做什麼？」瓦努姆教授難以置信地驚呼。\n\n「做我早該做的事，」你告訴他，「在這隻蜘蛛咬到第三個人之前，找到牠。」\n\n你仔細搜查著房間，努力思考這隻剛咬了貝爾韋瑟醫生的蜘蛛此刻會藏在哪裡。',
  c:[{l:'搜尋書房（測試：智力）',t:{a:'int',d:7,p:178,f:239}}]},

178:{s:'spider',t:'就在這時，你的餘光瞥見有東西從書桌下竄了出來。那東西看起來像一團紅黑相間的毛線，靠著八條腿在地毯上移動，正朝著一個書櫃下的陰影爬去。\n\n你要是有東西能困住牠就好了！',
  c:[{l:'用【空玻璃罐】扣住牠（需物品：空玻璃罐）',g:198,q:{item:'空玻璃罐'}},
     {l:'來不及了，只能眼睜睜看著牠逃走',g:6}]},

198:{s:'spider',t:'你迅速從口袋裡掏出玻璃罐，擰開蓋子——要在蜘蛛逃掉前抓住牠，你必須動作迅速。',
  c:[{l:'撲上去扣住牠（測試：戰鬥／敏捷）',t:{a:'com',d:8,p:225,f:35,c:'res'}}]},

225:{s:'spider',t:'你縱身向前，將罐子狠狠扣在蜘蛛身上，迅速扶正、蓋上蓋子並擰緊。多虧你反應迅速，終於抓住了元兇！\n\n牠圓滾滾的黑色軀體上，佈滿了詭異的猩紅骷髏紋路，眼睛則是無數閃閃發光的黑珍珠，巨大的顎部上，兩根針狀毒牙的尖端各掛著一滴透明的液體。若是將腿展開，大小堪比你的拳頭。',
  f:{san:1,item:'完整標本罐'},c:[{l:'把罐子交給特倫霍姆',g:244}]},

35:{s:'spider',t:'你猛地向前一躍，將罐子狠狠扣向蜘蛛——可你的反應還是慢了一瞬，差之毫釐沒能扣中。蜘蛛受驚逃竄了。\n\n「把東西給我！」特倫霍姆厲聲喝道，一把從你手中奪過容器。他片刻未停，縱身追向逃竄的蜘蛛，整個人撲趴在地上。等他再次起身時，那隻可怖的怪物已被他困在玻璃罐中。',
  f:{com:-1,doom:1,secret:'逃之夭夭的傢伙'},c:[{l:'查看那隻蜘蛛',g:244}]},

6:{s:'spider',t:'那隻蜘蛛趁機逃走，消失在書房黑暗的角落裡，只留下一個令人不安的事實——牠還在這裡，任何人都可能成為牠的下一個獵物。\n\n你突然開始想像成群的蜘蛛爬過地板朝你湧來，不由得後退一步。',
  f:{san:-1},c:[{l:'回到其他人身邊',g:244}]},

239:{s:'spider',t:'沒用的，你找不到任何線索。你滿心沮喪地朝書房門口走去。\n\n突然有人大喊：「小心！」所有人四散躲避。\n\n霍勒斯·特倫霍姆拿著一個玻璃罐，朝一隻黑影撲了過去。他幾乎是撲到了你的腳邊，片刻後站起身，罐子裡已困住了一隻恐怖的蜘蛛。',
  f:{int:-1},c:[{l:'查看那隻蜘蛛',g:244}]},

158:{s:'spider',t:'哈羅醫生在特倫霍姆的陪同下，小心翼翼地再次走進書房。就在所有人的目光都聚焦在書房內時，瓦努姆教授悄悄走到你身邊，用只有你們兩人能聽到的聲音低聲說：「你覺得這事會不會和她有關？」\n\n「和伊萊賈身上發生的事有關？但那只是一場意外，不是嗎？」\n\n瓦努姆教授意味深長地看了你一眼：「真的是意外嗎？」',
  c:[{l:'繼續追問瓦努姆教授',g:264},{l:'不理會他，專心看著書房裡的情況',g:178}]},

264:{s:'spider',t:'「當然是這樣，肯定是這樣。」你強詞奪理，心裡卻清楚地知道，你在書房地板上的發現，現在正藏在口袋裡。\n\n會不會是有人把蜘蛛帶進房子，又故意放到書房裡，想要傷害伊萊賈·哈考特？如果是這樣，那個人是誰？\n\n瓦努姆的寥寥數語，讓你突然意識到——在場的任何人，都可能參與了這場陰謀。',
  f:{wk:'偏執',san:-1},c:[{l:'看看能不能抓住那隻蜘蛛',g:198}]},

244:{s:'spider',t:'探險家將罐子在手中轉了轉，仔細觀察著裡面的獵物。\n\n「這是什麼品種？」你問道。\n\n「我不知道，」特倫霍姆答道，「我從未見過這樣的蜘蛛。」\n\n哈羅醫生將罐子放在邊桌上，從醫療包裡拿出一個磨口玻璃瓶、一把鑷子和一團棉花。他蘸了些液體，擰開罐蓋，將浸濕的棉花放了進去。眾人看著罐中的蜘蛛翻倒在地，腿蜷縮到身體下方，無聲地死去。\n\n「我得喝一杯。」特倫霍姆說著，朝客廳走去。',
  f:{clue:1},c:[{l:'跟隨特倫霍姆去客廳',g:76},
     {l:'和伊莎貝爾·哈考特一起在前廳等候',g:290},
     {l:'搜查書房',g:41}]},

76:{s:'manor',t:'特倫霍姆徑直走向酒水車，給自己倒了一大杯蘇格蘭威士忌，一飲而盡後，又立刻倒了第二杯。\n\n「你今晚喝得不少啊。」沃德給自己倒了杯白蘭地。\n\n「你去跟那位好教授說啊。」特倫霍姆怒氣沖沖。\n\n「我看他的問題，不在於喝酒。」\n\n「他人呢？」特倫霍姆環顧四周。\n\n「我好像看到他去圖書館了。」',
  c:[{l:'離開客廳，去找圖書館',g:191},{l:'也覺得口渴，倒杯酒喝',g:106}]},

191:{s:'library',t:'圖書館位於莊園東北角，牆上排滿深色木質的嵌入式書櫃，兩扇窗戶拉著窗簾。\n\n奧托·瓦努姆教授正站在南牆書架前翻閱書籍。他瞥了你一眼，挑了挑眉：「需要幫忙嗎？」',
  c:[{l:'「你在找什麼特定的書嗎？」',g:206},{l:'「不用，謝謝，我只是想自己看看。」',g:219}]},

206:{s:'library',t:'「只是我借給伊萊賈的一本書，」教授答道，「關於南美洲的蜘蛛教派。」\n\n「對於一位歷史學家來說，這題材未免太偏門了吧？」\n\n「這是我的個人愛好。亞馬遜盆地有隱秘的阿拉胡卡織網者教派，巴拉圭潘塔納爾濕地則有紅蜘蛛網教派。還有納斯卡線條——那規模之大，只有從高處才能看清全貌。」\n\n「伊萊賈也對這些教派感興趣？」\n\n「何止是感興趣，」瓦努姆答道，「對我而言這只是愛好，對伊萊賈來說，這是執念。」',
  f:{clue:1,secret:'書蟲'},c:[{l:'繼續追問教授',g:268},{l:'讓他離開，自己看書',g:219}]},

268:{s:'library',t:'「你認識伊萊賈·哈考特很久了嗎？」\n\n「好些年了。」\n\n「你們倆關係很近？」\n\n「以前是，現在不是了。」他眼中掠過一絲悵然。\n\n「能問問原因嗎？」\n\n「伊萊賈想把我們共同的研究推向下一個階段——從理論研究走向實際實踐。他想從學術探索，跨到真正的儀式重演。我當然反對。我雖對神秘學感興趣，卻從沒想過要去施展黑魔法。」',
  f:{clue:1},c:[{l:'「所謂的黑魔法指的是什麼？」',g:199},{l:'讓他離開，自己看書',g:219}]},

199:{s:'library',t:'「那些邪惡的法術、巫術、血祭！」瓦努姆的聲音顫抖著，「伊萊賈已經瘋了！為了將我們從古籍中拼湊出的儀式付諸實踐，他甚至願意犧牲一條人命。這對他而言，不過是一場盛大的實驗。但我絕不參與其中！就這樣，我們分道揚鑣了。」',
  f:{clue:1},c:[{l:'讓他離開，自己看書',g:219}]},

219:{s:'library',t:'「恕我失陪。」教授含糊地說了一句，便匆匆離開，只留下你獨自在圖書館。\n\n你開始瀏覽書架。書排列得整整齊齊，但你注意到幾處空缺。有人在取書時不慎掉了一樣東西——是一枚【皮質書籤】。\n\n三本書的書名格外醒目：《海波里亞的異教秘典》、《老金斯波特及其奇聞》、《夢遊者之路》。',
  f:{item:'皮質書籤'},c:[{l:'翻閱《海波里亞的異教秘典》',g:13},
     {l:'翻閱《老金斯波特及其奇聞》',g:65},
     {l:'翻閱《夢遊者之路》',g:90}]},

13:{s:'library',t:'這本破舊的對開本記載了在海波里亞盛行的秘密社團與黑暗異教。書中羅列的教派包括崇拜慵懶之神撒托古亞的教派、崇拜眾蛇之父伊格的蛇崇拜者，還有亞特蘭-納卡的信徒。\n\n這位蜘蛛女神的信徒們相信，她居住在海波里亞深處的洞穴中，編織著一張無邊無際的巨網，跨越各個現實維度。在他們眼中，這張巨網就是命運本身，所有生命都被困在蛛絲之中。',
  f:{clue:1,ab:'神秘研究',item:'海波里亞的異教秘典'},c:[{l:'繼續調查',g:110}]},

65:{s:'library',t:'這本旅遊手冊記錄了金斯波特從清教徒定居點發展為捕鯨與海上貿易中心的歷史。書末一章《老金斯波特的傳說》記載了超自然故事：幽靈水手會在月升時分現身碼頭；在迷霧籠罩的小巷中夢遊的人，永遠無法被喚醒；還有「金斯波特唱詩班」——只有冬至夜才能聽到的遠方吟唱。',
  f:{clue:1,item:'老金斯波特及其奇聞'},c:[{l:'繼續調查',g:110}]},

90:{s:'library',t:'《夢遊者之路》是一本淡皮面的薄冊，文字支離破碎。書中提出，夢遊並非病症，而是靈魂竭力前往幻夢境的表現。書中記載了呼吸練習、象徵性的手勢，還有低語召喚——據說這些能弱化肉體與入夢靈魂之間的聯結。\n\n作者將幻夢境描繪成現實世界的倒影——更變幻莫測、危機四伏，卻也是隱秘知識的源頭。',
  f:{clue:1,item:'夢遊者之路'},c:[{l:'繼續調查',g:110}]},

110:{s:'library',t:'你突然聽到一陣令人不安的聲響從房間北側傳來——聽起來像是什麼東西在抓撓窗戶，彷彿想闖進來。',
  c:[{l:'前去查看',g:121},{l:'不去理會，繼續看書',g:145}]},

121:{s:'library',t:'你走到窗邊拉開窗簾，立刻嚇得後退一步——窗外的玻璃上爬著好幾隻大蜘蛛，每一隻都和捕鳥蛛一般大，甚至更大。\n\n透過這可怖的景象，你看到一棵白蠟樹緊挨著房子生長，樹幹的樹洞裡，正爬出更多的蛛形恐怖生物！\n\n你猛地拉上窗簾，恐懼地逃出了圖書館。',
  f:{wp:-1,secret:'白蠟樹'},c:[{l:'衝回大廳',g:96}]},

145:{s:'library',t:'圖書館裡無疑還有許多值得學習的知識，但你知道，這棟房子裡並非只有這一個房間藏著秘密。',
  c:[{l:'繼續研讀這些書',g:201}]},

201:{s:'library',t:'你重新翻開那本對開本，將關於亞特蘭-納卡教派的章節讀得更仔細了些。信徒們相信，所有倖存者都會被視為織網者選中的孩子。在他們眼中，這張不可思議的巨網就是命運本身。\n\n在黑暗中侍奉這位織網者，就是接受並擁抱自己在命運中的位置。',
  f:{clue:1,ab:'勤學'},c:[{l:'離開圖書館',g:96}]},

140:{s:'library',t:'圖書館裡收藏著大量關於蛛形綱動物的專業知識，令人嘆為觀止。但你心裡清楚，留在這裡不會再有更多收穫了。',
  c:[{l:'離開圖書館',g:96}]},

106:{s:'manor',t:'沃德為你倒了一杯酒，你接過酒杯一飲而盡，白蘭地的灼燒感直抵胃裡。\n\n你注意到那封寫給科拉·貝爾韋瑟醫生的信，顯然是剛才所有人衝回書房查看她的情況時，諾特慌亂中落下的。\n\n特倫霍姆也注意到了：「我們應該打開看看。」\n\n「不行，」沃德態度堅決，「這是寫給貝爾韋瑟醫生的私人信件，必須等她恢復意識後，由她自己打開。」',
  f:{res:1},c:[{l:'趁兩人爭執時搶走信件並打開',g:136},{l:'認為沃德說得對，信件應保持密封',g:166}]},

136:{s:'manor',t:'「你在做什麼？」沃德看到你一把抓起信封，驚恐地驚呼。\n\n「我要讀伊萊賈·哈考特寫給貝爾韋瑟醫生的信。」你斷然說道，準備用手指挑開封蠟。\n\n「我命令你住手！」他怒吼道。你突然明白，在法庭上與這個男人對峙是什麼感覺。',
  c:[{l:'無視他的命令，撕開信封（測試：意志力）',t:{a:'wp',d:8,p:196,f:5,c:'res'}}]},

196:{s:'manor',t:'你無視律師的存在，撕開信封讀了起來：\n\n「我親愛的科拉：真有意思，一個對蛛網和大自然的精妙陷阱瞭若指掌的人，在為自己編織陷阱時，竟會如此笨拙……你竟會將職業上的資助，錯當成個人的愛慕。\n\n請原諒我的直言：在我所關注的事情中，情感毫無容身之地。我並非出於殘忍而拒絕你，而是出於清醒。\n\n但既然你曾慷慨地將心交給我，今晚，我將欣然接納你的一切——你的心，你的身，你的靈魂。」',
  f:{clue:1,secret:'惡意信件'},c:[{l:'回到爭執中',g:166}]},

5:{s:'manor',t:'你遲疑了一瞬，就在這一瞬間，佩雷格林·沃德一把奪過了你手中的信。\n\n「在我們試圖弄清楚發生了什麼的時候，我希望你能保持基本的禮儀。」律師將信塞進了灰色外套的胸袋裡。\n\n「你覺得有不對勁的地方？」探險家問。\n\n「你覺得呢？」沃德反唇相譏。兩人交換了一個詭異的眼神。',
  f:{wp:-1},c:[{l:'繼續聽他們爭執',g:166}]},

166:{s:'manor',t:'「你願意把伊萊賈寫給你的信分享給大家嗎？」沃德向特倫霍姆質問道。\n\n「我不願意。」探險家直截了當地答，「但我猜你早就知道信裡寫了什麼，畢竟你是他的私人律師。」\n\n「我向你保證，我甚至不知道哈考特先生寫了這些信。」\n\n「哦，是嗎？那你總該知道，他還沒支付我上次為他從南美帶回那些文物的報酬吧？」',
  c:[{l:'追問特倫霍姆關於欠款的事',g:236},{l:'不再追問，四處看看',g:96}]},

236:{s:'manor',t:'「我們早就有約定，」特倫霍姆解釋道，「只是伊萊賈似乎故意忘了之前說好的事。我今晚來這裡，就是為了找他說清楚。」\n\n就在這時，一名女傭溜進房間，給酒水車上的水瓶添水。特倫霍姆看到她，臉漲得通紅，刻意不去看她。\n\n沃德挑了挑眉：「你確定只是為了這個？」',
  f:{clue:1},c:[{l:'繼續觀察',g:96}]},

290:{s:'manor',t:'「諾特說一小時內到，」你回答了她未說出口的問題，「但現在已經過去半個小時了。」\n\n「我還是這裡等吧。」伊莎貝爾答道。\n\n「你在客廳裡會不會更舒服些？」\n\n「不，我只想離其他人越遠越好。」她坦言，「作為金斯波特一位富有隱士的姪女，有好處，也有諸多不便。」',
  c:[{l:'打開前門，看看醫護人員是否快到了',g:91},{l:'留在前廳陪她',g:274}]},

274:{s:'manor',t:'你再也無法忍受在這裡無所事事地多待一秒。哈考特莊園裡一定藏著什麼秘密，你決心把它找出來。',
  c:[{l:'返回書房',g:41},{l:'上樓查看伊萊賈·哈考特',g:62},{l:'去客房看看',g:214}]},

41:{s:'study',t:'這棟陰森宅邸裡的一切禍事，都始於書房，所以你決定回去看看，說不定還有什麼線索被遺漏了。',
  c:[{l:'翻看滿牆的書架',g:255},{l:'搜查書桌桌面',g:155},{l:'仔細檢查地面',g:115}]},

214:{s:'manor',t:'客房位於二樓南側。這片區域靜得可怕，唯一能聽到的，是附近某扇臥室窗戶被樹枝刮擦的持續聲響。\n\n你推開第一間房的門——床上空無一人，凌亂的床單表明有人曾在這裡躺過。第二間房同樣空著。\n\n所有人都去哪了？',
  f:{san:-1,doom:1,item:'黃銅鑰匙'},c:[{l:'去查看伊萊賈·哈考特的房間',g:8},{l:'回到大廳',g:96}]},

62:{s:'manor',t:'伊萊賈·哈考特的臥室門開著，床頭燈的光芒灑進房間，透著一絲暖意。',
  c:[{l:'走進房間',g:8}]},

8:{s:'manor',t:'走進臥室，你發現裡面空無一人。四柱床上有睡過的痕跡，但伊萊賈·哈考特此刻並不在這裡。\n\n他是身體好轉，能自己走出臥室了，還是被人轉移到了別處？如果是前者，他現在在哪裡？如果是後者，是誰轉移了他？',
  f:{doom:2},c:[{l:'搜查房間尋找線索',g:28},{l:'立刻離開房間，尋找失蹤的病人',g:48}]},

28:{s:'manor',t:'臥室的裝修風格顯得有些過時。除了床，哈考特的臥室裡還有三件顯眼的家具——一張床頭櫃、一個高腳五斗櫃，還有一個三開門的法國橡木大衣櫃。\n\n（本次冒險中，你選擇搜查床頭櫃。）',
  c:[{l:'打開床頭櫃的抽屜',g:167},{l:'查看床底',g:4}]},

167:{s:'manor',t:'床頭的閱讀燈散發著柔和的光線。打開床頭櫃的抽屜後，你發現了一盒【火柴】。你猜測，這是為停電時準備的，也可能是哈考特用來抽煙斗的。',
  f:{res:1,item:'火柴'},c:[{l:'離開臥室',g:276}]},

4:{s:'spider',t:'你雙膝跪地，掀開床幔的一角，窺探四柱床底的黑暗。\n\n眼睛漸漸適應了昏暗的光線，你開始看到無數閃閃發光的圓球，在微弱的光線下，像擦亮的黑珍珠一般。這樣的圓球一定有上百個！\n\n又過了片刻，你的視力終於足夠清晰，才意識到自己看到的是上百隻眼睛，屬於幾十隻大小不一的蜘蛛。',
  f:{san:-1,doom:1,wk:'恐蛛症'},c:[{l:'離開臥室',g:48}]},

48:{s:'manor',t:'你走出哈考特的臥室，突然瞥見走廊平台的另一頭有東西在動——似乎有人剛躲進了通往「博物館」的前廳陰影裡。',
  c:[{l:'追上去一探究竟',g:287},{l:'不去理會，回到大廳',g:282}]},

287:{s:'manor',t:'你快步穿過走廊，走進前廳，看到一條狹窄、昏暗的傭人通道。你沿著通道往前走，來到一段狹窄樓梯的頂端。\n\n聽到前方傳來地板的嘎吱聲，你繼續追了上去。你剛要轉身，一個沉重的東西猛地砸在你的肩胛骨之間，接著又砸中了你的頭。',
  f:{hp:-1},c:[{l:'陷入黑暗……',g:283}]},

282:{s:'manor',t:'一聲刺耳的尖叫響徹整個莊園。\n\n是伊莎貝爾·哈考特！她出什麼事了？\n\n你循聲跑去，心臟狂跳不止，來到了中央樓梯口。但這聲尖叫，是從一樓傳來的，還是二樓？',
  c:[{l:'在一樓尋找伊莎貝爾',g:296},{l:'在二樓尋找伊莎貝爾',g:256}]},

296:{s:'manor',t:'你沿著走廊朝廚房的方向走去。抵達廚房時，你撞見了兩名正在幹活的女傭。\n\n「希望沒有打擾到你們。」你邁步走進房間。其中一位年輕姑娘張了張嘴，目光卻從你身上移到了你身後的某處。\n\n你瞬間噤聲。後頸的寒毛猛地豎了起來，你剛要轉身——',
  f:{hp:-1},c:[{l:'陷入黑暗……',g:283}]},

256:{s:'manor',t:'你快步上樓，瞥見有人走進了通往博物館的前廳。你循著一聲壓抑的叫喊走進傭人通道，來到另一段狹窄樓梯的底端——這段樓梯只能通向閣樓。\n\n你開始往上爬，卻突然僵住——地板的嘎吱聲再次傳來，這次是從身後。你轉過身，看到伊莎貝爾站在樓梯底端，諾特跟在她身後。管家將她的一隻胳膊扭到背後，一把刀架在她的脖子上。\n\n「請吧。」諾特說著，逼你一路爬到樓頂。',
  c:[{l:'繼續往上爬',g:213}]},

283:{s:'attic',t:'你慢慢恢復了意識，發現自己直立著，被黑暗包裹。周圍模糊的陰影中，房梁和托樑漸漸清晰——你在哈考特莊園的閣樓裡。\n\n不僅如此，你還動彈不得。有人正站在你身後，還在繼續纏裹著你——用蛛絲！',
  f:{secret:'遭人伏擊'},c:[{l:'拼命扭動、掙扎（測試：戰鬥＋生命值）',t:{a:'com',b:'hp',d:12,p:265,f:215,c:'res'}}]},

265:{s:'attic',t:'你拼命踢打、掙扎，蛛絲結成的束縛漸漸鬆動，最終被你掙脫。伊莎貝爾就在你身邊，也被粗厚的蛛絲纏了大半，你幫她掙脫了這黏膩的東西。\n\n當你再次看向眼前的景象，忍不住倒吸一口涼氣——閣樓的地板上，竟放著五個包裹。\n\n其他客人，都被裹在了同樣的粗厚蛛絲裡，像裹上了裹屍布，只露出臉——貝爾韋瑟醫生、瓦努姆教授、沃德、哈羅醫生，甚至還有特倫霍姆。',
  c:[{l:'看清這一切',g:194}]},

215:{s:'attic',t:'你拼盡全力想要掙脫，可粘稠的蛛絲早已將你緊緊纏住，動彈不得。\n\n伊莎貝爾就在你身邊，也被厚厚的蛛網纏了一半。而你面前的地板上，放著五個包裹——每個的大小都足以裝下一個人。\n\n蛛網中央盤踞著一個黑影。那隻怪物從蛛網上爬下來，用八條腿穿過積滿灰塵的地板，朝你逼近。它的八條腿怪異至極，像關節扭曲的人類手臂。\n\n「現在，鑰匙必須轉動了！」諾特的聲音響起。\n\n這是您聽到的最後一句話。',
  end:{stars:0,title:'鑰匙轉動',text:'你的頭顱被硬生生從身體上咬了下來。金斯波特的迷霧，吞噬了又一個無名的靈魂。'}},

194:{s:'attic',t:'你開始明白，自己為何會來到這裡，為何會在秋分之日來到哈考特莊園，以及自己需要做什麼。\n\n你從口袋裡掏出那些在宅邸中搜集到的物品，它們在紫色的微光下發出低鳴。你感到一股力量湧入四肢。',
  f:{ab:'堅定'},c:[{l:'直面眼前的怪物',g:69}]},

174:{s:'attic',t:'你開始相信，自己的處境已經毫無希望，無論做什麼，都無法改變宇宙為你安排的命運。\n\n蛛網中央的怪物動了動。在閣樓半明半暗的光線中，你看清了牠的臉——那是一張人類的臉，扭曲地融合在臃腫的蜘蛛軀體上。\n\n伊萊賈·哈考特。',
  f:{san:-1,doom:1},c:[{l:'直面眼前的怪物',g:69}]},

69:{s:'attic',t:'「我猜，這一切都是你安排的吧。」你怒聲說道。\n\n「這是我的工作。」諾特答道。他蠟黃的臉上，綻開一抹令人作嘔的笑容。「管理傭人，確保宅邸和莊園的一切運轉順暢。」\n\n「你是說，這一切都是管家幹的？」伊莎貝爾尖叫。\n\n「正是。我奉行的三個信條是：服務、管理、謹慎。」',
  f:{secret:'管家是兇手'},c:[{l:'推理這一切（測試：智力）',t:{a:'int',d:10,p:92,f:124,c:'clue'}}]},

92:{s:'attic',t:'「你的意思是，你是受他人指使行事？」\n\n「我為哈考特先生服務了三十三年，」諾特答道，「我活著就是為了侍奉他。」\n\n「這從一開始就是哈考特的計劃，」你恍然大悟，「這就是他在這個特別的夜晚，邀請所有人來這裡的原因。」\n\n「秋分之日，」諾特說，「光明與黑暗的交界點，一個象徵轉變的時刻，此時兩界之間的帷幕會變得稀薄。」',
  f:{int:1,clue:1,secret:'管家並非真兇'},c:[{l:'繼續聽下去',g:124}]},

124:{s:'attic',t:'「你對他們做了什麼？」你目光緊盯著其他客人的軀體。\n\n「這不是我做的，是那些入夢的人，他們的夢境撐開了通往偉大的亞特蘭-納卡領域的傳送門。」諾特平靜地說道，「哈考特先生即將迎來他的蛻變，他將加入母神的行列。現在，只需要鑰匙打開門就夠了。」\n\n「我就是那把鑰匙？」\n\n「沒錯！因為你見證了這一切。你掌握的隱秘知識，是解鎖真相的鑰匙！」\n\n兩名女傭從陰影中現身，抓住你和伊莎貝爾。',
  c:[{l:'掙脫束縛（測試：戰鬥）',t:{a:'com',d:8,p:149,f:253,c:'res'}}]},

149:{s:'attic',t:'你掙脫了年輕女傭的束縛，這讓她們猝不及防，也為伊莎貝爾創造了脫身的機會。\n\n「你們竟敢違抗亞特蘭-納卡的意志？」管家大喊，「你們儘管掙扎，主人會將你們的反抗當作盛宴！」\n\n你帶頭衝上前去，伊莎貝爾緊隨其後。',
  c:[{l:'與傭人搏鬥（戰鬥三輪）',t:{a:'com',b:'wp',d:12,p:221,f:168}}]},

221:{s:'attic',t:'在伊莎貝爾的全力協助下，你們二人一同對抗管家和兩名女傭。戰鬥激烈而膠著——但最終，人類求生的慾望，戰勝了諾特和女傭們失控的瘋狂。',
  f:{com:1,wp:1},c:[{l:'看清眼前的景象',g:238}]},

168:{s:'attic',t:'儘管你在絕望中拼死反抗，但諾特和女傭們的行動，卻被一種狂熱的執念驅使著。而伊莎貝爾根本不擅長搏鬥。\n\n你的身體被打得遍體鱗傷，反抗的意志也被徹底擊潰。',
  c:[{l:'管家高舉起化石毒牙……',g:270}]},

270:{s:'attic',t:'你被眼前的局面壓得喘不過氣，想不出任何話語能阻止諾特完成這場他早已開啟的儀式。\n\n諾特用盡全身力氣，猛地將尖刺刺下，這根化石毒牙穿透了你的胸膛。你在震驚和劇痛中尖叫，這把獻祭的武器擊碎了你的肋骨，刺穿了你的心臟。\n\n在陷入虛無之前，你聽到的最後聲音，是伊莎貝爾·哈考特因恐懼和劇痛發出的尖叫。',
  end:{stars:0,title:'門，開啟了',text:'伊莎貝爾被獻祭了，只為讓她的舅舅實現夢想，飛升而去，加入他那褻瀆神明的主。'}},

253:{s:'attic',t:'無論你如何掙扎，都無法掙脫女傭們的控制。你和伊莎貝爾被死死抓住，諾特走上前，眼中閃爍著狂熱的光芒。\n\n「見證鑰匙的誕生吧！以血肉為軀，以夢境為印，在陰影中編織而成。鑰匙是真實的。」\n\n然後他看向伊莎貝爾：「見證門的降臨吧！受膏者之軀，獻祭之門。」\n\n在那恐怖的一刻，你終於明白伊莎貝爾注定要扮演的「門」的角色。\n\n你唯一的武器只剩語言。',
  c:[{l:'急中生智，設法阻止他（測試：智力）',t:{a:'int',d:10,p:292,f:270,c:'clue'}}]},

292:{s:'attic',t:'「我就是鑰匙！」你帶著近乎狂熱的虔誠宣告，「承蒙選中，為受膏者開啟大門，我何其有幸。」\n\n諾特露出一絲錯愕的神情。你朝他伸出手：「讓我來完成這獻祭的一擊。」\n\n有那麼一瞬間，諾特似乎真的要把那根石製尖刺遞給你。抓住你的女傭也稍稍放鬆了手上的力道。\n\n但這就夠了。你握緊隨身攜帶的【化石毒牙】，掙脫束縛，將石刺的尖端狠狠刺進了管家的胸膛。',
  q:{item:'化石毒牙'},c:[{l:'面對失控的女傭（戰鬥）',t:{a:'com',b:'wp',d:14,p:238,f:84}}]},

84:{s:'attic',t:'這些女傭早已不再是純粹的人類，卻擁有超越人類的力量。她們的瘋狂攻擊讓你節節敗退，渾身是傷。\n\n就在這時，伊莎貝爾挺身而出，加入了戰鬥。她不知從哪裡找來一根斷椅腿，握在手中，和你並肩作戰。',
  f:{hp:-1},c:[{l:'重新鼓起勇氣反擊',g:238}]},

238:{s:'attic',t:'哈考特的傭人一動不動地躺在粗糙的地板上。你怔怔地看著，血液竟開始移動——並非毫無規律地流淌，而是帶著邪惡的目的，緩緩流向閣樓裡那張巨大的蛛網。\n\n當血液觸碰到蛛絲，絲縷漸漸變暗，先變成粉色，又變成紅色，彷彿在吸食血液。\n\n「鑰匙轉動……大門開啟……受膏者降臨。」\n\n顯然，血液來自何處並不重要，重要的是，血液已然流淌。而隨著血液的流淌，伊萊賈·哈考特的蛻變，完成了。',
  f:{san:-1},c:[
    {l:'直接攻擊哈考特蜘蛛怪',g:135},
    {l:'看看自己有沒有能對抗牠的物品',g:197},
    {l:'使用魔法',g:82},
    {l:'喚醒沉睡者',g:262},
    {l:'逃離這座宅邸',g:126},
    {l:'穿過蛛網，逃進另一邊的異界洞穴',g:18}]},

135:{s:'attic',t:'你此刻只有一個目標：終結伊萊賈·哈考特那褻瀆神明的野心。你和伊莎貝爾·哈考特並肩作戰，準備在這隻怪物的巢穴裡與牠展開對決。',
  c:[{l:'決一死戰（戰鬥兩輪）',t:{a:'com',b:'wp',d:14,p:113,f:153,c:'res'}}]},

113:{s:'attic',t:'變形後的哈考特邁著半人半蛛的詭異肢體，退回到巨網中央——雖受了傷，卻並未被擊敗。\n\n透過蛛絲繩索圍成的傳送門，你能看到洞穴裡的蜘蛛黑影正朝著巨網移動，正趕來支援牠們女王的選中者。',
  c:[{l:'繼續與變形後的哈考特戰鬥',g:103},
     {l:'想辦法快速解決牠',g:197},
     {l:'嘗試用魔法對抗牠',g:82},
     {l:'趁機逃離宅邸',g:176}]},

103:{s:'attic',t:'你決心完成自己開啟的戰鬥，但必須速戰速決，以防對方的援兵到來。',
  c:[{l:'最後一搏（戰鬥三輪）',t:{a:'com',d:10,p:71,f:86,c:'res'}}]},

71:{s:'attic',t:'你使出致命一擊，將化石毒牙狠狠刺進這隻恐怖怪物的身體。哈考特僅存的人性，讓牠發出一聲悽厲的尖叫。這隻畸形的怪物腿一軟，癱倒在閣樓的地板上。\n\n異界的蜘蛛們眼看就要衝破蛛網了。儘管哈考特已被消滅，連接現實世界與夢境之地的傳送門，卻沒有絲毫關閉的跡象。但諾特說過，開啟傳送門的不是哈考特，而是那些沉睡者。',
  c:[{l:'嘗試喚醒被蛛絲裹住的沉睡者',g:53},{l:'在巨型蜘蛛衝進閣樓前逃離',g:29}]},

53:{s:'attic',t:'霍勒斯·特倫霍姆離你最近。你抓住他的肩膀，拼命搖晃，喊著他的名字。伊莎貝爾也對著沃德做著同樣的事。\n\n但無論你怎麼努力，都無法喚醒這些沉睡者。你意識到自己在這裡無能為力，而且待得越久，活下去的希望就越渺茫。',
  c:[{l:'轉身朝樓梯跑去（測試：生命值）',t:{a:'hp',d:7,p:29,f:86}}]},

29:{s:'attic',t:'你們兩人一路飛奔下閣樓的樓梯，一步跨兩級台階。跑到二樓走廊平台後，又朝著中央樓梯狂奔，回到前廳後，你們猛地推開大門，衝進了夜色中。\n\n但自你抵達後，便一直籠罩著哈考特莊園的致命迷霧，終於開始消散了。你和伊莎貝爾沿著車道飛奔，穿過大門，沿著道路朝山下的小鎮跑去。\n\n伊萊賈·哈考特死了，但這棟充滿夢境與蜘蛛的宅邸依然矗立。',
  f:{secret:'錯綜複雜的網'},c:[{l:'結束冒險',g:'END2'}]},

86:{s:'attic',t:'就在你自顧不暇之際，洞穴裡的蜘蛛們已經衝到了蛛網傳送門前，兩隻蜘蛛從蛛絲的縫隙中擠了進來。\n\n這些恐怖的怪物用毒牙咬穿你們的皮膚，將毒液注入血液，隨後用鋒利的腿，將你們撕成了碎片。\n\n你或許阻止了諾特將你獻祭，但這座蜘蛛之屋，還是又多了兩名犧牲者。',
  f:{secret:'冷原的蜘蛛'},c:[{l:'結束冒險',g:'END0'}]},

197:{s:'attic',t:'你翻找著口袋，想找出能對抗這隻怪物的東西。',
  c:[{l:'使用【火柴】（需物品：火柴）',g:208,q:{item:'火柴'}},
     {l:'使用【陶土罐碎片】（需物品：陶土罐碎片）',g:294,q:{item:'陶土罐碎片'}},
     {l:'使用【化石毒牙】',g:223,q:{item:'化石毒牙'}},
     {l:'使用【怪異神像】（需物品：怪異神像）',g:252,q:{item:'怪異神像'}},
     {l:'手邊沒有能用的東西',g:281}]},

208:{s:'attic',t:'點火的摩擦聲在寂靜的閣樓裡格外刺耳。一簇小小的火苗驟然燃起，映照著成千上萬顆黏在厚實蛛網上的黑曜石小圓珠。\n\n那只盤踞在蛛網中央的怪物瞬間退縮了——並非因為光線本身，而是因為光線背後的含義：毀滅。\n\n火苗引燃了蛛網的一縷游絲，蛛絲發出嘶嘶聲，隨後「呼」的一聲燃起熊熊大火。火勢迅速蔓延，直奔蛛網中心和那隻怪物。\n\n沉睡者的繭囊此刻也燃起了大火。',
  f:{san:-1},c:[{l:'看著火焰吞噬一切',g:301}]},

301:{s:'attic',t:'那隻怪物發出尖叫——那聲音一半像蜘蛛，一半像人類。牠的四肢慌亂地扒拉著，在火海中倉皇逃竄。火焰將牠團團圍住，牠的顎部瘋狂地咬合著，眼珠在高溫中鼓脹、爆裂。而後，這隻由伊萊賈·哈考特變成的怪物被火焰吞噬。\n\n一股熱浪猛地向外襲來，將你推得連連後退。那扇違背常理的異界傳送門，消失了。\n\n但這座充滿夢魘的哈考特莊園，正在熊熊燃燒。你轉身逃離閣樓，伊莎貝爾跟在你身後。你們一同沿著車道狂奔，身後的宅邸像一座巨大的篝火，照亮了夜空。',
  f:{secret:'蜘蛛之屋'},c:[{l:'結束冒險',g:'END4'}]},

294:{s:'attic',t:'你將那塊刻著怪異簡筆畫的陶片舉到那隻怪物面前。\n\n蛻變後的哈考特發出嘶嘶的低吼，顎部不停開合，還用一隻長著爪尖、半人半蛛的肢體朝你猛揮過來。但你幾乎能確定，這隻怪物害怕了！',
  f:{hp:-1,wp:1,secret:'丘德儀式'},c:[{l:'趁機逃離',g:176},{l:'乘勝追擊，終結牠',g:103}]},

223:{s:'attic',t:'你舉起化石毒牙，朝著這隻臃腫的蜘蛛怪猛刺過去。但它並未坐以待斃，而是以驚人的速度朝你衝來。你不得不與牠展開殊死搏鬥。',
  c:[{l:'決一死戰（戰鬥三輪）',t:{a:'com',d:15,p:71,f:86,c:'res'}}]},

252:{s:'attic',t:'你舉起那尊長著八條肢體的皂石神像，牠開始發出嘶嘶聲，顎部不停開合，彷彿承受著劇痛，緩緩退向蛛網深處。',
  f:{wp:1,secret:'作繭自縛'},c:[{l:'趁機逃離',g:176},{l:'徹底解決這隻蜘蛛怪',g:103}]},

82:{s:'attic',t:'今夜是秋分，陰陽兩界的隔閡變得無比稀薄，現實的脆弱屏障會被更高維度的非歐幾何撕裂、重塑。換句話說，今夜，魔法之力無處不在！\n\n但你打算用何種魔法？',
  c:[{l:'翻開【海波里亞的異教秘典】（需物品）',g:237,q:{item:'海波里亞的異教秘典'}},
     {l:'翻開【夢遊者之路】（需物品）',g:254,q:{item:'夢遊者之路'}},
     {l:'憑自身天賦施展（需能力：神秘）',g:297,q:{ab:['神秘']}},
     {l:'你並不會任何魔法',g:109}]},

237:{s:'attic',t:'你匆匆翻到關於亞特蘭-納卡教派的章節，找到了想要的東西……你覺得是。這一頁上的文字，看起來確實像一段魔法咒語，但你能不能真正讀懂，就是另一回事了。\n\n若你持有【追夢人日記】，或許能對照譯文。',
  c:[{l:'對照【追夢人日記】解讀（需物品）',g:204,q:{item:'追夢人日記'}},
     {l:'硬著頭皮照唸（測試：意志力）',t:{a:'wp',d:10,p:165,f:281,c:'res'}}]},

204:{s:'attic',t:'你拿出【追夢人日記】，將兩本書並排放在地上。你匆匆翻閱這本手寫的日記，找到了想要的那一頁——頁面上寫滿了怪異的文字符號，和《海波里亞的異教秘典》裡的文字如出一轍，只是下方標註了對應的英文字母。',
  c:[{l:'大聲唸出這段咒語（測試：智力）',t:{a:'int',d:7,p:165,f:281,c:'clue'}}]},

165:{s:'attic',t:'你開始解讀這些文字，口中念誦著你希望能夠生效的魔法咒語。但眼前這隻由伊萊賈·哈考特變成的恐怖怪物，還有那些沉睡者的悽慘狀態，不斷擾亂著你本就緊繃的心神。',
  c:[{l:'集中精神完成咒語（測試：意志力）',t:{a:'wp',d:10,p:300,f:281,c:'res'}}]},

297:{s:'attic',t:'你竭力無視閣樓裡那些令人心神不寧的景象、聲音和氣味，沉下心來，催動自己的魔法天賦。',
  c:[{l:'施展法術（測試：意志力）',t:{a:'wp',d:10,p:252,f:281,c:'res'}}]},

254:{s:'attic',t:'彷彿這本書知曉你的需求一般，自動翻到了一頁——上面記載著前往夢境之地的旅人，用以驅趕冷原蜘蛛的咒語。你照著書頁上的文字，一字不差地唸了出來。',
  c:[{l:'咒語生效',g:252}]},

300:{s:'attic',t:'當你唸出咒語的最後一個音節，那張巨大蛛網的蛛絲開始鬆垮、斷裂。蛛絲一根根散開，最終整面蛛網徹底瓦解。每一根蛛絲落下，對面洞穴的景象就會閃爍、變淡。那片異界地底領域一點點消失，取而代之的是閣樓裡雜亂的房梁和陰影。\n\n那隻由伊萊賈·哈考特蛻變而成的怪物發出一聲悽厲的哀嚎，當最後一根蛛絲落地，傳送門徹底關閉時，牠也一同消失了。\n\n你將目光投向那些沉睡的人。你蹲到瓦努姆教授身邊，將兩根手指搭在他的頸動脈上——沒有脈搏。你轉向貝爾韋瑟醫生，她也早已沒了生息。\n\n五個人，無一倖免。',
  f:{secret:'死亡之屋'},c:[{l:'結束冒險',g:'END3'}]},

281:{s:'attic',t:'這隻哈考特蜘蛛怪的體型，卻有著驚人的速度。牠一躍穿過閣樓，用鋒利的肢體擊中了你，打斷了你的注意力，也劃破了你的皮膚。',
  f:{hp:-1},c:[{l:'繼續戰鬥',g:135}]},

109:{s:'attic',t:'你聽到一陣類似手杖不斷敲擊地板的聲音，那隻哈考特蜘蛛怪正穿過閣樓朝你走來。',
  f:{doom:2},c:[{l:'轉身逃跑',g:126},{l:'正面迎戰',g:135}]},

262:{s:'attic',t:'霍勒斯·特倫霍姆離你最近。你抓住他的肩膀，拼命搖晃，喊著他的名字。伊莎貝爾也對著沃德做著同樣的事。\n\n閣樓的陰影角落裡，彷彿有一片星空在閃爍——但這些「星星」並非永恆不變，黑暗中有東西在移動。\n\n你花了片刻才反應過來自己看到了什麼：閣樓的各個角落，爬滿了蜘蛛，成百上千隻。牠們正朝著你湧來。',
  c:[{l:'揮手驅趕蜘蛛（測試：戰鬥）',t:{a:'com',d:8,p:24,f:45,c:'res'}}]},

24:{s:'attic',t:'你趕走了蜘蛛，伊莎貝爾還在奮力抵擋蛛群的進攻，而你則再次努力喚醒那些陷入沉睡的人。\n\n你抓住路德·哈羅醫生的肩膀，用力搖晃他，對著他的臉大喊。他的眼皮突然顫動著睜開，驚恐地盯著你，接著張開嘴，發出一聲刺耳的、令人毛骨悚然的尖叫。\n\n其他沉睡的人也跟著尖叫起來。緊接著，那隻蹲在巨大蛛網中央的蜘蛛怪也開始尖叫。',
  c:[{l:'承受這一切（測試：理智值）',t:{a:'none',d:'san',p:176,f:159}}]},

45:{s:'attic',t:'蜘蛛依舊在你身上爬來爬去，你能感受到牠們毛茸茸的腿，觸碰著你每一寸裸露的皮膚。你拼命後退，想遠離那些被蛛網裹住的沉睡者。\n\n你必須換個辦法。',
  c:[{l:'直接攻擊哈考特蜘蛛怪',g:135},
     {l:'看看自己有沒有能對抗牠的物品',g:197},
     {l:'使用魔法',g:82},
     {l:'逃離這棟宅邸',g:126},
     {l:'穿過傳送門，逃進門後的洞穴',g:18}]},

132:{s:'attic',t:'你抓住哈羅醫生的肩膀，用力搖晃，讓他醒過來。他的眼皮顫動著睜開，接著張開嘴，發出一聲令人毛骨悚然的尖叫。\n\n其他沉睡的人也跟著尖叫起來。緊接著，那隻蜘蛛怪也開始尖叫。',
  c:[{l:'承受這一切（測試：理智值）',t:{a:'none',d:'san',p:176,f:159}}]},

176:{s:'attic',t:'你必須逃離這個瘋狂的地方！\n\n你朝著出口狂奔，拉著伊莎貝爾一起。兩人都不敢回頭，沿著嘎吱作響的樓梯飛奔而下，衝到前廳後，猛地推開大門，衝進夜色中。\n\n但自你抵達後，便一直籠罩著哈考特莊園的致命迷霧，終於開始消散了。你和伊莎貝爾沿著車道飛奔，穿過大門，朝山下的小鎮跑去。\n\n你和伊莎貝爾或許撿回了一條命，但哈考特莊園依舊矗立。不僅如此，伊萊賈·哈考特還達成了自己的目的——掙脫了人類的肉身，化身為他那褻瀆神明的信仰之神。',
  f:{san:-1,doom:1,secret:'生不如死'},c:[{l:'結束冒險',g:'END1'}]},

126:{s:'attic',t:'你朝著閣樓的樓梯飛奔而去，心臟狂跳，雙腿幾乎支撐不住身體。身後，你聽到幾丁質刮擦木頭的聲音——那隻哈考特蜘蛛怪正在追來。\n\n一陣濕滑的咔嗒嘶鳴聲在黑暗中迴盪，緊接著——咻！有什麼東西重重地砸在你的背上，像一張被扔出的網。\n\n蛛網瞬間收緊，冰冷又黏膩。你被猛地拽離地面，狠狠摔在地上，接著被快速向後拖去。\n\n你最後看到的，就只有數不清的腿。太多太多的腿。',
  f:{secret:'願意走進我的客廳嗎？'},c:[{l:'結束冒險',g:'END0'}]},

159:{s:'attic',t:'又一個聲音加入了這陣嘈雜的尖叫，過了片刻你才反應過來，那是你自己的聲音。今晚在這座蜘蛛之屋的所見所聞，讓你的心智遭受了無法挽回的重創。\n\n你跪倒在未完工的地板上，再也沒有一絲反抗的力氣。\n\n那隻蜘蛛怪逼近你，張開嘴，將你的腦袋整個吞入巨大的毒牙之間，猛地一口咬下。',
  c:[{l:'結束冒險',g:'END0'}]},

18:{s:'attic',t:'你擠進蛛網構成的入口，蛛絲粗如繩索，帶著潮濕的、有生命的阻力，黏在你的皮膚上。可怕的是，這些蛛絲摸起來像肌肉纖維——溫熱、搏動，而且彷彿擁有自我意識。\n\n你奮力穿過蛛網，腳下一滑，順著震顫的蛛絲斜坡摔了下去，重重地落在巨大洞穴的底部。\n\n洞穴的另一端，一個巨大的身影動了動。八隻眼睛緩緩睜開，這位偉大的織網者從蛛網王座上緩緩展開身軀。\n\n你闖入了蜘蛛女王亞特蘭-納卡的巢穴，此刻的你，插翅難飛。',
  f:{secret:'蜘蛛與飛蟲'},c:[{l:'結束冒險',g:'END0'}]},

18_dup:null
};

D[27]={s:'mist',t:'你最終擊退了這些恐怖的怪物，但在此之前，牠們用堅硬帶爪的肢體，在你身上劃出了數道傷口。\n\n你衝破包圍圈，朝宅邸飛奔而去，一次也不敢回頭。',
  f:{hp:-2},c:[{l:'回到莊園',g:282}]};
D[44]={s:'mist',t:'你擊退了這些恐怖的怪物，但傷勢不輕。',
  f:{hp:-2},c:[{l:'回到莊園',g:282}]};
D[64]={s:'mist',t:'你輕易就被這些恐怖的怪物制服了。牠們從腹部的紡績器中吐出粘稠的蛛絲，將你緊緊纏住。\n\n像這樣被捆成一團，你被拖到樹上，倒掛著。血液漸漸湧向頭部，你越來越喘不過氣。',
  f:{secret:'蜘蛛與飛蟲'},c:[{l:'結束冒險',g:'END0'}]};

/* 補上 91 / 72 / 32 / 125 / 137 */
D[91]={s:'manor',t:'推開正門，你發現宅邸被濃重的迷霧籠罩。霧氣濃得讓你幾乎看不清台階下的碎石車道，連車道兩旁的紅楓林都徹底隱沒在霧中。',
  c:[{l:'走進迷霧',g:32}]};
D[32]={s:'mist',t:'金斯波特的迷霧濃得化不開，卻又輕如棉花糖，每一次呼吸，都能感受到那股冰冷的濕意漫過咽喉深處。\n\n你沿著車道前行，紅楓在霧中若隱若現。',
  c:[{l:'繼續往前走',g:125}]};
D[125]={s:'mist',t:'你快步走下台階，沿著車道小跑起來。迷霧中，所有的樹木都被蛛網覆蓋。而且，這些樹看起來有些不對勁——樹枝更粗壯，樹葉的形狀也十分詭異。\n\n樹裡有東西在蠕動。一個個圓滾滾的巨大身影，邁著多節、細長的肢體，以一種違背自然的優雅姿態移動著。',
  f:{doom:1},c:[{l:'轉身返回宅邸',g:137},{l:'繼續前進',g:157}]};
D[137]={s:'mist',t:'一股冰冷的恐懼席捲全身，你立刻轉身，拼命朝宅邸跑去。你感覺到頭頂的空氣一陣異動，接著一個巨大的圓球狀身影砸在身前的車道上。\n\n那東西看起來像一隻巨型蜘蛛，卻又並非蜘蛛，肢體多節、張開，頭上長著數隻發光的眼睛，像一簇即將破裂的膿包。',
  f:{san:-1},c:[{l:'迎戰',g:218}]};
D[157]={s:'mist',t:'絕望驅使著你加快腳步。但就在你沿著車道拼命狂奔時，那些怪物開始圍上來，牠們悄無聲息地從樹上爬下來，邁著怪異的步子穿過草坪朝你撲來。',
  c:[{l:'使用隨身物品抵擋',g:179},{l:'無物可用，只能硬闖',g:218}]};
D[179]={s:'mist',t:'你有什麼物品，能幫你抵擋逼近的蜘蛛怪？',
  c:[{l:'使用【火柴】點火',g:260,q:{item:'火柴'}},
     {l:'使用【化石毒牙】',g:101,q:{item:'化石毒牙'}},
     {l:'使用【怪異神像】',g:101,q:{item:'怪異神像'}},
     {l:'沒有能用的東西',g:137}]};
D[9]={s:'mist',t:'你點燃火焰，將光束對準逼近的恐怖生物。明亮的光線掃過牠們的眼睛，那些東西發出嘶鳴，向後退了幾步。\n\n你藉著這個機會，朝宅邸退去。',
  f:{san:-1},c:[{l:'回到莊園',g:282}]};
D[260]={s:'mist',t:'火焰碰到了蛛絲，蛛絲瞬間被點燃。儘管空氣中瀰漫著霧氣和濕氣，但構成這蛛絲的物質顯然極易燃燒。火勢迅速蔓延成熊熊烈火，整棵樹都被火焰吞噬。\n\n面對肆虐的火焰，那些恐怖的蜘蛛怪四散逃竄，消失在黑暗中。你匆匆逃回屋內。',
  f:{wp:-1},c:[{l:'回到莊園',g:282}]};
D[101]={s:'mist',t:'你將這件文物舉在身前，看到那些恐怖的生物竟本能地後退，憤怒的嘶嘶聲在你周圍迴盪。這些怪物開始快步逃竄。\n\n你立刻朝宅邸飛奔而去。',
  f:{san:-1},c:[{l:'回到莊園',g:282}]};
D[52]={s:'manor',t:'金斯波特的迷霧，彷彿對這座小鎮和鎮上的居民施了一道神秘的魔咒，如今這道魔咒也纏上了你。但即便如此，你依然確信，躲進宅邸是最正確的選擇。',
  f:{wp:-1,san:1,secret:'金斯波特的迷霧'},c:[{l:'回到大廳',g:282}]};
D[72]={s:'manor',t:'想到上次踏出哈考特莊園的遭遇，你還確定要再一次直面這迷霧嗎？',
  c:[{l:'確定，走進迷霧',g:32},{l:'不確定，留在屋內',g:52}]};

/* 96 / 75 / 60 / 263 / 37 / 78 / 49 / 100 / 118 / 152 / 134 / 22 */
D[96]={s:'spider',t:'一聲突如其來的叫喊傳來，你立刻衝向宅邸的中央樓梯——眼前的景象讓你驚恐到不敢相信。\n\n佩雷格林·沃德竟被吊在天花板最高處的枝形吊燈上。無數粘稠的蛛絲纏繞著他，由覆蓋在吊燈與天花板上的蛛群不斷吐出。\n\n你從未見過這樣的景象：蜘蛛蜂擁而至，覆蓋了一切，入目皆是一團蠕動的黑毛軀體。\n\n有什麼東西突然從蛛群中掉落，砸在你腳邊——是沃德的眼鏡。',
  f:{san:-1,item:'夾鼻眼鏡'},c:[{l:'看著這一幕',g:75}]};
D[75]={s:'spider',t:'天花板上爬滿了蜘蛛，黑壓壓的一片，遮住了枝形吊燈的光芒，也裹住了可憐的律師。眼前的景象，讓你本就備受折磨的理智，瀕臨崩潰。',
  c:[{l:'承受這一切（測試：理智值）',t:{a:'none',d:'san',p:60,f:42}}]};

/* =========================================================================
   5. 音效（Web Audio）
   ========================================================================= */
const Sound = {
  on:true, ctx:null,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },
  beep(freq,dur,type,vol){
    if(!this.on) return; this.init(); if(!this.ctx) return;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.06,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(); o.stop(this.ctx.currentTime+dur);
  },
  click(){ this.beep(520,0.07,'triangle',0.05); },
  page(){ this.beep(300,0.12,'sine',0.05); },
  dice(){ this.beep(180,0.14,'square',0.05); },
  good(){ this.beep(660,0.1,'sine',0.06); setTimeout(()=>this.beep(880,0.14,'sine',0.06),90); },
  bad(){ this.beep(180,0.22,'sawtooth',0.05); },
  doom(){ this.beep(90,0.5,'sawtooth',0.05); }
};

const SAVE_KEY='kingsport_save_v1';
const ACH_KEY='kingsport_ach_v1';

let S = null;

function newState(invKey){
  const inv = INVESTIGATORS[invKey];
  return {
    inv: invKey,
    wp: inv.wp, int: inv.int, com: inv.com,
    hp: inv.hp, san: inv.san,
    clue: 0, res: 0, doom: 0,
    items: [inv.item],
    abilities: [inv.ability],
    weaknesses: [inv.weakness],
    secrets: [],
    history: [],
    chapter: 1,
    typed: false
  };
}

function statLine(){
  const inv = INVESTIGATORS[S.inv];
  const effCom = S.com + Math.min(0, S.hp);
  const effWp  = S.wp  + Math.min(0, S.san);
  return {
    wp: effWp, int: S.int, com: effCom,
    rawWp: S.wp, rawCom: S.com
  };
}

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    toast('已存檔 ✓');
  }catch(e){ toast('存檔失敗', true); }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){ toast('沒有找到存檔', true); return false; }
    S = JSON.parse(raw);
    if(!S || !S.inv){ toast('存檔已損壞', true); return false; }
    showScreen('game');
    renderAll();
    toast('讀檔成功 ✓');
    return true;
  }catch(e){ toast('讀檔失敗', true); return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

function getAch(){
  try{ return JSON.parse(localStorage.getItem(ACH_KEY)||'{"endings":{},"secrets":{}}'); }
  catch(e){ return {endings:{},secrets:{}}; }
}
function addAch(stars, title, secrets){
  const a = getAch();
  a.endings[title] = Math.max(a.endings[title]||0, stars);
  (secrets||[]).forEach(s=>a.secrets[s]=1);
  try{ localStorage.setItem(ACH_KEY, JSON.stringify(a)); }catch(e){}
}

let typeTimer=null;
function typeText(el, txt, done){
  el.innerHTML='';
  let i=0;
  const cur = document.createElement('span');
  cur.className='cursor'; cur.textContent='\u00A0';
  el.appendChild(cur);
  function step(){
    if(i>=txt.length){ cur.remove(); done && done(); return; }
    const chunk = txt.slice(i, i+2);
    i += 2;
    cur.insertAdjacentText('beforebegin', chunk);
    typeTimer = setTimeout(step, 14);
  }
  step();
  el._skip = ()=>{ clearTimeout(typeTimer); el.innerHTML = txt; cur.remove(); done && done(); el._skip=null; };
}

function renderChapter(){
  const ch = D[S.chapter];
  if(!ch){ toast('章節資料遺失，返回第 1 章', true); S.chapter=1; return renderChapter(); }

  renderStats();
  renderScene(ch.s);
  $('chapNo').textContent = '第 ' + S.chapter + ' 章';
  $('chapBadge').textContent = '第 ' + S.chapter + ' 章';

  // 記錄歷史
  if(S.history.length===0 || S.history[S.history.length-1].id !== S.chapter){
    S.history.push({id:S.chapter, t:(ch.t||'').slice(0,22)});
    if(S.history.length>200) S.history.shift();
  }

  const textEl = $('text');
  typeText(textEl, ch.t || '', ()=>{ renderChoices(ch); });

  // 點擊文字區可立即顯示
  textEl.onclick = ()=>{ if(textEl._skip) textEl._skip(); };

  $('main').scrollTop = 0;
  renderFx(ch.f);
}

function renderFx(f){
  const box = $('fxline');
  box.innerHTML = '';
  if(!f) return;
  const map = [
    ['clue','線索','good'],['res','資源','good'],
    ['hp','生命','bad'],['san','理智','bad'],['doom','厄運','bad'],
    ['wp','意志','bad'],['int','智力','bad'],['com','戰鬥','bad']
  ];
  map.forEach(([k,label,tone])=>{
    if(f[k]){
      const d=document.createElement('span');
      d.className='fx '+(f[k]>0?(k==='doom'?'bad':'good'):'bad');
      d.textContent = label + (f[k]>0?' +':' ') + f[k];
      box.appendChild(d);
    }
  });
  if(f.item){ const d=document.createElement('span'); d.className='fx good'; d.textContent='獲得物品：'+f.item; box.appendChild(d); }
  if(f.ab){ const d=document.createElement('span'); d.className='fx good'; d.textContent='獲得能力：{'+f.ab+'}'; box.appendChild(d); }
  if(f.wk){ const d=document.createElement('span'); d.className='fx bad'; d.textContent='獲得弱點：{'+f.wk+'}'; box.appendChild(d); }
  if(f.secret){ const d=document.createElement('span'); d.className='fx good'; d.textContent='秘密線索：'+f.secret; box.appendChild(d); }
}

function renderChoices(ch){
  const box = $('choicesInner');
  box.innerHTML = '';

  if(ch.end){
    showEnding(ch.end);
    return;
  }

  (ch.c||[]).forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'chbtn';

    let label = opt.l;
    const req = opt.q;
    let blocked = false, reason='';

    if(req){
      if(req.item){
        // 支援陣列或單一字串
        const need = Array.isArray(req.item)?req.item:[req.item];
        const lack = need.filter(x=>S.items.indexOf(x)<0);
        if(lack.length){ blocked = true; reason = '缺少物品：' + lack.map(x=>'['+x+']').join('、'); }
      }
      if(req.ab){
        const need = Array.isArray(req.ab)?req.ab:[req.ab];
        if(!need.some(x=>S.abilities.indexOf(x)>=0)){ blocked=true; reason='需要能力：{'+need.join('/')+'}'; }
      }
      if(req.wk){
        const need = Array.isArray(req.wk)?req.wk:[req.wk];
        if(!need.some(x=>S.weaknesses.indexOf(x)>=0)){ blocked=true; reason='需要弱點：{'+need.join('/')+'}'; }
      }
    }

    btn.innerHTML = label + (blocked?`<span class="req">${reason}</span>`:'');
    btn.onclick = ()=>{
      if(blocked){ toast(reason, true); return; }
      Sound.click();
      if(opt.t){ startTest(opt.t, opt.l); }
      else if(opt.g!=null){ gotoChapter(opt.g); }
    };
    box.appendChild(btn);
  });
}

function gotoChapter(id){
  if(id === 'END0'){ showEnding({stars:0,title:'歸於蛛網',text:'你在哈考特莊園的黑暗中失去了意識。迷霧散去時，沒有人記得你的名字。'}); return; }
  if(id === 'END1'){ showEnding({stars:1,title:'生不如死',text:'你和伊莎貝爾撿回了一條命，但伊萊賈·哈考特已經掙脫人類的肉身，化身為他所信仰的神。'}); return; }
  if(id === 'END2'){ showEnding({stars:2,title:'錯綜複雜的網',text:'伊萊賈·哈考特死了，但這棟充滿夢境與蜘蛛的宅邸依然矗立。誰也不知道，你將其他客人推向了怎樣的命運。'}); return; }
  if(id === 'END3'){ showEnding({stars:3,title:'死亡之屋',text:'哈考特消失了，傳送門也被封印。但那間被蜘蛛縈繞的閣樓裡，躺著五具冰冷的屍體。'}); return; }
  if(id === 'END4'){ showEnding({stars:4,title:'蜘蛛之屋',text:'火焰吞噬了一切。這座蜘蛛之屋正烈火熊熊，所有的秘密都被火焰吞噬。但願那些曾盤踞在這棟宅邸裡的恐怖之物，也能一同灰飛煙滅。'}); return; }

  const ch = D[id];
  if(!ch){ toast('該章節尚未開放，返回上一章', true); return; }

  S.chapter = id;
  applyFx(ch.f);
  renderChapter();
  autoSave();
}

function applyFx(f){
  if(!f) return;

  if(f.clue){ gainClue(f.clue); }
  if(f.res){ S.res = Math.max(0, S.res + f.res); }
  if(f.hp){ S.hp += f.hp; }
  if(f.san){ S.san += f.san; }
  if(f.doom){ S.doom += f.doom; Sound.doom(); }
  if(f.wp){ S.wp += f.wp; }
  if(f.int){ S.int += f.int; }
  if(f.com){ S.com += f.com; }

  if(f.item && S.items.indexOf(f.item)<0) S.items.push(f.item);
  if(f.ab && S.abilities.indexOf(f.ab)<0) S.abilities.push(f.ab);
  if(f.wk && S.weaknesses.indexOf(f.wk)<0) S.weaknesses.push(f.wk);
  if(f.secret) unlockSecret(f.secret);

  // 生命值/理智值低於 0 的懲罰已在 statLine 中即時計算
}

function gainClue(n){
  if(n<=0){ S.clue=Math.max(0,S.clue+n); return; }
  const inv = INVESTIGATORS[S.inv];
  if(inv.ability === '詩人'){
    // 詩人弱點：獲得線索時擲1顆骰子，若點數低於當前線索數，則無法獲得該線索
    const roll = d6();
    if(roll < S.clue){
      toast(`{洪水之夢}：擲出 ${roll}，低於當前線索 ${S.clue}，無法獲得線索`, true);
      return;
    }
  }
  if(inv.ability === '洪水之夢'){}
  S.clue += n;
}

function unlockSecret(name){
  if(!name) return;
  if(S.secrets.indexOf(name)<0){ S.secrets.push(name); }
  const a=getAch(); a.secrets[name]=1;
  try{ localStorage.setItem(ACH_KEY, JSON.stringify(a)); }catch(e){}
}

/* =========================================================================
   10. 擲骰與測試
   ========================================================================= */
function d6(){ return Math.floor(Math.random()*6)+1; }

let pendingTest = null;

function startTest(t, optLabel){
  const ch = D[S.chapter];
  pendingTest = { t, optLabel, usedBonus:false, rolled:false };
  openTestModal(t, optLabel);
}

function testTargetVal(t){
  const st = statLine();
  if(t.a === 'none'){
    // 針對理智值的測試
    return S.san;
  }
  let base = (t.a==='wp'?st.wp:t.a==='int'?st.int:st.com);
  if(t.b) base += (t.b==='wp'?st.wp:t.b==='int'?st.int:t.b==='com'?st.com:t.b==='hp'?S.hp:0);
  return base;
}

function openTestModal(t, optLabel){
  const st = statLine();
  const isSanTest = (t.a === 'none');
  const attrName = isSanTest ? '理智值' : ({wp:'意志力',int:'智力',com:'戰鬥'}[t.a]);
  const target = testTargetVal(t);
  const canRes = (t.c === 'res' && S.res > 0);
  const canClue = (t.c === 'clue' && S.clue > 0);

  let note = '';
  const inv = INVESTIGATORS[S.inv];
  if(inv.ability === '千里眼' && t.a === 'int') note = '〔千里眼：擲2顆取高〕';
  if(inv.weakness === '黑暗未來' && t.a === 'int') note += ' 〔黑暗未來：若兩骰同點，厄運+1且失敗〕';

  $('mbox').innerHTML = `
    <h2>⚄ 屬性測試</h2>
    <p><b>${optLabel}</b></p>
    <p style="margin-top:8px">測試類型：<span class="em">擲 1 顆骰子 ＋ ${attrName} ${target}</span></p>
    ${isSanTest?'<p>若擲出的點數 <b>小於或等於</b> 你的理智值，測試成功。</p>':
      `<p>目標值：<span class="em">${t.d}</span>（點數 ≥ 目標值 即成功）</p>`}
    <p style="font-size:.78rem;color:#9a8b6e;margin-top:8px">${note}</p>
    <div id="diceArea"></div>
    ${(canRes||canClue) ? `<button class="btn ghost" id="btnBonus">消耗 1 點${canRes?'資源':'線索'}，改為擲 2 顆骰子並取較高者</button>` : ''}
    <button class="btn" id="btnRoll">擲骰！</button>
  `;
  $('modal').classList.add('on');

  if(canRes||canClue){
    $('btnBonus').onclick = ()=>{
      if(pendingTest.usedBonus) return;
      pendingTest.usedBonus = true;
      if(canRes){ spendResource(1); }
      else { S.clue--; }
      Sound.click();
      $('btnBonus').disabled = true;
      $('btnBonus').textContent = '已消耗 1 點' + (canRes?'資源':'線索') + '（將擲 2 顆取高）';
      renderStats();
    };
  }

  $('btnRoll').onclick = ()=> doRoll(t, target, isSanTest, optLabel);
}

function spendResource(n){
  S.res = Math.max(0, S.res - n);
  if(INVESTIGATORS[S.inv].weakness === '身份危機'){
    const r = d6();
    if(r === 1){ S.san -= 1; toast('{身份危機}：擲出 1 點，理智值 -1', true); }
  }
}

function doRoll(t, target, isSanTest, optLabel){
  const btn = $('btnRoll');
  if(!btn || btn.disabled) return;
  btn.disabled = true;

  const inv = INVESTIGATORS[S.inv];
  const twoDice = pendingTest.usedBonus || (inv.ability==='千里眼' && t.a==='int');

  const area = $('diceArea');
  area.innerHTML = `<div class="drow">
    <div class="die rolling" id="d1">?</div>
    ${twoDice?'<div class="die rolling" id="d2">?</div>':''}
  </div>`;
  Sound.dice();

  let ticks=0;
  const iv = setInterval(()=>{
    $('d1').textContent = d6();
    if($('d2')) $('d2').textContent = d6();
    ticks++;
    if(ticks>8){ clearInterval(iv); resolve(); }
  }, 55);

  function resolve(){
    const r1 = d6();
    const r2 = twoDice ? d6() : null;
    $('d1').textContent = r1; $('d1').classList.remove('rolling');
    if($('d2')){ $('d2').textContent = r2; $('d2').classList.remove('rolling'); }

    let roll, dimmed=false;
    if(twoDice){ roll = Math.max(r1, r2); if(r1!==r2){ (r1>r2?$('d2'):$('d1')).classList.add('dim'); } }
    else { roll = r1; }

    let success, total;
    if(isSanTest){
      total = roll;
      success = (roll <= S.san);
    } else {
      total = roll + target;
      success = (total >= t.d);
    }

    // 黑暗未來：智力測試擲出兩個相同點數 → 厄運+1 且失敗
    let darkFuture = false;
    if(inv.weakness === '黑暗未來' && twoDice && r1 === r2 && t.a === 'int'){
      darkFuture = true; success = false;
      S.doom += 1;
    }

    const resLine = document.createElement('div');
    resLine.className = 'totalline';
    resLine.innerHTML = isSanTest
      ? `擲出 <span class="em">${roll}</span>　理智值 <span class="em">${S.san}</span>　→　<span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`
      : `骰子 <span class="em">${twoDice?r1+'/'+r2:'—'}${twoDice?' 取 '+roll:roll}</span> ＋ 屬性 <span class="em">${target}</span> ＝ <span class="em">${total}</span>　（目標 ${t.d}）→　<span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`;

    area.appendChild(resLine);
    if(darkFuture){
      const d=document.createElement('div');
      d.className='totalline res-bad';
      d.textContent='{黑暗未來}：兩骰同點，厄運 +1，測試判定為失敗！';
      area.appendChild(d);
    }

    // 詩人：消耗線索完成測試且成功 → +1 線索
    if(success && inv.ability === '詩人' && t.c === 'clue' && pendingTest.usedBonus){
      gainClue(1);
      const d=document.createElement('div'); d.className='totalline res-ok';
      d.textContent='{詩人}：消耗線索完成測試且成功，獲得 +1 線索。';
      area.appendChild(d);
    }

    success ? Sound.good() : Sound.bad();

    const nb = document.createElement('button');
    nb.className='btn';
    nb.textContent = success ? '繼續 ▶' : '繼續 ▶';
    nb.onclick = ()=>{
      $('modal').classList.remove('on');
      gotoChapter(success ? t.p : t.f);
    };
    $('mbox').appendChild(nb);
  }
}

      return `<div class="hist-item"><b>${'★'.repeat(st)}${'☆'.repeat(4-st)}</b>　${k}</div>`;
    }).join('') : '<p>尚未達成任何結局，快去冒險吧！</p>'}
    <p style="margin-top:10px">累計星級：<span class="em">${starTotals}</span> ★</p>

    <h3>累計解鎖秘密線索（${secs.length} / ${SECRETS.length}）</h3>
    <div class="sec-list">
      ${SECRETS.map(s=>`<div class="sec-item ${secs.indexOf(s)>=0?'got':''}">${secs.indexOf(s)>=0?'✓ ':'　'}${s}</div>`).join('')}
    </div>
    <button class="btn" id="btnClose">關閉</button>
  `;
  $('modal').classList.add('on');
  $('btnClose').onclick = ()=> $('modal').classList.remove('on');
}

/* =========================================================================
   15. 開始畫面
   ========================================================================= */
let selectedInv = null;

function renderInvGrid(){
  const g = $('invGrid');
  g.innerHTML = '';
  Object.keys(INVESTIGATORS).forEach(k=>{
    const inv = INVESTIGATORS[k];
    const card = document.createElement('div');
    card.className = 'inv-card' + (selectedInv===k?' sel':'');
    card.innerHTML = `
      <div class="nm">${inv.name}</div>
      <div class="rl">${inv.role}</div>
      <div class="stat-row"><span>意志力</span><span>${inv.wp}</span></div>
      <div class="stat-row"><span>智力</span><span>${inv.int}</span></div>
      <div class="stat-row"><span>戰鬥</span><span>${inv.com}</span></div>
      <div class="stat-row"><span>生命值</span><span>${inv.hp}</span></div>
      <div class="stat-row"><span>理智值</span><span>${inv.san}</span></div>
      <div class="stat-row"><span>初始物品</span><span>[${inv.item}]</span></div>
      <div class="ab">能力：{${inv.ability}}</div>
      <div class="wk">弱點：{${inv.weakness}}</div>
      <div class="pro">${inv.prologue}</div>
    `;
    card.onclick = ()=>{
      selectedInv = k;
      Sound.click();
      renderInvGrid();
      $('btnBegin').disabled = false;
      $('btnBegin').textContent = '以「' + inv.name + '」開始遊戲';
    };
    g.appendChild(card);
  });
}

function startGame(key){
  S = newState(key);
  showScreen('game');
  renderStats();
  $('text').textContent = '';
  $('fxline').innerHTML = '';
  $('choicesInner').innerHTML = '';

  // 先顯示序章，再進入第 1 章
  const inv = INVESTIGATORS[key];
  renderScene('mist');
  $('chapNo').textContent = '序章';
  $('chapBadge').textContent = '序章';
  typeText($('text'), inv.prologue, ()=>{
    $('choicesInner').innerHTML = '';
    const b = document.createElement('button');
    b.className='chbtn';
    b.textContent = '翻到第 1 章 ▶';
    b.onclick = ()=>{ Sound.page(); gotoChapter(1); };
    $('choicesInner').appendChild(b);
  });
  autoSave();
}

/* =========================================================================
   16. 事件綁定
   ========================================================================= */
$('btnBegin').onclick = ()=>{
  if(!selectedInv) return;
  Sound.click();
  openHelp(true);   // 先彈說明，關閉後才進入遊戲
};

$('navHelp').onclick = ()=>{ Sound.click(); openHelp(false); };
$('navSave').onclick = ()=>{ Sound.click(); if(S) saveGame(); };
$('navLoad').onclick = ()=>{ Sound.click(); if(S){
  // 已有遊戲進行中，先確認
  $('mbox').innerHTML = `
    <h2>📂 讀取存檔</h2>
    <p>讀取存檔會覆蓋目前的進度，確定要繼續嗎？</p>
    <button class="btn" id="btnYes">確定讀取</button>
    <button class="btn ghost" id="btnNo">取消</button>`;
  $('modal').classList.add('on');
  $('btnYes').onclick = ()=>{ $('modal').classList.remove('on'); loadGame(); };
  $('btnNo').onclick = ()=> $('modal').classList.remove('on');
} else loadGame(); };
$('navHist').onclick = ()=>{ Sound.click(); openHist(); };
$('navAch').onclick = ()=>{ Sound.click(); openAch(); };
$('navSound').onclick = ()=>{
  Sound.on = !Sound.on;
  $('navSound').innerHTML = `<i>${Sound.on?'🔊':'🔇'}</i>音效`;
  toast(Sound.on?'音效已開啟':'音效已關閉');
};

/* 點擊彈窗背景關閉（僅限部分彈窗） */
$('modal').addEventListener('click', e=>{
  if(e.target === $('modal')){
    // 說明與測試彈窗不允許點背景關閉
    if($('btnRoll') || $('btnHelpClose')) return;
    $('modal').classList.remove('on');
  }
});

/* 初始化 */
renderInvGrid();
if(hasSave()){
  // 讓玩家自行選擇讀檔
}
</script>
</body>
</html>
