<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>詭鎮奇談：金斯波特蛻變記</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#e8dcc3;--ink-dim:#b6a888;--gold:#c9a227;--blood:#8b1e1e;--panel:#1b1611;--line:#4a3c2a;--ok:#6aa84f;--bad:#a83232}
html,body{height:100%}
body{background:#0d0a07;font-family:"Songti SC","Noto Serif TC","Times New Roman",serif;color:var(--ink);overflow:hidden}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:60;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:.06;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
#start{align-items:center;justify-content:flex-start;overflow-y:auto;padding:18px 14px 110px;background:radial-gradient(circle at 50% 0%,#241a12 0%,#0d0a07 70%)}
#start h1{font-size:clamp(1.5rem,6vw,2.4rem);letter-spacing:.16em;color:var(--gold);text-shadow:0 0 22px rgba(201,162,39,.45);margin:16px 0 4px;text-align:center}
#start .sub{color:var(--ink-dim);letter-spacing:.4em;font-size:.72rem;margin-bottom:14px}
#start .book{width:min(640px,100%);border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#1d1710,#14100b);padding:16px;margin-bottom:16px;box-shadow:0 8px 40px rgba(0,0,0,.7)}
#start .book p{font-size:.9rem;line-height:1.85;color:var(--ink-dim);margin-bottom:.6em}
#start .book p b{color:var(--gold)}
.inv-wrap{width:min(900px,100%)}
.inv-grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:stretch}
.inv-card{flex:0 0 232px;background:linear-gradient(170deg,#241d16,#171210);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.inv-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.inv-card.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.35),0 0 26px rgba(201,162,39,.22)}
.inv-card .nm{font-size:1.12rem;color:var(--gold);letter-spacing:.06em}
.inv-card .rl{font-size:.7rem;color:var(--ink-dim);letter-spacing:.3em;margin:2px 0 10px}
.stat-row{display:flex;justify-content:space-between;font-size:.78rem;padding:2px 0;border-bottom:1px dotted #3a2f22}
.stat-row span:last-child{color:var(--gold)}
.inv-card .ab{font-size:.7rem;color:#9fb98a;margin-top:8px;line-height:1.6}
.inv-card .wk{font-size:.7rem;color:#c98a8a;line-height:1.6}
#game{background:#0d0a07}
#topbar{flex:0 0 auto;background:linear-gradient(180deg,#201a12,#15100b);border-bottom:1px solid var(--line);padding:8px 10px;z-index:20}
#topbar .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#invName{font-size:.86rem;color:var(--gold);letter-spacing:.08em;white-space:nowrap}
.badge{font-size:.66rem;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--ink-dim)}
.stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:.7rem;padding:3px 8px;border-radius:8px;background:#241d16;border:1px solid var(--line);white-space:nowrap}
.pill b{color:var(--gold);font-size:.78rem}
.pill.hp b{color:#d97a7a}.pill.san b{color:#7aa9d9}.pill.clue b{color:#8fd97a}.pill.res b{color:#d9c07a}.pill.doom b{color:#d96b6b}
#main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;display:flex;flex-direction:column}
#scene{width:100%;height:clamp(120px,20vh,200px);position:relative;overflow:hidden;background:#0b0805;flex-shrink:0}
#scene svg{width:100%;height:100%;display:block}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,7,.15),rgba(13,10,7,.96))}
#content{padding:14px 16px 220px;max-width:820px;margin:0 auto;animation:fadein .45s ease;width:100%;flex:1}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#chapNo{font-size:.68rem;letter-spacing:.3em;color:#8a7b5e;margin-bottom:8px}
#text{font-size:.98rem;line-height:2.05;letter-spacing:.02em;white-space:pre-wrap;text-shadow:0 1px 2px #000;min-height:100px;padding-bottom:20px}
.cursor{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:-2px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#fxline{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.fx{font-size:.74rem;padding:3px 9px;border-radius:7px;background:#2a2118;border:1px solid #4a3c2a;animation:pop .4s}
.fx.good{color:#9fe08a;border-color:#4e6b3a}.fx.bad{color:#f09a9a;border-color:#6b3a3a}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#choices{position:fixed;left:0;right:0;bottom:56px;z-index:25;background:linear-gradient(180deg,rgba(13,10,7,0),rgba(13,10,7,.97) 26%);padding:22px 12px 10px;max-height:56vh;overflow-y:auto}
#choices .inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.chbtn{width:100%;text-align:left;padding:12px 15px;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,#2a2219,#1d1710);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:.9rem;line-height:1.55;transition:.15s;position:relative}
.chbtn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#352a1e,#241d16);transform:translateX(3px)}
.chbtn:active:not(:disabled){transform:scale(.985)}
.chbtn:disabled{opacity:.42;cursor:not-allowed}
.chbtn .req{display:block;font-size:.68rem;color:#c98a8a;margin-top:3px}
#nav{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:40;display:flex;background:#15100b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:.66rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.15s}
#nav button i{font-style:normal;font-size:1.05rem;filter:grayscale(.4)}
#nav button:hover,#nav button:active{color:var(--gold);background:#1d1710}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(5,3,2,.86);padding:14px;backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fadein .25s}
.mbox{width:min(680px,100%);max-height:86vh;overflow-y:auto;background:linear-gradient(175deg,#241d16,#15100b);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.9)}
.mbox h2{color:var(--gold);font-size:1.15rem;letter-spacing:.12em;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.mbox h3{color:var(--gold);font-size:.92rem;margin:16px 0 6px}
.mbox p,.mbox li{font-size:.86rem;line-height:1.9;color:var(--ink-dim)}
.mbox li{margin-left:1.2em;margin-bottom:4px}
.mbox b{color:var(--ink)}
.mbox .em{color:var(--gold)}
.mbox .btn{display:block;width:100%;margin-top:18px;padding:13px;border-radius:11px;cursor:pointer;background:linear-gradient(180deg,#7a5d16,#5a4210);border:1px solid var(--gold);color:#fff5d6;font-family:inherit;font-size:.95rem;letter-spacing:.14em;transition:.15s}
.mbox .btn:hover{filter:brightness(1.18)}
.mbox .btn.ghost{background:#241d16;border-color:var(--line);color:var(--ink-dim);letter-spacing:.08em;font-size:.84rem}
.sec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;margin-top:8px}
.sec-item{font-size:.72rem;padding:5px 8px;border-radius:7px;background:#1a1410;border:1px solid #332a1f;color:#5d5240}
.sec-item.got{color:#9fe08a;border-color:#4e6b3a;background:#1b2416}
.hist-item{font-size:.78rem;padding:7px 10px;border-left:2px solid var(--gold);background:#1a1410;margin-bottom:6px;border-radius:0 8px 8px 0;color:var(--ink-dim);line-height:1.6}
.hist-item b{color:var(--gold)}
.drow{display:flex;gap:12px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.die{width:62px;height:62px;border-radius:13px;background:linear-gradient(160deg,#f3e8cf,#cbb98f);color:#241d16;font-size:1.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 18px rgba(0,0,0,.6)}
.die.rolling{animation:roll .5s linear}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
.die.dim{opacity:.28}
.die.small{width:46px;height:46px;font-size:1.4rem}
.totalline{text-align:center;font-size:.95rem;color:var(--gold);letter-spacing:.08em;margin:8px 0;line-height:1.6}
.res-ok{color:#9fe08a}.res-bad{color:#f09a9a}
.tlog{font-size:.74rem;color:#9a8b6e;margin-top:6px;line-height:1.6}
#toasts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(30,22,15,.97);border:1px solid var(--gold);color:var(--ink);padding:9px 16px;border-radius:10px;font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.8);animation:tin .3s ease;line-height:1.5;text-align:center}
.toast.bad{border-color:#8b3a3a;color:#f0b0b0}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:520px){#content{padding:12px 13px 210px}#text{font-size:.93rem;line-height:1.95}.inv-card{flex:0 0 208px}}
</style>
</head>
<body>
<div id="grain"></div><div id="vignette"></div>

<div id="start" class="screen on">
  <h1>金斯波特蛻變記</h1>
  <div class="sub">THE KINGSPORT METAMORPHOSIS</div>
  <div class="book">
    <p>秋分之夜，一封來自陌生人 <b>伊萊賈·哈考特</b> 的信將你引向迷霧籠罩的哈考特莊園。</p>
    <p>蜘蛛在牆後爬行，夢境與現實的界線正在溶解。今晚七點整，你必須做出選擇——而你的每一個選擇，都將決定金斯波特、乃至整個世界的命運。</p>
    <p style="color:var(--gold);letter-spacing:.1em;font-size:.82rem">請先選擇一位調查員：</p>
  </div>
  <div class="inv-wrap"><div class="inv-grid" id="invGrid"></div></div>
  <button class="mbox btn" id="btnBegin" style="width:min(640px,100%);margin-top:6px" disabled>選擇調查員後開始遊戲</button>
</div>

<div id="game" class="screen">
  <div id="topbar">
    <div class="row1"><span id="invName">—</span><span class="badge" id="invRole">—</span><span class="badge" id="chapBadge">第 1 章</span></div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="main"><div id="scene"></div><div id="content"><div id="chapNo">第 1 章</div><div id="text"></div><div id="fxline"></div></div></div>
  <div id="choices"><div class="inner" id="choicesInner"></div></div>
  <div id="nav">
    <button id="navHelp"><i>❔</i>說明</button>
    <button id="navSave"><i>💾</i>存檔</button>
    <button id="navLoad"><i>📂</i>讀檔</button>
    <button id="navHist"><i>📜</i>紀錄</button>
    <button id="navAch"><i>🏆</i>成就</button>
    <button id="navSound"><i>🔊</i>音效</button>
  </div>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toasts"></div>

<script>
/* 簡化版：直接渲染文字與按鈕，不依賴打字機回調，徹底解決卡死問題 */

const INVESTIGATORS = {
  jacqueline:{name:'傑奎琳·法恩',role:'靈媒',wp:5,int:3,com:2,hp:6,san:9,item:'夢境日記',ability:'千里眼',weakness:'黑暗未來',
    prologue:'金斯波特的迷霧對你而言早已不陌生。自兒時起，你便能感受到那股令人窒息的壓抑感縈繞心頭，迷霧中還夾雜著來自無名之地的低語。\n\n有人或許會說你浮躁又異想天開，但你清楚自己聽到的真相——那些飄越夢境邊界的呢喃，那些尚未發生的未來碎片。\n\n當你的超自然感知牽引著你，手握一封詭異的信件走向被迷霧籠罩的金斯波特街道時，你知道自己別無選擇，只能循著指引前行。'},
  lucius:{name:'盧修斯·加洛韋',role:'追夢人',wp:2,int:4,com:1,hp:8,san:6,item:'詩集',ability:'詩人',weakness:'洪水之夢',
    prologue:'文字於你向來信手拈來，睡眠卻並非如此——自伴侶魯迪失蹤後，安穩的睡眠便與你無緣。即便偶爾入眠，夜夜都會被同一個朦朧的水下城市幻象糾纏。\n\n如今，你揣著夾在外套口袋裡的神秘信件，行走在金斯波特的小巷中。倘若你夢境的真相就藏在這裡，無論等待你的是凱旋還是毀滅，你都會直面它。'},
  lola:{name:'洛拉·海耶斯',role:'演員',wp:3,int:3,com:3,hp:6,san:6,item:'名片',ability:'隨機應變',weakness:'身份危機',
    prologue:'作為一名技藝精湛的演員，你可以化身成任何人——孝順的女兒、悲情的戀人、被背叛的女王。角色不斷變換，你臉上的面具卻從未卸下。\n\n你第一次聽到金斯波特這個名字，並非來自劇本，而是舞台上一名演員的無心低語。\n\n所以，當一封來自伊萊賈·哈考特的信件寄來，邀請你前往他在金斯波特的宅邸時，你決定暫且放下表演。'}
};

const D = {};
D[1]={s:'mist',t:'金斯波特鎮坐落於密斯卡托尼克河入海口。金斯波特海岬是其中最壯觀的一處——這片巨大的岩石半島由一條長長的堤道與大陸相連。但你來到這裡，並非為了欣賞風景。\n\n你從口袋裡掏出那封信。字跡潦草而扭曲：「種種離奇而緊急的狀況，迫使我懇請你前來哈考特莊園……請獨自前來，勿帶同伴，切勿告知他人。」\n\n距離約定的晚上七點還有幾個小時。你決定好好利用這段時間。',
  c:[{l:'前往金斯波特中心山街區——眾多歷史悠久的建築',g:2},{l:'前往金斯波特港濱區——碼頭與酒館',g:3},{l:'前往金斯波特南岸社區——街頭靈媒聚集地',g:4}]};
D[2]={s:'mist',t:'中心山街區盡是裝飾華麗的宅邸與古老的榆樹。你攔住一位從豪宅走出的中年婦人，問起哈考特莊園。\n\n「你來錯地方了，」她說，「哈考特莊園不在鎮上，它坐落在懸崖頂上。」她壓低聲音：「那地方的氣氛，怪怪的。」\n\n她打了個寒顫，匆匆離去。',
  f:{clue:1},c:[{l:'動身前往哈考特莊園',g:5}]};
D[3]={s:'mist',t:'港濱區是大海、迷霧與小鎮之間的屏障。漁船隨著潮汐起伏。你向漁民們提起伊萊賈·哈考特的名字，得到的卻只有一張張茫然的臉。\n\n你沿著港口繞行，最終抵達北角燈塔。爬上塔頂，你透過望遠鏡望向懸崖上的宅邸——卻只看到一片詭異的紫色迷霧。',
  f:{clue:1},c:[{l:'動身前往哈考特莊園',g:5}]};
D[4]={s:'mist',t:'南岸是金斯波特的藝術和娛樂區。你走進一座裝飾俗艷的帳篷——「茲維茲達夫人，神諭者」。\n\n老婦人握住你的手，久久不語。終於，她開口了：「你被召喚……前往夢之屋……七人被召喚……儀式已然開始……而你的命運……我看不到！」',
  f:{clue:1},c:[{l:'動身前往哈考特莊園',g:5}]};
D[5]={s:'manor',t:'馬車在一扇漆黑的鐵門外停下。車伕低聲嘟囔：「沒多少人願意來這兒。」\n\n你沿著紅楓夾道的碎石車道前行。門鈴響起後，一位面色蠟黃的管家打開了門。屋內的落地鐘正好敲響七下。\n\n客廳裡已聚集了六位客人。高瘦的律師佩雷格林·沃德走上前來，一一為你介紹：伊莎貝爾·哈考特、奧托·瓦努姆教授、霍勒斯·特倫霍姆、科拉·貝爾韋瑟醫生、路德·哈羅醫生。\n\n你該加入哪一方的交談？',
  c:[{l:'走近佩雷格林·沃德與伊莎貝爾·哈考特',g:6},{l:'走近奧托·瓦努姆教授與路德·哈羅醫生',g:7},{l:'走近霍勒斯·特倫霍姆與科拉·貝爾韋瑟醫生',g:8}]};
D[6]={s:'manor',t:'你走近角落，聽見伊莎貝爾正壓低聲音對律師說：「我不敢相信他竟然和我斷絕關係！」\n\n她察覺到你的到來，立刻閉了嘴。沃德轉過身，禮貌地問：「有什麼我能為你做的嗎？」\n\n你隨意地與他攀談起法律事務。交談結束時，你摸清了法律從業者的思維模式。',
  f:{clue:1,ab:'法律知識'},c:[{l:'繼續',g:9}]};
D[7]={s:'manor',t:'「哦，又見面了。」瓦努姆教授說著，和你一起走到酒水車旁。這位學者身上透著一股緊張的氣息。\n\n「來點喝的？威士忌怎麼樣？」',
  c:[{l:'接受邀請，喝上一杯',g:10},{l:'禮貌地拒絕',g:9}]};
D[8]={s:'manor',t:'「這麼說，你對蜘蛛的研究充滿熱情？」特倫霍姆正問貝爾韋瑟醫生。\n\n「是的，在蛛形動物學領域，我也算半個專家。」她臉頰泛紅，目光落回地上。',
  f:{secret:'離我遠點'},c:[{l:'繼續',g:9}]};
D[9]={s:'manor',t:'一陣鈴聲打斷了交談。管家諾特走進客廳：「哈考特先生現在要見各位，請隨我去他的書房。」\n\n七個人跟在他身後穿過大廳。特倫霍姆搖了搖門把：「門打不開，鎖上了。」\n\n裡面沒有回應。',
  c:[{l:'和特倫霍姆一起撞開門',g:11}]};

/* 以上為簡化版章節，方便測試 */

let S = null;
const $ = id => document.getElementById(id);

function newState(k){
  const inv = INVESTIGATORS[k];
  return {inv:k, wp:inv.wp, int:inv.int, com:inv.com, hp:inv.hp, san:inv.san, clue:0, res:0, doom:0, items:[inv.item], abilities:[inv.ability], weaknesses:[inv.weakness], secrets:[], history:[], chapter:1};
}

function showScreen(n){
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
  $(n).classList.add('on');
}

function renderStats(){
  if(!S) return;
  const inv = INVESTIGATORS[S.inv];
  const effWp = S.wp + Math.min(0, S.san);
  const effInt = S.int + Math.min(0, S.san);
  const effCom = S.com + Math.min(0, S.hp);
  
  $('invName').textContent = inv.name;
  $('invRole').textContent = inv.role;
  $('chapBadge').textContent = '第 ' + S.chapter + ' 章';
  $('stats').innerHTML = `
    <span class="pill">意志 <b>${effWp}</b></span>
    <span class="pill">智力 <b>${effInt}</b></span>
    <span class="pill">戰鬥 <b>${effCom}</b></span>
    <span class="pill hp">生命 <b>${S.hp}</b></span>
    <span class="pill san">理智 <b>${S.san}</b></span>
    <span class="pill clue">線索 <b>${S.clue}</b></span>
    <span class="pill res">資源 <b>${S.res}</b></span>
    <span class="pill doom">厄運 <b>${S.doom}</b></span>`;
}

function renderScene(svgId){
  const svg = `<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice"><rect width="400" height="200" fill="#0b0910"/><circle cx="200" cy="100" r="80" fill="#3b1f6b" opacity=".15"/></svg>`;
  $('scene').innerHTML = svg;
}

function renderChoices(ch){
  const box = $('choicesInner');
  box.innerHTML = '';
  if(ch.end){ showEnding(ch.end); return; }
  
  (ch.c||[]).forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'chbtn';
    let label = opt.l;
    let blocked = false, reason = '';
    const req = opt.q;
    
    if(req){
      if(req.item){
        const need = Array.isArray(req.item)?req.item:[req.item];
        const lack = need.filter(x=>S.items.indexOf(x)<0);
        if(lack.length){ blocked = true; reason = '缺少物品：' + lack.map(x=>'['+x+']').join('、'); }
      }
      if(req.ab){
        const need = Array.isArray(req.ab)?req.ab:[req.ab];
        if(!need.some(x=>S.abilities.indexOf(x)>=0)){ blocked = true; reason = '需要能力：{'+need.join('/')+'}'; }
      }
      if(req.wk){
        const need = Array.isArray(req.wk)?req.wk:[req.wk];
        if(!need.some(x=>S.weaknesses.indexOf(x)>=0)){ blocked = true; reason = '需要弱點：{'+need.join('/')+'}'; }
      }
    }
    
    btn.innerHTML = label + (blocked?`<span class="req">${reason}</span>`:'');
    btn.onclick = ()=>{
      if(blocked){ showToast(reason, true); return; }
      playSound('click');
      if(opt.t){ startTest(opt.t, opt.l); }
      else if(opt.g!=null){ gotoChapter(opt.g); }
    };
    box.appendChild(btn);
  });
}

function gotoChapter(id){
  if(typeof id === 'string' && id.startsWith('END')){
    const stars = {'END0':0,'END1':1,'END2':2,'END3':3,'END4':4}[id]||0;
    showEnding({stars, title:{END0:'歸於蛛網',END1:'生不如死',END2:'錯綜複雜的網',END3:'死亡之屋',END4:'蜘蛛之屋'}[id], text:'你的金斯波特冒險在此落幕。'});
    return;
  }
  const ch = D[id];
  if(!ch){ showToast('該章節尚未開放', true); return; }
  
  S.chapter = id;
  if(ch.f) applyFx(ch.f);
  
  renderStats();
  renderScene(ch.s);
  $('chapNo').textContent = '第 ' + S.chapter + ' 章';
  
  // 直接顯示文字，無打字機效果，確保按鈕立刻出現
  $('text').textContent = ch.t || '';
  
  // 渲染選項
  renderChoices(ch);
  
  // 渲染效果
  const box = $('fxline'); box.innerHTML = '';
  if(ch.f) {
    if(ch.f.clue) box.innerHTML += `<span class="fx good">線索 +${ch.f.clue}</span>`;
    if(ch.f.hp) box.innerHTML += `<span class="fx bad">生命 ${ch.f.hp}</span>`;
    if(ch.f.san) box.innerHTML += `<span class="fx bad">理智 ${ch.f.san}</span>`;
    if(ch.f.doom) box.innerHTML += `<span class="fx bad">厄運 +${ch.f.doom}</span>`;
    if(ch.f.secret) box.innerHTML += `<span class="fx good">秘密線索：${ch.f.secret}</span>`;
  }
  
  $('main').scrollTop = 0;
  save();
}

function applyFx(f){
  if(f.clue) S.clue += f.clue;
  if(f.res) S.res += f.res;
  if(f.hp) S.hp += f.hp;
  if(f.san) S.san += f.san;
  if(f.doom) S.doom += f.doom;
  if(f.wp) S.wp += f.wp;
  if(f.int) S.int += f.int;
  if(f.com) S.com += f.com;
  if(f.item && S.items.indexOf(f.item)<0) S.items.push(f.item);
  if(f.ab && S.abilities.indexOf(f.ab)<0) S.abilities.push(f.ab);
  if(f.wk && S.weaknesses.indexOf(f.wk)<0) S.weaknesses.push(f.wk);
  if(f.secret && S.secrets.indexOf(f.secret)<0) S.secrets.push(f.secret);
}

function d6(){ return Math.floor(Math.random()*6)+1; }
let pendingTest = null;

function startTest(t, label){
  pendingTest = { t, label, usedBonus:false };
  openTestModal(t, label);
}

function getAttr(a){
  const effWp = S.wp + Math.min(0, S.san);
  const effInt = S.int + Math.min(0, S.san);
  const effCom = S.com + Math.min(0, S.hp);
  if(a==='wp') return effWp;
  if(a==='int') return effInt;
  if(a==='com') return effCom;
  if(a==='hp') return S.hp;
  if(a==='san') return S.san;
  return 0;
}

function openTestModal(t, label){
  const isSan = t.mode==='san';
  const isFate = t.mode==='fate';
  const st = { wp: getAttr('wp'), int: getAttr('int'), com: getAttr('com') };
  
  let desc = '';
  if(isSan) desc = `擲 1 顆骰子，若點數 ≤ 當前理智值 <b>${S.san}</b> 即成功。`;
  else if(isFate) desc = `擲 1 顆骰子，若點數 ≤ 當前厄運值 <b>${S.doom}</b> 即失敗。`;
  else desc = `擲 1 顆骰子 ＋ ${t.a==='wp'?'意志力':t.a==='int'?'智力':'戰鬥'} <b>${getAttr(t.a)}</b>${t.b?` ＋ ${t.b==='wp'?'意志力':t.b==='int'?'智力':t.b==='hp'?'生命值':'戰鬥'} <b>${getAttr(t.b)}</b>`:''}，目標 <b>${t.d}</b>。`;
  
  const canBonus = (t.c==='res' && S.res>0) || (t.c==='clue' && S.clue>0);
  
  $('mbox').innerHTML = `
    <h2>⚄ 屬性測試</h2>
    <p><b>${label}</b></p>
    <p style="margin-top:8px">${desc}</p>
    <div id="diceArea"></div>
    ${canBonus?`<button class="btn ghost" id="btnBonus">消耗 1 點${t.c==='res'?'資源':'線索'}，改擲 2 顆骰取高</button>`:''}
    <button class="btn" id="btnRoll">擲骰！</button>`;
  $('modal').classList.add('on');
  
  if(canBonus){
    $('btnBonus').onclick = ()=>{
      if(pendingTest.usedBonus) return;
      pendingTest.usedBonus = true;
      if(t.c==='res') S.res--; else S.clue--;
      $('btnBonus').disabled = true;
      $('btnBonus').textContent = '已消耗（將擲 2 顆取高）';
      renderStats();
    };
  }
  
  $('btnRoll').onclick = ()=>doRoll(t, label);
}

function doRoll(t, label){
  const btn = $('btnRoll');
  if(!btn || btn.disabled) return;
  btn.disabled = true;
  
  const twoDice = pendingTest.usedBonus;
  const area = $('diceArea');
  area.innerHTML = `<div class="drow"><div class="die rolling" id="d1">?</div>${twoDice?'<div class="die rolling" id="d2">?</div>':''}</div>`;
  
  let ticks = 0;
  const iv = setInterval(()=>{
    $('d1').textContent = d6();
    if($('d2')) $('d2').textContent = d6();
    ticks++;
    if(ticks>8){ clearInterval(iv); resolve(); }
  }, 55);
  
  function resolve(){
    const r1 = d6();
    const r2 = twoDice ? d6() : null;
    $('d1').textContent = r1; $('d1').classList.remove('rolling');
    if($('d2')){ $('d2').textContent = r2; $('d2').classList.remove('rolling'); }
    
    let roll = twoDice ? Math.max(r1, r2) : r1;
    let success, total;
    
    if(t.mode === 'san'){ total = roll; success = (roll <= S.san); }
    else if(t.mode === 'fate'){ total = roll; success = (roll > S.doom); }
    else {
      let base = getAttr(t.a) + (t.b ? getAttr(t.b) : 0);
      let mod = 0;
      (t.plus||[]).forEach(x=>{ if(S.abilities.indexOf(x)>=0) mod += 1; });
      (t.minus||[]).forEach(x=>{ if(S.weaknesses.indexOf(x)>=0) mod -= 1; });
      total = roll + base + mod;
      success = (total >= t.d);
    }
    
    const resLine = document.createElement('div');
    resLine.className = 'totalline';
    resLine.innerHTML = `擲出 <span class="em">${roll}</span> → <span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`;
    area.appendChild(resLine);
    
    const nb = document.createElement('button');
    nb.className = 'btn';
    nb.textContent = '繼續 ▶';
    nb.onclick = ()=>{
      $('modal').classList.remove('on');
      if(t.battle) resolveBattle(t, label);
      else gotoChapter(success ? t.p : t.f);
    };
    $('mbox').appendChild(nb);
  }
}

function resolveBattle(t, label){
  const rounds = t.battle;
  let wins = 0, loses = 0, idx = 0;
  $('mbox').innerHTML = `<h2>⚔ 多輪戰鬥</h2><p><b>${label}</b></p><div id="battleLog" class="tlog"></div><div id="battleDice" class="drow"></div><button class="btn" id="btnNextRound">開始第 1 輪</button>`;
  $('modal').classList.add('on');
  let prevWin = false;
  
  $('btnNextRound').onclick = ()=>{
    const btn = $('btnNextRound');
    btn.disabled = true;
    const rd = rounds[idx];
    const twoDice = (t.c==='res' && S.res>0) || (t.c==='clue' && S.clue>0);
    const r1 = d6(), r2 = twoDice ? d6() : d6();
    const roll = twoDice ? Math.max(r1, r2) : r1;
    let base = (rd.a==='com'?getAttr('com'):rd.a==='wp'?getAttr('wp'):getAttr('int')) + (rd.b ? getAttr(rd.b) : 0);
    let mod = 0;
    (rd.plus||[]).forEach(x=>{ if(S.abilities.indexOf(x)>=0) mod += 1; });
    (rd.minus||[]).forEach(x=>{ if(S.weaknesses.indexOf(x)>=0) mod -= 1; });
    if(prevWin && rd.winBonus) mod += rd.winBonus;
    const total = roll + base + mod;
    const ok = total >= rd.d;
    if(ok){ wins++; prevWin = true; } else { loses++; prevWin = false; }
    
    const log = $('battleLog');
    log.innerHTML += `<div>第 ${idx+1} 輪：擲出 ${roll}＋${base}${mod?'＋修正'+mod:''}＝${total}（目標 ${rd.d}）→ <span class="${ok?'res-ok':'res-bad'}">${ok?'勝利':'失敗'}</span></div>`;
    $('battleDice').innerHTML = `<div class="die small">${r1}</div><div class="die small">${r2}</div>`;
    idx++;
    
    if(idx < rounds.length){
      btn.disabled = false;
      btn.textContent = `開始第 ${idx+1} 輪`;
    } else {
      btn.remove();
      const nb = document.createElement('button');
      nb.className = 'btn';
      nb.textContent = '結算戰鬥 ▶';
      nb.onclick = ()=>{
        $('modal').classList.remove('on');
        if(wins >= 2) gotoChapter(t.p);
        else gotoChapter(t.f);
      };
      $('mbox').appendChild(nb);
    }
  };
}

function showEnding(e){
  const stars = '★'.repeat(e.stars) + '☆'.repeat(4-e.stars);
  $('mbox').innerHTML = `
    <h2>${e.stars>=3?'🏆 冒險結束':'☠ 冒險結束'}</h2>
    <div style="text-align:center;font-size:1.7rem;color:#c9a227;letter-spacing:.2em;margin:6px 0 14px">${stars}</div>
    <h3>${e.title}</h3>
    <p>${e.text}</p>
    <h3>本次冒險結算</h3>
    <p>調查員：<span class="em">${INVESTIGATORS[S.inv].name}</span><br>
    生命值 ${S.hp}　理智值 ${S.san}　線索 ${S.clue}　資源 ${S.res}　厄運 ${S.doom}</p>
    <button class="btn" id="btnAgain">再次開始新冒險</button>
    <button class="btn ghost" id="btnAch2">查看成就</button>`;
  $('modal').classList.add('on');
  $('btnAgain').onclick = ()=>{ $('modal').classList.remove('on'); restart(); };
  $('btnAch2').onclick = ()=>{ openAch(); };
  $('choicesInner').innerHTML = '';
}

function restart(){
  S = null;
  $('choicesInner').innerHTML='';
  $('text').textContent='';
  $('fxline').innerHTML='';
  showScreen('start');
  renderInvGrid();
  $('btnBegin').disabled = true;
  selectedInv = null;
}

let selectedInv = null;

function renderInvGrid(){
  const g = $('invGrid');
  g.innerHTML = '';
  Object.keys(INVESTIGATORS).forEach(k=>{
    const inv = INVESTIGATORS[k];
    const card = document.createElement('div');
    card.className = 'inv-card' + (selectedInv===k?' sel':'');
    card.innerHTML = `
      <div class="nm">${inv.name}</div>
      <div class="rl">${inv.role}</div>
      <div class="stat-row"><span>意志力</span><span>${inv.wp}</span></div>
      <div class="stat-row"><span>智力</span><span>${inv.int}</span></div>
      <div class="stat-row"><span>戰鬥</span><span>${inv.com}</span></div>
      <div class="stat-row"><span>生命值</span><span>${inv.hp}</span></div>
      <div class="stat-row"><span>理智值</span><span>${inv.san}</span></div>
      <div class="stat-row"><span>初始物品</span><span>[${inv.item}]</span></div>
      <div class="ab">能力：{${inv.ability}}</div>
      <div class="wk">弱點：{${inv.weakness}}</div>`;
    card.onclick = ()=>{
      selectedInv = k;
      playSound('click');
      renderInvGrid();
      $('btnBegin').disabled = false;
      $('btnBegin').textContent = '以「' + inv.name + '」開始遊戲';
    };
    g.appendChild(card);
  });
}

function startGame(k){
  S = newState(k);
  showScreen('game');
  $('choicesInner').innerHTML='';
  $('text').textContent='';
  $('fxline').innerHTML='';
  
  renderScene('mist');
  $('chapNo').textContent = '序章';
  $('chapBadge').textContent = '序章';
  $('text').textContent = INVESTIGATORS[k].prologue;
  
  $('choicesInner').innerHTML='';
  const b = document.createElement('button');
  b.className = 'chbtn';
  b.textContent = '翻到第 1 章 ▶';
  b.onclick = ()=>{ playSound('page'); gotoChapter(1); };
  $('choicesInner').appendChild(b);
  save();
}

function save(){
  try{ localStorage.setItem('kingsport_save_v3', JSON.stringify(S)); }catch(e){}
}

function hasSave(){
  try{ return !!localStorage.getItem('kingsport_save_v3'); }catch(e){ return false; }
}

function load(){
  try{
    const r = localStorage.getItem('kingsport_save_v3');
    if(!r){ showToast('沒有找到存檔', true); return false; }
    S = JSON.parse(r);
    if(!S || !S.inv){ showToast('存檔已損壞', true); return false; }
    showScreen('game');
    renderStats();
    gotoChapter(S.chapter); // 直接重新渲染該章節
    showToast('讀檔成功 ✓');
    return true;
  }catch(e){ showToast('讀檔失敗', true); return false; }
}

function showToast(msg, bad){
  const d = document.createElement('div');
  d.className = 'toast' + (bad?' bad':'');
  d.textContent = msg;
  $('toasts').appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .4s'; d.style.opacity='0'; setTimeout(()=>d.remove(),400); }, 2400);
}

function playSound(type){
  // 音效可選，這裡先跳過以防瀏覽器限制
}

function openAch(){
  $('mbox').innerHTML = `<h2>🏆 成就</h2><p>冒險記錄保存在瀏覽器中。</p><button class="btn" id="btnClose">關閉</button>`;
  $('modal').classList.add('on');
  $('btnClose').onclick = ()=> $('modal').classList.remove('on');
}

/* 事件綁定 */
$('btnBegin').onclick = ()=>{
  if(!selectedInv) return;
  $('mbox').innerHTML = `<h2>📖 遊戲說明</h2><p>這是一款互動式冒險遊戲。點擊下方選項推進故事，遇到測試時根據屬性擲骰子判定。</p><button class="btn" id="btnHelpClose">我準備好了，開始遊戲</button>`;
  $('modal').classList.add('on');
  $('btnHelpClose').onclick = ()=>{ $('modal').classList.remove('on'); startGame(selectedInv); };
};

$('navHelp').onclick = ()=>{ $('mbox').innerHTML = `<h2>📖 說明</h2><p>點擊選項推進故事，屬性測試會自動判定成功或失敗。</p><button class="btn" id="btnClose">關閉</button>`; $('modal').classList.add('on'); $('btnClose').onclick=()=>$('modal').classList.remove('on'); };
$('navSave').onclick = ()=>{ if(S) save(); showToast('已存檔 ✓'); };
$('navLoad').onclick = ()=>{ load(); };
$('navHist').onclick = ()=>{ $('mbox').innerHTML = `<h2>📜 紀錄</h2><p>冒險紀錄保存在瀏覽器中。</p><button class="btn" id="btnClose">關閉</button>`; $('modal').classList.add('on'); $('btnClose').onclick=()=>$('modal').classList.remove('on'); };
$('navAch').onclick = ()=>{ openAch(); };
$('navSound').onclick = ()=>{ showToast('音效已切換（模擬）'); };

/* 初始化 */
renderInvGrid();
</script>
</body>
