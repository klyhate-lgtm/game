let typeTimer=null;
function typeText(el,txt,done){
  el.innerHTML='';let i=0;
  const cur=document.createElement('span');cur.className='cursor';cur.textContent='\u00A0';el.appendChild(cur);
  function step(){
    if(i>=txt.length){cur.remove();done&&done();return;}
    const c=txt.slice(i,i+2);i+=2;cur.insertAdjacentText('beforebegin',c);
    typeTimer=setTimeout(step,14);
  }
  step();
  el._skip=()=>{clearTimeout(typeTimer);el.innerHTML=txt;cur.remove();done&&done();el._skip=null;};
}

function renderAll(){
  const ch=D[S.chapter];
  if(!ch){toast('章節資料遺失，返回第1章',true);S.chapter=1;return renderAll();}
  renderStats();renderScene(ch.s);
  $('chapNo').textContent='第 '+S.chapter+' 章';
  if(S.history.length===0||S.history[S.history.length-1].id!==S.chapter){
    S.history.push({id:S.chapter,t:(ch.t||'').slice(0,22)});if(S.history.length>300)S.history.shift();
  }
  const textEl=$('text');
  typeText(textEl,ch.t||'',()=>renderChoices(ch));
  textEl.onclick=()=>{if(textEl._skip)textEl._skip();};
  $('main').scrollTop=0;
  renderFx(ch.f);
}

function renderFx(f){
  const box=$('fxline');box.innerHTML='';if(!f)return;
  const map=[['clue','線索'],['res','資源'],['hp','生命'],['san','理智'],['doom','厄運'],['wp','意志'],['int','智力'],['com','戰鬥']];
  map.forEach(([k,label])=>{
    if(f[k]){const d=document.createElement('span');
      d.className='fx '+(f[k]>0?(k==='doom'?'bad':'good'):'bad');
      d.textContent=label+(f[k]>0?' +':' ')+f[k];box.appendChild(d);}
  });
  if(f.item){const d=document.createElement('span');d.className='fx good';d.textContent='獲得物品：'+f.item;box.appendChild(d);}
  if(f.ab){const d=document.createElement('span');d.className='fx good';d.textContent='獲得能力：{'+f.ab+'}';box.appendChild(d);}
  if(f.wk){const d=document.createElement('span');d.className='fx bad';d.textContent='獲得弱點：{'+f.wk+'}';box.appendChild(d);}
  if(f.secret){const d=document.createElement('span');d.className='fx good';d.textContent='秘密線索：'+f.secret;box.appendChild(d);}
}

function renderChoices(ch){
  const box=$('choicesInner');box.innerHTML='';
  if(ch.end){showEnding(ch.end);return;}
  (ch.c||[]).forEach(opt=>{
    const btn=document.createElement('button');btn.className='chbtn';
    let label=opt.l,blocked=false,reason='';
    const req=opt.q;
    if(req){
      if(req.item){const need=Array.isArray(req.item)?req.item:[req.item];
        const lack=need.filter(x=>S.items.indexOf(x)<0);
        if(lack.length){blocked=true;reason='缺少物品：'+lack.map(x=>'['+x+']').join('、');}}
      if(req.ab){const need=Array.isArray(req.ab)?req.ab:[req.ab];
        if(!need.some(x=>S.abilities.indexOf(x)>=0)){blocked=true;reason='需要能力：{'+need.join('/')+'}';}}
      if(req.wk){const need=Array.isArray(req.wk)?req.wk:[req.wk];
        if(!need.some(x=>S.weaknesses.indexOf(x)>=0)){blocked=true;reason='需要弱點：{'+need.join('/')+'}';}}
    }
    btn.innerHTML=label+(blocked?`<span class="req">${reason}</span>`:'');
    btn.onclick=()=>{
      if(blocked){toast(reason,true);return;}
      Sound.click();
      if(opt.t){startTest(opt.t,opt.l);}
      else if(opt.g!=null){gotoChapter(opt.g);}
    };
    box.appendChild(btn);
  });
}

/* ============================================================
   章節跳轉 + 效果結算
   ============================================================ */
function gotoChapter(id){
  if(typeof id==='string'&&id.startsWith('END')){
    const stars={'END0':0,'END1':1,'END2':2,'END3':3,'END4':4}[id]||0;
    showEnding({stars,title:{END0:'歸於蛛網',END1:'生不如死',END2:'錯綜複雜的網',END3:'死亡之屋',END4:'蜘蛛之屋'}[id],
      text:'你的金斯波特冒險在此落幕。'});
    return;
  }
  const ch=D[id];
  if(!ch){toast('該章節尚未開放',true);return;}
  S.chapter=id;
  applyFx(ch.f);
  renderAll();
  autoSave();
}

function applyFx(f){
  if(!f)return;
  if(f.clue){gainClue(f.clue);}
  if(f.res){S.res=Math.max(0,S.res+f.res);}
  if(f.hp){S.hp+=f.hp;}
  if(f.san){S.san+=f.san;}
  if(f.doom){S.doom+=f.doom;Sound.doom();}
  if(f.wp){S.wp+=f.wp;}
  if(f.int){S.int+=f.int;}
  if(f.com){S.com+=f.com;}
  if(f.item&&S.items.indexOf(f.item)<0)S.items.push(f.item);
  if(f.ab&&S.abilities.indexOf(f.ab)<0)S.abilities.push(f.ab);
  if(f.wk&&S.weaknesses.indexOf(f.wk)<0)S.weaknesses.push(f.wk);
  if(f.secret)unlockSecret(f.secret);
}

function gainClue(n){
  if(n<=0){S.clue=Math.max(0,S.clue+n);return;}
  const inv=INV[S.inv];
  // 盧修斯弱點：洪水之夢
  if(inv.weakness==='洪水之夢'){
    const roll=d6();
    if(roll<S.clue){toast(`{洪水之夢}：擲出 ${roll}，低於當前線索 ${S.clue}，無法獲得線索`,true);return;}
  }
  // 傑奎琳：每輪冒險開始時 +1 線索、+1 資源（簡化為首次獲得線索時觸發一次）
  if(inv.ability==='千里眼'&&!S.jacClueBonus){
    S.clue+=1;S.res+=1;S.jacClueBonus=true;
    toast('{夢境日記}：獲得 +1 線索、+1 資源');
  }
  S.clue+=n;
}

function unlockSecret(n){
  if(!n)return;
  if(S.secrets.indexOf(n)<0)S.secrets.push(n);
  const a=getAch();a.secrets[n]=1;saveAch(a);
}

/* ============================================================
   擲骰 / 測試（完整專有測試）
   ============================================================ */
function d6(){return Math.floor(Math.random()*6)+1;}

let pendingTest=null;

function startTest(t,label){
  pendingTest={t,label,usedBonus:false};
  openTestModal(t,label);
}

function getAttr(a){
  const st=effStats();
  if(a==='wp')return st.wp;if(a==='int')return st.int;if(a==='com')return st.com;
  if(a==='hp')return S.hp;if(a==='san')return S.san;return 0;
}

function openTestModal(t,label){
  const isSan=t.mode==='san';
  const isFate=t.mode==='fate';
  const isEscape=t.mode==='escape';
  const isHalfHp=t.mode==='halfhp';
  const isCustom=t.mode==='custom';

  let desc='',note='';
  const st=effStats();
  if(isSan){desc=`擲 1 顆骰子，若點數 ≤ 當前理智值 <b>${S.san}</b> 即成功。`;}
  else if(isFate){desc=`擲 1 顆骰子，若點數 ≤ 當前厄運值 <b>${S.doom}</b> 即失敗（點數越大越安全）。`;}
  else if(isHalfHp){desc='擲 1 顆骰子，將點數除以 2（向上取整），用生命值減去該數字。';}
  else if(isEscape){desc=`擲 1 顆骰子，若點數 ≤ 當前生命值 <b>${S.hp}</b> 即成功。`;}
  else if(isCustom){desc=`擲 1 顆骰子 ＋ 戰鬥值 <b>${st.com}</b> ＋ 生命值 <b>${S.hp}</b>，目標 <b>${t.d}</b>。`;}
  else{
    const base=getAttr(t.a);
    const extra=t.b?getAttr(t.b):0;
    desc=`擲 1 顆骰子 ＋ ${t.a==='wp'?'意志力':t.a==='int'?'智力':'戰鬥'} <b>${base}</b>${t.b?` ＋ ${t.b==='wp'?'意志力':t.b==='int'?'智力':t.b==='hp'?'生命值':'戰鬥'} <b>${extra}</b>`:''}，目標 <b>${t.d}</b>。`;
  }
  const inv=INV[S.inv];
  if(inv.ability==='千里眼'&&t.a==='int')note='〔千里眼：智力測試自動擲 2 顆取高〕';
  if(inv.weakness==='黑暗未來'&&t.a==='int')note+=' 〔黑暗未來：智力測試若兩骰同點，厄運 +1 且失敗〕';

  const canBonus=(t.c==='res'&&S.res>0)||(t.c==='clue'&&S.clue>0);

  $('mbox').innerHTML=`
    <h2>⚄ 屬性測試</h2>
    <p><b>${label}</b></p>
    <p style="margin-top:8px">${desc}</p>
    ${note?`<p style="font-size:.76rem;color:#9a8b6e">${note}</p>`:''}
    <div id="diceArea"></div>
    ${canBonus?`<button class="btn ghost" id="btnBonus">消耗 1 點${t.c==='res'?'資源':'線索'}，改擲 2 顆骰取高</button>`:''}
    <button class="btn" id="btnRoll">擲骰！</button>`;
  $('modal').classList.add('on');

  if(canBonus){
    $('btnBonus').onclick=()=>{
      if(pendingTest.usedBonus)return;
      pendingTest.usedBonus=true;
      if(t.c==='res')spendResource(1);else S.clue--;
      Sound.click();$('btnBonus').disabled=true;
      $('btnBonus').textContent='已消耗 1 點'+(t.c==='res'?'資源':'線索')+'（將擲 2 顆取高）';
      renderStats();
    };
  }
  $('btnRoll').onclick=()=>doRoll(t,label);
}

function spendResource(n){
  S.res=Math.max(0,S.res-n);
  if(INV[S.inv].weakness==='身份危機'){
    const r=d6();if(r===1){S.san-=1;toast('{身份危機}：擲出 1 點，理智值 -1',true);}
  }
}

function doRoll(t,label){
  const btn=$('btnRoll');if(!btn||btn.disabled)return;btn.disabled=true;
  const inv=INV[S.inv];
  const twoDice=pendingTest.usedBonus||(inv.ability==='千里眼'&&t.a==='int');
  const area=$('diceArea');
  area.innerHTML=`<div class="drow"><div class="die rolling" id="d1">?</div>${twoDice?'<div class="die rolling" id="d2">?</div>':''}</div>`;
  Sound.dice();

  let ticks=0;
  const iv=setInterval(()=>{
    $('d1').textContent=d6();if($('d2'))$('d2').textContent=d6();
    ticks++;if(ticks>8){clearInterval(iv);resolve();}
  },55);

  function resolve(){
    const r1=d6();const r2=twoDice?d6():null;
    $('d1').textContent=r1;$('d1').classList.remove('rolling');
    if($('d2')){$('d2').textContent=r2;$('d2').classList.remove('rolling');}

    let roll,total,success,dimmed=false;
    if(twoDice){roll=Math.max(r1,r2);if(r1!==r2){const other=r1>r2?$('d2'):$('d1');other.classList.add('dim');}}
    else roll=r1;

    const st=effStats();
    const mode=t.mode;

    if(mode==='san'){total=roll;success=(roll<=S.san);}
    else if(mode==='fate'){total=roll;success=(roll>S.doom);}
    else if(mode==='halfhp'){const dmg=Math.ceil(roll/2);S.hp-=dmg;total=roll;success=true;
      const d=document.createElement('div');d.className='totalline res-bad';d.textContent=`生命值 -${dmg}`;area.appendChild(d);}
    else if(mode==='escape'){total=roll;success=(roll<=S.hp);}
    else if(mode==='custom'){total=roll+st.com+S.hp;success=(total>=t.d);}
    else{
      let base=getAttr(t.a)+(t.b?getAttr(t.b):0);
      let mod=0;
      (t.plus||[]).forEach(x=>{if(S.abilities.indexOf(x)>=0)mod+=1;});
      (t.plus2||[]).forEach(x=>{if(S.abilities.indexOf(x)>=0)mod+=2;});
      (t.minus||[]).forEach(x=>{if(S.weaknesses.indexOf(x)>=0)mod-=1;});
      (t.plusWk||[]).forEach(x=>{if(S.weaknesses.indexOf(x)>=0)mod+=1;});
      total=roll+base+mod;success=(total>=t.d);
    }

    // 黑暗未來
    let darkFuture=false;
    if(inv.weakness==='黑暗未來'&&twoDice&&r1===r2&&t.a==='int'){
      darkFuture=true;success=false;S.doom+=1;
    }

    const resLine=document.createElement('div');resLine.className='totalline';
    if(mode==='san')resLine.innerHTML=`擲出 <span class="em">${roll}</span>　理智值 <span class="em">${S.san}</span>　→　<span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`;
    else if(mode==='fate')resLine.innerHTML=`擲出 <span class="em">${roll}</span>　厄運值 <span class="em">${S.doom}</span>　→　<span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`;
    else if(mode==='halfhp')resLine.innerHTML=`擲出 <span class="em">${roll}</span>，生命值現為 <span class="em">${S.hp}</span>`;
    else if(mode==='escape')resLine.innerHTML=`擲出 <span class="em">${roll}</span>　生命值 <span class="em">${S.hp}</span>　→　<span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`;
    else resLine.innerHTML=`骰子 <span class="em">${twoDice?r1+'/'+r2+' 取 '+roll:roll}</span> ＋ 屬性 <span class="em">${getAttr(t.a)+(t.b?getAttr(t.b):0)}</span>${t.plus||t.minus?' ＋ 修正 <span class="em">'+(total-roll-getAttr(t.a)-(t.b?getAttr(t.b):0))+'</span>':''} ＝ <span class="em">${total}</span>（目標 ${t.d}）→　<span class="${success?'res-ok':'res-bad'}">${success?'成功':'失敗'}</span>`;
    area.appendChild(resLine);

    if(darkFuture){const d=document.createElement('div');d.className='totalline res-bad';d.textContent='{黑暗未來}：兩骰同點，厄運 +1，測試判定為失敗！';area.appendChild(d);}

    // 詩人返還
    if(success&&inv.ability==='詩人'&&t.c==='clue'&&pendingTest.usedBonus){
      gainClue(1);
      const d=document.createElement('div');d.className='totalline res-ok';d.textContent='{詩人}：消耗線索完成測試且成功，獲得 +1 線索。';area.appendChild(d);
    }

    success?Sound.good():Sound.bad();
    const nb=document.createElement('button');nb.className='btn';nb.textContent='繼續 ▶';
    nb.onclick=()=>{
      $('modal').classList.remove('on');
      if(t.battle){
        // 多輪戰鬥處理
        resolveBattle(t,label);
      }else if(t.partial){
        // 部分勝利（三輪戰鬥）
        if(success){gotoChapter(t.p);}
        else{gotoChapter(t.partial?t.partial: t.f);}
      }else{
        gotoChapter(success?t.p:t.f);
      }
    };
    $('mbox').appendChild(nb);
    S.battles=(S.battles||0)+1;
  }
}

/* 多輪戰鬥：逐輪處理 */
function resolveBattle(t,label){
  const rounds=t.battle;let wins=0,loses=0,idx=0;
  const st=effStats();
  $('mbox').innerHTML=`<h2>⚔ 多輪戰鬥</h2><p><b>${label}</b></p><div id="battleLog" class="tlog"></div><div id="battleDice" class="drow"></div><button class="btn" id="btnNextRound">開始第 1 輪</button>`;
  $('modal').classList.add('on');
  let prevWin=false;

  $('btnNextRound').onclick=()=>{
    const btn=$('btnNextRound');btn.disabled=true;
    const rd=rounds[idx];
    const twoDice=(t.c==='res'&&S.res>0)||(t.c==='clue'&&S.clue>0);
    // 簡化：每輪使用該輪 plus/minus
    const r1=d6(),r2=twoDice?d6():d6();
    const roll=twoDice?Math.max(r1,r2):r1;
    let base=(rd.a==='com'?st.com:rd.a==='wp'?st.wp:st.int)+(rd.b?(rd.b==='wp'?st.wp:rd.b==='int'?st.int:st.com):0);
    let mod=0;
    (rd.plus||[]).forEach(x=>{if(S.abilities.indexOf(x)>=0)mod+=1;});
    (rd.minus||[]).forEach(x=>{if(S.weaknesses.indexOf(x)>=0)mod-=1;});
    if(prevWin&&rd.winBonus)mod+=rd.winBonus;
    const total=roll+base+mod;
    const ok=total>=rd.d;
    if(ok){wins++;prevWin=true;}else{loses++;prevWin=false;}
    Sound.dice();

    const log=$('battleLog');
    log.innerHTML+=`<div>第 ${idx+1} 輪：擲出 ${roll}＋${base}${mod?'＋修正'+mod:''}＝${total}（目標 ${rd.d}）→ <span class="${ok?'res-ok':'res-bad'}">${ok?'勝利':'失敗'}</span></div>`;
    $('battleDice').innerHTML=`<div class="die small">${r1}</div><div class="die small">${r2}</div>`;
    idx++;

    if(idx<rounds.length){
      btn.disabled=false;btn.textContent=`開始第 ${idx+1} 輪`;
    }else{
      btn.remove();
      const nb=document.createElement('button');nb.className='btn';nb.textContent='結算戰鬥 ▶';
      nb.onclick=()=>{
        $('modal').classList.remove('on');
        if(t.partial){
          if(wins>=3)gotoChapter(t.p);
          else if(wins===2)gotoChapter(t.partial[2]||t.f);
          else if(wins===1)gotoChapter(t.partial[1]||t.f);
          else gotoChapter(t.f);
        }else{
          if(wins>=2)gotoChapter(t.p);
          else gotoChapter(t.f);
        }
      };
      $('mbox').appendChild(nb);
    }
  };
}

/* ============================================================
   結局
   ============================================================ */
function showEnding(e){
  const stars='★'.repeat(e.stars)+'☆'.repeat(4-e.stars);
  Sound.doom();
  const st=effStats();
  const a=getAch();
  a.endings[e.title]=Math.max(a.endings[e.title]||0,e.stars);
  a.allFound=Array.from(new Set([...(a.allFound||[]),...S.items]));
  if(a.invDone.indexOf(S.inv)<0)a.invDone.push(S.inv);
  saveAch(a);

  // 終極秘密線索檢查
  const ctx={
    star:e.stars,wpEff:st.wp,intEff:st.int,comEff:st.com,
    hp:S.hp,san:S.san,clue:S.clue,res:S.res,doom:S.doom,
    secrets:S.secrets,items:S.items,weaknesses:S.weaknesses,
    foundItems:S.items,allFoundItems:a.allFound||[],
    allSecrets:Object.keys(a.secrets||{}),
    allEndings:Object.keys(a.endings||{}),
    allInvDone:(a.invDone||[]).length>=3,
    battles:S.battles||0
  };
  const unlocked=SUPER_SECRETS.filter(x=>{try{return x.check(ctx);}catch(err){return false;}}).map(x=>x.n);

  $('mbox').innerHTML=`
    <h2>${e.stars>=3?'🏆 冒險結束':'☠ 冒險結束'}</h2>
    <div style="text-align:center;font-size:1.7rem;color:#c9a227;letter-spacing:.2em;margin:6px 0 14px">${stars}</div>
    <h3>${e.title}</h3>
    <p>${e.text}</p>
    <h3>本次冒險結算</h3>
    <p>調查員：<span class="em">${INV[S.inv].name}</span><br>
    最終章節：第 ${S.chapter} 章<br>
    生命值 ${S.hp}　理智值 ${S.san}　線索 ${S.clue}　資源 ${S.res}　厄運 ${S.doom}<br>
    已解鎖秘密線索：<span class="em">${S.secrets.length}</span> 個</p>
    ${unlocked.length?`<h3>解鎖終極秘密線索</h3><p class="em">${unlocked.join('、')}</p>`:''}
    <button class="btn" id="btnAgain">再次開始新冒險</button>
    <button class="btn ghost" id="btnAch2">查看成就</button>`;
  $('modal').classList.add('on');
  $('btnAgain').onclick=()=>{$('modal').classList.remove('on');restart();};
  $('btnAch2').onclick=()=>openAch();
  $('choicesInner').innerHTML='';
}

function restart(){
  S=null;$('choicesInner').innerHTML='';$('text').textContent='';$('fxline').innerHTML='';
  showScreen('start');renderInvGrid();$('btnBegin').disabled=true;selectedInv=null;
}

/* ============================================================
   Toast
   ============================================================ */
function toast(msg,bad){
  const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=msg;
  $('toasts').appendChild(d);
  setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(()=>d.remove(),400);},2400);
}

/* ============================================================
   說明 / 紀錄 / 成就
   ============================================================ */
function openHelp(fromStart){
  $('mbox').innerHTML=`
    <h2>📖 遊戲玩法說明</h2>
    <h3>🎯 遊戲目標</h3>
    <p>你將扮演一位調查員，深入迷霧籠罩的哈考特莊園，揭開伊萊賈·哈考特隱藏的秘密。你的每一個選擇都會改變故事走向，最終導向 <b>0 至 4 星</b> 的不同結局。</p>
    <h3>👀 看懂畫面</h3>
    <p>請看畫面最上方的資訊列：</p>
    <ul>
      <li><b>意志 / 智力 / 戰鬥</b>：三項核心技能，數值越高越容易通過測試。</li>
      <li><b>生命 ❤️</b>：降到 0 以下時，<b>戰鬥值</b>受等額懲罰。</li>
      <li><b>理智 🧠</b>：降到 0 以下時，<b>意志值</b>受等額懲罰。</li>
      <li><b>線索 🔎 / 資源 💰</b>：可在測試時消耗 1 點改擲 2 顆骰取高。</li>
      <li><b>厄運 ☠️</b>：某些「命運測試」需要擲出大於厄運值的點數才能成功。</li>
    </ul>
    <h3>🕹 操作步驟</h3>
    <ol>
      <li>選擇調查員 → 開始遊戲。</li>
      <li>閱讀章節文字（點擊可立即顯示全部）。</li>
      <li>點擊下方選項按鈕推進故事。</li>
      <li>遇到測試時，在彈窗中按「擲骰！」判定。</li>
      <li>部分測試可消耗線索／資源改擲 2 顆骰取高。</li>
    </ol>
    <h3>⚄ 測試規則</h3>
    <ul>
      <li><b>一般測試</b>：擲 1 顆骰 ＋ 屬性 ≥ 目標值。</li>
      <li><b>理智測試</b>：擲出的點數 ≤ 當前理智值即成功。</li>
      <li><b>命運測試</b>：擲出的點數 ≤ 當前厄運值即失敗（點數越大越安全）。</li>
      <li><b>多輪戰鬥</b>：逐輪判定，累計勝場決定結果。</li>
    </ul>
    <h3>✨ 特殊機制</h3>
    <ul>
      <li><b>主要能力</b>：傑奎琳「千里眼」智力測試自動擲 2 顆取高；盧修斯「詩人」消耗線索成功返還 +1 線索。</li>
      <li><b>主要弱點</b>：傑奎琳「黑暗未來」智力測試兩骰同點則厄運 +1 且失敗；盧修斯「洪水之夢」獲得線索時可能失敗；洛拉「身份危機」消耗資源可能理智 −1。</li>
      <li><b>能力／弱點</b>會在對應測試中自動加減點數。</li>
    </ul>
    <h3>💾 存讀檔</h3>
    <p>每次選擇後自動存檔，也可用底部導覽列手動存讀檔。</p>
    <button class="btn" id="btnHelpClose">${fromStart?'我準備好了，開始遊戲':'我明白了，繼續冒險'}</button>`;
  $('modal').classList.add('on');
  $('btnHelpClose').onclick=()=>{$('modal').classList.remove('on');if(fromStart&&selectedInv)startGame(selectedInv);};
}

function openHist(){
  const items=(S&&S.history)?S.history.slice().reverse():[];
  const list=items.length?items.map(h=>`<div class="hist-item"><b>第 ${h.id} 章</b>　${(D[h.id]&&D[h.id].t||'').slice(0,40)}…</div>`).join(''):'<p>尚未開始冒險。</p>';
  $('mbox').innerHTML=`
    <h2>📜 冒險紀錄</h2>
    <p style="margin-bottom:10px">以下是你走過的路線（最新在最上方）：</p>
    <div style="max-height:40vh;overflow-y:auto">${list}</div>
    <h3>已解鎖秘密線索（${S?S.secrets.length:0} / ${SECRETS.length}）</h3>
    <div class="sec-list">${SECRETS.map(s=>`<div class="sec-item ${S&&S.secrets.indexOf(s)>=0?'got':''}">${S&&S.secrets.indexOf(s)>=0?'✓ ':'　'}${s}</div>`).join('')}</div>
    <button class="btn" id="btnClose">關閉</button>`;
  $('modal').classList.add('on');
  $('btnClose').onclick=()=>$('modal').classList.remove('on');
}

function openAch(){
  const a=getAch();
  const endings=Object.keys(a.endings||{});
  const secs=Object.keys(a.secrets||{});
  const starTotals=endings.reduce((s,k)=>s+(a.endings[k]||0),0);

  // 重新計算終極秘密線索（以目前成就資料近似）
  const ctx={
    star:starTotals,wpEff:0,intEff:0,comEff:0,hp:0,san:0,clue:0,res:0,doom:0,
    secrets:secs,items:[],weaknesses:[],foundItems:a.allFound||[],
    allFoundItems:a.allFound||[],allSecrets:secs,allEndings:endings,
    allInvDone:(a.invDone||[]).length>=3,battles:0
  };
  const unlockedSuper=SUPER_SECRETS.filter(x=>{try{return x.check(ctx);}catch(e){return false;}}).map(x=>x.n);

  $('mbox').innerHTML=`
    <h2>🏆 成就與結局</h2>
    <h3>已達成的結局（${endings.length}）</h3>
    ${endings.length?endings.map(k=>{const st=a.endings[k];return `<div class="hist-item"><b>${'★'.repeat(st)}${'☆'.repeat(4-st)}</b>　${k}</div>`;}).join(''):'<p>尚未達成任何結局，快去冒險吧！</p>'}
    <p style="margin-top:10px">累計星級：<span class="em">${starTotals}</span> ★</p>
    <h3>累計解鎖秘密線索（${secs.length} / ${SECRETS.length}）</h3>
    <div class="sec-list">${SECRETS.map(s=>`<div class="sec-item ${secs.indexOf(s)>=0?'got':''}">${secs.indexOf(s)>=0?'✓ ':'　'}${s}</div>`).join('')}</div>
    <h3>終極秘密線索（${unlockedSuper.length} / ${SUPER_SECRETS.length}）</h3>
    <div class="sec-list">${SUPER_SECRETS.map(s=>`<div class="sec-item ${unlockedSuper.indexOf(s.n)>=0?'got':''}">${unlockedSuper.indexOf(s.n)>=0?'✓ ':'　'}${s.n}</div>`).join('')}</div>
    <button class="btn" id="btnClose">關閉</button>`;
  $('modal').classList.add('on');
  $('btnClose').onclick=()=>$('modal').classList.remove('on');
}

/* ============================================================
   開始畫面
   ============================================================ */
let selectedInv=null;

function renderInvGrid(){
  const g=$('invGrid');g.innerHTML='';
  Object.keys(INV).forEach(k=>{
    const inv=INV[k];
    const card=document.createElement('div');
    card.className='inv-card'+(selectedInv===k?' sel':'');
    card.innerHTML=`
      <div class="nm">${inv.name}</div><div class="rl">${inv.role}</div>
      <div class="stat-row"><span>意志力</span><span>${inv.wp}</span></div>
      <div class="stat-row"><span>智力</span><span>${inv.int}</span></div>
      <div class="stat-row"><span>戰鬥</span><span>${inv.com}</span></div>
      <div class="stat-row"><span>生命值</span><span>${inv.hp}</span></div>
      <div class="stat-row"><span>理智值</span><span>${inv.san}</span></div>
      <div class="stat-row"><span>初始物品</span><span>[${inv.item}]</span></div>
      <div class="ab">能力：{${inv.ability}}　${inv.abilityDesc}</div>
      <div class="wk">弱點：{${inv.weakness}}　${inv.weaknessDesc}</div>`;
    card.onclick=()=>{selectedInv=k;Sound.click();renderInvGrid();
      $('btnBegin').disabled=false;$('btnBegin').textContent='以「'+inv.name+'」開始遊戲';};
    g.appendChild(card);
  });
}

function startGame(k){
  S=newState(k);
  S.jacClueBonus=false;
  showScreen('game');
  $('choicesInner').innerHTML='';$('text').textContent='';$('fxline').innerHTML='';
  renderScene('mist');
  $('chapNo').textContent='序章';$('chapBadge').textContent='序章';
  typeText($('text'),INV[k].prologue,()=>{
    $('choicesInner').innerHTML='';
    const b=document.createElement('button');b.className='chbtn';b.textContent='翻到第 1 章 ▶';
    b.onclick=()=>{Sound.page();gotoChapter(1);};
    $('choicesInner').appendChild(b);
  });
  autoSave();
}

/* ============================================================
   事件綁定
   ============================================================ */
$('btnBegin').onclick=()=>{if(!selectedInv)return;Sound.click();openHelp(true);};
$('navHelp').onclick=()=>{Sound.click();openHelp(false);};
$('navSave').onclick=()=>{Sound.click();if(S)save();};
$('navLoad').onclick=()=>{Sound.click();
  if(S){
    $('mbox').innerHTML=`<h2>📂 讀取存檔</h2><p>讀取存檔會覆蓋目前的進度，確定要繼續嗎？</p>
      <button class="btn" id="btnYes">確定讀取</button><button class="btn ghost" id="btnNo">取消</button>`;
    $('modal').classList.add('on');
    $('btnYes').onclick=()=>{$('modal').classList.remove('on');load();};
    $('btnNo').onclick=()=>$('modal').classList.remove('on');
  }else load();
};
$('navHist').onclick=()=>{Sound.click();openHist();};
$('navAch').onclick=()=>{Sound.click();openAch();};
$('navSound').onclick=()=>{Sound.on=!Sound.on;
  $('navSound').innerHTML=`<i>${Sound.on?'🔊':'🔇'}</i>音效`;
  toast(Sound.on?'音效已開啟':'音效已關閉');};

$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')){
    if($('btnRoll')||$('btnHelpClose')||$('btnNextRound'))return;
    $('modal').classList.remove('on');
  }
});

/* 初始化 */
renderInvGrid();
if(hasSave()){}
</script>
