<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>時間守望：瘋人院 (絕對防彈版)</title>
<style>
    :root {
        --bg-dark: #1e252b; --bg-panel: #2a343d; --text-main: #e0e5e9;
        --text-muted: #8b9bb4; --accent: #4a90e2; --danger: #e25b5b;
        --success: #50b87d; --card-bg: #ebdcb9; --card-border: #8c7853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at center, #2a343d 0%, #111 100%); }
    
    .time-track-container { height: 50px; background: #151a1e; border-bottom: 2px solid #000; display: flex; align-items: center; padding: 0 10px; overflow-x: auto; }
    .time-track { display: flex; gap: 2px; margin: auto; }
    .time-slot { width: 26px; height: 26px; background: #2c3842; color: #5a6b7c; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transition: all 0.3s; }
    .time-slot.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); transform: scale(1.1); }
    .time-slot.milestone { background: #4a5a6a; color: #fff; }

    main { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 230px; background: var(--bg-panel); border-right: 2px solid #151a1e; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
    .stat-box { background: #1e252b; padding: 8px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #3a4a5a; }
    .stat-title { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--accent); }
    .stat-value.hp { color: var(--danger); }
    .inventory { flex: 1; }
    .item-tag { background: #3a4a5a; padding: 4px 8px; border-radius: 12px; font-size: 11px; margin: 4px 4px 0 0; display: inline-flex; align-items: center; border: 1px solid #5a6b7c; gap: 4px;}
    .item-tag svg { display: block; }

    .board-area { flex: 1; display: flex; flex-direction: column; padding: 15px; background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="%233a4a5a" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>'); overflow-y: auto; }
    .story-log { height: 120px; background: rgba(0,0,0,0.7); border: 1px solid #3a4a5a; border-radius: 5px; padding: 10px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; overflow-y: auto; font-family: 'Georgia', serif; color: #e8dcc4; white-space: pre-wrap; }

    .location-cards { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 10px; justify-content: center; min-height: 250px; }
    .card { width: 140px; height: 200px; background: var(--card-bg); border-radius: 6px; border: 2px solid var(--card-border); box-shadow: 3px 3px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; cursor: pointer; position: relative; transition: transform 0.2s; overflow: hidden; color: #2c1e16; }
    .card:hover { transform: translateY(-3px) scale(1.02); }
    .card.disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; transform: none; }
    .card.flipped { background: #5a6b7c; border-color: #3a4a5a; color: #fff; }
    .card-header { background: var(--card-header-bg); padding: 8px; text-align: center; border-bottom: 2px solid var(--card-border); font-weight: bold; font-size: 13px; color: #1a110b; }
    .card.flipped .card-header { background: #3a4a5a; color: #fff; border-bottom-color: #222; }
    .card-body { flex: 1; padding: 10px; font-size: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .card-cost { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 2px solid #fff; font-size: 14px; z-index: 10;}

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-content { background: #1e252b; padding: 25px; border-radius: 8px; max-width: 600px; width: 90%; border: 1px solid var(--accent); max-height: 85vh; overflow-y: auto;}
    .modal-title { font-size: 22px; color: var(--accent); margin-bottom: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px;}
    .modal-text { font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #ccc; white-space: pre-wrap;}
    
    .btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 4px; font-size: 15px; cursor: pointer; margin-top: 10px; width: 100%; text-align: center; display: block; }
    .btn:hover { background: #357abd; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-list { background: #3a4a5a; text-align: left; padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
    .btn-list:hover { background: #4a5a6a; }

    .bottom-bar { background: #151a1e; padding: 8px; display: flex; justify-content: center; gap: 10px; border-top: 2px solid #000; flex-wrap: wrap;}
    .btn-small { background: #3a4a5a; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    
    .dice-pool { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
    .die { width: 45px; height: 45px; background: #fff; color: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    .die.success { background: var(--success); color: #fff; border: 2px solid #fff; }
    .vessel-stats { display: flex; gap: 15px; font-size: 13px; color: #4a90e2; font-weight: bold; margin-top: 5px; flex-wrap: wrap;}
    .vessel-ability { font-size: 12px; color: #e8dcc4; margin-top: 5px; line-height: 1.4; font-family: 'Georgia', serif;}

    @media (max-width: 768px) {
        main { flex-direction: column; }
        .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 5px; }
        .stat-box { margin-bottom: 0; margin-right: 5px; min-width: 90px; padding: 5px;}
        .inventory { display: none; }
        .board-area { padding: 10px; }
        .card { width: 110px; height: 160px; }
    }
</style>
</head>
<body>

    <div class="time-track-container">
        <div class="time-track" id="time-track"></div>
    </div>

    <main>
        <div class="sidebar">
            <div class="stat-box" style="border-color: var(--accent);">
                <div class="stat-title">當前載具</div>
                <div class="stat-value" id="ui-vessel" style="font-size: 16px; color: var(--success);">尚未附身</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">劇本</div>
                <div class="stat-value" id="ui-title" style="font-size: 14px;">未載入</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">剩餘時間 (TU)</div>
                <div class="stat-value" id="ui-tu">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">生命 (HP)</div>
                <div class="stat-value hp" id="ui-hp">--</div>
            </div>
            <div class="inventory" id="ui-inventory">
                <div class="stat-title">持有物品</div>
            </div>
        </div>

        <div class="board-area">
            <div class="story-log" id="story-log">系統待命中。請點擊下方「載入劇本」開始。</div>
            <div class="location-cards" id="play-area"></div>
        </div>
    </main>

    <div class="bottom-bar">
        <button class="btn-small" id="nav-load">📂 載入劇本</button>
        <button class="btn-small" id="nav-move">🗺️ 前往他處</button>
        <button class="btn-small" id="nav-rules">📜 規則</button>
        <button class="btn-small" id="nav-save">💾 存檔</button>
        <button class="btn-small" id="nav-read">📥 讀檔</button>
        <input type="file" id="json-upload" accept=".json" style="display: none;">
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

<script>
    // ================= 引擎核心 =================
    const game = {
        script: null,
        state: { tu: null, hp: null, currentLocId: null, inventory: [], revealedCards: [], phase: 'IDLE', vessel: null, unlockedLocations: [] },

        loadScript(data) {
            if (!data || !data.locations) {
                return ui.showNoticeModal('劇本錯誤', '劇本格式不正確，缺少 locations 資料。');
            }
            this.script = data;
            let startLoc = data.startLocation;
            if (!startLoc || !data.locations[startLoc]) startLoc = Object.keys(data.locations)[0];

            // 起始解鎖地點：優先用劇本自訂的 startUnlocked，
            // 否則沿用瘋人院的預設地點（只保留實際存在於劇本中的）
            let unlocked = data.startUnlocked;
            if (!Array.isArray(unlocked)) {
                const defaults = ['day_room', 'infirmary', 'dormitory', 'promenade', 'kitchen'];
                unlocked = defaults.filter(id => data.locations[id]);
                if (unlocked.length === 0) unlocked = [startLoc];
            }

            this.state = { 
                tu: null, hp: null, currentLocId: startLoc, inventory: [], revealedCards: [], phase: 'PLAYING', vessel: null,
                unlockedLocations: unlocked.slice()
            };
            
            document.getElementById('ui-title').innerText = data.title || '未命名劇本';
            document.getElementById('ui-vessel').innerText = `尚未附身`;
            document.getElementById('story-log').innerText = "請閱讀序幕卡片，完成準備後點擊「G卡：傳送」進行意識投射。";
            
            this.updateUI();
            this.renderLocation();
            ui.closeModal();
        },

        selectVessel(vessel) {
            this.state.vessel = vessel;
            document.getElementById('ui-vessel').innerHTML = `
                ${vessel.icon || '👤'} ${vessel.name} <span style="font-size:12px; color:#aaa;">(${vessel.gender === 'female' ? '女' : '男'})</span><br>
                <span style="font-size:12px; color:#aaa; font-weight:normal;">
                🏃${vessel.stats.agility} 💬${vessel.stats.charisma} 💪${vessel.stats.combat}
                </span>
            `;
            this.state.tu = this.script.initialTU;
            this.state.hp = vessel.hp || this.script.initialHP;
            this.state.currentLocId = "day_room";
            this.state.revealedCards = [];

            this.updateUI();
            document.getElementById('story-log').innerText = `【你現在是：${this.state.vessel.name}】\n\n你們發現自己正在瘋人院的日照房裡，現在是午後...`;
            this.renderLocation();
            ui.closeModal();
        },

        updateUI() {
            document.getElementById('ui-tu').innerText = (this.state.tu !== null && this.state.tu !== undefined) ? this.state.tu : '--';
            document.getElementById('ui-hp').innerText = (this.state.hp !== null && this.state.hp !== undefined) ? this.state.hp : '--';
            
            document.querySelectorAll('.time-slot').forEach((slot, index) => {
                if (index === this.state.tu) slot.classList.add('active');
                else slot.classList.remove('active');
            });

            const inv = document.getElementById('ui-inventory');
            inv.innerHTML = '<div class="stat-title">持有物品</div>';
            
            if (!this.state.inventory) this.state.inventory = [];
            
            this.state.inventory.forEach(itemId => {
                if (this.script.items[itemId]) {
                    inv.innerHTML += `<span class="item-tag">${this.script.items[itemId].icon} ${this.script.items[itemId].name}</span>`;
                }
            });
        },

        renderLocation(locId) {
            if (locId) this.state.currentLocId = locId;
            const area = document.getElementById('play-area');
            area.innerHTML = '';
            if (this.state.phase !== 'PLAYING') return;

            const loc = this.script.locations[this.state.currentLocId];
            if (!loc) return;

            if (!this.state.revealedCards) this.state.revealedCards = [];
            if (!this.state.inventory) this.state.inventory = [];

            const aCard = loc.cards.find(c => c.label.includes('A卡') || c.id.endsWith('_A'));
            const isARevealed = !aCard || this.state.revealedCards.includes(aCard.id);

            loc.cards.forEach((card) => {
                const isRevealed = this.state.revealedCards.includes(card.id);
                const cardEl = document.createElement('div');
                
                let isDisabled = false;
                let lockReason = "";

                if (!isRevealed) {
                    if (this.state.tu !== null && this.state.tu > 0 && this.state.tu < card.cost) { isDisabled = true; lockReason = "時間不足"; }
                    if (card.requires && !this.state.inventory.includes(card.requires)) { isDisabled = true; lockReason = "缺道具"; }
                    if (aCard && card.id !== aCard.id && !isARevealed) { isDisabled = true; lockReason = "需先讀A卡"; }
                    
                    if (card.requiredGender && this.state.vessel && this.state.vessel.gender !== card.requiredGender) {
                        isDisabled = true; lockReason = "性別不符";
                    }
                }

                cardEl.className = `card ${isRevealed ? 'flipped' : ''} ${isDisabled ? 'disabled' : ''}`;
                
                let icon = '🔍';
                if (isDisabled) icon = '🔒';

                cardEl.innerHTML = `
                    ${!isRevealed ? `<div class="card-cost">${card.cost > 0 ? card.cost : '?'}</div>` : ''}
                    <div class="card-header">${isRevealed ? '已探索' : card.label}</div>
                    <div class="card-body">
                        ${isRevealed ? `<div style="font-size:20px;">👁️</div>` : `
                            <div style="font-size:24px; margin-bottom:5px;">${icon}</div>
                            ${isDisabled ? `<div style="color:#8b2b24; font-size:11px; font-weight:bold;">${lockReason}</div>` : ''}
                        `}
                    </div>
                `;

                if (!isDisabled) cardEl.onclick = () => this.handleCardClick(card);
                area.appendChild(cardEl);
            });
        },

        handleCardClick(card) {
            try {
                if (card.requiredGender && this.state.vessel.gender !== card.requiredGender) {
                    return ui.showNoticeModal('無法互動', '這張卡牌似乎只對特定性別的角色有反應。');
                }
                if (this.state.revealedCards.includes(card.id)) return ui.showReadModal(card);
                if (this.state.tu !== null && this.state.tu > 0 && this.state.tu < card.cost) return;
                
                // 核心修復：先彈出視窗，防止後續邏輯崩潰導致視窗不顯示
                ui.showReadModal(card);

                if (this.state.tu !== null && this.state.tu > 0) this.state.tu -= card.cost;
                if (!this.state.revealedCards.includes(card.id)) this.state.revealedCards.push(card.id);
                
                if (card.giveItem) {
                    let items = Array.isArray(card.giveItem) ? card.giveItem : [card.giveItem];
                    items.forEach(item => {
                        if (!this.state.inventory.includes(item)) {
                            this.state.inventory.push(item);
                            if (this.script.items[item]) {
                                document.getElementById('story-log').innerText += `\n\n【你獲得了物品：${this.script.items[item].name}】`;
                            }
                        }
                    });
                }

                if (card.unlockLoc) {
                    card.unlockLoc.forEach(loc => {
                        if (!this.state.unlockedLocations.includes(loc)) {
                            this.state.unlockedLocations.push(loc);
                            if (this.script.locations[loc]) {
                                document.getElementById('story-log').innerText += `\n\n【線索更新：你發現了新的地點「${this.script.locations[loc].name}」！】`;
                            } else {
                                document.getElementById('story-log').innerText += `\n\n【線索更新：你發現了新的地點 (${loc})！】`;
                            }
                        }
                    });
                }

                this.updateUI();
                this.renderLocation();
                this.checkGameOver(); 
            } catch (e) {
                console.error("卡片點擊發生錯誤:", e);
            }
        },

        executeCheck(check) {
            let diceCount = 1;
            if (this.state.vessel && this.state.vessel.stats) {
                if (check.attr === 'agility') diceCount = this.state.vessel.stats.agility;
                else if (check.attr === 'charisma') diceCount = this.state.vessel.stats.charisma;
                else if (check.attr === 'combat') diceCount = this.state.vessel.stats.combat;
                else if (check.attr === 'tech') diceCount = this.state.vessel.stats.agility;
            }
            if (diceCount < 1) diceCount = 1;
            let extraTime = 0;
            const content = document.getElementById('modal-content');
            
            const renderRollUI = () => {
                let html = `
                    <div class="modal-title">考驗：${check.attr || '一般'}</div>
                    <div class="modal-text">目標難度：${check.diff} (需消除 ${check.diff} 個盾牌)。</div>
                    <div class="dice-pool" id="dice-pool"></div>
                    <div class="modal-text">當前骰子：${diceCount} 顆</div>
                    <div class="modal-text" style="color:var(--danger)">投入變數：花費 ${extraTime} TU 增加骰子</div>
                    <button class="btn btn-success" id="btn-add-die">投入變數 (+1骰)</button>
                    <button class="btn btn-danger" id="btn-roll">擲骰！</button>
                `;
                content.innerHTML = html;
                
                const pool = document.getElementById('dice-pool');
                for(let i=0; i<diceCount; i++) pool.innerHTML += `<div class="die">?</div>`;

                document.getElementById('btn-add-die').onclick = () => {
                    if (this.state.tu <= extraTime) return alert('時間不足，無法投入更多變數！');
                    extraTime++; diceCount++;
                    renderRollUI();
                };

                document.getElementById('btn-roll').onclick = () => {
                    this.state.tu -= extraTime;
                    this.updateUI();
                    
                    let hits = 0;
                    document.querySelectorAll('.die').forEach(die => {
                        const val = Math.floor(Math.random() * 6) + 1;
                        die.innerText = val;
                        if (val >= 4) { die.classList.add('success'); hits++; }
                    });

                    setTimeout(() => {
                        let msg = `擲骰成功數：${hits}\n\n`;
                        if (hits >= check.diff) {
                            if (check.giveItemOnSuccess) {
                                let items = Array.isArray(check.giveItemOnSuccess) ? check.giveItemOnSuccess : [check.giveItemOnSuccess];
                                items.forEach(item => {
                                    if (!this.state.inventory.includes(item)) {
                                        this.state.inventory.push(item);
                                        if (this.script.items[item]) {
                                            msg += `【你獲得了物品：${this.script.items[item].name}】\n`;
                                        }
                                    }
                                });
                            }
                            if (check.unlockLoc) {
                                check.unlockLoc.forEach(loc => {
                                    if (!this.state.unlockedLocations.includes(loc)) {
                                        this.state.unlockedLocations.push(loc);
                                        if (this.script.locations[loc]) {
                                            msg += `【發現新地點：${this.script.locations[loc].name}】\n`;
                                        }
                                    }
                                });
                            }
                            msg += `【成功】\n${check.successText || '你成功了！'}`;
                            ui.showNoticeModal('考驗成功', msg);
                        } else {
                            msg += `【失敗】\n${check.failText || '你失敗了！'}`;
                            if (check.failDamage) { this.state.hp -= check.failDamage; msg += `\n(失去 ${check.failDamage} HP)`; }
                            if (check.failTime) { this.state.tu -= check.failTime; msg += `\n(失去 ${check.failTime} TU)`; }
                            ui.showNoticeModal('考驗失敗', msg);
                        }
                        this.updateUI();
                        this.checkGameOver();
                    }, 1000);
                };
            };
            renderRollUI();
        },

        executeAction(action) {
            if (action.isTeleport) return ui.showVesselModal(this.script.vessels);
            
            if (action.giveItem) {
                let items = Array.isArray(action.giveItem) ? action.giveItem : [action.giveItem];
                items.forEach(item => {
                    if (!this.state.inventory.includes(item)) {
                        this.state.inventory.push(item);
                        if (this.script.items[item]) {
                            document.getElementById('story-log').innerText += `\n\n【你獲得了物品：${this.script.items[item].name}】`;
                        }
                    }
                });
            }
            
            if (action.unlockLoc) {
                if (!this.state.unlockedLocations.includes(action.unlockLoc)) {
                    this.state.unlockedLocations.push(action.unlockLoc);
                    if (this.script.locations[action.unlockLoc]) {
                        document.getElementById('story-log').innerText += `\n\n【線索更新：發現了新地點「${this.script.locations[action.unlockLoc].name}」！】`;
                    }
                }
            }
            if (action.nextLoc) {
                if (!this.state.unlockedLocations.includes(action.nextLoc)) this.state.unlockedLocations.push(action.nextLoc);
                this.state.currentLocId = action.nextLoc;
                this.state.revealedCards = [];
                document.getElementById('story-log').innerText = `移動到：${this.script.locations[action.nextLoc] ? this.script.locations[action.nextLoc].name : action.nextLoc}`;
            }
            if (action.isWin) {
                this.state.phase = 'WIN';
                return ui.showEndModal('任務成功', '時間線已恢復！');
            }
            this.updateUI();
            this.renderLocation();
            this.checkGameOver();
            ui.closeModal();
        },

        moveLocation(targetLocId) {
            if (!this.script.locations[targetLocId]) return ui.showNoticeModal('錯誤', '該地點不存在。');
            if (this.state.tu < 1) return ui.showNoticeModal('時間不足', '沒有足夠的時間移動。');
            const timeCost = Math.floor(Math.random() * 6) + 1;
            this.state.tu -= timeCost;
            this.state.currentLocId = targetLocId;
            this.state.revealedCards = [];
            this.updateUI();
            document.getElementById('story-log').innerText = `你們移動到了：${this.script.locations[targetLocId].name}\n(領隊擲時間骰，花費 ${timeCost} TU)`;
            this.renderLocation();
            if (this.state.tu <= 0 || this.state.hp <= 0) this.checkGameOver();
            else ui.closeModal();
        },

        checkGameOver() {
            if (this.state.phase !== 'PLAYING' || this.state.tu === null || this.state.hp === null) return;
            if (this.state.tu <= 0 || this.state.hp <= 0) {
                this.state.phase = 'GAMEOVER';
                ui.showEndModal('進程失敗', '時間耗盡或生命歸零，意識被強制彈回。');
            }
        },

        saveGame() {
            if (this.state.phase !== 'PLAYING') return ui.showNoticeModal('無法存檔', '遊戲尚未開始或已結束。');
            const saveData = { script: this.script, state: this.state };
            try {
                localStorage.setItem('timeWatch_save', JSON.stringify(saveData));
                ui.showNoticeModal('存檔成功', '當前進度已保存到瀏覽器中。');
            } catch (e) { ui.showNoticeModal('存檔失敗', '瀏覽器儲存空間不足。'); }
        },

        loadGame() {
            const savedData = localStorage.getItem('timeWatch_save');
            if (!savedData) return ui.showNoticeModal('讀檔失敗', '找不到任何存檔紀錄。');
            try {
                const data = JSON.parse(savedData);
                this.script = data.script;
                this.state = data.state;
                
                if (!this.state.inventory) this.state.inventory = [];
                if (!this.state.revealedCards) this.state.revealedCards = [];
                if (!this.state.unlockedLocations) this.state.unlockedLocations = ['day_room', 'infirmary', 'dormitory', 'promenade', 'kitchen'];
                if (this.state.phase === undefined) this.state.phase = 'PLAYING';

                document.getElementById('ui-title').innerText = this.script.title;
                document.getElementById('ui-vessel').innerText = this.state.vessel ? `${this.state.vessel.icon || '👤'} ${this.state.vessel.name}` : '尚未附身';
                
                this.updateUI();
                this.renderLocation();
                document.getElementById('story-log').innerText += `\n\n【系統：已載入先前的存檔進度。】`;
                ui.closeModal();
            } catch (e) { 
                console.error(e);
                ui.showNoticeModal('讀檔失敗', '存檔資料損毀或版本過舊，請重新載入劇本。');

        }

        // ===== 取得伺服器端劇本清單 =====
        async fetchManifest() {
            try {
                const host = window.location.hostname;
                const path = window.location.pathname.split('/')[1];

                const owner = host.split('.')[0];
                const repo = path;
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API 請求失敗');

                const files = await response.json();
                const scripts = files
                    .filter(file => file.name.startsWith('時間守望_') && file.name.endsWith('.json'))
                    .map(file => file.name);

                return scripts.length > 0 ? scripts : ["時間守望_瘋人院.json"];

            } catch (err) {
                console.warn('無法取得 GitHub 檔案清單:', err);
                ;
            }
        },

        // ===== 載入劇本選單（內建 + 伺服器 + 上傳） =====
        async showLoadModal() {
            const content = document.getElementById('modal-content');

            document.getElementById('modal-overlay').classList.add('show');

            const manifest = await this.fetchManifest();

            let html = `<div class="modal-title">📂 選擇劇本</div>`;

            // 1. 內建劇本
            html += `<button class="btn btn-list" id="btn-builtin">
                        <span>瘋人院 (1921)</span>
                        <span style="font-size:12px; color:var(--success);">(內建)</span>
                     </button>`;

            // 2. 伺服器端劇本
            if (manifest && manifest.length > 0) {
                manifest.forEach(fileName => {
                    let displayName = fileName.replace('.json', '').replace(/^時間守望_?/, '');
                    if (!displayName) displayName = fileName;
                    html += `<button class="btn btn-list script-btn" data-file="${fileName}">
                                <span>${displayName}</span>
                                <span style="font-size:12px; color:#8b9bb4;">(伺服器端)</span>
                             </button>`;
                });
            } else {
                html += `<div class="modal-text">目前沒有伺服器端劇本。</div>`;
            }

            // 3. 上傳 / 取消
            html += `<button class="btn btn-list" id="btn-upload-json" style="background:#555; margin-top:20px;">上傳本機 JSON 檔</button>`;
            html += `<button class="btn" id="btn-cancel" style="background:transparent; border:1px solid #555;">取消</button>`;

            content.innerHTML = html;

            // 內建
            document.getElementById('btn-builtin').onclick = () => game.loadScript(asylumScript);

            // 伺服器端
            content.querySelectorAll('.script-btn').forEach(btn => {
                btn.onclick = async () => {
                    const file = btn.getAttribute('data-file');
                    const orig = btn.innerHTML;
                    btn.innerHTML = `<span>載入中…</span>`;
                    try {
                        const res = await fetch('./' + encodeURIComponent(file) + '?t=' + new Date().getTime());
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        game.loadScript(data);
                    } catch (err) {
                        btn.innerHTML = orig;
                        ui.showNoticeModal('載入失敗', `無法讀取檔案 ${file}：\n${err.message}`);
                    }
                };
            });

            document.getElementById('btn-upload-json').onclick = () => document.getElementById('json-upload').click();
            document.getElementById('btn-cancel').onclick = () => this.closeModal();
        },

        showMoveModal() {

                            <p>🔹 <b>左側儀表板</b>：顯示你的 <b>生命 (HP)</b> 和收集到的 <b>持有物品</b>。</p>
                            <p>🔹 <b>中間的行動卡牌</b>：這是你們目前能做的事。卡牌右上角的紅圈代表「需要花費多少 TU」。</p>
                        </div>

                        <div class="rule-section">
                            <h3>🕹️ 3. 操作步驟</h3>
                            <p>👉 <b>第一步：讀故事</b>。看畫面上方黑色框框裡的文字，了解你現在在哪裡。</p>
                            <p>👉 <b>第二步：點卡片</b>。點擊中間的卡牌來探索。彈出視窗後，如果有按鈕記得點擊（例如「拿走物品」）。</p>
                            <p>👉 <b>第三步：注意限制</b>。如果卡片上寫著 <span class="highlight-red">「需: XXX」</span> 或呈現灰色，代表你缺道具或時間不夠。</p>
                            <p>👉 <b>第四步：A卡優先</b>。每到新區域，必須先讀完該區域的 <b>「A卡」</b>，其他卡片才會解鎖！</p>
                            <p>👉 <b>第五步：卡關怎麼辦？</b> 如果這個地點的卡片都翻完了，你可以點擊底部的 <b>「🗺️ 前往他處」</b> 來切換場景！</p>
                        </div>

                        <div class="rule-section">
                            <h3>🎲 4. 特殊機制 (很重要！)</h3>
                            <p><b>考驗與擲骰</b>：當你點擊有 🎲 圖示的卡片，會進入擲骰考驗。擲出 <b>4、5、6</b> 算成功。你可以花費 TU 來「投入變數」增加骰子。</p>
                            <p><b>時間循環 (Time Loop)</b>：失敗了千萬別灰心！時間歸零後，你可以選擇<span class="highlight">「保留特定道具重新開始」</span>。</p>
                        </div>                     
                    </div>
                `;
            const startBtn = document.createElement('button'); startBtn.className = 'btn'; startBtn.style.background = 'var(--success)'; startBtn.style.marginTop = '20px'; startBtn.innerText = '開始遊戲！';
            startBtn.onclick = () => { this.closeModal(); this.showLoadModal(); };
            content.appendChild(startBtn);
            document.getElementById('modal-overlay').classList.add('show');
        }
    };

    window.onload = () => {
        const track = document.getElementById('time-track');
        for(let i=0; i<=60; i++) {
            let slot = document.createElement('div'); slot.className = `time-slot ${i%5===0 ? 'milestone' : ''}`; slot.innerText = i; track.appendChild(slot);
        }
        document.getElementById('nav-load').onclick = () => { ui.closeModal(); ui.showLoadModal(); };
        document.getElementById('nav-move').onclick = () => { ui.closeModal(); ui.showMoveModal(); };
        document.getElementById('nav-rules').onclick = () => { ui.closeModal(); ui.showRulesModal(); };
        document.getElementById('nav-save').onclick = () => game.saveGame();
        document.getElementById('nav-read').onclick = () => game.loadGame();
        document.getElementById('modal-overlay').onclick = (e) => { if (e.target.id === 'modal-overlay') ui.closeModal(); };
        document.getElementById('json-upload').onchange = (e) => {
            const file = e.target.files[0]; if(!file) return;

            reader.onload = (ev) => { try { game.loadScript(JSON.parse(ev.target.result)); } catch (err) { ui.showNoticeModal('錯誤', 'JSON 格式錯誤！'); } };
            reader.readAsText(file); e.target.value = '';
        };
        ui.showRulesModal();
    };
</script>
