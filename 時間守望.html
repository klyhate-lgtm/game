<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>時間守望：網頁版引擎 (新手教學完整版)</title>
<style>
    :root {
        --bg-dark: #1e252b; --bg-panel: #2a343d; --text-main: #e0e5e9;
        --text-muted: #8b9bb4; --accent: #4a90e2; --danger: #e25b5b;
        --success: #50b87d; --card-bg: #ebdcb9; --card-border: #8c7853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at center, #2a343d 0%, #111 100%); }
    
    .time-track-container { height: 50px; background: #151a1e; border-bottom: 2px solid #000; display: flex; align-items: center; padding: 0 10px; overflow-x: auto; }
    .time-track { display: flex; gap: 2px; margin: auto; }
    .time-slot { width: 26px; height: 26px; background: #2c3842; color: #5a6b7c; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transition: all 0.3s; }
    .time-slot.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); transform: scale(1.1); }
    .time-slot.milestone { background: #4a5a6a; color: #fff; }

    main { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 220px; background: var(--bg-panel); border-right: 2px solid #151a1e; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
    .stat-box { background: #1e252b; padding: 8px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #3a4a5a; }
    .stat-title { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--accent); }
    .stat-value.hp { color: var(--danger); }
    .inventory { flex: 1; }
    .item-tag { background: #3a4a5a; padding: 4px 8px; border-radius: 12px; font-size: 11px; margin: 4px 4px 0 0; display: inline-block; border: 1px solid #5a6b7c;}

    .board-area { flex: 1; display: flex; flex-direction: column; padding: 15px; background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="%233a4a5a" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>'); overflow-y: auto; }
    .story-log { height: 120px; background: rgba(0,0,0,0.7); border: 1px solid #3a4a5a; border-radius: 5px; padding: 10px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; overflow-y: auto; font-family: 'Georgia', serif; color: #e8dcc4; white-space: pre-wrap; }

    .location-cards { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 10px; justify-content: center; }
    .card { width: 140px; height: 200px; background: var(--card-bg); border-radius: 6px; border: 2px solid var(--card-border); box-shadow: 3px 3px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; cursor: pointer; position: relative; transition: transform 0.2s; overflow: hidden; color: #2c1e16; }
    .card:hover { transform: translateY(-3px) scale(1.02); }
    .card.disabled { filter: grayscale(1); opacity: 0.5; cursor: not-allowed; transform: none; }
    .card.flipped { background: #5a6b7c; border-color: #3a4a5a; color: #fff; }
    .card-header { background: var(--card-header-bg); padding: 8px; text-align: center; border-bottom: 2px solid var(--card-border); font-weight: bold; font-size: 13px; color: #1a110b; }
    .card.flipped .card-header { background: #3a4a5a; color: #fff; border-bottom-color: #222; }
    .card-body { flex: 1; padding: 10px; font-size: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .card-cost { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 2px solid #fff; font-size: 14px; z-index: 10;}

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-content { background: #1e252b; padding: 25px; border-radius: 8px; max-width: 600px; width: 90%; border: 1px solid var(--accent); max-height: 85vh; overflow-y: auto;}
    .modal-title { font-size: 22px; color: var(--accent); margin-bottom: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px;}
    .modal-text { font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #ccc; white-space: pre-wrap;}
    
    /* 新手說明專用樣式 */
    .rule-section { margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent);}
    .rule-section h3 { color: #fff; margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; gap: 8px;}
    .rule-section p { margin-bottom: 8px; font-size: 14px; }
    .highlight { color: var(--accent); font-weight: bold; }
    .highlight-red { color: var(--danger); font-weight: bold; }

    .btn { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 4px; font-size: 15px; cursor: pointer; margin-top: 10px; width: 100%; text-align: center; display: block; }
    .btn:hover { background: #357abd; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-list { background: #3a4a5a; text-align: left; padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
    .btn-list:hover { background: #4a5a6a; }

    .bottom-bar { background: #151a1e; padding: 8px; display: flex; justify-content: center; gap: 10px; border-top: 2px solid #000; flex-wrap: wrap;}
    .btn-small { background: #3a4a5a; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    
    .dice-pool { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
    .die { width: 45px; height: 45px; background: #fff; color: #000; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    .die.success { background: var(--success); color: #fff; border: 2px solid #fff; }

    .loading-text { text-align: center; color: var(--text-muted); padding: 20px; }
    .error-text { color: var(--danger); text-align: center; font-size: 13px; margin-top: 10px; }
    
    @media (max-width: 768px) {
        main { flex-direction: column; }
        .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 5px; }
        .stat-box { margin-bottom: 0; margin-right: 5px; min-width: 80px; padding: 5px;}
        .inventory { display: none; }
        .board-area { padding: 10px; }
        .card { width: 110px; height: 160px; }
    }
</style>
</head>
<body>

    <div class="time-track-container">
        <div class="time-track" id="time-track"></div>
    </div>

    <main>
        <div class="sidebar">
            <div class="stat-box">
                <div class="stat-title">劇本</div>
                <div class="stat-value" id="ui-title" style="font-size: 14px;">未載入</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">剩餘時間 (TU)</div>
                <div class="stat-value" id="ui-tu">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">生命 (HP)</div>
                <div class="stat-value hp" id="ui-hp">--</div>
            </div>
            <div class="inventory" id="ui-inventory">
                <div class="stat-title">持有物品</div>
            </div>
        </div>

        <div class="board-area">
            <div class="story-log" id="story-log">系統待命中。請點擊下方「載入劇本」開始。</div>
            <div class="location-cards" id="play-area"></div>
        </div>
    </main>

    <div class="bottom-bar">
        <button class="btn-small" id="nav-load">📂 載入劇本</button>
        <button class="btn-small" id="nav-rules">📜 規則</button>
        <button class="btn-small" id="nav-save">💾 存檔</button>
        <button class="btn-small" id="nav-read">📥 讀檔</button>
        <input type="file" id="json-upload" accept=".json" style="display: none;">
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

<script>
    // ================= 引擎核心 =================
    const game = {
        script: null,
        state: { tu: 0, hp: 0, currentLocId: null, inventory: [], revealedCards: [], phase: 'IDLE' },

        loadScript(data) {
            this.script = data;
            this.startNewProcess(false);
            document.getElementById('ui-title').innerText = data.title;
            ui.closeModal();
        },

        startNewProcess(keepItems = false) {
            let savedItems = keepItems ? this.state.inventory.filter(i => this.script.items[i] && this.script.items[i].keep) : [];
            this.state = {
                tu: this.script.initialTU,
                hp: this.script.initialHP,
                currentLocId: this.script.startLocation,
                inventory: savedItems,
                revealedCards: [],
                phase: 'PLAYING'
            };
            this.updateUI();
            document.getElementById('story-log').innerText = this.script.intro;
            this.renderLocation();
        },

        updateUI() {
            document.getElementById('ui-tu').innerText = this.state.tu;
            document.getElementById('ui-hp').innerText = this.state.hp;
            
            const slots = document.querySelectorAll('.time-slot');
            slots.forEach((slot, index) => {
                if (index === this.state.tu) slot.classList.add('active');
                else slot.classList.remove('active');
            });

            const inv = document.getElementById('ui-inventory');
            inv.innerHTML = '<div class="stat-title">持有物品</div>';
            this.state.inventory.forEach(itemId => {
                if (this.script.items[itemId]) {
                    inv.innerHTML += `<span class="item-tag">${this.script.items[itemId].icon} ${this.script.items[itemId].name}</span>`;
                }
            });
        },

        renderLocation() {
            const area = document.getElementById('play-area');
            area.innerHTML = '';
            if (this.state.phase !== 'PLAYING') return;

            const loc = this.script.locations[this.state.currentLocId];
            
            loc.cards.forEach((card) => {
                const isRevealed = this.state.revealedCards.includes(card.id);
                const cardEl = document.createElement('div');
                
                let isDisabled = false;
                if (!isRevealed) {
                    if (this.state.tu < card.cost) isDisabled = true;
                    if (card.requires && !this.state.inventory.includes(card.requires)) isDisabled = true;
                }

                cardEl.className = `card ${isRevealed ? 'flipped' : ''} ${isDisabled ? 'disabled' : ''}`;
                
                cardEl.innerHTML = `
                    <div class="card-cost">${card.cost > 0 ? card.cost : '?'}</div>
                    <div class="card-header">${isRevealed ? '已探索' : card.label}</div>
                    <div class="card-body">
                        ${isRevealed ? `<div style="font-size:20px;">👁️</div>` : `
                            <div style="font-size:24px; margin-bottom:5px;">🔍</div>
                            ${card.requires ? `<div style="color:#8b2b24; font-size:11px; font-weight:bold;">需: ${this.script.items[card.requires]?.name}</div>` : ''}
                        `}
                    </div>
                `;

                if (!isDisabled) {
                    cardEl.onclick = () => this.handleCardClick(card);
                }
                area.appendChild(cardEl);
            });
        },

        handleCardClick(card) {
            if (this.state.revealedCards.includes(card.id)) {
                ui.showModal('read', card.label, card.text, card.actions, card.giveItem, card.check);
                return;
            }

            if (this.state.tu < card.cost) return ui.showModal('notice', '時間不足', '沒有足夠的 TU 翻開此卡牌。');

            this.state.tu -= card.cost;
            this.state.revealedCards.push(card.id);
            
            if (card.giveItem && !this.state.inventory.includes(card.giveItem)) {
                this.state.inventory.push(card.giveItem);
                document.getElementById('story-log').innerText += `\n\n【獲得物品：${this.script.items[card.giveItem].name}】`;
            }

            this.updateUI();
            this.renderLocation();

            ui.showModal('read', card.label, card.text, card.actions, card.giveItem, card.check);
        },

        executeCheck(check) {
            let diceCount = 1;
            let extraTime = 0;
            const content = document.getElementById('modal-content');
            
            const renderRollUI = () => {
                let html = `
                    <div class="modal-title">考驗：${check.attr || '一般'}</div>
                    <div class="modal-text">需要消除 ${check.diff} 個盾牌 (擲出 4、5、6 算成功)。</div>
                    <div class="modal-text">當前骰子：${diceCount} 顆</div>
                    <div class="modal-text" style="color:var(--danger)">投入變數：花費 ${extraTime} TU 增加骰子</div>
                    <div class="dice-pool" id="dice-pool"></div>
                    <button class="btn btn-success" id="btn-add-die">投入變數 (+1骰)</button>
                    <button class="btn btn-danger" id="btn-roll">擲骰！</button>
                `;
                content.innerHTML = html;
                
                const pool = document.getElementById('dice-pool');
                for(let i=0; i<diceCount; i++) pool.innerHTML += `<div class="die">?</div>`;

                document.getElementById('btn-add-die').onclick = () => {
                    if (this.state.tu <= extraTime) return alert('時間不足，無法投入更多變數！');
                    extraTime++; diceCount++;
                    renderRollUI();
                };

                document.getElementById('btn-roll').onclick = () => {
                    this.state.tu -= extraTime;
                    this.updateUI();
                    
                    let hits = 0;
                    const dice = document.querySelectorAll('.die');
                    dice.forEach(die => {
                        const val = Math.floor(Math.random() * 6) + 1;
                        die.innerText = val;
                        if (val >= 4) { die.classList.add('success'); hits++; }
                    });

                    setTimeout(() => {
                        if (hits >= check.diff) {
                            ui.showModal('notice', '考驗成功', check.successText || '你成功了！');
                            if (check.successAction) this.executeAction(check.successAction);
                        } else {
                            if (check.failDamage) this.state.hp -= check.failDamage;
                            if (check.failTime) this.state.tu -= check.failTime;
                            this.updateUI();
                            ui.showModal('notice', '考驗失敗', (check.failText || '你失敗了！') + `\n(失去 ${check.failDamage||0} HP, ${check.failTime||0} TU)`);
                            this.checkGameOver();
                        }
                    }, 1000);
                };
            };
            renderRollUI();
        },

        executeAction(action) {
            if (action.nextLoc) {
                this.state.currentLocId = action.nextLoc;
                this.state.revealedCards = [];
                document.getElementById('story-log').innerText = `移動到：${this.script.locations[action.nextLoc].name}`;
            }
            if (action.isWin) {
                this.state.phase = 'WIN';
                ui.showModal('end', '任務成功', '時間線已恢復！');
                return;
            }
            this.updateUI();
            this.renderLocation();
            this.checkGameOver();
            ui.closeModal();
        },

        checkGameOver() {
            if (this.state.phase === 'PLAYING' && (this.state.tu <= 0 || this.state.hp <= 0)) {
                this.state.phase = 'GAMEOVER';
                ui.showModal('end', '進程失敗', '時間耗盡或生命歸零，意識被強制彈回。');
            }
        }
    };

    // ================= UI 控制 =================
    const ui = {
        // 自動抓取 GitHub 上的劇本清單
		async fetchManifest() {
            try {
                const host = window.location.hostname; 
                const path = window.location.pathname.split('/')[1];
                
                // 本地端測試防呆
                if (host === 'localhost' || host === '127.0.0.1' || host === '' || !host.endsWith('github.io')) {
                    return ["時間守望_瘋人院.json", "時間守望_深海計畫.json"];
                }

                const owner = host.split('.')[0];
                const repo = path;
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('API 請求失敗');

                const files = await response.json();
                
                // 這裡加上了 startsWith('時間守望_') 的條件
                const scripts = files
                    .filter(file => file.name.startsWith('時間守望_') && file.name.endsWith('.json'))
                    .map(file => file.name);

                return scripts.length > 0 ? scripts : ["時間守望_瘋人院.json"];
                
            } catch (err) {
                console.warn('無法取得 GitHub 檔案清單:', err);
                return ["時間守望_瘋人院.json", "時間守望_深海計畫.json"];
            }
        },

        async showModal(type, title, text, actions, giveItem, check) {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            content.innerHTML = '';

            if (type === 'load') {
                content.innerHTML = `<div class="modal-title">📂 正在讀取伺服器劇本...</div><div class="loading-text">請稍候</div>`;
                modal.classList.add('show');

                const manifest = await this.fetchManifest();
                
                let html = `<div class="modal-title">📂 選擇劇本</div>`;

                if (manifest && manifest.length > 0) {
                    manifest.forEach(fileName => {
                        let displayName = fileName.replace('.json', '').replace(/^時間守望_?/, '');
                        if (!displayName) displayName = fileName;
                        
                        html += `<button class="btn btn-list script-btn" data-file="${fileName}">
                                    <span>${displayName}</span>
                                    <span style="font-size:12px; color:#8b9bb4;">(伺服器端)</span>
                                 </button>`;
                    });
                } else {
                    html += `<div class="error-text">目前沒有伺服器劇本。</div>`;
                }

                html += `<button id="btn-upload-json" class="btn btn-list" style="background:#555; margin-top:20px;">上傳本機 JSON 檔</button>`;
                html += `<button class="btn" style="background:transparent; border:1px solid #555;" onclick="ui.closeModal()">取消</button>`;
                
                content.innerHTML = html;

                const scriptBtns = content.querySelectorAll('.script-btn');
                scriptBtns.forEach(btn => {
                    btn.onclick = async () => {
                        const file = btn.getAttribute('data-file');
                        btn.innerHTML = '<span>載入中...</span>';
                        try {
                            const res = await fetch('./' + file + '?t=' + new Date().getTime());
                            if(!res.ok) throw new Error('讀取失敗');
                            const data = await res.json();
                            game.loadScript(data);
                        } catch (err) {
                            ui.showModal('notice', '載入失敗', `無法讀取檔案 ${file}：\n${err.message}`);
                        }
                    };
                });
                
                document.getElementById('btn-upload-json').onclick = () => document.getElementById('json-upload').click();
                return;
            }

            // --- 華麗的新手說明專用 UI ---
            if (type === 'rules') {
                content.innerHTML = `
                    <div class="modal-title">📜 新手特工生存指南</div>
                    <div class="modal-text" style="text-align:left;">
                        
                        <div class="rule-section">
                            <h3>🎯 1. 遊戲目標</h3>
                            <p>你現在是一名穿越時空的探員。你必須在 <span class="highlight-red">時間耗盡（歸零）</span> 或 <span class="highlight-red">生命歸零</span> 之前，找到任務的關鍵道具並完成目標！</p>
                        </div>

                        <div class="rule-section">
                            <h3>🖥️ 2. 看懂畫面</h3>
                            <p>🔹 <b>最上方時間軌道</b>：發光的數字就是你們剩下的時間（TU）。每次行動都會扣除時間。</p>
                            <p>🔹 <b>左側儀表板</b>：顯示你的 <b>生命 (HP)</b> 和收集到的 <b>持有物品</b>。</p>
                            <p>🔹 <b>中間的行動卡牌</b>：這是你們目前能做的事。卡牌右上角的紅圈代表「需要花費多少 TU」。</p>
                        </div>

                        <div class="rule-section">
                            <h3>🕹️ 3. 操作步驟</h3>
                            <p>👉 <b>第一步：讀故事</b>。看畫面上方黑色框框裡的文字，了解你現在在哪裡。</p>
                            <p>👉 <b>第二步：點卡片</b>。點擊中間的卡牌來探索、移動或戰鬥。</p>
                            <p>👉 <b>第三步：注意限制</b>。如果卡片上寫著 <span class="highlight-red">「需: XXX」</span> 或呈現灰色，代表你缺道具或時間不夠。請先去找鑰匙或線索！</p>
                        </div>

                        <div class="rule-section">
                            <h3>🎲 4. 特殊機制 (很重要！)</h3>
                            <p><b>考驗與擲骰</b>：當你點擊有 🎲 圖示的卡片，會進入擲骰考驗。擲出 <b>4、5、6</b> 算成功。你可以花費 TU 來「投入變數」增加骰子。</p>
                            <p><b>時間循環 (Time Loop)</b>：失敗了千萬別灰心！時間歸零後，你可以選擇<span class="highlight">「保留特定道具重新開始」</span>。下一輪你會帶著經驗和道具，更輕鬆地破關！</p>
                        </div>
                        
                        <button class="btn" style="margin-top:20px; background:var(--success);" onclick="ui.closeModal(); ui.showModal('load');">我準備好了，開始遊戲！</button>
                    </div>
                `;
                modal.classList.add('show');
                return;
            }

            // 其他基本彈窗 (閱讀、提示、結束)
            let html = `<div class="modal-title">${title || '提示'}</div><div class="modal-text">${text || ''}</div>`;

            if (type === 'read') {
                if (check) {
                    html += `<button class="btn btn-danger" onclick="game.executeCheck(${JSON.stringify(check).replace(/"/g, '&quot;')})">進行考驗 (需消除 ${check.diff} 盾)</button>`;
                } else if (actions && actions.length > 0) {
                    actions.forEach((act, idx) => {
                        html += `<button class="btn action-btn" data-idx="${idx}">${act.label}</button>`;
                    });
                }
                html += `<button class="btn" style="background:#444; margin-top:15px;" onclick="ui.closeModal()">關閉</button>`;
            } else if (type === 'notice') {
                html += `<button class="btn" onclick="ui.closeModal()">確定</button>`;
            } else if (type === 'end') {
                html += `<button class="btn" onclick="ui.closeModal(); game.startNewProcess(true)">帶著道具重試</button>
                         <button class="btn btn-danger" onclick="ui.closeModal(); game.startNewProcess(false)">從頭開始</button>`;
            }

            content.innerHTML = html;

            if (type === 'read' && actions && actions.length > 0) {
                const btns = content.querySelectorAll('.action-btn');
                btns.forEach(btn => {
                    btn.onclick = () => {
                        const idx = parseInt(btn.getAttribute('data-idx'));
                        game.executeAction(actions[idx]);
                    };
                });
            }

            modal.classList.add('show');
        },
        closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
    };

    // ================= 初始化 =================
    window.onload = () => {
        // 生成時間軌
        const track = document.getElementById('time-track');
        for(let i=0; i<=60; i++) {
            let slot = document.createElement('div');
            slot.className = `time-slot ${i%5===0 ? 'milestone' : ''}`;
            slot.innerText = i;
            track.appendChild(slot);
        }

        // 綁定按鈕
        document.getElementById('nav-load').onclick = () => ui.showModal('load');
        document.getElementById('nav-rules').onclick = () => ui.showModal('rules'); // 點擊規則呼叫專屬 UI
        
        document.getElementById('json-upload').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    game.loadScript(data);
                } catch (err) { 
                    ui.showModal('notice', '錯誤', 'JSON 格式錯誤，無法讀取！'); 
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        // 初次打開網頁：強制先看新手教學，看完後才顯示載入清單
        ui.showModal('rules');
    };
</script>
</body>
</html>
