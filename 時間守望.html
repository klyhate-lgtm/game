<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>時間守望：核心版圖 (新手教學優化版)</title>
<style>
    :root {
        --bg-dark: #1e252b;
        --bg-panel: #2a343d;
        --text-main: #e0e5e9;
        --text-muted: #8b9bb4;
        --accent: #4a90e2;
        --danger: #e25b5b;
        --success: #50b87d;
        --card-bg: #ebdcb9;
        --card-border: #8c7853;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-image: radial-gradient(circle at center, #2a343d 0%, #111 100%); }
    
    /* 頂部時間軌道 */
    .time-track-container {
        height: 60px; background: #151a1e; border-bottom: 2px solid #000;
        display: flex; align-items: center; padding: 0 10px; position: relative; overflow-x: auto;
        box-shadow: inset 0 -5px 15px rgba(0,0,0,0.5);
    }
    .time-track { display: flex; gap: 2px; margin: auto; position: relative; }
    .time-slot {
        width: 30px; height: 30px; background: #2c3842; color: #5a6b7c;
        display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold;
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        transition: all 0.3s;
    }
    .time-slot.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); transform: scale(1.1); }
    .time-slot.milestone { background: #4a5a6a; color: #fff; }

    /* 主遊戲區 */
    main { flex: 1; display: flex; position: relative; overflow: hidden; }
    
    /* 側邊欄 */
    .sidebar {
        width: 250px; background: var(--bg-panel); border-right: 2px solid #151a1e;
        display: flex; flex-direction: column; padding: 15px; overflow-y: auto;
    }
    .stat-box { background: #1e252b; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #3a4a5a; }
    .stat-title { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .stat-value { font-size: 24px; font-weight: bold; color: var(--accent); }
    .stat-value.hp { color: var(--danger); }
    .inventory { flex: 1; }
    .item-tag { background: #3a4a5a; padding: 5px 10px; border-radius: 15px; font-size: 12px; margin: 5px 5px 0 0; display: inline-block; border: 1px solid #5a6b7c;}

    /* 地圖版圖區域 */
    .board-area {
        flex: 1; display: flex; flex-direction: column; padding: 20px; background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="%233a4a5a" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>'); overflow-x: auto; }
    
    /* 故事文字框 */
    .story-log {
        height: 120px; background: rgba(0,0,0,0.6); border: 1px solid #3a4a5a; border-radius: 5px;
        padding: 15px; margin-bottom: 20px; font-size: 14px; line-height: 1.6; overflow-y: auto;
        font-family: 'Georgia', serif; color: #d4c4a8;
    }

    /* 卡牌區 */
    .location-cards { display: flex; gap: 15px; align-items: flex-start; padding-bottom: 20px; }
    .card {
        flex: 0 0 180px; height: 260px; background: var(--card-bg); border-radius: 8px;
        border: 2px solid var(--card-border); box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
        display: flex; flex-direction: column; cursor: pointer; position: relative;
        transition: transform 0.2s, box-shadow 0.2s; overflow: hidden; color: #2c1e16;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 5px 10px 20px rgba(0,0,0,0.7); }
    .card.disabled { filter: grayscale(1); opacity: 0.6; cursor: not-allowed; transform: none; }
    .card-header { background: rgba(0,0,0,0.1); padding: 10px; text-align: center; border-bottom: 1px solid var(--card-border); font-weight: bold; font-size: 15px; text-transform: uppercase; }
    .card-body { flex: 1; padding: 15px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .card-cost { position: absolute; top: -10px; right: -10px; background: var(--danger); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.5); font-size: 16px; z-index: 10;}
    .card-requirement { color: var(--danger); font-size: 11px; margin-top: 5px; font-weight: bold;}

    /* 彈窗與骰子 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--bg-panel); padding: 30px; border-radius: 10px; max-width: 550px; width: 90%; border: 2px solid var(--accent); box-shadow: 0 0 30px rgba(74, 144, 226, 0.3); text-align: left; max-height: 85vh; overflow-y: auto;}
    .modal-title { font-size: 24px; color: var(--accent); margin-bottom: 15px; font-family: 'Georgia', serif; text-align: center;}
    .modal-text { font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #ccc; }
    
    /* 新手說明專用樣式 */
    .rule-section { margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent);}
    .rule-section h3 { color: #fff; margin-bottom: 10px; font-size: 18px; display: flex; align-items: center; gap: 8px;}
    .rule-section p { margin-bottom: 8px; font-size: 14px; }
    .highlight { color: var(--accent); font-weight: bold; }
    .highlight-red { color: var(--danger); font-weight: bold; }
    
    .btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background 0.2s; margin: 5px; text-align: center; display: block; width: 100%;}
    .btn:hover { background: #357abd; }
    .btn-danger { background: var(--danger); }
    .btn-gen { background: linear-gradient(45deg, #9b59b6, #8e44ad); }
    
    .dice-area { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
    .die { width: 50px; height: 50px; background: #fff; color: #000; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    .die.rolling { animation: shake 0.4s infinite; }
    @keyframes shake { 0% { transform: rotate(0deg); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }

    .bottom-bar { background: #151a1e; padding: 10px; display: flex; justify-content: center; gap: 10px; border-top: 2px solid #000; flex-wrap: wrap;}
    .btn-small { background: #3a4a5a; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-small:hover { background: #4a5a6a; }

    @media (max-width: 768px) {
        main { flex-direction: column; }
        .sidebar { width: 100%; height: auto; flex-direction: row; border-right: none; border-bottom: 2px solid #151a1e; padding: 10px; overflow-x: auto; }
        .stat-box { margin-bottom: 0; margin-right: 10px; min-width: 100px; }
        .inventory { display: none; }
        .board-area { padding: 10px; }
        .card { flex: 0 0 150px; height: 220px; }
    }
</style>
</head>
<body>

    <div class="time-track-container">
        <div class="time-track" id="time-track"></div>
    </div>

    <main>
        <div class="sidebar">
            <div class="stat-box">
                <div class="stat-title">當前劇本</div>
                <div class="stat-value" id="ui-title" style="font-size: 16px;">未載入</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">剩餘時間 (TU)</div>
                <div class="stat-value" id="ui-tu">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">載體生命 (HP)</div>
                <div class="stat-value hp" id="ui-hp">--</div>
            </div>
            <div class="inventory" id="ui-inventory">
                <div class="stat-title">持有物品</div>
            </div>
        </div>

        <div class="board-area">
            <div class="story-log" id="story-log">系統待命中。請載入劇本開始。</div>
            <div class="location-cards" id="play-area"></div>
        </div>
    </main>

    <div class="bottom-bar">
        <button class="btn-small" id="nav-load">📂 劇本</button>
        <button class="btn-small btn-gen" id="nav-generate">✨ 隨機生成</button>
        <button class="btn-small" id="nav-save">💾 存檔</button>
        <button class="btn-small" id="nav-read">📥 讀檔</button>
        <button class="btn-small" id="nav-rules">📜 規則</button>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content"></div>
    </div>

    <input type="file" id="json-upload" accept=".json" style="display: none;">

<script>
    // ================= 完整 13 個劇本 (省略部分以節省空間，同前一版) =================
    const scriptsData = {
        "01_asylum": {
            title: "01. 瘋人院 (1921)", initialTU: 25, initialHP: 5, startLocation: "day_room",
            intro: "你們在刺耳的機械聲中醒來，發現自己身處精神病院。",
            items: { "key": { name: "生鏽鑰匙", icon: "🔑", keep: true } },
            locations: {
                "day_room": { name: "活動室", description: "留聲機播放著音樂。", actions: [
                    { label: "搜索椅子", cost: 1, text: "你找到了一把生鏽的鑰匙。", giveItem: "key" },
                    { label: "制服暴動病人", cost: 1, text: "病人朝你撲來！", check: { attr: "combat", diff: 2, successText: "你成功擊退了他們！", failText: "你被打傷了。", failDamage: 1, failTime: 2 } },
                    { label: "前往醫務室", cost: 2, text: "你們走進醫務室。", nextLoc: "infirmary" }
                ]},
                "infirmary": { name: "醫務室", description: "充滿消毒水味。", actions: [
                    { label: "使用鑰匙開櫃子", cost: 1, text: "你打開了櫃子，發現了陰謀！任務成功！", requires: "key", isWin: true }
                ]}
            }
        },
        // ... (為節省字數，其他12個劇本與前一版完全相同) ...
        "13_deep_sea": {
            title: "13. 深海計畫 (2099)", initialTU: 20, initialHP: 5, startLocation: "control_room",
            intro: "致命的瘟疫正在地球肆虐。",
            items: { "keycard": { name: "門禁卡", icon: "💳", keep: true } },
            locations: {
                "control_room": { name: "控制室", description: "全息投影顯示著警告。", actions: [
                    { label: "強行破解系統", cost: 0, text: "系統發出警報。", check: { attr: "tech", diff: 3, successText: "破解成功，獲得門禁卡！", successEffect: "giveItem:keycard", failText: "系統鎖死，浪費了時間。", failTime: 3 } }
                ]}
            }
        }
    };

    // ================= 隨機劇情生成器 =================
    const generator = {
        prefixes: ["神秘的", "被遺忘的", "致命的", "深淵的", "混亂的", "永恆的", "瘋狂的"],
        locations: ["遺跡", "飛船", "孤島", "醫院", "博物館", "修道院", "貧民窟"],
        goals: ["時間裂隙", "古代神器", "關鍵證人", "失落科技"],
        items: [
            { id: "relic", name: "古代遺物", icon: "🏺" },
            { id: "key", name: "發光鑰匙", icon: "🔑" },
            { id: "chip", name: "數據晶片", icon: "💾" },
            { id: "gun", name: "能量武器", icon: "🔫" },
            { id: "scroll", name: "神祕捲軸", icon: "📜" }
        ],
        attrs: ["combat", "tech", "agility", "charisma"],
        randomArray(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
        generate() {
            const prefix = this.randomArray(this.prefixes);
            const loc = this.randomArray(this.locations);
            const goal = this.randomArray(this.goals);
            const mainItem = this.randomArray(this.items);
            const checkAttr = this.randomArray(this.attrs);
            
            return {
                title: `【生成】${prefix}${loc}`,
                initialTU: Math.floor(Math.random() * 10) + 20,
                initialHP: Math.floor(Math.random() * 3) + 4,
                startLocation: "start_loc",
                intro: `系統生成了一個隨機任務。你們需要在${prefix}${loc}中，找到${goal}。快！時間不多了。`,
                items: { [mainItem.id]: { name: mainItem.name, icon: mainItem.icon, keep: true } },
                locations: {
                    "start_loc": {
                        name: `${loc}入口`, description: "這裡散發著危險的氣息，你們需要先找到前進的線索。",
                        actions: [
                            { label: `搜索週邊`, cost: 2, text: `你找到了一個${mainItem.name}。`, giveItem: mainItem.id },
                            { label: `解除防禦系統`, cost: 1, text: "前方有障礙阻擋。", check: { attr: checkAttr, diff: 2, successText: "你成功解除了障礙。", failText: "你觸發了陷阱，受到傷害！", failDamage: 1, failTime: 2 } },
                            { label: "深入探索", cost: 3, text: "你們進入了更深處。", nextLoc: "final_loc" }
                        ]
                    },
                    "final_loc": {
                        name: `${loc}核心區`, description: `目標${goal}就在眼前，但守衛森嚴。`,
                        actions: [
                            { label: `啟動裝置`, cost: 1, text: `你使用${mainItem.name}成功修復了時間線！任務完成！`, requires: mainItem.id, isWin: true },
                            { label: `強行破壞`, cost: 5, text: "巨大的爆炸將你們吞沒，時間線徹底崩潰！", check: { attr: "combat", diff: 6, successText: "你們居然成功了，但代價極大。", failText: "你們失敗了，命喪當場。", failDamage: 99 } }
                        ]
                    }
                }
            };
        }
    };

    // ================= 遊戲核心狀態機 =================
    const game = {
        script: null,
        state: { tu: 0, hp: 0, currentLocId: null, inventory: [], phase: 'IDLE' },

        loadScript(data) {
            this.script = data;
            this.startNewProcess(false);
            document.getElementById('ui-title').innerText = data.title;
            ui.showModal('notice', '劇本載入', `歡迎來到【${data.title}】`);
        },

        startNewProcess(keepItems = false) {
            let savedItems = keepItems ? this.state.inventory.filter(i => this.script.items[i] && this.script.items[i].keep) : [];
            this.state = {
                tu: this.script.initialTU,
                hp: this.script.initialHP,
                currentLocId: this.script.startLocation,
                inventory: savedItems,
                phase: 'PLAYING'
            };
            this.updateUI();
            ui.log(`【任務開始】\n${this.script.intro}`);
            this.renderBoard();
        },

        updateUI() {
            document.getElementById('ui-tu').innerText = this.state.tu;
            document.getElementById('ui-hp').innerText = this.state.hp;
            
            const slots = document.querySelectorAll('.time-slot');
            slots.forEach((slot, index) => {
                if (index === this.state.tu) slot.classList.add('active');
                else slot.classList.remove('active');
            });

            const inv = document.getElementById('ui-inventory');
            inv.innerHTML = '<div class="stat-title">持有物品</div>';
            this.state.inventory.forEach(itemId => {
                if (this.script.items[itemId]) {
                    inv.innerHTML += `<span class="item-tag">${this.script.items[itemId].icon} ${this.script.items[itemId].name}</span>`;
                }
            });
        },

        renderBoard() {
            const area = document.getElementById('play-area');
            area.innerHTML = '';
            if (this.state.phase !== 'PLAYING') return;

            const loc = this.script.locations[this.state.currentLocId];
            ui.log(`【當前地點：${loc.name}】\n${loc.description}`);
            
            loc.actions.forEach(action => {
                const card = document.createElement('div');
                let isDisabled = this.state.tu < action.cost;
                if (action.requires && !this.state.inventory.includes(action.requires)) isDisabled = true;

                card.className = `card ${isDisabled ? 'disabled' : ''}`;
                
                let reqHtml = action.requires ? `<div class="card-requirement">需要: ${this.script.items[action.requires]?.name || action.requires}</div>` : '';
                let icon = action.check ? '🎲' : (action.isWin ? '🏆' : (action.nextLoc ? '🚶' : '🔍'));

                card.innerHTML = `
                    <div class="card-cost">${action.cost}</div>
                    <div class="card-header">${action.label}</div>
                    <div class="card-body">
                        <div style="font-size:40px; margin-bottom:10px;">${icon}</div>
                        ${reqHtml}
                    </div>
                `;
                if (!isDisabled) card.onclick = () => this.handleAction(action);
                area.appendChild(card);
            });
        },

        handleAction(action) {
            if (this.state.tu < action.cost) return ui.showModal('notice', '時間不足', '沒有足夠的 TU 執行此行動。');
            
            this.state.tu -= action.cost;
            this.updateUI();

            if (action.check) {
                this.initiateCheck(action);
            } else {
                this.resolveAction(action);
            }
        },

        initiateCheck(action) {
            const check = action.check;
            let extraTime = 0;
            let diceCount = 1;
            const modal = document.getElementById('modal-content');

            const renderCheckUI = () => {
                modal.innerHTML = `
                    <div class="modal-title">考驗：${check.attr === 'combat' ? '戰鬥' : (check.attr === 'tech' ? '技術' : (check.attr === 'agility' ? '敏捷' : '交涉'))}</div>
                    <div class="modal-text">目標：消除 ${check.diff} 個盾牌 (擲出 4,5,6 算成功)。</div>
                    <div class="modal-text">當前骰子：${diceCount} 顆 D6</div>
                    <div class="modal-text">投入變數 (花費 1 TU 增加 1 骰)：<span style="color:var(--danger)">${extraTime} TU</span></div>
                    <button class="btn" id="btn-add" style="background:#50b87d">投入變數 (+1骰)</button>
                    <button class="btn btn-danger" id="btn-roll">擲骰！</button>
                `;
                document.getElementById('btn-add').onclick = () => {
                    if (this.state.tu <= extraTime) return;
                    extraTime++; diceCount++;
                    renderCheckUI();
                };
                document.getElementById('btn-roll').onclick = () => {
                    this.state.tu -= extraTime;
                    this.updateUI();
                    this.rollDice(diceCount, check, action);
                };
            };
            renderCheckUI();
            document.getElementById('modal-overlay').classList.add('show');
        },

        rollDice(count, check, originalAction) {
            const modal = document.getElementById('modal-content');
            modal.innerHTML = `<div class="modal-title">擲骰中...</div><div class="dice-area" id="dice-area"></div>`;
            const area = document.getElementById('dice-area');
            for(let i=0; i<count; i++) area.innerHTML += `<div class="die rolling">?</div>`;

            setTimeout(() => {
                let hits = 0;
                const dice = document.querySelectorAll('.die');
                dice.forEach(die => {
                    const val = Math.floor(Math.random() * 6) + 1;
                    die.classList.remove('rolling');
                    die.innerText = val;
                    if (val >= 4) hits++;
                });

                setTimeout(() => {
                    if (hits >= check.diff) {
                        ui.showModal('notice', '考驗成功', check.successText);
                        let resAction = { ...originalAction, text: "" };
                        if (check.successEffect && check.successEffect.startsWith("giveItem:")) {
                            resAction.giveItem = check.successEffect.split(":")[1];
                        }
                        this.resolveAction(resAction);
                    } else {
                        if (check.failDamage) this.state.hp -= check.failDamage;
                        if (check.failTime) this.state.tu -= check.failTime;
                        ui.showModal('notice', '考驗失敗', `${check.failText} (失去 ${check.failDamage||0} HP, ${check.failTime||0} TU)`);
                        this.resolveAction({ ...originalAction, text: "" });
                    }
                    this.updateUI();
                    this.checkGameOver();
                }, 800);
            }, 1000);
        },

        resolveAction(action) {
            if (action.giveItem && this.script.items[action.giveItem]) {
                this.state.inventory.push(action.giveItem);
                ui.log(`獲得了物品：${this.script.items[action.giveItem].name}`);
            }
            if (action.nextLoc) {
                this.state.currentLocId = action.nextLoc;
            }
            this.updateUI();
            
            if (action.isWin) {
                this.state.phase = 'WIN';
                ui.showModal('end', '任務成功', '時間線已恢復！');
            } else {
                this.renderBoard();
                this.checkGameOver();
            }
        },

        checkGameOver() {
            if (this.state.phase === 'PLAYING' && (this.state.tu <= 0 || this.state.hp <= 0)) {
                this.state.phase = 'GAMEOVER';
                ui.showModal('end', '進程失敗', '時間耗盡或生命歸零，意識被強制彈回。');
            }
        }
    };

    // ================= UI 控制器 =================
    const ui = {
        log(text) {
            const el = document.getElementById('story-log');
            el.innerHTML = `<p style="margin-bottom:8px;">> ${text.replace(/\n/g, '<br>> ')}</p>` + el.innerHTML;
        },
        showModal(type, title, text) {
            const modal = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            if (type === 'end') {
                let isWin = title.includes('成功');
                content.innerHTML = `
                    <div class="modal-title" style="color:${isWin ? 'var(--success)' : 'var(--danger)'}">${isWin?'🏆':'💀'} ${title}</div>
                    <div class="modal-text">${text}</div>
                    ${!isWin ? `
                        <button class="btn btn-danger" onclick="game.startNewProcess(true); ui.closeModal();">帶著道具重試</button>
                        <button class="btn" onclick="game.startNewProcess(false); ui.closeModal();">從頭開始</button>
                    ` : `<button class="btn" onclick="ui.closeModal();">確定</button>`}
                `;
            } else {
                content.innerHTML = `
                    <div class="modal-title">${title}</div>
                    <div class="modal-text">${text}</div>
                    <button class="btn" onclick="ui.closeModal();">確定</button>
                `;
            }
            modal.classList.add('show');
        },
        closeModal() { document.getElementById('modal-overlay').classList.remove('show'); },
        
        loadMenu() {
            let html = `<div class="modal-title">📂 選擇劇本</div>`;
            for(let key in scriptsData) {
                html += `<button class="btn" style="margin-bottom:10px; text-align:left; padding-left:20px;" onclick="game.loadScript(scriptsData['${key}']); ui.closeModal();">${scriptsData[key].title}</button>`;
            }
            html += `<button class="btn" style="background:#555; margin-top:10px;" onclick="document.getElementById('json-upload').click();">上傳外部 JSON</button>`;
            html += `<button class="btn" style="background:transparent; border:1px solid #555; margin-top:10px;" onclick="ui.closeModal();">取消</button>`;
            
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-overlay').classList.add('show');
        },

        generateScript() {
            const generated = generator.generate();
            game.loadScript(generated);
            ui.closeModal();
            setTimeout(() => { ui.log("【系統提示】這是一個由 AI 引擎為您隨機生成的專屬冒險！"); }, 500);
        },

        rules() {
            // ✨ 重新設計的新手教學 ✨
            document.getElementById('modal-content').innerHTML = `
                <div class="modal-title">📜 新手特工生存指南</div>
                <div class="modal-text" style="text-align:left;">
                    
                    <div class="rule-section">
                        <h3>🎯 1. 遊戲目標</h3>
                        <p>你現在是一名穿越時空的探員。你必須在 <span class="highlight-red">時間耗盡（歸零）</span> 或 <span class="highlight-red">生命歸零</span> 之前，找到任務的關鍵道具並完成目標！</p>
                    </div>

                    <div class="rule-section">
                        <h3>🖥️ 2. 看懂畫面</h3>
                        <p>🔹 <b>最上方時間軌道</b>：發光的數字就是你們剩下的時間（TU）。每次行動都會扣除時間。</p>
                        <p>🔹 <b>左側儀表板</b>：顯示你的 <b>生命 (HP)</b> 和收集到的 <b>持有物品</b>。</p>
                        <p>🔹 <b>中間的行動卡牌</b>：這是你們目前能做的事。卡牌右上角的紅圈代表「需要花費多少 TU」。</p>
                    </div>

                    <div class="rule-section">
                        <h3>🕹️ 3. 操作步驟</h3>
                        <p>👉 <b>第一步：讀故事</b>。看畫面上方黑色框框裡的文字，了解你現在在哪裡。</p>
                        <p>👉 <b>第二步：點卡片</b>。點擊中間的卡牌來探索、移動或戰鬥。</p>
                        <p>👉 <b>第三步：注意限制</b>。如果卡片上寫著 <span class="highlight-red">「需要: XXX」</span> 或呈現灰色，代表你缺道具或時間不夠。請先去找鑰匙或線索！</p>
                    </div>

                    <div class="rule-section">
                        <h3>🎲 4. 特殊機制 (很重要！)</h3>
                        <p><b>考驗與擲骰</b>：當你點擊有 🎲 圖示的卡片，會進入擲骰考驗。擲出 <b>4、5、6</b> 算成功。你可以花費 TU 來「投入變數」增加骰子。</p>
                        <p><b>時間循環 (Time Loop)</b>：失敗了千萬別灰心！時間歸零後，你可以選擇<span class="highlight">「保留特定道具重新開始」</span>。下一輪你會帶著經驗和道具，更輕鬆地破關！</p>
                    </div>
                    
                    <button class="btn" style="margin-top:20px;" onclick="ui.closeModal(); ui.loadMenu();">我準備好了，開始遊戲！</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.add('show');
        }
    };

    // ================= 初始化 =================
    window.onload = () => {
        const track = document.getElementById('time-track');
        for(let i=0; i<=60; i++) {
            let slot = document.createElement('div');
            slot.className = `time-slot ${i%5===0 ? 'milestone' : ''}`;
            slot.innerText = i;
            track.appendChild(slot);
        }

        document.getElementById('nav-load').onclick = () => ui.loadMenu();
        document.getElementById('nav-generate').onclick = () => ui.generateScript();
        // 點擊規則按鈕先顯示新手教學
        document.getElementById('nav-rules').onclick = () => ui.rules();
        
        document.getElementById('nav-save').onclick = () => {
            if(!game.script) return ui.showModal('notice', '錯誤', '沒有進行中的遊戲！');
            localStorage.setItem('ts_save_board', JSON.stringify({ script: game.script, state: game.state }));
            ui.showModal('notice', '存檔', '遊戲已儲存！');
        };
        document.getElementById('nav-read').onclick = () => {
            const saved = localStorage.getItem('ts_save_board');
            if(!saved) return ui.showModal('notice', '錯誤', '沒有找到存檔！');
            const data = JSON.parse(saved);
            game.script = data.script;
            game.state = data.state;
            document.getElementById('ui-title').innerText = data.script.title;
            game.updateUI();
            game.renderBoard();
            ui.showModal('notice', '讀檔', '存檔已讀取！');
        };

        document.getElementById('json-upload').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if (data.title && data.locations) {
                        game.loadScript(data);
                    } else {
                        const firstKey = Object.keys(data)[0];
                        if(firstKey && data[firstKey].title) {
                            game.loadScript(data[firstKey]);
                        } else {
                            throw new Error("格式不符");
                        }
                    }
                    ui.closeModal();
                } catch (err) { ui.showModal('notice', '錯誤', 'JSON 解析失敗，請確認格式！'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        };

        // 初次打開網頁，直接顯示「新手教學」
        ui.rules();
    };
</script>
</body>
</html>
