<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>地牢爬行经典 · 单人冒险</title>
<style>
:root{
  --parchment:#e8dcc8;
  --parchment-2:#d4c4a8;
  --ink:#241608;
  --ink-2:#5a4030;
  --gold:#c9a227;
  --blood:#8b1a1a;
  --paper-shadow:rgba(40,25,10,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Songti SC","SimSun","Noto Serif TC","Source Han Serif TC",serif;
  background:#120d08;
  color:var(--ink);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  height:100vh;height:100dvh;
  user-select:none;
}
/* ===== 背景羊皮纸纹理 ===== */
#app{
  position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(ellipse 120% 80% at 50% 0%, #3a2a18 0%, #120d08 70%),
    #120d08;
}
#app::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.85) 100%);
  z-index:5;
}
/* ===== 顶栏 ===== */
#topbar{
  position:relative;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;
  background:linear-gradient(180deg,#2b1d10,#1a120a);
  border-bottom:2px solid var(--gold);
  color:#f0e0c0;
  font-size:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.7);
  flex-wrap:wrap;gap:6px;
}
#topbar .brand{font-weight:bold;letter-spacing:2px;color:var(--gold);text-shadow:0 0 8px rgba(201,162,39,.5);font-size:15px}
#topbar .stats{display:flex;gap:14px;font-size:13px;color:#e8d8b8}
#topbar .stats span{white-space:nowrap}
/* ===== 主舞台 ===== */
#stage{
  position:relative;z-index:10;flex:1;overflow-y:auto;overflow-x:hidden;
  padding:12px;display:flex;flex-direction:column;gap:12px;
  scrollbar-width:thin;
}
#stage::-webkit-scrollbar{width:6px}
#stage::-webkit-scrollbar-thumb{background:#6b5335;border-radius:3px}
/* ===== 羊皮纸面板 ===== */
.panel{
  position:relative;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(255,245,215,.55), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(150,110,65,.30), transparent 55%),
    repeating-linear-gradient(45deg, rgba(120,90,55,.03) 0 2px, transparent 2px 4px),
    linear-gradient(150deg,#ecdfc9,#d6c3a2);
  border:1px solid #8a7050;
  border-radius:5px;
  box-shadow:0 4px 18px rgba(0,0,0,.65), inset 0 0 30px rgba(120,90,50,.15);
  color:var(--ink);
}
.panel-inner{padding:14px}
/* ===== 遭遇卡 ===== */
.encounter-card{overflow:hidden}
.enc-art{
  width:100%;height:150px;display:block;
  background:#0d0a06;
  border-bottom:1px solid #8a7050;
}
.enc-body{padding:12px 14px}
.enc-name{
  font-size:19px;font-weight:bold;color:#3a1f0c;letter-spacing:1px;
  border-bottom:1px dashed #9a7f58;padding-bottom:6px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.enc-name .tag{
  font-size:11px;font-weight:normal;background:#3a2412;color:#e8d8b0;
  padding:2px 8px;border-radius:10px;letter-spacing:1px;white-space:nowrap;
}
.enc-desc{font-size:14px;line-height:1.75;color:#3a2a1a;min-height:52px}
.enc-desc .cursor{animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.challenge-box{
  margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:rgba(90,60,30,.12);border:1px solid #a08a60;border-radius:4px;padding:8px 10px;
  font-size:13px;
}
.challenge-box b{color:var(--blood)}
/* ===== 队伍列（不换行 + 水平滚动） ===== */
.party-wrap{
  display:flex;flex-direction:column;gap:6px;
}
.party-label{
  font-size:12px;color:#c8b088;letter-spacing:2px;padding-left:4px;
  display:flex;justify-content:space-between;
}
.party-row{
  display:flex;flex-wrap:nowrap;
  gap:8px;overflow-x:auto;overflow-y:hidden;
  align-items:center;
  padding:4px 2px 10px;
  scrollbar-width:thin;
}
.party-row::-webkit-scrollbar{height:5px}
.party-row::-webkit-scrollbar-thumb{background:#6b5335;border-radius:3px}
/* ===== 角色卡 ===== */
.char-card{
  flex:0 0 auto;width:128px;
  background:linear-gradient(160deg,#efe3cc,#d8c6a4);
  border:2px solid #8a7050;border-radius:6px;
  padding:7px 8px;
  cursor:pointer;
  transition:transform .13s ease, box-shadow .13s ease, border-color .13s;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  position:relative;
}
.char-card:active{transform:scale(.97)}
.char-card.selected{
  border-color:var(--gold);
  box-shadow:0 0 0 2px var(--gold), 0 0 18px rgba(201,162,39,.75);
  transform:translateY(-3px);
}
.char-card.dead{
  filter:grayscale(1) brightness(.55);
  cursor:not-allowed;
  border-color:#5a4a3a;
}
.char-card.dead::after{
  content:'阵亡';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-18deg);
  color:#e04040;font-size:22px;font-weight:bold;letter-spacing:3px;
  text-shadow:0 0 6px #000;border:3px solid #e04040;padding:2px 8px;border-radius:4px;
}
.cc-name{font-size:13px;font-weight:bold;color:#2b1a08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-occ{font-size:10px;color:#7a6040;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.cc-hpbar{height:7px;background:#3a2a1a;border-radius:4px;overflow:hidden;margin:3px 0 2px;border:1px solid #5a4030}
.cc-hpfill{height:100%;background:linear-gradient(90deg,#c02020,#e06030);transition:width .3s}
.cc-hptext{font-size:10px;color:#5a4030;text-align:right}
.cc-stats{font-size:10px;color:#4a3a28;line-height:1.5;margin-top:3px;white-space:nowrap}
.cc-xp{font-size:10px;color:#7a5a20;margin-top:2px;display:flex;justify-content:space-between}
.cc-lvl{color:var(--blood);font-weight:bold}
/* ===== 行动按钮 ===== */
.action-bar{display:flex;gap:10px;justify-content:center;padding:2px 0 6px}
.btn{
  font-family:inherit;
  border:2px solid #6b4a20;
  background:linear-gradient(180deg,#e8d0a0,#c8a870);
  color:#2b1a08;font-size:15px;font-weight:bold;letter-spacing:2px;
  padding:12px 26px;border-radius:6px;cursor:pointer;
  box-shadow:0 4px 0 #5a3f1c, 0 6px 14px rgba(0,0,0,.55);
  transition:transform .08s, box-shadow .08s, filter .15s;
  min-width:140px;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a3f1c, 0 3px 8px rgba(0,0,0,.5)}
.btn:disabled{
  filter:grayscale(.75) brightness(.65);cursor:not-allowed;
  box-shadow:0 4px 0 #3a3020;opacity:.7;
}
.btn.gold{background:linear-gradient(180deg,#f2d868,#c9a227);border-color:#8a6a10;box-shadow:0 4px 0 #7a5a10,0 6px 14px rgba(0,0,0,.55)}
.btn.blood{background:linear-gradient(180deg,#d06040,#8b1a1a);color:#fff;border-color:#5a0a0a;box-shadow:0 4px 0 #4a0808,0 6px 14px rgba(0,0,0,.55)}
.btn.small{font-size:13px;padding:8px 16px;min-width:0;letter-spacing:1px}
/* ===== 底部导航 ===== */
#bottomnav{
  position:relative;z-index:20;
  display:flex;justify-content:space-around;align-items:stretch;
  background:linear-gradient(180deg,#1a120a,#2b1d10);
  border-top:2px solid var(--gold);
  padding:6px 2px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -3px 14px rgba(0,0,0,.75);
}
#bottomnav button{
  flex:1;background:none;border:none;color:#c8b088;
  font-family:inherit;font-size:10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 2px;border-radius:6px;transition:background .15s,color .15s;
  min-width:0;
}
#bottomnav button .ico{font-size:18px;line-height:1}
#bottomnav button:active{background:rgba(201,162,39,.18)}
#bottomnav button.on{color:var(--gold)}
/* ===== 模态框 ===== */
#modalLayer{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(2px);
  align-items:center;justify-content:center;
  padding:16px;
}
#modalLayer.show{display:flex}
.modal{
  width:100%;max-width:560px;max-height:86vh;
  display:flex;flex-direction:column;
  animation:modalIn .22s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:2px solid #8a7050;
  font-weight:bold;font-size:16px;color:#3a1f0c;letter-spacing:2px;
}
.modal-head button{
  background:none;border:none;font-size:20px;color:#6a4a20;cursor:pointer;
  line-height:1;padding:0 4px;font-family:inherit;
}
.modal-body{
  padding:14px;overflow-y:auto;font-size:13.5px;line-height:1.8;color:#33240f;
  scrollbar-width:thin;
}
.modal-body::-webkit-scrollbar{width:6px}
.modal-body::-webkit-scrollbar-thumb{background:#8a7050;border-radius:3px}
.modal-foot{padding:10px 14px;border-top:1px solid #a08a60;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-body h3{
  font-size:14px;color:var(--blood);margin:14px 0 6px;letter-spacing:1px;
  border-left:3px solid var(--gold);padding-left:8px;
}
.modal-body h3:first-child{margin-top:0}
.modal-body p{margin-bottom:8px}
.modal-body ul{margin:0 0 10px 20px}
.modal-body li{margin-bottom:5px}
.modal-body .hl{color:#7a1a1a;font-weight:bold}
.modal-body .em{color:#8a5a00;font-weight:bold}
.modal-body code{background:rgba(90,60,30,.15);padding:1px 5px;border-radius:3px;font-family:inherit;color:#5a2a0a}
/* ===== Toast ===== */
#toastLayer{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:92%;max-width:420px;
}
.toast{
  background:rgba(30,18,8,.95);color:#f0e0c0;
  border:1px solid var(--gold);border-radius:6px;
  padding:9px 16px;font-size:13px;letter-spacing:.5px;
  box-shadow:0 4px 18px rgba(0,0,0,.8);
  animation:toastIn .25s ease, toastOut .4s ease 2.1s forwards;
  text-align:center;line-height:1.5;
}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px)}}
/* ===== 掷骰结果面板 ===== */
.dice-display{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:16px;flex-wrap:wrap;
}
.die-box{
  width:74px;height:74px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:bold;color:#f0e0c0;
  background:radial-gradient(circle at 30% 25%, #6b4a20, #2b1a08);
  border:3px solid var(--gold);border-radius:10px;
  box-shadow:0 0 18px rgba(201,162,39,.55), inset 0 0 16px rgba(0,0,0,.6);
  animation:dieRoll .5s ease;
}
@keyframes dieRoll{
  0%{transform:rotate(-14deg) scale(.6);opacity:.2}
  55%{transform:rotate(9deg) scale(1.12)}
  100%{transform:none}
}
.result-line{text-align:center;font-size:15px;letter-spacing:1px;color:#3a2a1a;margin:4px 0;line-height:1.6}
.result-line .big{font-size:22px;font-weight:bold}
.ok{color:#1a6b2a!important;font-weight:bold}
.bad{color:var(--blood)!important;font-weight:bold}
/* ===== 升级职业选择 ===== */
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.class-opt{
  background:linear-gradient(160deg,#efe3cc,#d8c6a4);
  border:2px solid #8a7050;border-radius:6px;padding:10px;cursor:pointer;
  transition:transform .12s, box-shadow .12s, border-color .12s;
  box-shadow:0 3px 8px rgba(0,0,0,.45);
}
.class-opt:active{transform:scale(.97)}
.class-opt:hover{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 3px 14px rgba(201,162,39,.6)}
.class-opt .cn{font-size:15px;font-weight:bold;color:#3a1f0c;letter-spacing:1px}
.class-opt .cd{font-size:11px;color:#6a5030;line-height:1.5;margin-top:4px}
/* ===== 历史时间线 ===== */
.timeline{position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#a08a60}
.tl-item{position:relative;margin-bottom:10px;font-size:12.5px;line-height:1.6;color:#3a2a1a}
.tl-item::before{
  content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;
  background:var(--gold);border:2px solid #6b4a20;
}
.tl-item .tt{font-size:10px;color:#8a7050;display:block}
/* ===== 成就 ===== */
.ach-item{
  display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px dashed #b0a080;
}
.ach-item:last-child{border-bottom:none}
.ach-ico{font-size:24px;filter:grayscale(1) opacity(.35)}
.ach-item.unlocked .ach-ico{filter:none}
.ach-name{font-size:13px;font-weight:bold;color:#6a5030}
.ach-item.unlocked .ach-name{color:#3a1f0c}
.ach-desc{font-size:11px;color:#8a7050}
/* ===== 标题画面 ===== */
.title-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:28px 16px;text-align:center;flex:1;
}
.title-screen .big-title{
  font-size:clamp(26px,7vw,40px);letter-spacing:6px;font-weight:bold;
  color:var(--gold);
  text-shadow:0 0 22px rgba(201,162,39,.6),0 3px 0 #4a3208;
}
.title-screen .subtitle{font-size:13px;color:#b8a080;letter-spacing:3px}
.title-screen .quote{
  font-size:12.5px;color:#9a8a70;line-height:1.9;max-width:420px;
  font-style:italic;border-left:2px solid #6b5335;padding-left:12px;text-align:left;
}
.fade-in{animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ===== 响应式 ===== */
@media(max-width:420px){
  .enc-art{height:120px}
  .enc-name{font-size:16px}
  .enc-desc{font-size:13px}
  .char-card{width:112px}
  .btn{font-size:14px;padding:11px 18px;min-width:120px}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">🏰 地牢爬行经典</div>
    <div class="stats">
      <span id="goldDisplay">💰 0 铜币</span>
      <span id="floorDisplay">🏛️ 房间 0 / 10</span>
      <span id="partyDisplay">👥 0</span>
    </div>
  </header>
  <main id="stage"></main>
  <nav id="bottomnav">
    <button data-nav="help"><span class="ico">📖</span><span>说明</span></button>
    <button data-nav="save"><span class="ico">💾</span><span>存档</span></button>
    <button data-nav="load"><span class="ico">📂</span><span>读档</span></button>
    <button data-nav="history"><span class="ico">📜</span><span>历史</span></button>
    <button data-nav="achievements"><span class="ico">🏆</span><span>成就</span></button>
    <button data-nav="sound" id="soundBtn"><span class="ico">🔊</span><span>音效</span></button>
  </nav>
</div>
<div id="modalLayer"></div>
<div id="toastLayer"></div>

<script>
"use strict";
/* =========================================================
   地牢爬行经典 · 单人网页版
   依据《Dungeon Crawl Classics RPG》核心规则简化实现
   ========================================================= */

/* ---------------- 工具函数 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n) + 1;
const rng = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function rollDiceExpr(expr) {
  const m = String(expr).match(/(\d+)d(\d+)\s*([+-]\s*\d+)?/);
  if (!m) return 0;
  const n = parseInt(m[1]), s = parseInt(m[2]);
  const mod = m[3] ? parseInt(m[3].replace(/\s/g, '')) : 0;
  let total = mod;
  for (let i = 0; i < n; i++) total += rnd(s);
  return total;
}

/* ---------------- 骰链 ---------------- */
const DICE_CHAIN = [3, 4, 5, 6, 7, 8, 10, 12, 14, 16, 20, 24, 30];
function stepDie(size, steps) {
  const i = DICE_CHAIN.indexOf(size);
  if (i === -1) return size;
  return DICE_CHAIN[clamp(i + steps, 0, DICE_CHAIN.length - 1)];
}

/* ---------------- 表 1-1：属性修正值 ---------------- */
const ABILITY_MOD = {
  3: -3, 4: -2, 5: -2, 6: -1, 7: -1, 8: -1, 9: 0, 10: 0, 11: 0, 12: 0,
  13: 1, 14: 1, 15: 1, 16: 2, 17: 2, 18: 3
};
const mod = v => ABILITY_MOD[clamp(v, 3, 18)];

/* ---------------- 表 1-2：幸运掷骰（d30） ---------------- */
const LUCK_TABLE = [
  null,
  { name: '严冬', desc: '所有攻击掷骰', key: 'attack' },
  { name: '公牛', desc: '近战攻击掷骰', key: 'melee' },
  { name: '吉日', desc: '远程攻击掷骰', key: 'ranged' },
  { name: '狼群养大', desc: '徒手攻击掷骰', key: 'unarmed' },
  { name: '马上受孕', desc: '骑乘攻击掷骰', key: 'mounted' },
  { name: '生于战场', desc: '伤害掷骰', key: 'damage' },
  { name: '熊之道', desc: '近战伤害掷骰', key: 'melee_dmg' },
  { name: '鹰眼', desc: '远程伤害掷骰', key: 'ranged_dmg' },
  { name: '群猎者', desc: '0 级起始武器的攻击与伤害掷骰', key: 'weapon' },
  { name: '织机下出生', desc: '技能检定（包括盗贼技能）', key: 'skill' },
  { name: '狐狸的狡黠', desc: '发现 / 解除陷阱', key: 'trap' },
  { name: '四叶草', desc: '发现暗门', key: 'secret' },
  { name: '第七子', desc: '法术检定', key: 'spell' },
  { name: '狂怒风暴', desc: '法术伤害', key: 'spell_dmg' },
  { name: '正义之心', desc: '驱散邪祟检定', key: 'turn' },
  { name: '瘟疫幸存者', desc: '魔法治疗', key: 'heal' },
  { name: '幸运吉兆', desc: '豁免检定', key: 'save' },
  { name: '守护天使', desc: '逃离陷阱的豁免检定', key: 'trap_save' },
  { name: '蜘蛛咬伤幸存者', desc: '抗毒豁免检定', key: 'poison' },
  { name: '遭雷击', desc: '反射豁免', key: 'reflex' },
  { name: '熬过饥荒', desc: '强韧豁免', key: 'fort' },
  { name: '抵住诱惑', desc: '意志豁免', key: 'will' },
  { name: '吉屋', desc: '护甲等级', key: 'ac' },
  { name: '眼镜蛇之速', desc: '先攻', key: 'init' },
  { name: '丰收', desc: '生命值（在每个等级生效）', key: 'hp' },
  { name: '战士之臂', desc: '暴击表', key: 'crit' },
  { name: '凶宅', desc: '腐化掷骰', key: 'corruption' },
  { name: '破碎之星', desc: '大失败', key: 'fumble' },
  { name: '鸟鸣', desc: '语言数量', key: 'lang' },
  { name: '野孩子', desc: '速度', key: 'speed' }
];

/* ---------------- 表 1-3：职业（d%） ---------------- */
const OCCUPATIONS = [

  const r = rnd(100);
  return OCCUPATIONS.find(o => r >= o.r[0] && r <= o.r[1]) || OCCUPATIONS[0];
}
function raceFromOccupation(name) {
  if (name.startsWith('矮人')) return 'dwarf';
  if (name.startsWith('精灵')) return 'elf';
  if (name.startsWith('半身人')) return 'halfling';
  return 'human';
}

  return m ? m[1] : w;
}

/* ---------------- 音效（Web Audio API 合成） ---------------- */
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function sfx(type) {
  if (!state.soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  switch (type) {
    case 'click':
      o.type = 'square';
      o.frequency.setValueAtTime(520, now);
      o.frequency.exponentialRampToValueAtTime(200, now + 0.06);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      o.start(now); o.stop(now + 0.09);
      break;
    case 'roll':
      o.type = 'triangle';
      o.frequency.setValueAtTime(180, now);
      o.frequency.linearRampToValueAtTime(420, now + 0.18);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      o.start(now); o.stop(now + 0.26);
      break;
    case 'success':
      [523, 659, 784].forEach((f, i) => {
        const oo = audioCtx.createOscillator(), gg = audioCtx.createGain();
        oo.connect(gg); gg.connect(audioCtx.destination);
        oo.type = 'sine';
        oo.frequency.setValueAtTime(f, now + i * 0.09);
        gg.gain.setValueAtTime(0.001, now + i * 0.09);
        gg.gain.linearRampToValueAtTime(0.09, now + i * 0.09 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.2);
        oo.start(now + i * 0.09); oo.stop(now + i * 0.09 + 0.22);
      });
      break;
    case 'fail':
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, now);
      o.frequency.exponentialRampToValueAtTime(70, now + 0.35);
      g.gain.setValueAtTime(0.1, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      o.start(now); o.stop(now + 0.42);
      break;
    case 'death':
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(160, now);
      o.frequency.exponentialRampToValueAtTime(40, now + 0.7);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      o.start(now); o.stop(now + 0.82);
      break;
    case 'levelup':
      [392, 523, 659, 784, 1046].forEach((f, i) => {
        const oo = audioCtx.createOscillator(), gg = audioCtx.createGain();
        oo.connect(gg); gg.connect(audioCtx.destination);
        oo.type = 'sine';
        oo.frequency.setValueAtTime(f, now + i * 0.1);
        gg.gain.setValueAtTime(0.001, now + i * 0.1);
        gg.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
        oo.start(now + i * 0.1); oo.stop(now + i * 0.1 + 0.28);
      });
      break;
  }
}

/* ---------------- 角色生成 ---------------- */
let charSeq = 0;
function createCharacter() {
  const str = rnd(6) + rnd(6) + rnd(6);
  const agi = rnd(6) + rnd(6) + rnd(6);
  const sta = rnd(6) + rnd(6) + rnd(6);
  const per = rnd(6) + rnd(6) + rnd(6);
  const int_ = rnd(6) + rnd(6) + rnd(6);
  const luck = rnd(6) + rnd(6) + rnd(6);

  const occ = rollOccupation();
  const race = raceFromOccupation(occ.name);
  const luckAugur = LUCK_TABLE[rnd(30)];
  const luckMod = mod(luck);
  const staMod = mod(sta);

  let hp = Math.max(1, rnd(4) + staMod);
  if (luckAugur && luckAugur.key === 'hp') hp = Math.max(1, hp + luckMod);

  const cp = (() => { let t = 0; for (let i = 0; i < 5; i++) t += rnd(12); return t; })();

  return {
    id: ++charSeq,
    name: pick(NAMES) + '·' + String.fromCharCode(0x4e00 + rnd(200)),
    race,
    occupation: occ.name,
    weapon: occ.weapon,
    baseWeapon: baseWeapon(occ.weapon),
    weaponDmg: WEAPON_DMG[baseWeapon(occ.weapon)] || '1d4',
    goods: occ.goods,
    attrs: { str, agi, sta, per, int: int_, luck },
    luckAugur,
    luckMod,
    hp, maxHp: hp,
    xp: 0,
    level: 0,
    cls: null,
    dead: false,
    gold: cp
  };
}

/* ---------------- 属性快捷访问 ---------------- */
const M = {
  str: c => mod(c.attrs.str),
  agi: c => mod(c.attrs.agi),
  sta: c => mod(c.attrs.sta),
  per: c => mod(c.attrs.per),
  int: c => mod(c.attrs.int),
  luck: c => mod(c.attrs.luck)
};

/* 战斗攻击加值（0 级 +0；1 级起按职业） */
function attackBonus(c) {
  if (c.level === 0) return 0;
  const cls = CLASSES[c.cls];
  if (!cls) return 0;
  if (cls.deed) return 0; // 事迹骰单独处理
  return Math.floor(c.level / 2) + (cls.attack || 0);
}

/* ---------------- 挑战检定 ---------------- */
function attrLabel(a) {
  return { str: '力量', agi: '敏捷', sta: '耐力', per: '个性', int: '智力', luck: '幸运' }[a] || a;
}

/* 计算某角色在某遭遇上的修正值 */
function challengeMod(c, enc) {
  let m = M[enc.attr] ? M[enc.attr](c) : 0;
  // 幸运预兆加成（若对应）
  if (c.luckAugur) {
    const k = c.luckAugur.key;
    const match =
      (enc.type === 'combat' && (k === 'attack' || k === 'melee')) ||
      (enc.type === 'trap' && (k === 'trap_save' || k === 'reflex' || k === 'save')) ||
      (enc.type === 'obstacle' && (k === 'skill' || k === 'save')) ||
      (enc.type === 'puzzle' && (k === 'skill' || k === 'save')) ||
      (enc.type === 'treasure' && k === 'skill') ||
      (enc.type === 'gas' && (k === 'fort' || k === 'poison' || k === 'save'));
    if (match) m += c.luckMod;
  }
  return m;
}

function render() {
  updateTopBar();
  const stage = $('#stage');
  switch (state.phase) {
    case PHASE.TITLE: stage.innerHTML = viewTitle(); break;
    case PHASE.CREATION: stage.innerHTML = viewCreation(); break;
    case PHASE.EXPLORE: stage.innerHTML = viewExplore(); break;
    case PHASE.RESULT: stage.innerHTML = viewResult(); break;
    case PHASE.LEVELUP: stage.innerHTML = viewLevelUp(); break;
    case PHASE.GAMEOVER: stage.innerHTML = viewGameOver(); break;
    case PHASE.VICTORY: stage.innerHTML = viewVictory(); break;
    default: stage.innerHTML = '';
  }
  stage.classList.remove('fade-in');
  void stage.offsetWidth;
  stage.classList.add('fade-in');
}

}

/* ---------------- 打字机 ---------------- */
let typeTimer = null;
function typewriter(el, text) {
  if (typeTimer) clearInterval(typeTimer);
  el.textContent = '';
  el.dataset.full = text;
  el.dataset.typing = '1';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) {
      clearInterval(typeTimer);
      typeTimer = null;
      el.dataset.typing = '0';
    }
  }, 26);
}

/* =========================================================
   游戏逻辑
   ========================================================= */

function startGame() {
  state.phase = PHASE.CREATION;
  state.party = [];
  state.gold = 0;
  state.roomIndex = 0;
  state.selectedId = null;
  state.lastResult = null;
  state.pendingLevelUps = [];
  state.history = [];
  state.achievements = {};
  rollParty();
  logEvent('🎲 生成 4 名 0 级冒险者');
  render();
}

function rollParty() {
  state.party = [];
  for (let i = 0; i < 4; i++) state.party.push(createCharacter());
}

function enterDungeon() {
  state.phase = PHASE.EXPLORE;
  state.roomIndex = 0;
  state.selectedId = null;
  logEvent('🚪 踏入地牢入口');
  render();
}

function selectChar(id) {
  const c = state.party.find(x => x.id === id);
  if (!c || c.dead) return;
  state.selectedId = id;
  sfx('click');
  render();
}

function doAction() {
  const enc = ENCOUNTERS[state.roomIndex];
  const c = state.party.find(x => x.id === state.selectedId);
  if (!c || c.dead) {
    toast('⚠️ 请先选择一名存活的队员');
    return;
  }
  if (state.phase !== PHASE.EXPLORE) return;

  sfx('roll');

  const modVal = challengeMod(c, enc);
  const roll = rnd(20);
  const total = roll + modVal;
  let success = total >= enc.dc;
  let nat20 = roll === 20;
  let nat1 = roll === 1;
  if (nat20) success = true;
  if (nat1) success = false;

  if (nat20) unlockAch('natural20');
  if (nat1) unlockAch('fumble');

  const result = {
    roll, mod: modVal, total, dc: enc.dc,
    success, nat20, nat1,
    xp: 0, dmg: 0, gold: 0, death: null, message: ''
  };

  if (success) {
    result.xp = enc.xp;
    c.xp += enc.xp;
    state.gold += enc.gold ? rng(10, 40) : 0;
    if (enc.gold) { result.gold = state.gold; }
    result.message = enc.okText;
    sfx('success');
    logEvent(`✅ ${c.name} 在「${enc.name}」中成功（${total} vs DC ${enc.dc}），获得 ${enc.xp} XP`);
  } else {
    const dmg = rollDiceExpr(enc.badDmg || '1d4');
    result.dmg = dmg;
    c.hp -= dmg;
    result.message = enc.badText;
    if (c.hp <= 0) {
      c.hp = 0;
      c.dead = true;
      result.death = c.name;
      sfx('death');
      logEvent(`⚰️ ${c.name} 在「${enc.name}」中阵亡`);
      if (!state.achievements['first_blood']) unlockAch('first_blood');
    } else {
      sfx('fail');
      logEvent(`❌ ${c.name} 在「${enc.name}」中失败（${total} vs DC ${enc.dc}），受到 ${dmg} 点伤害`);
    }
  }

  // 宝藏额外铜币
  if (enc.gold && success) {
    const g = rng(10, 40);
    state.gold += g;
    result.gold = g;
  }
  if (state.gold >= 200) unlockAch('rich');

  // 若第一个房间通过，检查里程碑
  if (state.roomIndex + 1 >= 5) unlockAch('deep');

  state.lastResult = result;
  state.phase = PHASE.RESULT;
  render();
}

function continueJourney() {
  // 检查是否有角色可以升级
  const levelable = state.party.filter(c => !c.dead && c.level === 0 && c.xp >= 10);
  if (levelable.length > 0) {
    state.pendingLevelUps = levelable;
    state.phase = PHASE.LEVELUP;
    sfx('levelup');
    logEvent(`✨ ${levelable[0].name} 达到 10 点经验值，可以选择职业晋升`);
    render();
    return;
  }

  state.roomIndex++;
  if (state.roomIndex >= ENCOUNTERS.length) {
    state.phase = PHASE.VICTORY;
    unlockAch('conqueror');
    logEvent('👑 击败骸骨巫妖，征服地牢！');
    render();
    return;
  }

  // 队伍是否全灭
  if (state.party.every(c => c.dead)) {
    state.phase = PHASE.GAMEOVER;
    unlockAch('wipe');
    logEvent('⚰️ 全军覆没');
    render();
    return;
  }

  state.phase = PHASE.EXPLORE;
  state.selectedId = null;
  logEvent(`➡️ 进入房间 ${state.roomIndex + 1}：${ENCOUNTERS[state.roomIndex].name}`);
  render();
}

function chooseClass(clsKey) {
  const c = state.pendingLevelUps[0];
  if (!c) return;
  const cls = CLASSES[clsKey];
  if (!cls) return;

  c.level = 1;
  c.cls = clsKey;

  // 生命值：保留 0 级的 1d4，再加职业生命骰
  const hpGain = Math.max(1, rnd(cls.hpDie) + M.sta(c));
  const augurHp = (c.luckAugur && c.luckAugur.key === 'hp') ? c.luckMod : 0;
  c.maxHp += hpGain + augurHp;
  c.hp = c.maxHp;

  sfx('levelup');
  unlockAch('survivor');
  logEvent(`🎖️ ${c.name} 晋升为 1 级 ${cls.name}，生命值提升至 ${c.maxHp}`);
  toast(`🎖️ ${c.name} 晋升为 1 级 ${cls.name}！`);

  state.pendingLevelUps.shift();

  if (state.pendingLevelUps.length > 0) {
    render();
    return;
  }

  // 继续旅程
  state.roomIndex++;
  if (state.roomIndex >= ENCOUNTERS.length) {
    state.phase = PHASE.VICTORY;
    unlockAch('conqueror');
    render();
    return;
  }
  if (state.party.every(x => x.dead)) {
    state.phase = PHASE.GAMEOVER;
    unlockAch('wipe');
    render();
    return;
  }
  state.phase = PHASE.EXPLORE;
  state.selectedId = null;
  render();
}

function restartGame() {
  state.phase = PHASE.TITLE;
  state.party = [];
  state.gold = 0;
  state.roomIndex = 0;
  state.selectedId = null;
  state.lastResult = null;
  state.pendingLevelUps = [];
  state.history = [];
  state.achievements = {};
  render();
}

    <ul>
      <li><b>3</b> → −3　<b>4–5</b> → −2　<b>6–8</b> → −1</li>
      <li><b>9–12</b> → 0　<b>13–15</b> → +1　<b>16–17</b> → +2　<b>18</b> → +3</li>
    </ul>
    <p class="em">💡 小诀窍：面对「力量检定」时选力量高的队员；面对「敏捷检定」时选敏捷高的队员。</p>

    <h3>🍀 幸运预兆</h3>
    <p>每名角色在创建时会随机获得一个 <b>幸运预兆</b>（例如「第七子：法术检定」）。
    当你进行与之匹配的掷骰时，会额外获得角色的幸运修正值加成。角色卡上的说明会告诉你具体内容。</p>

    <h3>⚡ 特殊机制</h3>
    <ul>
      <li><b>自然 20 / 自然 1：</b>掷出 20 必定成功，掷出 1 必定失败——与原作核心机制一致。</li>
      <li><b>0 级漏斗：</b>0 级角色只有 1d4 点生命值，一击就可能丧命。这正是「漏斗」的意义：
        只有活下来的角色才值得被记住。</li>
      <li><b>阵亡：</b>生命值降到 0 的队员会被标记为「阵亡」，无法再被选择。若全队阵亡，游戏结束。</li>
      <li><b>晋升保留生命：</b>晋升到 1 级时，角色会保留 0 级时的生命值，并额外获得职业生命骰。</li>
      <li><b>存档 / 读档：</b>随时可以保存进度。存档保存在浏览器本地，关掉网页也不会丢失。</li>
    </ul>

    <h3>🎮 胜利条件</h3>
    <p>走完 <b>全部 10 个房间</b>，并在最终房间击败首领，即可通关。祝你好运——你会需要它的。</p>
  `;
  const foot = fromStart
    ? `<button class="btn gold" data-modal="startgame">我准备好了，开始游戏</button>`
    : `<button class="btn" data-modal="close">关闭</button>`;
  openModal('📖 游戏说明', body, foot, { closable: !fromStart });
}

/* ---------------- 历史 ---------------- */
function openHistory() {
  const items = state.history.length
    ? state.history.map(h => `<div class="tl-item"><span class="tt">${h.t}</span>${h.text}</div>`).join('')
    : '<p style="color:#8a7050">还没有任何记录。开始冒险吧！</p>';
  openModal('📜 冒险历史', `<div class="timeline">${items}</div>`,
    `<button class="btn small" data-modal="close">关闭</button>`);
}

/* ---------------- 成就 ---------------- */
function openAchievements() {
  const body = Object.entries(ACHIEVEMENTS).map(([k, v]) => {
    const un = !!state.achievements[k];
    return `<div class="ach-item ${un ? 'unlocked' : ''}">
      <div class="ach-ico">${v.ico}</div>
      <div>
        <div class="ach-name">${v.name}</div>
        <div class="ach-desc">${v.desc}</div>
      </div>
    </div>`;
  }).join('');
  const unlocked = Object.keys(state.achievements).length;
  openModal('🏆 成就', `<p style="margin-bottom:10px;color:#6a5030">已解锁 ${unlocked} / ${Object.keys(ACHIEVEMENTS).length}</p>${body}`,
    `<button class="btn small" data-modal="close">关闭</button>`);
}

/* ---------------- 存档 / 读档 ---------------- */
const SAVE_KEY = 'dcc_save_v1';

function saveGame() {
  if (state.phase === PHASE.TITLE) {
    toast('⚠️ 还没有开始游戏，无法存档');
    return;
  }
  try {
    const data = {
      phase: state.phase,
      party: state.party,
      gold: state.gold,
      roomIndex: state.roomIndex,
      selectedId: state.selectedId,
      lastResult: state.lastResult,
      pendingLevelUps: state.pendingLevelUps,
      history: state.history,
      achievements: state.achievements,
      soundOn: state.soundOn,
      ts: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('💾 进度已保存');
    logEvent('💾 保存进度');
  } catch (e) {
    toast('⚠️ 存档失败：浏览器存储空间不足');
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) { toast('⚠️ 没有找到存档'); return; }
    const d = JSON.parse(raw);
    state.party = d.party || [];
    state.gold = d.gold || 0;
    state.roomIndex = d.roomIndex || 0;
    state.selectedId = d.selectedId || null;
    state.lastResult = d.lastResult || null;
    state.pendingLevelUps = d.pendingLevelUps || [];
    state.history = d.history || [];
    state.achievements = d.achievements || {};
    state.soundOn = d.soundOn !== false;
    state.phase = d.phase || PHASE.EXPLORE;
    if (state.phase === PHASE.RESULT) state.phase = PHASE.EXPLORE;
    updateSoundBtn();
    toast('📂 读档成功');
    render();
  } catch (e) {
    toast('⚠️ 读档失败：存档文件损坏');
  }
}

/* ---------------- 音效开关 ---------------- */
function updateSoundBtn() {
  const btn = $('#soundBtn');
  if (!btn) return;
  btn.querySelector('.ico').textContent = state.soundOn ? '🔊' : '🔇';
  btn.classList.toggle('on', state.soundOn);
  btn.querySelector('span:last-child').textContent = state.soundOn ? '音效' : '静音';
}

/* =========================================================
   事件绑定
   ========================================================= */
$('#stage').addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;

  // 打字机：点击描述立即完成
  const descEl = e.target.closest('#encDesc');
  if (descEl && descEl.dataset.typing === '1') {
    clearInterval(typeTimer); typeTimer = null;
    descEl.textContent = descEl.dataset.full || '';
    descEl.dataset.typing = '0';
    return;
  }

  const act = el.dataset.action;
  sfx('click');
  switch (act) {
    case 'start':
      openHelp(true);
      break;
    case 'reroll':
      rollParty();
      logEvent('🎲 重新生成队伍');
      render();
      break;
    case 'enter':
      enterDungeon();
      break;
    case 'select':
      selectChar(parseInt(el.dataset.id, 10));
      break;
    case 'act':
      doAction();
      break;
    case 'continue':
      continueJourney();
      break;
    case 'chooseclass':
      chooseClass(el.dataset.cls);
      break;
    case 'restart':
      restartGame();
      break;
  }
});

// 底部导航
$('#bottomnav').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  sfx('click');
  const nav = btn.dataset.nav;
  switch (nav) {
    case 'help': openHelp(false); break;
    case 'save': saveGame(); break;
    case 'load': loadGame(); break;
    case 'history': openHistory(); break;
    case 'achievements': openAchievements(); break;
    case 'sound':
      state.soundOn = !state.soundOn;
      updateSoundBtn();
      if (state.soundOn) sfx('click');
      break;
  }
});

// 模态框事件
$('#modalLayer').addEventListener('click', e => {
  const el = e.target.closest('[data-modal]');
  if (!el) {
    if (e.target.id === 'modalLayer' && $('#modalLayer').querySelector('[data-modal="close"]')) closeModal();
    return;
  }
  sfx('click');
  const a = el.dataset.modal;
  if (a === 'close') closeModal();
  else if (a === 'startgame') {
    closeModal();
    startGame();
  }
});

// 键盘快捷键
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const layer = $('#modalLayer');
    if (layer.classList.contains('show') && layer.querySelector('[data-modal="close"]')) closeModal();
  }
});

/* =========================================================
   打字机启动（每次渲染后）
   ========================================================= */
const _origRender = render;
render = function () {
  _origRender();
  const desc = $('#encDesc');
  if (desc) {
    const enc = ENCOUNTERS[state.roomIndex];
    if (enc) typewriter(desc, enc.desc);
  }
};

/* =========================================================
   启动
   ========================================================= */
updateSoundBtn();
render();
</script>
</body>
</html>
