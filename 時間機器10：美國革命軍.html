<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時間機器10：美國革命軍</title>
    <style>
        :root {
            --bg-dark: #12100e;
            --bg-paper: #e8dcc4;
            --text-main: #2c241b;
            --text-light: #5c4e3d;
            --accent-red: #8b1c1c;
            --accent-hover: #a82b2b;
            --gold: #c9a84c;
            --border: #3a2e22;
            --shadow: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            color: var(--text-main);
        }

        .vignette {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 10;
        }

        #game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-paper);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            z-index: 5;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(0,0,0,0.1);
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .scene-image {
            width: 100%;
            height: 200px;
            background-color: #1a1a1a;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: opacity 0.3s;
        }

        .scene-image svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
            font-size: 1.1rem;
            line-height: 1.8;
            position: relative;
            cursor: pointer;
        }

        .story-text {
            transition: opacity 0.3s;
        }

        .choices-container {
            padding: 15px 20px;
            background: rgba(0,0,0,0.05);
            border-top: 1px solid var(--border);
            transition: opacity 0.3s;
        }

        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #f4ecd8;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .choice-btn:hover:not(:disabled) {
            background: var(--accent-red);
            color: white;
            transform: translateY(-2px);
            box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #d1c8b5;
        }

        .choice-btn.primary {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
            text-align: center;
            font-weight: bold;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #1a1512;
            padding: 10px;
            border-top: 2px solid var(--gold);
            z-index: 20;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-family: inherit;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-btn:hover { background: rgba(255,255,255,0.1); }
        .nav-btn .icon { font-size: 1.2rem; }

        .inventory-bar {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.1);
            border-top: 1px solid var(--border);
            overflow-x: auto;
        }

        .item {
            background: #f4ecd8;
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--bg-paper);
            padding: 25px;
            border-radius: 8px;
            border: 2px solid var(--gold);
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-content h2 {
            color: var(--accent-red);
            margin-top: 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .modal-content ul { padding-left: 20px; line-height: 1.6; }
        
        .modal-close-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            margin-top: 15px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .history-list li {
            padding: 8px 10px;
            border-bottom: 1px dashed var(--border);
            font-size: 0.9rem;
            color: var(--text-light);
        }

        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 200;
            border: 1px solid var(--gold);
        }

        @media (max-width: 600px) {
            .scene-image { height: 150px; }
            .story-container { padding: 15px; font-size: 1rem; }
            .choice-btn { padding: 12px; font-size: 0.95rem; }
            .nav-btn span:not(.icon) { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="vignette"></div>

<div id="game-container">
    <div class="top-bar">
        <span id="chapter-title">序幕：時光之旅</span>
        <span id="inventory-count">🎒 1</span>
    </div>

    <div class="scene-image" id="scene-image"></div>

    <div class="story-container" id="story-container" onclick="game.ui.skipTyping()">
        <div class="story-text" id="story-text"></div>
    </div>

    <div class="choices-container" id="choices-container"></div>

    <div class="inventory-bar" id="inventory-bar"></div>

    <div class="bottom-nav">
        <button class="nav-btn" onclick="game.ui.showModal('help')"><span class="icon">❓</span><span>說明</span></button>
        <button class="nav-btn" onclick="game.ui.showModal('history')"><span class="icon">📜</span><span>歷程</span></button>
        <button class="nav-btn" onclick="game.saveGame()"><span class="icon">💾</span><span>存檔</span></button>
        <button class="nav-btn" onclick="game.loadGame()"><span class="icon">📂</span><span>讀檔</span></button>
        <button class="nav-btn" onclick="game.ui.confirmRestart()"><span class="icon">🔄</span><span>重來</span></button>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal-content" id="modal-content"></div>
</div>

<div id="toast">提示訊息</div>

<script>
    // ==========================================
    // 音效管理模組
    // ==========================================
    const AudioManager = {
        ctx: null,
        init() {
            try {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            } catch (e) {
                console.warn("AudioContext not supported", e);
            }
        },
        playClick() {
            try {
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            } catch (e) {
                console.warn("Audio play failed", e);
            }
        },
        playSuccess() {
            try {
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const notes = [523.25, 659.25, 783.99]; 
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.1 + 0.2);
                    osc.start(this.ctx.currentTime + i * 0.1);
                    osc.stop(this.ctx.currentTime + i * 0.1 + 0.2);
                });
            } catch (e) {
                console.warn("Audio success play failed", e);
            }
        }
    };

    // ==========================================
    // 遊戲核心
    // ==========================================
    const game = {
        state: {
            currentNode: 'start',
            inventory: ['fife'],
            history: [],
            visitedNodes: new Set(),
            achievements: []
        },

        svgs: {
            road: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="background:#0a1a2a;">
                <defs><radialGradient id="moonGlow" cx="50%" cy="20%" r="30%"><stop offset="0%" stop-color="#f4e99a" stop-opacity="0.8"/><stop offset="100%" stop-color="#f4e99a" stop-opacity="0"/></radialGradient></defs>
                <rect width="100" height="100" fill="#0a1a2a"/>
                <circle cx="50" cy="20" r="30" fill="url(#moonGlow)"/>
                <circle cx="50" cy="20" r="8" fill="#f4e99a"/>
                <path d="M0,70 Q50,50 100,70 L100,100 L0,100 Z" fill="#2e4a2e"/>
                <path d="M40,50 L60,50 L70,100 L30,100 Z" fill="#3a2a1a" opacity="0.6"/>
            </svg>`,
            house: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="background:#0a1a2a;">
                <rect width="100" height="100" fill="#0a1a2a"/>
                <circle cx="80" cy="20" r="10" fill="#f4e99a" opacity="0.5"/>
                <rect x="25" y="45" width="50" height="40" fill="#5a3a2a" stroke="#111" stroke-width="1"/>
                <polygon points="20,45 50,20 80,45" fill="#8a2a2a" stroke="#111" stroke-width="1"/>
                <rect x="40" y="65" width="20" height="20" fill="#2a1a0a"/>
                <rect x="30" y="55" width="10" height="10" fill="#f4e99a" opacity="0.7"/>
                <rect x="60" y="55" width="10" height="10" fill="#f4e99a" opacity="0.7"/>
            </svg>`,
            battle: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="background:#2a1a1a;">
                <rect width="100" height="100" fill="#2a1a1a"/>
                <circle cx="50" cy="10" r="15" fill="#f4e99a" opacity="0.2"/>
                <rect x="0" y="60" width="100" height="40" fill="#4a3a2a"/>
                <path d="M0,60 Q30,40 60,60 Q80,50 100,60 L100,100 L0,100 Z" fill="#3a2a1a"/>
                <line x1="20" y1="20" x2="20" y2="60" stroke="#f4e99a" stroke-width="1" opacity="0.5"/>
                <line x1="80" y1="15" x2="80" y2="60" stroke="#f4e99a" stroke-width="1" opacity="0.5"/>
                <circle cx="20" cy="20" r="3" fill="#f4e99a" opacity="0.8"/>
                <circle cx="80" cy="15" r="3" fill="#f4e99a" opacity="0.8"/>
            </svg>`,
            ship: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="background:#0a1a2a;">
                <rect width="100" height="100" fill="#0a1a2a"/>
                <rect x="0" y="70" width="100" height="30" fill="#1a2a3a"/>
                <path d="M20,70 L80,70 L90,90 L10,90 Z" fill="#4a2a1a"/>
                <rect x="45" y="20" width="10" height="50" fill="#3a2a1a"/>
                <polygon points="45,20 45,50 75,40" fill="#d0d0d0" opacity="0.8"/>
                <circle cx="50" cy="15" r="4" fill="#f4e99a" opacity="0.6"/>
                <path d="M0,70 Q25,65 50,70 Q75,75 100,70" fill="none" stroke="#2a4a5a" stroke-width="2"/>
            </svg>`,
            musket: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="background:#1a2a3a;">
                <rect width="100" height="100" fill="#1a2a3a"/>
                <rect x="10" y="45" width="80" height="8" fill="#5a3a1a" transform="rotate(-10 50 50)"/>
                <path d="M15,35 L30,45 L25,55 L10,45 Z" fill="#6a4a2a" transform="rotate(-10 50 50)"/>
                <rect x="35" y="48" width="5" height="15" fill="#777" transform="rotate(-10 50 50)"/>
                <circle cx="80" cy="40" r="5" fill="#aaa" transform="rotate(-10 50 50)"/>
                <path d="M75,30 Q85,20 95,35 Q85,45 75,40 Z" fill="#8a4a2a"/>
            </svg>`,
            end: `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="background:#0a2a0a;">
                <rect width="100" height="100" fill="#0a2a0a"/>
                <rect x="0" y="60" width="100" height="40" fill="#2a4a2a"/>
                <path d="M0,60 Q50,30 100,60 L100,100 L0,100 Z" fill="#3a5a3a"/>
                <circle cx="50" cy="25" r="15" fill="#f4e99a" opacity="0.8"/>
                <circle cx="50" cy="25" r="20" fill="#f4e99a" opacity="0.2"/>
                <path d="M40,40 L60,40 L55,60 L45,60 Z" fill="#5a3a1a"/>
                <path d="M45,50 L55,50" stroke="#aaa" stroke-width="2"/>
            </svg>`
        },

        nodes: {
            'start': {
                chapter: '序幕：時光之旅',
                text: "你站在新英格蘭的鄉間小路上。夜已深，春天的涼風中瀰漫著甜美的氣息。你不確定美國革命是否已經開始。你手中拿著橫笛，背上有一個小袋子。時間機器提示你，出發前可以選擇攜帶一件物品。你要帶什麼？",
                image: 'road',
                choices: [
                    { text: "帶上一盒葡萄乾。", action: () => { game.state.inventory.push('raisins'); game.goTo('night_ride'); } },
                    { text: "帶上一把小刀。", action: () => { game.state.inventory.push('knife'); game.goTo('night_ride'); } },
                    { text: "帶上一面鏡子。", action: () => { game.state.inventory.push('mirror'); game.goTo('night_ride'); } }
                ]
            },
            'night_ride': {
                chapter: '第一章：夜行',
                text: "你沿著路走著，突然聽到了馬蹄聲。一個人影騎著馬飛馳而來。你爬上樹躲避，但樹枝斷裂，你摔了下來，正好砸在他的馬背上。他生氣地抓住你，但在月光下看清你的臉後，露出了驚訝的表情。「你！我從沒想過你會背叛我！」他喊道。你仔細一看，天啊，他是保羅·列維爾（Paul Revere）！",
                image: 'road',
                choices: [
                    { text: "解釋這是一場誤會。", action: () => game.goTo('revere_explain') },
                    { text: "趁他不注意，立刻進行時間跳躍。", action: () => game.goTo('tea_party') }
                ]
            },
            'revere_explain': {
                chapter: '第一章：夜行',
                text: "保羅·列維爾聽了你的解釋，情緒稍微緩和。但遠方傳來英軍巡邏隊的馬蹄聲。列維爾大喊：「英軍來了！」他邀請你一起前往克拉克牧師的農舍避難。",
                image: 'house',
                choices: [
                    { text: "跟隨列維爾前往農舍。", action: () => game.goTo('revere_house') },
                    { text: "拒絕並獨自跳躍到列克星敦。", action: () => game.goTo('lexington') }
                ]
            },
            'revere_house': {
                chapter: '第二章：農舍密會',
                text: "你們來到農舍，見到了約翰·亞當斯和約翰·漢考克。列維爾向他們報告了英軍的動向。為了不引起懷疑，你藉口去穀倉睡覺，並在穀倉裡進行了時間跳躍。",
                image: 'house',
                choices: [
                    { text: "跳躍到列克星敦戰場。", action: () => game.goTo('lexington') }
                ]
            },
            'tea_party': {
                chapter: '第一章：波士頓傾茶事件',
                text: "你跳躍到了波士頓港的一艘船上。周圍是打扮成印第安人的殖民者，他們正在把茶葉扔進海裡——波士頓傾茶事件！但他們發現了你這個不速之客，把你當成間諜扔下了船。",
                image: 'ship',
                choices: [
                    { text: "在水下進行時間跳躍，前往列克星敦。", action: () => game.goTo('lexington') }
                ]
            },
            'lexington': {
                chapter: '第三章：第一槍',
                text: "你來到列克星敦的戰場。英軍正在推進，民兵在集結。你看到一個金髮、鷹鉤鼻的年輕人，他的火槍上裝飾著火雞羽毛。他緊張地瞄準，卻遲遲不敢開槍。你試圖靠近他，但不小心絆倒，發出了巨大的聲響。年輕人嚇了一跳，手指一滑，扣動了扳機。「砰！」第一槍打響了！",
                image: 'battle',
                choices: [
                    { text: "跟著年輕人逃進樹林。", action: () => game.goTo('chase_josh') },
                    { text: "前往提康德羅加堡（Fort Ticonderoga）。", action: () => game.goTo('ticonderoga') }
                ]
            },
            'chase_josh': {
                chapter: '第四章：追尋',
                text: "年輕人跑得飛快，你沒能追上。但他很可能會出現在下一個主要戰場。你選擇跳躍到康科德（Concord）的哈特韋爾酒館附近。",
                image: 'house',
                choices: [
                    { text: "進入酒館躲避戰火。", action: () => game.goTo('tavern') }
                ]
            },
            'ticonderoga': {
                chapter: '第四章：提康德羅加堡',
                text: "你來到提康德羅加堡。伊桑·艾倫（Ethan Allen）和班尼迪克·阿諾德（Benedict Arnold）正在爭奪指揮權。你爬上一棵樹，用石頭砸暈了守衛，幫助他們輕鬆佔領了堡壘。但阿諾德懷疑你是間諜。",
                image: 'battle',
                choices: [
                    { text: "配合阿諾德的審問。", action: () => game.goTo('ticonderoga_wait') },
                    { text: "當面斥責阿諾德是叛徒。", action: () => game.goTo('ticonderoga_fail') }
                ]
            },
            'ticonderoga_fail': {
                chapter: '第五章：牢獄之災',
                text: "你指責阿諾德是叛徒，但此時他還是個愛國者。你被關進了禁閉室。你只能趁機跳躍到康科德。",
                image: 'battle',
                choices: [
                    { text: "跳躍到康科德。", action: () => game.goTo('tavern') }
                ]
            },
            'ticonderoga_wait': {
                chapter: '第五章：等待',
                text: "你成功說服了阿諾德，但他表示援軍要幾天才到。你等了三天，那個年輕人並沒有出現。你決定回到康科德。",
                image: 'battle',
                choices: [
                    { text: "跳躍到康科德。", action: () => game.goTo('tavern') }
                ]
            },
            'tavern': {
                chapter: '第六章：哈特韋爾酒館',
                text: "你在哈特韋爾酒館附近遇到了紅衫軍的交火。你躲進酒館，老闆讓你上樓照顧他的妻小。樓下傳來英軍砸門的聲音。",
                image: 'house',

        ui: {
            typingTimer: null,
            isTyping: false,
            fullText: '',
            currentOnComplete: null,

            render(nodeId) {
                const node = game.nodes[nodeId];
                if (!node) return;

                document.getElementById('chapter-title').innerText = node.chapter || '時間機器';
                this.renderInventory();

                const sceneImg = document.getElementById('scene-image');
                sceneImg.style.opacity = 0;
                setTimeout(() => {
                    sceneImg.innerHTML = game.svgs[node.image] || game.svgs.road;
                    sceneImg.style.opacity = 1;
                }, 200);

                const choicesContainer = document.getElementById('choices-container');
                choicesContainer.innerHTML = '';
                choicesContainer.style.opacity = 0;
                choicesContainer.style.pointerEvents = 'none';

                this.fullText = node.text;
                
                this.currentOnComplete = () => {
                    this.renderChoices(node);
                    choicesContainer.style.opacity = 1;
                    choicesContainer.style.pointerEvents = 'auto';
                };

                this.typeText(node.text, this.currentOnComplete);
            },

            renderChoices(node) {
                const choicesContainer = document.getElementById('choices-container');
                choicesContainer.innerHTML = '';
                node.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    if (node.isEnd) btn.classList.add('primary');
                    btn.innerText = choice.text;

                    if (choice.condition && !choice.condition()) {
                        btn.disabled = true;
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            AudioManager.playClick();
                            game.ui.showToast(choice.disabledMsg || '條件不足');
                        };
                    } else {
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            // 點擊時觸發對應的 action
                            choice.action();
                            AudioManager.playClick();
                        };
                    }
                    choicesContainer.appendChild(btn);
                });
            },

            typeText(text, onComplete) {
                const textElement = document.getElementById('story-text');
                textElement.innerText = '';
                this.isTyping = true;
                let i = 0;
                
                if (this.typingTimer) clearInterval(this.typingTimer);

                this.typingTimer = setInterval(() => {
                    if (i < text.length) {
                        textElement.innerText += text.charAt(i);
                        i++;
                        const container = document.getElementById('story-container');
                        container.scrollTop = container.scrollHeight;
                    } else {
                        clearInterval(this.typingTimer);
                        this.isTyping = false;
                        if (onComplete) onComplete();
                    }
                }, 25);
            },

            skipTyping() {
                if (!this.isTyping) return;
                clearInterval(this.typingTimer);
                this.isTyping = false;
                document.getElementById('story-text').innerText = this.fullText;
                if (this.currentOnComplete) this.currentOnComplete();
            },

            renderInventory() {
                const invBar = document.getElementById('inventory-bar');
                invBar.innerHTML = '';
                const count = document.getElementById('inventory-count');
                
                const itemMap = {
                    'fife': '🎵 橫笛',
                    'knife': '🔪 小刀',
                    'raisins': '🍇 葡萄乾',
                    'mirror': '🪞 鏡子'
                };

                game.state.inventory.forEach(item => {
                    const span = document.createElement('span');
                    span.className = 'item';
                    span.innerHTML = itemMap[item] || item;
                    invBar.appendChild(span);
                });

                count.innerText = `🎒 ${game.state.inventory.length}`;
            },

            showModal(type) {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                
                if (type === 'help') {
                    content.innerHTML = `
                        <h2>遊戲說明</h2>
                        <p><strong>任務目標：</strong>回到過去，查明打響美國革命第一槍的人，並將那把火槍帶回。</p>
                        <p><strong>守則：</strong></p>
                        <ul>
                            <li>不可殺死任何人或動物。</li>
                            <li>不可改變歷史。</li>
                            <li>不可帶走任何人。</li>
                        </ul>
                        <p>點擊故事文本可跳過打字動畫。系統會自動存檔。</p>
                        <button class="modal-close-btn" onclick="game.ui.closeModal()">開始冒險</button>
                    `;
                } else if (type === 'history') {
                    let historyHtml = '<h2>時間線回顧</h2><ul class="history-list">';
                    game.state.history.forEach((nodeId, index) => {
                        const node = game.nodes[nodeId];
                        if (node) {
                            historyHtml += `<li>${index + 1}. ${node.chapter}</li>`;
                        }
                    });
                    historyHtml += '</ul><button class="modal-close-btn" onclick="game.ui.closeModal()">關閉</button>';
                    content.innerHTML = historyHtml;
                } else if (type === 'confirmRestart') {
                    content.innerHTML = `
                        <h2>確認重新開始？</h2>
                        <p>目前的進度將會丟失。</p>
                        <button class="modal-close-btn" onclick="game.restart()" style="background:#8b1c1c;">確認重來</button>
                        <button class="modal-close-btn" onclick="game.ui.closeModal()" style="background:#555;">取消</button>
                    `;
                }
                
                overlay.style.display = 'flex';
            },

            closeModal() {
                document.getElementById('modal-overlay').style.display = 'none';
            },

            confirmRestart() {
                this.showModal('confirmRestart');
            },

            showToast(msg) {
                const toast = document.getElementById('toast');
                toast.innerText = msg;
                toast.style.opacity = 1;
                setTimeout(() => { toast.style.opacity = 0; }, 2500);
            }
        },

        goTo(nodeId) {
            this.state.currentNode = nodeId;
            this.state.history.push(nodeId);
            this.state.visitedNodes.add(nodeId);
            
            const node = this.nodes[nodeId];
            if (node.isEnd) {
                if (!this.state.achievements.includes(node.chapter)) {
                    this.state.achievements.push(node.chapter);
                }
                AudioManager.playSuccess();
            }

            this.ui.render(nodeId);
            this.saveGame(true);
        },

        restart() {
            this.state = {
                currentNode: 'start',
                inventory: ['fife'],
                history: [],
                visitedNodes: new Set(),
                achievements: this.state.achievements 
            };
            this.ui.closeModal();
            this.ui.render('start');
            this.saveGame(true);
        },

        saveGame(isAuto = false) {
            const saveData = {
                currentNode: this.state.currentNode,
                inventory: this.state.inventory,
                history: this.state.history,
                achievements: this.state.achievements
            };
            localStorage.setItem('timeMachineSave', JSON.stringify(saveData));
            if (!isAuto) {
                this.ui.showToast('遊戲已存檔！');
            }
        },

        loadGame() {
            const saved = localStorage.getItem('timeMachineSave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    this.state.currentNode = data.currentNode;
                    this.state.inventory = data.inventory;
                    this.state.history = data.history;
                    this.state.achievements = data.achievements || [];
                    this.ui.render(this.state.currentNode);
                    this.ui.showToast('遊戲已讀取！');
                } catch (e) {
                    this.ui.showToast('存檔損壞，無法讀取。');
                }
            } else {
                this.ui.showToast('沒有找到存檔。');
            }
        },

        init() {
            document.body.addEventListener('click', () => AudioManager.init(), { once: true });
            
            // 清除舊的測試存檔，避免干擾
            // localStorage.removeItem('timeMachineSave'); 

            const saved = localStorage.getItem('timeMachineSave');
            if (saved) {
                this.loadGame();
            } else {
                this.ui.render('start');
                this.ui.showModal('help');
            }
        }
    };

    window.onload = () => {
        game.init();
    };
</script>
