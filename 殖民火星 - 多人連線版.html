<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>殖民火星 - 多人連線版</title>
<!-- 引入 Firebase SDK v10 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, runTransaction, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ★★★ 請替換成你的 Firebase 設定 ★★★
    const firebaseConfig = {
        apiKey: "AIzaSyDol20mC72V7cXhF7higYVRYvg3WZZoXRo",
		authDomain: "klyhate-ad36a.firebaseapp.com",
		projectId: "klyhate-ad36a",
		storageBucket: "klyhate-ad36a.firebasestorage.app",
		messagingSenderId: "552820910195",
		appId: "1:552820910195:web:e08ee3b5ebb2dee8172206"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 暴露給全局使用
    window.FB = { auth, db, doc, setDoc, getDoc, updateDoc, onSnapshot, runTransaction, collection, query, where, getDocs, signInAnonymously, onAuthStateChanged };
</script>

<style>
    :root {
        --bg-color: #0a0a0f;
        --panel-bg: rgba(30, 20, 15, 0.95);
        --mars-red: #c1440e;
        --mars-orange: #d67a3a;
        --mars-green: #4caf50;
        --text-color: #e0e0e0;
        --font-main: 'Georgia', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { 
        background-color: var(--bg-color); color: var(--text-color); font-family: var(--font-main); 
        height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        background-image: radial-gradient(circle at center, #1a1512 0%, #000000 100%);
    }
    
    /* 大廳畫面 */
    #lobby-screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    #lobby-screen h1 { color: var(--mars-orange); font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 10px var(--mars-red); }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid var(--mars-orange); background: #222; color: white; text-align: center; }
    button { padding: 10px 20px; font-size: 16px; background: var(--mars-red); color: white; border: none; border-radius: 5px; cursor: pointer; font-family: var(--font-main); transition: 0.2s; }
    button:hover { background: var(--mars-orange); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 遊戲畫面 */
    #game-screen { display: none; flex: 1; flex-direction: column; height: 100%; }
    #top-bar { display: flex; justify-content: space-between; padding: 10px; background: var(--panel-bg); border-bottom: 2px solid var(--mars-red); }
    #player-list { display: flex; gap: 15px; overflow-x: auto; padding: 10px; background: rgba(0,0,0,0.5); }
    .player-card { padding: 10px; border: 1px solid #555; border-radius: 5px; min-width: 150px; font-size: 12px; background: #222; }
    .player-card.active { border-color: var(--mars-orange); box-shadow: 0 0 10px var(--mars-orange); }
    .player-card.me { border-color: var(--mars-green); }
    
    #board-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; }
    #mars-board { position: relative; }
    .hex { position: absolute; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); background-color: #8c5a48; transform: scale(0.95); display: flex; justify-content: center; align-items: center; font-size: 10px; color: white; transition: 0.2s; }
    .hex.ocean { background-color: #2196f3; }
    .hex.forest { background-color: #4caf50; }
    .hex.city { background-color: #757575; }
    
    #action-area { height: 250px; background: var(--panel-bg); border-top: 2px solid var(--mars-orange); display: flex; flex-direction: column; padding: 10px; }
    #hand-cards { display: flex; gap: 10px; flex: 1; overflow-x: auto; align-items: center; }
    .card { flex: 0 0 120px; height: 160px; background: #2c3e50; border: 2px solid #555; border-radius: 5px; padding: 5px; display: flex; flex-direction: column; cursor: pointer; font-size: 11px; }
    .card:hover { transform: translateY(-5px); border-color: var(--mars-orange); }
    .card .title { font-weight: bold; text-align: center; margin-bottom: 5px; }
    .card .cost { color: gold; }
    
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--mars-red); color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 999; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- 大廳 -->
<div id="lobby-screen">
    <h1>🚀 火星改造計畫</h1>
    <p id="auth-status" style="margin-bottom: 20px; color: #aaa;">正在連線至伺服器...</p>
    
    <div id="lobby-actions" style="display: none; flex-direction: column; gap: 15px; align-items: center;">
        <div class="input-group">
            <input type="text" id="player-name" placeholder="輸入你的名字" maxlength="8">
            <button onclick="createRoom()">建立新房間</button>
        </div>
        <div class="input-group">
            <input type="text" id="room-id-input" placeholder="輸入 6 位數房間碼" maxlength="6">
            <button onclick="joinRoom()">加入房間</button>
        </div>
    </div>
</div>

<!-- 遊戲主畫面 -->
<div id="game-screen">
    <div id="top-bar">
        <div>世代: <b id="ui-gen">1</b>/14 | 階段: <b id="ui-phase">等待開始</b></div>
        <div>氧氣: <b id="ui-oxy">0</b>% | 溫度: <b id="ui-temp">-30</b>°C | 海洋: <b id="ui-ocean">0</b>/9</div>
        <div>房間碼: <b id="ui-room">------</b> (大廳等待中...)</div>
    </div>
    
    <div id="player-list"></div>
    
    <div id="board-area">
        <div id="mars-board"></div>
    </div>
    
    <div id="action-area">
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between;">
            <span id="turn-indicator" style="color: var(--mars-orange); font-weight: bold;">等待其他玩家加入...</span>
            <div>
                <button id="btn-start" onclick="startGame()" style="display: none;">開始遊戲</button>
                <button id="btn-pass" onclick="passTurn()" style="display: none;">結束回合</button>
            </div>
        </div>
        <div id="hand-cards"></div>
    </div>
</div>

<script type="module">
    // 等待 window.FB 載入
    setTimeout(initApp, 1000);

    let currentUser = null;
    let myName = "";
    let currentRoomId = "";
    let roomData = null;
    let unsubscribeRoom = null;

    // --- 初始化與認證 ---
    function initApp() {
        if (!window.FB) { setTimeout(initApp, 500); return; }
        const { auth, signInAnonymously, onAuthStateChanged } = window.FB;
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-status').innerText = "已連線，請輸入名字";
                document.getElementById('lobby-actions').style.display = 'flex';
            } else {
                signInAnonymously(auth).catch(err => alert("登入失敗: " + err.message));
            }
        });
    }

    // --- 房間邏輯 ---
    window.createRoom = async function() {
        const name = document.getElementById('player-name').value.trim();
        if (!name) return alert("請輸入名字");
        myName = name;
        
        const roomId = Math.floor(100000 + Math.random() * 900000).toString();
        const { db, doc, setDoc } = window.FB;
        
        const initialRoomData = {
            hostId: currentUser.uid,
            status: 'lobby',
            gen: 1,
            phase: 'lobby',
            turnIndex: 0,
            oxygen: 0,
            temp: -30,
            oceans: 0,
            players: [{
                id: currentUser.uid,
                name: name,
                mc: 14, steel: 0, titan: 0, plant: 0, energy: 0, heat: 0,
                tr: 14,
                passed: false,
                hand: []
            }]
        };
        
        await setDoc(doc(db, "rooms", roomId), initialRoomData);
        enterRoom(roomId);
    }

    window.joinRoom = async function() {
        const name = document.getElementById('player-name').value.trim();
        const roomId = document.getElementById('room-id-input').value.trim();
        if (!name || !roomId) return alert("請輸入名字與房間碼");
        myName = name;

        const { db, doc, getDoc, updateDoc } = window.FB;
        const roomRef = doc(db, "rooms", roomId);
        const roomSnap = await getDoc(roomRef);

        if (!roomSnap.exists()) return alert("找不到房間！");
        const data = roomSnap.data();
        
        if (data.status !== 'lobby') return alert("遊戲已經開始了！");
        if (data.players.length >= 4) return alert("房間已滿 (最多 4 人)");
        if (data.players.find(p => p.name === name)) return alert("名字重複，請換一個");

        const newPlayer = {
            id: currentUser.uid,
            name: name,
            mc: 14, steel: 0, titan: 0, plant: 0, energy: 0, heat: 0,
            tr: 14,
            passed: false,
            hand: []
        };

        await updateDoc(roomRef, {
            players: [...data.players, newPlayer]
        });
        
        enterRoom(roomId);
    }

    function enterRoom(roomId) {
        currentRoomId = roomId;
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('ui-room').innerText = roomId;

        const { db, doc, onSnapshot } = window.FB;
        unsubscribeRoom = onSnapshot(doc(db, "rooms", roomId), (docSnap) => {
            if (docSnap.exists()) {
                roomData = docSnap.data();
                renderGame();
            }
        });
    }

    // --- 遊戲核心邏輯 ---
    window.startGame = async function() {
        if (roomData.hostId !== currentUser.uid) return alert("只有房主能開始遊戲");
        const { db, doc, updateDoc } = window.FB;
        
        // 發初始手牌給所有人
        let updatedPlayers = roomData.players.map(p => {
            p.hand = [generateCard(), generateCard()];
            return p;
        });

        await updateDoc(doc(db, "rooms", currentRoomId), {
            status: 'playing',
            phase: 'action',
            players: updatedPlayers
        });
    }

    window.passTurn = async function() {
        const { db, doc, runTransaction } = window.FB;
        const roomRef = doc(db, "rooms", currentRoomId);

        await runTransaction(db, async (transaction) => {
            const roomDoc = await transaction.get(roomRef);
            const data = roomDoc.data();
            const currentIdx = data.turnIndex;
            
            if (data.players[currentIdx].id !== currentUser.uid) throw "還沒輪到你！";

            let players = [...data.players];
            let nextIdx = currentIdx;
            let allPassed = true;

            // 標記當前玩家 Pass
            players[currentIdx].passed = true;

            // 尋找下一個未 Pass 的玩家
            for (let i = 1; i <= players.length; i++) {
                let checkIdx = (currentIdx + i) % players.length;
                if (!players[checkIdx].passed) {
                    nextIdx = checkIdx;
                    allPassed = false;
                    break;
                }
            }

            if (allPassed) {
                // 所有人 Pass，進入生產階段
                players = players.map(p => {
                    p.mc += p.tr; // 薪水
                    p.passed = false; // 重置
                    return p;
                });
                
                // 判斷遊戲結束
                if (data.gen >= 14) {
                    transaction.update(roomRef, { status: 'ended', phase: 'ended', players: players });
                    return;
                }

                transaction.update(roomRef, {
                    gen: data.gen + 1,
                    turnIndex: 0,
                    players: players
                });
            } else {
                transaction.update(roomRef, {
                    turnIndex: nextIdx,
                    players: players
                });
            }
        }).catch(e => alert(e));
    }

    window.playCard = async function(cardIndex) {
        const me = roomData.players.find(p => p.id === currentUser.uid);
        const currentTurnPlayer = roomData.players[roomData.turnIndex];
        
        if (me.id !== currentTurnPlayer.id) return alert("還沒輪到你！");
        
        const card = me.hand[cardIndex];
        if (me.mc < card.cost) return alert("金錢不足！");

        const { db, doc, runTransaction } = window.FB;
        const roomRef = doc(db, "rooms", currentRoomId);

        await runTransaction(db, async (transaction) => {
            const roomDoc = await transaction.get(roomRef);
            const data = roomDoc.data();
            let players = [...data.players];
            let pIndex = players.findIndex(p => p.id === currentUser.uid);
            
            // 扣錢、移除卡片
            players[pIndex].mc -= card.cost;
            players[pIndex].hand.splice(cardIndex, 1);

            // 執行卡片效果 (簡化版)
            let newTemp = data.temp;
            let newOxy = data.oxygen;
            let newOceans = data.oceans;

            if (card.effect === 'temp') newTemp += 1;
            if (card.effect === 'ocean') newOceans += 1;
            if (card.effect === 'forest') newOxy += 1;

            transaction.update(roomRef, {
                players: players,
                temp: newTemp,
                oxygen: newOxy,
                oceans: newOceans
            });
        }).catch(e => alert(e));
    }

    function generateCard() {
        const pool = [
            { name: "小行星", cost: 14, effect: "temp", text: "溫度+1" },
            { name: "水資源", cost: 18, effect: "ocean", text: "海洋+1" },
            { name: "自然保護區", cost: 23, effect: "forest", text: "氧氣+1" },
            { name: "發電廠", cost: 11, effect: "none", text: "無效果(測試用)" }
        ];
        return pool[Math.floor(Math.random() * pool.length)];
    }

    // --- UI 渲染 ---
    function renderGame() {
        if (!roomData) return;

        // 頂部資訊
        document.getElementById('ui-gen').innerText = roomData.gen;
        document.getElementById('ui-phase').innerText = roomData.phase === 'lobby' ? '等待開始' : '行動階段';
        document.getElementById('ui-oxy').innerText = roomData.oxygen;
        document.getElementById('ui-temp').innerText = roomData.temp;
        document.getElementById('ui-ocean').innerText = roomData.oceans;

        // 大廳按鈕控制
        const isHost = roomData.hostId === currentUser.uid;
        const btnStart = document.getElementById('btn-start');
        btnStart.style.display = (roomData.status === 'lobby' && isHost) ? 'inline-block' : 'none';
        
        const btnPass = document.getElementById('btn-pass');
        btnPass.style.display = (roomData.status === 'playing') ? 'inline-block' : 'none';

        // 玩家列表
        const pList = document.getElementById('player-list');
        pList.innerHTML = '';
        roomData.players.forEach((p, idx) => {
            const isTurn = idx === roomData.turnIndex;
            const isMe = p.id === currentUser.uid;
            const div = document.createElement('div');
            div.className = `player-card ${isTurn ? 'active' : ''} ${isMe ? 'me' : ''}`;
            div.innerHTML = `
                <div style="font-weight:bold; color:${isMe?'var(--mars-green)':'white'}">${p.name} ${isTurn?'👈':''}</div>
                <div>金幣: ${p.mc} | TR: ${p.tr}</div>
                <div>手牌: ${p.hand.length} 張</div>
            `;
            pList.appendChild(div);
        });

        // 回合指示
        if (roomData.status === 'playing') {
            const turnP = roomData.players[roomData.turnIndex];
            document.getElementById('turn-indicator').innerText = `現在輪到：${turnP.name}`;
        } else {
            document.getElementById('turn-indicator').innerText = `等待房主開始遊戲 (人數: ${roomData.players.length}/4)`;
        }

        // 手牌渲染
        const me = roomData.players.find(p => p.id === currentUser.uid);
        const handArea = document.getElementById('hand-cards');
        handArea.innerHTML = '';
        
        if (me && roomData.status === 'playing') {
            me.hand.forEach((card, i) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <div class="title">${card.name}</div>
                    <div class="cost">💰 ${card.cost}</div>
                    <div style="font-size:10px; margin-top:5px; color:#aaa;">${card.text}</div>
                `;
                el.onclick = () => playCard(i);
                handArea.appendChild(el);
            });
        }
        
        renderBoard();
    }

    // 簡單繪製地圖方塊
    function renderBoard() {
        const boardEl = document.getElementById('mars-board');
        if(boardEl.children.length === 0) {
            // 初始化 9x9 矩陣
            const w = 40; const h = 46;
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    // 只畫邊界內
                    if((r===0||r===8) && (c<2||c>6)) continue;
                    if((r===1||r===7) && (c<1||c>7)) continue;
                    if((r===2||r===6) && (c===8)) continue;
                    
                    const hex = document.createElement('div');
                    hex.className = 'hex';
                    hex.style.width = w+'px';
                    hex.style.height = h+'px';
                    const xOff = (r%2)*(w/2);
                    hex.style.left = (c*w + xOff) + 'px';
                    hex.style.top = (r*(h*0.75)) + 'px';
                    boardEl.appendChild(hex);
                }
            }
            boardEl.style.width = '400px';
            boardEl.style.height = '350px';
            boardEl.style.transform = 'scale(1.5)';
        }

        // 更新顏色 (簡化為隨機擺放海洋與綠化)
        const hexes = boardEl.children;
        // 這裡僅作視覺演示，實際遊戲需要座標紀錄
        for(let i=0; i<roomData.oceans && i<hexes.length; i++) hexes[i].classList.add('ocean');
        for(let i=0; i<roomData.oxygen && i<hexes.length; i++) hexes[hexes.length-1-i].classList.add('forest');
    }
</script>
</body>
</html>
