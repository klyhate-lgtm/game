<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9b896">
<title>六角荒野探索 · 世界地圖工具箱 v5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU","MingLiU",serif;background:#b9a880;color:#2b1d0e;user-select:none;touch-action:manipulation}
#app{position:relative;height:100dvh;max-width:900px;margin:0 auto;display:grid;grid-template-rows:auto auto 1fr auto auto auto;overflow:hidden;background:radial-gradient(ellipse at 50% 28%,#f7eed7 0%,#e9d9b5 42%,#cdb98f 100%)}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:60;box-shadow:inset 0 0 120px rgba(70,48,20,.45),inset 0 0 18px rgba(70,48,20,.35)}
#hud{position:relative;z-index:10;padding:6px 7px 5px;background:linear-gradient(#f3e7c9,#e2d0a6);border-bottom:2px solid rgba(90,70,50,.4);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hud-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.stat{display:flex;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:700;white-space:nowrap;padding:3px 1px;border-radius:6px;background:rgba(255,255,255,.28);border:1px solid rgba(120,95,60,.25)}
.stat .ico{font-size:11px;line-height:1}
.stat.low{background:rgba(200,60,40,.28);border-color:rgba(160,40,20,.5);color:#6b1408}
.stat.warn{background:rgba(220,160,30,.3);border-color:rgba(160,110,20,.5);color:#6b3f08}
@media(max-width:380px){.stat{font-size:8.5px;padding:2px 0}.stat .ico{font-size:9.5px}}
#statusbar{position:relative;z-index:10;display:flex;gap:5px;align-items:center;justify-content:center;padding:3px 7px;background:linear-gradient(#e9d9b3,#dcc99f);border-bottom:1px solid rgba(120,95,60,.3);font-size:11px;font-weight:700;color:#4a3418;flex-wrap:wrap}
#statusbar .pill{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:12px;background:rgba(255,255,255,.38);border:1px solid rgba(120,95,60,.3)}
#statusbar .pill button{font-family:inherit;font-size:10px;font-weight:700;background:rgba(184,134,11,.25);border:1px solid rgba(140,100,30,.4);padding:1px 5px;border-radius:8px;cursor:pointer;color:#4a3418;margin-left:3px}
#mapwrap{position:relative;z-index:5;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px}
#map{width:100%;height:100%;display:block;overflow:visible}
.hexpoly{stroke:rgba(58,40,18,.5);stroke-width:1.4;transition:fill .35s ease}
.hexpoly.reachable{cursor:pointer;stroke:#a8802c;stroke-width:2}
.hexpoly.reachable:hover{filter:brightness(1.13);stroke:#d4a017;stroke-width:3}
.hexpoly.blocked{cursor:not-allowed}
.hex-icon{pointer-events:none;font-size:20px;dominant-baseline:central;text-anchor:middle}
.hex-fog{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-size:16px;fill:rgba(255,240,200,.35)}
.hex-label{pointer-events:none;text-anchor:middle;dominant-baseline:central;font-size:7.5px;fill:rgba(40,26,10,.75);font-weight:700}
.poi-badge{pointer-events:none}
.road-mark{pointer-events:none;stroke:rgba(110,80,40,.55);stroke-width:2.5;stroke-dasharray:5 4;fill:none}
.player-hex{pointer-events:none;animation:playerPulse 2s ease-in-out infinite}
@keyframes playerPulse{0%,100%{opacity:.55}50%{opacity:1}}
.exped-path{pointer-events:none;stroke:#d4a017;stroke-width:3;stroke-dasharray:8 4;fill:none;opacity:.7}
#logbar{position:relative;z-index:10;max-height:54px;overflow-y:auto;padding:4px 9px;font-size:11.5px;line-height:1.4;background:linear-gradient(rgba(245,236,214,.92),rgba(232,218,186,.92));border-top:1px solid rgba(120,95,60,.35);border-bottom:1px solid rgba(120,95,60,.35);color:#3a2810}
#logbar .lg{padding:1px 0;animation:logIn .3s ease}
#logbar .lg:first-child{font-weight:700}
@keyframes logIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#actions{position:relative;z-index:10;display:flex;gap:5px;padding:7px 8px;background:linear-gradient(#e7d6b0,#d6c294)}
.act{flex:1;font-family:inherit;font-size:11.5px;font-weight:700;padding:9px 2px;border-radius:9px;cursor:pointer;color:#2b1d0e;background:linear-gradient(#fbf3dd,#e3cfa4);border:2px solid #94723f;box-shadow:0 3px 0 #7c5c2e,0 4px 8px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.act:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.act:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #7c5c2e,0 2px 5px rgba(0,0,0,.2)}
.act:disabled{opacity:.42;cursor:not-allowed;box-shadow:0 3px 0 #7c5c2e}
.act.active{background:linear-gradient(#e8c97a,#c9a227);border-color:#8a6d12}
#nav{position:relative;z-index:10;display:grid;grid-template-columns:repeat(7,1fr);background:linear-gradient(#dcc99c,#c4ad7c);border-top:2px solid #94723f;padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{font-family:inherit;background:none;border:none;cursor:pointer;padding:6px 1px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;color:#3a2810;transition:background .15s}
#nav button span{font-size:8px;font-weight:700;letter-spacing:.2px}
#nav button:active{background:rgba(150,120,70,.3)}
#nav button:disabled{opacity:.4}
.modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(22,14,5,.66);display:flex;align-items:center;justify-content:center;padding:14px;animation:fadeIn .22s ease;backdrop-filter:blur(2px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:540px;max-height:86dvh;overflow-y:auto;background:linear-gradient(#f9f1dc,#e9d9b6);border:2px solid #8b6f47;border-radius:12px;box-shadow:0 14px 44px rgba(0,0,0,.55),inset 0 0 46px rgba(180,140,80,.22);padding:18px 16px 14px;animation:popIn .26s cubic-bezier(.2,1.4,.5,1)}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 9px;font-size:17px;letter-spacing:1px;text-align:center;color:#5a3a12;border-bottom:1px solid rgba(140,110,70,.4);padding-bottom:8px}
.modal-icon{font-size:40px;text-align:center;line-height:1;margin:2px 0 9px}
.modal-text{font-size:13.5px;line-height:1.8;color:#33230f;margin:0 0 12px;min-height:1.8em}
.modal-buttons{display:flex;flex-direction:column;gap:8px;margin-top:5px}
.mbtn{font-family:inherit;font-size:13.5px;font-weight:700;padding:11px 12px;border-radius:9px;cursor:pointer;color:#2b1d0e;text-align:center;background:linear-gradient(#fdf6e2,#e6d2a6);border:2px solid #94723f;box-shadow:0 3px 0 #7c5c2e;transition:transform .08s,box-shadow .08s,filter .15s}
.mbtn:hover:not(:disabled){filter:brightness(1.06)}
.mbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #7c5c2e}
.mbtn:disabled{opacity:.45;cursor:not-allowed}
.mbtn.primary{background:linear-gradient(#e8c97a,#c9a227);border-color:#8a6d12;color:#2b1d0e;box-shadow:0 3px 0 #8a6d12}
.mbtn.danger{background:linear-gradient(#e8b4a0,#c96b4a);border-color:#8f3b21;box-shadow:0 3px 0 #8f3b21}
.doc h3{font-size:14px;margin:14px 0 5px;color:#7a4a10;border-left:4px solid #b8860b;padding-left:7px;letter-spacing:.4px}
.doc p,.doc li{font-size:12.5px;line-height:1.8;color:#33230f;margin:4px 0}
.doc ul,.doc ol{padding-left:18px;margin:4px 0}
.doc .hl{background:rgba(184,134,11,.2);padding:1px 4px;border-radius:4px;font-weight:700;color:#6b3f08}
.doc .tip{background:rgba(120,160,90,.16);border-left:4px solid #6d8f4a;padding:7px 10px;border-radius:0 7px 7px 0;margin:8px 0;font-size:12px;line-height:1.75}
.doc .warn{background:rgba(200,90,50,.14);border-left:4px solid #b05a30;padding:7px 10px;border-radius:0 7px 7px 0;margin:8px 0;font-size:12px;line-height:1.75}
.doc .info{background:rgba(80,130,180,.14);border-left:4px solid #4a7aa8;padding:7px 10px;border-radius:0 7px 7px 0;margin:8px 0;font-size:12px;line-height:1.75}
.doc table{width:100%;border-collapse:collapse;margin:7px 0;font-size:11.5px}
.doc th,.doc td{border:1px solid rgba(140,110,70,.45);padding:4px 6px;text-align:left}
.doc th{background:rgba(184,134,11,.16);font-weight:700;color:#5a3a12}
.list-item{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;margin:5px 0;border-radius:8px;background:rgba(255,255,255,.34);border:1px solid rgba(140,110,70,.28);font-size:12px;line-height:1.55}
.list-item .li-ico{font-size:17px;line-height:1.3;flex:none}
.list-item .li-main{flex:1}
.list-item .li-title{font-weight:700;color:#5a3a12}
.list-item .li-sub{font-size:10.5px;color:#6b5232;margin-top:1px}
.list-item.locked{opacity:.45;filter:grayscale(.7)}
.list-item.done{background:rgba(120,160,90,.18);border-color:rgba(90,130,60,.4)}
#toast-root{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:7px;pointer-events:none;width:max-content;max-width:88vw}
.toast{background:rgba(46,30,10,.94);color:#f7ecd2;padding:9px 16px;border-radius:22px;font-size:12.5px;font-weight:700;text-align:center;border:1px solid rgba(200,160,80,.6);box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toastIn .28s ease,toastOut .28s ease 2.5s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.96)}}
.skill-bar{display:flex;align-items:center;gap:5px;margin:4px 0;font-size:12px}
.skill-bar .name{width:44px;font-weight:700;color:#5a3a12}
.skill-bar .pips{display:flex;gap:2px}
.skill-bar .pip{width:14px;height:14px;border-radius:3px;background:rgba(140,110,70,.25);border:1px solid rgba(120,95,60,.4)}
.skill-bar .pip.on{background:linear-gradient(#e8c97a,#c9a227);border-color:#8a6d12}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(140,110,70,.5);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="stat" id="stat-hp"><span class="ico">❤️</span><span class="val">20/20</span></div>
      <div class="stat" id="stat-sup"><span class="ico">🎒</span><span class="val">10/15</span></div>
      <div class="stat" id="stat-day"><span class="ico">📅</span><span class="val">1/40</span></div>
      <div class="stat" id="stat-xp"><span class="ico">⭐</span><span class="val">0</span></div>
      <div class="stat" id="stat-relic"><span class="ico">🏛️</span><span class="val">0/3</span></div>
      <div class="stat" id="stat-dist"><span class="ico">📏</span><span class="val">0mi</span></div>
      <div class="stat" id="stat-skill"><span class="ico">🎯</span><span class="val">4</span></div>
    </div>
  </header>

  <div id="statusbar">
    <span class="pill" id="pill-weather">☀️ 晴天</span>
    <span class="pill" id="pill-season">🌸 春 15°C</span>
    <span class="pill" id="pill-transport">🚶 步行 <button id="btn-transport">切換</button></span>
    <span class="pill" id="pill-weight">⚖️ 10/15</span>
  </div>

  <div id="mapwrap"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <div id="logbar"><div class="lg">荒野在等著你……</div></div>

  <div id="actions">
    <button class="act" id="btn-camp">🏕️ 紮營</button>
    <button class="act" id="btn-look">🧭 觀察</button>
    <button class="act" id="btn-seed">🌱 播種</button>
    <button class="act" id="btn-exped">🐴 遠征</button>
  </div>

  <nav id="nav">
    <button data-act="help">📖<span>說明</span></button>
    <button data-act="quests">📋<span>任務</span></button>
    <button data-act="save">💾<span>存檔</span></button>
    <button data-act="load">📂<span>讀檔</span></button>
    <button data-act="history">📜<span>歷史</span></button>
    <button data-act="achv">🏆<span>成就</span></button>
    <button data-act="settings">⚙️<span>設定</span></button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';
/* ==================================================================
   六角荒野探索 v5 —— 目錄全覆蓋版
   依據《FlexTale: Hexcrawl Adventure Toolkit》(J. Evans Payne, 2023)
   ================================================================== */

const HEX_SIZE=46, MAP_RADIUS=3, MAX_DAYS=40, RELICS_NEEDED=3;
const SAVE_KEY='hexcrawl_save_v5', ACHV_KEY='hexcrawl_achv_v5', END_KEY='hexcrawl_endings_v5';
const HEX_DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const HEX_SIZES=[{mi:3,label:'3 英里（小型區域）'},{mi:6,label:'6 英里（鄉野）'},{mi:12,label:'12 英里（預設）'},{mi:24,label:'24 英里（大陸）'}];

/* 地形（p81） */
const TERRAIN={
  plain:    {name:'平原',icon:'🌾',color:'#c9d99c',stroke:'#93a86b',passable:true,extra:0,hard:false,xp:2},
  forest:   {name:'森林',icon:'🌲',color:'#8cb368',stroke:'#5c7c40',passable:true,extra:0,hard:false,xp:3},

  water:    {name:'水域',icon:'🌊',color:'#7cb2d6',stroke:'#48799c',passable:false,extra:0,hard:false,xp:0}
};
const WEATHER={
  clear:   {name:'晴天',  icon:'☀️', visPenalty:0, supplyPenalty:0, lostBonus:0,   encBonus:0},
  cloudy:  {name:'多雲',  icon:'⛅', visPenalty:0, supplyPenalty:0, lostBonus:0,   encBonus:0},

};
const SEASONS={

  summer:{name:'夏',icon:'☀️',tempMod:10, stormMod:5},
  autumn:{name:'秋',icon:'🍂',tempMod:-5, stormMod:0},
  winter:{name:'冬',icon:'❄️',tempMod:-15,stormMod:10}
};
const POI_DEFS={
  settlement:{icon:'🏘️',name:'聚落'},monstrous:{icon:'🐉',name:'怪物巢穴'},npc:{icon:'👤',name:'NPC'},
  divine:{icon:'⛪',name:'神性場所'},military:{icon:'⚔️',name:'軍事據點'},factional:{icon:'🏴',name:'派系基地'},
  magical:{icon:'✨',name:'魔法遺跡'},geographic:{icon:'🗿',name:'地理奇觀'},adventure:{icon:'🗺️',name:'冒險之地'},
  landmark:{icon:'🗼',name:'地標'},minor:{icon:'🌿',name:'次要特徵'},ruin:{icon:'🏛️',name:'遠古遺跡'}
};
/* 表 5：基礎六角變更解釋（p35） */
const HEX_CHANGE_EXPLANATIONS=[
  {min:1,max:4,key:'mystery',label:'無解釋／謎團'},
  {min:5,max:8,key:'dead',label:'先前內容已死亡／被摧毀'},
  {min:9,max:12,key:'invade',label:'新內容入侵／蠶食'},
  {min:13,max:15,key:'transitory',label:'舊內容為短暫存在'},
  {min:16,max:16,key:'new_illusion',label:'新內容為幻象'},
  {min:17,max:17,key:'old_illusion',label:'舊內容為幻象'},
  {min:18,max:18,key:'coexist',label:'新舊共存'},
  {min:19,max:19,key:'compete',label:'新舊競爭'},
  {min:20,max:20,key:'quest',label:'與某項任務相關'}
];
/* 表 6：基礎六角變更（p35） */
const HEX_CHANGE_TABLE=[
  {min:1,max:3,key:'persist_visit',label:'內容在本次造訪中保持'},
  {min:4,max:6,key:'persist_then_regen',label:'保持 1 次造訪，然後重生成'},
  {min:7,max:8,key:'persist_then_vanish',label:'保持 1 次造訪，隨後蒸發'},
  {min:9,max:9,key:'persist_watch_vanish',label:'保持 1 次造訪，目睹其蒸發'},
  {min:10,max:12,key:'change_next',label:'下次造訪時改變'},
  {min:13,max:13,key:'change_now',label:'本次造訪即改變'},
  {min:14,max:14,key:'vanish_first',label:'首次造訪期間蒸發'},
  {min:15,max:20,key:'perpetual',label:'永久保持'}
];
/* 技能（p357，基於目錄推演） */
const SKILLS={
  survival:  {name:'生存', icon:'🌿', desc:'覓食、辨識植物、避免迷路'},
  navigation:{name:'導航', icon:'🧭', desc:'判斷方向、避免迷路'},

  athletics: {name:'運動', icon:'💪', desc:'攀爬、游泳、跳躍'}
};
const ACHIEVEMENTS=[
  {id:'first_step',icon:'👣',name:'初次踏入荒野',desc:'完成第一次移動'},
  {id:'first_relic',icon:'🏛️',name:'遺跡探險家',desc:'找到第一座遠古遺跡'},
  {id:'win',icon:'👑',name:'荒野征服者',desc:'成功找到三座遠古遺跡'},
  {id:'death',icon:'💀',name:'長眠荒野',desc:'生命值歸零'},
  {id:'timeout',icon:'⏳',name:'時光飛逝',desc:'超過 40 天仍未完成'},
  {id:'explorer',icon:'🗺️',name:'製圖師',desc:'探索 15 個以上的六角格'},
  {id:'settlement',icon:'🏘️',name:'友好訪客',desc:'造訪一座聚落'},
  {id:'survivor',icon:'🍖',name:'堅毅旅人',desc:'在補給為 0 的狀態下繼續旅行'},
  {id:'hexchange',icon:'🔄',name:'世事無常',desc:'首次見證六角變更'},
  {id:'weather',icon:'🌦️',name:'風雨同行',desc:'在暴風雨中移動'},
  {id:'seed',icon:'🌱',name:'播種者',desc:'使用播種功能'},
  {id:'change_mind',icon:'💭',name:'改變主意',desc:'在遊戲中切換設計時/遊戲時'},
  {id:'sanity',icon:'🧠',name:'合理性檢查',desc:'觸發六角變更的合理性檢查'},
  {id:'quest_first',icon:'📋',name:'任務達人',desc:'完成第一個支線任務'},
  {id:'rumor',icon:'🗣️',name:'耳語收集者',desc:'收集 5 條傳聞'},

/* 工具 */
const $=s=>document.querySelector(s);
const d20=()=>1+Math.floor(Math.random()*20);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hexKey=(q,r)=>q+','+r;
const hexDistance=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.q+a.r-b.q-b.r)+Math.abs(a.r-b.r))/2;
function hexToPixel(q,r){return{x:HEX_SIZE*Math.sqrt(3)*(q+r/2),y:HEX_SIZE*1.5*r};}
function hexPoints(cx,cy,size){
  const pts=[];
  for(let i=0;i<6;i++){const a=Math.PI/180*(60*i+30);pts.push(`${(cx+size*Math.cos(a)).toFixed(2)},${(cy+size*Math.sin(a)).toFixed(2)}`);}
  return pts.join(' ');
}
/* 技能檢定 */
function skillCheck(skill,dc){
  const level=state.skills[skill]||1;
  const roll=d20();
  const total=roll+level;
  return {roll,level,total,success:total>=dc,dc};
}

function ensureAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function tone(freq,dur,type,vol){if(!state.soundOn)return;const ctx=ensureAudio();if(!ctx)return;const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=type||'sine';osc.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(vol||0.05,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+dur+0.02);}
const SFX={
  click(){tone(660,0.06,'triangle',0.045);},
  move(){tone(440,0.10,'sine',0.05);setTimeout(()=>tone(620,0.09,'sine',0.04),70);},
  good(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,0.14,'triangle',0.05),i*80));},
  bad(){tone(180,0.22,'sawtooth',0.05);setTimeout(()=>tone(120,0.28,'sawtooth',0.045),120);},
  relic(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'sine',0.055),i*110));},
  win(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.26,'triangle',0.06),i*130));},
  weather(){tone(380,0.15,'sine',0.04);setTimeout(()=>tone(300,0.2,'sine',0.035),100);},
  seed(){[392,523,659].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'sine',0.045),i*90));},
  quest(){[659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.05),i*100));}
};

function toast(msg,ms){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toast-root').appendChild(el);setTimeout(()=>el.remove(),ms||2800);}
function addLog(msg){state.log.push({day:state.day,msg});if(state.log.length>120)state.log.shift();renderLog();}
function renderLog(){const box=$('#logbar');const last=state.log.slice(-14).reverse();box.innerHTML=last.map(l=>`<div class="lg">${l.msg}</div>`).join('')||'<div class="lg">荒野在等著你……</div>';box.scrollTop=0;}

/* 世界生成 */
function rollTerrain(dist){const w=[['plain',30],['forest',26],['hill',16],['mountain',6+dist*3],['swamp',8],['desert',5+dist*2]];let total=0;for(const x of w)total+=x[1];let roll=Math.random()*total;for(const[t,wt]of w){roll-=wt;if(roll<=0)return t;}return 'plain';}
function generateWorld(){
  const hexes={};
  for(let q=-MAP_RADIUS;q<=MAP_RADIUS;q++){
    const rMin=Math.max(-MAP_RADIUS,-q-MAP_RADIUS),rMax=Math.min(MAP_RADIUS,-q+MAP_RADIUS);
    for(let r=rMin;r<=rMax;r++){
      const dist=hexDistance({q:0,r:0},{q,r});
      let terrain;
      if(dist===0)terrain='plain';
      else if(dist===MAP_RADIUS&&Math.random()<0.36)terrain='water';
      else terrain=rollTerrain(dist);
      const hasRoad=(terrain!=='water'&&terrain!=='swamp'&&terrain!=='mountain')&&Math.random()<0.25;
      hexes[hexKey(q,r)]={q,r,terrain,road:hasRoad,revealed:false,fogLevel:0,visited:false,poi:null,relic:false,changeRule:null,changeExplained:null};
    }
  }
  const cands=Object.values(hexes).filter(h=>h.terrain!=='water'&&hexDistance({q:0,r:0},h)>=2);
  for(let i=cands.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cands[i],cands[j]]=[cands[j],cands[i]];}
  for(let i=0;i<RELICS_NEEDED&&i<cands.length;i++)cands[i].relic=true;
  return hexes;
}
function rollWeather(){const seasonMod=SEASONS[state.season]?.stormMod||0;const r=d20()-Math.floor(seasonMod/5);if(r<=10)return 'clear';if(r<=14)return 'cloudy';if(r<=17)return 'rain';if(r<=19)return 'fog';return 'storm';}
function computeTemperature(){const base=15;const seasonMod=SEASONS[state.season]?.tempMod||0;const weatherMod={clear:2,cloudy:0,rain:-3,fog:-1,storm:-5,snow:-8}[state.weather]||0;return base+seasonMod+weatherMod;}
function poiDensityFor(terrain){const map={plain:0.22,forest:0.32,hill:0.34,mountain:0.38,swamp:0.30,desert:0.20,water:0};return map[terrain]||0.25;}
function rollPoiType(){const r=Math.random();if(r<0.18)return 'settlement';if(r<0.32)return 'monstrous';if(r<0.44)return 'npc';if(r<0.54)return 'divine';if(r<0.62)return 'military';if(r<0.70)return 'factional';if(r<0.78)return 'magical';if(r<0.86)return 'geographic';if(r<0.94)return 'adventure';if(r<0.98)return 'landmark';return 'minor';}
function revealHex(h,level){level=level||1;if(h.fogLevel>=level)return false;h.fogLevel=level;h.revealed=true;if(level>=2){if(h.relic){h.poi=h.poi||{type:'ruin',done:false};}else{const dens=poiDensityFor(h.terrain);if(Math.random()<dens&&!h.poi)h.poi={type:rollPoiType(),done:false};}}return true;}
function seedWorld(){const hexes=state.hexes;const cands=Object.values(hexes).filter(h=>h.terrain!=='water'&&!h.poi&&!h.relic&&hexDistance(state.pos,h)>=1&&hexDistance(state.pos,h)<=2);let seeded=0;for(let i=0;i<cands.length&&seeded<4;i++){if(Math.random()<0.5){state.onDeckPOIs.push({q:cands[i].q,r:cands[i].r,type:rollPoiType()});seeded++;}}return seeded;}
function rollHexChangeExplanation(){const r=d20();for(const row of HEX_CHANGE_EXPLANATIONS){if(r>=row.min&&r<=row.max)return row;}return HEX_CHANGE_EXPLANATIONS[0];}
function rollHexChange(){const r=d20();for(const row of HEX_CHANGE_TABLE){if(r>=row.min&&r<=row.max)return row;}return HEX_CHANGE_TABLE[HEX_CHANGE_TABLE.length-1];}
function sanityCheck(hex,newPoiType){if(!newPoiType)return true;if(hex.terrain==='water'&&newPoiType==='settlement')return false;if(hex.terrain==='desert'&&newPoiType==='swamp')return false;return true;}

/* 負重（p353，基於目錄推演） */
function weightCapacity(){return 10+Math.floor(state.skills.athletics*1.5);}
function currentWeight(){return state.supplies+Object.values(state.inventory).reduce((a,b)=>a+b,0);}
function isOverweight(){return currentWeight()>weightCapacity();}

/* 渲染 */
function render(){renderHUD();renderStatusBar();renderMap();renderActions();renderLog();}

  $('#stat-hp .val').textContent=`${Math.max(0,state.hp)}/${state.maxHp}`;
  $('#stat-sup .val').textContent=`${state.supplies}/${weightCapacity()}`;
  $('#stat-day .val').textContent=`${state.day}/${state.maxDays}`;
  $('#stat-xp .val').textContent=`${state.xp}`;
  $('#stat-relic .val').textContent=`${state.relics}/${state.relicsNeeded}`;
  $('#stat-dist .val').textContent=`${state.miles}mi`;

  $('#stat-sup').classList.toggle('low',state.supplies<=2);
  $('#stat-sup').classList.toggle('warn',isOverweight());

function renderStatusBar(){
  const w=WEATHER[state.weather]||WEATHER.clear,s=SEASONS[state.season]||SEASONS.spring;
  $('#pill-weather').textContent=`${w.icon} ${w.name}`;
  $('#pill-season').textContent=`${s.icon} ${s.name} ${state.temperature}°C`;

  $('#pill-weight').textContent=`⚖️ ${currentWeight()}/${weightCapacity()}${isOverweight()?' ⚠️':''}`;
  const btn=document.getElementById('btn-transport');
  if(btn){btn.disabled=state.phase!=='PLAYER';btn.onclick=toggleTransport;}
}
function renderMap(){
  const svg=$('#map'),hexList=Object.values(state.hexes);
  if(!hexList.length){svg.innerHTML='';return;}
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const h of hexList){const{x,y}=hexToPixel(h.q,h.r);for(let i=0;i<6;i++){const a=Math.PI/180*(60*i+30);const px=x+HEX_SIZE*Math.cos(a),py=y+HEX_SIZE*Math.sin(a);if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py;}}
  const pad=8;
  svg.setAttribute('viewBox',`${(minX-pad).toFixed(1)} ${(minY-pad).toFixed(1)} ${(maxX-minX+pad*2).toFixed(1)} ${(maxY-minY+pad*2).toFixed(1)}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const out=[];
  out.push('<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
  out.push('<radialGradient id="fogGrad"><stop offset="0%" stop-color="#6b5a3e"/><stop offset="100%" stop-color="#4a3d28"/></radialGradient></defs>');
  for(const h of hexList){
    const{x,y}=hexToPixel(h.q,h.r),t=TERRAIN[h.terrain],isPlayer=(h.q===state.pos.q&&h.r===state.pos.r);
    const dist=hexDistance(state.pos,h),adjacent=dist===1;
    const reachable=(state.phase==='PLAYER')&&adjacent&&t.passable;
    let fill,stroke,opacity=1;
    if(h.fogLevel>=2){fill=t.color;stroke=t.stroke;}
    else if(h.fogLevel===1){fill=t.color;stroke=t.stroke;opacity=.55;}
    else{fill='url(#fogGrad)';stroke='#3a3020';}
    const cls=['hexpoly'];
    if(reachable)cls.push('reachable');else if(adjacent&&!t.passable)cls.push('blocked');
    out.push(`<polygon class="${cls.join(' ')}" points="${hexPoints(x,y,HEX_SIZE-1.2)}" fill="${fill}" stroke="${stroke}" stroke-width="1.4" opacity="${opacity}" data-q="${h.q}" data-r="${h.r}"/>`);
    if(h.fogLevel>=2&&h.road)out.push(`<line class="road-mark" x1="${x-HEX_SIZE*0.6}" y1="${y+HEX_SIZE*0.35}" x2="${x+HEX_SIZE*0.6}" y2="${y-HEX_SIZE*0.35}"/>`);
    if(h.fogLevel>=2){out.push(`<text class="hex-icon" x="${x}" y="${y-4}" font-size="20">${t.icon}</text>`);out.push(`<text class="hex-label" x="${x}" y="${y+17}">${t.name}${h.road?' ·道':''}</text>`);}
    else if(h.fogLevel===1){out.push(`<text class="hex-fog" x="${x}" y="${y}">?</text>`);}
    else{out.push(`<text class="hex-fog" x="${x}" y="${y}">?</text>`);}
    if(h.fogLevel>=2&&h.poi&&!h.poi.done){const bx=x+HEX_SIZE*0.52,by=y-HEX_SIZE*0.52;out.push(`<g class="poi-badge"><circle cx="${bx}" cy="${by}" r="11.5" fill="#fff8e0" stroke="#8b6f47" stroke-width="2"/>`);out.push(`<text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="central" font-size="13">${POI_DEFS[h.poi.type]?.icon||'❓'}</text></g>`);}
    if(h.fogLevel>=2&&state.onDeckPOIs.some(p=>p.q===h.q&&p.r===h.r)){const bx=x-HEX_SIZE*0.52,by=y-HEX_SIZE*0.52;out.push(`<g class="poi-badge"><circle cx="${bx}" cy="${by}" r="9" fill="#e8c97a" stroke="#8a6d12" stroke-width="2"/>`);out.push(`<text x="${bx}" y="${by}" text-anchor="middle" dominant-baseline="central" font-size="10">🌱</text></g>`);}
    if(isPlayer)out.push(`<polygon class="player-hex" points="${hexPoints(x,y,HEX_SIZE-4)}" fill="none" stroke="#d4a017" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>`);
  }
  if(state.expedMode&&state.expedPath.length>0){
    const pts=state.expedPath.map(p=>{const{x,y}=hexToPixel(p.q,p.r);return`${x},${y}`;}).join(' ');
    out.push(`<polyline class="exped-path" points="${pts}"/>`);
  }
  svg.innerHTML=out.join('');
}

/* 彈窗 */
function showModal(html,buttons,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const root=$('#modal-root');
    root.innerHTML=`<div class="modal-backdrop"><div class="modal ${opts.cls||''}">${html}<div class="modal-buttons"></div></div></div>`;
    const wrap=root.querySelector('.modal-buttons');
    buttons.forEach((b,i)=>{
      const el=document.createElement('button');
      el.className='mbtn'+(b.primary?' primary':'')+(b.danger?' danger':'');
      el.textContent=b.label;el.disabled=!!b.disabled;
      el.addEventListener('click',()=>{if(el.disabled)return;SFX.click();root.innerHTML='';resolve(b.value!==undefined?b.value:i);});
      wrap.appendChild(el);
    });
    const tw=root.querySelector('.typewriter');
    if(tw)typewriter(tw);
  });
}
function typewriter(el){
  const full=el.dataset.text||el.textContent;
  el.textContent='';let i=0;
  const timer=setInterval(()=>{el.textContent+=full[i++];if(i>=full.length){clearInterval(timer);el.dataset.done='1';}},20);
  el.addEventListener('click',()=>{clearInterval(timer);el.textContent=full;el.dataset.done='1';});
}
function closeModal(){$('#modal-root').innerHTML='';}

/* 效果 */
function applyEffects(eff){
  if(!eff)return;
  const notes=[];
  if(eff.hp){const before=state.hp;state.hp=clamp(state.hp+eff.hp,0,state.maxHp);const d=state.hp-before;if(d)notes.push(d>0?`生命 +${d}`:`生命 ${d}`);}
  if(eff.supplies){const before=state.supplies;state.supplies=clamp(state.supplies+eff.supplies,0,state.maxSupplies);const d=state.supplies-before;if(d)notes.push(d>0?`補給 +${d}`:`補給 ${d}`);}
  if(eff.xp){state.xp+=eff.xp;notes.push(`探索點 +${eff.xp}`);}
  if(eff.day){state.day+=eff.day;notes.push(`時間 +${eff.day} 天`);}
  if(eff.relic){state.relics+=eff.relic;notes.push(`🏛️ 遺跡 ${state.relics}/${state.relicsNeeded}`);}
  if(eff.item){state.inventory[eff.item]=(state.inventory[eff.item]||0)+1;notes.push(`獲得 ${{herb:'草藥',ore:'礦石',pelt:'獸皮'}[eff.item]||eff.item}`);}
  if(eff.skillPoint){state.skillPoints+=eff.skillPoint;notes.push(`技能點 +${eff.skillPoint}`);}
  if(notes.length)addLog('　→ '+notes.join('　'));
  if(eff.hp&&eff.hp<0)SFX.bad();
  if(eff.xp&&eff.xp>=15)SFX.good();
  checkQuests();
}

/* 任務檢查 */
function checkQuests(){
  for(const q of state.quests){
    if(q.done)continue;
    if(q.type==='gather'&&state.inventory[q.target]>=q.need){q.done=true;completeQuest(q);}
    if(q.type==='hunt'&&q.progress>=q.need){q.done=true;completeQuest(q);}
    if(q.type==='explore'&&q.progress>=q.need){q.done=true;completeQuest(q);}
  }
}
function completeQuest(q){
  state.questCompleted++;
  unlockAchv('quest_first');
  SFX.quest();
  addLog(`📋 任務完成：${q.title}！`);
  applyEffects(q.reward);
}
function acceptQuest(){
  const avail=QUEST_TEMPLATES.filter(t=>!state.quests.some(q=>q.templateId===t.id&&!q.done));
  if(!avail.length)return null;
  const t=pick(avail);
  const q={templateId:t.id,...t,progress:0,done:false};
  state.quests.push(q);
  addLog(`📋 接受任務：${t.title}——${t.desc}`);
  return q;
}

/* 六角變更（表 6 + 表 5 + 合理性檢查） */
async function applyHexChange(hex,mySession){
  if(!hex.visited)return;
  if(hex.changeRule==='perpetual')return;
  if(state.designMode==='design')return;
  const row=rollHexChange();
  hex.changeRule=row.key;
  state.hexChangeCount++;
  if(row.key!=='persist_visit')unlockAchv('hexchange');
  if(row.key==='perpetual'){addLog('🔄 這個六角似乎亙古不變。');return;}
  if(row.key==='persist_visit'){return;}
  if(row.key==='persist_then_regen'){hex.poi=null;hex.relic=false;return;}
  if(row.key==='persist_then_vanish'||row.key==='persist_watch_vanish'){if(hex.poi){hex.poi=null;addLog('🔄 你注意到，這個六角裡的某些東西消失了。');}return;}
  if(row.key==='change_next'){hex.changeRule='change_next_ready';return;}
  if(row.key==='change_now'||row.key==='change_next_ready'){
    hex.poi=null;hex.relic=false;
    let newType=null;
    for(let attempt=0;attempt<5;attempt++){if(Math.random()<poiDensityFor(hex.terrain)){newType=rollPoiType();if(sanityCheck(hex,newType))break;else newType=null;}else break;}
    if(newType){hex.poi={type:newType,done:false};}
    const expl=rollHexChangeExplanation();
    hex.changeExplained=expl.label;
    if(expl.key==='mystery')unlockAchv('sanity');
    addLog(`🔄 這個六角的景物已與你記憶中不同。`);
    addLog(`　→ 表 5 解釋：${expl.label}`);
    return;
  }
  if(row.key==='vanish_first'){if(hex.poi){hex.poi=null;addLog('🔄 就在你眼前，這裡的某些東西蒸發了。');}return;}
}

function toggleTransport(){
  if(state.phase!=='PLAYER')return;
  state.transport=state.transport==='walk'?'ride':'walk';
  SFX.click();
  toast(state.transport==='walk'?'🚶 切換為步行':'🐴 切換為騎乘（山地/沼澤不可進入）');
  render();
}

/* 移動 */
async function doMove(tq,tr){
  if(state.phase!=='PLAYER')return;
  const target=state.hexes[hexKey(tq,tr)];
  if(!target)return;
  if(hexDistance(state.pos,target)!==1){toast('🧭 只能移動到相鄰的六角格');return;}
  if(target.terrain==='water'){toast('🌊 水域無法通行，請繞道');return;}
  if(state.transport==='ride'&&(target.terrain==='mountain'||target.terrain==='swamp')){toast('🐴 騎乘無法進入山地或沼澤，請切換為步行');return;}
  SFX.move();
  state.phase='BUSY';
  const mySession=++state.sessionId;
  render();
  try{
    /* 步驟 1：時間 */
    state.day+=1;
    if(state.day%10===0){const order=['spring','summer','autumn','winter'];const idx=(order.indexOf(state.season)+1)%4;state.season=order[idx];addLog(`🍂 季節變換：${SEASONS[state.season].icon} ${SEASONS[state.season].name}`);}
    state.weather=rollWeather();
    state.temperature=computeTemperature();
    const w=WEATHER[state.weather];
    if(state.weather!=='clear'&&state.weather!=='cloudy'){SFX.weather();addLog(`🌦️ 第 ${state.day} 天天氣：${w.icon} ${w.name}（${state.temperature}°C）`);}
    /* 技能點：每 5 天 +1 */
    if(state.day%5===0){state.skillPoints++;addLog('🎯 獲得 1 點技能點（可在設定中分配）');}
    render();
    /* 步驟 2：補給消耗 */
    const t=TERRAIN[target.terrain];
    let baseCost=1+t.extra;
    if(target.road)baseCost=Math.max(0,baseCost-1);
    if(state.transport==='ride')baseCost=Math.max(0,Math.floor(baseCost/2));
    baseCost+=w.supplyPenalty;
    if(isOverweight()){baseCost+=1;unlockAchv('overweight');}
    const supplyCost=Math.max(0,baseCost);
    /* 步驟 3：移動 */
    state.pos={q:tq,r:tr};
    state.miles+=state.hexSizeMi;
    const wasNew=revealHex(target,2);
    target.visited=true;
    state.history.push({day:state.day,q:tq,r:tr,terrain:target.terrain,note:`${t.name}${target.road?'（道路）':''}`});
    /* 步驟 4：補給 */
    state.supplies=clamp(state.supplies-supplyCost,0,state.maxSupplies);
    addLog(`🧭 第 ${state.day} 天：踏入${t.name}${target.road?'（道路）':''}（-${supplyCost} 補給）`);
    if(wasNew){state.xp+=t.xp;addLog(`　→ 首次探索此地形，探索點 +${t.xp}`);}
    if(state.weather==='storm')unlockAchv('weather');
    /* 待用 POI 自動放置 */
    const odIdx=state.onDeckPOIs.findIndex(p=>p.q===tq&&p.r===tr);
    if(odIdx>=0&&!target.poi){target.poi={type:state.onDeckPOIs[odIdx].type,done:false};state.onDeckPOIs.splice(odIdx,1);addLog('🌱 播下的種子在這裡發芽了。');}
    render();
    await sleep(260);
    if(mySession!==state.sessionId)return;
    /* 步驟 5：飢餓 */
    if(state.supplies===0){state.hp-=3;addLog('⚠️ 補給耗盡！你餓得頭昏眼花（生命 -3）');unlockAchv('survivor');render();await sleep(200);if(mySession!==state.sessionId)return;}
    /* 步驟 6：迷路（技能檢定） */
    let lostChance=0;
    if(t.hard)lostChance+=25;
    lostChance+=w.lostBonus;
    if(target.road)lostChance=Math.floor(lostChance/2);
    if(state.transport==='ride')lostChance=Math.floor(lostChance/2);
    if(lostChance>0&&Math.random()*100<lostChance){
      const check=skillCheck('navigation',12);
      if(!check.success){state.supplies=clamp(state.supplies-1,0,state.maxSupplies);addLog(`🌫️ 你迷失了方向（導航檢定 ${check.total} vs 12，失敗），多繞了一段路（補給 -1）`);}
      else{addLog(`🧭 你差點迷路，但靠著導航技能（${check.total} vs 12）找回了方向。`);}
      render();await sleep(200);if(mySession!==state.sessionId)return;
    }
    /* 步驟 7：遭遇 */
    let encChance=30+w.encBonus;
    if(target.road)encChance=Math.floor(encChance/2);
    if(Math.random()*100<encChance){
      await triggerEncounter(mySession);
      if(mySession!==state.sessionId)return;
      if(state.phase==='OVER')return;
    }
    /* 步驟 8：六角變更 */
    if(target.visited&&target.changeRule!=='perpetual'){
      await applyHexChange(target,mySession);
      if(mySession!==state.sessionId)return;
      render();
    }
    /* 步驟 9：POI */
    if(target.poi&&!target.poi.done){
      await openPoi(target,mySession);
      if(mySession!==state.sessionId)return;
      if(state.phase==='OVER')return;
    }
    /* 成就 */
    const visitedCount=Object.values(state.hexes).filter(h=>h.visited).length;
    if(visitedCount>=15)unlockAchv('explorer');
    unlockAchv('first_step');
  }finally{
    if(mySession===state.sessionId&&state.phase!=='OVER')state.phase='PLAYER';
    checkGameOver();render();
  }
}

/* 遭遇 */
async function triggerEncounter(mySession){
  const enc=pick(ENCOUNTERS);
  const distLabel=pick(enc.distance);
  state.phase='MODAL';render();
  const choiceIdx=await showModal(
    `<div class="modal-icon">${enc.icon}</div><h2>${enc.title}</h2>
     <p class="modal-text typewriter" data-text="${enc.text.replace(/"/g,'&quot;')}"></p>
     <div class="tip">📍 遭遇距離：<b>${distLabel}</b><br><span style="font-size:11px">（依地形與天氣判定，參見規則書 p334）</span></div>`,
    enc.options.map(o=>({label:o.label}))
  );
  if(mySession!==state.sessionId)return;
  state.phase='MODAL';
  const opt=enc.options[choiceIdx];
  let eff;
  try{eff=opt.resolve();}catch(e){eff={icon:'📜',text:'一陣混亂之後，你勉強脫身。',xp:2};}
  applyEffects(eff);
  /* 擊敗怪物任務進度 */
  if(enc.title.includes('怪物')||enc.title.includes('巨蟒')||enc.title.includes('蝙蝠')||enc.title.includes('狼')||enc.title.includes('野豬')){
    for(const q of state.quests){if(q.type==='hunt'&&!q.done)q.progress++;}
  }
  render();
  await showModal(`<div class="modal-icon">${eff.icon||'📜'}</div><h2>結果</h2><p class="modal-text">${eff.text}</p>`,[{label:'繼續前進',primary:true}]);
}

/* 子六角探索（p173，基於目錄推演） */
async function subhexExplore(hex,mySession){
  const steps=[];
  const themes=['入口','深處','核心'];
  const icons=['🚪','🕳️','💎'];
  for(let i=0;i<3;i++){
    const r=skillCheck('perception',10+i*3);
    const success=r.success;
    steps.push({theme:themes[i],icon:icons[i],check:r,success});
  }
  const successCount=steps.filter(s=>s.success).length;
  unlockAchv('subhex');
  let reward;
  if(successCount===3)reward={xp:40,supplies:2,item:'herb'};
  else if(successCount===2)reward={xp:25,supplies:1};
  else if(successCount===1)reward={xp:12,hp:-2};
  else reward={xp:5,hp:-5};
  const html=`<div class="modal doc"><h2>🔍 子六角探索</h2>
    <p>你深入探索這處地點，經歷了三個階段：</p>
    ${steps.map((s,i)=>`<div class="list-item ${s.success?'done':''}">
      <div class="li-ico">${s.success?'✅':'❌'}</div>
      <div class="li-main"><div class="li-title">${s.theme}</div>
      <div class="li-sub">察覺檢定：d20(${s.check.roll})+${s.check.level}=${s.check.total} vs DC ${s.check.dc} → ${s.success?'成功':'失敗'}</div></div>
    </div>`).join('')}
    <div class="tip">成功 ${successCount}/3 階段。</div></div>`;
  await showModal(html,[{label:'結算',primary:true}]);
  if(mySession!==state.sessionId)return;
  applyEffects(reward);
  addLog(`🔍 子六角探索完成（${successCount}/3 成功）`);
}

/* 紮營 */
async function doCamp(){
  if(state.phase!=='PLAYER')return;
  SFX.click();state.phase='BUSY';const mySession=++state.sessionId;render();
  try{
    state.day+=1;state.weather=rollWeather();state.temperature=computeTemperature();
    if(state.supplies>0){state.supplies-=1;state.hp=clamp(state.hp+7,0,state.maxHp);state.xp+=4;addLog('🏕️ 你在此紮營過夜，恢復了體力（生命 +7，補給 -1）');}
    else{state.hp=clamp(state.hp+2,0,state.maxHp);addLog('🏕️ 你在沒有補給的情況下勉強休息（生命 +2）');}
    if(state.day%5===0){state.skillPoints++;addLog('🎯 獲得 1 點技能點');}
    render();await sleep(300);if(mySession!==state.sessionId)return;
  }finally{if(mySession===state.sessionId&&state.phase!=='OVER')state.phase='PLAYER';checkGameOver();render();}
}

/* 觀察 */
async function doLook(){
  if(state.phase!=='PLAYER')return;
  SFX.click();state.phase='BUSY';const mySession=++state.sessionId;render();
  try{
    const w=WEATHER[state.weather];
    const check=skillCheck('perception',10);
    const range=Math.max(1,2-w.visPenalty+(check.success?1:0));
    let revealedAny=false;
    for(const k in state.hexes){const o=state.hexes[k];if(o.fogLevel<2&&hexDistance(state.pos,o)<=range){revealHex(o,2);revealedAny=true;}}
    if(check.success){state.xp+=10;addLog(`🧭 察覺檢定 ${check.total} vs 10 成功，看清了 ${range} 格內地形（探索點 +10）`);if(revealedAny)addLog('　→ 附近地形已繪入地圖');SFX.good();}
    else{state.xp+=4;addLog(`🧭 察覺檢定 ${check.total} vs 10 失敗，只確認了 ${range} 格內的大致方向（探索點 +4）`);}
    render();await sleep(300);if(mySession!==state.sessionId)return;
  }finally{if(mySession===state.sessionId&&state.phase!=='OVER')state.phase='PLAYER';checkGameOver();render();}
}

      • 再次點擊已加入的格子可移除<br>

      • 確認後將依序執行所有移動
    </div>
    <p>目前路徑：<span class="hl" id="exped-count">0</span> / 5 格</p></div>`;
  state.expedMode=true;state.expedPath=[];render();
  const choice=await showModal(html,[{label:'✅ 開始規劃',primary:true,value:'plan'},{label:'✖️ 取消',value:'cancel'}]);
  if(choice==='cancel'){state.expedMode=false;state.expedPath=[];render();return;}
  toast('🐴 點擊相鄰六角格來規劃路徑（最多 5 格）');
}

async function executeExped(mySession){
  const path=state.expedPath.slice();
  state.expedMode=false;state.expedPath=[];
  unlockAchv('exped');
  for(const step of path){
    if(mySession!==state.sessionId)return;
    const target=state.hexes[hexKey(step.q,step.r)];
    if(!target||target.terrain==='water')continue;
    state.phase='BUSY';render();
    /* 簡化版移動：只跑時間/補給/地形/遭遇，不跑完整流程 */
    state.day+=1;
    state.weather=rollWeather();state.temperature=computeTemperature();
    const t=TERRAIN[target.terrain];
    let cost=1+t.extra+(WEATHER[state.weather].supplyPenalty||0);
    if(target.road)cost=Math.max(0,cost-1);
    if(state.transport==='ride')cost=Math.max(0,Math.floor(cost/2));
    if(isOverweight())cost+=1;
    state.pos={q:step.q,r:step.r};
    state.miles+=state.hexSizeMi;
    revealHex(target,2);target.visited=true;
    state.supplies=clamp(state.supplies-cost,0,state.maxSupplies);
    state.history.push({day:state.day,q:step.q,r:step.r,terrain:target.terrain,note:`${t.name}（遠征）`});
    addLog(`🐴 遠征第 ${state.day} 天：抵達${t.name}（-${cost} 補給）`);
    if(state.supplies===0){state.hp-=3;addLog('⚠️ 補給耗盡（生命 -3）');}
    render();await sleep(220);
  }
  state.phase='PLAYER';
  toast('🐴 遠征完成！');
  render();
}

/* 遊戲結束 */
function checkGameOver(){
  if(state.phase==='OVER')return;
  if(state.relics>=state.relicsNeeded)endGame('win');
  else if(state.hp<=0)endGame('death');
  else if(state.day>state.maxDays)endGame('timeout');
}
async function endGame(endingId){
  state.phase='OVER';state.endingId=endingId;render();
  let icon,title,body,achvId;
  if(endingId==='win'){icon='👑';title='探索完成';achvId='win';body=`你在第 <span class="hl">${state.day}</span> 天完成了對三座遠古遺跡的探索。<br><br>那些刻在石板上的符文，記載著一個早已被遺忘的文明。<br><br><b>最終探索點：${state.xp}</b>　·　行走里程：${state.miles} 英里　·　完成任務：${state.questCompleted}`;SFX.win();}
  else if(endingId==='death'){icon='💀';title='長眠荒野';achvId='death';body=`你的生命在第 <span class="hl">${state.day}</span> 天走到了盡頭。<br><br>荒野從不仁慈。你的名字將和那些無名骸骨一起，靜靜留在這片土地裡。<br><br><b>最終探索點：${state.xp}</b>`;SFX.bad();}
  else{icon='⏳';title='時光飛逝';achvId='timeout';body=`四十天過去了，你只找到了 <span class="hl">${state.relics}</span> 座遠古遺跡。<br><br>補給耗盡、季節更替，你不得不放棄探索，返回文明世界。<br><br><b>最終探索點：${state.xp}</b>`;SFX.bad();}
  unlockAchv(achvId);
  saveEndingRecord(endingId,state.day,state.xp,state.relics);
  const choice=await showModal(`<div class="modal-icon">${icon}</div><h2>${title}</h2><p class="modal-text">${body}</p><div class="tip">${endingId==='win'?'你已完成本次探索。要不要再挑戰一次？':'別灰心——荒野就是這樣。換一種策略，再試一次吧。'}</div>`,[{label:'🔄 再來一次',primary:true,value:'again'},{label:'📜 查看歷史',value:'history'},{label:'🏆 查看成就',value:'achv'}]);
  if(choice==='history'){showHistory().then(()=>{closeModal();});}
  else if(choice==='achv'){showAchievements().then(()=>{closeModal();});}
  else{startGame();}
}

function unlockAchv(id){const a=loadAchv();if(a[id])return;const def=ACHIEVEMENTS.find(x=>x.id===id);if(!def)return;a[id]={at:Date.now()};saveAchv(a);toast(`🏆 解鎖成就：${def.name}`);SFX.good();}

async function loadGame(){

  const go=await showModal(`<div class="modal-icon">📂</div><h2>讀取存檔</h2><p class="modal-text">讀取存檔會覆蓋目前的遊戲進度，確定要繼續嗎？</p>`,[{label:'✅ 確定讀取',primary:true,value:'yes'},{label:'✖️ 取消',value:'no'}]);

    state.sessionId++;

    state.relics=d.relics;state.pos=d.pos;state.hexes=d.hexes;

    state.temperature=d.temperature||15;state.transport=d.transport||'walk';
    state.hexSizeMi=d.hexSizeMi||12;state.designMode=d.designMode||'play';
    state.changeMindAllowed=d.changeMindAllowed!==false;
    state.hexChangeCount=d.hexChangeCount||0;state.seeded=!!d.seeded;

    state.skillPoints=d.skillPoints||0;state.inventory=d.inventory||{herb:0,ore:0,pelt:0};
    state.quests=d.quests||[];state.questCompleted=d.questCompleted||0;
    state.rumors=d.rumors||[];state.rumorCount=d.rumorCount||0;

    state.phase='PLAYER';
    $('#modal-root').innerHTML='';

  const skillHtml=Object.entries(SKILLS).map(([k,s])=>`
    <div class="skill-bar"><div class="name">${s.icon} ${s.name}</div>
    <div class="pips">${[1,2,3,4,5].map(i=>`<div class="pip ${state.skills[k]>=i?'on':''}"></div>`).join('')}</div>
    <span style="font-size:11px;color:#6b5232">Lv ${state.skills[k]}</span>
    <button class="skill-add" data-skill="${k}" style="margin-left:auto;font-family:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid #94723f;background:linear-gradient(#fdf6e2,#e6d2a6);cursor:pointer" ${state.skillPoints>0&&state.skills[k]<5?'':'disabled'}>+1</button>
    </div>`).join('');
  const html=`<div class="modal doc"><h2>⚙️ 設定</h2>
    <h3>🔊 音效</h3>
    <p>目前：<span class="hl">${state.soundOn?'開啟':'關閉'}</span></p>
    <button id="btn-toggle-sound" style="width:100%;padding:8px;margin-top:4px;font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;border:2px solid #94723f;background:linear-gradient(#fdf6e2,#e6d2a6);cursor:pointer">切換音效</button>
    <h3>🎯 技能（p357）</h3>
    <p>剩餘技能點：<span class="hl">${state.skillPoints}</span></p>
    ${skillHtml}
    <h3>🧭 六角尺寸（p46）</h3>
    <p>目前：<span class="hl">${state.hexSizeMi} 英里/格</span></p>
    <select id="sel-size" style="width:100%;padding:8px;font-family:inherit;font-size:12px;border-radius:7px;border:2px solid #94723f;background:#fbf3dd;color:#2b1d0e">${sizeOpts}</select>
    <h3>🎨 設計時 / 遊戲時（p26）</h3>
    <p>目前：<span class="hl">${state.designMode==='design'?'設計時':'遊戲時'}</span></p>
    <p style="font-size:11.5px;color:#6b5232">設計時：六角變更不會觸發。<br>遊戲時：六角變更依表 6 觸發。</p>
    <button id="btn-toggle-mode" style="width:100%;padding:8px;margin-top:4px;font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;border:2px solid #94723f;background:linear-gradient(#fdf6e2,#e6d2a6);cursor:pointer">切換為 ${state.designMode==='design'?'遊戲時':'設計時'}</button>
    <h3>💭 改變主意（p14）</h3>
    <p>目前：<span class="hl">${state.changeMindAllowed?'允許':'禁止'}</span> 在遊戲中切換規則。</p>
    <button id="btn-toggle-mind" style="width:100%;padding:8px;margin-top:4px;font-family:inherit;font-size:12px;font-weight:700;border-radius:8px;border:2px solid #94723f;background:linear-gradient(#fdf6e2,#e6d2a6);cursor:pointer">切換為 ${state.changeMindAllowed?'禁止':'允許'}</button>
    <div class="info" style="margin-top:10px">六角變更次數：<span class="hl">${state.hexChangeCount}</span> 次</div>
  </div>`;
  await showModal(html,[{label:'關閉',primary:true}]);
  /* 重新綁定事件 */
  const root=$('#modal-root');
  if(root){
    const t1=root.querySelector('#btn-toggle-sound');
    if(t1)t1.onclick=()=>{state.soundOn=!state.soundOn;closeModal();showSettings();};
    root.querySelectorAll('.skill-add').forEach(b=>{
      b.onclick=()=>{const sk=b.dataset.skill;if(state.skillPoints>0&&state.skills[sk]<5){state.skills[sk]++;state.skillPoints--;SFX.click();closeModal();showSettings();}};
    });
    const sel=root.querySelector('#sel-size');
    if(sel)sel.onchange=()=>{state.hexSizeMi=parseInt(sel.value);SFX.click();toast(`📏 六角尺寸：${state.hexSizeMi} 英里`);};
    const tm=root.querySelector('#btn-toggle-mode');
    if(tm)tm.onclick=()=>{state.designMode=state.designMode==='design'?'play':'design';SFX.click();toast(state.designMode==='design'?'🎨 設計時模式':'🎮 遊戲時模式');unlockAchv('change_mind');closeModal();showSettings();};
    const tm2=root.querySelector('#btn-toggle-mind');
    if(tm2)tm2.onclick=()=>{state.changeMindAllowed=!state.changeMindAllowed;SFX.click();closeModal();showSettings();};
  }
  state.phase=prev==='OVER'?'OVER':'PLAYER';render();
}

/* 開始 */
function startGame(){
  const soundPref=state.soundOn!==undefined?state.soundOn:true;
  state=freshState();
  state.soundOn=soundPref;
  state.hexes=generateWorld();
  state.pos={q:0,r:0};
  const start=state.hexes[hexKey(0,0)];
  start.revealed=true;start.visited=true;start.fogLevel=2;start.changeRule='perpetual';
  for(const[dq,dr]of HEX_DIRS){const n=state.hexes[hexKey(dq,dr)];if(n)revealHex(n,2);}
  state.weather=rollWeather();state.temperature=computeTemperature();
  state.phase='PLAYER';state.log=[];state.history=[];
  addLog(`🗺️ 你抵達了這片陌生的土地（${WEATHER[state.weather].icon} ${WEATHER[state.weather].name}，${state.temperature}°C）。`);
  addLog('💡 點擊金色描邊的相鄰格子開始移動。');
  $('#modal-root').innerHTML='';
  render();
}
function updateSoundBtn(){
  const btn=document.querySelector('#nav button[data-act="sound"]');
  if(!btn)return;
  btn.innerHTML=(state.soundOn?'🔊':'🔇')+`<span>音效</span>`;
}

/* 事件綁定 */
function bindEvents(){
  const svg=$('#map');
  svg.addEventListener('click',(e)=>{
    if(state.phase!=='PLAYER')return;
    const poly=e.target.closest('.hexpoly');
    if(!poly)return;
    const q=parseInt(poly.dataset.q,10),r=parseInt(poly.dataset.r,10);
    const h=state.hexes[hexKey(q,r)];
    if(!h)return;
    if(state.expedMode){
      const existingIdx=state.expedPath.findIndex(p=>p.q===q&&p.r===r);
      if(existingIdx>=0){state.expedPath.splice(existingIdx,1);render();return;}
      if(state.expedPath.length>=5){toast('🐴 遠征路徑最多 5 格');return;}
      const last=state.expedPath.length?state.expedPath[state.expedPath.length-1]:state.pos;
      if(hexDistance(last,{q,r})!==1){toast('🐴 路徑必須連續相鄰');return;}
      if(h.terrain==='water'){toast('🌊 水域無法通行');return;}
      state.expedPath.push({q,r});render();
      if(state.expedPath.length===5){setTimeout(()=>{if(confirm('🐴 路徑已達 5 格，是否執行遠征？')){const s=++state.sessionId;executeExped(s);}},100);}
      return;
    }
    if(q===state.pos.q&&r===state.pos.r){toast('📍 你已經在這裡了');return;}
    if(hexDistance(state.pos,h)!==1){toast('🧭 只能移動到相鄰的六角格');return;}
    if(!TERRAIN[h.terrain].passable){toast('🌊 水域無法通行，請繞道');return;}
    doMove(q,r);
  });
  $('#btn-camp').addEventListener('click',doCamp);
  $('#btn-look').addEventListener('click',doLook);
  $('#btn-seed').addEventListener('click',doSeed);
  $('#btn-exped').addEventListener('click',()=>{
    if(state.expedMode&&state.expedPath.length>0){
      const s=++state.sessionId;executeExped(s);
    }else{doExped();}
  });
  document.querySelectorAll('#nav button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const act=btn.dataset.act;
      ensureAudio();SFX.click();
      if(act==='help'){if(state.phase==='OVER'||state.phase==='MODAL')return;showHelp(false);}
      else if(act==='quests'){if(state.phase==='MODAL')return;showQuests();}
      else if(act==='save'){if(state.phase==='MODAL'||state.phase==='OVER')return;saveGame();}
      else if(act==='load'){if(state.phase==='MODAL')return;loadGame();}
      else if(act==='history'){if(state.phase==='MODAL')return;showHistory();}
      else if(act==='achv'){if(state.phase==='MODAL')return;showAchievements();}
      else if(act==='settings'){if(state.phase==='MODAL'||state.phase==='OVER')return;showSettings();}
    });
  });
}

/* 啟動 */
function boot(){
  state=freshState();
  state.hexes=generateWorld();
  state.pos={q:0,r:0};
  const start=state.hexes[hexKey(0,0)];
  start.revealed=true;start.visited=true;start.fogLevel=2;start.changeRule='perpetual';
  for(const[dq,dr]of HEX_DIRS){const n=state.hexes[hexKey(dq,dr)];if(n)revealHex(n,2);}
  state.weather='clear';state.temperature=computeTemperature();
  state.phase='BOOT';
  render();bindEvents();
  showHelp(true);
}
window.addEventListener('DOMContentLoaded',boot);

let lastTouch=0;
document.addEventListener('touchend',(e)=>{const now=Date.now();if(now-lastTouch<300)e.preventDefault();lastTouch=now;},{passive:false});
</script>
</body>
