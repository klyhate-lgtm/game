<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D100 Dungeon · 巨龙铠甲</title>
<style>
:root{
  --parchment:#f2e4c2; --parchment2:#e8d5a8; --ink:#2b1d0e; --ink2:#4a3820;
  --gold:#b8912a; --blood:#8b1a1a; --leaf:#4a7a3a; --stone:#6b6355;
  --blue:#3a5a8a; --yellow:#c9a227;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Georgia','Noto Serif TC','Songti TC',serif;
  background:#120c05; color:var(--ink); overflow:hidden;
  display:flex; flex-direction:column;
}
#app{
  flex:1; display:flex; flex-direction:column;
  background:
    radial-gradient(ellipse at center, #f4e8ca 0%, #e0cba0 70%, #c4a878 100%);
  position:relative;
}
#app::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(30,15,0,.55) 100%);
  mix-blend-mode:multiply;
}
.vignette{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 120px rgba(30,15,0,.75)}
.hidden{display:none!important}

/* ===== 顶部 HUD ===== */
#hud{
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  background:linear-gradient(180deg,#1a0f05,#2b1d0e); color:#e8d8a8;
  border-bottom:2px solid var(--gold); z-index:5; flex-wrap:wrap;
  font-size:13px;
}
.hud-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
.hp-bar{width:100px;height:12px;background:#3a1a1a;border:1px solid #6a3030;border-radius:6px;overflow:hidden;position:relative}
.hp-fill{height:100%;background:linear-gradient(90deg,#c33,#e55);transition:width .3s}
.hud-title{font-weight:bold;color:var(--gold);letter-spacing:1px}
#timeTrack{display:flex;gap:1px;flex-wrap:wrap;max-width:140px}
.tick{width:6px;height:6px;background:#3a2a10;border-radius:1px}
.tick.on{background:#c9a227}

/* ===== 主区域 ===== */
#main{flex:1;display:flex;overflow:hidden;position:relative}
#game{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2}

#storyBox{
  flex:1;overflow-y:auto;padding:18px 22px;
  background:rgba(250,240,215,.72);
  margin:10px; border:1px solid #8b7040; border-radius:6px;
  box-shadow:inset 0 0 40px rgba(120,90,40,.2);
  font-size:15px; line-height:1.85; color:#2b1d0e;
}
#storyBox h2{font-size:19px;color:var(--blood);margin-bottom:10px;
  border-bottom:1px dashed #a08040;padding-bottom:6px;letter-spacing:1px}
#storyBox p{margin-bottom:10px;text-indent:2em;text-align:justify}
#storyBox .hint{color:#7a5a20;font-style:italic;text-indent:0;
  border-left:3px solid var(--gold);padding-left:10px;margin:10px 0;font-size:14px}

/* ===== 区域地图 ===== */
#mapArea{
  display:flex;align-items:center;gap:10px;padding:0 14px 4px;
  font-size:12px;color:#4a3820;
}
#regionChip{width:54px;height:54px;border-radius:8px;border:2px solid #5a4520;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;color:#fff;
  text-shadow:0 0 4px #000;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
.green{background:linear-gradient(135deg,#6a9a4a,#3a6a2a)}
.red{background:linear-gradient(135deg,#c05050,#7a1a1a)}
.yellow{background:linear-gradient(135deg,#d0a030,#8a6010)}
.blue{background:linear-gradient(135deg,#5a8ac0,#2a4a7a)}

/* ===== 行动按钮区 ===== */
#actions{
  display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 14px;
  background:linear-gradient(180deg,rgba(40,25,10,.05),rgba(40,25,10,.15));
  border-top:1px solid #b09560;
}
.btn{
  padding:10px 16px;border:1.5px solid #6a4a20;border-radius:6px;
  background:linear-gradient(180deg,#f8ecc8,#d8c090);color:#2b1d0e;
  font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer;
  letter-spacing:.5px;transition:transform .1s, box-shadow .15s;
  box-shadow:0 2px 0 #8a6a30; user-select:none;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 4px rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #8a6a30}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 #8a6a30}
.btn.primary{background:linear-gradient(180deg,#e8c060,#b8901a);color:#1a0f05;
  border-color:#8a6010;box-shadow:0 2px 0 #6a4a10}
.btn.danger{background:linear-gradient(180deg,#d06060,#8a1a1a);color:#fff;
  border-color:#6a1010;box-shadow:0 2px 0 #5a0a0a}
.btn.ghost{background:transparent;border-color:#8a7040;box-shadow:none;color:#4a3820}
.btn.small{padding:6px 10px;font-size:12px}

/* ===== 底部导航 ===== */
#nav{
  display:flex;background:#1a0f05;border-top:2px solid var(--gold);z-index:5;
}
#nav button{
  flex:1;padding:10px 4px;background:transparent;border:none;color:#c8b088;
  font-family:inherit;font-size:12px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:2px;
}
#nav button:hover{color:var(--gold);background:#2b1d0e}
#nav button .ic{font-size:18px}

/* ===== 战斗面板 ===== */
#combatPanel{
  position:absolute;inset:0;background:rgba(20,12,4,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;padding:16px;color:#e8d8a8;gap:12px;
}
#combatMonsters{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:100%}
.monster{width:120px;text-align:center}
.monster .svgBox{
  width:100px;height:100px;margin:0 auto;background:rgba(0,0,0,.3);
  border-radius:8px;border:2px solid #6a4a20;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.monster.dead{opacity:.25;filter:grayscale(1)}
.monster .mhp{width:100%;height:8px;background:#3a1a1a;border-radius:4px;margin-top:4px;overflow:hidden}
.monster .mhp>div{height:100%;background:#c33;transition:width .3s}
.monster .mname{font-size:12px;color:var(--gold);margin-top:3px}
.monster .mlabel{font-size:11px;color:#a09070}
#combatLog{
  width:100%;max-width:500px;height:100px;overflow-y:auto;
  background:rgba(0,0,0,.35);border:1px solid #4a3a20;border-radius:6px;
  padding:8px;font-size:12px;line-height:1.6;color:#c8b890;
}
#combatLog .dmg{color:#e66}
#combatLog .good{color:#8c8}

/* ===== 弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,6,2,.85);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .25s;
}
.modal{
  background:linear-gradient(135deg,#f4e4bc,#e0cba0);color:#2b1d0e;
  border:2px solid #8a6010;border-radius:10px;max-width:680px;width:100%;
  max-height:85vh;overflow-y:auto;padding:22px;
  box-shadow:0 10px 50px rgba(0,0,0,.7);
  font-size:14px;line-height:1.8;
}
.modal h2{color:var(--blood);border-bottom:2px solid #b09560;padding-bottom:8px;margin-bottom:14px}
.modal h3{color:#5a3a10;margin:14px 0 6px;font-size:15px}
.modal p{margin-bottom:8px}
.modal ul{margin:6px 0 10px 22px}
.modal li{margin-bottom:4px}
.modal .closeX{
  position:absolute;top:10px;right:14px;background:transparent;border:none;
  font-size:22px;color:#8a6010;cursor:pointer;
}
.modal-wrap{position:relative;display:inline-block;width:100%}

/* ===== Toast ===== */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(30,15,5,.95);color:#f0e0b0;padding:10px 20px;border-radius:6px;
  font-size:13px;border:1px solid var(--gold);z-index:200;opacity:0;
  transition:all .3s;pointer-events:none;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 历史侧栏 ===== */
#historyPanel{
  position:fixed;top:0;right:-320px;width:320px;height:100%;
  background:#1a0f05;border-left:2px solid var(--gold);z-index:50;
  transition:right .3s;display:flex;flex-direction:column;color:#c8b088;
}
#historyPanel.open{right:0}
#historyPanel .hp-head{padding:12px;border-bottom:1px solid #4a3a20;display:flex;justify-content:space-between;align-items:center;color:var(--gold)}
#historyList{flex:1;overflow-y:auto;padding:10px;font-size:12px;line-height:1.7}
#historyList .hitem{padding:6px 8px;border-left:2px solid #6a4a20;margin-bottom:6px;background:rgba(60,40,15,.3)}
#historyList .hitem.cur{border-color:var(--gold);background:rgba(120,90,20,.3)}

/* ===== 背包 ===== */
#invBox{
  position:fixed;bottom:60px;left:0;right:0;max-height:45vh;
  background:#1a0f05;border-top:2px solid var(--gold);z-index:40;
  padding:12px;color:#c8b088;overflow-y:auto;transform:translateY(110%);
  transition:transform .3s;
}
#invBox.open{transform:translateY(0)}
#invBox h3{color:var(--gold);margin-bottom:8px;font-size:14px}
.inv-list{display:flex;flex-wrap:wrap;gap:6px}
.inv-item{
  padding:6px 10px;background:rgba(80,55,20,.5);border:1px solid #6a4a20;
  border-radius:4px;font-size:12px;color:#e0c898;cursor:pointer;
}
.inv-item:hover{background:rgba(140,100,30,.6)}
.inv-empty{color:#6a5a40;font-style:italic;font-size:12px}

/* ===== 开场画面 ===== */
#titleScreen{
  position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center,#3a2510 0%,#120c05 100%);
  color:#e8d8a8;padding:20px;animation:fadeIn .6s;
}
#titleScreen h1{
  font-size:clamp(28px,7vw,52px);color:var(--gold);letter-spacing:4px;
  text-shadow:0 0 30px rgba(200,160,40,.4),0 4px 0 #5a3a10;
  margin-bottom:8px;font-weight:bold;
}
#titleScreen .sub{font-size:clamp(12px,3vw,16px);color:#b09060;letter-spacing:2px;margin-bottom:30px}
#titleScreen .dragon-svg{width:min(70vw,300px);margin-bottom:24px;filter:drop-shadow(0 0 20px rgba(200,100,20,.5))}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.floaty{animation:float 4s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.9}50%{opacity:.6}}
.flicker{animation:flicker 2s infinite}

/* ===== 打字机光标 ===== */
.cursor{display:inline-block;width:8px;height:16px;background:#8a6010;
  animation:flicker .8s infinite;vertical-align:middle;margin-left:2px}

/* ===== 响应式 ===== */
@media(max-width:600px){
  #storyBox{margin:6px;padding:14px 14px;font-size:14px;line-height:1.75}
  .btn{padding:9px 12px;font-size:13px}
  #hud{font-size:12px;padding:6px 8px;gap:6px}
  .hud-title{display:none}
  .monster{width:90px}
  .monster .svgBox{width:74px;height:74px}
}
</style>
</head>
<body>

<!-- ===== 开场画面 ===== -->
<div id="titleScreen">
  <svg class="dragon-svg floaty" viewBox="0 0 200 200">
    <defs>
      <radialGradient id="fire" cx="50%" cy="50%">
        <stop offset="0%" stop-color="#ffdd55"/>

    <circle cx="100" cy="100" r="16" fill="#1a0800"/>

<!-- ===== 主应用 ===== -->
<div id="app" class="hidden">
  <div class="vignette"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-title">⚔ D100 巨龙铠甲</div>
    <div class="hud-item">❤ <div class="hp-bar"><div class="hp-fill" id="hpFill" style="width:100%"></div></div><span id="hpText">40/40</span></div>

<script>
/* ============================================================
   D100 DUNGEON · 巨龙铠甲 · 单文件实现
   ============================================================ */

/* ---------- 音效（Web Audio API 合成） ---------- */
const Sound = (() => {
  let ctx = null, on = true;
  function init(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); }
  function beep(freq=440, dur=0.08, type='sine', vol=0.06){
    if(!on) return;
    try{
      init();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(ctx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      o.stop(ctx.currentTime + dur);
    }catch(e){}
  }
  return {
    click(){ beep(600, .05, 'square', .04); },
    hit(){ beep(140, .12, 'sawtooth', .08); },
    good(){ beep(880, .1, 'triangle', .07); setTimeout(()=>beep(1100,.12,'triangle',.06), 80); },
    bad(){ beep(180, .2, 'sawtooth', .08); },
    dice(){ beep(500, .04, 'square', .03); },
    toggle(){ on = !on; return on; },
    isOn(){ return on; }
  };
})();

/* ---------- 骰子工具 ---------- */
const D = {
  n:(s)=>{ Sound.dice(); return Math.floor(Math.random()*s)+1; },
  d4:()=>Math.floor(Math.random()*4)+1,
  d6:()=>Math.floor(Math.random()*6)+1,
  d10:()=>Math.floor(Math.random()*10)+1,
  d100:()=>Math.floor(Math.random()*100)+1,
};

/* ---------- 怪物定义（严格依据原文怪物表） ---------- */
const MON = {
  zombie:      { name:'殭屍', av:15, def:3, dmg:5, hp:4,  k:4,  ab:['疾病','群體','束縛'], svg:'zombie' },
  skeleton:    { name:'骷髏', av:25, def:5, dmg:4, hp:13, k:13, ab:['恐懼','再生','復活','束縛'], svg:'skeleton' },
  spider:      { name:'骷髏蜘蛛', av:21, def:4, dmg:5, hp:6,  k:15, ab:['再生','復活','織網','突襲','束縛'], svg:'spider' },
  queen:       { name:'殭屍女王', av:24, def:5, dmg:1, hp:16, k:16, ab:['疾病'], svg:'queen' },
  lich:        { name:'巫妖王', av:42, def:7, dmg:7, hp:33, k:5,  ab:['火焰風暴','黑暗魔法','再生','復活'], svg:'lich' },
  croc:        { name:'不死鱷魚', av:50, def:3, dmg:2, hp:18, k:0,  ab:['巨大','恐懼'], svg:'croc' },
  revCroc:     { name:'復活的不死鱷魚', av:60, def:3, dmg:3, hp:20, k:0, ab:['巨大','恐懼'], svg:'croc' },
  tentacle:    { name:'觸手怪物', av:30, def:0, dmg:1, hp:8,  k:0,  ab:['疾病','群體','束縛','連擊4'], svg:'tentacle' },
  imp:         { name:'小惡魔', av:17, def:3, dmg:5, hp:1,  k:1,  ab:['火焰','群體'], svg:'imp' },
  revZombie:   { name:'復活的殭屍', av:15, def:3, dmg:5, hp:4, k:0, ab:['疾病','群體','束縛'], svg:'zombie' },
  revSkeleton: { name:'復活的骷髏', av:25, def:5, dmg:4, hp:11, k:0, ab:['恐懼','再生','復活','束縛'], svg:'skeleton' },
  revSpider:   { name:'復活的骷髏蜘蛛', av:21, def:4, dmg:5, hp:6, k:0, ab:['再生','復活','織網','突襲','束縛'], svg:'spider' },
  revQueen:    { name:'復活的殭屍女王', av:24, def:5, dmg:1, hp:16, k:0, ab:['疾病'], svg:'queen' },
};

/* ---------- 怪物 SVG ---------- */
function monSVG(kind, size=90){
  const c = 'fill:#c8a860';
  const svgs = {
    zombie:`<svg viewBox="0 0 100 100" width="${size}" height="${size}">
      <ellipse cx="50" cy="90" rx="28" ry="6" fill="rgba(0,0,0,.3)"/>
      <path d="M38 88 Q36 60 40 45 Q50 38 60 45 Q64 60 62 88 Z" fill="#5a7a48"/>
      <circle cx="50" cy="30" r="16" fill="#7a9a68"/>
      <circle cx="44" cy="28" r="3" fill="#d33"/>
      <circle cx="56" cy="28" r="3" fill="#d33"/>
      <path d="M44 38 Q50 42 56 38" stroke="#2a1a0a" stroke-width="2" fill="none"/>
      <path d="M30 55 Q22 50 25 42 M70 55 Q78 50 75 42" stroke="#5a7a48" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>`,
    skeleton:`<svg viewBox="0 0 100 100" width="${size}" height="${size}">
      <ellipse cx="50" cy="90" rx="26" ry="5" fill="rgba(0,0,0,.3)"/>
      <circle cx="50" cy="28" r="17" fill="#e8e0c8" stroke="#6a5a40" stroke-width="1.5"/>
      <circle cx="43" cy="26" r="4" fill="#1a0f05"/>

/* ---------- 表 F：通用搜索 ---------- */
function rollTableF(S){
  const r = D.d10();
  if(r <= 3){ const g = D.d6()*10; addGold(S,g); toast(`找到 ${g} 金幣！`); }
  else if(r <= 6){
    const potions = ['劣制治病藥水','劣制解毒藥水','聖水'];
    const p = potions[D.d6()%3];
    addItem(S,{name:p, val:16, note:'消耗品'});
    toast(`找到 ${p}！`);
  }
  else if(r <= 8){ toast('這裡什麼也沒有。'); }
  else {
    toast('你驚動了一隻游蕩的怪物！');
    return true;
  }
  return false;
}

/* ---------- 表 S：法術 ---------- */
function rollTableS(){
  const spells = ['火焰箭','冰霜新星','治療之光','暗影護盾','雷電術'];
  return spells[Math.floor(Math.random()*spells.length)];
}

/* ---------- 状态 ---------- */
const S = {
  mode: 'intro',
  player: { hp:40, maxHp:40, av:20, def:5, dmg:3, str:30, dex:30, int:30, fate:5, gold:0, spells:[] },
  inv: [],
  time: 0,
  turn: 0,
  para: null,
  history: [],
  flags: {},
  combat: null,
  rememberedPara: null,
  soundOn: true,
  achievements: [],
};

/* ---------- 辅助函数 ---------- */
function hasItem(S, name){ return S.inv.some(i=>i.name===name); }
function addItem(S, item){ S.inv.push(item); if(S.mode!=='combat') renderInv(); }
function removeItem(S, name){ S.inv = S.inv.filter(i=>i.name!==name); renderInv(); }
function addGold(S, n){ S.player.gold += n; updateHud(); }
function addTime(S, n){ S.time += n; updateHud(); if(S.para && PARAS[S.para] && PARAS[S.para].persistent && /①/.test(PARAS[S.para].persistent)) { /* 持续效果由段落 onEnter 处理 */ } }
function addPoison(S, n){ S.flags.poison = (S.flags.poison||0) + n; toast(`毒素 +${n}（目前 ${S.flags.poison}）`); }
function applyDamage(S, dmg, src){
  S.player.hp -= dmg;
  if(S.player.hp < 0) S.player.hp = 0;
  updateHud();
  toast(`${src}！受到 ${dmg} 點傷害`);
  if(S.player.hp <= 0){ gameOver(); }
}
function gainLoot(S){
  const r = D.d100();
  if(r < 50) addGold(S, D.d6()*10);
  else if(r < 80) addItem(S,{name:'聖水', val:16, note:'可對抗復活怪'});
  else addItem(S,{name:'火焰抗性藥水', val:30, note:'抗熱 +1'});
  toast('你獲得了一些物品！');
}

/* ---------- HUD 更新 ---------- */
function updateHud(){
  const p = S.player;
  document.getElementById('hpFill').style.width = (p.hp/p.maxHp*100)+'%';
  document.getElementById('hpText').textContent = `${p.hp}/${p.maxHp}`;

  document.getElementById('fateText').textContent = p.fate;
  document.getElementById('goldText').textContent = p.gold;
}

/* ---------- 打字机效果 ---------- */
let typeTimer = null;
function typeText(el, text, cb){
  if(typeTimer) clearInterval(typeTimer);
  el.innerHTML = '';
  let i = 0;
  const speed = 12;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  typeTimer = setInterval(()=>{
    if(i >= text.length){
      clearInterval(typeTimer); typeTimer=null;
      cursor.remove();
      if(cb) cb();
      return;
    }
    const ch = text[i++];
    if(ch === '\n'){
      cursor.insertAdjacentText('beforebegin','\n');
    } else {
      cursor.insertAdjacentText('beforebegin', ch);
    }
    el.scrollTop = el.scrollHeight;
  }, speed);
  el._skipType = ()=>{
    if(typeTimer){ clearInterval(typeTimer); typeTimer=null; }
    el.textContent = text;
    if(cb) cb();
  };
}

/* ---------- 渲染 ---------- */
function render(){
  const P = PARAS[S.para];
  if(!P){ return; }
  const box = document.getElementById('storyBox');
  document.getElementById('paraTitle').textContent = P.t;
  const textEl = document.getElementById('paraText');
  textEl.innerHTML = '';
  typeText(textEl, P.txt);

  // 区域 chip
  const chip = document.getElementById('regionChip');
  chip.className = P.c || 'green';
  chip.textContent = P.r || '?';
  document.getElementById('regionLabel').textContent = `區域 ${P.r||'?'} · ${P.t.split('·')[1]?.trim()||''}`;
  document.getElementById('regionSub').textContent = (REGION_COLOR[P.c]||'未知') + '區域';
  document.getElementById('regionLabel').style.color = '#5a3a10';

  renderActions(P);
  updateHud();
  renderInv();
}

function renderActions(P){
  const actions = document.getElementById('actions');
  actions.innerHTML = '';
  if(S.mode === 'combat'){ actions.style.display='none'; return; }
  actions.style.display = 'flex';

  // 出口
  (P.ex||[]).forEach(e=>{
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = `🚪 ${e.d} → ${typeof e.to==='number'? '第'+e.to+'段' : e.to}`;
    btn.onclick = ()=>{ Sound.click(); handleExit(e); };
    actions.appendChild(btn);
  });

  // 搜索
  if(P.s !== null && P.s !== undefined){
    if(P.lockSearch && !S.flags.lockOpened){
      const b = document.createElement('button');
      b.className='btn'; b.textContent='🔒 搜索（需先開門）'; b.disabled = true;
      actions.appendChild(b);
    } else {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = P.s === 'F' ? '🔍 搜索（擲表F）' : '🔍 搜索';
      b.onclick = ()=>{ Sound.click(); handleSearch(P); };
      actions.appendChild(b);
    }
  }

  // 特殊选项
  if(P.special === 'altar'){
    const b = document.createElement('button');
    b.className='btn';
    b.textContent='🙏 祈禱（塗黑1①）';
    b.disabled = S.flags.prayed;
    b.onclick = ()=>{ Sound.click(); doPray(); };
    actions.appendChild(b);
  }
  if(P.special === 'canyon'){
    const b = document.createElement('button');
    b.className='btn';
    b.textContent='🌉 過橋檢定（敏捷-5）';
    b.onclick = ()=>{ Sound.click(); crossBridge(); };
    actions.appendChild(b);
  }
  if(P.special === 'river'){
    const b = document.createElement('button');
    b.className='btn';
    b.textContent='🌊 過河檢定（力量-5）';
    b.onclick = ()=>{ Sound.click(); crossRiver(); };
    actions.appendChild(b);
  }
  if(P.special === 'lavadoor'){
    if(S.flags.doorOpen){
      const b = document.createElement('button');
      b.className='btn good'; b.textContent='✅ 龍鐵門已開啟'; b.disabled = true;
      actions.appendChild(b);
    } else if(hasItem(S,'龍眼鑰匙')){
      const b = document.createElement('button');
      b.className='btn primary'; b.textContent='🔑 使用龍眼鑰匙開門';
      b.onclick = ()=>{ Sound.click(); gotoPara(89); };
      actions.appendChild(b);
    }
  }
  if(P.lavadoor === false){ /* noop */ }

  // 返回按钮（如有出口则不需要）
  if((!P.ex || P.ex.length===0) && S.para !== 'victory'){
    const b = document.createElement('button');
    b.className='btn'; b.textContent='↩ 返回';
    b.onclick = ()=>{ Sound.click(); backToPara(); };
    actions.appendChild(b);
  }

  // 使用物品按钮
  const use = document.createElement('button');
  use.className='btn ghost'; use.textContent='🎒 背包';
  use.onclick = ()=>{ Sound.click(); toggleInv(true); };
  actions.appendChild(use);
}

/* ---------- 交互逻辑 ---------- */
function handleExit(e){
  if(e.door && !S.flags.doorOpen && e.doorCode){
    // 需要开门
    const r = D.d100();
    const success = r <= (S.player.str||30);
    if(success){ S.flags.doorOpen = true; toast('你打開了門！'); Sound.good(); }
    else { toast('你未能打開門（力量檢定失敗）。'); Sound.bad(); return; }
  }
  gotoPara(e.to);
}

function handleSearch(P){
  if(P.s === 'F'){
    const encounter = rollTableF(S);
    if(encounter){ startCombat('zombie', 1, null); }
    return;
  }
  if(typeof P.s === 'number'){
    if(S.flags.searched === S.para){ toast('這個區域已經搜索過了。'); return; }
    S.flags.searched = S.para;
    gotoPara(P.s);
  }
}

function doPray(){
  if(S.flags.prayed){ return; }
  S.flags.prayed = true;
  addTime(S,1);
  const r = D.d10();
  let msg = '';
  if(r<=2){ msg='雕像上的眼睛發出紅光，你覺得你激怒了神。'; Sound.bad(); }
  else if(r<=4){ msg='你聽到腳下壓力墊的咔噠聲——陷阱！'; applyDamage(S, D.d6(), '陷阱'); }
  else if(r<=6){ msg='似乎什麼都沒有發生。神沒有在聽。'; }
  else if(r<=8){ msg='雕像上的眼睛發出綠色的光芒。你感到受到祝福。'; S.player.fate += 1; }
  else { msg='雕像開始震動，然後整個教堂開始搖來搖去。你感到強大的力量。'; S.player.fate += 2; S.player.hp = Math.min(S.player.maxHp, S.player.hp + 3); }
  toast(msg);
  render();
}

function crossBridge(){
  const r = D.d100();
  const need = S.player.dex - 5;
  if(r <= need){ toast('你安全地通過了木橋。'); }
  else { applyDamage(S, 10, '從橋上墜落'); }
}

function crossRiver(){
  const r = D.d100();
  const need = S.player.str - 5;
  if(r <= need){ toast('你安全地渡過了河。'); }
  else { applyDamage(S, 2, '被河水沖擊'); addTime(S,1); }
}

function backToPara(){
  if(S.rememberedPara){ gotoPara(S.rememberedPara); }
  else { gotoPara(1); }
}

/* ---------- 段落跳转 ---------- */
function gotoPara(id){
  if(id === 'defeat'){ gameOver(); return; }
  if(id === 'victory'){ victory(); return; }
  if(id === 'remember'){
    if(S.rememberedPara) gotoPara(S.rememberedPara);
    else toast('沒有記住的段落。');
    return;
  }
  if(!PARAS[id]){ toast(`段落 ${id} 未實作，返回上一段。`); return; }
  
  // 若從戰鬥勝利進入
  S.mode = 'explore';
  S.para = String(id);
  S.turn++;
  addTime(S,1);
  
  // 記錄歷史
  S.history.push({ turn:S.turn, para:id, title:PARAS[id].t, time:S.time });
  renderHistory();

  // 觸發進入效果
  if(PARAS[id].onEnter){
    try { PARAS[id].onEnter(S); } catch(e){ console.warn(e); }
  }

  // 觸發戰鬥
  if(PARAS[id].enc){
    render();
    setTimeout(()=>{ startCombat(PARAS[id].enc); }, 500);
    return;
  }

  render();
}

/* ---------- 戰鬥系統 ---------- */
function startCombat(enc){
  S.mode = 'combat';
  const template = MON[enc.m];
  if(!template){ toast('未知怪物，跳過戰鬥'); gotoPara(enc.win||8); return; }
  const n = enc.n || 1;
  S.combat = {
    monsters: [],
    currentIndex: 0,
    onWin: enc.win,
    onFlee: enc.escapeText,
    noFlee: enc.noFlee || false,
    atkPenalty: enc.atkPenalty || 0,
    round: 0,
    log: [],
  };
  for(let i=0;i<n;i++){
    S.combat.monsters.push({
      key: enc.m, name: template.name + (n>1?` #${i+1}`:''), 
      av: template.av, def: template.def, dmg: template.dmg,
      hp: template.hp, maxHp: template.hp,
      ab: template.ab.slice(), svg: template.svg, k: template.k,
    });
  }
  // 套用 crocodile 修正
  if(enc.m === 'croc'){
    if(S.flags.croc5){ S.combat.monsters.forEach(m=>{ m.hp += 10; m.av -= 10; m.maxHp += 10; }); }
    else if(S.flags.croc10){ S.combat.monsters.forEach(m=>{ m.av += 10; }); }
  }
  document.getElementById('combatPanel').classList.remove('hidden');
  renderCombat();
  combatLog('戰鬥開始！');
}

function renderCombat(){
  const c = S.combat;
  if(!c) return;
  document.getElementById('combatTitle').textContent = `⚔ 戰鬥 · 第 ${c.round+1} 回合`;
  const box = document.getElementById('combatMonsters');
  box.innerHTML = '';
  c.monsters.forEach((m, i)=>{
    const div = document.createElement('div');
    div.className = 'monster' + (m.hp<=0?' dead':'');
    div.innerHTML = `
      <div class="svgBox">${monSVG(m.svg, 84)}</div>
      <div class="mname">${m.name}</div>
      <div class="mlabel">HP ${m.hp}/${m.maxHp} · AV ${m.av} · Def ${m.def}</div>
      <div class="mhp"><div style="width:${m.hp/m.maxHp*100}%"></div></div>
    `;
    box.appendChild(div);
  });
  const log = document.getElementById('combatLog');
  log.innerHTML = c.log.slice(-30).map(l=>`<div>${l}</div>`).join('');
  log.scrollTop = log.scrollHeight;

  const actions = document.getElementById('combatActions');
  actions.innerHTML = '';
  const btnAtk = document.createElement('button');
  btnAtk.className='btn danger';
  btnAtk.textContent = '🗡 攻擊';
  btnAtk.onclick = ()=>{ Sound.click(); playerAttack(); };
  actions.appendChild(btnAtk);

  if(!c.noFlee){
    const btnFlee = document.createElement('button');
    btnFlee.className='btn';
    btnFlee.textContent = '🏃 逃跑';
    btnFlee.onclick = ()=>{ Sound.click(); playerFlee(); };
    actions.appendChild(btnFlee);
  }
  if(S.player.fate > 0){
    const btnFate = document.createElement('button');
    btnFate.className='btn ghost';
    btnFate.textContent = `🍀 命運點（${S.player.fate}）`;
    btnFate.onclick = ()=>{ Sound.click(); useFate(); };
    actions.appendChild(btnFate);
  }
  if(hasItem(S,'聖水')){
    const btnHoly = document.createElement('button');
    btnHoly.className='btn primary';
    btnHoly.textContent = '💧 使用聖水（對抗復活）';
    btnHoly.onclick = ()=>{ Sound.click(); useHolyWater(); };
    actions.appendChild(btnHoly);
  }
}

function combatLog(msg){
  if(!S.combat) return;
  S.combat.log.push(msg);
  const log = document.getElementById('combatLog');
  if(log) log.innerHTML = S.combat.log.slice(-30).map(l=>`<div>${l}</div>`).join('');
  if(log) log.scrollTop = log.scrollHeight;
}

function playerAttack(){
  const c = S.combat;
  if(!c) return;
  const target = c.monsters[c.currentIndex];
  if(!target || target.hp<=0){ nextMonster(); return; }
  
  const roll = D.d100();
  const need = S.player.av - target.def - (c.atkPenalty||0);
  if(roll <= need){
    let dmg = D.d6() + S.player.dmg;
    target.hp -= dmg;
    combatLog(`<span class="good">你擊中 ${target.name}！造成 ${dmg} 點傷害（HP ${Math.max(0,target.hp)}/${target.maxHp}）</span>`);
    Sound.hit();
    if(target.hp <= 0){
      target.hp = 0;
      combatLog(`${target.name} 被擊敗！`);
      setTimeout(()=>nextMonster(), 400);
      return;
    }
  } else {
    combatLog(`你揮空了（擲 ${roll}，需要 ≤ ${need}）`);
    Sound.bad();
  }
  setTimeout(()=>monsterTurn(), 400);
}

function nextMonster(){
  const c = S.combat;
  c.currentIndex++;
  while(c.currentIndex < c.monsters.length && c.monsters[c.currentIndex].hp <= 0){
    c.currentIndex++;
  }
  if(c.currentIndex >= c.monsters.length){
    combatVictory();
    return;
  }
  renderCombat();
}

function monsterTurn(){
  const c = S.combat;
  if(!c || !c.monsters) return;
  const target = c.monsters[c.currentIndex];
  if(!target || target.hp<=0){ nextMonster(); return; }
  
  c.round++;
  // 怪物反應 1d10
  const react = D.d10();
  let reaction = 'attack';
  if(react <= 5) reaction = 'attack';
  else if(react <= 7) reaction = 'roar';
  else if(react <= 9){
    // 嘗試逃跑，束縛需重擲
    if(target.ab.includes('束縛')){
      const r2 = D.d10();
      if(r2 === 10){ reaction = 'flee'; }
      else { reaction = 'attack'; combatLog(`${target.name} 被束縛能力驅使，重新振作！（束縛重擲 ${r2}）`); }
    } else {
      reaction = 'flee';
    }
  } else reaction = 'special';

  if(reaction === 'attack'){
    const roll = D.d100();
    const need = target.av - S.player.def;
    if(roll <= need){
      let dmg = target.dmg;
      S.player.hp -= dmg;
      if(S.player.hp < 0) S.player.hp = 0;
      updateHud();
      combatLog(`<span class="dmg">${target.name} 擊中你！受到 ${dmg} 點傷害（HP ${S.player.hp}/${S.player.maxHp}）</span>`);
      Sound.bad();
      if(S.player.hp <= 0){ setTimeout(()=>gameOver(), 500); return; }
    } else {
      combatLog(`${target.name} 攻擊失手（擲 ${roll}，需要 ≤ ${need}）`);
    }
  } else if(reaction === 'roar'){
    combatLog(`${target.name} 發出怒吼，沒有攻擊。`);
  } else if(reaction === 'flee'){
    combatLog(`${target.name} 試圖逃跑！`);
    if(!c.noFlee){
      setTimeout(()=>{ combatVictory(true); }, 500);
      return;
    } else {
      combatLog(`${target.name} 無法逃離（被阻擋）。`);
    }
  } else {
    combatLog(`${target.name} 使出特殊能力：${target.ab[0]||'咆哮'}`);
    if(target.ab.includes('疾病') && Math.random()<0.5){
      addPoison(S,1);
      combatLog(`你感染了疾病！`);
    }
  }
  renderCombat();
}

function combatVictory(fled){
  const c = S.combat;
  if(!c) return;
  if(fled){
    toast(c.onFlee || '怪物逃跑了！');
    S.mode = 'explore';
    document.getElementById('combatPanel').classList.add('hidden');
    S.combat = null;
    render();
    return;
  }
  // 擊殺獎勵
  const totalK = c.monsters.reduce((s,m)=>s+(m.k||0),0);
  if(totalK > 0){ addGold(S, totalK); toast(`戰鬥勝利！獲得 ${totalK} 金幣擊殺獎勵`); }
  else { toast('戰鬥勝利！'); }
  Sound.good();
  
  S.mode = 'explore';
  document.getElementById('combatPanel').classList.add('hidden');
  
  const next = c.onWin;
  S.combat = null;
  
  if(next === 'victory'){ setTimeout(()=>victory(), 500); return; }
  if(next === 'defeat'){ setTimeout(()=>gameOver(), 500); return; }
  if(typeof next === 'number'){ setTimeout(()=>gotoPara(next), 500); }
  else { render(); }
}

function playerFlee(){
  const c = S.combat;
  if(!c || c.noFlee){ toast('你無法逃離這場戰鬥！'); return; }
  const roll = D.d100();
  if(roll <= S.player.dex - 10){
    toast('你成功逃離了戰鬥！');
    combatLog('你逃離了戰鬥！');
    setTimeout(()=>{ combatVictory(true); }, 500);
  } else {
    toast('逃跑失敗！');
    combatLog('逃跑失敗！');
    setTimeout(()=>monsterTurn(), 400);
  }
}

function useFate(){
  if(S.player.fate <= 0) return;
  S.player.fate--;
  updateHud();
  toast('你花費了 1 點命運點，重新擲骰！');
  // 簡單實現：讓玩家再攻擊一次
  playerAttack();
}

function useHolyWater(){
  const c = S.combat;
  if(!c) return;
  const target = c.monsters[c.currentIndex];
  if(!target || !/復活|rev/i.test(target.key)){
    toast('聖水只能對抗名字中有「復活」的怪物。');
    return;
  }
  removeItem(S, '聖水');
  target.hp = 0;
  combatLog(`聖水濺到 ${target.name} 身上，牠化為灰燼！`);
  toast('聖水生效！怪物被消滅。');
  Sound.good();
  setTimeout(()=>nextMonster(), 400);
}

/* ---------- 歷史記錄 ---------- */
function renderHistory(){
  const list = document.getElementById('historyList');
  if(!list) return;
  list.innerHTML = S.history.slice().reverse().map(h=>
    `<div class="hitem ${h.para===S.para?'cur':''}">
      <div style="color:#c9a227">回合 ${h.turn} · ⏱${h.time}</div>
      <div>${h.title}</div>
    </div>`
  ).join('') || '<div style="color:#6a5a40;font-style:italic">尚無紀錄</div>';
}

function toggleHistory(open){
  document.getElementById('historyPanel').classList.toggle('open', open);
  if(open) renderHistory();
  Sound.click();
}

/* ---------- 背包 ---------- */
function renderInv(){
  const box = document.getElementById('invContent');
  if(!box) return;
  if(S.inv.length === 0){
    box.innerHTML = '<div class="inv-empty">背包是空的。</div>';
    return;
  }
  const groups = {};
  S.inv.forEach(it=>{
    const key = it.name.replace(/\(\d+\)/,'').trim();
    groups[key] = groups[key] || [];
    groups[key].push(it);
  });
  box.innerHTML = `<div class="inv-list">${
    Object.entries(groups).map(([name, items])=>{
      const it = items[0];
      return `<div class="inv-item" title="${it.note||''}">
        ${name}${items.length>1?' ×'+items.length:''}
        ${it.bonus?`<span style="color:#8c8"> (${it.bonus})</span>`:''}
      </div>`;
    }).join('')
  }</div>`;
}

function toggleInv(open){
  document.getElementById('invBox').classList.toggle('open', open);
  if(open) renderInv();
  Sound.click();
}

/* ---------- 彈窗 ---------- */
function showModal(html){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">${html}</div>
    </div>`;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- 存檔 ---------- */
function saveGame(){
  try {
    const data = {
      player: S.player, inv: S.inv, time: S.time, turn: S.turn,
      para: S.para, history: S.history, flags: S.flags,
      rememberedPara: S.rememberedPara, achievements: S.achievements,
      savedAt: new Date().toISOString(),
    };
    localStorage.setItem('d100_dragon_armour_save', JSON.stringify(data));
    toast('💾 遊戲已存檔！');
    Sound.good();
  } catch(e){ toast('存檔失敗：'+e.message); }
}

function loadGame(){
  try {
    const raw = localStorage.getItem('d100_dragon_armour_save');
    if(!raw){ toast('找不到存檔。'); return; }
    const d = JSON.parse(raw);
    Object.assign(S.player, d.player);
    S.inv = d.inv || [];
    S.time = d.time || 0;
    S.turn = d.turn || 0;
    S.para = d.para;
    S.history = d.history || [];
    S.flags = d.flags || {};
    S.rememberedPara = d.rememberedPara || null;
    S.achievements = d.achievements || [];
    S.mode = 'explore';
    S.combat = null;
    document.getElementById('combatPanel').classList.add('hidden');
    document.getElementById('titleScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    if(S.para && PARAS[S.para]){ render(); toast('📂 讀檔成功！'); }
    else { gotoPara(1); }
    Sound.good();
  } catch(e){ toast('讀檔失敗：'+e.message); }
}

/* ---------- 開始遊戲 ---------- */
function startGame(){
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  // 初始物品
  S.inv = [];
  addItem(S, {name:'劣制治病藥水', val:20, note:'恢復 1d6 HP'});
  addItem(S, {name:'劣制治病藥水', val:20, note:'恢復 1d6 HP'});
  addItem(S, {name:'劣制解毒藥水', val:20, note:'解毒'});
  addItem(S, {name:'聖水', val:16, note:'對抗復活怪物'});
  addItem(S, {name:'聖水', val:16, note:'對抗復活怪物'});
  addItem(S, {name:'火把', val:5, note:'照明'});
  updateHud();
  gotoPara(1);
}

/* ---------- 事件綁定 ---------- */
document.getElementById('btnStart').onclick = ()=>{
  Sound.click();
  document.getElementById('titleScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  showHelp();
};

document.querySelectorAll('#nav button').forEach(btn=>{
  btn.onclick = ()=>{
    Sound.click();
    const k = btn.dataset.nav;
    if(k === 'help'){ showHelp(); }
    else if(k === 'inv'){ toggleInv(true); }
    else if(k === 'history'){ toggleHistory(true); }
    else if(k === 'save'){ saveGame(); }
    else if(k === 'load'){ loadGame(); }
    else if(k === 'sound'){
      const on = Sound.toggle();
      document.getElementById('soundIcon').textContent = on ? '🔊' : '🔇';
      toast(on ? '音效已開啟' : '音效已關閉');
    }
  };
});

// 點擊故事區跳過打字
document.addEventListener('click', (e)=>{
  const box = document.getElementById('storyBox');
  if(box.contains(e.target) && box._skipType){ box._skipType(); box._skipType = null; }
});

// 點擊外部關閉背包
document.addEventListener('click', (e)=>{
  const inv = document.getElementById('invBox');
  const hist = document.getElementById('historyPanel');
  if(inv.classList.contains('open') && !inv.contains(e.target) && !e.target.closest('[data-nav="inv"]')){
    inv.classList.remove('open');
  }
  if(hist.classList.contains('open') && !hist.contains(e.target) && !e.target.closest('[data-nav="history"]')){
    hist.classList.remove('open');
  }
});

/* ---------- 初始化 ---------- */
window.addEventListener('load', ()=>{
  // 顯示開始畫面
  document.getElementById('titleScreen').classList.remove('hidden');
  // 檢查存檔
  if(localStorage.getItem('d100_dragon_armour_save')){
    const btn = document.getElementById('btnStart');
    btn.textContent = '繼續冒險';
    // 雙擊可新遊戲
    const newBtn = document.createElement('button');
    newBtn.className = 'btn';
    newBtn.textContent = '新遊戲';
    newBtn.style.marginTop = '12px';
    newBtn.onclick = ()=>{ localStorage.removeItem('d100_dragon_armour_save'); location.reload(); };
    btn.parentNode.insertBefore(newBtn, btn.nextSibling);
  }
});

// 防止手機雙擊縮放
let lastTouch = 0;
document.addEventListener('touchend', (e)=>{
  const now = Date.now();
  if(now - lastTouch <= 300){ e.preventDefault(); }
  lastTouch = now;
}, {passive:false});

</script>
