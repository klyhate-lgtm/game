<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大禹治水 Legacy of Yu - 還原版圖版</title>
<style>
    /* ================= 基礎與變數 ================= */
    :root {
        --bg-dark: #1a110a;
        --parchment: #e8dcc4;
        --text-gold: #d4af37;
        --forest: #2c3e2d;
        --river: #4fc3f7;
        --grass: #8bc34a;
        --sand: #d7ccc8;
        --font-serif: 'Georgia', 'PMingLiU', 'SimSun', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: var(--font-serif);
        background-color: var(--bg-dark);
        color: var(--parchment);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background-image: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.95) 100%);
    }

    /* ================= 頂部狀態列 ================= */
    #top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 15px;
        background: linear-gradient(to bottom, #2c1e16, #1a110a);
        border-bottom: 2px solid var(--text-gold);
        font-size: 14px; z-index: 10;
        box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }
    .stat-group { display: flex; gap: 15px; align-items: center; }
    .stat-item { display: flex; align-items: center; gap: 5px; font-weight: bold; color: var(--text-gold); }
    .res-group { display: flex; gap: 10px; font-size: 15px; background: rgba(0,0,0,0.5); padding: 4px 15px; border-radius: 15px; border: 1px solid #3e2723;}
    
    /* 洪水軌道 */
    #flood-track { display: flex; gap: 4px; background: rgba(0,0,0,0.6); padding: 4px; border-radius: 8px; border: 1px solid #5d4037; }
    .flood-space { width: 14px; height: 14px; border-radius: 50%; background: #3e2723; }
    .flood-space.active { background: #f44336; box-shadow: 0 0 10px #f44336; transform: scale(1.2); }

    /* ================= 超寬版圖區域 (橫向捲動) ================= */
    #board-scroll {
        flex: 1;
        overflow-x: auto;
        overflow-y: hidden;
        position: relative;
        background: #000;
    }
    #board-scroll::-webkit-scrollbar { height: 10px; }
    #board-scroll::-webkit-scrollbar-thumb { background: var(--text-gold); border-radius: 5px; }

    /* 模擬原版寬版地圖 (寬度設為 1600px，保證足夠寬) */
    #map-container {
        width: 1600px;
        height: 100%;
        position: relative;
        /* 這裡使用 CSS 漸層模擬原圖的：森林(上) -> 河流(中) -> 草地(下) */
        background: linear-gradient(
            to bottom,
            #1e2d1f 0%, #2c4a2e 15%,     /* 頂部森林 */
            #81d4fa 25%, #29b6f6 35%, #03a9f4 40%, /* 河流 */
            #81c784 45%, #8bc34a 60%, #c5e1a5 80%, #d7ccc8 100% /* 底部草地與村莊 */
        );
        box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
    }

    /* 森林區 (頂部) */
    .zone-forest {
        position: absolute; top: 0; left: 0; width: 100%; height: 25%;
        /* 用 CSS 點陣圖案模擬樹林 */
        background-image: radial-gradient(circle, rgba(0,0,0,0.4) 20%, transparent 20%);
        background-size: 40px 40px;
        opacity: 0.8;
        pointer-events: none;
    }

    /* 河流與運河區 */
    #river-zone {
        position: absolute; top: 25%; left: 0; width: 100%; height: 20%;
        display: flex; align-items: center; padding: 0 50px;
        border-top: 2px solid #01579b; border-bottom: 2px solid #01579b;
    }
    
    /* 運河槽位 */
    .canal-slot {
        width: 120px; height: 60px;
        border: 2px dashed rgba(255,255,255,0.7);
        border-radius: 8px; margin-right: 40px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        font-size: 12px; color: #fff; flex-shrink: 0;
        background: rgba(0,0,0,0.2); transition: all 0.3s;
    }
    .canal-slot.built { border: 2px solid #aed581; background: rgba(46, 125, 50, 0.8); box-shadow: 0 0 15px #aed581; }

    #flood-marker {
        position: absolute; top: 50%; transform: translateY(-50%); left: 20px;
        width: 35px; height: 35px;
        background: radial-gradient(circle, #64b5f6, #1565c0);
        border-radius: 50%; border: 2px solid #fff;
        box-shadow: 0 0 20px #64b5f6;
        transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
    }

    /* 蠻族區與村民區 (放置卡牌) */
    #barbarian-zone {
        position: absolute; top: 10%; left: 100px; width: 1400px; height: 130px;
        display: flex; gap: 15px; padding: 10px; align-items: center;
    }

    #townfolk-zone {
        position: absolute; bottom: 20%; left: 100px; width: 1400px; height: 140px;
        display: flex; gap: 15px; padding: 10px; align-items: center;
    }

    /* 底部交易與建築區 */
    #bottom-board {
        position: absolute; bottom: 0; left: 0; width: 100%; height: 18%;
        display: flex; justify-content: space-between; align-items: center; padding: 0 100px;
        background: rgba(0,0,0,0.1); border-top: 1px solid rgba(0,0,0,0.2);
    }

    .trade-track { display: flex; gap: 10px; }
    .trade-slot {
        width: 60px; height: 40px; background: rgba(255,255,255,0.3); border-radius: 6px;
        display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold;
        color: #2c1e16; cursor: pointer; border: 1px solid rgba(0,0,0,0.3); transition: 0.2s;
    }
    .trade-slot:hover { background: rgba(255,255,255,0.6); }

    .building-area { display: flex; gap: 15px; }
    .building-slot {
        width: 80px; height: 60px; border: 2px dashed rgba(0,0,0,0.5);
        background: rgba(255,255,255,0.2); border-radius: 8px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        font-size: 12px; color: #2c1e16; font-weight: bold; cursor: pointer;
    }
    .building-slot:hover { background: rgba(255,255,255,0.5); }

    /* ================= 卡牌設計 ================= */
    .card {
        width: 100px; height: 140px;
        background: var(--parchment);
        border: 3px solid #3e2723;
        border-radius: 8px;
        position: relative; display: flex; flex-direction: column;
        box-shadow: 2px 4px 10px rgba(0,0,0,0.6);
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer; flex-shrink: 0;
        background-image: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, transparent 40%);
    }
    .card:hover { transform: translateY(-8px); box-shadow: 4px 12px 20px rgba(0,0,0,0.8); }
    
    .card-top { height: 35px; background: #d7ccc8; border-bottom: 2px solid #3e2723; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 18px; border-radius: 5px 5px 0 0; }
    .card-mid { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 40px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.3)); }
    .card-bot { height: 30px; background: #ffcdd2; border-top: 1px solid #ef9a9a; display: flex; justify-content: center; align-items: center; gap: 5px; font-size: 16px; border-radius: 0 0 5px 5px; }
    .card-name { position: absolute; bottom: 35px; width: 100%; text-align: center; font-size: 12px; font-weight: bold; color: #3e2723; background: rgba(255,255,255,0.8); padding: 2px 0; }

    /* ================= 玩家手牌區 ================= */
    #hand-area {
        height: 160px; background: #2c1e16; border-top: 3px solid var(--text-gold);
        padding: 10px 20px; display: flex; gap: 15px; overflow-x: auto; align-items: center;
        box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
    }

    /* ================= 底部導航列 ================= */
    #bottom-nav {
        display: flex; justify-content: space-around; background: #1a110a; padding: 10px;
    }
    .nav-btn {
        background: linear-gradient(to bottom, #5d4037, #3e2723); color: var(--text-gold);
        border: 1px solid var(--text-gold); border-radius: 6px; padding: 8px 20px;
        font-family: var(--font-serif); font-size: 15px; font-weight: bold;
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .nav-btn:hover:not(:disabled) { background: #5d4037; transform: scale(1.05); }
    .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 浮動建運河按鈕 */
    #btn-build {
        position: absolute; bottom: 20%; right: 50px; z-index: 20;
        background: #2e7d32; border-color: #aed581; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* 彈窗 */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center;
        z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(3px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
        background: var(--parchment); color: #2c1e16; padding: 25px; border-radius: 10px;
        border: 4px solid #3e2723; max-width: 90%; max-height: 85%; overflow-y: auto;
        box-shadow: 0 10px 40px rgba(0,0,0,0.9); text-align: center;
    }
    .modal-title { font-size: 22px; font-weight: bold; border-bottom: 2px solid #3e2723; padding-bottom: 10px; margin-bottom: 15px; color: #b71c1c; }
    .modal-body { font-size: 16px; line-height: 1.6; }
    .modal-btn { padding: 12px 20px; margin-top: 15px; background: #5d4037; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }

    #toast-container { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: rgba(44, 30, 22, 0.95); color: #fff; padding: 12px 20px; border-radius: 25px; border: 1px solid var(--text-gold); font-size: 14px; animation: slideDown 0.3s, fadeOut 0.3s 2.7s forwards; }
    @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>

    <!-- 頂部狀態列 -->
    <div id="top-bar">
        <div class="stat-group">
            <div class="stat-item">🔄 回合: <span id="ui-round">1</span></div>
            <div class="stat-item" style="color:#fff;">📜 <span id="ui-phase">收穫階段</span></div>
        </div>
        <div class="res-group">
            <div class="stat-item" title="工人">👷 <span id="ui-workers">白1</span></div>
            <div class="stat-item" title="木材">🪵 <span id="ui-wood">0</span></div>
            <div class="stat-item" title="黏土">🧱 <span id="ui-clay">0</span></div>
            <div class="stat-item" title="糧食">🍲 <span id="ui-provisions">0</span></div>
            <div class="stat-item" title="貝殼">🐚 <span id="ui-cowrie">0</span></div>
        </div>
        <div class="stat-group">
            <div class="stat-item" style="color:#ef9a9a;">💀 蠻族: <span id="ui-barbarians">0</span>/7</div>
            <div id="flood-track"></div>
        </div>
    </div>

    <!-- 超寬版圖區域 -->
    <div id="board-scroll">
        <div id="map-container">
            <div class="zone-forest"></div>

            <!-- 河流與運河 -->
            <div id="river-zone">
                <div id="flood-marker"></div>
                <div style="display:flex; margin-left: 50px;">
                    <div class="canal-slot" id="canal-0">運河 1</div>
                    <div class="canal-slot" id="canal-1">運河 2</div>
                    <div class="canal-slot" id="canal-2">運河 3</div>
                    <div class="canal-slot" id="canal-3">運河 4</div>
                    <div class="canal-slot" id="canal-4">運河 5</div>
                    <div class="canal-slot" id="canal-5">運河 6</div>
                </div>
            </div>

            <!-- 蠻族區 -->
            <div id="barbarian-zone"></div>

            <!-- 村民卡區 -->
            <div id="townfolk-zone"></div>

            <!-- 底部交易與建築 -->
            <div id="bottom-board">
                <div class="trade-track" id="trade-track"></div>
                <div class="building-area">
                    <div class="building-slot" onclick="Game.buildBuilding('farm')">🏡<br>農場</div>
                    <div class="building-slot" onclick="Game.buildBuilding('outpost')">⛺<br>前哨</div>
                    <div class="building-slot" onclick="Game.buildBuilding('hut')">🛖<br>小屋</div>
                </div>
            </div>

            <!-- 浮動建運河按鈕 -->
            <button class="nav-btn" id="btn-build" onclick="Game.buildCanal()">⛏️ 建運河</button>
        </div>
    </div>

    <!-- 玩家手牌區 -->
    <div id="hand-area"></div>

    <!-- 底部導航 -->
    <div id="bottom-nav">
        <button class="nav-btn" onclick="UI.openHelp()">📖 說明</button>
        <button class="nav-btn" id="btn-action" onclick="Game.nextPhase()"><span id="btn-action-text">▶️ 下一階段</span></button>
        <button class="nav-btn" onclick="Game.saveGame()">💾 存檔</button>
        <button class="nav-btn" onclick="Game.loadGame()">📂 讀檔</button>
    </div>

    <!-- 彈窗與 Toast -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">標題</div>
            <div class="modal-body" id="modal-body"></div>
            <button class="modal-btn" id="modal-close">確認</button>
        </div>
    </div>
    <div id="toast-container"></div>

<script>
// ==========================================
// 核心邏輯與 UI 控制 (同前，但優化排版)
// ==========================================
const UI = {
    toast(msg) {
        const c = document.getElementById('toast-container'), el = document.createElement('div');
        el.className = 'toast'; el.innerText = msg; c.appendChild(el); setTimeout(() => el.remove(), 3000);
    },
    openModal(title, html, btnText = "確認", action = null) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = html;
        const btn = document.getElementById('modal-close');
        btn.innerText = btnText;
        btn.onclick = () => { this.closeModal(); if(action) action(); };
        document.getElementById('modal-overlay').classList.add('active');
    },
    closeModal() { document.getElementById('modal-overlay').classList.remove('active'); },
    openHelp() {
        this.openModal("📖 遊戲說明", "<p>歡迎來到《大禹治水》。這是一個極致還原版圖的網頁版本。請使用底部的按鈕推進回合，並點擊版圖或手牌進行操作。</p>", "開始", () => { if(Game.state.phase==='Setup') Game.startGame(); });
    },
    render() {
        const s = Game.state;
        document.getElementById('ui-round').innerText = s.turn;
        document.getElementById('ui-phase').innerText = Game.getPhaseName(s.phase);
        document.getElementById('ui-workers').innerText = `白${s.workers.white} 紅${s.workers.red} 黑${s.workers.black}`;
        document.getElementById('ui-wood').innerText = s.resources.wood;
        document.getElementById('ui-clay').innerText = s.resources.clay;
        document.getElementById('ui-provisions').innerText = s.resources.provisions;
        document.getElementById('ui-cowrie').innerText = s.resources.cowrie;
        document.getElementById('ui-barbarians').innerText = s.barbarians.length;

        const track = document.getElementById('flood-track'); track.innerHTML = '';
        for (let i = 0; i <= 6; i++) track.innerHTML += `<div class="flood-space ${s.floodPos === i ? 'active' : ''}"></div>`;

        for (let i = 0; i < 6; i++) {
            const slot = document.getElementById('canal-' + i);
            if (s.canalsBuilt > i) { slot.className = 'canal-slot built'; slot.innerText = '✅ 已建'; }
            else { slot.className = 'canal-slot'; slot.innerText = `運河 ${i+1}`; }
        }
        
        document.getElementById('flood-marker').style.left = `${20 + s.floodPos * 160}px`; // 寬版圖的位移

        Game.renderBoard();
        Game.renderHand();

        const btnAct = document.getElementById('btn-action');
        if (s.phase === 'Action') { btnAct.disabled = false; document.getElementById('btn-action-text').innerText = "結束行動"; }
        else if (s.phase === 'GameOver') btnAct.disabled = true;
        else { btnAct.disabled = false; document.getElementById('btn-action-text').innerText = "下一階段"; }
    }
};

const Game = {
    state: {
        turn: 1, phase: 'Setup', workers: { white: 1, red: 0, black: 0 }, resources: { wood: 0, clay: 0, provisions: 1, cowrie: 1 },
        floodPos: 0, canalsBuilt: 0, barbarians: [], townfolkRow: [], hand: [],
        deckTF: [], deckB: []
    },
    startGame() {
        this.state.phase = 'Harvest';
        // 假資料初始化
        const icons = ['👨‍🌾','🎣','🔨','🏹','🧓'];
        for(let i=0; i<10; i++) this.state.deckTF.push({ id: 't'+i, name: '村民', icon: icons[i%5], top: '🍲', bot: '🐚' });
        this.state.hand = [this.state.deckTF.pop(), this.state.deckTF.pop(), this.state.deckTF.pop()];
        this.state.townfolkRow = [this.state.deckTF.pop(), this.state.deckTF.pop(), this.state.deckTF.pop()];
        this.state.barbarians = [{ id: 'b1', name: '好戰者', icon: '👺', req: 2 }];
        UI.render();
    },
    getPhaseName(p) { return { Harvest: "收穫", Action: "行動", GameOver: "結束" }[p] || p; },
    nextPhase() {
        if (this.state.phase === 'Action') { this.state.phase = 'Harvest'; this.state.turn++; }
        else this.state.phase = 'Action';
        UI.render();
    },
    renderBoard() {
        const bZone = document.getElementById('barbarian-zone'); bZone.innerHTML = '';
        this.state.barbarians.forEach(b => {
            bZone.innerHTML += `<div class="card" onclick="alert('打蠻族')"><div class="card-top">擊敗</div><div class="card-mid">${b.icon}</div><div class="card-bot">🐚</div><div class="card-name">${b.name}</div></div>`;
        });
        const tZone = document.getElementById('townfolk-zone'); tZone.innerHTML = '';
        this.state.townfolkRow.forEach(t => {
            tZone.innerHTML += `<div class="card"><div class="card-top">${t.top}</div><div class="card-mid">${t.icon}</div><div class="card-bot">${t.bot}</div><div class="card-name">${t.name}</div></div>`;
        });
        document.getElementById('trade-track').innerHTML = `
            <div class="trade-slot">3🐚➔🪵</div>
            <div class="trade-slot">2🐚➔🍲</div>
            <div class="trade-slot">2🍲➔👷</div>
        `;
    },
    renderHand() {
        const hZone = document.getElementById('hand-area'); hZone.innerHTML = '';
        this.state.hand.forEach(t => {
            hZone.innerHTML += `<div class="card"><div class="card-top">${t.top}</div><div class="card-mid">${t.icon}</div><div class="card-bot">${t.bot}</div><div class="card-name">${t.name}</div></div>`;
        });
    },
    buildCanal() {
        if (this.state.canalsBuilt >= 6) return;
        this.state.canalsBuilt++; UI.toast("建造運河！"); UI.render();
    },
    buildBuilding(type) { UI.toast(`嘗試建造 ${type}`); },
    saveGame() { UI.toast("已存檔"); },
    loadGame() { UI.toast("已讀檔"); }
};

window.onload = () => { UI.render(); UI.openHelp(); };
</script>
</body>
</html>
