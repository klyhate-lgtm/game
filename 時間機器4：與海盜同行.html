<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間機器4：與海盜同行</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --danger-color: #8b0000;
            --success-color: #2e8b57;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        /* 主故事區域 */
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
            position: relative;
        }

        .story-text {
            font-size: 1.1rem;
            line-height: 1.6;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .story-text::-webkit-scrollbar {
            width: 8px;
        }
        .story-text::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .choice-btn {
            background-color: #333;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .choice-btn:hover {
            background-color: #444;
            border-color: #fff;
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #555;
        }

        /* 側邊欄 */
        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #444;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-panel h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent-color);
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .item-card {
            background-color: #111;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            border: 1px solid #333;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-card svg {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
        }

        .item-label {
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            position: absolute;
            bottom: 5px;
            width: 90%;
            text-align: center;
        }

        .history-log {
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            border-left: 2px solid var(--accent-color);
            padding-left: 8px;
            margin-bottom: 5px;
        }

        /* 控制按鈕 */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .control-btn {
            flex: 1;
            background-color: #444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: #666;
        }

        /* 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--accent-color);
            text-align: center;
        }

        .modal-content h2 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .modal-content p {
            line-height: 1.6;
            text-align: left;
        }

        /* 響應式 */
        @media (max-width: 768px) {
            #app {
                flex-direction: column;
                padding: 10px;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                height: 200px;
            }
            .sidebar-panel {
                flex: 1;
                height: 100%;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 主故事面板 -->
    <div class="main-panel">
        <div class="story-text" id="storyText">
            <!-- 故事內容將由 JS 插入 -->
        </div>
        <div class="choices-container" id="choicesContainer">
            <!-- 選項按鈕將由 JS 插入 -->
        </div>
    </div>

    <!-- 側邊欄 -->
    <div class="sidebar">
        <div class="sidebar-panel">
            <h3>🎒 背包</h3>
            <div class="inventory-grid" id="inventoryGrid">
                <!-- 物品將由 JS 插入 -->
            </div>
        </div>
        <div class="sidebar-panel">
            <h3>📜 旅行紀錄</h3>
            <div class="history-log" id="historyLog">
                <!-- 歷史紀錄將由 JS 插入 -->
            </div>
        </div>
        <div class="sidebar-panel" style="flex: 0; padding-bottom: 10px;">
            <div class="controls">
                <button class="control-btn" onclick="game.showRules()">📖 規則</button>
                <button class="control-btn" onclick="game.saveGame()">💾 存檔</button>
                <button class="control-btn" onclick="game.loadGame()">📂 讀檔</button>
                <button class="control-btn" onclick="game.restart()" style="background-color: var(--danger-color);">🔄 重新開始</button>
            </div>
        </div>
    </div>
</div>

<!-- 彈窗 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <h2 id="modalTitle">標題</h2>
        <p id="modalText">內容</p>
        <button class="control-btn" onclick="game.closeModal()" style="margin-top: 20px;">關閉</button>
    </div>
</div>

            text: "「白痴！」他喊道。「那些領航員！你知道他們是怎麼得到工作的嗎？」他搓了搓手指。「一點白銀可以買到很多工作。但它買不到做好工作的智慧！他們認為我們在Puerto Plata正北方。他們說，轉向南。Caramba！」\n\n「你認為我們在哪裡？」\n\n「至少向西三百英里。Nombre de Dios！如果我們現在轉向南，我們會撞上危險的手帕礁！」\n\n幾天後的晚上，你正在吊床上睡覺，突然一陣顛簸把你摔到地板上。\n\n嘎吱！你在黑暗中跌跌撞撞，試圖找到你的衣服。又一陣可怕的噪音，你被撞到牆上。船在傾斜。從這裡出去是哪條路？你跑過牆——跑進一個水池！你抓起你的東西，爬上門。\n\n一個男人從你身邊衝過，胸口插著一把劍。他倒下了。船上只剩下最後一艘救生艇，乘客們正在爭奪誰能上去。\n\nVillavicencio上將從他的船艙裡出來。「住手！」他喊道。「我們在礁石上。牢牢地卡住了，所以今晚不會沉。等到早上，我們會為每個人建造木筏！」\n\n你在甲板上蜷縮了一夜，忍受著寒冷和不適。黎明時分，潮水退去，水手們看到他們的船時發出呻吟。船尾卡在兩塊大岩石上。船頭已經沉入海面以下。剩下的桅杆以一個瘋狂的角度伸出。你周圍看起來像是老樹的樹樁：一片陰暗的珊瑚森林。\n\n好吧，你到了。你不僅找到了殘骸，當它撞上礁石時你還在上面。當所有人都離開後，你可以悠閒地潛水尋找寶藏。你偷偷穿過岩石，沒有人能看到你。",

        43: {
            text: "你站在水面之上的一塊岩石上。Concepcion號在這裡沉沒已經六個月了。只有幾隻海鷗與你為伴。在深深的水面下，你可以看到Concepcion號的前半部分。兩半都儲存著大量的寶藏。白銀，我來了！\n\n你脫掉衣服，跳進溫暖的水中。你深吸一口氣，向底部踢去。它看起來比實際距離更遠。你幾乎到達殘骸時，開始喘不過氣來！你瘋狂地向水面踢去，衝進陽光裡。\n\n你休息一下，再試一次。又一次。最後，你成功地到達了船的甲板。綠色的東西長滿了它。你把手伸進一個洞裡，拉出什麼東西。\n\n這是一個長滿雜草、被吃空的頭骨！你丟下它，踢向水面，跳上你的岩石。\n\n寶藏被鎖在船裡。你要怎麼拿到它？你沒有訓練有素的潛水員，沒有裝備，如果你受傷了也沒有人幫你。看來你終究需要Phips船長。也許你應該跳躍時空——既然你知道礁石在哪裡，你可以找到Phips並為他指路。\n\n但是你怎麼能帶領Phips回到這裡？你甚至不知道你在哪個礁石上。你的搜索還沒有結束。你應該留下來，乘坐其中一個木筏。然後如果你登上了一個島，你就會知道回來的路。\n\n你有個主意。假設你跳回六個月前，就在你跳到這裡的那一刻之後？沒有人會注意到你曾經離開過！",

        40: {
            text: "你已經在木筏上四天了。仍然看不到陸地。\n\n你錯過了Anegada島嗎？你正朝著數千英里外的非洲前進嗎？食物吃完了，但木筏繼續航行。乘客們開始爭吵。\n\n「我們應該向南走，」一個穿著濕天鵝絨外套的男人說。\n\n「但領航員說向東，」一個水手回答。經過兩天的飢餓，每個人都同意轉向南。又過了一天，你看到了陸地。\n\n「一個島，」你喊道。「棕櫚樹！椰子！食物！」水手們跌跌撞撞地上岸，倒下了。你設法打破一個椰子，狼吞虎嚥地吃下去。\n\n然後你聽到一聲喊叫。一百個幾乎赤裸的印第安人從樹林裡走出來。他們用長矛戳你的肋骨，用奇怪的語言喊叫。矛尖可能有毒，所以你做了他們想要的！\n\n他們把你們都趕到海灘中央。一個來自Concepcion號的印第安潛水員站在你旁邊。\n\n「你是印第安人，」你說。「問他們想要什麼。」\n\n「我是阿拉瓦克人，」他說，「我部落的最後一個人。曾經所有這些島嶼都是阿拉瓦克人的。沒有了。這些」——他厭惡地指著跳舞的警衛——「這些加勒比人是怪物。他們殺了阿拉瓦克人，奪走了我們的土地。」\n\n「你明白他們在說什麼嗎？」你問。\n\n「是的。」阿拉瓦克人悲傷地看著你。「他們喊，『肉！肉！看看我們找到的所有肉！』加勒比人是食人族。」",

        48: {
            text: "你乘坐木筏沿著一個大島的北海岸向西航行，尋找一個可以取水打獵的地方。但這是哪個島？\n\n「這一定是波多黎各，」Concepcion號的領航員說。\n\n「哈！」一個士兵說，「你知道什麼？你就是把我們帶入困境的人。」他用槍指著領航員的耳朵。「我說這是伊斯帕尼奧拉島。如果我對了，你在風平浪靜的天氣裡把我們的船撞上礁石是沒有藉口的。國王會想看到你被絞死，而我要確保這一點！」\n\n你們經過一個寬闊海灣的入口。\n\n「看！一個城鎮！」你們乘坐木筏駛向定居點，跌跌撞撞地下了木筏。\n\n人們在哪裡？\n\n長滿雜草的廢棄房屋。這是一個鬼城。很多年沒人住在這裡了。\n\n砰！一聲槍響就在你腦後響起。你跳倒在地。又一聲槍響。一個人跳過一些岩石，跑進叢林。你聽到喊叫聲。\n\n「領航員！阻止他。領航員逃跑了！」\n\n但領航員逃走了。\n\n在一口舊井的廢墟後面，一條古老的小路通向山區。西班牙人決定沿著它走，希望能找到一個定居點。\n\n你留在後面。如果你跳躍到過去，回到人們住在這個鬼城的時候，你就能確切地知道這個島在哪裡。然後你就會知道船沉在哪裡了——既然木筏向西南航行，礁石一定在這個地方的東北方！",

            text: "現在是1494年4月24日。你在一個大島的北岸，正是你1641年所在的地方，但廢棄的房子不見了。海灣裡擠滿了船隻。戴著尖頭頭盔的男人們砍樹、清理灌木、建造庇護所。你穿過森林想看得更清楚，小心不讓任何人看到你。\n\n「停止工作！」有人喊道。「海軍上將在航行前會對我們講話。」\n\n一個男人站在海灣邊緣的人群前。\n\n「朋友們！」他說。「西班牙人！殖民者！我今天向西航行，尋找印度大陸。」\n\n「上帝保佑你，海軍上將，」殖民者們喊道。印度？你想。他還有很長的路要走！\n\n「你們建立的殖民地非常重要。這是我們在這個世界上第一個西班牙定居點。你們正在建造的偉大城市，我將以我們光榮的統治者伊莎貝拉女王的名字命名。」\n\n「女王萬歲！伊莎貝拉城萬歲！我們的海軍上將克里斯托弗·哥倫布萬歲！」\n\n哥倫布！一艘船把他帶到其中一艘船上。所以這個鬼城就是伊莎貝拉！根據你的資料庫，伊莎貝拉在伊斯帕尼奧拉島上。但這能告訴你足夠的資訊來帶領Phips找到寶藏嗎？\n\n你感到有什麼冰冷而尖銳的東西壓在你的背上。\n\n「你在這裡做什麼？」一個士兵說。他用長矛戳你。「你不是殖民者。而且你的衣服對印第安人來說太多了。告訴我你是誰，否則就死定了！」",

            text: "現在是1684年6月12日。你在牙買加皇家港閒逛，尋找Phips船長。他在那裡！你跑向他。\n\n「船長！」你喊道。「先生！我知道船沉在哪裡了。我們現在可以找到寶藏了。」\n\n「哦，是嗎？那很有趣。在哪裡？」\n\n「在你尋找的地方更東邊。在伊斯帕尼奧拉島伊莎貝拉的東北方。」\n\nPhips抓了抓頭。「更東邊，嗯？好吧，我不知道我們怎麼找到它。據說是在一個礁石上。」\n\n「就是這樣。它一定是——」\n\n「等一下，我的年輕朋友。你到底從哪裡得到這個寶貴的資訊？你才上岸休假兩個小時！」\n\n你盯著他。兩個小時！當然。就他所知，你剛從Algeree玫瑰號上下來不久。而且你不能告訴他你一直在做的所有搜索！\n\n「嗯，呃，」你說，「我在酒吧遇到一個水手。他有個朋友是沉船的倖存者...」\n\n「哈！我以前聽過這個。」他看著和他一起走的朋友。他們笑了。「皇家港的每個水手都聲稱他認識那艘船的倖存者。」他摟著你的肩膀。「不要相信老水手們的荒誕故事。現在跑吧。我正在僱用新船員，我們很快就會啟航前往薩馬納灣！」\n\n「但是——」\n\n「夠了。跑吧！」",

            text: "這讓你很生氣。總有一天你得找到證據證明你知道自己在說什麼。但怎麼找？你一邊走一邊想，撞到了什麼人。\n\n你抬頭一看。是那個討厭的Teal！他驚訝地盯著你。最好快跑！\n\n他追著你，喊道：「站住，小偷！警察！」\n\n一雙手臂抓住你，把你舉離地面。\n\n「啊哈！」上次把你關起來的警察喊道。「你在这儿。你是怎么从我们的监狱里逃出来的？」他把你拖到同樣陰暗的監獄。\n\n「逃跑的懲罰，」警察說，「我們留給你的主人決定。但首先，我們要找出是誰幫你逃走的。把這傢伙綁在刑架上，兄弟們！」他們把你的腳綁在一個大方形酷刑機器的底部。他們也把你的手臂綁在高高舉過頭頂的地方。繩子繞在一個大輪子上。\n\n「轉動曲柄，」警察咆哮道。隨著曲柄轉動，你手臂和腿上的繩子開始把你拉開！\n\n「怎麼樣？你是怎麼逃走的？」\n\n哎喲！他們正把你的手臂拉出關節！\n\n「怎麼了，流氓？想拉伸真相？哈哈哈！現在我們讓你絞盡腦汁幾分鐘，然後我們再轉動曲柄！」他們走出房間，嘲笑著自己的殘酷笑話。\n\n該離開這裡了！你回想你去過的地方，探索過的時代。你可以嘗試一些新地方——或者回到你已經去過的地方，看看有沒有錯過什麼。",

        52: {
            text: "你帶著你的石頭進城，想弄清楚它是什麼。新普羅維登斯是一個繁華、粗獷但整潔的小鎮——完全不像你第一次來訪時記憶中的那個冒煙的廢墟。\n\n你看到一個招牌：「船具商。Hiram Robertson，店主。」Teal衝到你前面，擋住門口。\n\n「這是我最後的報價，」Teal說。「我會把我所有的錢都給你，並且做你六個月的僕人。來吧，伙計！反正它只是一塊石頭。」\n\n「抱歉，」你說。\n\n「有一半是我的，」他憤怒地說。「如果不是我注意到它，你早就把它扔掉了！」\n\n「你本可以早點給我這樣的交易，但現在太晚了，」你說。「讓開！」\n\n「我會找你算賬的！」他喊道，然後大步走開。好吧，現在你知道為什麼他第一次見到你時那麼討厭了。\n\n你走進商店，把你的塊狀物放在Robertson先生的櫃檯上。他拿起它時，嘴巴張得大大的。\n\n「你知道這是什麼嗎？這是龍涎香！十一、十二磅——你發財了！」\n\n「我發財了？」\n\n「當然。這東西比黃金還貴！」\n\n你請Robertson先生幫你賣掉它，他欣然同意。可憐的Robertson——你不能告訴他西班牙人很快就會燒毀他的商店。\n\n「順便問一下，伙計，你從哪裡來？」\n\n「二十...」你在說什麼？「...世紀，」你尷尬地說完。\n\n「二十世紀？那是什麼，一艘船？哦，」他眨了眨眼說。「我明白了！不問隱私問題。別擔心。這裡很多人都不太談論他們從哪裡來或去哪裡。為了某種原因，是吧？我們就叫你Century吧。幸運的Century！」\n\nRobertson帶你到碼頭，向船隻揮手。\n\n「現在，如果我是你，我會把錢花在一艘好船上。加勒比海的事情正在發生變化。西班牙人不再控制一切了。法國人、英國人、荷蘭人都在建立殖民地。貿易船的需求越來越大。你覺得呢？」\n\n你可以買一艘船——然後隨心所欲地航行！把它駛向伊斯帕尼奧拉島，自己尋找Concepción號的寶藏。「有船要賣嗎？」你問Robertson先生。\n\n「碰巧，」他說，「有一艘。就在那邊——護衛艦Timely號。用龍涎香的錢，你可以買下她，配上貨物和船員，還剩下吃早餐的錢！」\n\n在接下來的幾天裡，你就是這麼做的。在Robertson先生的幫助下，你買了和你記得Phips擁有的那種裝備。你僱了一個船長和船員和你一起航行。很快你就出海了！\n\n和領航員一起站在艦橋上比打掃貨艙有趣多了。你為Timely號感到驕傲。全是你的！\n\n「右舷船尾發現船隻！」你的船長一天早上喊道。他遞給你一個望遠鏡。「他們發出信號說有消息給我們。」\n\n「消息？」你把長金屬管舉到眼前，調整焦距。那艘船映入眼簾。一面信號旗從其中一根桅杆上飄揚。\n\n「可能是個詭計。他們可能是海盜！我們應該轉向等待他們，還是試圖逃跑？」\n\n你很懷疑。他們會有什麼消息給你？在1684年，甚至沒有人認識你！你告訴船長發出信號，說你沒時間等待消息。\n\n當你通過望遠鏡觀察時，另一艘船的信號旗降下來了。取而代之的是一面黑色的旗幟，上面有白色的東西。風向變了，你看到了旗幟上的圖案：一個骷髏！一隻骨瘦如柴的手握著一把滴血的劍，另一隻手握著一瓶朗姆酒。是海盜旗。\n\n「他們現在露出了真面目，」船長說。「我認識那艘船！是Joseph Bannister船長在金羊毛號上。他是加勒比海最嗜血的海盜。」你的船長對水手們喊道。「升起主帆，伙計們！我們需要能達到的最高速度！」\n\nTimely號桅杆上能容納的所有帆都升起來了，但海盜船仍然更快。你聽到一聲巨響。一顆砲彈擊碎了你面前的欄杆。\n\n砲彈在空中呼嘯。一發砲彈把Timely號的主帆撕成兩半。現在海盜船只有幾碼遠了！砲聲停止了。\n\n「呀啊啊啊！」海盜們在從他們的船跳到你的船上時發出血腥的戰吼。劍鬥從船頭到船尾激烈地進行著。\n\n這太可怕了。他們在為什麼而戰？你的任務不至於重要到讓這些水手為你而死。你可以找到另一種方法來獲得寶藏。\n\n「住手！」你在戰鬥的可怕噪音中喊道。「停止戰鬥！」你的水手們停了下來。你看到一些海盜臉上露出驚訝的表情。\n\n「我擁有這艘船，」你盡可能大聲地說，「我投降！請停止戰鬥。」你的水手們抱怨著，但他們似乎並不那麼不高興放下劍。\n\n一個戴著黑色眼罩的瘦男人大步走上上層甲板來見你。他慢慢地上下打量你。\n\n「我是Joseph Bannister，」他驕傲地說，「金羊毛號的船長。現在，看來，也是這艘船的主人。」他用劍尖抬起你的下巴。",
            choices: [{ text: "繼續", next: 56 }],

        73: {
            text: "「如果你確定想加入我們，」一個海盜說，「這邊走。」他帶你到Joseph Bannister船長坐在海灘上桌子旁的地方。Bannister把一張羊皮紙扔在桌子上。「如果你想成為海盜，」他說，「你必須像其他人一樣簽這個。」\n\n「上面寫了什麼？」\n\n「如果我們沒有獵物，你就沒有報酬。但如果我們有，每個水手都能分一份。你，因為你年輕，得到半份。但你必須賺到它！到目前為止你同意嗎？」\n\n你點點頭。\n\n「如果你的一隻胳膊或腿被射掉了，你可以額外得到兩百枚八里亞爾銀幣。一根手指或一隻眼睛，一百枚。」他指著他的黑眼罩，讓你明白。「我們船上不要懦夫！如果你在戰鬥中逃跑或偷東西，你會被流放到一個孤島上。」\n\n他遞給你一支用長羽毛製成的鵝毛筆。\n\n「如果你不會寫字，你可以在上面畫一個X。」\n\n你把鵝毛筆蘸上墨水，在虛線上寫下「Lucky Century」。\n\n你尋找Concepcion號的任務可以等了。你是海盜了！",

        82: {
            text: "金羊毛號在太陽從地平線升起時啟航。你差點踩到一個海盜的屍體。男人們到處躺著。發生了什麼事？你難道睡過了昨晚的戰鬥？\n\nBannister船長走出來，揉著眼睛。「看看這個！」他厭惡地說。他踢了其中一個人一腳，那人咒罵著，搖搖晃晃地站起來。\n\n「醒醒，你們這些酒鬼！」Bannister喊道。「我們繳獲的西班牙朗姆酒對你們來說太好了。升帆！等我們到達托爾圖加島，會有更多好酒喝！」\n\n男人們抱怨著，揉著頭。\n\n「我們唱首歌吧，」有人建議道，同時你們拉著長繩升起沉重的帆。\n\n「喲嗬，她升起來了！喲嗬，她升起來了，喲嗬，她一大早就升起來了！」隨著每一句歌詞，你們用力一拉，一張帆緩緩升上桅杆。\n\n一個海盜拒絕醒來。\n\n「我們該拿一個醉水手怎麼辦，」他們唱道，「一大早？」\n\n「我們為什麼不往他身上潑水呢？」你建議道。他們笑了。有人拿來一個桶，其餘的人拉著。\n\n「拔掉塞子，把他全身弄濕，拔掉塞子，把他全身弄濕，一大早！」濕透的海盜跳起來，噴著水，其餘的人笑了。歌唱完時，風正推著船前進。你們沿著伊斯帕尼奧拉島的北海岸滑行。\n\n「看那裡！」有人喊道。「更多的獵物！」一艘小船駛入薩馬納灣的入口。兩艘海盜船轉向追逐它。\n\n那艘船是Phips船長的嗎？你希望不是。他的船是為尋寶而裝備的，不是為了戰鬥。\n\n海盜船繞過一個彎，尋找那艘小船。\n\n哎呀！小船有大朋友！在那裡等著你們的是兩艘全副武裝的戰艦。\n\n「這是個陷阱！」Bannister喊道。「國王的戰艦是來消滅我們的。」\n\n「我們跑吧，船長，」一個砲手說。「我們已經有很多戰利品了。」\n\n「跑？絕不！」海盜船長說。他跑到船邊。「誰敢埋伏令人恐懼的金羊毛號？」他喊道。\n\n最近的戰艦的船長喊道。「我是Drake號護衛艦的Spragge船長。英格蘭國王查理的忠實僕人。投降，否則我把你轟出水面！」\n\n「你！」Bannister笑了。「你是個鬼鬼祟祟的小狗！就像任何讓富人買他們服務的人一樣。富人搶窮人打著法律的幌子，而我們在我們自己勇氣的保護下掠奪富人！你為什麼不加入我們？」\n\n「我的良心，」Spragge說，「不會讓我違反上帝和人的法律。」\n\n「那麼，」Bannister回答，揮舞著他的劍，「你的良心是個魔鬼。而我是海上的自由王子！我有和那些在海上擁有一百艘船的人一樣的權力向全世界宣戰！」他轉向他的船員。「砲手們，隨意開火！」\n\n砲手們點燃砲彈的引信，一連串的砲彈飛了出去。砲彈從另一邊飛回來。它們擊穿了你的船舷，撕裂了帆，把桅杆劈成兩半。\n\n你被安排去給大砲裝砲彈。有什麼熱乎乎、燃燒著的東西從你耳邊呼嘯而過。他們在向船射火箭！前帆已經著火了。\n\n「她要沉了，」有人喊道。「棄船！」\n\n你趕到長艇旁，推開。一艘戰艦攔住了你。\n\n「你現在願意投降嗎？」Sprague船長喊道。「以查理國王的名義，投降，否則我們把你們炸成碎片！」\n\n你舉起手。士兵們下來把你拉上船。他們把你和其他呻吟著的海盜鎖在Drake號的貨艙裡。你聽到大砲的轟鳴和槍聲，但沒有人告訴你發生了什麼事。\n\n在黑暗中鎖了一天之後，Sprague的人把你拖上甲板。在黑暗中坐了這麼久，陽光刺痛了你的眼睛。\n\n支撐帆的長桿上掛著什麼東西。Joseph Bannister和他的軍官們的屍體在風中懸掛著。\n\n士兵們解開你的鎖鏈，遞給你一把拖把。「把甲板上的血擦乾淨，」他們命令道。\n\n當你擦甲板時，你發現自己在一堆帆後面，沒有人能看到你。是時候回到尋找白銀的軌跡上了！跳躍時空與Concepcion號會合。",

        81: {
            text: "「我不想當海盜，」你說。\n\nJoseph Bannister的眼睛露出驚訝。「你很勇敢，」他說，「但也很愚蠢。」\n\n他的人把一根繩子從船底穿過，把你的手臂綁在繩子的一端。船另一邊的人靠在船舷上，用力一拉，當繩子幾乎把你拉下船時，他們笑了。Bannister用劍戳著你，把你推上一塊伸出船舷的木板。\n\n「走木板吧，我年輕愚蠢的朋友。跳下去，在繩子把你拉下去之前！」\n\n「拉！」海盜們喊道，同時拉動另一端。它把你拉了下去！你撲通一聲掉進海裡。繩子正把你往下拉！你沿著船底生長的鋒利、多石的藤壺上刮擦。下面又黑又暗，你快沒氣了。\n\n好吧，這樣你離寶藏不會更近。在你被徹底拖到龍骨下之前，跳躍時空！",
            choices: [{ text: "跳回一年前，安全到達韋拉克魯斯", next: 4 }],
            items: []
        },
        63: {
            text: "現在是1641年11月7日。好吧，至少你在離寶藏船沉沒地點最近的島上！\n\n你聽到前方傳來低沉的咕嚕聲。一隻巨大的野豬從雜草中走出來。它一定有五百磅重。\n\n它用珠子般的小眼睛盯著你，露出長牙。它朝你衝過來了！\n\n你跑著，在雜草叢中跳躍，那隻咕嚕叫的豬緊追不捨。\n\n砰！你身後的豬轟然倒地。有人開槍打中了它！你環顧四周。\n\n放下冒煙的槍的是你見過的最奇怪的人。他的夾克、褲子，甚至長鬍子都黑乎乎的，看起來像是乾了的血。他的腰帶上掛著十幾把長刀。它們是乾什麼用的？你想知道他是誰，但如果他是來殺你的，你不確定你想知道！你應該躲起來跳躍嗎？他拿出一把刀，走向那隻豬。",

        64: {
            text: "「非常感謝，」你慢慢地說。你往後退。「那隻豬差點抓住我！」\n\n「你謝我？」他用低沉的聲音說。他走近了些。\n\n「是我該謝你！」他用刀從豬的鼻子切到尾巴。「這些野豬，很難抓。你把他帶到陽光下讓Pierre射擊。幹得好！」他把豬的內臟拉出來，開始切肉。\n\n「你想做我的搭檔嗎？」他伸出一隻滴著血的手。你想了一會兒，然後握了握。「給我拿些葉子。大的。綠色的。」你幫他把肉包在葉子裡。\n\n「你想要新鞋子嗎？」\n\n什麼？新鞋子！你搖了搖頭。\n\n「很好。我自己也需要一些。」他剝下豬腿上的皮，把腳伸進皮裡。他在腳趾下面的洞上綁好，驕傲地向你展示他的新鞋，滴著血。\n\n「這邊走！」你跟著他穿過樹林，帶著一堆切好的豬肉。你曾經迷路的叢林對他來說就像家一樣。很快你們來到一個營地。其他穿著和他一樣奇怪的男人在大冒煙的火堆上扔綠木頭。一條條肉掛在火上方的木架上。\n\n「在這些架子上我們熏肉，」Pierre說，「以保持新鮮。然後我們可以賣給船隻。」他給你一塊。又硬又煙熏。\n\n「印第安人教我們的。這個架子叫做boucan，而我們是boucaniers。」\n\n這一定是「海盜（buccaneer）」這個詞的來源。\n\n「我們有些人是在這裡沉船的。其他的是奴隸或僕人，逃跑了。生活很艱難，但很快就會改變。來吧！」\n\n他帶你走下一條蜿蜒的小路來到海邊。海灘邊停著一艘小船。\n\n「我和我的朋友們，我們厭倦了追逐豬。西班牙人追捕我們，就像我們追捕豬一樣。而他們一直航行經過，他們的船上幾乎裝滿了寶藏，快要沉了。今晚，我們啟航，去尋找我們的財富！」\n\n「你要去哪裡？」\n\n「東北方。這個島是伊斯帕尼奧拉島。當船隻經過時，它們必須靠近，因為北邊有危險的礁石。而誰會在中間等著它們？」\n\n「你。」\n\n他笑著給了你一個熊抱。天哪，他真臭！\n\n「沒錯，我的搭檔。大個子Pierre，他對這些礁石瞭如指掌，就像豬的背一樣！」\n\n你看著那艘小船，想像著在廣闊的大海上漂流。你不必去——你可以走進樹林，跳到另一個地方和時間。牙買加怎麼樣？",
            choices: [

        80: {
            text: "你已經在Pierre的船上等了一個星期，等待一艘船經過伊斯帕尼奧拉島北部的海峽。你兩天前吃完了最後一條肉乾，但大個子Pierre拒絕放棄。\n\n「Pierre！」一個海盜說，「我們沒有食物了！如果我們餓得虛弱，怎麼戰鬥？」\n\nPierre咆哮道。「你不能等著吃西班牙人的美食嗎，狗？」他脫下一隻豬皮鞋扔給那個人。「給，嚼這個！」\n\n「來了一艘船！」有人說。「終於。」在地平線上你看到一張帆。男人們歡呼起來，他們磨快了刀。然後又出現了一艘船，又一艘。這是一整支艦隊！\n\n「這可不太好，」Pierre說。「他們有很多槍。一艘只有二十八個人的小船對抗一支艦隊是沒有機會的！我們假裝是漁夫。」船隻繼續航行，很快你就能看到上面的人了。Pierre從船尾拿著一根長竿，好像他在釣魚。\n\n「他們用望遠鏡看我們。大家笑一笑。揮手！向漂亮的船隻揮手！」骯髒、鬍鬚拉碴的海盜們都咧嘴笑著，露出黃牙，揮著手。一艘船轉過來靠近。\n\n砰！有什麼東西在幾碼外的水中濺起水花。Pierre丟下了他的竿子。\n\n「他們向我們開火！這些狗！快，我們躲在礁石裡。我們很小，岩石不是問題。西班牙人跟不上。」\n\n你轉動船，用盡全力划槳。砲彈在你們周圍濺起水花。很快船就在參差不齊的珊瑚塊之間滑行。這一切看起來很熟悉。\n\n「這是手帕礁嗎？」你問。\n\n「不。手帕礁在西邊更遠的地方。這是另一個礁石，在薩馬納灣西北方。」嗯，你想。非常有趣。也許船沉在這個礁石裡，而Phips船長不知道。\n\n艦隊向東航行，Pierre把船帶回海峽。太陽正在下山。你向西南航行，駛向伊斯帕尼奧拉島上古老的西班牙鬼城伊莎貝拉。\n\n「好吧，」Pierre說，「這次我們的運氣不太好。明年...」\n\n「別放棄，大個子Pierre。看！」又一艘船正駛入海峽。它所有的帆都張開了，努力追趕艦隊。\n\n「啊哈！」Pierre說。「完美。我的搭檔，」他對你說，「拿著這個工具。在你的船底鑽個洞。」\n\n「一個洞？」你問。\n\n「是的。我們沒有退路了！要麼我們奪下這艘西班牙船，要麼我們死。現在，安靜。」\n\n你照他說的做了。水涓涓流入，淹沒了船底。天黑了。你看到巨大黑色船體上方的船燈。你能聽到甲板上有人在笑。你的船，迅速下沉，太小了！你怎麼能奪下這麼大的船？也許你應該在黑暗中從船邊溜走，跳躍時空——也許去不遠的薩馬納灣，等待Phips船長。\n\n「我的海盜們！」大個子Pierre低聲說。「很快就輪到我們笑了。但我們必須勇敢。我要你們所有人發誓，一個莊嚴的誓言。我們將戰鬥到最後一個人。你們願意發誓嗎？」\n\n「我願意，」每個人都依次低聲說。然而，你不太確定你想加入這個絕望的隊伍。",

        96: {
            text: "你站在黑暗中的沉船上。在你上方，Pierre爬上了西班牙船的船舷。他扔下一把繩梯。你爬進黑暗中。\n\n「快！」Pierre嘶嘶地說。「下一個警衛很快就會來。」海盜們一個接一個地從船邊溜過去，嘴裡叼著刀。\n\n「你們一半人奪取砲彈室。搭檔，跟我來。」你悄悄地穿過甲板。一個警衛坐在船長艙外的桶上。你能聽到裡面傳來歌聲和玻璃杯的碰撞聲。\n\n「數到十五，」Pierre低聲說，「然後吹口哨。像鳥一樣。」他消失了。\n\n你數著，然後吹口哨。警衛站起來，朝你的方向凝視。Pierre在那裡！他把一根繩子套在警衛的脖子上，拉緊。警衛掙扎著，倒在甲板上。\n\n「現在！」Pierre說。他猛地打開門，你們衝進去。軍官們坐在那裡，穿著內衣，打著牌。\n\n「哎！耶穌保佑我們！這些是魔鬼，還是什麼？」\n\n「我們是復仇的幽靈！」Pierre喊道。他把手槍對準船長的胸膛。「交出你的船，否則就交出你的命！」\n\n你聽到槍聲和刀劍相交的聲音。其中一個軍官跳向門口，但一個海盜用刀刺穿了他。另一個人跑進來，少了一隻耳朵。\n\n「損失了三個人，大個子Pierre，但船的砲是我們的了！」\n\n「你怎麼說，西班牙船長？你還是船長嗎？」\n\n「我——我——這艘船是你的了！」",

        111: {
            text: "什麼？你還沒到家！你仍然在看著寶藏礁石，但現在是1978年11月30日。你在一艘現代船上！上面有一個雷達屏幕，甲板上還有各種先進的潛水裝備。穿著橡膠服的潛水員在水裡上下浮動。\n\n「你好！我以前沒見過你。」一個戴著現代水手帽的微笑男人握了握你的手。「你是和報社記者一起來的嗎？」\n\n「實際上，」你說，「我算是個——研究員。」\n\n「哈！那意味著你是個尋寶者，像我們一樣。好吧，你來得正是時候！Burt Webber，我們探險隊的隊長，認為我們已經找到了Concepción號的殘骸——就是老船長Phips四百年前找到的同一個殘骸。」\n\n「我聽說過Phips，」你說。「他後來怎麼樣了？」\n\n「你當然聽說過Phips！他是我們所有尋寶者的靈感來源。嗯，他成了一個富人，當然，而且非常有名，英格蘭國王任命他為馬薩諸塞州州長。」\n\n他向潛水員揮手。「我經常想知道他是怎麼找到那個殘骸的。我們已經尋找它好幾年了，我們有各種他沒有的先進設備。」\n\n「如果Phips找到了白銀，」你問，「你難道不怕什麼都沒剩下嗎？」\n\n「那是有可能的，是的。但那艘船上有很多白銀。我猜Phips並沒有把它全部拿走。」有人向他發出信號。他穿上潛水服，跳進水裡。\n\n為了他好，你希望他是對的。你仍然能看到礁石上同樣的三塊岩石。\n\n哎呀。Phips在那些岩石的另一邊找到了他的寶藏。你應該告訴潛水員嗎？然後你想起——Phips找到了船的船頭。也許船尾在這裡！如果是這樣，Webber的船員可能會找到比Phips更多的寶藏。\n\n一個潛水員浮出水面，手裡揮舞著什麼東西。\n\n「一枚西班牙硬幣，」他喊道，「日期是1639年。我們找到了！」大家歡呼起來。\n\n你看著他們把白銀裝上船。他們比Phips遇到的麻煩少多了。他們有泵可以把海底吸起來，然後把白銀吐到船上。\n\n一隊來自多米尼加共和國海軍的水手數著潛水員找到的每一塊白銀。一半的寶藏屬於他們，因為礁石在他們的水域。\n\n你翻找著混亂的東西，注意到一個水手正盯著你沉重的背包。如果他看到你的白銀，他會認為是你偷的！你吹著口哨走開，找到一個空房間。\n\n是時候跳回家了！你回想你在17世紀的冒險：劍鬥、壞血病、奴隸制、你見過的悲慘生活和快樂生活。一個激動人心的時代，但很危險。當你最後一次跳躍時，你想知道你是否真的出生在一個幸運的世紀。\n\n**任務完成！**",

        14: {
            text: "古巴哈瓦那，Concepcion號的船員正在享受一個月的狂歡節。現在是1641年9月20日。你注意到Concepcion號的水線附近有一盞燃燒的油燈。你悄悄地穿過陰影，跳到燈光下。\n\n「你在做什麼？」你嚴厲地問。\n\n一個年老的黑人把手伸到水線下，從木頭裡拔出了什麼東西。「我在收集船蛆，」他說。\n\n他舉起一條長長的白色蛞蝓，一端帶著殼。「你坐這艘船去西班牙？」他把一根手指放在他捲曲的白髮裡轉了轉。「你瘋了——瘋狂。看！」他指著船體。木板上佈滿了小洞。\n\n「這艘船在這些水域停留太久，而且沒有修理。」他指著天空。「颶風很快就要來了。去西班牙的最後安全時間是8月20日，而現在已經是9月20日了！」\n\n壞消息！也許你應該留在鎮上多享受一下狂歡節。",

        29: {
            text: "西班牙！這艘陸軍船的砲比普通大帆船多一倍，但沒有白銀來壓艙。你跟隨Concepcion號在艦隊中，滑回來保護掉隊者免受居住在附近英國殖民地喬治亞和卡羅來納的危險襲擊者的攻擊。\n\n離開哈瓦那一個星期後，一場颶風襲擊了。船顛簸了兩天兩夜。大砲鬆脫了，在甲板上砸來砸去。沒有人知道你的位置，但你很快就會知道了。\n\n嘎吱！你在佛羅里達海岸撞上了礁石！風浪把船撞向岩石。你發現自己漂浮在海裡，抱著一個木箱漂浮著。\n\n夠了！你又冷又濕，在1641年的佛羅里達，除了充滿敵意的印第安人什麼都沒有。你能想到的附近最安全的地方是溫暖、宜人的新普羅維登斯。",

        46: {
            text: "咕嚕！水至少是溫暖的，但你在海洋裡做什麼？你抓住一個漂浮的灰色團塊，但它不是什麼好的救生圈。幸運的是你離岸不遠，所以你游到一個美麗的海灘，帶著你找到的漂浮物。\n\n你趴在白色的沙灘上休息。遠離沉船、海盜和瘋狂的人，放鬆一下感覺很好。沿著海岸，你可以看到巴哈馬群島的新普羅維登斯鎮。現在是1684年1月10日。\n\n有人正沿著海灘走來。哦，不！是Phips船長船上那個討厭的孩子，Teal。如果他敢亂來，你準備揍他。\n\n「嗨！」他說，似乎沒有認出你。「剛來這裡？我是James Teal。」他伸出手。你握了握，對他的友好感到驚訝。然後你意識到——你一定是在你第一次冒險之前回來的，所以他當然不認識你！\n\n「這個島需要的就是這個，」他諷刺地說，「又一個海灘流浪漢。我就是。但別問我怎麼做。那個——」他停下來，盯著你夾在膝蓋間的灰色塊狀物。\n\n「我說，」他漫不經心地說，「你拿的那塊石頭真有趣。也許是死軟體動物。你想用它換什麼？」\n\n「我不知道。」\n\n「我給你一枚我找到的真正的西班牙八里亞爾銀幣。」他給你看一枚粗糙、凹凸不平的十字硬幣。\n\n你用手摩擦著你那塊灰褐色的塊狀物。它感覺有點油膩。他為什麼這麼想要它？\n\n你搖了搖頭。\n\n「兩枚怎麼樣？這樣吧，假設我告訴你我在哪裡找到的？附近可能有一艘舊沉船，你可以去潛水，找到一整罐寶藏。」\n\n這引起了你的興趣。也許那艘沉船就是Concepcion號！你應該用你的塊狀物換他的資訊嗎？",

        57: {
            text: "你把那奇怪的塊狀物遞給Teal。他帶你沿著海灘走了幾英里。有一艘船停在很遠的海面上。\n\n「這是我找到西班牙硬幣的地方，」Teal說。「祝你好運，能找到它們來自的沉船！」他把塊狀物扛在肩上跑開了。\n\n在接下來的幾天裡，你在海灘上露營，尋找Concepcion號沉船的跡象。你找到了一些舊釘子、碎陶片、很多貝殼，還有一把奇怪的梳子。但沒有硬幣。有一天，一艘小船離開停泊的船，來到岸邊。\n\n「你好！」你對第一個下船的人說。「你們在那邊做什麼？」\n\n「潛水，當然。」他卸下一些空罐子。其他人去尋找水源。「那是大約十年前沉沒的西班牙大帆船Las Maravillas號。如果你仔細找，還能找到幾根銀條。」\n\nLas Maravillas號？那不是你要找的船。好吧，當然：Concepcion號在伊斯帕尼奧拉島以北沉沒，而你在巴哈馬群島，幾百英里外！\n\n「新普羅維登斯的每個人都知道那艘沉船嗎？」你問。\n\n「不知道你就是個傻瓜。從她沉沒的那一年起，人們就一直在潛水打撈她。」\n\n你朝鎮上走去。你幾乎等不及要抓住那個騙子Teal！",

        58: {
            text: "新普羅維登斯鎮繁忙而整潔，完全不像你第一次來訪時記憶中的那個被槍砲打得破爛不堪的混亂場景。你猜西班牙人很快就會來襲擊這裡。你叫住一個提著一籃魚的女人。\n\n「打擾一下，女士。你認識一個叫James Teal的男孩嗎？」\n\n「幸運的Jim Teal！」她驚呼道。「自從他發財以來，他一直擺出一副高高在上的樣子。」\n\n「他發財了？」\n\n「當然。他就是找到那塊龍涎香的男孩。他給自己買了一棟大房子。他來了！」\n\n一輛馬車停在街上最漂亮的房子前。Teal坐在那裡，穿著絲綢和天鵝絨，得意地笑著看著你。\n\n「這是什麼？」他高傲地說。「一個海灘流浪漢！」\n\n「你騙了我，Teal，」你說。\n\n「請叫我Teal先生，」他回答。「那些得到好東西卻不知道的人不配擁有它。」\n\n你看著他的房子，想像著西班牙人把它燒毀時會是什麼樣子。\n\n「趁你能享受的時候好好享受吧，」你微笑著說。「它可能不會持續太久。」\n\n「那是什麼意思？」\n\n「你會給我什麼來換取一些有趣的資訊？」\n\n他笑了。「我不再需要和像你這樣的傻瓜交易了，」他輕蔑地說。他把馬拴在柱子上，驕傲地走進他的房子。\n\n一支艦隊從北方轉入港口。\n\n砰！他們向鎮上開砲。人們到處亂跑。\n\n「西班牙人！」他們尖叫。「快逃命！」砲彈呼嘯而過。當一顆砲彈砸碎Teal的門時，你彎下腰。\n\n好吧，沒必要留在這裡。是時候跳回1641年，Concepción號啟航的那一年。新普羅維登斯當時還不存在，但普羅維登斯存在。",

            text: "1670年8月12日。水手們在街上閒逛，喝著酒，摟著穿著鮮豔長袍的女人的腰唱歌。\n\n「敬酒！」一個水手喊道。「敬Henry Morgan船長，領導了對委內瑞拉的襲擊，讓我們的口袋裝滿了黃金！」\n\n「你的口袋，」一個紅髮女人說，「不是已經空了嗎？你都花光了。」\n\n「很快又會裝滿的，親愛的。我們兩天後再次啟航，前往瓦卡島。我打賭老Henry Morgan袖子裡有一兩個錦囊妙計！」\n\n海盜們將在瓦卡島會合。如果那在伊斯帕尼奧拉島附近，你可以和他們一起航行，在那裡尋找寶藏。\n\n一個拿著酒桶的海盜擋住了你的路。「喝，」他命令道。「每個人都必須像我一樣醉。」\n\n「不，謝謝，」你禮貌地說。他拔出一把槍指著你！\n\n「所以！你拒絕一個友好的邀請？多麼侮辱人！」\n\n「我不是有意侮辱你！」你趕緊說。\n\n「那就喝！」他咆哮著，遞出一個杯子。「現在！」\n\n你喝了一口。呃。聞起來像發霉的土豆。你假裝喝下去，而他咆哮著，把酒濺得到處都是。\n\n「喝完了？」他說。「好。證明給我看！把杯子倒過來放在你頭上。」",

        95: {
            text: "1670年8月14日。你在牙買加皇家港看著船隻裝載水手。\n\n「我們要去襲擊西班牙人了，夥計們！」Henry Morgan船長對人群喊道。「來自加勒比海各地的海盜正在瓦卡島與我們會合。這將是我職業生涯中最大的一次襲擊。」\n\n「我親愛的朋友Henry！」一個戴著羽毛帽子的男人打斷道。\n\n「好吧，現在，這是我的榮幸，」Morgan說。「是什麼風把我們傑出的總督吹來了？」\n\n「來自倫敦的消息，」牙買加總督說。「我們剛剛在馬德里簽署了一項條約。英格蘭和西班牙不再交戰了！」\n\nMorgan盯著他。「和平？」他環顧四周失望的海盜們。「好吧，消息在我們離開皇家港之後才到，真是太糟糕了？」\n\n「但是，Henry...」\n\n「別擔心，Tommy老弟！我們會保證你的那份戰利品安全。全體上船！」\n\n你與Morgan一起航行。他要去伊斯帕尼奧拉島附近。也許你能在那裡找到寶藏的線索。",

        109: {
            text: "現在是夜晚。你站在Henry Morgan船上的船艙外站崗。來自十幾艘不同船隻的海盜船長們正在這裡開會，在伊斯帕尼奧拉島附近的一個小島外，決定襲擊哪些西班牙城鎮。他們已經互相大喊大叫了一個多小時。\n\n門突然打開。Henry Morgan跑出來，拿著劍追趕一個法國海盜。\n\n「我是這裡的主人！」Morgan咆哮道。「我說我們去巴拿馬。」\n\n「但馬拉開波容易多了！」\n\n「白痴！我去年才襲擊過馬拉開波。他們還在舔傷口。」他對他的朋友們喊道。「把這些法國人鎖起來！」警衛把法國船長們拖走了。你留在Morgan身邊，他跺著腳走來走去，用劍砸東西。\n\n「我受夠了這種談判，」他怒氣沖沖地說。「我們把法國人的船也帶走！」\n\n砰！一聲巨大的爆炸震撼了船。你被拋進黑暗中，撲通一聲掉進海裡。船裂成了兩半。憤怒的法國人一定放火燒了火藥庫！\n\n「救命！」一個水手喊道，在水裡撲騰。「我不會游泳！」作為一個水手不會游泳似乎很瘋狂，但水手們在你周圍溺水。你划向最近的一個。\n\n「讓我幫你，」你說。他抓住你！你試圖推開他，但他像瘋子一樣緊緊抓住。他太絕望了，想安全，他會把你淹死。\n\n唯一的出路就是跳躍時空。你離伊斯帕尼奧拉島很近——所以Concepción號在附近的某個地方沉沒了。",

        101: {
            text: "你獨自一人在伊斯帕尼奧拉島的薩馬納灣邊緣。現在是1684年2月4日。Phips船長還沒有出現。你可以跳往幾個月後，但在你確定知道要告訴他什麼之前，你不應該去找他。\n\n「哦哦哦。咿咿咿咿！」一個高亢的聲音從樹林裡傳來。「我看到的是一個幽靈嗎？」它哀嚎道。\n\n「誰在那裡？」你喊道。\n\n「Don Villavicencioooo，」那個沙啞的聲音唱道，「已經去了下麵。還有誰？先是一個，現在是兩個！」\n\nVillavicencio！他是Concepcion號上的海軍上將。也許這是沉船的倖存者！你鼓起勇氣走進森林。你看到一個奇怪的老頭消失在一個山洞裡。\n\n「你是誰？」你對著洞口喊道。老隱士慢慢走出來。\n\n「你不記得我了嗎？我記得你！」他唱道。「東，南，西。誰記得最清楚？」\n\n你仔細看他的臉。是Concepcion號的領航員！他在這裡躲了四十年嗎？\n\n「我有一個問題，」你說。「Concepcion號是在手帕礁沉沒的嗎？」\n\n「手帕！」他笑了。他拍著膝蓋，選擇了一個方向，吐了口唾沫。\n\n「東風吹在你的手帕上。東風吹來一艘船！」他喊道。「但它不在手帕裡，不。它在唾沫裡。船在唾沫裡！」他高興地手舞足蹈，跑回他的山洞。",

            text: "好吧。又是謎語！Pierre告訴你，在Phips知道的礁石東邊還有礁石。領航員是不是在說船沉在這些未知和無名的礁石裡？也許吧。\n\n你看著大海。兩艘船駛入海灣。是Phips嗎？你跑下去迎接他們。船隻直接駛上海灘，水手們用長繩把他們拉向一側。\n\n「用生鏽的剃刀刮他的肚子，」他們一邊拉一邊唱。「一大早。喲嗬！」\n\n這不是Phips。這是兩艘海盜船。你和一些海盜交談，他們似乎是一個有趣的船員。你應該加入他們，還是跳往幾個月後去見Phips船長？",

        106: {
            text: "「等等，」你說。前方你看到三塊岩石，看起來非常熟悉。「我們去那邊試試。」你們劃得更近。\n\n「你看到寶藏了嗎？」Rogers問。\n\n「沒有，」你說，「沒有寶藏。但我想知道是誰把大砲扔到水裡的？」\n\n「大砲？」他喊道。「船上的砲。我們找到了！」\n\nRogers留在船上，你潛水。大砲躺在白色的沙灘上。船早已腐爛，但你可以看到海底船頭的輪廓。你看不到任何白銀，只有很多黑色的、覆蓋著珊瑚的岩石。你剛好有時間抓起幾塊這樣的石頭，瘋狂地踢向水面。\n\n「嗯，」Rogers說。「有趣的石頭。」他把他們撞在一起。它們裂開了——變成一塊塊銀幣。\n\n「耶！」你歡呼著，又潛回海裡。\n\n船腐爛了，現在更容易拿到白銀了，但潛水三十英尺很累。你把白銀裝進袋子，劃回船上。其他搜索者都回來報告了。Rogers把手指放在嘴唇上。\n\n「南邊什麼也沒有，船長，」一個人說。\n\n「我們的獨木舟也沒有運氣。」\n\n「它一定在這裡的某個地方，」Phips咕噥道。他用拳頭砸在桌子上。「我們會找到它的，就算花掉整個夏天！你呢，Century？」\n\n「我們沒找到多少，」你漫不經心地說。「只有這個。」你從袋子裡拿出一根銀條。所有人都站著盯著它。沒有人能說話。然後Phips跪了下來。你們都和他一起跪下。\n\n「仁慈的上帝，」他輕聲說，「我們感謝你賜予你謙卑的僕人成功。」然後他跳了起來。\n\n「耶！」大家歡呼著，在房間裡跳舞。Phips拿出一桶白蘭地，每個人都為你的健康乾杯。船長擁抱了你，喜悅的淚水順著他的臉流下。\n\n在接下來的幾天裡，你們把數百磅的白銀裝上船。只有專業的潛水員才有力量一遍又一遍地潛到那麼深的地方。他們帶上來一桶桶的銀幣、成噸的銀條、勺子、叉子、燭台和碗。",

        75: {
            text: "你被一陣鼓聲吵醒。你在馬龍人村莊睡了一整天，現在又是夜晚了。外面，逃亡的奴隸們圍成一圈跳舞。\n\n「喊吧，obeah，喊！」他們唱道。「喊，我告訴你喊。Obeah！」你的朋友John看到你時走出圈子。\n\n「Century！來跳舞！我們正在為一次突襲做準備！」他把你拉到圈子裡。\n\n「搖滾，obeah，搖滾！搖滾，我告訴你，搖滾。」音樂聽起來出奇地熟悉。你在1684年的牙買加，伴著非洲音樂跳舞，聽起來像搖滾樂！\n\n「給我膝蓋彎曲，obeah！給我膝蓋彎曲。」你跳舞時膝蓋幾乎彎到地上。你感覺很奇怪。這種舞蹈讓你頭暈目眩！\n\n一個戴著人牙項鍊的女人跌入圓圈中央。她尖叫著，抽搐著，跳躍著，好像瘋了一樣。然後她開始說話，非常平靜，用一個老男人的聲音！年長的舞者似乎在聽她說什麼，但你聽不懂。\n\n「她在說什麼？」你問John。\n\n「我不知道。她在說一種非洲語言。但她不懂那種語言。某個死人的靈魂在通過她的嘴說話！」\n\n這越來越奇怪了。\n\n一個舞者拿著槍走到中間。他假裝向其他舞者開槍。他們假裝接住子彈並扔回給他。他倒下了，「被」自己的子彈「殺死」了。舞蹈在馬龍人揮舞著步槍準備突襲時結束。",

        99: {
            text: "你正在樹林裡悄悄靠近一個種植園。你到達一個棚子，從後面窺視。這些建築看起來很熟悉。這是Throneberry的地方，你剛剛逃離的那個！\n\n「John！」你嘶嘶地說。「我們為什麼回到這裡？」\n\n「我帶我們來的。我們要解放我的姐妹們。」\n\n馬龍人首領遞給你一個燃燒的火把。「你，Century。留在這裡。放火燒這個棚子。人們來滅火，我們就去襲擊奴隸屋。」他們消失在夜色中。\n\n有人來了。你跳進棚子裡，關上門。一股熟悉的氣味包圍著你。你在一個廁所裡！\n\n「快點在裡面，」一個聲音說。是奴隸監工！你把火把舉到屋頂。小房間裡充滿了煙霧。\n\n「裡面怎麼了？」\n\n好了！終於燒起來了。奴隸監工開始踢門。你必須離開這裡！\n\n跳回過去的皇家港，1670年。",

        69: {

    // 遊戲狀態機
    class Game {
        constructor() {
            this.state = {
                currentNode: 1,
                inventory: [],
                history: [],
                isGameOver: false,
                isVictory: false
            };
            this.init();
        }

        init() {
            this.render();
            this.updateSidebar();
        }

        render() {
            const node = gameData[this.state.currentNode];
            if (!node) return;

            const storyTextEl = document.getElementById('storyText');
            const choicesEl = document.getElementById('choicesContainer');
            
            // 打字機效果 (簡化版)
            storyTextEl.innerHTML = `<p>${node.text.replace(/\n/g, '<br>')}</p>`;
            
            choicesEl.innerHTML = '';
            if (node.choices && node.choices.length > 0) {
                node.choices.forEach((choice, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerHTML = `<span>▶</span> ${choice.text}`;
                    btn.onclick = () => this.makeChoice(index);
                    choicesEl.appendChild(btn);
                });
            } else {
                // 無選項時顯示重新開始按鈕
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = `<span>🔄</span> 重新開始遊戲`;
                btn.onclick = () => this.restart();
                choicesEl.appendChild(btn);
            }
        }

        makeChoice(index) {
            const node = gameData[this.state.currentNode];
            const choice = node.choices[index];

            if (choice.action === 'restart') {
                this.restart();
                return;
            }

            // 記錄歷史
            this.state.history.push({
                from: this.state.currentNode,
                choiceText: choice.text
            });

            // 更新狀態
            this.state.currentNode = choice.next;
            
            // 處理物品
            if (node.items && node.items.length > 0) {
                node.items.forEach(item => {
                    if (!this.state.inventory.includes(item)) {
                        this.state.inventory.push(item);
                    }
                });
            }

            // 檢查結局
            if (this.state.currentNode === 113) {
                this.state.isVictory = true;
                this.showModal('🎉 任務完成！', '你成功找到了康塞普西翁號的寶藏，並安全返回了20世紀！');
            }

            // 重新渲染
            this.render();
            this.updateSidebar();
        }

        updateSidebar() {
            // 更新背包
            const invEl = document.getElementById('inventoryGrid');
            invEl.innerHTML = '';
            if (this.state.inventory.length === 0) {
                invEl.innerHTML = '<p style="color: #666; font-size: 0.8rem; grid-column: span 2; text-align: center;">目前沒有物品</p>';
            } else {
                this.state.inventory.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    // 使用 SVG 替代圖片
                    let svgIcon = '';
                    if (item.includes('銀')) {
                        svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;
                    } else if (item.includes('龍涎香')) {
                        svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>`;
                    } else {
                        svgIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4.5 2 7L12 16l-6.5 4.5 2-7L2 9h7z"/></svg>`;
                    }
                    card.innerHTML = `
                        ${svgIcon}
                        <div class="item-label">${item}</div>
                    `;
                    invEl.appendChild(card);
                });
            }

            // 更新歷史
            const histEl = document.getElementById('historyLog');
            histEl.innerHTML = '';
            if (this.state.history.length === 0) {
                histEl.innerHTML = '<p style="color: #666; font-size: 0.8rem;">旅程尚未開始</p>';
            } else {
                this.state.history.slice(-5).forEach(log => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerText = `選擇：${log.choiceText}`;
                    histEl.appendChild(div);
                });
            }
        }

        saveGame() {
            const saveData = {
                state: this.state
            };
            localStorage.setItem('timeMachineSave', JSON.stringify(saveData));
            this.showModal('💾 存檔成功', '你的冒險進度已保存。');
        }

        loadGame() {
            const saved = localStorage.getItem('timeMachineSave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    this.state = data.state;
                    this.render();
                    this.updateSidebar();
                    this.showModal('📂 讀檔成功', '歡迎回來，時間旅行者。');
                } catch (e) {
                    this.showModal('❌ 讀檔失敗', '存檔數據損壞。');
                }
            } else {
                this.showModal('❌ 讀檔失敗', '找不到存檔紀錄。');
            }
        }

        restart() {
            if (confirm('確定要重新開始嗎？目前的進度將會丟失。')) {
                this.state = {
                    currentNode: 1,
                    inventory: [],
                    history: [],
                    isGameOver: false,
                    isVictory: false
                };
                this.render();
                this.updateSidebar();
                this.closeModal();
            }
        }

        showRules() {
            this.showModal('📖 遊戲規則', `
                <strong>目標：</strong>尋找沉沒的「康塞普西翁號」並帶回寶藏。<br><br>
                <strong>時間旅行者守則：</strong><br>
                1. 不能殺死任何人或動物。<br>
                2. 不能改變歷史，不能留下未來的物品。<br>
                3. 不能帶任何人穿越時空。<br>
                4. 必須服從時間機器提供的選項。<br><br>
                <em>注意：錯誤的選擇可能導致死亡或受困。你可以隨時利用時間跳躍回到過去重新選擇。</em>
            `);
        }

        showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerHTML = text;
            document.getElementById('modalOverlay').classList.add('active');
        }

        closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    }

    // 初始化遊戲
    const game = new Game();
</script>
