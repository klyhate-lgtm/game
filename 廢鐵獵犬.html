<style>
:root{
  --bg:#14100d;--bg2:#1d1712;--panel:#241c15;--panel2:#2e241b;--panel3:#3a2d21;
  --rust:#c66a2b;--amber:#e8b04b;--text:#e9dcc6;--dim:#a89a86;--dim2:#7a6d5c;
  --green:#7ab648;--red:#d0453a;--blue:#4a90a4;--purple:#9b6bbf;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#2a2017 0%,transparent 60%),

}
#app{position:fixed;inset:0;bottom:52px;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;-webkit-overflow-scrolling:touch}

.hidden{display:none!important}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--amber);letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:6px}
h1,h2{margin:0 0 8px;font-weight:700}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}

.timeline{border-left:2px solid var(--border2);padding-left:12px;margin-left:6px}
.tl-item{position:relative;margin-bottom:10px;font-size:12.5px;line-height:1.55}

.prog>i{display:block;height:100%;background:linear-gradient(90deg,#c66a2b,#e8b04b);transition:width .35s}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .modal{padding:14px}

</style>

<script>
"use strict";
/* =========================================================
   廢鐵獵犬 Scrap Hounds — 規則完整版
   ========================================================= */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n)+1;
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 音效 ---------- */
let audioCtx=null, soundOn=true;
function sfx(freq=440,dur=0.07,type='square',vol=0.035){
  if(!soundOn)return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
const sfxClick=()=>sfx(320,0.04,'square',0.03);
const sfxOk=()=>{sfx(520,0.06,'triangle',0.05);setTimeout(()=>sfx(760,0.09,'triangle',0.05),60)};
const sfxFail=()=>{sfx(200,0.1,'sawtooth',0.045);setTimeout(()=>sfx(140,0.14,'sawtooth',0.04),80)};
const sfxHit=()=>{sfx(160,0.12,'sawtooth',0.06);setTimeout(()=>sfx(90,0.16,'sawtooth',0.05),70)};

let toastTimer=null;
function toast(msg,ms=2400){
  const el=$('#toast');el.textContent=msg;el.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),ms);
}

/* =========================================================
   骰子核心
   ========================================================= */
function rollDice(boons=0,banes=0){
  const nb=Math.max(0,boons-banes);
  const nn=Math.max(0,banes-boons);
  const n=3+nb+nn;
  const all=[];
  for(let i=0;i<n;i++) all.push(rnd(6));
  all.sort((a,b)=>a-b);
  let kept;
  if(nb>0&&nn===0) kept=all.slice(-3);        // 增益：取最高三顆
  else if(nn>0&&nb===0) kept=all.slice(0,3);  // 減益：取最低三顆
  else kept=all.slice(-3);                     // 無修正/抵消後
  const sum=kept.reduce((a,b)=>a+b,0);
  const triple=kept[0]===kept[1]&&kept[1]===kept[2];
  return {all,kept,sum,triple,boons:nb,banes:nn};
}
function diceHTML(roll,tn,total,result,success,extra){
  const keptCount={};
  roll.kept.forEach(v=>keptCount[v]=(keptCount[v]||0)+1);
  let shown=0;
  const dice=roll.all.map((v,i)=>{
    const isKept = keptCount[v]>0 && shown<roll.kept.length;
    if(isKept){keptCount[v]--;shown++;}
    return `<div class="die ${isKept?'kept':'dropped'}" style="animation-delay:${i*0.05}s">${v}</div>`;
  }).join('');
  return `<div class="dice-result">${dice}</div>
    <div class="center small ${success?'green':'red'}">
      總值 <b>${total}</b> 對抗 <b>${tn}+</b> → 成果值 <b>${result}</b> ${success?'✅ 成功':'❌ 失敗'}
      ${roll.triple?'　<span class="amber">🎲 三同號</span>':''}
    </div>
    ${extra?`<div class="center tiny amber">${extra}</div>`:''}`;
}

   ========================================================= */

const ARCHETYPES={
  mech:{zh:'機甲',dc:{light:20,medium:25,heavy:30},move:{light:7,medium:6,heavy:5},MATT:3,RATT:3,DEF:3,DET:1,QUL:1,DB:{light:3,medium:4,heavy:5},freeTrait:'armored'},

  infantry:{zh:'步兵',dc:{light:10,medium:15,heavy:20},move:{light:3,medium:3,heavy:3},MATT:1,RATT:1,DEF:1,DET:1,QUL:1,DB:{light:1,medium:1,heavy:1}},

  supermutant:{zh:'超級變種人',dc:{light:10,medium:15,heavy:20},move:{light:3,medium:3,heavy:3},MATT:2,RATT:3,DEF:3,DET:1,QUL:1,DB:{light:2,medium:3,heavy:4},freeTrait:'energyWeapons'},

   ========================================================= */
function buildStats(kind,size,traits){
  const A=ARCHETYPES[kind];
  const s={MATT:A.MATT,RATT:A.RATT,DEF:A.DEF,DET:A.DET,QUL:A.QUL,DB:A.DB[size],move:A.move[size]};
  let extraDC=0, armorDice=0;
  const tset=traits||[];
  if(tset.includes('armored')) armorDice={light:1,medium:2,heavy:3}[size];
  for(const t of tset){
    switch(t){
      case 'animalSenses': case 'sensorArray': s.DET+=1; break;
      case 'boostedMove': s.move+=(kind==='infantry'?1:3); break;
      case 'hover': s.move+=2; break;
      case 'riflemen': s.RATT+=1; break;
      case 'skirmisher': s.MATT+=1; s.DB+=1; break;
      case 'closeQuarter': s.MATT+=2; break;
      case 'powerArmor': s.DEF+=1; s.MATT+=1; if(!armorDice) armorDice=1; break;
      case 'veteran': s.QUL+=1; break;
      case 'tough': extraDC+={light:2,medium:4,heavy:6}[size]; break;
      case 'green': s.QUL-=1; break;
      case 'ace': s.RATT+=1; s.MATT+=1; break;
      case 'missiles': s.RATT+=1; break;
      case 'closeAssault': s.MATT+=1; break;
    }
  }
  return {stats:s,extraDC,armorDice};
}

function buildSystems(traits){
  const sys=[];
  for(const t of traits){
    if(TRAITS[t]&&TRAITS[t].sys) sys.push({key:t,name:TRAITS[t].n,boxes:[false,false]});
  }
  return sys;
}

function makePlayerUnit(kind,size,name,traits){
  const A=ARCHETYPES[kind];
  const base=buildStats(kind,size,traits);
  const dcMax=A.dc[size]+base.extraDC;
  return {
    id:'p'+Math.random().toString(36).slice(2,9),
    name:name||randomName(), kind, size,
    stats:base.stats, dcMax, dc:dcMax, armorDice:base.armorDice,
    traits:traits.slice(), systems:buildSystems(traits),
    growth:0, status:'ok',
  };
}

function newCrew(){
  const used=new Set();
  const nm=()=>{let n,g=0;do{n=randomName();g++;}while(used.has(n)&&g<40);used.add(n);return n;};
  const units=[];
  // 機甲（中型）：免費裝甲化 + 4 特性
  units.push(makePlayerUnit('mech','medium',nm(),['armored','veteran','sensorArray','energyWeapons','jumpJets']));
  // 廢鐵小隊（步兵）：免費拾荒者 + 4
  units.push(makePlayerUnit('infantry','medium',nm(),['scrapper','boostedMove','skirmisher','tough','scout']));
  // 保安小隊（步兵）：免費步槍兵 + 4
  units.push(makePlayerUnit('infantry','medium',nm(),['riflemen','tough','veteran','sensorArray','assaultSpec']));
  // 偵察小隊（步兵）：免費偵察 + 4
  units.push(makePlayerUnit('infantry','medium',nm(),['scout','boostedMove','animalSenses','skirmisher','tough']));
  // 支援載具（中型）：免費運輸車 + 4
  units.push(makePlayerUnit('vehicle','medium',nm(),['hauler','armored','ifv','tough','ecm']));
  // 備用機甲（輕型）：規則要求輕型
  const backup=makePlayerUnit('mech','light',nm()+'（備用）',['armored','veteran','sensorArray','jumpJets']);
  backup.status='reserve';
  units.push(backup);
  return units;
}

function stepRecon(){
  const c=state.campaign;
  if(c.reconDone){
    return `<div class="panel fade-in">
      <h3>📍 偵察結果</h3>
      <p class="small" style="line-height:1.9">

        可搜尋廢鐵標記：<b class="amber">${c.scrapTotal}</b> 個<br>
        偵察檢定：${c.reconOk?'<span class="green">成功</span>':'<span class="red">失敗</span>'}
      </p>
      <hr>
      <div class="btnrow"><button class="primary" data-act="goRaid" style="flex:1">▶ 出發！廢鐵突襲</button></div>
    </div>`;
  }
  return `<div class="panel fade-in">
    <h3>📍 第 1 步：地點偵察</h3>
    <p class="small dim" style="line-height:1.9">追蹤線索、探查廢墟——這是你的<b class="amber">偵察單位</b>在突襲前夕所做的準備。</p>
    <div class="btnrow"><button class="primary" data-act="doRecon" style="flex:1">🔍 派出偵察單位</button></div>
  </div>`;
}

function doRecon(){
  const c=state.campaign;
  const d1=rnd(6), d2=rnd(6);
  const loc=LOCALES.find(l=>l.r===d1)||LOCALES[0];
  const subIdx=d2<=2?0:d2<=4?1:2;
  c.localeName=loc.name; c.localeSub=loc.subs[subIdx];
  const scout=c.units.find(u=>u.kind==='infantry'&&u.traits.includes('scout')&&u.status==='ok')
           ||c.units.find(u=>u.kind==='infantry'&&u.status==='ok');
  let boons=0;
  if(scout&&scout.traits.includes('scout')) boons++;
  if(c.intelBonus){boons++;}
  const roll=rollDice(boons,0);
  const total=roll.sum+(scout?scout.stats.QUL:0);
  let result=total-13;
  if(result>=0&&roll.triple) result++;
  const success=result>=0;
  c.reconOk=success;
  c.scrapTotal=success?5:(rnd(3)+1);
  c.reconDone=true;
  c.intelBonus=false;
  addHistory(`📍 ${c.localeName}—${c.localeSub}：偵察${success?'成功':'失敗'}，廢鐵標記 ${c.scrapTotal} 個。`);
  showModal(`
    <h2>📍 地點偵察</h2>
    <p class="small dim">擲 1D6：<b>${d1}</b> → ${loc.name}；再擲 1D6：<b>${d2}</b> → ${loc.subs[subIdx]}</p>
    <hr>
    <p class="small">偵察單位 <b class="amber">${scout?esc(scout.name):'（無）'}</b> 進行 13+ 素質檢定${boons?`（增益 +${boons}）`:''}：</p>
    ${diceHTML(roll,13,total,result,success)}
    <hr>
    <p class="small">可搜尋的廢鐵標記：<b class="amber">${c.scrapTotal}</b> 個</p>
    <div class="btnrow"><button class="primary" data-act="closeModal" style="flex:1">繼續</button></div>
  `,()=>render());
  sfxOk();
}

function generateEnemies(){
  const c=state.campaign;
  c.enemies=[];
  // 偵察危險
  const scout=c.units.find(u=>u.kind==='infantry'&&u.traits.includes('scout')&&u.status==='ok')
           ||c.units.find(u=>u.kind==='infantry'&&u.status==='ok');
  let boons=(scout&&scout.traits.includes('scout'))?1:0;
  const r=rollDice(boons,0);
  const tot=r.sum+(scout?scout.stats.DET:0);
  let result=tot-13; if(result>=0&&r.triple) result++;
  c.reconAdjust=result>=0?1+result:0;

  // 領袖：兩顆骰分別讀取
  const t1=rnd(6), t2=rnd(6);
  let leaderKind;
  if(t1<=2) leaderKind='mech';
  else if(t1<=4) leaderKind='kaiju';
  else leaderKind='supermutant';
  let leaderSize=t2<=1?'heavy':t2<=4?'medium':'light';
  const leader=makeGCUnit(leaderKind,leaderSize,null,'leader');
  leader.tier=rnd(3); rebuildGCStats(leader);
  c.enemies.push(leader);

  // 部下
  const count=rnd(3)+2;
  let mechUsed=leaderKind==='mech';
  for(let i=0;i<count;i++){
    let d=rnd(6),kind,size,role;
    if(d===1){ if(mechUsed) kind='vehicle'; else {kind='mech';mechUsed=true;} }
    else if(d===2) kind=Math.random()<0.5?'kaiju':'supermutant';
    else if(d<=4) kind='vehicle';
    else kind='infantry';
    const s=rnd(6); size=s<=1?'heavy':s<=4?'medium':'light';
    if(kind==='vehicle') role='shooter';
    else if(kind==='infantry') role=Math.random()<0.5?'shooter':'fighter';
    else role=pick(['fighter','shooter','specialist','leader']);
    const u=makeGCUnit(kind,size,null,role);
    rebuildGCStats(u);
    c.enemies.push(u);
  }
  // 套用偵察降級
  let adj=c.reconAdjust;
  while(adj>0){
    const cand=c.enemies.filter(e=>e.size!=='light');
    if(!cand.length) break;
    const t=pick(cand);
    t.size=t.size==='heavy'?'medium':'light';
    rebuildGCStats(t);
    adj--;
  }
  // 廢鐵超過 3 個 → 額外 Tier
  const extraTier=Math.max(0,c.scrapTotal-3);
  for(let i=0;i<extraTier;i++){
    const e=pick(c.enemies); e.tier=(e.tier||0)+1; rebuildGCStats(e);
  }
  c.enemiesReady=true;
  addHistory(`⚔️ 遭遇 ${c.enemies.length} 個敵人（領袖：${c.enemies[0].name}）。`);
  render(); toast('敵軍已生成'); sfxOk();
}

function makeGCUnit(kind,size,name,role){
  const A=ARCHETYPES[kind];
  const traits=[];
  if(A.freeTrait) traits.push(A.freeTrait);
  const u={
    uid:'g'+Math.random().toString(36).slice(2,9), side:'gc', kind, size, role:role||'fighter',
    name:name||randomName(), tier:0, traits, stats:{}, dcMax:0, dc:0, armorDice:0,
    x:0,y:0,move:0,
  };
  rebuildGCStats(u); return u;
}
function rebuildGCStats(u){
  const A=ARCHETYPES[u.kind];
  const base=buildStats(u.kind,u.size,u.traits);
  u.stats=Object.assign({},base.stats);
  u.armorDice=base.armorDice;
  const tierBonus=u.tier||0;
  u.stats.MATT+=tierBonus; u.stats.RATT+=tierBonus; u.stats.DEF+=tierBonus;
  u.dcMax=A.dc[u.size]+base.extraDC+(u.traits.includes('tough')?{light:2,medium:4,heavy:6}[u.size]*u.traits.filter(t=>t==='tough').length:0);
  u.dc=u.dcMax;
  u.move=base.stats.move;
}

function stepFallout(){
  const c=state.campaign;
  if(c.falloutDone){
    return `<div class="panel fade-in">

      <div class="small" style="line-height:2">
        ${(c.falloutLog||[]).map(l=>`<div>${l}</div>`).join('')||'<span class="dim">無特殊事件</span>'}
      </div>
      <hr>
      <div class="btnrow"><button class="primary" data-act="nextRepair" style="flex:1">▶ 前往恢復與維修</button></div>
    </div>`;
  }
  return `<div class="panel fade-in">
    <h3>🩸 第 3 步：戰後餘波</h3>
    <p class="small dim" style="line-height:1.9">確定出局單位的命運、清點戰利品，並讓團隊成長。</p>
    <div class="btnrow"><button class="primary" data-act="doFallout" style="flex:1">📋 結算戰後餘波</button></div>
  </div>`;

function doFallout(){
  const c=state.campaign;
  const log=[];
  const res=c.battleResult||{ooa:[],loot:0};

  // Part 1：倒下者的命運
  const boons=c.baseDone.medicalBay?1:0; // 醫療艙：一個步兵單位獲得免費增益
  let medicUsed=false;
  if(res.ooa&&res.ooa.length){
    res.ooa.forEach(uid=>{
      const u=c.units.find(x=>x.id===uid);
      if(!u) return;
      let b=0;
      if(boons&&!medicUsed&&u.kind==='infantry'){b=1;medicUsed=true;}
      const roll=rollDice(b,0);
      let total=roll.sum+u.stats.QUL;
      let result=total-13; if(result>=0&&roll.triple) result++;
      const ok=result>=0;
      const pair=(roll.kept[0]===roll.kept[1]||roll.kept[1]===roll.kept[2]||roll.kept[0]===roll.kept[2]);
      if(ok){
        u.status='ok';
        log.push(`✅ ${esc(u.name)} 通過命運檢定（${total} vs 13+），安然無恙。`);
      } else if(pair){
        u.status='miss'; u.dc=Math.max(1,Math.floor(u.dcMax*0.3));
        log.push(`⚠️ ${esc(u.name)} 檢定失敗（${total}），但擲出對子——錯過下一場戰鬥。`);
      } else {
        // 前線機甲被摧毀時，備用機甲可替換
        if(u.kind==='mech'&&c.units.some(x=>x.status==='reserve'&&x.kind==='mech')){
          const back=c.units.find(x=>x.status==='reserve'&&x.kind==='mech');
          back.status='ok';
          u.status='destroyed';
          log.push(`💀 ${esc(u.name)} 被摧毀，但<b class="green">備用機甲 ${esc(back.name)}</b> 緊急上陣！`);
        } else {
          u.status='destroyed'; u.dc=0;
          log.push(`💀 ${esc(u.name)} 檢定失敗（${total}），已被摧毀／死亡。`);
        }
      }
    });
  } else {
    log.push('✅ 本場戰鬥沒有單位出局。');
  }

  // Part 2：清點戰利品
  let mc=0;
  const loot=res.loot||0;
  for(let i=0;i<loot;i++) mc+=rnd(3)+1;
  c.uwa+=mc;
  log.push(`💰 回收 ${loot} 個廢鐵標記 → <b class="amber">+${mc} MC</b>`);

  // Part 3：成長（不能是上一輪成長的單位，且每單位先各成長一次）
  const survivors=c.units.filter(u=>u.status==='ok'||u.status==='miss');
  if(survivors.length){
    const eligible=survivors.filter(u=>u.id!==c.lastGrowthUid);
    const pool=eligible.length?eligible:survivors;
    const minGrowth=Math.min(...pool.map(u=>u.growth||0));
    const candidates=pool.filter(u=>(u.growth||0)===minGrowth);
    const target=pick(candidates);
    const d=rnd(6);
    const statName=['MATT','RATT','DEF','DET','QUL','DB'][d-1];
    target.stats[statName]=(target.stats[statName]||0)+1;
    target.growth=(target.growth||0)+1;
    c.lastGrowthUid=target.id;
    log.push(`📈 ${esc(target.name)} 獲得成長：<b class="amber">${statName} +1</b>`);
  }

  c.units=c.units.filter(u=>u.status!=='destroyed');
  c.falloutLog=log;
  c.falloutDone=true;
  c.enemiesReady=false;
  c.enemies=[];
  addHistory(`🩸 戰後：回收 ${loot} 個廢鐵，獲得 ${mc} MC。`);
  render();
  showModal(`<h2>🩸 戰後餘波</h2>
    <div class="small" style="line-height:2">${log.join('<br>')}</div>
    <div class="btnrow" style="margin-top:12px"><button class="primary" data-act="closeModal" style="flex:1">繼續</button></div>`,
    ()=>render());
  sfxOk();
}

function repairCard(u){
  const pct=Math.round(u.dc/u.dcMax*100);
  const dmg=u.dcMax-u.dc;
  const hasSysDmg=u.systems&&u.systems.some(s=>s.boxes[0]||s.boxes[1]);
  return `<div class="card" style="width:150px">
    <div class="cv" style="width:52px;height:52px">${iconFor(u.kind,'var(--amber)')}</div>
    <div class="cn" style="font-size:11px">${esc(u.name)}</div>
    <div style="width:100%;margin-top:6px">
      <div class="dcbar"><i class="${pct<35?'crit':pct<70?'warn':''}" style="width:${pct}%"></i></div>
      <div class="tiny center dim" style="margin-top:3px">DC ${u.dc}/${u.dcMax}</div>
      <div style="display:flex;gap:4px;margin-top:5px">
        <button class="sm" style="flex:1;font-size:10px;padding:3px" data-act="repairUnit" data-uid="${u.id}" ${dmg>0?'':'disabled'}>修DC</button>
        <button class="sm" style="flex:1;font-size:10px;padding:3px" data-act="repairSys" data-uid="${u.id}" ${hasSysDmg?'':'disabled'}>修系統</button>
      </div>
    </div>
  </div>`;
}

function beginRepair(){
  const c=state.campaign;
  c.repairActionsLeft=c.units.filter(u=>u.status==='ok').length+1;
  c.repairLog=[];
  c.step='repair';
  render();
}

function consumeRepairAction(){
  const c=state.campaign;
  if(c.repairActionsLeft<=0){ toast('本步驟已無可用動作'); return false; }
  c.repairActionsLeft--;
  return true;
}

function repairUnitDC(uid){
  const c=state.campaign;
  const u=c.units.find(x=>x.id===uid);
  if(!u) return;
  if(!consumeRepairAction()) return;
  if(u.kind==='infantry'){
    u.dc=u.dcMax;
    c.repairLog.push(`${esc(u.name)} 完全恢復（步兵免擲骰）。`);
    toast(`✅ ${u.name} 恢復全部 DC`); sfxOk(); render(); return;
  }
  const roll=rollDice(0,0);
  let total=roll.sum+u.stats.QUL;
  let result=total-13; if(result>=0&&roll.triple) result++;
  if(result>=0){
    const gain=5+result;
    u.dc=Math.min(u.dcMax,u.dc+gain);
    c.repairLog.push(`${esc(u.name)} 恢復 ${gain} DC（總值 ${total}）。`);
    toast(`🔧 ${u.name} 恢復 ${gain} DC`); sfxOk();
  } else {
    c.repairLog.push(`${esc(u.name)} 維修失敗（總值 ${total} vs 13+）。`);
    toast('❌ 維修失敗'); sfxFail();
  }
  render();
}

function repairUnitSys(uid){
  const c=state.campaign;
  const u=c.units.find(x=>x.id===uid);
  if(!u) return;
  if(!consumeRepairAction()) return;
  const roll=rollDice(0,0);
  let total=roll.sum+u.stats.QUL;
  let result=total-13; if(result>=0&&roll.triple) result++;
  if(result>=0){
    let fixed=0;
    for(const s of u.systems){
      if(s.boxes[1]){s.boxes[1]=false;fixed++;break;}
      if(s.boxes[0]){s.boxes[0]=false;fixed++;break;}
    }
    // 4+ 成果值額外恢復一個方框
    if(result>=4){
      for(const s of u.systems){
        if(s.boxes[1]){s.boxes[1]=false;fixed++;break;}
        if(s.boxes[0]){s.boxes[0]=false;fixed++;break;}
      }
    }
    c.repairLog.push(`${esc(u.name)} 修復了 ${fixed} 個系統方框。`);
    toast(`🔧 系統修復成功（${fixed} 格）`); sfxOk();
  } else {
    c.repairLog.push(`${esc(u.name)} 系統維修失敗。`);
    toast('❌ 系統維修失敗'); sfxFail();
  }
  render();
}

function doExtendedBuild(key,need,label){
  const c=state.campaign;
  if(!consumeRepairAction()) return;
  const unit=c.units.find(u=>u.status==='ok');
  if(!unit){ toast('沒有可執行檢定的單位'); c.repairActionsLeft++; return; }
  let boons=0;
  if(key==='salvage'&&unit.traits.includes('scrapper')) boons++;
  if(key==='repairBay'&&c.baseDone.repairBay) boons++;
  const roll=rollDice(boons,0);
  let total=roll.sum+unit.stats.QUL;
  let result=total-13; if(result>=0&&roll.triple) result++;
  if(result>=0){
    c.extended[key]+=1+result;
    if(c.extended[key]>=need){
      if(key==='salvage'){ /* 打撈完成 */ }
      else { c.baseDone[key]=true; c.base[key]=need; }
      toast(`🏗️ ${label} 建造完成！`); sfxOk();
    } else {
      toast(`${label} 進度 ${c.extended[key]}/${need}（+${1+result}）`); sfxOk();
    }
    c.repairLog.push(`${label}：+${1+result} 成果值（總 ${c.extended[key]}/${need}）。`);
  } else {
    toast(`${label} 檢定失敗`); sfxFail();
    c.repairLog.push(`${label}：檢定失敗。`);
  }
  render();
}

    toast(`💼 打零工成功：+${gain} MC`); sfxOk();
  } else {
    const dmg=Math.max(1,-result);
    u.dc=Math.max(1,u.dc-dmg);

}

function tpKaijuMarket(){

function tpSellSalvage(){

  const u=consumeTrading(); if(!u) return;

function tpBuySystem(){
  const c=state.campaign;
  if(c.uwa<1){ toast('💰 需要 1 MC'); return; }
  const u=consumeTrading(); if(!u) return;
  if(u.systems.length>=6){ toast('系統已滿（最多 6 個，可先卸載）'); return; }

  u.systems.push({key,name:TRAITS[key]?TRAITS[key].n:key,boxes:[false,false]});

    u.dcMax+=add; u.dc=Math.min(u.dcMax,u.dc+add);
  }
  addHistory(`🔧 ${esc(u.name)} 安裝新系統「${TRAITS[key]?TRAITS[key].n:key}」。`);
  toast(`🔧 已安裝「${TRAITS[key]?TRAITS[key].n:key}」`); sfxOk(); render();
}

function tpayEscape(){
  const c=state.campaign;
  if(c.uwa<1){ toast('💰 需要 1 MC'); return; }
  const u=consumeTrading(); if(!u) return;
  const target=c.units.find(x=>x.status==='ok'&&x.systems.some(s=>s.boxes[0]||s.boxes[1]));
  if(!target){ toast('沒有受損的機甲或載具'); return; }
  c.uwa-=1;
  // 恢復兩個系統方框
  let fixed=0;
  for(const s of target.systems){
    if(s.boxes[1]){s.boxes[1]=false;fixed++;if(fixed>=2)break;}
    if(s.boxes[0]){s.boxes[0]=false;fixed++;if(fixed>=2)break;}
  }
  addHistory(`💊 花錢脫身：${esc(target.name)} 恢復 ${fixed} 個系統方框（-1 MC）。`);
  toast(`💊 ${target.name} 恢復 ${fixed} 個方框`); sfxOk(); render();
}

   結束一輪
   ========================================================= */
function endRound(){
  const c=state.campaign;
  // 維護費未付懲罰
  if(c.missed.sustenance) addHistory('⚠️ 未付口糧：下場戰鬥第一次攻擊與防禦將受減益。');
  if(c.missed.ops) addHistory('⚠️ 未付行動補給：下場戰鬥第 1、2 輪先攻將加入 2 個 X 因素。');
  if(c.missed.base) addHistory('⚠️ 未付基地補給：下場戰鬥前兩次素質檢定將受減益。');

  // 債務違約
  if(c.debt>0&&!c.paidThisRound){
    c.debt+=1;
    c.debtMissStreak=(c.debtMissStreak||0)+1;
    addHistory(`📉 未償還債務，欠款增加 1 MC（現為 ${c.debt} MC）。`);
    if(c.debtMissStreak>=2){
      // 15+ QUL 檢定
      const roll=rollDice(0,0);
      let total=roll.sum+1;
      let result=total-15;
      if(result<0){
        addHistory('💀 債主派出回收小隊！下一輪改為保衛基地。');
        c.debtMissStreak=0;
        c.round++;
        startDefense();
        return;
      }
    }
  } else if(c.debt<=0){
    c.debtMissStreak=0;
  }

  // 勝利檢查
  if(c.debt<=0&&c.uwa>=c.goal){
    c.ended=true; c.victory=true;
    addAchievement('victory');
    state.screen='gameover';
    render();
    return;
  }

  // 下一輪
  c.round++;
  if(c.round>=10) addAchievement('round10');
  c.step='recon';
  c.localeName=''; c.localeSub=''; c.reconDone=false; c.enemiesReady=false;
  c.enemies=[]; c.battleResult=null; c.ooUnits=[];
  c.falloutDone=false; c.repairActionsLeft=0; c.repairLog=[];
  c.tradingUsed=[];
  c.paidThisRound=false;
  c.extended.salvage=0;
  c.luck=c.baseDone.recRoom?Math.max(rnd(3),rnd(3)):rnd(3);
  c.units.forEach(u=>{ if(u.status==='miss') u.status='ok'; });
  addHistory(`🔄 第 ${c.round} 輪開始（運氣 ${c.luck} 點）。`);
  render();
  toast(`🔄 第 ${c.round} 輪開始`); sfxOk();
}

    victory:'🚀 離開這顆星球',

/* =========================================================
   戰鬥
   ========================================================= */
const GRID=10, CELL_INCH=2;

function startBattle(){
  const c=state.campaign;
  const units=[];
  const players=c.units.filter(u=>u.status==='ok');
  players.forEach((u,i)=>{
    units.push({
      uid:u.id, side:'player', kind:u.kind, size:u.size, name:u.name,
      stats:Object.assign({},u.stats), dc:u.dc, dcMax:u.dcMax,
      armorDice:u.armorDice, traits:u.traits.slice(),
      x:1+i*2, y:GRID-1, moveLeft:Math.round(u.stats.move/CELL_INCH),
      moved:false, acted:false, alive:true, hasX:false, carries:0,
      burning:false, srcRef:u, role:'player',
      systems:u.systems.map(s=>({key:s.key,name:s.name,boxes:s.boxes.slice()})),
      initNum:0, hasAttacked:false,
      firstAtkPenalty:(c.missed.sustenance?1:0),
      firstDefPenalty:(c.missed.sustenance?1:0),
      qulPenaltyLeft:(c.missed.base?2:0),
      chargeBonus:0, charging:false,
    });
  });
  c.enemies.forEach((e,i)=>{
    units.push({
      uid:e.uid, side:'gc', kind:e.kind, size:e.size, name:e.name, role:e.role,
      stats:Object.assign({},e.stats), dc:e.dcMax, dcMax:e.dcMax,
      armorDice:e.armorDice, traits:e.traits.slice(), tier:e.tier,
      x:1+(i%5)*2, y:Math.floor(i/5),
      moveLeft:Math.round(e.move/CELL_INCH), moved:false, acted:false, alive:true,
      hasX:false, carries:0, srcRef:e, initNum:0,
      systems:[], burning:false,
    });
  });

  // 廢鐵標記（5 個地形特徵的位置）
  const scrap=[], terrain=[];
  const used=new Set();
  for(let i=0;i<c.scrapTotal;i++){
    let x,y,g=0;
    do{ x=1+rnd(GRID-2); y=1+rnd(GRID-4); g++; }while(used.has(x+','+y)&&g<200);
    used.add(x+','+y);
    scrap.push({x,y,taken:false});
    terrain.push({x,y});
  }
  // 額外掩體地形
  for(let i=0;i<4;i++){
    let x,y,g=0;
    do{ x=rnd(GRID-1); y=1+rnd(GRID-2); g++; }while(used.has('c'+x+','+y)&&g<200);
    used.add('c'+x+','+y);
    terrain.push({x,y,cover:true});
  }

  state.battle={
    round:1, maxRounds:5, units, scrap, terrain,
    order:[], orderIdx:0, activeUid:null,
    phase:'initiative', awaiting:'none',
    log:[], loot:0, disaster:null, ended:false, endReason:'',
    xRecipientSide:'', extraXForOps:(c.missed.ops?2:0),
    roundXUsed:0,
  };
  c.defending=false;
  state.screen='battle';
  render();
  toast('⚔️ 戰鬥開始！');
}

function battleLog(txt){
  const b=state.battle;
  if(!b) return;
  b.log.push(txt);
  if(b.log.length>80) b.log.shift();
}

function rollInitiative(){
  const b=state.battle;
  if(!b||b.ended) return;
  const alive=b.units.filter(u=>u.alive);
  alive.forEach(u=>u.hasX=false);

  // 抽取 X 因素（額外籌碼）
  let xCount=1;
  if(b.round<=2&&b.extraXForOps>0){ xCount+=b.extraXForOps; b.extraXForOps=0; }
  const xLog=[];
  for(let i=0;i<xCount;i++){
    const r=pick(alive);
    if(r.side==='gc'){ r.hasX=true; xLog.push(`${r.name}【X因素】`); }
    else { xLog.push(`${r.name}（玩家，無效果）`); }
  }

  // 分配編號
  const nums=alive.map((_,i)=>i+1);
  for(let i=nums.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [nums[i],nums[j]]=[nums[j],nums[i]]; }
  alive.forEach((u,i)=>{ u.initNum=nums[i]; });
  b.order=alive.slice().sort((a,c)=>a.initNum-c.initNum).map(u=>u.uid);
  b.orderIdx=0;
  b.phase='activation';
  b.awaiting='none';

  battleLog(`— 第 ${b.round} 輪先攻 —`);
  b.order.forEach(uid=>{
    const u=b.units.find(x=>x.uid===uid);
    if(u) battleLog(`　${u.initNum}. ${u.name}${u.hasX?' 【X因素】':''}`);
  });
  if(xLog.length) battleLog(`🎲 X 因素：${xLog.join('、')}`);
  render();
  setTimeout(()=>nextActivation(), 400);
}

function nextActivation(){
  const b=state.battle;
  if(!b||b.ended){ render(); return; }
  while(b.orderIdx<b.order.length){
    const uid=b.order[b.orderIdx];
    const u=b.units.find(x=>x.uid===uid);
    if(u&&u.alive) break;
    b.orderIdx++;
  }
  if(b.orderIdx>=b.order.length){ endBattleRound(); return; }
  const u=b.units.find(x=>x.uid===b.order[b.orderIdx]);
  b.activeUid=u.uid;
  u.moved=false; u.acted=false;
  u.moveLeft=Math.round(u.stats.move/CELL_INCH);
  if(u.hasX) u.moveLeft+=Math.round(3);
  b.phase='activation';

  if(u.side==='player'){
    b.awaiting='playerAction';
    render();
  } else {
    b.awaiting='none';
    render();
    setTimeout(()=>gcActivate(u), 450);
  }
}

function endBattleRound(){
  const b=state.battle;
  if(!b||b.ended) return;
  // 火焰持續傷害
  b.units.filter(u=>u.alive&&u.burning).forEach(u=>{
    u.dc-=1;
    battleLog(`🔥 ${u.name} 受到 1 點火焰持續傷害。`);
    if(u.dc<=0) killUnit(u);
  });
  b.round++;
  if(b.round>b.maxRounds){ endBattle('輪數耗盡'); return; }
  if(b.round===b.maxRounds){
    const dr=rnd(6);
    const dis=DISASTERS.find(d=>d.r===dr)||DISASTERS[0];
    b.disaster=dis;
    battleLog(`☄️ 環境災難：${dis.name} — ${dis.fx}`);
    applyDisaster(dis,dr);
    render();
    showModal(`<h2>☄️ 即將來臨的災難</h2>
      <p class="small">第 ${b.round} 輪開始，擲 1D6：<b>${dr}</b></p>
      <h4>${dis.name}</h4><p class="small">${dis.fx}</p>
      <div class="btnrow" style="margin-top:10px"><button class="primary" data-act="closeModal" style="flex:1">繼續戰鬥</button></div>`,
      ()=>{ b.phase='initiative'; b.awaiting='rollInit'; render(); });
    return;
  }
  b.phase='initiative';
  b.awaiting='rollInit';
  render();
}

function applyDisaster(dis,dr){
  const b=state.battle;
  if(!b) return;
  const rollDmg=(n)=>rnd(6)+n;
  switch(dis.kind){
    case 'all_d6_sys':{
      b.units.filter(u=>u.alive).forEach(u=>{
        const d=rnd(6); u.dc-=d;
        if(d>=5&&u.systems&&u.systems.length){
          const s=pick(u.systems);
          if(!s.boxes[0]) s.boxes[0]=true; else if(!s.boxes[1]) s.boxes[1]=true;
        }
        if(u.dc<=0) killUnit(u);
      });
      break;
    }
    case 'all_d6_sc':{
      b.units.filter(u=>u.alive).forEach(u=>{
        const d=rnd(6); u.dc-=d;
        if(d>=5&&u.carries>0){ u.carries--; b.loot=Math.max(0,b.loot-1); }
        if(u.dc<=0) killUnit(u);
      });
      break;
    }
    case 'inf_d6_rad':{
      b.units.filter(u=>u.alive&&u.kind==='infantry'&&!u.traits.includes('powerArmor')).forEach(u=>{
        const d=rnd(6); u.dc-=d;
        if(d>=5){ u.radSickness=true; }
        if(u.dc<=0) killUnit(u);
      });
      break;
    }
    case 'all_d6p1':{
      b.units.filter(u=>u.alive).forEach(u=>{ u.dc-=(rnd(6)+1); if(u.dc<=0) killUnit(u); });
      break;
    }
    case 'noninf_d6p2':{
      b.units.filter(u=>u.alive&&u.kind!=='infantry').forEach(u=>{ u.dc-=(rnd(6)+2); if(u.dc<=0) killUnit(u); });
      break;
    }
    case 'all_d6p1_qul':{
      b.units.filter(u=>u.alive).forEach(u=>{
        u.dc-=(rnd(6)+1);
        if(u.dc<=0){ killUnit(u); return; }
        if(u.side==='player'){
          const r=rollDice(0,0);
          let t=r.sum+u.stats.QUL;
          let res=t-15; if(res>=0&&r.triple) res++;
          if(res<0){ u.stats.QUL=Math.max(-1,u.stats.QUL-1); }
        }
      });
      break;
    }
  }
}

/* ---------- 玩家操作 ---------- */
function battleClickCell(x,y){
  const b=state.battle;
  if(!b||b.awaiting!=='playerAction') return;
  const u=b.units.find(u=>u.uid===b.activeUid);
  if(!u||!u.alive) return;
  if(u.acted){ toast('此單位本回合已行動完畢'); return; }
  const dist=Math.max(Math.abs(u.x-x),Math.abs(u.y-y));
  if(dist>u.moveLeft){ toast('移動力不足'); return; }
  const occupied=b.units.find(o=>o.alive&&o.x===x&&o.y===y);
  if(occupied){ toast('該格已有單位'); return; }
  // 脫離近戰檢查
  const adjacentEnemies=b.units.filter(o=>o.alive&&o.side!=='player'&&Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))<=1);
  if(adjacentEnemies.length>0&&u.kind!=='mech'){
    // 機甲以外的單位脫離近戰會遭自由攻擊
    let hit=false;
    adjacentEnemies.forEach(e=>{
      const r=rollDice(0,0);
      let total=r.sum+e.stats.MATT;
      const tn=11+u.stats.DEF;
      let res=total-tn; if(res>=0&&r.triple) res++;
      if(res>=0){
        let dmg=res+e.stats.DB;
        if(u.armorDice>0){ let best=0; for(let i=0;i<u.armorDice;i++) best=Math.max(best,rnd(3)); dmg=Math.max(0,dmg-best); }
        u.dc-=dmg; hit=true;
        battleLog(`⚔️ ${e.name} 自由攻擊 ${u.name}，造成 ${dmg} 傷害。`);
        if(u.dc<=0) killUnit(u);
      }
    });
    if(hit) sfxHit();
  }
  // 衝鋒記錄
  const wasMelee = b.units.some(o=>o.alive&&o.side!=='player'&&Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))<=1);
  u.x=x; u.y=y; u.moveLeft-=dist;
  const nowMelee = b.units.some(o=>o.alive&&o.side!=='player'&&Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))<=1);
  if(!wasMelee&&nowMelee&&dist*CELL_INCH>=3){ u.charging=true; }
  sfx(440,0.05,'triangle',0.03);
  render();
}

function enterAttackMode(){
  const b=state.battle;
  if(!b) return;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){ toast('此單位已行動'); return; }
  b.awaiting='attackTarget';
  render();
}

function doPlayerAttack(targetUid, opts){
  const b=state.battle;
  if(!b) return;
  const atk=b.units.find(u=>u.uid===b.activeUid);
  const def=b.units.find(u=>u.uid===targetUid);
  if(!atk||!def||!atk.alive||!def.alive) return;
  const o=opts||{};

  const distCells=Math.max(Math.abs(atk.x-def.x),Math.abs(atk.y-def.y));
  const isMelee=distCells<=1;
  if(!isMelee&&distCells*CELL_INCH>60){ toast('超出射程'); return; }
  if(isMelee&&!isMelee) return;
  if(!isMelee&&isMelee) return;

  if(!isMelee){
    if(atk.traits.includes('shortRanged')&&distCells*CELL_INCH>10){ toast('短程專精：目標超出 10" 射程'); return; }
  }

  let att=isMelee?atk.stats.MATT:atk.stats.RATT;
  let dmgBonus=atk.stats.DB;
  let boons=0, banes=0;
  const notes=[];

  if(isMelee){
    if(atk.traits.includes('skirmisher')){ dmgBonus+=1; notes.push('散兵+1'); }
    if(atk.traits.includes('closeAssault')){
      if(def.kind==='vehicle'){ att+=1; notes.push('突擊套件+1'); }
      if(def.kind==='infantry'){ att+=2; notes.push('突擊套件+2'); }
    }
    if(atk.charging){ att+=1; dmgBonus+=1; notes.push('衝鋒+1/+1'); }
    // 集團突擊
    const allies=b.units.filter(a=>a.alive&&a.side==='player'&&a!==atk&&Math.max(Math.abs(a.x-def.x),Math.abs(a.y-def.y))<=1);
    if(allies.length>0){
      const bonus=Math.min(3,allies.length);
      att+=bonus; notes.push(`集團突擊+${bonus}`);
    }
  } else {
    if(atk.traits.includes('riflemen')){ att+=1; notes.push('步槍兵+1'); }
    if(atk.traits.includes('gaussWeapons')&&distCells*CELL_INCH>15){ att+=1; notes.push('電磁+1'); }
    if(atk.traits.includes('shortRanged')&&distCells*CELL_INCH<=5){ att+=2; dmgBonus+=2; notes.push('短程+2/+2'); }
    if(atk.traits.includes('antiInfantry')&&def.kind==='infantry'&&distCells*CELL_INCH<=10){
      att+=2; dmgBonus+=1; notes.push('反步兵+2/+1');
    }
    if(atk.traits.includes('tankHunter')&&(def.kind==='mech'||def.kind==='vehicle')){
      att+=atk.stats.QUL; dmgBonus+=atk.stats.QUL; notes.push('坦克獵手');
    }
    if(atk.traits.includes('kaijuHunter')&&def.kind==='kaiju'){
      att+=atk.stats.QUL; dmgBonus+=atk.stats.QUL; notes.push('怪獸獵手');
    }
  }
  // X 因素
  if(atk.hasX){ boons++; notes.push('X因素+1'); }
  // 掩體
  const defInCover=b.terrain.some(t=>t.cover&&t.x===def.x&&t.y===def.y);
  if(defInCover){ banes++; notes.push('目標在掩體'); }
  // 未付口糧懲罰
  if(atk.firstAtkPenalty>0&&!atk.hasAttacked){ banes+=atk.firstAtkPenalty; atk.firstAtkPenalty=0; notes.push('口糧懲罰'); }
  atk.hasAttacked=true;

  const tn=11+def.stats.DEF+(def.hasX?1:0)+(defInCover?1:0);

  // 壓制射擊
  if(o.suppress&&def.kind==='infantry'){
    const roll=rollDice(boons,banes);
    let total=roll.sum+att;
    let result=total-tn; if(result>=0&&roll.triple) result++;
    atk.acted=true; atk.moveLeft=0; b.awaiting='none';
    if(result>=0){
      const supTN=11+result;
      const sr=rollDice(0,0);
      let st=sr.sum+def.stats.QUL;
      let sres=st-supTN; if(sres>=0&&sr.triple) sres++;
      if(sres<0){ def.suppressed=true; battleLog(`💥 ${def.name} 被壓制！`); }
      else { battleLog(`💥 ${def.name} 抵抗壓制。`); }
      toast(`壓制射擊：${def.name}${def.suppressed?'被壓制':'抵抗成功'}`);
    } else { toast('壓制射擊未命中'); }
    render(); setTimeout(()=>{ if(!b.ended) endPlayerTurn(); },250);
    return;
  }

  // 過載
  let overloadDmg=0;
  if(o.overload&&atk.traits.includes('energyWeapons')){
    overloadDmg=Math.min(6,Math.max(1,o.overload));
    atk.dc-=overloadDmg;
    battleLog(`⚡ ${atk.name} 過載 +${overloadDmg}，自身受 ${overloadDmg} 無法豁免傷害。`);
    if(atk.dc<=0){ killUnit(atk); }
  }

  const roll=rollDice(boons,banes);
  let total=roll.sum+att;
  let result=total-tn;
  if(result>=0&&roll.triple) result++;
  const success=result>=0;

  let dmg=0, saved=0;
  if(success){
    dmg=result+dmgBonus+overloadDmg;
    if(def.armorDice>0){
      let best=0; for(let i=0;i<def.armorDice;i++) best=Math.max(best,rnd(3));
      saved=best; dmg=Math.max(0,dmg-best);
    }
    def.dc-=dmg;
    sfxHit();
    if(dmg>=5) maybeSystemDamage(def,dmg);
    if(atk.traits.includes('flamer')&&!isMelee){ def.burning=true; }
    if(def.dc<=0) killUnit(def);
    battleLog(`${atk.name} ${isMelee?'近戰':'遠程'}攻擊 ${def.name}：${total} vs ${tn}+ → 命中，造成 ${dmg} 傷害${saved?`（裝甲減 ${saved}）`:''}${notes.length?' ['+notes.join(',')+']':''}`);
  } else {
    sfxFail();
    battleLog(`${atk.name} ${isMelee?'近戰':'遠程'}攻擊 ${def.name}：${total} vs ${tn}+ → 未中${notes.length?' ['+notes.join(',')+']':''}`);
  }

  atk.acted=true; atk.moveLeft=0; b.awaiting='none';
  render();
  setTimeout(()=>{ if(!b.ended) endPlayerTurn(); },250);
}

function maybeSystemDamage(u,dmg){
  if(!u.systems||!u.systems.length) return;
  if(dmg>=5){
    const s=pick(u.systems);
    if(!s.boxes[0]){ s.boxes[0]=true; battleLog(`⚙️ ${u.name}「${s.name}」受損。`); }
    else if(!s.boxes[1]){ s.boxes[1]=true; battleLog(`⚙️ ${u.name}「${s.name}」失能！`); }
  }
  if(dmg>=10&&u.systems.length>1){
    const s2=pick(u.systems);
    if(!s2.boxes[0]) s2.boxes[0]=true;
    else if(!s2.boxes[1]) s2.boxes[1]=true;
  }
}

function doOverheat(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){ toast('此單位已行動'); return; }
  if(u.kind!=='mech'){ toast('只有機甲可以過熱'); return; }
  u.overheated=true;
  u.moveLeft+=rnd(3)+1;
  const dmg=rnd(3)+1;
  u.dc-=dmg;
  battleLog(`🔥 ${u.name} 過熱：額外 ${dmg} 移動，受到 ${dmg} 無法豁免傷害。`);
  if(u.systems&&u.systems.length){
    const s=pick(u.systems);
    if(!s.boxes[0]) s.boxes[0]=true; else if(!s.boxes[1]) s.boxes[1]=true;
  }
  if(u.dc<=0) killUnit(u);
  toast(`🔥 過熱：+${dmg} 移動，-${dmg} DC`); sfxHit();
  render();
}

function doForcedMarch(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){ toast('此單位已行動'); return; }
  if(u.moveLeft>0){ toast('請先使用完移動力再強行軍'); return; }
  const roll=rollDice(0,0);
  let total=roll.sum+u.stats.QUL;
  let result=total-11; if(result>=0&&roll.triple) result++;
  if(result>=0){
    u.moveLeft+=1+result;
    battleLog(`🏃 ${u.name} 強行軍：額外 ${1+result} 格。`);
    toast(`🏃 強行軍成功：+${1+result} 格`); sfxOk();
  } else {
    battleLog(`🏃 ${u.name} 強行軍失敗。`);
    toast('❌ 強行軍失敗'); sfxFail();
  }
  render();
}

function doScavenge(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){ toast('此單位已行動'); return; }
  const near=b.scrap.find(s=>!s.taken&&Math.max(Math.abs(s.x-u.x),Math.abs(s.y-u.y))<=1);
  if(!near){ toast('附近沒有廢鐵標記'); return; }
  let boons=0;
  if(u.traits.includes('scrapper')) boons++;
  const tn=u.kind==='mech'?14:13;
  const roll=rollDice(boons,0);
  let total=roll.sum+u.stats.QUL;
  let result=total-tn; if(result>=0&&roll.triple) result++;
  if(result>=0){
    near.taken=true;
    u.carries++;
    b.loot++;
    // 搬運上限檢查
    let cap=1;
    if(u.kind==='mech') cap={light:1,medium:2,heavy:3}[u.size]+u.stats.QUL;
    else if(u.kind==='vehicle') cap={light:2,medium:3,heavy:4}[u.size]+u.stats.QUL;
    else if(u.traits.includes('powerArmor')) cap=2;
    if(u.carries>cap){ u.carries=cap; b.loot=Math.max(0,b.loot-1); }
    battleLog(`⚙️ ${u.name} 取得廢鐵標記（總值 ${total} vs ${tn}+）。`);
    sfxOk();
  } else {
    battleLog(`⚙️ ${u.name} 取廢鐵失敗（總值 ${total} vs ${tn}+）。`);
    sfxFail();
  }
  u.acted=true; b.awaiting='none';
  render();
  setTimeout(()=>{ if(!b.ended) endPlayerTurn(); },250);
}

function endPlayerTurn(){
  const b=state.battle;
  if(!b||b.ended) return;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(u){ u.acted=true; u.charging=false; }
  b.awaiting='none';
  render();
  setTimeout(()=>{ b.orderIdx++; nextActivation(); },300);
}

function killUnit(u){
  if(!u.alive) return;
  u.alive=false; u.dc=0;
  battleLog(`💀 ${u.name} 出局！`);
  const b=state.battle;
  // 爆炸
  if(u.kind==='mech'||u.kind==='vehicle'||u.kind==='kaiju'){
    const d=[rnd(6),rnd(6),rnd(6)];
    if(d.includes(1)){
      const oneIdx=d.indexOf(1);
      const others=d.filter((v,i)=>i!==oneIdx);
      const radius=others[0]+others[1];
      const dmg=u.size==='light'?2:u.size==='medium'?4:6;
      battleLog(`💥 ${u.name} 爆炸！半徑 ${radius}"，傷害 ${dmg}。`);
      b.units.filter(o=>o.alive&&o!==u).forEach(o=>{
        const dist=Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))*CELL_INCH;
        if(dist<=radius){
          o.dc-=dmg;
          battleLog(`　${o.name} 受到 ${dmg} 爆炸傷害。`);
          if(o.dc<=0) killUnit(o);
        }
      });
    }
  }
  // 攜帶廢鐵掉落
  if(u.carries>0){
    for(let i=0;i<u.carries;i++){
      if(rnd(6)<=2){ b.loot=Math.max(0,b.loot-1); }
    }
    u.carries=0;
  }
  // 打撈機會：敵方機甲/載具被摧毀，我方機甲/載具在 2" 內
  if(u.side==='gc'&&(u.kind==='mech'||u.kind==='vehicle')){
    const nearby=b.units.some(p=>p.alive&&p.side==='player'&&(p.kind==='mech'||p.kind==='vehicle')&&Math.max(Math.abs(p.x-u.x),Math.abs(p.y-u.y))<=1);
    if(nearby){
      const c=state.campaign;
      c.salvagePool.push({kind:u.kind,size:u.size});
      battleLog(`🔧 可以打撈 ${u.name} 的殘骸（${SIZE_ZH[u.size]}${ARCHETYPES[u.kind].zh}）。`);
    }
  }
  checkBattleEnd();
}

function checkBattleEnd(){
  const b=state.battle;
  if(!b||b.ended) return;
  const pAlive=b.units.some(u=>u.alive&&u.side==='player');
  const gAlive=b.units.some(u=>u.alive&&u.side==='gc');
  if(!pAlive){ endBattle('全軍覆沒'); return; }
  if(!gAlive){ endBattle('敵人全滅'); return; }
}

/* ---------- GC AI ---------- */
function gcActivate(u){
  const b=state.battle;
  if(!b||b.ended||!u.alive) return;
  const players=b.units.filter(p=>p.alive&&p.side==='player');
  if(!players.length){ endBattle('全軍覆沒'); return; }
  const dist=(a,c)=>Math.max(Math.abs(a.x-c.x),Math.abs(a.y-c.y));
  const nearest=players.slice().sort((a,c)=>dist(u,a)-dist(u,c))[0];
  let actionCount=1;
  if(u.hasX) actionCount=2;
  let acted=false;

  for(let act=0;act<actionCount;act++){
    if(!u.alive) break;
    // 專家優先搶廢鐵
    if(u.role==='specialist'){
      const sc=b.scrap.find(s=>!s.taken);
      if(sc){
        const d=dist(u,sc);
        if(d<=1){
          sc.taken=true; u.carries++; b.loot++;
          battleLog(`⚙️ ${u.name} 搶走廢鐵標記。`);
          acted=true;
          continue;
        } else { moveToward(u,sc.x,sc.y); }
      }
    }
    const d=dist(u,nearest);
    if(d<=1){
      gcAttack(u,nearest,true);
      acted=true;
    } else if(u.role==='fighter'&&d<=u.moveLeft){
      moveToward(u,nearest.x,nearest.y);
      if(dist(u,nearest)<=1) gcAttack(u,nearest,true);
      acted=true;
    } else {
      const ranged=(u.role==='shooter'||u.role==='leader'||u.kind==='mech'||u.kind==='vehicle'||u.kind==='kaiju');
      const inRange=players.some(p=>dist(u,p)<=6);
      if(ranged&&inRange){
        const tgt=players.slice().sort((a,c)=>dist(u,a)-dist(u,c))[0];
        gcAttack(u,tgt,false);
        acted=true;
      } else {
        moveToward(u,nearest.x,nearest.y);
        if(dist(u,nearest)<=1) gcAttack(u,nearest,true);
        acted=true;
      }
    }
    if(!u.hasX) break;
  }

  u.acted=true;
  render();
  setTimeout(()=>{
    if(b.ended) return;
    b.orderIdx++;
    nextActivation();
  },500);
}

function moveToward(u,tx,ty){
  const b=state.battle;
  for(let i=0;i<u.moveLeft;i++){
    const dx=Math.sign(tx-u.x), dy=Math.sign(ty-u.y);
    if(dx===0&&dy===0) break;
    const nx=u.x+dx, ny=u.y+dy;
    if(nx<0||nx>=GRID||ny<0||ny>=GRID) break;
    const occ=b.units.find(o=>o.alive&&o!==u&&o.x===nx&&o.y===ny);
    if(occ) break;
    u.x=nx; u.y=ny;
    if(u.x===tx&&u.y===ty) break;
  }
  u.moveLeft=0;
}

function gcAttack(atk,def,isMelee){
  const b=state.battle;
  let att=isMelee?atk.stats.MATT:atk.stats.RATT;
  let db=atk.stats.DB;
  let boons=atk.hasX?1:0;
  const defInCover=b.terrain.some(t=>t.cover&&t.x===def.x&&t.y===def.y);
  const banes=defInCover?1:0;
  const tn=11+def.stats.DEF+(def.hasX?1:0)+(defInCover?1:0);
  // 集團突擊
  const allies=b.units.filter(a=>a.alive&&a.side==='gc'&&a!==atk&&Math.max(Math.abs(a.x-def.x),Math.abs(a.y-def.y))<=1);
  if(isMelee&&allies.length>0) att+=Math.min(3,allies.length);

  const roll=rollDice(boons,banes);
  let total=roll.sum+att;
  let result=total-tn; if(result>=0&&roll.triple) result++;
  const success=result>=0;

  if(success){
    let dmg=result+db, saved=0;
    if(def.armorDice>0){
      let best=0; for(let i=0;i<def.armorDice;i++) best=Math.max(best,rnd(3));
      saved=best; dmg=Math.max(0,dmg-best);
    }
    def.dc-=dmg;
    sfxHit();
    if(dmg>=5) maybeSystemDamage(def,dmg);
    battleLog(`⚔️ ${atk.name} 攻擊 ${def.name}：${total} vs ${tn}+ → 命中，造成 ${dmg} 傷害${saved?`（裝甲減 ${saved}）`:''}`);
    if(def.dc<=0) killUnit(def);
  } else {
    sfxFail();
    battleLog(`⚔️ ${atk.name} 攻擊 ${def.name}：${total} vs ${tn}+ → 未中`);
  }
}

function endBattle(reason){
  const b=state.battle;
  if(!b||b.ended) return;
  b.ended=true; b.phase='ended'; b.awaiting='none'; b.endReason=reason;
  battleLog(`— 戰鬥結束：${reason} —`);
  render();
}

function continueBattle(){
  const b=state.battle;
  if(!b) return;
  b.orderIdx++;
  nextActivation();
}

function finishBattle(){
  const b=state.battle;
  const c=state.campaign;
  if(!b) return;
  const players=b.units.filter(u=>u.side==='player');
  const ooa=players.filter(u=>!u.alive).map(u=>u.uid);
  const loot=b.loot;
  players.forEach(p=>{
    const src=c.units.find(x=>x.id===p.uid);
    if(src){
      src.dc=Math.max(0,p.dc);
      if(p.systems) src.systems=p.systems.map(s=>({key:s.key,name:s.name,boxes:s.boxes.slice()}));
    }
  });
  c.battleResult={ooa,loot,reason:b.endReason||'結束'};
  c.ooUnits=ooa;
  state.battle=null;
  state.screen='campaign';
  c.step='fallout';
  c.defending=false;
  addHistory(`⚔️ 戰鬥結束（${c.battleResult.reason}）：取得 ${loot} 個廢鐵標記，${ooa.length} 個單位出局。`);
  render();
}

function viewBattle(){
  const b=state.battle;
  if(!b) return '<div class="panel">戰鬥資料遺失</div>';
  const active=b.units.find(u=>u.uid===b.activeUid&&u.alive);

  let grid='';
  for(let y=0;y<GRID;y++){
    for(let x=0;x<GRID;x++){
      const u=b.units.find(o=>o.alive&&o.x===x&&o.y===y);
      const sc=b.scrap.find(s=>!s.taken&&s.x===x&&s.y===y);
      const terr=b.terrain.find(t=>t.x===x&&t.y===y);
      let cls='cell';
      if(terr){ cls+=terr.cover?' cover':' terrain'; }
      if(active&&b.awaiting==='playerAction'&&!u){
        const d=Math.max(Math.abs(active.x-x),Math.abs(active.y-y));
        if(d>0&&d<=active.moveLeft&&!active.acted) cls+=' reach';
      }
      if(b.awaiting==='attackTarget'&&u&&u.side==='gc') cls+=' target';
      if(active&&active.x===x&&active.y===y) cls+=' active';

      let inner='';
      if(sc&&!u) inner+=`<div class="scrap">${iconFor('scrap','var(--amber)')}</div>`;
      if(u){
        const pct=Math.round(Math.max(0,u.dc)/u.dcMax*100);
        const col=u.side==='player'?'var(--amber)':'var(--red)';
        inner+=`<div class="uicon">${iconFor(u.kind,col)}</div>`;
        inner+=`<div class="dcmini"><i style="width:${pct}%;background:${pct<35?'#d0453a':pct<70?'#e8b04b':'#7ab648'}"></i></div>`;
        if(u.hasX) inner+=`<div class="xmark">X</div>`;
        if(u.initNum) inner+=`<div class="initmark">${u.initNum}</div>`;
      }

      let act='';
      if(b.awaiting==='playerAction'&&!u) act=`data-act="battleMove" data-x="${x}" data-y="${y}"`;
      else if(b.awaiting==='attackTarget'&&u&&u.side==='gc') act=`data-act="battleAttackTarget" data-uid="${u.uid}"`;

      grid+=`<div class="${cls}" ${act}>${inner}</div>`;
    }
  }

  let actionPanel='';
  if(b.phase==='initiative'){
    actionPanel=`<div class="panel center">
      <p class="small dim">第 ${b.round} 輪 — 先攻階段</p>
      <button class="primary" data-act="battleRollInit" style="width:100%">🎲 抽取先攻籌碼</button>
    </div>`;
  } else if(b.phase==='ended'){
    actionPanel=`<div class="panel center">
      <h3 class="amber">戰鬥結束</h3>
      <p class="small">${esc(b.endReason||'')}</p>
      <p class="small">取得廢鐵標記：<b class="amber">${b.loot}</b></p>
      <button class="primary" data-act="battleFinish" style="width:100%">📋 進入戰後餘波</button>
    </div>`;
  } else if(active&&active.side==='player'){
    const canAct=!active.acted;
    const nearScrap=b.scrap.find(s=>!s.taken&&Math.max(Math.abs(s.x-active.x),Math.abs(s.y-active.y))<=1);
    const adjTargets=b.units.filter(o=>o.alive&&o.side==='gc'&&Math.max(Math.abs(o.x-active.x),Math.abs(o.y-active.y))<=1);
    actionPanel=`<div class="panel">
      <div class="row" style="justify-content:space-between">
        <div><b class="amber">${esc(active.name)}</b> <span class="tiny dim">${SIZE_ZH[active.size]}${ARCHETYPES[active.kind].zh}</span></div>
        <div class="tiny dim">移動 ${active.moveLeft} 格${active.hasX?' · X':''}</div>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="sm ${b.awaiting==='attackTarget'?'primary':''}" data-act="battleAttack" ${canAct?'':'disabled'}>⚔️ 攻擊</button>
        <button class="sm" data-act="battleScavenge" ${canAct&&nearScrap?'':'disabled'}>⚙️ 取廢鐵</button>
        <button class="sm" data-act="battleOverheat" ${canAct&&active.kind==='mech'?'':'disabled'}>🔥 過熱</button>
        <button class="sm" data-act="battleForcedMarch" ${canAct?'':'disabled'}>🏃 強行軍</button>
        <button class="sm" data-act="battleEndTurn">⏭ 結束回合</button>
      </div>
      ${b.awaiting==='attackTarget'?'<div class="tiny amber center" style="margin-top:6px">請點選紅色目標（近戰需相鄰）</div>':''}
      ${b.awaiting==='playerAction'?'<div class="tiny dim center" style="margin-top:6px">點擊綠色格子移動，或直接攻擊</div>':''}
    </div>`;
  } else if(active){
    actionPanel=`<div class="panel center"><p class="small dim">${esc(active.name)} 正在行動…</p></div>`;
  } else {
    actionPanel=`<div class="panel center">
      <button class="primary" data-act="battleNext" style="width:100%">▶ 下一個單位</button>

  ${actionPanel}
  <div class="panel">
    <h3>📋 戰鬥紀錄</h3>
    <div class="small" style="max-height:130px;overflow-y:auto;line-height:1.7;color:var(--dim)">
      ${b.log.slice(-14).reverse().map(l=>`<div>${esc(l)}</div>`).join('')||'<div class="dim2">尚無紀錄</div>'}

  </div>

  <div class="panel"><h3>敵方單位</h3><div class="hscroll">${gcList.map(u=>battleUnitCard(u)).join('')}</div></div>`;
}

function battleUnitCard(u){
  const pct=Math.round(Math.max(0,u.dc)/u.dcMax*100);
  const isActive=state.battle.activeUid===u.uid;
  let sysHTML='';
  if(u.systems&&u.systems.length){
    sysHTML=u.systems.slice(0,3).map(s=>`<span class="tag sys">${s.name}<span class="sysbox ${s.boxes[0]?'on':''}"></span><span class="sysbox ${s.boxes[1]?'on':''}"></span></span>`).join('');
  }
  return `<div class="card ${u.alive?'':'dead'}" style="width:140px;${isActive?'border-color:var(--amber);box-shadow:0 0 12px rgba(232,176,75,.4)':''}">
    <div class="cv" style="width:46px;height:46px">${iconFor(u.kind,u.side==='player'?'var(--amber)':'var(--red)')}</div>
    <div class="cn" style="font-size:10.5px">${esc(u.name)}</div>
    <div style="width:100%;margin-top:4px">
      <div class="dcbar"><i class="${pct<35?'crit':pct<70?'warn':''}" style="width:${pct}%"></i></div>
      <div class="tiny center dim" style="margin-top:2px">${Math.max(0,u.dc)}/${u.dcMax} DC${u.carries?` · ⚙️×${u.carries}`:''}</div>
      ${sysHTML}
    </div>
  </div>`;
}

/* =========================================================
   事件處理
   ========================================================= */
let boundHandler=null;
function bindGlobal(){
  const app=$('#app');
  if(boundHandler) app.removeEventListener('click',boundHandler);
  boundHandler=(ev)=>{
    const el=ev.target.closest('[data-act]');
    if(el&&!el.disabled){
      try{ handleAction(el.dataset.act,el.dataset); }
      catch(e){ console.error(e); toast('⚠️ 操作錯誤：'+e.message); }
    }
  };
  app.addEventListener('click',boundHandler);

  const nb=$('#navbar');
  if(!nb.dataset.bound){
    nb.dataset.bound='1';
    nb.addEventListener('click',ev=>{
      const btn=ev.target.closest('[data-nav]');
      if(!btn||btn.disabled) return;
      sfxClick();
      const a=btn.dataset.nav;
      if(a==='help') showHelp();
      else if(a==='save') saveGame();
      else if(a==='load') loadGame();
      else if(a==='history') showHistory();
      else if(a==='sound'){ soundOn=!soundOn; renderNavbar(); toast(soundOn?'🔊 音效開啟':'🔇 音效關閉'); }
    });
  }
}

function handleAction(act,ds){
  sfxClick();
  const c=state.campaign;
  switch(act){
    case 'newGame': startNewGame(); break;
    case 'loadGame': loadGame(); break;
    case 'showHelp': showHelp(); break;
    case 'restart': state=defaultState(); render(); break;

    case 'doRecon': doRecon(); break;
    case 'goRaid': state.campaign.step='raid'; render(); break;
    case 'genEnemies': generateEnemies(); break;
    case 'startBattle': startBattle(); break;
    case 'startDefenseBattle': startBattle(); break;

    case 'doFallout': doFallout(); break;
    case 'nextRepair': beginRepair(); break;
    case 'repairUnit': repairUnitDC(ds.uid); break;
    case 'repairSys': repairUnitSys(ds.uid); break;
    case 'buildMedBay': doExtendedBuild('medicalBay',10,'醫療艙'); break;
    case 'improveRepairBay': doExtendedBuild('repairBay',10,'維修艙'); break;
    case 'buildRecRoom': doExtendedBuild('recRoom',8,'娛樂室'); break;
    case 'repairSalvage': doRepairSalvage(parseInt(ds.idx)); break;
    case 'nextTrading': state.campaign.step='trading'; render(); break;

    case 'tpReplaceInf': tpReplaceInfantry(); break;
    case 'tpReplaceVeh': tpReplaceVehicle(); break;
    case 'tpHireVeh': tpHireVeh(); break;
    case 'tpHireMech': tpHireMech(); break;
    case 'tpIntel': tpIntel(); break;
    case 'tpOddJob': tpOddJob(); break;
    case 'tpKaiju': tpKaijuMarket(); break;
    case 'tpSellSalvage': tpSellSalvage(); break;
    case 'tpBuySystem': tpBuySystem(); break;
    case 'tpayEscape': tpayEscape(); break;
    case 'nextDebts': state.campaign.step='debts'; render(); break;

    case 'payDebt1': payDebt(1); break;
    case 'payDebt3': payDebt(3); break;
    case 'payDebtAll': payDebt(c.debt); break;
    case 'payUpkeep': payUpkeep(); break;
    case 'endRound': endRound(); break;

    case 'battleMove': battleClickCell(parseInt(ds.x),parseInt(ds.y)); break;
    case 'battleAttack': enterAttackMode(); break;
    case 'battleAttackTarget': doPlayerAttack(ds.uid); break;
    case 'battleScavenge': doScavenge(); break;
    case 'battleOverheat': doOverheat(); break;
    case 'battleForcedMarch': doForcedMarch(); break;
    case 'battleEndTurn': endPlayerTurn(); break;
    case 'battleNext': continueBattle(); break;
    case 'battleRollInit': rollInitiative(); break;
    case 'battleFinish': finishBattle(); break;

    case 'closeModal': closeModal(); break;
    case 'startTutorial': closeModal(); state.tutorialSeen=true; startCampaign(); break;
  }
}

function doRepairSalvage(idx){
  const c=state.campaign;
  if(!consumeRepairAction()) return;
  const s=c.salvagePool[idx];
  if(!s){ toast('打撈品不存在'); return; }
  const unit=c.units.find(u=>u.status==='ok');
  if(!unit){ toast('沒有可執行檢定的單位'); return; }
  let boons=unit.traits.includes('scrapper')?1:0;
  const roll=rollDice(boons,0);
  let total=roll.sum+unit.stats.QUL;
  let result=total-13; if(result>=0&&roll.triple) result++;
  if(result>=0){
    c.extended.salvage+=1+result;
    if(c.extended.salvage>=10){
      c.salvagePool.splice(idx,1);
      c.extended.salvage=0;
      addHistory(`🔧 打撈完成一台敵方${SIZE_ZH[s.size]}${ARCHETYPES[s.kind].zh}。`);
      toast('🔧 打撈完成！可在交易站出售。'); sfxOk();
    } else {
      toast(`打撈進度 ${c.extended.salvage}/10`); sfxOk();
    }
  } else {
    toast('❌ 打撈檢定失敗'); sfxFail();
  }
  render();
}

/* =========================================================
   新遊戲 / 戰役開始
   ========================================================= */
function startNewGame(){
  state=defaultState();
  if(!state.tutorialSeen){ showHelp(true); return; }
  startCampaign();
}

function startCampaign(){
  if(!state) state=defaultState();
  state.screen='campaign';
  state.campaign.step='recon';
  const c=state.campaign;
  c.units=newCrew();
  c.round=1; c.uwa=0; c.debt=0;
  c.creditor=pick(CREDITORS);
  c.luck=rnd(3); c.goal=20;
  c.history=[]; c.achievements=[];
  c.localeName=''; c.localeSub=''; c.scrapTotal=0; c.reconDone=false; c.enemiesReady=false;
  c.enemies=[]; c.battleResult=null; c.ooUnits=[];
  c.tradingUsed=[]; c.salvagePool=[];
  c.extended={medicalBay:0,repairBay:0,recRoom:0,salvage:0};
  c.baseDone={medicalBay:false,repairBay:false,recRoom:false};
  c.base={medicalBay:0,repairBay:0,recRoom:0};
  c.missed={sustenance:false,ops:false,base:false};
  c.debtMissStreak=0; c.intelBonus=false;
  c.lastGrowthUid=null; c.paidThisRound=false;
  c.defending=false; c.ended=false; c.victory=false;
  addHistory('🚩 戰役開始。團隊在荒原中集結。');
  addHistory(`💰 債主：${c.creditor}。起始運氣 ${c.luck} 點。`);
  render();
  setTimeout(()=>toast('💰 起始運氣：'+c.luck+' 點'),300);
}

function addHistory(txt){
  state.campaign.history.push(txt);
  if(state.campaign.history.length>200) state.campaign.history.shift();
}

function showModal(html,cb){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal">${html}</div>`;
  root.classList.add('on');
  modalCallback=cb||null;
}
function closeModal(){
  const root=$('#modal-root');
  root.classList.remove('on');
  root.innerHTML='';
  const cb=modalCallback; modalCallback=null;
  if(cb) try{cb();}catch(e){console.error(e);}
}

    <li><b>集團突擊</b>：多打一時，每個攻擊者 MATT +1（最多 +3）。</li>
    <li><b>衝鋒</b>：移動至少 3" 後攻擊，近戰 +1 MATT 與 +1 傷害。</li>
    <li><b>脫離近戰</b>：除機甲外，移出近戰會遭對手自由攻擊。</li>
    <li><b>運氣點</b>：每輪開始時擲 1D3 獲得。任何檢定擲骰前宣告花 1 點，該次 +2。</li>
    <li><b>維護費</b>：如果付不出口糧，下場戰鬥第一次攻擊與防禦會受減益；付不出行動補給，先攻會多 2 個 X 因素。</li>
    <li><b>債務違約</b>：連續兩輪沒還錢，債主會派回收小隊——下一輪變成保衛基地戰。</li>
  </ul>

  <h4>💡 六、新手小訣竅</h4>
  <ul class="small">
    <li>不要想殲滅敵人——你的目標是<b>搶廢鐵</b>。搶到就撤，比硬拚划算。</li>
    <li>機甲是你最強的單位，但也最貴。讓步兵先去撿廢鐵，機甲負責掩護。</li>
    <li>「收集情報」只要 1 MC，卻能讓下次偵察獲得增益——非常划算。</li>
    <li>每輪一定要付清 3 MC 維護費，否則懲罰會滾雪球。</li>
    <li>如果真的周轉不過來，優先還債（避免債主上門），維護費其次。</li>
  </ul>

  <div class="btnrow" style="margin-top:18px">
    <button class="primary" data-act="${firstTime?'startTutorial':'closeModal'}" style="flex:1">
      ${firstTime?'🚀 我準備好了，開始遊戲':'✅ 關閉說明'}
    </button>
  </div>`;
  showModal(html);
}

function showHistory(){
  if(!state||state.screen==='title'){ toast('尚未開始遊戲'); return; }
  const c=state.campaign;
  const achNames={victory:'🚀 離開這顆星球',defeat:'💀 團隊覆滅',round10:'⏳ 撐過十輪',debtFree:'💎 無債一身輕'};
  const html=`
    <h2>📜 歷史紀錄</h2>
    <p class="small dim">你走過的路線。</p>
    <div class="timeline" style="max-height:48vh;overflow-y:auto;margin-top:10px">
      ${c.history.slice().reverse().map(h=>`<div class="tl-item">${h}</div>`).join('')||'<div class="dim2 small">尚無紀錄</div>'}
    </div>
    <h4>🏆 成就</h4>
    <div class="small">
      ${c.achievements.length?c.achievements.map(a=>`<span class="tag">${achNames[a]||a}</span>`).join(''):'<span class="dim2">尚未解鎖任何成就</span>'}
    </div>
    <div class="btnrow" style="margin-top:14px">
      <button class="primary" data-act="closeModal" style="flex:1">關閉</button>
    </div>`;
  showModal(html);
}

/* =========================================================
   啟動
   ========================================================= */
state=defaultState();
render();
</script>
</body>
</html>
