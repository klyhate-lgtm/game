<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>廢鐵獵犬 — Scrap Hounds</title>
<style>
:root{
  --bg:#14100d; --bg2:#1d1712; --panel:#241c15; --panel2:#2e241b; --panel3:#3a2d21;
  --rust:#c66a2b; --amber:#e8b04b; --text:#e9dcc6; --dim:#a89a86; --dim2:#7a6d5c;
  --green:#7ab648; --red:#d0453a; --blue:#4a90a4; --purple:#9b6bbf;
  --border:#4a3c2e; --border2:#6b5540;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(ellipse at 50% 0%, #2a2017 0%, transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.008) 0 2px, transparent 2px 4px),
    var(--bg);
  color:var(--text);
  font-family:"Noto Serif TC","Songti TC",Georgia,"Times New Roman",serif;
  overflow:hidden;
  user-select:none;
}
#app{
  position:fixed;inset:0;bottom:52px;
  overflow-y:auto;overflow-x:hidden;
  padding:10px 10px 16px;
  -webkit-overflow-scrolling:touch;
}
#app::after{
  content:'';position:fixed;inset:0;pointer-events:none;
  box-shadow:inset 0 0 140px 40px rgba(0,0,0,.85);
  z-index:5;
}
.hidden{display:none!important}

/* ===== 通用元件 ===== */
.panel{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;margin-bottom:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--amber);letter-spacing:1px;
  border-bottom:1px solid var(--border);padding-bottom:6px;}
h1,h2{margin:0 0 8px;font-weight:700}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
.small{font-size:12px} .tiny{font-size:11px}
.amber{color:var(--amber)} .green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
hr{border:0;border-top:1px solid var(--border);margin:8px 0}

/* ===== 按鈕 ===== */
button{
  font-family:inherit;font-size:14px;cursor:pointer;
  background:linear-gradient(180deg,#3d3025,#2b2118);
  color:var(--text);border:1px solid var(--border2);border-radius:6px;
  padding:9px 14px;transition:all .12s;letter-spacing:.5px;
  box-shadow:0 2px 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
  min-height:40px;
}
button:hover:not(:disabled){background:linear-gradient(180deg,#4c3b2d,#372a1f);border-color:var(--amber);color:#fff}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07)}
button:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.6)}
button.primary{background:linear-gradient(180deg,#8a4a1c,#5f3112);border-color:var(--rust);color:#ffe9c9}
button.primary:hover:not(:disabled){background:linear-gradient(180deg,#a85a22,#753d16)}
button.danger{background:linear-gradient(180deg,#7a2820,#4d1a14);border-color:#a03a2e}
button.ok{background:linear-gradient(180deg,#3f6b28,#2a4719);border-color:#5c9440}
button.sm{font-size:12px;padding:5px 9px;min-height:32px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ===== 頂部資源列 ===== */
.topbar{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;
  background:linear-gradient(180deg,#2e2319,#211a13);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px;
  position:sticky;top:-10px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.6);
}
.stat-chip{display:flex;flex-direction:column;align-items:center;min-width:56px;flex:1}
.stat-chip .lbl{font-size:10px;color:var(--dim);letter-spacing:.5px}
.stat-chip .val{font-size:16px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}

/* ===== 底部導航 ===== */
#navbar{
  position:fixed;left:0;right:0;bottom:0;height:52px;z-index:30;
  display:flex;background:linear-gradient(180deg,#2a2018,#181310);
  border-top:1px solid var(--border2);
  padding-bottom:env(safe-area-inset-bottom);
}
#navbar button{
  flex:1;border:0;border-radius:0;background:transparent;box-shadow:none;
  font-size:11px;padding:4px 2px;min-height:0;height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);border-right:1px solid rgba(255,255,255,.04);
}
#navbar button:last-child{border-right:0}
#navbar button:active{background:rgba(198,106,43,.18)}
#navbar .ico{font-size:17px;line-height:1}

/* ===== 單位卡 ===== */
.unit-card{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  margin-bottom:8px;position:relative;
}
.unit-card.dead{opacity:.42;filter:grayscale(1)}
.unit-card .uname{font-weight:700;font-size:14px;color:var(--amber)}
.dcbar{height:7px;background:#120e0b;border-radius:4px;overflow:hidden;margin-top:5px;border:1px solid #000}
.dcbar>i{display:block;height:100%;background:linear-gradient(90deg,#7ab648,#a8d060);transition:width .3s}
.dcbar>i.warn{background:linear-gradient(90deg,#c69a2b,#e8b04b)}
.dcbar>i.crit{background:linear-gradient(90deg,#a83228,#d0453a)}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;
  background:#3a2d21;border:1px solid var(--border);color:var(--dim);margin:2px 3px 0 0}
.tag.sys{background:#2b2536;border-color:#4a3c5e;color:#b79dd6}

/* ===== 水平捲動列 ===== */
.hscroll{
  display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;
  padding:6px 2px 10px;align-items:stretch;
  scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
}
.hscroll::-webkit-scrollbar{height:6px}
.hscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.hscroll>*{flex:0 0 auto}

/* ===== 卡牌 ===== */
.card{
  width:112px;background:linear-gradient(180deg,#33281e,#221a13);
  border:1px solid var(--border2);border-radius:8px;padding:6px;
  display:flex;flex-direction:column;align-items:center;position:relative;
  transition:transform .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.6)}
.card .cv{width:64px;height:64px;margin:2px 0}
.card .cn{font-size:11px;font-weight:700;text-align:center;color:var(--amber);line-height:1.25}
.card .cl{
  position:absolute;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.78);color:#f0e4cf;font-size:9.5px;line-height:1.25;
  padding:4px 5px;border-radius:0 0 7px 7px;text-align:center;
  max-height:56%;overflow:hidden;
}

/* ===== 棋盤 ===== */
.board-wrap{width:100%;max-width:540px;margin:0 auto}
.board{
  display:grid;gap:1px;background:#0d0a08;border:2px solid var(--border2);
  border-radius:6px;padding:3px;aspect-ratio:1;width:100%;
  grid-template-columns:repeat(10,1fr);
}
.cell{
  aspect-ratio:1;background:#221b15;position:relative;
  display:flex;align-items:center;justify-content:center;
  border-radius:2px;transition:background .12s;
}
.cell.terrain{background:#2c2318;box-shadow:inset 0 0 6px rgba(198,106,43,.25)}
.cell.terrain::after{content:'';position:absolute;inset:22%;border:1px dashed rgba(198,106,43,.4);border-radius:2px}
.cell.reach{background:#1e3320;box-shadow:inset 0 0 0 1px rgba(122,182,72,.5);cursor:pointer}
.cell.reach:hover{background:#2a4a2c}
.cell.target{background:#3d1a16;box-shadow:inset 0 0 0 1px rgba(208,69,58,.8);cursor:pointer;animation:pulseR .9s infinite alternate}
@keyframes pulseR{from{box-shadow:inset 0 0 0 1px rgba(208,69,58,.5)}to{box-shadow:inset 0 0 0 2px rgba(208,69,58,1)}}
.cell.active{box-shadow:inset 0 0 0 2px var(--amber)}
.cell .scrap{position:absolute;width:52%;height:52%;opacity:.95;filter:drop-shadow(0 0 3px rgba(232,176,75,.8))}
.cell .uicon{width:82%;height:82%;pointer-events:none}
.cell .dcmini{position:absolute;left:1px;right:1px;bottom:1px;height:3px;background:#000;border-radius:2px;overflow:hidden}
.cell .dcmini>i{display:block;height:100%;background:var(--green)}
.cell .xmark{position:absolute;top:-3px;right:-3px;font-size:10px;color:var(--amber);text-shadow:0 0 4px #000;font-weight:700}

/* ===== 彈窗 ===== */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);padding:12px;}
#modal-root.on{display:flex}
.modal{
  background:linear-gradient(180deg,#2c231a,#1c1611);
  border:1px solid var(--border2);border-radius:10px;
  max-width:640px;width:100%;max-height:88vh;overflow-y:auto;
  padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.9);
  animation:modalIn .22s ease-out;
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h2{color:var(--amber);font-size:18px;border-bottom:1px solid var(--border);padding-bottom:8px}
.modal h4{color:var(--rust);margin:14px 0 6px;font-size:14px}
.modal p,.modal li{font-size:13px;line-height:1.75;color:var(--text)}
.modal ul{padding-left:20px;margin:6px 0}

/* ===== Toast ===== */
#toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,15,12,.96);border:1px solid var(--amber);color:var(--amber);
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;
  opacity:0;transition:all .25s;pointer-events:none;max-width:88%;text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.8);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 擲骰動畫 ===== */
.dice-result{
  display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;
}
.die{
  width:34px;height:34px;border-radius:6px;
  background:linear-gradient(180deg,#e8dcc6,#b8a88e);
  color:#241c15;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:17px;border:1px solid #000;
  box-shadow:0 2px 6px rgba(0,0,0,.6);
  animation:dieIn .28s cubic-bezier(.2,1.6,.5,1) backwards;
}
.die.dropped{opacity:.25;filter:grayscale(1)}
.die.kept{background:linear-gradient(180deg,#f3e6c8,#cdb894);box-shadow:0 0 10px rgba(232,176,75,.6)}
@keyframes dieIn{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}

/* ===== 記錄/時間線 ===== */
.timeline{border-left:2px solid var(--border2);padding-left:12px;margin-left:6px}
.tl-item{position:relative;margin-bottom:10px;font-size:12.5px;line-height:1.55}
.tl-item::before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--rust);border:1px solid #000}

/* ===== 進度條 ===== */
.prog{height:8px;background:#0f0c09;border-radius:4px;overflow:hidden;border:1px solid #000}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#c66a2b,#e8b04b);transition:width .35s}

/* 打字機 */
.tw{cursor:pointer;min-height:1.4em}
.cursor-blink::after{content:'▌';animation:blink .8s steps(1) infinite;color:var(--amber)}
@keyframes blink{50%{opacity:0}}

/* 場景淡入 */
.fade-in{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 手機優化 */
@media(max-width:420px){
  #app{padding:8px 8px 14px}
  .card{width:96px}
  .stat-chip .val{font-size:14px}
  button{font-size:13px;padding:8px 11px}
  .modal{padding:14px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="navbar"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
"use strict";
/* =========================================================
   廢鐵獵犬 Scrap Hounds — 單人戰役網頁版
   ========================================================= */

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n)+1;
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 音效 ---------- */
let audioCtx = null, soundOn = true;
function sfx(freq=440, dur=0.07, type='square', vol=0.035){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function sfxClick(){ sfx(320,0.04,'square',0.03); }
function sfxOk(){ sfx(520,0.06,'triangle',0.05); setTimeout(()=>sfx(760,0.09,'triangle',0.05),60); }
function sfxFail(){ sfx(200,0.1,'sawtooth',0.045); setTimeout(()=>sfx(140,0.14,'sawtooth',0.04),80); }
function sfxDice(){ sfx(880,0.03,'square',0.025); }
function sfxHit(){ sfx(160,0.12,'sawtooth',0.06); setTimeout(()=>sfx(90,0.16,'sawtooth',0.05),70); }

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg, ms=2200){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('on'), ms);
}

/* ---------- 骰子 ---------- */
function rollDice(boons=0, banes=0){
  const nb = Math.max(0, boons-banes);
  const nn = Math.max(0, banes-boons);
  const n = 3 + nb + nn;
  const all = [];
  for(let i=0;i<n;i++) all.push(rnd(6));
  all.sort((a,b)=>a-b);
  let kept;
  if(nb>0) kept = all.slice(-3);
  else kept = all.slice(0,3);   // 減益取最低三顆；無修正也取全部
  const sum = kept.reduce((a,b)=>a+b,0);
  const triple = kept[0]===kept[1] && kept[1]===kept[2];
  return {all, kept, sum, triple, boons:boons, banes:banes};
}

/* ---------- 特性資料 ---------- */
const TRAITS = {
  armored:{n:'裝甲化',d:'承受傷害後依體型擲 D3 減傷（輕1／中2／重3 顆取最高）。機甲免費獲得。'},
  amphibious:{n:'兩棲',d:'忽略深水困難地形。',sys:true},
  animalSenses:{n:'動物感官',d:'DET +1。（限步兵、怪獸、超級變種人）'},
  antiInfantry:{n:'反步兵',d:'對 10" 內敵方步兵成功攻擊時，攻擊 +2、傷害 +1。（限機甲與載具）',sys:true},
  assaultSpec:{n:'突擊專家',d:'集團突擊成功時傷害 +2。（限步兵）'},
  boostedMove:{n:'強化移動',d:'機甲／載具移動 +3"；步兵移動 +1" 且在強行軍上獲得增益。',sys:true},
  burrowing:{n:'掘地',d:'可在地下移動；掘地期間 DEF +2；露面時近戰 +1。'},
  closeAssault:{n:'近戰突擊套件',d:'對載具近戰 +1、對步兵 +2。（限機甲）',sys:true},
  dropCapable:{n:'空投能力',d:'額外部署 6"，最後部署。'},
  ecm:{n:'電子對抗',d:'5" 內友軍對機甲／載具遠程攻擊的 DEF +1。',sys:true},
  energyWeapons:{n:'能量武器',d:'可使用過載（Overload）機動。',sys:true},
  flamer:{n:'火焰噴射器',d:'射程 10"；命中的單位每回合結束受 1 點持續傷害。',sys:true},
  flight:{n:'飛行',d:'忽略一切地形。佔用 2 個特性。',sys:true,cost:2},
  gaussWeapons:{n:'電磁武器',d:'超過 15" 的遠程攻擊 +1。（限機甲與載具）',sys:true},
  green:{n:'新兵',d:'QUL 由 +1 降為 +0，可額外選擇一個特性。'},
  hauler:{n:'運輸車',d:'搬運廢鐵無懲罰，運載 +1。（限載具）'},
  hover:{n:'懸浮',d:'移動 +2"，忽略困難地形。（限載具）',sys:true},
  ifv:{n:'步兵戰車',d:'可選取裝甲化特性。（限載具）'},
  jumpJets:{n:'跳躍噴射器',d:'獲得飛行 5"。',sys:true},
  kaijuHunter:{n:'怪獸獵手',d:'對抗怪獸時將 QUL 加到遠程攻擊與傷害。（限步兵）'},
  majorHero:{n:'主要英雄',d:'抵抗壓制、廢鐵檢定、交易站交易 QUL +1。每部隊限一個。'},
  medic:{n:'醫療兵',d:'每場戰鬥一次，特殊動作 11+ QUL 治療 1+成果值 DC。（限步兵）'},
  microMissiles:{n:'微型飛彈',d:'可一次瞄準多個單位；可間接射擊。',sys:true},
  movement:{n:'移動系統',d:'兩格。第一格移動減半；第二格癱瘓。',sys:true},
  powerArmor:{n:'動力裝甲',d:'DEF +1、MATT +1、傷害豁免 1D3。佔用 2 個特性。（限步兵）',cost:2},
  riflemen:{n:'步槍兵',d:'遠程攻擊 +1。（限步兵）'},
  rte:{n:'崎嶇地形強化',d:'忽略困難地形。（限機甲）',sys:true},
  scout:{n:'偵察',d:'戰鬥前偵察與尋找廢鐵的 DET 檢定獲得增益。（限步兵）'},
  scrapper:{n:'拾荒者',d:'廢鐵特殊動作與破壞障礙的 QUL 檢定獲得增益。（限步兵）'},
  sensorArray:{n:'感測器陣列',d:'DET +1。',sys:true},
  shortRanged:{n:'短程專精',d:'超過 10" 視為超出射程；5" 內 RATT +2、傷害 +2。（限步兵）'},
  spotter:{n:'觀察員',d:'可為微型飛彈單位提供間接射擊指引。',sys:true},
  skirmisher:{n:'散兵',d:'近戰攻擊與傷害 +1。（限步兵）'},
  tankHunter:{n:'坦克獵手',d:'對抗機甲與載具時將 QUL 加到遠程攻擊與傷害。（限步兵）'},
  tough:{n:'堅韌',d:'額外 DC：輕 +2／中 +4／重 +6。'},
  transport:{n:'運輸',d:'可運載步兵。每級 1 支。',sys:true},
  veteran:{n:'老兵',d:'QUL +1。可多次選取。'},
  ace:{n:'王牌',d:'精銳駕駛員。RATT +1、MATT +1。'},
  closeQuarter:{n:'近身格鬥者',d:'MATT +2。（限步兵）'},
  missiles:{n:'飛彈',d:'武器系統。RATT +1。',sys:true},
};

/* ---------- 原型 ---------- */
const ARCHETYPES = {
  mech:{ zh:'機甲', dc:{light:20,medium:25,heavy:30}, move:{light:7,medium:6,heavy:5},
    MATT:3,RATT:3,DEF:3,DET:1,QUL:1, DB:{light:3,medium:4,heavy:5}, freeTrait:'armored' },
  vehicle:{ zh:'載具', dc:{light:15,medium:20,heavy:25}, move:{light:7,medium:6,heavy:5},
    MATT:0,RATT:2,DEF:2,DET:1,QUL:1, DB:{light:2,medium:3,heavy:4} },
  infantry:{ zh:'步兵', dc:{light:10,medium:15,heavy:20}, move:{light:3,medium:3,heavy:3},
    MATT:1,RATT:1,DEF:1,DET:1,QUL:1, DB:{light:1,medium:1,heavy:1} },
  kaiju:{ zh:'怪獸', dc:{light:20,medium:25,heavy:30}, move:{light:6,medium:6,heavy:6},

/* =========================================================
   部隊建立
   ========================================================= */
function buildStats(archetype, size, traits){
  const A = ARCHETYPES[archetype];
  const s = {
    MATT:A.MATT, RATT:A.RATT, DEF:A.DEF, DET:A.DET, QUL:A.QUL,
    DB:A.DB[size], move:A.move[size]
  };
  let extraDC = 0, armorDice = 0;
  const tset = traits||[];
  if(tset.includes('armored')){
    armorDice = {light:1,medium:2,heavy:3}[size];
  }
  for(const t of tset){
    switch(t){
      case 'animalSenses': case 'sensorArray': s.DET+=1; break;
      case 'boostedMove': s.move += (archetype==='infantry'?1:3); break;
      case 'hover': s.move += 2; break;
      case 'riflemen': s.RATT+=1; break;
      case 'skirmisher': s.MATT+=1; s.DB+=1; break;
      case 'closeQuarter': s.MATT+=2; break;
      case 'powerArmor': s.DEF+=1; s.MATT+=1; if(!armorDice) armorDice=1; break;
      case 'veteran': s.QUL+=1; break;
      case 'tough': extraDC += {light:2,medium:4,heavy:6}[size]; break;
      case 'green': s.QUL-=1; break;
      case 'ace': s.RATT+=1; s.MATT+=1; break;
      case 'missiles': s.RATT+=1; break;
      case 'closeAssault': s.MATT+=1; break;
    }
  }
  return {stats:s, extraDC, armorDice};
}

function makePlayerUnit(kind, size, name, traits){
  const A = ARCHETYPES[kind];
  const base = buildStats(kind, size, traits);
  const dcMax = A.dc[size] + base.extraDC;
  return {
    id:'p'+Math.random().toString(36).slice(2,9),
    name:name||randomName(),
    kind, size,
    stats:base.stats,
    dcMax, dc:dcMax,
    armorDice:base.armorDice,
    traits:traits.slice(),
    systems: buildSystems(traits),
    tier:0,
    status:'ok',     // ok / miss（缺席下一場）
    growth:0,
  };
}
function buildSystems(traits){
  const sys = [];
  for(const t of traits){
    if(TRAITS[t] && TRAITS[t].sys) sys.push({key:t, name:TRAITS[t].n, boxes:[false,false]});
  }
  // 機甲與載具必有移動系統
  return sys;
}

function newCrew(){
  const names = [];
  const used = new Set();
  const nm = ()=>{ let n; let guard=0; do{ n=randomName(); guard++; }while(used.has(n)&&guard<40); used.add(n); return n; };

  const units = [];
  // 機甲（中型，裝甲化免費 + 4 特性）
  const mechTraits = ['armored','veteran','sensorArray','energyWeapons','rte'];
  units.push(makePlayerUnit('mech','medium',nm(),mechTraits));
  // 廢鐵小隊（拾荒者免費 + 4）
  units.push(makePlayerUnit('infantry','medium',nm(),['scrapper','boostedMove','skirmisher','tough']));
  // 保安小隊（步槍兵免費 + 4）
  units.push(makePlayerUnit('infantry','medium',nm(),['riflemen','tough','veteran','sensorArray']));
  // 偵察小隊（偵察免費 + 4）
  units.push(makePlayerUnit('infantry','medium',nm(),['scout','boostedMove','animalSenses','skirmisher']));
  // 支援載具（運輸車免費 + 4）
  units.push(makePlayerUnit('vehicle','medium',nm(),['hauler','armored','ifv','tough']));
  // 備用機甲（輕型）
  const backup = makePlayerUnit('mech','light',nm()+'（備用）',['armored','veteran','sensorArray','jumpJets']);
  backup.status = 'reserve';
  units.push(backup);

  return units;
}

function diceHTML(roll, tn, total, success){
  const keptSet = new Set(roll.kept);
  let idx = 0;
  const dice = roll.all.map((v,i)=>{
    const isKept = roll.kept.includes(v) && (roll.kept.filter(x=>x===v).length >= roll.all.slice(0,i+1).filter(x=>x===v).length);
    return `<div class="die ${isKept?'kept':'dropped'}" style="animation-delay:${i*0.05}s">${v}</div>`;
  }).join('');
  return `<div class="dice-result">${dice}</div>
    <div class="center small ${success?'green':'red'}">
      總值 <b>${total}</b> 對抗 <b>${tn}+</b> → ${success?'✅ 成功':'❌ 失敗'}
      ${roll.triple && success ? '　<span class="amber">🎲 三同號 +1</span>':''}
    </div>`;
}

/* =========================================================
   事件綁定
   ========================================================= */
let boundHandler = null;
function bindGlobal(){
  const app = $('#app');
  if(boundHandler) app.removeEventListener('click', boundHandler);
  boundHandler = (ev)=>{
    const el = ev.target.closest('[data-act]');
    if(el && !el.disabled){ handleAction(el.dataset.act, el.dataset); }
  };
  app.addEventListener('click', boundHandler);

  const nb = $('#navbar');
  if(!nb.dataset.bound){
    nb.dataset.bound = '1';
    nb.addEventListener('click', ev=>{
      const b = ev.target.closest('[data-nav]');
      if(!b || b.disabled) return;
      sfxClick();
      const a = b.dataset.nav;
      if(a==='help') showHelp();
      else if(a==='save') saveGame();
      else if(a==='load') loadGame();
      else if(a==='history') showHistory();
      else if(a==='sound'){ soundOn = !soundOn; renderNavbar(); toast(soundOn?'🔊 音效開啟':'🔇 音效關閉'); }
    });
  }
}

function handleAction(act, ds){
  sfxClick();
  const c = state.campaign;
  switch(act){
    /* --- 標題 --- */
    case 'newGame': startNewGame(); break;
    case 'loadGame': loadGame(); break;
    case 'showHelp': showHelp(); break;

    /* --- 偵察 --- */
    case 'doRecon': doRecon(); break;
    case 'goRaid': state.step='raid'; render(); break;

    /* --- 突襲 --- */
    case 'genEnemies': generateEnemies(); break;
    case 'startBattle': startBattle(); break;

    /* --- 餘波 --- */
    case 'doFallout': doFallout(); break;
    case 'nextRepair': beginRepair(); break;

    /* --- 維修 --- */
    case 'repairUnit': repairUnitDC(ds.uid); break;
    case 'repairSys': repairUnitSys(ds.uid); break;
    case 'buildMedBay': buildBase('medicalBay',10); break;
    case 'improveRepairBay': buildBase('repairBay',10); break;
    case 'buildRecRoom': buildBase('recRoom',8); break;
    case 'nextTrading': state.step='trading'; render(); break;

    /* --- 交易站 --- */
    case 'tpReplaceInf': tpReplaceInfantry(); break;
    case 'tpReplaceVeh': tpReplaceVehicle(); break;
    case 'tpIntel': tpIntel(); break;
    case 'tpOddJob': tpOddJob(); break;
    case 'tpKaiju': tpKaijuMarket(); break;
    case 'tpSellSalvage': tpSellSalvage(); break;
    case 'tpBuySystem': tpBuySystem(); break;
    case 'nextDebts': state.step='debts'; render(); break;

    /* --- 債務 --- */
    case 'payDebt1': payDebt(1); break;
    case 'payDebt3': payDebt(3); break;
    case 'payDebtAll': payDebt(c.debt); break;
    case 'payUpkeep': payUpkeep(); break;
    case 'endRound': endRound(); break;

    /* --- 戰鬥 --- */
    case 'battleMove': battleClickCell(parseInt(ds.x), parseInt(ds.y)); break;
    case 'battleAttack': enterAttackMode(); break;
    case 'battleAttackTarget': doPlayerAttack(ds.uid); break;
    case 'battleScavenge': doScavenge(); break;
    case 'battleEndTurn': endPlayerTurn(); break;
    case 'battleNext': battleNextActivation(); break;
    case 'battleRollInit': rollInitiative(); break;
    case 'battleContinue': continueBattle(); break;
    case 'battleFinish': finishBattle(); break;

    /* --- 其他 --- */
    case 'closeModal': closeModal(); break;
    case 'startTutorial': closeModal(); state.tutorialSeen=true; startCampaign(); break;
    case 'restart': state = defaultState(); render(); break;
  }
}

/* =========================================================
   新遊戲 / 教學
   ========================================================= */
function startNewGame(){
  state = defaultState();
  if(!state.tutorialSeen){ showHelp(true); return; }
  startCampaign();
}

function startCampaign(){
  state = state || defaultState();
  state.screen='campaign';
  state.step='recon';
  const c = state.campaign;
  c.units = newCrew();
  c.round = 1;
  c.uwa = 0;
  c.debt = 0;
  c.creditor = pick(CREDITORS);
  c.luck = rnd(3);
  c.goal = 20;
  c.history = [];
  c.achievements = [];
  c.localeName=''; c.localeSub=''; c.scrapTotal=0; c.reconDone=false; c.enemiesReady=false;
  c.enemies=[]; c.battleResult=null; c.ooUnits=[];
  c.tradingUsed=[];
  addHistory('🚩 戰役開始。團隊在荒原中集結。');
  render();
  setTimeout(()=>toast('💰 起始運氣：'+c.luck+' 點'), 300);
}

function addHistory(txt){
  state.campaign.history.push(txt);
  if(state.campaign.history.length>200) state.campaign.history.shift();
}

/* =========================================================
   步驟 1 執行：偵察
   ========================================================= */
function doRecon(){
  const c = state.campaign;
  const d1 = rnd(6);
  const loc = LOCALES.find(l=>l.r===d1) || LOCALES[0];
  const d2 = rnd(6);
  const subIdx = d2<=2?0:d2<=4?1:2;
  c.localeName = loc.name;
  c.localeSub = loc.subs[subIdx];

  // 偵察單位 13+ QUL
  const scoutUnit = c.units.find(u=>u.kind==='infantry' && u.traits.includes('scout') && u.status==='ok')
                 || c.units.find(u=>u.kind==='infantry' && u.status==='ok');
  let boons = 0;
  if(scoutUnit && scoutUnit.traits.includes('scout')) boons = 1;
  if(c.intelBonus) boons += 1;

  const roll = rollDice(boons, 0);
  const total = roll.sum + (scoutUnit?scoutUnit.stats.QUL:0);
  const success = total >= 13;
  if(success && roll.triple) {}

  c.reconOk = success;
  c.scrapTotal = success ? 5 : (rnd(3)+1);
  c.reconDone = true;
  c.intelBonus = false;

  addHistory(`📍 ${c.localeName}—${c.localeSub}：偵察${success?'成功':'失敗'}，廢鐵標記 ${c.scrapTotal} 個。`);

  showModal(`
    <h2>📍 地點偵察</h2>
    <p class="small dim">擲 1D6 決定地點：<b>${d1}</b> → ${loc.name}；再擲 1D6：<b>${d2}</b> → ${loc.subs[subIdx]}</p>
    <hr>
    <p class="small">偵察單位 <b class="amber">${scoutUnit?esc(scoutUnit.name):'（無）'}</b> 進行 13+ 素質檢定${boons?'（增益 +'+boons+'）':''}：</p>
    ${diceHTML(roll, 13, total, success)}
    <hr>
    <p class="small">可搜尋的廢鐵標記：<b class="amber">${c.scrapTotal}</b> 個</p>
    <div class="btnrow"><button class="primary" data-act="closeModal" style="flex:1">繼續</button></div>
  `, ()=>{ render(); });
  sfxOk();
}

/* =========================================================
   步驟 2：生成敵軍
   ========================================================= */
function generateEnemies(){
  const c = state.campaign;
  c.enemies = [];
  c.enemiesReady = true;

  // 偵察危險：DET 13+
  const scoutUnit = c.units.find(u=>u.kind==='infantry'&&u.traits.includes('scout')&&u.status==='ok')
                 || c.units.find(u=>u.kind==='infantry'&&u.status==='ok');
  let boons = scoutUnit && scoutUnit.traits.includes('scout') ? 1 : 0;
  const r = rollDice(boons,0);
  const tot = r.sum + (scoutUnit?scoutUnit.stats.DET:0);
  const ok = tot>=13;
  c.reconAdjust = ok ? 1 + Math.max(0, tot-13) : 0;

  // 敵軍領袖
  const t1 = rnd(6), t2 = rnd(6);
  let leaderKind;
  if(t1<=2) leaderKind='mech';
  else if(t1<=4) leaderKind='kaiju';
  else leaderKind='supermutant';
  let leaderSize;
  if(t2<=1) leaderSize='heavy';
  else if(t2<=4) leaderSize='medium';
  else leaderSize='light';

  const leader = makeGCUnit(leaderKind, leaderSize, null, 'leader');
  leader.tier = rnd(3);
  applyTier(leader);
  c.enemies.push(leader);

  // 部下數量
  const count = rnd(3)+2;
  let mechUsed = leaderKind==='mech';
  const roles = ['fighter','shooter','specialist'];
  for(let i=0;i<count;i++){
    let d = rnd(6);
    let kind,size,role;
    if(d===1){
      if(mechUsed){ kind='vehicle'; } else { kind='mech'; mechUsed=true; }
    } else if(d===2){
      kind = Math.random()<0.5?'kaiju':'supermutant';
    } else if(d<=4){
      kind='vehicle';
    } else {
      kind='infantry';
    }
    // 體型
    const s = rnd(6);
    size = s<=1?'heavy':s<=4?'medium':'light';
    // 角色
    if(kind==='vehicle') role='shooter';
    else if(kind==='infantry') role = Math.random()<0.5?'shooter':'fighter';
    else role = pick(roles);
    const u = makeGCUnit(kind,size,null,role);
    applyTier(u);
    c.enemies.push(u);
  }

  // 應用地點偵察的降級調整（把一個敵人降一級體型）
  let adj = c.reconAdjust;
  while(adj>0){
    const cand = c.enemies.filter(e=>e.size!=='light');
    if(!cand.length) break;
    const t = pick(cand);
    t.size = t.size==='heavy'?'medium':'light';
    rebuildGCStats(t);
    adj--;
  }

  // 廢鐵標記超過 3 個 → 額外 Tier 成長
  const extraTier = Math.max(0, c.scrapTotal - 3);
  for(let i=0;i<extraTier;i++){
    pick(c.enemies).tier++;
  }
  c.enemies.forEach(e=>{ rebuildGCStats(e); });

  addHistory(`⚔️ 遭遇 ${c.enemies.length} 個敵人（領袖：${c.enemies[0].name}）。`);
  render();
  toast('敵軍已生成');
}

function makeGCUnit(kind, size, name, role){
  const A = ARCHETYPES[kind];
  const traits = [];
  if(A.freeTrait) traits.push(A.freeTrait);
  const u = {
    uid:'g'+Math.random().toString(36).slice(2,9),
    side:'gc',
    kind, size, role,
    name: name || randomName(),
    tier: 0,
    traits,
    stats:{},
    dcMax:0, dc:0,
    armorDice:0,
    x:0, y:0, moveUsed:0, acted:false, alive:true,
    hasX:false, carries:0, move:0,
  };
  rebuildGCStats(u);
  return u;
}
function rebuildGCStats(u){
  const A = ARCHETYPES[u.kind];
  const base = buildStats(u.kind, u.size, u.traits);
  u.stats = Object.assign({}, base.stats);
  u.armorDice = base.armorDice;
  u.dcMax = A.dc[u.size] + base.extraDC;
  u.dc = u.dcMax;
  u.move = base.stats.move;
}
function applyTier(u){
  // tier 提升：所有 TN +1 = 屬性 +1（分配到主要屬性）
  u.tier = u.tier||0;
}

/* =========================================================
   戰鬥：初始化
   ========================================================= */
const GRID = 10;
const CELL_INCH = 2;

function startBattle(){
  const c = state.campaign;
  const units = [];

  // 玩家單位（排除備用/缺席）
  const players = c.units.filter(u=>u.status==='ok');
  players.forEach((u,i)=>{
    const pu = {
      uid:u.id, side:'player', kind:u.kind, size:u.size, name:u.name,
      stats:Object.assign({},u.stats), dc:u.dc, dcMax:u.dcMax,
      armorDice:u.armorDice, traits:u.traits.slice(),
      x: 1 + i*2, y: GRID-1,
      moveLeft: Math.round(u.stats.move/CELL_INCH), moved:false, acted:false,
      alive:true, hasX:false, carries:0, srcRef:u, role:'player',
      systems:u.systems.map(s=>({key:s.key,name:s.name,boxes:s.boxes.slice()})),
    };
    units.push(pu);
  });

  // GC 單位
  c.enemies.forEach((e,i)=>{
    const gu = {
      uid:e.uid, side:'gc', kind:e.kind, size:e.size, name:e.name, role:e.role,
      stats:Object.assign({},e.stats), dc:e.dcMax, dcMax:e.dcMax,
      armorDice:e.armorDice, traits:e.traits.slice(), tier:e.tier,
      x: 1 + (i%5)*2, y: Math.floor(i/5),
      moveLeft: Math.round(e.move/CELL_INCH), moved:false, acted:false,
      alive:true, hasX:false, carries:0, srcRef:e,
    };
    units.push(gu);
  });

  // 廢鐵標記
  const scrap = [];
  const used = new Set();
  for(let i=0;i<c.scrapTotal;i++){
    let x,y,guard=0;
    do{
      x = rnd(GRID-2); y = 2 + rnd(GRID-6);
      guard++;
    }while(used.has(x+','+y) && guard<200);
    used.add(x+','+y);
    scrap.push({x,y,taken:false});
  }

  state.battle = {
    round:1, maxRounds:5,
    units, scrap,
    terrain: scrap.map(s=>({x:s.x,y:s.y})),
    order:[], orderIdx:0,
    activeUid:null,
    phase:'initiative',   // initiative | activation | ended
    awaiting:'rollInit',  // rollInit | playerAction | attackTarget | none
    log:[],
    loot:0,
    disaster:null,
    ended:false,
  };
  state.screen = 'battle';
  render();
  toast('⚔️ 戰鬥開始！');
}

function battleLog(txt){
  const b = state.battle;
  if(!b) return;
  b.log.push(txt);
  if(b.log.length>60) b.log.shift();
}

/* ---------- 先攻 ---------- */
function rollInitiative(){
  const b = state.battle;
  const alive = b.units.filter(u=>u.alive);
  // 收集 GC 用 X 因素
  const gcs = alive.filter(u=>u.side==='gc');
  gcs.forEach(g=>g.hasX=false);
  if(gcs.length){
    pick(gcs).hasX = true;
  }
  // 洗牌分配編號
  const nums = alive.map((_,i)=>i+1);
  for(let i=nums.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [nums[i],nums[j]]=[nums[j],nums[i]]; }
  alive.forEach((u,i)=>{ u.initNum = nums[i]; });
  b.order = alive.slice().sort((a,c)=>a.initNum-c.initNum).map(u=>u.uid);
  b.orderIdx = 0;
  b.phase='activation';
  b.awaiting='none';
  battleLog(`— 第 ${b.round} 輪先攻 —`);
  alive.forEach(u=>{
    battleLog(`　${u.initNum}. ${u.name}${u.hasX?' 【X 因素】':''}`);
  });
  render();
  setTimeout(()=>nextActivation(), 350);
}

function nextActivation(){
  const b = state.battle;
  if(!b || b.ended) return;
  // 找出下一個存活單位
  while(b.orderIdx < b.order.length){
    const uid = b.order[b.orderIdx];
    const u = b.units.find(x=>x.uid===uid);
    if(u && u.alive) break;
    b.orderIdx++;
  }
  if(b.orderIdx >= b.order.length){
    // 回合結束
    endBattleRound();
    return;
  }
  const uid = b.order[b.orderIdx];
  const u = b.units.find(x=>x.uid===uid);
  b.activeUid = uid;
  u.moved = false;
  u.acted = false;
  u.moveLeft = Math.round(u.stats.move/CELL_INCH);
  if(u.hasX) u.moveLeft += Math.round(3);   // X 因素：額外動作（簡化為額外移動+額外行動）
  b.phase='activation';

  if(u.side==='player'){
    b.awaiting='playerAction';
    render();
  } else {
    b.awaiting='none';
    render();
    setTimeout(()=>gcActivate(u), 420);
  }
}

function endBattleRound(){
  const b = state.battle;
  // 結束效果：火焰持續傷害
  b.units.filter(u=>u.alive && u.burning).forEach(u=>{
    u.dc -= 1;
    battleLog(`🔥 ${u.name} 受到 1 點火焰持續傷害。`);
    if(u.dc<=0) killUnit(u);
  });

  b.round++;
  if(b.round > b.maxRounds){
    endBattle('輪數耗盡');
    return;
  }
  if(b.round === b.maxRounds){
    // 第 5 輪開始：災難
    const dr = rnd(6);
    const dis = DISASTERS.find(d=>d.r===dr);
    b.disaster = dis;
    battleLog(`☄️ 環境災難：${dis.name} — ${dis.fx}`);
    const dmg = dr<=2 ? 2 : dr<=4 ? 4 : 6;
    b.units.filter(u=>u.alive).forEach(u=>{
      u.dc -= dmg;
      if(u.dc<=0) killUnit(u);
    });
    showModal(`
      <h2>☄️ 即將來臨的災難</h2>
      <p class="small">第 ${b.round} 輪開始，擲 1D6：<b>${dr}</b></p>
      <h4>${dis.name}</h4>
      <p class="small">${dis.fx}</p>
      <p class="small amber">所有單位受到 ${dmg} 點無法豁免傷害。</p>
      <div class="btnrow"><button class="primary" data-act="closeModal" style="flex:1">繼續戰鬥</button></div>
    `, ()=>{ b.phase='initiative'; b.awaiting='rollInit'; render(); });
    render();
    return;
  }
  b.phase='initiative';
  b.awaiting='rollInit';
  render();
}

/* ---------- 玩家回合操作 ---------- */
function battleClickCell(x,y){
  const b = state.battle;
  if(!b || b.awaiting!=='playerAction') return;
  const u = b.units.find(u=>u.uid===b.activeUid);
  if(!u || !u.alive) return;
  if(u.acted) { toast('此單位本回合已行動完畢'); return; }
  const dist = Math.max(Math.abs(u.x-x), Math.abs(u.y-y));
  if(dist > u.moveLeft){ toast('移動力不足'); return; }
  const occupied = b.units.find(o=>o.alive && o.x===x && o.y===y);
  if(occupied){ toast('該格已有單位'); return; }
  u.x = x; u.y = y;
  u.moveLeft -= dist;
  sfx(440,0.05,'triangle',0.03);
  render();
}

function enterAttackMode(){
  const b = state.battle;
  if(!b) return;
  b.awaiting='attackTarget';
  render();
}

function doPlayerAttack(targetUid){
  const b = state.battle;
  const atk = b.units.find(u=>u.uid===b.activeUid);
  const def = b.units.find(u=>u.uid===targetUid);
  if(!atk||!def||!atk.alive||!def.alive) return;

  const distCells = Math.max(Math.abs(atk.x-def.x), Math.abs(atk.y-def.y));
  const isMelee = distCells <= 1;

  // 射程檢查
  if(!isMelee){
    if(atk.traits.includes('shortRanged') && distCells*CELL_INCH > 10){
      toast('短程專精：目標超出 10" 射程'); return;
    }
  }

  // 計算攻擊屬性
  let att = isMelee ? atk.stats.MATT : atk.stats.RATT;
  let dmgBonus = atk.stats.DB;
  let boons = 0, banes = 0;
  const notes = [];

  if(isMelee){
    if(atk.traits.includes('skirmisher')){ dmgBonus+=1; notes.push('散兵 傷害+1'); }
    if(atk.traits.includes('closeAssault')){
      if(def.kind==='vehicle'){ att+=1; notes.push('近戰突擊套件 對載具+1'); }
      if(def.kind==='infantry'){ att+=2; notes.push('近戰突擊套件 對步兵+2'); }
    }
  } else {
    if(atk.traits.includes('riflemen')){ att+=1; notes.push('步槍兵 +1'); }
    if(atk.traits.includes('gaussWeapons') && distCells*CELL_INCH > 15){ att+=1; notes.push('電磁武器 遠距+1'); }
    if(atk.traits.includes('shortRanged') && distCells*CELL_INCH <= 5){ att+=2; dmgBonus+=2; notes.push('短程專精 近距+2/+2'); }
    if(atk.traits.includes('antiInfantry') && def.kind==='infantry' && distCells*CELL_INCH<=10){
      att+=2; dmgBonus+=1; notes.push('反步兵 +2/+1');
    }
    if(atk.traits.includes('tankHunter') && (def.kind==='mech'||def.kind==='vehicle')){
      att += atk.stats.QUL; dmgBonus += atk.stats.QUL; notes.push('坦克獵手 加QUL');
    }
    if(atk.traits.includes('kaijuHunter') && def.kind==='kaiju'){
      att += atk.stats.QUL; dmgBonus += atk.stats.QUL; notes.push('怪獸獵手 加QUL');
    }
  }
  if(atk.hasX){ boons+=1; notes.push('X 因素 +1'); }

  // 擲骰
  const tn = 11 + def.stats.DEF + (def.hasX?1:0);
  const roll = rollDice(boons,banes);
  let total = roll.sum + att;
  const success = total >= tn;
  if(success && roll.triple) total += 1;
  const result = total - tn;

  let dmg = 0, armSaved = 0;
  if(result >= 0){
    dmg = result + dmgBonus;
    if(def.armorDice > 0){
      let best = 0;
      for(let i=0;i<def.armorDice;i++) best = Math.max(best, rnd(3));
      armSaved = best;
      dmg = Math.max(0, dmg - best);
    }
    def.dc -= dmg;
    sfxHit();
    if(def.dc<=0){ killUnit(def); }
    else { maybeSystemDamage(def, dmg); }
  } else {
    sfxFail();
  }

  atk.acted = true;
  atk.moveLeft = 0;
  b.awaiting='none';

  battleLog(`${atk.name} ${isMelee?'近戰':'遠程'}攻擊 ${def.name}：總值 ${total} vs ${tn}+ → ${success&&result>=0?'命中':'未中'}${dmg>0?`，造成 ${dmg} 傷害${armSaved?`（裝甲減免 ${armSaved}）`:''}`:''}`);

  render();
  setTimeout(()=>{ if(!b.ended) endPlayerTurn(); }, 200);
}

function maybeSystemDamage(u, dmg){
  if(dmg>=5 && u.systems && u.systems.length){
    const s = pick(u.systems);
    if(!s.boxes[0]) { s.boxes[0]=true; battleLog(`⚙️ ${u.name} 的「${s.name}」受損（1 格）。`); }
    else if(!s.boxes[1]) { s.boxes[1]=true; battleLog(`⚙️ ${u.name} 的「${s.name}」失能！`); }
    if(dmg>=10 && u.systems.length>1){
      const s2 = pick(u.systems);
      if(!s2.boxes[0]) s2.boxes[0]=true;
      else if(!s2.boxes[1]) s2.boxes[1]=true;
    }
  }
}

function killUnit(u){
  u.alive=false; u.dc=0;
  battleLog(`💀 ${u.name} 出局！`);
  // 爆炸檢定
  if(u.kind==='mech'||u.kind==='vehicle'||u.kind==='kaiju'){
    const d = [rnd(6),rnd(6),rnd(6)];
    if(d.includes(1)){
      const radius = d.filter(x=>x!==1).reduce((a,b)=>a+b,0);
      const dmg = u.size==='light'?2:u.size==='medium'?4:6;
      battleLog(`💥 ${u.name} 爆炸！半徑 ${radius}"，傷害 ${dmg}。`);
      state.battle.units.filter(o=>o.alive && o!==u).forEach(o=>{
        const dist = Math.max(Math.abs(o.x-u.x), Math.abs(o.y-u.y))*CELL_INCH;
        if(dist<=radius){
          o.dc -= dmg;
          battleLog(`　${o.name} 受到 ${dmg} 點爆炸傷害。`);
          if(o.dc<=0) killUnit(o);
        }
      });
    }
  }
  // 廢鐵掉落
  if(u.carries>0){
    state.battle.loot = Math.max(0, state.battle.loot - u.carries);
    u.carries = 0;
    battleLog(`　${u.name} 攜帶的廢鐵標記散落。`);
  }
  // 檢查勝負
  checkBattleEnd();
}

function doScavenge(){
  const b = state.battle;
  const u = b.units.find(x=>x.uid===b.activeUid);
  if(!u || u.acted) return;
  const near = b.scrap.find(s=>!s.taken && Math.max(Math.abs(s.x-u.x),Math.abs(s.y-u.y))<=1);
  if(!near){ toast('附近沒有廢鐵標記'); return; }
  let boons = 0;
  if(u.traits.includes('scrapper')) boons+=1;
  const tn = u.kind==='mech'?14:13;
  const roll = rollDice(boons,0);
  const total = roll.sum + u.stats.QUL;
  const ok = total >= tn;
  if(ok){
    near.taken = true;
    u.carries++;
    b.loot++;
    sfxOk();
    battleLog(`⚙️ ${u.name} 成功取得廢鐵標記（總值 ${total} vs ${tn}+）。`);
  } else {
    sfxFail();
    battleLog(`⚙️ ${u.name} 取廢鐵失敗（總值 ${total} vs ${tn}+）。`);
  }
  u.acted = true;
  b.awaiting='none';
  render();
  setTimeout(()=>{ if(!b.ended) endPlayerTurn(); }, 250);
}

function endPlayerTurn(){
  const b = state.battle;
  if(!b || b.ended) return;
  const u = b.units.find(x=>x.uid===b.activeUid);
  if(u) u.acted = true;
  b.awaiting='none';
  render();
  setTimeout(()=>{
    b.orderIdx++;
    nextActivation();
  }, 300);
}

/* ---------- GC 行動（AI） ---------- */
function gcActivate(u){
  const b = state.battle;
  if(!b || b.ended || !u.alive) return;

  const players = b.units.filter(p=>p.alive && p.side==='player');
  if(!players.length){ endBattle('全軍覆沒'); return; }

  const dist = (a,c)=>Math.max(Math.abs(a.x-c.x),Math.abs(a.y-c.y));
  const nearest = players.slice().sort((a,c)=>dist(u,a)-dist(u,c))[0];

  let acted = false;

  // 專家：優先搶廢鐵
  if(u.role==='specialist'){
    const sc = b.scrap.find(s=>!s.taken);
    if(sc){
      const d = dist(u,sc);
      if(d<=1){
        sc.taken=true; u.carries++; b.loot++;
        battleLog(`⚙️ ${u.name} 搶走了廢鐵標記。`);
        acted = true;
      } else {
        moveToward(u, sc.x, sc.y);
      }
    }
  }

  if(!acted){
    const d = dist(u, nearest);
    if(d<=1){
      // 近戰攻擊
      gcAttack(u, nearest, true);
      acted = true;
    } else if(u.role==='fighter' && dist(u,nearest) <= u.moveLeft){
      moveToward(u, nearest.x, nearest.y);
      if(dist(u,nearest)<=1){
        gcAttack(u, nearest, true);
      }
      acted = true;
    } else {
      // 射手：有視線就射
      const ranged = (u.role==='shooter'||u.role==='leader'||u.kind==='mech'||u.kind==='vehicle'||u.kind==='kaiju');
      const anyInRange = players.some(p=>dist(u,p) <= 6);
      if(ranged && anyInRange){
        const tgt = players.slice().sort((a,c)=>dist(u,a)-dist(u,c))[0];
        gcAttack(u, tgt, false);
        acted = true;
      } else {
        moveToward(u, nearest.x, nearest.y);
        if(dist(u,nearest)<=1) gcAttack(u, nearest, true);
        acted = true;
      }
    }
  }

  u.acted = true;
  render();
  setTimeout(()=>{
    b.orderIdx++;
    nextActivation();
  }, 480);
}

function moveToward(u, tx, ty){
  const steps = u.moveLeft;
  for(let i=0;i<steps;i++){
    const dx = Math.sign(tx-u.x);
    const dy = Math.sign(ty-u.y);
    if(dx===0 && dy===0) break;
    const nx = u.x+dx, ny = u.y+dy;
    if(nx<0||nx>=GRID||ny<0||ny>=GRID) break;
    const occ = state.battle.units.find(o=>o.alive && o!==u && o.x===nx && o.y===ny);
    if(occ) break;
    u.x=nx; u.y=ny;
    if(u.x===tx && u.y===ty) break;
  }
  u.moveLeft = 0;
}

function gcAttack(atk, def, isMelee){
  const b = state.battle;
  let att = isMelee ? atk.stats.MATT : atk.stats.RATT;
  let db = atk.stats.DB;
  const boons = atk.hasX ? 1 : 0;
  const tn = 11 + def.stats.DEF;

  const roll = rollDice(boons, 0);
  let total = roll.sum + att;
  const success = total >= tn;
  if(success && roll.triple) total += 1;
  const result = total - tn;

  let dmg = 0, saved = 0;
  if(result >= 0){
    dmg = result + db;
    if(def.armorDice>0){
      let best=0;
      for(let i=0;i<def.armorDice;i++) best = Math.max(best, rnd(3));
      saved = best;
      dmg = Math.max(0, dmg - best);
    }
    def.dc -= dmg;
    sfxHit();
    battleLog(`⚔️ ${atk.name} 攻擊 ${def.name}：總值 ${total} vs ${tn}+ → 命中，造成 ${dmg} 傷害${saved?`（裝甲減免 ${saved}）`:''}`);
    if(def.dc<=0) killUnit(def);
  } else {
    sfxFail();
    battleLog(`⚔️ ${atk.name} 攻擊 ${def.name}：總值 ${total} vs ${tn}+ → 未中`);
  }
}

/* ---------- 戰鬥結束 ---------- */
function checkBattleEnd(){
  const b = state.battle;
  if(!b || b.ended) return;
  const playersAlive = b.units.some(u=>u.alive && u.side==='player');
  const gcsAlive = b.units.some(u=>u.alive && u.side==='gc');
  if(!playersAlive){ endBattle('全軍覆沒'); return; }
  if(!gcsAlive){ endBattle('敵人全滅'); return; }
}

function endBattle(reason){
  const b = state.battle;
  if(!b || b.ended) return;
  b.ended = true;
  b.phase='ended';
  b.awaiting='none';
  b.endReason = reason;
  battleLog(`— 戰鬥結束：${reason} —`);
  render();
}

function continueBattle(){
  const b = state.battle;
  b.orderIdx++;
  nextActivation();
}

function finishBattle(){
  const b = state.battle;
  const c = state.campaign;

  // 收集結果
  const players = b.units.filter(u=>u.side==='player');
  const ooa = players.filter(u=>!u.alive).map(u=>u.uid);
  const loot = b.loot;

  // 回寫玩家單位狀態
  players.forEach(p=>{
    const src = c.units.find(x=>x.id===p.uid);
    if(src){
      src.dc = Math.max(0, p.dc);
      if(p.systems) src.systems = p.systems.map(s=>({key:s.key,name:s.name,boxes:s.boxes.slice()}));
    }
  });

  c.battleResult = {
    ooa, loot, reason:b.endReason||'結束',
  };
  c.ooUnits = ooa;
  c.lootedScrap = loot;

  // 恢復敵軍清單為新的（重建）
  state.battle = null;
  state.screen='campaign';
  state.step='fallout';
  addHistory(`⚔️ 戰鬥結束（${c.battleResult.reason}）：取得 ${loot} 個廢鐵標記，${ooa.length} 個單位出局。`);
  render();
}

/* =========================================================
   戰鬥畫面
   ========================================================= */
function viewBattle(){
  const b = state.battle;
  if(!b) return '<div class="panel">戰鬥資料遺失</div>';

  const active = b.units.find(u=>u.uid===b.activeUid && u.alive);

  let grid = '';
  for(let y=0;y<GRID;y++){
    for(let x=0;x<GRID;x++){
      const u = b.units.find(o=>o.alive && o.x===x && o.y===y);
      const sc = b.scrap.find(s=>!s.taken && s.x===x && s.y===y);
      const isTerrain = b.terrain.some(t=>t.x===x&&t.y===y);
      let cls = 'cell';
      if(isTerrain) cls+=' terrain';
      if(u) cls+='';
      if(active && b.awaiting==='playerAction' && !u){
        const d = Math.max(Math.abs(active.x-x),Math.abs(active.y-y));
        if(d>0 && d<=active.moveLeft && !active.acted) cls+=' reach';
      }
      if(b.awaiting==='attackTarget' && u && u.side==='gc'){
        cls+=' target';
      }
      if(active && active.x===x && active.y===y) cls+=' active';

      let inner = '';
      if(sc && !u) inner += `<div class="scrap">${iconFor('scrap','var(--amber)')}</div>`;
      if(u){
        const pct = Math.round(u.dc/u.dcMax*100);
        const col = u.side==='player' ? 'var(--amber)' : 'var(--red)';
        inner += `<div class="uicon">${iconFor(u.kind,col)}</div>`;
        inner += `<div class="dcmini"><i style="width:${pct}%;background:${pct<35?'#d0453a':pct<70?'#e8b04b':'#7ab648'}"></i></div>`;
        if(u.hasX) inner += `<div class="xmark">X</div>`;
      }

      let act = '';
      if(b.awaiting==='playerAction' && !u){
        act = `data-act="battleMove" data-x="${x}" data-y="${y}"`;
      } else if(b.awaiting==='attackTarget' && u && u.side==='gc'){
        act = `data-act="battleAttackTarget" data-uid="${u.uid}"`;
      } else if(u){
        act = `data-act="noop"`;
      }

      grid += `<div class="${cls}" ${act}>${inner}</div>`;
    }
  }

  // 操作區
  let actionPanel = '';
  if(b.phase==='initiative'){
    actionPanel = `<div class="panel center">
      <p class="small dim">第 ${b.round} 輪 — 先攻階段</p>
      <button class="primary" data-act="battleRollInit" style="width:100%">🎲 抽取先攻籌碼</button>
    </div>`;
  } else if(b.phase==='ended'){
    actionPanel = `<div class="panel center">
      <h3 class="amber">戰鬥結束</h3>
      <p class="small">${esc(b.endReason||'')}</p>
      <p class="small">取得廢鐵標記：<b class="amber">${b.loot}</b></p>
      <button class="primary" data-act="battleFinish" style="width:100%">📋 進入戰後餘波</button>
    </div>`;
  } else if(active && active.side==='player'){
    const canAct = !active.acted;
    const nearScrap = b.scrap.find(s=>!s.taken && Math.max(Math.abs(s.x-active.x),Math.abs(s.y-active.y))<=1);
    actionPanel = `<div class="panel">
      <div class="row" style="justify-content:space-between">
        <div><b class="amber">${esc(active.name)}</b> <span class="tiny dim">${SIZE_ZH[active.size]}${ARCHETYPES[active.kind].zh}</span></div>
        <div class="tiny dim">移動力 ${active.moveLeft} 格</div>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="sm ${b.awaiting==='attackTarget'?'primary':''}" data-act="battleAttack" ${canAct?'':'disabled'}>⚔️ 攻擊</button>
        <button class="sm" data-act="battleScavenge" ${canAct&&nearScrap?'':'disabled'}>⚙️ 取廢鐵</button>
        <button class="sm" data-act="battleEndTurn">⏭ 結束回合</button>
      </div>
      ${b.awaiting==='attackTarget'?'<div class="tiny amber center" style="margin-top:6px">請點選紅色目標</div>':''}
      ${b.awaiting==='playerAction'?'<div class="tiny dim center" style="margin-top:6px">點擊綠色格子移動，或直接攻擊</div>':''}
    </div>`;
  } else if(active){
    actionPanel = `<div class="panel center">
      <p class="small dim">${esc(active.name)} 正在行動…</p>
    </div>`;
  } else {
    actionPanel = `<div class="panel center">
      <button class="primary" data-act="battleNext" style="width:100%">▶ 下一個單位</button>
    </div>`;
  }

  // 單位列表
  const playerList = b.units.filter(u=>u.side==='player');
  const gcList = b.units.filter(u=>u.side==='gc');

  return `
  <div class="topbar">

function battleUnitCard(u){
  const pct = Math.round(Math.max(0,u.dc)/u.dcMax*100);
  const isActive = state.battle.activeUid===u.uid;

    <div style="width:100%;margin-top:4px">
      <div class="dcbar"><i class="${pct<35?'crit':pct<70?'warn':''}" style="width:${pct}%"></i></div>
      <div class="tiny center dim" style="margin-top:2px">${Math.max(0,u.dc)}/${u.dcMax} DC${u.carries?` · ⚙️×${u.carries}`:''}</div>
    </div>

}

/* =========================================================
   步驟 3：戰後餘波
   ========================================================= */
function doFallout(){
  const c = state.campaign;
  const log = [];
  const res = c.battleResult || {ooa:[],loot:0};

  // Part 1：倒下者的命運
  if(res.ooa && res.ooa.length){
    res.ooa.forEach(uid=>{
      const u = c.units.find(x=>x.id===uid);
      if(!u) return;
      const roll = rollDice(0,0);
      const total = roll.sum + u.stats.QUL;
      const ok = total >= 13;
      const isPair = (roll.kept[0]===roll.kept[1]||roll.kept[1]===roll.kept[2]||roll.kept[0]===roll.kept[2]);
      if(ok){
        u.status='ok';
        log.push(`✅ ${esc(u.name)} 通過命運檢定（${total} vs 13+），安然無恙。`);
      } else if(isPair){
        u.status='miss';
        u.dc = Math.max(1, Math.floor(u.dcMax*0.3));
        log.push(`⚠️ ${esc(u.name)} 檢定失敗（${total}），但擲出對子——錯過下一場戰鬥。`);
      } else {
        u.status='destroyed';
        u.dc=0;
        log.push(`💀 ${esc(u.name)} 檢定失敗（${total}），已被摧毀／死亡。`);
      }
    });
  } else {
    log.push('✅ 本場戰鬥沒有單位出局。');
  }

  // Part 2：清點戰利品
  let mc = 0;
  const loot = res.loot||0;
  for(let i=0;i<loot;i++) mc += rnd(3)+1;
  c.uwa += mc;
  log.push(`💰 回收 ${loot} 個廢鐵標記 → <b class="amber">+${mc} MC</b>（通用財富帳戶）`);

  // Part 3：成長
  const survivors = c.units.filter(u=>u.status==='ok'||u.status==='miss');
  if(survivors.length){
    const target = survivors.reduce((a,b)=> (a.growth||0)<=(b.growth||0)?a:b);
    const d = rnd(6);
    const statName = ['MATT','RATT','DEF','DET','QUL','DB'][d-1];
    target.stats[statName] = (target.stats[statName]||0)+1;
    target.growth = (target.growth||0)+1;
    log.push(`📈 ${esc(target.name)} 獲得成長：<b class="amber">${statName} +1</b>`);
  }

  // 清理被摧毀的單位
  c.units = c.units.filter(u=>u.status!=='destroyed');

  c.falloutLog = log;
  c.falloutDone = true;
  c.enemiesReady=false;
  addHistory(`🩸 戰後：回收 ${loot} 個廢鐵，獲得 ${mc} MC。`);

  render();
  showModal(`
    <h2>🩸 戰後餘波</h2>
    <div class="small" style="line-height:2">${log.join('<br>')}</div>
    <div class="btnrow" style="margin-top:12px"><button class="primary" data-act="closeModal" style="flex:1">繼續</button></div>
  `, ()=>{ render(); });
}

/* =========================================================
   步驟 4：恢復與維修
   ========================================================= */
function beginRepair(){
  const c = state.campaign;
  c.repairActionsLeft = c.units.filter(u=>u.status==='ok').length + 1; // +1 基地機械師小組
  c.repairLog = [];
  state.step='repair';
  render();
}

function repairUnitDC(uid){
  const c = state.campaign;
  if(c.repairActionsLeft<=0){ toast('本步驟已無可用動作'); return; }
  const u = c.units.find(x=>x.id===uid);
  if(!u) return;

  if(u.kind==='infantry'){
    u.dc = u.dcMax;
    c.repairActionsLeft--;
    c.repairLog.push(`${esc(u.name)} 完全恢復（步兵免擲骰）。`);
    toast(`✅ ${u.name} 恢復全部 DC`);
    sfxOk();
    render();
    return;
  }
  const roll = rollDice(0,0);
  const total = roll.sum + u.stats.QUL;
  const ok = total>=13;
  if(ok){
    const gain = 5 + Math.max(0,total-13);
    u.dc = Math.min(u.dcMax, u.dc + gain);
    c.repairLog.push(`${esc(u.name)} 恢復 ${gain} DC（總值 ${total}）。`);
    toast(`🔧 ${u.name} 恢復 ${gain} DC`);
    sfxOk();
  } else {
    c.repairLog.push(`${esc(u.name)} 維修失敗（總值 ${total} vs 13+）。`);
    toast(`❌ 維修失敗`);
    sfxFail();
  }
  c.repairActionsLeft--;
  render();
}

function repairUnitSys(uid){
  const c = state.campaign;
  if(c.repairActionsLeft<=0){ toast('本步驟已無可用動作'); return; }
  const u = c.units.find(x=>x.id===uid);
  if(!u) return;
  const roll = rollDice(0,0);
  const total = roll.sum + u.stats.QUL;
  const ok = total>=13;
  if(ok){
    let fixed = 0;
    for(const s of u.systems){
      if(s.boxes[1]){ s.boxes[1]=false; fixed++; break; }
      if(s.boxes[0]){ s.boxes[0]=false; fixed++; break; }
    }
    if(fixed) c.repairLog.push(`${esc(u.name)} 修復了 1 個系統方框。`);
    else c.repairLog.push(`${esc(u.name)} 沒有需要修復的系統。`);
    toast('🔧 系統修復成功');
    sfxOk();
  } else {
    c.repairLog.push(`${esc(u.name)} 系統維修失敗。`);
    toast('❌ 系統維修失敗');
    sfxFail();
  }
  c.repairActionsLeft--;
  render();
}

function buildBase(key, need){
  const c = state.campaign;
  if(c.repairActionsLeft<=0){ toast('本步驟已無可用動作'); return; }
  c.base[key]++;
  c.repairActionsLeft--;
  const names = {medicalBay:'醫療艙', repairBay:'維修艙', recRoom:'娛樂室'};
  if(c.base[key]>=need){
    toast(`🏗️ ${names[key]} 建造完成！`);
    c.repairLog.push(`${names[key]} 完工！`);
    sfxOk();
  } else {
    toast(`${names[key]} 進度 ${c.base[key]}/${need}`);
    sfxClick();
  }
  render();
}

/* =========================================================
   步驟 5：交易站
   ========================================================= */
function consumeTrading(){
  const c = state.campaign;
  const avail = c.units.filter(u=>u.status==='ok' && !c.tradingUsed.includes(u.id));
  if(!avail.length){ toast('沒有可造訪的單位'); return null; }
  const u = avail[0];
  c.tradingUsed.push(u.id);
  return u;
}

function tpReplaceInfantry(){
  const c = state.campaign;
  const cost = 2;
  if(c.uwa < cost){ toast(`💰 需要 ${cost} MC`); return; }
  const u = consumeTrading();
  if(!u) return;
  c.uwa -= cost;
  const nu = makePlayerUnit('infantry','medium', randomName(), ['riflemen','tough','veteran','sensorArray']);
  c.units.push(nu);
  addHistory(`🏪 雇用新的步兵單位「${nu.name}」（-${cost} MC）。`);
  toast(`✅ 新步兵單位「${nu.name}」加入`);
  sfxOk();
  render();
}

function tpReplaceVehicle(){
  const c = state.campaign;
  const cost = 4;
  if(c.uwa < cost){ toast(`💰 需要 ${cost} MC`); return; }
  const u = consumeTrading();
  if(!u) return;
  c.uwa -= cost;
  const nu = makePlayerUnit('vehicle','medium', randomName(), ['hauler','armored','ifv','tough']);

}

function tpIntel(){

  const u = consumeTrading(); if(!u) return;
  c.uwa -= 1;

}

function tpOddJob(){
  const c = state.campaign;
  const u = consumeTrading(); if(!u) return;
  const roll = rollDice(0,0);
  const total = roll.sum + u.stats.QUL;
  const ok = total >= 15;
  if(ok){
    const gain = u.kind==='mech'?3:u.kind==='vehicle'?2:1;
    c.uwa += gain;
    addHistory(`🏪 ${esc(u.name)} 打零工成功，獲得 ${gain} MC。`);
    toast(`💼 打零工成功：+${gain} MC`);
    sfxOk();
  } else {
    const dmg = Math.max(0, 15-total);
    u.dc = Math.max(1, u.dc - dmg);
    addHistory(`🏪 ${esc(u.name)} 打零工失敗，受到 ${dmg} 點損傷。`);

function tpSellSalvage(){
  const c = state.campaign;
  const u = consumeTrading(); if(!u) return;
  const roll = rollDice(0,0);
  const total = roll.sum + u.stats.QUL;
  const ok = total>=13;
  if(ok){
    const gain = rnd(3) + Math.max(0, total-13) + 2;
    c.uwa += gain;
    addHistory(`💰 出售打撈品：+${gain} MC。`);
    toast(`💰 出售打撈品：+${gain} MC`);
    sfxOk();
  } else {
    toast('❌ 找不到買家');
    sfxFail();
  }
  render();
}

function tpBuySystem(){
  const c = state.campaign;
  if(c.uwa<1){ toast('💰 需要 1 MC'); return; }
  const u = consumeTrading(); if(!u) return;
  c.uwa -= 1;
  const options = ['sensorArray','boostedMove','ecm','rte','tough','veteran','energyWeapons','jumpJets'];
  const key = pick(options);
  if(u.systems.length>=6){ toast('系統已滿（最多 6 個）'); c.uwa+=1; return; }
  u.systems.push({key, name:TRAITS[key]?TRAITS[key].n:key, boxes:[false,false]});
  if(TRAITS[key] && key==='tough'){ u.dcMax += (u.size==='light'?2:u.size==='medium'?4:6); u.dc = Math.min(u.dcMax, u.dc+4); }
  addHistory(`🔧 ${esc(u.name)} 安裝新系統「${TRAITS[key]?TRAITS[key].n:key}」。`);
  toast(`🔧 已安裝「${TRAITS[key]?TRAITS[key].n:key}」`);
  sfxOk();
  render();
}

/* =========================================================
   步驟 6：償還債務
   ========================================================= */
function payDebt(amount){
  const c = state.campaign;
  const pay = Math.min(amount, c.uwa, c.debt);
  if(pay<=0){ toast('無法償還'); return; }
  c.uwa -= pay;
  c.debt -= pay;
  addHistory(`💸 償還 ${pay} MC 債務，剩餘 ${c.debt} MC。`);
  toast(`💸 已償還 ${pay} MC`);
  sfxOk();
  render();
}

function payUpkeep(){
  const c = state.campaign;
  if(c.uwa<3){ toast('💰 需要 3 MC 才能支付全部維護費'); return; }
  c.uwa -= 3;
  c.missed = {sustenance:false, ops:false, base:false};
  addHistory('🍞 已支付本輪維護費（3 MC）。');
  toast('✅ 維護費已支付');
  sfxOk();
  render();
}

/* =========================================================
   結束一輪
   ========================================================= */
function endRound(){
  const c = state.campaign;

  // 未付維護費懲罰
  if(c.missed.sustenance){ /* 下次戰鬥第一次攻防減益 */ }
  if(c.missed.ops){ /* 放 2 個 X 因素 */ }
  if(c.missed.base){ /* 前兩次 QUL 減益 */ }

  // 債務違約
  if(c.debt>0 && !c.paidThisRound){
    c.debt += 1;
    c.debtMissStreak = (c.debtMissStreak||0)+1;
    addHistory(`📉 未償還債務，欠款增加 1 MC（現為 ${c.debt} MC）。`);
  } else if(c.debt<=0){
    c.debtMissStreak = 0;
  }

  // 目標檢查
  const totalWealth = c.uwa + c.debt;
  if(c.debt<=0 && c.uwa >= c.goal){
    c.ended=true; c.victory=true;
    state.screen='gameover';
    render();
    return;
  }

  // 下一輪
  c.round++;
  state.step='recon';
  c.localeName=''; c.localeSub=''; c.reconDone=false; c.enemiesReady=false;
  c.enemies=[]; c.battleResult=null; c.ooUnits=[];
  c.falloutDone=false; c.repairActionsLeft=0; c.repairLog=[];
  c.tradingUsed=[];
  c.paidThisRound=false;
  c.luck = c.base.recRoom>=8 ? Math.max(rnd(3),rnd(3)) : rnd(3);

  // 缺席單位恢復
  c.units.forEach(u=>{ if(u.status==='miss') u.status='ok'; });

  addHistory(`🔄 第 ${c.round} 輪開始（運氣 ${c.luck} 點）。`);
  render();
  toast(`🔄 第 ${c.round} 輪開始`);
}

/* =========================================================
   彈窗
   ========================================================= */
let modalCallback = null;
function showModal(html, cb){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal">${html}</div>`;
  root.classList.add('on');
  modalCallback = cb || null;
}
function closeModal(){
  const root = $('#modal-root');
  root.classList.remove('on');
  root.innerHTML = '';
  const cb = modalCallback; modalCallback = null;
  if(cb) cb();
}

  </p>

  <h4>🗺️ 四、操作步驟（一輪戰役的流程）</h4>
  <ol class="small">
    <li><b>地點偵察</b>：按「派出偵察單位」。系統擲 1D6 決定地點，再擲 1D6 決定子區域。
      接著你的偵察單位做 13+ 素質檢定，成功 → 場上有 5 個廢鐵標記；失敗 → 只有 1D3+1 個。</li>
    <li><b>廢鐵突襲</b>：按「生成敵軍」。系統依規則表產生敵軍領袖（2D6）與部下（1D3+2）。
      偵察檢定成功可以「降級」敵人。然後按「進入戰場」。</li>
    <li><b>戰鬥</b>：每輪先按「抽取先攻籌碼」，系統為每個單位分配 1~N 的編號，並可能給某個敵人
      <b class="amber">X 因素</b>（該敵人本輪所有目標值 +1，且多一個動作）。
      輪到你行動時：點擊<b class="green">綠色格子</b>移動，按「⚔️ 攻擊」再點擊<b class="red">紅色目標</b>，
      或按「⚙️ 取廢鐵」撿走身邊的廢鐵標記。</li>
    <li><b>戰後餘波</b>：出局的單位要進行 13+ 素質檢定決定命運（失敗但擲出對子 → 只是缺席一場）。
      每個廢鐵標記價值 1D3+1 MC，最後替一個單位提升一項屬性。</li>
    <li><b>恢復與維修</b>：每個存活單位提供 1 個動作（基地機械師再給你 1 個）。
      修 DC、修系統，或投資基地設施。</li>
    <li><b>交易站</b>：每個單位可以造訪一次。買新單位、收集情報、打零工、賣打撈品……</li>
    <li><b>償還債務</b>：還錢 + 支付 3 MC 維護費（口糧／行動補給／基地補給）。然後按「結束本輪」。</li>
  </ol>

  <h4>⚡ 五、容易漏看的特殊機制</h4>
  <ul class="small">
    <li><b>X 因素</b>：先攻階段會多出一個 X 籌碼。若它落在敵人身上，該敵人本輪所有 TN +1 且多一個動作——
      看到畫面右上角的 <b class="amber">X</b> 標記就要小心。</li>
    <li><b>裝甲化</b>：機甲和某些單位受到傷害後會擲 D3 減傷（輕型 1 顆、中型 2 顆、重型 3 顆，取最高）。</li>
    <li><b>系統損傷</b>：單次受到 5+ 傷害會隨機打掉一個系統方格；10+ 傷害則是兩個。</li>
    <li><b>爆炸</b>：機甲／載具／怪獸被摧毀時擲 3D6，只要有一顆是 1 就爆炸，波及周圍單位。</li>
    <li><b>集團突擊</b>：多打一時，每個攻擊者 MATT +1（最多 +3）。</li>
    <li><b>運氣點</b>：每輪開始時擲 1D3 獲得。任何檢定擲骰前宣告花 1 點，該次 +2。</li>
    <li><b>維護費</b>：如果付不出口糧，下場戰鬥第一次攻擊與防禦會受減益；付不出行動補給，先攻會多 2 個 X 因素。</li>
    <li><b>債務違約</b>：連續兩輪沒還錢，債主會派回收小隊——下一輪變成保衛基地戰。</li>
  </ul>

  <h4>💡 六、新手小訣竅</h4>
  <ul class="small">
    <li>不要想殲滅敵人——你的目標是<b>搶廢鐵</b>。搶到就撤，比硬拚划算。</li>
    <li>機甲是你最強的單位，但也最貴。讓步兵先去撿廢鐵，機甲負責掩護。</li>
    <li>「收集情報」只要 1 MC，卻能讓下次偵察獲得增益——非常划算。</li>
    <li>每輪一定要付清 3 MC 維護費，否則懲罰會滾雪球。</li>
    <li>如果真的周轉不過來，優先還債（避免債主上門），維護費其次。</li>
  </ul>

  <div class="btnrow" style="margin-top:18px">
    <button class="primary" data-act="${firstTime?'startTutorial':'closeModal'}" style="flex:1">
      ${firstTime?'🚀 我準備好了，開始遊戲':'✅ 關閉說明'}
    </button>
  </div>
  `;
  showModal(html);
}

/* =========================================================
   歷史紀錄
   ========================================================= */
function showHistory(){
  if(!state || state.screen==='title'){ toast('尚未開始遊戲'); return; }
  const c = state.campaign;
  const html = `
    <h2>📜 歷史紀錄</h2>
    <p class="small dim">你走過的路線。</p>
    <div class="timeline" style="max-height:60vh;overflow-y:auto;margin-top:10px">
      ${c.history.slice().reverse().map(h=>`<div class="tl-item">${h}</div>`).join('') || '<div class="dim2 small">尚無紀錄</div>'}
    </div>
    <div class="btnrow" style="margin-top:14px">
      <button class="primary" data-act="closeModal" style="flex:1">關閉</button>
    </div>`;
  showModal(html);
}

/* =========================================================
   啟動
   ========================================================= */
state = defaultState();
render();
</script>
</body>
</html>
