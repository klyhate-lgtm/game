<style>
:root{--bg:#14100d;--panel:#241c15;--panel2:#2e241b;--rust:#c66a2b;--amber:#e8b04b;--text:#e9dcc6;--dim:#a89a86;--dim2:#7a6d5c;--green:#7ab648;--red:#d0453a;--border:#4a3c2e;--border2:#6b5540}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#2a2017 0%,transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.008) 0 2px,transparent 2px 4px),var(--bg);color:var(--text);font-family:"Noto Serif TC","Songti TC",Georgia,serif;overflow:hidden;user-select:none}
#app{position:fixed;inset:0;bottom:52px;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;-webkit-overflow-scrolling:touch}
#app::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px 40px rgba(0,0,0,.85);z-index:5}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--amber);letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:6px}
h1,h2{margin:0 0 8px;font-weight:700}
.dim{color:var(--dim)}.dim2{color:var(--dim2)}
.small{font-size:12px}.tiny{font-size:11px}
.amber{color:var(--amber)}.green{color:var(--green)}.red{color:var(--red)}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}.grow{flex:1}
hr{border:0;border-top:1px solid var(--border);margin:8px 0}
button{font-family:inherit;font-size:14px;cursor:pointer;background:linear-gradient(180deg,#3d3025,#2b2118);color:var(--text);border:1px solid var(--border2);border-radius:6px;padding:9px 14px;transition:all .12s;letter-spacing:.5px;min-height:40px;box-shadow:0 2px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07)}
button:hover:not(:disabled){background:linear-gradient(180deg,#4c3b2d,#372a1f);border-color:var(--amber);color:#fff}
button:active:not(:disabled){transform:translateY(2px)}
button:disabled{opacity:.32;cursor:not-allowed;filter:grayscale(.6)}

.cell.active{box-shadow:inset 0 0 0 2px var(--amber)}

.cell .uicon{width:82%;height:82%;pointer-events:none}
.cell .dcmini{position:absolute;left:1px;right:1px;bottom:1px;height:3px;background:#000;border-radius:2px;overflow:hidden}
.cell .dcmini>i{display:block;height:100%;background:var(--green)}
.cell .xmark{position:absolute;top:-3px;right:-3px;font-size:10px;color:var(--amber);text-shadow:0 0 4px #000;font-weight:700}
.cell .initmark{position:absolute;top:-3px;left:-3px;font-size:9px;color:#9fd0ff;text-shadow:0 0 4px #000;font-weight:700}
.cell .hidemark{position:absolute;font-size:14px;color:rgba(120,180,220,.7);text-shadow:0 0 4px #000}
.cell .burnmark{position:absolute;bottom:2px;right:2px;font-size:9px}
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:12px}
#modal-root.on{display:flex}
.modal{background:linear-gradient(180deg,#2c231a,#1c1611);border:1px solid var(--border2);border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.9);animation:modalIn .22s ease-out}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h2{color:var(--amber);font-size:18px;border-bottom:1px solid var(--border);padding-bottom:8px}

.modal p,.modal li{font-size:13px;line-height:1.75;color:var(--text)}

#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:rgba(20,15,12,.96);border:1px solid var(--amber);color:var(--amber);padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;max-width:88%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.8)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dice-result{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.die{width:34px;height:34px;border-radius:6px;background:linear-gradient(180deg,#e8dcc6,#b8a88e);color:#241c15;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;border:1px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.6);animation:dieIn .28s cubic-bezier(.2,1.6,.5,1) backwards}
.die.dropped{opacity:.25;filter:grayscale(1)}
.die.kept{background:linear-gradient(180deg,#f3e6c8,#cdb894);box-shadow:0 0 10px rgba(232,176,75,.6)}
@keyframes dieIn{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.timeline{border-left:2px solid var(--border2);padding-left:12px;margin-left:6px}
.tl-item{position:relative;margin-bottom:10px;font-size:12.5px;line-height:1.55}
.tl-item::before{content:'';position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--rust);border:1px solid #000}
.fade-in{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sysbox{display:inline-block;width:9px;height:9px;border:1px solid var(--border2);border-radius:2px;margin-left:2px;vertical-align:middle;background:#1a1410}
.sysbox.on{background:var(--red);border-color:var(--red)}
@media(max-width:420px){#app{padding:8px 8px 14px}.card{width:96px}.stat-chip .val{font-size:14px}button{font-size:13px;padding:8px 11px}.modal{padding:14px}}
</style>

<script>
"use strict";
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n)+1;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 音效 ---------- */
let audioCtx=null,soundOn=true;
function sfx(freq=440,dur=0.07,type='square',vol=0.035){if(!soundOn)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.02)}catch(e){}}
const sfxClick=()=>sfx(320,0.04,'square',0.03);
const sfxOk=()=>{sfx(520,0.06,'triangle',0.05);setTimeout(()=>sfx(760,0.09,'triangle',0.05),60)};
const sfxFail=()=>{sfx(200,0.1,'sawtooth',0.045);setTimeout(()=>sfx(140,0.14,'sawtooth',0.04),80)};
const sfxHit=()=>{sfx(160,0.12,'sawtooth',0.06);setTimeout(()=>sfx(90,0.16,'sawtooth',0.05),70)};
let toastTimer=null;
function toast(msg,ms=2400){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),ms)}

/* ---------- 骰子 ---------- */
function rollDice(boons=0,banes=0){
  const nb=Math.max(0,boons-banes),nn=Math.max(0,banes-boons),n=3+nb+nn;
  const all=[];for(let i=0;i<n;i++)all.push(rnd(6));
  all.sort((a,b)=>a-b);
  let kept;
  if(nb>0&&nn===0)kept=all.slice(-3);
  else if(nn>0&&nb===0)kept=all.slice(0,3);
  else kept=all.slice(-3);
  const sum=kept.reduce((a,b)=>a+b,0);
  return{all,kept,sum,triple:kept[0]===kept[1]&&kept[1]===kept[2],boons:nb,banes:nn};
}
function diceHTML(roll,tn,total,result,success,extra){
  const kc={};roll.kept.forEach(v=>kc[v]=(kc[v]||0)+1);
  let shown=0;
  const dice=roll.all.map((v,i)=>{const k=kc[v]>0&&shown<roll.kept.length;if(k){kc[v]--;shown++}return`<div class="die ${k?'kept':'dropped'}" style="animation-delay:${i*0.05}s">${v}</div>`}).join('');
  return `<div class="dice-result">${dice}</div>
    <div class="center small ${success?'green':'red'}">總值 <b>${total}</b> 對抗 <b>${tn}+</b> → 成果值 <b>${result}</b> ${success?'✅ 成功':'❌ 失敗'}${roll.triple?'　<span class="amber">🎲 三同號</span>':''}</div>
    ${extra?`<div class="center tiny amber">${extra}</div>`:''}`;
}

/* ---------- 特性 ---------- */
const TRAITS={

  energyWeapons:{n:'能量武器',d:'可使用過載。',sys:true},

  tough:{n:'堅韌',d:'額外 DC：輕+2／中+4／重+6。'},
  transport:{n:'運輸',d:'可運載步兵。每級 1 支。',sys:true},

  closeQuarter:{n:'近身格鬥者',d:'MATT +2。'},
  missiles:{n:'飛彈',d:'武器系統。RATT +1。',sys:true},
};
const ARCHETYPES={
  mech:{zh:'機甲',dc:{light:20,medium:25,heavy:30},move:{light:7,medium:6,heavy:5},MATT:3,RATT:3,DEF:3,DET:1,QUL:1,DB:{light:3,medium:4,heavy:5},freeTrait:'armored'},
  vehicle:{zh:'載具',dc:{light:15,medium:20,heavy:25},move:{light:7,medium:6,heavy:5},MATT:0,RATT:2,DEF:2,DET:1,QUL:1,DB:{light:2,medium:3,heavy:4}},
  infantry:{zh:'步兵',dc:{light:10,medium:15,heavy:20},move:{light:3,medium:3,heavy:3},MATT:1,RATT:1,DEF:1,DET:1,QUL:1,DB:{light:1,medium:1,heavy:1}},

  supermutant:{zh:'超級變種人',dc:{light:10,medium:15,heavy:20},move:{light:3,medium:3,heavy:3},MATT:2,RATT:3,DEF:3,DET:1,QUL:1,DB:{light:2,medium:3,heavy:4},freeTrait:'energyWeapons'},
};

const DISASTERS=[
  {r:1,name:'蛞蝓鑽孔蟲之雨',fx:'所有單位受到 1D6 無法豁免傷害。受到 5+ 傷害的單位額外劃掉一個隨機系統方框。',kind:'all_d6_sys'},

/* ---------- 單位建立 ---------- */
function buildStats(kind,size,traits){
  const A=ARCHETYPES[kind];
  const s={MATT:A.MATT,RATT:A.RATT,DEF:A.DEF,DET:A.DET,QUL:A.QUL,DB:A.DB[size],move:A.move[size]};
  let extraDC=0,armorDice=0;
  const tset=traits||[];
  if(tset.includes('armored'))armorDice={light:1,medium:2,heavy:3}[size];
  for(const t of tset){
    switch(t){
      case'animalSenses':case'sensorArray':s.DET+=1;break;
      case'boostedMove':s.move+=(kind==='infantry'?1:3);break;
      case'hover':s.move+=2;break;
      case'riflemen':s.RATT+=1;break;
      case'skirmisher':s.MATT+=1;s.DB+=1;break;
      case'closeQuarter':s.MATT+=2;break;
      case'powerArmor':s.DEF+=1;s.MATT+=1;if(!armorDice)armorDice=1;break;
      case'veteran':s.QUL+=1;break;
      case'tough':extraDC+={light:2,medium:4,heavy:6}[size];break;
      case'green':s.QUL-=1;break;
      case'ace':s.RATT+=1;s.MATT+=1;break;
      case'missiles':s.RATT+=1;break;
      case'closeAssault':s.MATT+=1;break;
    }
  }
  return{stats:s,extraDC,armorDice};
}
function buildSystems(traits){const sys=[];for(const t of traits){if(TRAITS[t]&&TRAITS[t].sys)sys.push({key:t,name:TRAITS[t].n,boxes:[false,false]})}return sys}
function makePlayerUnit(kind,size,name,traits){
  const A=ARCHETYPES[kind],base=buildStats(kind,size,traits),dcMax=A.dc[size]+base.extraDC;
  return{id:'p'+Math.random().toString(36).slice(2,9),name:name||randomName(),kind,size,
    stats:base.stats,dcMax,dc:dcMax,armorDice:base.armorDice,
    traits:traits.slice(),systems:buildSystems(traits),growth:0,status:'ok'};
}

/* 部隊建構器：允許體型調整 */
function buildCrewDefs(){
  return[
    {id:'mech',kind:'mech',name:'主力機甲',traits:['armored','veteran','sensorArray','energyWeapons','jumpJets'],size:'medium',locked:false},
    {id:'scrap',kind:'infantry',name:'廢鐵小隊',traits:['scrapper','boostedMove','skirmisher','tough','scout'],size:'medium',locked:false},
    {id:'sec',kind:'infantry',name:'保安小隊',traits:['riflemen','tough','veteran','sensorArray','assaultSpec'],size:'medium',locked:false},
    {id:'scout',kind:'infantry',name:'偵察小隊',traits:['scout','boostedMove','animalSenses','skirmisher','tough'],size:'medium',locked:false},
    {id:'veh',kind:'vehicle',name:'支援載具',traits:['hauler','armored','ifv','tough','ecm'],size:'medium',locked:false},
    {id:'backup',kind:'mech',name:'備用機甲',traits:['armored','veteran','sensorArray','jumpJets'],size:'light',locked:true}, // 備用機甲依規則為輕型
  ];
}
function computeSizeBudget(defs){
  let points=0;
  for(const d of defs){
    if(d.locked)continue;
    if(d.size==='light')points+=(d.id==='mech'?2:1);
  }
  return points;
}
function commitCrew(defs){
  const units=[];
  const used=new Set();
  const nm=()=>{let n,g=0;do{n=randomName();g++}while(used.has(n)&&g<40);used.add(n);return n};
  defs.forEach(d=>{
    const u=makePlayerUnit(d.kind,d.size,nm(),d.traits);
    if(d.id==='backup')u.status='reserve';
    units.push(u);
  });
  return units;
}

function stepRecon(){

  </div>`;

function doRecon(){
  const c=state.campaign;
  const d1=rnd(6),d2=rnd(6);
  const loc=LOCALES.find(l=>l.r===d1)||LOCALES[0];
  const si=d2<=2?0:d2<=4?1:2;
  c.localeName=loc.name;c.localeSub=loc.subs[si];
  const scout=c.units.find(u=>u.kind==='infantry'&&u.traits.includes('scout')&&u.status==='ok')||c.units.find(u=>u.kind==='infantry'&&u.status==='ok');
  let boons=0;
  if(scout&&scout.traits.includes('scout'))boons++;
  if(c.intelBonus)boons++;
  const roll=rollDice(boons,0);
  const total=roll.sum+(scout?scout.stats.QUL:0);
  let result=total-13;if(result>=0&&roll.triple)result++;
  const success=result>=0;
  c.reconOk=success;
  c.scrapTotal=success?5:(rnd(3)+1);
  c.reconDone=true;c.intelBonus=false;
  addHistory(`📍 ${c.localeName}—${c.localeSub}：偵察${success?'成功':'失敗'}，廢鐵標記 ${c.scrapTotal} 個。`);
  showModal(`<h2>📍 地點偵察</h2>
    <p class="small dim">擲 1D6：<b>${d1}</b> → ${loc.name}；再擲 1D6：<b>${d2}</b> → ${loc.subs[si]}</p><hr>
    <p class="small">偵察單位 <b class="amber">${scout?esc(scout.name):'（無）'}</b> 進行 13+ 素質檢定${boons?`（增益 +${boons}）`:''}：</p>
    ${diceHTML(roll,13,total,result,success)}<hr>
    <p class="small">可搜尋廢鐵標記：<b class="amber">${c.scrapTotal}</b> 個</p>
    <div class="btnrow"><button class="primary" data-act="closeModal" style="flex:1">繼續</button></div>`,()=>render());
  sfxOk();
}
function stepRaid(){

function generateEnemies(){
  const c=state.campaign;
  c.enemies=[];
  const scout=c.units.find(u=>u.kind==='infantry'&&u.traits.includes('scout')&&u.status==='ok')||c.units.find(u=>u.kind==='infantry'&&u.status==='ok');
  let boons=(scout&&scout.traits.includes('scout'))?1:0;
  const r=rollDice(boons,0);
  const tot=r.sum+(scout?scout.stats.DET:0);
  let result=tot-13;if(result>=0&&r.triple)result++;
  c.reconAdjust=result>=0?1+result:0;
  const t1=rnd(6),t2=rnd(6);
  let lk;
  if(t1<=2)lk='mech';else if(t1<=4)lk='kaiju';else lk='supermutant';
  let ls=t2<=1?'heavy':t2<=4?'medium':'light';
  const leader=makeGCUnit(lk,ls,null,'leader');
  leader.tier=rnd(3);rebuildGCStats(leader);
  c.enemies.push(leader);
  const count=rnd(3)+2;
  let mechUsed=lk==='mech';
  for(let i=0;i<count;i++){
    let d=rnd(6),kind,size,role;
    if(d===1){if(mechUsed)kind='vehicle';else{kind='mech';mechUsed=true}}
    else if(d===2)kind=Math.random()<0.5?'kaiju':'supermutant';
    else if(d<=4)kind='vehicle';
    else kind='infantry';
    const s=rnd(6);size=s<=1?'heavy':s<=4?'medium':'light';
    if(kind==='vehicle')role='shooter';
    else if(kind==='infantry')role=Math.random()<0.5?'shooter':'fighter';
    else role=pick(['fighter','shooter','specialist','leader']);
    const u=makeGCUnit(kind,size,null,role);
    rebuildGCStats(u);c.enemies.push(u);
  }
  let adj=c.reconAdjust;
  while(adj>0){const cand=c.enemies.filter(e=>e.size!=='light');if(!cand.length)break;const t=pick(cand);t.size=t.size==='heavy'?'medium':'light';rebuildGCStats(t);adj--}
  const extraTier=Math.max(0,c.scrapTotal-3);
  for(let i=0;i<extraTier;i++){const e=pick(c.enemies);e.tier=(e.tier||0)+1;rebuildGCStats(e)}
  c.enemiesReady=true;
  addHistory(`⚔️ 遭遇 ${c.enemies.length} 個敵人（領袖：${c.enemies[0].name}）。`);
  render();toast('敵軍已生成');sfxOk();
}
function makeGCUnit(kind,size,name,role){
  const A=ARCHETYPES[kind];
  const traits=[];if(A.freeTrait)traits.push(A.freeTrait);
  const u={uid:'g'+Math.random().toString(36).slice(2,9),side:'gc',kind,size,role:role||'fighter',name:name||randomName(),tier:0,traits,stats:{},dcMax:0,dc:0,armorDice:0,x:0,y:0,move:0};
  rebuildGCStats(u);return u;
}
function rebuildGCStats(u){
  const A=ARCHETYPES[u.kind];
  const base=buildStats(u.kind,u.size,u.traits);
  u.stats=Object.assign({},base.stats);
  u.armorDice=base.armorDice;
  const tierBonus=u.tier||0;
  u.stats.MATT+=tierBonus;u.stats.RATT+=tierBonus;u.stats.DEF+=tierBonus;
  const toughCount=u.traits.filter(t=>t==='tough').length;
  u.dcMax=A.dc[u.size]+base.extraDC+toughCount*{light:2,medium:4,heavy:6}[u.size];
  u.dc=u.dcMax;u.move=base.stats.move;
}

function doFallout(){
  const c=state.campaign;
  const log=[];
  const res=c.battleResult||{ooa:[],loot:0};
  let medicUsed=false;
  if(res.ooa&&res.ooa.length){
    res.ooa.forEach(uid=>{
      const u=c.units.find(x=>x.id===uid);if(!u)return;
      let b=0;
      if(c.baseDone.medicalBay&&!medicUsed&&u.kind==='infantry'){b=1;medicUsed=true}
      const roll=rollDice(b,0);
      let total=roll.sum+u.stats.QUL;
      let result=total-13;if(result>=0&&roll.triple)result++;
      const ok=result>=0;
      const pair=(roll.kept[0]===roll.kept[1]||roll.kept[1]===roll.kept[2]||roll.kept[0]===roll.kept[2]);
      if(ok){u.status='ok';log.push(`✅ ${esc(u.name)} 通過命運檢定（${total} vs 13+），安然無恙。`)}
      else if(pair){u.status='miss';u.dc=Math.max(1,Math.floor(u.dcMax*0.3));log.push(`⚠️ ${esc(u.name)} 檢定失敗（${total}），但擲出對子——錯過下一場戰鬥。`)}
      else{
        if(u.kind==='mech'&&c.units.some(x=>x.status==='reserve'&&x.kind==='mech')){
          const back=c.units.find(x=>x.status==='reserve'&&x.kind==='mech');
          back.status='ok';u.status='destroyed';
          log.push(`💀 ${esc(u.name)} 被摧毀，但<b class="green">備用機甲 ${esc(back.name)}</b> 緊急上陣！`);
        }else{u.status='destroyed';u.dc=0;log.push(`💀 ${esc(u.name)} 檢定失敗（${total}），已被摧毀／死亡。`)}
      }
    });
  }else log.push('✅ 本場戰鬥沒有單位出局。');
  let mc=0;const loot=res.loot||0;
  for(let i=0;i<loot;i++)mc+=rnd(3)+1;
  c.uwa+=mc;
  log.push(`💰 回收 ${loot} 個廢鐵標記 → <b class="amber">+${mc} MC</b>`);
  const survivors=c.units.filter(u=>u.status==='ok'||u.status==='miss');
  if(survivors.length){
    const eligible=survivors.filter(u=>u.id!==c.lastGrowthUid);
    const pool=eligible.length?eligible:survivors;
    const minG=Math.min(...pool.map(u=>u.growth||0));
    const cand=pool.filter(u=>(u.growth||0)===minG);
    const target=pick(cand);
    const d=rnd(6);
    const sn=['MATT','RATT','DEF','DET','QUL','DB'][d-1];
    target.stats[sn]=(target.stats[sn]||0)+1;
    target.growth=(target.growth||0)+1;
    c.lastGrowthUid=target.id;
    log.push(`📈 ${esc(target.name)} 獲得成長：<b class="amber">${sn} +1</b>`);
  }
  c.units=c.units.filter(u=>u.status!=='destroyed');
  c.falloutLog=log;c.falloutDone=true;c.enemiesReady=false;c.enemies=[];
  addHistory(`🩸 戰後：回收 ${loot} 個廢鐵，獲得 ${mc} MC。`);
  render();
  showModal(`<h2>🩸 戰後餘波</h2><div class="small" style="line-height:2">${log.join('<br>')}</div><div class="btnrow" style="margin-top:12px"><button class="primary" data-act="closeModal" style="flex:1">繼續</button></div>`,()=>render());
  sfxOk();
}

function startBattle(){

      x:-1,y:-1,deployed:false,moveLeft:Math.round(u.stats.move/CELL_INCH),
      moved:false,acted:false,alive:true,hasX:false,carries:0,
      burning:false,srcRef:u,role:'player',
      systems:u.systems.map(s=>({key:s.key,name:s.name,boxes:s.boxes.slice()})),
      initNum:0,hasAttacked:false,charging:false,hidden:false,enteredBuilding:null,
      firstAtkPenalty:(c.missed.sustenance?1:0),
      qulPenaltyLeft:(c.missed.base?2:0),
    });
  });
  const gcQueue=[];
  c.enemies.forEach((e,i)=>{
    gcQueue.push({
      uid:e.uid,side:'gc',kind:e.kind,size:e.size,name:e.name,role:e.role,
      stats:Object.assign({},e.stats),dc:e.dcMax,dcMax:e.dcMax,
      armorDice:e.armorDice,traits:e.traits.slice(),tier:e.tier,
      x:-1,y:-1,deployed:false,moveLeft:Math.round(e.move/CELL_INCH),
      moved:false,acted:false,alive:true,hasX:false,carries:0,srcRef:e,
      initNum:0,systems:[],burning:false,kaijuMaimed:false,
    });
  });

  const scrap=[],terrain=[],buildings=[],difficult=[];
  const used=new Set();
  for(let i=0;i<c.scrapTotal;i++){
    let x,y,g=0;
    do{x=1+rnd(GRID-2);y=1+rnd(GRID-4);g++}while(used.has(x+','+y)&&g<200);
    used.add(x+','+y);scrap.push({x,y,taken:false});terrain.push({x,y,cover:true});
  }
  for(let i=0;i<3;i++){
    let x,y,g=0;
    do{x=rnd(GRID-1);y=1+rnd(GRID-2);g++}while(used.has('c'+x+','+y)&&g<200);

  for(let i=0;i<2;i++){

  state.battle={
    round:1,maxRounds:5,units,gcQueue,

    order:[],orderIdx:0,activeUid:null,
    phase:'deploy',awaiting:'deploy',

function deployEnemies(){

function hasLineOfSight(a,b){
  if(!a||!b)return false;
  const dist=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
  if(dist<=1)return true;
  const steps=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
  const dx=(b.x-a.x)/steps,dy=(b.y-a.y)/steps;
  let x=a.x,y=a.y;
  for(let i=0;i<steps-1;i++){
    x+=dx;y+=dy;
    const rx=Math.round(x),ry=Math.round(y);
    if(rx===a.x&&ry===a.y)continue;
    if(rx===b.x&&ry===b.y)continue;
    const t=state.battle.terrain.find(t=>t.x===rx&&t.y===ry);
    const bd=state.battle.buildings.find(b=>b.x===rx&&b.y===ry&&b.dc>0);
    if(t||bd)return false;
  }
  return true;
}

  const b=state.battle;
  return b.terrain.some(t=>t.x===x&&t.y===y)||b.buildings.some(bd=>bd.x===x&&bd.y===y&&bd.dc>0);

function rollInitiative(){
  const b=state.battle;
  if(!b||b.ended)return;
  const alive=b.units.filter(u=>u.alive);
  alive.forEach(u=>u.hasX=false);
  let xCount=1;
  if(b.round<=2&&b.extraXForOps>0){xCount+=b.extraXForOps;b.extraXForOps=0}
  const xLog=[];
  for(let i=0;i<xCount;i++){
    const r=pick(alive);
    if(r.side==='gc'){r.hasX=true;xLog.push(`${r.name}【X因素】`)}
    else xLog.push(`${r.name}（玩家，無效果）`);
  }
  const nums=alive.map((_,i)=>i+1);
  for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}
  alive.forEach((u,i)=>{u.initNum=nums[i]});
  b.order=alive.slice().sort((a,c)=>a.initNum-c.initNum).map(u=>u.uid);
  b.orderIdx=0;b.phase='activation';b.awaiting='none';
  battleLog(`— 第 ${b.round} 輪先攻 —`);
  b.order.forEach(uid=>{const u=b.units.find(x=>x.uid===uid);if(u)battleLog(`　${u.initNum}. ${u.name}${u.hasX?' 【X因素】':''}`)});
  if(xLog.length)battleLog(`🎲 X 因素：${xLog.join('、')}`);
  render();
  setTimeout(()=>nextActivation(),400);
}
function nextActivation(){
  const b=state.battle;
  if(!b||b.ended){render();return}
  while(b.orderIdx<b.order.length){
    const uid=b.order[b.orderIdx];
    const u=b.units.find(x=>x.uid===uid);
    if(u&&u.alive)break;
    b.orderIdx++;
  }
  if(b.orderIdx>=b.order.length){endBattleRound();return}
  const u=b.units.find(x=>x.uid===b.order[b.orderIdx]);
  b.activeUid=u.uid;
  u.moved=false;u.acted=false;
  u.moveLeft=Math.round(u.stats.move/CELL_INCH);
  if(u.hasX)u.moveLeft+=Math.round(3);
  if(u.kaijuMaimed)u.moveLeft=Math.floor(u.moveLeft/2);
  b.phase='activation';
  if(u.side==='player'){b.awaiting='playerAction';render()}
  else{b.awaiting='none';render();setTimeout(()=>gcActivate(u),450)}
}
function endBattleRound(){
  const b=state.battle;
  if(!b||b.ended)return;
  b.units.filter(u=>u.alive&&u.burning).forEach(u=>{
    u.dc-=1;battleLog(`🔥 ${u.name} 受到 1 點火焰持續傷害。`);
    if(u.dc<=0)killUnit(u);
  });
  b.round++;
  if(b.round>b.maxRounds){endBattle('輪數耗盡');return}
  if(b.round>=2&&b.gcQueue.length){
    deployNextEnemy();
    battleLog(`🎯 新的敵人到達（剩餘 ${b.gcQueue.length} 個）。`);
  }
  if(b.round===b.maxRounds){
    const dr=rnd(6);
    const dis=DISASTERS.find(d=>d.r===dr)||DISASTERS[0];
    b.disaster=dis;battleLog(`☄️ 環境災難：${dis.name} — ${dis.fx}`);
    applyDisaster(dis,dr);
    render();
    showModal(`<h2>☄️ 即將來臨的災難</h2>
      <p class="small">第 ${b.round} 輪開始，擲 1D6：<b>${dr}</b></p><h4>${dis.name}</h4><p class="small">${dis.fx}</p>
      <div class="btnrow" style="margin-top:10px"><button class="primary" data-act="closeModal" style="flex:1">繼續戰鬥</button></div>`,
      ()=>{b.phase='initiative';b.awaiting='rollInit';render()});
    return;
  }
  b.phase='initiative';b.awaiting='rollInit';render();
}
function applyDisaster(dis,dr){
  const b=state.battle;if(!b)return;
  switch(dis.kind){
    case'all_d6_sys':b.units.filter(u=>u.alive).forEach(u=>{const d=rnd(6);u.dc-=d;if(d>=5&&u.systems&&u.systems.length){const s=pick(u.systems);if(!s.boxes[0])s.boxes[0]=true;else if(!s.boxes[1])s.boxes[1]=true}if(u.dc<=0)killUnit(u)});break;
    case'all_d6_sc':b.units.filter(u=>u.alive).forEach(u=>{const d=rnd(6);u.dc-=d;if(d>=5&&u.carries>0){u.carries--;b.loot=Math.max(0,b.loot-1)}if(u.dc<=0)killUnit(u)});break;
    case'inf_d6_rad':b.units.filter(u=>u.alive&&u.kind==='infantry'&&!u.traits.includes('powerArmor')).forEach(u=>{const d=rnd(6);u.dc-=d;if(d>=5)u.radSickness=true;if(u.dc<=0)killUnit(u)});break;
    case'all_d6p1':b.units.filter(u=>u.alive).forEach(u=>{u.dc-=(rnd(6)+1);if(u.dc<=0)killUnit(u)});break;
    case'noninf_d6p2':b.units.filter(u=>u.alive&&u.kind!=='infantry').forEach(u=>{u.dc-=(rnd(6)+2);if(u.dc<=0)killUnit(u)});break;
    case'all_d6p1_qul':b.units.filter(u=>u.alive).forEach(u=>{
      u.dc-=(rnd(6)+1);
      if(u.dc<=0){killUnit(u);return}
      if(u.side==='player'){const r=rollDice(0,0);let t=r.sum+u.stats.QUL;let res=t-15;if(res>=0&&r.triple)res++;if(res<0)u.stats.QUL=Math.max(-1,u.stats.QUL-1)}
    });break;
  }
}

function battleClickCell(x,y){
  const b=state.battle;
  if(!b)return;
  if(b.deployStage==='player'&&b.awaiting==='deploy'){deployPlayerUnit(x,y);return}
  if(b.awaiting!=='playerAction')return;
  const u=b.units.find(u=>u.uid===b.activeUid);
  if(!u||!u.alive)return;
  if(u.acted){toast('此單位本回合已行動完畢');return}
  const dist=Math.max(Math.abs(u.x-x),Math.abs(u.y-y));
  if(dist>u.moveLeft){toast('移動力不足');return}
  const occupied=b.units.find(o=>o.alive&&o.x===x&&o.y===y);
  if(occupied){toast('該格已有單位');return}
  const extraCost=cellIsDifficult(x,y)?1:0;
  if(dist+extraCost>u.moveLeft){toast('困難地形消耗額外移動力');return}
  const adjEnemies=b.units.filter(o=>o.alive&&o.side!=='player'&&Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))<=1);
  if(adjEnemies.length>0&&u.kind!=='mech'){
    const allyAdj=b.units.filter(a=>a.alive&&a.side==='player'&&a!==u&&adjEnemies.some(e=>Math.max(Math.abs(a.x-e.x),Math.abs(a.y-e.y))<=1));
    if(!allyAdj.length){
      adjEnemies.forEach(e=>{
        const r=rollDice(0,0);
        let total=r.sum+e.stats.MATT;
        const tn=11+u.stats.DEF;
        let res=total-tn;if(res>=0&&r.triple)res++;
        if(res>=0){
          let dmg=res+e.stats.DB;
          if(u.armorDice>0){let best=0;for(let i=0;i<u.armorDice;i++)best=Math.max(best,rnd(3));dmg=Math.max(0,dmg-best)}
          u.dc-=dmg;battleLog(`⚔️ ${e.name} 自由攻擊 ${u.name}，造成 ${dmg} 傷害。`);
          if(u.dc<=0)killUnit(u);
        }
      });
    }
  }
  const wasMelee=b.units.some(o=>o.alive&&o.side!=='player'&&Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))<=1);
  u.x=x;u.y=y;u.moveLeft-=dist+extraCost;
  const nowMelee=b.units.some(o=>o.alive&&o.side!=='player'&&Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))<=1);
  if(!wasMelee&&nowMelee&&dist*CELL_INCH>=3)u.charging=true;
  if(u.traits.includes('jumpJets')&&!u.traits.includes('rte')&&(cellIsDifficult(x,y))){
    const r=rollDice(0,0);
    let total=r.sum+u.stats.QUL;
    let res=total-15;if(res>=0&&r.triple)res++;
    if(res<0){u.dc-=Math.max(1,-res);battleLog(`⚡ ${u.name} 跳躍落地失敗，受到 ${-res} 無法豁免傷害。`);if(u.dc<=0)killUnit(u)}
  }
  sfx(440,0.05,'triangle',0.03);
  render();
}
function enterAttackMode(){
  const b=state.battle;if(!b)return;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){toast('此單位已行動');return}
  b.awaiting='attackTarget';
  render();
}
function doPlayerAttack(targetUid,opts){
  const b=state.battle;if(!b)return;
  const atk=b.units.find(u=>u.uid===b.activeUid);
  const def=b.units.find(u=>u.uid===targetUid);
  if(!atk||!def||!atk.alive||!def.alive)return;
  const o=opts||{};
  const distCells=Math.max(Math.abs(atk.x-def.x),Math.abs(atk.y-def.y));
  const isMelee=distCells<=1;

  if(!isMelee){
    if(!hasLineOfSight(atk,def)){toast('沒有視線（被地形阻擋）');return}
    if(atk.traits.includes('shortRanged')&&distCells*CELL_INCH>10){toast('短程專精：超出 10" 射程');return}
  }

  let att=isMelee?atk.stats.MATT:atk.stats.RATT;
  let dmgBonus=atk.stats.DB;
  let boons=0,banes=0;
  const notes=[];

  if(isMelee){
    if(atk.traits.includes('skirmisher')){dmgBonus+=1;notes.push('散兵+1')}
    if(atk.traits.includes('closeAssault')){if(def.kind==='vehicle'){att+=1;notes.push('突擊套件+1')}if(def.kind==='infantry'){att+=2;notes.push('突擊套件+2')}}
    if(atk.charging){att+=1;dmgBonus+=1;notes.push('衝鋒+1/+1')}
    const allies=b.units.filter(a=>a.alive&&a.side==='player'&&a!==atk&&Math.max(Math.abs(a.x-def.x),Math.abs(a.y-def.y))<=1);
    if(allies.length>0){const bonus=Math.min(3,allies.length);att+=bonus;notes.push(`集團突擊+${bonus}`)}
  }else{
    if(atk.traits.includes('riflemen')){att+=1;notes.push('步槍兵+1')}
    if(atk.traits.includes('gaussWeapons')&&distCells*CELL_INCH>15){att+=1;notes.push('電磁+1')}
    if(atk.traits.includes('shortRanged')&&distCells*CELL_INCH<=5){att+=2;dmgBonus+=2;notes.push('短程+2/+2')}
    if(atk.traits.includes('antiInfantry')&&def.kind==='infantry'&&distCells*CELL_INCH<=10){att+=2;dmgBonus+=1;notes.push('反步兵+2/+1')}
    if(atk.traits.includes('tankHunter')&&(def.kind==='mech'||def.kind==='vehicle')){att+=atk.stats.QUL;dmgBonus+=atk.stats.QUL;notes.push('坦克獵手')}
    if(atk.traits.includes('kaijuHunter')&&def.kind==='kaiju'){att+=atk.stats.QUL;dmgBonus+=atk.stats.QUL;notes.push('怪獸獵手')}
  }
  if(atk.hasX){boons++;notes.push('X因素+1')}
  const inCover=targetInCover(def.x,def.y);
  if(inCover){banes++;notes.push('目標在掩體')}
  if(atk.firstAtkPenalty>0&&!atk.hasAttacked){banes+=atk.firstAtkPenalty;atk.firstAtkPenalty=0;notes.push('口糧懲罰')}
  atk.hasAttacked=true;

  const tn=11+def.stats.DEF+(def.hasX?1:0)+(inCover?1:0);

  if(o.suppress&&def.kind==='infantry'){
    const roll=rollDice(boons,banes);
    let total=roll.sum+att;
    let result=total-tn;if(result>=0&&roll.triple)result++;
    atk.acted=true;atk.moveLeft=0;b.awaiting='none';
    if(result>=0){
      const supTN=11+result;
      const sr=rollDice(0,0);
      let st=sr.sum+def.stats.QUL;
      let sres=st-supTN;if(sres>=0&&sr.triple)sres++;
      if(sres<0){def.suppressed=true;battleLog(`💥 ${def.name} 被壓制！`);toast(`${def.name} 被壓制`) }
      else{battleLog(`💥 ${def.name} 抵抗壓制。`);toast(`${def.name} 抵抗成功`)}
    }else toast('壓制射擊未命中');
    render();setTimeout(()=>{if(!b.ended)endPlayerTurn()},250);
    return;
  }

  let overloadDmg=0;
  if(o.overload&&atk.traits.includes('energyWeapons')){
    overloadDmg=Math.min(6,Math.max(1,o.overload));
    atk.dc-=overloadDmg;
    battleLog(`⚡ ${atk.name} 過載 +${overloadDmg}，自身受 ${overloadDmg} 無法豁免傷害。`);
    if(atk.dc<=0)killUnit(atk);
  }

  const roll=rollDice(boons,banes);
  let total=roll.sum+att;
  let result=total-tn;
  if(result>=0&&roll.triple)result++;
  const success=result>=0;

  let dmg=0,saved=0;
  if(success){
    dmg=result+dmgBonus+overloadDmg;
    if(def.armorDice>0){let best=0;for(let i=0;i<def.armorDice;i++)best=Math.max(best,rnd(3));saved=best;dmg=Math.max(0,dmg-best)}
    def.dc-=dmg;
    sfxHit();
    if(dmg>=5)maybeSystemDamage(def,dmg);
    if(atk.traits.includes('flamer')&&!isMelee)def.burning=true;
    if(def.dc<=0)killUnit(def);
    battleLog(`${atk.name} ${isMelee?'近戰':'遠程'}攻擊 ${def.name}：${total} vs ${tn}+ → 命中，造成 ${dmg} 傷害${saved?`（裝甲減 ${saved}）`:''}${notes.length?' ['+notes.join(',')+']':''}`);
  }else{
    sfxFail();
    battleLog(`${atk.name} ${isMelee?'近戰':'遠程'}攻擊 ${def.name}：${total} vs ${tn}+ → 未中${notes.length?' ['+notes.join(',')+']':''}`);
  }

  atk.acted=true;atk.moveLeft=0;b.awaiting='none';
  render();
  setTimeout(()=>{if(!b.ended)endPlayerTurn()},250);
}
function maybeSystemDamage(u,dmg){
  if(u.kind==='kaiju'&&dmg>=5){
    const d=rnd(6);
    const crit=KAIJU_CRIT.find(k=>k.r===d)||KAIJU_CRIT[0];
    battleLog(`🩸 ${u.name} 受到暴擊：${crit.name} — ${crit.fx}`);
    if(d===1)u.kaijuMaimed=true;
    else if(d===2)u.kaijuShaken=true;
    else if(d===3)u.armorDice=Math.max(0,u.armorDice-1);
    else if(d===4)u.kaijuEnraged=true;
    else if(d===5){u.dc-=3;if(u.dc<=0)killUnit(u)}
    else if(d===6){u.dc-=5;if(u.dc<=0)killUnit(u)}
    return;
  }
  if(!u.systems||!u.systems.length)return;
  if(dmg>=5){const s=pick(u.systems);if(!s.boxes[0]){s.boxes[0]=true;battleLog(`⚙️ ${u.name}「${s.name}」受損。`)}else if(!s.boxes[1]){s.boxes[1]=true;battleLog(`⚙️ ${u.name}「${s.name}」失能！`)}}
  if(dmg>=10&&u.systems.length>1){const s2=pick(u.systems);if(!s2.boxes[0])s2.boxes[0]=true;else if(!s2.boxes[1])s2.boxes[1]=true}
}
function doOverheat(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){toast('此單位已行動');return}
  if(u.kind!=='mech'){toast('只有機甲可以過熱');return}
  u.overheated=true;u.moveLeft+=rnd(3)+1;
  const dmg=rnd(3)+1;u.dc-=dmg;
  battleLog(`🔥 ${u.name} 過熱：額外 ${dmg} 移動，受到 ${dmg} 無法豁免傷害。`);
  if(u.systems&&u.systems.length){const s=pick(u.systems);if(!s.boxes[0])s.boxes[0]=true;else if(!s.boxes[1])s.boxes[1]=true}
  if(u.dc<=0)killUnit(u);
  toast(`🔥 過熱：+${dmg} 移動，-${dmg} DC`);sfxHit();render();
}
function doForcedMarch(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){toast('此單位已行動');return}

  if(result>=0){u.moveLeft+=1+result;battleLog(`🏃 ${u.name} 強行軍：+${1+result} 格。`);toast(`🏃 強行軍成功：+${1+result} 格`);sfxOk()}
  else{battleLog(`🏃 ${u.name} 強行軍失敗。`);toast('❌ 強行軍失敗');sfxFail()}
  render();
}
function doScavenge(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted){toast('此單位已行動');return}
  const near=b.scrap.find(s=>!s.taken&&Math.max(Math.abs(s.x-u.x),Math.abs(s.y-u.y))<=1);
  if(!near){toast('附近沒有廢鐵標記');return}
  let boons=0;
  if(u.traits.includes('scrapper'))boons++;
  const tn=u.kind==='mech'?14:13;
  const roll=rollDice(boons,0);
  let total=roll.sum+u.stats.QUL;
  let result=total-tn;if(result>=0&&roll.triple)result++;
  if(result>=0){
    near.taken=true;u.carries++;b.loot++;
    let cap=1;
    if(u.kind==='mech')cap={light:1,medium:2,heavy:3}[u.size]+u.stats.QUL;
    else if(u.kind==='vehicle')cap={light:2,medium:3,heavy:4}[u.size]+u.stats.QUL;
    else if(u.traits.includes('powerArmor'))cap=2;
    if(u.carries>cap){u.carries=cap;b.loot=Math.max(0,b.loot-1)}
    battleLog(`⚙️ ${u.name} 取得廢鐵標記（總值 ${total} vs ${tn}+）。`);
    sfxOk();
  }else{battleLog(`⚙️ ${u.name} 取廢鐵失敗。`);sfxFail()}
  u.acted=true;b.awaiting='none';
  render();
  setTimeout(()=>{if(!b.ended)endPlayerTurn()},250);
}
function doHide(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted)return;
  if(u.kind!=='infantry'){toast('只有步兵可以隱蔽');return}
  if(!targetInCover(u.x,u.y)){toast('必須在掩體中才能隱蔽');return}
  const inLOS=b.units.some(e=>e.alive&&e.side==='gc'&&hasLineOfSight(e,u));
  if(inLOS){toast('有敵人看見你，無法隱蔽');return}
  u.hidden=true;u.acted=true;b.awaiting='none';
  battleLog(`🫥 ${u.name} 隱蔽起來。`);
  toast(`🫥 ${u.name} 已隱蔽`);
  sfxOk();render();
  setTimeout(()=>{if(!b.ended)endPlayerTurn()},250);
}
function doSalvage(){
  const b=state.battle;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(!u||u.acted)return;
  if(u.kind!=='mech'&&u.kind!=='vehicle'){toast('只有機甲或載具可以打撈');return}

  if(!target){toast('附近沒有可打撈的殘骸');return}
  const roll=rollDice(0,0);

  let result=total-13;if(result>=0&&roll.triple)result++;
  if(result>=0){
    const c=state.campaign;
    c.salvagePool.push({kind:target.kind,size:target.size});
    battleLog(`🔧 ${u.name} 成功打撈 ${target.name}。`);
    toast('🔧 打撈成功，戰後可處理');sfxOk();
  }else{toast('❌ 打撈失敗');sfxFail()}

  render();
  setTimeout(()=>{if(!b.ended)endPlayerTurn()},250);
}
function endPlayerTurn(){
  const b=state.battle;
  if(!b||b.ended)return;
  const u=b.units.find(x=>x.uid===b.activeUid);
  if(u){u.acted=true;u.charging=false}
  b.awaiting='none';
  render();
  setTimeout(()=>{b.orderIdx++;nextActivation()},300);
}
function killUnit(u){
  if(!u.alive)return;
  u.alive=false;u.dc=0;
  battleLog(`💀 ${u.name} 出局！`);
  const b=state.battle;
  if(u.kind==='mech'||u.kind==='vehicle'||u.kind==='kaiju'){
    const d=[rnd(6),rnd(6),rnd(6)];
    if(d.includes(1)){
      const oneIdx=d.indexOf(1);
      const others=d.filter((v,i)=>i!==oneIdx);
      const radius=others[0]+others[1];
      const dmg=u.size==='light'?2:u.size==='medium'?4:6;
      battleLog(`💥 ${u.name} 爆炸！半徑 ${radius}"，傷害 ${dmg}。`);
      b.units.filter(o=>o.alive&&o!==u).forEach(o=>{
        const dist=Math.max(Math.abs(o.x-u.x),Math.abs(o.y-u.y))*CELL_INCH;
        if(dist<=radius){o.dc-=dmg;battleLog(`　${o.name} 受到 ${dmg} 爆炸傷害。`);if(o.dc<=0)killUnit(o)}
      });
    }
  }
  if(u.carries>0){
    for(let i=0;i<u.carries;i++)if(rnd(6)<=2)b.loot=Math.max(0,b.loot-1);
    u.carries=0;
  }
  checkBattleEnd();
}
function checkBattleEnd(){
  const b=state.battle;if(!b||b.ended)return;
  const pAlive=b.units.some(u=>u.alive&&u.side==='player');
  const gAlive=b.units.some(u=>u.alive&&u.side==='gc');
  if(!pAlive){endBattle('全軍覆沒');return}
  if(!gAlive&&!b.gcQueue.length){endBattle('敵人全滅');return}
}
function gcActivate(u){
  const b=state.battle;
  if(!b||b.ended||!u.alive)return;
  const players=b.units.filter(p=>p.alive&&p.side==='player'&&!p.hidden);
  const playersAll=b.units.filter(p=>p.alive&&p.side==='player');
  if(!playersAll.length){endBattle('全軍覆沒');return}
  const dist=(a,c)=>Math.max(Math.abs(a.x-c.x),Math.abs(a.y-c.y));
  const nearest=players.slice().sort((a,c)=>{
    const da=dist(u,a),dc=dist(u,c);
    if(da!==dc)return da-dc;
    return (a.dcMax-a.dc)-(c.dcMax-c.dc);
  })[0]||playersAll[0];
  let actionCount=u.hasX?2:1;
  for(let act=0;act<actionCount;act++){
    if(!u.alive)break;
    if(u.role==='specialist'){
      const sc=b.scrap.find(s=>!s.taken);
      if(sc){
        const d=dist(u,sc);
        if(d<=1){sc.taken=true;u.carries++;b.loot++;battleLog(`⚙️ ${u.name} 搶走廢鐵標記。`);continue}
        else moveToward(u,sc.x,sc.y);
      }
    }
    const d=dist(u,nearest);
    if(d<=1){gcAttack(u,nearest,true);continue}
    if(u.role==='fighter'){
      moveToward(u,nearest.x,nearest.y);
      if(dist(u,nearest)<=1)gcAttack(u,nearest,true);
      continue;
    }
    if(u.role==='shooter'||u.role==='leader'||u.kind==='mech'||u.kind==='vehicle'||u.kind==='kaiju'){
      const inRange=playersAll.some(p=>dist(u,p)<=6&&hasLineOfSight(u,p));
      if(inRange){
        const tgt=playersAll.slice().sort((a,c)=>dist(u,a)-dist(u,c))[0];
        gcAttack(u,tgt,false);
        continue;
      }
    }
    moveToward(u,nearest.x,nearest.y);
    if(dist(u,nearest)<=1)gcAttack(u,nearest,true);
  }
  u.acted=true;
  render();
  setTimeout(()=>{if(b.ended)return;b.orderIdx++;nextActivation()},500);
}
function moveToward(u,tx,ty){
  const b=state.battle;
  for(let i=0;i<u.moveLeft;i++){
    const dx=Math.sign(tx-u.x),dy=Math.sign(ty-u.y);
    if(dx===0&&dy===0)break;
    const nx=u.x+dx,ny=u.y+dy;
    if(nx<0||nx>=GRID||ny<0||ny>=GRID)break;
    if(b.units.some(o=>o.alive&&o!==u&&o.x===nx&&o.y===ny))break;
    u.x=nx;u.y=ny;
    if(u.x===tx&&u.y===ty)break;
  }
  u.moveLeft=0;
}
function gcAttack(atk,def,isMelee){
  const b=state.battle;
  let att=isMelee?atk.stats.MATT:atk.stats.RATT;
  let db=atk.stats.DB;
  let boons=atk.hasX?1:0;
  const inCover=targetInCover(def.x,def.y);
  const banes=inCover?1:0;
  const tn=11+def.stats.DEF+(def.hasX?1:0)+(inCover?1:0);
  const allies=b.units.filter(a=>a.alive&&a.side==='gc'&&a!==atk&&Math.max(Math.abs(a.x-def.x),Math.abs(a.y-def.y))<=1);
  if(isMelee&&allies.length>0)att+=Math.min(3,allies.length);
  if(atk.kaijuEnraged){att+=2;atk.kaijuEnraged=false}
  if(atk.kaijuShaken){att-=1;atk.kaijuShaken=false}

  const roll=rollDice(boons,banes);
  let total=roll.sum+att;
  let result=total-tn;if(result>=0&&roll.triple)result++;
  const success=result>=0;

  if(success){
    let dmg=result+db,saved=0;
    if(def.armorDice>0){let best=0;for(let i=0;i<def.armorDice;i++)best=Math.max(best,rnd(3));saved=best;dmg=Math.max(0,dmg-best)}
    def.dc-=dmg;
    sfxHit();
    if(dmg>=5)maybeSystemDamage(def,dmg);
    battleLog(`⚔️ ${atk.name} 攻擊 ${def.name}：${total} vs ${tn}+ → 命中，造成 ${dmg} 傷害${saved?`（裝甲減 ${saved}）`:''}`);
    if(def.dc<=0)killUnit(def);
  }else{sfxFail();battleLog(`⚔️ ${atk.name} 攻擊 ${def.name}：${total} vs ${tn}+ → 未中`)}
}
function endBattle(reason){
  const b=state.battle;if(!b||b.ended)return;
  b.ended=true;b.phase='ended';b.awaiting='none';b.endReason=reason;
  battleLog(`— 戰鬥結束：${reason} —`);
  render();
}
function finishBattle(){
  const b=state.battle;
  const c=state.campaign;
  if(!b)return;
  const players=b.units.filter(u=>u.side==='player');
  const ooa=players.filter(u=>!u.alive).map(u=>u.uid);
  const loot=b.loot;
  players.forEach(p=>{
    const src=c.units.find(x=>x.id===p.uid);
    if(src){
      src.dc=Math.max(0,p.dc);
      if(p.systems)src.systems=p.systems.map(s=>({key:s.key,name:s.name,boxes:s.boxes.slice()}));
    }
  });
  c.battleResult={ooa,loot,reason:b.endReason||'結束'};
  c.ooUnits=ooa;
  state.battle=null;state.screen='campaign';c.step='fallout';c.defending=false;
  addHistory(`⚔️ 戰鬥結束（${c.battleResult.reason}）：取得 ${loot} 個廢鐵標記，${ooa.length} 個單位出局。`);
  render();
}

    const nearSalvage=b.units.find(e=>!e.alive&&e.side==='gc'&&(e.kind==='mech'||e.kind==='vehicle')&&Math.max(Math.abs(e.x-active.x),Math.abs(e.y-active.y))<=1);

    </div>`;
  } else if(active){

  return`

  <div class="panel"><h3>敵方單位</h3><div class="hscroll">${gcList.map(u=>battleUnitCard(u)).join('')}</div></div>`;

let boundHandler=null;
function bindGlobal(){
  const app=$('#app');
  if(boundHandler)app.removeEventListener('click',boundHandler);
  boundHandler=(ev)=>{
    const el=ev.target.closest('[data-act]');
    if(el&&!el.disabled){
      try{handleAction(el.dataset.act,el.dataset)}
      catch(e){console.error(e);toast('⚠️ 操作錯誤：'+e.message)}
    }
  };
  app.addEventListener('click',boundHandler);

  // 修復：為彈窗綁定事件，確保點擊彈窗按鈕有反應
  const modalRoot=$('#modal-root');
  if(!modalRoot.dataset.bound){
    modalRoot.dataset.bound='1';
    modalRoot.addEventListener('click',boundHandler);
  }

  const nb=$('#navbar');
  if(!nb.dataset.bound){
    nb.dataset.bound='1';
    nb.addEventListener('click',ev=>{
      const btn=ev.target.closest('[data-nav]');
      if(!btn||btn.disabled)return;

    });
  }
}

function setBuilderSize(idx,size){
  const defs=state.builderDefs||buildCrewDefs();
  const d=defs[idx];
  if(!d||d.locked)return;
  const before=defs.reduce((s,x)=>{
    if(x.locked)return s;
    if(x.size==='light')return s+(x.id==='mech'?2:1);
    if(x.size==='heavy')return s-(x.id==='mech'?2:1);
    return s;
  },0);
  const oldSize=d.size;
  d.size=size;
  const after=defs.reduce((s,x)=>{
    if(x.locked)return s;
    if(x.size==='light')return s+(x.id==='mech'?2:1);
    if(x.size==='heavy')return s-(x.id==='mech'?2:1);
    return s;
  },0);
  if(after<0){
    d.size=oldSize;
    toast('升級點數不足！先降級其他單位');
    sfxFail();
    return;
  }
  sfxOk();render();
}
function confirmBuilder(){
  const defs=state.builderDefs||buildCrewDefs();
  const remaining=defs.reduce((s,x)=>{
    if(x.locked)return s;
    if(x.size==='light')return s+(x.id==='mech'?2:1);
    if(x.size==='heavy')return s-(x.id==='mech'?2:1);
    return s;
  },0);
  if(remaining<0){toast('還有升級點數未用完，請先降級其他單位');return}
  startCampaignWithDefs(defs);
}
function startCampaignWithDefs(defs){
  const c=newCampaign();
  c.units=commitCrew(defs);
  c.creditor=pick(CREDITORS);
  c.luck=rnd(3);
  addCampaignHistory(c,'🚩 戰役開始。團隊在荒原中集結。');
  addCampaignHistory(c,`💰 債主：${c.creditor}。起始運氣 ${c.luck} 點。`);
  state.campaign=c;
  state.screen='campaign';
  render();
  setTimeout(()=>toast('💰 起始運氣：'+c.luck+' 點'),300);
}
function addCampaignHistory(c,txt){
  c.history.push(txt);
  if(c.history.length>200)c.history.shift();
}
function startNewGame(){
  state=defaultState();
  if(!state.tutorialSeen){showHelp(true);return}
  state.builderDefs=buildCrewDefs();
  state.screen='builder';render();
}
function autoDeployRemaining(){
  const b=state.battle;if(!b)return;
  const pending=b.units.filter(u=>u.side==='player'&&!u.deployed);
  for(const u of pending){
    for(let x=0;x<GRID;x++){
      if(!b.units.some(o=>o.deployed&&o.alive&&o.x===x&&o.y===GRID-1)){
        u.x=x;u.y=GRID-1;u.deployed=true;b.deployPlayerCount++;break;
      }
    }
  }
  if(b.units.filter(p=>p.side==='player'&&!p.deployed).length===0){
    b.deployStage='enemies';deployEnemies();
  }
  sfxOk();render();
}
function continueBattle(){
  const b=state.battle;if(!b)return;
  b.orderIdx++;nextActivation();
}
function doRepairSalvage(idx){
  const c=state.campaign;
  if(!consumeRepairAction())return;
  const s=c.salvagePool[idx];
  if(!s){toast('打撈品不存在');return}
  const unit=c.units.find(u=>u.status==='ok');
  if(!unit){toast('沒有可執行檢定的單位');return}
  let boons=unit.traits.includes('scrapper')?1:0;
  const roll=rollDice(boons,0);
  let total=roll.sum+unit.stats.QUL;
  let result=total-13;if(result>=0&&roll.triple)result++;
  if(result>=0){
    c.extended.salvage+=1+result;
    if(c.extended.salvage>=10){
      c.salvagePool.splice(idx,1);c.extended.salvage=0;
      addHistory(`🔧 打撈完成一台敵方${SIZE_ZH[s.size]}${ARCHETYPES[s.kind].zh}。`);
      toast('🔧 打撈完成！可在交易站出售。');sfxOk();
    }else toast(`打撈進度 ${c.extended.salvage}/10`);sfxOk();
  }else{toast('❌ 打撈檢定失敗');sfxFail()}
  render();
}

function showHistory(){
  if(!state||state.screen==='title'){toast('尚未開始遊戲');return}
  const c=state.campaign;
  if(!c){toast('尚未開始戰役');return}
  const achNames={victory:'🚀 離開這顆星球',defeat:'💀 團隊覆滅',round10:'⏳ 撐過十輪'};
  const html=`
    <h2>📜 歷史紀錄</h2>
    <p class="small dim">你走過的路線。</p>
    <div class="timeline" style="max-height:48vh;overflow-y:auto;margin-top:10px">
      ${c.history.slice().reverse().map(h=>`<div class="tl-item">${h}</div>`).join('')||'<div class="dim2 small">尚無紀錄</div>'}
    </div>
    <h4>🏆 成就</h4>
    <div class="small">${c.achievements.length?c.achievements.map(a=>`<span class="tag">${achNames[a]||a}</span>`).join(''):'<span class="dim2">尚未解鎖任何成就</span>'}</div>
    <div class="btnrow" style="margin-top:14px"><button class="primary" data-act="closeModal" style="flex:1">關閉</button></div>`;
  showModal(html);
}
function showModal(html,cb){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal">${html}</div>`;
  root.classList.add('on');
  modalCallback=cb||null;
}
function closeModal(){
  const root=$('#modal-root');
  root.classList.remove('on');
  root.innerHTML='';
  const cb=modalCallback;modalCallback=null;
  if(cb)try{cb()}catch(e){console.error(e)}
}

/* ---------- 啟動 ---------- */
state=defaultState();
