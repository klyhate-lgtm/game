<head>

<style>

  }

  * {

    padding: 0;
    box-sizing: border-box;

  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Noto Serif TC', Georgia, 'Times New Roman', serif;
    background: #1a1209;
    color: var(--ink);
    display: flex;
    flex-direction: column;

  /* 羊皮紙紋理背景 */
  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255, 245, 220, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(200, 170, 120, 0.3) 0%, transparent 50%),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 2px,
        rgba(139, 109, 59, 0.03) 2px,
        rgba(139, 109, 59, 0.03) 4px
      ),
      linear-gradient(135deg, #f7ecd4 0%, #f0e0c0 40%, #e8d4a8 70%, #ddc898 100%);
    position: relative;
    overflow: hidden;
  }

  /* 暗角效果 */
  #app::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(40, 25, 10, 0.35) 100%);
  }

  /* 頂部狀態列 */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: linear-gradient(180deg, rgba(60, 40, 20, 0.95), rgba(40, 25, 12, 0.9));
    color: var(--gold-light);
    font-size: 0.8rem;
    border-bottom: 2px solid var(--gold);
    z-index: 10;
    flex-shrink: 0;
    letter-spacing: 1px;
  }

  #topbar .era {
    font-weight: 900;
    font-size: 0.95rem;
    color: #f0d890;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  #topbar .location {
    opacity: 0.85;
    font-size: 0.78rem;
    max-width: 55%;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 主內容區 */
  #main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 6;
    position: relative;
    scroll-behavior: smooth;
  }

  /* 場景插圖 */
  #scene-image {
    width: 100%;
    height: 200px;
    border-radius: 8px;
    overflow: hidden;
    border: 3px solid #8b6d3b;

    background: #3a2814;
    position: relative;
    flex-shrink: 0;
  }

  #scene-image svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 場景文字 */
  #scene-text {
    font-size: 1.02rem;
    line-height: 1.85;
    color: var(--ink);
    text-align: justify;
    padding: 16px 18px;
    background: rgba(255, 250, 240, 0.55);
    border-radius: 6px;
    border-left: 4px solid var(--gold);
    box-shadow: 0 2px 8px rgba(90, 68, 40, 0.15);
    min-height: 120px;
    white-space: pre-wrap;
    font-weight: 500;
    letter-spacing: 0.3px;

    user-select: none;

    transition: background 0.2s;

    width: 2px;

    padding: 14px 18px;
    background: linear-gradient(135deg, #fdf6e3 0%, #f0e0bb 100%);
    border: 2px solid #9c7d45;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    text-align: left;

    letter-spacing: 0.5px;

    color: var(--gold);
    font-size: 1.2rem;
    font-weight: 900;
    flex-shrink: 0;
    transition: transform 0.2s;

  .choice-btn:hover {

    transform: translateY(-2px);

    transform: translateX(4px);

  .choice-btn:active {
    transform: translateY(1px);
    box-shadow: 0 1px 0 #7a5d2e, 0 2px 5px rgba(60, 40, 20, 0.2);
  }

    #scene-text { font-size: 1.08rem; }

/* ============================================================
   音效系統 (Web Audio API 合成)
   ============================================================ */
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      audioCtx = null;
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.08) {
  if (!soundEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function sfxClick() {
  playTone(520, 0.08, 'triangle', 0.06);
  setTimeout(() => playTone(660, 0.06, 'triangle', 0.04), 40);
}

function sfxType() {
  playTone(880 + Math.random() * 200, 0.02, 'square', 0.015);
}

function sfxSuccess() {
  playTone(523, 0.15, 'sine', 0.08);
  setTimeout(() => playTone(659, 0.15, 'sine', 0.08), 120);
  setTimeout(() => playTone(784, 0.25, 'sine', 0.1), 240);
}

function sfxFail() {
  playTone(300, 0.2, 'sawtooth', 0.06);
  setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.06), 150);
}

function sfxJump() {
  playTone(400, 0.1, 'sine', 0.05);
  setTimeout(() => playTone(600, 0.1, 'sine', 0.05), 80);
  setTimeout(() => playTone(800, 0.15, 'sine', 0.06), 160);
  setTimeout(() => playTone(1200, 0.2, 'sine', 0.05), 240);
}

    text: `你跑進後台！尋找躲藏之處，你一頭鑽進道具堆後面，拉過一頂羅馬頭盔蓋住腦袋。

你搖搖頭。

「他剛從愛爾蘭戰場回來，如果傳言屬實，他渾身泥濘、模樣嚇人地衝去見女王。據說她氣壞了——不過女王經常對她的寵臣發怒。」

侍從的服裝！你運氣真好！那會是時光旅人在伊麗莎白宮廷的完美偽裝！

const els = {

/* 打字機效果狀態 */
let typingTimer = null;
let isTyping = false;
let fullText = '';
let typeCallback = null;

function typeText(element, text, speed, callback) {
  if (typingTimer) clearInterval(typingTimer);
  isTyping = true;
  fullText = text;
  typeCallback = callback || null;
  element.innerHTML = '';
  let i = 0;

  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  element.appendChild(cursor);

  typingTimer = setInterval(() => {
    if (i < text.length) {
      // 處理換行
      if (text[i] === '\n') {
        cursor.before(document.createElement('br'));
      } else {
        cursor.before(document.createTextNode(text[i]));
      }
      i++;
      // 每隔幾個字播放音效
      if (i % 3 === 0) sfxType();
    } else {
      clearInterval(typingTimer);
      typingTimer = null;
      isTyping = false;
      cursor.remove();
      if (typeCallback) typeCallback();
    }
  }, speed);
}

function skipTyping() {
  if (!isTyping) return;
  if (typingTimer) {
    clearInterval(typingTimer);
    typingTimer = null;
  }
  isTyping = false;
  // 直接顯示全文
  const temp = document.createElement('div');
  temp.innerHTML = '';
  els.sceneText.innerHTML = fullText.replace(/\n/g, '<br>');
  if (typeCallback) typeCallback();
}

/* Toast 通知 */
let toastTimer = null;
function showToast(message, duration = 2500) {
  els.toast.textContent = message;
  els.toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    els.toast.classList.remove('show');
  }, duration);
}

/* 淡入淡出過渡 */
function fadeTransition(callback, duration = 350) {
  els.fadeOverlay.classList.add('active');
  setTimeout(() => {
    callback();
    setTimeout(() => {
      els.fadeOverlay.classList.remove('active');
    }, 50);
  }, duration);
}

/* 解鎖成就 */
function unlockAchievement(id) {
  if (gameState.achievements.includes(id)) return;
  gameState.achievements.push(id);
  const ach = ACHIEVEMENTS.find(a => a.id === id);
  if (ach) {
    showToast(`🏆 成就解鎖：${ach.name}`);
    sfxSuccess();
  }
  saveGame(true);
}

/* 添加線索 */
function addClue(id) {
  if (!CLUES[id] || gameState.clues.includes(id)) return;
  gameState.clues.push(id);
  showToast(`🔍 獲得線索：${CLUES[id].title}`);
  saveGame(true);
}

/* 添加時間線 */
function addTimeline(year, desc) {
  gameState.timeline.push({ year, desc, time: Date.now() });
}

/* 根據場景解鎖線索 */
function processSceneEffects(sceneId) {
  switch (sceneId) {
    case 'tower_1592':
      unlockAchievement('tower_visitor');
      break;
    case 'tower_1554':
      unlockAchievement('elizabeth_confidant');
      addClue('queen_coronation');
      break;
    case 'greenwich_1582':
      addClue('raleigh_ring');
      unlockAchievement('royal_audience');
      break;
    case 'progress_1598':
      addClue('queen_coronation');
      break;
    case 'tower_essex':
      addClue('essex_ring');
      unlockAchievement('essex_confession');
      break;
    case 'richmond_1603':
      addClue('queen_death_ring');
      unlockAchievement('ring_seen');
      break;
    case 'queen_death':
      addClue('ring_transfer');
      break;
    case 'victory':
      unlockAchievement('victory');
      break;
    case 'madhouse':
    case 'fail_ending':
    case 'essex_rebellion':
      unlockAchievement('defeat');
      break;
  }
  if (sceneId === 'start' && !gameState.achievements.includes('first_step')) {
    unlockAchievement('first_step');
  }
}

/* ============================================================
   渲染場景
   ============================================================ */
function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) {
    console.error('Scene not found:', sceneId);
    return;
  }

  gameState.currentSceneId = sceneId;
  if (!gameState.visitedScenes.includes(sceneId)) {
    gameState.visitedScenes.push(sceneId);
  }

  processSceneEffects(sceneId);

  // 更新頂部狀態列
  els.topEra.textContent = scene.year + ' 年';
  els.topLocation.textContent = scene.location;

  // 更新插圖
  els.sceneImage.innerHTML = getSceneSVG(scene.image);

  // 清空選項
  els.choices.innerHTML = '';

  // 淡入淡出過渡
  fadeTransition(() => {
    // 打字機效果
    const speed = 22;
    typeText(els.sceneText, scene.text, speed, () => {
      // 打字完成後顯示選項
      gameState.phase = GAME_PHASE.CHOICE;
      renderChoices(scene.choices);
    });

    // 添加時間線記錄
    const existing = gameState.timeline.find(t => t.year === scene.year && t.desc === scene.location);
    if (!existing) {
      addTimeline(scene.year, scene.location);
    }
  });

  // 儲存遊戲
  saveGame(true);
}

/* 渲染選項按鈕 */
function renderChoices(choices) {
  els.choices.innerHTML = '';
  if (!choices || choices.length === 0) {
    // 如果沒有選項，自動導向起點
    return;
  }

  choices.forEach((choice, index) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    if (choice.type === 'jump') btn.classList.add('jump-btn');
    if (choice.type === 'danger') btn.classList.add('danger-btn');
    if (choice.type === 'clue') btn.classList.add('clue-btn');
    btn.textContent = choice.text;

    btn.addEventListener('click', () => {
      initAudio();
      sfxClick();

      // 檢查特殊條件
      if (choice.condition && !choice.condition()) {
        showToast(choice.toast || '你無法選擇這個選項。');
        return;
      }

      // 播放跳躍音效
      if (choice.type === 'jump') {
        sfxJump();
      }

      // 禁用所有按鈕
      disableAllButtons();

      // 跳轉
      setTimeout(() => {
        renderScene(choice.next);
      }, 150);
    });

    els.choices.appendChild(btn);
  });
}

function disableAllButtons() {
  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
  });
}

/* ============================================================
   存檔 / 讀檔
   ============================================================ */
const SAVE_KEY = 'timemachine13_save';

function saveGame(silent = false) {
  try {
    const data = {
      state: gameState,
      timestamp: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if (!silent) {
      showToast('💾 遊戲已儲存');
    }
  } catch (e) {
    if (!silent) showToast('儲存失敗：' + e.message);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      showToast('沒有找到存檔');
      return false;
    }
    const data = JSON.parse(raw);
    if (!data.state || !data.state.currentSceneId) {
      showToast('存檔損壞');
      return false;
    }
    gameState = data.state;
    if (!gameState.achievements) gameState.achievements = [];
    if (!gameState.clues) gameState.clues = [];
    if (!gameState.timeline) gameState.timeline = [];
    if (!gameState.visitedScenes) gameState.visitedScenes = [];
    closeModal();
    showToast('📂 讀取存檔成功');
    renderScene(gameState.currentSceneId);
    return true;
  } catch (e) {
    showToast('讀取失敗：' + e.message);
    return false;
  }
}

function hasSave() {
  return !!localStorage.getItem(SAVE_KEY);
}

      <p>在冒險中獲得的關鍵線索會記錄在「線索」面板中。你走過的路線會顯示在「時間線」面板中。</p>

      <h3>🏆 成就系統</h3>
      <p>解鎖不同的結局和發現可以獲得成就。試著找出所有結局吧！</p>

      <h3>💾 存檔功能</h3>
      <p>遊戲會自動儲存進度。你也可以手動存檔或讀取存檔。</p>

      <h3>🔊 音效</h3>
      <p>點擊右上角的喇叭圖示可以開啟或關閉音效。</p>
    `
  },
  clues: {
    title: '🔍 線索筆記本',
    body: () => {
      if (gameState.clues.length === 0) {
        return '<p style="text-align:center;color:#8a6a3a;">還沒有發現任何線索。繼續冒險吧！</p>';
      }
      return gameState.clues.map(id => {
        const clue = CLUES[id];
        if (!clue) return '';
        return `<div class="clue-item">
          <span class="clue-title">📌 ${clue.title}</span>
          ${clue.desc}
        </div>`;
      }).join('');
    }
  },
  timeline: {
    title: '🕰️ 時間線紀錄',
    body: () => {
      if (gameState.timeline.length === 0) {
        return '<p style="text-align:center;color:#8a6a3a;">還沒有任何旅行紀錄。</p>';
      }
      return gameState.timeline.map(t => `
        <div class="timeline-item">
          <span class="t-year">${t.year}</span>
          <span class="t-desc">${t.desc}</span>
        </div>
      `).join('');
    }
  },
  achievements: {
    title: '🏆 成就',
    body: () => {
      return ACHIEVEMENTS.map(ach => {
        const unlocked = gameState.achievements.includes(ach.id);
        return `<div class="ach-item ${unlocked ? '' : 'locked'}">
          <span class="ach-icon">${ach.icon}</span>
          <div class="ach-info">
            <div class="ach-name">${unlocked ? ach.name : '???'}</div>
            <div class="ach-desc">${unlocked ? ach.desc : '尚未解鎖'}</div>
          </div>
          ${unlocked ? '<span style="color:#5a8a3a;font-size:1.2rem;">✓</span>' : ''}
        </div>`;
      }).join('');
    }
  },
  save: {
    title: '💾 存檔管理',
    body: () => {
      const saveInfo = hasSave() ? (() => {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          const data = JSON.parse(raw);
          const date = new Date(data.timestamp);
          return `上次存檔：${date.toLocaleString('zh-TW')}<br>場景：${data.state.currentSceneId}`;
        } catch (e) {
          return '存檔資訊無法讀取';
        }
      })() : '沒有存檔';

      return `
        <p style="margin-bottom:12px;">${saveInfo}</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="choice-btn" onclick="saveGame();closeModal();" style="justify-content:center;">
            儲存遊戲進度
          </button>
          <button class="choice-btn jump-btn" onclick="loadGame();" style="justify-content:center;" ${hasSave() ? '' : 'disabled'}>
            讀取存檔
          </button>
          <button class="choice-btn danger-btn" onclick="if(confirm('確定要清除存檔嗎？')){localStorage.removeItem(SAVE_KEY);showToast('存檔已清除');closeModal();}" style="justify-content:center;">
            清除存檔
          </button>
        </div>
      `;
    }
  }
};

function openModal(key) {
  initAudio();
  sfxClick();
  const content = MODAL_CONTENT[key];
  if (!content) return;
  els.modalTitle.textContent = content.title;
  if (typeof content.body === 'function') {
    els.modalBody.innerHTML = content.body();
  } else {
    els.modalBody.innerHTML = content.body;
  }
  els.modalOverlay.classList.add('show');
}

function closeModal() {
  els.modalOverlay.classList.remove('show');
  sfxClick();
}

function closeModalOnOverlay(e) {
  if (e.target === els.modalOverlay) {
    closeModal();
  }
}

/* ============================================================
   初始化
   ============================================================ */
function init() {
  // 點擊任何地方初始化音頻
  document.addEventListener('click', initAudio, { once: true });
  document.addEventListener('touchstart', initAudio, { once: true });

  // 檢查是否有存檔
  if (hasSave()) {
    // 不自動讀取，但提示
    setTimeout(() => {
      showToast('發現存檔，點擊「存檔」按鈕讀取');
    }, 800);
  }

  // 渲染起始場景
  renderScene('start');
}

window.addEventListener('DOMContentLoaded', init);

// 視窗大小改變時重新渲染（避免手機旋轉問題）
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    // 重新渲染當前場景（不重新打字）
    const scene = SCENES[gameState.currentSceneId];
    if (scene) {
      els.topEra.textContent = scene.year + ' 年';
      els.topLocation.textContent = scene.location;
      els.sceneImage.innerHTML = getSceneSVG(scene.image);
    }
  }, 300);
});

</script>
</body>
</html>
