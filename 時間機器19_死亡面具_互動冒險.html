<script>
const SCENES=[{"id": 16, "bookPage": 1, "text": "你正靠在墨西哥帕拉爾（Parral）一條窄巷裡斑駁剝落的灰泥牆上。這天正是潘喬·維拉（Pancho Villa）遇刺的日子——1923 年 7 月 20 日。天氣酷熱。你的降落揚起一陣塵土，嗆得你喉嚨乾澀、眼睛刺痛。就在你臉旁，一張破損的「¡Revolución!」（革命！）海報在盛夏熱氣中垂落。你撕下一片粗糙的紙，用它擦去額頭的汗水。塵埃落定後，你環顧四周。你身處一排建築物的後方。一群農民堵住了巷口。他們似乎正在觀望街上某種騷動，背對著你。有些婦女在哭泣。男人們抓著他們巨大的寬邊帽，低著頭。你走到他們身後，踮起腳尖想看清他們在看什麼。在巷子外的街道上，一輛道奇（Dodge）敞篷車卡在路緣上。車身彈孔累累，座椅上血跡斑斑。一位老婦人發現了你。「這條巷子裡本來沒人！」她指責地說。「你為什麼偷偷摸摸躲在後面？」「我從沒見過你，」其中一個男人補了一句。「也許你是政府的間諜，嗯？來確認我們的潘喬真的死了？」所以一切都結束了。維拉死了。至少你來對了地方。但那農民正朝你逼近，而且來意不善。「那些凶手假扮成農民，就像我們一樣，」那老婦人喊道……", "options": [{"label": "繼續故事", "to": 17}], "illustration": false}, {"id": 17, "bookPage": 2, "text": "你沿著巷子狂奔，一群憤怒的農民緊追在後。轉過一個彎，你發現一棟建築物後方有一扇厚重的木門。門旁的招牌寫著「伊達爾戈飯店（Hotel Hidalgo）——送貨處」。在你前方，巷子接上了一條街道。但你的去路被兩名士兵擋住了。你可以向士兵求助。他們怎麼會把你當成刺客呢？你只是個孩子！他們說不定還能告訴你維拉的遺體被送到哪裡去了。或者，你可以躲進飯店裡，偷聽裡面的動靜。農民發現你之前，你只有幾秒鐘的時間。立刻選擇！", "options": [{"label": "向士兵求助。", "to": 21}, {"label": "躲進伊達爾戈飯店。", "to": 27}], "illustration": false}, {"id": 18, "bookPage": 3, "text": "侍者。你決定跟侍者上樓。\n\n「我們絕對過不了樓梯上那群人，」他低聲說。「但我知道一條後路。你知道，我在這裡工作。我，安東尼奧·德爾加多（Antonio Delgado），即使和平時期也侍奉我的將軍。維拉將軍擁有這家飯店。我是說，曾經擁有。」他的聲音哽咽了。「這是天大的悲劇，」你輕聲說。「他是個偉人。」侍者點點頭，吞下一聲啜泣。「我帶你去，是因為你長得很像我以前認識的一個人——一個在比較充滿希望的日子裡和我並肩作戰的人。來吧。」你跟隨安東尼奧來到酒館（cantina）附近的一道員工樓梯，爬上二樓。走廊裡擠滿了哀悼者，等著看維拉一眼。安東尼奧帶你穿過一扇門，走進一間昏暗的套房。「這些套房是相通的，」他低聲說。「維拉在隔壁房間。我要回酒館去了。」你推開通往隔壁套房的門，往裡面窺看。六個男人站著守衛，有些人帶著手槍或步槍。通往走廊的門是關著的。潘喬·維拉躺在床上，腹部的新彈孔仍然血肉模糊。你看不見他的臉。他的臉被一位穿黑色西裝的醫生擋住了；醫生捲起袖子，俯身對著遺體。「好了，就是這樣，」醫生輕聲說。他從死者的臉上揭下一片石膏模型。那是死亡面具！你的目光從面具移到死者的臉上。那簡直是一面鏡", "options": [{"label": "繼續故事", "to": 19}], "illustration": false}, {"id": 19, "bookPage": 4, "text": "鏡像，每個細節都一模一樣，從捲曲的頭髮、下垂的鬍子，到額頭上那個新鮮的彈孔。你驚恐地移開視線。醫生把珍貴的面具放在毛巾上晾乾。「我們將永遠有這個來懷念他，」他悲傷地說。「這就是我懷念他的方式！」一名守衛低吼。他握緊手槍，在空中揮舞。「我要槍殺那些刺客！如果是政府下令的，我就親自開槍打死奧布雷貢（Obregón）總統！」醫生生氣地轉向他。「這裡不是談論更多殺戮的地方！」他說。「我們沒有證據證明是政府下令謀殺維拉的。他有許多敵人。不要為了可能不真實的事情再挑起一場戰爭。」「抱歉，」那人嘟囔著。醫生用毛巾包好面具，放進他的皮革醫療包裡。然後他朝你走來！你貼緊牆壁，好讓醫生走進房間時，你藏在門後。突然，維拉死亡房間的門砰地打開！士兵們衝進來，步槍上膛。「聽說你們在為維拉將軍辦派對，」其中一人說。他朝床上冷笑。「一場『面具』舞會（mask-erade）！」維拉的手下退成半圓形，圍著他們死去的領袖，手按在槍柄上。看來可能會爆發槍戰！你從藏身處慢慢把門推上，好讓士兵們看不見醫生。醫生沒等你表明身分！一瞬間，他溜進走廊，消失在酒館旁的後樓梯下。你最好追上他！", "options": [{"label": "跟蹤醫生。", "to": 23}], "illustration": false}, {"id": 20, "bookPage": 5, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 21}], "illustration": true}, {"id": 21, "bookPage": 6, "text": "你朝街道奔去，喊叫的農民緊跟在你身後。但當他們看見堵住巷子的士兵時，便放慢腳步，把聲音壓成憤怒的嘟囔。「全部站住！」兩名士兵中較高的那個命令道。另一名士兵扛起步槍，瞄準你的眉心！「我們奉命守衛這條巷子，」第一名士兵說。「只要潘喬·維拉還停放在伊達爾戈飯店，任何想通過的人都得接受搜查。你先！」他粗暴地抓住你的肩膀，對你搜身。「這個人身上乾淨，」他說著把你推到一邊。追你的那個農民看到你沒有武器，向你投來一個歉意的眼神。士兵逐一搜查其他農民。「畜生！你們一點敬意都沒有嗎？」老婦人厲聲說，把黑披肩緊緊裹在肩上。第二名士兵把步槍對準她。「閉嘴，老太婆，」他吼道。「你們到底都跑到後面來幹什麼？如果你們是等醫生帶著維拉的死亡面具出來，那就別想了。我們的隊長已經派人進飯店去毀掉它了。」「別以為你能從這邊把面具偷運出去，」第一名士兵補充道。「巷子另一頭也派了人。讓我給你一句忠告。潘喬·維拉死了。讓革命跟他一起死吧。我們不想再打仗了，而那面具只會成為那些……", "options": [{"label": "繼續故事", "to": 22}], "illustration": false}, {"id": 22, "bookPage": 7, "text": "……想再煽動起一切的人。」嘟囔著的農民仍帶著懷疑打量你，然後沿著巷子往來時的方向走去。現在你能幫上忙的唯一方法，就是找到維拉的死亡面具。如果士兵先找到它，他們會把它毀掉！你越過士兵望向外面的街道。一個穿著白圍裙的男人正在打掃他雜貨店的前廊。招牌上寫著「諾德瓦爾德雜貨店（Nordwald's Mercantile）」。那人擦了擦臉頰上的淚水。他一定是在哀悼維拉。也許他能告訴你，他們究竟把維拉的遺體送到哪裡去了。", "options": [{"label": "溜進伊達爾戈飯店，尋找士兵提到的那位醫生。", "to": 27}, {"label": "去看看諾德瓦爾德的雜貨店。", "to": 33}], "illustration": false}, {"id": 23, "bookPage": 8, "text": "你跟隨士兵們走進酒館，那裡瀰漫著菸草和啤酒的氣味。昏暗的房間裡擠滿了哀傷的悼念者。你在門廳看見的那兩名士兵坐在悶熱房間後方的一張桌旁。他們的軍裝外套搭在椅背上。你悄悄繞到他們身後，站在陰影裡。「明天維拉的弟弟會來認領遺體，」一名士兵說。「如果他鬧事，我們就收拾他——還有所有維利斯塔（Villistas），」另一名回答。一名吉他手狂野地撥著琴弦，一位美麗的女子在桌間起舞。淚水從她臉頰滑落。「我丈夫在萊昂戰役（Battle of León）中陣亡，」她對觀眾說。「為了紀念他，我拿起他的步槍，代替他作戰。如今我們的領袖維拉將軍走了，我能紀念他的唯一方式，就是唱頌他勝利的歌謠（corridos）。這是一首老歌……」她開始唱。你認得那個曲調。是〈La Cucaracha〉——但歌詞已經改了。\n\n「我要用卡蘭薩（Carranza）的鬍鬚編一條新頭帶，為我的將軍潘喬·維拉的寬邊帽繫上！」", "options": [{"label": "繼續故事", "to": 24}], "illustration": false}, {"id": 24, "bookPage": 9, "text": "觀眾中一名農民悲傷地笑了。「我們以前在南方也唱這首歌，唱的是另一位革命英雄。他也是被暗殺的。」那人唱道：\n\n「我要用卡蘭薩的鬍鬚編一條大套索，為我的將軍薩帕塔（Zapata）套一匹新馬！」\n\n觀眾深受感動，他們的聲音憤怒地騷動起來。房間後方的兩名士兵在椅子上不安地挪動。吉他手再次彈奏，房間安靜下來。你對面的角落裡，一扇門無聲地打開了。你瞥見那位穿黑西裝的醫生。他提著一個皮革醫療包。他的衣服上有白色粉末狀的汙漬。石膏！他一定拿到了死亡面具！醫生無聲地向樂手和舞者點頭示意，然後消失在門後。你希望士兵們沒注意到，便悄悄朝那個角落移動。然後你溜進門，來到一個堆滿啤酒箱的房間。醫生正要爬進地板上的活板門！他的醫療包打開放在地上，他手裡拿著面具！「等等！我想幫忙！」你低聲說。醫生嚇了一跳，轉過身看見你。「你是誰？」他質問。「你想要什麼？」「面具，」你告訴他。「我想幫你把它藏起來。外面的士兵——他們想毀掉它！」「你是政府特務，」醫生說。「或者更糟，是個想把它賣掉的賊！明天我要把面具交給將軍的弟弟。」「他也有危險！」你堅持道。「我只會把面具交給維拉將軍本人信任過的人，」醫生回答。「你有什麼證據？你甚至不是多拉多（Dorado）！」什麼是多拉多？你正要問，這時酒館裡的吉他手……", "options": [{"label": "繼續故事", "to": 25}], "illustration": false}, {"id": 25, "bookPage": 10, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 26}], "illustration": true}, {"id": 26, "bookPage": 11, "text": "……狂野地撥了一個和弦，醫生便從你身邊抽身。「那個和弦——是信號！」他說。「別跟著我。如果他們問起，你就說沒見過我！」他抓起包，消失在活板門後。聯邦軍士兵（Federal soldiers）衝進來找你。「醫生在哪裡？」他們質問。「我們知道他在製作死亡面具。他往哪邊走了？」「我誰也沒看見！」你說。「我只是在找洗手間！」你從半信半疑的士兵身旁溜過，找到一個可以跳躍的黑暗角落。看來你最好成為一名多拉多——不管那是什麼。首先，你得找到潘喬·維拉。但你能做什麼來贏得他的信任呢？也許你可以向另一位革命英雄——歌裡唱的那位——薩帕塔，尋求一些建議。", "options": [{"label": "跳回二十九年前，尋找維拉。", "to": 29}, {"label": "跳回九年前，尋找薩帕塔。", "to": 41}], "illustration": false}, {"id": 27, "bookPage": 12, "text": "一瞬間，你溜進伊達爾戈飯店，悄悄關上身後的門。你身處一個大廚房後方的昏暗儲藏區。一個身材魁梧的女人正從巨大的烤爐裡取出玉米麵包。突然她的背僵住了。她抓起一把切肉刀，猛然轉身對著你！「滾出我的廚房，你這個小鬼！」她斥責道。「將軍還停放在樓上，你怎麼還敢想偷食物？」她手持切肉刀朝你走來，你驚訝得張大了嘴。你的眼睛左右亂瞟，發現自己被困住了。你不想從來時的路退回去！「拜、拜託，夫人，」你開口說。那魁梧女人的表情軟化成一個微笑。「可憐的孩子，」她說。「你只是想來致意，對吧？」你用力點頭！女人把切肉刀砍進一塊木頭裡，遞給你一片溫熱的玉米麵包。「將軍總希望窮人也能吃飽，」她說。「現在去吧，穿過那些門。」你穿過擁擠的餐廳，來到更加擁擠的門廳，形形色色的人們在寬闊的樓梯上排著隊。攝影師擺弄著他們的器材，穿制服的聯邦軍士兵混在人群中。「醫生現在就在樓上！」一名士兵對另一名說。「如果他做了面具，我們就直接毀掉它。」他和他的同伴……", "options": [{"label": "繼續故事", "to": 28}], "illustration": false}, {"id": 28, "bookPage": 13, "text": "……穿過另一組門，走進一個標著「酒館（CANTINA）」的房間。門一打開，你就聽到音樂和跺腳聲。「你想見將軍嗎？」一個男人問你。他穿著侍者制服，看起來大約二十歲。「跟我上樓吧。」", "options": [{"label": "跟侍者上樓。", "to": 18}, {"label": "跟著士兵進入酒館。", "to": 23}], "illustration": false}, {"id": 29, "bookPage": 14, "text": "你站在 1894 年杜蘭戈（Durango）的一片玉米田裡。熱氣令人窒息。熱浪一波波升起，讓周圍的一切都閃爍晃動。農民在玉米行列間移動，採摘兩英尺長的玉米穗——是你習慣的兩倍長。男人穿著破爛的白褲子，女人穿著褪色的連衣裙。有些工人是孩子；還有些因年邁而駝背。他們全都看起來筋疲力盡。他們眼神空洞。除了眼前的玉米，什麼也看不見。沒有人注意到你。田邊一個穿黑衣的男人騎在馬上發號施令。他不時抽響一條看起來很兇的牛鞭。「快幹活，你這隻懶蟑螂！」他對一個農民吼道。然後他踢馬前進，在玉米行列間穿梭。啪！他的鞭子抽響。「你！你在看什麼？」他在跟你說話！「抱歉，先生，」你說。「我只是想問問，你認識潘喬·維拉嗎？」這下輪到騎馬的人瞪眼了。他把馬帶到你身旁，然後用沾滿泥的馬靴把你踢倒在地。「像我這樣的工頭，怎麼會認識他那種骯髒的土匪？」他回答。「再說，他早就死了。現在回去幹活！」維拉死了？可現在是 1894 年！他還只是個少年！那騎馬的人是什麼意思？你爬起來，拍掉衣服上的泥土，開始採摘。也許如果你幫農民幹活，他們會幫你解開這個新謎團。", "options": [{"label": "繼續故事", "to": 30}], "illustration": false}, {"id": 30, "bookPage": 15, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 31}], "illustration": true}, {"id": 31, "bookPage": 16, "text": "「你一定是新來的，」在你旁邊幹活的男孩說。「沒人敢那樣跟工頭說話。你運氣好，他正盯著瑪蒂娜（Martina），不然你早就挨鞭子了！」他朝一個漂亮的深髮女孩點了點頭。黃昏時，你和其他工人拖著腳步回家。工頭騎著馬，像趕牛一樣把你們趕在一起。你們穿過一道華麗的鐵門，門上寫著「里奧牧場（Rancho del Rio）」。牧場的主屋像城堡一樣坐落在長長車道的盡頭。看起來涼爽又誘人。但農民的家是穀倉不遠處幾間發臭的草皮小屋。有些婦女去取晚飯時，你癱倒在屋外地上。名叫瑪蒂娜的女孩遞給你一個裝滿黑咖啡的陶杯、一小碗辣椒，以及一張薄餅般的玉米餅，裡面包著豆泥。這是你和其他人一整天僅有的食物，你咬了一大口。哎呀！你的嘴著火了！辣椒太辣，你開始嗆咳。在田裡遇到的男孩拍拍你的背。「喝點這個，」他說著遞給你一個杯子。你喝了一口。飲料味道苦澀，你立刻感到頭暈。「這是什麼東西？」你問。「是啤酒，用全杜蘭戈最好的龍舌蘭（maguey）仙人掌釀的！它能安撫你的胃，讓你入睡。我們每天晚上都喝。」原來牧場主人就是這樣控制工人的！他們被威脅、毆打、吃不飽，還被酒精麻痹心智！你把杯子放到一邊。「我爸爸說，總有一天會有一場大革命，」男孩夢囈般地說。「那時農民將擁有他們耕作的土地，我們會有更多吃的……」那工人的眼皮垂了下來。你從一張臉看到另一張臉。如果潘喬·維拉生於 1878 年，他現在應該大約十六歲。但這裡沒有他的蹤影。「這裡沒有人叫維拉嗎？」你問那個昏昏欲睡的男孩。「潘喬·維拉真的死了嗎？」", "options": [{"label": "繼續故事", "to": 32}], "illustration": false}, {"id": 32, "bookPage": 17, "text": "「我想是真的，」男孩說。「維拉是個住在山裡的土匪。你何不去問瑪蒂娜·阿蘭戈（Martina Arango）？她比我年長，知道得更多。」你應該留在里奧牧場詢問瑪蒂娜？還是應該跳向未來，到另一座莊園（hacienda）尋找維拉？", "options": [{"label": "留在里奧牧場。", "to": 37}, {"label": "到另一座牧場尋找潘喬·維拉。", "to": 46}], "illustration": false}, {"id": 33, "bookPage": 18, "text": "雜貨店。你穿過街道，走向那家雜貨店。\n\n「抱歉，先生，」你對那個穿圍裙的男人說。「你是諾德瓦爾德先生嗎？」「我是奧托·諾德瓦爾德（Otto Nordwald），」那人回答。「有什麼能為你效勞的？」「你認識潘喬·維拉嗎？」「他是我好朋友，」那人回答。「維拉將軍和他最信任的手下曾多次坐在這個門廊上。」「我聽說他們正在為潘喬·維拉製作死亡面具，」你隨口說。「是的，醫生現在一定在樓上陪著他，」諾德瓦爾德說。「那會是國寶。」「士兵們想毀掉它。」「那會是巨大的損失，」諾德瓦爾德說。「如果我有那個面具，我會把它鎖起來，直到這個國家安定下來。但我離不開我的店。如果你見到了，回來告訴我它長什麼樣。」「我會的！」你答應道。你確認士兵們沒在看，便從伊達爾戈飯店的後門溜了進去。", "options": [{"label": "進入伊達爾戈飯店。", "to": 27}], "illustration": false}, {"id": 34, "bookPage": 19, "text": "現在是 1919 年 4 月 10 日。你在莫雷洛斯（Morelos），走過奇納梅卡莊園（Hacienda Chinameca）厚實的外牆。現在是下午，天氣炎熱。一群人正在莊園大門外的樹蔭下休息。他們戴著大草帽、穿著白衣，身旁放著卡賓槍。人群中間坐著薩帕塔將軍！你在人群邊緣坐下。一名薩帕塔派（Zapatista）成員禮貌地向你點頭。「經過這麼多戰鬥，能放鬆一下真好，」他說。「來聽我們偉大的將軍說話，嗯？他剛巡邏回來。我們接到報告說附近有卡蘭薩派（Carrancistas）——政府軍！」「你們為什麼坐在牆外，而不是裡面？」你問。「瓜哈爾多上校（Colonel Guajardo）在裡面為我們的將軍準備歡迎會。瓜哈爾多正加入薩帕塔事業。昨天，他送給薩帕塔將軍一匹好馬——看見了嗎？」他指著一匹漂亮的栗色馬。「她叫『金王牌』（Golden Ace）。」薩帕塔起身，跨上馬。奇納梅卡莊園的大門打開了。「十個人，跟我來！」薩帕塔命令道。一個女人跑到薩帕塔身邊，抓住他的馬鞍。「將軍，請別去，」她懇求。「山裡有人說有暗殺你的陰謀。萬一瓜哈爾多是暗地裡為卡蘭薩工作呢？」莊園牆內響起三聲號角。「你聽到了嗎？」薩帕塔說。「這是榮譽號。沒有真正的……", "options": [{"label": "繼續故事", "to": 35}], "illustration": false}, {"id": 35, "bookPage": 20, "text": "……男人會把另一個人當作貴客請到家中，然後冷血地開槍打死他。」你從莊園大門望進去，可以看見瓜哈爾多的手下排成兩列，數百人列隊，舉槍向薩帕塔將軍致敬。當薩帕塔和他的手下騎馬穿過大門時，瓜哈爾多的士兵放下武器，然後開火！薩帕塔站在馬鐙上，雙臂張開，身體被子彈打得千瘡百孔。然後他重重摔在地上。門外的薩帕塔派成員四散奔逃，瓜哈爾多的手下繼續開火追擊。你驚恐得動彈不得。但穿著農民服裝的你，看起來就像薩帕塔派。你最好離開這裡！", "options": [{"label": "在被槍打中之前跳躍！", "to": 43}], "illustration": false}, {"id": 36, "bookPage": 21, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 37}], "illustration": true}, {"id": 37, "bookPage": 22, "text": "你坐在里奧牧場一間草皮小屋外的地上。瑪蒂娜·阿蘭戈朝你走來。「你最好睡一會兒，」她說。「工頭說如果明晚之前玉米沒採完，所有人的口糧都要減半。」「為什麼大家不離開？」你問。她悲傷地笑了笑。「你一定是剛到杜蘭戈！我們沒錢，怎麼走得了？里奧牧場的園主（patrón）用金屬圓片付我們工錢，不是錢。那些圓片只在他的牧場裡有用。每一張玉米餅、每一杯水都要花錢。我們欠債越來越多。」幾個背著套索和馬鞍的年輕人拖著腳步朝小屋走來。「那是我哥哥多羅特奧（Doroteo）和其他牛仔！」瑪蒂娜說。一個頭髮蓬亂、身材敦實的少年閒晃著朝你走來；他因為一輩子騎馬而走路外八字。多羅特奧·阿蘭戈——當然！就是維拉！他臉上沾滿灰塵，鬍子才剛開始長。「不管我們馴服多少匹野馬，老闆都說不夠，」他一邊拍掉皮套褲上的灰塵，一邊對瑪蒂娜說。瑪蒂娜把豆泥舀到玉米餅上，遞給哥哥。他一口就吞掉半張玉米餅。工頭騎馬從漸深的夜色中出現，抽響鞭子。「睡覺時間到了！」他喊道。「全部進去！」", "options": [{"label": "繼續故事", "to": 38}], "illustration": false}, {"id": 38, "bookPage": 23, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 39}], "illustration": true}, {"id": 39, "bookPage": 24, "text": "工人們沒有抗議。你跟隨多羅特奧、瑪蒂娜和其他幾人。小屋是泥土地面，幾乎空無一物，只有角落裡掛著一幅褪色的聖母像。有些工人畫了十字，躺在草蓆上。工頭從外面把門閂上。空氣悶熱。房間太擁擠，有些工人只能站著睡。你蜷縮在角落，因為蟑螂和甲蟲而不敢閉眼。但你一定睡著了，因為你猛然驚醒。工頭打開了門，送進一股宜人的夜風。在他身後，月光下映出一個騎著種馬的男人的剪影。你判斷他一定是牧場主人。「糟了，」多羅特奧低聲說。「是園主！」工頭大步走進小屋，抓住瑪蒂娜的手腕。「輪到你了，」他低吼，把她拉起來。「園主要你做妻子！」多羅特奧像箭一樣跳起來。「園主已經有妻子了！」他說。瑪蒂娜想掙脫，眼裡滿是恐懼。工頭把手槍抵在她太陽穴上，把她拖出門。多羅特奧跟了出去，你緊跟在他身後。「等你玩膩了就會把她扔出去，你這個畜生，」他對園主大喊。工頭放開瑪蒂娜的手臂，朝多羅特奧撲來。多羅特奧像一頭憤怒的豹子撲到那人身上，爭奪手槍。一聲槍響。園主抓住胸口，從馬上栽倒！工頭一動不動地躺在地上，多羅特奧站起來，手裡握著槍。「他們會為這件事絞死我，」多羅特奧說。「都是因為我！」瑪蒂娜哭道。「躲到山裡去——這是你唯一的機會！」工頭呻吟著開始甦醒。多羅特奧親吻妹妹，然後飛奔穿過月光籠罩的莊園。幾個……", "options": [{"label": "繼續故事", "to": 40}], "illustration": false}, {"id": 40, "bookPage": 25, "text": "……農民從小屋裡蹣跚走出，把受傷的園主抬往主屋。「你也最好離開這裡，」瑪蒂娜說。「你目睹了整個過程。如果他們找不到我哥哥，他們會絞死你！」你溜進黑暗中。也許你最好在維拉生命稍晚的時候去找他。所有關於他的傳說都說，他在杜蘭戈和奇瓦瓦（Chihuahua）的山裡當了多年土匪。而現在，他正朝山裡去！但你該往前跳多遠？", "options": [{"label": "跳到 1910 年，留在杜蘭戈。", "to": 43}, {"label": "跳到 1912 年的奇瓦瓦州。", "to": 58}], "illustration": false}, {"id": 41, "bookPage": 26, "text": "你在庫埃納瓦卡（Cuernavaca），莫雷洛斯州的首府，位於墨西哥南部。現在是 1914 年 10 月 20 日傍晚。一間看起來很忙碌的店面辦公室裡亮著燈。你走進去，向一位年輕職員詢問薩帕塔總部怎麼走。「誰在找埃米利亞諾·薩帕塔（Emiliano Zapata）？」一個從後室走出來的瘦削男人問道。他皮膚黝黑，有一雙銳利的棕色眼睛和一大撇黑鬍子。「是我，」你說，並自我介紹。「我想問他有關潘喬·維拉的事。」「我就是薩帕塔，」那人說。「如果你是來邀請我在阿瓜斯卡連特斯（Aguascalientes）會議之前與他會談，我已經同意了。」「那太好了！」你回答。他一定以為你是維拉派來的信使！「確實，」薩帕塔說。「既然韋爾塔（Huerta）將軍已經逃離這個國家，我們只剩下卡蘭薩要對付。也許還有奧布雷貢。弗朗西斯科·維拉和我在為同一個目標努力，他在北方，我在南方。我們都想把土地歸還給合法的主人。我期待與他見面！」看來薩帕塔無法就如何贏得維拉的信任給你建議——他們甚至還沒見過面！「他們說維拉在里奧牧場的童年比我還慘，」薩帕塔繼續說。「但我記得，當一座有錢的莊園奪走屬於我們村莊的果園時，我有多憤怒。我發誓，不把它要回來，我絕不罷休。」", "options": [{"label": "繼續故事", "to": 42}], "illustration": false}, {"id": 42, "bookPage": 27, "text": "「你已經奮戰了很久，也很艱苦，」你說，希望自己說對了話！「流了很多血，」薩帕塔同意。「但就在五年前，在墨西哥城，我還在為一個有錢人工作，他的馬廄比大多數人的房子還華麗。現在數千人跟隨我上戰場！我們取得了很大進展！但我渴望能平靜地在自己的田裡耕作。也許五年後吧。」他匆匆離去，準備會議。你溜回街上。你可以跳到薩帕塔與維拉會面的時候。但這些人都是誰——卡蘭薩？奧布雷貢？你最好多了解一些。你可以往前跳五年。也許那時薩帕塔能幫你——維拉還有四年可活。或者你可以去里奧牧場找年輕的維拉。", "options": [{"label": "往前跳到 1919 年的莫雷洛斯。", "to": 34}, {"label": "往回跳到 1894 年的里奧牧場。", "to": 29}], "illustration": false}, {"id": 43, "bookPage": 28, "text": "你在杜蘭戈，位於分隔杜蘭戈與奇瓦瓦的馬德雷山脈（Sierra Madre）腳下。你可以看見遠處有一大群牛在吃草。現在是 1910 年。山丘間迴盪著不絕於耳的雷聲，但天空晴朗。滾滾雷聲越來越響。是騎馬的人！他們從山丘上奔馳而下！騎手們轟隆隆地從你身旁經過。他們戴著寬邊帽，胸前交叉掛著子彈帶。是土匪！這群人的首領把馬從隊伍中拉出來，騎回你面前。是潘喬·維拉！「你在這裡做什麼？」他質問。「你以為你能窺探我的一次襲擊嗎？你不知道我是全墨西哥最偉大的土匪嗎？」「是的，先生，維拉先生！」你回答。「我不是間諜。我想加入你的隊伍！」「離家出走，嗯？」維拉咕噥。「受夠了殘酷的園主？我自己也曾離家出走……」他停頓了一下。「那就上來吧。」維拉把你拉上馬鞍，坐在他身後，然後你跟著其他土匪奔馳而去。你在馬鞍上顛簸，死死抓住維拉。五分鐘後，你的腿就痠痛不已，屁股也瘀青了！維拉雙手各持一把手槍，朝空中開火。「亡命之徒！」幾個看守牛群的人喊道。他們沒有抵抗就騎馬逃走了。你大部分時間都坐在潘喬·維拉身後的馬鞍上，而……", "options": [{"label": "繼續故事", "to": 44}], "illustration": false}, {"id": 44, "bookPage": 29, "text": "……他和手下把牛群趕到偏遠山麓的藏身處，牛群一路哞哞叫、噴著氣。你在露天下紮營，接下來大半天都在觀看維拉和手下宰牛，把肉攤在太陽下曬乾。新鮮血液的氣味濃烈得令人難以忍受，但漸漸地你也習慣了。你試著想出能贏得維拉信任的辦法。但你沒有能幫上忙的技能。傍晚時分，維拉想起了你。「你騎馬實在不怎麼樣！」他笑著說。「你一定是個田裡幹活的。我嘛，我是牛仔。但和你一樣，我離家出走，加入了一夥亡命之徒。我用一個著名土匪的名字，把自己的名字改成弗朗西斯科·『潘喬』·維拉。現在我出名了，人們都怕我！但我不是普通的賊。我只偷有錢人，而且我幫助窮人。這就是賊和土匪的差別！」「這些牛是誰的？」你問。「這些牛曾在杜蘭戈和奇瓦瓦的土地上自由遊蕩，」維拉回答。「但後來獨裁者波菲里奧·迪亞斯（Porfirio Díaz）把這些土地賜給他的親信——有錢的牧場主。他們把牛據為己有。我只是把它們收回來，你懂嗎？」「但你要怎麼處理這麼多肉？」你問。「我會把肉賣掉，用錢買武器和彈藥，」維拉說。「這樣我的手下就有足夠的槍，可以劫下整列火車的貨物，運過邊境換取更多槍枝和補給。你懂嗎？」「你在聚集一支軍隊嗎？」你問。「目前，我要回我在奇瓦瓦城的小土屋，」維拉說。「但之後我會到山裡去，召集人馬為新總統——弗朗西斯科·馬德羅（Francisco Madero）——而戰。他是個為人民而戰的有錢人。個子小小的——但他有偉大的靈魂。」「我能加入你嗎？」你問。如果你加入革命，一定能贏得維拉的信任！「你騎馬不太行，」維拉說。「你會開槍嗎？你勤快嗎？」他抓住你的手，翻過來看。然後他瞪著你，眼睛瞇了起來。", "options": [{"label": "繼續故事", "to": 45}], "illustration": false}, {"id": 45, "bookPage": 30, "text": "「你根本不是田裡幹活的！你的手很光滑！也許你是來監視我的！」維拉甩開你的手，拔出手槍。「你還年輕。我給你一個機會，在我開槍前跑掉！」他冷笑著說。「現在滾！」你拼命跑，跑到一頭牛的屍體後面躲起來。槍聲響起，你及時跳躍。", "options": [{"label": "跳到 1912 年的奇瓦瓦。", "to": 58}], "illustration": false}, {"id": 46, "bookPage": 31, "text": "現在是 1921 年夏天。你站在潘喬·維拉牧場上一棟小土屋旁。這座牧場看起來像一個繁忙的小村莊。除了那棟巨大的白色主屋，你還看到幾家商店、一間電報局和一座小禮拜堂。遠處田野裡有現代化的農機，一切看起來都乾淨整潔、維護良好。「你病了嗎？」一個女人的聲音說。「沒有！」你驚訝地回答。一個女人從土屋裡走出來，好奇地看著你。「我看起來像病了？」「你看起來很好！」她笑了。「但你站在醫務室旁邊。你應該在學校才對！來吧，我陪你走。」「我想我們沒見過面，」她繼續說。「我是索萊達（Soledad），維拉將軍的妻子之一。」「之一？」你問。「哦，是的，」她微笑著說。「我們有三個人住在卡努蒂約莊園（Hacienda Canutillo）。我聽說還有其他人。但我們相處得很好。他是個偉人，想要很多孩子。你不是他的孩子吧？」「不是！」你說。「但我想見見他！」你不用等太久。潘喬·維拉站在校舍的台階上，對一群圍著他的工人講話。他身材敦實、走路外八字，在大鬍子後面笑得很開。「學校終於建好了！」他揮著手槍說。「很快它就會有一口鐘！你會聽到它響，就像這樣！」他把手槍藏在背後，射擊屋頂上的風向標……", "options": [{"label": "繼續故事", "to": 47}], "illustration": false}, {"id": 47, "bookPage": 32, "text": "……新校舍，讓它轉動起來。人群鼓掌歡呼。「這就是你們如此英勇奮戰的目標，我的弟兄們，」維拉宣布，「還有你們勇敢的隨軍婦女（soldaderas）妻子們。我的莊園三分之二現在歸你們耕種。終於，卡努蒂約的每個孩子都會有未來！」「聽聽我丈夫說的，」索萊達低聲對你說。「他是全墨西哥最偉大的人！」「我在杜蘭戈一個有錢人的農場裡像狗一樣幹活長大，」維拉繼續說。「那時根本沒想過受教育。最後我逃跑了。我在杜蘭戈的山裡躲了十年。我把名字改成一個土匪的名字，好讓人們怕我。我搶劫、殺人，只為了活下去。為了生存，我吃響尾蛇和甲蟲，甚至吃頭髮裡的蝨子。」「聽起來太可怕了！」你對索萊達低聲說。「比你能知道的還要糟，孩子。」索萊達悲傷地搖頭。「他父親被活活累死，然後他母親為了阻止有錢的老闆把他弟弟抓去當兵，被活活踢死。還有他妹妹……」她的聲音漸弱。「非常悲慘。」「但現在艱難的歲月和戰爭都結束了，」維拉說。「我有一個好地方。我是個好人，不是嗎？」他咧嘴一笑，像公雞一樣昂首闊步。「我妻子索萊達教我讀書寫字。你和你的孩子們也一起來吧。我們要一起打一場新革命！」他用手指敲敲自己的頭。「一場心靈的革命！」男人、女人和孩子們魚貫走進新大樓。維拉將軍驕傲地從門廊看著。你決定跟他說話。「維拉將軍？」你開口。一個拄著拐杖的高個子年輕人把你推到一邊。「嘿！」你抗議。你大老遠來跟潘喬·維拉說話，準備把這年輕人推回去！突然，年輕人從拐杖上拔下手柄，對準維拉。你看到金屬閃光。是槍！「小心！」你對維拉大喊，同時用盡全力撲向那個男人……", "options": [{"label": "繼續故事", "to": 48}], "illustration": false}, {"id": 48, "bookPage": 33, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 49}], "illustration": true}, {"id": 49, "bookPage": 34, "text": "……撲向那個男人。那人失去平衡倒在地上，槍朝空中開火。你滾倒在他身上。等你爬起來時，維拉已經把手槍對準那年輕人的頭。你撿起拐杖，遞給將軍。男人們從校舍裡衝出來，把闖入者帶走。「我的敵人甚至追到我的退休生活裡，」維拉嘆了口氣說。「也許革命對我來說永遠不會結束。我感謝你，我的年輕多拉多，救了我的命。」年輕多拉多？維拉似乎在哪裡認識你！他爬上學校的台階。「請在這裡等一下。我想給你一份獎賞。」片刻後，維拉回來了。「這是一份能伴你一生的寶藏，」他說。「我給你一個未來。」他遞給你一本書。是一本初級讀本。「ARBOR（樹），」你讀著，在一棵樹的圖片下方；「BALÓN……CASA……DIARIO……」「謝謝你，將軍，」你對他說。維拉給了你一件你知道他看得比所有財產都重要的東西。但這對醫生沒用。維拉什麼時候讓你成為多拉多的？也許你應該在維拉比較不關心教育的時候去找他！", "options": [{"label": "跳回 1894 年的杜蘭戈。", "to": 37}, {"label": "去找當土匪的維拉。", "to": 43}], "illustration": false}, {"id": 50, "bookPage": 35, "text": "你決定在鬥雞場多待一會兒。也許你能再發現那個冒牌貨的一些事，好告訴真正的維拉。你尋找那個假扮維拉的男人。他看著人群，有人正把另一隻鬥雞放進場中。「我押那隻小褐雞，」一個賭客說。「牠看起來很快！」「你瘋了！」另一個說。「大黑白雞，五賠一。」大多數旁觀者都押較大的那隻鳥，他們以為那是維拉的雞。公雞互相撲擊。鳥兒腳踝上綁著的剃刀般鋒利的銀距閃閃發光。你試著摀住耳朵不聽牠們刺耳的叫聲，閉上眼睛不看那些劈砍的距。「誰要跟我賭那隻受傷的鳥，十賠一？」冒牌貨喊道。他的雞受傷了嗎？你睜開眼睛偷看。但躺在側面拍翅的是那隻褐雞。「維拉」在賭自己的雞輸，那隻看起來穩贏的雞！「我跟你賭！」有人喊。「我也賭！」另一個喊。很快，除了冒牌貨，所有人都在押「維拉」的雞。黑白雞從受傷的鳥身邊退開。倒下的鳥掙扎著站起來，發動攻擊！「維拉」的鳥尖叫一聲，跳上圍欄頂端的鐵絲網，飛出鬥雞場，輸了。你設法抓住了牠。", "options": [{"label": "繼續故事", "to": 51}], "illustration": false}, {"id": 51, "bookPage": 36, "text": "你周圍的人都在厭惡地咒罵。冒牌貨一邊收著大把鈔票，一邊努力不露出得意的神情。「你這條蛇！」一個頭髮灰褐的矮個子男人嘟囔。「你訓練那隻鳥在鬥雞中途飛走，好讓你自己押反注！我損失了一週的薪水！」突然，人群安靜下來，房間的門砰地打開，一個男人跺著腳走進來。那張臉你絕對認得。是真正的潘喬·維拉！「好好看看我，」他說，「這樣你們都會認得我，弗朗西斯科·潘喬·維拉。我以偉大鬥雞人的身分贏得名聲。我靠的是飼養和訓練的技巧，不是卑鄙的伎倆。如果你們蠢到跟這個人下注……那你們活該輸錢。」他慢慢走向冒牌貨。你可以看出，真正的維拉比他的冒充者更高大、更魁梧。「但這個人更活該輸錢！」維拉咧嘴笑著說。冒牌貨試探性地朝腰間摸去，但維拉已閃電般拔出手槍。他把手伸進冒牌貨的口袋，掏出一疊鈔票。「確保把錢都還給他們，」他說著把錢塞給那個頭髮灰褐的矮個子。「你——滾出埃爾帕索（El Paso），在我開槍之前，」他對冒牌貨說。那顫抖的男人一眨眼就不見了。「還有你，」維拉生氣地說，轉向你。他瞇起眼睛。「你怎麼能為那種人工作？」他從你懷裡奪過公雞，在你面前晃著。「下次我們見面，我也會開槍打你！現在滾出去！」你趕緊溜走。事情完全沒照你計劃發展。你最好往回跳一小時左右，確保是由你來告訴維拉冒牌貨的事。", "options": [{"label": "往回跳一小時，去找維拉住的飯店。", "to": 73}], "illustration": false}, {"id": 52, "bookPage": 37, "text": "你在一個擁擠的市集裡，被人從四面八方推擠。你看到商人和顧客穿著纏腰布或裙子，披著用仙人掌纖維染成彩色的斗篷。墨西哥城怎麼了？「烤小狗！」一個攤販吆喝。「只要三顆可可豆！」人們高興地尖叫著衝過去。你決定自己不餓！「這裡是首都嗎？」你問附近一個商人。「特諾奇蒂特蘭（Tenochtitlán），世界的中心！」他驕傲地張開雙臂。然後他打量你的衣服。他看起來不以為然。「你一定是從很遠的地方來的，」他說。「來參加新年獻祭的？」特諾奇蒂特蘭……獻祭。你一定跳回了將近四百年前！你還在墨西哥城的舊址上，但這些人是阿茲特克人！你最好找個荒涼的地方，跳回二十世紀！你走著走著，可以看出特諾奇蒂特蘭美麗又擁擠！城市中心有宏偉的宮殿和巨大的階梯金字塔，從鋪石的廣場上拔地而起。到處種著樹木和花園。有些花園漂浮在水塘上。與街道平行的，是穿過城市的迷宮般運河。人們乘坐獨木舟，就像開車或搭公車一樣。你轉過一個街角，迎面看到一個延伸到遠方的巨大架子。上面擺滿了人的頭骨——成千……", "options": [{"label": "繼續故事", "to": 53}], "illustration": false}, {"id": 53, "bookPage": 38, "text": "……上萬個！你驚恐地朝反方向走。不久你來到一座全石造的露天競技場。幾個年輕人在場中玩一種類似籃球的遊戲。一大群人在觀看。球員從不用手碰球，而是用膝蓋、手肘和臀部。年輕人為了把球投進頭頂上方的石環，撲倒在石地上，場內觀眾為之歡呼。你看了一會兒，但他們總是投不進，於是你決定加入長長的隊伍，等著爬上其中一座金字塔。你瞇著眼抵擋陽光，打量金字塔頂端的祭壇。那裡有一個死去的印第安人，躺在浸滿鮮血的石塊上！一個全身塗黑的祭司把什麼東西舉向太陽。是一顆人心！「下一個！」祭司喊道。另一名犧牲者被綁上祭壇，隊伍裡每個人都往前一步。你尋找可以逃跑的地方。一個穿著美洲豹皮的守衛把你頂回隊伍裡。現在你仔細一看，才發現到處都是守衛。「別想逃跑，」你前面的女人說。「你沒聽說發生什麼事了嗎？在這種時候被獻祭是種榮耀！羽蛇神（Quetzalcóatl）回來了！祂和祂的眾神從海對岸而來。他們皮膚白皙、頭髮金黃。有些神有四條腿！還有一個圓嘴的僕人會噴煙！」從海對岸來的男人？聽起來西班牙人已經到了，帶著馬和大砲。當然！是埃爾南多·科爾特斯（Hernando Cortés），未來的阿茲特克征服者！「聽！」女人說。「我們的皇帝蒙特蘇馬（Montezuma）命令年輕戰士進行神聖的球賽（tlachtli），慶祝羽蛇神的歸來。」競技場爆出轟鳴。人們又叫又喊，朝金字塔跑去。", "options": [{"label": "繼續故事", "to": 54}], "illustration": false}, {"id": 54, "bookPage": 39, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 55}], "illustration": true}, {"id": 55, "bookPage": 40, "text": "「一定有人把球投進環裡了！」女人說。「他可以拿走他能抓到的任何觀眾的財物！」守衛轉身面對衝來的人群——你趁著混亂拔腿就跑。你跳進一艘停泊在運河邊的空獨木舟，把船推離岸邊。座位上扔著一條毯子或斗篷。你躲到斗篷下，蜷縮在船底。你暫時受夠了墨西哥。你決定前往德州！", "options": [{"label": "跳到 1913 年的德州埃爾帕索。", "to": 80}], "illustration": false}, {"id": 56, "bookPage": 41, "text": "你在墨西哥的首都——墨西哥城——現在是 1913 年 2 月 20 日。城市一片殘破。放眼望去，到處是路障和被洗劫的商店、破碎的窗戶和燒黑的汽車。街上不時躺著腫脹的屍體，無人照料。市民在廢墟中緩慢地擇路而行。人們看起來驚魂未定；他們的臉和燒毀的建築一樣破碎。「發生了什麼事？」你問一位老婦人。她頭上裹著一條沾滿煤灰、曾經優雅的蕾絲披肩。她正撥弄著一堆瓦礫。「你一直躲著嗎？」她問。「韋爾塔將軍從馬德羅總統手中奪取了墨西哥城。別找了——這裡沒有食物。」她悲傷地搖頭。「數千名平民被殺。」她回去繼續手邊的事，撥弄著一棟建築的廢墟。「現在我們得尋找我們的死者。」「等等！」你說。「這持續多久了？」「悲慘的十天，」老婦人回頭回答。「我們稱之為『悲慘十日』（Decena Trágica）。」「再問一個問題，」你說，小跑著跟在老婦人身邊。「你知道我在哪裡能找到潘喬·維拉嗎？」「我最後聽說，他在邊境以北的埃爾帕索，」老婦人說。「但別讓韋爾塔的人聽到你提維拉！現在讓我安靜，或者一起來幫忙。這曾是我女兒的店。我必須找到她的遺體。」", "options": [{"label": "繼續故事", "to": 57}], "illustration": false}, {"id": 57, "bookPage": 42, "text": "「我——我很抱歉，」你說，往後退。你爬過一堵倒塌的牆，尋找可以跳躍的地方。你可以在埃爾帕索趕上維拉。但你的腳被一根電線絆住，跌倒了。那電線連著一根電線桿，正朝你倒下來——還迸著火花！是一條帶電的電線！", "options": [{"label": "跳！", "to": 52}], "illustration": false}, {"id": 58, "bookPage": 43, "text": "你站在奇瓦瓦州希門尼斯（Jimenez）的一條街上。現在是 1912 年夏天。街對面一家飯店前聚集了一群人，你也加入其中。你看著一群穿制服的士兵把一個男人從飯店門口拖出來。那男人裹著毯子，看起來正發燒發冷。是潘喬·維拉！「勇敢點，我的將軍，」你旁邊的男人喊道。「馬德羅萬歲！」維拉虛弱地喊道。「怎麼回事？」你問那個男人。「韋爾塔將軍下令處決維拉！」那人說。「他們要把他帶去槍決！」「為什麼？」你震驚地說。維拉現在死還太早！「維拉幫助馬德羅總統推翻了獨裁者迪亞斯。短短兩年，維拉就集結了一支大軍，贏得許多戰役。馬德羅赦免了他過去所有的罪行，還讓他當上將軍！」「那他為什麼會允許他被槍決？」「馬德羅總統不知道！我們一些維利斯塔已經發電報給首都。但願總統能及時趕到……」你跟著維利斯塔來到城鎮廣場附近一面白牆前。一排行刑隊面對牆站著。一名年輕中尉大步上前，用刺刀在牆上劃了一個 X。「站在那裡！」他命令維拉。「韋爾塔將軍在哪裡？」他問一名士兵。「這個韋爾塔是誰？」你問。", "options": [{"label": "繼續故事", "to": 59}], "illustration": false}, {"id": 59, "bookPage": 44, "text": "「他在那裡，」那名維利斯塔回答。他指向一個目光銳利、姿態挺拔、一看就是終身軍人的軍官。韋爾塔皮膚緊繃粗糙，禿頂，留著整齊的白鬍子。「馬德羅總統任命韋爾塔指揮聯邦軍，」那名維利斯塔解釋。「維拉必須聽命於他。而維多利亞諾·韋爾塔（Victoriano Huerta）恨維拉！你看，我們的維拉將軍不屬於正規軍。韋爾塔說維拉偷了一匹母馬。太荒唐了！那匹母馬是戰利品——韋爾塔將軍的豪華轎車也是這樣得來的！」「我們難道不能做些什麼阻止這件事嗎？」你問。那名維利斯塔搖搖頭。維拉將軍背靠著 X 站著，掏空口袋。他把手錶和錢交給行刑隊的人。「我準備好死了，」他說。韋爾塔將軍簡短地向年輕中尉點頭。行刑隊的人扛起步槍。這時你聽到身後一陣騷動。一個男孩從腳踏車上摔到街上，腳卡在踏板下。他穿著信差制服。電報！「等等！」你對中尉大喊。「有消息！」你奔向倒地的男孩，從他手中奪過電報，跑回聯邦軍中尉那裡。中尉打開電報，迅速讀了一遍。你覺得自己看見他嘴角閃過一絲微笑，他把電報交給韋爾塔將軍。「馬德羅總統饒了你，我的朋友，」他對潘喬·維拉說。「我們要把你押送到墨西哥城的監獄。」人群爆出歡呼。維拉被帶走時朝你眨眼。「你救了我的命，年輕的朋友，」他說。「但恐怕這是我僅剩能給你的東西了。」他遞給你一包潤喉糖。你把它還給他。「你在監獄裡會需要這些的，」你告訴他。「你感冒很嚴重！希望我們再見面時你會好一點！」", "options": [{"label": "繼續故事", "to": 60}], "illustration": false}, {"id": 60, "bookPage": 45, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 61}], "illustration": true}, {"id": 61, "bookPage": 46, "text": "但你應該去首都找他嗎？監獄就在那裡。還是你想去德州試試？你記得，維拉曾在邊境以北待過一段時間。", "options": [{"label": "跳到 1913 年的墨西哥城。", "to": 56}, {"label": "跳到 1913 年的德州埃爾帕索。", "to": 80}], "illustration": false}, {"id": 62, "bookPage": 47, "text": "你已經行軍多日，安東尼奧在你身邊，穿越炙熱的沙漠。維拉的軍隊在你前後像一條蜿蜒的長蛇，在乾涸的大地上留下足跡。終於，由部隊、砲車和補給組成的隊伍抵達薩爾蒂約（Saltillo），一座看起來昏昏欲睡、由白色土磚建築組成的城市。但它沒有沉睡太久。聯邦軍機槍手正在城郊等著你們！他們築了一個機槍巢，堵住進城的主要街道。從外面看，這座防禦工事像一個由沙袋和磚塊堆成的蜂巢。但它子彈的螫刺是致命的。「小心！」安東尼奧喊道，把你拉到一棟磚樓後面。維拉的部隊在機槍火力掃射牆壁、窗戶、招牌和樹木時尋找掩護。你聽到維利斯塔士兵中彈的痛苦尖叫。「在我們拔掉聯邦軍的機槍巢之前，部隊無法再前進多遠，」安東尼奧說。「但除了沿街衝鋒，沒有辦法摧毀那些機槍！」你說。「你不是想讓另一隻手臂也中彈吧？」「安東尼奧·德爾加多不會犯兩次同樣的錯誤。」男孩眨了眨眼。「誰說要沿街衝鋒了？」你決定在建築物牆邊等著，看看安東尼奧要做什麼。他爬開去，很快又拖著一個木箱回來。裡面裝滿了炸藥！「街道都被堵住了，所以我們要在……", "options": [{"label": "繼續故事", "to": 63}], "illustration": false}, {"id": 63, "bookPage": 48, "text": "……街道之間開路——穿過建築物！」安東尼奧說。他把一根炸藥咬在牙齒間——像個嘴裡叼著刀的強盜——然後把另一根埋在磚牆旁。他點燃引信。你們向後跑到一群士兵那裡。「炸藥！」安東尼奧喊道。你們全都趴下。轟！土塊和飛濺的灰泥如雨點般落在你們周圍。塵埃落定後，你抬起頭。牆上炸開了一個大洞！安東尼奧把另一根炸藥靠在建築物遠端的牆上，然後衝離嘶嘶作響的引信。轟！「來吧！」他喊道。你和安東尼奧輪流點燃引信，一路炸開街道前進，直到透過一家店面的窗戶看見機槍巢。士兵們發現了你們！「趴下！」你喊道。子彈掃射建築物，碎玻璃像冰雹般落下。「聯邦軍去死！」維拉的部隊穿過你們炸出的新通道衝鋒時尖叫。「打倒韋爾塔，打倒獨裁者！」你聽到砲擊和機槍掃射的爆響，維利斯塔壓倒了機槍巢。「維拉萬歲！」部隊喊道。「革命萬歲！」戰鬥持續了大半天，但聯邦軍組織渙散，而且比維拉的部隊更加疲憊。槍聲漸漸平息。維利斯塔贏了！勝利計程車兵們滿身汙垢、筋疲力盡，列隊走向鎮公所。維拉將軍坐在裡面一張小桌子後面。「你們打得艱苦又出色，我的部隊，」他說。「今天我們可以把薩爾蒂約——卡蘭薩家鄉州的首府——交給他。明天——墨西哥城！革命的首都！」士兵們又叫又歡呼。「你們都知道勝利後我喜歡什麼！」維拉繼續說。「找到它的人可獲得豐厚獎賞！」維利斯塔又叫又開槍，散佈到全鎮各處。「我知道他想要什麼，」安東尼奧說。「來吧！」你應該留在薩爾蒂約，尋找維拉想要的東西嗎？", "options": [{"label": "繼續故事", "to": 64}], "illustration": false}, {"id": 64, "bookPage": 49, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 65}], "illustration": true}, {"id": 65, "bookPage": 50, "text": "還是你想往前跳到墨西哥城？聽起來維拉正計劃在那裡取得一場大勝利。", "options": [{"label": "留在薩爾蒂約，搜查全鎮。", "to": 95}, {"label": "往前跳到墨西哥城。", "to": 89}], "illustration": false}, {"id": 66, "bookPage": 51, "text": "你在飛馳列車最後一節客車的尾部，列車正從華雷斯城（Juárez）向南疾駛。現在是 1913 年 11 月 15 日。車廂幾乎空無一人。你從椅背望過去，看見幾個打瞌睡的工人和一個矮瘦的列車長，正忙著查看懷錶。你從後窗望出去。一節節裝滿煤炭、堆得滿溢的貨車，在你視線所及之處像蛇一樣向後延伸。突然煞車發出刺耳聲響，幾乎震破你的耳膜，鐵軌上火花四濺，列車猛烈一震停了下來。「是土匪嗎？」列車長尖聲問。「他們人太多了，」工程師從駕駛室喊道。「是一整支該死的軍隊！」你的心興奮地跳動，潘喬·維拉雙手各持一把手槍，登上了列車。「早安，先生們，」他說。「列車長，能否麻煩你發電報給華雷斯的調度室？告訴他們，維拉將軍兇猛的革命軍在奇瓦瓦製造了太多麻煩，你們今天過不去。你們得返回華雷斯。」顫抖的列車長照做了。「好了，弟兄們！」維拉喊道。「卸煤！」這是你加入的絕佳時機。車上的人會以為你是跟維拉一起來的，而維拉的人會以為你本來就在車上！你從車廂後方溜出去，加入正在把煤炭從貨車兩側鏟下去的維利斯塔。", "options": [{"label": "繼續故事", "to": 67}], "illustration": false}, {"id": 67, "bookPage": 52, "text": "很快，鐵軌旁堆起了成山的煤炭。你從頭到腳覆滿黑煤灰，不咳嗽幾乎說不出話。維拉從你的運煤車旁走過。「幹得好！」他喊道。「連我們最年輕的革命者也為我們的事業努力！」他拍了拍你的背，你忍不住一陣猛咳，他則繼續沿著車廂走去。他沒認出滿身灰塵的你。工作終於完成，你拍掉衣服上的煤灰。「全員上車！」維拉喊道。「我們要給華雷斯的聯邦軍一個小驚喜！」你和維拉的幾名手下一起上車。列車一震，朝埃爾西烏達德華雷斯（El Ciudad Juárez）駛回。但這次它的貨物是革命士兵！「維拉將軍從哪裡得到這個主意？」你問一名士兵。「他讀過特洛伊木馬的故事嗎？」那名維利斯塔聳聳肩。「我們的將軍滿腦子計謀。他是軍事天才！我從沒聽過你說的那匹馬——但維拉將軍是在馬背上出生的。如果這匹馬存在，他一定會知道。」也許未必——你記得維拉還不識字。他大概不知道古希臘的故事。每到一站，維拉就把手槍抵在列車長太陽穴上，讓這個小個子男人顫抖著發電報報告你們的進度。夜幕降臨時，列車駛入華雷斯。「你們一半人今晚當士兵，突襲聯邦軍駐地，」維拉命令。「其餘的人為革命募捐。去華雷斯的每一家賭場和賭博廳，拿走每一塊披索、每一塊美元！然後我要為我的北方軍買槍枝和補給！」部隊歡呼，然後散開去執行任務。維拉退到一節私人車廂裡計劃下一場戰役。僅僅幾個小時後，他的手下跌跌撞撞跑回來報告勝利，並把一袋袋錢倒在他腳邊。看來今晚每個人都在幫維拉的忙！你覺得自己沒什麼能額外貢獻、脫穎而出的。你沒有……", "options": [{"label": "繼續故事", "to": 68}], "illustration": false}, {"id": 68, "bookPage": 53, "text": "……槍，所以你想搶賭場可能會有麻煩。你得在之後的時間裡想辦法從維拉那裡贏得獎賞。", "options": [{"label": "跳到 1914 年的托雷翁（Torreón）。", "to": 77}], "illustration": false}, {"id": 69, "bookPage": 54, "text": "你翻遍維拉桌上的東西。一定有什麼可以讓你帶到十年後，向醫生證明維拉信任過你。突然門口傳來聲響。是安東尼奧！「住手！小偷！」他喊道。你可以聽到火車外奔跑的腳步聲。「我就知道你有問題，」安東尼奧說。「你是間諜！」他吐出這個詞，像吐出一顆西瓜籽。兩名士兵衝進車廂，把你的手綁在背後。「把這個間諜帶出去，和我們抓到的聯邦軍官一起槍斃，」其中一人命令。「但我不是間諜！」你堅持。第二名士兵粗暴地把你推出車廂。「當然！」他說。「也許我們該把你綁在這位『小子』（El Niño）的砲口前。」他拍了拍架在平板車上的一門大砲。他笑著催促你往前走，然後把你帶到一個荒涼的鐵路調車場，幾名制服皺巴巴的聯邦軍官排在一支行刑隊前。「這裡還有一個，」那名士兵說著，隨手把你推進隊伍裡。「準備！」行刑隊隊長命令。你緊閉雙眼。「瞄準！」你祈禱著。你應該在所有人面前跳躍嗎？「等等！」一個熟悉的聲音說。是維拉將軍！「這個人是……", "options": [{"label": "繼續故事", "to": 70}], "illustration": false}, {"id": 70, "bookPage": 55, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 71}], "illustration": true}, {"id": 71, "bookPage": 56, "text": "……信差，不是間諜。」他向一名士兵點頭，士兵解開你的手。你鬆了一口氣，冒出一身汗。「謝、謝謝你，」你勉強咕噥道。「你在奇瓦瓦救了我免於被處決，」維拉說，「現在我也救了你。我們扯平了！」他輕笑。「我的手下奉命稍微偏離目標，繞道前往首都。我們必須橫向移動，拿下科阿韋拉州（Coahuila）的首府薩爾蒂約。第一首領卡蘭薩也許是個白痴，但我們會照他的話做——暫時如此！何不加入我的部隊？」「是，長官！」你說。安東尼奧跑過調車場。「抱歉我以為你是間諜！」他喘著氣說。「現在你可以和我並肩作戰了！你想看處決嗎？」你已經受夠了行刑隊。「不了，謝謝！」你告訴安東尼奧。「我們準備下一場戰鬥吧！」", "options": [{"label": "跟安東尼奧走。", "to": 62}], "illustration": false}, {"id": 72, "bookPage": 57, "text": "你在墨西哥某城市一條寬闊的林蔭大道上。但歡呼的人群太擁擠，你不確定是哪座城市。「戰爭結束了！」你旁邊的男人喊道。「革命？」你問。「脫離法國獨立的戰爭！這是歷史上最偉大的一天！」「呃，今天是什麼日子？」你問。「1867 年 7 月 15 日！」他喊道。「全墨西哥城都會記住這一天！」墨西哥城？「華雷斯怎麼了？」你脫口問道。「華雷斯？」那人說。「他來了。華雷斯總統萬歲！」他拍了拍你的背。「華雷斯已經讓法國皇帝馬克西米利安（Maximilian）受審並槍決。現在華雷斯回來了。」你謝過那人，擠過歡欣鼓舞的人群。看來你跳到了華雷斯總統的時代，而不是以他命名的城市：埃爾西烏達德華雷斯！你偏離目標將近五十年！", "options": [{"label": "跳到 1913 年的埃爾西烏達德華雷斯。", "to": 66}], "illustration": false}, {"id": 73, "bookPage": 58, "text": "你沿著埃爾帕索的大街匆匆走向那家飯店。一個穿著燈籠褲、揮著報紙的男孩沿著木製人行道跑來。「號外！號外！」他喊道。「墨西哥新總統遇刺！韋爾塔奪取墨西哥城！快來看！」「發生了什麼事？」你抓住男孩的肩膀問。「弗朗西斯科·馬德羅——維拉將軍協助上台的那個人！他被槍殺了！出現了新的獨裁政權！」他停下來喘氣。「這肯定會再次點燃革命！」你衝上街，跑進飯店。你必須告訴維拉這個消息！你的眼睛花了一會兒才適應昏暗的光線。這家飯店相當破舊。「維拉將軍的房間在哪裡？」你問。一個戴著金屬框眼鏡、袖子上綁著袖帶的飯店職員幾乎沒把視線從報紙上移開。「樓梯頂端第二扇門，」他回答。你兩步併一步上樓，舉起拳頭敲門。門打開一條縫——一把手槍的槍口對準你的臉。然後手槍放下，門打開了。「是我在奇瓦瓦的年輕朋友，」維拉說著用手梳了梳未整理的捲髮。他看起來疲憊，但很高興見到你。房間凌亂，你驚訝地看到窗邊堆著幾個鴿籠。「那天你確實救了我一命！」他繼續說。「我得告訴你我是怎麼越獄的——靠偽裝！一頂圓頂禮帽、一件……」", "options": [{"label": "繼續故事", "to": 74}], "illustration": false}, {"id": 74, "bookPage": 59, "text": "……西班牙斗篷……」「我這次帶來的消息不太好，」你說。「我是來警告你的。」維拉示意你坐在床上，你告訴他有關冒牌貨的事。然後他坐到你身旁，一隻手臂搭在你肩上。你注意到他戴著黑臂章。「謝謝你，」他悲傷地嘆了口氣說。「在這個黑暗的日子裡，我需要所有能得到的友誼。」「那麼你知道馬德羅總統的事了？」他慢慢點頭。「我願意付出一切去幫他。他承諾自由選舉和給窮人土地。現在所有那些夢想……都消失了。維拉必須再次戰鬥。」「我能幫忙嗎？」他指向五斗櫃。「拿紙和線來。」你在雜物中翻找，把他要的東西拿來。他全神貫注地在一小片紙上寫了一則訊息。「美國人嘲笑我，」他說。「他們以為我養鴿子是要吃牠們。」他從籠子裡取出一隻白鳥，把紙綁在鳥腿上。然後他打開窗戶，讓鴿子拍翅飛走。「她會把我的計劃告訴該知道的人，」他說。「我要越過埃爾西烏達德華雷斯，召集一支軍隊，奪取托雷翁的鐵路樞紐！當我們控制鐵路，就能控制墨西哥！」「現在你必須走了，」他說，「因為我有很多事要做。我必須處理這個冒牌貨，還得籌錢買彈藥和補給。但我想給你點東西，謝謝你的幫助。」他拿起一個鴿籠。裡面只有一隻雪白的鳥。「她是個寶貝，」維拉說。「你可以訓練她！」「我很感激你的禮物，」你說。「現在我想把她捐給你的事業。你比我更能照顧和使用她。」維拉大方地收回那隻鳥。你在這裡幫不上更多忙了，但至少他似乎信任你。你決定之後再與他的軍隊會合。他說他要去哪裡？", "options": [{"label": "繼續故事", "to": 75}], "illustration": false}, {"id": 75, "bookPage": 60, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 76}], "illustration": true}, {"id": 76, "bookPage": 61, "text": "他說他要去哪裡？", "options": [{"label": "跳到華雷斯。", "to": 72}, {"label": "跳到托雷翁。", "to": 77}], "illustration": false}, {"id": 77, "bookPage": 62, "text": "現在是 1914 年 4 月。你在托雷翁的火車站。鐵軌向四面八方延伸，像巨輪的輻條。「維拉萬歲！」一群旁觀者歡呼。一列火車噗噗地駛進來。車上擠滿了士兵！他們佈滿車頂，抓著側面的梯子，一邊揮手一邊朝空中鳴槍慶祝勝利。你也看到車上有女人，一邊肩膀掛著步槍，另一邊用披肩揹著嬰兒。火車頭噴著氣停下。貨車門哐噹打開，士兵們從跳板上湧下來，用擔架抬著傷患。「這不是很棒嗎？」有人問你。一個男孩站在你旁邊，咧嘴笑著，露出缺了門牙的縫。他臉頰上有一道傷口，手臂吊在吊帶裡。「好一場戰鬥！」「我——我不在場，」你說。男孩懷疑地看著你。然後他驕傲地挺起胸膛。「我是個大英雄——所有炸藥搬運工裡最勇敢的！我直接衝進聯邦軍的機槍火網！我的手臂就是這樣中彈的。」你不確定這聽起來是勇敢還是魯莽。但你沒問。「不痛嗎？」你改口問。「才不！我是安東尼奧·德爾加多！什麼都傷不了我！」「維拉將軍的軍隊確實壯大了，」你說。「他太傑出了！」男孩回答。「一年前他帶著八個人離開埃爾帕索，現在他有超過一萬人！他控制了整個奇瓦瓦州，現在又拿下了托雷翁。很快我們就會拿下首都，結束戰爭！」", "options": [{"label": "繼續故事", "to": 78}], "illustration": false}, {"id": 78, "bookPage": 63, "text": "「將軍在哪裡？」你問。「在他的私人車廂裡，」安東尼奧指著火車頭後面的車廂說。「門口有多拉多守衛的那節。多拉多是維拉的私人榮譽衛隊。這個名字意思是『金色勇士』。但我覺得維拉心情不好。他和革命軍統帥第一首領卡蘭薩有麻煩。維拉必須服從卡蘭薩的命令——等我們贏得革命，第一首領就會成為墨西哥總統！」你沿著鐵軌走向維拉的車廂。一名戴著金色臂章的士兵守著門。他一定是多拉多！也許你可以問問他是怎麼當上的。但就在你走到入口時，維拉將軍本人跺著腳走下金屬階梯。「那個白痴卡蘭薩！」他咆哮。「我請他切斷聯邦軍的增援部隊，他什麼都不做！他像塊石頭一樣坐在奇瓦瓦城，安全得很。是我讓那裡安全的！我征服了整個奇瓦瓦！如果他不動，我們怎麼進攻首都？要是我知道他在搞什麼就好了！」維拉抓住守衛的手臂。「跟我來！」他命令。「我要去檢查補給，鼓勵傷患。」兩人從你身旁走過，連看都沒看一眼。看來安東尼奧說得對——將軍心情不好。你決定在他的車廂裡等他。你登上階梯，發現自己身處一間舒適的辦公室。窗上有窗簾，車廂一端是一張大木桌，上面堆滿文件。你還看到桌上有幾樣東西——一個鎮紙和維拉的帽子。還有維拉發給卡蘭薩的電報副本——請求援助的電報。如果你能告訴維拉卡蘭薩在計劃什麼，也許能從他那裡贏得獎賞。也許你應該跳到奇瓦瓦城。或者，桌上也許有什麼東西可以帶給醫生！那不算禮物——但十年後那還重要嗎？", "options": [{"label": "繼續故事", "to": 79}], "illustration": false}, {"id": 79, "bookPage": 64, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "找一件維拉的東西帶給醫生。", "to": 69}, {"label": "跳到奇瓦瓦城監視卡蘭薩。", "to": 88}], "illustration": true}, {"id": 80, "bookPage": 65, "text": "現在是 1913 年 2 月底。你在德州埃爾帕索的大街上。這是個塵土飛揚的小鎮。在漂亮門面後面，大多數建築都是簡陋小屋或草皮屋。遠處可以聽到圍欄裡長角牛的低鳴和噴氣聲。兩個穿燈籠褲的男孩和一個穿印花及踝連衣裙的女孩正用棍子滾鐵環。和你最近見到的墨西哥孩子相比，他們顯得異常無憂無慮。一個頭髮梳得油亮的理髮師靠在他的糖果條紋理髮柱旁。當地理髮師應該是八卦的好來源！「潘喬·維拉在鎮上嗎？」你問他。他吐了口菸草汁，汁液呈弧形噴過街道。「躲在飯店裡，」理髮師說，停下來又吐了一口。「他不會在酒館——你知道，他不喝酒。這個時間，他大概在鬥他的雞。」他朝一棟歪斜的土磚建築點了點頭。你走進那棟昏暗、煙霧瀰漫的建築。男人們穿著從牛仔皮套褲到蘇格蘭呢西裝的各種衣服，擠在一個用鐵絲網圍起來的小鬥雞場周圍。裡面兩隻公雞昂首闊步，互相繞圈。突然，隨著公雞攻擊，鬥雞場變成一陣尖叫、咯咯聲、飛舞的羽毛和血滴的旋風。你幾乎看不下去。旁觀者爆出歡呼，一陣鈔票轉手。「大紅雞一美元！」有人喊。「黑白雞兩美元！」", "options": [{"label": "繼續故事", "to": 81}], "illustration": false}, {"id": 81, "bookPage": 66, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 82}], "illustration": true}, {"id": 82, "bookPage": 67, "text": "房間對面，一個穿卡其褲的敦實男人把一隻公雞抱在胸前，一邊抽雪茄一邊漫不經心地撫摸著鳥。他的臉被寬邊帽遮住，但你能看見他下垂的鬍子。「那是潘喬·維拉嗎？」你問一個戴著東部人常戴的圓頂禮帽的男人。「看起來確實像他。」那人欽佩地望向房間對面。「他們說他幾乎憑一己之力推翻了墨西哥獨裁政權。而且他還是鬥雞冠軍！」你擠過人群走向維拉。「維拉將軍？」「也許吧，」他咕噥。「你想要什麼？」「我只是想，呃，打個招呼，看看有沒有什麼能為你效勞的。」那人用靴跟碾熄雪茄，從一瓶啤酒裡喝了最後一口。他把空瓶子遞給你。「新一場鬥雞要開始了，」他粗聲說。然後他把公雞塞進你懷裡。公雞尖叫掙扎。「把我的鳥放進場裡。」「是……長官！」你熱切地說，一邊手忙腳亂地應付不安分的公雞和空啤酒瓶。你把公雞放進圍欄裡，找地方丟瓶子。但等等——你記得潘喬·維拉不喝酒。而且說起來，你也從沒見過他抽雪茄！這個人一定是假扮維拉，好在鬥雞中獲得更好的賠率！也許真正的維拉將軍會獎賞你，如果你告訴他發生了什麼事。但你應該在鬥雞結束前離開嗎？還是留在鬥雞場監視那個冒牌貨？", "options": [{"label": "去維拉住的飯店找他。", "to": 73}, {"label": "留在鬥雞場。", "to": 50}], "illustration": false}, {"id": 83, "bookPage": 68, "text": "你跳回維拉的私人車廂，坐下來等將軍。他衝進車廂，揮著一份電報。「那個白痴卡蘭薩！」他喊道。「現在他要我去薩爾蒂約！」他看到你時猛地停住。「你想要什麼？」「我剛從奇瓦瓦城來，」你說。「我無意中聽到第一首領卡蘭薩的計劃。還有更多——他打算讓奧布雷貢將軍拿下墨西哥城。」「除非我先到那裡，」維拉說。「我們要進軍薩爾蒂約，然後拿下首都！你跟我們一起嗎？」「是，長官！」你說。「雖然你給我帶來了壞消息，但你做得很好，我的年輕間諜，」維拉說。他把手伸進一個帶金屬把手的大木箱。「我有東西給你。」終於！這會是你一直盼望的禮物嗎？維拉從箱子裡拿出一盒香草冰淇淋。是個冰盒！「吃點吧！」他說。「我一直留著。這是我們穿越沙漠去薩爾蒂約之前，你能吃到的最後一份冷食。」這不是你想要的東西，而且因為墨西哥的炎熱已經融成湯狀，但冰淇淋味道不錯。「謝謝！」你對將軍說。維拉正忙著大口吃，你離開車廂時他點了點頭。你應該去薩爾蒂約作戰嗎？也許如果你勇敢，能贏得獎賞。還是你應該往前跳到首都？維拉肯定很快就會到那裡！", "options": [{"label": "繼續故事", "to": 84}], "illustration": false}, {"id": 84, "bookPage": 69, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "加入維拉的軍隊，隨他們進軍薩爾蒂約。", "to": 62}, {"label": "往前跳到墨西哥城。", "to": 89}], "illustration": true}, {"id": 85, "bookPage": 70, "text": "你在阿瓜斯卡連特斯鎮——意為「熱水」——一條兩旁商店和攤位林立的街上。現在是 1914 年 10 月下旬。街對面，一個看起來面熟的男孩正朝你揮手。是安東尼奧！他高興地喊了一聲，朝你跑來。突然你聽到一陣轟鳴，地面開始震動。「小心！」安東尼奧說。一連串騎馬的人奔馳而過，他們的金色臂章在陽光下閃閃發亮。「是多拉多！」安東尼奧虔敬地說。「維拉的私人騎兵！」你趕緊讓開。「我怎麼才能成為其中一員？」你問。但安東尼奧只是笑著扯了扯你的袖子。「來吧，」他說。「會議要開始了！維拉、薩帕塔和奧布雷貢在莫雷洛斯劇院開會。也許革命會徹底結束！」你跟安東尼奧從劇院後門進去，躲在牆上紅色天鵝絨帷幕後面。從簾子後面偷看，你能看到舞台上設了一個講台。劇院裡座無虛席。維拉坐在前排，身邊全是他的多拉多保鑣。他的頭髮梳得服貼，制服筆挺。他雙手交疊放在肚子上，微笑著。「那是埃米利亞諾·薩帕塔！」安東尼奧指著低聲說。「他是薩波特克印第安人（Zapotec Indian），他的軍隊橫掃了南方！」薩帕塔被他的手下圍著，大多數人穿著白色農民服裝。你發現奧布雷貢將軍站在講台後面。他濃黑的……", "options": [{"label": "繼續故事", "to": 86}], "illustration": false}, {"id": 86, "bookPage": 71, "text": "……眉毛似乎從他蒼白的臉上跳動，他皺眉凝神。「請維拉將軍上前好嗎？」他問。維拉大步走上舞台。奧布雷貢把一枚勳章別在這位土匪的襯衫上。維利斯塔用卡賓槍敲擊地板以示掌聲。「謝謝你的勳章，」維拉說。然後他的臉沉了下來。「但我們維利斯塔真正想要的是給人民土地！」「我們也是！」薩帕塔派尖叫。「把我們的土地還回來！」奧布雷貢舉手要求安靜。「首先，成立新政府，」他說。「然後再談土地。」「卡蘭薩為什麼不在這裡？」有人喊。「他為什麼逮捕維利斯塔和薩帕塔派？革命結束了，我們要舉行選舉。他必須下台，讓我們投票選新總統。」「如果維拉將軍也同意辭職，卡蘭薩就會下台，」卡蘭薩（的訊息）說。「卡蘭薩一離職，我就辭去指揮權，」維拉喊道。房間裡爆出爭論聲。「也許我們兩個應該同時開槍自盡，」維拉諷刺地建議。「那樣就能解決一切！」「奧布雷貢和卡蘭薩派去死！」有人喊。一聲槍響從觀眾席爆出，打中劇院天花板。「維利斯塔和薩帕塔派狗去死！」現在你四周的手槍都朝空中開火。「夠了，」你聽到維拉嘟囔著從你身旁衝向後門。「這意味著戰爭，」奧布雷貢在講台上說。「我將率領卡蘭薩的軍隊對抗潘喬·維拉！」「又要打更多仗了，」安東尼奧說著從你身旁擠過，更多槍聲響起。「也許你終究有機會成為多拉多！」他跟著維拉溜出後門。你正要跟上。突然一槍打中你頭頂上方的牆。天鵝絨帷幕落下，把你砸倒在地。它很重，你試圖掙脫。但呼吸困難。而且……", "options": [{"label": "繼續故事", "to": 87}], "illustration": false}, {"id": 87, "bookPage": 72, "text": "……人們正朝門口跑。你會被人踩踏！跳！", "options": [{"label": "跳躍脫困", "to": 91}], "illustration": false}, {"id": 88, "bookPage": 73, "text": "你在奇瓦瓦城一棟宅邸裡空無一人的樓梯間。樓下，庭院裡的噴泉潺潺作響。樓梯頂端，你可以看到鋪著地毯的走廊和幾扇華麗的門。其中一扇門砰地打開，一個神色匆忙的男人倒退著走進走廊。「是，卡蘭薩先生，」他說著匆匆走向樓梯。你躲到樓梯平台上一棵盆栽棕櫚樹後面，直到他匆匆走過。然後你悄悄上樓，從門口窺看。一位留著長白鬍子的老人坐在一張優雅的桌子旁。他身邊圍著助手。是第一首領卡蘭薩！「維拉不會喜歡這樣，」一名助手說。「去他的維拉！」卡蘭薩喊道。「他會照我的話做，從托雷翁轉往薩爾蒂約。我不想讓他得到拿下墨西哥城的榮耀。他會變得太受歡迎。奧布雷貢將軍將拿下首都。命令已經發出！」討論繼續，但如果你想第一個告訴維拉卡蘭薩的計劃，最好趕快跳回他身邊。", "options": [{"label": "跳回托雷翁的維拉身邊。", "to": 83}], "illustration": false}, {"id": 89, "bookPage": 74, "text": "現在是 1914 年 8 月。你在墨西哥城一條寬闊林蔭大道旁的棕櫚樹後。你加入擠滿街道的歡呼人群。有遊行要來了！「萬歲！」人們喊道。「革命結束了！」「怎麼回事？」你問一個旁觀的年輕人，他留著細細的鬍子。從他袖子上的粉筆灰，你猜他是小學老師。「是阿爾瓦羅·奧布雷貢（Alvaro Obregón）將軍，率領他的部隊。他已為第一首領卡蘭薩拿下首都，」那人說。他嘆了口氣。「卡蘭薩幾天後就會到。我猜他會成為我們的新總統。」「戰鬥結束了，你不高興嗎？」你問。「也許現在是結束了，」那人輕聲回答。「但弗朗西斯科·維拉仍然統治北方，埃米利亞諾·薩帕塔統治南方，而他們兩人都看不上卡蘭薩。我希望他們能在阿瓜斯卡連特斯解決分歧。你聽說過革命勢力的大會嗎？」「哦——呃，是的！」你回答。「希望一切順利！」你擠過人群，來到人行道邊緣。遊行隊伍正在經過。最前面是一位英俊的男人，留著深色短髮和濃眉。他的制服一塵不染，鬍子和鬢角修剪整齊。「奧布雷貢萬歲！」人群喊道。這就是奧布雷貢。他整潔的外表與維拉不羈的捲髮和皺巴巴的外套形成鮮明對比。", "options": [{"label": "繼續故事", "to": 90}], "illustration": false}, {"id": 90, "bookPage": 75, "text": "「維拉將軍今天本該在這裡的，」你耳邊傳來一個輕柔的聲音。又是那個小學老師。「維拉贏得了所有戰役。而且他每攻下一座城鎮，總會建學校！」「我想他會同意你的話，」你若有所思地說。但維拉不在這裡，卡蘭薩已經得逞了。「卡蘭薩萬歲！」站在你旁邊的女人喊道。她正盯著你和老師！「如果我再聽到這種話，我就去舉報你們！」她威脅道。「卡蘭薩總統正在逮捕薩帕塔派和維利斯塔！」你最好離開首都，去阿瓜斯卡連特斯會議找維拉。", "options": [{"label": "跳到阿瓜斯卡連特斯。", "to": 85}], "illustration": false}, {"id": 91, "bookPage": 76, "text": "現在是 1915 年初夏。你在萊昂鎮外起伏山丘間的一片麥田裡。但你周圍正進行著一場戰鬥，綠色田野迅速被鮮血染紅。轟！一顆手榴彈在你左邊爆炸，把泥塊拋向空中。一架低飛的飛機在戰場上灑下子彈。飛機被擊中了！正在墜落！你跳進麥田裡縱橫交錯的眾多戰壕之一。戰壕裡擠滿了士兵，全都因炎熱和戰鬥壓力而汗流浹背。戰壕底部積著水和爛泥。會咬人的綠頭蒼蠅在傷患周圍嗡嗡作響。一個癱倒在你旁邊的男人戴著多拉多臂章。你正要跟他說話，卻發現他已經死了。你驚恐地退開，沿著戰壕前進。士兵們瘋狂地開槍，向看不見的敵人投擲手榴彈。但你認得他們的制服。這些是奧布雷貢將軍的人！「騎兵衝鋒！」一名士兵尖叫。「維拉的多拉多又來了！」一匹馬躍過戰壕頂端。騎手是一名多拉多，牙齒間咬著一顆手榴彈。他要拔掉保險銷，把它丟進你們的戰壕！奧布雷貢的一名手下用刺刀鉤住馬的韁繩。馬尖叫著把騎手甩進一圈鐵絲網中。轟！手榴彈爆炸！你感覺自己像被困在地震中。泥石流把你和戰壕其餘部分隔開。你蜷縮在戰壕洞底……", "options": [{"label": "繼續故事", "to": 92}], "illustration": false}, {"id": 92, "bookPage": 77, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 93}], "illustration": true}, {"id": 93, "bookPage": 78, "text": "……用雙臂抱住頭。你要怎麼離開這裡去找維拉？也許你最好跳躍。咻——！一顆砲彈呼嘯而來，在飛濺的水和爛泥中爆炸。煙霧散去後，你看到泥裡躺著一個蜷縮的人影。你把他拖進戰壕。是奧布雷貢將軍——他的右臂在手肘處被炸斷了！你抓住他，努力讓他的頭不浸在泥裡。他臉色慘白，痛苦地呻吟。「我的手臂！」他喃喃道，驚恐地盯著從血肉中突出的參差骨頭。「我來幫你，將軍，」你說著撕開他破爛的襯衫。「你會撐過去的。」你用一根棍子卡住結，在他上臂綁上止血帶。他的呼吸粗重。「這一切殺戮……」他喘著氣說。「毫無價值。」「我去找人幫忙，將軍，」你說。你從戰壕邊緣窺看。又一波維利斯塔衝鋒，遭到聯邦軍機槍掃射。士兵們尖叫著倒下，到處都是。你差點尖叫出聲，因為你感覺一隻瘦骨嶙峋的手抓住你的腳踝。奧布雷貢用他完好的手抓住了你。「別讓維拉的人抓到我。」他咬緊牙關忍住痛苦。「我們會輸掉戰爭。」「但你留在這裡會死的！」「開槍打我，」他懇求著，顫抖的手裡握著一把小手槍。不，你想著，往後縮。「動手！」他充滿痛苦的眼睛懇求你。「拜託！這是把小槍，」他懇求。「士兵的勇氣越大，他的槍就越小。你看，我是個……勇敢的人。現在你……也必須……勇敢。」「我做不到！」你低聲說。「你不明白嗎？我做不到！」「那我自己來。反正……都會失血而死。」他閉上眼睛，把槍管抵在太陽穴上。你驚恐地看著。你應該違抗任務命令，干預歷史，阻止一場自殺嗎？還是應該任他聽天由命，去找維拉？", "options": [{"label": "繼續故事", "to": 94}], "illustration": false}, {"id": 94, "bookPage": 79, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "奪下槍，阻止自殺。", "to": 100}, {"label": "離開奧布雷貢，尋找維拉。", "to": 102}], "illustration": true}, {"id": 95, "bookPage": 80, "text": "你和安東尼奧從薩爾蒂約鎮公所跑出來。「維拉想要蘆筍！」他低聲說。「那是他最愛的食物！」「我知道哪裡能找到！」你說。「你炸過的那家店！」回到那家店，一袋袋穀物散落一地，一罐罐水果和蔬菜被砸碎。鎮民們警惕地看著你們。「進來吧！」安東尼奧對他們喊。「我們不會像聯邦軍那樣囤積食物！」他們的眼睛亮了起來，開始收集食物。「維拉將軍說，革命期間餓死的人比被子彈打死的人還多，」安東尼奧解釋。你在廢墟中翻找。突然安東尼奧叫道：「啊哈！」他遞給你一個罐子。「拿去獻給維拉，」他告訴你。「但這是你找到的！」「我在戰場上贏得維拉的青睞，」安東尼奧吹噓。你謝過他，朝鎮公所走去。維拉看到蘆筍時咧嘴笑了。「你值得獎賞！」他說。他遞給你一根蘆筍尖。這可很難拿去帕拉爾跟醫生換面具！", "options": [{"label": "往前跳三個月，到墨西哥城。", "to": 89}], "illustration": false}, {"id": 96, "bookPage": 81, "text": "你回到奇瓦瓦州的帕拉爾。現在是 1915 年 11 月 2 日。似乎正在舉行某種節慶。旗幟、緞帶和紙糊燈籠在深橙色夕陽下的暖風中舞動。但你在墓園裡！攤位上的鎮民正在賣骷髏餅乾和糖骷髏。戴著多拉多臂章的維利斯塔和家人一起在墳墓間漫步。許多人正在墳丘和墓碑上擺設餐桌。你發現安東尼奧一手拿著步槍，一手拿著巧克力骷髏。他的眼神已失去熱切。那是見過失敗和太多死亡的眼神。「怎麼回事？」你問。「是節日，」安東尼奧解釋。「亡靈節（Day of the Dead），我們在這一天與祖先在他們的安息之地共餐。」維拉在家族之間走動；他閒聊著，從不同的盤子裡取食。「聰明吧？」安東尼奧說。「這樣他就能防止被下毒。只要卡蘭薩還是總統，他就得格外小心。」維拉正在對一群追隨者講話，其中一些是多拉多。你和安東尼奧走過去聽。「儘管最近遭遇挫折，我們打得很好，」維拉說。「但美國人顯然是晴天朋友！奧布雷貢兩次擊敗我們，他們的伍德羅·威爾遜（Woodrow Wilson）總統就停止賣槍給我們了！」人群憤怒地低聲附和。", "options": [{"label": "繼續故事", "to": 97}], "illustration": false}, {"id": 97, "bookPage": 82, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 98}], "illustration": true}, {"id": 98, "bookPage": 83, "text": "「革命軍都想要同樣的東西，」維拉繼續說。「我們要給人民土地、更好的教育、更好的生活方式。我們唯一的分歧是卡蘭薩的領導。」人群發出噓聲。「所以我決定停止戰鬥，回到山裡，」維拉說。「我只帶幾名忠誠的多拉多。你們其餘的人可以回歸平民生活。你們有些人可能會和卡蘭薩的聯邦軍起衝突。如果你們寧願流亡美國，我會幫你們。就這樣，我的朋友們。再見！」他穿過人群朝你走來。人群爆出歡呼。「維拉萬歲！」他們喊道。要是你是多拉多就好了！那樣你就能跟維拉一起進山。將軍看到你盯著一名多拉多的金色臂章。「你希望自己有一個嗎？」他拍了拍自己的金色臂章問你。「但願不會再有戰鬥。那樣你就不需要它了。但你幫了我大忙。也許你該去美國避避風頭。」他把手伸進口袋。「給你，我的年輕朋友，」他說著遞給你一疊鈔票。「拿著這些錢去美國。這是我自己的印鈔廠印的！」「謝謝，將軍，」維拉轉向另一名追隨者時你說。你用拇指翻著那疊奇怪的鈔票。帕拉爾的醫生會接受這些作為你與維拉友誼的證明嗎？畢竟，這錢是他自己工廠印的！或者你也許該聽維拉的建議，跳到美國。上次維拉上山，他在邊境以北待了很久！", "options": [{"label": "繼續故事", "to": 99}], "illustration": false}, {"id": 99, "bookPage": 84, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "往前跳到 1923 年，去找醫生。", "to": 107}, {"label": "往前跳四個月，到美墨邊境。", "to": 104}], "illustration": true}, {"id": 100, "bookPage": 85, "text": "你抓住槍，從奧布雷貢的手指間撬開。但奧布雷貢抓住你的手，把槍扭轉到直接對準自己的臉。他的拇指放在扳機上！咔嗒。手槍沒有擊發。奧布雷貢以驚人的力氣從你手中奪過槍，把武器抵在頭上再試一次。咔嗒。他盯著槍看了一秒。然後他的眼睛翻白，昏了過去。「將軍？將軍！」你爬到戰壕頂端。士兵們四處奔跑。傷患在爛泥中爬行，懇求幫助。兩名戴白臂章的醫護兵抬著一副擔架。「這邊！」你大喊。但他們把別人抬上擔架運走了。沒有救援！將軍快死了！你滑回戰壕，把奧布雷貢翻成趴姿。然後你憋住氣，潛入爛泥中。你扭動身體鑽到他下方，讓他以消防員扛人的方式橫在你背上。你手指插進泥岸，開始爬行。奧布雷貢癱軟的身體重得難以置信。「槍……」他喃喃道。你從眼角餘光看到槍從他手中滑落。「我的副官……昨晚……擦過它。」他喉嚨裡發出令人毛骨悚然的咯咯聲。奧布雷貢在笑！「他一定是……忘了……裝子彈。」你拖著自己和重擔爬出戰壕。步槍火力……", "options": [{"label": "繼續故事", "to": 101}], "illustration": false}, {"id": 101, "bookPage": 86, "text": "……在你頭頂呼嘯。維利斯塔被奧布雷貢的騎兵追擊，正在遠處撤退。醫護兵發現了你，跑了過來。他們把奧布雷貢抬上擔架。「你們贏了，將軍！」他們說。「維利斯塔正在逃跑！維拉將軍被打敗了，正撤回奇瓦瓦！」「感謝上帝，」奧布雷貢說，聲音漸弱成耳語。「現在也許這場瘋狂的戰爭會結束。」他的眼皮顫動著閉上。「他會沒事的，」一名醫護兵告訴你。「你今天救了一位偉人。他醒來後會想感謝你。你要跟我們一起走嗎？」這個邀請很誘人，但你是時候去找維拉了。他輸了一場重要戰役，肯定不高興。也許你能做點什麼安慰他。別告訴他你救了他敵人的命！", "options": [{"label": "跳到墨西哥北部。", "to": 96}], "illustration": false}, {"id": 102, "bookPage": 87, "text": "你決定去找維拉。也許如果你能告訴他敵人死了，他會高興，並給你獎賞。你背對奧布雷貢，開始爬出戰壕。奧布雷貢把槍抵在頭上。但你就是不能讓他這麼做！你滑回戰壕。咔嗒。奧布雷貢扣動扳機。手槍沒有擊發。咔嗒。他又試了一次，徒勞無功，當你從他手中奪過槍時，他昏了過去。他喉嚨裡發出絕望的喘息聲。令你驚恐的是，你發現奧布雷貢在笑！「我的副官……昨晚……擦過我的槍，」他嗆著說。「但他沒有……沒有裝子彈。」你扔掉槍，爬到戰壕頂端。步槍子彈仍從你頭頂呼嘯而過。但在遠處，你可以看到維拉的軍隊正在撤退。一名死去的多拉多躺在你腳邊。你很受誘惑想偷走他的臂章。但如果被奧布雷貢的人發現你帶著它，你會被抓為俘虜或槍斃。你發現一名聯邦軍官帶著兩名抬著空擔架的醫護兵。他們在倒下的屍體間擇路而行，尋找傷患。他們誰也沒抬。「這邊！」你拼命揮手。「奧布雷貢將軍受傷了！」那些人跑過來。「我們贏了！」其中一人喊道。「告訴將軍，維拉正一路撤回奇瓦瓦！」", "options": [{"label": "繼續故事", "to": 103}], "illustration": false}, {"id": 103, "bookPage": 88, "text": "但你決定自己做得夠多了。如果維拉聽說你救了他頭號敵人的命，他也許永遠不會給你獎賞！你滑進另一條戰壕，跳躍。", "options": [{"label": "去奇瓦瓦找維拉。", "to": 96}], "illustration": false}, {"id": 104, "bookPage": 89, "text": "現在是 1916 年 3 月 9 日凌晨四點。你在新墨西哥州哥倫布（Columbus）空無一人的大街上，想著該往前跳幾個小時，還是等人們醒來。你不用想太久。突然一陣雷鳴般的聲響，一隊騎馬的突襲者沿著黑暗的街道奔馳而來。「嘿——哈！」其中一人喊著，朝空中開槍。「維拉萬歲！」另一人喊著，用步槍槍托砸碎商店櫥窗。是維利斯塔！美國士兵——有些還穿著長內衣——從鎮盡頭的駐地衝出來。潘喬·維拉在哪裡？你沿街奔跑。每個屋頂都傳來步槍射擊聲。維利斯塔勒馬人立，瘋狂開火。轟——！地面震動，然後猛地撞向你。一個汽油桶在一棟大建築附近爆炸了。一定是被流彈擊中。一個招牌在你眼前浮動：商業飯店（Commercial Hotel）。你瞇著眼，試圖聚焦視線。你仰躺在街道中央。火焰從飯店窗戶竄出。穿著睡衣的婦女和兒童在人行道上尖叫。但她們的尖叫在你耳中漸漸遠去成嗡嗡聲，火焰也漸漸變成一片漆黑……濕意觸碰你的額頭。你皺眉坐起身。你躺在一張羽毛床上。", "options": [{"label": "繼續故事", "to": 105}], "illustration": false}, {"id": 105, "bookPage": 90, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 106}], "illustration": true}, {"id": 106, "bookPage": 91, "text": "「別急。你有輕微腦震盪。」一個女人把一條涼濕的布放在你額頭上。「而且有人扒了你的口袋。」你檢查了一下。維拉給你的錢不見了。你望向窗外。鎮子在遠處燃燒。「是維利斯塔？」你說。「為什麼？」「沒有人真正知道為什麼，」女人回答。「甚至沒人確定維拉本人是否在這裡。鎮上一半的人發誓他們看見了他，另一半則確信是別人。但突襲者肯定是維利斯塔。也許他們想要第十三騎兵駐地的槍枝和補給。也許維拉氣美國支持卡蘭薩。誰知道呢？」「他們去哪了？」你問。「他們往南逃了。我丈夫法蘭克·湯普金斯少校（Major Frank Tompkins）正在集合他的排，要追維拉進入墨西哥。但是非法的——沒有墨西哥政府的許可。我希望他們找到維拉，把他絞死！」她望著燃燒的鎮子，淚水緩緩從臉頰滑落。「我也在找維拉，」你告訴湯普金斯太太。「其餘的駐軍天亮時出發，與埃爾帕索駐軍會合，」她說。「由潘興將軍（General Pershing）指揮。『黑傑克』潘興。他堅韌如釘，狡猾如狐。威爾遜總統一定會命令他進入墨西哥——而且是得到卡蘭薩許可的，我敢打賭！如果我丈夫找不到維拉，潘興也會找到——而且會有人把他絞死！」你需要盡快找到維拉！但你該跟誰一起南下？", "options": [{"label": "加入湯普金斯少校的排。", "to": 112}, {"label": "往前跳，加入潘興的部隊。", "to": 122}], "illustration": false}, {"id": 107, "bookPage": 92, "text": "你回到帕拉爾伊達爾戈飯店那間煙霧瀰漫、昏暗的酒館。現在是 1923 年。醫生背對著你，正匆匆離去。「等等！」你說。「我有東西可以換面具。是潘喬·維拉親手給我的！」你拿出那疊鈔票。「呸！」醫生說。「革命鈔票一文不值——來去如風。每個經過這裡的將軍和軍隊都印錢。連帕拉爾最窮的家庭都有成箱這種東西。別拿你在哪裡都弄得到的東西來煩我。」看來你在這裡浪費時間。你最好回到任務上。維拉應該在美墨邊境附近某處。", "options": [{"label": "往回跳七年，到美國邊境。", "to": 104}], "illustration": false}, {"id": 108, "bookPage": 93, "text": "你認為卡車比馬快，於是把你的馬換給潘興將軍的一名士兵，換取他在一輛滿是灰塵的道奇卡車上的座位。「祝你好運！」他說著牽走你的馬。「你會需要的！」當你在後座坐定時，卡車車隊已準備出發。駕駛旁邊是一位方下巴的中尉。他掛著珍珠手柄的左輪手槍。「我叫喬治·巴頓（George Patton），」他粗聲說。「你是向導？」你點頭，研究他遞給你的地圖和圖表。「喜歡我的槍嗎？」巴頓問。「我在 1912 年瑞典斯德哥爾摩奧運會上用過它們。」「真的？你參加什麼項目？」「五項全能——每樣都會一點。越野跑、馬術、游泳、擊劍和手槍射擊。不過沒得名。其他大多數人都用特製手槍。既然我是軍人，我就用有朝一日可能救我一命的槍！」他咧嘴一笑，拍了拍其中一把左輪手槍。五天來，卡車在奇瓦瓦的荒原上顛簸噴氣。你被灰塵和廢氣嗆得難受。士兵們花在修輪胎上的時間比趕路還多。車隊前進時，是一英里又一英里緩慢而艱難的跋涉。這樣下去你永遠找不到維拉！一聲槍響！又一聲！巴頓閃電般拔出手槍。然後他大笑出聲。你後面的卡車在回火。它發出可怕的噪音，猛地停了下來。車隊停下維修。你和巴頓以及另外兩……", "options": [{"label": "繼續故事", "to": 109}], "illustration": false}, {"id": 109, "bookPage": 94, "text": "……輛卡車繼續前進，偵察沙漠。在遠處，你發現一座坐落在兩座山丘之間的破敗牧場。「最好去看看能不能買些玉米，」巴頓說。他讓引擎繼續運轉，走過沙地。突然三個墨西哥人從山上奔馳而下。他們開著手槍。「美國侵略者去死！」他們喊道。其中一人戴著多拉多臂章！也許你能讓他們帶上你，帶你去見維拉！「嘿！」你揮著手臂大喊。「住手！」射擊仍在繼續。「趴下！」巴頓對你大喊。他快速拔槍射擊。一名騎手向後旋轉，從馬鞍上摔下。他帶馬刺的靴子卡在馬鐙裡，被馬拖著在塵土中飛奔。另外兩名維利斯塔離不到十英尺，槍直接對準巴頓。砰！砰！另外兩輛卡車上的士兵向維利斯塔開火。兩人都從人立的馬上摔下。戴多拉多臂章的人繼續瘋狂開火，即使巴頓舉槍準備再射他。然後那名多拉多癱倒在地，槍戰結束。巴頓的手下歡呼。你移開視線。巴頓和幾名士兵檢查牧場房子，看是否有人躲藏。「看起來維拉來過這裡，」他回來報告。「但他早就走了，而且沒有食物。我猜這些傢伙是後衛。」他把三名維利斯塔的屍體綁在卡車引擎蓋上。他們看起來像狩獵戰利品。你打了個寒顫。「等我們回到車隊，我要建議放棄卡車，」巴頓繼續說。「它們太慢了。這樣我們永遠追不上維拉。」你也追不上——而且你不確定自己想跟這些傢伙再待多久。你最好換個交通工具。", "options": [{"label": "繼續故事", "to": 110}], "illustration": false}, {"id": 110, "bookPage": 95, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 111}], "illustration": true}, {"id": 111, "bookPage": 96, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "給馬備鞍。", "to": 122}], "illustration": true}, {"id": 112, "bookPage": 97, "text": "你謝過湯普金斯太太，從舒適的床上起來，前往軍營找湯普金斯少校。你在忙碌的堡壘裡找到他，他正對一群士官發號施令。「我想加入搜捕潘喬·維拉的行動，」你告訴他。少校笑了。「你就是突襲中被擊昏的那個孩子？謝謝你的好意，但這是受過訓練計程車兵的工作。」「但我去過邊境另一邊，我知道維拉長什麼樣，」你堅持。「我可以當向導。」「嗯，那也許有用，」湯普金斯少校承認。「這裡沒人真正見過他。好吧，你可以跟我騎馬。我們要越過邊境與潘興將軍會合。」你跟湯普金斯少校的部隊騎了六天。沒有維拉的蹤影。但部隊因炎熱而筋疲力盡，還受到維利斯塔狙擊手火力騷擾。士兵們只談論找到潘喬·維拉——好把他絞死！如果你能先警告維拉，一定能贏得他的好感。但你得小心別讓美國士兵發現你的任務！終於，部隊在墨西哥北部一個荒涼的鐵路調車場勒馬停下。你看到遠處升起一柱灰塵。「是潘興將軍！」湯普金斯少校說。灰塵柱越來越大。不久，兩列美國騎兵騎了上來。他們身後是兩百輛軍用卡車的轟鳴。那位精瘦、因長期騎馬而堅韌的將軍騎到少校面前……", "options": [{"label": "繼續故事", "to": 113}], "illustration": false}, {"id": 113, "bookPage": 98, "text": "……湯普金斯少校面前。少校利落地行禮。「那個惡棍維拉毫無蹤影，」將軍回禮說。「而且卡蘭薩總統說他不希望美國軍隊踏上墨西哥土地。他說他會處理維拉，還說我們在這裡是非法的。」你周圍計程車兵低聲抱怨。「哼，我說我們既然來了，就要留下！」潘興繼續說。「那個土匪維拉不能襲擊邊境以北的城鎮還逍遙法外！」士兵們歡呼。「但我們得依靠馬和卡車，別想用墨西哥的火車了。」你想盡快趕到維拉那裡。你該加入哪一隊？", "options": [{"label": "搭卡車。", "to": 108}, {"label": "騎馬。", "to": 122}], "illustration": false}, {"id": 114, "bookPage": 99, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 115}], "illustration": true}, {"id": 115, "bookPage": 100, "text": "現在是 1917 年。你站在墨西哥城奧布雷貢將軍的總部外。一名警衛發現了你。「嘿！」他喊道。「你在這裡做什麼？」然後他停了一下，好像認出了你。而你也認出了他——他是萊昂戰場上奧布雷貢受傷時的一名醫護兵。「我認識你，」他說。「你就是救了將軍一命的孩子！你確實沒怎麼變。來領獎賞的？」他把你領進奧布雷貢的辦公室。將軍正把菸草敲進菸斗裡。這對他來說很困難；他的右臂沒了。「我代表維拉將軍而來，」你說。「他為國家征戰多年。他希望戰爭結束。」「我也是，」奧布雷貢說。他點燃菸斗，吹熄火柴。然後他用菸斗末端指向你。「我欠你一份情，因為你在萊昂救了我的命，」他說。「而且卡蘭薩總統對維拉不公。但我將在 1920 年的下一次選舉中與卡蘭薩競選總統。我不希望潘喬·維拉成為我的敵人。」「告訴維拉將軍，如果他想繼續戰鬥，我也奉陪。但如果他想放下武器，那麼也許所有墨西哥人能團結成一個民族共同努力。我們都需要彼此。」「謝謝你，將軍，」你說。「願和平與你同在。」「還有一件事，」奧布雷貢說。「告訴維拉將軍，選舉後我會給他一個驚喜！」", "options": [{"label": "繼續故事", "to": 116}], "illustration": false}, {"id": 116, "bookPage": 101, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 117}], "illustration": true}, {"id": 117, "bookPage": 102, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "選舉後去找維拉。", "to": 129}], "illustration": true}, {"id": 118, "bookPage": 103, "text": "你回到帳篷，努力抵抗睡意。風呼嘯著。你打開帳篷門簾往外看。冰冷、盤旋、呼嘯的白色撲打著你。你抓起兩條毯子，衝進暴風雪中。沙子和雪鑽進你的臉，刺痛你的眼睛。山艾樹叢翻滾而過。帳篷開始像巨大的蝙蝠一樣拍打著要被吹走——這給了你一個救援的靈感！你偷偷溜到安東尼奧的帳篷，鬆開固定前端的營釘。帳篷被撕向空中時，你可以看到安東尼奧蜷縮在後面。兩名驚慌的守衛跑到帳篷前面，從外面重新固定營釘。你趴在帳篷後方底下爬進去，抓住安東尼奧的肩膀。「是我！」你低聲說，解開他的手。「這裡有條毯子——我們得飛！」你們兩個從帳篷後方蠕動出去。然後，裹在融入夜色的灰色羊毛毯裡，你們消失在暴風雪中。「所以你真的是間諜！」安東尼奧驚嘆地說。「那就來吧——維拉在山裡。他受傷了。」你和安東尼奧與刺骨的暴風雪搏鬥，深入山區。你冷得再也感覺不到手指和腳趾。終於，你爬上一道崎嶇的斜坡，來到花崗岩露頭下的一個洞穴。維拉躺在裡面，顫抖發燒，滿身大汗。一個裹著黑披肩的女人俯身照料他。", "options": [{"label": "繼續故事", "to": 119}], "illustration": false}, {"id": 119, "bookPage": 104, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 120}], "illustration": true}, {"id": 120, "bookPage": 105, "text": "「他的腿被卡蘭薩派打傷了，」她說。「這是他唯一一次受傷。來吧。你可以幫我換繃帶。」維拉睜開眼睛，因疼痛而突出。女人揭開血淋淋的繃帶時，他抓住你的袖子。「美國遠征軍要撤了，」你告訴他。「你不再被追捕了。」「你是個好小間諜，」他喘著氣說。你不得不把臉轉開。傷口看起來很生，你擔心已經感染了。「去——去首都，」維拉說。「告訴奧布雷貢將軍，讓卡蘭薩別再找我麻煩。如果他放下武器，我也會放下。替我辦成這件事，我就讓你成為多拉多。」多拉多！你的任務幾乎完成了！你知道自己不該改變歷史。但如果你能在維拉被槍殺前找到奧布雷貢，不是很好嗎？也許你可以稍微提早一點抵達首都……", "options": [{"label": "往回跳到墨西哥城。", "to": 121}, {"label": "往前跳到墨西哥城。", "to": 115}], "illustration": false}, {"id": 121, "bookPage": 106, "text": "你站在十字架山（Monte de las Cruces）上，俯瞰墨西哥城。沒有人注意到你的出現——你被八萬名正向首都進軍的印第安農民包圍！他們拿著棍棒、刀子和生鏽的步槍及農具。「瓜達露佩聖母（Virgin of Guadalupe）會保護我，」你旁邊的印第安人說。「還有伊達爾戈神父（Father Hidalgo）曾向我灑聖水。子彈會從我身上彈開！」「我妻子織我的寬邊帽時一直在祈禱，」另一個人說。「我要把它蓋在西班牙大砲的砲管上，讓它不能發射！」西班牙？「很快我們就會脫離西班牙獨立，」第三個人說。「起義神父伊達爾戈萬歲，墨西哥之父！」「今年是哪一年？」你問。「當然是 1810 年。保皇派去死！」看來戰鬥是一樣的，但你跳得太久遠了。墨西哥甚至還沒擺脫西班牙統治。總之，你早該知道不能干預歷史。維拉注定要受傷。", "options": [{"label": "跳到 1917 年的墨西哥城。", "to": 115}], "illustration": false}, {"id": 122, "bookPage": 107, "text": "你已經跟著潘興將軍的騎兵騎了好幾週，尋找潘喬·維拉的蹤跡。你一直靠乾玉米和墨西哥豆維生，腿上滿是鞍瘡。你的衣服爬滿跳蚤。但你不能脫掉衣服，因為你凍得要命！前方又一座山隱約出現。你嘆了口氣。又要翻越一個山口。部隊勒馬停下。「下——馬！」士兵們從馬上下來，但他們奉命不准坐下。如果讓他們休息哪怕一分鐘，這些男人就會陷入疲憊的沉睡。為了保持清醒，你欣賞風景。你在一個寬闊平坦的台地頂上，覆著一層白雪。你高高俯瞰著點綴著牛群的紫色平原。這是搭帳篷睡覺的完美地點！潘興集合部隊。「就是這樣，弟兄們，」他宣布。「維拉從我們指縫中溜走了。威爾遜總統命令我們返回埃爾帕索。我們今晚在這裡紮營，早上北上。去把最後的牛宰了當晚餐吧。」你幫士兵們搭帳篷、建立營地。晚餐結果是兩頭瘦削的長角牛。士兵們宰牛，在臨時營火上烤肉。你吃的時候，風開始呼嘯。更多雪花盤旋落下。「偵察隊回來了，將軍，」一名哨兵報告。筋疲力盡的偵察兵催著他們飢餓的坐騎前進……", "options": [{"label": "繼續故事", "to": 123}], "illustration": false}, {"id": 123, "bookPage": 108, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 124}], "illustration": true}, {"id": 124, "bookPage": 109, "text": "……穿過越來越深的雪。一個穿著破爛羊皮背心的年輕墨西哥人被繩子綁著，跌跌撞撞地跟在後面。他因寒冷和疲憊而憔悴蒼白，用狂野、充滿恐懼的眼睛看著你。是安東尼奧·德爾加多！一名偵察兵把安東尼奧推倒在你們營火旁的地上。「抓到這個維利斯塔在一個牧場討飯。」你抓起一個水壺，不經意地跪在囚犯旁邊。安東尼奧喝了一口水，然後吐回你臉上。「叛徒！」他嘶聲說。然後他看著俘虜他的人。「潘喬·維拉死了！」他喊道。「他被卡蘭薩派的子彈打死了。他死了！」士兵們把他拖進一個帳篷，把他綁在裡面。維拉真的死了嗎？現在才 1917 年冬天！安東尼奧一定在說謊——而且他一定知道去哪裡找維拉！你得幫他逃脫！", "options": [{"label": "等到晚上，放走安東尼奧。", "to": 118}], "illustration": false}, {"id": 125, "bookPage": 110, "text": "醫生背對著你。他正在打開酒館後面儲藏室地板上的活板門。「等等！」你說。「我是多拉多。」你給他看你的臂章。「那就來吧，」醫生低聲說。「我剛才沒注意到。快！外面有聯邦軍官。」你跟著他穿過活板門，沿著粗糙的木階梯走進黑暗。他點燃一根蠟燭。你身處一個磚砌地窖。腳步聲在你頭頂上方砰砰作響。軍官們正在搜查儲藏室！「他們在這裡找不到我們，」醫生低聲說。「但他們絕不能看見你和我在一起。他們已經懷疑我在做面具。奧布雷貢總統的任期結束了。新政府害怕人民會再次開戰。面具必須藏起來！」「但我怎麼把它帶出去？」「我們把你偽裝成戰爭中最貧窮的孤兒。拿著面具。」他把石膏死亡面具遞給你。是維拉的面容。你在手中翻轉它。面具內側沾著維拉的血跡，一些頭髮黏在石膏裡。「把它貼在你背上，襯衫底下，」醫生指示。「你必須彎著腰走，好像背駝了一樣。用這根棍子當拐杖。」他遞給你一塊躺在地板上的裂木片。「把面具交給奧托·諾德瓦爾德，」醫生繼續說。「他是維拉的朋友，支持過他的運動。」樓上的噪音平息了。酒館裡的吉他彈著一首敘事曲。你像老農民一樣走著，溜出酒館……", "options": [{"label": "繼續故事", "to": 126}], "illustration": false}, {"id": 126, "bookPage": 111, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 127}], "illustration": true}, {"id": 127, "bookPage": 112, "text": "……穿過街道，來到諾德瓦爾德的雜貨店。面具是你背上隆起的鼓包。「可憐的孩子，」奧托·諾德瓦爾德從門廊上看到你說。「戰爭讓你流落街頭乞討，是吧？進來吃點東西。」你跛行進店裡。沒有顧客。大家都在街對面的伊達爾戈飯店。然後你僵住了。兩名士兵正把醫生從飯店裡拖出來。第三個人搜查那個黑色醫療包。他厭惡地把包扔到地上，示意其他人放開醫生。「我的背，」你低聲對諾德瓦爾德先生說。「維拉的死亡面具藏在我襯衫底下。你必須把它藏起來！」你從襯衫下取下面具、直起身時，諾德瓦爾德驚訝地睜大眼睛。「快給我，」他說，「在聯邦軍士兵來找它之前！我有一個保險箱。」你跟著他到店後面，看著潘喬·維拉的死亡面具被藏起來——在奧托·諾德瓦爾德的保險箱裡。但在你的任務完成之前，你最好確定它是安全的。", "options": [{"label": "跳到你自己的時代，墨西哥奇瓦瓦。", "to": 131}], "illustration": false}, {"id": 128, "bookPage": 113, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 129}], "illustration": true}, {"id": 129, "bookPage": 114, "text": "你在卡努蒂約莊園外，維拉的莊園。現在是 1920 年。房子很長，白色，紅瓦屋頂。似乎正在舉行某種儀式。你加入一群聚集在房子入口附近露台上歡呼的多拉多。你正好及時看到奧布雷貢總統和潘喬·維拉，他倆被一簾紫色九重葛框在門口。他們正握手——用左手。看來你的訊息奏效了。「我們可以為墨西哥做很多事，而不必讓國家被不信任和流血撕裂，」奧布雷貢莊重地說。「你給了潘喬·維拉不戰鬥的好理由。」「如果能用一座牧場讓你和你的追隨者滿意，那代價很小。」奧布雷貢向維拉和多拉多行禮，然後騎上他的帕洛米諾馬離去。維拉張開雙臂。「看哪，朋友們！一棟房子、穀倉和一萬二千英畝土地！當我們小時候在別人的土地上勞作時，誰能想像這一切？」「這就是我們奮鬥的目標，我們這些為好土地和自由選舉的夢想獻出鮮血和生命的人。對我們來說，戰爭結束了。對我們的許多同志來說，它結束得更早。他們不應被遺忘。」「維拉萬歲！」呼聲響起。連最強悍的多拉多也熱淚盈眶。「作為軍隊將軍，我還有一項最後的職責要履行……」", "options": [{"label": "繼續故事", "to": 130}], "illustration": false}, {"id": 130, "bookPage": 115, "text": "「……北方軍。」他示意你上前。「給你，我的年輕間諜。」他把一個金色臂章套上你的手臂，然後摘下他的寬邊帽。「多羅特奧·阿蘭戈·弗朗西斯科·潘喬·維拉將軍在此正式承認你為多拉多。」人們歡呼、鼓掌，朝空中開槍。男人們拿出吉他，女人們端來咖啡和一盤辣椒，裡面塞著白醬、紅籽和綠葉。盤子兩端各插著一面墨西哥國旗——紅、白、綠。你終於成為多拉多了！但你沒有時間享受慶典。你還有一件事要做。派對開始時，你悄悄溜走。", "options": [{"label": "跳到伊達爾戈飯店的醫生那裡。", "to": 125}], "illustration": false}, {"id": 131, "bookPage": 116, "text": "你站在奇瓦瓦革命博物館（Museo de la Revolución）一間寬敞的庭院房間裡。白色灰泥牆上有彩繪邊飾，墨西哥瓷磚地板，看起來明亮歡快。你認出其中一件展品。那是維拉遇刺當天駕駛的彈痕累累的道奇敞篷車。而在一個展示櫃裡——明星展品——是潘喬·維拉的死亡面具。光滑的石膏呈幽靈般的白色。你凝視著那張熟悉的面孔。你陷入沉思。「真的很了不起，不是嗎？」一名博物館警衛說。「現在我們永遠知道他真正長什麼樣了。」「他們是怎麼找到它的？」你問。「你聽說過它失蹤了？」警衛說。「說來話長！要不是一位美術老師翻遍拉德福學校（Radford School）的壁櫥，他們永遠找不到它！誰能想到，一個奇瓦瓦的商人會把那個面具藏到一九三〇年代，然後送給他女兒在埃爾帕索的學校？他叫諾德瓦爾德。他們說他是維拉的朋友。現在它回到了好人家。你是本地人嗎？」「呃，算是吧，」你咧嘴笑著回答。這回輪到警衛若有所思了。「你知道嗎，我每次看那個面具，都忍不住感謝潘喬·維拉為他的信仰而戰，」他告訴你。「這正好說明一個人能帶來多大的不同。而他的記憶就活在這個面具裡。」", "options": [{"label": "繼續故事", "to": 132}], "illustration": false}, {"id": 132, "bookPage": 117, "text": "（原書插圖頁）\n\n故事在此頁以插圖呈現，按「繼續」接續原書情節。", "options": [{"label": "繼續故事", "to": 133}], "illustration": true}, {"id": 133, "bookPage": 118, "text": "「幸好他們找到了它，」你說。「這幾乎讓人覺得自己認識他！維拉萬歲！」「維拉萬歲！」警衛同意。「革命萬歲！」\n\n任務完成。", "options": [], "illustration": false}];
const byId=Object.fromEntries(SCENES.map(s=>[s.id,s]));
const STORAGE_KEY='tm19_deathmask_save_v1';
const ITEM_DEFS=[['peasant','農民服裝','初始裝備'],['armband','Dorado 金色臂章','Villa 授予'],['mask','Villa 死亡面具','醫生交付'],['cane','偽裝手杖','醫生交付'],['safe','面具已存入保險箱','Nordwald 保管']];
let state={current:16,visited:[],history:[],items:['peasant'],achievements:[],sound:false,started:Date.now()};
const $=id=>document.getElementById(id);
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function beep(){if(!state.sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=620;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.08);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08);o.onended=()=>c.close()}catch(e){}}
function addItem(id){if(!state.items.includes(id)){state.items.push(id);toast('取得物品：'+(ITEM_DEFS.find(x=>x[0]===id)?.[1]||id))}}
function award(id,title){if(!state.achievements.includes(id)){state.achievements.push(id);toast('成就解鎖：'+title)}}
function sceneEra(id){return '故事節點｜依原書選項跳躍'}
function renderText(text){const el=$('storyText');el.innerHTML='';const parts=text.split(/\n\n+/);let full='';let done=false;const pEls=parts.map(t=>{const p=document.createElement('p');el.appendChild(p);return [p,t]});let pi=0,ci=0;function tick(){if(done)return;if(pi>=pEls.length){done=true;return}const [p,t]=pEls[pi];p.textContent=t.slice(0,ci+1);ci++;if(ci>=t.length){pi++;ci=0}else{requestAnimationFrame(tick);return}if(pi<pEls.length)requestAnimationFrame(tick)};tick();el.onclick=()=>{if(done)return;done=true;pEls.forEach(([p,t])=>p.textContent=t)}}
function enter(id,choiceLabel=''){const s=byId[id];if(!s){toast('找不到故事頁：'+id);return}state.current=id;if(!state.visited.includes(id))state.visited.push(id);state.history.push({id,label:choiceLabel||('抵達原書第 '+s.bookPage+' 頁'),at:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});if(id===130){addItem('armband');award('dorado','正式成為 Dorado')}if(id===125){addItem('mask');addItem('cane');if(!state.items.includes('armband'))toast('提醒：此段劇情需要 Dorado 臂章作為身分證明。')}if(id===127){addItem('safe');award('maskSafe','面具已安全保管')}if(id===133){award('mission','任務完成')}render();}
function render(){const s=byId[state.current];$('pageLabel').textContent='原書第 '+s.bookPage+' 頁';$('eraLabel').textContent=sceneEra(s.id);$('sceneTitle').textContent=s.id===133?'MISSION COMPLETED':(s.illustration?'原書插圖頁':'故事進行中');$('scene').classList.remove('scene');void $('scene').offsetWidth;$('scene').classList.add('scene');renderText(s.text);const c=$('choices');c.innerHTML='';s.options.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const label=document.createElement('span');label.textContent=o.label;b.append(n,label);b.onclick=()=>{beep();enter(o.to,o.label)};c.appendChild(b)});$('progressText').textContent=state.visited.length+' / 118';$('progressBar').style.width=(state.visited.length/118*100)+'%';$('yearText').textContent='原書第 '+s.bookPage+' 頁';$('achievementText').textContent=state.achievements.length;$('items').innerHTML='';ITEM_DEFS.forEach(([id,name,desc])=>{const el=document.createElement('span');el.className='item'+(state.items.includes(id)?' on':'');el.textContent=(state.items.includes(id)?'◆ ':'◇ ')+name;el.title=desc;$('items').appendChild(el)});$('timeline').innerHTML='';state.history.slice(-30).reverse().forEach(h=>{const d=document.createElement('div');const b=document.createElement('b');b.textContent='第 '+(h.id-15)+' 頁 ';d.append(b,document.createTextNode(h.label+' · '+h.at));$('timeline').appendChild(d)});if(!state.history.length)$('timeline').textContent='尚未開始旅程。';}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));toast('旅程已儲存。')}catch(e){toast('無法儲存，請檢查瀏覽器儲存設定。')}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw){toast('找不到儲存紀錄。');return}const v=JSON.parse(raw);if(!byId[v.current])throw Error();state={...state,...v};render();toast('已讀取旅程。')}catch(e){toast('讀取失敗，儲存檔可能已損毀。')}}
function showModal(kind){let content='';if(kind==='help'){content=`<h2>任務與時間旅行規則</h2><p><b>任務：</b>找到 Pancho Villa 的死亡面具，並確保它安全存放。</p><ol><li>不得殺害任何人或動物。</li><li>不得改變歷史，也不可把未來物品留在過去。</li><li>跳躍時間時不得帶走任何人，避免讓旁人起疑。</li><li>只能選擇時間機器提供的選項。</li></ol><p><b>操作：</b>閱讀故事後選擇下方選項。沒有分支的頁面會顯示「繼續故事」。點擊故事文字可立即顯示完整段落。可使用儲存／讀取保存進度。</p><p><b>重要物品：</b>Dorado 臂章是醫生辨認你曾受 Villa 信任的證明；死亡面具與手杖用於偽裝運送；面具交給 Nordwald 後仍須回到現代確認其安全。</p><p><b>版本說明：</b>原書只有一個明確的任務完成結局；原文沒有明確列出獨立的失敗結局，因此本遊戲不自行添加虛構結局。</p><hr><h2>資料庫｜原書 Data Bank</h2><ol><li>墨西哥先後受阿茲特克帝國、西班牙統治；1821 年獨立，法國曾於 1864–1867 年介入，Porfirio Díaz 統治 35 年。</li><li>1910 年土地、自然資源、工業與鐵路多由少數人或外國勢力掌握，農民普遍貧困。</li><li>Díaz 於 1911 年被推翻，由 Francisco Madero 接任，墨西哥革命展開。</li><li>革命訴求包括土地公平分配、公共教育、衛生、醫療、農業機械、道路與乾淨水源。</li><li>Madero 於 1913 年「悲劇十日」後遭暗殺；Huerta 接掌政權，1914 年被 Carranza 推翻；Carranza 於 1920 年遇害。</li><li>Villa 在北方、Obregón 在西北、Zapata 在南方領軍；Zapata 於 1919 年遭暗殺。</li><li>Villa 部隊稱 Villistas；Zapata 部隊稱 Zapatistas；政府軍稱 Federals；Carranza 的部隊稱 Carrancistas。</li><li>革命歷時多年、權力與同盟多次變動，婦女與兒童也參與戰鬥。</li><li>Villa 本名 Doroteo Arango，少年時在 Durango 的 Rancho del Rio 勞動；生於 1878 年，1923 年 7 月 20 日去世。</li><li>原書描述 Villa 記憶力極佳、不喝酒、很少抽菸，並有多位妻子與子女。</li><li>革命前 Villa 曾是亡命之徒與牛隻竊賊；加入革命軍時從 8 人起步，後擴張至一萬多人；私人騎兵稱 Dorados（金色勇士）。</li><li>戰事常圍繞鐵路樞紐展開；原書指出控制鐵路的軍隊較能控制國家。</li><li>Villa 最終敗於 Obregón；Obregón 於 1920–1924 年任總統，1928 年再次當選後遭暗殺。</li></ol><h2>資料提示｜原書 Data File</h2><p>原書提供 9 個提示索引：第 2 頁（孩子是否會被懷疑是殺手）、第 11 頁（Villa 的出身地）、第 13 頁（「將軍」指誰）、第 17 頁（Villa 本名）、第 27 頁（Zapata 如何死亡）、第 46 頁（1913 年初墨西哥城發生什麼事）、第 84 頁（Villa 自製貨幣在哪裡可能有價值）、第 98 頁（哪種交通工具較適合崎嶇地形）、第 105 頁（是否打算違反時間旅行規則）。</p>`}else if(kind==='history'){content='<h2>旅程紀錄</h2><ol>'+state.history.map(h=>'<li>原書第 '+(h.id-15)+' 頁：'+htmlEscape(h.label)+'</li>').join('')+'</ol>'}else{content='<h2>旅程存檔</h2><p>儲存進度會保留目前頁面、物品、成就與旅程紀錄。</p><button class="primary" onclick="save()">立即儲存</button> <button class="primary" onclick="load()">讀取存檔</button>'}$('modalContent').innerHTML=content;$('modal').classList.add('show')}
function htmlEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('helpBtn').onclick=$('mHelp').onclick=()=>showModal('help');$('saveBtn').onclick=save;$('loadBtn').onclick=load;$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('soundBtn').onclick=()=>{state.sound=!state.sound;$('soundBtn').textContent='音效：'+(state.sound?'開':'關');beep()};$('mSave').onclick=save;$('mLoad').onclick=load;$('mHistory').onclick=()=>showModal('history');
// 桌面快捷鍵：S 儲存、H 說明。
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key.toLowerCase()==='s')save();if(e.key.toLowerCase()==='h')showModal('help')});
enter(16);
</script></body></html>
